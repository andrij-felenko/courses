<text x="380.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Latching Low гарантує, що жоден мікрообрив кабелю не пройде непоміченим для операційної системи</text>
