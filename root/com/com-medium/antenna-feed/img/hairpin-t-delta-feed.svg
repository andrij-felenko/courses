<text x="675.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c05621" text-anchor="middle" font-weight="700">L-подібна схема</text>
<text x="675.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">на клемах вібратора</text>
<text x="675.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Піднімає низький R_A (15 Ом) до 50 Ом</text>
<rect x="20.0" y="345.0" width="780.0" height="45.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="410.0" y="364.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Порівняння: Т-узгоджувач симетричний, Дельта-узгоджувач не має реактивних компонентів,</tspan><tspan x="410.0" dy="14.3">а Бета-узгоджувач (Hairpin) формує L-вузол узгодження за рахунок незначного вкорочення елемента.</tspan></text>
