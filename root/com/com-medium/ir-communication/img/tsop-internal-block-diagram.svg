<text x="770.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">OUT</text>
<text x="765.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(до MCU)</text>
<line x1="225.0" y1="50.0" x2="225.0" y2="110.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="225.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Vs (+3.3V / +5V)</text>
<line x1="515.0" y1="210.0" x2="515.0" y2="290.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="515.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">GND (Земля)</text>
<rect x="20.0" y="315.0" width="800.0" height="50.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="420.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Тракт TSOP повністю автономний: TIA перетворює фотострум у напругу, AGC регулює підсилення,</tspan><tspan x="420.0" dy="14.3">BPF виділяє частоту 38 кГц, а демодулятор видає чистий логічний рівень LOW під час прийому пачки.</tspan></text>
</svg>