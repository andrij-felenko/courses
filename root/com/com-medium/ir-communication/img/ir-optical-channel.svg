<text x="230.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Слабкий сигнал потонув у шумі</text>
<line x1="190.0" y1="225.0" x2="270.0" y2="225.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="230.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Поріг компаратора не спрацьовує</text>
<text x="215.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Результат: неможливість виділити дані на фоні світла</text>
