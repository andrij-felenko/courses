<text x="653.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2980b9" text-anchor="middle" font-weight="700">Сигнал</text>
<text x="625.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Смуговий фільтр Q ≈ 15 відкидає I_dc і 100 Гц</text>
<text x="625.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Детектор обвідної відновлює прямокутний біт</text>
<text x="625.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: стабільний прийом при яскравому сонці</text>
<rect x="20.0" y="335.0" width="800.0" height="65.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="420.0" y="357.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Постійне світло сонця створює постійний фоновий струм фотодіода (DC), а лампи — низькочастотні завади.</tspan><tspan x="420.0" dy="14.3">Передача сигналів пачками піднесучої 36–40 кГц дозволяє смуговому фільтру приймача повністю придушити</tspan><tspan x="420.0" dy="14.3">фонову засвітку та виділити корисний інформаційний імпульс.</tspan></text>
</svg>