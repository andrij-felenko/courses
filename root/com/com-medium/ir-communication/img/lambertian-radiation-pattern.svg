<text x="690.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">m = -ln(2) / ln(cos θ₁/₂)</text>
<rect x="20.0" y="325.0" width="800.0" height="50.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="420.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Лінзовані діоди з малим кутом половинної потужності (θ₁/₂ ≈ ±15..20°) концентрують потік уздовж осі,</tspan><tspan x="420.0" dy="13.0">забезпечуючи дальність понад 10–15 м, тоді як безлінзові світлодіоди дозволяють керувати відбитими променями.</tspan></text>
