<text x="545.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кадр RC-5 (14 бітів): S1 (1) + S2 (1/Cmd5) + Toggle (1) + Адреса (5) + Команда (6)</text>
<text x="545.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Toggle-біт інвертується при кожному новому натисканні клавіші</text>
<text x="410.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Особливість RC-5: фіксований бітовий інтервал 1.778 мс, напрямок перепаду визначає значення біта.</text>
<rect x="20.0" y="385.0" width="800.0" height="35.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="420.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">NEC кодує дані відстанню між імпульсами (PDM), а RC-5 — фазою перепаду в центрі бітового інтервалу (Манчестер).</tspan></text>
