<text x="610.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Контроль цілісності: побітове доповнення (Address ^ ~Address == 0xFF)</text>
