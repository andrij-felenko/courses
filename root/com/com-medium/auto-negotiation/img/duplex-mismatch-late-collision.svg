<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="12.0" width="780.0" height="40.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="37.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Анатомія Duplex Mismatch: виникнення пізніх колізій (Late Collisions)</tspan></text>
<rect x="40.0" y="62.0" width="210.0" height="52.0" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/><text x="145.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Комутатор (Switch)</tspan><tspan x="145.0" dy="14.3">Фіксований: 100M Full-Duplex</tspan><tspan x="145.0" dy="14.3">(CSMA/CD вимкнено)</tspan></text>
<rect x="300.0" y="62.0" width="220.0" height="52.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Кабель Cat5e (100 м)</tspan><tspan x="410.0" dy="14.3">Parallel Detection обрав:</tspan><tspan x="410.0" dy="14.3">100M Half-Duplex для ПК</tspan></text>
<rect x="570.0" y="62.0" width="210.0" height="52.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="675.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Клієнтський ПК (Host)</tspan><tspan x="675.0" dy="14.3">Auto-Neg -&gt; Half-Duplex</tspan><tspan x="675.0" dy="14.3">(CSMA/CD активний!)</tspan></text>
<line x1="145.0" y1="125.0" x2="145.0" y2="330.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="675.0" y1="125.0" x2="675.0" y2="235.0" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="665.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">1. ПК слухає лінію (вільно) і починає передачу</text>
<line x1="665.0" y1="155.0" x2="300.0" y2="190.0" stroke="#b45309" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="485.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Кадр даних (1500 байтів)</text>
<line x1="240.0" y1="200.0" x2="650.0" y2="200.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="655.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">512 бітів (Slot Time)</text>
<text x="145.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">2. Комутатор має Full-Duplex:</text>
<text x="145.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">передає без очікування!</text>
<line x1="145.0" y1="240.0" x2="440.0" y2="268.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="455.0" cy="270.0" r="12.0" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<text x="455.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">💥</text>
<rect x="480.0" y="245.0" width="300.0" height="75.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">3. КОЛІЗІЯ ПІСЛЯ 64 БАЙТІВ!</tspan><tspan x="630.0" dy="13.0">• ПК фіксує Late Collision</tspan><tspan x="630.0" dy="13.0">• Апаратний повтор CSMA/CD скасовано</tspan><tspan x="630.0" dy="13.0">• Кадр відкидається назавжди</tspan><tspan x="630.0" dy="13.0">• TCP падає в Retransmit Timeout</tspan></text>
<rect x="40.0" y="332.0" width="740.0" height="38.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="354.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Наслідок: пінг (&lt; 64 байти) проходить ідеально, а передача файлів (MTU 1500) втрачає до 90% пакетів.</tspan></text>
</svg>