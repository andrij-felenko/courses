<line x1="140.0" y1="235.0" x2="205.0" y2="170.0" stroke="#d35400" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="45.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Більше 10 розсіяних променів</text>
<text x="45.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Рівномірний розподіл фаз</text>
<text x="45.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Середнє складових I, Q = 0</text>
<text x="45.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Типово для міст та кімнат</text>
<text x="45.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="start" font-weight="700">Параметри: m = 1, K = 0</text>
