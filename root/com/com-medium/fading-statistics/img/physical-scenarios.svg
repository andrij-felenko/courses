<text x="455.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">RX</text>
<line x1="321.0" y1="160.0" x2="439.0" y2="160.0" stroke="#27ae60" stroke-width="3.2"/>
