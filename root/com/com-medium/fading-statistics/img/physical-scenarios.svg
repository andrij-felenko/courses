<circle cx="695.0" cy="160.0" r="16.0" fill="#eef3ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="695.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">RX</text>
<circle cx="620.0" cy="150.0" r="25.0" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.4"/>
<text x="620.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2e7d32" text-anchor="middle">Затінення</text>
<line x1="558.0" y1="160.0" x2="595.0" y2="160.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="645.0" y1="160.0" x2="682.0" y2="160.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="525.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Блокування частин променів</text>
<text x="525.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Тимчасове затінення</text>
<text x="525.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Провали частіші за Релей</text>
<text x="525.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Супутники / рухоме авто</text>
<text x="525.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Параметри: m &lt; 1 (до 0.5)</text>
