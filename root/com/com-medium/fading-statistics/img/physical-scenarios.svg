<line x1="315.0" y1="150.0" x2="380.0" y2="95.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="380.0" y1="95.0" x2="445.0" y2="150.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="285.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Панівний прямий сигнал</text>
<text x="285.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Слабкі відбиті копії</text>
<text x="285.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Немає глибоких нулів</text>
<text x="285.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Відкрита місцевість / вежі</text>
<text x="285.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Параметри: K &gt; 0 (до 15 дБ)</text>
