<rect x="70.0" y="290.0" width="640.0" height="116.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="311.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Обидва дроти лежать поруч, тож наведена завада (синфазна, common-mode) сідає</tspan><tspan x="390.0" dy="16.2">на них майже однаково:  A = +s + n,  B = −s + n.  Приймач рахує різницю</tspan><tspan x="390.0" dy="16.2">A − B = (+s + n) − (−s + n) = 2s.  Доданок n входить з однаковим знаком у обидва</tspan><tspan x="390.0" dy="16.2">дроти й при відніманні скорочується дощенту, а корисний сигнал, що стоїть у дротах</tspan><tspan x="390.0" dy="16.2">протифазно, навпаки — подвоюється. Ось чому пара тиха там, де одна лінія</tspan><tspan x="390.0" dy="16.2">вже захлинулася б завадою.</tspan></text>
