<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="385.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Майже всі швидкі й далекобійні лінії — диференційні пари</text>
<text x="200.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Однопровідні (single-ended)</text>
<text x="560.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Диференційні пари</text>
<line x1="385.0" y1="75.0" x2="385.0" y2="360.0" stroke="#d0d4d8" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="110.0" y="83.8" width="180.0" height="32.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="104.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">UART / RS-232</tspan></text>
<text x="200.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">коротко, повільно, проста плата</text>
<rect x="110.0" y="143.8" width="180.0" height="32.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">I²C</tspan></text>
<text x="200.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">у межах плати, кілька пристроїв</text>
<rect x="110.0" y="203.8" width="180.0" height="32.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="224.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">SPI</tspan></text>
<text x="200.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">у межах плати, висока швидкість</text>
<rect x="455.0" y="83.8" width="210.0" height="32.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="104.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">USB (D+ / D−)</tspan></text>
<text x="560.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">периферія, метри кабелю</text>
<rect x="455.0" y="136.8" width="210.0" height="32.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Ethernet (вита пара)</tspan></text>
<text x="560.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">десятки–сотні метрів</text>
<rect x="455.0" y="189.8" width="210.0" height="32.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">CAN (CAN_H / CAN_L)</tspan></text>
<text x="560.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">авто, шум двигуна, шина</text>
<rect x="455.0" y="242.8" width="210.0" height="32.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="263.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">RS-485 (A / B)</tspan></text>
<text x="560.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">сотні метрів, промисловість</text>
<rect x="455.0" y="295.8" width="210.0" height="32.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">LVDS</tspan></text>
<text x="560.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дисплеї, дуже швидкі дані</text>
<text x="200.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">коротко й повільно —</text>
<text x="200.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">одного дроту досить</text>
</svg>