<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<rect width="900" height="330" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На платі: ВЧ-доріжка теж лінія на 50 Ом</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">доріжку від чипа до антени роблять контрольованої ширини над суцільною землею — рівно 50 Ом</text>
<rect x="90.0" y="150.0" width="90.0" height="60.0" rx="5" fill="#2b2b2b" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="135.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">ВЧ-чип</text>
<rect x="180.0" y="172.0" width="380.0" height="16.0" rx="0" fill="#d2a24a" stroke="#9a7320" stroke-width="1.5"/>
<text x="370.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">доріжка 50 Ом (мікросмужка)</text>
<line x1="560.0" y1="180.0" x2="620.0" y2="130.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<text x="630.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">антена 50 Ом</text>
<rect x="90.0" y="215.0" width="600.0" height="14.0" rx="0" fill="#cfcfcf" stroke="#8a8a8a" stroke-width="1"/>
<text x="390.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">суцільний земляний шар (опорна площина)</text>
<rect x="60.0" y="270.0" width="780.0" height="50.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Золоте правило ВЧ: джерело, лінія й антена — усі на одному опорі (50 Ом). Тоді нічого не відбивається.</text>
<text x="450.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А скільки саме відбивається при неузгодженні — міряють коефіцієнтом стійної хвилі (КСХ), це далі.</text>
</svg>
