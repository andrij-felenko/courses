<text x="450.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">V / I хвилі = Z₀</text>
<circle cx="150.0" cy="211.0" r="4.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="168.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Z₀ = √(L/C)</text>
<text x="400.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— залежить від розмірів і діелектрика лінії</text>
<circle cx="150.0" cy="245.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="168.0" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">не залежить від довжини</text>
<text x="400.0" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— хоч метр, хоч кілометр — те саме Z₀</text>
<circle cx="150.0" cy="279.0" r="4.0" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="168.0" y="283.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">це НЕ опір, що гріється</text>
<text x="400.0" y="283.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— енергія проходить крізь, а не втрачається</text>
