<text x="580.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">вита пара в кабелі →</text>
<rect x="70.0" y="250.0" width="640.0" height="178.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Корисний сигнал пари — диференційний, тож трансформатор пропускає його</tspan><tspan x="390.0" dy="15.6">майже без втрат: протифазні струми в обмотці створюють поле, що передається</tspan><tspan x="390.0" dy="15.6">у вторинну. Натомість магнетика дає три речі, потрібні саме на довгому кабелі.</tspan><tspan x="390.0" dy="15.6">Перше — гальванічна розв'язка: між платою і кабелем немає прямого мідного</tspan><tspan x="390.0" dy="15.6">шляху, тож різниця потенціалів земель двох пристроїв (а на сотні метрів вона</tspan><tspan x="390.0" dy="15.6">велика) не тече крізь схему й нічого не палить. Друге — синфазний дросель</tspan><tspan x="390.0" dy="15.6">у складі магнетики додатково тисне спільну заваду, що однаково сидить на</tspan><tspan x="390.0" dy="15.6">обох жилах. Третє — постійна складова не проходить крізь трансформатор,</tspan><tspan x="390.0" dy="15.6">тож зсув земель не зрушує робочу точку приймача. Тому Ethernet терпить</tspan><tspan x="390.0" dy="15.6">і грозові наводки, і десятки метрів між «землями» двох пристроїв.</tspan></text>
</svg>