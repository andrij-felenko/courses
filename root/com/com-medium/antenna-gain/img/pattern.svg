<text x="165.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">бічні</text>
<text x="200.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">задня</text>
<rect x="470.0" y="110.0" width="400.0" height="180.0" rx="10" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="670.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як читати діаграму:</text>
<text x="490.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• що далі «пелюстка» — то сильніший сигнал туди</text>
<text x="490.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• головна пелюстка — головний напрям променя</text>
<text x="490.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• бічні й задня — небажані «витоки»</text>
<text x="490.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• те саме й на прийом (взаємність)</text>
