<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<rect width="900" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підсилення працює на обидва боки лінії</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">за взаємністю спрямована антена додає дБі і на передачі, і на прийомі</text>
<path d="M 120,120 Q 150,170 120,220" fill="none" stroke="#9a9aa0" stroke-width="4"/>
<line x1="120.0" y1="170.0" x2="150.0" y2="170.0" stroke="#9a9aa0" stroke-width="3" stroke-linecap="round"/>
<text x="120.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">TX +15 дБі</text>
<path d="M 150,150 L 750,160 L 750,180 L 150,190 Z" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="450.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вузький промінь — велика дальність</text>
<path d="M 780,120 Q 750,170 780,220" fill="none" stroke="#9a9aa0" stroke-width="4"/>
<line x1="750.0" y1="170.0" x2="780.0" y2="170.0" stroke="#9a9aa0" stroke-width="3" stroke-linecap="round"/>
<text x="780.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">RX +15 дБі</text>
<rect x="60.0" y="270.0" width="780.0" height="44.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У бюджеті лінії: G_tx + G_rx = +15 + 15 = +30 дБ запасу — лише завдяки спрямованим антенам.</text>
<text x="450.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому далекі лінки (супутник, радіорелейка) — це майже завжди тарілки з обох боків.</text>
</svg>
