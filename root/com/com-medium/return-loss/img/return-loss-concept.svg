<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Концепція зворотних втрат (Return Loss) у лінії передачі</text><rect x="30.0" y="80.0" width="130.0" height="80.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="95.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">Джерело ВЧ</tspan><tspan x="95.0" dy="16.9">(Z₀ = 50 Ом)</tspan></text><rect x="200.0" y="105.0" width="340.0" height="30.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Лінія передачі (хвильовий опір Z₀ = 50 Ом)</text><rect x="580.0" y="80.0" width="140.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Навантаження Z_L</tspan><tspan x="650.0" dy="16.9">(Антена / DUT)</tspan><tspan x="650.0" dy="16.9">Z_L ≠ Z₀</tspan></text><line x1="160.0" y1="120.0" x2="200.0" y2="120.0" stroke="#333333" stroke-width="2.0"/><line x1="540.0" y1="120.0" x2="580.0" y2="120.0" stroke="#333333" stroke-width="2.0"/><line x1="220.0" y1="80.0" x2="480.0" y2="80.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/><text x="350.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Падаюча потужність P_inc (ВЧ-сигнал)</text><line x1="480.0" y1="160.0" x2="220.0" y2="160.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="350.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Відбита потужність P_ref (через неузгодження)</text><rect x="30.0" y="215.0" width="340.0" height="125.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Коефіцієнт відбиття за напругою (Γ):</tspan><tspan x="200.0" dy="15.6">Γ = (Z_L − Z₀) / (Z_L + Z₀)</tspan><tspan x="200.0" dy="15.6">|Γ| = √(P_ref / P_inc)</tspan></text><rect x="390.0" y="215.0" width="340.0" height="125.0" rx="6" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="258.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Зворотні втрати (Return Loss, RL):</tspan><tspan x="560.0" dy="15.6">RL = 10 · log₁₀(P_inc / P_ref) [дБ]</tspan><tspan x="560.0" dy="15.6">RL = −20 · log₁₀|Γ| [дБ]</tspan><tspan x="560.0" dy="15.6">Чим вище RL в дБ, тим менше відбиття!</tspan></text>
</svg>