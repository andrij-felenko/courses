<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покращення зворотних втрат за допомогою атенюатора (Буферизація)</text><rect x="30.0" y="80.0" width="130.0" height="75.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="95.0" y="113.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">Передавач</tspan><tspan x="95.0" dy="15.6">(Z₀ = 50 Ом)</tspan></text><line x1="160.0" y1="117.0" x2="240.0" y2="117.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="240.0" y="80.0" width="150.0" height="75.0" rx="6" fill="#fff8e1" stroke="#f39c12" stroke-width="1.5"/><text x="315.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">Атенюатор</tspan><tspan x="315.0" dy="16.9">3 дБ (50 Ом)</tspan></text><line x1="390.0" y1="117.0" x2="470.0" y2="117.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="470.0" y="80.0" width="160.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="550.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Неузгоджене</tspan><tspan x="550.0" dy="15.6">навантаження</tspan><tspan x="550.0" dy="15.6">RL_load = 6 дБ</tspan></text><line x1="170.0" y1="70.0" x2="230.0" y2="70.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><text x="200.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">0 дБ</text><line x1="400.0" y1="70.0" x2="460.0" y2="70.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><text x="430.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">−3 дБ</text><line x1="460.0" y1="165.0" x2="400.0" y2="165.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><text x="430.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">−9 дБ (відб. 6 дБ)</text><line x1="230.0" y1="165.0" x2="170.0" y2="165.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><text x="200.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">−12 дБ (ще −3 дБ)</text><rect x="180.0" y="215.0" width="480.0" height="90.0" rx="6" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="245.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Формула подвійного проходу загасання:</tspan><tspan x="420.0" dy="11.7">RL_вхід = RL_навантаження + 2 · A_ат</tspan><tspan x="420.0" dy="11.7">RL_вхід = 6 дБ + 2 · 3 дБ = 12 дБ (покращення на +6 дБ!)</tspan><tspan x="420.0" dy="11.7">Ціна: прямому сигналу завдається втрата 3 дБ, але зворотне відбиття послаблюється двічі.</tspan></text>
</svg>