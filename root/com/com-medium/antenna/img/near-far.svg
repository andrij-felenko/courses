<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ближнє й дальнє поле: що саме «летить»</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">біля антени енергія ще «хлюпає» туди-сюди; справжня хвиля формується далі — це дальнє поле</text>
<line x1="250.0" y1="120.0" x2="250.0" y2="260.0" stroke="#9a9aa0" stroke-width="5" stroke-linecap="round"/>
<circle cx="250.0" cy="190.0" r="60.0" fill="#fdf3f3" stroke="#c0271e" stroke-width="1.6"/>
<text x="250.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ближнє поле</text>
<text x="250.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(енергія хлюпає, ~&lt; λ/6)</text>
<path d="M 296.5,90.3 A 110.0 110.0 0 0 1 296.5,289.7" fill="none" stroke="#1f47b5" stroke-width="1.6"/>
<path d="M 313.4,54.1 A 150.0 150.0 0 0 1 313.4,325.9" fill="none" stroke="#1f47b5" stroke-width="1.6"/>
<path d="M 330.3,17.8 A 190.0 190.0 0 0 1 330.3,362.2" fill="none" stroke="#1f47b5" stroke-width="1.6"/>
<text x="560.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">дальнє поле — справжня хвиля</text>
<text x="560.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(те, що долітає до приймача)</text>
<rect x="440.0" y="165.0" width="360.0" height="50.0" rx="9" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="620.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корисний радіозв'язок — це завжди</text>
<text x="620.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">дальнє поле антени.</text>
<text x="450.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ближнє поле важливе для розмірів антени й зв'язку «впритул» (NFC), та сигнал у простір несе дальнє.</text>
</svg>
