<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<rect width="920" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Суд 1943 року: що він СПРАВДІ постановив</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">розповсюджений міф проти точного факту — добра нагода звірити джерела</text>
<rect x="50.0" y="86.0" width="400.0" height="220.0" rx="12" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="250.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">МІФ</text>
<text x="250.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«Верховний суд США 1943 року</text>
<text x="250.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">визнав, що радіо винайшов Тесла,</text>
<text x="250.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">а не Марконі.»</text>
<text x="250.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="250.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Так часто пишуть — але це</text>
<text x="250.0" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">спрощення того, що сталося.</text>
<line x1="455.0" y1="196.0" x2="485.0" y2="196.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="490.0" y="86.0" width="400.0" height="220.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="690.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ФАКТ</text>
<text x="690.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Суд скасував ШИРОКИЙ патент</text>
<text x="690.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Марконі — бо те саме раніше</text>
<text x="690.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зробили Stone, Лодж і Тесла.</text>
<text x="690.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="690.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Суд НЕ призначав «винахідника</text>
<text x="690.0" y="261.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">радіо». Спір був про оплату</text>
<text x="690.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">державою патентів часів війни.</text>
</svg>
