<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330">
<rect width="920" height="330" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що лишилось — і чому це веде нас до антен</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">урок про колективність винаходу — і конкретний місток у тему розділу</text>
<rect x="45.0" y="86.0" width="277.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="183.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🌍</text>
<text x="183.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Радіо — колективне</text>
<text x="183.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Жодного одного «винахідника»;</text>
<text x="183.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">визнаймо й забутих — Бозе,</text>
<text x="183.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Попова, Лоджа.</text>
<rect x="335.0" y="86.0" width="277.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="473.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">📡</text>
<text x="473.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Геній Марконі — антена</text>
<text x="473.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Його реальна сила: велика</text>
<text x="473.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">заземлена антена, система й</text>
<text x="473.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">завзяття — дальність.</text>
<rect x="625.0" y="86.0" width="277.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="763.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🔭</text>
<text x="763.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">Іоносфера</text>
<text x="763.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Хвилю «за горб» відбиває шар</text>
<text x="763.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">іонів угорі — його відкрили</text>
<text x="763.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вже після 1901-го.</text>
</svg>
