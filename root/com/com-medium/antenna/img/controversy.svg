<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
<rect width="920" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чесно: чи справді він це почув?</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">славетний дослід 1901 року й досі лишається СПІРНИМ — варто знати чому</text>
<rect x="60.0" y="92.0" width="800.0" height="56.0" rx="9" fill="#fbfbfb" stroke="#b08900" stroke-width="1.5"/>
<text x="92.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🎧</text>
<text x="124.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">Лише він у навушниках</text>
<text x="124.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Жодного незалежного свідка: «S» чув тільки сам Марконі.</text>
<rect x="60.0" y="158.0" width="800.0" height="56.0" rx="9" fill="#fbfbfb" stroke="#b08900" stroke-width="1.5"/>
<text x="92.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">📼</text>
<text x="124.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">Жодного запису</text>
<text x="124.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Нічого не зафіксували — ні приладу, ні протоколу сигналу.</text>
<rect x="60.0" y="224.0" width="800.0" height="56.0" rx="9" fill="#fbfbfb" stroke="#b08900" stroke-width="1.5"/>
<text x="92.0" y="259.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">⚡</text>
<text x="124.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">Можливо, просто шум</text>
<text x="124.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Едісон та інші: це могли бути атмосферні розряди, а не сигнал.</text>
<rect x="60.0" y="290.0" width="800.0" height="56.0" rx="9" fill="#fbfbfb" stroke="#b08900" stroke-width="1.5"/>
<text x="92.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🌍</text>
<text x="124.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">Фізика проти</text>
<text x="124.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Удень на тій хвилі сигнал навряд чи дійшов би — іоносферу ще не знали.</text>
<text x="460.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це не применшує Марконі — лише нагадує: гучна заява потребує доказів. Пізніші передачі (1902+) надійніші.</text>
</svg>
