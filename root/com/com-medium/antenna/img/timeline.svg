<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660">
<rect width="940" height="660" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="470.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як радіо стало далеким — і чому це праця багатьох</text>
<text x="470.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Марконі дотягнув хвилю через океан, але «винайшли радіо» десятки людей у різних країнах</text>
<line x1="300.0" y1="92.0" x2="300.0" y2="636.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="300.0" cy="122.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="278.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1887</text>
<text x="326.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Герц</text>
<text x="326.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Доводить, що електромагнітні хвилі існують (Розділ 39)</text>
<circle cx="300.0" cy="202.7" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="278.0" y="207.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1890</text>
<text x="326.0" y="200.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Бранлі</text>
<text x="326.0" y="220.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Когерер — перший чутливий детектор хвиль (Франція)</text>
<circle cx="300.0" cy="283.3" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="278.0" y="288.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1894</text>
<text x="326.0" y="281.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Бозе й Лодж</text>
<text x="326.0" y="301.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Бозе в Калькутті дзвонить у дзвоник по радіо; Лодж сигналить і вводить настройку</text>
<circle cx="300.0" cy="364.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="278.0" y="369.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1895</text>
<text x="326.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Попов і Марконі</text>
<text x="326.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Попов (7 травня, Росія) — приймач-грозовідмітник; Марконі — перші передачі, заземлена антена</text>
<rect x="292.0" y="436.7" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#b08900" stroke-width="2.6"/>
<text x="278.0" y="449.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1901</text>
<text x="326.0" y="442.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">Марконі: «через Атлантику»</text>
<text x="326.0" y="462.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Чує «S» з Корнуоллу в Ньюфаундленді — гучний, але СПІРНИЙ дослід</text>
<circle cx="300.0" cy="525.3" r="9.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<circle cx="300.0" cy="525.3" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="278.0" y="530.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1909</text>
<text x="326.0" y="523.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Нобель</text>
<text x="326.0" y="543.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Марконі й Braun — за внесок у радіотелеграф (разом!)</text>
<rect x="292.0" y="598.0" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="278.0" y="611.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1943</text>
<text x="326.0" y="604.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Верховний суд США</text>
<text x="326.0" y="624.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Скасовує широкий патент Марконі: раніше були Stone, Лодж, Тесла</text>
</svg>
