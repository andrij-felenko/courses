<rect x="191.2" y="176.8" width="167.6" height="16.5" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/><text x="275.0" y="200.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Виграш ~12 дБ за P_out = 1%</tspan></text>
