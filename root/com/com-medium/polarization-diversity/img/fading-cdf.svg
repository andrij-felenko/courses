<text x="240.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">-20 дБ</text>
<line x1="380.0" y1="285.0" x2="380.0" y2="80.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="380.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">-10 дБ</text>
<line x1="520.0" y1="285.0" x2="520.0" y2="80.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="520.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 дБ</text>
<polyline points="100.0,100.0 240.0,160.0 380.0,220.0 520.0,280.0" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="530.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">1 антена (без diversity)</text>
<polyline points="170.0,100.0 240.0,140.0 310.0,180.0 380.0,220.0 480.0,280.0" fill="none" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="6,3"/>
<text x="430.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">2 антени SC (rho=0)</text>
