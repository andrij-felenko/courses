<text x="90.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">10⁻² = 0.01</text>
<line x1="95.0" y1="100.0" x2="660.0" y2="100.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="90.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">10⁻³ = 0.001</text>
