<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зниження ймовірності обриву зв'язку (Outage Probability)</text>
<line x1="100.0" y1="280.0" x2="680.0" y2="280.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="680.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Пороговий SNR / Середній SNR (дБ)</text>
<line x1="100.0" y1="280.0" x2="100.0" y2="70.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="85.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">P_out</text>
<line x1="95.0" y1="280.0" x2="660.0" y2="280.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="90.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">10⁰ = 1.0</text>
<line x1="95.0" y1="220.0" x2="660.0" y2="220.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="4,4"/>
