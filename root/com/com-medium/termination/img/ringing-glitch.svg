<rect x="50.0" y="390.0" width="720.0" height="75.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/><text x="410.0" y="416.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Небезпека неузгодженої довгої лінії: коли фронт швидший за час подвійного пробігу (t_rise &lt; 2 · t_prop),</tspan><tspan x="410.0" dy="15.0">багаторазові відбиття породжують дзвін (Ringing). Провал напруги перетинає поріг спрацьовування</tspan><tspan x="410.0" dy="15.0">компаратора вдруге — приймач фіксує фальшивий тактовий імпульс (Glitch), руйнуючи передачу даних.</tspan></text>
