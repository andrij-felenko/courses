<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Арсенал проти завмирань</text>
<rect x="24.0" y="105.0" width="168.0" height="150.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.7"/>
<text x="108.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Рознесені антени</text>
<text x="108.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="108.0" dy="0.0">одна в провалі —</tspan><tspan x="108.0" dy="15.9">друга майже напевно ні</tspan><tspan x="108.0" dy="15.9">(провали — що ~6 см)</tspan></text>
<rect x="212.0" y="105.0" width="168.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="296.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">OFDM</text>
<text x="296.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="296.0" dy="0.0">багато вузьких піднесучих:</tspan><tspan x="296.0" dy="15.9">кожна завмирає рівно</tspan><tspan x="296.0" dy="15.9">й легко вирівнюється</tspan></text>
<rect x="400.0" y="105.0" width="168.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="484.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Розширений спектр</text>
<text x="484.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="484.0" dy="0.0">сигнал розкидано:</tspan><tspan x="484.0" dy="15.9">не всі частоти</tspan><tspan x="484.0" dy="15.9">провалюються разом</tspan></text>
<rect x="588.0" y="105.0" width="168.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.7"/>
<text x="672.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Кодування з повтором</text>
<text x="672.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="672.0" dy="0.0">надлишковий код латає</tspan><tspan x="672.0" dy="15.9">поодинокі втрати або</tspan><tspan x="672.0" dy="15.9">просить надіслати ще раз</tspan></text>
<text x="390.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Кожен прийом б'є по слабкому місці завмирань; разом вони роблять радіолінк надійним.</text>
</svg>