<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична площа проти ефективної: тонкий дріт і парабола</text>
<text x="200.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Півхвильовий диполь</text>
<line x1="200.0" y1="110.0" x2="200.0" y2="250.0" stroke="#34495e" stroke-width="4.0"/>
<circle cx="200.0" cy="180.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="200.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Фізична перетинкова площа:</text>
<text x="200.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">A_phys ≈ 0.0005 м² (майже 0)</text>
<circle cx="200.0" cy="180.0" r="65.0" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="200.0" y1="110.0" x2="200.0" y2="250.0" stroke="#34495e" stroke-width="4.0"/>
<circle cx="200.0" cy="180.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="212.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-style="italic">Невидима вирва</text>
<text x="212.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">A_e ≈ 0.13 λ²</text>
<text x="212.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">(на 144 МГц A_e ≈ 0.56 м²)</text>
<line x1="370.0" y1="50.0" x2="370.0" y2="300.0" stroke="#d5dbdb" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="540.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Параболічна тарілка</text>
<rect x="450.0" y="105.0" width="180.0" height="150.0" rx="8" fill="#f4f6f7" stroke="#34495e" stroke-width="2.0"/>
<text x="540.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle" font-weight="700">Фізична апертура A_phys</text>
<text x="540.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">A_phys = π D² / 4</text>
<rect x="470.0" y="170.0" width="140.0" height="70.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="540.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ефективна апертура A_e</text>
<text x="540.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">A_e = η_a · A_phys  (η_a ≈ 55…70%)</text>
<text x="540.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">A_e трохи менша за фізичний розмір</text>
