<text x="140.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">A_e ≈ 8000 см²</text>
<text x="140.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(0.8 м²)</text>
<text x="370.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 ГГц (λ = 10 см)</text>
<circle cx="370.0" cy="170.0" r="35.0" fill="#fef9e7" stroke="#f39c12" stroke-width="2.0"/>
<text x="370.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#f39c12" text-anchor="middle" font-weight="700">A_e ≈ 80 см²</text>
<text x="370.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(0.008 м²)</text>
<text x="600.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">30 ГГц (λ = 1 см)</text>
