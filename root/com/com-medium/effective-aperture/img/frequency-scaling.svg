<text x="600.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(0.00008 м²)</text>
<line x1="100.0" y1="300.0" x2="640.0" y2="300.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="370.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">При зростанні частоти у 100 разів ефективна апертура зменшується у 10 000 разів (∝ 1/f²)</text>
