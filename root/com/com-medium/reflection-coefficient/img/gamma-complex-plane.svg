<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="16.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комплексна площина Г = Re(Г) + j Im(Г) та одиничне коло</text>
<circle cx="340.0" cy="270.0" r="190.0" fill="#fdfefe" stroke="#2c3e50" stroke-width="2.0"/>
<line x1="110.0" y1="270.0" x2="570.0" y2="270.0" stroke="#7f8c8d" stroke-width="1.5"/>
<line x1="340.0" y1="40.0" x2="340.0" y2="500.0" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="585.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle" font-weight="700">Re(Γ)</text>
<text x="340.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle" font-weight="700">Im(Γ)</text>
<circle cx="340.0" cy="270.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="365.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Г = 0 (Z_L = Z₀)</text>
<text x="365.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Узгоджено</text>
<circle cx="530.0" cy="270.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="520.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">Г = +1 (Z_L = ∞)</text>
<text x="520.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">Холостий хід</text>
<circle cx="150.0" cy="270.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="160.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Г = −1 (Z_L = 0)</text>
<text x="160.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">Коротке замикання</text>
<circle cx="340.0" cy="80.0" r="5.0" fill="#8e44ad" stroke="#8e44ad" stroke-width="1.5"/>
<text x="352.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="start" font-weight="700">Г = +j (Z_L = +jZ₀)</text>
<circle cx="340.0" cy="460.0" r="5.0" fill="#8e44ad" stroke="#8e44ad" stroke-width="1.5"/>
<text x="352.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="start" font-weight="700">Г = −j (Z_L = −jZ₀)</text>
<line x1="340.0" y1="270.0" x2="450.0" y2="170.0" stroke="#8e44ad" stroke-width="2.5"/>
<circle cx="450.0" cy="170.0" r="5.0" fill="#8e44ad" stroke="#8e44ad" stroke-width="1.5"/>
<text x="460.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">Г = |Г| eʲᶲ</text>
<text x="460.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle">(Z_L = R + jX)</text>
<text x="385.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">φ</text>
<rect x="580.0" y="80.0" width="220.0" height="380.0" rx="6" fill="#f8fafc" stroke="#2c3e50" stroke-width="1.5"/><text x="690.0" y="191.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Області комплексного кола:</tspan><tspan x="690.0" dy="13.7"></tspan><tspan x="690.0" dy="13.7">• Внутрішність кола (|Γ| &lt; 1):</tspan><tspan x="690.0" dy="13.7">  Пасивні навантаження (R_L &gt; 0)</tspan><tspan x="690.0" dy="13.7"></tspan><tspan x="690.0" dy="13.7">• Верхня півплощина (Im(Γ) &gt; 0):</tspan><tspan x="690.0" dy="13.7">  Індуктивний характер (X_L &gt; 0)</tspan><tspan x="690.0" dy="13.7"></tspan><tspan x="690.0" dy="13.7">• Нижня півплощина (Im(Γ) &lt; 0):</tspan><tspan x="690.0" dy="13.7">  Ємнісний характер (X_L &lt; 0)</tspan><tspan x="690.0" dy="13.7"></tspan><tspan x="690.0" dy="13.7">• Одиничне коло (|Γ| = 1):</tspan><tspan x="690.0" dy="13.7">  Реактивні навантаження (R_L = 0)</tspan></text>
</svg>