<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<rect width="900" height="330" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Відбиття: хвиля відскакує від металу, як світло від дзеркала</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кут падіння дорівнює куту відбиття — точно як у променя світла</text>
<rect x="150.0" y="240.0" width="600.0" height="16.0" rx="0" fill="#d9d9de" stroke="#9a9aa0" stroke-width="1.6"/>
<text x="450.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">метал / стіна</text>
<line x1="220.0" y1="110.0" x2="420.0" y2="240.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="280.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">падає</text>
<line x1="420.0" y1="240.0" x2="620.0" y2="110.0" stroke="#b08900" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="560.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">відбивається</text>
<line x1="420.0" y1="240.0" x2="420.0" y2="130.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="395.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">α</text>
<text x="445.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">α</text>
<rect x="60.0" y="286.0" width="780.0" height="36.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="309.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому метал «відбиває» радіо: за металевою стіною — «радіотінь», а відбиття створюють зайві шляхи.</text>
</svg>
