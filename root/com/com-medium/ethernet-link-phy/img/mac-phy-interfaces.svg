<text x="160.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">SoC / Мережевий MAC</text>
<text x="160.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(цифрова логіка, кадри, DMA)</text>
<rect x="390.0" y="70.0" width="260.0" height="440.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="520.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">PHY-трансивер</text>
<text x="520.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(кодери, ЦАП/АЦП, DSP, AFE)</text>
<rect x="730.0" y="70.0" width="190.0" height="440.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="825.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Гальванорозв'язка</text>
<text x="825.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Трансформатори + RJ-45</text>
<rect x="60.0" y="145.0" width="200.0" height="230.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="160.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтерфейси даних:</text>
<rect x="88.3" y="175.1" width="143.4" height="29.9" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="187.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">MII (100M)</tspan><tspan x="160.0" dy="12.3">4 біти @ 25 МГц, 16 ліній</tspan></text>
<rect x="91.0" y="220.1" width="138.0" height="29.9" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="232.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">RMII (100M)</tspan><tspan x="160.0" dy="12.3">2 біти @ 50 МГц, 7 ліній</tspan></text>
<rect x="74.8" y="265.1" width="170.4" height="29.9" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="277.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">RGMII (1G)</tspan><tspan x="160.0" dy="12.3">4 біти DDR @ 125 МГц, 12 ліній</tspan></text>
<rect x="63.9" y="310.1" width="192.1" height="29.9" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/><text x="160.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">SGMII (1G)</tspan><tspan x="160.0" dy="12.3">1 пара SerDes 1.25 Гбод, 4-6 ліній</tspan></text>
<line x1="280.0" y1="240.0" x2="390.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
