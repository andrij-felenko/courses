<rect x="78.0" y="165.0" width="84.0" height="10.0" rx="3" fill="#8e44ad" stroke="none" stroke-width="1.5"/>
<text x="120.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Виток 3</text>
<rect x="78.0" y="185.0" width="84.0" height="10.0" rx="3" fill="#8e44ad" stroke="none" stroke-width="1.5"/>
<text x="120.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Виток 4</text>
<rect x="78.0" y="205.0" width="84.0" height="10.0" rx="3" fill="#d35400" stroke="none" stroke-width="1.5"/>
<text x="120.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Виток 5</text>
<rect x="78.0" y="225.0" width="84.0" height="10.0" rx="3" fill="#d35400" stroke="none" stroke-width="1.5"/>
<text x="120.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Виток 6</text>
<rect x="78.0" y="245.0" width="84.0" height="10.0" rx="3" fill="#d35400" stroke="none" stroke-width="1.5"/>
<text x="120.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Виток 7</text>
<rect x="78.0" y="265.0" width="84.0" height="10.0" rx="3" fill="#d35400" stroke="none" stroke-width="1.5"/>
<text x="120.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Виток 8</text>
<path d="M 165 130 Q 185 140 165 150 Q 190 160 165 170" fill="none" stroke="#8e44ad" stroke-width="2"/>
<text x="215.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">Коронний розряд / дуга</text>
<text x="215.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V_котушки = I_ант · X_L</text>
<line x1="165.0" y1="125.0" x2="230.0" y2="125.0" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="165.0" y1="265.0" x2="230.0" y2="265.0" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="220.0" y1="265.0" x2="220.0" y2="125.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<g transform="rotate(-90 220 195)"><text x="220.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">V_ампл ≈ 6–8 кВ!</text></g>
<rect x="400.0" y="55.0" width="350.0" height="305.0" rx="6" fill="#fdfefe" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="575.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрахунок для P = 100 Вт</text>
<text x="420.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Вхідна потужність:</text>
<text x="730.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">P = 100 Вт</text>
<text x="420.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Повний опір втрат:</text>
<text x="730.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">R_втрат = 4.0 Ом</text>
<text x="420.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Струм в антені:</text>
<text x="730.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">I = √(P / R) = 5.0 А</text>
<text x="420.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Реактивність котушки:</text>
<text x="730.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">X_L = 1200 Ом</text>
<text x="420.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Діюча напруга (RMS):</text>
<text x="730.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">V_rms = 5A × 1200 Ом = 6000 В</text>
<text x="420.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Пікова напруга (Peak):</text>
<text x="730.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="end" font-weight="700">V_peak = 6000 × √2 = 8485 В!</text>
<rect x="415.0" y="260.0" width="320.0" height="85.0" rx="4" fill="#fcedea" stroke="#c0392b" stroke-width="1.0"/>
<text x="575.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вимоги до конструкції котушки:</text>
<text x="425.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Крок витків s ≥ 1.5–2 × d_дроту (захист від пробою)</text>
<text x="425.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Каркас із фторопласту (PTFE) або склотекстоліту</text>
<text x="425.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Великий діаметр D (зменшує необхідну довжину)</text>
</svg>