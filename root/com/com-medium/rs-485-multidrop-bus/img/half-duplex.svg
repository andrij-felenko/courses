<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна пара працює по черзі: сигнал DE віддає лінію передавачу або приймачу</text>
<rect x="310.0" y="80.0" width="140.0" height="150.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="380.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансивер</text>
<text x="380.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">RS-485</text>
<polygon points="340,150 340,190 374,170" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="350.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">D</text>
<polygon points="420,150 420,190 386,170" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="410.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">R</text>
<rect x="70.0" y="120.0" width="70.0" height="70.0" rx="8" fill="#eef2f8" stroke="#2457d6" stroke-width="1.6"/>
<text x="105.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">MCU</text>
<text x="105.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">UART</text>
<line x1="140.0" y1="140.0" x2="340.0" y2="158.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="225.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">TX→D</text>
<line x1="140.0" y1="172.0" x2="386.0" y2="170.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="225.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">R→RX</text>
<line x1="140.0" y1="204.0" x2="374.0" y2="204.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="374.0" y1="204.0" x2="374.0" y2="180.0" stroke="#27ae60" stroke-width="2.2"/>
<text x="225.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">DE / RE</text>
<line x1="450.0" y1="158.0" x2="540.0" y2="158.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="450.0" y1="182.0" x2="540.0" y2="182.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="546.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">A</text>
<text x="546.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">B</text>
<line x1="40.0" y1="262.0" x2="720.0" y2="262.0" stroke="#d6dde6" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="60.0" y="278.0" width="320.0" height="130.0" rx="8" fill="#fbeee6" stroke="#c0392b" stroke-width="1.6"/>
<text x="220.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">DE = 1 — передаємо</text>
<text x="76.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="76.0" dy="0.0">драйвер D під'єднаний до пари,</tspan><tspan x="76.0" dy="14.8">MCU виштовхує біти TX у лінію,</tspan><tspan x="76.0" dy="14.8">приймач R вимкнений — себе не слухаємо</tspan></text>
<rect x="380.0" y="278.0" width="320.0" height="130.0" rx="8" fill="#eef2f8" stroke="#2457d6" stroke-width="1.6"/>
<text x="540.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">DE = 0 — приймаємо</text>
<text x="396.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="396.0" dy="0.0">драйвер D у третьому стані (відпущений),</tspan><tspan x="396.0" dy="14.8">пара вільна для іншого вузла,</tspan><tspan x="396.0" dy="14.8">приймач R віддає почуте в RX</tspan></text>
</svg>