<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цифрова шкала dBFS: 0 dBFS як абсолютна стеля</text>
<rect x="100.0" y="70.0" width="240.0" height="220.0" rx="4" fill="#f8f9fa" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="100.0" y1="70.0" x2="340.0" y2="70.0" stroke="#c0392b" stroke-width="3.5"/>
<text x="355.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">0 dBFS — Стеля (Clipping!)</text>
<line x1="100.0" y1="83.8" x2="340.0" y2="83.8" stroke="#e67e22" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="355.0" y="87.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="start" font-weight="700">-6 dBFS — Запас (Headroom)</text>
<line x1="100.0" y1="111.2" x2="340.0" y2="111.2" stroke="#27ae60" stroke-width="2.0"/>
<text x="355.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">-18 dBFS — Робочий рівень</text>
<rect x="140.0" y="111.2" width="160.0" height="178.8" rx="6" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.5"/>
<line x1="100.0" y1="290.0" x2="340.0" y2="290.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="355.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">-96 dBFS — Дно шуму (16 біт АЦП)</text>
<rect x="460.0" y="160.0" width="260.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="216.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">У цифрових системах (SDR, DSP, Audio) всі значення dBFS від'ємні.</tspan><tspan x="590.0" dy="11.7">0 dBFS відповідає максимальному числу відліку АЦП.</tspan><tspan x="590.0" dy="11.7">Перевищення 0 dBFS спричиняє спотворення (цифрове зрізання сигналу).</tspan></text>
</svg>