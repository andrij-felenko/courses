<text x="500.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">наводка діє сильніше на ближчий провід; звивання раз у раз міняє їх місцями — тож сумарно дістається порівну</text>
