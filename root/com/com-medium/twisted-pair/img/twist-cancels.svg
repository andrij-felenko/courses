<text x="262.5" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">наводка на A  ≠  наводка на B</text>
<text x="262.5" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">різниця (саме її «чує» телефон)</text>
