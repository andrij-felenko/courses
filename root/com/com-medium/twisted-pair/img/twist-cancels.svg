<line x1="500.0" y1="145.0" x2="500.0" y2="432.0" stroke="#e4e4e4" stroke-width="1.6" stroke-dasharray="4,6" stroke-linecap="round"/>
<text x="500.0" y="470.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Белл не вигадав нової фізики — він використав геометрію: однаковий зовнішній вплив на обидва проводи</text>
<text x="500.0" y="488.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">сам собою «віднімається», бо телефон реагує лише на РІЗНИЦЮ напруг між проводами пари.</text>
</svg>
