<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 414.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="414.3" fill="#ffffff"/>
