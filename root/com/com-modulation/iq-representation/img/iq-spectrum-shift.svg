<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 774 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="774" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язок комплексного спектра базової смуги та радіоспектра навколо f_c</text>
<text x="200.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Спектр базової смуги Z(f) = I(f) + j·Q(f)</text>
<line x1="50.0" y1="160.0" x2="350.0" y2="160.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="200.0" y1="190.0" x2="200.0" y2="60.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="360.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">f (базова)</text>
<polygon points="90.0,160.0 130.0,120.0 180.0,135.0 200.0,90.0 250.0,70.0 300.0,160.0" fill="#27ae60" fill-opacity="0.25" stroke="#27ae60" stroke-width="2.0"/>
<text x="135.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">-B (від'ємні f)</text>
<text x="265.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">+B (додатні f)</text>
<text x="200.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0</text>
<line x1="370.0" y1="120.0" x2="420.0" y2="120.0" stroke="#b08900" stroke-width="2.5"/>
<line x1="410.0" y1="114.0" x2="420.0" y2="120.0" stroke="#b08900" stroke-width="2.5"/>
<line x1="410.0" y1="126.0" x2="420.0" y2="120.0" stroke="#b08900" stroke-width="2.5"/>
<text x="395.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700">Перенесення на f_c</text>
<text x="560.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Спектр RF сигналу s(t) навколо f_c</text>
<line x1="430.0" y1="160.0" x2="690.0" y2="160.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="560.0" y1="190.0" x2="560.0" y2="60.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="700.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">f (радіо)</text>
<polygon points="470.0,160.0 505.0,120.0 545.0,135.0 560.0,90.0 600.0,70.0 640.0,160.0" fill="#27ae60" fill-opacity="0.25" stroke="#27ae60" stroke-width="2.0"/>
<text x="560.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="700">f_c</text>
<text x="505.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">f_c - B (LSB)</text>
<text x="615.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">f_c + B (USB)</text>
<rect x="12.8" y="248.6" width="694.3" height="82.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="270.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Головний висновок комплексного спектра:</tspan><tspan x="360.0" dy="15.6">• Від'ємні частоти комплексного сигналу (f &lt; 0) відповідають нижній бічній смузі (LSB, f_c - |f|).</tspan><tspan x="360.0" dy="15.6">• Додатні частоти (f &gt; 0) відповідають верхній бічній смузі (USB, f_c + f).</tspan><tspan x="360.0" dy="15.6">• Це дає змогу легко формувати будь-яку асиметрію спектра та односмугову модуляцію (SSB).</tspan></text>
</svg>