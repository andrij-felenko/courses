<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="336" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два нулі оберненого коду: перевірка й трюк UDP</text>
<rect x="50.0" y="72.0" width="300.0" height="60.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="200.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">+0  =  0x0000</text>
<text x="200.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0000 0000 0000 0000</text>
<rect x="370.0" y="72.0" width="300.0" height="60.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.8"/>
<text x="520.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">−0  =  0xFFFF</text>
<text x="520.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1111 1111 1111 1111</text>
<text x="360.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">в оберненому коді це той самий нуль</text>
<rect x="100.8" y="186.0" width="518.5" height="32.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.7"/><text x="360.0" y="206.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">перевірка:  Σ(усі слова + контрольна сума) = 0xFFFF  →  пакет цілий</tspan></text>
<rect x="145.4" y="236.0" width="429.2" height="32.0" rx="6" fill="#fff8e8" stroke="#caa24a" stroke-width="1.9"/><text x="360.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1f" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">UDP:  порахована сума 0x0000  →  у пакет кладуть 0xFFFF</tspan></text>
<line x1="60.0" y1="288.0" x2="660.0" y2="288.0" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="360.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">нуль означав би «суми нема»; в IPv6 сума обов'язкова, тож 0 там заборонено</text>
</svg>