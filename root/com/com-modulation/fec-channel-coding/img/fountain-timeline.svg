<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 980" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="980" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двадцять років повороту: від блокових кодів до фонтана</text>
<line x1="150.0" y1="114.0" x2="150.0" y2="882.0" stroke="#6b7280" stroke-width="2.2"/>
<rect x="195.0" y="64.0" width="680.0" height="100.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="126.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1997</text>
<circle cx="150.0" cy="114.0" r="9.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.5"/>
<line x1="159.0" y1="114.0" x2="195.0" y2="114.0" stroke="#27ae60" stroke-width="1.6"/>
<text x="212.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1997 · Торнадо-коди</text>
<text x="212.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="212.0" dy="0.0">Лубі, Міценмахер, Шокроллагі, Спілман, Стеман: розріджений граф, лише XOR,</tspan><tspan x="212.0" dy="15.5">майже впритул до ємності каналу зі стиранням — але швидкість ще фіксована.</tspan></text>
<rect x="195.0" y="192.0" width="680.0" height="100.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="126.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1998</text>
<circle cx="150.0" cy="242.0" r="9.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.5"/>
<line x1="159.0" y1="242.0" x2="195.0" y2="242.0" stroke="#27ae60" stroke-width="1.6"/>
<text x="212.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1998 · «Цифровий фонтан» і компанія Digital Fountain</text>
<text x="212.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="212.0" dy="0.0">Байерс, Лубі, Міценмахер, Реге (SIGCOMM): роздача без зворотного каналу.</tspan><tspan x="212.0" dy="15.5">Лубі залишає ICSI, засновює Digital Fountain, винаходить LT-коди.</tspan></text>
<rect x="195.0" y="320.0" width="680.0" height="100.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="126.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">2002</text>
<circle cx="150.0" cy="370.0" r="9.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.5"/>
<line x1="159.0" y1="370.0" x2="195.0" y2="370.0" stroke="#27ae60" stroke-width="1.6"/>
<text x="212.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2002 · LT-коди опубліковано (Лубі, FOCS)</text>
<text x="212.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="212.0" dy="0.0">Перший по-справжньому безрейтовий код: символ = XOR випадкової підмножини</tspan><tspan x="212.0" dy="15.5">даних; декодування «обчисткою» (peeling) уздовж двочасткового графа.</tspan></text>
<rect x="195.0" y="448.0" width="680.0" height="100.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="126.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">2006</text>
<circle cx="150.0" cy="498.0" r="9.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.5"/>
<line x1="159.0" y1="498.0" x2="195.0" y2="498.0" stroke="#27ae60" stroke-width="1.6"/>
<text x="212.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2006 · Raptor-коди опубліковано (Шокроллагі)</text>
<text x="212.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="212.0" dy="0.0">Зовнішній прекод + послаблений внутрішній LT → лінійний час кодування</tspan><tspan x="212.0" dy="15.5">й декодування та крихітний надлишок прийому.</tspan></text>
<rect x="195.0" y="576.0" width="680.0" height="100.0" rx="8" fill="#ffffff" stroke="#c9922e" stroke-width="1.8"/>
<text x="126.0" y="631.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c9922e" text-anchor="end" font-weight="700">2007</text>
<circle cx="150.0" cy="626.0" r="9.0" fill="#c9922e" stroke="#ffffff" stroke-width="2.5"/>
<line x1="159.0" y1="626.0" x2="195.0" y2="626.0" stroke="#c9922e" stroke-width="1.6"/>
<text x="212.0" y="606.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2007 · RFC 5053 — Raptor у стандартах мовлення</text>
<text x="212.0" y="631.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="212.0" dy="0.0">3GPP MBMS і DVB-H: мобільне ТБ й роздача на безліч приймачів — саме той</tspan><tspan x="212.0" dy="15.5">сценарій «один-до-багатьох», заради якого фонтан і шукали.</tspan></text>
<rect x="195.0" y="704.0" width="680.0" height="100.0" rx="8" fill="#ffffff" stroke="#c9922e" stroke-width="1.8"/>
<text x="126.0" y="759.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c9922e" text-anchor="end" font-weight="700">2011</text>
<circle cx="150.0" cy="754.0" r="9.0" fill="#c9922e" stroke="#ffffff" stroke-width="2.5"/>
<line x1="159.0" y1="754.0" x2="195.0" y2="754.0" stroke="#c9922e" stroke-width="1.6"/>
<text x="212.0" y="734.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2011 · RFC 6330 — RaptorQ</text>
<text x="212.0" y="759.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="212.0" dy="0.0">Майже ідеальний прийом (часто досить k або k+1 символів), вільний</tspan><tspan x="212.0" dy="15.5">від роялті для сумісних реалізацій.</tspan></text>
<rect x="195.0" y="832.0" width="680.0" height="100.0" rx="8" fill="#ffffff" stroke="#c9922e" stroke-width="1.8"/>
<text x="126.0" y="887.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c9922e" text-anchor="end" font-weight="700">2019</text>
<circle cx="150.0" cy="882.0" r="9.0" fill="#c9922e" stroke="#ffffff" stroke-width="2.5"/>
<line x1="159.0" y1="882.0" x2="195.0" y2="882.0" stroke="#c9922e" stroke-width="1.6"/>
<text x="212.0" y="862.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2019 · RFC 8627 — FlexFEC у WebRTC</text>
<text x="212.0" y="887.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="212.0" dy="0.0">Для розмови в реальному часі — не фонтан, а проста систематична парність</tspan><tspan x="212.0" dy="15.5">(і розсіяні, і пакетні втрати); ремонт окремим RTP-потоком поряд.</tspan></text>
</svg>