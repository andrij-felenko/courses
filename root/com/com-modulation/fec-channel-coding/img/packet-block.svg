<text x="88.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="88.0" dy="0.0">idx у заголовку каже декодеру ТОЧНО, котрий рядок G бракує (тут idx = 2). Це й робить код</tspan><tspan x="88.0" dy="16.2">erasure-кодом: позиція відома → декодеру досить будь-яких k пакетів, а не 2× на кожну помилку.</tspan><tspan x="88.0" dy="16.2">Приймач бачить у нумерації діру idx=2 — і будує підматрицю A з рядків тих, що дійшли.</tspan></text>
