<text x="70.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Кожен пакет несе заголовок (blk, idx). Дані різної довжини доповнюються нулями до L — інакше XOR/множення читали б за буфером.</text>
