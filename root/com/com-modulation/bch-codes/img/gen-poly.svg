<line x1="670.0" y1="134.0" x2="404.0" y2="198.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="170.0" y="344.0" width="600.0" height="66.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.2"/><text x="470.0" y="372.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">g(x) = m₁(x) · m₃(x) = x⁸+x⁷+x⁶+x⁴+1   (степінь 8)</tspan><tspan x="470.0" dy="18.2">надлишок n − k = 8   →   BCH(15, 7), виправляє 2 помилки</tspan></text>
