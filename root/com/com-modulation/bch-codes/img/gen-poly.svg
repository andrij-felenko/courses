<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квадрати задарма: 2t коренів коштують лише ~t многочленів</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">замовлені корені для t = 2:</text>
<rect x="217.0" y="74.0" width="66.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="250.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">α¹</text>
<rect x="357.0" y="74.0" width="66.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="390.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">α²</text>
<rect x="497.0" y="74.0" width="66.0" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="530.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">α³</text>
<rect x="637.0" y="74.0" width="66.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="670.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">α⁴</text>
<text x="390.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">= (α¹)²</text>
<text x="670.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">= (α²)²</text>
<rect x="160.0" y="200.0" width="320.0" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="320.0" y="227.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">m₁(x) = x⁴+x+1</tspan><tspan x="320.0" dy="17.6">вбирає корені: α¹, α², α⁴, α⁸</tspan></text>
<rect x="540.0" y="200.0" width="300.0" height="64.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="690.0" y="227.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">m₃(x) = x⁴+x³+x²+x+1</tspan><tspan x="690.0" dy="17.6">вбирає корені: α³, α⁶, α⁹, α¹²</tspan></text>
<line x1="250.0" y1="134.0" x2="303.2" y2="198.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="390.0" y1="134.0" x2="336.8" y2="198.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
