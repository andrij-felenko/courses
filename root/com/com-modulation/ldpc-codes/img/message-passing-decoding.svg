<text x="647.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Фаза 2: Повідомлення CN → VN (r_{c → v})</text>
