<text x="80.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">v₁</text>
<line x1="20.0" y1="200.0" x2="58.0" y2="200.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="40.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">L_канал</text>
<line x1="80.0" y1="110.0" x2="80.0" y2="178.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="105.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">r_{c₂ → v₁}</text>
<line x1="102.0" y1="200.0" x2="330.0" y2="200.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="140.0" y="175.0" width="160.0" height="48.0" rx="4" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.0"/>
<text x="220.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">q_{v₁ → c₁} = L₁ + r_{c₂ → v₁}</text>
<text x="220.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(без вхідного r_{c₁ → v₁})</text>
