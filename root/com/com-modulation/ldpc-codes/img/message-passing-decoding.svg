<text x="763.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">c₁</text>
<line x1="745.0" y1="200.0" x2="520.0" y2="200.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="540.0" y="175.0" width="170.0" height="50.0" rx="4" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.0"/>
<text x="625.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">r_{c₁ → v₁} = f_CN(q_{v₂}, q_{v₃})</text>
<text x="625.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Min-Sum / Sum-Product</text>
