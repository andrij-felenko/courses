<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Ітеративний алгоритм передачі повідомлень (Message-Passing / Belief Propagation)</text>
