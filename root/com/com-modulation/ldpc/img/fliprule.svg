<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки бітів перевертати за крок — і куди це заводить</text>
<rect x="133.5" y="57.6" width="613.0" height="52.8" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.8"/><text x="440.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">прийнято  0 1 0 0 1 0    (надіслано 1 1 0 0 1 1 — канал побив b0 і b5)</tspan><tspan x="440.0" dy="16.2">синдром 1 1 1 1: порушені всі чотири, рахунок кожного біта = 2 — глуха нічия</tspan></text>
<text x="228.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">перевернути ОДИН біт</text>
<text x="652.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">перевернути ВСІ з максимумом</text>
<rect x="108.2" y="214.5" width="239.6" height="35.0" rx="6" fill="#ffffff" stroke="#c7ccd3" stroke-width="2.0"/><text x="228.0" y="236.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="228.0" dy="0.0">0 1 0 0 1 0    синдром 1111</tspan></text>
<line x1="228.0" y1="254.0" x2="228.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="242.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">перевертає b0</text>
<rect x="108.2" y="294.5" width="239.6" height="35.0" rx="6" fill="#ffffff" stroke="#c7ccd3" stroke-width="2.0"/><text x="228.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="228.0" dy="0.0">1 1 0 0 1 0    синдром 0011</tspan></text>
<line x1="228.0" y1="334.0" x2="228.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="242.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">перевертає b5</text>
<rect x="108.2" y="374.5" width="239.6" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="228.0" y="396.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="228.0" dy="0.0">1 1 0 0 1 1    синдром 0000</tspan></text>
<rect x="532.2" y="214.5" width="239.6" height="35.0" rx="6" fill="#ffffff" stroke="#c7ccd3" stroke-width="2.0"/><text x="652.0" y="236.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="652.0" dy="0.0">0 1 0 0 1 0    синдром 1111</tspan></text>
<line x1="652.0" y1="254.0" x2="652.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="666.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">перевертає всі шість</text>
<rect x="532.2" y="374.5" width="239.6" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="652.0" y="396.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="652.0" dy="0.0">1 0 1 1 0 1    синдром 0000</tspan></text>
<rect x="140.5" y="445.8" width="175.0" height="32.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="228.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="228.0" dy="0.0">= надіслане слово  ✓</tspan></text>
<rect x="518.0" y="437.6" width="268.0" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="652.0" y="458.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="652.0" dy="0.0">теж кодове слово — але за 4 біти</tspan><tspan x="652.0" dy="16.2">від надісланого  ✗</tspan></text>
<rect x="199.4" y="503.6" width="481.2" height="52.8" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.8"/><text x="440.0" y="526.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">той самий блок, той самий рахунок порушених перевірок —</tspan><tspan x="440.0" dy="16.2">різниця лише в тому, скільки бітів перевертати за один крок</tspan></text>
</svg>