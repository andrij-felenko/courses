<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 880.98 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="880.98" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип виколювання (puncturing) у системі зв'язку</text>
<text x="410.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Один материнський декодер обслуговує різні швидкості кодування за допомогою вставляння стирань</text>
<text x="50.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Дані u</text>
<line x1="100.0" y1="140.0" x2="140.0" y2="140.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="140.0" y="105.0" width="140.0" height="70.0" rx="6" fill="#e8eefc" stroke="#27ae60" stroke-width="2.0"/><text x="210.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Материнський</tspan><tspan x="210.0" dy="16.2">кодер R₀ = 1/2</tspan></text>
<text x="295.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Повний потік [v₁, v₂]</text>
<line x1="280.0" y1="140.0" x2="320.0" y2="140.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="105.0" width="140.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="390.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Блок виколювання</tspan><tspan x="390.0" dy="16.2">(матриця P)</tspan></text>
<text x="390.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вилучення бітів 0</text>
<text x="480.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Виколотий потік (R = 2/3)</text>
<line x1="460.0" y1="140.0" x2="500.0" y2="140.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="500.0" y="115.0" width="70.0" height="50.0" rx="5" fill="#fff5e6" stroke="#e08a1e" stroke-width="1.5"/>
<text x="535.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a8620a" text-anchor="middle" font-weight="700">Канал</text>
<line x1="570.0" y1="140.0" x2="610.0" y2="140.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="620.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Приймач</text>
<rect x="610.0" y="105.0" width="140.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="680.0" y="136.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Вставляння стирань</tspan><tspan x="680.0" dy="13.7">LLR = 0 на місця '0'</tspan></text>
<text x="760.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Відновлений потік</text>
<line x1="680.0" y1="175.0" x2="680.0" y2="245.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="610.0" y="245.0" width="140.0" height="70.0" rx="6" fill="#e8eefc" stroke="#27ae60" stroke-width="2.0"/><text x="680.0" y="276.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Материнський</tspan><tspan x="680.0" dy="16.2">декодер R₀ = 1/2</tspan></text>
<line x1="610.0" y1="280.0" x2="540.0" y2="280.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="530.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">Оцінка даних û</text>
<text x="410.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Завдяки вставлянню LLR = 0 структура ґратки декодера залишається незмінною</text>
</svg>