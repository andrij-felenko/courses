<text x="410.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Приймач зберігає м'які вибірки LLR від 1-ї спроби та об'єднує їх з досланими бітами</text>
