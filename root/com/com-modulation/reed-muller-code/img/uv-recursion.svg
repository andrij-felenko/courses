<text x="240.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Розбиття дає рекурентності:</tspan><tspan x="240.0" dy="17.8"></tspan><tspan x="240.0" dy="17.8">k(r,m) = k(r,m−1) + k(r−1,m−1)</tspan><tspan x="240.0" dy="17.8">         → тотожність Паскаля,</tspan><tspan x="240.0" dy="17.8">         сума C(m,i)</tspan><tspan x="240.0" dy="17.8"></tspan><tspan x="240.0" dy="17.8">d(r,m) = 2 · d(r,m−1)</tspan><tspan x="240.0" dy="17.8">         → d = 2^(m−r)</tspan><tspan x="240.0" dy="17.8"></tspan><tspan x="240.0" dy="17.8">Розкрута до кінця = рядки</tspan><tspan x="240.0" dy="17.8">кронекерового степеня [[1,0],[1,1]]</tspan><tspan x="240.0" dy="17.8">— спільна основа з полярними кодами.</tspan></text>
