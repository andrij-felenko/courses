<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Декодування: синдром → рядки B → до 3 виправлень, 4-та відхилена</text>
<rect x="60.0" y="48.0" width="350.0" height="60.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/><text x="235.0" y="83.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">s = B·x ⊕ y   (12-бітний синдром)</tspan></text>
<rect x="60.0" y="140.0" width="350.0" height="60.0" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="1.8"/><text x="235.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">вага(s) ≤ 3 ?</tspan></text>
<rect x="60.0" y="232.0" width="350.0" height="60.0" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="1.8"/><text x="235.0" y="267.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">є рядок i:  вага(s ⊕ Bᵢ) ≤ 2 ?</tspan></text>
<rect x="60.0" y="324.0" width="350.0" height="60.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/><text x="235.0" y="359.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">s₂ = B·s   (другий синдром)</tspan></text>
<rect x="60.0" y="416.0" width="350.0" height="60.0" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="1.8"/><text x="235.0" y="451.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">вага(s₂) ≤ 3 ?</tspan></text>
<rect x="60.0" y="508.0" width="350.0" height="60.0" rx="6" fill="#fff3e0" stroke="#e08a00" stroke-width="1.8"/><text x="235.0" y="543.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">є рядок i:  вага(s₂ ⊕ Bᵢ) ≤ 2 ?</tspan></text>
<rect x="60.0" y="600.0" width="350.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="235.0" y="634.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">НЕВИПРАВНО:  4+ помилки — чесне «ні»</tspan></text>
<rect x="540.0" y="140.0" width="330.0" height="60.0" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="705.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">e = [ 0 | s ]</text>
<text x="705.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">усі помилки — в перевірній половині</text>
