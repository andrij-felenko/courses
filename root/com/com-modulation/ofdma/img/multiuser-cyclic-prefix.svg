<svg xmlns="http://www.w3.org/2000/svg" viewBox="-94.44 -10 1034.44 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-94.44" y="-10" width="1034.44" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Циклічний префікс (CP) у багатокористувацькому просторі: поглинання просторового розкиду затримок</text>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Циклічний префікс (CP) у багатокористувацькому висхідному каналі</text>
<text x="70.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">Близький абонент (UE 1):</text>
<rect x="100.0" y="100.0" width="70.0" height="40.0" rx="3" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
<text x="135.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">CP</text>
<rect x="170.0" y="100.0" width="340.0" height="40.0" rx="3" fill="#edf3fc" stroke="#2457d6" stroke-width="1.6"/>
<text x="340.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Корисний символ T_s (UE 1)</text>
<text x="70.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="end" font-weight="700">Далекий абонент (UE 2):</text>
<rect x="140.0" y="175.0" width="70.0" height="40.0" rx="3" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
<text x="175.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">CP</text>
<rect x="210.0" y="175.0" width="340.0" height="40.0" rx="3" fill="#fbeee6" stroke="#d35400" stroke-width="1.6"/>
<text x="380.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Корисний символ T_s (UE 2)</text>
<line x1="100.0" y1="165.0" x2="140.0" y2="165.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="100.0" y1="161.0" x2="100.0" y2="169.0" stroke="#c0392b" stroke-width="1.4"/>
<line x1="140.0" y1="161.0" x2="140.0" y2="169.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="120.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Δt (розкид ходу хвиль)</text>
<text x="70.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">Вікно FFT базової станції:</text>
<rect x="140.0" y="260.0" width="340.0" height="40.0" rx="4" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.2"/>
<text x="310.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Інтервал демодуляції FFT (тривалість T_s = 1/Δf)</text>
<line x1="140.0" y1="90.0" x2="140.0" y2="310.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="480.0" y1="90.0" x2="480.0" y2="310.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="60.0" y="330.0" width="820.0" height="110.0" rx="6" fill="#f4f8fb" stroke="#bcd4ec" stroke-width="1.5"/>
<text x="470.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Умова збереження ортогональності в OFDMA:  Δt_prop + τ_max &lt; T_cp</text>
<text x="80.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Вікно інтегрування FFT потрапляє на корисні відліки обох сигналів без захоплення сусідніх символів (немає ISI).</text>
<text x="80.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Циклічний префікс поглинає як різницю відстаней до абонентів (Δt), так і багатопроменеву луну каналу (τ_max).</text>
<text x="80.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Якщо затримка перевищить T_cp, виникає руйнування ортогональності та міжканальна інтерференція (ICI) між блоками RU.</text>
</svg>