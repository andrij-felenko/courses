<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння ланцюгів формування сигналу OFDMA та SC-FDMA: механізм зменшення пік-фактора PAPR через DFT-прекодування</text>
<text x="470.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">OFDMA проти SC-FDMA (DFT-Spread OFDM): чому висхідний канал потребує меншого PAPR</text>
<text x="60.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">OFDMA (Downlink LTE/5G, Wi-Fi 6):</text>
