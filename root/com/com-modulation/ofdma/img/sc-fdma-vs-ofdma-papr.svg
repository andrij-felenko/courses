<rect x="60.0" y="310.0" width="820.0" height="160.0" rx="8" fill="#fbfcfd" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="470.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому попереднє перетворення Фур'є (DFT-прекодування) рятує батарею смартфона:</text>
<text x="80.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• В OFDMA кожен символ QAM модулює окрему гармоніку в частоті; IFFT складає їхні фази, створюючи випадкові гострі сплески потужності.</text>
<text x="80.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Підсилювач потужності (PA) змушений працювати з великим запасом (Back-off ~8-10 дБ) у нелінійній зоні, марнуючи енергію батареї.</text>
<text x="80.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• В SC-FDMA додатковий M-точковий DFT «розмазує» кожен символ QAM по всіх піднесених: сигнал у часовій області поводиться як одна несуча.</text>
<text x="80.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Пік-фактор (PAPR) падає на 2–3 дБ, ККД підсилювача зростає, радіус дії телефону збільшується без перегріву передавача.</text>
</svg>