<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структурна схема аналогового OSD-оверлея (накладання телеметрії)</text>
<rect x="26.1" y="117.3" width="107.8" height="45.3" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="80.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="80.0" dy="0.0">Вхід CVBS</tspan><tspan x="80.0" dy="14.3">(Камера 75 Ом)</tspan></text>
<rect x="174.4" y="112.0" width="151.1" height="56.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Прив'язка рівня</tspan><tspan x="250.0" dy="13.0">(DC Restorer / Clamp)</tspan><tspan x="250.0" dy="13.0">Фіксація чорного = 0.3В</tspan></text>
<rect x="392.9" y="110.0" width="154.2" height="60.0" rx="6" fill="#e6f9ed" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Швидкісний аналоговий</tspan><tspan x="470.0" dy="13.0">перемикач (Keyer MUX)</tspan><tspan x="470.0" dy="13.0">t_sw &lt; 15 нс</tspan></text>
<rect x="610.1" y="112.0" width="139.7" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="680.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Підсилювач виходу</tspan><tspan x="680.0" dy="13.0">(75 Ом Buffer Driver)</tspan><tspan x="680.0" dy="13.0">2.0 Vp-p -&gt; 1.0 Vp-p</tspan></text>
<line x1="135.0" y1="140.0" x2="185.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="315.0" y1="140.0" x2="395.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="545.0" y1="140.0" x2="615.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="745.0" y1="140.0" x2="795.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="795.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихід CVBS</text>
<rect x="174.4" y="272.0" width="151.1" height="56.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="290.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Синхросепаратор</tspan><tspan x="250.0" dy="13.0">(LM1881 / Компаратор)</tspan><tspan x="250.0" dy="13.0">Виділення HSYNC / VSYNC</tspan></text>
<line x1="250.0" y1="180.0" x2="250.0" y2="260.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="255.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Аналогове відео</text>
<rect x="371.2" y="270.0" width="197.6" height="60.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="470.0" y="297.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">OSD-контролер / MCU</tspan><tspan x="470.0" dy="13.0">(STM32 SPI DMA / MAX7456)</tspan><tspan x="470.0" dy="13.0">Генератор пікселів + OSD RAM</tspan></text>
<line x1="320.0" y1="300.0" x2="395.0" y2="300.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">HSYNC / VSYNC</text>
<line x1="470.0" y1="250.0" x2="470.0" y2="185.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="480.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Управління MUX:
0=Відео, 1=Чорний, 2=Білий</text>
<rect x="601.6" y="272.0" width="156.8" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="680.0" y="297.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Генератор опорних рівнів</tspan><tspan x="680.0" dy="13.0">Білий = 1.0 В</tspan><tspan x="680.0" dy="13.0">Чорний = 0.3 В</tspan></text>
<line x1="615.0" y1="300.0" x2="545.0" y2="300.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="580.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Напруги 0.3В / 1.0В</text>
<line x1="50.0" y1="390.0" x2="790.0" y2="390.0" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="420.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="420.0" dy="0.0">Синхронізація: HSYNC запускає таймер/DMA мікроконтролера, який видає біти телеметрії точно у вікно активного рядка (10.5..62.5 мкс).</tspan><tspan x="420.0" dy="14.3">При втраті сигналу камери OSD-контролер автоматично генерує власні синхроімпульси (режим Stand-alone OSD).</tspan></text>
</svg>