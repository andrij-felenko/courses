<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ліворуч — що потік отримує; праворуч — чим за це платять шириною й бітами</text>
