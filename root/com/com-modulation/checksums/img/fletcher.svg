<text x="70.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">а байт на позиції 4 — лише раз; тож переставлені байти дають іншу sum2.</text>
<text x="70.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Ціна — вдвічі ширший підпис; виявлення натомість майже як у CRC.</text>
