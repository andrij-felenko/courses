<text x="50.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Чому Флетчер ловить те, що проста сума пропускає:</text>
