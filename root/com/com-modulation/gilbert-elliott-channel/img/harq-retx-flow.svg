CRC OK</text>
<line x1="660.0" y1="345.0" x2="180.0" y2="365.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="570.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ACK #2</text>
<rect x="63.2" y="423.2" width="713.7" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="441.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Замість викидання пошкодженого пакета HARQ зберігає м'які рішення (LLR) у буфері.</tspan><tspan x="420.0" dy="15.6">Повторна передача накопичує енергію сигналу, забезпечуючи успішне декодування навіть у тривалій пачці.</tspan></text>
