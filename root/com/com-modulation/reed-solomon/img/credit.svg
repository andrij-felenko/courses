<text x="120.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Lincoln Lab, MIT</text>
<text x="120.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="120.0" dy="0.0">дали сам КОД:</tspan><tspan x="120.0" dy="13.7">лічити символами,</tspan><tspan x="120.0" dy="13.7">а не бітами</tspan></text>
<line x1="218.0" y1="180.0" x2="238.0" y2="180.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240.0" y="80.0" width="192.0" height="200.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
