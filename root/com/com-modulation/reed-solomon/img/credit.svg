<text x="768.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="768.0" dy="0.0">JPL і NASA</tspan></text>
<text x="768.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">інженери</text>
<text x="768.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="768.0" dy="0.0">звели все в</tspan><tspan x="768.0" dy="13.7">реальний радіо-</tspan><tspan x="768.0" dy="13.7">зв'язок — і він</tspan><tspan x="768.0" dy="13.7">працює досі</tspan></text>
<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Жодного одинокого генія — чотири незамінні ланки</text>
