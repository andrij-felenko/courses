<text x="336.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="336.0" dy="0.0">Берлекамп, Мессі</tspan><tspan x="336.0" dy="16.2">та інші, ~1969</tspan></text>
<text x="336.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">+ Пітерсон</text>
<text x="336.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="336.0" dy="0.0">швидкий ДЕКОДЕР —</tspan><tspan x="336.0" dy="13.7">без нього код</tspan><tspan x="336.0" dy="13.7">занадто важкий</tspan></text>
<line x1="434.0" y1="180.0" x2="454.0" y2="180.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="456.0" y="80.0" width="192.0" height="200.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="2.4"/>
<rect x="456.0" y="80.0" width="192.0" height="8.0" rx="6" fill="#caa24a" stroke="#caa24a" stroke-width="0.0"/>
<text x="552.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="552.0" dy="0.0">Форні: теорія</tspan><tspan x="552.0" dy="16.2">каскадів</tspan></text>
<text x="552.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">concatenated code</text>
<text x="552.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle"><tspan x="552.0" dy="0.0">як скласти два</tspan><tspan x="552.0" dy="13.7">коди шарами —</tspan><tspan x="552.0" dy="13.7">основа схеми</tspan></text>
<line x1="650.0" y1="180.0" x2="670.0" y2="180.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="672.0" y="80.0" width="192.0" height="200.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
