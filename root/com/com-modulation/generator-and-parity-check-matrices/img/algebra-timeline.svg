<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 731.68" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="731.68" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як коди стали алгеброю: 1948 → 1961</text>
<line x1="190.0" y1="70.0" x2="190.0" y2="338.0" stroke="#6b7280" stroke-width="2.4"/>
<line x1="190.0" y1="366.0" x2="190.0" y2="638.0" stroke="#2457d6" stroke-width="2.4"/>
<rect x="225.0" y="70.0" width="640.0" height="74.3" rx="6" fill="#f6f4ec" stroke="#6b7280" stroke-width="1.8"/><text x="237.0" y="93.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Клод Шеннон</text><text x="237.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="237.0" dy="0.0">Доведено: надійна передача можлива аж до пропускної здатності.</tspan><tspan x="237.0" dy="16.8">Доказ неконструктивний — як будувати коди, не сказано.</tspan></text>
<line x1="190.0" y1="107.2" x2="221.0" y2="107.2" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="190.0" cy="107.2" r="7.0" fill="#f6f4ec" stroke="#6b7280" stroke-width="2.4"/>
<text x="168.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1948</text>
<rect x="225.0" y="162.0" width="640.0" height="74.3" rx="6" fill="#f6f4ec" stroke="#6b7280" stroke-width="1.8"/><text x="237.0" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Марсель Голей</text><text x="237.0" y="205.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="237.0" dy="0.0">«Notes on Digital Coding», Proc. IRE 37, с. 657 — неповна сторінка.</tspan><tspan x="237.0" dy="16.8">Коди Голея; перевірна матриця в друці — але як побудова, не теорія.</tspan></text>
<line x1="190.0" y1="199.2" x2="221.0" y2="199.2" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="190.0" cy="199.2" r="7.0" fill="#f6f4ec" stroke="#6b7280" stroke-width="2.4"/>
<text x="168.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1949</text>
<text x="168.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">червень</text>
<rect x="225.0" y="254.0" width="640.0" height="74.3" rx="6" fill="#f6f4ec" stroke="#6b7280" stroke-width="1.8"/><text x="237.0" y="277.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Річард Геммінг</text><text x="237.0" y="297.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="237.0" dy="0.0">«Error Detecting and Error Correcting Codes», BSTJ 29, с. 147–160.</tspan><tspan x="237.0" dy="16.8">Геометрія n-куба: відстань, сфери, «контрольне число».</tspan></text>
<line x1="190.0" y1="291.1" x2="221.0" y2="291.1" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="190.0" cy="291.1" r="7.0" fill="#f6f4ec" stroke="#6b7280" stroke-width="2.4"/>
<text x="168.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1950</text>
<text x="168.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">квітень</text>
<rect x="225.0" y="380.0" width="640.0" height="74.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="237.0" y="403.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Девід Слепіан</text><text x="237.0" y="423.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="237.0" dy="0.0">«A Class of Binary Signaling Alphabets», BSTJ 35, с. 203–234.</tspan><tspan x="237.0" dy="16.8">Код = підгрупа. Стандартний масив, лідери, доказ оптимальності.</tspan></text>
<line x1="190.0" y1="417.1" x2="221.0" y2="417.1" stroke="#2457d6" stroke-width="1.4"/>
<circle cx="190.0" cy="417.1" r="7.0" fill="#eef4ff" stroke="#2457d6" stroke-width="2.4"/>
<text x="168.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1956</text>
<text x="168.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">січень</text>
<rect x="225.0" y="472.0" width="640.0" height="74.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="237.0" y="495.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Девід Слепіан</text><text x="237.0" y="515.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="237.0" dy="0.0">«Some Further Theory of Group Codes», BSTJ 39, с. 1219–1252.</tspan><tspan x="237.0" dy="16.8">Твірна матриця Ω, перевірна A, канонічна форма (Iₖ | M).</tspan></text>
<line x1="190.0" y1="509.1" x2="221.0" y2="509.1" stroke="#2457d6" stroke-width="1.4"/>
<circle cx="190.0" cy="509.1" r="7.0" fill="#eef4ff" stroke="#2457d6" stroke-width="2.4"/>
<text x="168.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1960</text>
<text x="168.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">вересень</text>
<rect x="225.0" y="564.0" width="640.0" height="74.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="237.0" y="587.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Веслі Пітерсон</text><text x="237.0" y="607.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="237.0" dy="0.0">«Error-Correcting Codes», MIT Press — перший підручник галузі.</tspan><tspan x="237.0" dy="16.8">Матрична мова стає просто тим, як предмет викладають.</tspan></text>
<line x1="190.0" y1="601.1" x2="221.0" y2="601.1" stroke="#27ae60" stroke-width="1.4"/>
<circle cx="190.0" cy="601.1" r="7.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/>
<text x="168.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1961</text>
<line x1="60.0" y1="352.0" x2="280.0" y2="352.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="790.0" y1="352.0" x2="880.0" y2="352.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="535.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">тут погляд змінюється: геометрія n-куба → алгебра підгруп</text>
<text x="460.0" y="672.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Між 1950 і 1956 не з'явилося жодного нового коду — з'явився новий спосіб</tspan><tspan x="460.0" dy="18.8">дивитися на ті самі. Слепіан не побудував кращого коду: він помітив, що вже</tspan><tspan x="460.0" dy="18.8">побудовані замкнені щодо додавання, — і дотиснув цю думку до кінця.</tspan></text>
</svg>