<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Залізо CRC: зсувний регістр зі зворотним XOR за одиницями полінома</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">XOR-«крани» стоять там, де в поліномі одиниці; біти даних вливаються по одному</text>
<rect x="205.0" y="147.0" width="90.0" height="56.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="250.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">D0</text>
<rect x="355.0" y="147.0" width="90.0" height="56.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="400.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">D1</text>
<rect x="505.0" y="147.0" width="90.0" height="56.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="550.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">D2</text>
<line x1="295.0" y1="175.0" x2="355.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="445.0" y1="175.0" x2="505.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="120.0" y1="175.0" x2="205.0" y2="175.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="120.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">біти даних →</text>
<line x1="595.0" y1="175.0" x2="650.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="650.0" y1="175.0" x2="650.0" y2="270.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="650.0" y1="270.0" x2="120.0" y2="270.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="120.0" y1="270.0" x2="120.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="370.0" cy="175.0" r="13.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="370.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">⊕</text>
<line x1="370.0" y1="270.0" x2="370.0" y2="188.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="382.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">кран на місці одиниці полінома</text>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Щотакту: зсув + XOR у «кранах». Після останнього біта в регістрі лежить готова CRC.</text>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Уся схема — кілька тригерів і вентилів XOR, тож рахує біт за такт майже задарма.</text>
</svg>