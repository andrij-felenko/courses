<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бітовий CRC: те саме ділення на многочлен, крок за кроком у коді</text>
<text x="380.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Приклад: CRC-8, поліном 0x07 (x⁸+x²+x+1), регістр 8 біт, один байт 0x31</text>
<rect x="40.0" y="70.0" width="330.0" height="156.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.5"/><text x="205.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Правило одного такту циклу</tspan><tspan x="205.0" dy="15.0"></tspan><tspan x="205.0" dy="15.0">msb = старший біт crc</tspan><tspan x="205.0" dy="15.0">crc &lt;&lt;= 1            (зсув уліво)</tspan><tspan x="205.0" dy="15.0">if (msb == 1)</tspan><tspan x="205.0" dy="15.0">    crc ^= 0x07      (XOR поліном)</tspan><tspan x="205.0" dy="15.0"></tspan><tspan x="205.0" dy="15.0">Зсув = «опустити наступний біт»;</tspan><tspan x="205.0" dy="15.0">XOR на 1 угорі = «відняти дільник».</tspan></text>
<rect x="390.0" y="70.0" width="330.0" height="156.0" rx="6" fill="#f0fff2" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="101.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Звідки це: ділення в стовпчик над GF(2)</tspan><tspan x="555.0" dy="14.3"></tspan><tspan x="555.0" dy="14.3">CRC — це остача від ділення повідомлення</tspan><tspan x="555.0" dy="14.3">на многочлен. Над GF(2) віднімання = XOR,</tspan><tspan x="555.0" dy="14.3">а «чи ділиться» вирішує лише старший біт.</tspan><tspan x="555.0" dy="14.3">Тож шкільне ділення стовпчиком стискається</tspan><tspan x="555.0" dy="14.3">до двох дій: зсунути регістр і, якщо зверху</tspan><tspan x="555.0" dy="14.3">була 1, XOR-нути поліном. Більше нічого.</tspan></text>
<text x="380.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трасування восьми тактів над байтом 0x31 = 0011 0001</text>
