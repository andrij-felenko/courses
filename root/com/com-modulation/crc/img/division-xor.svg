<rect x="80.0" y="416.0" width="300.0" height="34.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="437.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">остача 0  →  помилки немає</tspan></text>
