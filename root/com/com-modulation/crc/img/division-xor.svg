<text x="380.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Йому навіть не треба окремо звіряти CRC — нульова остача вже підтверджує цілість.</text>
<text x="380.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Те саме ділення апаратно робить один зсувний регістр зі зворотним XOR — біт за такт.</text>
