<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 617.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="617.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геді Ламарр: кінозірка, що запатентувала стрибки частоти</text>
<line x1="250.0" y1="92.0" x2="250.0" y2="580.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="250.0" cy="116.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<text x="228.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1914</text>
<text x="276.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Народилася у Відні</text>
<text x="276.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">Гедвіґа Кіслер, з єврейської родини в Австрії</text>
<circle cx="250.0" cy="167.6" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<text x="228.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1933</text>
<text x="276.0" y="165.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Кіно і шлюб з Мандлем</text>
<text x="276.0" y="183.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">На зустрічах чоловіка-зброяра вбирає знання про озброєння</text>
<circle cx="250.0" cy="219.1" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<text x="228.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">~1937</text>
<text x="276.0" y="217.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Втеча до Голлівуду</text>
<text x="276.0" y="235.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">Тікає від чоловіка й нацистської Європи; стає зіркою MGM</text>
<circle cx="250.0" cy="270.7" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="228.0" y="275.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1940</text>
<text x="276.0" y="268.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Зустріч з Антайлом</text>
<text x="276.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">З композитором задумує незаглушуване радіо</text>
<circle cx="250.0" cy="322.2" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="228.0" y="327.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1942</text>
<text x="276.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Патент 2 292 387</text>
<text x="276.0" y="338.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">«Secret Communication System» — стрибки по 88 частотах</text>
<circle cx="250.0" cy="373.8" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.6"/>
<text x="228.0" y="378.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1942</text>
<text x="276.0" y="371.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Флот відкладає</text>
<text x="276.0" y="389.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">«Завелике для торпеди» — винахід кладуть під сукно</text>
<circle cx="250.0" cy="425.3" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.6"/>
<text x="228.0" y="430.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1959</text>
<text x="276.0" y="423.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Патент згасає</text>
<text x="276.0" y="441.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">Так і не використаний; винахідники не дістали ні цента</text>
<circle cx="250.0" cy="476.9" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.6"/>
<text x="228.0" y="481.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1962</text>
<text x="276.0" y="474.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start" font-weight="700">Військові беруть схоже</text>
<text x="276.0" y="492.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">Споріднену техніку впроваджують — уже після згасання патенту</text>
<circle cx="250.0" cy="528.4" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="228.0" y="533.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1997</text>
<text x="276.0" y="526.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Нарешті визнання</text>
<text x="276.0" y="544.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">Премія EFF Pioneer повертає їй ім'я винахідниці</text>
<circle cx="250.0" cy="580.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="228.0" y="585.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">2014</text>
<text x="276.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Зала слави (посмертно)</text>
<text x="276.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">Національна зала слави винахідників США</text>
</svg>