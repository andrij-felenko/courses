<text x="476.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">цей шматок наївний декодер віддає задарма:</text>
<text x="476.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">код має запас, декодер — ні</text>
<text x="20.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="20.0" dy="0.0">каскад</tspan><tspan x="20.0" dy="16.2">RS(15,11) ∘ [7,4,3]</tspan><tspan x="20.0" dy="16.2">= [105, 44, ≥15]</tspan></text>
<text x="480.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий код, ті самі два декодери — але GMD витискає з них 7 замість 5, бо не викидає інформацію про те, як важко далося внутрішнє рішення.</text>
