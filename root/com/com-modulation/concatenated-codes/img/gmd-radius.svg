<text x="476.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">лише GMD</text>
<text x="706.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">не лагодить ніхто — за межею відстані</text>
<line x1="545.0" y1="118.0" x2="545.0" y2="246.0" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="537.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">D·d / 2 = 7.5 — стеля однозначного декодування</text>
<line x1="890.0" y1="118.0" x2="890.0" y2="246.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="890.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">D·d = 15</text>
<text x="890.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">мін. відстань</text>
