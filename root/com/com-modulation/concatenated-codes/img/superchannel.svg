<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кодування не виводить нас із класу каналів — тому крок можна повторювати</text>
<text x="34.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Беремо звичайний ланцюг — кодер, канал, декодер:</text>
<rect x="206.0" y="98.0" width="158.0" height="56.0" rx="6" fill="#2457d612" stroke="#2457d6" stroke-width="2.0"/><text x="285.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="285.0" dy="0.0">внутрішній кодер</tspan></text>
<rect x="414.0" y="98.0" width="122.0" height="56.0" rx="6" fill="#caa24a12" stroke="#caa24a" stroke-width="2.0"/><text x="475.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle"><tspan x="475.0" dy="0.0">канал</tspan></text>
<rect x="622.0" y="98.0" width="158.0" height="56.0" rx="6" fill="#2457d612" stroke="#2457d6" stroke-width="2.0"/><text x="701.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="701.0" dy="0.0">внутрішній декодер</tspan></text>
<line x1="368.0" y1="126.0" x2="410.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="126.0" x2="618.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180.0" y="68.0" width="626.0" height="116.0" rx="10" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="820.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">усе це разом</text>
<text x="820.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">— одна коробка</text>
<line x1="490.0" y1="222.0" x2="490.0" y2="266.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="506.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">дивимося ЗЗОВНІ — що в коробці, байдуже</text>
<rect x="258.0" y="290.0" width="452.0" height="68.0" rx="6" fill="#caa24a16" stroke="#caa24a" stroke-width="2.4"/><text x="484.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle"><tspan x="484.0" dy="0.0">СУПЕРКАНАЛ:  eᴺᴿ входів, eᴺᴿ виходів,</tspan><tspan x="484.0" dy="16.2">дуже рідко плутає вхід із виходом</tspan></text>
<text x="730.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">вхід, вихід і ймовірності</text>
<text x="730.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">помилки — це ВИЗНАЧЕННЯ</text>
<text x="730.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">каналу. Отже, це канал.</text>
<line x1="490.0" y1="368.0" x2="490.0" y2="412.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="506.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">а канал ми вміємо кодувати</text>
<rect x="206.0" y="442.0" width="158.0" height="56.0" rx="6" fill="#c0392b12" stroke="#c0392b" stroke-width="2.0"/><text x="285.0" y="474.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="285.0" dy="0.0">зовнішній кодер</tspan></text>
<rect x="414.0" y="442.0" width="122.0" height="56.0" rx="6" fill="#caa24a12" stroke="#caa24a" stroke-width="2.0"/><text x="475.0" y="474.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle"><tspan x="475.0" dy="0.0">суперканал</tspan></text>
<rect x="622.0" y="442.0" width="158.0" height="56.0" rx="6" fill="#c0392b12" stroke="#c0392b" stroke-width="2.0"/><text x="701.0" y="474.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="701.0" dy="0.0">зовнішній декодер</tspan></text>
<line x1="368.0" y1="470.0" x2="410.0" y2="470.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="470.0" x2="618.0" y2="470.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180.0" y="412.0" width="626.0" height="116.0" rx="10" fill="none" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="820.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">і це — знову</text>
<text x="820.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">той самий рисунок:</text>
<text x="820.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">можна ще раз</text>
</svg>