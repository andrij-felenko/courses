<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="30.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">кодуємо — зовнішній, потім внутрішній:</text>
<rect x="30.0" y="66.0" width="110.0" height="50.0" rx="8" fill="#27ae6012" stroke="#27ae60" stroke-width="2.2"/><text x="85.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">повідомлення</text><text x="85.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">дані</text>
<line x1="144.0" y1="91.0" x2="170.0" y2="91.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="174.0" y="66.0" width="176.0" height="50.0" rx="8" fill="#c0392b12" stroke="#c0392b" stroke-width="2.2"/><text x="262.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">зовнішній код</text><text x="262.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+ контрольні символи</text>
<line x1="354.0" y1="91.0" x2="380.0" y2="91.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="384.0" y="66.0" width="128.0" height="50.0" rx="8" fill="#caa24a12" stroke="#caa24a" stroke-width="2.2"/><text x="448.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">перемішування</text><text x="448.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">interleaving</text>
<line x1="516.0" y1="91.0" x2="542.0" y2="91.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="546.0" y="66.0" width="140.0" height="50.0" rx="8" fill="#2457d612" stroke="#2457d6" stroke-width="2.2"/><text x="616.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">внутрішній код</text><text x="616.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">поверх зовнішнього</text>
<line x1="690.0" y1="91.0" x2="716.0" y2="91.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="66.0" width="78.0" height="50.0" rx="8" fill="#caa24a12" stroke="#caa24a" stroke-width="2.2"/><text x="759.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">канал</text>
<text x="470.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">у каналі — і рідкий шум, і зрідка цілий пакет; на прийомі шари знімають У ЗВОРОТНОМУ ПОРЯДКУ</text>
<text x="30.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">декодуємо — спершу внутрішній, тоді зовнішній:</text>
<rect x="30.0" y="214.0" width="78.0" height="50.0" rx="8" fill="#caa24a12" stroke="#caa24a" stroke-width="2.2"/><text x="69.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">з каналу</text>
<line x1="112.0" y1="239.0" x2="138.0" y2="239.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="142.0" y="214.0" width="168.0" height="50.0" rx="8" fill="#2457d612" stroke="#2457d6" stroke-width="2.2"/><text x="226.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">внутрішній декодер</text><text x="226.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">гасить рідкий шум</text>
<line x1="314.0" y1="239.0" x2="340.0" y2="239.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="344.0" y="214.0" width="192.0" height="50.0" rx="8" fill="#caa24a12" stroke="#caa24a" stroke-width="2.2"/><text x="440.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">зворотне перемішування</text><text x="440.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">de-interleaving</text>
<line x1="540.0" y1="239.0" x2="566.0" y2="239.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="570.0" y="214.0" width="176.0" height="50.0" rx="8" fill="#c0392b12" stroke="#c0392b" stroke-width="2.2"/><text x="658.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">зовнішній декодер</text><text x="658.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">замітає пакети</text>
<line x1="750.0" y1="239.0" x2="776.0" y2="239.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="780.0" y="214.0" width="118.0" height="50.0" rx="8" fill="#27ae6012" stroke="#27ae60" stroke-width="2.2"/><text x="839.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">повідомлення</text><text x="839.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">без діри</text>
<text x="470.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">«Внутрішній» — той, що ближчий до каналу (бачить сирий шум).   «Зовнішній» — ближчий до даних (чистить залишок).</text>
</svg>