<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квадратурна площина та огинаюча A(t), фаза φ(t)</text>
<line x1="60.0" y1="200.0" x2="350.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="335.0" y1="200.0" x2="350.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="358.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">I (In-phase)</text>
<line x1="200.0" y1="340.0" x2="200.0" y2="50.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="200.0" y1="65.0" x2="200.0" y2="50.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="200.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9333ea" text-anchor="middle" font-weight="700">Q (Quadrature)</text>
<line x1="200.0" y1="200.0" x2="285.0" y2="125.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="270.0" y1="138.3" x2="285.0" y2="125.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<circle cx="285.0" cy="125.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<line x1="285.0" y1="125.0" x2="285.0" y2="200.0" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="285.0" y1="125.0" x2="200.0" y2="125.0" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="200.0" y1="200.0" x2="285.0" y2="200.0" stroke="#d97706" stroke-width="2.5"/>
<line x1="200.0" y1="200.0" x2="200.0" y2="125.0" stroke="#9333ea" stroke-width="2.5"/>
<text x="242.5" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">I(t)</text>
<text x="180.0" y="162.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9333ea" text-anchor="middle" font-weight="700">Q(t)</text>
<path d="M 235.0,200.0 L 233.0,185.0 L 226.0,177.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="245.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">φ(t)</text>
<text x="232.5" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">A(t)</text>
<rect x="440.0" y="40.0" width="290.0" height="300.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="585.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математичний зв'язок</text>
<text x="460.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Комплексна огинаюча (Baseband):</text>
<text x="460.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">s_l(t) = I(t) + j·Q(t)</text>
<text x="460.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Огинаюча та миттєва фаза:</text>
<text x="460.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">A(t) = √( I²(t) + Q²(t) )</text>
<text x="460.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">φ(t) = arctan( Q(t) / I(t) )</text>
<text x="460.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Фізичний смуговий сигнал (Passband):</text>
<text x="460.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">s(t) = Re{ s_l(t) · e^{j·2π·f_c·t} }</text>
<text x="460.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">= I(t)·cos(2π f_c t) - Q(t)·sin(2π f_c t)</text>
</svg>