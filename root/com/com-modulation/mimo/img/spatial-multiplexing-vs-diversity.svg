<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Просторове мультиплексування (Швидкість) проти Рознесення (Надійність)</text>
<rect x="20.0" y="50.0" width="360.0" height="250.0" rx="8" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="200.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Просторове рознесення (Diversity)</text>
<text x="200.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ціль: боротьба із завмираннями, стійкість</text>
<rect x="40.0" y="130.0" width="70.0" height="40.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="75.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Символ s₁</text>
<line x1="110.0" y1="140.0" x2="160.0" y2="120.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="110.0" y1="160.0" x2="160.0" y2="180.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="160.0" y="105.0" width="55.0" height="30.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="187.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Tx₁: s₁</text>
<rect x="160.0" y="165.0" width="55.0" height="30.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="187.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Tx₂: s₁*</text>
<line x1="215.0" y1="120.0" x2="280.0" y2="140.0" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="215.0" y1="180.0" x2="280.0" y2="160.0" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="280.0" y="130.0" width="80.0" height="40.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="320.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Комбайнер</text>
<text x="320.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">MRC / STBC</text>
<rect x="30.0" y="215.0" width="340.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">• Один потік даних дублюється у просторі/часі.</tspan><tspan x="200.0" dy="11.7">• Швидкість передачі R = 1 символ/такт (не зростає).</tspan><tspan x="200.0" dy="11.7">• Порядок рознесення d = N_t · N_r: ймовірність глибокого завмирання падає як SNR^(−d).</tspan></text>
<rect x="400.0" y="50.0" width="360.0" height="250.0" rx="8" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="580.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Просторове мультиплексування (Spatial Multiplexing)</text>
<text x="580.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ціль: кратна пропускна здатність на одній частоті</text>
<rect x="420.0" y="110.0" width="60.0" height="30.0" rx="4" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
<text x="450.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Потік s₁</text>
<rect x="420.0" y="160.0" width="60.0" height="30.0" rx="4" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5"/>
<text x="450.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">Потік s₂</text>
<line x1="480.0" y1="125.0" x2="520.0" y2="125.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="175.0" x2="520.0" y2="175.0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="520.0" y="110.0" width="55.0" height="30.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="547.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Tx₁: s₁</text>
<rect x="520.0" y="160.0" width="55.0" height="30.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="547.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">Tx₂: s₂</text>
<line x1="575.0" y1="125.0" x2="640.0" y2="125.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="575.0" y1="125.0" x2="640.0" y2="175.0" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="575.0" y1="175.0" x2="640.0" y2="125.0" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="575.0" y1="175.0" x2="640.0" y2="175.0" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="640.0" y="110.0" width="105.0" height="80.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="692.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">MIMO Детектор</text>
<text x="692.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">ZF / MMSE / ML</text>
<text x="692.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">→ ŝ₁, ŝ₂</text>
<rect x="410.0" y="215.0" width="340.0" height="75.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">• Незалежні потоки передаються паралельно на тій самій смузі.</tspan><tspan x="580.0" dy="11.7">• Швидкість передачі R = min(N_t, N_r) символів/такт.</tspan><tspan x="580.0" dy="11.7">• Вимагає високого SNR та некорельованого каналу rank(H) = min(N_t, N_r).</tspan></text>
<rect x="20.0" y="310.0" width="740.0" height="58.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="390.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Компроміс Чженя-Це (Zheng-Tse Diversity-Multiplexing Tradeoff):</tspan><tspan x="390.0" dy="12.3">Неможливо одночасно досягти максимального рознесення d_max = N_t · N_r та максимального мультиплексування r_max = min(N_t, N_r).</tspan><tspan x="390.0" dy="12.3">Адаптивні системи перемикають режим: на межі стільника (низький SNR) — рознесення, біля станції (високий SNR) — мультиплексування.</tspan></text>
</svg>