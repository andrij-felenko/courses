<rect x="25.0" y="312.0" width="730.0" height="55.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="390.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Рівняння сигналу: y = H·x + n, де кожне h_ij — комплексний коефіцієнт передачі з Tx_j на Rx_i.</tspan><tspan x="390.0" dy="14.3">Багатопроменеве розсіювання створює незалежні коефіцієнти h_ij, забезпечуючи високий ранг матриці rank(H).</tspan></text>
