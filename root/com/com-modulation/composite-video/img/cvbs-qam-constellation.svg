<text x="203.7" y="311.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="end">PAL Burst (-135°, рядок N+1)</text>
<rect x="560.0" y="65.0" width="290.0" height="345.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="143.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Математика квадратури QAM:</tspan><tspan x="705.0" dy="13.0">C(t) = U·sin(ω_c t) + V·cos(ω_c t)</tspan><tspan x="705.0" dy="13.0">     = A(t) · sin(ω_c t + φ(t))</tspan><tspan x="705.0" dy="13.0"></tspan><tspan x="705.0" dy="13.0">Параметри кольору:</tspan><tspan x="705.0" dy="13.0">• Амплітуда A = √(U² + V²) → Насиченість</tspan><tspan x="705.0" dy="13.0">• Фаза φ = arctan(V / U) → Колірний відтінок</tspan><tspan x="705.0" dy="13.0"></tspan><tspan x="705.0" dy="13.0">Придушена несуча (DSB-SC):</tspan><tspan x="705.0" dy="13.0">• Чорно-біле відео: U=0, V=0 ⇒ C(t)=0</tspan><tspan x="705.0" dy="13.0">  Несуча повністю зникає (немає шуму)</tspan><tspan x="705.0" dy="13.0"></tspan><tspan x="705.0" dy="13.0">Фазовий маятник PAL (Bruch):</tspan><tspan x="705.0" dy="13.0">• Знак V інвертується щорядка: +V / -V</tspan><tspan x="705.0" dy="13.0">• Фазова похибка каналу усереднюється</tspan><tspan x="705.0" dy="13.0">  між двома рядками у 1H лінії затримки</tspan></text>
</svg>