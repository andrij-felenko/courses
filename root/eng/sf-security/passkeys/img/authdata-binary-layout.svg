<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бінарна структура authData: 37 байтів фіксованого заголовка та дані відкритого ключа</text>
<rect x="197.8" y="40.5" width="604.4" height="29.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="59.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Загальний заголовок authData: 37 байтів (присутній у реєстрації та вході)</tspan></text>
<rect x="60.0" y="95.0" width="360.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">rpIdHash (32 байти)</tspan><tspan x="240.0" dy="15.6">SHA-256 від домену (наприклад, sha256(&quot;bank.com&quot;))</tspan><tspan x="240.0" dy="15.6">Захищає від підміни сервісу</tspan></text>
<rect x="435.0" y="95.0" width="230.0" height="70.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="550.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">flags (1 байт)</tspan><tspan x="550.0" dy="15.6">Бітові прапорці стану</tspan><tspan x="550.0" dy="15.6">(UP, UV, BE, BS, AT, ED)</tspan></text>
<rect x="680.0" y="95.0" width="260.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">signCount (4 байти, uint32 BE)</tspan><tspan x="810.0" dy="15.6">Лічильник підписів автентифікатора</tspan><tspan x="810.0" dy="15.6">Захист від клонування токена</tspan></text>
<rect x="60.0" y="185.0" width="880.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="200.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Розкладка байта прапорців (flags, 8 бітів):</tspan><tspan x="500.0" dy="14.3">• Біт 0 (0x01) UP: User Present (присутність підтверджена дотиком)</tspan><tspan x="500.0" dy="14.3">• Біт 2 (0x04) UV: User Verified (користувача верифіковано PIN / біометрією)</tspan><tspan x="500.0" dy="14.3">• Біт 3 (0x08) BE: Backup Eligibility (ключ дозволено синхронізувати в хмару)</tspan><tspan x="500.0" dy="14.3">• Біт 4 (0x10) BS: Backup State (ключ наразі синхронізовано як Passkey)</tspan><tspan x="500.0" dy="14.3">• Біт 6 (0x40) AT: Attested Credential Data (присутні дані нового ключа при реєстрації)</tspan></text>
<rect x="173.6" y="295.5" width="652.7" height="29.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Секція attestedCredentialData (додається ТІЛЬКИ при реєстрації, прапорець AT=1)</tspan></text>
<rect x="60.0" y="345.0" width="230.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="374.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">AAGUID (16 байтів)</tspan><tspan x="175.0" dy="14.3">Ідентифікатор моделі</tspan><tspan x="175.0" dy="14.3">автентифікатора</tspan><tspan x="175.0" dy="14.3">(або нулі для Passkey)</tspan></text>
<rect x="305.0" y="345.0" width="170.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">credIdLength (2 байти)</tspan><tspan x="390.0" dy="13.0">Довжина ідентифікатора</tspan><tspan x="390.0" dy="13.0">ключа (uint16 BE, L байтів)</tspan></text>
<rect x="490.0" y="345.0" width="200.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">credentialId (L байтів)</tspan><tspan x="590.0" dy="14.3">Унікальний ID ключа,</tspan><tspan x="590.0" dy="14.3">який видає пристрій</tspan></text>
<rect x="705.0" y="345.0" width="235.0" height="95.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="822.5" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="822.5" dy="0.0">credentialPublicKey</tspan><tspan x="822.5" dy="14.3">Відкритий ключ у форматі</tspan><tspan x="822.5" dy="14.3">COSE / CBOR (kty, alg, x, y)</tspan></text>
</svg>