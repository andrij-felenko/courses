<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="370.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="43.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Пам'ять застосунку (8 байтів)</tspan><tspan x="215.0" dy="15.6">Адреси: 0x1000 ... 0x1007</tspan><tspan x="215.0" dy="15.6">[ B0 | B1 | B2 | B3 | B4 | B5 | B6 | B7 ]</tspan></text>
<rect x="430.0" y="25.0" width="410.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="43.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">Формула адресації тіні (x86-64):</tspan><tspan x="635.0" dy="15.6">Shadow = (AppAddr &gt;&gt; 3) + 0x7fff8000</tspan><tspan x="635.0" dy="15.6">Масштаб 1:8 (1 байт тіні на 8 байтів ОЗП)</tspan></text>
<line x1="215.0" y1="95.0" x2="215.0" y2="135.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="635.0" y1="90.0" x2="635.0" y2="135.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="140.0" width="370.0" height="60.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="215.0" y="166.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Тіньовий байт (1 байт за ShadowAddr)</tspan><tspan x="215.0" dy="15.6">Відповідає коміркам 0x1000..0x1007</tspan></text>
<rect x="30.0" y="215.0" width="810.0" height="105.0" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/><text x="435.0" y="235.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Словник станів тіньової пам'яті (AddressSanitizer):</tspan><tspan x="435.0" dy="14.3">  0x00      : Усі 8 байтів доступні для читання й запису (чиста виділена пам'ять)</tspan><tspan x="435.0" dy="14.3">  0x01..07  : Перші k байтів доступні, решта 8-k байтів — у червоній зоні (хвіст буфера)</tspan><tspan x="435.0" dy="14.3">  0xFD      : kAsanHeapFreeMagic — пам'ять звільнено (знаходиться в карантині)</tspan><tspan x="435.0" dy="14.3">  0xFA/0xFB : kAsanHeapLeftRedzoneMagic / kAsanHeapRightRedzoneMagic — червоні межі</tspan><tspan x="435.0" dy="14.3">  Перевірка : перед читанням/записом компілятор вставляє: if (*shadow != 0) __asan_report_error();</tspan></text>
</svg>