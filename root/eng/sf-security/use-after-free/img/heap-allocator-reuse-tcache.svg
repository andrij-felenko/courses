<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="220.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="40.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">tcache_perthread_struct</tspan><tspan x="140.0" dy="13.0">(потоковий кеш розміру 48 байт)</tspan><tspan x="140.0" dy="13.0">entry[idx] -&gt; head</tspan></text>
<rect x="310.0" y="20.0" width="230.0" height="110.0" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/><text x="425.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">Звільнений чанк 1 (0x5555...20)</tspan><tspan x="425.0" dy="15.6">-----------------------------</tspan><tspan x="425.0" dy="15.6">prev_size | size = 0x30 | P=1</tspan><tspan x="425.0" dy="15.6">fd: вказівник -&gt; 0x5555...60</tspan><tspan x="425.0" dy="15.6">(тіло блоку зберігає лінк)</tspan></text>
<rect x="610.0" y="20.0" width="230.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Звільнений чанк 2 (0x5555...60)</tspan><tspan x="725.0" dy="15.6">-----------------------------</tspan><tspan x="725.0" dy="15.6">prev_size | size = 0x30 | P=1</tspan><tspan x="725.0" dy="15.6">fd: вказівник -&gt; NULL</tspan><tspan x="725.0" dy="15.6">(кінець списку LIFO)</tspan></text>
<line x1="255.0" y1="50.0" x2="305.0" y2="50.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="545.0" y1="50.0" x2="595.0" y2="50.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="160.0" width="390.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Операція free(chunk1):</tspan><tspan x="225.0" dy="15.6">1. Алокатор записує адресу старого топа в chunk1-&gt;fd.</tspan><tspan x="225.0" dy="15.6">2. entry[idx] = chunk1 (стек LIFO).</tspan><tspan x="225.0" dy="15.6">3. Метадані не стираються, пам'ять не обнуляється.</tspan><tspan x="225.0" dy="15.6">Результат: швидке повернення без блокування арени.</tspan></text>
<rect x="450.0" y="160.0" width="400.0" height="130.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Наступний виклик malloc(32):</tspan><tspan x="650.0" dy="15.6">1. Алокатор негайно повертає chunk1 (0x5555...20).</tspan><tspan x="650.0" dy="15.6">2. entry[idx] = chunk1-&gt;fd (0x5555...60).</tspan><tspan x="650.0" dy="15.6">3. Той самий адресний діапазон видається новому об'єкту!</tspan><tspan x="650.0" dy="15.6">Наслідок: 100% передбачуваність для UAF-атаки.</tspan></text>
</svg>