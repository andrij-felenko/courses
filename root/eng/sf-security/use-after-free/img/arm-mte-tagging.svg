<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="810.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="435.0" y="49.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">64-бітний вказівник (Top-Byte-Ignore / ARM MTE)</tspan><tspan x="435.0" dy="14.3">[ 63 .. 60 | 59 .. 56 (Тег = 0x9) | 55 .. 48 (TBI) | 47 ........................... 0 (Віртуальна адреса 0x6000) ]</tspan><tspan x="435.0" dy="14.3">Логічний тег (4 біти) зберігається прямо у вказівнику</tspan></text>
<line x1="220.0" y1="105.0" x2="220.0" y2="150.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="105.0" x2="620.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="155.0" width="380.0" height="140.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Гранула ОЗП (16 байтів)</tspan><tspan x="220.0" dy="15.6">Фізичний тег алокації = 0x9</tspan><tspan x="220.0" dy="15.6">--------------------------------</tspan><tspan x="220.0" dy="15.6">Логічний тег вказівника (0x9)</tspan><tspan x="220.0" dy="15.6">== Фізичний тег пам'яті (0x9)</tspan><tspan x="220.0" dy="15.6">РЕЗУЛЬТАТ: Доступ дозволено (MATCH)</tspan></text>
<rect x="450.0" y="155.0" width="390.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="645.0" y="193.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Гранула ОЗП після free() (16 байтів)</tspan><tspan x="645.0" dy="14.3">Фізичний тег оновлено на = 0x4</tspan><tspan x="645.0" dy="14.3">--------------------------------</tspan><tspan x="645.0" dy="14.3">Завислий вказівник має тег 0x9</tspan><tspan x="645.0" dy="14.3">0x9 != 0x4 (TAG MISMATCH!)</tspan><tspan x="645.0" dy="14.3">РЕЗУЛЬТАТ: Апаратне переривання SIGSEGV (SEGV_MTESERR)</tspan></text>
</svg>