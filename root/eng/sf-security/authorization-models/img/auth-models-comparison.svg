<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняльна таблиця моделей авторизації: DAC, MAC, RBAC, ABAC, ReBAC</text>
<text x="640.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектурних моделей авторизації</text>
<text x="640.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">від статичного списку власника до динамічного обходу графа зв'язків</text>
<rect x="48.0" y="110.9" width="224.0" height="48.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="160.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">DAC</tspan><tspan x="160.0" dy="18.2">(Дискреційна)</tspan></text>
<rect x="48.0" y="170.2" width="224.0" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Власник ресурсу</tspan><tspan x="160.0" dy="15.6">(POSIX, ACL)</tspan></text>
<rect x="48.0" y="238.0" width="224.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Списки на файлах / інодах</tspan></text>
<rect x="48.0" y="294.2" width="224.0" height="43.6" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Простота, автономність</tspan><tspan x="160.0" dy="15.6">власника</tspan></text>
<rect x="48.0" y="364.2" width="224.0" height="43.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Троянські коні, втрата</tspan><tspan x="160.0" dy="15.6">контролю, deputy</tspan></text>
<rect x="288.0" y="110.9" width="224.0" height="48.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="400.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">MAC</tspan><tspan x="400.0" dy="18.2">(Обов'язкова)</tspan></text>
<rect x="288.0" y="170.2" width="224.0" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Центральні мітки</tspan><tspan x="400.0" dy="15.6">(Bell-LaPadula, MLS)</tspan></text>
<rect x="288.0" y="238.0" width="224.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Політики ядра (SELinux)</tspan></text>
<rect x="288.0" y="294.2" width="224.0" height="43.6" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Захист таємниці й</tspan><tspan x="400.0" dy="15.6">цілісності, стійкість</tspan></text>
<rect x="288.0" y="364.2" width="224.0" height="43.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Жорсткість, розмітка</tspan><tspan x="400.0" dy="15.6">всього стану системи</tspan></text>
<rect x="528.0" y="110.9" width="224.0" height="48.2" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="2.0"/><text x="640.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">RBAC</tspan><tspan x="640.0" dy="18.2">(Рольова)</tspan></text>
<rect x="528.0" y="170.2" width="224.0" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Ролі як прошарок</tspan><tspan x="640.0" dy="15.6">(NIST ANSI 359)</tspan></text>
<rect x="528.0" y="238.0" width="224.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Таблиці зв'язків User-Role</tspan></text>
<rect x="528.0" y="294.2" width="224.0" height="43.6" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Зручне адміністрування</tspan><tspan x="640.0" dy="15.6">організацій</tspan></text>
<rect x="528.0" y="364.2" width="224.0" height="43.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Вибух кількості ролей</tspan><tspan x="640.0" dy="15.6">при ускладненні умов</tspan></text>
<rect x="768.0" y="110.9" width="224.0" height="48.2" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="2.0"/><text x="880.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">ABAC</tspan><tspan x="880.0" dy="18.2">(Атрибутна)</tspan></text>
<rect x="768.0" y="170.2" width="224.0" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Предикати над даними</tspan><tspan x="880.0" dy="15.6">(NIST SP 800-162)</tspan></text>
<rect x="768.0" y="238.0" width="224.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Движки правил (OPA/Rego)</tspan></text>
<rect x="768.0" y="294.2" width="224.0" height="43.6" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Гнучкість, врахування</tspan><tspan x="880.0" dy="15.6">контексту й часу</tspan></text>
<rect x="768.0" y="364.2" width="224.0" height="43.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="880.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Важкий зворотний пошук,</tspan><tspan x="880.0" dy="15.6">обчислювальна ціна</tspan></text>
<rect x="1008.0" y="110.9" width="224.0" height="48.2" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="2.0"/><text x="1120.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1120.0" dy="0.0">ReBAC</tspan><tspan x="1120.0" dy="18.2">(На зв'язках)</tspan></text>
<rect x="1008.0" y="170.2" width="224.0" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1120.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">Граф кортежів</tspan><tspan x="1120.0" dy="15.6">(Google Zanzibar)</tspan></text>
<rect x="1008.0" y="238.0" width="224.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1120.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">Сховище зв'язків (Spanner)</tspan></text>
<rect x="1008.0" y="294.2" width="224.0" height="43.6" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="1120.0" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">Масштабованість ділення,</tspan><tspan x="1120.0" dy="15.6">вкладені ієрархії</tspan></text>
<rect x="1008.0" y="364.2" width="224.0" height="43.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1120.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">Ціна обходу графа,</tspan><tspan x="1120.0" dy="15.6">потреба в кешуванні</tspan></text>
<line x1="48.0" y1="505.0" x2="1232.0" y2="505.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="1230.0" y1="505.0" x2="1236.0" y2="505.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="50.0" y1="505.0" x2="44.0" y2="505.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="48.0" y="531.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Лінійний доступ: проста перевірка O(1), прямий аудит</text>
<text x="1232.0" y="531.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">Графова й обчислювальна авторизація: динамічний вивід, складна модель даних</text>
<text x="640.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерій вибору моделі визначається структурою зв'язків між суб'єктами та об'єктами:</text>
<text x="640.0" y="608.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ієрархічні папки й спільне володіння вимагають ReBAC; суворі правила часу/IP — ABAC; посадові інструкції — RBAC</text>
<text x="640.0" y="634.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">політику безпеки ядра й військових систем тримає MAC; локальні файли користувачів захищає DAC</text>
</svg>