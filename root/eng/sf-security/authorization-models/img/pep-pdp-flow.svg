<rect x="17.4" y="324.6" width="185.2" height="70.8" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="347.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Цільовий ресурс /</tspan><tspan x="110.0" dy="16.9">Бізнес-логіка</tspan><tspan x="110.0" dy="16.9">(Виконання операції)</tspan></text>
<rect x="573.8" y="139.7" width="292.4" height="100.6" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="2.4"/><text x="720.0" y="167.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">PDP</tspan><tspan x="720.0" dy="18.2">Точка ухвалення рішення</tspan><tspan x="720.0" dy="18.2">(Policy Decision Point)</tspan><tspan x="720.0" dy="18.2">Движок правил / OPA / Zanzibar</tspan></text>
<rect x="610.0" y="308.4" width="220.0" height="63.2" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">L1/L2 Кеш вердиктів</tspan><tspan x="720.0" dy="15.6">(Мемоізація, TTL, Zookies,</tspan><tspan x="720.0" dy="15.6">Негативний кеш)</tspan></text>
<rect x="933.2" y="146.2" width="233.6" height="87.7" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="1050.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">PIP</tspan><tspan x="1050.0" dy="16.9">Точка інформації</tspan><tspan x="1050.0" dy="16.9">(Policy Information Point)</tspan><tspan x="1050.0" dy="16.9">База даних / LDAP / IdP</tspan></text>
<rect x="579.0" y="436.1" width="281.9" height="87.7" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="459.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">PAP</tspan><tspan x="720.0" dy="16.9">Точка адміністрування</tspan><tspan x="720.0" dy="16.9">(Policy Administration Point)</tspan><tspan x="720.0" dy="16.9">GitOps / Репозиторій правил / CI</tspan></text>
<rect x="260.0" y="448.4" width="200.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="468.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Журнал аудиту</tspan><tspan x="360.0" dy="15.6">(Audit Sink / SIEM)</tspan><tspan x="360.0" dy="15.6">Незмінний запис вердикту</tspan></text>
