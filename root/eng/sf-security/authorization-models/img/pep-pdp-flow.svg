<text x="265.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5a. Якщо Permit</text>
<line x1="360.0" y1="260.0" x2="360.0" y2="440.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="415.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">5b. Лог події</text>
<text x="600.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Принцип Fail-Close (відмова за замовчанням): при втраті зв'язку з PDP/PIP або помилці парсингу PEP ОБОВ'ЯЗКОВО повертає DENY</text>
<text x="600.0" y="595.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Жодна деградація мережі не має відкривати доступ до ресурсу без дійсного авторизаційного підтвердження</text>
