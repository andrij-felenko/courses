<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння моделей стійкості: Plaintext vs HTTP Digest vs SCRAM</text>
<rect x="40.0" y="60.0" width="270.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="175.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Відкритий пароль / CRAM-MD5</text>
<rect x="335.0" y="60.0" width="270.0" height="40.0" rx="6" fill="#fff2e6" stroke="#d35400" stroke-width="1.2"/>
<text x="470.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">HTTP Digest (RFC 7616 / HA1)</text>
<rect x="630.0" y="60.0" width="270.0" height="40.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="765.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">SCRAM-SHA-256 (RFC 7677)</text>
<text x="470.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що зберігається в базі даних сервера?</text>
<rect x="40.0" y="140.0" width="270.0" height="85.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Зберігається відкритий пароль</tspan><tspan x="175.0" dy="13.0">(CRAM-MD5 потребує його для HMAC)</tspan><tspan x="175.0" dy="13.0"></tspan><tspan x="175.0" dy="13.0">Наслідок витоку:</tspan><tspan x="175.0" dy="13.0">Миттєвий повний компромат усіх акаунтів</tspan></text>
<rect x="335.0" y="140.0" width="270.0" height="85.0" rx="6" fill="#fff9f5" stroke="#d35400" stroke-width="1.5"/><text x="470.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Зберігається HA1 = MD5(user:realm:pass)</tspan><tspan x="470.0" dy="13.0">(Геш без солі або зі слабким захистом)</tspan><tspan x="470.0" dy="13.0"></tspan><tspan x="470.0" dy="13.0">Наслідок витоку:</tspan><tspan x="470.0" dy="13.0">Pass-the-Hash: HA1 сам є ключем входу!</tspan></text>
<rect x="630.0" y="140.0" width="270.0" height="85.0" rx="6" fill="#f5fff9" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Зберігаються Salt, i, StoredKey, ServerKey</tspan><tspan x="765.0" dy="13.0">(StoredKey = SHA-256(ClientKey))</tspan><tspan x="765.0" dy="13.0"></tspan><tspan x="765.0" dy="13.0">Наслідок витоку:</tspan><tspan x="765.0" dy="13.0">StoredKey НЕ дозволяє увійти клієнтом!</tspan></text>
<text x="470.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що бачить зловмисник у мережевому трафіку?</text>
<rect x="40.0" y="260.0" width="270.0" height="85.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Plaintext: бачить чистий пароль.</tspan><tspan x="175.0" dy="13.0">CRAM-MD5: бачить HMAC(Pass, Challenge).</tspan><tspan x="175.0" dy="13.0"></tspan><tspan x="175.0" dy="13.0">Захист від перебору:</tspan><tspan x="175.0" dy="13.0">Швидкий офлайн MD5-перебір за словником</tspan></text>
<rect x="335.0" y="260.0" width="270.0" height="85.0" rx="6" fill="#fff9f5" stroke="#d35400" stroke-width="1.5"/><text x="470.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Бачить nonce, cnonce, response.</tspan><tspan x="470.0" dy="13.0"></tspan><tspan x="470.0" dy="13.0">Захист від перебору:</tspan><tspan x="470.0" dy="13.0">Офлайн перебір одного раунду MD5/SHA-256</tspan><tspan x="470.0" dy="13.0">(Мільйони гешів на секунду на GPU)</tspan></text>
<rect x="630.0" y="260.0" width="270.0" height="85.0" rx="6" fill="#f5fff9" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Бачить nonces, salt, i, ClientProof.</tspan><tspan x="765.0" dy="13.0"></tspan><tspan x="765.0" dy="13.0">Захист від перебору:</tspan><tspan x="765.0" dy="13.0">Офлайн перебір вимагає i ітерацій PBKDF2</tspan><tspan x="765.0" dy="13.0">для кожного пароля-кандидата!</tspan></text>
<text x="470.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємна перевірка та стійкість до посередника (MITM)</text>
<rect x="40.0" y="380.0" width="270.0" height="85.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Взаємна автентифікація: Відсутня.</tspan><tspan x="175.0" dy="13.0">Сервер ніяк не доводить знання пароля.</tspan><tspan x="175.0" dy="13.0"></tspan><tspan x="175.0" dy="13.0">Захист від MITM:</tspan><tspan x="175.0" dy="13.0">Повністю відсутній</tspan></text>
<rect x="335.0" y="380.0" width="270.0" height="85.0" rx="6" fill="#fff9f5" stroke="#d35400" stroke-width="1.5"/><text x="470.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Взаємна автентифікація: Обмежена (rspauth).</tspan><tspan x="470.0" dy="13.0">Складна та рідко реалізована.</tspan><tspan x="470.0" dy="13.0"></tspan><tspan x="470.0" dy="13.0">Захист від MITM:</tspan><tspan x="470.0" dy="13.0">Немає зв'язування з каналом TLS</tspan></text>
<rect x="630.0" y="380.0" width="270.0" height="85.0" rx="6" fill="#f5fff9" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="402.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Взаємна автентифікація: Вбудована (ServerSignature).</tspan><tspan x="765.0" dy="11.7">Сервер доводить володіння ServerKey.</tspan><tspan x="765.0" dy="11.7"></tspan><tspan x="765.0" dy="11.7">Захист від MITM:</tspan><tspan x="765.0" dy="11.7">SCRAM-PLUS з прив'язкою до каналу TLS (RFC 5929)</tspan></text>
</svg>