<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний протокольний обмін SCRAM (два оберти повідомлень)</text>
<rect x="40.0" y="55.0" width="230.0" height="480.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="155.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Клієнт (Client)</text>
<text x="155.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Володіє паролем Password</text>
<rect x="690.0" y="55.0" width="230.0" height="480.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="805.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Сервер (Server)</text>
<text x="805.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">База: Salt, i, StoredKey, ServerKey</text>
<line x1="155.0" y1="115.0" x2="155.0" y2="290.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="155.0" y1="360.0" x2="155.0" y2="520.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="805.0" y1="115.0" x2="805.0" y2="190.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="805.0" y1="245.0" x2="805.0" y2="410.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="805.0" y1="480.0" x2="805.0" y2="520.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="155.0" y1="150.0" x2="800.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="317.1" y="128.5" width="325.7" height="23.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">1. client-first-message: n,,n=alice,r=r1_nonce</tspan></text>
<text x="480.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">GS2-заголовок (n,,) + ім'я користувача alice + випадковий виклик r1</text>
<rect x="700.0" y="195.0" width="210.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Вибірка з БД за іменем:</tspan><tspan x="805.0" dy="11.7">знаходить Salt, i, StoredKey, ServerKey</tspan><tspan x="805.0" dy="11.7">генерує свій виклик r2</tspan></text>
<line x1="805.0" y1="260.0" x2="160.0" y2="260.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="272.8" y="238.5" width="414.4" height="23.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="253.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">2. server-first-message: r=r1_nonce||r2_nonce,s=salt,i=4096</tspan></text>
<text x="480.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Об'єднаний виклик r1||r2 + сіль користувача s + число ітерацій i</text>
<rect x="50.0" y="295.0" width="210.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="304.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">SaltedPassword = PBKDF2(Pass, s, i)</tspan><tspan x="155.0" dy="11.7">ClientKey = HMAC(SaltedPass, 'Client Key')</tspan><tspan x="155.0" dy="11.7">StoredKey = H(ClientKey)</tspan><tspan x="155.0" dy="11.7">ClientSig = HMAC(StoredKey, AuthMessage)</tspan><tspan x="155.0" dy="11.7">ClientProof = ClientKey XOR ClientSig</tspan></text>
<line x1="155.0" y1="385.0" x2="800.0" y2="385.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="248.9" y="363.5" width="462.1" height="23.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">3. client-final-message: c=biws,r=r1_nonce||r2_nonce,p=ClientProof</tspan></text>
<text x="480.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Канал зв'язку c=biws (Base64 'n,,') + виклик r + замаскований доказ p</text>
<rect x="700.0" y="415.0" width="210.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="430.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">ClientSig = HMAC(StoredKey, AuthMessage)</tspan><tspan x="805.0" dy="11.7">ClientKey' = ClientProof XOR ClientSig</tspan><tspan x="805.0" dy="11.7">Перевірка: H(ClientKey') == StoredKey</tspan><tspan x="805.0" dy="11.7">ServerSig = HMAC(ServerKey, AuthMessage)</tspan></text>
<line x1="805.0" y1="495.0" x2="160.0" y2="495.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="330.8" y="473.5" width="298.4" height="23.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="488.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">4. server-final-message: v=ServerSignature</tspan></text>
<text x="480.0" y="517.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Підтвердження сервера v: клієнт перевіряє ServerSig == HMAC(ServerKey, AuthMessage)</text>
</svg>