<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево виведення ключів та формування доказів у SCRAM</text>
<rect x="270.5" y="60.5" width="419.0" height="29.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Вхідні дані: Password + Salt + Iteration count (i)</tspan></text>
<line x1="480.0" y1="95.0" x2="480.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="545.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">PBKDF2-HMAC-SHA-256</text>
<rect x="301.9" y="137.0" width="356.2" height="26.0" rx="6" fill="#fff2e6" stroke="#d35400" stroke-width="1.5"/><text x="480.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">SaltedPassword = PBKDF2(Password, Salt, i, 32)</tspan></text>
<line x1="410.0" y1="170.0" x2="240.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="285.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HMAC(..., 'Client Key')</text>
<line x1="550.0" y1="170.0" x2="720.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="675.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HMAC(..., 'Server Key')</text>
<rect x="77.1" y="223.5" width="325.7" height="23.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">ClientKey = HMAC(SaltedPassword, 'Client Key')</tspan></text>
<rect x="557.1" y="223.5" width="325.7" height="23.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">ServerKey = HMAC(SaltedPassword, 'Server Key')</tspan></text>
<line x1="240.0" y1="258.0" x2="240.0" y2="305.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="285.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">H = SHA-256</text>
<rect x="131.7" y="313.5" width="216.6" height="23.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">StoredKey = SHA-256(ClientKey)</tspan></text>
<rect x="100.0" y="355.0" width="760.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
<text x="480.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Зберігається в базі даних сервера: Salt, i, StoredKey, ServerKey</text>
<text x="480.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сервер НЕ володіє Password, SaltedPassword та ClientKey (односторонній геш SHA-256)</text>
<line x1="240.0" y1="400.0" x2="240.0" y2="435.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="355.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ClientSignature = HMAC(StoredKey, AuthMessage)</text>
<rect x="87.4" y="446.4" width="305.3" height="37.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="461.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">ClientProof = ClientKey XOR ClientSignature</tspan><tspan x="240.0" dy="14.3">(Надсилається клієнтом у мережу)</tspan></text>
<line x1="720.0" y1="400.0" x2="720.0" y2="435.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="720.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HMAC над AuthMessage</text>
<rect x="557.1" y="446.4" width="325.7" height="37.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="461.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">ServerSignature = HMAC(ServerKey, AuthMessage)</tspan><tspan x="720.0" dy="14.3">(Надсилається сервером для взаємного доказу)</tspan></text>
</svg>