<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">\n<rect x="0" y="0" width="960" height="480" fill="white"/>\n<defs>\n<marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>\n<marker id="arr-prob" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>\n<marker id="arr-ok" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/></marker>\n<marker id="arr-acc" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/></marker>\n</defs>\n<text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура мікрокристала Secure Element із PUF</text>\n<text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Захищений чип генерує ключ фізичною матрицею та криптографічно спілкується з головним процесором</text>\n<rect x="40" y="150" width="160" height="200" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>\n<text x="120" y="175" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Host MCU</text>\n<rect x="60" y="200" width="120" height="40" fill="white" stroke="#d0d7de" stroke-width="2"/>\n<text x="120" y="225" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Дайджест даних</text>\n<rect x="60" y="260" width="120" height="40" fill="white" stroke="#d0d7de" stroke-width="2"/>\n<text x="120" y="285" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Стек додатку</text>\n<line x1="200" y1="220" x2="310" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-acc)"/>\n<text x="255" y="210" font-size="12" font-weight="normal" fill="#2457d6" text-anchor="middle">Зашифрований</text>\n<text x="255" y="240" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="middle">I2C / SPI</text>\n<line x1="310" y1="280" x2="200" y2="280" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-ok)"/>\n<text x="255" y="270" font-size="12" font-weight="normal" fill="#27ae60" text-anchor="middle">Цифровий підпис</text>\n<rect x="320" y="80" width="600" height="350" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,5"/>\n<text x="620" y="105" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Active Shield Wire Mesh (Тампер-захист)</text>\n<rect x="340" y="120" width="560" height="290" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>\n<text x="620" y="145" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Secure Element</text>\n<rect x="700" y="170" width="160" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>\n<text x="780" y="195" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">PUF-матриця</text>\n<text x="780" y="215" font-size="12" font-weight="normal" fill="#2457d6" text-anchor="middle">Фізичний відгук</text>\n<line x1="780" y1="230" x2="780" y2="250" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>\n<rect x="700" y="260" width="160" height="60" fill="white" stroke="#d0d7de" stroke-width="2"/>\n<text x="780" y="285" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Нечіткий</text>\n<text x="780" y="305" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">екстрактор</text>\n<line x1="700" y1="290" x2="650" y2="290" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>\n<rect x="510" y="270" width="130" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>\n<text x="575" y="295" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Майстер-ключ</text>\n<line x1="575" y1="270" x2="575" y2="240" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>\n<rect x="380" y="180" width="300" height="50" fill="white" stroke="#d0d7de" stroke-width="2"/>\n<text x="530" y="200" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратне шифрувальне ядро</text>\n<text x="530" y="220" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="middle">(AES, ECDH, ECDSA)</text>\n<line x1="320" y1="220" x2="370" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-acc)"/>\n<line x1="370" y1="280" x2="320" y2="280" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-ok)"/>\n<path d="M 380 205 L 360 205 L 360 280 L 380 280" fill="none" stroke="#1a1a1a" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>\n</svg>