<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема синдромного декодування Fuzzy Extractor</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Фази реєстрації (Gen) та відтворення (Rep) з використанням Helper Data для усунення помилок</text>

  <!-- Section 1: Enrollment (Gen) -->
  <g>
    <rect x="40" y="110" width="880" height="130" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="60" y="135" font-size="14" font-weight="bold" fill="#2457d6">Фаза 1: Реєстрація (Enrollment / Gen)</text>

    <rect x="70" y="150" width="180" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="160" y="180" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сирий відгук R</text>
    <text x="160" y="200" font-size="11" fill="#6b7280" text-anchor="middle">Первинні біти PUF</text>

    <rect x="300" y="150" width="240" height="70" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="420" y="180" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Зсув коду W = R ⊕ C</text>
    <text x="420" y="200" font-size="11" fill="#6b7280" text-anchor="middle">Генерація Helper Data</text>

    <rect x="590" y="150" width="280" height="70" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="730" y="180" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Helper Data W  |  Ключ K</text>
    <text x="730" y="200" font-size="11" fill="#6b7280" text-anchor="middle">W зберігається, K — секрет</text>
  </g>

  <!-- Section 2: Reproduction (Rep) -->
  <g>
    <rect x="40" y="270" width="880" height="130" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="60" y="295" font-size="14" font-weight="bold" fill="#c0392b">Фаза 2: Відтворення (Reproduction / Rep)</text>

    <rect x="70" y="310" width="180" height="70" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="160" y="340" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Шумний відгук R'</text>
    <text x="160" y="360" font-size="11" fill="#6b7280" text-anchor="middle">R' = R ⊕ E (помилки)</text>

    <rect x="300" y="310" width="240" height="70" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="420" y="340" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Decode(R' ⊕ W)</text>
    <text x="420" y="360" font-size="11" fill="#6b7280" text-anchor="middle">Синдромне декодування</text>

    <rect x="590" y="310" width="280" height="70" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
    <text x="730" y="340" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Відновлений ключ K</text>
    <text x="730" y="360" font-size="11" fill="#6b7280" text-anchor="middle">Повне усунення помилок E</text>
  </g>

  <!-- Arrows -->
  <path d="M 250 185 L 300 185" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <path d="M 540 185 L 590 185" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <path d="M 250 345 L 300 345" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <path d="M 540 345 L 590 345" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-main)"/>

  <path d="M 730 220 L 420 310" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4" marker-end="url(#arr-main)"/>

</svg>
