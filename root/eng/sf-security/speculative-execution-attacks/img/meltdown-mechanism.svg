<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікроархітектурний витік пам'яті ядра в атаці Meltdown</text>
<rect x="11.1" y="55.6" width="457.8" height="78.8" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Код у просторі користувача (Ring 3):</tspan><tspan x="240.0" dy="15.6">1: mov al, byte [kernel_ptr]   ; Читання забороненої адреси ядра</tspan><tspan x="240.0" dy="15.6">2: shl rax, 12                 ; rax = секрет * 4096 байт</tspan><tspan x="240.0" dy="15.6">3: mov rbx, [probe + rax]      ; Звернення до масиву-зонда</tspan></text>
<rect x="490.0" y="60.0" width="340.0" height="390.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="660.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний конвеєр процесора (OoO Core)</text>
<rect x="505.0" y="115.0" width="150.0" height="240.0" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/>
<text x="580.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Транзитне виконання</text>
<text x="580.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">L1D Cache Hit</text>
<text x="580.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Байт ядра віддано</text>
<text x="580.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">в транзитний регістр</text>
<line x1="580.0" y1="215.0" x2="580.0" y2="245.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="580.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Forwarding інструкції 3:</text>
<text x="580.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">probe[secret * 4096]</text>
<text x="580.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">завантажено в L1D!</text>
<text x="580.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">[Слід у кеші закріплено]</text>
<rect x="670.0" y="115.0" width="145.0" height="240.0" rx="6" fill="#edf2fc" stroke="#2457d6" stroke-width="1.5"/>
<text x="742.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Перевірка прав (MMU)</text>
<text x="742.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Читання біта U/S</text>
<text x="742.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">у таблиці сторінок</text>
<text x="742.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Виявлено порушення:</text>
<text x="742.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">User mode читає Ring 0</text>
<line x1="742.0" y1="250.0" x2="742.0" y2="275.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="742.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Генерація виключення</text>
<text x="742.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">#PF (Page Fault)</text>
<text x="742.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">при Commit у ROB</text>
<rect x="505.0" y="370.0" width="310.0" height="65.0" rx="6" fill="#fbf0f0" stroke="#c0392b" stroke-width="2.0"/>
<text x="660.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Скидання архітектурного стану (ROB Squash)</text>
<text x="660.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Регістри al, rax, rbx скасовано. АЛЕ кеш L1D НЕ очищено!</text>
<rect x="25.0" y="250.0" width="430.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Фізична причина шпарини:</tspan><tspan x="240.0" dy="15.6">L1D Data Cache віддає байти залежним інструкціям</tspan><tspan x="240.0" dy="15.6">до того, як MMU завершить перевірку прав доступу.</tspan><tspan x="240.0" dy="15.6"></tspan><tspan x="240.0" dy="15.6">Архітектурно: програма отримує сигнал SIGSEGV.</tspan><tspan x="240.0" dy="15.6">Мікроархітектурно: секретний байт витік у кеш.</tspan></text>
</svg>