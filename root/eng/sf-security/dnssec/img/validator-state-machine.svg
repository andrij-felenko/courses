<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стани валідації резолвера та формування прапорців AD / SERVFAIL</text>
<rect x="293.1" y="61.2" width="473.8" height="47.6" rx="6" fill="#eef3fb" stroke="#3b82f6" stroke-width="1.5"/><text x="530.0" y="81.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Отримано відповідь DNS із секціями Answer, Authority та RRSIG</tspan><tspan x="530.0" dy="15.6">(Клієнт надіслав запит з EDNS0 DO=1 «DNSSEC OK»)</tspan></text>
<line x1="530.0" y1="120.0" x2="530.0" y2="160.0" stroke="#3b82f6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="308.0" y="179.0" width="444.1" height="32.0" rx="6" fill="#fdf3e6" stroke="#d97706" stroke-width="1.5"/><text x="530.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Чи делеговано зону з криптографічним DS-записом у батька?</tspan></text>
<line x1="340.0" y1="195.0" x2="200.0" y2="195.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="200.0" y1="195.0" x2="200.0" y2="270.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Ні (Непідписана)</text>
<rect x="61.5" y="308.8" width="277.1" height="102.5" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="200.0" y="328.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Стан: INSECURE</tspan><tspan x="200.0" dy="14.3"></tspan><tspan x="200.0" dy="14.3">Зона або домен законно не використовує</tspan><tspan x="200.0" dy="14.3">DNSSEC (є валідний доказ відсутності DS).</tspan><tspan x="200.0" dy="14.3">Відповідь повертається клієнту</tspan><tspan x="200.0" dy="14.3">із прапорцем AD = 0 (Не автентифіковано).</tspan></text>
<line x1="530.0" y1="230.0" x2="530.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="610.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Так (Підписана)</text>
<rect x="360.1" y="303.1" width="339.8" height="73.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="315.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Перевірка ланцюга: DS → KSK → ZSK → RRSIG(Data)</tspan><tspan x="530.0" dy="14.3">1. Чи чинні часові мітки Inception / Expiration?</tspan><tspan x="530.0" dy="14.3">2. Чи збігаються хеші DS та відкритий ключ KSK?</tspan><tspan x="530.0" dy="14.3">3. Чи математично сходиться підпис RRSIG над RRset?</tspan></text>
<line x1="720.0" y1="340.0" x2="840.0" y2="340.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="840.0" y1="340.0" x2="840.0" y2="420.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="737.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Усі підписи валідні</text>
<rect x="710.9" y="448.8" width="258.3" height="102.5" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="840.0" y="468.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Стан: SECURE</tspan><tspan x="840.0" dy="14.3"></tspan><tspan x="840.0" dy="14.3">Дані автентичні й цілісні.</tspan><tspan x="840.0" dy="14.3">Ланцюг перевірено до кореня.</tspan><tspan x="840.0" dy="14.3">Резолвер встановлює у відповіді</tspan><tspan x="840.0" dy="14.3">прапорець AD = 1 (Authenticated Data).</tspan></text>
<line x1="340.0" y1="340.0" x2="490.0" y2="420.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="460.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Незбіг підпису / час минув</text>
<rect x="360.9" y="448.8" width="258.3" height="102.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="468.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Стан: BOGUS</tspan><tspan x="490.0" dy="14.3"></tspan><tspan x="490.0" dy="14.3">Підпис сфальсифіковано, ключ підмінено</tspan><tspan x="490.0" dy="14.3">або термін RRSIG вичерпано.</tspan><tspan x="490.0" dy="14.3">Резолвер БЛОКУЄ відповідь і повертає</tspan><tspan x="490.0" dy="14.3">клієнту помилку SERVFAIL (RCODE 2).</tspan></text>
<text x="530.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Якщо клієнт надсилає прапорець CD=1 (Checking Disabled), резолвер повертає Bogus-дані для локальної діагностики</text>
</svg>