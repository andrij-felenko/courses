<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому DNSSEC підписує весь RRset як неподільний блок даних</text>
<rect x="102.8" y="63.5" width="334.3" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Помилкова схема: підпис окремих записів</tspan></text>
<rect x="175.4" y="122.3" width="189.3" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">example.com. IN A 193.0.2.1</tspan><tspan x="270.0" dy="14.3">+ SIG(Record 1)</tspan></text>
<rect x="175.4" y="192.3" width="189.3" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">example.com. IN A 193.0.2.2</tspan><tspan x="270.0" dy="14.3">+ SIG(Record 2)</tspan></text>
<rect x="159.7" y="262.4" width="220.6" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="281.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">example.com. IN AAAA 2001:db8::1</tspan><tspan x="270.0" dy="14.3">+ SIG(Record 3)</tspan></text>
<rect x="112.7" y="365.9" width="314.7" height="88.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="385.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Вразливість до вирізання (Stripping Attack):</tspan><tspan x="270.0" dy="14.3">Зловмисник перехоплює відповідь і викидає</tspan><tspan x="270.0" dy="14.3">запис AAAA та один із записів A.</tspan><tspan x="270.0" dy="14.3">Клієнт перевіряє валідний підпис для залишеного</tspan><tspan x="270.0" dy="14.3">запису A і не підозрює, що відповідь обрізано!</tspan></text>
<line x1="540.0" y1="70.0" x2="540.0" y2="560.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="646.9" y="63.5" width="326.3" height="33.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Канонічний DNSSEC: підпис набору RRset</tspan></text>
<rect x="590.0" y="120.0" width="440.0" height="160.0" rx="6" fill="#eef3fb" stroke="#3b82f6" stroke-width="1.5"/>
<text x="810.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Єдиний неподільний блок RRset (тип A):</text>
<text x="810.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1. example.com. 3600 IN A 193.0.2.1</text>
<text x="810.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2. example.com. 3600 IN A 193.0.2.2</text>
<text x="810.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3. example.com. 3600 IN A 193.0.2.3</text>
<text x="810.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Канонічне сортування за двійковим представленням RDATA)</text>
<line x1="810.0" y1="285.0" x2="810.0" y2="325.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="900.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Підписується ZSK</text>
<rect x="637.0" y="358.8" width="346.0" height="102.5" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Запис RRSIG(A):</tspan><tspan x="810.0" dy="14.3">• Type Covered: A | Algorithm: 13 (ECDSA P-256)</tspan><tspan x="810.0" dy="14.3">• Labels: 2 | Original TTL: 3600</tspan><tspan x="810.0" dy="14.3">• Signature Expiration: 2026-09-01 00:00:00</tspan><tspan x="810.0" dy="14.3">• Key Tag: 34129 | Signer: example.com.</tspan><tspan x="810.0" dy="14.3">• Signature: [Криптографічний підпис над усім RRset]</tspan></text>
<text x="540.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будь-яка зміна, додавання або видалення хоча б одного запису з набору робить RRSIG недійсним</text>
</svg>