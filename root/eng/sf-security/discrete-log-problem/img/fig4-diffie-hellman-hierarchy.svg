<line x1="530.0" y1="130.0" x2="565.0" y2="130.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="547.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e08a1e" text-anchor="middle" font-weight="700">Зведення</text>
<rect x="196.8" y="210.2" width="446.4" height="59.6" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="420.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Відношення складності: DLP ≥ CDH ≥ DDH</tspan><tspan x="420.0" dy="14.3">Якщо DLP легко розв'язується → CDH і DDH миттєво ламаються.</tspan><tspan x="420.0" dy="14.3">Безпека протоколів ElGamal та DH спирається на стійкість CDH та DDH.</tspan></text>
