<rect x="10.0" y="10.0" width="820.0" height="300.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Ієрархія складності криптографічних припущень Діффі — Геллмана</text>
<rect x="50.9" y="93.0" width="238.2" height="73.9" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="170.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">DLP (Discrete Logarithm Problem)</tspan><tspan x="170.0" dy="14.3">Дано: g, gᵃ mod p</tspan><tspan x="170.0" dy="14.3">Знайти: a</tspan><tspan x="170.0" dy="14.3">НАЙВАЖЧА ЗАДАЧА</tspan></text>
<rect x="294.1" y="93.0" width="251.9" height="73.9" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="420.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">CDH (Computational Diffie-Hellman)</tspan><tspan x="420.0" dy="14.3">Дано: g, gᵃ, gᵇ mod p</tspan><tspan x="420.0" dy="14.3">Обчислити: gᵃᵇ mod p</tspan><tspan x="420.0" dy="14.3">ОБЧИСЛЮВАЛЬНА ЗАДАЧА</tspan></text>
<rect x="550.9" y="93.0" width="238.2" height="73.9" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="670.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">DDH (Decisional Diffie-Hellman)</tspan><tspan x="670.0" dy="14.3">Дано: g, gᵃ, gᵇ, gᶜ mod p</tspan><tspan x="670.0" dy="14.3">Визначити: c ≡ ab чи випадковий?</tspan><tspan x="670.0" dy="14.3">РОЗРІЗНЯЛЬНА ЗАДАЧА</tspan></text>
