<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парадокс швидкості гешів</text>
<rect x="30.0" y="30.0" width="370.0" height="280.0" rx="10" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="215.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Швидкі криптогеші (SHA-256, MD5)</text>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Оптимізовані під гігабайти/с</text>
<rect x="50.0" y="97.3" width="330.0" height="45.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="215.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="215.0" dy="0.0">Швидкість перебору (GPU RTX 4090):</tspan><tspan x="215.0" dy="14.3">~ 10 000 000 000 гешів/с (10 GH/s)</tspan></text>
<rect x="50.0" y="157.3" width="330.0" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="215.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Використання пам'яті: 0 байтів RAM</tspan><tspan x="215.0" dy="14.3">(стан повністю вміщується в регістри)</tspan></text>
<rect x="50.0" y="227.3" width="330.0" height="45.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Наслідок для 8-значного пароля:</tspan><tspan x="215.0" dy="14.3">Злам бази займає лічені хвилини</tspan></text>
<rect x="440.0" y="30.0" width="370.0" height="280.0" rx="10" fill="#edf7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="625.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Пам'ятевитратні KDF (Argon2id)</text>
<text x="625.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Спеціально сповільнені для паролів</text>
<rect x="460.0" y="97.3" width="330.0" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="625.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="625.0" dy="0.0">Швидкість перебору (GPU RTX 4090):</tspan><tspan x="625.0" dy="14.3">~ 20 - 50 гешів/с (при 64 МБ RAM)</tspan></text>
<rect x="460.0" y="157.3" width="330.0" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="625.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Використання пам'яті: 64 МБ на спробу</tspan><tspan x="625.0" dy="14.3">(насичує шину пам'яті GPU/ASIC)</tspan></text>
<rect x="460.0" y="227.3" width="330.0" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Наслідок для 8-значного пароля:</tspan><tspan x="625.0" dy="14.3">Злам вимагає століть та мільйонів $</tspan></text>
</svg>