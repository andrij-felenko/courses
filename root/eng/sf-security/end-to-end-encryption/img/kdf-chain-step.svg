<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок симетричного KDF-ланцюга</text>
<rect x="40.0" y="25.0" width="680.0" height="195.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="380.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один крок симетричного KDF-ланцюга: пряма секретність (PFS)</text>
<rect x="54.2" y="92.3" width="151.7" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Поточний ключ ланцюга</tspan><tspan x="130.0" dy="14.3">CK_i</tspan></text>
<line x1="210.0" y1="115.0" x2="300.0" y2="115.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="298.4" y="92.3" width="163.2" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">HMAC-SHA256</tspan><tspan x="380.0" dy="14.3">Константи 0x01 / 0x02</tspan></text>
<line x1="460.0" y1="95.0" x2="550.0" y2="95.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="565.0" y="73.5" width="130.0" height="43.0" rx="6" fill="#edf8f1" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Наступний ключ</tspan><tspan x="630.0" dy="13.0">CK_{i+1}</tspan></text>
<line x1="460.0" y1="135.0" x2="550.0" y2="135.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="565.0" y="113.5" width="130.0" height="43.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Ключ повідомлення</tspan><tspan x="630.0" dy="13.0">MK_i (AEAD)</tspan></text>
<text x="380.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ключ CK_i та MK_i негайно стираються з пам'яті після використання. Злам CK_{i+1} не дає змоги обчислити MK_i назад.</text>
</svg>