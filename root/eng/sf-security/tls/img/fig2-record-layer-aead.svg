<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="201.0" y="10.5" width="578.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="490.0" y="33.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Архітектура кадру протоколу записів TLS 1.3 та механізм AEAD</tspan></text>
<rect x="30.0" y="65.0" width="920.0" height="160.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700">Формат захищеного запису TLS 1.3 на канальному рівні (Wire Layout)</text>
<rect x="50.0" y="115.0" width="230.0" height="80.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="165.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="700">Зовнішній заголовок (5 байтів)</text>
<text x="165.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">Type: 0x17 (opaque_type)</text>
<text x="165.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">Legacy Version: 0x0303 (TLS 1.2)</text>
<text x="165.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Length: N байтів (зашифроване тіло)</text>
<rect x="290.0" y="115.0" width="410.0" height="80.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="495.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">Зашифрований корисний вантаж (Encrypted Payload)</text>
<text x="495.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">Відкритий текст (Application Data / Handshake) + Padding</text>
<text x="495.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#047857" text-anchor="middle" font-weight="700">+ Справжній тип вмісту (Inner ContentType: 1 байт у кінці)</text>
<text x="495.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-style="italic">Маскування типу та вирівнювання довжини від аналізу трафіку</text>
<rect x="710.0" y="115.0" width="220.0" height="80.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="820.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">Тег автентичності (16 байтів)</text>
<text x="820.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">AEAD Authentication Tag</text>
<text x="820.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle" font-weight="700">GCM / Poly1305 / CCM</text>
<text x="820.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Захист цілісності та заголовка</text>
<rect x="30.0" y="240.0" width="920.0" height="215.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle" font-weight="700">Математика формування Nonce та AEAD-перевірки</text>
<rect x="50.0" y="290.0" width="420.0" height="145.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="260.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="700">Синтез унікального одноразового числа (Nonce)</text>
<rect x="124.6" y="332.0" width="270.8" height="56.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="260.0" y="350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Write IV (96 біт) = iv₀ iv₁ ... iv₁₁</tspan><tspan x="260.0" dy="13.0">⊕ 64-бітний SeqNum (доповнений нулями зліва)</tspan><tspan x="260.0" dy="13.0">= Унікальний Nonce для кожного запису</tspan></text>
<text x="260.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-style="italic">Захист від атак повтору без передачі Nonce через мережу</text>
<rect x="490.0" y="290.0" width="440.0" height="145.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="710.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="middle" font-weight="700">Автентифіковане шифрування з асоційованими даними</text>
<rect x="529.0" y="332.0" width="362.0" height="56.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="710.0" y="350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Входи AEAD: Key, Nonce, Plaintext (Data || InnerType || Pad)</tspan><tspan x="710.0" dy="13.0">Асоційовані дані (AAD) = 5-байтний зовнішній заголовок</tspan><tspan x="710.0" dy="13.0">Вихід: Ciphertext || 16-байтний Auth Tag</tspan></text>
<text x="710.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-style="italic">Цілісність заголовка захищена без його шифрування</text>
</svg>