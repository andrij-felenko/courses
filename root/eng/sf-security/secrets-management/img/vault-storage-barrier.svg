<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бар'єр безпеки: конвертне шифрування та розподіл секрету Шаміра</text>
<rect x="20.0" y="40.0" width="200.0" height="270.0" rx="8" fill="#fdf6e2" stroke="#b58900" stroke-width="1.8"/>
<text x="120.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b58900" text-anchor="middle" font-weight="700">Розподіл секрету Шаміра</text>
<text x="120.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Поріг 3 з 5 часток (k з n)</text>
<rect x="35.0" y="110.0" width="170.0" height="36.0" rx="5" fill="#ffffff" stroke="#b58900" stroke-width="1.2"/>
<text x="120.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Частка 1 (Оператор A)</text>
<rect x="35.0" y="155.0" width="170.0" height="36.0" rx="5" fill="#ffffff" stroke="#b58900" stroke-width="1.2"/>
<text x="120.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Частка 2 (Оператор B)</text>
<rect x="35.0" y="200.0" width="170.0" height="36.0" rx="5" fill="#ffffff" stroke="#b58900" stroke-width="1.2"/>
<text x="120.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Частка 3 (Оператор C)</text>
<rect x="35.0" y="245.0" width="170.0" height="50.0" rx="5" fill="#f4f6f8" stroke="#94a3b8" stroke-width="1.0"/>
<text x="120.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Частки 4 та 5 (резерв)</text>
<text x="120.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">не потрібні для кворуму</text>
<rect x="260.0" y="40.0" width="290.0" height="270.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="405.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Бар'єр безпеки (RAM)</text>
<text x="405.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Пам'ять заблокована через mlock</text>
<rect x="280.0" y="110.0" width="250.0" height="65.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="405.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Головний ключ (Master Key)</text>
<text x="405.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">відновлюється з 3 часток у RAM</text>
<rect x="280.0" y="210.0" width="250.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="405.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Ключ шифрування даних (DEK)</text>
<text x="405.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">розшифровується Master Key</text>
<text x="405.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">шифрує всі записи сховища</text>
<line x1="405.0" y1="175.0" x2="405.0" y2="210.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">розшифрування</text>
<rect x="590.0" y="40.0" width="230.0" height="270.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="705.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Недовірене сховище</text>
<text x="705.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Raft / Consul / Диск / S3</text>
<rect x="610.0" y="110.0" width="190.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="705.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зашифрований DEK</text>
<text x="705.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">зашифрований на KEK</text>
<text x="705.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">безпечний для збереження</text>
<rect x="610.0" y="210.0" width="190.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="705.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шифротексти секретів</text>
<text x="705.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">AES-GCM-256 + HMAC</text>
<text x="705.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повна автентифікованість</text>
<line x1="205.0" y1="142.0" x2="280.0" y2="142.0" stroke="#b58900" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="242.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b58900" text-anchor="middle" font-weight="700">Кворум</text>
<line x1="530.0" y1="250.0" x2="610.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="570.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">I/O</text>
</svg>