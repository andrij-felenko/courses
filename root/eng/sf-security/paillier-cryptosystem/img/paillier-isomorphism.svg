<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоморфізм залишків у криптосистемі Пайє</text>
<text x="510.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгебраїчна структура ℤ_{n²}* ≅ ℤ_n × ℤ_n*</text>
<rect x="91.5" y="160.8" width="297.1" height="78.4" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="240.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Мультиплікативна група ℤ_{n²}*</tspan><tspan x="240.0" dy="18.2">Порядок: n · φ(n)</tspan><tspan x="240.0" dy="18.2">Шифротекст c = g^m · r^n mod n²</tspan></text>
<line x1="430.0" y1="200.0" x2="590.0" y2="200.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="590.0" y1="230.0" x2="430.0" y2="230.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="510.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ізоморфізм ε</text>
<text x="510.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ε(m, r) = (1+n)^m · r^n mod n²</text>
<rect x="644.6" y="104.6" width="290.8" height="70.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="790.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="790.0" dy="0.0">Аддитивна підгрупа повідомлень ℤ_n</tspan><tspan x="790.0" dy="16.9">Елементи: (1 + n)^m ≡ 1 + m·n mod n²</tspan><tspan x="790.0" dy="16.9">Порядок підгрупи: n</tspan></text>
<text x="790.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">× (прямий добуток)</text>
<rect x="618.7" y="294.6" width="342.6" height="70.8" rx="6" fill="#f4f6f8" stroke="#94a3b8" stroke-width="1.4"/><text x="790.0" y="317.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Мультиплікативна підгрупа n-х степенів ℤ_n*</tspan><tspan x="790.0" dy="16.9">Елементи: r^n mod n²</tspan><tspan x="790.0" dy="16.9">Маскування випадковим шумом r</tspan></text>
<rect x="115.0" y="403.2" width="790.0" height="33.5" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.3"/><text x="510.0" y="424.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Розділення компонентів: піднесення до степеня λ знищує маску r^n mod n², виділяючи m·λ mod n</tspan></text>
</svg>