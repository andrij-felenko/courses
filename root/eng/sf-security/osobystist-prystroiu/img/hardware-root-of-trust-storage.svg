<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектури апаратного зберігання криптографічних секретів пристрою</text>
<text x="440.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектури апаратного зберігання криптографічних секретів пристрою</text>
<rect x="30.0" y="60.0" width="260.0" height="400.0" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
<rect x="40.0" y="70.0" width="240.0" height="32.0" rx="5" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.0"/>
<text x="160.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b4f72" text-anchor="middle" font-weight="700">Дискретний Secure Element</text>
<text x="160.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">(ATECC608, Optiga Trust M)</text>
<line x1="45.0" y1="130.0" x2="275.0" y2="130.0" stroke="#d4e6f1" stroke-width="1.0"/>
<text x="45.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Окремий загартований чип</text>
<text x="45.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Інтерфейс: I2C / SPI з шифруванням</text>
<text x="45.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Апаратні акселератори ECC/RSA</text>
<text x="45.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Фізичний активний екран (Mesh)</text>
<text x="45.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Захист від DPA / зондування / збоїв</text>
<rect x="45.0" y="290.0" width="230.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.0"/>
<text x="160.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Особливість безпеки:</text>
<text x="55.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Приватний ключ фізично замкнений</text>
<text x="55.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">всередині захищеної EEPROM/Flash.</text>
<text x="55.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Головний процесор віддає хеш,</text>
<text x="55.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">а назад отримує лише підпис (R, S).</text>
<text x="55.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Ключ не потрапляє в RAM MCU.</text>
<rect x="310.0" y="60.0" width="260.0" height="400.0" rx="8" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/>
<rect x="320.0" y="70.0" width="240.0" height="32.0" rx="5" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.0"/>
<text x="440.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#512e5f" text-anchor="middle" font-weight="700">MCU ARM TrustZone-M</text>
<text x="440.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">(STM32H5/U5, NXP LPC55S)</text>
<line x1="325.0" y1="130.0" x2="555.0" y2="130.0" stroke="#e8daef" stroke-width="1.0"/>
<text x="325.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Логічна ізоляція ядра MCU</text>
<text x="325.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Secure vs Non-Secure світи (SAU)</text>
<text x="325.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Ключі в одноразових eFuse</text>
<text x="325.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Виклики через Secure Gateway (SG)</text>
<text x="325.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Апаратне блокування JTAG/SWD</text>
<rect x="325.0" y="290.0" width="230.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.0"/>
<text x="440.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Особливість безпеки:</text>
<text x="335.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Один кристал містить і логіку,</text>
<text x="335.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">і криптографічні секрети.</text>
<text x="335.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Економія на BOM, але вищі вимоги</text>
<text x="335.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">до захисту від багів прошивки</text>
<text x="335.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">та атак побічними каналами.</text>
<rect x="590.0" y="60.0" width="260.0" height="400.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<rect x="600.0" y="70.0" width="240.0" height="32.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.0"/>
<text x="720.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#145a32" text-anchor="middle" font-weight="700">Апаратний SRAM PUF</text>
<text x="720.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">(Physically Unclonable Function)</text>
<line x1="605.0" y1="130.0" x2="835.0" y2="130.0" stroke="#d5f5e3" stroke-width="1.0"/>
<text x="605.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• «Відбиток пальця» кремнію</text>
<text x="605.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Стан комірок SRAM при старті</text>
<text x="605.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Ключ НЕ записаний у Flash/NVM</text>
<text x="605.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Fuzzy Extractor (коди BCH)</text>
<text x="605.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Знищення ключа при вимкненні</text>
<rect x="605.0" y="290.0" width="230.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.0"/>
<text x="720.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Особливість безпеки:</text>
<text x="615.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">У вимкненому стані ключ фізично</text>
<text x="615.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">відсутній на платі! Його не можна</text>
<text x="615.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">витягти мікроскопом чи зчитати</text>
<text x="615.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">з дампа пам'яті. Реконструюється</text>
<text x="615.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">динамічно тільки при живленні.</text>
</svg>