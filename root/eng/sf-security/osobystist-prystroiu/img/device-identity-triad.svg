<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріада особистості пристрою: Ідентифікатор, Ключ, Сертифікат</text>
<text x="440.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріада особистості пристрою: Ідентифікатор, Ключ, Сертифікат</text>
<rect x="30.0" y="65.0" width="260.0" height="245.0" rx="8" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="160.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Апаратний ідентифікатор</text>
<text x="160.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">(UID / Chip Serial)</text>
<line x1="45.0" y1="127.0" x2="275.0" y2="127.0" stroke="#bdc3c7" stroke-width="1.0"/>
<text x="45.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Роль: публічне ім'я («Хто я»)</text>
<text x="45.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Властивість: відкритий, незмінний</text>
<text x="45.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Носій: eFuse, лазерні перемички</text>
<text x="45.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Загроза: клонування та підробка</text>
<text x="45.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">  (самого серійника недостатньо)</text>
<rect x="55.0" y="270.0" width="210.0" height="26.0" rx="4" fill="#eaecee" stroke="#bdc3c7" stroke-width="1.0"/>
<text x="160.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ПАСИВНА НАЗВА</text>
<rect x="310.0" y="65.0" width="260.0" height="245.0" rx="8" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="440.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Приватний ключ</text>
<text x="440.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">(Hardware Private Key / UDS)</text>
<line x1="325.0" y1="127.0" x2="555.0" y2="127.0" stroke="#a9cce3" stroke-width="1.0"/>
<text x="325.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Роль: доказ володіння секретом</text>
<text x="325.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Властивість: суворо таємний</text>
<text x="325.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Носій: Secure Element, PUF</text>
<text x="325.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Захист: ніколи не виходить назовні</text>
<text x="325.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">  (підпис генерується всередині)</text>
<rect x="335.0" y="270.0" width="210.0" height="26.0" rx="4" fill="#d4e6f1" stroke="#a9cce3" stroke-width="1.0"/>
<text x="440.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">АКТИВНИЙ ДОКАЗ</text>
<rect x="590.0" y="65.0" width="260.0" height="245.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="720.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Цифровий сертифікат</text>
<text x="720.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">(X.509 DevID Certificate)</text>
<line x1="605.0" y1="127.0" x2="835.0" y2="127.0" stroke="#a9dfbf" stroke-width="1.0"/>
<text x="605.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Роль: зв'язування особи й ключа</text>
<text x="605.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Властивість: публічний документ</text>
<text x="605.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Підписант: Довірений CA заводу</text>
<text x="605.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Вміст: UID в SAN + Відкритий ключ</text>
<text x="605.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">  (гарантія справжності від третьої CA)</text>
<rect x="615.0" y="270.0" width="210.0" height="26.0" rx="4" fill="#d5f5e3" stroke="#a9dfbf" stroke-width="1.0"/>
<text x="720.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ДОВІРЧА ПОРУКА</text>
<rect x="30.0" y="335.0" width="820.0" height="140.0" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.4"/>
<text x="440.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм криптографічної перевірки автентичності (Challenge-Response)</text>
<text x="50.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Сервер надсилає випадковий виклик (Nonce / TLS Handshake Challenge)</text>
<text x="50.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">2. Пристрій обчислює підпис: Sig = Sign(PrivKey, Nonce) всередині апаратного чипа</text>
<text x="50.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">3. Сервер перевіряє: Verify(Cert.PubKey, Nonce, Sig) == OK та валідує ланцюжок CA</text>
</svg>