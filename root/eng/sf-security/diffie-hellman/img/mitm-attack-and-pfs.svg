<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атака «людина посередині» (MITM) та захист через PFS</text>
<rect x="25.0" y="50.0" width="460.0" height="450.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="255.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">Неавтентифікований DH: атака Меллорі</text>
<rect x="45.0" y="100.0" width="120.0" height="50.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="105.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">Аліса</tspan><tspan x="105.0" dy="14.3">секрет a</tspan></text>
<rect x="195.0" y="100.0" width="120.0" height="50.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="255.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Меллорі (MITM)</tspan><tspan x="255.0" dy="14.3">секрети m1, m2</tspan></text>
<rect x="345.0" y="100.0" width="120.0" height="50.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/><text x="405.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Боб</tspan><tspan x="405.0" dy="14.3">секрет b</tspan></text>
<line x1="105.0" y1="160.0" x2="195.0" y2="190.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="140.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">A=g^a</text>
<line x1="315.0" y1="190.0" x2="405.0" y2="160.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="370.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">M_A=g^m2</text>
<line x1="405.0" y1="230.0" x2="315.0" y2="260.0" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="370.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle">B=g^b</text>
<line x1="195.0" y1="260.0" x2="105.0" y2="230.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="140.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">M_B=g^m1</text>
<rect x="45.0" y="290.0" width="185.0" height="75.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="137.5" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="137.5" dy="0.0">Канал 1 (Аліса &lt;-&gt; Меллорі):</tspan><tspan x="137.5" dy="13.0">K1 = (M_B)^a = g^(a·m1)</tspan><tspan x="137.5" dy="13.0">Меллорі читає і підміняє!</tspan></text>
<rect x="280.0" y="290.0" width="185.0" height="75.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="372.5" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="372.5" dy="0.0">Канал 2 (Меллорі &lt;-&gt; Боб):</tspan><tspan x="372.5" dy="14.3">K2 = (M_A)^b = g^(b·m2)</tspan><tspan x="372.5" dy="14.3">Боб упевнений, що це Аліса</tspan></text>
<rect x="45.0" y="385.0" width="420.0" height="95.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="255.0" y="418.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Чому MITM можливий:</tspan><tspan x="255.0" dy="11.7">DH гарантує конфіденційність, але НЕ автентифікацію.</tspan><tspan x="255.0" dy="11.7">Без підтвердження особи відкриті ключі можна непомітно підмінити.</tspan><tspan x="255.0" dy="11.7">Рішення: цифровий підпис параметрів обміну (RSA / Ed25519 сертифікати).</tspan></text>
<rect x="515.0" y="50.0" width="460.0" height="450.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="745.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">Ефемерний DHE / ECDHE + Підпис (PFS)</text>
<rect x="535.0" y="100.0" width="190.0" height="65.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/><text x="630.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Автентифікація:</tspan><tspan x="630.0" dy="11.7">Боб підписує відкритий ключ:</tspan><tspan x="630.0" dy="11.7">Sig = Sign(PrivKey_Server, A||B)</tspan></text>
<rect x="745.0" y="100.0" width="210.0" height="65.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="850.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Одноразові пари ключів:</tspan><tspan x="850.0" dy="14.3">(a_eph, A_eph), (b_eph, B_eph)</tspan><tspan x="850.0" dy="14.3">генеруються на 1 сесію</tspan></text>
<rect x="535.0" y="185.0" width="420.0" height="120.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="745.0" y="222.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Життєвий цикл сесійного секрету:</tspan><tspan x="745.0" dy="13.0">1. K = g^(a_eph · b_eph) mod p</tspan><tspan x="745.0" dy="13.0">2. Виведення симетричних ключів: SessionKeys = HKDF(K)</tspan><tspan x="745.0" dy="13.0">3. Негайне затирання в пам'яті (Secure Erasure): a_eph, b_eph, K = 0</tspan><tspan x="745.0" dy="13.0">4. Довгостроковий ключ підпису НЕ бере участі в шифруванні даних!</tspan></text>
<rect x="535.0" y="325.0" width="420.0" height="155.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="745.0" y="373.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Гарантія Perfect Forward Secrecy (PFS):</tspan><tspan x="745.0" dy="13.0">• Навіть якщо спецслужба записує гігабайти шифротексту роками...</tspan><tspan x="745.0" dy="13.0">• І через 5 років компрометує сертифікат / PrivKey_Server...</tspan><tspan x="745.0" dy="13.0">• Вона НЕ зможе розшифрувати минулі сесії, бо ключі a_eph і b_eph</tspan><tspan x="745.0" dy="13.0">  були безповоротно знищені в момент завершення рукостискання!</tspan><tspan x="745.0" dy="13.0">• TLS 1.3 повністю заборонив статичний RSA-обмін на користь PFS.</tspan></text>
</svg>