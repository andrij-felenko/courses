<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол узгодження ключів Діффі — Геллмана (MODP)</text>
<rect x="30.0" y="50.0" width="260.0" height="450.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="370.0" y="50.0" width="260.0" height="450.0" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.2"/>
<rect x="710.0" y="50.0" width="260.0" height="450.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="160.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">Аліса (Клієнт)</text>
<text x="500.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">Відкритий канал (Єва бачить усе)</text>
<text x="840.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="700">Боб (Сервер)</text>
<rect x="390.0" y="95.0" width="220.0" height="50.0" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.2"/><text x="500.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Публічні параметри:</tspan><tspan x="500.0" dy="15.6">модуль p, генератор g</tspan></text>
<rect x="45.0" y="160.0" width="230.0" height="60.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="160.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Випадковий секрет a ∈ {2..p-2}</tspan><tspan x="160.0" dy="15.6">Обчислення:</tspan><tspan x="160.0" dy="15.6">A = g^a mod p</tspan></text>
<rect x="725.0" y="160.0" width="230.0" height="60.0" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="840.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Випадковий секрет b ∈ {2..p-2}</tspan><tspan x="840.0" dy="15.6">Обчислення:</tspan><tspan x="840.0" dy="15.6">B = g^b mod p</tspan></text>
<line x1="275.0" y1="245.0" x2="725.0" y2="245.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="410.0" y="225.0" width="180.0" height="38.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="500.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Відкритий ключ A = g^a mod p</tspan></text>
<line x1="725.0" y1="295.0" x2="275.0" y2="295.0" stroke="#059669" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="410.0" y="275.0" width="180.0" height="38.0" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/><text x="500.0" y="290.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Відкритий ключ B = g^b mod p</tspan></text>
<rect x="385.0" y="335.0" width="230.0" height="65.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="500.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Перехоплювач знає:</tspan><tspan x="500.0" dy="14.3">p, g, A, B</tspan><tspan x="500.0" dy="14.3">Знайти a чи b — задача DLP</tspan><tspan x="500.0" dy="14.3">(обчислювально нездійсненна)</tspan></text>
<rect x="45.0" y="415.0" width="230.0" height="70.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.0"/><text x="160.0" y="438.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Спільний секрет K:</tspan><tspan x="160.0" dy="15.6">K = B^a mod p</tspan><tspan x="160.0" dy="15.6">K = (g^b)^a = g^(ab) mod p</tspan></text>
<rect x="725.0" y="415.0" width="230.0" height="70.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.0"/><text x="840.0" y="438.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Спільний секрет K:</tspan><tspan x="840.0" dy="15.6">K = A^b mod p</tspan><tspan x="840.0" dy="15.6">K = (g^a)^b = g^(ab) mod p</tspan></text>
</svg>