<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="144.5" y="12.5" width="671.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="35.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Таксономія витоків інформації та класифікація атак по побічних каналах</tspan></text>
<rect x="25.0" y="70.0" width="285.0" height="430.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="167.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700">Фізичний носій витоку</text>
<text x="167.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">Фізичні еманації процесу обчислень</text>
<rect x="54.3" y="133.1" width="225.5" height="53.8" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="167.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.0" dy="0.0">Часові витоки (Timing)</tspan><tspan x="167.0" dy="13.7">• Розгалуження за секретними даними</tspan><tspan x="167.0" dy="13.7">• Варіація кеш-латентності пам'яті</tspan></text>
<rect x="45.3" y="218.1" width="243.4" height="53.8" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="167.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.0" dy="0.0">Споживання струму (Power)</tspan><tspan x="167.0" dy="13.7">• Простий аналіз (SPA)</tspan><tspan x="167.0" dy="13.7">• Диференційний/кореляційний (DPA/CPA)</tspan></text>
<rect x="39.3" y="303.1" width="255.4" height="53.8" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="167.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.0" dy="0.0">Електромагнітне випромінювання</tspan><tspan x="167.0" dy="13.7">• Near-field зондування чіпа (SEMA/DEMA)</tspan><tspan x="167.0" dy="13.7">• Просторове локалізування блоків</tspan></text>
<rect x="42.2" y="394.0" width="249.7" height="52.0" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="167.0" y="410.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.0" dy="0.0">Акустичні та фотонні еманації</tspan><tspan x="167.0" dy="13.0">• Акустичний шум керамічних конденсаторів</tspan><tspan x="167.0" dy="13.0">• Фотонна емісія перемикання транзисторів</tspan></text>
<rect x="335.0" y="70.0" width="290.0" height="430.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700">Рівень втручання та доступ</text>
<text x="480.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">Ступінь деструктивного впливу</text>
<rect x="352.3" y="131.3" width="255.4" height="67.4" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="480.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Неінвазивні (Non-invasive)</tspan><tspan x="480.0" dy="13.7">• Тільки зовнішні вимірювання</tspan><tspan x="480.0" dy="13.7">• Осцилограф, таймер, зонд струму</tspan><tspan x="480.0" dy="13.7">• Чіп і корпус залишаються неушкодженими</tspan></text>
<rect x="343.3" y="246.3" width="273.4" height="67.4" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="480.0" y="263.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Напівінвазивні (Semi-invasive)</tspan><tspan x="480.0" dy="13.7">• Декапсуляція корпусу (зняття пластику)</tspan><tspan x="480.0" dy="13.7">• Доступ до кремнієвого кристала без зондів</tspan><tspan x="480.0" dy="13.7">• Лазерне збурення, фотонні вимірювання</tspan></text>
<rect x="355.3" y="371.3" width="249.4" height="67.4" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="480.0" y="388.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Повністю інвазивні (Invasive)</tspan><tspan x="480.0" dy="13.7">• Пряме мікрозондування шин чіпа</tspan><tspan x="480.0" dy="13.7">• Використання FIB (фокусованого пучка)</tspan><tspan x="480.0" dy="13.7">• Модифікація внутрішніх провідників</tspan></text>
<rect x="650.0" y="70.0" width="285.0" height="430.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="792.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700">Режим впливу на систему</text>
<text x="792.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">Пасивне читання vs активні збої</text>
<rect x="667.3" y="139.4" width="249.4" height="81.1" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="792.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="792.0" dy="0.0">Пасивні атаки (Passive SCA)</tspan><tspan x="792.0" dy="13.7">• Тільки моніторинг побічних сигналів</tspan><tspan x="792.0" dy="13.7">• Специфікація алгоритму не порушується</tspan><tspan x="792.0" dy="13.7">• Не залишають слідів у системі</tspan><tspan x="792.0" dy="13.7">• Мета: вилучення секретного ключа</tspan></text>
<rect x="661.3" y="294.4" width="261.4" height="81.1" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="792.0" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="792.0" dy="0.0">Активні атаки (Fault Injection / DFA)</tspan><tspan x="792.0" dy="13.7">• Навмисне внесення фізичних збоїв</tspan><tspan x="792.0" dy="13.7">• Перепади напруги живлення (Glitching)</tspan><tspan x="792.0" dy="13.7">• Тактові збої, лазерне перемикання бітів</tspan><tspan x="792.0" dy="13.7">• Диференційний аналіз помилок (DFA)</tspan></text>
<rect x="685.8" y="438.1" width="212.4" height="33.9" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="792.0" y="452.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="792.0" dy="0.0">Комбіновані атаки (Combined Attacks)</tspan><tspan x="792.0" dy="12.3">• Індукування збоїв та аналіз SPA/DPA</tspan></text>
</svg>