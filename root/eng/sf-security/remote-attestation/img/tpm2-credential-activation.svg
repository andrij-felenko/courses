<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="480.0" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двофазна процедура активації облікових даних (Credential Activation)</text>
<rect x="30.0" y="60.0" width="360.0" height="395.0" rx="8" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5"/>
<text x="210.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#701a75" text-anchor="middle" font-weight="700">Фаза 1: Верифікатор (TPM2_MakeCredential)</text>
<rect x="84.3" y="99.5" width="251.4" height="61.0" rx="6" fill="#fae8ff" stroke="#d946ef" stroke-width="1.5"/><text x="210.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Вхідні дані:</tspan><tspan x="210.0" dy="13.0">• Сертифікат EK-Cert (Публічний EK_pub)</tspan><tspan x="210.0" dy="13.0">• Згенерований клієнтом публічний AK_pub</tspan><tspan x="210.0" dy="13.0">• Обчислене ім'я Name(AK) = SHA256(AK_pub)</tspan></text>
<rect x="95.7" y="196.0" width="228.6" height="48.0" rx="6" fill="#fae8ff" stroke="#d946ef" stroke-width="1.5"/><text x="210.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Генерація симетричного секрету K</tspan><tspan x="210.0" dy="13.0">та зашифрування під захистом Name(AK):</tspan><tspan x="210.0" dy="13.0">Формування TPM2B_ID_OBJECT</tspan></text>
<rect x="110.0" y="286.0" width="200.1" height="48.0" rx="6" fill="#fae8ff" stroke="#d946ef" stroke-width="1.5"/><text x="210.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Асиметричне шифрування ключа K</tspan><tspan x="210.0" dy="13.0">на публічному ключі EK_pub:</tspan><tspan x="210.0" dy="13.0">Формування TPM2B_ENCRYPTED_SECRET</tspan></text>
<rect x="73.8" y="382.5" width="272.4" height="35.0" rx="6" fill="#e879f9" stroke="#a21caf" stroke-width="1.5"/><text x="210.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Вихід: Пакет {ID_Object, Encrypted_Secret}</tspan><tspan x="210.0" dy="13.0">Передається клієнту через мережу</tspan></text>
<line x1="210.0" y1="175.0" x2="210.0" y2="195.0" stroke="#a21caf" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="210.0" y1="260.0" x2="210.0" y2="285.0" stroke="#a21caf" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="210.0" y1="350.0" x2="210.0" y2="375.0" stroke="#a21caf" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="430.0" y="60.0" width="360.0" height="395.0" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
<text x="610.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">Фаза 2: Чип TPM (TPM2_ActivateCredential)</text>
<rect x="507.1" y="106.0" width="205.8" height="48.0" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="610.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Прийом пакетів усередину чипа:</tspan><tspan x="610.0" dy="13.0">Клієнт передає сесійні дескриптори</tspan><tspan x="610.0" dy="13.0">Handle(AK) та Handle(EK)</tspan></text>
<rect x="478.6" y="196.0" width="262.8" height="48.0" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="610.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Розшифрування ключа K:</tspan><tspan x="610.0" dy="13.0">Чип використовує апаратний приватний EK_priv</tspan><tspan x="610.0" dy="13.0">для зняття асиметричного шару</tspan></text>
<rect x="495.7" y="286.0" width="228.6" height="48.0" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="610.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Перевірка прив'язки до AK:</tspan><tspan x="610.0" dy="13.0">Чип розшифровує ID_Object лише якщо</tspan><tspan x="610.0" dy="13.0">ім'я завантаженого AK тотожне Name(AK)</tspan></text>
<rect x="480.0" y="376.0" width="260.0" height="48.0" rx="6" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/><text x="610.0" y="390.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Результат: Відновлений секрет K</tspan><tspan x="610.0" dy="13.0">Клієнт повертає K верифікатору як доказ,</tspan><tspan x="610.0" dy="13.0">що AK створено саме на цьому чипі</tspan></text>
<line x1="610.0" y1="170.0" x2="610.0" y2="195.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="610.0" y1="260.0" x2="610.0" y2="285.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="610.0" y1="355.0" x2="610.0" y2="375.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>