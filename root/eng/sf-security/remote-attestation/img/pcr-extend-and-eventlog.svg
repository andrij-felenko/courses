<line x1="610.0" y1="235.0" x2="610.0" y2="265.0" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="462.5" y="365.5" width="295.0" height="39.0" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/><text x="610.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Порівняння: PCR_expected == Quoted_PCR_digest</tspan><tspan x="610.0" dy="13.0">Звірка кожної події з базою еталонів RIM</tspan></text>
<line x1="610.0" y1="320.0" x2="610.0" y2="355.0" stroke="#15803d" stroke-width="1.4" marker-end="url(#arrow)"/>
