<rect x="0.0" y="0.0" width="820.0" height="480.0" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формування регістра PCR та верифікація через TCG Event Log</text>
<rect x="30.0" y="60.0" width="360.0" height="395.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="210.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Апаратне вимірювання на пристрої</text>
<rect x="100.5" y="111.3" width="218.9" height="37.3" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Stage 0: CRTM / UEFI Firmware ROM</tspan><tspan x="210.0" dy="14.3">Вимірює завантажувач: Digest D0</tspan></text>
<rect x="106.8" y="191.3" width="206.4" height="37.3" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Stage 1: GRUB / Shim Bootloader</tspan><tspan x="210.0" dy="14.3">Вимірює ядро та UKI: Digest D1</tspan></text>
<rect x="106.8" y="271.4" width="206.4" height="37.3" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Stage 2: Linux Kernel &amp; Initrd</tspan><tspan x="210.0" dy="14.3">Вимірює модулі й IMA: Digest D2</tspan></text>
<line x1="210.0" y1="155.0" x2="210.0" y2="185.0" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="210.0" y1="235.0" x2="210.0" y2="265.0" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="53.2" y="365.5" width="313.6" height="39.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="210.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Операція в чипі: PCR_new = SHA256(PCR_old || Dn)</tspan><tspan x="210.0" dy="13.0">Неможливо стерти чи повернути стан назад</tspan></text>
<line x1="210.0" y1="320.0" x2="210.0" y2="355.0" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="430.0" y="60.0" width="360.0" height="395.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="610.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#14532d" text-anchor="middle" font-weight="700">Відтворення журналу верифікатором (Replay)</text>
<rect x="490.0" y="112.5" width="240.0" height="35.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="610.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">TCG Event Log: Подія 0 (Firmware)</tspan><tspan x="610.0" dy="13.0">Хеш: D0 → PCR_exp = SHA256(00..00 || D0)</tspan></text>
<rect x="487.1" y="192.5" width="245.7" height="35.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="610.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">TCG Event Log: Подія 1 (Bootloader)</tspan><tspan x="610.0" dy="13.0">Хеш: D1 → PCR_exp = SHA256(PCR_exp || D1)</tspan></text>
<rect x="487.1" y="272.5" width="245.7" height="35.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="610.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">TCG Event Log: Подія 2 (Kernel &amp; Config)</tspan><tspan x="610.0" dy="13.0">Хеш: D2 → PCR_exp = SHA256(PCR_exp || D2)</tspan></text>
