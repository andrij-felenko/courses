<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема виведення контексту безпеки OSCORE за допомогою HKDF</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Майстер-секрет та ідентифікатори сторін розгортаються у незалежні сесійні ключі й загальний IV</text>

  <!-- Panel 1: Inputs (Left) -->
  <rect x="30" y="80" width="250" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="155" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Початкові параметри</text>

  <!-- Master Secret -->
  <rect x="45" y="125" width="220" height="50" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="155" y="147" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Master Secret</text>
  <text x="155" y="163" font-size="12" fill="#6b7280" text-anchor="middle">Спільний криптографічний секрет</text>

  <!-- Master Salt -->
  <rect x="45" y="190" width="220" height="45" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="155" y="210" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Master Salt (опціонально)</text>
  <text x="155" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Випадкова сіль для HKDF-Extract</text>

  <!-- Sender / Recipient IDs -->
  <rect x="45" y="250" width="220" height="50" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="155" y="270" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Sender ID / Recipient ID</text>
  <text x="155" y="287" font-size="12" fill="#6b7280" text-anchor="middle">Ідентифікатори ролей в сесії</text>

  <!-- ID Context & Alg -->
  <rect x="45" y="315" width="220" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="155" y="335" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ID Context &amp; Algorithm ID</text>
  <text x="155" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Контекст групи і вибір шифру</text>
  <text x="155" y="375" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">AES-CCM-16-64-128 / HKDF</text>

  <!-- Arrows Inputs -> HKDF Core -->
  <path d="M 280 150 L 360 210" fill="none" stroke="#2457d6" stroke-width="2"/>
  <polygon points="360,210 350,204 352,214" fill="#2457d6"/>

  <path d="M 280 275 L 360 260" fill="none" stroke="#2457d6" stroke-width="2"/>
  <polygon points="360,260 350,255 352,266" fill="#2457d6"/>


  <!-- Panel 2: HKDF Core (Center) -->
  <rect x="360" y="80" width="240" height="340" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Функція розгортання HKDF</text>

  <!-- HKDF Extract -->
  <rect x="380" y="130" width="200" height="70" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="152" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">HKDF-Extract</text>
  <text x="480" y="170" font-size="12" fill="#1a1a1a" text-anchor="middle">PRK = HMAC-Hash(Salt, Secret)</text>
  <text x="480" y="186" font-size="12" fill="#6b7280" text-anchor="middle">Концентрація ентропії в PRK</text>

  <!-- Arrow Extract -> Expand -->
  <path d="M 480 200 L 480 230" fill="none" stroke="#2457d6" stroke-width="2"/>
  <polygon points="480,230 474,220 486,220" fill="#2457d6"/>

  <!-- HKDF Expand -->
  <rect x="380" y="230" width="200" height="170" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="252" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">HKDF-Expand</text>
  <text x="480" y="272" font-size="12" fill="#1a1a1a" text-anchor="middle">OKM = HMAC-Hash(PRK, info, L)</text>
  <line x1="390" y1="282" x2="570" y2="282" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="300" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формат структури info:</text>
  <text x="480" y="320" font-size="12" fill="#6b7280" text-anchor="middle">CBOR-масив: [id, id_ctx,</text>
  <text x="480" y="338" font-size="12" fill="#6b7280" text-anchor="middle">algorithm_id, type, L]</text>
  <text x="480" y="380" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Ґенерує унікальний ключ</text>


  <!-- Arrows HKDF Core -> Outputs -->
  <path d="M 600 240 L 680 150" fill="none" stroke="#27ae60" stroke-width="2"/>
  <polygon points="680,150 670,154 676,162" fill="#27ae60"/>

  <path d="M 600 310 L 680 250" fill="none" stroke="#27ae60" stroke-width="2"/>
  <polygon points="680,250 670,254 676,262" fill="#27ae60"/>

  <path d="M 600 350 L 680 345" fill="none" stroke="#27ae60" stroke-width="2"/>
  <polygon points="680,345 670,340 670,350" fill="#27ae60"/>


  <!-- Panel 3: Derived Security Context (Right) -->
  <rect x="680" y="80" width="250" height="340" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="805" y="105" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Контекст безпеки (Security Context)</text>

  <!-- Sender Key -->
  <rect x="695" y="125" width="220" height="50" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="805" y="147" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Sender Key</text>
  <text x="805" y="163" font-size="12" fill="#6b7280" text-anchor="middle">Ключ шифрування відправника</text>

  <!-- Recipient Key -->
  <rect x="695" y="190" width="220" height="50" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="805" y="212" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Recipient Key</text>
  <text x="805" y="228" font-size="12" fill="#6b7280" text-anchor="middle">Ключ розшифрування отримувача</text>

  <!-- Common IV -->
  <rect x="695" y="255" width="220" height="55" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="805" y="275" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Common IV</text>
  <text x="805" y="295" font-size="12" fill="#6b7280" text-anchor="middle">Базовий вектор для розрахунку нонсу</text>

  <!-- Sequence Number & Window -->
  <rect x="695" y="325" width="220" height="75" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="805" y="345" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Partial IV &amp; Replay Window</text>
  <text x="805" y="365" font-size="12" fill="#6b7280" text-anchor="middle">Лічильник послідовності (Sequence)</text>
  <text x="805" y="383" font-size="12" fill="#2457d6" text-anchor="middle">Захист від атак повтору</text>

</svg>
