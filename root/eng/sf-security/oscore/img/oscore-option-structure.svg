<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Байтова структура OSCORE Option</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Динамічне кодування опції CoAP Option 9 залежно від бітів прапорця (Header Byte)</text>

  <!-- Option Layout Container -->
  <rect x="40" y="140" width="880" height="160" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Field 1: Header Byte -->
  <g>
    <rect x="60" y="165" width="160" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <text x="140" y="195" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Header Byte</text>
    <text x="140" y="225" font-size="12" fill="#1a1a1a" text-anchor="middle">1 байт прапорців</text>
    <text x="140" y="250" font-size="11" fill="#6b7280" text-anchor="middle">b7..b0 (PIV, KID, Ctx)</text>
  </g>

  <!-- Field 2: Partial IV -->
  <g>
    <rect x="240" y="165" width="190" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="335" y="195" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Partial IV</text>
    <text x="335" y="225" font-size="12" fill="#1a1a1a" text-anchor="middle">0..5 байтів</text>
    <text x="335" y="250" font-size="11" fill="#6b7280" text-anchor="middle">Лічильник послідовності</text>
  </g>

  <!-- Field 3: KID Context -->
  <g>
    <rect x="450" y="165" width="210" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="555" y="195" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">KID Context</text>
    <text x="555" y="225" font-size="12" fill="#1a1a1a" text-anchor="middle">Варіативна довжина</text>
    <text x="555" y="250" font-size="11" fill="#6b7280" text-anchor="middle">Ідентифікатор групи/сесії</text>
  </g>

  <!-- Field 4: Key ID (KID) -->
  <g>
    <rect x="680" y="165" width="220" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
    <text x="790" y="195" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Key ID (KID)</text>
    <text x="790" y="225" font-size="12" fill="#1a1a1a" text-anchor="middle">0..255 байтів</text>
    <text x="790" y="250" font-size="11" fill="#6b7280" text-anchor="middle">Ідентифікатор ключа відправника</text>
  </g>

  <!-- Bottom Explanations -->
  <g>
    <text x="140" y="340" font-size="12" fill="#2457d6" text-anchor="middle">Вказує які поля присутні</text>
    <text x="335" y="340" font-size="12" fill="#6b7280" text-anchor="middle">Присутній якщо PIV len > 0</text>
    <text x="555" y="340" font-size="12" fill="#6b7280" text-anchor="middle">Присутній якщо біт h=1</text>
    <text x="790" y="340" font-size="12" fill="#27ae60" text-anchor="middle">Присутній якщо біт k=1</text>
  </g>

</svg>
