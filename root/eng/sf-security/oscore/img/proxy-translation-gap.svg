<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розрив захисту на шлюзі CoAP-to-HTTP при використанні DTLS проти OSCORE</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Транспортний захист (DTLS/TLS) розкриває дані в пам'яті проксі, тоді як OSCORE зберігає наскрізну безпеку</text>

  <!-- Panel 1: DTLS / TLS Transport Security (Problem Case) -->
  <rect x="30" y="75" width="900" height="165" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="45" y="98" font-size="14" font-weight="bold" fill="#c0392b">1. Транспортна безпека (DTLS / TLS): Розрив шифрування на проксі</text>

  <!-- IoT Device -->
  <rect x="50" y="115" width="160" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="145" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IoT-пристрій</text>
  <text x="130" y="165" font-size="12" fill="#6b7280" text-anchor="middle">CoAP-клієнт</text>

  <!-- DTLS Tunnel Arrow -->
  <path d="M 210 162 L 360 162" fill="none" stroke="#2457d6" stroke-width="3"/>
  <polygon points="360,162 350,156 350,168" fill="#2457d6"/>
  <rect x="230" y="132" width="110" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="285" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DTLS Тунель</text>

  <!-- Proxy Gateway (The Gap) -->
  <rect x="360" y="115" width="240" height="95" rx="6" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="480" y="140" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Шлюз CoAP-to-HTTP</text>
  <rect x="375" y="152" width="210" height="45" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="480" y="170" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Роз розшифрування в RAM!</text>
  <text x="480" y="187" font-size="12" fill="#c0392b" text-anchor="middle">Відкритий текст CoAP Header + Payload</text>

  <!-- TLS Tunnel Arrow -->
  <path d="M 600 162 L 750 162" fill="none" stroke="#2457d6" stroke-width="3"/>
  <polygon points="750,162 740,156 740,168" fill="#2457d6"/>
  <rect x="625" y="132" width="100" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="675" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">TLS Тунель</text>

  <!-- Web Server -->
  <rect x="750" y="115" width="160" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="830" y="145" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Веб-сервер</text>
  <text x="830" y="165" font-size="12" fill="#6b7280" text-anchor="middle">HTTP-сервер</text>


  <!-- Panel 2: OSCORE Object Security (Solution Case) -->
  <rect x="30" y="260" width="900" height="175" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="45" y="283" font-size="14" font-weight="bold" fill="#27ae60">2. Об'єктна безпека OSCORE (RFC 8613): Наскрізний захист (End-to-End)</text>

  <!-- IoT Device -->
  <rect x="50" y="300" width="160" height="115" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="130" y="325" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IoT-пристрій</text>
  <text x="130" y="345" font-size="12" fill="#27ae60" text-anchor="middle">OSCORE Клієнт</text>
  <rect x="65" y="358" width="130" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="130" y="375" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Шифрування COSE</text>
  <text x="130" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Payload + Inner Opts</text>

  <!-- End-to-End Pipe Line across the entire width -->
  <path d="M 210 348 L 750 348" fill="none" stroke="#27ae60" stroke-width="4" stroke-dasharray="8,4"/>
  <polygon points="750,348 740,342 740,354" fill="#27ae60"/>
  <rect x="230" y="318" width="110" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="285" y="334" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Наскрізний COSE</text>

  <!-- Proxy Gateway (Safe Untrusted Proxy) -->
  <rect x="360" y="300" width="240" height="115" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="325" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шлюз (Untrusted Proxy)</text>
  <rect x="375" y="337" width="210" height="65" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="480" y="355" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Бачить тільки Option 9</text>
  <text x="480" y="372" font-size="12" fill="#6b7280" text-anchor="middle">Зовнішні опції транзиту</text>
  <text x="480" y="390" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Payload невидимий!</text>

  <!-- Web Server -->
  <rect x="750" y="300" width="160" height="115" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="830" y="325" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сервер / Сервіс</text>
  <text x="830" y="345" font-size="12" fill="#27ae60" text-anchor="middle">OSCORE Отримувач</text>
  <rect x="765" y="358" width="130" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="830" y="375" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Розшифрування COSE</text>
  <text x="830" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Перевірка AAD Tag</text>

</svg>
