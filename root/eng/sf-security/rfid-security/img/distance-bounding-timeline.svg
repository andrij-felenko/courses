<line x1="190.0" y1="120.0" x2="320.0" y2="190.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="260.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Запит (N_V, Crypto)</text>
