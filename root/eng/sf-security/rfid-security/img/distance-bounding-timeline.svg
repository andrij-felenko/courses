<line x1="395.0" y1="92.0" x2="395.0" y2="105.0" stroke="#c0392b" stroke-width="1.2"/>
<line x1="530.0" y1="92.0" x2="530.0" y2="105.0" stroke="#c0392b" stroke-width="1.2"/>
<line x1="395.0" y1="96.0" x2="530.0" y2="96.0" stroke="#c0392b" stroke-width="1.5"/>
