<line x1="515.0" y1="96.0" x2="530.0" y2="96.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="462.5" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">t_RTT ≤ t_max</text>
<rect x="660.0" y="48.0" width="115.0" height="185.0" rx="4" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.0"/>
<text x="717.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">Фаза 3: HMAC</text>
<text x="717.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8e44ad" text-anchor="middle">Перевірка підпису</text>
<rect x="105.9" y="269.4" width="628.2" height="45.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="288.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Поріг часу прольоту: t_max = 2 · d_max / c. Для відстані d = 1 м: t_RTT ≈ 6.67 нс.</tspan><tspan x="420.0" dy="14.3">При ретрансляції через Wi-Fi/5G затримка Δt &gt; 10–50 мс, що в 100 000 разів перевищує поріг t_max!</tspan></text>
</svg>