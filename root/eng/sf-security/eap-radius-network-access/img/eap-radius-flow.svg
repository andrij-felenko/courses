<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Послідовність обміну повідомленнями 802.1X / EAPOL / RADIUS</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Комутатор функціонує як проксі-транслятор між EAPOL (клієнт) та RADIUS (сервер)</text>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Lifeline Headers -->
  <rect x="70" y="80" width="180" height="40" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Суплікант (Клієнт)</text>

  <rect x="390" y="80" width="180" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Автентифікатор (Switch)</text>

  <rect x="710" y="80" width="180" height="40" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">RADIUS Сервер</text>

  <!-- Lifeline Vertical Lines -->
  <line x1="160" y1="120" x2="160" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="480" y1="120" x2="480" y2="420" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="800" y1="120" x2="800" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Step 1: Physical Link & EAPOL-Start -->
  <path d="M 160 145 L 472 145" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="320" y="140" font-size="12" text-anchor="middle" fill="#1a1a1a">EAPOL-Start (Підключення кабелю)</text>

  <!-- Step 2: EAP-Request Identity -->
  <path d="M 480 175 L 168 175" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="320" y="170" font-size="12" text-anchor="middle" fill="#2457d6">EAP-Request / Identity (EAPOL)</text>

  <!-- Step 3: EAP-Response Identity -->
  <path d="M 160 205 L 472 205" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="320" y="200" font-size="12" text-anchor="middle" fill="#1a1a1a">EAP-Response / Identity (&quot;user@corp&quot;)</text>

  <!-- Step 4: RADIUS Access-Request -->
  <path d="M 480 235 L 792 235" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="640" y="230" font-size="12" text-anchor="middle" fill="#2457d6">RADIUS Access-Request (UDP 1812)</text>

  <!-- Step 5: RADIUS Access-Challenge -->
  <path d="M 800 270 L 488 270" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="640" y="265" font-size="12" text-anchor="middle" fill="#2457d6">RADIUS Access-Challenge (EAP-TLS)</text>

  <!-- Step 6: EAP-Request TLS -->
  <path d="M 480 295 L 168 295" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="320" y="290" font-size="12" text-anchor="middle" fill="#2457d6">EAP-Request / EAP-TLS (Cert Request)</text>

  <!-- Step 7: EAP-Response TLS -->
  <path d="M 160 325 L 472 325" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="320" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a">EAP-Response / EAP-TLS (Certificates)</text>

  <!-- Step 8: RADIUS Access-Accept -->
  <path d="M 800 360 L 488 360" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="640" y="355" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">RADIUS Access-Accept (VLAN 10, ACL)</text>

  <!-- Step 9: EAP-Success & Port Unlocked -->
  <path d="M 480 385 L 168 385" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="320" y="380" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">EAP-Success (Контрольований порт відкритий)</text>

  <!-- Status Box at bottom of Switch -->
  <rect x="365" y="405" width="230" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="425" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">✔ Порт переведено у відкритий стан</text>
</svg>
