<text x="440.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">КОЛО МИТТЄВОЇ НУЛІФІКАЦІЇ (ZEROIZATION CIRCUITRY)</text>
<text x="440.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Резервне живлення від суперконденсатора/батареї -&gt; Миттєве скидання живлення енергозалежної SRAM</text>
<text x="440.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Майстер-ключі шифрування (Master Keys / LMK) знищуються за одиниці наносекунд без можливості відновлення</text>
