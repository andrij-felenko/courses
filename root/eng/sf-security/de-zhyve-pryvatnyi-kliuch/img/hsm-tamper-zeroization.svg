<rect x="85.0" y="135.0" width="710.0" height="285.0" rx="8" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.8"/>
<text x="440.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Непроникний епоксидний бар'єр із вбудованими датчиками загрози</text>
<rect x="110.0" y="180.0" width="200.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="210.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Датчик свердління</text>
<text x="210.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Розрив або замикання</text>
<text x="210.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">мікродоріжок сітки</text>
