<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр ізоляції приватного ключа: від файлу на диску до апаратного HSM</text>
<rect x="25.0" y="60.0" width="195.0" height="320.0" rx="8" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.8"/>
<text x="122.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Файл на диску</text>
<text x="122.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">(«Ноутбук Петра» / Сервер)</text>
<line x1="35.0" y1="114.0" x2="210.0" y2="114.0" stroke="#edbb99" stroke-width="1.0"/>
<text x="37.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Носій: SSD, HDD, Flash</text>
<text x="37.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Межа: відсутня (ОС)</text>
<text x="37.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Пам'ять: відкритий у RAM</text>
<text x="37.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Копіювання: миттєве</text>
<text x="37.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Аудит витоку: нульовий</text>
<text x="37.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Продуктивність: CPU</text>
<text x="37.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">• Рівень FIPS: немає</text>
<rect x="40.0" y="320.0" width="165.0" height="32.0" rx="4" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.2"/>
<text x="122.5" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">КАТАСТРОФА</text>
<rect x="235.0" y="60.0" width="195.0" height="320.0" rx="8" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="332.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Апаратний токен</text>
<text x="332.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">(YubiKey, Smartcard, SE)</text>
<line x1="245.0" y1="114.0" x2="420.0" y2="114.0" stroke="#a9cce3" stroke-width="1.0"/>
<text x="247.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Носій: захищений чип</text>
<text x="247.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Межа: криптопроцесор</text>
<text x="247.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Пам'ять: замкнений у SE</text>
<text x="247.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Захист: PIN + дотик руки</text>
<text x="247.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Пропускна: 10-50 оп/с</text>
<text x="247.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Формат: USB / CCID</text>
<text x="247.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">• Рівень: FIPS 140-3 L2/3</text>
<rect x="250.0" y="320.0" width="165.0" height="32.0" rx="4" fill="#d4e6f1" stroke="#2457d6" stroke-width="1.2"/>
<text x="332.5" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ОСОБИСТИЙ ЗАХИСТ</text>
<rect x="445.0" y="60.0" width="195.0" height="320.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="542.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Мережевий HSM</text>
<text x="542.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">(Thales, Utimaco, Entrust)</text>
<line x1="455.0" y1="114.0" x2="630.0" y2="114.0" stroke="#a9dfbf" stroke-width="1.0"/>
<text x="457.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Носій: броньований сервер</text>
<text x="457.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Межа: активна сітка захисту</text>
<text x="457.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Пам'ять: нуліфікація ключа</text>
<text x="457.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Доступ: кворум m-of-n</text>
<text x="457.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Пропускна: 10 000+ оп/с</text>
<text x="457.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Інтерфейс: PKCS#11 / IP</text>
<text x="457.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">• Рівень: FIPS 140-3 L3/4</text>
<rect x="460.0" y="320.0" width="165.0" height="32.0" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.2"/>
<text x="542.5" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">КОРПОРАТИВНИЙ КОРІНЬ</text>
<rect x="655.0" y="60.0" width="195.0" height="320.0" rx="8" fill="#fbfcfc" stroke="#566573" stroke-width="1.8"/>
<text x="752.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">4. Хмарний KMS / HSM</text>
<text x="752.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">(AWS KMS, GCP, Azure KV)</text>
<line x1="665.0" y1="114.0" x2="840.0" y2="114.0" stroke="#d5dbdb" stroke-width="1.0"/>
<text x="667.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Носій: HSM-as-a-Service</text>
<text x="667.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Межа: хмарний датацентр</text>
<text x="667.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Пам'ять: KMS KEK + DEK</text>
<text x="667.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Захист: IAM політики</text>
<text x="667.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Аудит: повний CloudTrail</text>
<text x="667.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Масштабування: еластичне</text>
<text x="667.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">• Рівень: FIPS 140-3 L3</text>
<rect x="670.0" y="320.0" width="165.0" height="32.0" rx="4" fill="#eaeded" stroke="#566573" stroke-width="1.2"/>
<text x="752.5" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle" font-weight="700">ХМАРНИЙ СЕРВІС</text>
<rect x="25.0" y="405.0" width="825.0" height="95.0" rx="8" fill="#f8f9fa" stroke="#34495e" stroke-width="1.5"/>
<text x="440.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Головний принцип апаратної безпеки: «Ключ — це не дані, а обчислювальна спроможність»</text>
<text x="440.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Приватний ключ ніколи не зчитується в RAM хоста. Хост надсилає лише геш даних, а чип повертає готовий підпис.</text>
<text x="440.0" y="479.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Компрометація операційної системи хоста не дозволяє зловмиснику скопіювати чи викрасти сам ключ.</text>
</svg>