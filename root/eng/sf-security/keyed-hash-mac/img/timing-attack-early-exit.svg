<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атака за часом (Timing Attack) на побайтове порівняння токенів</text>
<rect x="30.0" y="55.0" width="425.0" height="380.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="242.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ВРАЗЛИВО: memcmp() / == (ранній вихід)</text>
<rect x="50.0" y="105.0" width="385.0" height="60.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="242.5" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Еталонний MAC: [ 0x7F, 0xA2, 0x3C, 0xD4, ... ]</tspan><tspan x="242.5" dy="14.3">Підібраний MAC: [ 0x10, 0x00, 0x00, 0x00, ... ]</tspan></text>
<rect x="50.0" y="175.0" width="385.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="242.5" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Спроба 1: Байт 0 не збігся (0x10 != 0x7F)</tspan><tspan x="242.5" dy="14.3">-&gt; Ранній вихід: час відповіді ~ 5 нс</tspan></text>
<rect x="50.0" y="230.0" width="385.0" height="45.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="242.5" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Спроба 128: Байт 0 збігся (0x7F == 0x7F), байт 1 ні</tspan><tspan x="242.5" dy="14.3">-&gt; Ранній вихід на байті 1: час ~ 10 нс</tspan></text>
<rect x="50.0" y="285.0" width="385.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="242.5" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Спроба N: Перші k байтів збіглися</tspan><tspan x="242.5" dy="14.3">-&gt; Час відповіді зростає лінійно: ~ (k+1) · 5 нс</tspan></text>
<rect x="50.0" y="345.0" width="385.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="242.5" y="364.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="242.5" dy="0.0">Результат атаки:</tspan><tspan x="242.5" dy="14.3">Зловмисник вгадує таємний MAC байт за байтом!</tspan><tspan x="242.5" dy="14.3">Складність: 32 × 256 = 8 192 запитів</tspan><tspan x="242.5" dy="14.3">замість повного перебору 2²⁵⁶.</tspan></text>
<rect x="485.0" y="55.0" width="425.0" height="380.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="697.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">БЕЗПЕЧНО: Constant-Time Comparison</text>
<rect x="505.0" y="105.0" width="385.0" height="60.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="697.5" y="117.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="697.5" dy="0.0">volatile uint8_t diff = 0;</tspan><tspan x="697.5" dy="14.3">for (size_t i = 0; i &lt; len; ++i)</tspan><tspan x="697.5" dy="14.3">    diff |= a[i] ^ b[i];</tspan><tspan x="697.5" dy="14.3">return diff == 0;</tspan></text>
<rect x="505.0" y="175.0" width="385.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="697.5" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Спроба 1: Байт 0 не збігся</tspan><tspan x="697.5" dy="14.3">-&gt; Перевіряються всі 32 байти: час ~ 60 нс</tspan></text>
<rect x="505.0" y="230.0" width="385.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="697.5" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Спроба 128: Байт 0 збігся, байт 1 ні</tspan><tspan x="697.5" dy="14.3">-&gt; Перевіряються всі 32 байти: час ~ 60 нс</tspan></text>
<rect x="505.0" y="285.0" width="385.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="697.5" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Спроба N: Перші 31 байтів збіглися</tspan><tspan x="697.5" dy="14.3">-&gt; Перевіряються всі 32 байти: час ~ 60 нс</tspan></text>
<rect x="505.0" y="345.0" width="385.0" height="75.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="697.5" y="364.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="697.5" dy="0.0">Результат захисту:</tspan><tspan x="697.5" dy="14.3">Час виконання повністю незалежний від даних.</tspan><tspan x="697.5" dy="14.3">Жодного витоку через часовий канал (side-channel).</tspan><tspan x="697.5" dy="14.3">Складність злому залишається 2²⁵⁶.</tspan></text>
</svg>