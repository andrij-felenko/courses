<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атака подовженням повідомлення на Merkle-Damgard H(Key || Message)</text>
<rect x="30.0" y="55.0" width="880.0" height="165.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="50.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Легітимне обчислення клієнтом: H(K || M)</text>
<rect x="50.0" y="100.0" width="110.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="105.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Секрет Key</tspan><tspan x="105.0" dy="15.6">(невідомий)</tspan></text>
<rect x="165.0" y="100.0" width="140.0" height="50.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="235.0" y="122.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Дані M</tspan><tspan x="235.0" dy="11.7">(api_key=...&amp;perms=read)</tspan></text>
<rect x="310.0" y="100.0" width="120.0" height="50.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="370.0" y="122.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">MD-Padding</tspan><tspan x="370.0" dy="11.7">(\x80\x00...|| len)</tspan></text>
<line x1="435.0" y1="125.0" x2="485.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490.0" y="95.0" width="170.0" height="60.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/><text x="575.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">Компресія f(IV, ·)</tspan><tspan x="575.0" dy="15.6">(SHA-256 / MD5)</tspan></text>
<line x1="665.0" y1="125.0" x2="715.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="95.0" width="170.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="805.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Вихідний геш Tag T</tspan><tspan x="805.0" dy="14.3">= внутрішній стан H_n</tspan></text>
<text x="490.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Кінцевий геш повідомлення є повним внутрішнім вектором стану регістрів</text>
<rect x="30.0" y="245.0" width="880.0" height="195.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="50.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">2. Фальсифікація активним перехоплювачем без знання ключа K</text>
<rect x="50.0" y="290.0" width="190.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="145.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Перехоплений Tag T</tspan><tspan x="145.0" dy="15.6">(завантажується як IV')</tspan></text>
<line x1="245.0" y1="320.0" x2="295.0" y2="320.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="290.0" width="180.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="390.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Додаткові дані M_ext</tspan><tspan x="390.0" dy="15.6">(&amp;perms=admin)</tspan></text>
<line x1="485.0" y1="320.0" x2="535.0" y2="320.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="290.0" width="170.0" height="60.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/><text x="625.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Компресія f(IV', ·)</tspan><tspan x="625.0" dy="15.6">новий блок + pad'</tspan></text>
<line x1="715.0" y1="320.0" x2="765.0" y2="320.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="290.0" width="125.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="832.5" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="832.5" dy="0.0">Новий Tag T'</tspan><tspan x="832.5" dy="15.6">(валідний!)</tspan></text>
<text x="490.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сконструйоване повідомлення M' = M || MD-Padding || M_ext успішно проходить перевірку сервером</text>
<text x="490.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Сервер обчислює H(Key || M') і отримує точний збіг із T', не помічаючи підробки прав</text>
</svg>