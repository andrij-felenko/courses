<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часове вікно допуску та кешування Nonce</text>
<line x1="50.0" y1="100.0" x2="715.0" y2="100.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Час (t)</text>
<rect x="230.0" y="45.0" width="300.0" height="90.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="380.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Допустиме вікно свіжості (±Δt = 300 с)</text>
<line x1="380.0" y1="35.0" x2="380.0" y2="50.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,2"/>
<line x1="380.0" y1="75.0" x2="380.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,2"/>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">T_сервера (зараз)</text>
<text x="130.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Застарілий (t &lt; T - Δt)</text>
<text x="130.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Відхилити: прострочено</text>
<text x="620.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">З майбутнього (t &gt; T + Δt)</text>
<text x="620.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Відхилити: розсинхрон</text>
<rect x="60.0" y="165.0" width="640.0" height="105.0" rx="8" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="380.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм верифікації усередині вікна:</text>
<text x="380.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Чи |T_пакета - T_сервера| ≤ 300 с?  →  НІ: відхилити (без звернення до кешу)</text>
<text x="380.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2. Чи Nonce вже є в оперативному кеші?  →  ТАК: відхилити (Replay Attack!)</text>
<text x="380.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">3. Інакше: зберегти Nonce у кеш з TTL = 600 с та виконати запит</text>
</svg>