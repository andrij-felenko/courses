<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ковзне бітове вікно захисту від повторів</text>
<line x1="40.0" y1="80.0" x2="725.0" y2="80.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Seq №</text>
<rect x="40.0" y="45.0" width="170.0" height="70.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="125.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Позаду вікна (Seq &lt; M - W)</text>
<text x="125.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Відхилити без перевірки</text>
<rect x="230.0" y="35.0" width="300.0" height="90.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="380.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Ковзне вікно шириною W = 64 біти</text>
<rect x="250.0" y="75.0" width="26.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="263.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="282.0" y="75.0" width="26.0" height="26.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="295.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<rect x="314.0" y="75.0" width="26.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="327.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="346.0" y="75.0" width="26.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="359.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="378.0" y="75.0" width="26.0" height="26.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="391.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<rect x="410.0" y="75.0" width="26.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="423.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="442.0" y="75.0" width="26.0" height="26.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="455.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<rect x="474.0" y="75.0" width="26.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="487.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<text x="380.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Бітова маска: 1 = отримано, 0 = очікується</text>
<line x1="530.0" y1="25.0" x2="530.0" y2="135.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="4,3"/>
<text x="530.0" y="20.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">M (Seq_max)</text>
<rect x="550.0" y="45.0" width="160.0" height="70.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="630.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Попереду вікна (Seq &gt; M)</text>
<text x="630.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Зсунути вікно, M := Seq</text>
<rect x="40.0" y="150.0" width="680.0" height="125.0" rx="8" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="380.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правила обробки вхідного пакету з номером S:</text>
<text x="380.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• S &gt; M:  Пакет новий. Зсунути маску вліво на (S - M) біт, встановити біт 0, оновити M = S.</text>
<text x="380.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• M - W &lt; S ≤ M:  Пакет у вікні. Якщо біт (M - S) == 1 → ВІДХИЛИТИ (Replay); якщо 0 → ПРИЙНЯТИ і біт := 1.</text>
<text x="380.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• S ≤ M - W:  Пакет занадто старий. Негайно ВІДХИЛИТИ (захист від переповнення лічильника).</text>
<text x="380.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Часова складність: O(1) за бітовими операціями, фіксована пам'ять: 8-16 байт.</text>
</svg>