<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Криптографічний захист коду авторизації через PKCE</text>
<rect x="30.0" y="60.0" width="260.0" height="180.0" rx="10" fill="#fffef5" stroke="#b08900" stroke-width="1.6"/>
<text x="160.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="700">1. КЛІЄНТ ГЕНЕРУЄ ПАРУ</text>
<rect x="45.0" y="102.0" width="230.0" height="48.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.2"/><text x="160.0" y="122.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">code_verifier:</tspan><tspan x="160.0" dy="13.7">випадковий рядок 43-128 симв.</tspan></text>
<line x1="160.0" y1="154.0" x2="160.0" y2="172.0" stroke="#b08900" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="176.0" width="230.0" height="48.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.2"/><text x="160.0" y="196.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">code_challenge:</tspan><tspan x="160.0" dy="13.7">BASE64URL( SHA256(verifier) )</tspan></text>
<line x1="295.0" y1="190.0" x2="450.0" y2="190.0" stroke="#b08900" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="372.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">надсилає challenge</text>
<rect x="455.0" y="60.0" width="455.0" height="150.0" rx="10" fill="#f2f8f4" stroke="#27ae60" stroke-width="1.6"/>
<text x="682.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. СЕРВЕР АВТОРИЗАЦІЇ ЗБЕРІГАЄ CHALLENGE</text>
<rect x="475.0" y="105.0" width="415.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="682.5" y="129.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Зберігає пару: { code: &quot;XYZ&quot;, challenge: &quot;E9Melb…&quot;, method: &quot;S256&quot; }</tspan></text>
<rect x="475.0" y="154.0" width="415.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="682.5" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Повертає клієнту code=&quot;XYZ&quot; через редирект браузера</tspan></text>
<rect x="30.0" y="260.0" width="400.0" height="140.0" rx="10" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.6"/>
<text x="230.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. ЗЛОВМИСНИК ПЕРЕХОПЛЮЄ CODE</text>
<rect x="45.0" y="302.0" width="370.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="230.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Перехопив code=&quot;XYZ&quot; у браузері або custom URI scheme</tspan></text>
<text x="230.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Але verifier зловмисник НЕ знає і обчислити не може!</text>
<text x="230.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(односторонній хеш SHA-256 незворотний)</text>
<rect x="455.0" y="230.0" width="455.0" height="170.0" rx="10" fill="#f6f9fc" stroke="#2457d6" stroke-width="1.6"/>
<text x="682.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">4. ЗВІРКА ПРИ ОБМІНІ НА /token</text>
<rect x="475.0" y="272.0" width="415.0" height="46.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="682.5" y="291.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Чесний клієнт шле: code=&quot;XYZ&quot; + code_verifier=&quot;...</tspan><tspan x="682.5" dy="13.7">Сервер обчислює SHA-256(отриманий verifier)</tspan></text>
<rect x="475.0" y="326.0" width="415.0" height="60.0" rx="6" fill="#eef4fa" stroke="#2457d6" stroke-width="1.2"/><text x="682.5" y="352.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">SHA256(verifier) == збережений challenge → видати токен ✓</tspan><tspan x="682.5" dy="14.3">Немає verifier або хеш не зійшовся → 400 Bad Request ✗</tspan></text>
</svg>