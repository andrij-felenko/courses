<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік Authorization Code з перевіркою PKCE (RFC 7636)</text>
<rect x="40.0" y="48.0" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="125.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Користувач</text>
<text x="125.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Браузер)</text>
<line x1="125.0" y1="94.0" x2="125.0" y2="510.0" stroke="#d0d5dd" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="280.0" y="48.0" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.8"/>
<text x="365.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700">Клієнт</text>
<text x="365.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Застосунок)</text>
<line x1="365.0" y1="94.0" x2="365.0" y2="510.0" stroke="#d0d5dd" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="530.0" y="48.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="625.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сервер авторизації</text>
<text x="625.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(/authorize, /token)</text>
<line x1="625.0" y1="94.0" x2="625.0" y2="510.0" stroke="#d0d5dd" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="780.0" y="48.0" width="160.0" height="44.0" rx="6" fill="#ffffff" stroke="#7b1fa2" stroke-width="1.8"/>
<text x="860.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7b1fa2" text-anchor="middle" font-weight="700">Сервер ресурсів</text>
<text x="860.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(API даних)</text>
<line x1="860.0" y1="94.0" x2="860.0" y2="510.0" stroke="#d0d5dd" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="280.0" y="107.0" width="170.0" height="36.0" rx="6" fill="#fffdf2" stroke="#b08900" stroke-width="1.2"/><text x="365.0" y="121.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">Генерує verifier</tspan><tspan x="365.0" dy="13.7">і challenge = SHA256</tspan></text>
<line x1="365.0" y1="175.0" x2="125.0" y2="175.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="245.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. 302 Редирект на /authorize</text>
<line x1="125.0" y1="197.0" x2="625.0" y2="197.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="375.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2. GET /authorize?challenge=...&amp;state=...</text>
<rect x="525.0" y="220.0" width="200.0" height="36.0" rx="6" fill="#f2fbf4" stroke="#27ae60" stroke-width="1.2"/><text x="625.0" y="234.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Автентифікація користувача</tspan><tspan x="625.0" dy="13.7">й підтвердження прав (Consent)</tspan></text>
<line x1="625.0" y1="295.0" x2="125.0" y2="295.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="375.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. 302 Редирект на redirect_uri?code=XYZ&amp;state=...</text>
<line x1="125.0" y1="317.0" x2="365.0" y2="317.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="245.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4. Браузер повертає код клієнту</text>
<rect x="20.0" y="342.0" width="940.0" height="24.0" rx="4" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1.0"/>
<text x="490.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">▲ ВІДКРИТИЙ КАНАЛ (Front-Channel)   │   ПРЯМИЙ TLS КАНАЛ (Back-Channel) ▼</text>
<line x1="365.0" y1="395.0" x2="625.0" y2="395.0" stroke="#b08900" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="495.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">5. POST /token { code, code_verifier, client_secret }</text>
<line x1="625.0" y1="430.0" x2="365.0" y2="430.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="495.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">6. Відповідь: { access_token, refresh_token }</text>
<line x1="365.0" y1="475.0" x2="860.0" y2="475.0" stroke="#7b1fa2" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="612.5" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7b1fa2" text-anchor="middle" font-weight="700">7. GET /api/data  [Authorization: Bearer &lt;access_token&gt;]</text>
<line x1="860.0" y1="502.0" x2="365.0" y2="502.0" stroke="#7b1fa2" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="612.5" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">8. Захищені ресурси (200 OK)</text>
</svg>