<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Передача файлових дескрипторів через допоміжні дані (SCM_RIGHTS)</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#6b7280">Структура msghdr пов'язує основний буфер даних та контрольний буфер cmsghdr із відкритим дескриптором</text>

  <!-- ЛІВА ПАНЕЛЬ: msghdr -->
  <rect x="50" y="95" width="400" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="70" y="125" font-size="15" font-weight="bold" fill="#1a1a1a">Структура msghdr (Заголовок Повідомлення)</text>

  <rect x="70" y="145" width="360" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="85" y="172" font-size="13" font-weight="bold" fill="#1a1a1a">msg_name / msg_namelen</text>
  <text x="260" y="172" font-size="12" fill="#6b7280">(Адреса сокета / NULL)</text>

  <rect x="70" y="200" width="360" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="85" y="227" font-size="13" font-weight="bold" fill="#1a1a1a">msg_iov / msg_iovlen</text>
  <text x="250" y="227" font-size="12" fill="#6b7280">(Буфери звичайних даних)</text>

  <!-- msg_control (акцентне поле) -->
  <rect x="70" y="255" width="360" height="55" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="85" y="280" font-size="14" font-weight="bold" fill="#2457d6">msg_control</text>
  <text x="200" y="280" font-size="12" fill="#1a1a1a">→ Вказівник на буфер cmsghdr</text>
  <text x="85" y="300" font-size="12" fill="#6b7280">Вказує на пам'ять допоміжних даних</text>

  <rect x="70" y="320" width="360" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="85" y="347" font-size="13" font-weight="bold" fill="#1a1a1a">msg_controllen</text>
  <text x="220" y="347" font-size="12" fill="#6b7280">Розмір буфера cmsghdr (в байтах)</text>

  <rect x="70" y="375" width="360" height="35" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="85" y="398" font-size="13" font-weight="bold" fill="#1a1a1a">msg_flags</text>
  <text x="180" y="398" font-size="12" fill="#6b7280">Прапорці отримання (напр. MSG_CTRUNC)</text>

  <!-- ПРАВА ПАНЕЛЬ: cmsghdr та SCM_RIGHTS -->
  <rect x="510" y="95" width="400" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="530" y="125" font-size="15" font-weight="bold" fill="#1a1a1a">Панель Допоміжних Даних (cmsghdr)</text>

  <rect x="530" y="145" width="360" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="545" y="172" font-size="13" font-weight="bold" fill="#1a1a1a">cmsg_len</text>
  <text x="630" y="172" font-size="12" fill="#6b7280">CMSG_LEN(sizeof(int) * N)</text>

  <rect x="530" y="200" width="360" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="545" y="227" font-size="13" font-weight="bold" fill="#1a1a1a">cmsg_level</text>
  <text x="640" y="227" font-size="13" font-weight="bold" fill="#2457d6">SOL_SOCKET</text>

  <rect x="530" y="255" width="360" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="545" y="282" font-size="13" font-weight="bold" fill="#1a1a1a">cmsg_type</text>
  <text x="640" y="282" font-size="13" font-weight="bold" fill="#27ae60">SCM_RIGHTS</text>

  <!-- cmsg_data (акцентне корисне навантаження) -->
  <rect x="530" y="310" width="360" height="100" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="545" y="335" font-size="14" font-weight="bold" fill="#27ae60">cmsg_data[] (Корисне навантаження)</text>
  <rect x="545" y="348" width="330" height="45" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="560" y="375" font-size="13" font-weight="bold" fill="#1a1a1a">int target_fd = 4</text>
  <text x="700" y="375" font-size="12" fill="#6b7280">(Дескриптор для дублювання)</text>

  <!-- ЗВ'ЯЗУВАЛЬНА СТРІЛКА -->
  <path d="M 430 282 Q 470 282 510 167" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr)"/>
</svg>
