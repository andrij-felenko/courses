<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">\n<rect x="0" y="0" width="960" height="480" fill="white"/>\n<defs>\n<marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>\n<marker id="arr-prob" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>\n<marker id="arr-ok" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/></marker>\n<marker id="arr-acc" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/></marker>\n</defs>\n<text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перехоплення системного виклику фільтром seccomp-BPF</text>\n<text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">BPF-фільтр інспектує структуру seccomp_data та ухвалює рішення щодо системного виклику</text>\n<rect x="40" y="80" width="200" height="360" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>\n<text x="140" y="105" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">Користувацький простір</text>\n<rect x="60" y="140" width="160" height="60" fill="white" stroke="#d0d7de" stroke-width="1"/>\n<text x="140" y="165" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Робочий процес</text>\n<text x="140" y="185" font-size="13" font-weight="normal" fill="#2457d6" text-anchor="middle">Системний виклик</text>\n<rect x="280" y="80" width="640" height="360" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>\n<text x="600" y="105" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">Простір ядра Linux</text>\n<rect x="320" y="130" width="220" height="180" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>\n<text x="430" y="155" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">struct seccomp_data</text>\n<text x="340" y="185" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">nr (номер виклику)</text>\n<text x="340" y="210" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">arch (архітектура)</text>\n<text x="340" y="235" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">instruction_pointer</text>\n<text x="340" y="260" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">args[6] (аргументи)</text>\n<text x="340" y="285" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">...</text>\n<line x1="220" y1="170" x2="310" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-acc)"/>\n<rect x="600" y="160" width="200" height="100" fill="white" stroke="#d0d7de" stroke-width="1"/>\n<text x="700" y="185" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">BPF-фільтр</text>\n<text x="700" y="210" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Аналіз параметрів</text>\n<text x="700" y="235" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Виконання правил</text>\n<line x1="540" y1="210" x2="590" y2="210" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>\n<rect x="600" y="320" width="200" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>\n<text x="700" y="345" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">SECCOMP_RET_ALLOW</text>\n<text x="700" y="365" font-size="13" font-weight="normal" fill="#27ae60" text-anchor="middle">Виконати виклик</text>\n<rect x="320" y="350" width="240" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>\n<text x="440" y="375" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">SECCOMP_RET_KILL_PROCESS</text>\n<text x="440" y="395" font-size="13" font-weight="normal" fill="#c0392b" text-anchor="middle">Зупинити процес</text>\n<line x1="700" y1="260" x2="700" y2="310" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-ok)"/>\n<path d="M 620 260 L 620 380 L 570 380" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-prob)"/>\n</svg>