<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перехоплення системних викликів фільтром seccomp-BPF</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Фільтрація викликів на межі між простором користувача та ядром Linux</text>

  <!-- User Space Outer Box -->
  <rect x="40" y="80" width="240" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="60" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">User Space</text>

  <rect x="65" y="140" width="190" height="250" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="160" y="168" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Робочий процес</text>
  <text x="160" y="210" font-size="12" fill="#1a1a1a" text-anchor="middle">Виклик read() / write()</text>
  <text x="160" y="230" font-size="12" fill="#27ae60" text-anchor="middle">(Дозволений)</text>
  <text x="160" y="300" font-size="12" fill="#1a1a1a" text-anchor="middle">Виклик execve() / ptrace()</text>
  <text x="160" y="320" font-size="12" fill="#c0392b" text-anchor="middle">(Заборонений)</text>

  <!-- Seccomp Engine Outer Box -->
  <rect x="340" y="80" width="280" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="360" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">Seccomp BPF Engine</text>

  <rect x="365" y="140" width="230" height="250" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="168" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перевірка BPF</text>
  <text x="480" y="200" font-size="12" fill="#1a1a1a" text-anchor="middle">Перевірка sys_nr &amp; args</text>
  <text x="480" y="230" font-size="12" fill="#27ae60" text-anchor="middle">SECCOMP_RET_ALLOW</text>
  <text x="480" y="300" font-size="12" fill="#c0392b" text-anchor="middle">SECCOMP_RET_KILL_PROCESS</text>
  <text x="480" y="320" font-size="12" fill="#c0392b" text-anchor="middle">/ SECCOMP_RET_ERRNO</text>

  <!-- Kernel Space Outer Box -->
  <rect x="680" y="80" width="240" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="700" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">Kernel Space</text>

  <rect x="705" y="140" width="190" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="800" y="168" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Обробник ядра</text>
  <text x="800" y="198" font-size="12" fill="#1a1a1a" text-anchor="middle">Виконання syscall</text>
  <text x="800" y="218" font-size="12" fill="#1a1a1a" text-anchor="middle">Повернення відгуку</text>

  <rect x="705" y="270" width="190" height="120" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="800" y="298" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Блокування</text>
  <text x="800" y="328" font-size="12" fill="#c0392b" text-anchor="middle">Надсилання SIGSYS</text>
  <text x="800" y="348" font-size="12" fill="#c0392b" text-anchor="middle">або повернення EPERM</text>

  <!-- Connectors -->
  <path d="M 255 220 L 355 220" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="305" y="210" font-size="12" fill="#27ae60" text-anchor="middle">read/write</text>

  <path d="M 255 310 L 355 310" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="305" y="300" font-size="12" fill="#c0392b" text-anchor="middle">execve</text>

  <path d="M 595 220 L 695 220" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="645" y="210" font-size="12" fill="#27ae60" text-anchor="middle">ALLOW</text>

  <path d="M 595 310 L 695 310" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="645" y="300" font-size="12" fill="#c0392b" text-anchor="middle">KILL/ERRNO</text>
</svg>
