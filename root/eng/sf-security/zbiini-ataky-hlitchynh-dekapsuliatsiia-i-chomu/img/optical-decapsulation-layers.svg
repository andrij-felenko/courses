<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="740.0" height="350.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="30.0" y="30.0" width="420.0" height="45.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="240.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Епоксидний корпус (видалено HNO3 / H2SO4)</text>
<rect x="30.0" y="85.0" width="420.0" height="35.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="240.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Активна захисна сітка (Top Metal Shield)</text>
<rect x="30.0" y="130.0" width="420.0" height="70.0" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="240.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шари металізації M1–M6 (шини даних і живлення)</text>
<text x="240.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тут проходять відкриті шини Flash / SRAM / Crypto</text>
<rect x="30.0" y="210.0" width="420.0" height="65.0" rx="4" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="240.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Активний шар транзисторів (CMOS Gates, ROM, SRAM)</text>
<text x="240.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Оптичне зчитування маски ROM / LFI ін'єкції</text>
<rect x="30.0" y="285.0" width="420.0" height="55.0" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="240.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кремнієва підкладка (доступ для ІЧ-лазера 1064 нм)</text>
<rect x="470.0" y="30.0" width="260.0" height="310.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="74.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Вектори інвазивного злому:</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">• Декапсуляція:</tspan><tspan x="600.0" dy="14.3">  Кислотне травлення оголює кристал</tspan><tspan x="600.0" dy="14.3">  без пошкодження золотих розварок.</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">• Мікрозондування (Microprobing):</tspan><tspan x="600.0" dy="14.3">  Вольфрамові голки підключаються</tspan><tspan x="600.0" dy="14.3">  прямо до шин M2/M3 для дампу даних.</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">• FIB (Іонний пучок):</tspan><tspan x="600.0" dy="14.3">  Перерізання ліній захисних сенсорів</tspan><tspan x="600.0" dy="14.3">  та перемикання бітів eFuse.</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">• Backside LFI:</tspan><tspan x="600.0" dy="14.3">  Інфрачервоний лазер крізь підкладку</tspan><tspan x="600.0" dy="14.3">  збуджує фотострум у p-n переходах.</tspan></text>
<line x1="470.0" y1="100.0" x2="452.0" y2="100.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470.0" y1="165.0" x2="452.0" y2="165.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470.0" y1="315.0" x2="452.0" y2="315.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>