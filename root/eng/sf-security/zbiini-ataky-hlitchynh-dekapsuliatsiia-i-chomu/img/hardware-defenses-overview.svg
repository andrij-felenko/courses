<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="740.0" height="300.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="25.0" y="25.0" width="340.0" height="125.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="195.0" y="61.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">1. Апаратні детектори збоїв</tspan><tspan x="195.0" dy="11.7"></tspan><tspan x="195.0" dy="11.7">• Аналоговий монітор Vdd (Low/High Voltage Detect)</tspan><tspan x="195.0" dy="11.7">• Кільцевий генератор (Ring Oscillator) для тактових глітчів</tspan><tspan x="195.0" dy="11.7">• Фантомний критичний шлях (Dummy Delay Line)</tspan><tspan x="195.0" dy="11.7">-&gt; Миттєве апаратне переривання / HardFault</tspan></text>
<rect x="390.0" y="25.0" width="340.0" height="125.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="58.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">2. Dual-Rail логіка з передзарядом</tspan><tspan x="560.0" dy="13.0"></tspan><tspan x="560.0" dy="13.0">• Передає два взаємно-доповняльні сигнали: D та D_bar</tspan><tspan x="560.0" dy="13.0">• Інваріант: D != D_bar у кожному такті</tspan><tspan x="560.0" dy="13.0">• Будь-який збій (0,0 або 1,1) викликає апаратну тривогу</tspan><tspan x="560.0" dy="13.0">-&gt; Неможливо змінити один біт лазером/глітчем</tspan></text>
<rect x="25.0" y="165.0" width="340.0" height="130.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="195.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">3. Активний захисний екран (Mesh)</tspan><tspan x="195.0" dy="13.0"></tspan><tspan x="195.0" dy="13.0">• Верхній шар металу з псевдовипадковим сигналом (LFSR)</tspan><tspan x="195.0" dy="13.0">• Обрив мікрозондом або травлення кислотою змінює стан</tspan><tspan x="195.0" dy="13.0">• Контролер тампера миттєво стирає ключі (Zeroization)</tspan><tspan x="195.0" dy="13.0">-&gt; Блокує інвазивний мікропробінг і FIB</tspan></text>
<rect x="390.0" y="165.0" width="340.0" height="130.0" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/><text x="560.0" y="203.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">4. Шифрування шин та пам'яті</tspan><tspan x="560.0" dy="11.7"></tspan><tspan x="560.0" dy="11.7">• Апаратний AES-XTS/CTR модуль на шині Flash/SRAM</tspan><tspan x="560.0" dy="11.7">• Скремблювання адрес і ліній даних</tspan><tspan x="560.0" dy="11.7">• Програмна обфускація не потрібна: шина апаратно криптостійка</tspan><tspan x="560.0" dy="11.7">-&gt; Зчитаний мікрозондом дамп є випадковим шумом</tspan></text>
</svg>