<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="740.0" height="290.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="25.0" y="25.0" width="215.0" height="260.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="132.5" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">1. Штатна логіка захисту</tspan><tspan x="132.5" dy="11.7"></tspan><tspan x="132.5" dy="11.7">CMP   R0, #0       ; R0=перевірка</tspan><tspan x="132.5" dy="11.7">BEQ   lock_device  ; якщо 0 -&gt; бан</tspan><tspan x="132.5" dy="11.7">LDR   R1, =KEY_PTR ; доступ до ключа</tspan><tspan x="132.5" dy="11.7">BL    decrypt_boot ; розшифрування</tspan><tspan x="132.5" dy="11.7"></tspan><tspan x="132.5" dy="11.7">Результат: R0 == 0</tspan><tspan x="132.5" dy="11.7">-&gt; перехід на блокування</tspan><tspan x="132.5" dy="11.7">-&gt; пристрій захищено</tspan></text>
<line x1="245.0" y1="155.0" x2="275.0" y2="155.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="280.0" y="25.0" width="205.0" height="260.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="382.5" y="93.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="382.5" dy="0.0">2. Ін'єкція збою (Глітч)</tspan><tspan x="382.5" dy="13.0"></tspan><tspan x="382.5" dy="13.0">Момент: виконання BEQ</tspan><tspan x="382.5" dy="13.0">Тривалість: 15–30 нс</tspan><tspan x="382.5" dy="13.0">Вплив: просідання Vdd</tspan><tspan x="382.5" dy="13.0"></tspan><tspan x="382.5" dy="13.0">Вентилі прапорців не встигають</tspan><tspan x="382.5" dy="13.0">перемкнутися (t_pd &gt; T_clk).</tspan><tspan x="382.5" dy="13.0"></tspan><tspan x="382.5" dy="13.0">Декодер бачить зміщення 0</tspan><tspan x="382.5" dy="13.0">або опкод стає NOP (0xBF00).</tspan></text>
<line x1="490.0" y1="155.0" x2="520.0" y2="155.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="525.0" y="25.0" width="210.0" height="260.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="630.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">3. Зламаний потік (Bypass)</tspan><tspan x="630.0" dy="14.3"></tspan><tspan x="630.0" dy="14.3">CMP   R0, #0       ; виконано</tspan><tspan x="630.0" dy="14.3">[ГЛІТЧ] -&gt; BEQ стає NOP</tspan><tspan x="630.0" dy="14.3">LDR   R1, =KEY_PTR ; ВИКОНАНО!</tspan><tspan x="630.0" dy="14.3">BL    decrypt_boot ; ВИКОНАНО!</tspan><tspan x="630.0" dy="14.3"></tspan><tspan x="630.0" dy="14.3">Результат: умовний</tspan><tspan x="630.0" dy="14.3">перехід проігноровано,</tspan><tspan x="630.0" dy="14.3">захист RDP/Boot знято!</tspan></text>
</svg>