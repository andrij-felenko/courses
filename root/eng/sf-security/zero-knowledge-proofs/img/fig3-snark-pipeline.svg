<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="190.7" y="16.5" width="578.6" height="37.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="41.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Конвеєр ZK-SNARK: Від алгоритму до компактного доказу</tspan></text>
<rect x="30.0" y="95.0" width="200.0" height="340.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="130.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">1. Програма / Код</text>
<text x="130.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle"><tspan x="130.0" dy="0.0">Обчислення:</tspan><tspan x="130.0" dy="14.3">y = f(x, w)</tspan><tspan x="130.0" dy="14.3"></tspan><tspan x="130.0" dy="14.3">Приклад:</tspan><tspan x="130.0" dy="14.3">w² + 3w = y</tspan><tspan x="130.0" dy="14.3"></tspan><tspan x="130.0" dy="14.3">Мова вищого рівня</tspan><tspan x="130.0" dy="14.3">(Circom, Leo, ZoKrates)</tspan></text>
<line x1="235.0" y1="260.0" x2="265.0" y2="260.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="95.0" width="200.0" height="340.0" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="370.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">2. Арифметична схема</text>
<text x="370.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle"><tspan x="370.0" dy="0.0">Гейти +, × над F_p</tspan><tspan x="370.0" dy="14.3"></tspan><tspan x="370.0" dy="14.3">Вентилі вентильної</tspan><tspan x="370.0" dy="14.3">мережі:</tspan><tspan x="370.0" dy="14.3">v₁ = w × w</tspan><tspan x="370.0" dy="14.3">v₂ = 3 × w</tspan><tspan x="370.0" dy="14.3">y = v₁ + v₂</tspan></text>
<line x1="475.0" y1="260.0" x2="505.0" y2="260.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="510.0" y="95.0" width="200.0" height="340.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="610.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">3. R1CS / QAP</text>
<text x="610.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle"><tspan x="610.0" dy="0.0">Система обмежень</tspan><tspan x="610.0" dy="14.3">рангу 1 (R1CS):</tspan><tspan x="610.0" dy="14.3">(A·s) × (B·s) = (C·s)</tspan><tspan x="610.0" dy="14.3"></tspan><tspan x="610.0" dy="14.3">Перетворення у QAP:</tspan><tspan x="610.0" dy="14.3">Поліноми A(x), B(x), C(x)</tspan><tspan x="610.0" dy="14.3">діляться на T(x)</tspan></text>
<line x1="715.0" y1="260.0" x2="745.0" y2="260.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="750.0" y="95.0" width="180.0" height="340.0" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="840.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#065f46" text-anchor="middle" font-weight="700">4. ZK-SNARK Доказ</text>
<text x="840.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="middle"><tspan x="840.0" dy="0.0">Еліптичні криві</tspan><tspan x="840.0" dy="14.3">та спарювання (Pairing)</tspan><tspan x="840.0" dy="14.3"></tspan><tspan x="840.0" dy="14.3">Доказ π = (A, B, C)</tspan><tspan x="840.0" dy="14.3">Розмір: ~128-288 байт</tspan><tspan x="840.0" dy="14.3"></tspan><tspan x="840.0" dy="14.3">Перевірка V:</tspan><tspan x="840.0" dy="14.3">за O(1) часу!</tspan></text>
<rect x="54.6" y="440.5" width="850.9" height="23.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="480.0" y="455.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Основні властивості SNARK: Succinct (стислий), Non-interactive (неінтерактивний), Zero-Knowledge (з нульовим розголошенням)</tspan></text>
</svg>