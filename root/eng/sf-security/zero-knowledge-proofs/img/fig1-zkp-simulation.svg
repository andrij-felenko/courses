<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="153.8" y="16.5" width="652.4" height="37.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="41.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Парадигма симуляції у протоколах нульового розголошення (ZK)</tspan></text>
<rect x="30.0" y="75.0" width="435.0" height="420.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="247.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle" font-weight="700">Реальний світ (Real Execution)</text>
<text x="247.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Взаємодія справжнього Prover із секретом w та Verifier</text>
<rect x="101.2" y="149.3" width="291.6" height="37.3" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="247.0" y="164.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">Секретний свідок w (Witness)</tspan><tspan x="247.0" dy="14.3">(Наприклад: секретний ключ або NP-свідок)</tspan></text>
<rect x="123.1" y="207.2" width="247.9" height="55.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="247.0" y="224.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">Доводжувач P(x, w)</tspan><tspan x="247.0" dy="14.3">Обчислює зобов'язання та відповіді</tspan><tspan x="247.0" dy="14.3">використовуючи секрет w</tspan></text>
<line x1="247.0" y1="275.0" x2="247.0" y2="305.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="247.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" font-weight="700">Протокол P(x,w) ↔ V*(x)</text>
<rect x="164.0" y="317.2" width="166.0" height="55.6" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="247.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">Верифікатор V*(x)</tspan><tspan x="247.0" dy="14.3">(Може діяти зловмисно,</tspan><tspan x="247.0" dy="14.3">але з обмеженням PPT)</tspan></text>
<rect x="101.5" y="417.5" width="291.0" height="35.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="247.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">Транскрипт виконання: View_V*(P(x,w) ↔ V*(x))</tspan><tspan x="247.0" dy="13.0">Включає всі випадкові монети та повідомлення</tspan></text>
<rect x="495.0" y="75.0" width="435.0" height="420.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="712.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#581c87" text-anchor="middle" font-weight="700">Симуляція (Ideal World / Simulation)</text>
<text x="712.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Симулятор створює транскрипт БЕЗ secrets w</text>
<rect x="598.3" y="152.2" width="227.4" height="55.6" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/><text x="712.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">Симулятор S^{V*}(x)</tspan><tspan x="712.0" dy="14.3">НЕ знає секретного свідка w!</tspan><tspan x="712.0" dy="14.3">Має доступ до стану та монет V*</tspan></text>
<rect x="581.2" y="240.1" width="261.5" height="69.9" rx="6" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5"/><text x="712.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">Механізм перемотування (Rewinding):</tspan><tspan x="712.0" dy="14.3">1. Згенерувати фальшиве зобов'язання</tspan><tspan x="712.0" dy="14.3">2. Отримати виклик від V*</tspan><tspan x="712.0" dy="14.3">3. Перемотати стан V* при незбігу</tspan></text>
<rect x="591.3" y="347.5" width="241.4" height="35.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="712.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">Згенерований транскрипт: S(x)</tspan><tspan x="712.0" dy="13.0">Абсолютно невідрізнюваний від View_V*</tspan></text>
<rect x="556.0" y="421.4" width="312.1" height="37.3" rx="6" fill="#fae8ff" stroke="#d8b4fe" stroke-width="1.5"/><text x="712.0" y="436.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">Розподіли імовірностей:</tspan><tspan x="712.0" dy="14.3">View_V* ≈_c S(x) (Обчислювальна/Статистична)</tspan></text>
</svg>