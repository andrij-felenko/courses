<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири ролі в архітектурі OAuth 2.0 та OpenID Connect</text>
<rect x="40.0" y="60.0" width="400.0" height="160.0" rx="12" fill="#fffdfa" stroke="#b08900" stroke-width="1.8"/>
<text x="240.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="700">Власник ресурсу (Resource Owner)</text>
<rect x="56.0" y="102.0" width="368.0" height="104.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text x="240.0" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Людина, якій належать дані (профіль, фото, контакти).</tspan><tspan x="240.0" dy="15.0">• Автентифікується на сервері авторизації;</tspan><tspan x="240.0" dy="15.0">• Переглядає запитувані права (scopes);</tspan><tspan x="240.0" dy="15.0">• Надає згоду (consent) на делегування доступу.</tspan></text>
<rect x="40.0" y="250.0" width="400.0" height="180.0" rx="12" fill="#f4f7fe" stroke="#2457d6" stroke-width="1.8"/>
<text x="240.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Клієнт (Client Application)</text>
<rect x="56.0" y="290.0" width="368.0" height="126.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text x="240.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Застосунок, який бажає діяти від імені користувача.</tspan><tspan x="240.0" dy="15.0">• Конфіденційний: бекенд із таємним client_secret;</tspan><tspan x="240.0" dy="15.0">• Публічний: SPA у браузері або мобільний застосунок;</tspan><tspan x="240.0" dy="15.0">• Отримує токени та використовує їх для викликів API.</tspan></text>
<rect x="500.0" y="60.0" width="400.0" height="160.0" rx="12" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="700.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сервер авторизації / IdP (Auth Server)</text>
<rect x="516.0" y="102.0" width="368.0" height="104.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text x="700.0" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Центральний довірений вузол автентифікації.</tspan><tspan x="700.0" dy="15.0">• Перевіряє особу користувача (пароль, MFA);</tspan><tspan x="700.0" dy="15.0">• Запитує згоду та видає авторизаційний код;</tspan><tspan x="700.0" dy="15.0">• Генерує та підписує токени (access, id, refresh).</tspan></text>
<rect x="500.0" y="250.0" width="400.0" height="180.0" rx="12" fill="#fbf8ff" stroke="#7b1fa2" stroke-width="1.8"/>
<text x="700.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7b1fa2" text-anchor="middle" font-weight="700">Сервер ресурсів (Resource Server / API)</text>
<rect x="516.0" y="290.0" width="368.0" height="126.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/><text x="700.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Сервер, що зберігає цільові дані й захищений API.</tspan><tspan x="700.0" dy="15.0">• Приймає HTTP-запити із заголовком Authorization;</tspan><tspan x="700.0" dy="15.0">• Перевіряє валідність та підпис access_token;</tspan><tspan x="700.0" dy="15.0">• Звіряє scopes із потрібними дозволами на дію.</tspan></text>
<line x1="240.0" y1="220.0" x2="240.0" y2="248.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="700.0" y1="220.0" x2="700.0" y2="248.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440.0" y1="140.0" x2="498.0" y2="140.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440.0" y1="340.0" x2="498.0" y2="340.0" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>