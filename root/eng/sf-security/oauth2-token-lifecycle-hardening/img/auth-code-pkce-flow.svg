<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний потік авторизаційного коду з PKCE (Authorization Code + PKCE)</text>
<rect x="25.0" y="48.0" width="150.0" height="44.0" rx="8" fill="#fffdfa" stroke="#b08900" stroke-width="1.6"/>
<text x="100.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Користувач</tspan><tspan x="100.0" dy="14.3">(Браузер)</tspan></text>
<line x1="100.0" y1="94.0" x2="100.0" y2="490.0" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="275.0" y="48.0" width="150.0" height="44.0" rx="8" fill="#f4f7fe" stroke="#2457d6" stroke-width="1.6"/>
<text x="350.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Клієнтський</tspan><tspan x="350.0" dy="14.3">застосунок</tspan></text>
<line x1="350.0" y1="94.0" x2="350.0" y2="490.0" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="545.0" y="48.0" width="150.0" height="44.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="620.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Сервер авторизації</tspan><tspan x="620.0" dy="14.3">(Auth Server / IdP)</tspan></text>
<line x1="620.0" y1="94.0" x2="620.0" y2="490.0" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="795.0" y="48.0" width="150.0" height="44.0" rx="8" fill="#fbf8ff" stroke="#7b1fa2" stroke-width="1.6"/>
<text x="870.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7b1fa2" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Сервер ресурсів</tspan><tspan x="870.0" dy="14.3">(API)</tspan></text>
<line x1="870.0" y1="94.0" x2="870.0" y2="490.0" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="16.0" y="102.0" width="928.0" height="192.0" rx="10" fill="#fdfcf7" stroke="#b08900" stroke-width="1.2"/>
<text x="200.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700">ФРОНТ-КАНАЛ (через браузер користувача)</text>
<rect x="270.0" y="126.0" width="160.0" height="32.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="350.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">code_verifier</tspan><tspan x="350.0" dy="12.3">challenge = SHA256(v)</tspan></text>
<line x1="350.0" y1="168.0" x2="618.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="485.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. GET /authorize?response_type=code&amp;code_challenge=...&amp;state=...</text>
<line x1="620.0" y1="200.0" x2="102.0" y2="200.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="360.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">2. Форма автентифікації та екран надання дозволів (Consent)</text>
<line x1="100.0" y1="230.0" x2="618.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="360.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3. Користувач підтверджує особу й дозволи</text>
<line x1="620.0" y1="262.0" x2="352.0" y2="262.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="485.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">4. 302 Redirect: /callback?code=AUTH_CODE&amp;state=...</text>
<rect x="16.0" y="306.0" width="928.0" height="190.0" rx="10" fill="#f6f9fc" stroke="#2457d6" stroke-width="1.2"/>
<text x="200.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">БЕК-КАНАЛ (прямий захищений HTTPS між серверами)</text>
<line x1="350.0" y1="348.0" x2="618.0" y2="348.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="485.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">5. POST /token (code + code_verifier + client_secret)</text>
<rect x="540.0" y="362.0" width="160.0" height="26.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/><text x="620.0" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Звірка: SHA256(verifier) == challenge</tspan></text>
<line x1="620.0" y1="404.0" x2="352.0" y2="404.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="485.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">6. Відповідь: { access_token, id_token, refresh_token }</text>
<line x1="350.0" y1="444.0" x2="868.0" y2="444.0" stroke="#7b1fa2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="610.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7b1fa2" text-anchor="middle">7. GET /api/resource (Authorization: Bearer &lt;access_token&gt;)</text>
<line x1="870.0" y1="472.0" x2="352.0" y2="472.0" stroke="#7b1fa2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="610.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7b1fa2" text-anchor="middle">8. Захищені дані ресурсу (200 OK + JSON)</text>
</svg>