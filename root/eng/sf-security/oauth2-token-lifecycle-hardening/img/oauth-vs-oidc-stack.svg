<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Співвідношення протоколів: OpenID Connect як шар ідентичності над OAuth 2.0</text>
<rect x="60.0" y="60.0" width="820.0" height="140.0" rx="12" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="470.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">OpenID Connect 1.0 (Автентифікація та Профіль)</text>
<rect x="80.0" y="104.0" width="240.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="200.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">ID Token (JWT)</tspan><tspan x="200.0" dy="14.3">• sub, iss, aud, exp</tspan><tspan x="200.0" dy="14.3">• nonce, auth_time</tspan></text>
<rect x="350.0" y="104.0" width="240.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="470.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Стандартні Scopes:</tspan><tspan x="470.0" dy="14.3">openid, profile, email,</tspan><tspan x="470.0" dy="14.3">address, phone</tspan></text>
<rect x="620.0" y="104.0" width="240.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="740.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Ендпоінти OIDC:</tspan><tspan x="740.0" dy="14.3">• /.well-known/openid-conf</tspan><tspan x="740.0" dy="14.3">• /userinfo</tspan><tspan x="740.0" dy="14.3">• /jwks.json</tspan></text>
<line x1="470.0" y1="202.0" x2="470.0" y2="228.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">надбудований над ↓</text>
<rect x="60.0" y="236.0" width="820.0" height="150.0" rx="12" fill="#fffdfa" stroke="#b08900" stroke-width="2.0"/>
<text x="470.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b08900" text-anchor="middle" font-weight="700">OAuth 2.0 Framework · RFC 6749 (Делегована авторизація)</text>
<rect x="80.0" y="280.0" width="240.0" height="90.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.2"/><text x="200.0" y="308.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Потоки надання прав:</tspan><tspan x="200.0" dy="13.7">• Authorization Code (+ PKCE)</tspan><tspan x="200.0" dy="13.7">• Client Credentials</tspan><tspan x="200.0" dy="13.7">• Refresh Token Grant</tspan></text>
<rect x="350.0" y="280.0" width="240.0" height="90.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.2"/><text x="470.0" y="308.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Токени та безпека:</tspan><tspan x="470.0" dy="13.7">• access_token (Bearer)</tspan><tspan x="470.0" dy="13.7">• refresh_token</tspan><tspan x="470.0" dy="13.7">• scope (довільні рядки)</tspan></text>
<rect x="620.0" y="280.0" width="240.0" height="90.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.2"/><text x="740.0" y="308.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Базові ендпоінти:</tspan><tspan x="740.0" dy="13.7">• /authorize (фронт-канал)</tspan><tspan x="740.0" dy="13.7">• /token (бек-канал)</tspan><tspan x="740.0" dy="13.7">• /revoke, /introspect</tspan></text>
</svg>