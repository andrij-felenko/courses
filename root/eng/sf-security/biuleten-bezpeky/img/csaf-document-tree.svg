<text x="150.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">document (Метадані)</text>
<text x="150.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• title, category: csaf_security_advisory</text>
<text x="150.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• publisher: вендор, namespace, PGP</text>
<text x="150.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• tracking: id, status, version</text>
<text x="150.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• references &amp; notes</text>
<rect x="300.0" y="105.0" width="220.0" height="115.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="410.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">product_tree (Каталог)</text>
<text x="410.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• branches: вендори, родини ПЗ</text>
<text x="410.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• full_product_names (ID, назва)</text>
<text x="410.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• cpe: cpe:2.3:a:vendor:pkg:...</text>
<text x="410.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• purl: pkg:npm/openssl@3.0.0</text>
<rect x="560.0" y="105.0" width="220.0" height="115.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="670.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">vulnerabilities[] (Вади)</text>
<text x="670.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• cve: CVE-YYYY-NNNNN</text>
<text x="670.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• cwe: CWE-787 (Out-of-bounds)</text>
<text x="670.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• scores: CVSS v3.1 / CVSS v4.0</text>
<text x="670.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• product_status: affected, fixed</text>
