<line x1="670.0" y1="220.0" x2="670.0" y2="255.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="230.0" y="255.0" width="550.0" height="85.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="505.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пов'язування продукту з дією (Remediations &amp; Threat Assessment)</text>
<text x="505.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• product_status: відображає product_id на матрицю (known_affected, fixed, known_not_affected)</text>
<text x="505.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• remediations: category (vendor_fix, workaround, mitigation) + product_ids + url</text>
<text x="505.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• flags: machine-readable маркери відсутності експлуатації / VEX-статуси</text>
</svg>