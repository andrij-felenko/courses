<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Баланс безпекового розкриття: захисна цінність проти наступальної зброї</text>
<rect x="30.0" y="35.0" width="360.0" height="250.0" rx="8" fill="#f0faf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="210.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Обов'язково розкрити (Захист)</text>
<text x="210.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Інформація, критична для оборони систем</text>
<text x="50.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Точний діапазон версій, конфігурації та архітектури</text>
<text x="50.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ідентифікатори: CVE ID, CWE клас, CVSS вектор</text>
<text x="50.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Умови досяжності вади (мережева, локальна, прапорці)</text>
<text x="50.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Інструкція оновлення та SHA-256 / PGP підписи пакетів</text>
<text x="50.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Тимчасові пом'якшення (Workarounds) без простою</text>
<text x="50.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Індикатори компрометації (IoC) для детекції в логах</text>
<rect x="430.0" y="35.0" width="360.0" height="250.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<text x="610.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Категорично заборонено (Атака)</text>
<text x="610.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Деталі, що автоматизують створення зброї</text>
<text x="450.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Готовий код PoC-експлойту та curl-команди атаки</text>
<text x="450.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Точні зміщення пам'яті (offsets) та адреси ROP-гаджетів</text>
<text x="450.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Покрокові інструкції з обходу захистів (ASLR, DEP, WAF)</text>
<text x="450.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Готове шкідливе навантаження (shellcode / payload)</text>
<text x="450.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Недокументовані вторинні вразливості до їх закриття</text>
<text x="450.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Приховані вразливі адреси серверів жертв чи вендора</text>
</svg>