<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Декомпозиція задачі дискретного логарифма за алгоритмом Поліга — Геллмана</text>
<rect x="53.4" y="138.2" width="173.1" height="83.7" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Глобальна задача ДЛ</tspan><tspan x="140.0" dy="16.9">Порядок N = ∏ pᵢᵉⁱ</tspan><tspan x="140.0" dy="16.9">gˣ = h  у групі G</tspan><tspan x="140.0" dy="16.9">Шукаємо: x mod N</tspan></text>
<rect x="304.3" y="52.3" width="231.4" height="45.3" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="71.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Підгрупа H₁ (порядок p₁ᵉ¹)</tspan><tspan x="420.0" dy="14.3">g₁ˣ¹ = h₁  ⟹  x ≡ x₁ (mod p₁ᵉ¹)</tspan></text>
<rect x="304.3" y="132.3" width="231.4" height="45.3" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Підгрупа H₂ (порядок p₂ᵉ²)</tspan><tspan x="420.0" dy="14.3">g₂ˣ² = h₂  ⟹  x ≡ x₂ (mod p₂ᵉ²)</tspan></text>
<rect x="304.3" y="262.4" width="231.4" height="45.3" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="281.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Підгрупа Hₖ (порядок pₖᵉᵏ)</tspan><tspan x="420.0" dy="14.3">gₖˣᵏ = hₖ  ⟹  x ≡ xₖ (mod pₖᵉᵏ)</tspan></text>
<text x="420.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="700">•   •   •</text>
<line x1="260.0" y1="160.0" x2="290.0" y2="75.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">степінь N/p₁ᵉ¹</text>
<line x1="260.0" y1="175.0" x2="290.0" y2="155.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="265.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">степінь N/p₂ᵉ²</text>
<line x1="260.0" y1="195.0" x2="290.0" y2="285.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">степінь N/pₖᵉᵏ</text>
<rect x="629.3" y="125.0" width="161.4" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Китайська теорема</tspan><tspan x="710.0" dy="15.6">про залишки (CRT)</tspan><tspan x="710.0" dy="15.6">x ≡ x₁ (mod p₁ᵉ¹)</tspan><tspan x="710.0" dy="15.6">…</tspan><tspan x="710.0" dy="15.6">x ≡ xₖ (mod pₖᵉᵏ)</tspan><tspan x="710.0" dy="15.6">⟹  x mod N знайдено</tspan></text>
<line x1="550.0" y1="75.0" x2="580.0" y2="160.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550.0" y1="155.0" x2="580.0" y2="175.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550.0" y1="285.0" x2="580.0" y2="195.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Проекція підносить елементи до степеня N/pᵢᵉⁱ, обнуляючи всі сторонні множники.</text>
<text x="420.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розв'язки xᵢ у малих підгрупах об'єднуються в єдиний показник x за модулем N.</text>
</svg>