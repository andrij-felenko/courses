<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блок-схема алгоритму Ленстри — Ленстри — Ловаса (LLL)</text>
<rect x="221.9" y="38.4" width="396.2" height="63.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="58.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Вхід: базис b₁, b₂, ..., bₙ ∈ ℤᵐ, параметр δ ∈ (1/4, 1]</tspan><tspan x="420.0" dy="15.6">Обчислення Грама — Шмідта b*₁, ..., b*ₙ та μ_{i,j}</tspan><tspan x="420.0" dy="15.6">Ініціалізація індексу: k = 2</tspan></text>
<line x1="420.0" y1="105.0" x2="420.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="269.8" y="133.4" width="300.4" height="63.2" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1. Розмірне редукування пари (k, k−1)</tspan><tspan x="420.0" dy="15.6">q = ⌊μ_{k, k−1}⌉;   bₖ ← bₖ − q · bₖ₋₁</tspan><tspan x="420.0" dy="15.6">Оновлення коефіцієнтів μ_{k, j} для j &lt; k</tspan></text>
<line x1="420.0" y1="200.0" x2="420.0" y2="235.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="264.9" y="241.2" width="310.2" height="47.6" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="420.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">2. Перевірка умови Ловаса:</tspan><tspan x="420.0" dy="15.6">‖b*ₖ‖² ≥ (δ − μ_{k, k−1}²) · ‖b*ₖ₋₁‖² ?</tspan></text>
<line x1="264.9" y1="265.0" x2="140.0" y2="265.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="202.5" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НІ</text>
<rect x="37.7" y="318.4" width="204.7" height="63.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Обмін bₖ ↔ bₖ₋₁</tspan><tspan x="140.0" dy="15.6">Перерахунок b*ₖ₋₁, b*ₖ та μ</tspan><tspan x="140.0" dy="15.6">k ← max(k − 1, 2)</tspan></text>
<line x1="140.0" y1="265.0" x2="140.0" y2="310.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="140.0" y1="395.0" x2="140.0" y2="435.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="140.0" y1="435.0" x2="25.0" y2="435.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="25.0" y1="435.0" x2="25.0" y2="165.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="25.0" y1="165.0" x2="269.8" y2="165.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="575.1" y1="265.0" x2="680.0" y2="265.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="627.5" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="577.7" y="310.6" width="204.7" height="78.8" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Повне розмірне редукування:</tspan><tspan x="680.0" dy="15.6">для j = k−2 спадаючи до 1:</tspan><tspan x="680.0" dy="15.6">  bₖ ← bₖ − ⌊μ_{k,j}⌉ · bⱼ</tspan><tspan x="680.0" dy="15.6">Крок уперед: k ← k + 1</tspan></text>
<line x1="680.0" y1="265.0" x2="680.0" y2="310.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="395.0" x2="680.0" y2="430.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="548.9" y="435.4" width="262.2" height="59.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="453.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">k &gt; n ?</tspan><tspan x="680.0" dy="15.6">ТАК → Кінець (базис LLL-редукований)</tspan><tspan x="680.0" dy="15.6">НІ → Повернутися на крок 1</tspan></text>
<line x1="811.1" y1="465.0" x2="815.0" y2="465.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="815.0" y1="465.0" x2="815.0" y2="165.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="815.0" y1="165.0" x2="570.2" y2="165.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>