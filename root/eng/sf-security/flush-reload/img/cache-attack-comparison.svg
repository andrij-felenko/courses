<text x="47.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="47.0" dy="0.0">• Потребує: спільну пам'ять (mmap)</tspan><tspan x="47.0" dy="16.1">• Інструкція: clflush / clflushopt</tspan><tspan x="47.0" dy="16.1">• Точність: лінія кешу (64 байти)</tspan><tspan x="47.0" dy="16.1">• Рівень шуму: надзвичайно низький</tspan><tspan x="47.0" dy="16.1">• Швидкість: до 1–2 МБ/с</tspan><tspan x="47.0" dy="16.1">• Кеш: інклюзивний LLC (L3)</tspan></text>
<rect x="237.0" y="58.0" width="186.0" height="305.0" rx="8" fill="#fef9ee" stroke="#d97706" stroke-width="1.8"/>
<rect x="272.3" y="65.0" width="115.5" height="34.0" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="330.0" y="86.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Prime+Probe</tspan></text>
<text x="249.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="249.0" dy="0.0">• Потребує: спільний набір кешу</tspan><tspan x="249.0" dy="16.1">• Не потребує спільної пам'яті!</tspan><tspan x="249.0" dy="16.1">• Точність: набір кешу (Set)</tspan><tspan x="249.0" dy="16.1">• Рівень шуму: середній / високий</tspan><tspan x="249.0" dy="16.1">• Швидкість: 10–100 КБ/с</tspan><tspan x="249.0" dy="16.1">• Використовує: заповнення ліній</tspan></text>
<rect x="439.0" y="58.0" width="186.0" height="305.0" rx="8" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.8"/>
<rect x="474.3" y="65.0" width="115.5" height="34.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="532.0" y="86.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="532.0" dy="0.0">Flush+Flush</tspan></text>
<text x="451.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="451.0" dy="0.0">• Потребує: спільну пам'ять (mmap)</tspan><tspan x="451.0" dy="16.1">• Заміряє час САМОЇ clflush</tspan><tspan x="451.0" dy="16.1">• Не викликає завантаження в кеш</tspan><tspan x="451.0" dy="16.1">• Stealth: не видно у лічильниках</tspan><tspan x="451.0" dy="16.1">• Рівень шуму: високий</tspan><tspan x="451.0" dy="16.1">• Швидкість: середня</tspan></text>
<rect x="641.0" y="58.0" width="186.0" height="305.0" rx="8" fill="#f0f8f3" stroke="#27ae60" stroke-width="1.8"/>
<rect x="671.9" y="65.0" width="124.2" height="34.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="734.0" y="86.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="734.0" dy="0.0">Evict+Reload</tspan></text>
<text x="653.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="653.0" dy="0.0">• Потребує: спільну пам'ять</tspan><tspan x="653.0" dy="16.1">• Без clflush (наприклад, ARM / JS)</tspan><tspan x="653.0" dy="16.1">• Витіснення через набір ліній</tspan><tspan x="653.0" dy="16.1">• Точність: лінія кешу (64 байти)</tspan><tspan x="653.0" dy="16.1">• Рівень шуму: помірний</tspan><tspan x="653.0" dy="16.1">• Працює без спец-інструкцій</tspan></text>
