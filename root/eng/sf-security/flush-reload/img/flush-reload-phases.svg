<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три фази циклу вимірювання Flush+Reload</text>
<rect x="35.0" y="56.0" width="246.0" height="310.0" rx="8" fill="#f0f4fc" stroke="#2457d6" stroke-width="2.0"/>
<rect x="65.5" y="65.0" width="184.9" height="34.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="158.0" y="86.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="158.0" dy="0.0">1. FLUSH (Очищення)</tspan></text>
<text x="158.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="158.0" dy="0.0">Атакуючий виконує інструкцію</tspan><tspan x="158.0" dy="18.2">clflush для цільової адреси:</tspan><tspan x="158.0" dy="18.2"></tspan><tspan x="158.0" dy="18.2">Лінія витісняється з L1, L2</tspan><tspan x="158.0" dy="18.2">та інклюзивного L3 в DRAM.</tspan><tspan x="158.0" dy="18.2">Кеш стає «холодним» для всіх ядер.</tspan></text>
<line x1="285.0" y1="211.0" x2="303.0" y2="211.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="307.0" y="56.0" width="246.0" height="310.0" rx="8" fill="#fdf2f0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="311.5" y="65.0" width="237.0" height="34.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="86.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">2. VICTIM / WAIT (Жертва)</tspan></text>
<text x="430.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Програма-жертва виконує код.</tspan><tspan x="430.0" dy="18.2">Якщо виконано гілку з секретом:</tspan><tspan x="430.0" dy="18.2"></tspan><tspan x="430.0" dy="18.2">Процесор звертається до адреси,</tspan><tspan x="430.0" dy="18.2">і лінія підтягується в L1/L2/L3.</tspan><tspan x="430.0" dy="18.2">Якщо секрет інший — лінія в DRAM.</tspan></text>
<line x1="557.0" y1="211.0" x2="575.0" y2="211.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="579.0" y="56.0" width="246.0" height="310.0" rx="8" fill="#f0f8f3" stroke="#27ae60" stroke-width="2.0"/>
<rect x="592.2" y="65.0" width="219.6" height="34.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="702.0" y="86.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="702.0" dy="0.0">3. RELOAD (Вимірювання)</tspan></text>
<text x="702.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="702.0" dy="0.0">Атакуючий зчитує цільову адресу,</tspan><tspan x="702.0" dy="18.2">заміряючи час через rdtsc / rdtscp:</tspan><tspan x="702.0" dy="18.2"></tspan><tspan x="702.0" dy="18.2">Швидко (&lt; 80 тактів) → Cache HIT</tspan><tspan x="702.0" dy="18.2">(жертва зверталась до даних!)</tspan><tspan x="702.0" dy="18.2">Повільно (&gt; 180 тактів) → Cache MISS</tspan></text>
</svg>