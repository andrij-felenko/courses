<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="98.0" y="10.5" width="764.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="33.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Побічний канал кеш-пам'яті: витік секретного індексу при табличних перетвореннях</tspan></text>
<rect x="25.0" y="60.0" width="910.0" height="130.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Структура таблиці підстановок AES S-Box у пам'яті (256 байтів = 4 кеш-лінії по 64 байти)</text>
<rect x="59.6" y="107.9" width="160.8" height="54.2" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="140.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Кеш-лінія 0 (байти 0..63)</tspan><tspan x="140.0" dy="12.3">Елементи S-Box: 0x00..0x3F</tspan><tspan x="140.0" dy="12.3">Стан: Холодна (DRAM)</tspan></text>
<rect x="274.6" y="107.9" width="190.8" height="54.2" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="370.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Кеш-лінія 1 (байти 64..127)</tspan><tspan x="370.0" dy="12.3">Елементи S-Box: 0x40..0x7F</tspan><tspan x="370.0" dy="12.3">Стан: Завантажена в L1 (Hot!)</tspan></text>
<rect x="514.2" y="107.9" width="171.6" height="54.2" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Кеш-лінія 2 (байти 128..191)</tspan><tspan x="600.0" dy="12.3">Елементи S-Box: 0x80..0xBF</tspan><tspan x="600.0" dy="12.3">Стан: Холодна (DRAM)</tspan></text>
<rect x="734.2" y="107.9" width="171.6" height="54.2" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="820.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Кеш-лінія 3 (байти 192..255)</tspan><tspan x="820.0" dy="12.3">Елементи S-Box: 0xC0..0xFF</tspan><tspan x="820.0" dy="12.3">Стан: Холодна (DRAM)</tspan></text>
<rect x="25.0" y="205.0" width="440.0" height="255.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="245.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Крок 1: Обчислення індексу в AES</text>
<rect x="82.0" y="258.1" width="326.1" height="33.9" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="245.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Операція SubBytes: index = state[i] ^ key[i]</tspan><tspan x="245.0" dy="12.3">Індекс безпосередньо залежить від секретного ключа key[i]!</tspan></text>
<rect x="90.1" y="316.9" width="309.8" height="46.2" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="245.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Процесор читає пам'ять: SBox[index]</tspan><tspan x="245.0" dy="12.3">До L1-кешу підтягується відповідна 64-байтна кеш-лінія.</tspan><tspan x="245.0" dy="12.3">Якщо index ∈ [64..127], у кеш потрапляє Кеш-лінія 1.</tspan></text>
<rect x="44.6" y="404.2" width="400.7" height="21.5" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="245.0" y="418.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Побічний ефект: Стан апаратного кешу змінюється залежно від key[i]</tspan></text>
<rect x="495.0" y="205.0" width="440.0" height="255.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="715.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Крок 2: Замір латентності атакуючим</text>
<rect x="552.0" y="258.1" width="326.1" height="33.9" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="715.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Атакуючий вимірює час доступу до кеш-ліній таблиці S-Box:</tspan><tspan x="715.0" dy="12.3">Інструкція таймера: rdtsc / rdtscp (високоточні цикли CPU)</tspan></text>
<rect x="514.6" y="323.1" width="400.7" height="33.9" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="715.0" y="337.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Лінія 1: Швидкий доступ ~4 такти (L1 Cache Hit -&gt; Було звернення!)</tspan><tspan x="715.0" dy="12.3">Лінії 0, 2, 3: Повільний доступ ~200 тактів (DRAM Cache Miss)</tspan></text>
<rect x="520.5" y="404.2" width="389.0" height="21.5" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="715.0" y="418.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Відновлення ключа: key[i] = index ^ state[i] через серію запитів</tspan></text>
</svg>