<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="149.1" y="10.5" width="661.7" height="35.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="33.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Виконання умовного вибору: розгалуження процесора проти бітової маски</tspan></text>
<rect x="25.0" y="60.0" width="440.0" height="400.0" rx="8" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.8"/>
<rect x="105.1" y="76.0" width="279.8" height="24.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="245.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Умовне розгалуження: if (secret_bit)</tspan></text>
<rect x="73.7" y="127.5" width="342.6" height="35.0" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="245.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Інструкція умовного переходу (JNE / JEQ / CBZ)</tspan><tspan x="245.0" dy="13.0">Блок прогнозування переходів (Branch Predictor: BTB / BHT)</tspan></text>
<rect x="152.4" y="201.9" width="185.3" height="46.2" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="245.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Гілка 1: secret_bit = 1</tspan><tspan x="245.0" dy="12.3">Виконується операція (MUL / ADD)</tspan><tspan x="245.0" dy="12.3">Час: T_true = N тактів CPU</tspan></text>
<rect x="165.9" y="271.9" width="158.2" height="46.2" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="245.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Гілка 0: secret_bit = 0</tspan><tspan x="245.0" dy="12.3">Операція пропускається</tspan><tspan x="245.0" dy="12.3">Час: T_false = M тактів CPU</tspan></text>
<rect x="51.5" y="353.7" width="387.1" height="62.6" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="245.0" y="369.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Штраф за хибне передбачення (Branch Misprediction):</tspan><tspan x="245.0" dy="12.3">Очищення конвеєра (Pipeline Flush) додає 15-20 тактів затримки.</tspan><tspan x="245.0" dy="12.3">Історія переходів залишає слід у стані апаратного предиктора!</tspan><tspan x="245.0" dy="12.3">Секретний біт безпосередньо модулює час обчислення.</tspan></text>
<rect x="495.0" y="60.0" width="440.0" height="400.0" rx="8" fill="#f8fafc" stroke="#86efac" stroke-width="1.8"/>
<rect x="526.7" y="76.0" width="376.6" height="24.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Безгалузевий мультиплексор: ct_select(mask, a, b)</tspan></text>
<rect x="563.6" y="127.5" width="302.7" height="35.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Формування бітової маски з секретного біта:</tspan><tspan x="715.0" dy="13.0">mask = -(secret_bit)  -&gt;  0x00000000 або 0xFFFFFFFF</tspan></text>
<rect x="581.7" y="201.9" width="266.5" height="46.2" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Побітове комбінування без стрибків адреси:</tspan><tspan x="715.0" dy="12.3">result = (a &amp; mask) | (b &amp; ~mask)</tspan><tspan x="715.0" dy="12.3">Обчислюються обидва операнди в однаковий спосіб</tspan></text>
<rect x="552.0" y="278.1" width="326.1" height="33.9" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Лінійна послідовність інструкцій АЛП (AND, OR, NOT, NEG)</tspan><tspan x="715.0" dy="12.3">Немає переходів, немає передбачення, немає стрибків адреси</tspan></text>
<rect x="536.2" y="353.7" width="357.6" height="62.6" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="715.0" y="369.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Детермінований час конвеєра (Constant Cycles):</tspan><tspan x="715.0" dy="12.3">Рівно 3-4 такти АЛП незалежно від значення secret_bit.</tspan><tspan x="715.0" dy="12.3">Жодного скидання черги інструкцій та впливу на стан BTB.</tspan><tspan x="715.0" dy="12.3">Компіляторні бар'єри гарантують збереження безгалузевості.</tspan></text>
</svg>