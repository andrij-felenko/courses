<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="149.1" y="10.5" width="661.7" height="35.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="33.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Порівняння алгоритмів перевірки: ранній вихід проти константного часу</tspan></text>
<rect x="25.0" y="60.0" width="440.0" height="410.0" rx="8" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.8"/>
<rect x="53.0" y="76.0" width="384.0" height="24.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="245.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Вразливий алгоритм: достроковий вихід (Early Exit)</tspan></text>
<rect x="98.2" y="123.1" width="293.6" height="33.9" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="245.0" y="137.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Спроба 1: Помилка у байті 0 -&gt; вихід на 1-й ітерації</tspan><tspan x="245.0" dy="12.3">Час виконання: T0 = t_base + 1·Δt (найкоротший час)</tspan></text>
<rect x="79.3" y="188.1" width="331.5" height="33.9" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text x="245.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Спроба 2: Байт 0 вгадано, помилка у байті 1 -&gt; вихід на 2-й</tspan><tspan x="245.0" dy="12.3">Час виконання: T1 = t_base + 2·Δt (+1 дельта затримки)</tspan></text>
<rect x="84.7" y="253.1" width="320.7" height="33.9" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="245.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Спроба 3: Байти 0..k-1 вгадано, помилка у байті k</tspan><tspan x="245.0" dy="12.3">Час виконання: Tk = t_base + (k+1)·Δt (лінійне зростання)</tspan></text>
<rect x="66.2" y="313.7" width="357.6" height="62.6" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="245.0" y="329.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Сходинковий витік секрету (Timing Leakage):</tspan><tspan x="245.0" dy="12.3">Атакуючий перебирає 256 варіантів кожного байта.</tspan><tspan x="245.0" dy="12.3">Правильний байт дає вимірюваний сплеск латентності (+Δt).</tspan><tspan x="245.0" dy="12.3">Складність зламу 32-байтного HMAC: 32 x 256 = 8192 спроби!</tspan></text>
<rect x="59.2" y="419.0" width="371.6" height="22.0" rx="6" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/><text x="245.0" y="433.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Повний крах стійкості: 2^256 варіантів -&gt; 8192 заміри часу</tspan></text>
<rect x="495.0" y="60.0" width="440.0" height="410.0" rx="8" fill="#f8fafc" stroke="#86efac" stroke-width="1.8"/>
<rect x="519.3" y="76.0" width="391.4" height="24.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Безпечний алгоритм: константний час (Constant-Time)</tspan></text>
<rect x="541.1" y="123.1" width="347.7" height="33.9" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="137.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Спроба 1: Помилка у байті 0 -&gt; цикл триває до кінця (N байтів)</tspan><tspan x="715.0" dy="12.3">Акумулятор: diff |= a[0] ^ b[0]; час: T_const = t_base + N·Δt</tspan></text>
<rect x="543.8" y="188.1" width="342.3" height="33.9" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Спроба 2: Байти збігаються -&gt; цикл так само триває до кінця</tspan><tspan x="715.0" dy="12.3">Акумулятор: diff |= a[i] ^ b[i]; час: T_const = t_base + N·Δt</tspan></text>
<rect x="541.1" y="253.1" width="347.7" height="33.9" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Спроба 3: Довільні дані -&gt; виконання завжди проходить N кроків</tspan><tspan x="715.0" dy="12.3">Фінальна перевірка: return (diff == 0) без раннього виходу</tspan></text>
<rect x="530.3" y="313.7" width="369.4" height="62.6" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="715.0" y="329.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Повна відсутність часового каналу (Zero Timing Leak):</tspan><tspan x="715.0" dy="12.3">Час виконання суворо однаковий для будь-яких вхідних даних.</tspan><tspan x="715.0" dy="12.3">Розподіл затримок однаковий для хибних та істинних підписів.</tspan><tspan x="715.0" dy="12.3">Витягти інформацію через статистичний аналіз неможливо.</tspan></text>
<rect x="523.0" y="419.0" width="384.0" height="22.0" rx="6" fill="#059669" stroke="#047857" stroke-width="1.5"/><text x="715.0" y="433.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Математична стійкість збережена: повний простір 2^256 ключів</tspan></text>
</svg>