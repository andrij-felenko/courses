<text x="420.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Забезпечує захищений обмін інформацією під час ембарго та запобігає завчасному розкриттю PoC</text>
