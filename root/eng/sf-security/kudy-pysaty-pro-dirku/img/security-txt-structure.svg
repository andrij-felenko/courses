<rect x="485.0" y="55.0" width="430.0" height="135.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="499.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Обов'язкові поля: Contact та Expires</text>
<text x="499.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Contact: URI точки входу (mailto: або https:// порталу).</text>
<text x="499.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Expires: дата закінчення валідності в ISO 8601.</text>
<text x="499.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Якщо дата Expires минула — сканери й клієнти зобов'язані</text>
<text x="499.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  відкинути файл як застарілий та ненадійний.</text>
<rect x="485.0" y="210.0" width="430.0" height="135.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/>
<text x="499.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Криптографічні директиви: Encryption &amp; Canonical</text>
<text x="499.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Encryption: посилання на відкритий PGP-ключ команди.</text>
<text x="499.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Canonical: запобігає підміні файлу на дзеркалах/CDN.</text>
<text x="499.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Дозволяє безпечно надіслати 0-day без витоку на поштових</text>
<text x="499.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  серверах проміжних транзитних провайдерів (MTA).</text>
<rect x="485.0" y="365.0" width="430.0" height="135.0" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/>
<text x="499.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="start" font-weight="700">Політика розкриття та Safe Harbor: Policy</text>
<text x="499.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Policy: посилання на правила тестування й рамки захисту.</text>
<text x="499.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Гарантує досліднику захист від кримінального переслідування,</text>
<text x="499.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  якщо він діє добросовісно та не завдає шкоди інфраструктурі.</text>
