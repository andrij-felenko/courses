<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правові та технічні межі Safe Harbor: Дозволене та Заборонене</text>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правові та технічні межі Safe Harbor: Дозволене та Заборонене</text>
<rect x="30.0" y="58.0" width="425.0" height="415.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<rect x="42.0" y="70.0" width="401.0" height="34.0" rx="4" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="242.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ДОЗВОЛЕНО / В МЕЖАХ ЗАХИСТУ (IN-SCOPE)</text>
<text x="46.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#196f3d" text-anchor="start" font-weight="700">Авторизовані цілі й сервіси</text>
<text x="46.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Домени, API-шлюзи та мобільні додатки, явно вказані у VDP.</text>
<text x="46.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Прошивки власних фізичних пристроїв користувача.</text>
<text x="46.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#196f3d" text-anchor="start" font-weight="700">Добросовісні методи дослідження</text>
<text x="46.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Створення тестових акаунтів для перевірки розмежування прав.</text>
<text x="46.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Демонстрація виконання коду за допомогою безпечних команд</text>
<text x="46.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  (наприклад, id, whoami, читання власного тестового запису).</text>
<text x="46.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Аналіз бінарного коду та реверс-інжиніринг прошивки.</text>
<text x="46.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#196f3d" text-anchor="start" font-weight="700">Юридичні гарантії Safe Harbor</text>
<text x="46.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Відмова компанії від позовів щодо несанкціонованого доступу.</text>
<text x="46.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Неподання скарг за статтями про злам комп'ютерних систем.</text>
<text x="46.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Дозвіл на обхід технічних засобів захисту (DMCA Safe Harbor).</text>
<rect x="485.0" y="58.0" width="425.0" height="415.0" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.8"/>
<rect x="497.0" y="70.0" width="401.0" height="34.0" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="697.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">СУВОРО ЗАБОРОНЕНО (OUT-OF-SCOPE / ЗЛАМ)</text>
<text x="501.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#922b21" text-anchor="start" font-weight="700">Руйнівні та деструктивні атаки</text>
<text x="501.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Атаки типу «Відмова в обслуговуванні» (DoS/DDoS) або стрес-тести.</text>
<text x="501.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Знищення, підміна чи видалення реальних даних користувачів.</text>
<text x="501.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Масове вивантаження конфіденційної інформації (Data Exfiltration).</text>
<text x="501.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#922b21" text-anchor="start" font-weight="700">Атаки на людей та треті сторони</text>
<text x="501.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Соціальна інженерія, фішинг або підкуп співробітників компанії.</text>
<text x="501.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Фізичне проникнення в офіси, дата-центри або складські приміщення.</text>
<text x="501.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Дослідження сторонніх хмарних провайдерів (AWS, Azure, SaaS).</text>
<text x="501.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#922b21" text-anchor="start" font-weight="700">Шантаж та недобросовісна поведінка</text>
<text x="501.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Вимагання викупу чи погрози передчасного зливу 0-day.</text>
<text x="501.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Продаж інформації про вразливість брокерам експлойтів на чорному ринку.</text>
<text x="501.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Публікація деталей вади до закінчення погодженого терміну розкриття.</text>
</svg>