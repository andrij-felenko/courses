<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія безпечних дефолтів на рівнях архітектури системи</text>
<rect x="30.0" y="59.3" width="840.0" height="41.3" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Рівень 1: Операційна система та ядро (Kernel &amp; OS)</tspan><tspan x="450.0" dy="14.3">• umask 0077/0027 • Localhost binding (127.0.0.1) • noexec/nosuid для /tmp • Seccomp default ERRNO</tspan></text>
<rect x="30.0" y="139.3" width="840.0" height="41.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Рівень 2: Мережевий стек та файрвол (Network &amp; Transport)</tspan><tspan x="450.0" dy="14.3">• Default DROP для вхідних ланцюжків iptables/nftables • Тільки TLS 1.3 • Сувора автентифікація mTLS</tspan></text>
<rect x="30.0" y="219.3" width="840.0" height="41.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="450.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Рівень 3: Мова програмування та компілятор (Language &amp; Compiler)</tspan><tspan x="450.0" dy="14.3">• Незмінність (const/immutable) за дефолтом • Параметризовані SQL-запити • Захист від переповнень буфера</tspan></text>
<rect x="30.0" y="299.4" width="840.0" height="41.3" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="450.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Рівень 4: Веб-інтерфейси та браузерний захист (Web &amp; HTTP API)</tspan><tspan x="450.0" dy="14.3">• Cookie SameSite=Lax/Strict, HttpOnly, Secure • CSP default-src 'none' • Заборона парсингу XXE сутностей</tspan></text>
<rect x="30.0" y="379.4" width="840.0" height="41.3" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="396.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Рівень 5: Контроль доступу та політики безпеки (RBAC / ABAC / Data)</tspan><tspan x="450.0" dy="14.3">• Default DENY для всіх суб'єктів • Мінімум привілеїв • Автоматичне шифрування дисків AES-256</tspan></text>
<line x1="450.0" y1="108.0" x2="450.0" y2="134.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450.0" y1="188.0" x2="450.0" y2="214.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450.0" y1="268.0" x2="450.0" y2="294.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450.0" y1="348.0" x2="450.0" y2="374.0" stroke="#7e22ce" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>