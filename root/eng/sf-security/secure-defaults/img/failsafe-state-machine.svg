<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка системи під час збоїв: Fail-Open проти Fail-Safe</text>
<rect x="15.0" y="55.0" width="420.0" height="395.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<text x="225.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">НЕБЕЗПЕЧНА ПОВЕДІНКА: Fail-Open</text>
<text x="225.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Відмова на користь відкритості / доступності)</text>
<rect x="45.0" y="121.3" width="360.0" height="37.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Початковий стан: Доступ заборонено</tspan><tspan x="225.0" dy="14.3">(Очікування верифікації запиту)</tspan></text>
<rect x="45.0" y="196.3" width="360.0" height="37.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="225.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Оцінка правил безпеки</tspan><tspan x="225.0" dy="14.3">(WAF / Auth Service / ACL)</tspan></text>
<rect x="45.0" y="277.5" width="360.0" height="35.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">ЗБІЙ: Таймаут мережі / Невідомий атрибут /</tspan><tspan x="225.0" dy="13.0">Помилка парсера / Uncaught Exception</tspan></text>
<rect x="45.0" y="363.2" width="360.0" height="43.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="381.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">РЕЗУЛЬТАТ: ДОЗВОЛИТИ (Permit Bypass)</tspan><tspan x="225.0" dy="15.6">Вразливість захисту, доступ зловмиснику</tspan></text>
<line x1="225.0" y1="162.0" x2="225.0" y2="192.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="225.0" y1="238.0" x2="225.0" y2="268.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="225.0" y1="322.0" x2="225.0" y2="355.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="465.0" y="55.0" width="420.0" height="395.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="675.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">БЕЗПЕЧНА ПОВЕДІНКА: Fail-Safe (Fail-Closed)</text>
<text x="675.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Відмова на користь безпеки й збереження інваріанту)</text>
<rect x="495.0" y="121.3" width="360.0" height="37.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Початковий стан: Дефолт ЗАБОРОНА (Deny)</tspan><tspan x="675.0" dy="14.3">(Інваріант безпеки зафіксовано)</tspan></text>
<rect x="495.0" y="196.3" width="360.0" height="37.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="675.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Оцінка правил безпеки</tspan><tspan x="675.0" dy="14.3">(Явне позитивне підтвердження прав)</tspan></text>
<rect x="495.0" y="277.5" width="360.0" height="35.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">ЗБІЙ: Таймаут / Помилка розбору токена /</tspan><tspan x="675.0" dy="13.0">Аварійна зупинка сервісу авторизації</tspan></text>
<rect x="495.0" y="363.2" width="360.0" height="43.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="381.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">РЕЗУЛЬТАТ: ЗАБОРОНЕНО (Safe Default Retained)</tspan><tspan x="675.0" dy="15.6">Інваріант збережено + запис до аудит-логу</tspan></text>
<line x1="675.0" y1="162.0" x2="675.0" y2="192.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="675.0" y1="238.0" x2="675.0" y2="268.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="675.0" y1="322.0" x2="675.0" y2="355.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>