<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння записів NSEC та NSEC3 у DNSSEC</text>
<text x="40.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Підтвердження неіснування записів: відкрите кільце NSEC проти хешованого NSEC3</text>
<rect x="30.0" y="60.0" width="980.0" height="220.0" rx="10" fill="#eef3fb" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="50.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="start" font-weight="700">1. NSEC (RFC 4034): Лексикографічне зв'язане кільце дійсних імен</text>
<rect x="72.3" y="122.3" width="115.5" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">api.example.ua</tspan><tspan x="130.0" dy="14.3">(NSEC -&gt; mail)</tspan></text>
<rect x="368.9" y="122.3" width="122.3" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">mail.example.ua</tspan><tspan x="430.0" dy="14.3">(NSEC -&gt; www)</tspan></text>
<rect x="672.3" y="122.3" width="115.5" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">www.example.ua</tspan><tspan x="730.0" dy="14.3">(NSEC -&gt; api)</tspan></text>
<line x1="210.0" y1="145.0" x2="350.0" y2="145.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510.0" y1="145.0" x2="650.0" y2="145.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="730.0" y1="175.0" x2="130.0" y2="175.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="215.0" width="940.0" height="50.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="520.0" y="243.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Запит на 'blog.example.ua': повертається NSEC між 'api' та 'mail'. Доведеться, що blog не існує, але відкривається весь список імен зони (Zone Walking).</tspan></text>
<rect x="30.0" y="300.0" width="980.0" height="240.0" rx="10" fill="#fdf3e6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="50.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="start" font-weight="700">2. NSEC3 (RFC 5155): Хешований простір імен із солю (Salt)</text>
<rect x="72.0" y="362.4" width="135.9" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">H(api) = 2v1... </tspan><tspan x="140.0" dy="14.3">(NSEC3 -&gt; 7b9...)</tspan></text>
<rect x="372.0" y="362.4" width="135.9" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">H(mail) = 7b9...</tspan><tspan x="440.0" dy="14.3">(NSEC3 -&gt; k4m...)</tspan></text>
<rect x="672.0" y="362.4" width="135.9" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">H(www) = k4m...</tspan><tspan x="740.0" dy="14.3">(NSEC3 -&gt; 2v1...)</tspan></text>
<line x1="230.0" y1="385.0" x2="350.0" y2="385.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="530.0" y1="385.0" x2="650.0" y2="385.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="740.0" y1="415.0" x2="140.0" y2="415.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="455.0" width="940.0" height="65.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="520.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Запит на 'blog.example.ua': обчислюється H('blog') = 4q2... Повертається NSEC3 проміжку [2v1... 7b9...]. Доведено відсутність без розкриття вихідних імен зони.</tspan></text>
</svg>