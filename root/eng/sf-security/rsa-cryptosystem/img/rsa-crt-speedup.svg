<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1002.7 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1002.7" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прискорення розшифровки RSA через CRT</text>
<text x="490.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прискорена розшифровка RSA через Китайську теорему про лишки (CRT)</text>
<rect x="63.9" y="204.6" width="172.2" height="70.8" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="227.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Вхідний шифротекст c</tspan><tspan x="150.0" dy="16.9">та приватний ключ</tspan><tspan x="150.0" dy="16.9">(p, q, dP, dQ, qInv)</tspan></text>
<rect x="352.3" y="107.5" width="155.4" height="65.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Зменшення модуля p:</tspan><tspan x="430.0" dy="16.2">c_p = c mod p</tspan><tspan x="430.0" dy="16.2">d_p = d mod (p-1)</tspan></text>
<rect x="563.1" y="107.5" width="213.8" height="65.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Піднесення mod p:</tspan><tspan x="670.0" dy="16.2">m_p = (c_p)^(d_p) mod p</tspan><tspan x="670.0" dy="16.2">(розмір операнда n/2 біт)</tspan></text>
<rect x="352.3" y="307.5" width="155.4" height="65.0" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="430.0" y="328.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Зменшення модуля q:</tspan><tspan x="430.0" dy="16.2">c_q = c mod q</tspan><tspan x="430.0" dy="16.2">d_q = d mod (q-1)</tspan></text>
<rect x="563.1" y="307.5" width="213.8" height="65.0" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="670.0" y="328.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Піднесення mod q:</tspan><tspan x="670.0" dy="16.2">m_q = (c_q)^(d_q) mod q</tspan><tspan x="670.0" dy="16.2">(розмір операнда n/2 біт)</tspan></text>
<rect x="757.2" y="189.2" width="225.5" height="101.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="870.0" y="211.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Рекомбінація Гарнера:</tspan><tspan x="870.0" dy="16.2">h = (m_p - m_q)·qInv mod p</tspan><tspan x="870.0" dy="16.2">m = m_q + h · q</tspan><tspan x="870.0" dy="16.2"></tspan><tspan x="870.0" dy="16.2">⚡ Прискорення ~4×</tspan></text>
<line x1="260.0" y1="220.0" x2="340.0" y2="140.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="260.0" y1="260.0" x2="340.0" y2="340.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520.0" y1="140.0" x2="585.0" y2="140.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520.0" y1="340.0" x2="585.0" y2="340.0" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="755.0" y1="140.0" x2="785.0" y2="220.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="755.0" y1="340.0" x2="785.0" y2="260.0" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>