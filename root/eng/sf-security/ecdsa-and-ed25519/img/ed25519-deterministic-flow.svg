<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Архітектура детермінованого підпису Ed25519</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Усунення зовнішнього RNG: нонс r обчислюється криптографічним гешуванням ключа та повідомлення</text>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Inputs Panel (Left) -->
  <rect x="35" y="90" width="200" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Вхідні дані</text>

  <rect x="50" y="140" width="170" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="135" y="162" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Секретний ключ sk</text>
  <text x="135" y="180" font-size="11" text-anchor="middle" fill="#1a1a1a">32 байти (Seed)</text>

  <rect x="50" y="220" width="170" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="135" y="242" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Повідомлення M</text>
  <text x="135" y="260" font-size="11" text-anchor="middle" fill="#6b7280">Довільна довжина</text>

  <rect x="50" y="300" width="170" height="100" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="135" y="322" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Нічого ззовні!</text>
  <text x="135" y="342" font-size="11" text-anchor="middle" fill="#1a1a1a">⛔ Жодного RNG</text>
  <text x="135" y="360" font-size="11" text-anchor="middle" fill="#1a1a1a">⛔ Жодної ентропії</text>
  <text x="135" y="378" font-size="11" text-anchor="middle" fill="#1a1a1a">100% детерміновано</text>

  <!-- Key Hashing Block (Middle 1) -->
  <rect x="255" y="90" width="220" height="330" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="365" y="115" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">1. SHA-512(sk) = 64 байти</text>

  <rect x="270" y="145" width="190" height="110" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="365" y="167" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Ліва половина (a)</text>
  <text x="365" y="187" font-size="11" text-anchor="middle" fill="#1a1a1a">32 байти → Скаляр a</text>
  <text x="365" y="207" font-size="11" text-anchor="middle" fill="#1a1a1a">Публічний ключ A = a·B</text>
  <text x="365" y="227" font-size="11" text-anchor="middle" fill="#6b7280">(Крива Едвардса)</text>

  <rect x="270" y="275" width="190" height="125" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="365" y="297" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Права половина (prefix)</text>
  <text x="365" y="317" font-size="11" text-anchor="middle" fill="#1a1a1a">32 байти префікса</text>
  <text x="365" y="337" font-size="11" text-anchor="middle" fill="#1a1a1a">Секретний шум для</text>
  <text x="365" y="357" font-size="11" text-anchor="middle" fill="#1a1a1a">детермінованого нонсу</text>

  <!-- Nonce & Signature Computation (Middle 2) -->
  <rect x="495" y="90" width="240" height="330" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="615" y="115" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">2. Внутрішній Нонс та Підпис</text>

  <rect x="510" y="145" width="210" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="615" y="167" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Обчислення r та R</text>
  <text x="615" y="190" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a1a">r = SHA-512(prefix || M)</text>
  <text x="615" y="210" font-size="11" text-anchor="middle" fill="#6b7280">Точка R = r · B (32B)</text>
  <text x="615" y="230" font-size="10" text-anchor="middle" fill="#27ae60">✔ Гарантовано унікальний!</text>

  <rect x="510" y="275" width="210" height="125" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="615" y="297" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Обчислення S</text>
  <text x="615" y="320" font-size="11" text-anchor="middle" fill="#2457d6">k = SHA-512(R || A || M)</text>
  <text x="615" y="342" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">S = (r + k · a) mod L</text>
  <text x="615" y="362" font-size="11" text-anchor="middle" fill="#6b7280">Скаляр S (32 байти)</text>

  <!-- Output (Right) -->
  <rect x="755" y="90" width="170" height="330" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="840" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#27ae60">Підпис Ed25519</text>

  <rect x="770" y="160" width="140" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="840" y="185" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">Точка R</text>
  <text x="840" y="208" font-size="11" text-anchor="middle" fill="#6b7280">32 байти</text>

  <rect x="770" y="280" width="140" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="840" y="305" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">Скаляр S</text>
  <text x="840" y="328" font-size="11" text-anchor="middle" fill="#6b7280">32 байти</text>

  <text x="840" y="390" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Разом: 64 байти</text>

  <!-- Connectors without cutting text -->
  <path d="M 220 170 L 253 170" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  
  <!-- Message M routed along top empty gap, descending at x=485 -->
  <path d="M 220 250 L 245 250 L 245 65 L 485 65 L 485 170 L 508 170" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Prefix to Nonce block -->
  <path d="M 460 338 L 485 338 L 485 200 L 508 200" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Output arrows -->
  <path d="M 720 195 L 753 195" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 720 335 L 753 335" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
</svg>
