<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Схема формування цифрового підпису ECDSA</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Випадковий нонс k обчислює r, яке маскує приватний ключ d у фінальному s</text>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Input Column (Left) -->
  <rect x="40" y="90" width="220" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="150" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Вхідні дані</text>

  <rect x="55" y="135" width="190" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="150" y="155" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Повідомлення M</text>
  <text x="150" y="175" font-size="11" text-anchor="middle" fill="#6b7280">h = SHA-256(M)</text>

  <rect x="55" y="215" width="190" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="150" y="235" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Приватний ключ d</text>
  <text x="150" y="255" font-size="11" text-anchor="middle" fill="#1a1a1a">(Таємне число)</text>

  <rect x="55" y="295" width="190" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="150" y="318" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Нонс k (RNG)</text>
  <text x="150" y="338" font-size="11" text-anchor="middle" fill="#c0392b">Критична вимога:</text>
  <text x="150" y="355" font-size="11" text-anchor="middle" fill="#1a1a1a">Одноразове випадкове</text>
  <text x="150" y="372" font-size="11" text-anchor="middle" fill="#1a1a1a">число для кожного підпису</text>

  <!-- Computation Column (Middle) -->
  <rect x="300" y="90" width="370" height="330" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="485" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Обчислення криптографічних компонентів</text>

  <!-- Step 1: r computation -->
  <rect x="320" y="135" width="330" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="485" y="157" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Крок 1: Обчислення r (Точка на кривій)</text>
  <text x="485" y="177" font-size="12" text-anchor="middle" fill="#1a1a1a">R = k · G = (x_R, y_R)</text>
  <text x="485" y="197" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">r = x_R mod n</text>

  <!-- Step 2: s computation -->
  <rect x="320" y="245" width="330" height="155" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="485" y="267" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Крок 2: Зв'язування ключів та гешу в s</text>
  <text x="485" y="292" font-size="14" font-weight="700" text-anchor="middle" fill="#2457d6">s = k⁻¹ · (h + r · d) mod n</text>
  
  <rect x="340" y="310" width="290" height="75" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="485" y="330" font-size="11" text-anchor="middle" fill="#6b7280">де k⁻¹ — обернене значення нонсу</text>
  <text x="485" y="347" font-size="11" text-anchor="middle" fill="#6b7280">r · d — приховування ключа d</text>
  <text x="485" y="364" font-size="11" text-anchor="middle" fill="#6b7280">h — прив'язка до вмісту повідомлення</text>

  <!-- Output Column (Right) -->
  <rect x="710" y="90" width="210" height="330" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="815" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#27ae60">Готовий підпис</text>

  <rect x="725" y="160" width="180" height="80" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="815" y="188" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">Компонента r</text>
  <text x="815" y="212" font-size="11" text-anchor="middle" fill="#6b7280">256-бітне число</text>

  <rect x="725" y="270" width="180" height="80" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="815" y="298" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">Компонента s</text>
  <text x="815" y="322" font-size="11" text-anchor="middle" fill="#6b7280">256-бітне число</text>

  <text x="815" y="390" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Пара (r, s) = 64 байти</text>

  <!-- Flow Arrows -->
  <!-- Nonce k to Step 1 -->
  <path d="M 245 345 L 280 345 L 280 177 L 318 177" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  
  <!-- Nonce k to Step 2 (k^-1) -->
  <path d="M 245 365 L 318 365" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Hash h to Step 2 -->
  <path d="M 245 165 L 270 165 L 270 270 L 318 270" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Private key d to Step 2 -->
  <path d="M 245 245 L 318 245" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Step 1 (r) to Step 2 -->
  <path d="M 485 220 L 485 243" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Step 1 to Output r -->
  <path d="M 650 177 L 723 177" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Step 2 to Output s -->
  <path d="M 650 310 L 723 310" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
</svg>
