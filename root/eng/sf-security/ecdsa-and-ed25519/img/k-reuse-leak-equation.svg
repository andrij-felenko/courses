<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Витік приватного ключа через повторне використання k (k-reuse attack)</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Використання одного k для двох різних повідомлень дозволяє миттєво обчислити приватний ключ d</text>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Intercepted Signatures (Left) -->
  <rect x="40" y="85" width="300" height="340" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="190" y="110" font-size="14" font-weight="700" text-anchor="middle" fill="#c0392b">Перехоплені підписи з однаковим r</text>

  <!-- Signature 1 Card -->
  <rect x="60" y="130" width="260" height="110" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="75" y="152" font-size="12" font-weight="700" fill="#1a1a1a">Підпис 1: для повідомлення M₁ (геш h₁)</text>
  <text x="75" y="175" font-size="13" font-weight="700" fill="#c0392b">s₁ = k⁻¹ · (h₁ + r · d) mod n</text>
  <text x="75" y="198" font-size="12" fill="#6b7280">Публічні дані: (r, s₁), h₁</text>
  <text x="75" y="218" font-size="11" fill="#c0392b">Нонс: k (той самий!)</text>

  <!-- Signature 2 Card -->
  <rect x="60" y="260" width="260" height="110" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="75" y="282" font-size="12" font-weight="700" fill="#1a1a1a">Підпис 2: для повідомлення M₂ (геш h₂)</text>
  <text x="75" y="305" font-size="13" font-weight="700" fill="#c0392b">s₂ = k⁻¹ · (h₂ + r · d) mod n</text>
  <text x="75" y="328" font-size="12" fill="#6b7280">Публічні дані: (r, s₂), h₂</text>
  <text x="75" y="348" font-size="11" fill="#c0392b">Нонс: k (той самий!)</text>

  <rect x="60" y="380" width="260" height="30" rx="4" fill="#c0392b"/>
  <text x="190" y="400" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Сигнал атаки: r₁ = r₂ ⇒ k₁ = k₂</text>

  <!-- Algebraic Elimination Step (Middle) -->
  <rect x="370" y="85" width="260" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="500" y="110" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Крок 1: Відновлення нонсу k</text>

  <rect x="385" y="140" width="230" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="162" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Віднімання рівнянь підписів</text>
  <text x="500" y="185" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">s₁ - s₂ = k⁻¹ · (h₁ - h₂)</text>
  <text x="500" y="202" font-size="11" text-anchor="middle" fill="#6b7280">(Член r·d повністю скоротився!)</text>

  <rect x="385" y="240" width="230" height="160" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="500" y="262" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Явне вираження k</text>
  <text x="500" y="295" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">k = (h₁ - h₂) · (s₁ - s₂)⁻¹</text>
  <text x="500" y="325" font-size="11" text-anchor="middle" fill="#1a1a1a">Обчислюється виключно з</text>
  <text x="500" y="342" font-size="11" text-anchor="middle" fill="#1a1a1a">відомих публічних даних</text>
  <text x="500" y="359" font-size="11" text-anchor="middle" fill="#1a1a1a">h₁, h₂, s₁, s₂ за модулем n</text>

  <!-- Private Key Extraction Step (Right) -->
  <rect x="660" y="85" width="260" height="340" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="790" y="110" font-size="14" font-weight="700" text-anchor="middle" fill="#c0392b">Крок 2: Злам ключа d</text>

  <rect x="675" y="150" width="230" height="100" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="790" y="175" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Підстановка k у рівняння</text>
  <text x="790" y="205" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">d = (s₁ · k - h₁) · r⁻¹</text>
  <text x="790" y="232" font-size="11" text-anchor="middle" fill="#6b7280">(за модулем n)</text>

  <rect x="675" y="275" width="230" height="120" rx="6" fill="#c0392b"/>
  <text x="790" y="300" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">КАТАСТРОФІЧНИЙ ЗЛАМ</text>
  <text x="790" y="325" font-size="11" text-anchor="middle" fill="#ffffff">Зловмисник отримав головний</text>
  <text x="790" y="342" font-size="11" text-anchor="middle" fill="#ffffff">приватний ключ d.</text>
  <text x="790" y="365" font-size="11" text-anchor="middle" fill="#ffffff">Приклад: Атака на PS3 (Sony)</text>

  <!-- Connecting Arrows -->
  <path d="M 340 255 L 368 255" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 630 320 L 658 320" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
</svg>
