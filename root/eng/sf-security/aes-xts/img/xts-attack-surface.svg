<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1060 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1060" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель загроз та обмеження стійкості режиму AES-XTS</text>
<rect x="40.0" y="60.0" width="220.0" height="410.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="150.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Відсутність AEAD</text>
<text x="150.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Підробка секторів</text>
<rect x="55.0" y="130.0" width="190.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="150.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Зловмисник інвертує</tspan><tspan x="150.0" dy="15.6">біти в блоці C[j].</tspan><tspan x="150.0" dy="15.6">При дешифруванні блок</tspan><tspan x="150.0" dy="15.6">перетворюється на сміття,</tspan><tspan x="150.0" dy="15.6">але помилка НЕ виникає!</tspan></text>
<rect x="55.0" y="310.0" width="190.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="150.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Захисні заходи:</tspan><tspan x="150.0" dy="14.3">• dm-integrity / HMAC</tspan><tspan x="150.0" dy="14.3">• ФС із контрольними сумами</tspan><tspan x="150.0" dy="14.3">  (ZFS, Btrfs)</tspan><tspan x="150.0" dy="14.3">• Регулярна ротація ключів</tspan></text>
<rect x="300.0" y="60.0" width="220.0" height="410.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
<text x="410.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Атака повтором (Replay)</text>
<text x="410.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Підміна версій</text>
<rect x="315.0" y="130.0" width="190.0" height="160.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="410.0" y="189.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Зловмисник записує старий</tspan><tspan x="410.0" dy="11.7">зашифрований сектор S (час t1)</tspan><tspan x="410.0" dy="11.7">поверх нового сектора S (час t2).</tspan><tspan x="410.0" dy="11.7">Диск успішно розшифрує</tspan><tspan x="410.0" dy="11.7">застарілі дані.</tspan></text>
<rect x="315.0" y="310.0" width="190.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="410.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Захисні заходи:</tspan><tspan x="410.0" dy="14.3">• dm-integrity / HMAC</tspan><tspan x="410.0" dy="14.3">• ФС із контрольними сумами</tspan><tspan x="410.0" dy="14.3">  (ZFS, Btrfs)</tspan><tspan x="410.0" dy="14.3">• Регулярна ротація ключів</tspan></text>
<rect x="560.0" y="60.0" width="220.0" height="410.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="670.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Перестановка блоків</text>
<text x="670.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">У межах сектора</text>
<rect x="575.0" y="130.0" width="190.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="670.0" y="187.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Перестановка блоків C[j]</tspan><tspan x="670.0" dy="13.0">та C[k] у секторі призводить</tspan><tspan x="670.0" dy="13.0">до розшифрування обох у</tspan><tspan x="670.0" dy="13.0">непередбачуване сміття через</tspan><tspan x="670.0" dy="13.0">різні твіки αʲ ≠ αᵏ.</tspan></text>
<rect x="575.0" y="310.0" width="190.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="670.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Захисні заходи:</tspan><tspan x="670.0" dy="14.3">• dm-integrity / HMAC</tspan><tspan x="670.0" dy="14.3">• ФС із контрольними сумами</tspan><tspan x="670.0" dy="14.3">  (ZFS, Btrfs)</tspan><tspan x="670.0" dy="14.3">• Регулярна ротація ключів</tspan></text>
<rect x="820.0" y="60.0" width="220.0" height="410.0" rx="8" fill="#ffffff" stroke="#6b21a8" stroke-width="1.4"/>
<text x="930.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700">Межі обсягу даних</text>
<text x="930.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Колізії блоків</text>
<rect x="835.0" y="130.0" width="190.0" height="160.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.2"/><text x="930.0" y="187.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">IEEE 1619 обмежує</tspan><tspan x="930.0" dy="13.0">розмір сектора до 2²⁰ блоків.</tspan><tspan x="930.0" dy="13.0">NIST SP 800-38E лімітує</tspan><tspan x="930.0" dy="13.0">загальний обсяг шифрування</tspan><tspan x="930.0" dy="13.0">одним ключем до 2⁶⁴ блоків.</tspan></text>
<rect x="835.0" y="310.0" width="190.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="930.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Захисні заходи:</tspan><tspan x="930.0" dy="14.3">• dm-integrity / HMAC</tspan><tspan x="930.0" dy="14.3">• ФС із контрольними сумами</tspan><tspan x="930.0" dy="14.3">  (ZFS, Btrfs)</tspan><tspan x="930.0" dy="14.3">• Регулярна ротація ключів</tspan></text>
</svg>