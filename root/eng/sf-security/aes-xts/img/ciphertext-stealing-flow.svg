<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм викрадення шифротексту (Ciphertext Stealing) для неповних секторів</text>
<rect x="50.0" y="60.0" width="900.0" height="110.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="160.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Вхідні відкриті дані сектора:</text>
<rect x="80.0" y="100.0" width="200.0" height="50.0" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Блоки P[0] .. P[m-2]</tspan><tspan x="180.0" dy="14.3">(Повні 16-байтні блоки)</tspan></text>
<rect x="340.0" y="100.0" width="260.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Останній повний блок P[m-1]</tspan><tspan x="470.0" dy="15.6">(16 байтів)</tspan></text>
<rect x="660.0" y="100.0" width="240.0" height="50.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="780.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Хвіст сектора P[m]</tspan><tspan x="780.0" dy="15.6">(Неповний: b байтів, b &lt; 16)</tspan></text>
<line x1="470.0" y1="150.0" x2="470.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="195.0" width="300.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Шифрування P[m-1] з твіком T[m-1]</tspan><tspan x="470.0" dy="14.3">Отримуємо проміжний C'[m-1] (16 Б)</tspan></text>
<line x1="410.0" y1="245.0" x2="410.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="245.0" x2="600.0" y2="280.0" stroke="#6b21a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="780.0" y1="150.0" x2="680.0" y2="280.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="280.0" width="180.0" height="55.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="304.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Голова C'[m-1] (b байтів)</tspan><tspan x="410.0" dy="13.0">Стає фінальним C[m]</tspan></text>
<rect x="550.0" y="280.0" width="360.0" height="55.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/><text x="730.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Формування блоку P'[m-1] (16 байтів):</tspan><tspan x="730.0" dy="14.3">P[m] (b байтів) || Хвіст C'[m-1] (16-b байтів)</tspan></text>
<line x1="730.0" y1="335.0" x2="730.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="375.0" width="360.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="401.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Шифрування P'[m-1] з твіком T[m] → C[m-1] (16 Б)</tspan></text>
<rect x="50.0" y="440.0" width="900.0" height="65.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="150.0" y="453.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Фінальний вихідний сектор:</text>
<rect x="80.0" y="450.0" width="200.0" height="45.0" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="469.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">C[0] .. C[m-2]</tspan><tspan x="180.0" dy="14.3">(Повні блоки)</tspan></text>
<rect x="340.0" y="450.0" width="280.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="469.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">C[m-1] (16 байтів)</tspan><tspan x="480.0" dy="14.3">(Зсунутий повний блок)</tspan></text>
<rect x="680.0" y="450.0" width="220.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="469.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">C[m] (b байтів)</tspan><tspan x="790.0" dy="14.3">(Викрадений хвіст)</tspan></text>
<line x1="410.0" y1="335.0" x2="790.0" y2="450.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="730.0" y1="420.0" x2="480.0" y2="450.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>