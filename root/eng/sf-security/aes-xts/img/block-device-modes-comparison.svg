<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння режимів шифрування на секторах накопичувача</text>
<rect x="35.0" y="52.0" width="210.0" height="448.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="140.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ECB (Codebook)</text>
<text x="140.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Витік структури</text>
<rect x="45.0" y="118.0" width="190.0" height="94.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="140.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Відкритий текст P</tspan></text>
<rect x="45.0" y="222.0" width="190.0" height="94.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="140.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">C[j] = AES(K, P[j])</tspan></text>
<rect x="45.0" y="340.0" width="190.0" height="94.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="140.0" y="367.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Катастрофа:</tspan><tspan x="140.0" dy="15.6">однакові блоки дають</tspan><tspan x="140.0" dy="15.6">однаковий шифротекст;</tspan><tspan x="140.0" dy="15.6">витік карти файлів</tspan></text>
<rect x="275.0" y="52.0" width="210.0" height="448.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="380.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">CBC (Chaining)</text>
<text x="380.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Послідовна залежність</text>
<rect x="285.0" y="118.0" width="190.0" height="94.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="380.0" y="168.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">C[j] = AES(K, P[j] ⊕ C[j-1])</tspan></text>
<rect x="285.0" y="222.0" width="190.0" height="94.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="380.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Bit-flipping:</tspan><tspan x="380.0" dy="15.6">Δ в C[j-1] змінює P[j],</tspan><tspan x="380.0" dy="15.6">руйнує P[j-1]</tspan></text>
<rect x="285.0" y="340.0" width="190.0" height="94.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="380.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Обмеження:</tspan><tspan x="380.0" dy="15.6">неможливий паралельний</tspan><tspan x="380.0" dy="15.6">запис; атака на IV</tspan></text>
<rect x="515.0" y="52.0" width="210.0" height="448.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="620.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">CTR / GCM (AEAD)</text>
<text x="620.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Неможливість на дисках</text>
<rect x="525.0" y="118.0" width="190.0" height="94.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="620.0" y="168.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">C = P ⊕ AES(K, Nonce || j)</tspan></text>
<rect x="525.0" y="222.0" width="190.0" height="94.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="620.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Катастрофа Nonce-reuse:</tspan><tspan x="620.0" dy="14.3">перезапис сектора розкриває</tspan><tspan x="620.0" dy="14.3">P1 ⊕ P2 = C1 ⊕ C2</tspan></text>
<rect x="525.0" y="340.0" width="190.0" height="94.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="620.0" y="377.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Немає місця:</tspan><tspan x="620.0" dy="13.0">512B/4KB сектор не вміщує</tspan><tspan x="620.0" dy="13.0">16B тег без переформатування</tspan></text>
<rect x="755.0" y="52.0" width="210.0" height="448.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="860.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">XTS-AES (IEEE 1619)</text>
<text x="860.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Стандарт для накопичувачів</text>
<rect x="765.0" y="118.0" width="190.0" height="94.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="860.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Два ключі K1, K2</tspan><tspan x="860.0" dy="14.3">Твік T = AES(K2, LBA) ⊗ αʲ</tspan></text>
<rect x="765.0" y="222.0" width="190.0" height="94.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="860.0" y="272.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">C[j] = AES(K1, P[j] ⊕ T) ⊕ T</tspan></text>
<rect x="765.0" y="340.0" width="190.0" height="94.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="860.0" y="369.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Переваги:</tspan><tspan x="860.0" dy="14.3">повний паралелізм,</tspan><tspan x="860.0" dy="14.3">немає розширення секторів,</tspan><tspan x="860.0" dy="14.3">прив'язка до позиції LBA</tspan></text>
</svg>