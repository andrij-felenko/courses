<text x="805.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7e22ce" text-anchor="middle" font-weight="700">Безпечний світ (Secure World / TEE)</text>
<rect x="600.0" y="90.0" width="410.0" height="56.0" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="805.0" y="114.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Crypto Engine + OTP eFuses</tspan><tspan x="805.0" dy="15.6">Апаратний корінь довіри (Root Key)</tspan></text>
<rect x="600.0" y="170.0" width="410.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Дешифратор AES-128 (вбудовані регістри)</tspan><tspan x="805.0" dy="15.6">Ключ K_content завантажується лише в регістри кремнію</tspan></text>
<rect x="600.0" y="250.0" width="410.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Захищена відеопам'ять (Protected RAM)</tspan><tspan x="805.0" dy="15.6">Декодовані кадри YUV доступні лише VPU</tspan></text>
<rect x="600.0" y="330.0" width="410.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="805.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Контролер дисплея + HDCP 2.2 передавач</tspan><tspan x="805.0" dy="15.6">Шифрування сигналу перед виходом на HDMI</tspan></text>
