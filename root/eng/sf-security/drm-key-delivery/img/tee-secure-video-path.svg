<rect x="30.0" y="30.0" width="450.0" height="450.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.8"/>
<text x="255.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Звичайний світ (Normal World / Rich OS)</text>
<rect x="50.0" y="90.0" width="410.0" height="56.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="114.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Браузер / Додаток (JS Heap)</tspan><tspan x="255.0" dy="15.6">Має лише зашифрований fMP4 та Challenge</tspan></text>
<rect x="50.0" y="170.0" width="410.0" height="56.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="194.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Ядро ОС (Linux / Windows / Android)</tspan><tspan x="255.0" dy="15.6">Не має доступу до захищених регістрів</tspan></text>
<rect x="50.0" y="250.0" width="410.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="255.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Звичайна оперативна пам'ять (Host RAM)</tspan><tspan x="255.0" dy="15.6">Тут лежать лише зашифровані пакети NAL.</tspan><tspan x="255.0" dy="15.6">Ключі у відкритому вигляді сюди не потрапляють.</tspan></text>
