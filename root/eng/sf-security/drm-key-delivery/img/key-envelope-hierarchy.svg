<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="40.0" width="220.0" height="110.0" rx="6" fill="#f5f3ff" stroke="#7e22ce" stroke-width="1.8"/><text x="150.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Рівень 0: Кремній</tspan><tspan x="150.0" dy="15.6">Root Key (eFuse)</tspan><tspan x="150.0" dy="15.6">Зашитий на заводі,</tspan><tspan x="150.0" dy="15.6">недоступний ПЗ</tspan></text>
<line x1="264.0" y1="95.0" x2="306.0" y2="95.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="310.0" y="40.0" width="220.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="420.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Рівень 1: Пристрій</tspan><tspan x="420.0" dy="15.6">Device Private Key</tspan><tspan x="420.0" dy="15.6">Підписаний вендором,</tspan><tspan x="420.0" dy="15.6">доводить рівень захисту</tspan></text>
<line x1="534.0" y1="95.0" x2="576.0" y2="95.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="580.0" y="40.0" width="210.0" height="110.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="685.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Рівень 2: Сесія</tspan><tspan x="685.0" dy="15.6">Session Key (K_sess)</tspan><tspan x="685.0" dy="15.6">Узгоджується на</tspan><tspan x="685.0" dy="15.6">один запит ліцензії</tspan></text>
<line x1="794.0" y1="95.0" x2="836.0" y2="95.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="840.0" y="40.0" width="180.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="930.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Рівень 3: Медіа</tspan><tspan x="930.0" dy="15.6">Content Key (K_c)</tspan><tspan x="930.0" dy="15.6">Розшифровує кадри</tspan><tspan x="930.0" dy="15.6">в Secure Path</tspan></text>
<rect x="40.0" y="200.0" width="980.0" height="200.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="530.0" y="262.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Криптографічний конверт ліцензії:</tspan><tspan x="530.0" dy="16.9">1. Клієнт генерує ефемерну пару ключів і підписує запит ключем Device Private Key.</tspan><tspan x="530.0" dy="16.9">2. Сервер перевіряє сертифікат пристрою та узгоджує ключ сесії K_sess.</tspan><tspan x="530.0" dy="16.9">3. Сервер загортає симетричний ключ контенту K_c алгоритмом AES-KW під ключем K_sess.</tspan><tspan x="530.0" dy="16.9">4. Анклав TEE розгортає K_sess за допомогою свого приватного ключа, а потім видобуває K_c.</tspan><tspan x="530.0" dy="16.9">Жоден ключ ні на мить не з'являється у відкритому вигляді в оперативній пам'яті хоста.</tspan></text>
</svg>