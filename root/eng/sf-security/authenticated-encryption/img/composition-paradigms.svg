<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири архітектурні парадигми захисту повідомлення</text>
<rect x="30.0" y="60.0" width="230.0" height="440.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="145.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Encrypt-and-MAC</text>
<text x="145.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">SSH-1</text>
<rect x="45.0" y="125.0" width="200.0" height="84.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="145.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Відкритий текст P</tspan></text>
<line x1="145.0" y1="213.0" x2="145.0" y2="226.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="230.0" width="200.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="145.0" y="268.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">C = Enc(K1, P)</tspan><tspan x="145.0" dy="15.6">T = MAC(K2, P)</tspan></text>
<line x1="145.0" y1="318.0" x2="145.0" y2="366.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="370.0" width="200.0" height="84.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="145.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Вразливість:</tspan><tspan x="145.0" dy="15.6">витік рівності P</tspan><tspan x="145.0" dy="15.6">через детермінований MAC</tspan></text>
<rect x="290.0" y="60.0" width="230.0" height="440.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="405.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">MAC-then-Encrypt</text>
<text x="405.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">SSL 3.0 / TLS 1.0–1.2</text>
<rect x="305.0" y="125.0" width="200.0" height="84.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="405.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Відкритий текст P</tspan></text>
<line x1="405.0" y1="213.0" x2="405.0" y2="226.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="305.0" y="230.0" width="200.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="405.0" y="268.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">P' = P || MAC(K2, P)</tspan><tspan x="405.0" dy="15.6">C = Enc(K1, P' || Pad)</tspan></text>
<line x1="405.0" y1="318.0" x2="405.0" y2="366.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="305.0" y="370.0" width="200.0" height="84.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="405.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Вразливість:</tspan><tspan x="405.0" dy="15.6">Padding Oracle,</tspan><tspan x="405.0" dy="15.6">Lucky Thirteen, POODLE</tspan></text>
<rect x="550.0" y="60.0" width="230.0" height="440.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="665.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Encrypt-then-MAC</text>
<text x="665.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">IPsec ESP / TLS 1.2 EtM</text>
<rect x="565.0" y="125.0" width="200.0" height="84.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="665.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Відкритий текст P</tspan></text>
<line x1="665.0" y1="213.0" x2="665.0" y2="226.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="565.0" y="230.0" width="200.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="268.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">C = Enc(K1, P)</tspan><tspan x="665.0" dy="15.6">T = MAC(K2, AAD || C)</tspan></text>
<line x1="665.0" y1="318.0" x2="665.0" y2="366.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="565.0" y="370.0" width="200.0" height="84.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="665.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Стійкий, але вимагає:</tspan><tspan x="665.0" dy="15.6">2 проходів, 2 ключів</tspan><tspan x="665.0" dy="15.6">і ручної збірки</tspan></text>
<rect x="810.0" y="60.0" width="230.0" height="440.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="925.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтегрований AEAD</text>
<text x="925.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">AES-GCM / ChaCha20-Poly</text>
<rect x="825.0" y="125.0" width="200.0" height="84.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="925.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">Plaintext P + AAD</tspan></text>
<line x1="925.0" y1="213.0" x2="925.0" y2="226.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="825.0" y="230.0" width="200.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="925.0" y="275.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">(C, T) = AEAD_Enc(K, N, A, P)</tspan></text>
<line x1="925.0" y1="318.0" x2="925.0" y2="366.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="825.0" y="370.0" width="200.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="925.0" y="401.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">Єдиний чорний ящик:</tspan><tspan x="925.0" dy="14.3">1 прохід, захист AAD,</tspan><tspan x="925.0" dy="14.3">дешифрування лише після тегу</tspan></text>
</svg>