<rect x="50.0" y="280.0" width="180.0" height="65.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/><text x="140.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Y₁ = A₁ · H</tspan><tspan x="140.0" dy="15.6">у GF(2¹²⁸)</tspan></text>
<rect x="290.0" y="280.0" width="180.0" height="65.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/><text x="380.0" y="309.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Y_m = (Y_{m-1} ⊕ A_m) · H</tspan><tspan x="380.0" dy="14.3">у GF(2¹²⁸)</tspan></text>
<rect x="530.0" y="280.0" width="180.0" height="65.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/><text x="620.0" y="309.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Y_{m+1} = (Y_m ⊕ C₁) · H</tspan><tspan x="620.0" dy="14.3">у GF(2¹²⁸)</tspan></text>
<rect x="770.0" y="280.0" width="180.0" height="65.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/><text x="860.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">GHASH Результат Y_f</tspan><tspan x="860.0" dy="15.6">Фінальний поліном</tspan></text>
