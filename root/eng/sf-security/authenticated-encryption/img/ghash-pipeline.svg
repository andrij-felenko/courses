<rect x="320.0" y="65.0" width="200.0" height="50.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/><text x="420.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Хеш-підключ H</tspan><tspan x="420.0" dy="15.6">H = AES_K(0¹²⁸)</tspan></text>
<rect x="600.0" y="65.0" width="200.0" height="50.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="700.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Початковий вектор J₀</tspan><tspan x="700.0" dy="15.6">IV || 0³¹ || 1</tspan></text>
<rect x="850.0" y="65.0" width="180.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="940.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">Маска тегу</tspan><tspan x="940.0" dy="15.6">S₀ = AES_K(J₀)</tspan></text>
