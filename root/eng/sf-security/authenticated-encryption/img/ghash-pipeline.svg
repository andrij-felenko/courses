<rect x="530.0" y="165.0" width="180.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="188.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Ciphertext: C₁</tspan><tspan x="620.0" dy="15.6">P₁ ⊕ AES_K(J₁)</tspan></text>
