<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія інтерфейсу AEAD та захисний бар'єр верифікації</text>
<rect x="50.0" y="70.0" width="220.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="160.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Секретний ключ K</tspan><tspan x="160.0" dy="16.9">(128 або 256 бітів)</tspan></text>
<rect x="50.0" y="140.0" width="220.0" height="50.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Одноразове число Nonce N</tspan><tspan x="160.0" dy="16.9">(96 бітів, унікальне!)</tspan></text>
<rect x="50.0" y="210.0" width="220.0" height="50.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/><text x="160.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Асоційовані дані AAD (A)</tspan><tspan x="160.0" dy="16.9">(заголовки пакетів)</tspan></text>
<rect x="50.0" y="280.0" width="220.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="160.0" y="301.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Відкритий текст Plaintext (P)</tspan><tspan x="160.0" dy="15.6">(корисне навантаження)</tspan></text>
<rect x="350.0" y="130.0" width="280.0" height="150.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/><text x="490.0" y="167.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Інтегрований примітив</tspan><tspan x="490.0" dy="16.9">AEAD Encrypt</tspan><tspan x="490.0" dy="16.9">(AES-GCM / ChaCha20-Poly1305)</tspan><tspan x="490.0" dy="16.9"></tspan><tspan x="490.0" dy="16.9">Одночасне шифрування</tspan><tspan x="490.0" dy="16.9">та формування доказу</tspan></text>
<line x1="275.0" y1="95.0" x2="345.0" y2="155.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="275.0" y1="165.0" x2="345.0" y2="180.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="275.0" y1="235.0" x2="345.0" y2="215.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="275.0" y1="305.0" x2="345.0" y2="245.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="810.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура мережевого кадру</text>
<rect x="680.0" y="95.0" width="260.0" height="42.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="810.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">AAD: Заголовок пакета (відкритий)</tspan></text>
<rect x="680.0" y="145.0" width="260.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="810.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Ciphertext C: Зашифроване тіло</tspan><tspan x="810.0" dy="15.6">(довжина дорівнює P)</tspan></text>
<rect x="680.0" y="205.0" width="260.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="810.0" y="223.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Tag T: Автентифікаційний тег</tspan><tspan x="810.0" dy="15.6">(16 байтів / 128 бітів)</tspan></text>
<line x1="635.0" y1="180.0" x2="675.0" y2="120.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="635.0" y1="205.0" x2="675.0" y2="170.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="635.0" y1="230.0" x2="675.0" y2="225.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="375.0" width="980.0" height="75.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="540.0" y="400.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Бар'єр дешифрування (Decryption Barrier):</tspan><tspan x="540.0" dy="16.9">Якщо Tag не зійшовся хоча б в одному біті — повідомлення негайно відкидається (⊥).</tspan><tspan x="540.0" dy="16.9">Жоден байт Plaintext НЕ повертається у відкритий буфер до повної константно-часової верифікації тегу!</tspan></text>
</svg>