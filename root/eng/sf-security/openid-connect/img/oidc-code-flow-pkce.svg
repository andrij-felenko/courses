<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">OpenID Connect: Authorization Code Flow з розширенням PKCE</text>
<rect x="15.0" y="48.0" width="190.0" height="34.0" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.6"/>
<text x="110.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="700">Браузер (User Agent)</text>
<line x1="110.0" y1="82.0" x2="110.0" y2="500.0" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="255.0" y="48.0" width="190.0" height="34.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="350.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Клієнт (Relying Party)</text>
<line x1="350.0" y1="82.0" x2="350.0" y2="500.0" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="515.0" y="48.0" width="190.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="610.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Сервер авторизації (OP)</text>
<line x1="610.0" y1="82.0" x2="610.0" y2="500.0" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="755.0" y="48.0" width="190.0" height="34.0" rx="6" fill="#ffffff" stroke="#7b1fa2" stroke-width="1.6"/>
<text x="850.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7b1fa2" text-anchor="middle" font-weight="700">Сервер ресурсів (UserInfo)</text>
<line x1="850.0" y1="82.0" x2="850.0" y2="500.0" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="250.0" y="96.0" width="200.0" height="34.0" rx="6" fill="#f4f7fe" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">1. Генерує verifier, challenge,</tspan><tspan x="350.0" dy="13.0">state та nonce</tspan></text>
<line x1="350.0" y1="140.0" x2="110.0" y2="140.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="230.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Redirect: /authorize?code_challenge=...</text>
<line x1="110.0" y1="168.0" x2="610.0" y2="168.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="360.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2. GET /authorize (scope=openid, challenge, state, nonce)</text>
<rect x="510.0" y="184.0" width="200.0" height="34.0" rx="6" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">3. Вхід (пароль, MFA)</tspan><tspan x="610.0" dy="13.0">та згода (consent)</tspan></text>
<line x1="610.0" y1="230.0" x2="110.0" y2="230.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="360.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">4. Redirect: /callback?code=AUTH_CODE&amp;state=...</text>
<line x1="110.0" y1="258.0" x2="350.0" y2="258.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="230.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">GET /callback?code=...&amp;state=...</text>
<line x1="350.0" y1="298.0" x2="610.0" y2="298.0" stroke="#2457d6" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="480.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">5. POST /token (code + code_verifier + secret)</text>
<rect x="510.0" y="314.0" width="200.0" height="34.0" rx="6" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">6. Перевірка code_verifier</tspan><tspan x="610.0" dy="13.0">= SHA256(challenge)</tspan></text>
<line x1="610.0" y1="360.0" x2="350.0" y2="360.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="480.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Відповідь: { id_token, access_token }</text>
<rect x="250.0" y="376.0" width="200.0" height="36.0" rx="6" fill="#f4f7fe" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">7. Валідація ID-токена:</tspan><tspan x="350.0" dy="13.0">підпис, iss, aud, nonce, exp</tspan></text>
<line x1="350.0" y1="426.0" x2="850.0" y2="426.0" stroke="#7b1fa2" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="600.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7b1fa2" text-anchor="middle">8. GET /userinfo (Authorization: Bearer access_token)</text>
<line x1="850.0" y1="460.0" x2="350.0" y2="460.0" stroke="#7b1fa2" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="600.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7b1fa2" text-anchor="middle">Профіль: { sub, name, email, email_verified }</text>
<line x1="350.0" y1="488.0" x2="110.0" y2="488.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="230.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">9. Set-Cookie: session_id=...</text>
</svg>