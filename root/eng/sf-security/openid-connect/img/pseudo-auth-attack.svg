<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атака підміни токена при використанні «голого» OAuth 2.0 для автентифікації</text>
<rect x="40.0" y="56.0" width="260.0" height="400.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.6"/>
<text x="170.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">1. Зловмисник (Attacker)</text>
<rect x="56.0" y="102.0" width="228.0" height="92.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="170.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Отримує легітимний</tspan><tspan x="170.0" dy="15.6">access_token для СВОГО</tspan><tspan x="170.0" dy="15.6">додатка «AttackerApp»</tspan><tspan x="170.0" dy="15.6">від спільного IdP</tspan></text>
<rect x="56.0" y="210.0" width="228.0" height="100.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="170.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Підсовує цей токен</tspan><tspan x="170.0" dy="15.6">жертві або вразливому</tspan><tspan x="170.0" dy="15.6">клієнту «VictimApp»</tspan><tspan x="170.0" dy="15.6">під час входу</tspan></text>
<rect x="56.0" y="326.0" width="228.0" height="114.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="170.0" y="365.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="170.0" dy="0.0">Токен валідний і виданий IdP,</tspan><tspan x="170.0" dy="14.3">але виданий ДЛЯ ІНШОГО</tspan><tspan x="170.0" dy="14.3">додатка! Голий OAuth</tspan><tspan x="170.0" dy="14.3">не має поля audience для клієнта</tspan></text>
<line x1="300.0" y1="260.0" x2="345.0" y2="260.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="322.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Токен</text>
<rect x="350.0" y="56.0" width="260.0" height="400.0" rx="8" fill="#f4f7fe" stroke="#2457d6" stroke-width="1.6"/>
<text x="480.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">2. Вразливий клієнт</text>
<rect x="366.0" y="102.0" width="228.0" height="86.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="480.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Отримує чужий access_token</tspan><tspan x="480.0" dy="15.6">і не може перевірити,</tspan><tspan x="480.0" dy="15.6">для кого його виписано</tspan></text>
<rect x="366.0" y="204.0" width="228.0" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="480.0" y="247.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Робить запит /userinfo</tspan><tspan x="480.0" dy="15.6">із цим токеном до IdP:</tspan><tspan x="480.0" dy="15.6">«Хто власник токена?»</tspan></text>
<rect x="366.0" y="330.0" width="228.0" height="110.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="480.0" y="367.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="480.0" dy="0.0">ПОМИЛКА:</tspan><tspan x="480.0" dy="14.3">Створює сесію для жертви</tspan><tspan x="480.0" dy="14.3">на основі чужого токена!</tspan><tspan x="480.0" dy="14.3">Зловмисник захоплює акаунт</tspan></text>
<line x1="610.0" y1="240.0" x2="655.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="632.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">GET /userinfo</text>
<line x1="655.0" y1="275.0" x2="610.0" y2="275.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="632.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">{sub, email}</text>
<rect x="660.0" y="56.0" width="260.0" height="400.0" rx="8" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.6"/>
<text x="790.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">3. Провайдер (IdP)</text>
<rect x="676.0" y="102.0" width="228.0" height="92.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="790.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Сервер авторизації:</tspan><tspan x="790.0" dy="15.6">чесно перевіряє токен,</tspan><tspan x="790.0" dy="15.6">бачить, що він дійсний</tspan><tspan x="790.0" dy="15.6">і не прострочений</tspan></text>
<rect x="676.0" y="210.0" width="228.0" height="100.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="790.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Кінцева точка /userinfo:</tspan><tspan x="790.0" dy="15.6">повертає профіль того,</tspan><tspan x="790.0" dy="15.6">хто авторизував токен,</tspan><tspan x="790.0" dy="15.6">не знаючи, хто питає</tspan></text>
<rect x="676.0" y="326.0" width="228.0" height="114.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="790.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">ВИСНОВОК:</tspan><tspan x="790.0" dy="13.0">Access token — це дозвіл на доступ,</tspan><tspan x="790.0" dy="13.0">а не доказ особи для клієнта!</tspan><tspan x="790.0" dy="13.0">OIDC вирішує це через ID Token</tspan></text>
</svg>