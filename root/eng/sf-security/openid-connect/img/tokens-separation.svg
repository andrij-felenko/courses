<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два токени — дві різні адреси та різні обов'язки</text>
<rect x="40.0" y="54.0" width="425.0" height="356.0" rx="8" fill="#f4f7fe" stroke="#2457d6" stroke-width="1.8"/>
<text x="252.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ID Token (Посвідчення особи)</text>
<rect x="56.0" y="100.0" width="393.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="252.5" y="128.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="252.5" dy="0.0">ПРИЗНАЧЕННЯ: для Клієнта (Relying Party)</tspan></text>
<rect x="56.0" y="156.0" width="393.0" height="106.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.0"/><text x="252.5" y="190.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">Формат: Завжди підписаний JWT (JWS/JWE)</tspan><tspan x="252.5" dy="15.0">Читач: Тільки клієнтський застосунок</tspan><tspan x="252.5" dy="15.0">Мета: Довести клієнту факт автентифікації користувача</tspan><tspan x="252.5" dy="15.0">Ключове поле: aud = client_id клієнта</tspan></text>
<rect x="56.0" y="270.0" width="393.0" height="126.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="252.5" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">Типовий вміст навантаження (payload):</tspan><tspan x="252.5" dy="14.3">{</tspan><tspan x="252.5" dy="14.3">  &quot;iss&quot;: &quot;https://accounts.example.com&quot;,</tspan><tspan x="252.5" dy="14.3">  &quot;sub&quot;: &quot;usr-98124&quot;,</tspan><tspan x="252.5" dy="14.3">  &quot;aud&quot;: &quot;my-web-app-client-id&quot;,</tspan><tspan x="252.5" dy="14.3">  &quot;exp&quot;: 1735732800, &quot;nonce&quot;: &quot;r8x2k1&quot;</tspan><tspan x="252.5" dy="14.3">}</tspan></text>
<rect x="495.0" y="54.0" width="425.0" height="356.0" rx="8" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.8"/>
<text x="707.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Access Token (Ключ доступу до API)</text>
<rect x="511.0" y="100.0" width="393.0" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="707.5" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="707.5" dy="0.0">ПРИЗНАЧЕННЯ: для Сервера ресурсів (Resource Server / API)</tspan></text>
<rect x="511.0" y="156.0" width="393.0" height="106.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.0"/><text x="707.5" y="190.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">Формат: Непрозорий рядок (opaque) або внутрішній JWT</tspan><tspan x="707.5" dy="15.0">Читач: Сервер ресурсів (API), клієнт НЕ розбирає його</tspan><tspan x="707.5" dy="15.0">Мета: Надати авторизований доступ до ресурсів (scope)</tspan><tspan x="707.5" dy="15.0">Ключове поле: aud = https://api.example.com</tspan></text>
<rect x="511.0" y="270.0" width="393.0" height="126.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="707.5" y="301.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">Типовий вміст або використання:</tspan><tspan x="707.5" dy="14.3">Клієнт додає токен у HTTP-заголовок запиту:</tspan><tspan x="707.5" dy="14.3">Authorization: Bearer dGVzdC1hY2Nlc3MtdG9rZW4...</tspan><tspan x="707.5" dy="14.3"></tspan><tspan x="707.5" dy="14.3">API перевіряє скоупи (openid, profile, email)</tspan><tspan x="707.5" dy="14.3">і віддає запитані ресурси користувача</tspan></text>
</svg>