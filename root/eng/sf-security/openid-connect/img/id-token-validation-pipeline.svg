<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр криптографічної та логічної перевірки ID-токена клієнтом</text>
<rect x="40.0" y="54.0" width="260.0" height="106.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<rect x="40.0" y="54.0" width="260.0" height="28.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.6"/>
<text x="170.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">1. Перевірка алгоритму</text>
<rect x="46.0" y="86.0" width="248.0" height="68.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="170.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Заголовок JWT: alg ∈ [RS256, ES256]</tspan><tspan x="170.0" dy="14.3">Заборона alg=&quot;none&quot; та HS256</tspan><tspan x="170.0" dy="14.3">Отримання kid (Key ID)</tspan></text>
<rect x="350.0" y="54.0" width="260.0" height="106.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<rect x="350.0" y="54.0" width="260.0" height="28.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.6"/>
<text x="480.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">2. Отримання публ. ключа</text>
<rect x="356.0" y="86.0" width="248.0" height="68.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="480.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Пошук kid у кеші JWKS</tspan><tspan x="480.0" dy="14.3">Якщо kid новий — оновлення JWKS</tspan><tspan x="480.0" dy="14.3">Витягнення відкритого ключа RSA/EC</tspan></text>
<rect x="660.0" y="54.0" width="260.0" height="106.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<rect x="660.0" y="54.0" width="260.0" height="28.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.6"/>
<text x="790.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">3. Перевірка підпису</text>
<rect x="666.0" y="86.0" width="248.0" height="68.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="790.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Криптографічна звірка:</tspan><tspan x="790.0" dy="14.3">Verify(header.payload, sig, pubKey)</tspan><tspan x="790.0" dy="14.3">Захист від модифікації даних</tspan></text>
<rect x="40.0" y="200.0" width="260.0" height="106.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<rect x="40.0" y="200.0" width="260.0" height="28.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="1.6"/>
<text x="170.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">4. Перевірка видавця (iss)</text>
<rect x="46.0" y="232.0" width="248.0" height="68.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="170.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Поле iss у токені ПОВИННО</tspan><tspan x="170.0" dy="14.3">точно збігатися з Issuer URL</tspan><tspan x="170.0" dy="14.3">з .well-known/openid-configuration</tspan></text>
<rect x="350.0" y="200.0" width="260.0" height="106.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<rect x="350.0" y="200.0" width="260.0" height="28.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="1.6"/>
<text x="480.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">5. Перевірка аудиторії (aud)</text>
<rect x="356.0" y="232.0" width="248.0" height="68.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="480.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Поле aud ПОВИННО містити</tspan><tspan x="480.0" dy="14.3">client_id цього клієнта</tspan><tspan x="480.0" dy="14.3">Захист від підміни токена іншим RP</tspan></text>
<rect x="660.0" y="200.0" width="260.0" height="106.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<rect x="660.0" y="200.0" width="260.0" height="28.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="1.6"/>
<text x="790.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">6. Час дії (exp, iat, nbf)</text>
<rect x="666.0" y="232.0" width="248.0" height="68.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="790.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">exp &gt; поточний час (не протух)</tspan><tspan x="790.0" dy="14.3">iat &lt;= поточний час (з урахуванням</tspan><tspan x="790.0" dy="14.3">допуску годинника 1-2 хвилини)</tspan></text>
<rect x="40.0" y="344.0" width="260.0" height="96.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<rect x="40.0" y="344.0" width="260.0" height="28.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/>
<text x="170.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">7. Перевірка Nonce</text>
<rect x="46.0" y="376.0" width="248.0" height="58.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="170.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">nonce у токені == nonce, що був</tspan><tspan x="170.0" dy="14.3">збережений у сесії клієнта</tspan><tspan x="170.0" dy="14.3">Захист від повтору запиту (replay)</tspan></text>
<rect x="350.0" y="344.0" width="260.0" height="96.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<rect x="350.0" y="344.0" width="260.0" height="28.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/>
<text x="480.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">8. Перевірка хешу (at_hash)</text>
<rect x="356.0" y="376.0" width="248.0" height="58.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="480.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Якщо є access_token:</tspan><tspan x="480.0" dy="14.3">at_hash == B64URL(LEFT_HALF(</tspan><tspan x="480.0" dy="14.3">SHA256(access_token)))</tspan></text>
<rect x="660.0" y="344.0" width="260.0" height="96.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<rect x="660.0" y="344.0" width="260.0" height="28.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/>
<text x="790.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">9. Успіх: створення сесії</text>
<rect x="666.0" y="376.0" width="248.0" height="58.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="790.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Користувач автентифікований!</tspan><tspan x="790.0" dy="14.3">Витягнення sub та профілю,</tspan><tspan x="790.0" dy="14.3">видача локального session cookie</tspan></text>
