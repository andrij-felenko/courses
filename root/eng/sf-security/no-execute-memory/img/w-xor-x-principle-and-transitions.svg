<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="157.9" y="8.0" width="584.2" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="29.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Принцип W^X (Write XOR Execute): Розподіл прав та переходи станів</tspan></text>
<rect x="64.5" y="100.2" width="211.0" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Сегмент коду (.text)</tspan><tspan x="170.0" dy="14.3">Права: PROT_READ | PROT_EXEC</tspan><tspan x="170.0" dy="14.3">Тільки читання та виконання</tspan></text>
<rect x="330.9" y="100.2" width="238.2" height="59.6" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Сегмент даних (Stack / Heap)</tspan><tspan x="450.0" dy="14.3">Права: PROT_READ | PROT_WRITE</tspan><tspan x="450.0" dy="14.3">Читання та запис (без виконання)</tspan></text>
<rect x="655.2" y="100.2" width="149.6" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Константи (.rodata)</tspan><tspan x="730.0" dy="14.3">Права: PROT_READ</tspan><tspan x="730.0" dy="14.3">Тільки читання</tspan></text>
<rect x="283.8" y="248.4" width="332.5" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="450.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">ЗАБОРОНЕНИЙ СТАН: RWX</tspan><tspan x="450.0" dy="15.6">Права: PROT_READ | PROT_WRITE | PROT_EXEC</tspan><tspan x="450.0" dy="15.6">Одночасна модифікація та виконання пам'яті</tspan></text>
<line x1="320.0" y1="120.0" x2="280.0" y2="120.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">mprotect(RX)</text>
<line x1="280.0" y1="145.0" x2="320.0" y2="145.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">mprotect(RW)</text>
<line x1="450.0" y1="185.0" x2="450.0" y2="235.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="495.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">✗ ЗАБОРОНЕНО</text>
<rect x="139.0" y="363.1" width="621.9" height="73.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Фундаментальний інваріант безпеки пам'яті:</tspan><tspan x="450.0" dy="14.3">Жодна сторінка віртуальної пам'яті не повинна одночасно мати права на запис (W) і виконання (X).</tspan><tspan x="450.0" dy="14.3">W ⊕ X = 1  (або  ¬(W ∧ X))</tspan><tspan x="450.0" dy="14.3">Якщо сторінка змінюється — вона не виконується; якщо виконується — вона захищена від змін.</tspan></text>
</svg>