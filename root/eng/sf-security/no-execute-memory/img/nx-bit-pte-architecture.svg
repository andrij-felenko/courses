<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="141.9" y="8.0" width="636.3" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="29.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Апаратна перевірка біта No-Execute (NX / XD) в таблицях сторінок x86-64</tspan></text>
<text x="460.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формат 64-розрядного запису таблиці сторінок (Page Table Entry, PTE)</text>
<rect x="40.0" y="85.0" width="110.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="95.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Біт 63: NX</text>
<text x="95.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">1 = No-Execute</text>
<rect x="155.0" y="85.0" width="130.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="220.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Біти 62..52</text>
<text x="220.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ignored / OS</text>
<rect x="290.0" y="85.0" width="340.0" height="55.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/>
<text x="460.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Біти 51..12: Physical Frame Base Address</text>
<text x="460.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Базова фізична адреса сторінки 4 КіБ у DRAM</text>
<rect x="635.0" y="85.0" width="140.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="705.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Біти 11..3</text>
<text x="705.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">G, PAT, D, A, PCD</text>
<rect x="780.0" y="85.0" width="100.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="830.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">U/S | R/W | P</text>
<text x="830.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Біти 2, 1, 0</text>
<line x1="40.0" y1="160.0" x2="880.0" y2="160.0" stroke="#d1d5db" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="64.8" y="210.2" width="190.5" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Процесорне ядро (CPU)</tspan><tspan x="160.0" dy="14.3">Фаза Instruction Fetch</tspan><tspan x="160.0" dy="14.3">Зчитування за адресою RIP</tspan></text>
<rect x="334.1" y="210.2" width="251.9" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Блок керування пам'яттю (MMU)</tspan><tspan x="460.0" dy="14.3">Трансляція адреси крізь CR3 -&gt; PTE</tspan><tspan x="460.0" dy="14.3">Апаратна перевірка біта 63 (NX)</tspan></text>
<line x1="260.0" y1="240.0" x2="320.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="290.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Fetch</text>
<line x1="600.0" y1="220.0" x2="680.0" y2="195.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="640.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">NX = 0</text>
<rect x="705.0" y="165.2" width="170.0" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">L1i Cache &amp; Decoder</tspan><tspan x="790.0" dy="14.3">Інструкція декодується</tspan><tspan x="790.0" dy="14.3">та виконується ядром</tspan></text>
<line x1="600.0" y1="260.0" x2="680.0" y2="290.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="640.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">NX = 1</text>
<rect x="687.9" y="265.2" width="204.1" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Page Fault (#PF, Вектор 14)</tspan><tspan x="790.0" dy="14.3">Код помилки: I/D = 1</tspan><tspan x="790.0" dy="14.3">Ядро надсилає SIGSEGV</tspan></text>
<rect x="167.9" y="400.2" width="584.3" height="59.6" rx="6" fill="#fff8f8" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="419.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Апаратний захист: Спроба вибірки інструкції (Instruction Fetch) зі сторінки з бітом NX = 1</tspan><tspan x="460.0" dy="14.3">перехоплюється транслятором MMU ще до потрапляння в чергу декодера інструкцій.</tspan><tspan x="460.0" dy="14.3">Процес негайно аварійно завершується через сигнал SIGSEGV (SEGV_ACCERR).</tspan></text>
</svg>