<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="141.9" y="8.0" width="636.3" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="29.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Архітектура подвійного відображення (Dual Mapping) для JIT-компіляторів</tspan></text>
<rect x="40.0" y="60.0" width="400.0" height="310.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="240.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віртуальний адресний простір процесу</text>
<rect x="100.4" y="115.2" width="279.2" height="59.6" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Віртуальна адреса V_write</tspan><tspan x="240.0" dy="14.3">Права: PROT_READ | PROT_WRITE</tspan><tspan x="240.0" dy="14.3">Використовується потоком генерації JIT</tspan></text>
<rect x="97.0" y="245.2" width="286.0" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Віртуальна адреса V_exec</tspan><tspan x="240.0" dy="14.3">Права: PROT_READ | PROT_EXEC</tspan><tspan x="240.0" dy="14.3">Використовується потоком виконання коду</tspan></text>
<rect x="580.0" y="60.0" width="300.0" height="310.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="730.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична оперативна пам'ять (DRAM)</text>
<rect x="600.6" y="180.2" width="258.7" height="59.6" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="730.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Спільний фізичний кадр</tspan><tspan x="730.0" dy="14.3">(Physical Frame #4128)</tspan><tspan x="730.0" dy="14.3">Містить скомпільований машинний код</tspan></text>
<line x1="375.0" y1="145.0" x2="605.0" y2="195.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">mmap(fd, PROT_RW)</text>
<line x1="375.0" y1="275.0" x2="605.0" y2="225.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">mmap(fd, PROT_RX)</text>
<rect x="86.3" y="388.1" width="747.3" height="73.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="407.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Переваги Dual Mapping:</tspan><tspan x="460.0" dy="14.3">1. Нульові накладні витрати на mprotect() та скидання TLB під час генерації нових функцій.</tspan><tspan x="460.0" dy="14.3">2. Відсутність вікна гонитви (Race Condition): сторінка виконання V_exec завжди залишається тільки для читання (RX).</tspan><tspan x="460.0" dy="14.3">3. Повне дотримання правила W^X в кожен момент часу без модифікації прав під час роботи потоків.</tspan></text>
</svg>