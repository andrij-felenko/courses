<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="141.9" y="8.0" width="636.3" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="29.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Еволюція атак на пам'ять: як біт NX змусив перейти від Shellcode до ROP</tspan></text>
<rect x="40.0" y="55.0" width="400.0" height="350.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="240.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">До появи NX: Пряма ін'єкція Shellcode</text>
<rect x="99.8" y="105.5" width="280.4" height="69.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Стек процесу (Права: RWX)</tspan><tspan x="240.0" dy="13.0">[ Буфер: байти шелкоду execve() ]</tspan><tspan x="240.0" dy="13.0">[ Збережений RBP ]</tspan><tspan x="240.0" dy="13.0">[ Адреса повернення -&gt; вказівник на стек ]</tspan></text>
<line x1="240.0" y1="205.0" x2="240.0" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ret -&gt; стрибок на стек</text>
<rect x="135.9" y="247.0" width="208.1" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="265.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Виконання коду зі стека</tspan><tspan x="240.0" dy="13.0">Процесор виконує ін'єктований код</tspan><tspan x="240.0" dy="13.0">Відкривається командна оболонка</tspan></text>
<rect x="84.3" y="327.0" width="311.4" height="56.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">З появою NX (Non-Executable Stack):</tspan><tspan x="240.0" dy="13.0">Спроба виконання стека викликає #PF -&gt; SIGSEGV.</tspan><tspan x="240.0" dy="13.0">Пряма ін'єкція шелкоду заблокована назавжди.</tspan></text>
<rect x="480.0" y="55.0" width="400.0" height="350.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="680.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Після NX: Повторне використання коду (ROP)</text>
<rect x="555.3" y="105.5" width="249.4" height="69.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/><text x="680.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Стек процесу (Права: RW, тільки дані)</tspan><tspan x="680.0" dy="13.0">[ Адреса ґаджета 1: pop rdi; ret ]</tspan><tspan x="680.0" dy="13.0">[ Аргумент: адреса рядка '/bin/sh' ]</tspan><tspan x="680.0" dy="13.0">[ Адреса ґаджета 2: адреса system() ]</tspan></text>
<line x1="680.0" y1="205.0" x2="680.0" y2="240.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="680.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ret -&gt; ланцюжок ґаджетів</text>
<rect x="530.4" y="247.0" width="299.3" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="265.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Виконання в наявному .text / libc (RX)</tspan><tspan x="680.0" dy="13.0">Процесор виконує легітимні інструкції бібліотеки.</tspan><tspan x="680.0" dy="13.0">Біт NX не спрацьовує, бо сторінки коду мають RX.</tspan></text>
<rect x="521.2" y="327.0" width="317.6" height="56.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Протидія атакам типу ROP:</tspan><tspan x="680.0" dy="13.0">Потрібні комплексні бар'єри: ASLR, Shadow Stack,</tspan><tspan x="680.0" dy="13.0">канарейки стека та Control-Flow Integrity (CFI).</tspan></text>
<rect x="167.9" y="437.4" width="584.3" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="456.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Висновок: Біт NX унеможливив виконання чужих ін'єктованих байтів у пам'яті даних,</tspan><tspan x="460.0" dy="14.3">перевівши вектор атак від виконання шелкоду до маніпуляції ланцюжками наявного коду (ROP).</tspan></text>
</svg>