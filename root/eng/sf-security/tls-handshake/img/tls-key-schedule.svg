<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархічний розгорт ключів HKDF у TLS 1.3</text>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф деривації ключів HKDF у TLS 1.3</text>
<rect x="235.2" y="64.0" width="369.7" height="32.0" rx="6" fill="#f4f6f8" stroke="#aab4c0" stroke-width="1.5"/><text x="420.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">IKM = 00...00  ⟶  HKDF-Extract  ⟶  Early Secret</tspan></text>
<line x1="420.0" y1="105.0" x2="420.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="490.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">salt = Derive-Secret</text>
<rect x="142.6" y="148.8" width="554.8" height="32.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="169.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">IKM = ECDHE Shared Secret (gⁿᵐ)  ⟶  HKDF-Extract  ⟶  Handshake Secret</tspan></text>
<line x1="300.0" y1="195.0" x2="220.0" y2="240.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="102.2" y="242.3" width="195.6" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Client Handshake Traffic Key</tspan><tspan x="200.0" dy="14.3">+ IV (AES-GCM)</tspan></text>
<line x1="540.0" y1="195.0" x2="620.0" y2="240.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="542.2" y="242.3" width="195.6" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Server Handshake Traffic Key</tspan><tspan x="640.0" dy="14.3">+ IV (AES-GCM)</tspan></text>
<line x1="420.0" y1="195.0" x2="420.0" y2="320.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">IKM = 00...00 + Derive-Secret</text>
<rect x="285.1" y="328.5" width="269.9" height="33.0" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="420.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Master Secret (Головний секрет)</tspan></text>
<line x1="280.0" y1="370.0" x2="200.0" y2="410.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="67.7" y="412.4" width="224.6" height="45.3" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="431.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Client Application Traffic Key</tspan><tspan x="180.0" dy="14.3">(Шифрування запитів HTTP)</tspan></text>
<line x1="560.0" y1="370.0" x2="640.0" y2="410.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="547.7" y="412.4" width="224.6" height="45.3" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="431.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Server Application Traffic Key</tspan><tspan x="660.0" dy="14.3">(Шифрування відповідей HTTP)</tspan></text>
</svg>