<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="181.0" y="12.5" width="578.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="470.0" y="35.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Конвеєр цифрового підпису на основі евристики Фіата — Шаміра</tspan></text>
<rect x="25.0" y="70.0" width="890.0" height="175.0" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="470.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">Генерація підпису σ (Секретний ключ sk = x, Повідомлення m)</text>
<rect x="54.1" y="122.9" width="121.7" height="44.1" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="115.0" y="141.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Випадкове r ← ℤ_q</tspan><tspan x="115.0" dy="13.7">Комітмент α = gʳ</tspan></text>
<line x1="185.0" y1="145.0" x2="270.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="298.2" y="122.9" width="143.7" height="44.1" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="370.0" y="141.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Обчислення виклику:</tspan><tspan x="370.0" dy="13.7">β = H(m || α)</tspan></text>
<line x1="470.0" y1="145.0" x2="540.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="572.2" y="122.9" width="145.7" height="44.1" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="645.0" y="141.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Обчислення відповіді:</tspan><tspan x="645.0" dy="13.7">γ = r + β · x (mod q)</tspan></text>
<line x1="750.0" y1="145.0" x2="815.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="817.7" y="122.3" width="74.6" height="45.3" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="855.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="855.0" dy="0.0">Підпис σ</tspan><tspan x="855.0" dy="14.3">(α, γ)</tspan></text>
<rect x="25.0" y="265.0" width="890.0" height="175.0" rx="8" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5"/>
<text x="470.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="700">Перевірка підпису (Публічний ключ pk = y = gˣ, Повідомлення m, Підпис σ = (α, γ))</text>
<rect x="72.2" y="337.9" width="145.7" height="44.1" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="145.0" y="356.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Вхід:</tspan><tspan x="145.0" dy="13.7">m, pk = y, σ = (α, γ)</tspan></text>
<line x1="240.0" y1="360.0" x2="310.0" y2="360.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="323.6" y="337.9" width="182.8" height="44.1" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="415.0" y="356.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">1. Реконструкція виклику:</tspan><tspan x="415.0" dy="13.7">β' = H(m || α)</tspan></text>
<line x1="520.0" y1="360.0" x2="595.0" y2="360.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="640.6" y="331.1" width="208.8" height="57.8" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="745.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">2. Перевірка ґрунтовності:</tspan><tspan x="745.0" dy="13.7">g^γ =?= α · y^β' (mod p)</tspan><tspan x="745.0" dy="13.7">(Якщо рівно — ПІДПИС ДІЙСНИЙ)</tspan></text>
</svg>