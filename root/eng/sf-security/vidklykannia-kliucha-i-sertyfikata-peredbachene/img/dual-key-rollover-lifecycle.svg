<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл безперервної міграції кореневого ключа парку</text>
<rect x="25.0" y="60.0" width="210.0" height="410.0" rx="8" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.6"/>
<rect x="33.0" y="70.0" width="194.0" height="32.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="130.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Фаза 1: Штатна робота</text>
<text x="37.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Стан парку:</text>
<text x="37.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Активний: Ключ 0 (Key_0)</text>
<text x="37.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Резервний: Ключ 1 (Key_1)</text>
<text x="37.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Резерв в OTP прошитий</text>
<text x="37.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">  ще на етапі фабрики</text>
<text x="37.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Формат оновлень:</text>
<text x="37.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Прошивки підписані</text>
<text x="37.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  виключно Key_0</text>
<text x="37.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Подія запуску:</text>
<text x="37.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Виявлено витік або</text>
<text x="37.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">  плановий кінець Key_0</text>
<line x1="238.0" y1="250.0" x2="257.0" y2="250.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="250.0" y="60.0" width="210.0" height="410.0" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.6"/>
<rect x="258.0" y="70.0" width="194.0" height="32.0" rx="5" fill="#ffffff" stroke="#d4ac0d" stroke-width="1.0"/>
<text x="355.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d4ac0d" text-anchor="middle" font-weight="700">Фаза 2: Подвійний підпис</text>
<text x="262.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Стан оновлення:</text>
<text x="262.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пакет містить підписи:</text>
<text x="262.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">  Sig(Key_0) + Sig(Key_1)</text>
<text x="262.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Інструкція міграції:</text>
<text x="262.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">  Set_Active_Key(Slot 1)</text>
<text x="262.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Розгортання у парку:</text>
<text x="262.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Старі пристрої валідують</text>
<text x="262.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  образ через Key_0</text>
<text x="262.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Нові вузли вже готові</text>
<text x="262.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  до розпізнавання Key_1</text>
<line x1="463.0" y1="250.0" x2="482.0" y2="250.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="475.0" y="60.0" width="210.0" height="410.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.6"/>
<rect x="483.0" y="70.0" width="194.0" height="32.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="580.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза 3: Атомарне перемикання</text>
<text x="487.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Дії завантажувача:</text>
<text x="487.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Запис образу у Банк B</text>
<text x="487.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Верифікація обох підписів</text>
<text x="487.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Тестове завантаження B</text>
<text x="487.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Watchdog перевіряє зв'язок</text>
<text x="487.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Фіксація ротації:</text>
<text x="487.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Апаратний прожиг eFuse:</text>
<text x="487.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">  Revoke_Slot(0) = 1</text>
<text x="487.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Key_0 мертвий назавжди</text>
<line x1="688.0" y1="250.0" x2="707.0" y2="250.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="700.0" y="60.0" width="210.0" height="410.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<rect x="708.0" y="70.0" width="194.0" height="32.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="805.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 4: Нова норма</text>
<text x="712.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Новий стан парку:</text>
<text x="712.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Активний: Ключ 1 (Key_1)</text>
<text x="712.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Ключ 0 заблокований</text>
<text x="712.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">  на рівні кремнію</text>
<text x="712.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Резервний: Ключ 2 (Key_2)</text>
<text x="712.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">  (готовий до наступної)</text>
<text x="712.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Результат:</text>
<text x="712.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• 0 секунд простою парку</text>
<text x="712.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Жоден пристрій не став</text>
<text x="712.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">  «цеглиною» під час ротації</text>
</svg>