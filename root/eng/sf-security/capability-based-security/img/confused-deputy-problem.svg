<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980.68 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980.68" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.7" y="13.0" width="358.5" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="34.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Класична модель ACL (Ambient Authority)</tspan></text>
<rect x="499.4" y="13.0" width="341.2" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="34.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Модель повноважень (Capability-Based)</tspan></text>
<line x1="450.0" y1="20.0" x2="450.0" y2="480.0" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="21.9" y="78.4" width="176.2" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="105.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Зловмисник</tspan><tspan x="110.0" dy="15.6">(UID 1000)</tspan><tspan x="110.0" dy="15.6">Немає доступу до /etc</tspan></text>
<rect x="266.8" y="78.4" width="146.5" height="63.2" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Deputy (Сервіс)</tspan><tspan x="340.0" dy="15.6">(UID 0 / root)</tspan><tspan x="340.0" dy="15.6">Має повний доступ</tspan></text>
<rect x="266.8" y="276.2" width="146.5" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Файл: /etc/passwd</tspan><tspan x="340.0" dy="15.6">(Власник: root)</tspan></text>
<line x1="185.0" y1="110.0" x2="260.0" y2="110.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="222.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Шлях '/etc/passwd'</text>
<line x1="340.0" y1="160.0" x2="340.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="355.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">2. open('/etc/passwd')</text>
<text x="355.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">з правами UID 0</text>
<rect x="25.0" y="390.2" width="389.9" height="59.6" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="409.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Провал безпеки:</tspan><tspan x="220.0" dy="14.3">Сервіс використовує власні фонові права (ambient authority)</tspan><tspan x="220.0" dy="14.3">для доступу до файлу, який клієнт не мав права змінювати.</tspan></text>
<rect x="469.3" y="78.4" width="161.4" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="105.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Клієнт</tspan><tspan x="550.0" dy="15.6">Володіє CPtr 3</tspan><tspan x="550.0" dy="15.6">(лише /tmp/out.log)</tspan></text>
<rect x="703.0" y="78.4" width="153.9" height="63.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="105.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Сервіс (Deputy)</tspan><tspan x="780.0" dy="15.6">Працює в пісочниці</tspan><tspan x="780.0" dy="15.6">Без неявних прав</tspan></text>
<rect x="583.0" y="276.2" width="153.9" height="47.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Файл: /tmp/out.log</tspan><tspan x="660.0" dy="15.6">(Доступ дозволено)</tspan></text>
<rect x="738.0" y="276.2" width="153.9" height="47.6" rx="6" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5"/><text x="815.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Файл: /etc/passwd</tspan><tspan x="815.0" dy="15.6">(Немає capability)</tspan></text>
<line x1="620.0" y1="110.0" x2="700.0" y2="110.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="660.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. Передача CPtr 3 (Cap)</text>
<line x1="750.0" y1="160.0" x2="680.0" y2="260.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="670.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">2. Запис через Cap</text>
<line x1="795.0" y1="160.0" x2="815.0" y2="260.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="830.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">✗ Неможливо
адресувати</text>
<rect x="478.2" y="390.2" width="383.7" height="59.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="409.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Захист за побудовою:</tspan><tspan x="670.0" dy="14.3">Сервіс може записати лише в той об'єкт, на який клієнт</tspan><tspan x="670.0" dy="14.3">явно передав невдаване повноваження (explicit delegation).</tspan></text>
</svg>