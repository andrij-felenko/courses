<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="173.9" y="8.0" width="532.1" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="29.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Апаратна структура повноваження CHERI (128-біт + 1-біт Tag)</tspan></text>
<rect x="16.6" y="70.2" width="176.9" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="105.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Теговий біт (Tag)</tspan><tspan x="105.0" dy="14.3">1 біт (поза DRAM)</tspan><tspan x="105.0" dy="14.3">1 = чинне, 0 = недійсне</tspan></text>
<rect x="210.0" y="75.0" width="310.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="365.0" y="97.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Метадані (64 біти)</tspan><tspan x="365.0" dy="11.7">[ Права (Perms) | Межі (Bounds: Base/Top) | Тип (Type) ]</tspan></text>
<rect x="530.0" y="75.0" width="320.0" height="50.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Курсор / Адреса (64 біти)</tspan><tspan x="690.0" dy="14.3">Поточна віртуальна адреса (Address / Offset)</tspan></text>
<line x1="180.0" y1="100.0" x2="205.0" y2="100.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="175.0" width="245.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="162.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Права доступу (Permissions):</tspan><tspan x="162.5" dy="13.0">• Read / Write / Execute</tspan><tspan x="162.5" dy="13.0">• Load / Store Capability</tspan><tspan x="162.5" dy="13.0">• User / System perms</tspan></text>
<rect x="315.0" y="175.0" width="250.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Просторові межі (Bounds):</tspan><tspan x="440.0" dy="13.0">• Base: нижня межа пам'яті</tspan><tspan x="440.0" dy="13.0">• Top: верхня межа (Base+Length)</tspan><tspan x="440.0" dy="13.0">(стиснення CHERI Concentrate)</tspan></text>
<rect x="595.0" y="175.0" width="250.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Стан запечатування (Sealing):</tspan><tspan x="720.0" dy="13.0">• OType: тип об'єкта</tspan><tspan x="720.0" dy="13.0">• Sealed: запечатано (незмінне)</tspan><tspan x="720.0" dy="13.0">• Unsealed: доступне до розіменування</tspan></text>
<rect x="110.2" y="323.1" width="659.5" height="73.9" rx="6" fill="#fdfbf7" stroke="#d97706" stroke-width="1.5"/><text x="440.0" y="342.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Ключові апаратні гарантії CHERI:</tspan><tspan x="440.0" dy="14.3">1. Невдаваність: зміна хоча б 1 біта інструкціями цілочисельної арифметики автоматично скидає Tag у 0.</tspan><tspan x="440.0" dy="14.3">2. Монотонність: права та межі можна лише звужувати (attenuation), розширення блокується апаратно.</tspan><tspan x="440.0" dy="14.3">3. Розіменування вказівника з Tag=0 генерує апаратний виняток (Hardware Capability Trap).</tspan></text>
</svg>