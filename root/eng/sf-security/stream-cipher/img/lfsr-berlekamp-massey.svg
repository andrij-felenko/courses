<text x="510.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Алгоритм Берлекампа-Мессі знаходить мінімальний поліном та весь початковий стан за лінійний час</text>
