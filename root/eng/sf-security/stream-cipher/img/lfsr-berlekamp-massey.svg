<text x="510.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Крах лінійності: Відновлення полінома за алгоритмом Берлекампа-Мессі</text>
<rect x="50.0" y="355.0" width="270.0" height="70.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="185.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Помилкова інтуїція:</tspan><tspan x="185.0" dy="14.3">Простір станів = 2ᴸ - 1 бітів</tspan><tspan x="185.0" dy="14.3">Потрібно перебирати O(2ᴸ) ключів</tspan></text>
<rect x="370.0" y="355.0" width="280.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Реальність (Берлекамп-Мессі):</tspan><tspan x="510.0" dy="14.3">Достатньо лише 2L послідовних бітів</tspan><tspan x="510.0" dy="14.3">Складність відновлення: O(L²)</tspan></text>
<rect x="690.0" y="355.0" width="280.0" height="70.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="830.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Наслідки в інженерії:</tspan><tspan x="830.0" dy="14.3">Чистий LFSR НЕПРИДАТНИЙ для крипто</tspan><tspan x="830.0" dy="14.3">Потрібні нелінійні комбінатори / ARX</tspan></text>
<line x1="50.0" y1="442.0" x2="970.0" y2="442.0" stroke="#333333" stroke-width="0.8" stroke-dasharray="4,4"/>
