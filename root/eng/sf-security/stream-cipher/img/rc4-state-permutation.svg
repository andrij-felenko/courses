<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішній стан та цикл генерації шифру RC4 (байт-орієнтована перестановка)</text>
<rect x="30.0" y="48.0" width="300.0" height="452.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="180.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Масив перестановки S[0..255]</text>
<text x="180.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">256 байтів стану (2048 бітів ентропії)</text>
<rect x="60.0" y="116.0" width="100.0" height="32.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="110.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">S[0]</tspan></text>
<rect x="180.0" y="116.0" width="110.0" height="32.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="235.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">0x42</tspan></text>
<rect x="60.0" y="154.0" width="100.0" height="32.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="110.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">S[1]</tspan></text>
<rect x="180.0" y="154.0" width="110.0" height="32.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="235.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">0x17</tspan></text>
<text x="180.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">• • •</text>
<rect x="60.0" y="230.0" width="100.0" height="32.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="110.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">S[i]</tspan></text>
<rect x="180.0" y="230.0" width="110.0" height="32.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="235.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">S[i]</tspan></text>
<text x="180.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">• • •</text>
<rect x="60.0" y="306.0" width="100.0" height="32.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="110.0" y="325.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">S[j]</tspan></text>
<rect x="180.0" y="306.0" width="110.0" height="32.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="235.0" y="325.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">S[j]</tspan></text>
<text x="180.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">• • •</text>
<rect x="60.0" y="382.0" width="100.0" height="32.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="110.0" y="401.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">S[255]</tspan></text>
<rect x="180.0" y="382.0" width="110.0" height="32.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="235.0" y="401.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">0x9A</tspan></text>
<rect x="50.0" y="430.0" width="260.0" height="52.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Покажчики стану:</tspan><tspan x="180.0" dy="13.7">• i = (i + 1) mod 256</tspan><tspan x="180.0" dy="13.7">• j = (j + S[i]) mod 256</tspan></text>
<rect x="350.0" y="48.0" width="340.0" height="452.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="520.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерація гами (PRGA)</text>
<rect x="370.0" y="110.0" width="300.0" height="48.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="520.0" y="130.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Крок 1: Інкремент i</tspan><tspan x="520.0" dy="14.3">i = (i + 1) mod 256</tspan></text>
<line x1="520.0" y1="158.0" x2="520.0" y2="175.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="370.0" y="175.0" width="300.0" height="48.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="520.0" y="195.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Крок 2: Накопичення j</tspan><tspan x="520.0" dy="14.3">j = (j + S[i]) mod 256</tspan></text>
<line x1="520.0" y1="223.0" x2="520.0" y2="240.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="370.0" y="240.0" width="300.0" height="48.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="520.0" y="260.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Крок 3: Обмін значень</tspan><tspan x="520.0" dy="14.3">swap(S[i], S[j])</tspan></text>
<line x1="520.0" y1="288.0" x2="520.0" y2="305.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="370.0" y="305.0" width="300.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="325.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Крок 4: Розрахунок індексу</tspan><tspan x="520.0" dy="14.3">t = (S[i] + S[j]) mod 256</tspan></text>
<line x1="520.0" y1="353.0" x2="520.0" y2="370.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="370.0" y="370.0" width="300.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="390.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Крок 5: Байт гами</tspan><tspan x="520.0" dy="14.3">K_byte = S[t]</tspan></text>
<rect x="370.0" y="435.0" width="300.0" height="48.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/><text x="520.0" y="455.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Шифрування байта:</tspan><tspan x="520.0" dy="14.3">C[k] = P[k] ⊕ K_byte</tspan></text>
<rect x="710.0" y="48.0" width="280.0" height="452.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="850.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Фатальні вади RC4</text>
<rect x="725.0" y="105.0" width="250.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">1. Зсув другого байта (MS):</tspan><tspan x="850.0" dy="13.7">P(Z₂ = 0) ≈ 1/128</tspan><tspan x="850.0" dy="13.7">(замість 1/256)</tspan><tspan x="850.0" dy="13.7">Витік у перших байтах</tspan></text>
<rect x="725.0" y="195.0" width="250.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="216.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">2. Атака FMS на WEP:</tspan><tspan x="850.0" dy="13.7">Префікс IV (3 байти) + Key</tspan><tspan x="850.0" dy="13.7">Слабкі ключі дозволяють</tspan><tspan x="850.0" dy="13.7">відновити майстер-ключ</tspan></text>
<rect x="725.0" y="290.0" width="250.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">3. Атаки на TLS (2013-15):</tspan><tspan x="850.0" dy="13.7">Зсуви пар байтів (ABPPS)</tspan><tspan x="850.0" dy="13.7">Відновлення cookie HTTP</tspan><tspan x="850.0" dy="13.7">після 2²⁴-2³⁰ запитів</tspan></text>
<rect x="725.0" y="390.0" width="250.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="412.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">RFC 7465 (2015):</tspan><tspan x="850.0" dy="13.7">ПОВНА ЗАБОРОНА RC4</tspan><tspan x="850.0" dy="13.7">у протоколах TLS.</tspan><tspan x="850.0" dy="13.7">Алгоритм не підлягає</tspan><tspan x="850.0" dy="13.7">використанню!</tspan></text>
</svg>