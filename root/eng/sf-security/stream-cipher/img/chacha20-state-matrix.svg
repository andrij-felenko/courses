<rect x="565.0" y="476.0" width="410.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="493.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">S_final[i] = S_init[i] + S_perm[i] mod 2³²  (64 байти гами)</tspan><tspan x="770.0" dy="13.0">Запобігає оберненню раундів для відновлення ключа!</tspan></text>
