<rect x="50.0" y="435.0" width="440.0" height="40.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="270.0" y="458.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Рядки 1-2: 256-бітний ключ | Рядок 3: Лічильник (32 біти) + Nonce (96 бітів)</tspan></text>
<rect x="50.0" y="480.0" width="440.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Прямий доступ (Random Access): для блоку N лічильник ставиться в N</tspan><tspan x="270.0" dy="13.0">без потреби обчислювати всі попередні байти!</tspan></text>
<rect x="530.0" y="48.0" width="480.0" height="492.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="770.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чвертьраунд QR(a, b, c, d) та 20 раундів</text>
<rect x="550.0" y="98.0" width="440.0" height="88.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/><text x="770.0" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Базова операція ARX (константний час CPU):</tspan><tspan x="770.0" dy="14.3">1. a += b;  d ^= a;  d &lt;&lt;&lt;= 16;</tspan><tspan x="770.0" dy="14.3">2. c += d;  b ^= c;  b &lt;&lt;&lt;= 12;</tspan><tspan x="770.0" dy="14.3">3. a += b;  d ^= a;  d &lt;&lt;&lt;= 8;</tspan><tspan x="770.0" dy="14.3">4. c += d;  b ^= c;  b &lt;&lt;&lt;= 7;</tspan></text>
<rect x="550.0" y="198.0" width="210.0" height="70.0" rx="6" fill="#f3f4f6" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Колонкові раунди:</tspan><tspan x="655.0" dy="13.0">QR(0, 4, 8, 12)</tspan><tspan x="655.0" dy="13.0">QR(1, 5, 9, 13)</tspan><tspan x="655.0" dy="13.0">QR(2, 6, 10, 14)</tspan><tspan x="655.0" dy="13.0">QR(3, 7, 11, 15)</tspan></text>
<rect x="780.0" y="198.0" width="210.0" height="70.0" rx="6" fill="#f3f4f6" stroke="#2457d6" stroke-width="1.5"/><text x="885.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">Діагональні раунди:</tspan><tspan x="885.0" dy="13.0">QR(0, 5, 10, 15)</tspan><tspan x="885.0" dy="13.0">QR(1, 6, 11, 12)</tspan><tspan x="885.0" dy="13.0">QR(2, 7, 8, 13)</tspan><tspan x="885.0" dy="13.0">QR(3, 4, 9, 14)</tspan></text>
