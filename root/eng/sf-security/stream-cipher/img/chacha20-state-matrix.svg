<rect x="785.0" y="372.0" width="190.0" height="42.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="880.0" y="389.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Переставлений стан</tspan><tspan x="880.0" dy="13.7">S_perm[0..15]</tspan></text>
