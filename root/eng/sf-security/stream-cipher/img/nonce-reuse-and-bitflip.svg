<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вразливості потокових шифрів та захист через ChaCha20-Poly1305 (AEAD)</text>
<rect x="30.0" y="48.0" width="475.0" height="230.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="267.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Катастрофа повторного Nonce (Two-Time Pad)</text>
<rect x="45.0" y="92.0" width="210.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">C₁ = P₁ ⊕ Keystream</tspan><tspan x="150.0" dy="13.7">(Зашифровано на Nonce N)</tspan></text>
<rect x="280.0" y="92.0" width="210.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="385.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">C₂ = P₂ ⊕ Keystream</tspan><tspan x="385.0" dy="13.7">(Повторно той самий Nonce N)</tspan></text>
<line x1="150.0" y1="134.0" x2="250.0" y2="160.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="385.0" y1="134.0" x2="284.0" y2="160.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="267.0" cy="166.0" r="12.0" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.5"/>
<text x="267.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b21a8" text-anchor="middle" font-weight="700">⊕</text>
<line x1="267.0" y1="178.0" x2="267.0" y2="196.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="198.0" width="445.0" height="66.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="267.5" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="267.5" dy="0.0">C₁ ⊕ C₂ = (P₁ ⊕ K) ⊕ (P₂ ⊕ K) = P₁ ⊕ P₂</tspan><tspan x="267.5" dy="13.7">Ключ і гама ПОВНІСТЮ ЗНИЩЕНІ!</tspan><tspan x="267.5" dy="13.7">Атака Crib Dragging відновлює обидва тексти за секунди.</tspan></text>
<rect x="535.0" y="48.0" width="475.0" height="230.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="772.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Пластичність (Malleability) та Біт-фліппінг</text>
<rect x="550.0" y="92.0" width="445.0" height="42.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="772.5" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="772.5" dy="0.0">Перехоплення шифротексту: C = P ⊕ Keystream</tspan></text>
<rect x="550.0" y="142.0" width="445.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="772.5" y="160.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0.0">Зловмисник інжектує маску маніпуляції Δ:</tspan><tspan x="772.5" dy="13.7">C' = C ⊕ Δ</tspan></text>
<rect x="550.0" y="194.0" width="445.0" height="70.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="772.5" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0.0">Дешифрування без автентифікації:</tspan><tspan x="772.5" dy="13.7">P' = C' ⊕ Keystream = (P ⊕ Keystream ⊕ Δ) ⊕ Keystream = P ⊕ Δ</tspan><tspan x="772.5" dy="13.7">Точна зміна рахунку отримувача або прапорця прав без помилки!</tspan></text>
<rect x="30.0" y="292.0" width="980.0" height="224.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="520.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сучасне вирішення: Автентифіковане шифрування ChaCha20-Poly1305 (RFC 8439)</text>
<rect x="50.0" y="335.0" width="260.0" height="68.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="352.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Блок 0 ChaCha20 (Counter = 0):</tspan><tspan x="180.0" dy="13.7">Генерація одноразового ключа</tspan><tspan x="180.0" dy="13.7">Poly1305: One-Time Key (r, s)</tspan><tspan x="180.0" dy="13.7">(32 байти з першого блоку гами)</tspan></text>
<line x1="310.0" y1="369.0" x2="360.0" y2="369.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="335.0" width="280.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Блоки 1..N ChaCha20 (Counter ≥ 1):</tspan><tspan x="500.0" dy="12.3">Шифрування корисного навантаження:</tspan><tspan x="500.0" dy="12.3">C = Plaintext ⊕ ChaCha20(K, Nonce, Counter)</tspan></text>
<line x1="640.0" y1="369.0" x2="690.0" y2="369.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="335.0" width="300.0" height="68.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="840.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Обчислення тегу Poly1305 MAC:</tspan><tspan x="840.0" dy="12.3">Tag = Poly1305(r, s, AAD || C || Lens)</tspan><tspan x="840.0" dy="12.3">16-байтний криптографічний тег автентичності</tspan></text>
<rect x="50.0" y="420.0" width="940.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Повний пакет: [ Нешифрований Nonce ] + [ Шифротекст C ] + [ 16-байтний MAC Tag ]</tspan><tspan x="520.0" dy="13.7">Приймач СПЕРШУ перевіряє Tag. Якщо хоч один біт C або AAD змінено — дешифрування НЕ ВІДБУВАЄТЬСЯ!</tspan><tspan x="520.0" dy="13.7">Повний захист від підробок (Integrity), біт-фліппінгу та витоків через неавтентифіковані дані.</tspan></text>
</svg>