<text x="460.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перехід стану: S[t+1] = f(S[t]) | Вихід гами: z[t] = g(S[t])</text>
