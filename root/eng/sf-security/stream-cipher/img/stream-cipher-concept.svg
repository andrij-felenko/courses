<rect x="50.0" y="160.0" width="160.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Одноразовий Nonce / IV</tspan><tspan x="130.0" dy="13.0">(64 / 96 бітів)</tspan></text>
