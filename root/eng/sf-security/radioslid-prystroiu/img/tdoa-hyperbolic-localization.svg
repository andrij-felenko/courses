<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="800.0" height="460.0" rx="6" fill="#fcfcfd" stroke="#6b7280" stroke-width="1.4"/>
<text x="430.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип TDoA-пеленгації: перетин різницево-часових гіпербол</text>
<circle cx="120.0" cy="160.0" r="14.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="120.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">S1</text>
<text x="120.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Станція 1 (t1)</text>
<circle cx="720.0" cy="140.0" r="14.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="720.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">S2</text>
<text x="720.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Станція 2 (t2)</text>
<circle cx="410.0" cy="410.0" r="14.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="410.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">S3</text>
<text x="410.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Станція 3 (t3)</text>
<circle cx="360.0" cy="220.0" r="10.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<text x="360.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ЦІЛЬ (Tx)</text>
<text x="360.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">Координати (x, y)</text>
<line x1="360.0" y1="220.0" x2="120.0" y2="160.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="360.0" y1="220.0" x2="720.0" y2="140.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="360.0" y1="220.0" x2="410.0" y2="410.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="230.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">d1 = c · t1</text>
<text x="545.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">d2 = c · t2</text>
<text x="410.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">d3 = c · t3</text>
<line x1="310.0" y1="80.0" x2="400.0" y2="360.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6,3"/>
<text x="300.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Гіпербола Delta_t(S2 - S1)</text>
<line x1="180.0" y1="290.0" x2="560.0" y2="160.0" stroke="#8e44ad" stroke-width="2.0" stroke-dasharray="6,3"/>
<text x="570.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">Гіпербола Delta_t(S3 - S1)</text>
<rect x="50.0" y="360.0" width="260.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="180.0" y="389.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Вимога TDoA:</tspan><tspan x="180.0" dy="11.7">• Синхронізація сенсорів: GPS / PTP (&lt;= 1 нс)</tspan><tspan x="180.0" dy="11.7">• Похибка часу 1 нс = похибка положення 30 см</tspan><tspan x="180.0" dy="11.7">• Взаємна кореляція (Cross-Correlation, GCC-PHAT)</tspan><tspan x="180.0" dy="11.7">• Мінімум 3 станції для 2D, 4 для 3D</tspan></text>
<rect x="550.0" y="360.0" width="260.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="680.0" y="389.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Математична суть:</tspan><tspan x="680.0" dy="11.7">d_i - d_j = sqrt((x - x_i)^2 + (y - y_i)^2) -</tspan><tspan x="680.0" dy="11.7">            sqrt((x - x_j)^2 + (y - y_j)^2) = c·Delta_t_ij</tspan><tspan x="680.0" dy="11.7">Розв'язок: нелінійний МНК (Gauss-Newton) або</tspan><tspan x="680.0" dy="11.7">прямий алгебраїчний метод Чана (Chan's method)</tspan></text>
</svg>