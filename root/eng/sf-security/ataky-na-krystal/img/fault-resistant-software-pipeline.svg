<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Програмна стійкість: захист логіки переходів від ін'єкції збоїв</text>
<rect x="15.0" y="60.0" width="230.0" height="390.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="130.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Багатозначні токени</text>
<rect x="25.0" y="105.0" width="210.0" height="330.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/><text x="130.0" y="247.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Відмова від 0/1:</tspan><tspan x="130.0" dy="13.0">SECURE_TRUE  = 0x55AA55AA</tspan><tspan x="130.0" dy="13.0">SECURE_FALSE = 0xAA55AA55</tspan><tspan x="130.0" dy="13.0">Дистанція Геммінґа = 32 біти.</tspan><tspan x="130.0" dy="13.0">Одиночний збій не підробить стан.</tspan></text>
<rect x="265.0" y="60.0" width="230.0" height="390.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="380.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">2. Крокові канарейки</text>
<rect x="275.0" y="105.0" width="210.0" height="330.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/><text x="380.0" y="247.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Control Flow Integrity:</tspan><tspan x="380.0" dy="13.0">Ініціалізація canary = 0x1337.</tspan><tspan x="380.0" dy="13.0">Кожен крок: canary ^= STEP_ID.</tspan><tspan x="380.0" dy="13.0">На виході: canary == FINAL_HASH.</tspan><tspan x="380.0" dy="13.0">Пропуск інструкції зламає чек.</tspan></text>
<rect x="525.0" y="60.0" width="230.0" height="390.0" rx="8" fill="#ffffff" stroke="#6b21a8" stroke-width="1.5"/>
<text x="640.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="700">3. Надлишкова верифікація</text>
<rect x="535.0" y="105.0" width="210.0" height="330.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.0"/><text x="640.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Dual/Triple Checking:</tspan><tspan x="640.0" dy="11.7">Дві незалежні функції перевірки.</tspan><tspan x="640.0" dy="11.7">Порівняння підпису з оригіналом,</tspan><tspan x="640.0" dy="11.7">потім оригіналу з підписом.</tspan><tspan x="640.0" dy="11.7">Випадкові затримки (Software Jitter).</tspan></text>
<rect x="785.0" y="60.0" width="230.0" height="390.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="900.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">4. Панічна пастка</text>
<rect x="795.0" y="105.0" width="210.0" height="330.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="900.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Fault Detection Trap:</tspan><tspan x="900.0" dy="14.3">Будь-яка невідповідність стану</tspan><tspan x="900.0" dy="14.3">веде не у гілку 'else', а в</tspan><tspan x="900.0" dy="14.3">незворотний panic_trap():</tspan><tspan x="900.0" dy="14.3">занулення ключів і HardFault.</tspan></text>
<line x1="245.0" y1="255.0" x2="265.0" y2="255.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="495.0" y1="255.0" x2="525.0" y2="255.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="755.0" y1="255.0" x2="785.0" y2="255.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="460.0" width="940.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="520.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: успішна атака вимагає одночасного точного збою в 32 бітах даних та 4 циклах програми</text>
</svg>