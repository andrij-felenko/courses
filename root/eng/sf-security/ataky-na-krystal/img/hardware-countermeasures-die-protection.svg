<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний захист кристала мікроконтролера на рівні кремнію</text>
<rect x="40.0" y="55.0" width="450.0" height="445.0" rx="8" fill="#ffffff" stroke="#6b21a8" stroke-width="1.5"/>
<text x="265.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700">Топологія захищеного кристала (Secure Die)</text>
<rect x="55.0" y="105.0" width="420.0" height="88.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.3"/><text x="265.0" y="138.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Активний захисний екран (Active Metal Shield)</tspan><tspan x="265.0" dy="14.3">Верхній шар металу M6/M7: серпантинна сітка під динамічним</tspan><tspan x="265.0" dy="14.3">псевдовипадковим сигналом PRNG (детектор обриву/КЗ зондом)</tspan></text>
<rect x="55.0" y="201.0" width="420.0" height="88.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="265.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Шар внутрішнього екранування живлення (Power Mesh)</tspan><tspan x="265.0" dy="13.0">Вбудовані розподілені розв'язувальні конденсатори (Decoupling Caps)</tspan><tspan x="265.0" dy="13.0">для згладжування імпульсів динамічного струму ядра</tspan></text>
<rect x="55.0" y="297.0" width="420.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="265.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Матриця фотодіодів та датчиків світла</tspan><tspan x="265.0" dy="14.3">Фіксація декапсуляції корпусу кислотою та імпульсів LFI-лазера.</tspan><tspan x="265.0" dy="14.3">Миттєве апаратне занулення (Zeroization) ключів</tspan></text>
<rect x="55.0" y="393.0" width="420.0" height="88.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="265.0" y="428.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Захищене процесорне ядро та криптоприскорювач</tspan><tspan x="265.0" dy="11.7">Подвійне виконання в ногу (Dual-Core Lockstep), внутрішній RC-генератор</tspan><tspan x="265.0" dy="11.7">із рандомізацією такту (Jitter), маскована логіка</tspan></text>
<rect x="510.0" y="55.0" width="490.0" height="445.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="755.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Апаратні сенсори та генератори безпеки</text>
<rect x="525.0" y="105.0" width="460.0" height="118.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="755.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Швидкодіючий аналоговий детектор збоїв (Glitch / Brown-out Detector)</text>
<rect x="535.0" y="137.0" width="440.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.8"/><text x="755.0" y="167.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">• Моніторинг швидкості спаду напруги dV/dt (компаратор із порогом &lt; 5 нс).</tspan><tspan x="755.0" dy="13.0">• Моніторинг виходу напруги за допустиме вікно (Under/Over-voltage).</tspan><tspan x="755.0" dy="13.0">• Реакція: примусовий скид (Hardware Reset) або очищення RAM.</tspan></text>
<rect x="525.0" y="233.0" width="460.0" height="118.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="755.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Внутрішній тактовий генератор із джитуванням (Clock Jittering)</text>
<rect x="535.0" y="265.0" width="440.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.8"/><text x="755.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">• Відмова від зовнішнього кварцу (неможливо перехопити такт на ніжці MCU).</tspan><tspan x="755.0" dy="11.7">• Внутрішній Ring Oscillator із випадковою модуляцією частоти (PRNG Jitter).</tspan><tspan x="755.0" dy="11.7">• Десинхронізація осцилограм для повного зриву атак DPA/CPA.</tspan></text>
<rect x="525.0" y="361.0" width="460.0" height="118.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="755.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Апаратний механізм екстреного занулення (Tamper Wipe &amp; Zeroization)</text>
<rect x="535.0" y="393.0" width="440.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="0.8"/><text x="755.0" y="424.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">• Активація за 1 такт при спрацюванні активного екрана або світлового сенсора.</tspan><tspan x="755.0" dy="11.7">• Скидання ключів шифрування в батарейній пам'яті BBRAM та регістрах.</tspan><tspan x="755.0" dy="11.7">• Блокування шин пам'яті та переходів JTAG/SWD у режим повної ізоляції.</tspan></text>
</svg>