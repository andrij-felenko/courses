<rect x="405.0" y="155.0" width="60.0" height="80.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
<text x="435.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Multiply
(біт 1)</text>
<rect x="50.0" y="290.0" width="420.0" height="205.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="260.0" y="346.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Механізм атаки:</tspan><tspan x="260.0" dy="14.3">• Різні математичні інструкції активують різні вузли АЛП.</tspan><tspan x="260.0" dy="14.3">• Множення (MUL) містить каскади суматорів і споживає</tspan><tspan x="260.0" dy="14.3">  значно більший струм, ніж піднесення до квадрата (SQR).</tspan><tspan x="260.0" dy="14.3">• Атакуючий візуально зчитує секретний ключ d:</tspan><tspan x="260.0" dy="14.3">  d = 0b0101...</tspan><tspan x="260.0" dy="14.3"></tspan><tspan x="260.0" dy="14.3">Захист: алгоритми з постійним часом (Montgomery Ladder).</tspan></text>
<rect x="510.0" y="55.0" width="500.0" height="455.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="760.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Диференційний та кореляційний аналіз (DPA/CPA)</text>
<text x="760.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Статистичне відновлення ключа через тисячі осцилограм</text>
<rect x="530.0" y="115.0" width="460.0" height="160.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="760.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель витоку: Вага Геммінґа HW(S-Box(P ⊕ k_guess))</text>
