<line x1="955.0" y1="245.0" x2="970.0" y2="238.0" stroke="#4b5563" stroke-width="1.0"/>
<line x1="720.0" y1="240.0" x2="740.0" y2="160.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="740.0" y1="160.0" x2="760.0" y2="240.0" stroke="#c0392b" stroke-width="2.2"/>
<circle cx="740.0" cy="160.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="740.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Пік кореляції: k* = 0x2B</text>
<rect x="530.0" y="290.0" width="460.0" height="205.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="760.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Механізм атаки:</tspan><tspan x="760.0" dy="14.3">1. Запис N = 10 000 осцилограм споживання при випадкових текстах P_i.</tspan><tspan x="760.0" dy="14.3">2. Обчислення гіпотетичного значення байта проміжного стану:</tspan><tspan x="760.0" dy="14.3">   V(i, k) = S-Box(P_i ⊕ k).</tspan><tspan x="760.0" dy="14.3">3. Розрахунок моделі енергоспоживання (Hamming Weight HW(V)).</tspan><tspan x="760.0" dy="14.3">4. Обчислення коефіцієнта кореляції Пірсона ρ(k) для всіх 256 ключів.</tspan><tspan x="760.0" dy="14.3">5. Для правильного k* виникає статистичний сплеск ρ &gt; 0.7.</tspan><tspan x="760.0" dy="14.3"></tspan><tspan x="760.0" dy="14.3">Захист: маскування булевими частками (Boolean Masking).</tspan></text>
</svg>