<text x="260.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Осцилограма струму I(t) під час RSA Square-and-Multiply</text>
<rect x="65.0" y="155.0" width="55.0" height="80.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="92.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Square
(біт 0)</text>
