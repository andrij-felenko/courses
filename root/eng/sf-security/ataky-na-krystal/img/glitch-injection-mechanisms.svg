<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичні механізми апаратних збоїв (Fault Injection)</text>
<rect x="25.0" y="52.0" width="310.0" height="448.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="180.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Voltage Glitching (Просідання живлення)</text>
<text x="180.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Зниження напруги Vdd на 10–50 нс</text>
<rect x="35.0" y="118.0" width="290.0" height="94.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="180.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Фізика процесу:</tspan><tspan x="180.0" dy="15.6">Зниження напруги Vdd збільшує</tspan><tspan x="180.0" dy="15.6">затримку поширення вентилів t_pd:</tspan><tspan x="180.0" dy="15.6">t_pd ~ Vdd / (Vdd - Vth)²</tspan></text>
<rect x="35.0" y="226.0" width="290.0" height="94.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="180.0" y="253.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Наслідок для логіки:</tspan><tspan x="180.0" dy="15.6">t_pd перевищує період такту T_clk.</tspan><tspan x="180.0" dy="15.6">Тригер D-типу фіксує старий</tspan><tspan x="180.0" dy="15.6">або метастабільний стан</tspan></text>
<rect x="35.0" y="334.0" width="290.0" height="94.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="180.0" y="361.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Результат для процесора:</tspan><tspan x="180.0" dy="15.6">Інструкція перевірки (CMP, BEQ)</tspan><tspan x="180.0" dy="15.6">виконується як NOP або</tspan><tspan x="180.0" dy="15.6">скидає прапорець помилки</tspan></text>
<rect x="365.0" y="52.0" width="310.0" height="448.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="520.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Clock Glitching (Тактовий збій)</text>
<text x="520.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Введення надкороткого імпульсу такту</text>
<rect x="375.0" y="118.0" width="290.0" height="94.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="520.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Фізика процесу:</tspan><tspan x="520.0" dy="15.6">Генерація імпульсу з тривалістю</tspan><tspan x="520.0" dy="15.6">t_pulse &lt; t_min_high / t_min_low</tspan><tspan x="520.0" dy="15.6">на зовнішньому тактовому вході</tspan></text>
<rect x="375.0" y="226.0" width="290.0" height="94.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="520.0" y="253.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Наслідок для логіки:</tspan><tspan x="520.0" dy="15.6">Порушення часу встановлення t_setup.</tspan><tspan x="520.0" dy="15.6">Комбінаційна логіка АЛП не встигає</tspan><tspan x="520.0" dy="15.6">завершити обчислення</tspan></text>
<rect x="375.0" y="334.0" width="290.0" height="94.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="520.0" y="361.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Результат для процесора:</tspan><tspan x="520.0" dy="15.6">Лічильник команд PC пропускає крок,</tspan><tspan x="520.0" dy="15.6">зчитується неправильний операнд,</tspan><tspan x="520.0" dy="15.6">обхід циклу автентифікації</tspan></text>
<rect x="705.0" y="52.0" width="310.0" height="448.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="860.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Laser Fault Injection (LFI)</text>
<text x="860.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Локальне опромінення кремнію лазером</text>
<rect x="715.0" y="118.0" width="290.0" height="94.0" rx="6" fill="#f5f3ff" stroke="#6b21a8" stroke-width="1.4"/><text x="860.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Фізика процесу:</tspan><tspan x="860.0" dy="15.6">ІЧ-лазер (1064 нм) крізь кремнієву</tspan><tspan x="860.0" dy="15.6">підкладку генерує пари електрон-дірка</tspan><tspan x="860.0" dy="15.6">у зворотно зміщених p-n переходах</tspan></text>
<rect x="715.0" y="226.0" width="290.0" height="94.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="860.0" y="253.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Наслідок для логіки:</tspan><tspan x="860.0" dy="15.6">Імпульс фотоструму розряджає вузол</tspan><tspan x="860.0" dy="15.6">SRAM-комірки чи тригера регістра.</tspan><tspan x="860.0" dy="15.6">Точкове перемикання біта (Bit-Flip)</tspan></text>
<rect x="715.0" y="334.0" width="290.0" height="94.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="860.0" y="361.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Результат для процесора:</tspan><tspan x="860.0" dy="15.6">Зміна значення ключа в регістрі,</tspan><tspan x="860.0" dy="15.6">примусова модифікація пам'яті OTP,</tspan><tspan x="860.0" dy="15.6">помилка підпису RSA-CRT</tspan></text>
</svg>