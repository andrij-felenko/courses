<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одностороння функція з таємним входом (Trapdoor One-Way Permutation)</text>
<rect x="45.0" y="104.6" width="170.0" height="70.8" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="130.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Відкритий текст m</tspan><tspan x="130.0" dy="16.9">(0 &lt;= m &lt; N)</tspan><tspan x="130.0" dy="16.9">m in Z_N*</tspan></text>
<rect x="665.0" y="104.6" width="170.0" height="70.8" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="750.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Шифротекст c</tspan><tspan x="750.0" dy="16.9">(0 &lt;= c &lt; N)</tspan><tspan x="750.0" dy="16.9">c in Z_N*</tspan></text>
<line x1="220.0" y1="120.0" x2="660.0" y2="120.0" stroke="#10b981" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="250.0" y="67.2" width="380.0" height="55.6" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="440.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Прямий напрямок (Шифрування): c = m^e mod N</tspan><tspan x="440.0" dy="14.3">Обчислювально легке: O(log e * log^2 N) операцій</tspan><tspan x="440.0" dy="14.3">Потрібен лише відкритий ключ (e, N)</tspan></text>
<rect x="300.0" y="180.0" width="280.0" height="80.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.0"/>
<text x="440.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">Обернення БЕЗ таємного входу</text>
<text x="440.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">Добування кореня e-го степеня mod N</text>
<text x="440.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Еквівалентно факторизації N: O(exp(c * (ln N)^1/3))</text>
<line x1="660.0" y1="220.0" x2="585.0" y2="220.0" stroke="#b91c1c" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="295.0" y1="210.0" x2="295.0" y2="230.0" stroke="#b91c1c" stroke-width="3.0"/>
<line x1="290.0" y1="215.0" x2="300.0" y2="225.0" stroke="#b91c1c" stroke-width="3.0"/>
<line x1="290.0" y1="225.0" x2="300.0" y2="215.0" stroke="#b91c1c" stroke-width="3.0"/>
<rect x="60.0" y="310.0" width="760.0" height="90.0" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="440.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="700">ТАЄМНИЙ ВХІД (Trapdoor): Знання розкладу N = p * q</text>
<text x="440.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle">Дозволяє знайти порядок групи lambda(N) = lcm(p-1, q-1) та секретну експоненту d = e^-1 mod lambda(N)</text>
<text x="440.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle" font-weight="700">Розшифрування: m = c^d mod N виконується миттєво за O(log d * log^2 N)</text>
<line x1="660.0" y1="310.0" x2="220.0" y2="310.0" stroke="#8b5cf6" stroke-width="3.0" marker-end="url(#arrow)"/>
</svg>