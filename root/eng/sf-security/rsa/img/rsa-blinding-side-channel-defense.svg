<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 905 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="905" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Криптографічне засліплення (Blinding) проти часових атак та DPA</text>
<rect x="29.9" y="79.3" width="160.2" height="41.3" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="110.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Вхідний шифротекст c</tspan><tspan x="110.0" dy="14.3">(або геш для підпису m)</tspan></text>
<rect x="30.0" y="192.2" width="160.0" height="55.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="110.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Генерація CSPRNG:</tspan><tspan x="110.0" dy="14.3">Випадковий множник r</tspan><tspan x="110.0" dy="14.3">НСД(r, N) = 1</tspan></text>
<rect x="217.5" y="130.2" width="245.1" height="59.6" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="340.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Засліплення входу:</tspan><tspan x="340.0" dy="14.3">c' = c * (r^e) mod N</tspan><tspan x="340.0" dy="14.3">(Множення на публічний ступінь r)</tspan></text>
<line x1="190.0" y1="100.0" x2="270.0" y2="140.0" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190.0" y1="220.0" x2="270.0" y2="180.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="480.0" y="80.0" width="200.0" height="230.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.0"/>
<text x="580.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#5b21b6" text-anchor="middle" font-weight="700">Приватна операція</text>
<text x="580.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle">(Піднесення до степеня d)</text>
<rect x="490.0" y="151.0" width="180.0" height="78.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="167.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Обчислення з секретом:</tspan><tspan x="580.0" dy="13.0">s' = (c')^d mod N</tspan><tspan x="580.0" dy="13.0">= (c * r^e)^d mod N</tspan><tspan x="580.0" dy="13.0">= c^d * r^(e*d) mod N</tspan><tspan x="580.0" dy="13.0">= m * r mod N</tspan></text>
<text x="580.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700">Час і струм залежать від c',
а не від секретних бітів m!</text>
<line x1="460.0" y1="160.0" x2="480.0" y2="160.0" stroke="#10b981" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="665.0" y="123.0" width="220.0" height="73.9" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="775.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Розсліплення результату:</tspan><tspan x="775.0" dy="14.3">m = s' * (r^-1) mod N</tspan><tspan x="775.0" dy="14.3">= (m * r) * r^-1 mod N</tspan><tspan x="775.0" dy="14.3">= m mod N</tspan></text>
<line x1="680.0" y1="160.0" x2="720.0" y2="160.0" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="335.0" width="800.0" height="65.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="440.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">ЧОМУ ЦЕ ПРАЦЮЄ ПРОТИ БУДЬ-ЯКИХ ЧАСОВИХ ВИТОКІВ:</text>
<text x="440.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Оскільки r генерується заново для кожного запиту, вхід c' є повністю випадковим елементом групи.</text>
<text x="440.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Атакуючий не може контролювати вхідні дані алгоритму exponentiation і не може зіставити час із бітами d.</text>
</svg>