<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерація ключів RSA та 4-кратне прискорення розшифрування через CRT</text>
<rect x="15.0" y="55.0" width="260.0" height="405.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="145.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1. Генерація p і q</text>
<rect x="27.3" y="109.3" width="235.4" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">CSPRNG (/dev/urandom)</tspan><tspan x="145.0" dy="14.3">Генерація 1024-біт випадкових чисел</tspan></text>
<rect x="30.0" y="189.3" width="230.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Відсів малих дільників</tspan><tspan x="145.0" dy="14.3">(ділення на прості до 1000)</tspan></text>
<rect x="30.0" y="279.4" width="230.0" height="41.3" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="145.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Тест Міллера - Рабіна</tspan><tspan x="145.0" dy="14.3">(40+ раундів для P(error) &lt; 2^-80)</tspan></text>
<rect x="30.0" y="374.4" width="230.0" height="41.3" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="145.0" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Отримано два простих числа:</tspan><tspan x="145.0" dy="14.3">p != q довжиною 1024 біти кожне</tspan></text>
<line x1="145.0" y1="160.0" x2="145.0" y2="180.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="145.0" y1="245.0" x2="145.0" y2="265.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="145.0" y1="335.0" x2="145.0" y2="360.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="290.0" y="55.0" width="290.0" height="405.0" rx="8" fill="#fffdf5" stroke="#d97706" stroke-width="1.5"/>
<text x="435.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700">2. Розрахунок ключів</text>
<rect x="305.0" y="104.3" width="260.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="435.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Модуль: N = p * q (2048 бітів)</tspan><tspan x="435.0" dy="14.3">Порядок: lambda(N) = lcm(p-1, q-1)</tspan></text>
<rect x="305.0" y="184.3" width="260.0" height="41.3" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="435.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Відкрита експонента: e = 65537</tspan><tspan x="435.0" dy="14.3">(F4 = 2^16 + 1, вага Хеммінга = 2)</tspan></text>
<rect x="305.0" y="257.2" width="260.0" height="55.6" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="435.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Приватна експонента: d</tspan><tspan x="435.0" dy="14.3">d = e^-1 mod lambda(N)</tspan><tspan x="435.0" dy="14.3">(розширений алгоритм Евкліда)</tspan></text>
<rect x="304.2" y="364.4" width="261.5" height="41.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="435.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">Відкритий ключ: (e, N)</tspan><tspan x="435.0" dy="14.3">Приватний ключ: (d, N) або CRT-набір</tspan></text>
<line x1="435.0" y1="155.0" x2="435.0" y2="175.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="435.0" y1="235.0" x2="435.0" y2="255.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="435.0" y1="325.0" x2="435.0" y2="355.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="595.0" y="55.0" width="290.0" height="405.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="740.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#5b21b6" text-anchor="middle" font-weight="700">3. Оптимізація CRT (~4x)</text>
<rect x="610.0" y="97.5" width="260.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Попередній розрахунок:</tspan><tspan x="740.0" dy="13.0">d_p = d mod (p-1)  [1024 біти]</tspan><tspan x="740.0" dy="13.0">d_q = d mod (q-1)  [1024 біти]</tspan><tspan x="740.0" dy="13.0">q_inv = q^-1 mod p [1024 біти]</tspan></text>
<rect x="610.0" y="202.5" width="260.0" height="65.0" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="740.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Паралельне розшифрування:</tspan><tspan x="740.0" dy="13.0">m_p = c^d_p mod p  (1024-біт)</tspan><tspan x="740.0" dy="13.0">m_q = c^d_q mod q  (1024-біт)</tspan><tspan x="740.0" dy="13.0">Складність: 2 * (k/2)^3 = k^3 / 4</tspan></text>
<rect x="610.0" y="317.5" width="260.0" height="65.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="740.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Реконструкція Гарнера:</tspan><tspan x="740.0" dy="13.0">h = (q_inv * (m_p - m_q)) mod p</tspan><tspan x="740.0" dy="13.0">m = m_q + h * q</tspan><tspan x="740.0" dy="13.0">Результат ідентичний m = c^d mod N</tspan></text>
<rect x="608.9" y="421.0" width="262.2" height="18.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="740.0" y="433.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Прискорення у ~4 рази порівняно з сирим d</tspan></text>
<line x1="740.0" y1="175.0" x2="740.0" y2="195.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="740.0" y1="280.0" x2="740.0" y2="310.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="275.0" y1="205.0" x2="290.0" y2="205.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="580.0" y1="205.0" x2="595.0" y2="205.0" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>