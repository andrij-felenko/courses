<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атака мільйона повідомлень Блейхенбахера на PKCS#1 v1.5 (Оракул заповнення)</text>
<rect x="20.0" y="60.0" width="280.0" height="375.0" rx="8" fill="#fff5f5" stroke="#ef4444" stroke-width="1.5"/>
<text x="160.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">Атакуючий (Криптоаналітик)</text>
<rect x="35.0" y="112.5" width="250.0" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Має цільовий шифротекст c</tspan><tspan x="160.0" dy="13.0">(c = m^e mod N, m невідоме)</tspan></text>
<rect x="35.0" y="181.0" width="250.0" height="48.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="160.0" y="195.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Крок 1: Підбір множника s_i</tspan><tspan x="160.0" dy="13.0">c' = c * (s_i)^e mod N</tspan><tspan x="160.0" dy="13.0">Гомоморфне зміщення: m' = m * s_i mod N</tspan></text>
<rect x="35.0" y="266.0" width="250.0" height="48.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="160.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Крок 2: Звуження інтервалів</tspan><tspan x="160.0" dy="13.0">На основі відповідей оракула</tspan><tspan x="160.0" dy="13.0">границі для m стискаються</tspan></text>
<rect x="35.0" y="361.0" width="250.0" height="48.0" rx="6" fill="#fef2f2" stroke="#991b1b" stroke-width="1.5"/><text x="160.0" y="375.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Результат (~10^6 запитів):</tspan><tspan x="160.0" dy="13.0">Інтервал звужується до одного m!</tspan><tspan x="160.0" dy="13.0">Відкритий текст m відновлено!</tspan></text>
<rect x="600.0" y="60.0" width="280.0" height="375.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="740.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">TLS-сервер (Оракул розшифрування)</text>
<rect x="615.0" y="117.5" width="250.0" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Розшифровує c':</tspan><tspan x="740.0" dy="13.0">m' = (c')^d mod N</tspan></text>
<rect x="611.5" y="186.0" width="257.1" height="48.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="740.0" y="200.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Перевірка PKCS#1 v1.5:</tspan><tspan x="740.0" dy="13.0">Чи починається m' з байтів 0x00 0x02 ?</tspan><tspan x="740.0" dy="13.0">(Тобто 2*B &lt;= m' &lt; 3*B, де B = 2^(8*(k-2)))</tspan></text>
<rect x="615.0" y="279.5" width="250.0" height="61.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="740.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Витік через побічний канал:</tspan><tspan x="740.0" dy="13.0">- Код помилки (Decryption Error)</tspan><tspan x="740.0" dy="13.0">- Або різниця в часі обробки запиту</tspan><tspan x="740.0" dy="13.0">Оракул повертає 1 біт: ТАК чи НІ</tspan></text>
<line x1="300.0" y1="195.0" x2="600.0" y2="195.0" stroke="#ef4444" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="450.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">Запит: c' = c * s_i^e mod N</text>
<line x1="600.0" y1="310.0" x2="300.0" y2="310.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">Відповідь: 0x00 0x02 валідне? (1 / 0)</text>
</svg>