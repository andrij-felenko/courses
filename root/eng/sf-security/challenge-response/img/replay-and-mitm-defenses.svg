<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="790.0" height="410.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="30.0" y="30.0" width="760.0" height="180.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від повтору (Replay Attack): Свіжість та Одноразовість виклику</text>
<rect x="45.0" y="75.0" width="170.0" height="55.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Клієнт A</tspan><tspan x="130.0" dy="14.3">(Генерує відповідь)</tspan></text>
<rect x="320.0" y="75.0" width="170.0" height="55.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="405.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">Зловмисник (Eve)</tspan><tspan x="405.0" dy="14.3">Перехоплює Resp(N1)</tspan></text>
<rect x="600.0" y="75.0" width="175.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="687.5" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="687.5" dy="0.0">Сервер B</tspan><tspan x="687.5" dy="14.3">Видає свіжий Nonce N2</tspan></text>
<line x1="215.0" y1="102.0" x2="320.0" y2="102.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490.0" y1="102.0" x2="600.0" y2="102.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="545.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="700">Повтор Resp(N1)</text>
<rect x="45.0" y="145.0" width="730.0" height="52.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="410.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Перевірка свіжості: Сервер очікує відповідь саме на N2. Стара відповідь на N1 не збігається з HMAC(K, N2).</tspan><tspan x="410.0" dy="14.2">Стан перевіряльника: кеш використаних nonce з TTL або мітка часу + підпис HMAC (Stateless Nonce token).</tspan></text>
<rect x="30.0" y="225.0" width="760.0" height="185.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="410.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від посередника (MitM / Relay): Прив'язка до каналу й контексту</text>
<rect x="45.0" y="270.0" width="165.0" height="55.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="127.5" y="294.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="127.5" dy="0.0">Легітимний клієнт</tspan><tspan x="127.5" dy="13.0">Прагне зайти на bank.ua</tspan></text>
<rect x="315.0" y="270.0" width="180.0" height="55.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="405.0" y="294.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">Фішинговий сайт (MitM)</tspan><tspan x="405.0" dy="14.3">fake-bank.ua</tspan></text>
<rect x="600.0" y="270.0" width="175.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="687.5" y="294.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="687.5" dy="0.0">Справжній банк</tspan><tspan x="687.5" dy="14.3">bank.ua (Relying Party)</tspan></text>
<line x1="210.0" y1="297.0" x2="315.0" y2="297.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="495.0" y1="297.0" x2="600.0" y2="297.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="548.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="700">Ретрансляція</text>
<rect x="45.0" y="340.0" width="730.0" height="58.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="410.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Origin Binding (WebAuthn): Браузер укладає origin = 'fake-bank.ua' в clientDataJSON. Банк відхиляє підпис.</tspan><tspan x="410.0" dy="14.2">Channel Binding (RFC 5929): Відповідь криптографічно зв'язується з хешем TLS-сертифіката сервера (tls-server-end-point).</tspan></text>
</svg>