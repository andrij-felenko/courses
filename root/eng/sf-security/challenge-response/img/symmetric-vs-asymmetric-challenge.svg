<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="385.0" height="390.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="420.0" y="15.0" width="385.0" height="390.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="207.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Симетрична схема (CHAP / Digest)</text>
<text x="612.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрична схема (SSH / TLS / FIDO2)</text>
<rect x="35.0" y="65.0" width="150.0" height="60.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Клієнт (Prover)</tspan><tspan x="110.0" dy="15.6">Спільний секрет K</tspan></text>
<rect x="230.0" y="65.0" width="150.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Сервер (Verifier)</tspan><tspan x="305.0" dy="15.6">Спільний секрет K</tspan></text>
<line x1="230.0" y1="155.0" x2="185.0" y2="155.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="207.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Challenge (nonce)</text>
<line x1="185.0" y1="205.0" x2="230.0" y2="205.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="207.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. HMAC(K, nonce)</text>
<rect x="35.0" y="240.0" width="345.0" height="145.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="207.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Вразливість сховища перевіряльника</text>
<text x="45.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="45.0" dy="0.0">• Сервер зберігає спільний ключ K (або пароль)</tspan><tspan x="45.0" dy="14.9">• Компрометація БД сервера розкриває облікові дані</tspan><tspan x="45.0" dy="14.9">• Зловмисник може клонувати клієнта й автентифікуватися</tspan><tspan x="45.0" dy="14.9">• Немає невідмовности: сервер може підробити відповідь</tspan></text>
<rect x="440.0" y="65.0" width="155.0" height="60.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="517.5" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="517.5" dy="0.0">Клієнт (Prover)</tspan><tspan x="517.5" dy="15.6">Закритий ключ sk</tspan></text>
<rect x="635.0" y="65.0" width="155.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="712.5" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.5" dy="0.0">Сервер (Verifier)</tspan><tspan x="712.5" dy="15.6">Відкритий ключ pk</tspan></text>
<line x1="635.0" y1="155.0" x2="595.0" y2="155.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="615.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. Challenge (nonce)</text>
<line x1="595.0" y1="205.0" x2="635.0" y2="205.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="615.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Sign(sk, nonce)</text>
<rect x="440.0" y="240.0" width="350.0" height="145.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="615.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ізоляція секрету на боці клієнта</text>
<text x="450.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="450.0" dy="0.0">• Сервер зберігає лише публічний ключ pk (публічні дані)</tspan><tspan x="450.0" dy="14.9">• Злам сервера НЕ дає зловмиснику змоги увійти за клієнта</tspan><tspan x="450.0" dy="14.9">• Закритий ключ sk захищений у Secure Enclave / TPM</tspan><tspan x="450.0" dy="14.9">• Невідмовність: лише клієнт міг створити цифровий підпис</tspan></text>
</svg>