<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="790.0" height="400.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="45.0" y="35.0" width="230.0" height="65.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="64.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Доводжувач (Alice / Prover)</tspan><tspan x="160.0" dy="14.3">Секрет: x, Публічний: Y = g^x</tspan></text>
<rect x="545.0" y="35.0" width="230.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="64.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Перевіряльник (Bob / Verifier)</tspan><tspan x="660.0" dy="14.3">Знає лише відкритий ключ Y</tspan></text>
<line x1="160.0" y1="105.0" x2="160.0" y2="395.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="660.0" y1="105.0" x2="660.0" y2="395.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="45.0" y="120.0" width="230.0" height="48.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="160.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Обирає випадковий v ∈ Zq</text>
<text x="160.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Обчислює R = g^v mod p</text>
<line x1="275.0" y1="150.0" x2="545.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Зобов'язання (Commitment) R</text>
<rect x="545.0" y="195.0" width="230.0" height="48.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="660.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Генерує випадковий виклик</text>
<text x="660.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">c ∈ {0, ..., 2^t - 1}</text>
<line x1="545.0" y1="225.0" x2="275.0" y2="225.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Виклик (Challenge) c</text>
<rect x="45.0" y="270.0" width="230.0" height="48.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="160.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Маскує секрет x викликом c:</text>
<text x="160.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">s = v + c·x mod q</text>
<line x1="275.0" y1="300.0" x2="545.0" y2="300.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">3. Відповідь (Response) s</text>
<rect x="545.0" y="340.0" width="230.0" height="55.0" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="660.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Перевірка рівності в групі:</text>
<text x="660.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">g^s ≡ R · Y^c (mod p)</text>
<rect x="290.0" y="340.0" width="240.0" height="55.0" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.0"/>
<text x="410.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">Zero-Knowledge інваріант:</text>
<text x="410.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Секрет x надійно схований за v</text>
</svg>