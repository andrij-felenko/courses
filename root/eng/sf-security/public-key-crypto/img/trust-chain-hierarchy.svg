<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія PKI та перевірка ланцюга довіри (Trust Chain)</text>
<rect x="40.0" y="55.0" width="460.0" height="125.0" rx="8" fill="#f4eefb" stroke="#d7c0ee" stroke-width="1.5"/>
<text x="270.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Кореневий центр (Root CA)</text>
<text x="270.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="270.0" dy="0.0">Subject: DigiCert Global Root G2</tspan><tspan x="270.0" dy="12.5">Issuer: DigiCert Global Root G2 (Самопідписаний)</tspan><tspan x="270.0" dy="12.5">BasicConstraints: CA=TRUE (без обмеження довжини)</tspan></text>
<text x="270.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Відкритий ключ: Root_PK (зашитий у сховище довіри ОС)</text>
<rect x="580.0" y="55.0" width="460.0" height="125.0" rx="8" fill="#eaf7ee" stroke="#a8e0b6" stroke-width="1.5"/>
<text x="810.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Локальне сховище довіри клієнта (Trust Store)</text>
<text x="810.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Операційна система / Браузер містить ~150 кореневих ключів.</tspan><tspan x="810.0" dy="13.0">Клієнт безумовно довіряє Root_PK, якщо його відбиток (геш)</tspan><tspan x="810.0" dy="13.0">байт-у-байт збігається із записом у сховищі.</tspan></text>
<line x1="580.0" y1="118.0" x2="500.0" y2="118.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="495.9" y="80.0" width="88.2" height="30.0" rx="6" fill="#eaf7ee" stroke="#a8e0b6" stroke-width="1.5"/><text x="540.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Якір довіри</tspan></text>
<line x1="270.0" y1="180.0" x2="270.0" y2="220.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Підписано таємним ключем Root_SK</text>
<rect x="40.0" y="220.0" width="460.0" height="125.0" rx="8" fill="#eef4fb" stroke="#b8d2ee" stroke-width="1.5"/>
<text x="270.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Проміжний центр (Intermediate CA)</text>
<text x="270.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="270.0" dy="0.0">Subject: DigiCert TLS RSA SHA256 2020 CA1</tspan><tspan x="270.0" dy="12.5">Issuer: DigiCert Global Root G2</tspan><tspan x="270.0" dy="12.5">BasicConstraints: CA=TRUE, pathLenConstraint=0</tspan></text>
<text x="270.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Відкритий ключ: Interm_PK (перевіряється через Root_PK)</text>
<rect x="580.0" y="220.0" width="460.0" height="125.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="810.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навіщо потрібен проміжний рівень:</text>
<text x="810.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="810.0" dy="0.0">Кореневий ключ Root_SK лежить в офлайн-сейфі (Cold Storage).</tspan><tspan x="810.0" dy="13.0">Щоденну масову видачу сертифікатів ведуть проміжні центри.</tspan><tspan x="810.0" dy="13.0">У разі компрометації відкликається лише Intermediate CA,</tspan><tspan x="810.0" dy="13.0">а не глобальний якір довіри всієї операційної системи.</tspan></text>
<line x1="270.0" y1="345.0" x2="270.0" y2="385.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="405.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Підписано таємним ключем Interm_SK</text>
<rect x="40.0" y="385.0" width="460.0" height="115.0" rx="8" fill="#fdf3e6" stroke="#f0d5b0" stroke-width="1.5"/>
<text x="270.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. Кінцевий сертифікат сервера (Leaf / End-Entity)</text>
<text x="270.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="270.0" dy="0.0">Subject: CN=api.service.gov.ua, SAN=api.service.gov.ua</tspan><tspan x="270.0" dy="12.5">Issuer: DigiCert TLS RSA SHA256 2020 CA1</tspan><tspan x="270.0" dy="12.5">BasicConstraints: CA=FALSE (кінцевий вузол)</tspan></text>
<text x="270.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Відкритий ключ: Server_PK (використовується в TLS)</text>
<rect x="580.0" y="385.0" width="460.0" height="115.0" rx="8" fill="#eaf7ee" stroke="#a8e0b6" stroke-width="1.5"/>
<text x="810.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат верифікації клієнтом:</text>
<text x="810.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">1. Домен у запиті збігається із розширенням SAN сертифіката.</tspan><tspan x="810.0" dy="13.0">2. Поточний час перебуває у межах [NotBefore, NotAfter].</tspan><tspan x="810.0" dy="13.0">3. Математичний ланцюг підписів перевірено крок за кроком.</tspan><tspan x="810.0" dy="13.0">4. Вершину ланцюга знайдено у локальному сховищі довіри.</tspan></text>
</svg>