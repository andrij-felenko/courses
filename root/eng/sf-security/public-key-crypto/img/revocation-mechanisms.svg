<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння механізмів відкликання: CRL, OCSP та OCSP Stapling</text>
<rect x="45.0" y="55.0" width="335.0" height="445.0" rx="8" fill="#fdecea" stroke="#f3b8b2" stroke-width="1.5"/>
<text x="212.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. CRL (Списки відкликання)</text>
<text x="212.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">RFC 5280: Періодичні чорні списки</text>
<rect x="89.6" y="130.2" width="245.7" height="59.6" rx="6" fill="#ffffff" stroke="#f3b8b2" stroke-width="1.5"/><text x="212.5" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Клієнт завантажує повний файл</tspan><tspan x="212.5" dy="14.3">з номерами всіх відкликаних</tspan><tspan x="212.5" dy="14.3">сертифікатів засвідчувального центру</tspan></text>
<text x="60.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Властивості та недоліки:</text>
<text x="60.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">• Розмір файлу: від сотень КБ до десятків МБ</tspan><tspan x="60.0" dy="13.5">• Період оновлення: 24–72 години</tspan><tspan x="60.0" dy="13.5">• Затримка виявлення: якщо ключ вкрадено</tspan><tspan x="60.0" dy="13.5">  сьогодні, у CRL він з'явиться лише завтра</tspan><tspan x="60.0" dy="13.5">• Величезний мережевий трафік на мобільних</tspan></text>
<rect x="60.0" y="385.0" width="305.0" height="85.0" rx="4" fill="#ffffff" stroke="#f3b8b2" stroke-width="1.5"/>
<text x="212.5" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Оцінка: Застарілий підхід</text>
<text x="212.5" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Створює трафіковий колапс при масштабуванні</text>
<rect x="402.0" y="55.0" width="335.0" height="445.0" rx="8" fill="#fdf3e6" stroke="#f0d5b0" stroke-width="1.5"/>
<text x="569.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. OCSP (Онлайн-запит)</text>
<text x="569.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">RFC 6960: Точковий HTTP-запит</text>
<rect x="431.0" y="130.2" width="277.1" height="59.6" rx="6" fill="#ffffff" stroke="#f0d5b0" stroke-width="1.5"/><text x="569.5" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="569.5" dy="0.0">Клієнт надсилає запит до OCSP Responder:</tspan><tspan x="569.5" dy="14.3">«Чи чинний сертифікат № 4A9F?»</tspan><tspan x="569.5" dy="14.3">Отримує підписану відповідь: Good/Revoked</tspan></text>
<text x="417.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Властивості та недоліки:</text>
<text x="417.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="417.0" dy="0.0">• Компактний обмін даними (кілька сотень байтів)</tspan><tspan x="417.0" dy="13.5">• Актуальність перевірки в реальному часі</tspan><tspan x="417.0" dy="13.5">• Затримка з'єднання: +1 додатковий RTT до CA</tspan><tspan x="417.0" dy="13.5">• Витік приватності: центр бачить IP-адресу</tspan><tspan x="417.0" dy="13.5">  користувача і всі сайти, які той відкриває!</tspan><tspan x="417.0" dy="13.5">• Збій резолвера: блокує або засліплює перевірку</tspan></text>
<rect x="417.0" y="385.0" width="305.0" height="85.0" rx="4" fill="#ffffff" stroke="#f0d5b0" stroke-width="1.5"/>
<text x="569.5" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Оцінка: Проблема приватності</text>
<text x="569.5" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зливає історію вебперегляду сторонньому серверу</text>
<rect x="760.0" y="55.0" width="335.0" height="445.0" rx="8" fill="#eaf7ee" stroke="#a8e0b6" stroke-width="1.5"/>
<text x="927.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. OCSP Stapling (Пришивання)</text>
<text x="927.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">RFC 6066 / TLS CertificateStatus</text>
<rect x="779.6" y="130.2" width="295.9" height="59.6" rx="6" fill="#ffffff" stroke="#a8e0b6" stroke-width="1.5"/><text x="927.5" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="927.5" dy="0.0">Сервер сам періодично опитує OCSP Responder,</tspan><tspan x="927.5" dy="14.3">кешує підписаний CA статус і прикріплює його</tspan><tspan x="927.5" dy="14.3">безпосередньо у TLS Handshake клієнту</tspan></text>
<text x="775.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Властивості та переваги:</text>
<text x="775.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="775.0" dy="0.0">• 0 додаткових мережевих запитів для клієнта</tspan><tspan x="775.0" dy="13.5">• 0 витоку приватності: CA не бачить користувача</tspan><tspan x="775.0" dy="13.5">• Підпис CA унеможливлює підробку сервером</tspan><tspan x="775.0" dy="13.5">• Захист від відкату часу через позначки часу</tspan><tspan x="775.0" dy="13.5">• Розширення Must-Staple блокує спроби обходу</tspan></text>
<rect x="775.0" y="385.0" width="305.0" height="85.0" rx="4" fill="#ffffff" stroke="#a8e0b6" stroke-width="1.5"/>
<text x="927.5" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Оцінка: Сучасний золотий стандарт</text>
<text x="927.5" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Максимальна швидкість, приватність і безпека</text>
</svg>