<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура цифрового сертифіката X.509 v3 (RFC 5280)</text>
<rect x="40.0" y="50.0" width="980.0" height="505.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="2.0"/>
<text x="180.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Certificate (ASN.1 SEQUENCE)</text>
<rect x="65.0" y="95.0" width="930.0" height="345.0" rx="6" fill="#eef4fb" stroke="#b8d2ee" stroke-width="1.5"/>
<text x="240.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. TBSCertificate (Тіло даних, що підписуються)</text>
<rect x="166.1" y="132.5" width="67.7" height="31.0" rx="6" fill="#ffffff" stroke="#b8d2ee" stroke-width="1.5"/><text x="200.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Version</tspan></text>
<text x="295.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">v3 (значення 0x02) — відкриває підтримку розширень</text>
<rect x="149.1" y="158.5" width="101.8" height="31.0" rx="6" fill="#ffffff" stroke="#b8d2ee" stroke-width="1.5"/><text x="200.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">SerialNumber</tspan></text>
<text x="295.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Унікальний цілочисельний номер у межах видавця (до 20 байтів)</text>
<rect x="128.6" y="184.5" width="142.8" height="31.0" rx="6" fill="#ffffff" stroke="#b8d2ee" stroke-width="1.5"/><text x="200.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">SignatureAlgorithm</tspan></text>
<text x="295.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Ідентифікатор алгоритму підпису (наприклад, ecdsa-with-SHA256 OID)</text>
<rect x="159.3" y="210.5" width="81.4" height="31.0" rx="6" fill="#ffffff" stroke="#b8d2ee" stroke-width="1.5"/><text x="200.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Issuer DN</tspan></text>
<text x="295.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Відмітне ім'я засвідчувального центру (C=UA, O=National CA, CN=Root CA)</text>
<rect x="162.7" y="236.5" width="74.6" height="31.0" rx="6" fill="#ffffff" stroke="#b8d2ee" stroke-width="1.5"/><text x="200.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Validity</tspan></text>
<text x="295.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Часове вікно чинності: [NotBefore: UTCtime, NotAfter: UTCtime]</text>
<rect x="155.9" y="262.5" width="88.2" height="31.0" rx="6" fill="#ffffff" stroke="#b8d2ee" stroke-width="1.5"/><text x="200.0" y="281.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Subject DN</tspan></text>
<text x="295.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Відмітне ім'я власника сертифіката (CN=api.service.gov.ua)</text>
<rect x="121.8" y="288.5" width="156.4" height="31.0" rx="6" fill="#ffffff" stroke="#b8d2ee" stroke-width="1.5"/><text x="200.0" y="307.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">SubjectPublicKeyInfo</tspan></text>
<text x="295.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Відкритий ключ власника + алгоритм (OID id-ecPublicKey, крива secp256r1)</text>
<rect x="85.0" y="335.0" width="890.0" height="92.0" rx="4" fill="#ffffff" stroke="#b8d2ee" stroke-width="1.5"/>
<text x="165.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Extensions [v3]:</text>
<text x="105.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Basic Constraints:</text>
<text x="275.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">CA: FALSE, pathLen: none (визначає, чи може бути центром видачі)</text>
<text x="105.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Key Usage:</text>
<text x="275.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">digitalSignature, keyEncipherment (критичні прапорці дозволених операцій)</text>
<text x="105.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Subject Alt Name (SAN):</text>
<text x="275.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">DNS:api.service.gov.ua, DNS:service.gov.ua (дійсні доменні імена)</text>
<text x="105.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• AIA / CRL Distribution:</text>
<text x="275.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">URI для перевірки статусу: OCSP Responder URL + CRL HTTP URL</text>
<rect x="65.0" y="455.0" width="930.0" height="85.0" rx="6" fill="#fdecea" stroke="#f3b8b2" stroke-width="1.5"/>
<text x="220.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. SignatureAlgorithm &amp; SignatureValue</text>
<rect x="104.0" y="494.5" width="252.0" height="31.0" rx="6" fill="#ffffff" stroke="#f3b8b2" stroke-width="1.5"/><text x="230.0" y="513.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">SignatureAlgorithm: ecdsa-with-SHA256</tspan></text>
<rect x="472.2" y="487.4" width="415.6" height="45.3" rx="6" fill="#ffffff" stroke="#f3b8b2" stroke-width="1.5"/><text x="680.0" y="506.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">SignatureValue: BIT STRING (криптографічний підпис видавця</tspan><tspan x="680.0" dy="14.3">над бінарним ASN.1 DER представленням TBSCertificate)</tspan></text>
</svg>