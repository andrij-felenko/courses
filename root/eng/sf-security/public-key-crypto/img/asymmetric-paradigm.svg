<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1035 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1035" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрична модель: розділення повноважень шифрування та підпису</text>
<rect x="40.0" y="65.0" width="420.0" height="380.0" rx="8" fill="#eef4fb" stroke="#b8d2ee" stroke-width="1.5"/>
<text x="250.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Власник ключів (Аліса)</text>
<rect x="96.4" y="126.2" width="307.3" height="47.6" rx="6" fill="#ffffff" stroke="#b8d2ee" stroke-width="1.5"/><text x="250.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Генератор пари ключів</tspan><tspan x="250.0" dy="15.6">Одностороння функція з секретом (Trapdoor)</tspan></text>
<line x1="250.0" y1="185.0" x2="140.0" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="250.0" y1="185.0" x2="360.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="44.8" y="223.8" width="190.5" height="102.5" rx="6" fill="#fdecea" stroke="#f3b8b2" stroke-width="1.5"/><text x="140.0" y="243.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Таємний ключ (sk)</tspan><tspan x="140.0" dy="14.3">Зберігається в таємниці</tspan><tspan x="140.0" dy="14.3">(HSM, TPM, закритий файл)</tspan><tspan x="140.0" dy="14.3"></tspan><tspan x="140.0" dy="14.3">• Розшифрування</tspan><tspan x="140.0" dy="14.3">• Створення підпису</tspan></text>
<rect x="261.3" y="223.8" width="197.3" height="102.5" rx="6" fill="#eaf7ee" stroke="#a8e0b6" stroke-width="1.5"/><text x="360.0" y="243.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Відкритий ключ (pk)</tspan><tspan x="360.0" dy="14.3">Публікується відкрито</tspan><tspan x="360.0" dy="14.3">(DNS, сертифікат, каталог)</tspan><tspan x="360.0" dy="14.3"></tspan><tspan x="360.0" dy="14.3">• Зашифрування</tspan><tspan x="360.0" dy="14.3">• Перевірка підпису</tspan></text>
<text x="250.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Математичний капкан: sk → pk обчислюється легко,
але pk → sk обчислювально неможливо</text>
<rect x="520.0" y="65.0" width="440.0" height="380.0" rx="8" fill="#fdf3e6" stroke="#f0d5b0" stroke-width="1.5"/>
<text x="740.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Відкритий зв'язок (Боб і Мережа)</text>
<rect x="529.4" y="123.0" width="421.3" height="73.9" rx="6" fill="#ffffff" stroke="#f0d5b0" stroke-width="1.5"/><text x="740.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Операція 1: Конфіденційність (Шифрування)</tspan><tspan x="740.0" dy="14.3">Боб бере відкритий ключ Аліси pk:</tspan><tspan x="740.0" dy="14.3">Шифротекст = Encrypt(pk, Повідомлення)</tspan><tspan x="740.0" dy="14.3">Лише Аліса може розкрити: Повідомлення = Decrypt(sk, Шифротекст)</tspan></text>
<rect x="548.2" y="243.1" width="383.7" height="73.9" rx="6" fill="#ffffff" stroke="#f0d5b0" stroke-width="1.5"/><text x="740.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Операція 2: Автентичність (Цифровий підпис)</tspan><tspan x="740.0" dy="14.3">Аліса підписує своїм таємним ключем sk:</tspan><tspan x="740.0" dy="14.3">Підпис = Sign(sk, Геш_Повідомлення)</tspan><tspan x="740.0" dy="14.3">Будь-хто перевіряє через pk: Verify(pk, Геш, Підпис) == OK</tspan></text>
<text x="740.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Передавання через незахищений канал: відсутня потреба
попередньо узгоджувати спільний таємний пароль</text>
</svg>