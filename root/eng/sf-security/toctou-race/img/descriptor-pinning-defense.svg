<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="30.0" width="380.0" height="280.0" rx="8" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="220.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпечно: шлях між викликами</text>
<rect x="121.0" y="95.0" width="198.1" height="20.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. stat(&quot;/tmp/dir/file.txt&quot;, &amp;st)</tspan></text>
<rect x="140.9" y="148.5" width="158.2" height="33.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Вікно гонки: підміна шляху</tspan><tspan x="220.0" dy="13.0">(unlink, rename, symlink)</tspan></text>
<rect x="112.4" y="220.0" width="215.2" height="20.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">2. open(&quot;/tmp/dir/file.txt&quot;, O_RDWR)</tspan></text>
<line x1="220.0" y1="125.0" x2="220.0" y2="142.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220.0" y1="190.0" x2="220.0" y2="208.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450.0" y="30.0" width="380.0" height="280.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="640.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечно: дескрипторна фіксація</text>
<rect x="535.2" y="88.5" width="209.5" height="33.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">1. fd = openat(dirfd, &quot;file&quot;,</tspan><tspan x="640.0" dy="13.0">   O_RDWR | O_NOFOLLOW | O_CLOEXEC)</tspan></text>
<rect x="509.6" y="148.5" width="260.8" height="33.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Дескриптор прив'язано до struct file / inode</tspan><tspan x="640.0" dy="13.0">Зміни імен у каталозі більше не діють</tspan></text>
<rect x="523.9" y="213.5" width="232.3" height="33.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">2. fstat(fd, &amp;st) + перевірка типу</tspan><tspan x="640.0" dy="13.0">   та прав на зафіксованому дескрипторі</tspan></text>
<line x1="640.0" y1="128.0" x2="640.0" y2="145.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
