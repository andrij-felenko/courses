<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доказово стійка хеш-функція CHP</text>
<text x="390.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доказово стійка хеш-функція Чаума — ван Гейста — Пфітцманна (CHP)</text>
<rect x="60.0" y="55.0" width="200.0" height="40.0" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
<text x="160.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1b4f72" text-anchor="middle" font-weight="700">Вхідні блоки: (x₁, x₂) ∈ ℤ_q × ℤ_q</text>
<rect x="310.0" y="55.0" width="200.0" height="40.0" rx="6" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.5"/>
<text x="410.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7d6608" text-anchor="middle" font-weight="700">Генератори: g, h ∈ ℤ_p*</text>
<line x1="160.0" y1="95.0" x2="160.0" y2="125.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="410.0" y1="95.0" x2="410.0" y2="125.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="134.5" width="180.0" height="31.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">A = g^{x₁} mod p</tspan></text>
<rect x="320.0" y="134.5" width="180.0" height="31.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="410.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">B = h^{x₂} mod p</tspan></text>
<line x1="250.0" y1="150.0" x2="295.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="410.0" y1="175.0" x2="410.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="160.0" y1="175.0" x2="330.0" y2="215.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="219.3" y="204.5" width="381.5" height="31.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">CHP(x₁, x₂) = (A · B) mod p = (g^{x₁} · h^{x₂}) mod p</tspan></text>
<rect x="550.0" y="55.0" width="200.0" height="115.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/>
<text x="650.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Зв'язок зі складністю:</text>
<text x="650.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Знайти колізію ≡</text>
<text x="650.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">обчислити дискретний</text>
<text x="650.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">логарифм  a = log_g h</text>
</svg>