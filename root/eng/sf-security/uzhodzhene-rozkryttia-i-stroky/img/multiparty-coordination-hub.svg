<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багатостороння координація вразливостей MPCVD</text>
<rect x="20.0" y="15.0" width="800.0" height="40.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="420.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель багатосторонньої координації вразливостей (MPCVD Hub)</text>
<rect x="30.0" y="80.0" width="170.0" height="160.0" rx="6" fill="#f0f4f8" stroke="#2457d6" stroke-width="1.6"/>
<text x="115.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Дослідник безпеки</text>
<text x="115.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Security Researcher)</text>
<text x="115.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Пошук вразливості</text>
<text x="115.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Створення PoC</text>
<text x="115.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Первинний звіт</text>
<text x="115.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• Згода на ембарго</text>
<rect x="240.0" y="70.0" width="240.0" height="185.0" rx="8" fill="#f0faf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="360.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Координаційний центр</text>
<text x="360.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(CERT/CC / CISA / CERT-UA)</text>
<text x="360.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. Верифікація та скоринг CVSS</text>
<text x="360.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">2. Резервування CVE ID (CNA)</text>
<text x="360.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">3. Синхронізація дати ембарго</text>
<text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">4. Розподіл закритої інформації</text>
<text x="360.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">5. Моніторинг активних витоків</text>
<rect x="520.0" y="68.0" width="290.0" height="88.0" rx="6" fill="#fdfbf0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="665.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Upstream розробник (Linux / OpenSSL)</text>
<text x="665.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Розробка та перевірка виправлення</text>
<text x="665.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Закрите тестування в приватних гілках</text>
<rect x="520.0" y="168.0" width="290.0" height="102.0" rx="6" fill="#fef6f0" stroke="#c0392b" stroke-width="1.5"/>
<text x="665.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Downstream партнери (Tier 1/2)</text>
<text x="665.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Хмарні провайдери (AWS, Azure, GCP)</text>
<text x="665.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Дистрибутиви ОС (Debian, RHEL, Ubuntu)</text>
<text x="665.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Патчинг інфраструктури до зняття ембарго</text>
<line x1="200.0" y1="160.0" x2="235.0" y2="160.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="218.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Звіт</text>
<line x1="480.0" y1="112.0" x2="515.0" y2="112.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="515.0" y1="128.0" x2="480.0" y2="128.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="480.0" y1="215.0" x2="515.0" y2="215.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="140.0" y="290.0" width="560.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="420.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Синхронний публічний реліз (Coordinated Public Release)</text>
<text x="420.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Одночасна публікація CVE, Security Advisory, оновлень пакунків та PoC аналізу</text>
<line x1="360.0" y1="258.0" x2="360.0" y2="285.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
