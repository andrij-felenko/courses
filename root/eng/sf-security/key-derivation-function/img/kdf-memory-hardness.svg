<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція KDF для паролів та захист від апаратного перебору</text>
<rect x="15.0" y="15.0" width="830.0" height="390.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<text x="430.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція KDF для паролів: механізми стримування GPU та ASIC</text>
<rect x="30.0" y="65.0" width="190.0" height="320.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="125.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">PBKDF2 (2000)</text>
<text x="125.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ітерації CPU</text>
<rect x="42.5" y="132.0" width="165.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="125.0" y="150.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Пам'ять: 0 байтів</tspan><tspan x="125.0" dy="13.0">(Лише стан HMAC)</tspan><tspan x="125.0" dy="13.0">Обчислення: CPU-bound</tspan></text>
<rect x="42.5" y="206.7" width="165.0" height="66.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="125.0" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="125.0" dy="0.0">Атака (ASIC / GPU):</tspan><tspan x="125.0" dy="12.3">Масивний паралелізм.</tspan><tspan x="125.0" dy="12.3">Мільярди спроб/с.</tspan><tspan x="125.0" dy="12.3">Конвеєр без затримок.</tspan></text>
<rect x="42.5" y="313.5" width="165.0" height="43.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.4"/><text x="125.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">Статус: Застарілий</tspan><tspan x="125.0" dy="13.0">(Не захищає від ASIC)</tspan></text>
<rect x="235.0" y="65.0" width="190.0" height="320.0" rx="6" fill="#fdfbf0" stroke="#d97706" stroke-width="1.5"/>
<text x="330.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">bcrypt (1999)</text>
<text x="330.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Таблиці Blowfish</text>
<rect x="247.5" y="132.0" width="165.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="330.0" y="150.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Пам'ять: 4 КБ RAM</tspan><tspan x="330.0" dy="13.0">(S-блоки Blowfish)</tspan><tspan x="330.0" dy="13.0">Випадкові читання</tspan></text>
<rect x="247.5" y="206.7" width="165.0" height="66.6" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/><text x="330.0" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle"><tspan x="330.0" dy="0.0">Атака (ASIC / GPU):</tspan><tspan x="330.0" dy="12.3">4 КБ у L1 кеш або</tspan><tspan x="330.0" dy="12.3">FPGA блочну пам'ять.</tspan><tspan x="330.0" dy="12.3">GPU стають ефективнішими.</tspan></text>
<rect x="245.6" y="313.5" width="168.8" height="43.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="330.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Статус: Прийнятний</tspan><tspan x="330.0" dy="13.0">(Але має ліміт 72 байти)</tspan></text>
<rect x="440.0" y="65.0" width="190.0" height="320.0" rx="6" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="535.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">scrypt (2009)</text>
<text x="535.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ROMix (RAM-hard)</text>
<rect x="452.5" y="132.0" width="165.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="535.0" y="150.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">Пам'ять: 16-128 МБ RAM</tspan><tspan x="535.0" dy="13.0">(Великий буфер V)</tspan><tspan x="535.0" dy="13.0">Псевдовипадкове читання</tspan></text>
<rect x="452.5" y="206.7" width="165.0" height="66.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="535.0" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle"><tspan x="535.0" dy="0.0">Атака (ASIC / GPU):</tspan><tspan x="535.0" dy="12.3">Вимагає багато RAM.</tspan><tspan x="535.0" dy="12.3">Data-dependent доступ</tspan><tspan x="535.0" dy="12.3">дозволяє компроміс TMTO.</tspan></text>
<rect x="452.5" y="313.5" width="165.0" height="43.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.4"/><text x="535.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="535.0" dy="0.0">Статус: Стійкий</tspan><tspan x="535.0" dy="13.0">(Висока вартість атак)</tspan></text>
<rect x="645.0" y="65.0" width="190.0" height="320.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="740.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Argon2id (2015)</text>
<text x="740.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Переможець PHC</text>
<rect x="657.5" y="132.0" width="165.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="740.0" y="150.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Пам'ять: 64-1024 МБ RAM</tspan><tspan x="740.0" dy="13.0">Матриця блоків Blake2b</tspan><tspan x="740.0" dy="13.0">Багатопотоковість</tspan></text>
<rect x="654.2" y="200.6" width="171.6" height="78.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="740.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="740.0" dy="0.0">Захист:</tspan><tspan x="740.0" dy="12.3">• Data-indep 1-й прохід</tspan><tspan x="740.0" dy="12.3">(проти side-channel витоків)</tspan><tspan x="740.0" dy="12.3">• Data-dep решта фаз</tspan><tspan x="740.0" dy="12.3">(проти GPU/ASIC і TMTO)</tspan></text>
