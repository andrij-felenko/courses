<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парадигма Extract-then-Expand у HKDF (RFC 5869)</text>
<rect x="15.0" y="15.0" width="850.0" height="450.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<rect x="30.0" y="30.0" width="820.0" height="160.0" rx="6" fill="#f0f4f8" stroke="#2457d6" stroke-width="1.5"/>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ФАЗА 1: HKDF-Extract (Вилучення рівномірної ентропії)</text>
<rect x="50.0" y="67.0" width="160.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="130.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">IKM (Вхідний секрет)</tspan><tspan x="130.0" dy="13.0">Нерівномірна ентропія</tspan><tspan x="130.0" dy="13.0">(ECDH спільна точка)</tspan></text>
<rect x="50.0" y="127.0" width="160.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="130.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Salt (Випадкова сіль)</tspan><tspan x="130.0" dy="13.0">Опціональна (CSPRNG)</tspan><tspan x="130.0" dy="13.0">Або нулі за замовчанням</tspan></text>
<line x1="215.0" y1="95.0" x2="295.0" y2="115.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="215.0" y1="155.0" x2="295.0" y2="135.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="292.5" y="95.2" width="245.1" height="59.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="415.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">HMAC-Hash(Key = Salt, Data = IKM)</tspan><tspan x="415.0" dy="14.3">Витягує непередбачуваність</tspan><tspan x="415.0" dy="14.3">Leftover Hash Lemma</tspan></text>
<line x1="535.0" y1="125.0" x2="615.0" y2="125.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="627.5" y="95.2" width="195.0" height="59.6" rx="6" fill="#eefaf0" stroke="#27ae60" stroke-width="1.8"/><text x="725.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">PRK (Pseudorandom Key)</tspan><tspan x="725.0" dy="14.3">Фіксована довжина HashLen</tspan><tspan x="725.0" dy="14.3">Рівномірний розподіл</tspan></text>
<line x1="725.0" y1="160.0" x2="725.0" y2="210.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="210.0" width="820.0" height="240.0" rx="6" fill="#fdfdfd" stroke="#27ae60" stroke-width="1.5"/>
<text x="440.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ФАЗА 2: HKDF-Expand (Розгортання у робочі підключі потрібної довжини)</text>
<rect x="50.0" y="262.0" width="160.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="130.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">info (Контекстний рядок)</tspan><tspan x="130.0" dy="13.0">&quot;tls13 client write key&quot;</tspan><tspan x="130.0" dy="13.0">Розділення доменів</tspan></text>
<rect x="45.9" y="337.0" width="168.2" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="130.0" y="355.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">L (Бажана довжина OKM)</tspan><tspan x="130.0" dy="13.0">Кількість потрібних байтів</tspan><tspan x="130.0" dy="13.0">L ≤ 255 · HashLen</tspan></text>
<rect x="265.9" y="282.0" width="128.3" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="330.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Блок T(1)</tspan><tspan x="330.0" dy="13.0">HMAC(PRK,</tspan><tspan x="330.0" dy="13.0">&quot;&quot; || info || 0x01)</tspan></text>
<rect x="400.1" y="282.0" width="139.7" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="470.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Блок T(2)</tspan><tspan x="470.0" dy="13.0">HMAC(PRK,</tspan><tspan x="470.0" dy="13.0">T(1) || info || 0x02)</tspan></text>
<rect x="525.9" y="282.0" width="168.2" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="610.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Блок T(N)</tspan><tspan x="610.0" dy="13.0">HMAC(PRK,</tspan><tspan x="610.0" dy="13.0">T(N-1) || info || byte(N))</tspan></text>
<line x1="395.0" y1="310.0" x2="405.0" y2="310.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="535.0" y1="310.0" x2="545.0" y2="310.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="725.0" y1="210.0" x2="680.0" y2="275.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="215.0" y1="290.0" x2="265.0" y2="310.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="330.0" y1="345.0" x2="330.0" y2="395.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470.0" y1="345.0" x2="470.0" y2="395.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="610.0" y1="345.0" x2="610.0" y2="395.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="207.7" y="392.4" width="524.7" height="45.3" rx="6" fill="#eefaf0" stroke="#27ae60" stroke-width="1.8"/><text x="470.0" y="411.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">OKM = Перші L байтів від ( T(1) || T(2) || ... || T(N) )</tspan><tspan x="470.0" dy="14.3">Ізольовані підключі: K_cipher (AES/ChaCha) + K_mac (Poly1305) + IV (Nonce)</tspan></text>
</svg>