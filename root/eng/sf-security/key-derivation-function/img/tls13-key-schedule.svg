<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг виведення секретів у TLS 1.3</text>
<rect x="15.0" y="15.0" width="830.0" height="430.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<text x="430.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг виведення секретів і сесійних ключів у TLS 1.3 (RFC 8446)</text>
<rect x="35.0" y="65.0" width="240.0" height="360.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.5"/>
<text x="155.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза 0-RTT: Early Secret</text>
<rect x="55.0" y="103.5" width="200.0" height="43.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="155.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Вхід: PSK або 0</tspan><tspan x="155.0" dy="13.0">(Попередній спільний ключ)</tspan></text>
<line x1="155.0" y1="150.0" x2="155.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="182.3" width="200.0" height="45.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="155.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Early Secret</tspan><tspan x="155.0" dy="14.3">= HKDF-Extract(0, PSK)</tspan></text>
<line x1="155.0" y1="235.0" x2="155.0" y2="265.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="285.5" width="210.0" height="69.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="155.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Ключі ранніх даних (0-RTT):</tspan><tspan x="155.0" dy="13.0">• client_early_traffic_secret</tspan><tspan x="155.0" dy="13.0">• early_exporter_master_secret</tspan><tspan x="155.0" dy="13.0">(Derive-Secret через HKDF-Expand)</tspan></text>
<line x1="260.0" y1="205.0" x2="315.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="287.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Derive</text>
<rect x="305.0" y="65.0" width="250.0" height="360.0" rx="6" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="430.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Фаза рукостискання: Handshake Secret</text>
<rect x="325.0" y="103.5" width="210.0" height="43.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="430.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Вхід: Спільний секрет ECDHE</tspan><tspan x="430.0" dy="13.0">(Крива X25519 / P-256)</tspan></text>
<line x1="430.0" y1="150.0" x2="430.0" y2="180.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.9" y="182.3" width="238.2" height="45.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Handshake Secret</tspan><tspan x="430.0" dy="14.3">= HKDF-Extract(derived_e, ECDHE)</tspan></text>
<line x1="430.0" y1="235.0" x2="430.0" y2="265.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="314.6" y="285.5" width="230.9" height="69.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="430.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Захист повідомлень Handshake:</tspan><tspan x="430.0" dy="13.0">• client_handshake_traffic_secret</tspan><tspan x="430.0" dy="13.0">• server_handshake_traffic_secret</tspan><tspan x="430.0" dy="13.0">(Шифрування сертифікатів та Finished)</tspan></text>
<line x1="560.0" y1="205.0" x2="605.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="582.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Derive</text>
<rect x="595.0" y="65.0" width="230.0" height="360.0" rx="6" fill="#eefaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="710.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза трафіку: Master Secret</text>
<rect x="594.5" y="103.5" width="230.9" height="43.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="710.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Вхід: Нульовий IKM (0^HashLen)</tspan><tspan x="710.0" dy="13.0">(Фіксація стека після автентифікації)</tspan></text>
<line x1="710.0" y1="150.0" x2="710.0" y2="180.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="601.1" y="182.3" width="217.8" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Master Secret</tspan><tspan x="710.0" dy="14.3">= HKDF-Extract(derived_hs, 0)</tspan></text>
<line x1="710.0" y1="235.0" x2="710.0" y2="265.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="594.5" y="285.5" width="230.9" height="69.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="710.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Трафік сесії та відновлення:</tspan><tspan x="710.0" dy="13.0">• client_application_traffic_secret_0</tspan><tspan x="710.0" dy="13.0">• server_application_traffic_secret_0</tspan><tspan x="710.0" dy="13.0">• resumption_master_secret (квитки)</tspan></text>
</svg>