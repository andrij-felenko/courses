<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 750" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="750" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр приймача: поетапна валідація кадру та відбиття Replay-атак</text>
<rect x="58.2" y="94.0" width="183.7" height="32.0" rx="6" fill="#eef3fb" stroke="#9bb5db" stroke-width="1.5"/><text x="150.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Прийом і кадрування</tspan></text>
<rect x="39.7" y="153.1" width="220.6" height="73.9" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="150.0" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Перевірка STX == 0xFD.</tspan><tspan x="150.0" dy="14.3">Якщо incompat_flags &amp; 0x01 == 1,</tspan><tspan x="150.0" dy="14.3">кадр має 13-байтний трейлер.</tspan><tspan x="150.0" dy="14.3">Розмір = 10 + LEN + 2 + 13 B.</tspan></text>
<line x1="265.0" y1="150.0" x2="335.0" y2="150.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="369.3" y="94.0" width="161.4" height="32.0" rx="6" fill="#eef3fb" stroke="#9bb5db" stroke-width="1.5"/><text x="450.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">2. Перевірка CRC-16</tspan></text>
<rect x="345.9" y="153.1" width="208.1" height="73.9" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="450.0" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Розрахунок контрольної суми</tspan><tspan x="450.0" dy="14.3">CRC-16/MCRF4XX з CRC_EXTRA.</tspan><tspan x="450.0" dy="14.3">Якщо CRC хибна — відкинути!</tspan><tspan x="450.0" dy="14.3">(Економія ресурсів процесора).</tspan></text>
<line x1="565.0" y1="150.0" x2="635.0" y2="150.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="643.3" y="94.0" width="213.4" height="32.0" rx="6" fill="#eef3fb" stroke="#9bb5db" stroke-width="1.5"/><text x="750.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">3. Пошук у таблиці потоків</tspan></text>
<rect x="655.4" y="153.1" width="189.3" height="73.9" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="750.0" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Витягнення триплету:</tspan><tspan x="750.0" dy="14.3">(sysid, compid, link_id).</tspan><tspan x="750.0" dy="14.3">Пошук відповідного потоку в</tspan><tspan x="750.0" dy="14.3">mavlink_signing_streams_t.</tspan></text>
<line x1="865.0" y1="150.0" x2="935.0" y2="150.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="958.2" y="94.0" width="183.7" height="32.0" rx="6" fill="#eef3fb" stroke="#9bb5db" stroke-width="1.5"/><text x="1050.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">4. Перевірка Timestamp</tspan></text>
<rect x="949.1" y="153.1" width="201.8" height="73.9" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="1050.0" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Умова монотонності:</tspan><tspan x="1050.0" dy="14.3">incoming_ts &gt; stream.last_ts</tspan><tspan x="1050.0" dy="14.3">Якщо incoming_ts &lt;= last_ts —</tspan><tspan x="1050.0" dy="14.3">ВІДХИЛИТИ! (Replay-атака).</tspan></text>
<line x1="1050.0" y1="240.0" x2="1050.0" y2="290.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="541.1" y="323.1" width="517.9" height="73.9" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="800.0" y="342.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">5. Розрахунок та звірка SHA-256 за сталий час</tspan><tspan x="800.0" dy="14.3">Обчислення digest = SHA256( Key || Packet_Bytes || link_id || timestamp )</tspan><tspan x="800.0" dy="14.3">Порівняння digest[0..5] із полем signature через constant-time memcmp().</tspan><tspan x="800.0" dy="14.3">Якщо байти не збіглися — ВІДХИЛИТИ! (Спроба підробки або чужий ключ).</tspan></text>
<line x1="1050.0" y1="290.0" x2="1060.0" y2="360.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="800.0" y1="420.0" x2="800.0" y2="470.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="541.1" y="493.1" width="517.9" height="73.9" rx="6" fill="#eef3fb" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="512.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">6. Успішна валідація та фіксація стану</tspan><tspan x="800.0" dy="14.3">• Оновлення таймстемпу потоку: stream.last_timestamp = incoming_timestamp</tspan><tspan x="800.0" dy="14.3">• Передача корисного навантаження в диспетчер команд або модуль навігації</tspan><tspan x="800.0" dy="14.3">• Кадр визнано повністю легітимним та автентичним.</tspan></text>
<rect x="53.7" y="384.4" width="452.6" height="131.1" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="280.0" y="403.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Чому необхідне поле Link ID:</tspan><tspan x="280.0" dy="14.3"></tspan><tspan x="280.0" dy="14.3">• Канал 0 (Радіомодем): затримка 50 мс, частота 10 Гц, TS = 120 000</tspan><tspan x="280.0" dy="14.3">• Канал 1 (Бортовий UDP): затримка 1 мс, частота 200 Гц, TS = 450 000</tspan><tspan x="280.0" dy="14.3"></tspan><tspan x="280.0" dy="14.3">Без Link ID пакети з повільного радіоканалу мали б менший TS</tspan><tspan x="280.0" dy="14.3">і помилково відкидалися б автопілотом як replay-атака!</tspan><tspan x="280.0" dy="14.3">Окремий облік часу на кожен Link ID ізолює канали.</tspan></text>
<rect x="227.5" y="664.0" width="745.0" height="32.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="684.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Перевірка часу відсікає replay-атаки ще до гешування, а постійний час звірки усуває витоки через таймінги.</tspan></text>
</svg>