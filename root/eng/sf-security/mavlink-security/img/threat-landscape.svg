<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель загроз для відкритого каналу телеметрії та керування БПЛА</text>
<rect x="10.0" y="108.4" width="339.9" height="63.2" rx="6" fill="#eef3fb" stroke="#9bb5db" stroke-width="1.5"/><text x="180.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Наземна станція керування (GCS)</tspan><tspan x="180.0" dy="15.6">Оператор / QGroundControl / Mission Planner</tspan><tspan x="180.0" dy="15.6">SysID: 255, CompID: 190</tspan></text>
<rect x="872.4" y="108.4" width="295.3" height="63.2" rx="6" fill="#eef3fb" stroke="#9bb5db" stroke-width="1.5"/><text x="1020.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">Бортовий автопілот (UAV)</tspan><tspan x="1020.0" dy="15.6">Польотний контролер / PX4 / ArduPilot</tspan><tspan x="1020.0" dy="15.6">SysID: 1, CompID: 1</tspan></text>
<line x1="360.0" y1="140.0" x2="862.4" y2="140.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="600.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Відкритий радіоефір (UART / 433/915 МГц / Wi-Fi / UDP)</text>
<rect x="372.4" y="285.1" width="455.2" height="49.9" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Зловмисник у зоні дії радіоефіру</tspan><tspan x="600.0" dy="16.9">SDR-трансивер / Спрямована антена / Потужний передавач</tspan></text>
<line x1="600.0" y1="280.1" x2="600.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="62.1" y="419.0" width="235.8" height="32.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">1. Підробка команд (Spoofing)</tspan></text>
<rect x="57.1" y="490.9" width="245.7" height="88.2" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="180.0" y="510.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Ін'єкція кадру COMMAND_LONG:</tspan><tspan x="180.0" dy="14.3">наказ DISARM, зміна польотного</tspan><tspan x="180.0" dy="14.3">режиму на ручний, скидання корисного</tspan><tspan x="180.0" dy="14.3">навантаження без відома оператора.</tspan><tspan x="180.0" dy="14.3">Захист: підпис MAVLink 2.</tspan></text>
<line x1="600.0" y1="339.9" x2="180.0" y2="414.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="357.0" y="419.0" width="206.0" height="32.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">2. Атака повтору (Replay)</tspan></text>
<rect x="340.3" y="490.9" width="239.4" height="88.2" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="460.0" y="510.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Запис легітимного кадру в ефірі</tspan><tspan x="460.0" dy="14.3">й повторна трансляція у критичний</tspan><tspan x="460.0" dy="14.3">момент місії (наприклад, посадка).</tspan><tspan x="460.0" dy="14.3">CRC збігається, seq переповнюється.</tspan><tspan x="460.0" dy="14.3">Захист: 48-бітний Timestamp.</tspan></text>
<line x1="600.0" y1="339.9" x2="460.0" y2="414.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="614.7" y="419.0" width="250.6" height="32.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">3. Перехоплення (Eavesdropping)</tspan></text>
<rect x="620.3" y="490.9" width="239.4" height="88.2" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="740.0" y="510.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Пасивне слухання координат дрона</tspan><tspan x="740.0" dy="14.3">(GLOBAL_POSITION_INT), точок місії,</tspan><tspan x="740.0" dy="14.3">пеленгація позиції оператора.</tspan><tspan x="740.0" dy="14.3">Підпис це НЕ закриває!</tspan><tspan x="740.0" dy="14.3">Захист: тунельне шифрування.</tspan></text>
<line x1="600.0" y1="339.9" x2="740.0" y2="414.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="902.1" y="419.0" width="235.8" height="32.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="1020.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">4. Підміна місії / параметрів</tspan></text>
<rect x="900.3" y="490.9" width="239.4" height="88.2" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="1020.0" y="510.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Модифікація польотного завдання</tspan><tspan x="1020.0" dy="14.3">(MISSION_ITEM_INT) або порогів</tspan><tspan x="1020.0" dy="14.3">аварійних режимів (PARAM_SET).</tspan><tspan x="1020.0" dy="14.3">Перенаправлення в чужу зону.</tspan><tspan x="1020.0" dy="14.3">Захист: перевірка HMAC + CRC_EXTRA.</tspan></text>
<line x1="600.0" y1="339.9" x2="1020.0" y2="414.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="227.5" y="651.2" width="745.0" height="47.6" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="671.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">MAVLink 2 Signing гарантує цілісність та автентичність, відбиваючи підробку й повтор.</tspan><tspan x="600.0" dy="15.6">Конфіденційність ефіру досягається накладанням канального або тунельного шифрування (WireGuard / AES-GCM).</tspan></text>
</svg>