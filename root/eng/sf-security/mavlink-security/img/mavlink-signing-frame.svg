<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура кадру MAVLink 2 з 13-байтним трейлером криптографічного підпису</text>
<rect x="40.0" y="70.0" width="1120.0" height="110.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40.2" y="85.2" width="299.6" height="59.6" rx="6" fill="#eef3fb" stroke="#9bb5db" stroke-width="1.5"/><text x="190.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Заголовок MAVLink 2 (10 байтів)</tspan><tspan x="190.0" dy="14.3">STX(0xFD) · LEN · Incompat(0x01) · Compat</tspan><tspan x="190.0" dy="14.3">Seq · SysID · CompID · MsgID(3B)</tspan></text>
<rect x="383.8" y="85.2" width="272.3" height="59.6" rx="6" fill="#eef3fb" stroke="#9bb5db" stroke-width="1.5"/><text x="520.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Корисне навантаження Payload</tspan><tspan x="520.0" dy="14.3">(LEN байтів, 0..255)</tspan><tspan x="520.0" dy="14.3">Дані повідомлення після Zero-Trimming</tspan></text>
<rect x="691.3" y="85.2" width="197.3" height="59.6" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="790.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Контрольна сума CRC-16</tspan><tspan x="790.0" dy="14.3">(2 байти, Little-Endian)</tspan><tspan x="790.0" dy="14.3">CRC-16/MCRF4XX + CRC_EXTRA</tspan></text>
<rect x="901.1" y="85.2" width="217.8" height="59.6" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.5"/><text x="1010.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">Трейлер підпису (13 байтів)</tspan><tspan x="1010.0" dy="14.3">Link ID (1B) · Timestamp (6B)</tspan><tspan x="1010.0" dy="14.3">Signature Hash (6B)</tspan></text>
<text x="600.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Деталізація 13-байтового трейлера підпису (Signature Trailer):</text>
<rect x="126.0" y="243.1" width="208.1" height="73.9" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="230.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Поле 1: Link ID (1 байт)</tspan><tspan x="230.0" dy="14.3">Значення: 0 .. 255</tspan><tspan x="230.0" dy="14.3">Ідентифікатор фізичного каналу</tspan><tspan x="230.0" dy="14.3">(UART1, UART2, UDP, SPI)</tspan></text>
<rect x="401.9" y="243.1" width="396.2" height="73.9" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Поле 2: Timestamp (6 байтів / 48 бітів LE)</tspan><tspan x="600.0" dy="14.3">Час у одиницях по 10 мкс від 00:00:00 UTC 01.01.2015</tspan><tspan x="600.0" dy="14.3">Строго монотонний лічильник (діапазон 89.2 року, до 2104 р.)</tspan><tspan x="600.0" dy="14.3">Захист від атак повторного відтворення (Replay Protection)</tspan></text>
<rect x="865.2" y="243.1" width="289.6" height="73.9" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.5"/><text x="1010.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">Поле 3: Signature (6 байтів / 48 бітів)</tspan><tspan x="1010.0" dy="14.3">Перші 6 байтів дайджесту SHA-256</tspan><tspan x="1010.0" dy="14.3">Криптографічний доказ володіння ключем</tspan><tspan x="1010.0" dy="14.3">Ймовірність підбору: 1 / 2⁴⁸ ≈ 3.55 × 10⁻¹⁵</tspan></text>
<text x="600.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формування вхідного масиву для розрахунку префіксного гешу SHA-256:</text>
<rect x="337.7" y="400.9" width="524.7" height="88.2" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="600.0" y="420.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Вхідні дані для SHA-256 = [ Спільний секретний ключ (32 байти) ]</tspan><tspan x="600.0" dy="14.3">                         + [ Заголовок MAVLink 2 (10 байтів) ]</tspan><tspan x="600.0" dy="14.3">                         + [ Корисне навантаження Payload (LEN байтів) ]</tspan><tspan x="600.0" dy="14.3">                         + [ Контрольна сума CRC-16 (2 байти) ]</tspan><tspan x="600.0" dy="14.3">                         + [ Link ID (1 байт) ] + [ Timestamp (6 байтів) ]</tspan></text>
<line x1="600.0" y1="485.0" x2="600.0" y2="520.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="307.3" y="536.2" width="585.4" height="47.6" rx="6" fill="#eef3fb" stroke="#9bb5db" stroke-width="1.5"/><text x="600.0" y="556.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Обчислення повнорозмірного SHA-256 (32 байти / 256 бітів)</tspan><tspan x="600.0" dy="15.6">digest = SHA256( Key || Header || Payload || CRC16 || Link_ID || Timestamp )</tspan></text>
<line x1="600.0" y1="600.0" x2="600.0" y2="635.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="354.9" y="650.2" width="490.2" height="59.6" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="669.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Обрізання дайджесту: беруться рівно перші 6 байтів (байти 0..5)</tspan><tspan x="600.0" dy="14.3">signature = digest[0..5]  →  записуються у байти 7..12 трейлера підпису.</tspan><tspan x="600.0" dy="14.3">Решта 26 байтів відкидаються для мінімізації накладних витрат у радіоефірі.</tspan></text>
</svg>