<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектор таймінг-атаки на табличну реалізацію AES (T-tables у L1-кеші)</text>
<rect x="40.0" y="60.0" width="260.0" height="90.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="170.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Відкритий байт p[i] ⊕ Ключ k[i]</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">Індекс T-таблиці:</tspan><tspan x="170.0" dy="14.3">idx = p[i] ⊕ k[i]</tspan></text>
<line x1="300.0" y1="105.0" x2="360.0" y2="105.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="60.0" width="270.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="495.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">Доступ до пам'яті:</tspan><tspan x="495.0" dy="14.3">val = T_table[idx]</tspan><tspan x="495.0" dy="14.3"></tspan><tspan x="495.0" dy="14.3">Адреса = База + (idx × 4)</tspan></text>
<line x1="630.0" y1="105.0" x2="690.0" y2="105.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="52.0" width="270.0" height="316.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="825.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">L1 Cache Lines (64 байти)</text>
<rect x="705.0" y="92.0" width="240.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="825.0" y="113.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Line 0: T[0..15] (HIT: ~4 такти)</tspan></text>
<rect x="705.0" y="142.0" width="240.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="825.0" y="163.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Line 1: T[16..31] (HIT: ~4 такти)</tspan></text>
<rect x="705.0" y="192.0" width="240.0" height="36.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="825.0" y="213.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Line 2: T[32..47] (MISS: ~40 тактів)</tspan></text>
<rect x="705.0" y="242.0" width="240.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="825.0" y="263.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Line 3: T[48..63] (HIT: ~4 такти)</tspan></text>
<rect x="705.0" y="292.0" width="240.0" height="36.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.2"/><text x="825.0" y="313.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Line 4..15: решта ліній...</tspan></text>
<rect x="40.0" y="190.0" width="590.0" height="178.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="335.0" y="258.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">Механізм витоку секретного ключа k[i]:</tspan><tspan x="335.0" dy="11.7">1. Супротивник контролює p[i] і вимірює час шифрування (Flush+Reload / Prime+Probe);</tspan><tspan x="335.0" dy="11.7">2. Різниця часу HIT (~4 такти) та MISS (~40 тактів) викриває, до якої кеш-лінії звертався процесор;</tspan><tspan x="335.0" dy="11.7">3. Знаючи p[i] та номер активної кеш-лінії, зловмисник звужує можливі значення k[i] до кількох бітів;</tspan><tspan x="335.0" dy="11.7">4. Захист: константний час через апаратні інструкції AES-NI або програмний бітслайсинг.</tspan></text>
</svg>