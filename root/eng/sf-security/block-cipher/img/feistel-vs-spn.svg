<line x1="775.0" y1="290.0" x2="775.0" y2="314.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="615.0" y="314.0" width="320.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="333.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Шар ключа: AddRoundKey (State ⊕ RoundKey)</tspan><tspan x="775.0" dy="11.7">Введення секрету: лінійне накладання раундового ключа</tspan></text>
<line x1="775.0" y1="358.0" x2="775.0" y2="380.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="645.0" y="380.0" width="260.0" height="36.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="775.0" y="401.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Вихідний стан раунду (повна дифузія за 2 раунди)</tspan></text>
