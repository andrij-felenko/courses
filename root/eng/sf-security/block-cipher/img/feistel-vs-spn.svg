<rect x="50.0" y="430.0" width="430.0" height="38.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="265.0" y="452.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Властивість: F не обов'язково оборотна; дешифрування ідентичне</tspan></text>
