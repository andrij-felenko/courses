<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими роботи блокового шифру: порівняння архітектурних гарантій</text>
<rect x="30.0" y="54.0" width="230.0" height="444.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="145.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ECB (Codebook)</text>
<text x="145.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Небезпечний</text>
<rect x="43.0" y="118.0" width="204.0" height="98.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="145.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">C[i] = Enc(K, P[i])</tspan></text>
<rect x="43.0" y="226.0" width="204.0" height="98.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="145.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Детерміністичний:</tspan><tspan x="145.0" dy="14.3">однакові блоки дають</tspan><tspan x="145.0" dy="14.3">однаковий шифротекст</tspan></text>
<rect x="43.0" y="350.0" width="204.0" height="98.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="145.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Вразливість:</tspan><tspan x="145.0" dy="14.3">зберігає патерни («Tux»)</tspan><tspan x="145.0" dy="14.3">Заборонено для N &gt; 1</tspan></text>
<rect x="290.0" y="54.0" width="230.0" height="444.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="405.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">CBC (Chaining)</text>
<text x="405.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Зчеплення + IV</text>
<rect x="303.0" y="118.0" width="204.0" height="98.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="405.0" y="163.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">C[i] = Enc(K, P[i] ⊕ C[i-1])</tspan><tspan x="405.0" dy="14.3">C[0] = IV</tspan></text>
<rect x="303.0" y="226.0" width="204.0" height="98.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="405.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Послідовний:</tspan><tspan x="405.0" dy="14.3">шифрування не паралелиться,</tspan><tspan x="405.0" dy="14.3">дешифрування паралельне</tspan></text>
<rect x="303.0" y="350.0" width="204.0" height="98.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="405.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Вразливість:</tspan><tspan x="405.0" dy="14.3">Padding Oracle (PKCS#7)</tspan><tspan x="405.0" dy="14.3">при помилках перевірки</tspan></text>
<rect x="550.0" y="54.0" width="230.0" height="444.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="665.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">CTR (Counter)</text>
<text x="665.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Потоковий режим</text>
<rect x="563.0" y="118.0" width="204.0" height="98.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">C[i] = P[i] ⊕ Enc(K, Nonce||i)</tspan></text>
<rect x="563.0" y="226.0" width="204.0" height="98.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Паралельний:</tspan><tspan x="665.0" dy="14.3">миттєвий довільний доступ,</tspan><tspan x="665.0" dy="14.3">не потребує padding</tspan></text>
<rect x="563.0" y="350.0" width="204.0" height="98.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="665.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Вимога безпеки:</tspan><tspan x="665.0" dy="14.3">катастрофа при повторі</tspan><tspan x="665.0" dy="14.3">пари (Key, Nonce)</tspan></text>
<rect x="810.0" y="54.0" width="230.0" height="444.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="925.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">GCM (AEAD)</text>
<text x="925.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">CTR + GHASH</text>
<rect x="823.0" y="118.0" width="204.0" height="98.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="925.0" y="163.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">C = CTR_Enc(K, IV, P)</tspan><tspan x="925.0" dy="14.3">T = GHASH(H, AAD, C)</tspan></text>
<rect x="823.0" y="226.0" width="204.0" height="98.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="925.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">Автентифікований:</tspan><tspan x="925.0" dy="14.3">конфіденційність P +</tspan><tspan x="925.0" dy="14.3">цілісність AAD і C</tspan></text>
<rect x="823.0" y="350.0" width="204.0" height="98.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="925.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">Золотий стандарт:</tspan><tspan x="925.0" dy="14.3">TLS 1.3, SSH, IPsec,</tspan><tspan x="925.0" dy="14.3">апаратне прискорення</tspan></text>
</svg>