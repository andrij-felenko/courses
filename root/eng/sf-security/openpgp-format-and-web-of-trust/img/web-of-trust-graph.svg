<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Мережа довіри (Web of Trust)</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Перевірка ідентичності через ланцюжок підписів без центрального органу</text>

  <defs>
    <!-- Маркер для стрілок потоку -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Зв'язки (broken lines around labels so no intersections occur) -->
  
  <!-- Alice to Bob -->
  <path d="M 250 210 L 275 194" stroke="#2457d6" stroke-width="2"/>
  <path d="M 365 136 L 405 110" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="270" y="145" width="105" height="34" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="322" y="159" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Підписав ключ</text>
  <text x="322" y="173" font-size="12" fill="#6b7280" text-anchor="middle">(повна довіра)</text>

  <!-- Alice to Charlie (часткова довіра) -->
  <path d="M 250 210 L 275 230" stroke="#2457d6" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 365 300 L 405 330" stroke="#2457d6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arr)"/>
  <rect x="270" y="245" width="105" height="34" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="322" y="259" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підписав ключ</text>
  <text x="322" y="273" font-size="12" fill="#6b7280" text-anchor="middle">(часткова довіра)</text>

  <!-- Bob to Dave -->
  <path d="M 510 110 L 590 136" stroke="#2457d6" stroke-width="2"/>
  <path d="M 700 171 L 805 205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="595" y="135" width="100" height="26" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="645" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Підписав ключ</text>

  <!-- Charlie to Eve -->
  <line x1="510" y1="330" x2="605" y2="330" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="557" y="318" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підписав</text>

  <!-- Eve to Dave -->
  <path d="M 710 330 L 730 306" stroke="#2457d6" stroke-width="2"/>
  <path d="M 785 240 L 805 215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="725" y="252" width="70" height="34" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="760" y="266" font-size="12" fill="#1a1a1a" text-anchor="middle">Підписала</text>
  <text x="760" y="280" font-size="12" fill="#1a1a1a" text-anchor="middle">ключ</text>

  <!-- Вузли (користувачі / ключі) -->
  
  <!-- Alice -->
  <rect x="150" y="190" width="100" height="40" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="200" y="215" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Alice (Я)</text>

  <!-- Bob -->
  <rect x="410" y="90" width="100" height="40" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="460" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Bob</text>

  <!-- Charlie -->
  <rect x="410" y="310" width="100" height="40" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="460" y="335" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Charlie</text>

  <!-- Eve -->
  <rect x="610" y="310" width="100" height="40" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="660" y="335" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Eve</text>

  <!-- Dave -->
  <rect x="810" y="190" width="100" height="40" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="860" y="215" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Dave</text>

  <!-- Легенда -->
  <rect x="50" y="375" width="520" height="65" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="70" y="396" font-size="12" font-weight="bold" fill="#1a1a1a">Шляхи перевірки ідентичності Dave:</text>
  <text x="70" y="414" font-size="12" fill="#1a1a1a">1. Через Bob (повна довіра) → ключ Dave вважається дійсним.</text>
  <text x="70" y="431" font-size="12" fill="#1a1a1a">2. Через Charlie (часткова) → потрібні додаткові підтвердження.</text>
</svg>
