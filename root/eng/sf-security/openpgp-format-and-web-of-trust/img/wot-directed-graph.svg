<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <defs>
    <marker id="arr-full" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-marginal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Орієнтований граф довіри Web of Trust</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Направлені ребра підписів формалізують накопичення часткової довіри між вузлами</text>

  <!-- Nodes -->
  <!-- Owner Root Node -->
  <rect x="100" y="200" width="140" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="170" y="228" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Власник (Ви)</text>
  <text x="170" y="246" font-size="12" fill="#6b7280" text-anchor="middle">Абсолютна довіра</text>

  <!-- Node A -->
  <rect x="360" y="120" width="140" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="10"/>
  <text x="430" y="148" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол A</text>
  <text x="430" y="166" font-size="12" fill="#6b7280" text-anchor="middle">Повна довіра (Full)</text>

  <!-- Node B -->
  <rect x="360" y="280" width="140" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="10"/>
  <text x="430" y="308" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол B</text>
  <text x="430" y="326" font-size="12" fill="#6b7280" text-anchor="middle">Часткова довіра</text>

  <!-- Target Node C -->
  <rect x="680" y="200" width="160" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="10"/>
  <text x="760" y="228" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цільовий ключ C</text>
  <text x="760" y="246" font-size="12" fill="#27ae60" text-anchor="middle">Підтверджений (Valid)</text>

  <!-- Split Edges to avoid text box intersection -->
  <!-- Owner -> A -->
  <line x1="240" y1="210" x2="258" y2="202" stroke="#27ae60" stroke-width="2"/>
  <rect x="260" y="165" width="90" height="22" fill="white" stroke="#27ae60" rx="3"/>
  <text x="305" y="180" font-size="11" fill="#27ae60" text-anchor="middle">Підпис (Full)</text>
  <line x1="352" y1="162" x2="358" y2="160" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-full)"/>

  <!-- Owner -> B -->
  <line x1="240" y1="250" x2="253" y2="255" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="255" y="285" width="100" height="22" fill="white" stroke="#2457d6" rx="3"/>
  <text x="305" y="300" font-size="11" fill="#2457d6" text-anchor="middle">Підпис (Marginal)</text>
  <line x1="356" y1="299" x2="358" y2="300" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-marginal)"/>

  <!-- A -> C -->
  <line x1="500" y1="160" x2="548" y2="175" stroke="#27ae60" stroke-width="2"/>
  <rect x="550" y="168" width="90" height="22" fill="white" stroke="#27ae60" rx="3"/>
  <text x="595" y="183" font-size="11" fill="#27ae60" text-anchor="middle">Підпис (Full)</text>
  <line x1="642" y1="204" x2="678" y2="215" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-full)"/>

  <!-- B -> C -->
  <line x1="500" y1="300" x2="543" y2="287" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="545" y="278" width="100" height="22" fill="white" stroke="#2457d6" rx="3"/>
  <text x="595" y="293" font-size="11" fill="#2457d6" text-anchor="middle">Підпис (Marginal)</text>
  <line x1="647" y1="255" x2="678" y2="245" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-marginal)"/>

  <!-- Legend at bottom -->
  <rect x="180" y="390" width="600" height="45" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="200" y="417" font-size="12" font-weight="bold" fill="#1a1a1a">Розрахунок валідності:</text>
  <text x="360" y="417" font-size="12" fill="#1a1a1a">1 Повний підпис (Full) АБО 3 Часткових (Marginal) = Ключ Валідний</text>
</svg>
