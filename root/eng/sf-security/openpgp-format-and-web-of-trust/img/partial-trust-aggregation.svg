<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Збіжність шляхів та агрегація часткової довіри</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Кілька часткових підписів (Marginal) від незалежних вузлів сумарно дають повну валідність ключа</text>

  <!-- Root Owner Node -->
  <rect x="60" y="200" width="140" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="130" y="228" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Користувач (Ви)</text>
  <text x="130" y="246" font-size="12" fill="#6b7280" text-anchor="middle">Корінь довіри</text>

  <!-- Intermediate Marginal Trusted Nodes -->
  <rect x="360" y="90" width="160" height="55" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="440" y="115" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол K1</text>
  <text x="440" y="133" font-size="11" fill="#6b7280" text-anchor="middle">Довіра: Marginal (1/3)</text>

  <rect x="360" y="202" width="160" height="55" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="440" y="227" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол K2</text>
  <text x="440" y="245" font-size="11" fill="#6b7280" text-anchor="middle">Довіра: Marginal (1/3)</text>

  <rect x="360" y="315" width="160" height="55" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="440" y="340" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол K3</text>
  <text x="440" y="358" font-size="11" fill="#6b7280" text-anchor="middle">Довіра: Marginal (1/3)</text>

  <!-- Target Node -->
  <rect x="720" y="195" width="180" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="810" y="225" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Цільовий ключ T</text>
  <text x="810" y="247" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сума: 3/3 = Valid</text>

  <!-- Split Lines from Root to K1, K2, K3 -->
  <line x1="200" y1="210" x2="358" y2="120" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="230" x2="358" y2="230" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="250" x2="358" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Split Lines from K1, K2, K3 to Target -->
  <line x1="520" y1="120" x2="718" y2="210" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="520" y1="230" x2="718" y2="230" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="520" y1="340" x2="718" y2="250" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
</svg>
