<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність пакетів у сертифікаті OpenPGP (RFC 4880 / RFC 9580)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Криптографічний ключ OpenPGP форматується як послідовний байтовий потік типізованих пакетів</text>

  <!-- Container for Packet Stream -->
  <rect x="30" y="80" width="900" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Packet 1: Public Key Packet (Tag 6) -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="160" height="280" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <rect x="10" y="10" width="140" height="30" rx="4" fill="#2457d6"/>
    <text x="80" y="30" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Пакет 1: Tag 6</text>
    <text x="80" y="60" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Public Key Packet</text>
    <line x1="10" y1="75" x2="150" y2="75" stroke="#d0d7de"/>
    <text x="15" y="98" font-size="12" fill="#1a1a1a">• Версія (v4 / v6)</text>
    <text x="15" y="123" font-size="12" fill="#1a1a1a">• Час створення</text>
    <text x="15" y="148" font-size="12" fill="#1a1a1a">• Алгоритм (Ed25519/RSA)</text>
    <text x="15" y="173" font-size="12" fill="#1a1a1a">• Публічні матеріали</text>
    <text x="15" y="198" font-size="12" fill="#6b7280">(n, e) або (point Q)</text>
    <rect x="10" y="225" width="140" height="40" rx="4" fill="white" stroke="#2457d6"/>
    <text x="80" y="250" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Головний ключ [C]</text>
  </g>

  <!-- Packet 2: User ID Packet (Tag 13) -->
  <g transform="translate(225, 110)">
    <rect x="0" y="0" width="160" height="280" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="10" y="10" width="140" height="30" rx="4" fill="#6b7280"/>
    <text x="80" y="30" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Пакет 2: Tag 13</text>
    <text x="80" y="60" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">User ID Packet</text>
    <line x1="10" y1="75" x2="150" y2="75" stroke="#d0d7de"/>
    <text x="15" y="105" font-size="12" fill="#1a1a1a">• UTF-8 Рядок</text>
    <text x="15" y="130" font-size="12" fill="#6b7280">Текстове ім'я та email</text>
    <rect x="10" y="160" width="140" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
    <text x="80" y="185" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">"Alice &lt;alice@</text>
    <text x="80" y="205" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">example.com&gt;"</text>
  </g>

  <!-- Packet 3: Signature Packet (Tag 2) - Self Sig -->
  <g transform="translate(400, 110)">
    <rect x="0" y="0" width="160" height="280" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <rect x="10" y="10" width="140" height="30" rx="4" fill="#27ae60"/>
    <text x="80" y="30" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Пакет 3: Tag 2</text>
    <text x="80" y="60" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Signature Packet</text>
    <line x1="10" y1="75" x2="150" y2="75" stroke="#d0d7de"/>
    <text x="15" y="98" font-size="12" fill="#1a1a1a">• Тип 0x13 (Positive)</text>
    <text x="15" y="123" font-size="12" fill="#1a1a1a">• Хеш-алгоритм</text>
    <text x="15" y="148" font-size="12" fill="#1a1a1a">• Видавець (Key ID)</text>
    <text x="15" y="173" font-size="12" fill="#1a1a1a">• Криптографічний</text>
    <text x="15" y="193" font-size="12" fill="#1a1a1a">  підпис (MPI)</text>
    <rect x="10" y="225" width="140" height="40" rx="4" fill="white" stroke="#27ae60"/>
    <text x="80" y="250" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Самопідпис Tag 6+13</text>
  </g>

  <!-- Packet 4: Public Subkey Packet (Tag 14) -->
  <g transform="translate(575, 110)">
    <rect x="0" y="0" width="160" height="280" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <rect x="10" y="10" width="140" height="30" rx="4" fill="#2457d6"/>
    <text x="80" y="30" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Пакет 4: Tag 14</text>
    <text x="80" y="60" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Public Subkey</text>
    <line x1="10" y1="75" x2="150" y2="75" stroke="#d0d7de"/>
    <text x="15" y="98" font-size="12" fill="#1a1a1a">• Версія (v4 / v6)</text>
    <text x="15" y="123" font-size="12" fill="#1a1a1a">• Публічна точка</text>
    <text x="15" y="148" font-size="12" fill="#1a1a1a">  підключа [E]</text>
    <text x="15" y="173" font-size="12" fill="#6b7280">• Окремий Key ID</text>
    <rect x="10" y="225" width="140" height="40" rx="4" fill="white" stroke="#2457d6"/>
    <text x="80" y="250" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Підключ шифрування</text>
  </g>

  <!-- Packet 5: Subkey Binding Signature (Tag 2) -->
  <g transform="translate(750, 110)">
    <rect x="0" y="0" width="160" height="280" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <rect x="10" y="10" width="140" height="30" rx="4" fill="#27ae60"/>
    <text x="80" y="30" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Пакет 5: Tag 2</text>
    <text x="80" y="60" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Binding Signature</text>
    <line x1="10" y1="75" x2="150" y2="75" stroke="#d0d7de"/>
    <text x="15" y="98" font-size="12" fill="#1a1a1a">• Тип 0x18 (Subkey)</text>
    <text x="15" y="123" font-size="12" fill="#1a1a1a">• Підпис головного</text>
    <text x="15" y="143" font-size="12" fill="#1a1a1a">  ключа на Tag 14</text>
    <text x="15" y="173" font-size="12" fill="#6b7280">• Підтверджує володіння</text>
    <rect x="10" y="225" width="140" height="40" rx="4" fill="white" stroke="#27ae60"/>
    <text x="80" y="250" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Підпис прив'язки</text>
  </g>

  <!-- Connecting Stream Line at Bottom -->
  <path d="M 50 405 L 910 405" fill="none" stroke="#2457d6" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="910,405 900,399 900,411" fill="#2457d6"/>
  <text x="480" y="420" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Послідовний байтовий потік сертифіката OpenPGP (Binary / Armor)</text>

</svg>
