<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектури підпису: статичний ключ у раннері проти віддаленого HSM</text>
<rect x="40.0" y="55.0" width="460.0" height="440.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="270.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Антипідхід: статичний приватний ключ у CI/CD</text>
<text x="270.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Змінні середовища / runner secrets</text>
<rect x="65.0" y="120.0" width="410.0" height="55.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="270.0" y="143.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">CI Runner (GitHub Actions / GitLab CI)</tspan><tspan x="270.0" dy="15.6">Виконує збірку та сторонній код</tspan></text>
<rect x="90.0" y="190.0" width="360.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Секрет у пам'яті: PRIVATE_KEY.pem</tspan><tspan x="270.0" dy="15.6">(Довгоживучий ключ релізу)</tspan></text>
<rect x="90.0" y="250.0" width="360.0" height="48.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="270.0" y="270.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Локальна криптографія: OpenSSL sign</tspan><tspan x="270.0" dy="15.6">(Підпис виконується на раннері)</tspan></text>
<line x1="270.0" y1="310.0" x2="270.0" y2="345.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="65.0" y="345.0" width="410.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="385.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Катастрофа компрометації:</tspan><tspan x="270.0" dy="14.3">1. Вразливий npm/pip/cargo пакунок або шкідливий PR</tspan><tspan x="270.0" dy="14.3">2. Читання змінних середовища чи пам'яті процесу</tspan><tspan x="270.0" dy="14.3">3. Викрадення приватного ключа нападником</tspan><tspan x="270.0" dy="14.3">4. Безстроковий підпис шкідливого софту</tspan></text>
<rect x="540.0" y="55.0" width="460.0" height="440.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="770.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Віддалений підпис: ізольований сервіс + HSM</text>
<text x="770.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Zero-Trust для раннерів конвеєра</text>
<rect x="565.0" y="120.0" width="410.0" height="55.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="770.0" y="143.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">CI Runner (Недовірене середовище)</tspan><tspan x="770.0" dy="15.6">Збирає артефакт, рахує лише SHA-256</tspan></text>
<rect x="590.0" y="190.0" width="360.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="770.0" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Запит через mTLS: Digest + OIDC Token</tspan><tspan x="770.0" dy="15.6">(Жодного закритого ключа в раннері)</tspan></text>
<line x1="770.0" y1="240.0" x2="770.0" y2="270.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="565.0" y="270.0" width="410.0" height="65.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="770.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Signing Service (Ізольована зона)</tspan><tspan x="770.0" dy="14.3">1. Перевірка OIDC токену (коміт, тег, автор)</tspan><tspan x="770.0" dy="14.3">2. Перевірка політики (лише release-теги)</tspan></text>
<line x1="770.0" y1="337.0" x2="770.0" y2="365.0" stroke="#6b21a8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="565.0" y="365.0" width="410.0" height="110.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="402.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Апаратний модуль безпеки (HSM / KMS):</tspan><tspan x="770.0" dy="14.3">Ключ ніколи не експортується назовні.</tspan><tspan x="770.0" dy="14.3">Апаратне обчислення цифрового підпису.</tspan><tspan x="770.0" dy="14.3">Повернення лише signature у відповідь.</tspan></text>
</svg>