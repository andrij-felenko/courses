<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурне порівняння Legacy Pairing та Secure Connections</text>
<rect x="30.0" y="40.0" width="380.0" height="270.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="220.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Legacy Pairing (BT 1.0–2.0 / LE Legacy)</text>
<rect x="50.0" y="89.3" width="340.0" height="45.3" rx="6" fill="#ffffff" stroke="#e0a0a0" stroke-width="1.2"/><text x="220.0" y="108.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Спільний секрет: PIN-код (4–16 цифр)</tspan><tspan x="220.0" dy="14.3">Фіксований PIN гарнітури: «0000» або «1234»</tspan></text>
<rect x="50.0" y="149.3" width="340.0" height="45.3" rx="6" fill="#ffffff" stroke="#e0a0a0" stroke-width="1.2"/><text x="220.0" y="168.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Алгоритми: E21 / E22 (SAFER+ блоковий шифр)</tspan><tspan x="220.0" dy="14.3">Шифрування каналу: потоковий шифр E0 / AES-CTR</tspan></text>
<rect x="50.0" y="223.3" width="340.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="242.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Вразливість: пасивне перехоплення 4 пакетів</tspan><tspan x="220.0" dy="14.3">Повний злам PIN за &lt;0.06 с (Shaked–Wool)</tspan></text>
<rect x="450.0" y="40.0" width="380.0" height="270.0" rx="8" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="640.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Secure Connections (BT 4.2+ / BT 2.1+ SSP)</text>
<rect x="470.0" y="89.3" width="340.0" height="45.3" rx="6" fill="#ffffff" stroke="#a0d8b0" stroke-width="1.2"/><text x="640.0" y="108.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Обмін ключами: ефемерний ECDH (P-256 / P-192)</tspan><tspan x="640.0" dy="14.3">Секретний DHKey не передається через радіоефір</tspan></text>
<rect x="467.0" y="149.3" width="346.0" height="45.3" rx="6" fill="#ffffff" stroke="#a0d8b0" stroke-width="1.2"/><text x="640.0" y="168.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Криптопримітиви: AES-CMAC (f4, f5, f6, g2)</tspan><tspan x="640.0" dy="14.3">Шифрування каналу: автентифіковане AES-CCM (128 біт)</tspan></text>
<rect x="459.5" y="223.3" width="361.0" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="242.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Стійкість: 128 біт проти пасивного прослуховування</tspan><tspan x="640.0" dy="14.3">Захист від MITM через Numeric Comparison / OOB</tspan></text>
</svg>