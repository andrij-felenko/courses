<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова шкала алгоритму GCRA (Generic Cell Rate Algorithm)</text>
<line x1="40.0" y1="90.0" x2="715.0" y2="90.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Час (t)</text>
<line x1="160.0" y1="75.0" x2="160.0" y2="105.0" stroke="#333333" stroke-width="1.5"/>
<text x="160.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₁ (Запит 1)</text>
<line x1="360.0" y1="75.0" x2="360.0" y2="105.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="360.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">TAT (Очікуваний час)</text>
<rect x="240.0" y="55.0" width="120.0" height="30.0" rx="4" fill="#d1f2eb" stroke="#27ae60" stroke-width="1.5"/>
<text x="300.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Допуск сплеску (τ)</text>
<line x1="240.0" y1="45.0" x2="240.0" y2="105.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,2"/>
<text x="240.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">TAT - τ</text>
<text x="140.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Зона відхилення (t &lt; TAT - τ)</text>
<rect x="460.0" y="140.0" width="260.0" height="110.0" rx="8" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="590.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило оновлення GCRA:</text>
<text x="590.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Якщо t ≥ TAT - τ: ПРИЙНЯТИ</text>
<text x="590.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">TAT_новий = max(t, TAT) + T</text>
<text x="590.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Інакше: ВІДХИЛИТИ (без зміни TAT)</text>
<rect x="40.0" y="140.0" width="390.0" height="110.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="235.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Параметри віртуального планувальника:</text>
<text x="235.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• T = 1 / r — інтервал між запитами при стабільній швидкості</text>
<text x="235.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• τ (tau) — часовий ліміт сплеску (Burst Tolerance)</text>
<text x="235.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Пам'ять: рівно 1 число (64-бітне значення TAT) на ключ!</text>
</svg>