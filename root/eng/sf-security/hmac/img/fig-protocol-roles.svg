<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="348.3" y="53.9" width="523.4" height="52.2" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="610.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">HMAC: Універсальний криптографічний примітив автентичності</tspan><tspan x="610.0" dy="18.2">RFC 2104 / FIPS 198-1 (Псевдовипадкова функція PRF)</tspan></text>
<rect x="46.0" y="215.9" width="208.1" height="88.2" rx="6" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5"/><text x="150.0" y="235.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">IPsec (AH / ESP)</tspan><tspan x="150.0" dy="14.3">Захист мережевого рівня L3:</tspan><tspan x="150.0" dy="14.3">Автентифікація IP-пакетів,</tspan><tspan x="150.0" dy="14.3">захист від підміни заголовків</tspan><tspan x="150.0" dy="14.3">та ін'єкції шкідливого трафіку</tspan></text>
<line x1="610.0" y1="120.0" x2="150.0" y2="195.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="269.7" y="435.9" width="220.6" height="88.2" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="380.0" y="455.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">TLS 1.2 / 1.3 (HKDF)</tspan><tspan x="380.0" dy="14.3">Захист транспортного рівня:</tspan><tspan x="380.0" dy="14.3">Контроль цілісності записів,</tspan><tspan x="380.0" dy="14.3">деривація ключів сесії у TLS 1.3</tspan><tspan x="380.0" dy="14.3">через функцію HKDF (RFC 5869)</tspan></text>
<line x1="610.0" y1="120.0" x2="380.0" y2="415.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="509.1" y="215.9" width="201.8" height="88.2" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="610.0" y="235.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">JSON Web Tokens (JWT)</tspan><tspan x="610.0" dy="14.3">Веб-автентифікація без стану:</tspan><tspan x="610.0" dy="14.3">Підпис заголовка і корисного</tspan><tspan x="610.0" dy="14.3">навантаження алгоритмом HS256</tspan><tspan x="610.0" dy="14.3">(HMAC-SHA256)</tspan></text>
<line x1="610.0" y1="120.0" x2="610.0" y2="195.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="723.4" y="435.9" width="233.2" height="88.2" rx="6" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5"/><text x="840.0" y="455.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">PBKDF2 (Зберігання паролів)</tspan><tspan x="840.0" dy="14.3">Захист від перебору за словником:</tspan><tspan x="840.0" dy="14.3">Тисячі ітерацій HMAC(пароль, сіль)</tspan><tspan x="840.0" dy="14.3">для сповільнення атак на GPU</tspan><tspan x="840.0" dy="14.3">та формування ключів шифрування</tspan></text>
<line x1="610.0" y1="120.0" x2="840.0" y2="415.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="959.7" y="215.9" width="220.6" height="88.2" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="1070.0" y="235.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">TOTP / HOTP (2FA)</tspan><tspan x="1070.0" dy="14.3">Двофакторна автентифікація:</tspan><tspan x="1070.0" dy="14.3">HMAC-SHA1(секрет, лічильник/час)</tspan><tspan x="1070.0" dy="14.3">із динамічним усіканням до</tspan><tspan x="1070.0" dy="14.3">6-значного одноразового коду</tspan></text>
<line x1="610.0" y1="120.0" x2="1070.0" y2="195.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="610.0" y="710.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">HMAC є фундаментом як цілісності даних у мережі, так і деривації ключів та автентифікації користувачів</text>
</svg>