<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="126.0" y="33.0" width="428.0" height="34.0" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="340.0" y="54.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Легітимне обчислення H(Key || Message) сервером</tspan></text>
<rect x="34.8" y="117.3" width="170.5" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Стандартний IV</tspan><tspan x="120.0" dy="14.3">(фіксований у стандарті)</tspan></text>
<line x1="205.0" y1="140.0" x2="265.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="196.2" y="117.3" width="427.5" height="45.3" rx="6" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5"/><text x="410.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Блок 1 (64 байти): [ Таємний Ключ || Message || Доповнення Pad₁ ]</tspan><tspan x="410.0" dy="14.3">«amount=100&amp;to=bob» + біт 1, нулі та довжина</tspan></text>
<line x1="555.0" y1="140.0" x2="615.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="609.0" y="117.3" width="401.9" height="45.3" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="810.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Внутрішній стан після Блоку 1 = Хеш H(Key || Message)</tspan><tspan x="810.0" dy="14.3">h = [a, b, c, d, e, f, g, h] (відкритий у мережі підпис)</tspan></text>
<line x1="80.0" y1="240.0" x2="1120.0" y2="240.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,6"/>
<text x="600.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Перехоплення зловмисником: підпис H відомий, але таємний ключ НЕВІДОМИЙ</text>
<rect x="107.0" y="303.0" width="506.1" height="34.0" rx="6" fill="#fdeeed" stroke="#f5b7b1" stroke-width="1.5"/><text x="360.0" y="324.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Атака подовженням: зловмисник продовжує ланцюг обчислень</tspan></text>
<rect x="84.5" y="397.4" width="211.0" height="45.3" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="190.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Новий стартовий стан IV' = h</tspan><tspan x="190.0" dy="14.3">(перехоплений дайджест)</tspan></text>
<line x1="320.0" y1="420.0" x2="390.0" y2="420.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="375.0" y="397.4" width="389.9" height="45.3" rx="6" fill="#fdeeed" stroke="#f5b7b1" stroke-width="1.5"/><text x="570.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Блок 2 (подовження): [ Шкідливий хвіст || Доповнення Pad₂ ]</tspan><tspan x="570.0" dy="14.3">«&amp;to=eve&amp;amount=999999» + нове доповнення</tspan></text>
<line x1="750.0" y1="420.0" x2="820.0" y2="420.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="877.7" y="397.4" width="224.6" height="45.3" rx="6" fill="#fdeeed" stroke="#f5b7b1" stroke-width="1.5"/><text x="990.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">Сфальсифікований тег H'</tspan><tspan x="990.0" dy="14.3">Валідний для розширеного тіла!</tspan></text>
<rect x="333.5" y="558.4" width="533.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="578.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Сервер отримує [ Message || Pad₁ || Шкідливий хвіст ] разом із тегом H'.</tspan><tspan x="600.0" dy="15.6">Під час перевірки сервер рахує H(Key || Message || Pad₁ || Шкідливий хвіст)</tspan><tspan x="600.0" dy="15.6">і отримує ТОЙ САМИЙ тег H'! Автентичність скомпрометовано без знання ключа.</tspan></text>
<text x="600.0" y="685.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Меркле-Дамґорд видає внутрішній стан як результат — це дозволяє дописувати дані в кінець</text>
</svg>