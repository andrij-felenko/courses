<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переповнення в кучі (Heap Overflow) та захисне вилучення (Safe Unlinking)</text>
<rect x="40.0" y="55.0" width="820.0" height="195.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="450.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Анатомія суміжних чанків алокатора glibc (ptmalloc2)</text>
<rect x="60.0" y="111.0" width="220.0" height="48.0" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/><text x="170.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Чанк A: Заголовок</tspan><tspan x="170.0" dy="13.0">prev_size (8B) | size (8B)</tspan><tspan x="170.0" dy="13.0">Прапорці: A|M|P (PREV_INUSE)</tspan></text>
<rect x="289.9" y="111.0" width="160.2" height="48.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="370.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Чанк A: Користувацькі дані</tspan><tspan x="370.0" dy="13.0">Виділено: malloc(64)</tspan><tspan x="370.0" dy="13.0">Буфер під дані програми</tspan></text>
<rect x="480.0" y="111.0" width="180.0" height="48.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="570.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Чанк B: Заголовок</tspan><tspan x="570.0" dy="13.0">prev_size (8B) | size (8B)</tspan><tspan x="570.0" dy="13.0">fd (8B) | bk (8B) [якщо free]</tspan></text>
<rect x="680.0" y="111.0" width="160.0" height="48.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Чанк B: Дані / Free Body</tspan><tspan x="760.0" dy="13.0">Корисне навантаження або</tspan><tspan x="760.0" dy="13.0">вузол зв'язного списку</tspan></text>
<line x1="450.0" y1="135.0" x2="480.0" y2="135.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="237.0" y="194.5" width="426.0" height="21.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Переповнення з чанка A руйнує метадані чанка B (size, fd, bk)</tspan></text>
<rect x="40.0" y="265.0" width="820.0" height="235.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="450.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Механізм перевірки Safe Unlinking під час злиття блоків</text>
<rect x="60.0" y="323.6" width="360.0" height="112.8" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Класичний Unlink (вразливий):</tspan><tspan x="240.0" dy="14.3">P-&gt;fd-&gt;bk = P-&gt;bk;</tspan><tspan x="240.0" dy="14.3">P-&gt;bk-&gt;fd = P-&gt;fd;</tspan><tspan x="240.0" dy="14.3"></tspan><tspan x="240.0" dy="14.3">Дозволяв довільний запис</tspan><tspan x="240.0" dy="14.3">(Arbitrary Write / Write-What-Where)</tspan><tspan x="240.0" dy="14.3">за адресою, підробленою в fd/bk</tspan></text>
<rect x="455.0" y="330.8" width="390.0" height="98.5" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="348.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Безпечний Unlink (Safe Unlinking):</tspan><tspan x="650.0" dy="14.3">if (P-&gt;fd-&gt;bk != P || P-&gt;bk-&gt;fd != P)</tspan><tspan x="650.0" dy="14.3">    malloc_printerr(&quot;corrupted double-linked list&quot;);</tspan><tspan x="650.0" dy="14.3"></tspan><tspan x="650.0" dy="14.3">Перевіряє двоспрямовану цілісність списку!</tspan><tspan x="650.0" dy="14.3">Зламані покажчики викликають негайний аварійний abort()</tspan></text>
</svg>