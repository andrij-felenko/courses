<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм захисту стека канаркою (Stack Smashing Protector / SSP)</text>
<rect x="30.0" y="65.0" width="260.0" height="400.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="160.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1. Пролог функції</text>
<text x="160.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Встановлення вартового)</text>
<rect x="45.0" y="137.2" width="230.0" height="55.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Регістр сегмента TLS</tspan><tspan x="160.0" dy="14.3">%fs:0x28 (x86-64)</tspan><tspan x="160.0" dy="14.3">[Випадкове значення з ядра]</tspan></text>
<rect x="45.0" y="225.1" width="230.0" height="69.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Команда компілятора:</tspan><tspan x="160.0" dy="14.3">mov %fs:0x28, %rax</tspan><tspan x="160.0" dy="14.3">mov %rax, -0x8(%rbp)</tspan><tspan x="160.0" dy="14.3">xor %eax, %eax</tspan></text>
<rect x="45.0" y="347.2" width="230.0" height="55.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Канарка зберігається на стеку</tspan><tspan x="160.0" dy="14.3">між локальними змінними</tspan><tspan x="160.0" dy="14.3">та збереженим Saved RBP</tspan></text>
<line x1="160.0" y1="205.0" x2="160.0" y2="225.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="160.0" y1="315.0" x2="160.0" y2="335.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="320.0" y="65.0" width="260.0" height="400.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="450.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">2. Спроба атаки</text>
<text x="450.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">(Переповнення буфера)</text>
<rect x="335.0" y="137.2" width="230.0" height="55.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Виклик небезпечної функції</tspan><tspan x="450.0" dy="14.3">strcpy(buf, payload)</tspan><tspan x="450.0" dy="14.3">[Довжина &gt; розміру buf]</tspan></text>
<rect x="322.6" y="230.1" width="254.7" height="69.9" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="247.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Пейлоад перетирає пам'ять:</tspan><tspan x="450.0" dy="14.3">[buf] -&gt; [CANARY] -&gt; [RBP] -&gt; [RIP]</tspan><tspan x="450.0" dy="14.3">Канарку спотворено:</tspan><tspan x="450.0" dy="14.3">0x4141414141414141</tspan></text>
<rect x="335.0" y="347.2" width="230.0" height="55.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Зловмисник не знає 64-біт</tspan><tspan x="450.0" dy="14.3">випадкового значення канарки</tspan><tspan x="450.0" dy="14.3">перший байт є нульовим (0x00)</tspan></text>
<line x1="450.0" y1="210.0" x2="450.0" y2="225.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450.0" y1="320.0" x2="450.0" y2="340.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="610.0" y="65.0" width="260.0" height="400.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="740.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">3. Епілог функції</text>
<text x="740.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Звірення вартового)</text>
<rect x="625.0" y="125.0" width="230.0" height="69.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Звірення значення:</tspan><tspan x="740.0" dy="14.3">mov -0x8(%rbp), %rax</tspan><tspan x="740.0" dy="14.3">xor %fs:0x28, %rax</tspan><tspan x="740.0" dy="14.3">je .L_normal_ret</tspan></text>
<rect x="625.0" y="246.3" width="230.0" height="37.3" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Рівні (XOR == 0):</tspan><tspan x="740.0" dy="14.3">Безпечний вихід через ret</tspan></text>
<rect x="625.0" y="340.1" width="230.0" height="69.9" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="357.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Нерівні (XOR != 0):</tspan><tspan x="740.0" dy="14.3">Виклик __stack_chk_fail()</tspan><tspan x="740.0" dy="14.3">Аварійна зупинка SIGABRT!</tspan><tspan x="740.0" dy="14.3">Експлуатація зірвана</tspan></text>
<line x1="740.0" y1="210.0" x2="740.0" y2="240.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="740.0" y1="295.0" x2="740.0" y2="335.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="290.0" y1="260.0" x2="320.0" y2="260.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580.0" y1="260.0" x2="610.0" y2="260.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>