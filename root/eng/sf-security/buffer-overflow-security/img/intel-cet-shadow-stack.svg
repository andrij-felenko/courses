<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний тіньовий стек (Intel CET / ARM Shadow Stack)</text>
<rect x="40.0" y="60.0" width="370.0" height="360.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="225.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Стек даних програми (RSP)</text>
<text x="225.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Доступний на читання й запис процесу)</text>
<rect x="65.0" y="134.3" width="320.0" height="41.3" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Локальні змінні та буфери</tspan><tspan x="225.0" dy="14.3">(char buf[64])</tspan></text>
<rect x="65.0" y="222.2" width="320.0" height="55.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="239.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Перезаписана адреса повернення:</tspan><tspan x="225.0" dy="14.3">[0x00007ffff7de1234 -&gt; ROP gadget]</tspan><tspan x="225.0" dy="14.3">Підмінена атакуючим через переповнення!</tspan></text>
<rect x="65.0" y="339.4" width="320.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Інструкція RET зчитує адресу:</tspan><tspan x="225.0" dy="14.3">pop %rip -&gt; 0x7ffff7de1234</tspan></text>
<rect x="490.0" y="60.0" width="370.0" height="360.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="675.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Апаратний тіньовий стек (SSP)</text>
<text x="675.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Захищений MMU: звичайний запис заборонено)</text>
<rect x="515.0" y="127.2" width="320.0" height="55.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Мікрокод CPU при інструкції CALL:</tspan><tspan x="675.0" dy="14.3">Автоматично записує оригінальний RIP</tspan><tspan x="675.0" dy="14.3">у захищену пам'ять Shadow Stack</tspan></text>
<rect x="515.0" y="222.2" width="320.0" height="55.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="239.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Оригінальна адреса повернення:</tspan><tspan x="675.0" dy="14.3">[0x0000555555555189 -&gt; main+45]</tspan><tspan x="675.0" dy="14.3">НЕДОСЯЖНА для переповнення буфера!</tspan></text>
<rect x="515.0" y="339.4" width="320.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Інструкція RET зчитує з тіньового стека:</tspan><tspan x="675.0" dy="14.3">shadow_rip -&gt; 0x555555555189</tspan></text>
<rect x="125.0" y="451.5" width="650.0" height="27.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="468.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Апаратне порівняння CPU: data_rip != shadow_rip -&gt; Виняток #CP (Control Protection Fault)</tspan></text>
<line x1="225.0" y1="395.0" x2="350.0" y2="445.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="675.0" y1="395.0" x2="550.0" y2="445.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>