<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1013.7 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1013.7" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому TOTP вразливий до фішинг-проксі, а FIDO2/WebAuthn зупиняє їх підписом походження</text>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Вразливість TOTP/SMS: Фішинг-посередник (Adversary-in-the-Middle)</text>
<rect x="80.2" y="73.2" width="159.6" height="43.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Користувач</tspan><tspan x="160.0" dy="15.6">вводить пароль і TOTP</tspan></text>
<line x1="240.0" y1="95.0" x2="357.5" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="363.5" y="63.4" width="273.1" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Фішинговий сайт (evil-login.com)</tspan><tspan x="500.0" dy="15.6">Перехоплює пароль і TOTP</tspan><tspan x="500.0" dy="15.6">і миттєво пересилає на справжній сайт</tspan></text>
<line x1="642.5" y1="95.0" x2="760.0" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="756.8" y="65.4" width="166.5" height="59.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="840.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Справжній сервер</tspan><tspan x="840.0" dy="15.6">Приймає валідний TOTP</tspan><tspan x="840.0" dy="15.6">і віддає сесію хакеру!</tspan></text>
<line x1="50.0" y1="175.0" x2="950.0" y2="175.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="500.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Захист FIDO2/Passkeys: Криптографічна прив'язка до домену (Origin Binding)</text>
<rect x="69.9" y="265.4" width="180.2" height="59.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Браузер користувача</tspan><tspan x="160.0" dy="15.6">на домені evil-login.com</tspan><tspan x="160.0" dy="15.6">передає origin у ключ</tspan></text>
<line x1="240.0" y1="295.0" x2="354.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="263.4" width="279.9" height="63.2" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Апаратний ключ / Passkey</tspan><tspan x="500.0" dy="15.6">Підписує challenge разом із</tspan><tspan x="500.0" dy="15.6">хешем домену: SHA256(&quot;evil-login.com&quot;)</tspan></text>
<line x1="646.0" y1="295.0" x2="760.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="686.4" y="263.4" width="307.3" height="63.2" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="840.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Справжній сервер (bank.com)</tspan><tspan x="840.0" dy="15.6">Звіряє RP ID у підписі:</tspan><tspan x="840.0" dy="15.6">&quot;evil-login.com&quot; != &quot;bank.com&quot; → ВІДХИЛЕНО</tspan></text>
</svg>