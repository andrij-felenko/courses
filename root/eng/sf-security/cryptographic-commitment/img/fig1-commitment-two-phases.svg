<rect x="67.1" y="337.9" width="195.8" height="44.1" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="165.0" y="356.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Сума входів: C_in = C₁ · C₂</tspan><tspan x="165.0" dy="13.7">C_in = g⁸⁰ · hʳ¹⁺ʳ² mod p</tspan></text>
