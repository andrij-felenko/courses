<rect x="95.2" y="137.9" width="139.7" height="44.1" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="165.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Вхід 1: v₁ = 50, r₁</tspan><tspan x="165.0" dy="13.7">C₁ = g⁵⁰ · hʳ¹ mod p</tspan></text>
