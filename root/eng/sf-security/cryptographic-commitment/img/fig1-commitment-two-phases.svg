<rect x="435.1" y="137.9" width="139.7" height="44.1" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="505.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Вихід 1: v₃ = 70, r₃</tspan><tspan x="505.0" dy="13.7">C₃ = g⁷⁰ · hʳ³ mod p</tspan></text>
<text x="505.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#333333" text-anchor="middle" font-weight="700">+</text>
<rect x="405.2" y="247.9" width="199.5" height="44.1" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="505.0" y="266.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Комісія: v_fee = 10, r_fee = 0</tspan><tspan x="505.0" dy="13.7">C_fee = g¹⁰ mod p</tspan></text>
<rect x="390.8" y="337.9" width="228.3" height="44.1" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="505.0" y="356.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">Сума виходів: C_out = C₃ · C_fee</tspan><tspan x="505.0" dy="13.7">C_out = g⁸⁰ · hʳ³ mod p</tspan></text>
<rect x="660.0" y="75.0" width="250.0" height="335.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="785.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">Перевірка балансу</text>
<rect x="690.4" y="157.9" width="189.3" height="44.1" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="785.0" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">За умови: r₁ + r₂ = r₃</tspan><tspan x="785.0" dy="13.7">C_in / C_out = g⁰ · h⁰ = 1</tspan></text>
<rect x="685.1" y="272.0" width="199.8" height="56.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="785.0" y="290.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Верифікація збереження маси:</tspan><tspan x="785.0" dy="13.0">∑ v_in = ∑ v_out + fee</tspan><tspan x="785.0" dy="13.0">БЕЗ розголошення значень v_i!</tspan></text>
