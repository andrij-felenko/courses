<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">регістр рухається лише вперед: PCR ← H(PCR ‖ запис)</text>
<rect x="90.0" y="110.0" width="250.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="154.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">PCR = 000…0</tspan><tspan x="215.0" dy="16.9">порожній старт</tspan></text>
<rect x="405.0" y="110.0" width="250.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="154.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">PCR = H(000…0 ‖ A)</tspan><tspan x="530.0" dy="16.9">після запису A</tspan></text>
<line x1="340.0" y1="158.0" x2="405.0" y2="158.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="110.0" width="250.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="845.0" y="154.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">PCR = H(попереднє ‖ B)</tspan><tspan x="845.0" dy="16.9">після запису B</tspan></text>
<line x1="655.0" y1="158.0" x2="720.0" y2="158.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1035.0" y="110.0" width="250.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1160.0" y="154.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1160.0" dy="0.0">PCR = H(попереднє ‖ C)</tspan><tspan x="1160.0" dy="16.9">після запису C</tspan></text>
<line x1="970.0" y1="158.0" x2="1035.0" y2="158.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="405.0" y="262.0" width="250.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="297.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">запис A</tspan><tspan x="530.0" dy="16.9">/init</tspan></text>
<line x1="530.0" y1="262.0" x2="530.0" y2="212.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="262.0" width="250.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="845.0" y="297.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">запис B</tspan><tspan x="845.0" dy="16.9">/usr/bin/bash</tspan></text>
<line x1="845.0" y1="262.0" x2="845.0" y2="212.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1035.0" y="262.0" width="250.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1160.0" y="297.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1160.0" dy="0.0">запис C</tspan><tspan x="1160.0" dy="16.9">/usr/lib/libc.so</tspan></text>
<line x1="1160.0" y1="262.0" x2="1160.0" y2="212.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="60.0" y1="386.0" x2="1300.0" y2="386.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7,6"/>
<text x="680.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">спроба прибрати запис B зі списку</text>
<rect x="90.0" y="470.0" width="560.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="370.0" y="522.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">у текстовому списку рядок B стерто:</tspan><tspan x="370.0" dy="16.9">залишилися лише A і C,</tspan><tspan x="370.0" dy="16.9">перерахунок дає H(H(000…0 ‖ A) ‖ C)</tspan></text>
<rect x="730.0" y="470.0" width="560.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1010.0" y="522.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">у чипі лежить H(H(H(000…0 ‖ A) ‖ B) ‖ C)</tspan><tspan x="1010.0" dy="16.9">і присвоїти йому інше значення нічим:</tspan><tspan x="1010.0" dy="16.9">операції «відняти запис» не існує</tspan></text>
<line x1="370.0" y1="600.0" x2="500.0" y2="646.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1010.0" y1="600.0" x2="880.0" y2="646.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="646.0" width="520.0" height="62.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="690.0" y="682.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">два числа не збігаються — підробку видно</tspan></text>
<rect x="90.0" y="730.0" width="1200.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="757.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">щоб підсумок збігся, довелося б підібрати прообраз хеша — саме цього криптографічна функція й не дозволяє</tspan></text>
</svg>