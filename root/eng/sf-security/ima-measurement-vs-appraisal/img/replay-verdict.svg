<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">один знімок регістра з чипа — і що з нього видно</text>
<rect x="350.0" y="76.0" width="700.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="115.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">перерахунок дає значення регістра після КОЖНОГО запису</tspan></text>
<line x1="700.0" y1="146.0" x2="700.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="190.0" width="700.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="700.0" y="230.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">чи є знімок із чипа серед цих значень?</tspan></text>
<line x1="700.0" y1="260.0" x2="700.0" y2="300.0" stroke="#333333" stroke-width="1.8"/>
<line x1="230.0" y1="300.0" x2="1170.0" y2="300.0" stroke="#333333" stroke-width="1.8"/>
<line x1="230.0" y1="300.0" x2="230.0" y2="344.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="300.0" x2="700.0" y2="344.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1170.0" y1="300.0" x2="1170.0" y2="344.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="344.0" width="380.0" height="60.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">збіг на останньому</tspan></text>
<rect x="40.0" y="414.0" width="380.0" height="100.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="460.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">усю історію підтверджено чипом:</tspan><tspan x="230.0" dy="16.9">список справжній до останнього рядка</tspan></text>
<rect x="510.0" y="344.0" width="380.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">збіг раніше</tspan></text>
<rect x="510.0" y="414.0" width="380.0" height="100.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="460.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">після знімка дописалися нові рядки;</tspan><tspan x="700.0" dy="16.9">довіряти можна лише частині до місця збігу</tspan></text>
<rect x="980.0" y="344.0" width="380.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1170.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1170.0" dy="0.0">збігу немає</tspan></text>
<rect x="980.0" y="414.0" width="380.0" height="100.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="1170.0" y="460.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1170.0" dy="0.0">журнал і чип розійшлися;</tspan><tspan x="1170.0" dy="16.9">далі питання одне — де саме</tspan></text>
<line x1="1170.0" y1="514.0" x2="1170.0" y2="560.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="980.0" y="560.0" width="380.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1170.0" y="602.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1170.0" dy="0.0">якийсь запис не сходиться</tspan><tspan x="1170.0" dy="16.9">сам із собою —</tspan><tspan x="1170.0" dy="16.9">ось точний рядок</tspan></text>
<line x1="1170.0" y1="670.0" x2="1170.0" y2="712.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="980.0" y="712.0" width="380.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1170.0" y="754.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1170.0" dy="0.0">усі записи цілі — рядок вилучено</tspan><tspan x="1170.0" dy="16.9">чи переставлено; одного знімка мало,</tspan><tspan x="1170.0" dy="16.9">потрібна попередня контрольна точка</tspan></text>
<rect x="40.0" y="610.0" width="850.0" height="110.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="465.0" y="652.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">збіг не означає «система в порядку»:</tspan><tspan x="465.0" dy="16.9">він доводить лише, що список справжній.</tspan><tspan x="465.0" dy="16.9">Чи дозволені в ньому файли — окреме питання до переліку еталонів</tspan></text>
</svg>