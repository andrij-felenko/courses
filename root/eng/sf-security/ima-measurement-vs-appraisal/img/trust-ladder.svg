<rect x="500.0" y="450.0" width="680.0" height="76.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="840.0" y="492.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">довірений ключ, який розпечатує TPM; на диску його немає</tspan></text>
