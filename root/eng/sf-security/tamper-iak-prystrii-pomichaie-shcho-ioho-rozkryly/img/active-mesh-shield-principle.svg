<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип роботи динамічної активної захисної сітки (Active Mesh Shield)</text>
<rect x="40.0" y="60.0" width="240.0" height="440.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="160.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Контролер тампера</text>
<text x="160.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(Апаратний домен VBAT)</text>
<rect x="60.0" y="135.0" width="200.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Генератор LFSR</tspan><tspan x="160.0" dy="14.3">Псевдовипадковий бітовий</tspan><tspan x="160.0" dy="14.3">потік із регулярною зміною</tspan></text>
<rect x="60.0" y="230.0" width="200.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="254.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Виходи TAMP_OUT1/2</tspan><tspan x="160.0" dy="14.3">Два взаємно інверсні або</tspan><tspan x="160.0" dy="14.3">зсунуті в часі сигнали</tspan></text>
<rect x="60.0" y="320.0" width="200.0" height="70.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="160.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Входи TAMP_IN1/2</tspan><tspan x="160.0" dy="13.0">Порівняння отриманого біта</tspan><tspan x="160.0" dy="13.0">з очікуваним у поточному такті</tspan></text>
<rect x="60.0" y="410.0" width="200.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="434.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Модуль рішень</tspan><tspan x="160.0" dy="14.3">Миттєвий тригер зероїзації</tspan><tspan x="160.0" dy="14.3">при будь-якому незбігу</tspan></text>
<rect x="320.0" y="60.0" width="400.0" height="440.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<text x="520.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захисна сітка (PCB / Flex Mesh)</text>
<text x="520.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Переплетені мікродоріжки 50–100 мкм у шарах плати</text>
<line x1="350.0" y1="160.0" x2="690.0" y2="160.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="690.0" y1="160.0" x2="690.0" y2="200.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="690.0" y1="200.0" x2="350.0" y2="200.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="350.0" y1="200.0" x2="350.0" y2="240.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="350.0" y1="240.0" x2="690.0" y2="240.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="350.0" y1="270.0" x2="690.0" y2="270.0" stroke="#d97706" stroke-width="3.0" stroke-dasharray="4,4"/>
<line x1="690.0" y1="270.0" x2="690.0" y2="310.0" stroke="#d97706" stroke-width="3.0" stroke-dasharray="4,4"/>
<line x1="690.0" y1="310.0" x2="350.0" y2="310.0" stroke="#d97706" stroke-width="3.0" stroke-dasharray="4,4"/>
<line x1="350.0" y1="310.0" x2="350.0" y2="350.0" stroke="#d97706" stroke-width="3.0" stroke-dasharray="4,4"/>
<line x1="350.0" y1="350.0" x2="690.0" y2="350.0" stroke="#d97706" stroke-width="3.0" stroke-dasharray="4,4"/>
<rect x="340.0" y="380.0" width="360.0" height="105.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="407.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Непроникний кокон:</tspan><tspan x="520.0" dy="14.3">Свердло перерізає лінію → Обрив</tspan><tspan x="520.0" dy="14.3">Голка перемикає сусідні лінії → Замикання A на B</tspan><tspan x="520.0" dy="14.3">Зонд заземлює доріжку → Замикання на GND</tspan><tspan x="520.0" dy="14.3">Шунтування неможливе: сигнал динамічний!</tspan></text>
<rect x="760.0" y="60.0" width="240.0" height="440.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="880.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Стани вторгнення</text>
<rect x="780.0" y="125.0" width="200.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="880.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">1. Обрив лінії (Open)</tspan><tspan x="880.0" dy="14.3">Перерізано доріжку свердлом;</tspan><tspan x="880.0" dy="14.3">сигнал не доходить до IN</tspan></text>
<rect x="780.0" y="215.0" width="200.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="880.0" y="239.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">2. Замикання на GND/VDD</tspan><tspan x="880.0" dy="14.3">Зонд або інструмент торкнувся</tspan><tspan x="880.0" dy="14.3">шини живлення чи землі</tspan></text>
<rect x="780.0" y="305.0" width="200.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="880.0" y="330.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">3. Міжлінійний міст</tspan><tspan x="880.0" dy="13.0">Спроба замкнути сусідні доріжки</tspan><tspan x="880.0" dy="13.0">струмопровідним клеєм</tspan></text>
<rect x="780.0" y="395.0" width="200.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="880.0" y="427.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">4. Незбіг шаблону (Mismatch)</tspan><tspan x="880.0" dy="14.3">Статичний потенціал замість</tspan><tspan x="880.0" dy="14.3">динамічного коду LFSR</tspan></text>
<line x1="260.0" y1="260.0" x2="320.0" y2="200.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="320.0" y1="340.0" x2="260.0" y2="350.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="720.0" y1="250.0" x2="760.0" y2="250.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
