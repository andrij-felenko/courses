<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектори фізичних атак та точки вторгнення в захищений пристрій</text>
<rect x="40.0" y="55.0" width="960.0" height="440.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="160.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Зовнішній корпус пристрою</text>
<rect x="80.0" y="110.0" width="200.0" height="165.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="180.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Механічне розкриття</text>
<rect x="90.0" y="152.0" width="180.0" height="113.0" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="1.5"/><text x="180.0" y="192.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Зняття кришки корпусу,</tspan><tspan x="180.0" dy="13.0">відкручування гвинтів.</tspan><tspan x="180.0" dy="13.0">Світло потрапляє всередину,</tspan><tspan x="180.0" dy="13.0">розмикаються контакти.</tspan></text>
<rect x="310.0" y="110.0" width="200.0" height="165.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="410.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Мікросвердління</text>
<rect x="320.0" y="152.0" width="180.0" height="113.0" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="1.5"/><text x="410.0" y="190.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Просвердлювання отвору</tspan><tspan x="410.0" dy="14.3">діаметром 0.5–1 мм для</tspan><tspan x="410.0" dy="14.3">введення мікрозондів до</tspan><tspan x="410.0" dy="14.3">внутрішніх шин Flash/RAM.</tspan></text>
<rect x="540.0" y="110.0" width="200.0" height="165.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="640.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Cold Boot (Заморозка)</text>
<rect x="550.0" y="152.0" width="180.0" height="113.0" rx="6" fill="#eaf0fd" stroke="#eaf0fd" stroke-width="1.5"/><text x="640.0" y="192.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Охолодження чипа спреєм</tspan><tspan x="640.0" dy="13.0">чи рідким азотом (&lt; -30°C).</tspan><tspan x="640.0" dy="13.0">Заряд у SRAM зберігається</tspan><tspan x="640.0" dy="13.0">секундами без живлення.</tspan></text>
<rect x="770.0" y="110.0" width="200.0" height="165.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="870.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Глітчинг живлення</text>
<rect x="780.0" y="152.0" width="180.0" height="113.0" rx="6" fill="#fef3c7" stroke="#fef3c7" stroke-width="1.5"/><text x="870.0" y="190.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Маніпуляція напругою VDD</tspan><tspan x="870.0" dy="14.3">та тактовою частотою.</tspan><tspan x="870.0" dy="14.3">Спроба пропустити команду</tspan><tspan x="870.0" dy="14.3">перевірки пароля/підпису.</tspan></text>
<rect x="80.0" y="310.0" width="890.0" height="160.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="525.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Захисний бар'єр: Сенсори + Активна сітка + Резервний домен MCU</text>
<rect x="100.0" y="360.0" width="190.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="195.0" y="401.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Оптичні фотодіоди та</tspan><tspan x="195.0" dy="14.3">мікроперемикачі NC/NO</tspan></text>
<rect x="325.0" y="360.0" width="190.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="420.0" y="401.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Активна сітка (Mesh)</tspan><tspan x="420.0" dy="14.3">з динамічним кодом LFSR</tspan></text>
<rect x="550.0" y="360.0" width="190.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="645.0" y="401.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Температурний монітор</tspan><tspan x="645.0" dy="14.3">(поріг &lt; -25°C і &gt; +105°C)</tspan></text>
<rect x="775.0" y="360.0" width="190.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="870.0" y="401.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Brownout-детектор та</tspan><tspan x="870.0" dy="14.3">апаратна зероїзація</tspan></text>
</svg>