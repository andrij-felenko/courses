<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура ізольованого апаратного домену тампера та зероїзації в MCU</text>
<rect x="40.0" y="60.0" width="360.0" height="440.0" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
<text x="220.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Основний системний домен (VDD)</text>
<text x="220.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Знеструмлюється при вимкненні пристрою</text>
<rect x="60.0" y="135.0" width="320.0" height="65.0" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="220.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Головне ядро CPU (ARM Cortex-M)</tspan><tspan x="220.0" dy="14.3">Виконує прикладну прошивку,</tspan><tspan x="220.0" dy="14.3">стек протоколів та бізнес-логіку</tspan></text>
<rect x="60.0" y="220.0" width="320.0" height="65.0" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="220.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Системна пам'ять (SRAM / Flash)</tspan><tspan x="220.0" dy="14.3">Містить оперативні дані,</tspan><tspan x="220.0" dy="14.3">буфери ключів та стек</tspan></text>
<rect x="60.0" y="305.0" width="320.0" height="65.0" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="220.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Криптоприскорювач (AES / PKA)</tspan><tspan x="220.0" dy="14.3">Апаратні регістри ключів шифрування</tspan><tspan x="220.0" dy="14.3">та модуль розрахунку підписів</tspan></text>
<rect x="60.0" y="390.0" width="320.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Шина керування та переривань</tspan><tspan x="220.0" dy="14.3">При тривозі отримує сигнал Tamper NMI</tspan><tspan x="220.0" dy="14.3">для екстреного очищення CPU RAM</tspan></text>
<rect x="440.0" y="60.0" width="580.0" height="440.0" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2.0"/>
<text x="730.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8b5cf6" text-anchor="middle" font-weight="700">Резервний домен безпеки (VBAT — Батарейка RTC)</text>
<text x="730.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8b5cf6" text-anchor="middle" font-style="italic">Активний 24/7/365, споживання &lt; 500 нА навіть без основного живлення</text>
<rect x="465.0" y="135.0" width="250.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Контролер тампера (TAMP)</tspan><tspan x="590.0" dy="14.3">• Активна сітка LFSR</tspan><tspan x="590.0" dy="14.3">• Пасивні входи (NC/NO)</tspan><tspan x="590.0" dy="14.3">• Цифровий фільтр брязкоту</tspan></text>
<rect x="745.0" y="135.0" width="250.0" height="75.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="870.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Сенсори середовища</tspan><tspan x="870.0" dy="14.3">• Монітор темряви (Light)</tspan><tspan x="870.0" dy="14.3">• Датчик холоду (&lt; -25°C)</tspan><tspan x="870.0" dy="14.3">• Brownout-детектор VBAT</tspan></text>
<rect x="465.0" y="235.0" width="530.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Шина миттєвої апаратної зероїзації (Hardware Zeroization Bus)</tspan><tspan x="730.0" dy="15.6">Асинхронний комбінаційний сигнал скидання: діє за наносекунди</tspan><tspan x="730.0" dy="15.6">без участі CPU, тактового генератора ядра та Flash-пам'яті!</tspan></text>
<rect x="465.0" y="350.0" width="250.0" height="130.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="390.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Резервні регістри BKP SRAM</tspan><tspan x="590.0" dy="14.3">Зберігають майстер-ключі (Root Keys),</tspan><tspan x="590.0" dy="14.3">вектори ініціалізації та лічильники.</tspan><tspan x="590.0" dy="14.3">При тривозі: апаратний розряд</tspan><tspan x="590.0" dy="14.3">комірок у нуль за лічені наносекунди</tspan></text>
<rect x="745.0" y="350.0" width="250.0" height="130.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="390.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Модуль фіксації вторгнення</tspan><tspan x="870.0" dy="14.3">• Запис незмивного прапорця TAMPF</tspan><tspan x="870.0" dy="14.3">• Фіксація штампа часу RTC</tspan><tspan x="870.0" dy="14.3">• Вічне блокування криптомодуля</tspan><tspan x="870.0" dy="14.3">(Tamper Lockout / Bricking)</tspan></text>
<line x1="465.0" y1="280.0" x2="380.0" y2="280.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="465.0" y1="280.0" x2="380.0" y2="340.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
</svg>