<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Криптографічні конвеєри генерації ключів: Legacy проти LESC</text>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння криптографічних конвеєрів генерації ключів BLE</text>
<rect x="30.0" y="45.0" width="375.0" height="415.0" rx="6" fill="#fffaf8" stroke="#c0392b" stroke-width="1.5"/>
<text x="217.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">LE Legacy Pairing (Bluetooth 4.0/4.1)</text>
<rect x="47.0" y="90.7" width="340.0" height="58.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="217.0" y="104.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="217.0" dy="0.0">1. Тимчасовий ключ TK (128 біт)</tspan><tspan x="217.0" dy="12.3">• Just Works: TK = 0</tspan><tspan x="217.0" dy="12.3">• Passkey: TK = PIN (000000..999999)</tspan><tspan x="217.0" dy="12.3">• OOB: передача через зовнішній канал</tspan></text>
<line x1="217.0" y1="155.0" x2="217.0" y2="175.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="47.0" y="180.7" width="340.0" height="58.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="217.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="217.0" dy="0.0">2. Підтвердження автентичності (c1)</tspan><tspan x="217.0" dy="12.3">• Mconfirm = c1(TK, Mrand, PairingCmds, ...)</tspan><tspan x="217.0" dy="12.3">• Sconfirm = c1(TK, Srand, PairingCmds, ...)</tspan><tspan x="217.0" dy="12.3">• Обмін Mconfirm, Sconfirm, Mrand, Srand в ефірі</tspan></text>
<line x1="217.0" y1="250.0" x2="217.0" y2="270.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="47.0" y="281.9" width="340.0" height="46.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="217.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="217.0" dy="0.0">3. Обчислення короткострокового ключа (s1)</tspan><tspan x="217.0" dy="12.3">STK = s1(TK, Srand, Mrand) = AES-128_TK(Srand || Mrand)</tspan><tspan x="217.0" dy="12.3">• STK використовується для шифрування каналу Link Layer</tspan></text>
<line x1="217.0" y1="345.0" x2="217.0" y2="365.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="47.0" y="375.7" width="340.0" height="58.5" rx="6" fill="#feebe8" stroke="#c0392b" stroke-width="1.4"/><text x="217.0" y="389.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="217.0" dy="0.0">4. Розподіл LTK (Phase 3)</tspan><tspan x="217.0" dy="12.3">• LTK генерується і передається через радіоефір,</tspan><tspan x="217.0" dy="12.3">  зашифрований за допомогою STK.</tspan><tspan x="217.0" dy="12.3">⚠ Вразливий до повного зламу при перехопленні!</tspan></text>
<rect x="435.0" y="45.0" width="375.0" height="415.0" rx="6" fill="#f6fcf8" stroke="#27ae60" stroke-width="1.5"/>
<text x="622.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">LE Secure Connections (Bluetooth 4.2+)</text>
<rect x="452.0" y="90.7" width="340.0" height="58.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="622.0" y="104.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.0" dy="0.0">1. Протокол Діффі-Геллмана ECDH P-256</tspan><tspan x="622.0" dy="12.3">• Кожен генерує пару (SK_a, PK_a) та (SK_b, PK_b)</tspan><tspan x="622.0" dy="12.3">• Відкритий обмін публічними ключами PK_a, PKb</tspan><tspan x="622.0" dy="12.3">• Спільний секрет: DHKey = ECDH(SK_local, PK_peer)</tspan></text>
<line x1="622.0" y1="155.0" x2="622.0" y2="175.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="452.0" y="180.7" width="340.0" height="58.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="622.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.0" dy="0.0">2. Автентифікація через AES-CMAC (f4 / g2)</tspan><tspan x="622.0" dy="12.3">• f4(PK_a, PK_b, Na, Nb) — підтвердження</tspan><tspan x="622.0" dy="12.3">• g2(PK_a, PK_b, Na, Nb) mod 10^6 — 6-значний код</tspan><tspan x="622.0" dy="12.3">  для перевірки Numeric Comparison на дисплеях</tspan></text>
<line x1="622.0" y1="250.0" x2="622.0" y2="270.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="452.0" y="275.7" width="340.0" height="58.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="622.0" y="289.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.0" dy="0.0">3. Генерація ключів через f5 (KDF)</tspan><tspan x="622.0" dy="12.3">(MacKey, LTK) = f5(DHKey, Na, Nb, AddrA, AddrB)</tspan><tspan x="622.0" dy="12.3">• MacKey використовується для перевірки f6 (DHKey Check)</tspan><tspan x="622.0" dy="12.3">• LTK генерується повністю автономно на обох вузлах!</tspan></text>
<line x1="622.0" y1="345.0" x2="622.0" y2="365.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="452.0" y="375.7" width="340.0" height="58.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="622.0" y="389.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="622.0" dy="0.0">4. Довгостроковий ключ LTK готовий</tspan><tspan x="622.0" dy="12.3">• LTK НІКОЛИ не передається радіоефіром!</tspan><tspan x="622.0" dy="12.3">• Стійкий проти пасивного підслуховування</tspan><tspan x="622.0" dy="12.3">• Захист від MITM за наявності дисплея або OOB</tspan></text>
</svg>