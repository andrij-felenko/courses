<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Декомпозиція та складові поверхні атаки системи</text>
<rect x="15.0" y="60.0" width="200.0" height="405.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="115.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">Джерела загрози</text>
<text x="115.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(Недовірені суб'єкти)</text>
<rect x="30.0" y="128.2" width="170.0" height="43.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="115.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Відкрита мережа</tspan><tspan x="115.0" dy="15.6">(HTTP / gRPC / DNS)</tspan></text>
<rect x="30.0" y="218.2" width="170.0" height="43.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="115.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Локальні користувачі</tspan><tspan x="115.0" dy="15.6">(CLI, файли, IPC)</tspan></text>
<rect x="30.0" y="308.2" width="170.0" height="43.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="115.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Зовнішні носії й шини</tspan><tspan x="115.0" dy="15.6">(USB, JTAG, порти)</tspan></text>
<rect x="30.0" y="393.2" width="170.0" height="43.6" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/><text x="115.0" y="411.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Сторонні залежності</tspan><tspan x="115.0" dy="15.6">(Supply Chain)</tspan></text>
<rect x="230.0" y="60.0" width="440.0" height="405.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="2.0"/>
<text x="450.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">ПОВЕРХНЯ АТАКИ (Attack Surface)</text>
<text x="450.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Сукупність усіх доступних точок входу, каналів та даних</text>
<rect x="255.0" y="124.3" width="390.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">1. Точки входу й виходу (Entry/Exit Points)</tspan><tspan x="450.0" dy="14.3">REST API, gRPC, CLI-аргументи, обробники сигналів</tspan></text>
<rect x="255.0" y="197.3" width="390.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="214.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">2. Канали передачі даних (Channels)</tspan><tspan x="450.0" dy="14.3">TCP/UDP порти, сокети Unix, черги повідомлень, IPC</tspan></text>
<rect x="255.0" y="269.4" width="390.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">3. Недовірені елементи даних (Untrusted Data Items)</tspan><tspan x="450.0" dy="14.3">Тіла запитів, JSON/XML, токени сесій, змінні оточення</tspan></text>
<rect x="255.0" y="341.4" width="390.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="358.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">4. Системні виклики та драйвери (Syscalls &amp; Drivers)</tspan><tspan x="450.0" dy="14.3">450+ викликів ядра Linux, IOCTL, прямі дескриптори</tspan></text>
<rect x="246.2" y="412.5" width="407.6" height="23.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="427.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Рівень привілеїв: Unauth → Auth User → Admin → Root/Kernel</tspan></text>
<rect x="685.0" y="60.0" width="200.0" height="405.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="785.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Захищені ресурси</text>
<text x="785.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(Цільові активи)</text>
<rect x="700.0" y="128.2" width="170.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Пам'ять процесу</tspan><tspan x="785.0" dy="15.6">і стан виконання</tspan></text>
<rect x="700.0" y="218.2" width="170.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Бази даних та</tspan><tspan x="785.0" dy="15.6">файлове сховище</tspan></text>
<rect x="700.0" y="308.2" width="170.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Криптографічні ключі</tspan><tspan x="785.0" dy="15.6">й паролі доступу</tspan></text>
<rect x="700.0" y="393.2" width="170.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="411.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Привілеї ОС</tspan><tspan x="785.0" dy="15.6">(Root / Ring 0)</tspan></text>
