<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910.1 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910.1" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири стратегії мінімізації поверхні атаки</text>
<rect x="27.0" y="70.0" width="196.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="125.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ВИМКНЕННЯ ЕКСПОЗИЦІЇ</text>
<rect x="7.0" y="147.4" width="236.0" height="145.2" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/><text x="125.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">1. Заборона за дефолтом</tspan><tspan x="125.0" dy="15.6">(Default Deny)</tspan><tspan x="125.0" dy="15.6"></tspan><tspan x="125.0" dy="15.6">• Закриті порти за дефолтом</tspan><tspan x="125.0" dy="15.6">• Прив'язка до 127.0.0.1</tspan><tspan x="125.0" dy="15.6">• Вимкнення legacy-протоколів</tspan><tspan x="125.0" dy="15.6">• Зняття налагоджувальних ручок</tspan><tspan x="125.0" dy="15.6">• Суворий білий список входів</tspan></text>
<rect x="237.0" y="70.0" width="196.0" height="32.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="335.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">КОМПАРТМЕНТАЛІЗАЦІЯ</text>
<rect x="203.3" y="147.4" width="263.4" height="145.2" rx="6" fill="#f8fafc" stroke="#7e22ce" stroke-width="1.5"/><text x="335.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">2. Розподіл привілеїв</tspan><tspan x="335.0" dy="15.6">(Privilege Separation)</tspan><tspan x="335.0" dy="15.6"></tspan><tspan x="335.0" dy="15.6">• Відокремлення парсера від ядра</tspan><tspan x="335.0" dy="15.6">• Непривілейовані воркери</tspan><tspan x="335.0" dy="15.6">• Drop capabilities (setresuid)</tspan><tspan x="335.0" dy="15.6">• Ізоляція просторів імен (unshare)</tspan><tspan x="335.0" dy="15.6">• Вузький IPC замість моноліту</tspan></text>
<rect x="447.0" y="70.0" width="196.0" height="32.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="545.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">САНДБОКСИНГ СИСТЕМНИХ ВИКЛИКІВ</text>
<rect x="420.1" y="147.4" width="249.7" height="145.2" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">3. Звуження API ядра</tspan><tspan x="545.0" dy="15.6">(Syscall Constriction)</tspan><tspan x="545.0" dy="15.6"></tspan><tspan x="545.0" dy="15.6">• Seccomp-BPF фільтрація</tspan><tspan x="545.0" dy="15.6">• Заборона execve, ptrace, socket</tspan><tspan x="545.0" dy="15.6">• OpenBSD pledge() та unveil()</tspan><tspan x="545.0" dy="15.6">• Landlock LSM обмеження ФС</tspan><tspan x="545.0" dy="15.6">• Зниження з 450+ до 15 викликів</tspan></text>
<rect x="657.0" y="70.0" width="196.0" height="32.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="755.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">УСУНЕННЯ ЗАЙВОГО КОДУ</text>
<rect x="619.9" y="147.4" width="270.2" height="145.2" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/><text x="755.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">4. Очищення залежностей</tspan><tspan x="755.0" dy="15.6">(Code &amp; Supply Shedding)</tspan><tspan x="755.0" dy="15.6"></tspan><tspan x="755.0" dy="15.6">• Dead code stripping (-Wl,--gc-sec)</tspan><tspan x="755.0" dy="15.6">• Link-Time Optimization (LTO)</tspan><tspan x="755.0" dy="15.6">• Відмова від небезпечних парсерів</tspan><tspan x="755.0" dy="15.6">• Скорочення сторонніх пакетів</tspan><tspan x="755.0" dy="15.6">• Типізовані схеми (Protobuf/TLV)</tspan></text>
</svg>