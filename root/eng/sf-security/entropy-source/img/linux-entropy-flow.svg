<rect x="28.8" y="53.5" width="162.5" height="43.0" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="110.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Таймінги переривань (IRQ)</tspan><tspan x="110.0" dy="13.0">та дискових операцій</tspan></text>
<rect x="25.9" y="103.5" width="168.2" height="43.0" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="110.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Ввід користувача</tspan><tspan x="110.0" dy="13.0">(клавіатура, миша, тачпад)</tspan></text>
<rect x="30.0" y="153.5" width="160.0" height="43.0" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="110.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Апаратний CPU джиттер</tspan><tspan x="110.0" dy="13.0">та RDRAND / RDSEED / TPM</tspan></text>
