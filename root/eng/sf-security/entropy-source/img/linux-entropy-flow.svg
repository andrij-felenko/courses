<rect x="450.0" y="88.0" width="150.0" height="73.9" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/><text x="525.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Головний CRNG</tspan><tspan x="525.0" dy="14.3">(ChaCha20 стан)</tspan><tspan x="525.0" dy="14.3">crng_ready() = true</tspan><tspan x="525.0" dy="14.3">Fast Key Erasure</tspan></text>
