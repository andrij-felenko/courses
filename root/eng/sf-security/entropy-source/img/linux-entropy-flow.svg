<rect x="659.9" y="103.5" width="150.2" height="43.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="735.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">getentropy(3)</tspan><tspan x="735.0" dy="13.0">безпечний виклик libc</tspan></text>
<rect x="650.6" y="153.5" width="168.8" height="43.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="735.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">/dev/urandom</tspan><tspan x="735.0" dy="13.0">/dev/random (Linux 5.6+)</tspan></text>
<rect x="80.0" y="249.5" width="680.0" height="31.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="420.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Стани crng_init: 0 (неініціалізовано) → 1 (перші 64 біти) → 2 (повна готовність, crng_ready)</tspan></text>
