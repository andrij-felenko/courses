<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичні механізми генерації ентропії в апаратних TRNG</text>
<rect x="10.0" y="10.0" width="820.0" height="340.0" rx="8" fill="#fbfcfd" stroke="#d1d5db" stroke-width="1.2"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фізичні джерела непередбачуваності в кремнії</text>
<rect x="25.0" y="60.0" width="385.0" height="130.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="217.5" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">1. Тепловий шум Джонсона—Найквіста</tspan><tspan x="217.5" dy="14.3">• Хаотичний броунівський рух електронів у резисторі</tspan><tspan x="217.5" dy="14.3">• Білий спектр, напруга V_n² = 4·k_B·T·R·Δf</tspan><tspan x="217.5" dy="14.3">• Працює завжди, не залежить від струму</tspan></text>
<rect x="430.0" y="60.0" width="385.0" height="130.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="622.5" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">2. Джиттер кільцевих генераторів (RO)</tspan><tspan x="622.5" dy="14.3">• Непарна кількість інверторів у замкненій петлі</tspan><tspan x="622.5" dy="14.3">• Фазовий шум накопичується на кожному фронті</tspan><tspan x="622.5" dy="14.3">• Відлік швидкого RO повільнішим тактом дає випадковий біт</tspan></text>
<rect x="25.0" y="205.0" width="385.0" height="130.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="217.5" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">3. Метастабільність бістабільних комірок</tspan><tspan x="217.5" dy="14.3">• Тригер виводиться на вістря рівноваги (V_in ≈ V_DD/2)</tspan><tspan x="217.5" dy="14.3">• Найменший тепловий флуктуаційний поштовх скочує в 0 чи 1</tspan><tspan x="217.5" dy="14.3">• Компактна цифрова реалізація всередині FPGA / ASIC</tspan></text>
<rect x="430.0" y="205.0" width="385.0" height="130.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="622.5" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">4. Лавинний та зенерівський пробій діода</tspan><tspan x="622.5" dy="14.3">• Зворотне зміщення p-n переходу вище напруги пробою</tspan><tspan x="622.5" dy="14.3">• Квантова ударна іонізація породжує мікроімпульси струму</tspan><tspan x="622.5" dy="14.3">• Велика амплітуда шуму, висока швидкість генерації бітів</tspan></text>
</svg>