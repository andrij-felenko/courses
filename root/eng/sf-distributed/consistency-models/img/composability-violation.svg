<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому лінеаризовність є композиційною, а послідовна консистентність — ні</text>
<rect x="40.0" y="60.0" width="470.0" height="420.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="275.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЛІНЕАРИЗОВНІСТЬ: Композиційна (Local)</text>
<text x="275.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Властивість локальності (Herlihy &amp; Wing, 1990)</text>
<rect x="60.0" y="125.0" width="430.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#c0392b" stroke-width="1.2"/><text x="275.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Теорема про локальність:</tspan><tspan x="275.0" dy="13.7">Історія виконання H над множиною об'єктів {x, y, z...}</tspan><tspan x="275.0" dy="13.7">є лінеаризовною тоді й лише тоді, коли проекція H|x</tspan><tspan x="275.0" dy="13.7">є лінеаризовною для кожного окремого об'єкта x.</tspan></text>
<rect x="60.0" y="220.0" width="430.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="275.0" y="251.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Практичний наслідок для інженера:</tspan><tspan x="275.0" dy="13.7">Можна розробити окремий лінеаризовний регістр X,</tspan><tspan x="275.0" dy="13.7">окремий лінеаризовний регістр Y і об'єднати їх у спільну систему.</tspan><tspan x="275.0" dy="13.7">Вся композитна система гарантовано залишиться лінеаризовною</tspan><tspan x="275.0" dy="13.7">без потреби в додатковій глобальній синхронізації між X та Y.</tspan></text>
<circle cx="110.0" cy="375.0" r="20.0" fill="#e8f6ee" stroke="#c0392b" stroke-width="2.0"/>
<text x="110.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">X</text>
<text x="155.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">+</text>
<circle cx="200.0" cy="375.0" r="20.0" fill="#e8f6ee" stroke="#c0392b" stroke-width="2.0"/>
<text x="200.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Y</text>
<text x="250.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">=</text>
<rect x="280.0" y="355.0" width="180.0" height="40.0" rx="6" fill="#e8f6ee" stroke="#c0392b" stroke-width="1.8"/>
<text x="370.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Лінеаризовна система</text>
<rect x="570.0" y="60.0" width="470.0" height="420.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="805.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ПОСЛІДОВНА КОНСИСТЕНТНІСТЬ: Некомпозиційна</text>
<text x="805.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Порушення композиції двох коректних підсистем</text>
<rect x="590.0" y="125.0" width="430.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="805.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Контрприклад взаємної несумісності:</tspan><tspan x="805.0" dy="13.7">Історія проекції H|x є послідовно консистентною.</tspan><tspan x="805.0" dy="13.7">Історія проекції H|y є послідовно консистентною.</tspan><tspan x="805.0" dy="13.7">Але спільна історія H над {x, y} НЕ є послідовно консистентною!</tspan></text>
<rect x="590.0" y="220.0" width="430.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="805.0" y="254.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Чому так відбувається:</tspan><tspan x="805.0" dy="11.7">Для об'єкта X існує валідна послідовність S_x (де Вузол 1 випереджає Вузол 2).</tspan><tspan x="805.0" dy="11.7">Для об'єкта Y існує валідна послідовність S_y (де Вузол 2 випереджає Вузол 1).</tspan><tspan x="805.0" dy="11.7">Неможливо знайти ЖОДНОГО єдиного глобального порядку S,</tspan><tspan x="805.0" dy="11.7">який би одночасно задовольнив вимоги порядку для обох об'єктів!</tspan></text>
<circle cx="640.0" cy="375.0" r="20.0" fill="#eaf0fd" stroke="#27ae60" stroke-width="2.0"/>
<text x="640.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">X</text>
<text x="685.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">+</text>
<circle cx="730.0" cy="375.0" r="20.0" fill="#eaf0fd" stroke="#27ae60" stroke-width="2.0"/>
<text x="730.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Y</text>
<text x="780.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">=</text>
<rect x="810.0" y="355.0" width="180.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="900.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">НЕ послідовна!</text>
<rect x="90.0" y="495.0" width="900.0" height="65.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.2"/><text x="540.0" y="524.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Інженерний висновок: Лінеаризовність дозволяє модульну композицію розподілених сервісів без глобального координатора.</tspan><tspan x="540.0" dy="13.7">Послідовна консистентність не масштабується модульно: композиція двох коректних сервісів може зламати глобальну консистентність.</tspan></text>
</svg>