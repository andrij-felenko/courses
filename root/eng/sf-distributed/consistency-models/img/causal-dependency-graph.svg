<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Причинна консистентність: відстеження зв'язків «спричинено раніше»</text>
<rect x="20.0" y="88.0" width="140.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="90.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Вузол 1</tspan><tspan x="90.0" dy="14.3">(Аліса)</tspan></text>
<line x1="180.0" y1="110.0" x2="1000.0" y2="110.0" stroke="#333333" stroke-width="1.5"/>
<rect x="20.0" y="208.0" width="140.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="90.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Вузол 2</tspan><tspan x="90.0" dy="14.3">(Боб)</tspan></text>
<line x1="180.0" y1="230.0" x2="1000.0" y2="230.0" stroke="#333333" stroke-width="1.5"/>
<rect x="20.0" y="328.0" width="140.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="90.0" y="346.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Вузол 3</tspan><tspan x="90.0" dy="14.3">(Керол)</tspan></text>
<line x1="180.0" y1="350.0" x2="1000.0" y2="350.0" stroke="#333333" stroke-width="1.5"/>
<circle cx="240.0" cy="110.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<rect x="155.4" y="56.5" width="169.2" height="31.0" rx="6" fill="#e8f6ee" stroke="#c0392b" stroke-width="1.2"/><text x="240.0" y="69.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">a = Write(&quot;Завтра свято!&quot;)</tspan><tspan x="240.0" dy="13.0">VC: [1, 0, 0]</tspan></text>
<line x1="245.0" y1="115.0" x2="435.0" y2="225.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3"/>
<line x1="425.0" y1="218.0" x2="440.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="440.0" cy="230.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<rect x="343.0" y="250.0" width="194.0" height="44.0" rx="6" fill="#e8f6ee" stroke="#c0392b" stroke-width="1.2"/><text x="440.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">b = Write(&quot;О котрій зустріч?&quot;)</tspan><tspan x="440.0" dy="13.0">спричинено подією 'a'!</tspan><tspan x="440.0" dy="13.0">VC: [1, 1, 0]</tspan></text>
<line x1="240.0" y1="120.0" x2="440.0" y2="220.0" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="360.0" cy="350.0" r="6.0" fill="#9b51e0" stroke="#9b51e0" stroke-width="2.0"/>
<rect x="250.6" y="368.0" width="218.8" height="44.0" rx="6" fill="#fff9db" stroke="#9b51e0" stroke-width="1.2"/><text x="360.0" y="380.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9b51e0" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">c = Write(&quot;Де мої ключі?&quot;)</tspan><tspan x="360.0" dy="13.0">конкурентна подія (c || a, c || b)</tspan><tspan x="360.0" dy="13.0">VC: [0, 0, 1]</tspan></text>
<line x1="450.0" y1="240.0" x2="760.0" y2="340.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="748.0" y1="332.0" x2="760.0" y2="345.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="745.0" y="332.0" width="30.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<rect x="729.0" y="272.9" width="222.0" height="44.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="840.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Отримано 'b', але VC[0]=0 &lt; 1!</tspan><tspan x="840.0" dy="12.3">'b' залежить від 'a', якої ще немає.</tspan><tspan x="840.0" dy="12.3">ПОДІЮ 'b' БУФЕРИЗОВАНО.</tspan></text>
<line x1="260.0" y1="120.0" x2="900.0" y2="340.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="888.0" y1="332.0" x2="900.0" y2="345.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="900.0" cy="350.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<rect x="755.5" y="372.0" width="289.0" height="46.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="900.0" y="385.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">Отримано 'a' (VC: [1,0,0]).</tspan><tspan x="900.0" dy="13.0">Доставляється 'a', потім розблоковується 'b'!</tspan><tspan x="900.0" dy="13.0">Порядок збережено: a → b.</tspan></text>
<rect x="80.0" y="465.0" width="920.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="540.0" y="492.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Правило причинної узгодженості (Causal Consistency):</tspan><tspan x="540.0" dy="14.3">1. Якщо a → b (подія b причинно залежить від a), жоден вузол не має права побачити b раніше за a.</tspan><tspan x="540.0" dy="14.3">2. Якщо a || c (події незалежні), різні вузли можуть бачити їх у довільному відносному порядку (a перед c або c перед a).</tspan></text>
</svg>