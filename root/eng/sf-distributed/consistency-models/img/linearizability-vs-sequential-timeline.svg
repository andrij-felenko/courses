<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінеаризовність проти Послідовної консистентності на часовій осі</text>
<rect x="40.0" y="60.0" width="480.0" height="480.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="280.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЛІНЕАРИЗОВНІСТЬ (Linearizability)</text>
<text x="280.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Фізичний час: якщо W1 завершився ДО початку R1, R1 зобов'язаний бачити W1</text>
<text x="75.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Вузол A</text>
<line x1="130.0" y1="170.0" x2="490.0" y2="170.0" stroke="#333333" stroke-width="1.5"/>
<text x="75.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Вузол B</text>
<line x1="130.0" y1="270.0" x2="490.0" y2="270.0" stroke="#333333" stroke-width="1.5"/>
<rect x="150.0" y="156.0" width="120.0" height="28.0" rx="4" fill="#e8f6ee" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Write(x, 1)</text>
<circle cx="222.0" cy="170.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="222.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">LP(W)</text>
<rect x="310.0" y="256.0" width="120.0" height="28.0" rx="4" fill="#e8f6ee" stroke="#c0392b" stroke-width="1.5"/>
<text x="370.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Read(x) -&gt; 1</text>
<circle cx="370.0" cy="270.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="370.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">LP(R)</text>
<line x1="270.0" y1="186.0" x2="270.0" y2="310.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="310.0" y1="145.0" x2="310.0" y2="254.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="274.0" y1="205.0" x2="306.0" y2="205.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="290.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Δt &gt; 0 (реальний час)</text>
<rect x="60.0" y="360.0" width="440.0" height="160.0" rx="6" fill="#e8f6ee" stroke="#c0392b" stroke-width="1.2"/><text x="280.0" y="423.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Глобальний порядок: Write(x, 1) → Read(x) -&gt; 1.</tspan><tspan x="280.0" dy="13.7">Оскільки Read почався після завершення Write у реальному часі,</tspan><tspan x="280.0" dy="13.7">повернення значення 0 було б грубим порушенням лінеаризовності.</tspan><tspan x="280.0" dy="13.7">Кожна операція здається миттєвою в точці лінеаризації (LP).</tspan></text>
<rect x="580.0" y="60.0" width="480.0" height="480.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="820.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПОСЛІДОВНА КОНСИСТЕНТНІСТЬ (Sequential)</text>
<text x="820.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Допускає затримку: існує порядок, спільний для всіх, що поважає локальний потік</text>
<text x="615.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Вузол A</text>
<line x1="670.0" y1="170.0" x2="1030.0" y2="170.0" stroke="#333333" stroke-width="1.5"/>
<text x="615.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Вузол B</text>
<line x1="670.0" y1="270.0" x2="1030.0" y2="270.0" stroke="#333333" stroke-width="1.5"/>
<rect x="690.0" y="156.0" width="120.0" height="28.0" rx="4" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.5"/>
<text x="750.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Write(x, 1)</text>
<rect x="850.0" y="256.0" width="120.0" height="28.0" rx="4" fill="#fff9db" stroke="#27ae60" stroke-width="1.5"/>
<text x="910.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Read(x) -&gt; 0</text>
<rect x="980.0" y="256.0" width="60.0" height="28.0" rx="4" fill="#e8f6ee" stroke="#c0392b" stroke-width="1.5"/>
<text x="1010.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">R(x)-&gt;1</text>
<rect x="600.0" y="360.0" width="440.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.2"/><text x="820.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Еквівалентний глобальний порядок:</tspan><tspan x="820.0" dy="13.7">Read(x) -&gt; 0  →  Write(x, 1)  →  Read(x) -&gt; 1.</tspan><tspan x="820.0" dy="13.7">Цей порядок є повністю легальним у послідовній консистентності,</tspan><tspan x="820.0" dy="13.7">оскільки він не порушує локальний порядок жодного з вузлів,</tspan><tspan x="820.0" dy="13.7">хоча у фізичному часі Write(x, 1) завершився раніше за перший Read!</tspan></text>
<rect x="100.0" y="560.0" width="900.0" height="95.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/><text x="550.0" y="597.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Головна відмінність: Лінеаризовність прив'язана до глобального стрілочного годинника (Global Real-Time Order),</tspan><tspan x="550.0" dy="13.7">тому застаріле читання після завершення запису є порушенням.</tspan><tspan x="550.0" dy="13.7">Послідовна консистентність вимагає лише існування єдиного логічного чергування (Total Order), що зберігає порядок операцій кожного процесу.</tspan></text>
</svg>