<rect x="330.0" y="50.0" width="295.0" height="350.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="340.0" y="60.0" width="275.0" height="32.0" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="477.5" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="477.5" dy="0.0">2. Отримання на вузлі P2</tspan></text>
<rect x="640.0" y="50.0" width="295.0" height="350.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="650.0" y="60.0" width="275.0" height="32.0" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="787.5" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="787.5" dy="0.0">3. Завершення знімка</tspan></text>
<circle cx="70.0" cy="150.0" r="22.0" fill="#e1f5fe" stroke="#27ae60" stroke-width="2.0"/>
<text x="70.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">P1</text>
<text x="70.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Стан P1 збережено</text>
