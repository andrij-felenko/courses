<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння динаміки епідемічного поширення: Push проти Pull</text>
<rect x="20.0" y="50.0" width="420.0" height="330.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="230.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динаміка частки охоплених вузлів (I/N)</text>
<line x1="65.0" y1="330.0" x2="410.0" y2="330.0" stroke="#333333" stroke-width="1.5"/>
<line x1="65.0" y1="330.0" x2="65.0" y2="110.0" stroke="#333333" stroke-width="1.5"/>
<text x="390.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Раунди (t)</text>
<text x="40.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">100%</text>
<text x="40.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">50%</text>
<text x="40.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">0%</text>
<line x1="65.0" y1="110.0" x2="410.0" y2="110.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="65.0" y1="220.0" x2="410.0" y2="220.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="65.0" y1="330.0" x2="105.0" y2="305.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="105.0" y1="305.0" x2="145.0" y2="260.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="145.0" y1="260.0" x2="195.0" y2="190.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="195.0" y1="190.0" x2="245.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="245.0" y1="150.0" x2="305.0" y2="132.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="305.0" y1="132.0" x2="365.0" y2="122.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="365.0" y1="122.0" x2="410.0" y2="118.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="65.0" y1="330.0" x2="105.0" y2="305.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="105.0" y1="305.0" x2="145.0" y2="255.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="145.0" y1="255.0" x2="195.0" y2="180.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="195.0" y1="180.0" x2="245.0" y2="125.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="245.0" y1="125.0" x2="285.0" y2="111.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="285.0" y1="111.0" x2="325.0" y2="110.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="325.0" y1="110.0" x2="410.0" y2="110.0" stroke="#27ae60" stroke-width="2.5"/>
<rect x="80.0" y="100.0" width="175.0" height="55.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<line x1="90.0" y1="118.0" x2="120.0" y2="118.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="125.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Push-Pull (Оптимум)</text>
<line x1="90.0" y1="138.0" x2="120.0" y2="138.0" stroke="#c0392b" stroke-width="2.2"/>
<text x="125.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Лише Push (Хвіст O(N))</text>
<rect x="455.0" y="50.0" width="385.0" height="330.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="647.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фазова поведінка підходів</text>
<rect x="470.0" y="95.0" width="355.0" height="75.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="485.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">1. Лише Push (Передача новим):</text>
<text x="485.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Рання фаза: Вибуховий експоненційний ріст.</text>
<text x="485.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Пізня фаза: «Стрільба по вже заражених».</text>
<text x="485.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  Останні вузли шукаються за O(N) надлишкових повідомлень.</text>
<rect x="470.0" y="180.0" width="355.0" height="75.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="485.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">2. Лише Pull (Запит у випадкових):</text>
<text x="485.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">• Рання фаза: Повільний старт (мало хто знає).</text>
<text x="485.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пізня фаза: Неінфіковані вузли миттєво знаходять</text>
<text x="485.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  інфікованих з імовірністю ~1. Квадратичне згасання залишку.</text>
<rect x="470.0" y="265.0" width="355.0" height="100.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="485.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">3. Комбінований Push-Pull (Анти-ентропія):</text>
<text x="485.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Поєднує швидкий старт Push та швидкий фініш Pull.</text>
<text x="485.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Кількість раундів до повного охоплення: O(log N).</text>
<text x="485.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Трафік на раунд: фіксований O(k) байтів.</text>
<text x="485.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Стандарт де-факто для Cassandra, Consul, Serf.</text>
</svg>