<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Концепція DSM: логічна ілюзія проти фізичної реальності</text>
<line x1="420.0" y1="48.0" x2="420.0" y2="320.0" stroke="#d8dde3" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="210.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Логічна картина (погляд програми)</text>
<text x="120.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол 0 (Потік 0)</text>
<text x="300.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол 1 (Потік 1)</text>
<line x1="120.0" y1="110.0" x2="160.0" y2="142.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300.0" y1="110.0" x2="260.0" y2="142.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="145.0" width="300.0" height="64.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="210.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Єдиний плаский адресний простір</text>
<text x="210.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0x0000_0000 ... 0xFFFF_FFFF</text>
<text x="210.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Звичайні вказівники (*ptr) і структури:</text>
<text x="210.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">потік на вузлі 1 читає пам'ять вузла 0 напряму</text>
<text x="210.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">одиниця адресації = БАЙТ / ВКАЗІВНИК</text>
<text x="630.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Фізична реальність (вузли кластера)</text>
