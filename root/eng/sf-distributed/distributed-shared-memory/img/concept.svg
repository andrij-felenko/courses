<text x="530.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вузол 0</text>
<text x="530.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ЦП 0 + Локальна RAM 0</text>
<text x="530.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Своя фізична шина</text>
<rect x="650.0" y="102.0" width="160.0" height="86.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="730.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вузол 1</text>
<text x="730.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ЦП 1 + Локальна RAM 1</text>
<text x="730.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Своя фізична шина</text>
<rect x="480.0" y="222.0" width="300.0" height="44.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<text x="630.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мережне з'єднання (Ethernet / InfiniBand)</text>
<line x1="530.0" y1="188.0" x2="530.0" y2="222.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="730.0" y1="188.0" x2="730.0" y2="222.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="630.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">фізично роздільна пам'ять без спільної шини</text>
<rect x="50.0" y="338.0" width="740.0" height="72.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="362.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Розподілена спільна пам'ять (DSM) створює програмну або апаратну ілюзію</tspan><tspan x="420.0" dy="15.6">єдиного адресного простору над фізично незалежними серверами,</tspan><tspan x="420.0" dy="15.6">транслюючи звернення до пам'яті в мережні повідомлення.</tspan></text>
</svg>