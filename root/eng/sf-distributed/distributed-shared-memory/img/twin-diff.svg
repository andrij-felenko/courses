<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип роботи протоколу Twin-and-Diff</text>
<text x="430.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм Twin-and-Diff для розв'язання False Sharing на сторінках 4KB</text>
<rect x="80.0" y="64.0" width="700.0" height="52.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="430.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Спільна віртуальна сторінка (4096 байтів)</text>
<rect x="95.0" y="92.0" width="180.0" height="20.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="185.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Змінна A (зміщує Вузол 1)</text>
<rect x="585.0" y="92.0" width="180.0" height="20.0" rx="2" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="675.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Змінна B (зміщує Вузол 2)</text>
<rect x="60.0" y="142.0" width="340.0" height="160.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="230.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вузол 1: створення Twin і запис у змінну A</text>
<rect x="80.0" y="180.0" width="140.0" height="38.0" rx="3" fill="#fff9db" stroke="#333333" stroke-width="1.1"/>
<text x="150.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Twin 1 (копія 4KB)</text>
<text x="150.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">стан до запису</text>
<rect x="240.0" y="180.0" width="140.0" height="38.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/>
<text x="310.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Брудна сторінка</text>
<text x="310.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">змінено байти 0..7</text>
<rect x="80.0" y="238.0" width="300.0" height="48.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="230.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Обчислення різниці (Diff 1):</text>
<text x="230.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">[зсув 0, довжина 8, нові байти A]</text>
<rect x="460.0" y="142.0" width="340.0" height="160.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="630.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол 2: створення Twin і запис у змінну B</text>
<rect x="480.0" y="180.0" width="140.0" height="38.0" rx="3" fill="#fff9db" stroke="#333333" stroke-width="1.1"/>
<text x="550.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Twin 2 (копія 4KB)</text>
<text x="550.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">стан до запису</text>
<rect x="640.0" y="180.0" width="140.0" height="38.0" rx="3" fill="#eafaf0" stroke="#27ae60" stroke-width="1.1"/>
<text x="710.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Брудна сторінка</text>
<text x="710.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">змінено байти 2048..2055</text>
<rect x="480.0" y="238.0" width="300.0" height="48.0" rx="3" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="630.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Обчислення різниці (Diff 2):</text>
<text x="630.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">[зсув 2048, довжина 8, нові байти B]</text>
<line x1="230.0" y1="302.0" x2="360.0" y2="332.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="630.0" y1="302.0" x2="500.0" y2="332.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200.0" y="334.0" width="460.0" height="52.0" rx="4" fill="#f3eafa" stroke="#8e44ad" stroke-width="1.4"/>
<text x="430.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Злиття змін (Diff Merge)</text>
<text x="430.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Накладання неперетинних зсувів: відсутність конфліктів</text>
<rect x="50.0" y="404.0" width="760.0" height="58.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="429.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Twin-and-Diff дозволяє кільком вузлам одночасно писати в одну сторінку 4KB,</tspan><tspan x="430.0" dy="15.0">передаючи лише малі пачки змінених байтів замість перекидання всієї сторінки.</tspan></text>
</svg>