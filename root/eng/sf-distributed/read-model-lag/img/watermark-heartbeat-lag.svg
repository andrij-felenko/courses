<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вимірювання лагу: хибність зміщення (offset) проти маркерного пульсу</text>
<rect x="30.0" y="60.0" width="480.0" height="430.0" rx="8" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/>
<text x="270.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">СИТУАЦІЯ А: Оманливість метрики Offset Lag</text>
<rect x="50.0" y="110.0" width="440.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Сценарій 1: Потік телеметрії (10 000 подій/с)</tspan><tspan x="270.0" dy="14.3">Producer Offset: 5 000 000 | Consumer Offset: 4 990 000</tspan><tspan x="270.0" dy="14.3">Метрика: Offset Lag = 10 000 повідомлень</tspan><tspan x="270.0" dy="14.3">РЕАЛЬНІСТЬ: Дані відстають лише на 10-20 мілісекунд (НОРМА)</tspan></text>
<rect x="50.0" y="205.0" width="440.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="229.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Сценарій 2: Неактивний орендар / Нічний час (0.01 подій/с)</tspan><tspan x="270.0" dy="14.3">Producer Offset: 500 | Consumer Offset: 499</tspan><tspan x="270.0" dy="14.3">Метрика: Offset Lag = 1 повідомлення</tspan><tspan x="270.0" dy="14.3">РЕАЛЬНІСТЬ: Подія зависла 4 години тому через збій (КРИЗА)</tspan></text>
<rect x="50.0" y="305.0" width="440.0" height="165.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="270.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Чому метрика offset lag не є контрактом:</text>
<text x="65.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Зміщення не має фізичної розмірності часу (секунд)</text>
<text x="65.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Залежить від миттєвої інтенсивності бізнес-трафіку</text>
<text x="65.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Не дає змоги перевірити SLA користувача (напр. ≤ 500 мс)</text>
<text x="65.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Приховує зависання на поодиноких рідкісних подіях</text>
<rect x="550.0" y="60.0" width="480.0" height="430.0" rx="8" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/>
<text x="790.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">СИТУАЦІЯ Б: Синтетичний пульс (Heartbeat / Watermark)</text>
<rect x="570.0" y="110.0" width="440.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Генератор пульсу (Heartbeat Injector)</tspan><tspan x="790.0" dy="14.3">Кожні 100 мс інжектує службову подію в Outbox:</tspan><tspan x="790.0" dy="14.3">HeartbeatEvent { timestamp: t_mono_now }</tspan></text>
<line x1="790.0" y1="180.0" x2="790.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="570.0" y="210.0" width="440.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Проходження крізь чергу Kafka</tspan><tspan x="790.0" dy="14.3">Службовий пульс рухається в тому ж порядку,</tspan><tspan x="790.0" dy="14.3">що й бізнес-транзакції у відповідній партиції</tspan></text>
<line x1="790.0" y1="280.0" x2="790.0" y2="310.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="570.0" y="310.0" width="440.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Обчислення лагу на Проєкторі:</tspan><tspan x="790.0" dy="14.3">При читанні пульсу H(t_sent):</tspan><tspan x="790.0" dy="14.3">Фізичний лаг = t_mono_local - t_sent</tspan><tspan x="790.0" dy="14.3">Метрика завжди актуальна, навіть без бізнес-записів!</tspan></text>
<rect x="570.0" y="405.0" width="440.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="790.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Гарантія для SLA-контракту:</text>
<text x="790.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Лаг вимірюється в мілісекундах незалежно від навантаження</text>
</svg>