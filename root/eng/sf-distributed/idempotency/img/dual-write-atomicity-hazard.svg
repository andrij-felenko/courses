<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ПАСТКА ПОДВІЙНОГО ЗАПИСУ: чому дія та збереження ключа мають бути атомарними</tspan></text>
<rect x="50.0" y="85.0" width="510.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="305.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">РОЗДІЛЬНІ СИСТЕМИ (ПОМИЛКА)</tspan><tspan x="305.0" dy="16.9">ключ у Redis, гроші в PostgreSQL</tspan></text>
<rect x="75.0" y="160.0" width="460.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.4"/><text x="305.0" y="188.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">1. Списати 1000 грн в БД (успіх)</tspan><tspan x="305.0" dy="15.6">UPDATE accounts SET balance = balance - 1000</tspan></text>
<line x1="305.0" y1="225.0" x2="305.0" y2="260.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="75.0" y="260.0" width="460.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="305.0" y="286.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">КРАХ ВУЗЛА / ОБРИВ МЕРЕЖІ ДО REDIS</tspan><tspan x="305.0" dy="16.2">ключ ідемпотентності НЕ збережено!</tspan></text>
<line x1="305.0" y1="320.0" x2="305.0" y2="355.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="75.0" y="355.0" width="460.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="305.0" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">2. Клієнт бачить таймаут і шле повтор</tspan><tspan x="305.0" dy="15.6">Реєстр порожній → подвійне списання!</tspan></text>
<rect x="75.0" y="440.0" width="460.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.2"/><text x="305.0" y="468.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Наслідок: неможливо гарантувати узгодженість</tspan><tspan x="305.0" dy="15.6">між двома незалежними сховищами без 2PC</tspan></text>
<rect x="620.0" y="85.0" width="510.0" height="56.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="875.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">ЄДИНА ТРАНЗАКЦІЯ (ПРАВИЛЬНО)</tspan><tspan x="875.0" dy="16.9">бізнес-мутація + ключ в одній БД</tspan></text>
<rect x="645.0" y="160.0" width="460.0" height="155.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="875.0" y="187.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">BEGIN TRANSACTION;</tspan><tspan x="875.0" dy="15.6"></tspan><tspan x="875.0" dy="15.6">  INSERT INTO idempotency_keys (key, hash, status)</tspan><tspan x="875.0" dy="15.6">  VALUES ('key-42', 'h_abc', 'COMMITTED');</tspan><tspan x="875.0" dy="15.6"></tspan><tspan x="875.0" dy="15.6">  UPDATE accounts SET balance = balance - 1000;</tspan><tspan x="875.0" dy="15.6"></tspan><tspan x="875.0" dy="15.6">COMMIT;</tspan></text>
<line x1="875.0" y1="315.0" x2="875.0" y2="355.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="645.0" y="355.0" width="460.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="875.0" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">При збої: відкочується І списання, І ключ</tspan><tspan x="875.0" dy="15.6">При успіху: зафіксовано І списання, І ключ</tspan></text>
<rect x="645.0" y="440.0" width="460.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/><text x="875.0" y="468.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Результат: або операції немає взагалі,</tspan><tspan x="875.0" dy="15.6">або вона виконана рівно один раз і захищена</tspan></text>
<rect x="40.0" y="550.0" width="1100.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="572.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">золоте правило ідемпотентності: збереження токена й зміна стану мусять бути неподільними;</tspan><tspan x="590.0" dy="16.9">якщо сховища різні — використовують патерн Transactional Outbox або двофазний консенсус</tspan></text>
</svg>