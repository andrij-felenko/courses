<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура Phi Accrual у вузлі кластера (Cassandra / Akka)</text>
<rect x="25.0" y="55.0" width="230.0" height="420.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="140.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Віддалений вузол (Node B)</text>
<rect x="40.0" y="115.8" width="200.0" height="48.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="140.0" y="131.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Періодичний генератор пульсу</tspan><tspan x="140.0" dy="11.7">Gossip Heartbeat / UDP / TCP</tspan><tspan x="140.0" dy="11.7">Інтервал відправки: T = 1.0 с</tspan></text>
<line x1="140.0" y1="185.0" x2="140.0" y2="225.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="239.9" width="200.0" height="60.1" rx="6" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5"/><text x="140.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Ненадійна мережа WAN / LAN</tspan><tspan x="140.0" dy="11.7">Змінні черги комутаторів</tspan><tspan x="140.0" dy="11.7">Джиттер затримок: 1..250 мс</tspan><tspan x="140.0" dy="11.7">Втрати та дублювання пакетів</tspan></text>
<line x1="240.0" y1="270.0" x2="310.0" y2="270.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="295.0" y="55.0" width="395.0" height="420.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="492.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Детектор відмов на вузлі-спостерігачі (Node A)</text>
<rect x="317.0" y="110.8" width="350.0" height="48.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="492.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="492.0" dy="0.0">Отримання Heartbeat-пакета:</tspan><tspan x="492.0" dy="11.7">Фіксація точного локального часу t_now</tspan><tspan x="492.0" dy="11.7">Розрахунок інтервалу: Δt = t_now − t_last</tspan></text>
<line x1="492.0" y1="175.0" x2="492.0" y2="205.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="317.0" y="219.9" width="350.0" height="60.1" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="492.0" y="235.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="492.0" dy="0.0">Ковзне вікно інтервалів (ArrivalWindow)</tspan><tspan x="492.0" dy="11.7">Розмір: W = 1000 елементів</tspan><tspan x="492.0" dy="11.7">Ітеративне оновлення: сума Δt та сума (Δt)²</tspan><tspan x="492.0" dy="11.7">Вибіркове середнє μ та дисперсія σ²</tspan></text>
<line x1="492.0" y1="295.0" x2="492.0" y2="325.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="317.0" y="344.9" width="350.0" height="60.1" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="492.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="492.0" dy="0.0">Калькулятор підозри Phi:</tspan><tspan x="492.0" dy="11.7">Вхід: t_diff = t_now − t_last</tspan><tspan x="492.0" dy="11.7">Ймовірність: P_later(t_diff) через erfc()</tspan><tspan x="492.0" dy="11.7">Вихід: значення Φ у просторі [0, +∞)</tspan></text>
<line x1="675.0" y1="375.0" x2="735.0" y2="375.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="720.0" y="55.0" width="255.0" height="420.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="847.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Прикладні дії підсистем</text>
<rect x="734.5" y="115.8" width="225.0" height="48.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="847.0" y="131.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">Динамічний маршрутизатор:</tspan><tspan x="847.0" dy="11.7">При Φ &gt; 3 надсилати запити</tspan><tspan x="847.0" dy="11.7">читання до інших реплік</tspan></text>
<rect x="734.5" y="205.8" width="225.0" height="48.4" rx="6" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5"/><text x="847.0" y="221.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">Менеджер мутацій Cassandra:</tspan><tspan x="847.0" dy="11.7">При Φ &gt; 8 зберігати локальні</tspan><tspan x="847.0" dy="11.7">Hinted Handoff замість помилок</tspan></text>
<rect x="734.5" y="295.8" width="225.0" height="48.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="847.0" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">Gossip &amp; Membership:</tspan><tspan x="847.0" dy="11.7">При Φ &gt; 12 оголосити DOWN,</tspan><tspan x="847.0" dy="11.7">ініціювати вибори координатора</tspan></text>
<rect x="730.0" y="390.0" width="235.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="847.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">Кожна підсистема обирає</tspan><tspan x="847.0" dy="11.7">власний поріг Φ залежно</tspan><tspan x="847.0" dy="11.7">від ціни хибного рішення.</tspan></text>
</svg>