<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бінарний таймаут проти шкали підозри Phi Accrual</text>
<rect x="25.0" y="50.0" width="455.0" height="410.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="252.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційний бінарний детектор (Hard Timeout)</text>
<rect x="57.0" y="110.5" width="390.0" height="39.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="252.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="252.0" dy="0.0">Вхідний потік сигналів пульсу (Heartbeat)</tspan><tspan x="252.0" dy="13.0">Період T = 1.0 с, випадковий джиттер мережі</tspan></text>
<line x1="252.0" y1="165.0" x2="252.0" y2="195.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="57.0" y="204.0" width="390.0" height="52.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="252.0" y="220.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="252.0" dy="0.0">Жорсткий таймаут: t_diff &gt; 3.0 c ?</tspan><tspan x="252.0" dy="13.0">Бінарний поріг «Все або нічого»</tspan><tspan x="252.0" dy="13.0">Не враховує історію дисперсії затримок</tspan></text>
<line x1="160.0" y1="275.0" x2="120.0" y2="315.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="120.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">t_diff ≤ 3.0 c</text>
<rect x="40.0" y="330.8" width="160.0" height="48.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="120.0" y="346.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Статус: UP</tspan><tspan x="120.0" dy="11.7">Вузол здоровий</tspan><tspan x="120.0" dy="11.7">(100% трафіку)</tspan></text>
<line x1="340.0" y1="275.0" x2="380.0" y2="315.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">t_diff &gt; 3.0 c</text>
<rect x="290.0" y="330.8" width="180.0" height="48.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="346.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Статус: DEAD</tspan><tspan x="380.0" dy="11.7">Примусовий Failover</tspan><tspan x="380.0" dy="11.7">Перевибори лідера</tspan></text>
<rect x="35.0" y="410.0" width="435.0" height="40.0" rx="4" fill="#fff8e1" stroke="#e67e22" stroke-width="1.0"/>
<text x="252.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b7791f" text-anchor="middle" font-weight="700">Хибна тривога під час сплеску GC → каскадний колапс кластера</text>
<rect x="515.0" y="50.0" width="460.0" height="410.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="745.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Адаптивний детектор Phi Accrual (Hayashibara)</text>
<rect x="540.0" y="101.7" width="410.0" height="36.7" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="745.0" y="117.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Ковзне вікно інтервалів Δt (W = 1000)</tspan><tspan x="745.0" dy="11.7">Динамічний розрахунок середнього μ та дисперсії σ²</tspan></text>
<line x1="745.0" y1="150.0" x2="745.0" y2="175.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540.0" y="180.8" width="410.0" height="48.4" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="745.0" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Неперервна шкала підозри:</tspan><tspan x="745.0" dy="11.7">Φ = −log10(P_later(t_diff))</tspan><tspan x="745.0" dy="11.7">Відокремлення оцінки від реакції системи</tspan></text>
<line x1="745.0" y1="240.0" x2="745.0" y2="265.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540.0" y="272.5" width="410.0" height="25.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="745.0" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Φ ≥ 2..3 (P ≤ 10⁻³): Хеджування запитів / резервний маршрут</tspan></text>
<rect x="540.0" y="317.5" width="410.0" height="25.0" rx="6" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5"/><text x="745.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Φ ≥ 8 (P ≤ 10⁻⁸): Gossip-підозра / накопичення Hinted Handoff</tspan></text>
<rect x="540.0" y="362.5" width="410.0" height="25.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="745.0" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Φ ≥ 12 (P ≤ 10⁻¹²): Виключення з кільця реплікації / рестарт</tspan></text>
<rect x="525.0" y="410.0" width="440.0" height="40.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.0"/>
<text x="745.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Гнучкі багаторівневі дії залежно від ціни та зворотності помилки</text>
</svg>