<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="46.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Багаторівнева архітектура захисту: від Edge-проксі до ядра бази даних</tspan></text>
<rect x="40.0" y="80.0" width="250.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="55.0" y="95.0" width="220.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Рівень 1: Edge / Шлюз (Nginx)</tspan></text>
<rect x="55.0" y="140.0" width="220.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Вхідний потік:</tspan><tspan x="165.0" dy="13.0">10 000 паралельних запитів</tspan><tspan x="165.0" dy="13.0">від клієнтів</tspan></text>
<rect x="55.0" y="230.0" width="220.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Edge Coalescing:</tspan><tspan x="165.0" dy="13.0">• proxy_cache_lock on;</tspan><tspan x="165.0" dy="13.0">• proxy_cache_use_stale</tspan><tspan x="165.0" dy="13.0">  updating timeout;</tspan><tspan x="165.0" dy="13.0">Злиття тисяч однакових</tspan><tspan x="165.0" dy="13.0">HTTP-запитів в 1</tspan></text>
<rect x="55.0" y="380.0" width="220.0" height="150.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Результат Edge:</tspan><tspan x="165.0" dy="13.0">З 10 000 запитів до бекенду</tspan><tspan x="165.0" dy="13.0">проходить лише 1 запит на</tspan><tspan x="165.0" dy="13.0">кожну edge-ноду. Решта</tspan><tspan x="165.0" dy="13.0">отримують застарілий кеш.</tspan></text>
<rect x="320.0" y="80.0" width="270.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="335.0" y="95.0" width="240.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="455.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">Рівень 2: Бекенд (L1 &amp; Flight)</tspan></text>
<rect x="335.0" y="140.0" width="240.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="455.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">L1 Локальний кеш:</tspan><tspan x="455.0" dy="13.0">In-Memory LRU з Soft TTL</tspan><tspan x="455.0" dy="13.0">(Stale-While-Revalidate)</tspan></text>
<rect x="335.0" y="230.0" width="240.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="455.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Single-Flight Coalescing:</tspan><tspan x="455.0" dy="13.0">Внутрішньопроцесний реєстр.</tspan><tspan x="455.0" dy="13.0">Усі паралельні потоки ділять</tspan><tspan x="455.0" dy="13.0">один Promise / Future.</tspan></text>
<rect x="335.0" y="380.0" width="240.0" height="150.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="455.0" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Результат Бекенду:</tspan><tspan x="455.0" dy="13.0">Усі потоки інстансу</tspan><tspan x="455.0" dy="13.0">дедуплікуються. Навіть при</tspan><tspan x="455.0" dy="13.0">промаху L1 в мережу йде</tspan><tspan x="455.0" dy="13.0">рівно 1 виклик від інстансу.</tspan></text>
<rect x="620.0" y="80.0" width="250.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="635.0" y="95.0" width="220.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Рівень 3: Розподілений L2</tspan></text>
<rect x="635.0" y="140.0" width="220.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="745.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Redis / Memcached:</tspan><tspan x="745.0" dy="13.0">Збереження об'єкта разом</tspan><tspan x="745.0" dy="13.0">із часом обчислення (дельта)</tspan></text>
<rect x="635.0" y="230.0" width="220.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="745.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Алгоритм XFetch &amp; Jitter:</tspan><tspan x="745.0" dy="13.0">Ймовірнісне оновлення до</tspan><tspan x="745.0" dy="13.0">вичерпання TTL + випадковий</tspan><tspan x="745.0" dy="13.0">розкид строків життя</tspan></text>
<rect x="635.0" y="380.0" width="220.0" height="150.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="745.0" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Результат L2:</tspan><tspan x="745.0" dy="13.0">99.99% запитів обслуговуються</tspan><tspan x="745.0" dy="13.0">без промахів. Промахи</tspan><tspan x="745.0" dy="13.0">трапляються лише при</tspan><tspan x="745.0" dy="13.0">холодному старті.</tspan></text>
<rect x="900.0" y="80.0" width="240.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="915.0" y="95.0" width="210.0" height="34.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">Рівень 4: Джерело (СУБД)</tspan></text>
<rect x="915.0" y="140.0" width="210.0" height="70.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="1020.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Розподілений Mutex:</tspan><tspan x="1020.0" dy="13.0">SETNX lock:product:7821</tspan><tspan x="1020.0" dy="13.0">з автопродовженням лізу</tspan></text>
<rect x="915.0" y="230.0" width="210.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Основна СУБД:</tspan><tspan x="1020.0" dy="13.0">Виконує РІВНО 1 важкий</tspan><tspan x="1020.0" dy="13.0">SQL-запит на весь кластер!</tspan><tspan x="1020.0" dy="13.0">CPU &lt; 5%</tspan></text>
<rect x="915.0" y="380.0" width="210.0" height="150.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Підсумок надійності:</tspan><tspan x="1020.0" dy="13.0">Кластер витримує будь-яке</tspan><tspan x="1020.0" dy="13.0">пікове навантаження без</tspan><tspan x="1020.0" dy="13.0">перевантаження бази та</tspan><tspan x="1020.0" dy="13.0">каскадних збоїв.</tspan></text>
<line x1="290.0" y1="175.0" x2="320.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="175.0" x2="620.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="870.0" y1="175.0" x2="900.0" y2="175.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>