<rect x="60.0" y="20.0" width="240.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Клієнт 1 (Воркер A)</tspan><tspan x="180.0" dy="16.9">[отримує замок]</tspan></text><rect x="400.0" y="20.0" width="260.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Координатор і Сховище</tspan><tspan x="530.0" dy="16.9">[без перевірки токенів]</tspan></text><rect x="760.0" y="20.0" width="240.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Клієнт 2 (Воркер B)</tspan><tspan x="880.0" dy="16.9">[перехоплює замок]</tspan></text><line x1="180.0" y1="75.0" x2="180.0" y2="170.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="180.0" y1="390.0" x2="180.0" y2="520.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="530.0" y1="75.0" x2="530.0" y2="230.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="530.0" y1="270.0" x2="530.0" y2="365.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="530.0" y1="400.0" x2="530.0" y2="470.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="530.0" y1="510.0" x2="530.0" y2="530.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="880.0" y1="75.0" x2="880.0" y2="520.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="180.0" y1="100.0" x2="530.0" y2="118.0" stroke="#27ae60" stroke-width="1.8" marker-end