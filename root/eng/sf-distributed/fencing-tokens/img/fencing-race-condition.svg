1="880.0" y1="370.0" x2="530.0" y2="388.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/><text x="705.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">5. write(balance = $6500) від Клієнта 2</text><rect x="415.0" y="380.0" width="230.0" height="24.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="395.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Запис прийнято: balance = $6500</tspan></text><line x1="180.0" y1="475.0" x2="530.0" y2="493.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="355.0" y="469.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">6. Запізнілий write(balance = $3000) від Клієнта 1</text><rect x="400.0" y="495.0" width="260.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="530.0" y="516.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">КАТАСТРОФА: стан $6500 затерто на $3000!</tspan><tspan x="530.0" dy="12.3">Сховище не знало, що ліза спливла</tspan></text>
