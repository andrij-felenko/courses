<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наскрізна архітектура взаємного виключення через токени огорожі</text>
<rect x="80.0" y="40.0" width="880.0" height="110.0" rx="8" fill="#fef9e7" stroke="#333333" stroke-width="1.8"/><text x="520.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподілений координатор замків (etcd / ZooKeeper / Raft)</text><rect x="110.0" y="85.0" width="380.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="106.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Атомарний лічильник покоління (Epoch Generator)</tspan><tspan x="300.0" dy="15.0">Монотонна послідовність: T_{n+1} &gt; T_n</tspan></text><rect x="550.0" y="85.0" width="380.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="106.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Оренда з тайм-аутом (Lease Engine)</tspan><tspan x="740.0" dy="15.0">Видача прав: Grant { client_id, token, ttl }</tspan></text><line x1="300.0" y1="150.0" x2="240.0" y2="205.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><text x="210.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">grant(token = 42)</text><line x1="740.0" y1="150.0" x2="800.0" y2="205.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><text x="830.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">старий token = 41</text><rect x="80.0" y="210.0" width="360.0" height="105.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="260.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Активний лідер (Воркер 2)</text><rect x="95.0" y="250.0" width="330.0" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="272.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Поточний дійсний токен: T = 42</tspan><tspan x="260.0" dy="14.3">Формує запит: MutationRequest { data, token=42 }</tspan></text><rect x="600.0" y="210.0" width="360.0" height="105.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="780.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Зомбі-воркер (Воркер 1 після GC)</text><rect x="615.0" y="250.0" width="330.0" height="52.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Застарілий токен у пам'яті: T = 41</tspan><tspan x="780.0" dy="13.0">Формує запізнілий: MutationRequest { data, token=41 }</tspan></text><line x1="260.0" y1="315.0" x2="360.0" y2="375.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><text x="260.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">RPC: write(T=42)</text><line x1="780.0" y1="315.0" x2="680.0" y2="375.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><text x="790.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">RPC: write(T=41)</text><rect x="80.0" y="380.0" width="880.0" height="115.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="520.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільне сховище (SQL DB / Key-Value / Fencing Proxy)</text><rect x="110.0" y="420.0" width="390.0" height="62.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="433.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Бар'єр валідації (Fencing Filter)</tspan><tspan x="305.0" dy="14.3">if token &gt;= highest_token:</tspan><tspan x="305.0" dy="14.3">    highest_token = token; apply_write()</tspan><tspan x="305.0" dy="14.3">else: reject(STALE_TOKEN)</tspan></text><rect x="540.0" y="420.0" width="390.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="433.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Сховище стану (State Store)</tspan><tspan x="735.0" dy="14.3">highest_token_seen: 42</tspan><tspan x="735.0" dy="14.3">Захищений запис: успішно зафіксовано</tspan><tspan x="735.0" dy="14.3">Запізнілий запис: відкинуто на бар'єрі</tspan></text>
</svg>