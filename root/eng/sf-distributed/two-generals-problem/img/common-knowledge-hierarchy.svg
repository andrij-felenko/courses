<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія станів знання у розподіленій системі</text>
<rect x="0.0" y="0.0" width="960.0" height="430.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія станів епістемічного знання у розподіленій системі</text>
<rect x="20.0" y="55.0" width="215.0" height="335.0" rx="8" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="20.0" y="55.0" width="215.0" height="7.0" rx="4" fill="#64748b" stroke="#64748b" stroke-width="0.0"/>
<rect x="28.0" y="69.0" width="199.0" height="44.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="127.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700"><tspan x="127.5" dy="0.0">Рівень 0: Одиничне знання</tspan></text>
<rect x="28.0" y="119.0" width="199.0" height="36.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="127.5" y="140.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="127.5" dy="0.0">K_1(m)</tspan></text>
<rect x="28.0" y="163.0" width="199.0" height="130.0" rx="6" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/><text x="127.5" y="217.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="127.5" dy="0.0">Генерал 1 знає час m.</tspan><tspan x="127.5" dy="14.3">Генерал 2 не знає</tspan><tspan x="127.5" dy="14.3">про плани першого.</tspan></text>
<rect x="28.0" y="303.0" width="199.0" height="72.0" rx="6" fill="#f0fdf4" stroke="#64748b" stroke-width="1.5"/><text x="127.5" y="342.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700"><tspan x="127.5" dy="0.0">Спільних дій немає</tspan></text>
<line x1="237.0" y1="222.5" x2="253.0" y2="222.5" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="255.0" y="55.0" width="215.0" height="335.0" rx="8" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="255.0" y="55.0" width="215.0" height="7.0" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="0.0"/>
<rect x="263.0" y="69.0" width="199.0" height="44.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="362.5" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="700"><tspan x="362.5" dy="0.0">Рівень 1: Взаємне знання 1-го порядку</tspan></text>
<rect x="263.0" y="119.0" width="199.0" height="36.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="362.5" y="140.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="362.5" dy="0.0">E^1(m) = K_1(m) ∧ K_2(m)</tspan></text>
<rect x="263.0" y="163.0" width="199.0" height="130.0" rx="6" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/><text x="362.5" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="362.5" dy="0.0">Генерал 2 отримав лист.</tspan><tspan x="362.5" dy="14.3">Обидва знають m.</tspan><tspan x="362.5" dy="14.3">Але перший не знає,</tspan><tspan x="362.5" dy="14.3">чи лист дійшов.</tspan></text>
<rect x="263.0" y="303.0" width="199.0" height="72.0" rx="6" fill="#f0fdf4" stroke="#2563eb" stroke-width="1.5"/><text x="362.5" y="342.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700"><tspan x="362.5" dy="0.0">Немає взаємної довіри</tspan></text>
<line x1="472.0" y1="222.5" x2="488.0" y2="222.5" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490.0" y="55.0" width="215.0" height="335.0" rx="8" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="490.0" y="55.0" width="215.0" height="7.0" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="0.0"/>
<rect x="498.0" y="69.0" width="199.0" height="44.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="597.5" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan x="597.5" dy="0.0">Рівень 2: Взаємне знання 2-го порядку</tspan></text>
<rect x="498.0" y="119.0" width="199.0" height="36.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="597.5" y="140.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="597.5" dy="0.0">E^2(m) = K_1(K_2(m)) ∧ ...</tspan></text>
<rect x="498.0" y="163.0" width="199.0" height="130.0" rx="6" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/><text x="597.5" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="597.5" dy="0.0">Генерал 1 отримав ACK.</tspan><tspan x="597.5" dy="14.3">Він знає, що другий знає.</tspan><tspan x="597.5" dy="14.3">Але другий не знає,</tspan><tspan x="597.5" dy="14.3">чи дійшов його ACK.</tspan></text>
<rect x="498.0" y="303.0" width="199.0" height="72.0" rx="6" fill="#f0fdf4" stroke="#7c3aed" stroke-width="1.5"/><text x="597.5" y="342.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan x="597.5" dy="0.0">Синхронний наступ неможливий</tspan></text>
<line x1="707.0" y1="222.5" x2="723.0" y2="222.5" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="725.0" y="55.0" width="215.0" height="335.0" rx="8" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="725.0" y="55.0" width="215.0" height="7.0" rx="4" fill="#dc2626" stroke="#dc2626" stroke-width="0.0"/>
<rect x="733.0" y="69.0" width="199.0" height="44.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="832.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700"><tspan x="832.5" dy="0.0">Рівень ∞: Спільне знання</tspan></text>
<rect x="733.0" y="119.0" width="199.0" height="36.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="832.5" y="140.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="832.5" dy="0.0">C(m) = ⋀_{k=1}^∞ E^k(m)</tspan></text>
<rect x="733.0" y="163.0" width="199.0" height="130.0" rx="6" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/><text x="832.5" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="832.5" dy="0.0">Усі знають, що всі знають,</tspan><tspan x="832.5" dy="14.3">що всі знають... до ∞.</tspan><tspan x="832.5" dy="14.3">Обов'язкова вимога</tspan><tspan x="832.5" dy="14.3">детермінізму.</tspan></text>
<rect x="733.0" y="303.0" width="199.0" height="72.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="832.5" y="342.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700"><tspan x="832.5" dy="0.0">НЕДОСЯЖНЕ при p &gt; 0</tspan></text>
</svg>