<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нескінченна драбина квитування у задачі двох генералів</text>
<rect x="0.0" y="0.0" width="960.0" height="490.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нескінченна драбина квитування (ACK ladder) у задачі двох генералів</text>
<rect x="30.0" y="48.0" width="220.0" height="420.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="30.0" y="48.0" width="220.0" height="34.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="140.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Генерал 1 (Вузол A)</text>
<rect x="710.0" y="48.0" width="220.0" height="420.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="710.0" y="48.0" width="220.0" height="34.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="820.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Генерал 2 (Вузол B)</text>
<rect x="265.0" y="48.0" width="430.0" height="420.0" rx="8" fill="#fdfbf7" stroke="#f1e3cc" stroke-width="1.2"/>
<text x="480.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Ненадійний канал (втрата пакетів p &gt; 0)</text>
<line x1="258.0" y1="88.0" x2="258.0" y2="453.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="702.0" y1="88.0" x2="702.0" y2="453.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="258.0" y1="100.0" x2="702.0" y2="130.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.9" y="97.2" width="238.2" height="21.5" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">1. Повідомлення: «Атака о 06:00»</tspan></text>
<rect x="38.0" y="90.0" width="204.0" height="52.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="140.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Не може атакувати:</tspan><tspan x="140.0" dy="13.7">якщо лист перехоплено,</tspan><tspan x="140.0" dy="13.7">загине на самоті.</tspan></text>
<line x1="702.0" y1="168.0" x2="258.0" y2="198.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.2" y="165.2" width="259.6" height="21.5" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">2. Квитанція ACK: «Згоден на 06:00»</tspan></text>
<rect x="718.0" y="158.0" width="204.0" height="52.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="820.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Не може атакувати:</tspan><tspan x="820.0" dy="13.7">якщо ACK загубиться,</tspan><tspan x="820.0" dy="13.7">Генерал 1 не вийде.</tspan></text>
<line x1="258.0" y1="236.0" x2="702.0" y2="266.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="343.1" y="233.2" width="273.8" height="21.5" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">3. Квитанція ACK2: «Отримав твій ACK»</tspan></text>
<rect x="38.0" y="226.0" width="204.0" height="52.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="140.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Не може атакувати:</tspan><tspan x="140.0" dy="13.7">чи дійшов ACK2 до</tspan><tspan x="140.0" dy="13.7">Генерала 2?</tspan></text>
<line x1="702.0" y1="304.0" x2="258.0" y2="334.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="339.5" y="301.2" width="280.9" height="21.5" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">4. Квитанція ACK3: «Отримав твій ACK2»</tspan></text>
<rect x="718.0" y="294.0" width="204.0" height="52.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="820.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Не може атакувати:</tspan><tspan x="820.0" dy="13.7">чи отримав Генерал 1</tspan><tspan x="820.0" dy="13.7">цей ACK3?</tspan></text>
<rect x="277.0" y="375.0" width="406.0" height="80.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="480.0" y="406.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Рекурсивна невизначеність: останній відправник завжди сумнівається.</tspan><tspan x="480.0" dy="11.7">Жодна скінченна кількість квитанцій k не забезпечує</tspan><tspan x="480.0" dy="11.7">гарантованого одночасного наступу.</tspan></text>
</svg>