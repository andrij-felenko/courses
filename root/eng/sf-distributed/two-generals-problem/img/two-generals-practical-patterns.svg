<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Практичні інженерні стратегії обходу задачі двох генералів</text>
<rect x="0.0" y="0.0" width="960.0" height="420.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Практичні інженерні стратегії обходу задачі двох генералів</text>
<rect x="26.5" y="55.0" width="285.0" height="330.0" rx="8" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="26.5" y="55.0" width="285.0" height="7.0" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="0.0"/>
<text x="169.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">1. Ідемпотентність і повтори</text>
<text x="169.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">At-Least-Once + Дедуплікація</text>
<line x1="41.5" y1="111.0" x2="296.5" y2="111.0" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="38.5" y="121.0" width="261.0" height="175.0" rx="6" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/><text x="169.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="169.0" dy="0.0">Клієнт генерує ключ запиту.</tspan><tspan x="169.0" dy="15.0">Сервер фіксує дію в сховищі.</tspan><tspan x="169.0" dy="15.0">Якщо відповідь загубилась,</tspan><tspan x="169.0" dy="15.0">клієнт надсилає повтор.</tspan><tspan x="169.0" dy="15.0">Сервер повертає кеш</tspan><tspan x="169.0" dy="15.0">без повторного списання.</tspan></text>
<rect x="38.5" y="305.0" width="261.0" height="66.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="169.0" y="341.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="169.0" dy="0.0">Захист від подвійних транзакцій</tspan></text>
<rect x="337.5" y="55.0" width="285.0" height="330.0" rx="8" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="337.5" y="55.0" width="285.0" height="7.0" rx="4" fill="#16a34a" stroke="#16a34a" stroke-width="0.0"/>
<text x="480.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">2. Оренди та фізичний час</text>
<text x="480.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Часові лізи (Leases)</text>
<line x1="352.5" y1="111.0" x2="607.5" y2="111.0" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="349.5" y="121.0" width="261.0" height="175.0" rx="6" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/><text x="480.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Вузол отримує право на дію</tspan><tspan x="480.0" dy="15.0">на фіксований інтервал T.</tspan><tspan x="480.0" dy="15.0">Після T право автоматично гасне.</tspan><tspan x="480.0" dy="15.0">Не потребує фінального</tspan><tspan x="480.0" dy="15.0">підтвердження звільнення.</tspan></text>
<rect x="349.5" y="305.0" width="261.0" height="66.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="480.0" y="341.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Автономне рішення за таймером</tspan></text>
<rect x="648.5" y="55.0" width="285.0" height="330.0" rx="8" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="648.5" y="55.0" width="285.0" height="7.0" rx="4" fill="#d97706" stroke="#d97706" stroke-width="0.0"/>
<text x="791.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">3. Оптимістичні Саги</text>
<text x="791.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Компенсаційні транзакції</text>
<line x1="663.5" y1="111.0" x2="918.5" y2="111.0" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="660.5" y="121.0" width="261.0" height="175.0" rx="6" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/><text x="791.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="791.0" dy="0.0">Сервіси фіксують дію локально</tspan><tspan x="791.0" dy="15.0">без блокуючого очікування.</tspan><tspan x="791.0" dy="15.0">У разі аварії чи таймауту</tspan><tspan x="791.0" dy="15.0">запускається компенсація.</tspan><tspan x="791.0" dy="15.0">Система сходиться з часом.</tspan></text>
<rect x="660.5" y="305.0" width="261.0" height="66.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="791.0" y="341.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="791.0" dy="0.0">Кінцева узгодженість замість блокування</tspan></text>
</svg>