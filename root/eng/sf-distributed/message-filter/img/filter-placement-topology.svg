<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектурних рівнів розміщення фільтра</text>
<rect x="15.0" y="15.0" width="970.0" height="390.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три архітектурні рівні розміщення фільтра повідомлень</text>
<rect x="35.0" y="70.0" width="295.0" height="315.0" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.2"/>
<text x="182.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Фільтрація на джерелі (Producer)</text>
<rect x="93.5" y="136.9" width="176.9" height="46.2" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="182.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="182.0" dy="0.0">Продюсер</tspan><tspan x="182.0" dy="12.3">[Локальний предикат P(m)]</tspan><tspan x="182.0" dy="12.3">(Публікація лише потрібного)</tspan></text>
<line x1="182.0" y1="205.0" x2="182.0" y2="235.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="107.0" y="244.1" width="150.0" height="31.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="182.0" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="182.0" dy="0.0">Брокер / Мережа</tspan><tspan x="182.0" dy="12.3">(Мінімальний трафік)</tspan></text>
<text x="182.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Нульове навантаження на мережу</text>
<text x="182.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Тісне зв'язування (tight coupling)</text>
<text x="182.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Непридатне для динамічних підписок</text>
<rect x="352.0" y="70.0" width="295.0" height="315.0" rx="6" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/>
<text x="500.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. Серверний фільтр (Broker / Bus)</text>
<rect x="393.9" y="136.9" width="212.3" height="46.2" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Брокер повідомлень / Шлюз</tspan><tspan x="500.0" dy="12.3">[JMS Selectors / SNS Filter / CEL]</tspan><tspan x="500.0" dy="12.3">Маршрутизація до черги споживача</tspan></text>
<line x1="500.0" y1="205.0" x2="500.0" y2="235.0" stroke="#27ae60" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="425.0" y="244.1" width="150.0" height="31.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Споживач (Consumer)</tspan><tspan x="500.0" dy="12.3">Отримує лише збіги</tspan></text>
<text x="500.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Повна розв'язаність продюсера і клієнта</text>
<text x="500.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Економія мережі та пам'яті клієнта</text>
<text x="500.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#856404" text-anchor="middle">• Витрата CPU брокера на парсинг</text>
<rect x="670.0" y="70.0" width="295.0" height="315.0" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.2"/>
<text x="817.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Клієнтський фільтр (Consumer)</text>
<rect x="702.0" y="136.9" width="229.9" height="46.2" rx="6" fill="#fff3cd" stroke="#d39e00" stroke-width="1.5"/><text x="817.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="817.0" dy="0.0">Споживач (In-process Interceptor)</tspan><tspan x="817.0" dy="12.3">[Предикат у коді клієнта]</tspan><tspan x="817.0" dy="12.3">(Доступ до БД, кешу, бізнес-об'єктів)</tspan></text>
<line x1="817.0" y1="205.0" x2="817.0" y2="235.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="742.0" y="244.1" width="150.0" height="31.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="817.0" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="817.0" dy="0.0">Бізнес-обробник (Handler)</tspan><tspan x="817.0" dy="12.3">Обробка відібраного</tspan></text>
<text x="817.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Довільна складність бізнес-правил</text>
<text x="817.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Не навантажує центральний брокер</text>
<text x="817.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Максимальні втрати мережі та CPU</text>
</svg>