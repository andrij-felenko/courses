<rect x="775.0" y="155.0" width="140.0" height="24.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.0"/>
<text x="845.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">[ Breaker: OPEN ]</text>
