<text x="735.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ізольований від потоку</text>
<text x="735.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 RPS навантаження</text>
<line x1="845.0" y1="190.0" x2="845.0" y2="240.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="845.0" y1="240.0" x2="890.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="875.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Fail-Fast</text>
<rect x="855.0" y="250.0" width="85.0" height="45.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="897.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Fallback</text>
<text x="897.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Кеш / Стаб</text>
<rect x="540.0" y="360.0" width="400.0" height="110.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="740.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Стійкість та локалізація збою:</text>
<text x="560.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Запобіжник розмикає ланцюг за 1 мкс без I/O</text>
<text x="560.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Потоки звільняються негайно для інших клієнтів</text>
<text x="560.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">3. Збійний сервіс отримує час на спокійне відновлення</text>
