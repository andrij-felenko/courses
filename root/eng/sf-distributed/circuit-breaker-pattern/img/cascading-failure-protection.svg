<rect x="60.0" y="360.0" width="400.0" height="110.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="260.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Каскадний крах інфраструктури:</text>
