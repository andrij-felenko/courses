<text x="630.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Черга: 5/200 (вільна)</text>
<text x="630.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">CPU / Threads у нормі</text>
<rect x="760.0" y="120.0" width="170.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
