<rect x="30.0" y="25.0" width="450.0" height="470.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="50.0" y="40.0" width="410.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="62.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Популярна ілюзія: «Оберіть 2 із 3»</tspan></text>
<line x1="255.0" y1="110.0" x2="110.0" y2="340.0" stroke="#333333" stroke-width="2.0"/>
<line x1="255.0" y1="110.0" x2="400.0" y2="340.0" stroke="#333333" stroke-width="2.0"/>
<line x1="110.0" y1="340.0" x2="400.0" y2="340.0" stroke="#333333" stroke-width="2.0"/>
<circle cx="255.0" cy="110.0" r="32.0" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="255.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">C</text>
<circle cx="110.0" cy="340.0" r="32.0" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="110.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">A</text>
<circle cx="400.0" cy="340.0" r="32.0" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="400.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">P</text>
<rect x="100.0" y="200.0" width="75.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="137.5" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="137.5" dy="0.0">«CA»</tspan></text>
<rect x="335.0" y="200.0" width="75.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="372.5" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="372.5" dy="0.0">«CP»</tspan></text>
<rect x="215.0" y="355.0" width="80.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">«AP»</tspan></text>
<rect x="50.0" y="400.0" width="410.0" height="75.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="419.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">ХИБНЕ ПРИПУЩЕННЯ:</tspan><tspan x="255.0" dy="14.3">«Можна відмовитися від P і отримати CA-систему».</tspan><tspan x="255.0" dy="14.3">У фізичній мережі пакети неминуче губляться, тому</tspan><tspan x="255.0" dy="14.3">стан «CA» в розподіленій системі фізично неможливий.</tspan></text>
<rect x="520.0" y="25.0" width="450.0" height="470.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="540.0" y="40.0" width="410.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="62.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Фізична реальність: бінарна дилема</tspan></text>
<rect x="540.0" y="95.0" width="410.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="117.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Мережеве розділення (P) — це не вибір, а закон природи.</tspan><tspan x="745.0" dy="13.7">Коли лінк між вузлами рветься, вибір зводиться до двох шляхів:</tspan></text>
<rect x="540.0" y="165.0" width="410.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<rect x="555.0" y="175.0" width="380.0" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Шлях CP: збереження строгої узгодженості</tspan></text>
<rect x="555.0" y="210.0" width="380.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="236.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">• Ізольований вузол відхиляє запити або чекає відновлення зв'язку.</tspan><tspan x="745.0" dy="11.7">• Жоден клієнт не прочитає застарілі або суперечливі дані.</tspan><tspan x="745.0" dy="11.7">• Ціна: втрата доступності (Availability = 0) для відрізаної зони.</tspan></text>
<rect x="540.0" y="315.0" width="410.0" height="130.0" rx="6" fill="#fff3cd" stroke="#c0392b" stroke-width="1.8"/>
<rect x="555.0" y="325.0" width="380.0" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="344.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Шлях AP: збереження повної доступності</tspan></text>
<rect x="555.0" y="360.0" width="380.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="386.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">• Ізольований вузол локально відповідає на всі читання і записи.</tspan><tspan x="745.0" dy="11.7">• Доступність 100%: жоден клієнт не отримує помилку тайм-ауту.</tspan><tspan x="745.0" dy="11.7">• Ціна: втрата узгодженості (Consistency = 0), стан роздвоюється.</tspan></text>
</svg>