<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="920.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="46.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Модель PACELC: Повна картина розподілених компромісів (Daniel Abadi)</tspan></text>
<rect x="60.0" y="80.0" width="430.0" height="205.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<rect x="510.0" y="80.0" width="430.0" height="205.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.8"/>
<rect x="60.0" y="305.0" width="430.0" height="205.0" rx="8" fill="#fff3cd" stroke="#333333" stroke-width="1.8"/>
<rect x="510.0" y="305.0" width="430.0" height="205.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<rect x="75.0" y="90.0" width="400.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="110.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">Квадрант PC / EC (Строгість у всьому)</tspan></text>
<rect x="75.0" y="125.0" width="400.0" height="145.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="183.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">• При розділенні (P): обирають Узгодженість (C).</tspan><tspan x="275.0" dy="11.7">• У штатному режимі (E): платять Латентністю (L) заради Узгодженості (C).</tspan><tspan x="275.0" dy="11.7">• Механізм: Синхронна реплікація через Raft / Paxos / 2PC.</tspan><tspan x="275.0" dy="11.7">• Приклади: Google Spanner, CockroachDB, HBase, etcd, ZooKeeper.</tspan></text>
<rect x="525.0" y="90.0" width="400.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Квадрант PC / EL (Лідер-орієнтовані з асинхронним читанням)</tspan></text>
<rect x="525.0" y="125.0" width="400.0" height="145.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="183.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">• При розділенні (P): обирають Узгодженість (C) на первинному вузлі.</tspan><tspan x="725.0" dy="11.7">• У штатному режимі (E): читають з реплік заради низької Латентності (L).</tspan><tspan x="725.0" dy="11.7">• Механізм: Записи йдуть на Primary, читання — на асинхронні фоловери.</tspan><tspan x="725.0" dy="11.7">• Приклади: MongoDB (Secondary reads), PostgreSQL / MySQL (Read Replicas).</tspan></text>
<rect x="75.0" y="315.0" width="400.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="334.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">Квадрант PA / EC (Синхронний спокій, аварійна доступність)</tspan></text>
<rect x="75.0" y="350.0" width="400.0" height="145.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">• При розділенні (P): дозволяють локальну Доступність (A).</tspan><tspan x="275.0" dy="11.7">• У штатному режимі (E): тримають строгу Узгодженість (C) через 2PC.</tspan><tspan x="275.0" dy="11.7">• Механізм: Повна синхронність у спокійний час, перемикання на кеш при аварії.</tspan><tspan x="275.0" dy="11.7">• Приклади: Спеціалізовані кешуючі системи, VoltDB (у режимі екстреного читання).</tspan></text>
<rect x="525.0" y="315.0" width="400.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Квадрант PA / EL (Максимальна швидкість і виживання)</tspan></text>
<rect x="525.0" y="350.0" width="400.0" height="145.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">• При розділенні (P): обирають Доступність (A) у кожній зоні.</tspan><tspan x="725.0" dy="11.7">• У штатному режимі (E): мінімізують Латентність (L), поступаючись C.</tspan><tspan x="725.0" dy="11.7">• Механізм: Асинхронний мультимайстер, CRDT, векторні годинники, LWW.</tspan><tspan x="725.0" dy="11.7">• Приклади: Amazon DynamoDB (Eventual), Apache Cassandra, Riak, Couchbase.</tspan></text>
<rect x="40.0" y="518.0" width="920.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="537.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Формула PACELC: if Partition (choose A or C) Else (choose L or C)</tspan></text>
</svg>