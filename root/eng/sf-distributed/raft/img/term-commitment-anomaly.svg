<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аномалія Онгаро (Рис. 8): чому не можна комітити старі терми за кворумом</text>
<rect x="35.0" y="65.0" width="430.0" height="370.0" rx="10" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<text x="250.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Аномалія: наївна фіксація чужого терму</text>
<rect x="55.0" y="115.0" width="390.0" height="75.0" rx="6" fill="#ffffff" stroke="#f5c6cb" stroke-width="1.5"/><text x="250.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">1. Терм 2: S1 записує (T2) на індекс 2 на сервери S1, S2.</tspan><tspan x="250.0" dy="13.0">2. S1 падає. S5 стає лідером у термі 3 за голосами S3, S4, S5.</tspan><tspan x="250.0" dy="13.0">3. S5 пише (T3) в індекс 2 і падає. S1 відновлюється в термі 4.</tspan></text>
<rect x="55.0" y="200.0" width="390.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="227.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">4. S1 реплікує старий запис (T2) на S3 — тепер (T2) на більшості (S1, S2, S3)!</tspan><tspan x="250.0" dy="11.7">ЯКБИ S1 вважав (T2) коміченим лише за кворумом копій:</tspan><tspan x="250.0" dy="11.7">S1 падає, S5 прокидається й обирається в термі 5 (голоси S2, S3, S4, S5),</tspan><tspan x="250.0" dy="11.7">бо його лог (T3 на індексі 2) не старіший за їхні!</tspan><tspan x="250.0" dy="11.7">S5 перетирає «комічений» запис (T2) своїм (T3) на всіх вузлах!</tspan></text>
<rect x="65.3" y="331.8" width="369.4" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="351.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">НАСЛІДОК:</tspan><tspan x="250.0" dy="15.0">Втрата зафіксованих даних і розходження автоматів</tspan></text>
<rect x="495.0" y="65.0" width="430.0" height="370.0" rx="10" fill="#f9fbf9" stroke="#27ae60" stroke-width="1.5"/>
<text x="710.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Захист Raft: фіксація через ПОТОЧНИЙ терм</text>
<rect x="515.0" y="115.0" width="390.0" height="75.0" rx="6" fill="#ffffff" stroke="#c3e6cb" stroke-width="1.5"/><text x="710.0" y="142.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Правило Raft (§5.4.2):</tspan><tspan x="710.0" dy="13.7">Лідер НІКОЛИ не фіксує напряму записи попередніх термів,</tspan><tspan x="710.0" dy="13.7">просто підраховуючи кількість їхніх реплік на фоловерах.</tspan></text>
<rect x="515.0" y="200.0" width="390.0" height="95.0" rx="6" fill="#f4f8f4" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="221.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Як досягається безпека:</tspan><tspan x="710.0" dy="11.7">1. Лідер терму 4 зобов'язаний записати новий запис (T4) у свій терм.</tspan><tspan x="710.0" dy="11.7">2. Коли запис (T4) успішно репліковано на більшість вузлів,</tspan><tspan x="710.0" dy="11.7">   усі попередні записи (зокрема T2) фіксуються НЕПРЯМО завдяки</tspan><tspan x="710.0" dy="11.7">   властивості Log Matching.</tspan><tspan x="710.0" dy="11.7">3. Тепер S5 не зможе отримати голоси S1, S2, S3 (їхній останній терм 4 &gt; 3).</tspan></text>
<rect x="532.4" y="331.8" width="355.1" height="46.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="351.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">РЕЗУЛЬТАТ:</tspan><tspan x="710.0" dy="15.0">Інваріант Leader Completeness збережено на 100%</tspan></text>
</svg>