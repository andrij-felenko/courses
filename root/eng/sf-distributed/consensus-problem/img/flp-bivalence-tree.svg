<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево конфігурацій FLP та бівалентність</text>
<rect x="0.0" y="0.0" width="960.0" height="480.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бівалентність конфігурацій і нескінченний цикл затримки FLP</text>
<rect x="370.0" y="60.0" width="220.0" height="42.0" rx="8" fill="#fdf6e2" stroke="#b58900" stroke-width="2.0"/>
<text x="480.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d5a00" text-anchor="middle" font-weight="700">C₀: Бівалентний стан (0 або 1)</text>
<line x1="420.0" y1="104.0" x2="210.0" y2="190.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="104.0" x2="750.0" y2="190.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="195.0" width="220.0" height="45.0" rx="8" fill="#eef9f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="210.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">C₁: 0-валентний (вирішить 0)</text>
<rect x="640.0" y="195.0" width="220.0" height="45.0" rx="8" fill="#edf2fc" stroke="#2457d6" stroke-width="1.8"/>
<text x="750.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">C₂: 1-валентний (вирішить 1)</text>
<line x1="480.0" y1="104.0" x2="480.0" y2="195.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="340.0" y="200.0" width="280.0" height="50.0" rx="8" fill="#fdf0ed" stroke="#c0392b" stroke-width="2.0"/>
<text x="480.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">C': Знову бівалентний стан!</text>
<text x="480.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Супротивник затримав подію e = (p, m)</text>
<line x1="480.0" y1="252.0" x2="480.0" y2="320.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="320.0" y="325.0" width="320.0" height="52.0" rx="8" fill="#fdf0ed" stroke="#c0392b" stroke-width="2.0"/>
<text x="480.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">C'': Нескінченне блукання бівалентністю</text>
<text x="480.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Система ніколи не переходить у 0- або 1-валентний стан</text>
<line x1="480.0" y1="380.0" x2="480.0" y2="420.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="480.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Завершуваність (Termination) не гарантується за асинхронного розкладу</text>
<rect x="40.0" y="270.0" width="240.0" height="140.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="160.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Якщо алгоритм рухається</tspan><tspan x="160.0" dy="15.6">до 0-валентного стану,</tspan><tspan x="160.0" dy="15.6">супротивник доставляє подію e,</tspan><tspan x="160.0" dy="15.6">яка повертає систему</tspan><tspan x="160.0" dy="15.6">до бівалентності.</tspan></text>
<rect x="680.0" y="270.0" width="240.0" height="140.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="800.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Лема алмазу (Diamond Lemma):</tspan><tspan x="800.0" dy="15.6">якщо дві події e₁ та e₂</tspan><tspan x="800.0" dy="15.6">стосуються різних вузлів,</tspan><tspan x="800.0" dy="15.6">вони комутують:</tspan><tspan x="800.0" dy="15.6">e₁(e₂(C)) = e₂(e₁(C)).</tspan></text>
</svg>