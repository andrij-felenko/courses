<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетин кворумів у CFT та BFT моделях</text>
<rect x="0.0" y="0.0" width="960.0" height="420.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія кворумів: відмови із зупинкою (CFT) проти візантійських (BFT)</text>
<rect x="40.0" y="65.0" width="420.0" height="330.0" rx="10" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<text x="250.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">CFT: Відмови з аварійною зупинкою</text>
<text x="250.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Формула: N ≥ 2f + 1 (наприклад, N = 5, f = 2)</text>
<rect x="65.0" y="145.0" width="110.0" height="85.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.8"/>
<text x="120.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Лише Q1</text>
<text x="120.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">{A, B}</text>
<rect x="190.0" y="145.0" width="120.0" height="85.0" rx="6" fill="#fff9c4" stroke="#fbc02d" stroke-width="2.2"/>
<text x="250.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b78103" text-anchor="middle" font-weight="700">Перетин (≥ 1)</text>
<text x="250.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b78103" text-anchor="middle" font-weight="700">Вузол {C}</text>
<rect x="325.0" y="145.0" width="110.0" height="85.0" rx="6" fill="#e3f2fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="380.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Лише Q2</text>
<text x="380.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">{D, E}</text>
<rect x="60.0" y="250.0" width="380.0" height="125.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="250.0" y="294.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Будь-які два кворуми більшості (f+1 = 3) перетинаються:</tspan><tspan x="250.0" dy="15.0">(f+1) + (f+1) - (2f+1) = 1 вузол.</tspan><tspan x="250.0" dy="15.0">Вузол {C} бачив попередній стан і голосування,</tspan><tspan x="250.0" dy="15.0">тому новий лідер дізнається найсвіжіший запис.</tspan></text>
<rect x="500.0" y="65.0" width="420.0" height="330.0" rx="10" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<text x="710.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">BFT: Візантійські (довільні) збої</text>
<text x="710.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Формула: N ≥ 3f + 1 (наприклад, N = 4, f = 1, кворум 2f+1 = 3)</text>
<rect x="525.0" y="145.0" width="100.0" height="85.0" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.8"/>
<text x="575.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Лише Q1</text>
<text x="575.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">{A}</text>
<rect x="640.0" y="145.0" width="140.0" height="85.0" rx="6" fill="#fff9c4" stroke="#fbc02d" stroke-width="2.2"/>
<text x="710.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b78103" text-anchor="middle" font-weight="700">Перетин (≥ f+1 = 2)</text>
<text x="710.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b78103" text-anchor="middle" font-weight="700">Вузли {B, C}</text>
<rect x="795.0" y="145.0" width="100.0" height="85.0" rx="6" fill="#ede7f6" stroke="#673ab7" stroke-width="1.8"/>
<text x="845.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#673ab7" text-anchor="middle" font-weight="700">Лише Q2</text>
<text x="845.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">{D}</text>
<rect x="520.0" y="250.0" width="380.0" height="125.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="710.0" y="297.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Будь-які два кворуми розміру 2f+1 перетинаються по f+1 вузлах:</tspan><tspan x="710.0" dy="12.3">(2f+1) + (2f+1) - (3f+1) = f+1 вузлів.</tspan><tspan x="710.0" dy="12.3">Оскільки зрадників щонайбільше f, у перетині {B, C}</tspan><tspan x="710.0" dy="12.3">гарантовано є щонайменше 1 чесний вузол.</tspan></text>
</svg>