<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1248 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1248" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ГОРИЗОНТ ЗБЕРЕЖЕННЯ ЗАПИСІВ (TTL): захист від вичерпання диску та зомбі-повторів</tspan></text>
<line x1="120.0" y1="150.0" x2="1060.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="1050.0" y1="150.0" x2="1060.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1060.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">Час →</text>
<line x1="160.0" y1="140.0" x2="160.0" y2="160.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="160.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">T₀ (Перша обробка)</text>
<line x1="536.0" y1="140.0" x2="536.0" y2="160.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="536.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">T_retry (Крайній повтор брокера)</text>
<line x1="818.0" y1="140.0" x2="818.0" y2="160.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="818.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">T_prune (Очищення запису з Inbox)</text>
<rect x="160.0" y="175.0" width="658.0" height="36.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="489.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">БЕЗПЕЧНЕ ВІКНО: msg_id є в таблиці inbox → повтори безпечно відсікаються</text>
<rect x="818.0" y="175.0" width="212.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="924.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ЗОНА РИЗИКУ: запис видалено</text>
<rect x="160.0" y="245.0" width="420.0" height="120.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="370.0" y="271.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">ЛЕГІТИМНИЙ ПОВТОР У МЕЖАХ ВІКНА:</tspan><tspan x="370.0" dy="15.0"></tspan><tspan x="370.0" dy="15.0">• Повтор надходить до моменту T_prune</tspan><tspan x="370.0" dy="15.0">• Рядок знайдено в таблиці inbox</tspan><tspan x="370.0" dy="15.0">• Дубль ігнорується, баланс захищено</tspan><tspan x="370.0" dy="15.0">• Брокеру повертається ACK</tspan></text>
<line x1="366.8" y1="211.0" x2="366.8" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="788.0" y="245.0" width="440.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1008.0" y="271.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1008.0" dy="0.0">ПАСТКА «ЗОМБІ-ПОВТОРУ» (ПІСЛЯ TTL):</tspan><tspan x="1008.0" dy="15.0"></tspan><tspan x="1008.0" dy="15.0">• Зависле повідомлення переграно вручну після T_prune</tspan><tspan x="1008.0" dy="15.0">• Запис про попередню обробку вже видалено з inbox!</tspan><tspan x="1008.0" dy="15.0">• Споживач вважає повідомлення новим</tspan><tspan x="1008.0" dy="15.0">• ПОВТОРНЕ СПИСАННЯ КОШТІВ (Аварія!)</tspan></text>
<line x1="949.6" y1="211.0" x2="949.6" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="395.0" width="940.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="590.0" y="415.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">МАТЕМАТИЧНИЙ РОЗРАХУНОК ВІКНА ЗБЕРЕЖЕННЯ (RETENTION TTL):</tspan><tspan x="590.0" dy="15.6"></tspan><tspan x="590.0" dy="15.6">TTL_inbox  &gt;  Max_Broker_Redelivery_Period  +  DeadLetter_Replay_Buffer  +  Clock_Skew</tspan><tspan x="590.0" dy="15.6"></tspan><tspan x="590.0" dy="15.6">Якщо брокер робить повтори протягом 48 годин, а регламент ручного перегравання DLQ складає 5 днів,</tspan><tspan x="590.0" dy="15.6">мінімальний строк життя записів у таблиці inbox повинен становити не менше 7–14 днів.</tspan></text>
<rect x="40.0" y="555.0" width="1100.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="577.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">таблицю inbox не можна нарощувати нескінченно, але передчасне очищення знищує дедуплікацію;</tspan><tspan x="590.0" dy="16.2">вікно очищення проектується з урахуванням найгіршого часу реакції на інциденти та ручних повторів</tspan></text>
</svg>