<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1120.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">КОНКУРЕНТНІ СПОЖИВАЧІ ТА ЛІЗИ: безпечний паралелізм через блокування рядків</tspan></text>
<rect x="420.0" y="90.0" width="360.0" height="210.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/><text x="600.0" y="136.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ТАБЛИЦЯ INBOX (PostgreSQL)</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">id | status     | locked_until | locked_by</tspan><tspan x="600.0" dy="15.6">---+------------+--------------+----------</tspan><tspan x="600.0" dy="15.6"> 1 | PROCESSING | 12:00:30     | worker-A </tspan><tspan x="600.0" dy="15.6"> 2 | PROCESSING | 12:00:32     | worker-B </tspan><tspan x="600.0" dy="15.6"> 3 | RECEIVED   | NULL         | NULL     </tspan><tspan x="600.0" dy="15.6"> 4 | RECEIVED   | NULL         | NULL     </tspan><tspan x="600.0" dy="15.6"> 5 | PROCESSED  | NULL         | worker-A </tspan></text>
<rect x="50.0" y="90.0" width="300.0" height="140.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="200.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">ВОРКЕР А (Под 1)</tspan><tspan x="200.0" dy="15.0"></tspan><tspan x="200.0" dy="15.0">SELECT id FROM inbox</tspan><tspan x="200.0" dy="15.0">WHERE status = 'RECEIVED'</tspan><tspan x="200.0" dy="15.0">FOR UPDATE SKIP LOCKED LIMIT 1;</tspan><tspan x="200.0" dy="15.0"></tspan><tspan x="200.0" dy="15.0">→ Захоплює рядок 1 (Блокує)</tspan></text>
<rect x="850.0" y="90.0" width="300.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1000.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1000.0" dy="0.0">ВОРКЕР Б (Под 2)</tspan><tspan x="1000.0" dy="15.0"></tspan><tspan x="1000.0" dy="15.0">SELECT id FROM inbox</tspan><tspan x="1000.0" dy="15.0">WHERE status = 'RECEIVED'</tspan><tspan x="1000.0" dy="15.0">FOR UPDATE SKIP LOCKED LIMIT 1;</tspan><tspan x="1000.0" dy="15.0"></tspan><tspan x="1000.0" dy="15.0">→ Пропускає 1, бере рядок 2</tspan></text>
<line x1="350.0" y1="160.0" x2="415.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="850.0" y1="160.0" x2="785.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="340.0" width="1100.0" height="190.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="600.0" y="392.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">МЕХАНІЗМ ВІДНОВЛЕННЯ ПІСЛЯ КРАХУ ВОРКЕРА (LEASE TIMEOUT):</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">1. Воркер А захопив повідомлення 1 і виставив locked_until = NOW() + INTERVAL '30s';</tspan><tspan x="600.0" dy="15.6">2. Воркер А аварійно завершив роботу (OOM / крах хоста) посеред бізнес-обробки;</tspan><tspan x="600.0" dy="15.6">3. Фоновий прибиральник або інший воркер через 30 секунд бачить: status='PROCESSING' AND locked_until &lt; NOW();</tspan><tspan x="600.0" dy="15.6">4. Ліза вважається простроченою → статус скидається в 'RECEIVED' або перехоплюється Воркером В;</tspan><tspan x="600.0" dy="15.6">5. Повідомлення не зависає назавжди й успішно завершується іншим екземпляром.</tspan></text>
<rect x="40.0" y="560.0" width="1120.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="583.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">FOR UPDATE SKIP LOCKED усуває блокування черги між здоровими воркерами;</tspan><tspan x="600.0" dy="16.2">розподілені лізи з обмеженим часом гарантують, що аварія воркера не перетворить повідомлення на вічний висяк</tspan></text>
</svg>