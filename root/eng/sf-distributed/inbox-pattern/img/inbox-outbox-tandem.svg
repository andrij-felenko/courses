<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1120.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">НАСКРІЗНИЙ ТАНДЕМ: Transactional Outbox + Брокер + Transactional Inbox</tspan></text>
<rect x="50.0" y="85.0" width="340.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="2.0"/><text x="220.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">СЕРВІС-ВІДПРАВНИК</tspan><tspan x="220.0" dy="16.9">(Сервіс замовлень)</tspan></text>
<rect x="50.0" y="160.0" width="340.0" height="170.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="220.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">ЛОКАЛЬНА ТРАНЗАКЦІЯ БД:</tspan><tspan x="220.0" dy="15.0"></tspan><tspan x="220.0" dy="15.0">1. INSERT INTO orders ...;</tspan><tspan x="220.0" dy="15.0">2. INSERT INTO outbox (</tspan><tspan x="220.0" dy="15.0">     id, event_type, payload</tspan><tspan x="220.0" dy="15.0">   ) VALUES (</tspan><tspan x="220.0" dy="15.0">     'evt-99', 'OrderCreated', ...</tspan><tspan x="220.0" dy="15.0">   );</tspan><tspan x="220.0" dy="15.0">3. COMMIT;</tspan></text>
<rect x="50.0" y="345.0" width="340.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="220.0" y="371.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Outbox Relay / Debezium CDC:</tspan><tspan x="220.0" dy="15.0">Вичитує події з outbox</tspan><tspan x="220.0" dy="15.0">і публікує їх у брокер</tspan></text>
<rect x="435.0" y="85.0" width="340.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="605.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">БРОКЕР ПОВІДОМЛЕНЬ</tspan><tspan x="605.0" dy="16.9">(Kafka / RabbitMQ / AWS SQS)</tspan></text>
<rect x="435.0" y="160.0" width="340.0" height="260.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="605.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">НЕНАДІЙНИЙ ТРАНСПОРТ:</tspan><tspan x="605.0" dy="15.6"></tspan><tspan x="605.0" dy="15.6">• Гарантія at-least-once</tspan><tspan x="605.0" dy="15.6">• Можливі збої мережі</tspan><tspan x="605.0" dy="15.6">• Таймаути споживачів</tspan><tspan x="605.0" dy="15.6">• Повторні пересилання</tspan><tspan x="605.0" dy="15.6"></tspan><tspan x="605.0" dy="15.6">→ Повідомлення 'evt-99'</tspan><tspan x="605.0" dy="15.6">може бути доставлено</tspan><tspan x="605.0" dy="15.6">1, 2 або більше разів!</tspan></text>
<rect x="820.0" y="85.0" width="340.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="2.0"/><text x="990.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">СЕРВІС-ОТРИМУВАЧ</tspan><tspan x="990.0" dy="16.9">(Сервіс платежів)</tspan></text>
<rect x="820.0" y="160.0" width="340.0" height="170.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="990.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">ЛОКАЛЬНА ТРАНЗАКЦІЯ БД:</tspan><tspan x="990.0" dy="15.0"></tspan><tspan x="990.0" dy="15.0">1. INSERT INTO inbox (msg_id)</tspan><tspan x="990.0" dy="15.0">   VALUES ('evt-99');</tspan><tspan x="990.0" dy="15.0">2. UPDATE accounts</tspan><tspan x="990.0" dy="15.0">   SET balance = balance - 100;</tspan><tspan x="990.0" dy="15.0">3. COMMIT;</tspan><tspan x="990.0" dy="15.0">4. ACK брокеру.</tspan></text>
<rect x="820.0" y="345.0" width="340.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="990.0" y="371.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">Результат: дублікати брокера</tspan><tspan x="990.0" dy="15.0">відсікаються на кроці 1,</tspan><tspan x="990.0" dy="15.0">рахунок списується рівно один раз</tspan></text>
<line x1="220.0" y1="330.0" x2="220.0" y2="343.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="390.0" y1="382.0" x2="430.0" y2="290.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="775.0" y1="290.0" x2="815.0" y2="245.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40.0" y="455.0" width="1120.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="600.0" y="483.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">СИНЕРГІЯ ПАТЕРНІВ:</tspan><tspan x="600.0" dy="16.2">Transactional Outbox гарантує, що повідомлення ніколи не загубиться на боці відправника;</tspan><tspan x="600.0" dy="16.2">Transactional Inbox гарантує, що неминучі дублікати транспорту ніколи не пошкодять стан отримувача</tspan></text>
<rect x="40.0" y="560.0" width="1120.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="583.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">разом Outbox та Inbox реалізують семантику effectively-once у розподіленій системі</tspan><tspan x="600.0" dy="16.2">без використання важких розподілених транзакцій (2PC / XA)</tspan></text>
</svg>