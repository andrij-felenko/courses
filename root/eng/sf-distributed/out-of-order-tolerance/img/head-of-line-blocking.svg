<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння: строгий FIFO-порядок проти толерантної до безладу обробки</text>
<rect x="40.0" y="55.0" width="520.0" height="395.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="300.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Строгий FIFO (одна черга / єдиний потік)</text>
<rect x="65.0" y="115.0" width="80.0" height="45.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="105.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">#1 (OK)</tspan><tspan x="105.0" dy="14.3">оброблено</tspan></text>
<rect x="165.0" y="115.0" width="110.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">#2 (Затримка)</tspan><tspan x="220.0" dy="14.3">блокує чергу!</tspan></text>
<rect x="295.0" y="115.0" width="75.0" height="45.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="332.5" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="332.5" dy="0.0">#3 (Чекає)</tspan><tspan x="332.5" dy="13.0">зависло</tspan></text>
<rect x="385.0" y="115.0" width="75.0" height="45.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="422.5" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="422.5" dy="0.0">#4 (Чекає)</tspan><tspan x="422.5" dy="13.0">зависло</tspan></text>
<rect x="475.0" y="115.0" width="75.0" height="45.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="512.5" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="512.5" dy="0.0">#5 (Чекає)</tspan><tspan x="512.5" dy="13.0">зависло</tspan></text>
<line x1="145.0" y1="137.0" x2="165.0" y2="137.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="275.0" y1="137.0" x2="295.0" y2="137.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="370.0" y1="137.0" x2="385.0" y2="137.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460.0" y1="137.0" x2="475.0" y2="137.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="170.0" y="195.0" width="260.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Єдиний споживач (Single Consumer)</tspan><tspan x="300.0" dy="13.0">Простоює в очікуванні повідомлення #2</tspan></text>
<line x1="300.0" y1="160.0" x2="300.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="265.0" width="480.0" height="165.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="300.0" y="322.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Наслідки суворого впорядкування:</tspan><tspan x="300.0" dy="14.3">• Head-of-Line (HoL) блокування: збій #2 зупиняє всі наступні задачі.</tspan><tspan x="300.0" dy="14.3">• Пропускна здатність обмежена швидкістю одного ядра / з'єднання.</tspan><tspan x="300.0" dy="14.3">• Реплікація та ретраї ламають порядок або створюють каскадні затримки.</tspan><tspan x="300.0" dy="14.3">• Час очікування для #5 зростає експоненційно при мережевих збоях.</tspan></text>
<rect x="580.0" y="55.0" width="520.0" height="395.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="840.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Толерантна архітектура (паралельні воркери)</text>
<rect x="605.0" y="112.0" width="120.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="127.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Воркер 1</tspan></text>
<line x1="725.0" y1="124.0" x2="775.0" y2="124.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="775.0" y="112.0" width="290.0" height="24.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="127.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">#1 виконано</tspan></text>
<rect x="605.0" y="140.0" width="120.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Воркер 2</tspan></text>
<line x1="725.0" y1="152.0" x2="775.0" y2="152.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="775.0" y="140.0" width="290.0" height="24.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="920.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">#2 retry (окремо)</tspan></text>
<rect x="605.0" y="168.0" width="120.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Воркер 3</tspan></text>
<line x1="725.0" y1="180.0" x2="775.0" y2="180.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="775.0" y="168.0" width="290.0" height="24.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">#3 виконано</tspan></text>
<rect x="605.0" y="196.0" width="120.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="211.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Воркер 4</tspan></text>
<line x1="725.0" y1="208.0" x2="775.0" y2="208.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="775.0" y="196.0" width="290.0" height="24.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="211.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">#4 виконано</tspan></text>
<rect x="605.0" y="224.0" width="120.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="239.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Воркер 5</tspan></text>
<line x1="725.0" y1="236.0" x2="775.0" y2="236.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="775.0" y="224.0" width="290.0" height="24.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="239.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">#5 виконано</tspan></text>
<rect x="600.0" y="265.0" width="480.0" height="165.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="840.0" y="322.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Переваги толерантності до безладу:</tspan><tspan x="840.0" dy="14.3">• Повільне або помилкове повідомлення #2 не гальмує #3, #4 та #5.</tspan><tspan x="840.0" dy="14.3">• Масштабування: N незалежних воркерів на повну швидкість каналу.</tspan><tspan x="840.0" dy="14.3">• Комутативні операції та монотонні версії усувають ризик аномалій.</tspan><tspan x="840.0" dy="14.3">• Стійкість: мережеві затримки локалізуються без каскадного колапсу.</tspan></text>
</svg>