<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири стратегії подолання безладу в розподілених системах</text>
<rect x="35.0" y="55.0" width="255.0" height="335.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/>
<rect x="45.0" y="70.0" width="235.0" height="52.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="162.5" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="162.5" dy="0.0">1. Комутативність</tspan><tspan x="162.5" dy="16.2">(Algebraic Commutativity)</tspan></text>
<rect x="45.0" y="132.0" width="235.0" height="245.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="162.5" y="226.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Суть: стан не залежить від порядку дій.</tspan><tspan x="162.5" dy="12.3"></tspan><tspan x="162.5" dy="12.3">• Формула: A · B = B · A</tspan><tspan x="162.5" dy="12.3">• Приклади: CRDT (PN-Counter, OR-Set),</tspan><tspan x="162.5" dy="12.3">  додавання коштів, логування подій.</tspan><tspan x="162.5" dy="12.3">• Ціна: обмежений клас бізнес-операцій.</tspan></text>
<rect x="305.0" y="55.0" width="255.0" height="335.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<rect x="315.0" y="70.0" width="235.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="432.5" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="432.5" dy="0.0">2. Монотонні версії</tspan><tspan x="432.5" dy="16.2">(Monotonic Guards / LWW)</tspan></text>
<rect x="315.0" y="132.0" width="235.0" height="245.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="432.5" y="228.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="432.5" dy="0.0">Суть: ігнорування або скидання старих версій.</tspan><tspan x="432.5" dy="11.7"></tspan><tspan x="432.5" dy="11.7">• Правило: if v_msg &lt; v_state: discard</tspan><tspan x="432.5" dy="11.7">• Приклади: Sequence numbers, епохи,</tspan><tspan x="432.5" dy="11.7">  Fencing tokens, логічні годинники.</tspan><tspan x="432.5" dy="11.7">• Ціна: втрата старих проміжних правок.</tspan></text>
<rect x="575.0" y="55.0" width="255.0" height="335.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<rect x="585.0" y="70.0" width="235.0" height="52.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="702.5" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="702.5" dy="0.0">3. Віконний буфер</tspan><tspan x="702.5" dy="16.2">(Resequencer Buffer)</tspan></text>
<rect x="585.0" y="132.0" width="235.0" height="245.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="702.5" y="228.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="702.5" dy="0.0">Суть: тимчасове утримання та відновлення черги.</tspan><tspan x="702.5" dy="11.7"></tspan><tspan x="702.5" dy="11.7">• Механізм: ковзне вікно + таймаут прогалини</tspan><tspan x="702.5" dy="11.7">• Приклади: TCP RX Buffer, Kafka Consumer</tspan><tspan x="702.5" dy="11.7">  sliding resequencer, Flink Watermark.</tspan><tspan x="702.5" dy="11.7">• Ціна: витрата RAM та додатковий лаг.</tspan></text>
<rect x="845.0" y="55.0" width="260.0" height="335.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.4"/>
<rect x="855.0" y="70.0" width="240.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="975.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">4. Авансовий стан</tspan><tspan x="975.0" dy="16.2">(Tombstones / Inversion)</tspan></text>
<rect x="855.0" y="132.0" width="240.0" height="245.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="975.0" y="228.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">Суть: готовність прийняти скасування до створення.</tspan><tspan x="975.0" dy="11.7"></tspan><tspan x="975.0" dy="11.7">• Механізм: збереження маркерів-надгробків</tspan><tspan x="975.0" dy="11.7">• Приклади: 'Cancel' прийшов раніше за 'Create';</tspan><tspan x="975.0" dy="11.7">  створюється запис 'Cancelled-Placeholder'.</tspan><tspan x="975.0" dy="11.7">• Ціна: складніший автомат станів (FSM).</tspan></text>
<rect x="35.0" y="400.0" width="1070.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="570.0" y="431.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Інженерний вибір: замість блокування всього конвеєра заради глобального FIFO, архітектор обирає математичну комутативність або локальні фільтри та буфери.</tspan></text>
</svg>