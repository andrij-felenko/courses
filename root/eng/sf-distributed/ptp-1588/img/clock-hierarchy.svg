<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Топологія та типи годинників PTP: GMC, BC, TC та Ordinary Clocks</text>
<rect x="150.1" y="52.0" width="539.9" height="45.9" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="420.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Grandmaster Clock (GMC)</tspan><tspan x="420.0" dy="16.9">Первинний еталон часу (GNSS / Атомний годинник Cesium / Rubidium)</tspan></text>
<rect x="94.2" y="166.3" width="271.6" height="87.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="184.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Boundary Clock (BC)</tspan><tspan x="230.0" dy="15.0">• Один Slave-порт синхронізується з GMC</tspan><tspan x="230.0" dy="15.0">• Власний генератор підлаштовується</tspan><tspan x="230.0" dy="15.0">• Master-порти роздають час далі</tspan><tspan x="230.0" dy="15.0">• Розвантажує GMC, створює новий домен</tspan></text>
<rect x="441.4" y="166.3" width="337.2" height="87.3" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="184.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Transparent Clock (TC)</tspan><tspan x="610.0" dy="15.0">• Не має власної ролі Master/Slave</tspan><tspan x="610.0" dy="15.0">• Вимірює час перебування пакету (Residence Time)</tspan><tspan x="610.0" dy="15.0">• Додає затримку комутатора в correctionField</tspan><tspan x="610.0" dy="15.0">• Усуває джитер черг пакетного комутатора</tspan></text>
<line x1="330.0" y1="105.0" x2="230.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Sync / Follow_Up</text>
<line x1="510.0" y1="105.0" x2="610.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Sync + correctionField</text>
<rect x="49.2" y="364.2" width="141.6" height="51.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Ordinary Clock (OC)</tspan><tspan x="120.0" dy="14.3">Slave Node 1</tspan><tspan x="120.0" dy="14.3">(Industrial Drive)</tspan></text>
<rect x="269.2" y="364.2" width="141.6" height="51.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Ordinary Clock (OC)</tspan><tspan x="340.0" dy="14.3">Slave Node 2</tspan><tspan x="340.0" dy="14.3">(Sensor Gateway)</tspan></text>
<rect x="439.2" y="364.2" width="141.6" height="51.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Ordinary Clock (OC)</tspan><tspan x="510.0" dy="14.3">Slave Node 3</tspan><tspan x="510.0" dy="14.3">(5G Radio Unit)</tspan></text>
<rect x="639.0" y="364.2" width="162.0" height="51.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Ordinary Clock (OC)</tspan><tspan x="720.0" dy="14.3">Slave Node 4</tspan><tspan x="720.0" dy="14.3">(Power Substation IED)</tspan></text>
<line x1="200.0" y1="270.0" x2="120.0" y2="355.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="260.0" y1="270.0" x2="340.0" y2="355.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580.0" y1="270.0" x2="510.0" y2="355.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640.0" y1="270.0" x2="720.0" y2="355.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>