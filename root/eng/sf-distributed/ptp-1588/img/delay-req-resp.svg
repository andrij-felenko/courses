<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотириетапний обмін E2E: вимірювання зміщення та затримки лінії</text>
<line x1="220.0" y1="70.0" x2="220.0" y2="430.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="620.0" y1="70.0" x2="620.0" y2="430.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="101.2" y="35.2" width="237.6" height="33.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="56.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Master (Головний годинник)</tspan></text>
<rect x="513.7" y="35.2" width="212.5" height="33.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="56.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Slave (Підпорядкований)</tspan></text>
<line x1="220.0" y1="100.0" x2="620.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="220.0" cy="100.0" r="4.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="620.0" cy="150.0" r="4.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="208.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">t1 (відправлено Sync)</text>
<text x="632.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">t2 (отримано Sync)</text>
<text x="420.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Повідомлення Sync</text>
<line x1="220.0" y1="175.0" x2="620.0" y2="215.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">2. Follow_Up (передає точне значення t1)</text>
<line x1="620.0" y1="260.0" x2="220.0" y2="310.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="620.0" cy="260.0" r="4.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="220.0" cy="310.0" r="4.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="632.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">t3 (відправлено Delay_Req)</text>
<text x="208.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">t4 (отримано Delay_Req)</text>
<text x="420.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. Повідомлення Delay_Req</text>
<line x1="220.0" y1="335.0" x2="620.0" y2="375.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">4. Delay_Resp (передає точне значення t4)</text>
<rect x="76.8" y="410.6" width="686.5" height="48.8" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="431.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Затримка лінії:   MeanPathDelay = ((t2 - t1) + (t4 - t3)) / 2</tspan><tspan x="420.0" dy="16.2">Зміщення годинника:   Offset = ((t2 - t1) - (t4 - t3)) / 2 = (t2 - t1) - MeanPathDelay</tspan></text>
</svg>