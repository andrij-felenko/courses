<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 814 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="814" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гарантія порядку причинності через бар'єр Commit Wait</text>
<line x1="60.0" y1="60.0" x2="700.0" y2="60.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="710.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Реальний час t</text>
<rect x="40.0" y="75.0" width="680.0" height="145.0" rx="6" fill="none" stroke="#c0392b" stroke-width="1.2"/>
<text x="55.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1. Наївні скалярні мітки (вузол В відстає від вузла А): порушення порядку</text>
<rect x="80.0" y="110.0" width="140.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="150.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">T1 на Вузлі A: мітка s₁ = 100</text>
<line x1="220.0" y1="126.0" x2="330.0" y2="160.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="285.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">зовнішній зв'язок (клієнт)</text>
<rect x="330.0" y="145.0" width="150.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="405.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">T2 на Вузлі B: мітка s₂ = 95 (дрейф!)</text>
<text x="540.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Аномалія: T1 завершилась ДО T2,</text>
<text x="540.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">але s₂ &lt; s₁ (T2 виглядає давнішою!)</text>
<rect x="40.0" y="235.0" width="680.0" height="185.0" rx="6" fill="none" stroke="#27ae60" stroke-width="1.2"/>
<text x="55.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">2. TrueTime з правилом Commit Wait: розведення інтервалів у реальному часі</text>
<rect x="70.0" y="270.0" width="120.0" height="30.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="123.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">T1: вибір s₁ = latest₁</text>
<rect x="190.0" y="270.0" width="110.0" height="30.0" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
<text x="245.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d00" text-anchor="middle" font-weight="700">Commit Wait (≥ 2ε)</text>
<line x1="300.0" y1="265.0" x2="300.0" y2="305.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="300.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Відповідь клієнту: s₁ гарантовано в минулому</text>
<line x1="300.0" y1="285.0" x2="420.0" y2="345.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 2"/>
<rect x="420.0" y="335.0" width="140.0" height="30.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="490.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">T2: вибір s₂ = latest₂</text>
<rect x="310.3" y="374.2" width="319.5" height="31.5" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">s₁ &lt; earliest(T2) ≤ s₂  ⇒  s₁ &lt; s₂ завжди!</tspan></text>
</svg>