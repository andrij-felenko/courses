<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр розподіленої транзакції: 2PC, вибір мітки та Commit Wait</text>
<rect x="35.0" y="70.0" width="126.0" height="90.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="98.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Читання і запис</text>
<text x="98.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Отримання блокувань (Locks)</text>
<text x="98.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">та виконання локальних змін</text>
<line x1="161.0" y1="115.0" x2="175.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="171.0" y1="111.0" x2="175.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="171.0" y1="119.0" x2="175.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="175.0" y="70.0" width="126.0" height="90.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="238.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Фаза Prepare 2PC</text>
<text x="238.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Учасники надсилають Prepare;</text>
<text x="238.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Лідер збирає кворум голосів</text>
<line x1="301.0" y1="115.0" x2="315.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="311.0" y1="111.0" x2="315.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="311.0" y1="119.0" x2="315.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="315.0" y="70.0" width="126.0" height="90.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="378.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Вибір мітки коміту</text>
<text x="378.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Лідер викликає TT.now()</text>
<text x="378.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">і обирає s = latest (s ≥ t_real)</text>
<line x1="441.0" y1="115.0" x2="455.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="451.0" y1="111.0" x2="455.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="451.0" y1="119.0" x2="455.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="455.0" y="70.0" width="126.0" height="90.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="518.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">4. Бар'єр Commit Wait</text>
<text x="518.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Лідер блокує відповідь,</text>
<text x="518.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">доки TT.now().earliest &gt; s</text>
<line x1="581.0" y1="115.0" x2="595.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="591.0" y1="111.0" x2="595.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="591.0" y1="119.0" x2="595.0" y2="115.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="595.0" y="70.0" width="126.0" height="90.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="658.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5. Фіксація і відповідь</text>
<text x="658.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Запис у журнал, зняття замків,</text>
<text x="658.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">відповідь клієнту з міткою s</text>
<rect x="35.0" y="200.0" width="690.0" height="185.0" rx="6" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<text x="55.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Транзакції читання за знімком (Snapshot Isolation) без жодних блокувань:</text>
<rect x="55.0" y="245.0" width="300.0" height="115.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="205.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Читання в теперішньому (Read at Now):</text>
<text x="205.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Клієнт викликає t_read = TT.now().latest</text>
<text x="205.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2. Якщо версія s &gt; t_read — вона ще не існує</text>
<text x="205.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3. Читання повністю узгоджене й лінеаризовне</text>
<rect x="395.0" y="245.0" width="330.0" height="115.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="560.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Читання в минулому (Read at Timestamp T):</text>
<text x="560.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Клієнт обирає t_hist &lt; TT.now().earliest</text>
<text x="560.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2. Читає дані з версією s ≤ t_hist напряму з диска</text>
<text x="560.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">3. Жодної взаємодії з лідером чи активними замками!</text>
</svg>