<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="40.0" width="330.0" height="320.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<rect x="52.0" y="55.0" width="306.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="205.0" y="80.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Стадія 1: Продюсер → Брокер</tspan></text>
<rect x="55.0" y="110.0" width="300.0" height="235.0" rx="6" fill="#eaf0fd" stroke="none" stroke-width="1.5"/><text x="205.0" y="203.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Гарантія публікації:</tspan><tspan x="205.0" dy="13.7">• acks = 0 (надіслав і забув)</tspan><tspan x="205.0" dy="13.7">• acks = 1 (запис у лідера)</tspan><tspan x="205.0" dy="13.7">• acks = all (кворум реплік)</tspan><tspan x="205.0" dy="13.7">• PID + SeqNum (дедуплікація на вході брокера)</tspan></text>
<rect x="410.0" y="40.0" width="360.0" height="320.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<rect x="422.0" y="55.0" width="336.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="590.0" y="80.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Стадія 2: Сховище брокера</tspan></text>
<rect x="425.0" y="110.0" width="330.0" height="235.0" rx="6" fill="#eaf0fd" stroke="none" stroke-width="1.5"/><text x="590.0" y="199.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Стійкість у спокої:</tspan><tspan x="590.0" dy="16.2">• Write-Ahead Log (WAL)</tspan><tspan x="590.0" dy="16.2">• Синхронізація fsync</tspan><tspan x="590.0" dy="16.2">• Реплікація в ISR (In-Sync Replicas)</tspan><tspan x="590.0" dy="16.2">• Збереження порядку в партиції</tspan></text>
<rect x="810.0" y="40.0" width="330.0" height="320.0" rx="8" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/>
<rect x="822.0" y="55.0" width="306.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="975.0" y="80.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">Стадія 3: Брокер → Консюмер</tspan></text>
<rect x="825.0" y="110.0" width="300.0" height="235.0" rx="6" fill="#e8f6ee" stroke="none" stroke-width="1.5"/><text x="975.0" y="183.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">Гарантія споживання:</tspan><tspan x="975.0" dy="16.2">• Автокоміт до обробки</tspan><tspan x="975.0" dy="16.2">  → at-most-once (ризик втрати)</tspan><tspan x="975.0" dy="16.2">• Коміт після збереження в БД</tspan><tspan x="975.0" dy="16.2">  → at-least-once (ризик дубля)</tspan><tspan x="975.0" dy="16.2">• Транзакційний Inbox</tspan><tspan x="975.0" dy="16.2">  → effectively-once</tspan></text>
<line x1="372.0" y1="200.0" x2="408.0" y2="200.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="772.0" y1="200.0" x2="808.0" y2="200.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="385.0" width="1100.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="590.0" y="430.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Закон наскрізного ланцюга: загальна гарантія системи дорівнює найслабшій ланці. Навіть якщо брокер забезпечує ідемпотентну публікацію та потрійну реплікацію, консюмер з автокомітом зміщення до завершення обробки зводить усю систему до at-most-once.</tspan></text>
</svg>