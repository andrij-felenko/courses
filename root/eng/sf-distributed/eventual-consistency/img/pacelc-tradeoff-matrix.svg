<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця PACELC: класифікація розподілених систем за компромісами</text>
<rect x="130.0" y="120.0" width="460.0" height="200.0" rx="4" fill="#fdf2e9" stroke="#333333" stroke-width="1.2"/>
<rect x="590.0" y="120.0" width="460.0" height="200.0" rx="4" fill="#eafaf1" stroke="#333333" stroke-width="1.2"/>
<rect x="130.0" y="320.0" width="460.0" height="200.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="590.0" y="320.0" width="460.0" height="200.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<line x1="130.0" y1="320.0" x2="1050.0" y2="320.0" stroke="#333333" stroke-width="2.5"/>
<line x1="590.0" y1="120.0" x2="590.0" y2="520.0" stroke="#333333" stroke-width="2.5"/>
<rect x="410.0" y="86.0" width="360.0" height="26.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="102.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ЗА НАЯВНОСТІ ПОДІЛУ МЕРЕЖІ (If Partition)</tspan></text>
<rect x="145.0" y="135.0" width="430.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">PA / EL: ДОСТУПНІСТЬ ТА НИЗЬКА ЛАТЕНТНІСТЬ</tspan><tspan x="360.0" dy="15.0">Кінцева узгодженість (Eventual Consistency)</tspan></text>
<rect x="145.0" y="188.0" width="430.0" height="115.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">• При аварії мережі: обирають доступність (A), приймають записи у всіх сегментах.</tspan><tspan x="360.0" dy="11.7">• У штатному режимі: обирають низьку латентність (L), відповідають без синхронного кворуму.</tspan><tspan x="360.0" dy="11.7">• Системи: Amazon Dynamo, Apache Cassandra (ONE/LOCAL_QUORUM), Riak, Couchbase.</tspan></text>
<rect x="605.0" y="135.0" width="430.0" height="46.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">PC / EC: СТРОГА ЛІНІЙНІСТЬ ТА АТОМАРНІСТЬ</tspan><tspan x="820.0" dy="15.0">Лінеаризовність (Linearizability / Single-Copy)</tspan></text>
<rect x="605.0" y="188.0" width="430.0" height="115.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">• При аварії мережі: блокують меншість заради захисту узгодженості (C).</tspan><tspan x="820.0" dy="11.7">• У штатному режимі: платять латентністю синхронного консенсусу (C) заради свіжості.</tspan><tspan x="820.0" dy="11.7">• Системи: Google Spanner, CockroachDB, etcd, Apache ZooKeeper, TiDB.</tspan></text>
<rect x="145.0" y="335.0" width="430.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">PA / EC: КОМПРОМІС СВІЖОСТІ ТА ДОСТУПНОСТІ</tspan></text>
<rect x="145.0" y="384.0" width="430.0" height="115.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="432.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">• При аварії: продовжують обслуговувати доступність (A) з локальних копій.</tspan><tspan x="360.0" dy="11.7">• У штатному режимі: підтримують строгу узгодженість (C) на первинному вузлі.</tspan><tspan x="360.0" dy="11.7">• Системи: MongoDB (з конфігурацією uncommitted reads), MySQL/PostgreSQL з асинхронним primary.</tspan></text>
<rect x="605.0" y="335.0" width="430.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">PC / EL: ТЕОРЕТИЧНИЙ КОРИДОР ЕКСТРЕМАЛЬНОЇ ЛАТЕНТНОСТІ</tspan></text>
<rect x="605.0" y="384.0" width="430.0" height="115.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="432.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">• При аварії: блокують роботу для запобігання аномаліям (C).</tspan><tspan x="820.0" dy="11.7">• У штатному режимі: оптимізують латентність (L) через in-memory однопотокове виконання.</tspan><tspan x="820.0" dy="11.7">• Системи: VoltDB / H-Store (локальні транзакції у пам'яті без блокувань).</tspan></text>
<rect x="120.0" y="555.0" width="940.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="590.0" y="578.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Теорема PACELC (Даніель Абаді): Якщо поділ (If Partition) → обирай між Доступністю (A) та Узгодженістю (C);</tspan><tspan x="590.0" dy="15.6">Інакше (Else) → обирай між Латентністю (L) та Узгодженістю (C). Кінцева узгодженість обирає клас PA/EL.</tspan></text>
</svg>