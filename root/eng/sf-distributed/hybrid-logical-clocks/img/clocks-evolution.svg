<rect x="15.0" y="505.0" width="1010.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="520.0" y="534.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Висновок: HLC поєднує компактність і масштабованість годинників Лампорта (O(1)) із прив'язкою до реального часу TrueTime,</tspan><tspan x="520.0" dy="13.7">не вимагаючи спеціалізованого апаратного обладнання (атомних годинників чи супутникових GPS-приймачів).</tspan></text>
