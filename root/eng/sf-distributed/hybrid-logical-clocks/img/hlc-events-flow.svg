<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік подій, перехід станів та оновлення HLC між трьома вузлами</text>
<line x1="160.0" y1="110.0" x2="940.0" y2="110.0" stroke="#333333" stroke-width="2.0"/>
<line x1="160.0" y1="260.0" x2="940.0" y2="260.0" stroke="#333333" stroke-width="2.0"/>
<line x1="160.0" y1="420.0" x2="940.0" y2="420.0" stroke="#333333" stroke-width="2.0"/>
<rect x="20.0" y="85.0" width="125.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="82.5" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="82.5" dy="0.0">Вузол A</tspan><tspan x="82.5" dy="14.3">pt_A = t</tspan></text>
<rect x="20.0" y="235.0" width="125.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="82.5" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="82.5" dy="0.0">Вузол B (відстає)</tspan><tspan x="82.5" dy="13.0">pt_B = t - 8</tspan></text>
<rect x="20.0" y="395.0" width="125.0" height="50.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.5"/><text x="82.5" y="417.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="82.5" dy="0.0">Вузол C (поспішає)</tspan><tspan x="82.5" dy="11.7">pt_C = t + 5</tspan></text>
<circle cx="220.0" cy="110.0" r="6.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<rect x="165.0" y="45.0" width="110.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="60.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">e1: Локальна подія</tspan><tspan x="220.0" dy="11.7">pt=100</tspan><tspan x="220.0" dy="11.7">HLC = (100, 0)</tspan></text>
<circle cx="360.0" cy="110.0" r="6.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<rect x="305.0" y="45.0" width="110.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">e2: Відправка m1</tspan><tspan x="360.0" dy="12.3">pt=100</tspan><tspan x="360.0" dy="12.3">HLC = (100, 1)</tspan></text>
<line x1="360.0" y1="116.0" x2="480.0" y2="254.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Повідомлення m1 з міткою (100, 1)</text>
<circle cx="480.0" cy="260.0" r="6.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<rect x="395.0" y="278.0" width="170.0" height="62.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">e3: Прийом m1 (pt=92 &lt; 100)</tspan><tspan x="480.0" dy="11.7">l = max(92, 100) = 100</tspan><tspan x="480.0" dy="11.7">c = 1 + 1 = 2</tspan><tspan x="480.0" dy="11.7">HLC = (100, 2)</tspan></text>
<circle cx="680.0" cy="260.0" r="6.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<rect x="600.0" y="195.0" width="160.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="211.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">e4: Відправка m2 (pt=108)</tspan><tspan x="680.0" dy="11.7">108 &gt; 100 -&gt; l=108, c=0</tspan><tspan x="680.0" dy="11.7">HLC = (108, 0)</tspan></text>
<line x1="680.0" y1="266.0" x2="800.0" y2="414.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="720.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Повідомлення m2 з міткою (108, 0)</text>
<circle cx="800.0" cy="420.0" r="6.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<rect x="715.0" y="438.0" width="170.0" height="62.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">e5: Прийом m2 (pt=114 &gt; 108)</tspan><tspan x="800.0" dy="11.7">l = max(108, 114) = 114</tspan><tspan x="800.0" dy="11.7">c = 0 (скидання лічильника)</tspan><tspan x="800.0" dy="11.7">HLC = (114, 0)</tspan></text>
<rect x="40.0" y="505.0" width="920.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="500.0" y="526.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Ключові інваріанти на часовій діаграмі:</tspan><tspan x="500.0" dy="13.0">1. Причинність зберігається: e1 (100,0) &lt; e2 (100,1) &lt; e3 (100,2) &lt; e4 (108,0) &lt; e5 (114,0).</tspan><tspan x="500.0" dy="13.0">2. Коли локальний годинник відстає (e3), компонента l «перестрибує» наперед, а лічильник c інкрементується.</tspan><tspan x="500.0" dy="13.0">3. Щойно фізичний час наздоганяє l (e4, e5), компонента l стає рівною pt, а логічний лічильник c скидається в 0.</tspan></text>
</svg>