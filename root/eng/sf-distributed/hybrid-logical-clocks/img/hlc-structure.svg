<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія та бінарна структура мітки часу HLC</text>
<rect x="40.0" y="60.0" width="880.0" height="180.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="480.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Складові компоненти гібридної мітки HLC = (l, c, node)</text>
<rect x="60.0" y="105.0" width="273.3" height="115.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="196.7" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">l : Фізичний час (Physical)</text>
<text x="196.7" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Найбільший відомий фізичний час</text>
<text x="196.7" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">l = max(l_prev, msg.l, pt_local)</text>
<text x="196.7" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Гарантує |l - pt| &lt;= ε (обмежений дрейф)</text>
<rect x="343.3" y="105.0" width="273.3" height="115.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="480.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">c : Логічний лічильник (Logical)</text>
<text x="480.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Впорядкування в межах одного тіку l</text>
<text x="480.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">c = c + 1 або max(c, msg.c) + 1</text>
<text x="480.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Скидається в 0, коли pt наздоганяє l</text>
<rect x="626.7" y="105.0" width="273.3" height="115.0" rx="6" fill="#fff9db" stroke="#333333" stroke-width="1.5"/>
<text x="763.3" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">node_id : Вузол (Tie-breaker)</text>
<text x="763.3" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Унікальний номер вузла в кластері</text>
<text x="763.3" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Забезпечує строгий повний порядок</text>
<text x="763.3" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вирішує колізії при однакових (l, c)</text>
<rect x="40.0" y="260.0" width="880.0" height="235.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="480.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компактне бінарне кодування (фіксований розмір O(1))</text>
<rect x="80.0" y="310.0" width="520.0" height="45.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="340.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Фізичний час l (48 бітів або 64 біти)</text>
<text x="340.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Мілісекунди або наносекунди від Unix Epoch</text>
<rect x="600.0" y="310.0" width="280.0" height="45.0" rx="4" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="740.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Лічильник c (16 або 32 біти)</text>
<text x="740.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Логічний інкремент</text>
<rect x="80.0" y="380.0" width="800.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="480.0" y="417.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Правило лексикографічного порівняння:</tspan><tspan x="480.0" dy="13.7">ts1 &lt; ts2  &lt;=&gt;  (l1 &lt; l2) АБО (l1 == l2 ТА c1 &lt; c2) АБО (l1 == l2 ТА c1 == c2 ТА node1 &lt; node2)</tspan><tspan x="480.0" dy="13.7">У Big-Endian бінарному форматі звичайне числове або memcmp() порівняння безпосередньо відтворює причинний порядок.</tspan></text>
</svg>