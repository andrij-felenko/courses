<rect x="375.0" y="40.0" width="310.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="385.0" y="50.0" width="290.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">2. Неузгоджені репліки</tspan><tspan x="530.0" dy="15.6">(Шторм дублікатів)</tspan></text>
<rect x="390.0" y="105.0" width="85.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="432.5" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="432.5" dy="0.0">Под 1</tspan><tspan x="432.5" dy="13.0">crond</tspan></text>
<rect x="485.0" y="105.0" width="90.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Под 2</tspan><tspan x="530.0" dy="13.0">crond</tspan></text>
<rect x="585.0" y="105.0" width="85.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="627.5" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">Под N</tspan><tspan x="627.5" dy="13.0">crond</tspan></text>
<line x1="530.0" y1="160.0" x2="530.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="395.0" y="200.0" width="270.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">ОДНОЧАСНИЙ СТАРТ О 00:00</tspan><tspan x="530.0" dy="14.3">Усі N подів одночасно</tspan><tspan x="530.0" dy="14.3">запускають ту саму задачу</tspan></text>
