<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="40.0" width="310.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="40.0" y="50.0" width="290.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">1. Єдиний сервер із crond</tspan><tspan x="185.0" dy="15.6">(Single Point of Failure)</tspan></text>
<rect x="50.0" y="105.0" width="270.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Сервер А: виконує crond</tspan><tspan x="185.0" dy="14.3">(розклад 00:00 UTC)</tspan></text>
<line x1="185.0" y1="160.0" x2="185.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="200.0" width="270.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="224.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">АВАРІЯ СЕРВЕРА А</tspan><tspan x="185.0" dy="14.3">(Kernel panic / OOM о 23:50)</tspan></text>
<line x1="185.0" y1="260.0" x2="185.0" y2="295.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
