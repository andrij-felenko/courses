<rect x="395.0" y="300.0" width="270.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="320.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="530.0" dy="0.0">НАСЛІДОК: Руйнування даних</tspan><tspan x="530.0" dy="13.7">N-кратне списання коштів,</tspan><tspan x="530.0" dy="13.7">перевантаження бази блокуваннями,</tspan><tspan x="530.0" dy="13.7">стан гонитви у сховищі.</tspan></text>
<rect x="720.0" y="40.0" width="310.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="730.0" y="50.0" width="290.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="875.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">3. Дрейф часу та GC-паузи</tspan><tspan x="875.0" dy="15.6">(Невидимі зсуви вікна)</tspan></text>
<rect x="740.0" y="105.0" width="270.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="875.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">sleep(60) у циклі планувальника</tspan><tspan x="875.0" dy="14.3">(розрахунок на точний час)</tspan></text>
<line x1="875.0" y1="160.0" x2="875.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="740.0" y="200.0" width="270.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="875.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">ЗСУВ NTP АБО ПАУЗА GC</tspan><tspan x="875.0" dy="14.3">Стрибок годинника на 65 с або</tspan><tspan x="875.0" dy="14.3">зависання VM у свопі</tspan></text>
<line x1="875.0" y1="260.0" x2="875.0" y2="295.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="740.0" y="300.0" width="270.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="875.0" y="320.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="875.0" dy="0.0">НАСЛІДОК: Втрата вікна запуску</tspan><tspan x="875.0" dy="13.7">Перевірка `min == 0` пропускається.</tspan><tspan x="875.0" dy="13.7">Задача чекає наступної доби</tspan><tspan x="875.0" dy="13.7">або запускається із запізненням.</tspan></text>
