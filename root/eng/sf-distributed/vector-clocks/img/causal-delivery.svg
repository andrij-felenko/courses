<rect x="625.0" y="120.0" width="290.0" height="74.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="141.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">1. Отримано m₂ [1, 1, 0]:</tspan><tspan x="770.0" dy="12.3">Локальний вектор: [0, 0, 0]</tspan><tspan x="770.0" dy="12.3">Умова: V_msg[1] &lt;= V_loc[1] (1 &lt;= 0 — ХИБА!)</tspan><tspan x="770.0" dy="12.3">Рішення: Затримати m₂ у черзі!</tspan></text>
