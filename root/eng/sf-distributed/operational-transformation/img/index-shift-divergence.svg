<rect x="44.0" y="275.0" width="180.0" height="68.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="134.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="134.0" dy="0.0">A застосовує Ins(0, 'H'):</tspan><tspan x="134.0" dy="14.3">'H' на поз. 0 у «CT»</tspan><tspan x="134.0" dy="14.3">→ «HCT»</tspan></text>
<rect x="264.0" y="275.0" width="180.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="354.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="354.0" dy="0.0">B застосовує Del(1):</tspan><tspan x="354.0" dy="14.3">видаляє 'C' у «HCAT»</tspan><tspan x="354.0" dy="14.3">→ «HAT» (помилка!)</tspan></text>
<rect x="44.0" y="365.0" width="400.0" height="150.0" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/><text x="244.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="244.0" dy="0.0">РЕЗУЛЬТАТ: РОЗХОДЖЕННЯ ТА ВТРАТА НАМІРУ</tspan><tspan x="244.0" dy="14.3"></tspan><tspan x="244.0" dy="14.3">• Клієнт A бачить «HCT», Клієнт B бачить «HAT»</tspan><tspan x="244.0" dy="14.3">• Символ 'A' лишився в тексті на вузлі B</tspan><tspan x="244.0" dy="14.3">• Символ 'C' помилково видалено через зсув індексу</tspan><tspan x="244.0" dy="14.3">• Копії документів розійшлися назавжди</tspan></text>
