<rect x="516.0" y="275.0" width="180.0" height="68.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="606.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="606.0" dy="0.0">A отримує Ins'(0, 'H'):</tspan><tspan x="606.0" dy="14.3">0 &lt;= 1 → без зсуву</tspan><tspan x="606.0" dy="14.3">→ «HCT»</tspan></text>
<rect x="736.0" y="275.0" width="180.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="826.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">B отримує Del'(2, 'A'):</tspan><tspan x="826.0" dy="14.3">1 &gt;= 0 → зсув на +1</tspan><tspan x="826.0" dy="14.3">→ «HCT» (коректно!)</tspan></text>
<rect x="516.0" y="365.0" width="400.0" height="150.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="716.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="716.0" dy="0.0">РЕЗУЛЬТАТ: ПОВНА ЗБІЖНІСТЬ ТА ЗБЕРЕЖЕННЯ НАМІРУ</tspan><tspan x="716.0" dy="14.3"></tspan><tspan x="716.0" dy="14.3">• Обидва клієнти мають однаковий текст «HCT»</tspan><tspan x="716.0" dy="14.3">• Символ 'A' видалено на обох вузлах</tspan><tspan x="716.0" dy="14.3">• Символ 'H' коректно вставлено на позицію 0</tspan><tspan x="716.0" dy="14.3">• Намір кожного автора повністю збережено</tspan></text>
