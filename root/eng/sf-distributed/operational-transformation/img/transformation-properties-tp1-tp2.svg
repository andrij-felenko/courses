<rect x="766.0" y="210.0" width="140.0" height="34.0" rx="6" fill="#fef8f0" stroke="#d97706" stroke-width="1.5"/><text x="836.0" y="230.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="836.0" dy="0.0">Через op2: T(op3, op2)</tspan></text>
<line x1="686.0" y1="168.0" x2="616.0" y2="206.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="746.0" y1="168.0" x2="816.0" y2="206.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="516.0" y="290.0" width="160.0" height="44.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="596.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">T( T(op3, op1),</tspan><tspan x="596.0" dy="13.7">   T(op2, op1) )</tspan></text>
<rect x="756.0" y="290.0" width="160.0" height="44.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="836.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="836.0" dy="0.0">T( T(op3, op2),</tspan><tspan x="836.0" dy="13.7">   T(op1, op2) )</tspan></text>
<line x1="596.0" y1="248.0" x2="596.0" y2="286.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="836.0" y1="248.0" x2="836.0" y2="286.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="312.0" x2="752.0" y2="312.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="4,4"/>
<text x="716.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">≡</text>
<rect x="516.0" y="385.0" width="400.0" height="56.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.5"/><text x="716.0" y="410.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="716.0" dy="0.0">Трансформована op3 однакова незалежно від порядку врахування op1 та op2.</tspan><tspan x="716.0" dy="11.7">Критично необхідна умова для децентралізованих (P2P) алгоритмів OT.</tspan></text>
</svg>