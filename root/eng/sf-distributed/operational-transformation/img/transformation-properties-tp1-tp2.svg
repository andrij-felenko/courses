<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивості коректності перетворень: TP1 та TP2</text>
<rect x="24.0" y="55.0" width="440.0" height="400.0" rx="8" fill="#fbfdff" stroke="#d0d7de" stroke-width="1.4"/>
<text x="244.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Властивість TP1: Збіжність для пари операцій</text>
<text x="244.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">S ∘ op1 ∘ T(op2, op1) ≡ S ∘ op2 ∘ T(op1, op2)</text>
<rect x="204.0" y="130.0" width="80.0" height="34.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="244.0" y="151.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="244.0" dy="0.0">Стан S</tspan></text>
<rect x="64.0" y="230.0" width="95.0" height="34.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.5"/><text x="111.5" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="111.5" dy="0.0">S ∘ op1</tspan></text>
<rect x="324.0" y="230.0" width="95.0" height="34.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.5"/><text x="371.5" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="371.5" dy="0.0">S ∘ op2</tspan></text>
<rect x="194.0" y="330.0" width="100.0" height="34.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="244.0" y="351.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="244.0" dy="0.0">Кінцевий S'</tspan></text>
<line x1="210.0" y1="160.0" x2="140.0" y2="225.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">op1</text>
<line x1="278.0" y1="160.0" x2="348.0" y2="225.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="338.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">op2</text>
<line x1="140.0" y1="270.0" x2="210.0" y2="330.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="135.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">T(op2, op1)</text>
<line x1="348.0" y1="270.0" x2="278.0" y2="330.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="355.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">T(op1, op2)</text>
<rect x="44.0" y="385.0" width="400.0" height="56.0" rx="6" fill="#f7f9fa" stroke="#d0d7de" stroke-width="1.5"/><text x="244.0" y="409.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="244.0" dy="0.0">Обидва шляхи трансформації приводять до ідентичного стану S'.</tspan><tspan x="244.0" dy="14.3">Достатня умова для систем із центральним сервером (Jupiter).</tspan></text>
<rect x="496.0" y="55.0" width="440.0" height="400.0" rx="8" fill="#fbfdff" stroke="#d0d7de" stroke-width="1.4"/>
<text x="716.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Властивість TP2: Незалежність від шляху (3 операції)</text>
<text x="716.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">T(T(op3, op1), T(op2, op1)) ≡ T(T(op3, op2), T(op1, op2))</text>
<rect x="666.0" y="130.0" width="100.0" height="34.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="716.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="716.0" dy="0.0">Операція op3</tspan></text>
