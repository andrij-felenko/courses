<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця функцій перетворення включення: T(op1, op2)</text>
<text x="480.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Як змінюються параметри операції op1 після врахування паралельної op2</text>
<rect x="30.0" y="75.0" width="435.0" height="220.0" rx="8" fill="#fdfdfd" stroke="#d8dde3" stroke-width="1.4"/>
<rect x="30.0" y="75.0" width="435.0" height="32.0" rx="8" fill="#f4f6f8" stroke="#d8dde3" stroke-width="1.4"/>
<text x="247.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ins(p1, c1) проти Ins(p2, c2)</text>
<text x="46.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Дві паралельні вставки символів</text>
<rect x="40.0" y="143.0" width="415.0" height="144.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="247.5" y="192.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">• Якщо p1 &lt; p2 : p1' = p1 (вставка лівіше, індекс без змін)</tspan><tspan x="247.5" dy="13.0"></tspan><tspan x="247.5" dy="13.0">• Якщо p1 &gt; p2 : p1' = p1 + 1 (чужа вставка зсунула текст на +1)</tspan><tspan x="247.5" dy="13.0"></tspan><tspan x="247.5" dy="13.0">• Якщо p1 == p2 : тай-брейк за ID клієнта (детермінований вибір)</tspan></text>
<rect x="495.0" y="75.0" width="435.0" height="220.0" rx="8" fill="#fdfdfd" stroke="#d8dde3" stroke-width="1.4"/>
<rect x="495.0" y="75.0" width="435.0" height="32.0" rx="8" fill="#f4f6f8" stroke="#d8dde3" stroke-width="1.4"/>
<text x="712.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Ins(p1, c1) проти Del(p2)</text>
<text x="511.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Вставка символу проти паралельного видалення</text>
<rect x="505.0" y="143.0" width="415.0" height="144.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="712.5" y="192.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">• Якщо p1 &lt;= p2 : p1' = p1 (видалення правіше або в тій же точці)</tspan><tspan x="712.5" dy="13.0"></tspan><tspan x="712.5" dy="13.0">• Якщо p1 &gt; p2 : p1' = p1 - 1 (чуже видалення зсунуло текст на -1)</tspan><tspan x="712.5" dy="13.0"></tspan><tspan x="712.5" dy="13.0">• Символ c1 гарантовано потрапляє у збережену позицію наміру</tspan></text>
<rect x="30.0" y="315.0" width="435.0" height="220.0" rx="8" fill="#fdfdfd" stroke="#d8dde3" stroke-width="1.4"/>
<rect x="30.0" y="315.0" width="435.0" height="32.0" rx="8" fill="#f4f6f8" stroke="#d8dde3" stroke-width="1.4"/>
<text x="247.5" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Del(p1) проти Ins(p2, c2)</text>
<text x="46.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Видалення символу проти паралельної вставки</text>
<rect x="40.0" y="383.0" width="415.0" height="144.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="247.5" y="434.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">• Якщо p1 &lt; p2 : p1' = p1 (вставка відбулася правіше видалення)</tspan><tspan x="247.5" dy="11.7"></tspan><tspan x="247.5" dy="11.7">• Якщо p1 &gt;= p2 : p1' = p1 + 1 (чужа вставка зсунула цільовий символ на +1)</tspan><tspan x="247.5" dy="11.7"></tspan><tspan x="247.5" dy="11.7">• Видаляється саме той символ, на який спочатку вказував автор</tspan></text>
<rect x="495.0" y="315.0" width="435.0" height="220.0" rx="8" fill="#fdfdfd" stroke="#d8dde3" stroke-width="1.4"/>
<rect x="495.0" y="315.0" width="435.0" height="32.0" rx="8" fill="#f4f6f8" stroke="#d8dde3" stroke-width="1.4"/>
<text x="712.5" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Del(p1) проти Del(p2)</text>
<text x="511.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Два паралельні видалення символів</text>
<rect x="505.0" y="383.0" width="415.0" height="144.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="712.5" y="434.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">• Якщо p1 &lt; p2 : p1' = p1 (видалення правого символу не зміщує лівий)</tspan><tspan x="712.5" dy="11.7"></tspan><tspan x="712.5" dy="11.7">• Якщо p1 &gt; p2 : p1' = p1 - 1 (лівий символ зник, цільовий зсунувся на -1)</tspan><tspan x="712.5" dy="11.7"></tspan><tspan x="712.5" dy="11.7">• Якщо p1 == p2 : op1' = NoOp() (символ уже видалено паралельно)</tspan></text>
</svg>