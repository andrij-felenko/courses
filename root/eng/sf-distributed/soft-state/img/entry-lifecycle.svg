<rect x="760.0" y="340.0" width="340.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="930.0" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">ПОРІГ НЕДОВІРИ</tspan><tspan x="930.0" dy="16.9">живих менше за половину відомих?</tspan><tspan x="930.0" dy="16.9">так → тримати · ні → стерти</tspan></text>
