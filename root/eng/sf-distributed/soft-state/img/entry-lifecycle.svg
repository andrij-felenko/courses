<rect x="400.0" y="520.0" width="220.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="565.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">СТЕРТИЙ</tspan></text>
