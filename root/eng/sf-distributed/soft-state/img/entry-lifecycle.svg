<text x="1150.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">тримати</text>
<line x1="830.0" y1="452.0" x2="830.0" y2="560.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="830.0" y1="560.0" x2="624.0" y2="560.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="740.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">віримо собі — стерти</text>
<line x1="440.0" y1="232.0" x2="440.0" y2="516.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end"><tspan x="420.0" dy="0.0">«я йду» — підказка:</tspan><tspan x="420.0" dy="16.2">стерти одразу,</tspan><tspan x="420.0" dy="16.2">живих −1 і відомих −1</tspan></text>
<rect x="70.0" y="615.0" width="1060.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="642.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">підозрюваний ЛИШАЄТЬСЯ в таблиці — саме він тримає знаменник порога;</tspan><tspan x="600.0" dy="17.6">стирати відразу — значить ніколи не побачити масового витікання</tspan></text>
</svg>