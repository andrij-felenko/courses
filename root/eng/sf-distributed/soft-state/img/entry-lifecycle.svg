<text x="690.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">«я тут» знову — живих +1</text>
<line x1="990.0" y1="232.0" x2="990.0" y2="336.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
