<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="120.0" width="330.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="225.0" y="161.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">сплеск навантаження</tspan><tspan x="225.0" dy="17.6">черги наповнюються</tspan></text>
<rect x="480.0" y="120.0" width="330.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="645.0" y="161.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">фонові оновлення відкидають</tspan><tspan x="645.0" dy="17.6">першими — вони найдешевші</tspan></text>
<rect x="480.0" y="400.0" width="330.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="645.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">живі вузли зникають зі списку</tspan><tspan x="645.0" dy="17.6">(хибне витікання)</tspan></text>
<rect x="60.0" y="400.0" width="330.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="225.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">трафік тисне на менше вузлів</tspan><tspan x="225.0" dy="17.6">їм стає ще гірше</tspan></text>
<line x1="398.0" y1="166.0" x2="472.0" y2="166.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="645.0" y1="220.0" x2="645.0" y2="392.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="472.0" y1="446.0" x2="398.0" y2="446.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="225.0" y1="392.0" x2="225.0" y2="220.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<text x="663.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">2</text>
<text x="435.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">3</text>
<text x="207.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">4</text>
<rect x="100.0" y="272.0" width="670.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="435.0" y="309.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">коло замикається: причина могла тривати п'ять секунд, а система лишається в цьому стані назавжди</tspan></text>
<rect x="880.0" y="250.0" width="250.0" height="150.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="1005.0" y="280.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1005.0" dy="0.0">ПОРІГ НЕДОВІРИ</tspan><tspan x="1005.0" dy="16.2"></tspan><tspan x="1005.0" dy="16.2">зникло понад 50 % одразу?</tspan><tspan x="1005.0" dy="16.2">ймовірніше зламався</tspan><tspan x="1005.0" dy="16.2">спостерігач, ніж усі</tspan><tspan x="1005.0" dy="16.2">спостережувані —</tspan><tspan x="1005.0" dy="16.2">не вірити витіканню</tspan></text>
<line x1="870.0" y1="325.0" x2="822.0" y2="416.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1005.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">розрив кола</text>
<rect x="60.0" y="540.0" width="1060.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="574.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">механізм, що мав лише реєструвати життя, під навантаженням починає ховати живих — і цим навантаження збільшує</tspan></text>
</svg>