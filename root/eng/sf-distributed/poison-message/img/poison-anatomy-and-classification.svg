<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="1150.0" height="490.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="590.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Таксономія та руйнівний вплив отруйних повідомлень (Poison Messages)</text>
<rect x="30.0" y="65.0" width="216.0" height="420.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<rect x="36.0" y="75.0" width="204.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="138.0" y="98.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="138.0" dy="0.0">1. Структурна отрута</tspan><tspan x="138.0" dy="14.3">(Syntactic / Byte Level)</tspan></text>
<rect x="36.0" y="138.0" width="204.0" height="195.0" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/><text x="138.0" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="138.0" dy="0.0">• Битий потік байтів / невалідний UTF-8</tspan><tspan x="138.0" dy="11.7">• Синтаксично зламаний JSON/Protobuf</tspan><tspan x="138.0" dy="11.7">• Пошкоджені заголовки та магічні байти</tspan><tspan x="138.0" dy="11.7">• Помилка десеріалізації на рівні парсера</tspan></text>
<rect x="36.0" y="342.0" width="204.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<rect x="38.0" y="345.0" width="200.0" height="68.0" rx="6" fill="#fdecea" stroke="none" stroke-width="1.5"/><text x="138.0" y="376.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="138.0" dy="0.0">Симптом: Миттєвий виняток парсингу</tspan><tspan x="138.0" dy="11.7">(JsonParseException, DecodeError)</tspan></text>
<rect x="36.0" y="425.0" width="204.0" height="50.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/>
<rect x="38.0" y="428.0" width="200.0" height="44.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/><text x="138.0" y="447.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle" font-weight="700"><tspan x="138.0" dy="0.0">Звичайний Retry:</tspan><tspan x="138.0" dy="11.7">100% ДЕТЕРМІНОВАНИЙ ЗБІЙ</tspan></text>
<rect x="260.0" y="65.0" width="216.0" height="420.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<rect x="266.0" y="75.0" width="204.0" height="54.0" rx="6" fill="#fef9e7" stroke="#b45309" stroke-width="1.5"/><text x="368.0" y="98.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="368.0" dy="0.0">2. Розрив схеми даних</tspan><tspan x="368.0" dy="14.3">(Schema Evolution Gap)</tspan></text>
<rect x="266.0" y="138.0" width="204.0" height="195.0" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/><text x="368.0" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="368.0" dy="0.0">• Відсутність обов'язкового поля</tspan><tspan x="368.0" dy="11.7">• Зміна типу (рядок замість масиву чисел)</tspan><tspan x="368.0" dy="11.7">• Невідомий варіант enum без fallback</tspan><tspan x="368.0" dy="11.7">• Невідповідність версії Schema Registry</tspan></text>
<rect x="266.0" y="342.0" width="204.0" height="75.0" rx="6" fill="#fef9e7" stroke="#b45309" stroke-width="1.2"/>
<rect x="268.0" y="345.0" width="200.0" height="68.0" rx="6" fill="#fef9e7" stroke="none" stroke-width="1.5"/><text x="368.0" y="376.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700"><tspan x="368.0" dy="0.0">Симптом: Помилка валідації моделі</tspan><tspan x="368.0" dy="11.7">(SchemaMismatch, ValidationError)</tspan></text>
<rect x="266.0" y="425.0" width="204.0" height="50.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/>
<rect x="268.0" y="428.0" width="200.0" height="44.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/><text x="368.0" y="447.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle" font-weight="700"><tspan x="368.0" dy="0.0">Звичайний Retry:</tspan><tspan x="368.0" dy="11.7">100% ДЕТЕРМІНОВАНИЙ ЗБІЙ</tspan></text>
<rect x="490.0" y="65.0" width="216.0" height="420.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<rect x="496.0" y="75.0" width="204.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="598.0" y="98.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="598.0" dy="0.0">3. Семантична отрута</tspan><tspan x="598.0" dy="14.3">(Domain Invariant Trap)</tspan></text>
<rect x="496.0" y="138.0" width="204.0" height="195.0" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/><text x="598.0" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="598.0" dy="0.0">• Від'ємна сума грошової транзакції</tspan><tspan x="598.0" dy="11.7">• Ділення на нуль у формулі тарифу</tspan><tspan x="598.0" dy="11.7">• Циклічні посилання в дереві сутностей</tspan><tspan x="598.0" dy="11.7">• Неприпустимий перехід кінцевого автомата</tspan></text>
<rect x="496.0" y="342.0" width="204.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<rect x="498.0" y="345.0" width="200.0" height="68.0" rx="6" fill="#eaf0fd" stroke="none" stroke-width="1.5"/><text x="598.0" y="376.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="598.0" dy="0.0">Симптом: Порушення бізнес-інваріанта</tspan><tspan x="598.0" dy="11.7">(InvariantViolationException)</tspan></text>
<rect x="496.0" y="425.0" width="204.0" height="50.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/>
<rect x="498.0" y="428.0" width="200.0" height="44.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/><text x="598.0" y="447.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle" font-weight="700"><tspan x="598.0" dy="0.0">Звичайний Retry:</tspan><tspan x="598.0" dy="11.7">100% ДЕТЕРМІНОВАНИЙ ЗБІЙ</tspan></text>
<rect x="720.0" y="65.0" width="216.0" height="420.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<rect x="726.0" y="75.0" width="204.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="828.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="828.0" dy="0.0">4. Ресурсна пастка</tspan><tspan x="828.0" dy="13.0">(Algorithmic / Resource DoS)</tspan></text>
<rect x="726.0" y="138.0" width="204.0" height="195.0" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/><text x="828.0" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="828.0" dy="0.0">• Zip Bomb / XML Entity Expansion (Billion Laughs)</tspan><tspan x="828.0" dy="11.7">• ReDoS: регулярний вираз із бектрекінгом</tspan><tspan x="828.0" dy="11.7">• Запит буфера на 4 ГБ за довжиною заголовка</tspan><tspan x="828.0" dy="11.7">• Безкінечний цикл у бізнес-алгоритмі</tspan></text>
<rect x="726.0" y="342.0" width="204.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<rect x="728.0" y="345.0" width="200.0" height="68.0" rx="6" fill="#fdecea" stroke="none" stroke-width="1.5"/><text x="828.0" y="376.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="828.0" dy="0.0">Симптом: 100% CPU lockup або OOM</tspan><tspan x="828.0" dy="11.7">(OutOfMemoryError, CPU Starvation)</tspan></text>
<rect x="726.0" y="425.0" width="204.0" height="50.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/>
<rect x="728.0" y="428.0" width="200.0" height="44.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/><text x="828.0" y="447.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle" font-weight="700"><tspan x="828.0" dy="0.0">Звичайний Retry:</tspan><tspan x="828.0" dy="11.7">100% ДЕТЕРМІНОВАНИЙ ЗБІЙ</tspan></text>
<rect x="950.0" y="65.0" width="216.0" height="420.0" rx="8" fill="#ffffff" stroke="#991b1b" stroke-width="1.6"/>
<rect x="956.0" y="75.0" width="204.0" height="54.0" rx="6" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="1058.0" y="98.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1058.0" dy="0.0">5. Фатальна аварія ядра</tspan><tspan x="1058.0" dy="14.3">(Runtime Crash / Panic)</tspan></text>
<rect x="956.0" y="138.0" width="204.0" height="195.0" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/><text x="1058.0" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1058.0" dy="0.0">• Розіменування nullptr у нативному C/C++ FFI</tspan><tspan x="1058.0" dy="11.7">• SIGSEGV / Stack Overflow / Panic у рантаймі</tspan><tspan x="1058.0" dy="11.7">• Взаємне блокування потоків (Deadlock)</tspan><tspan x="1058.0" dy="11.7">• Миттєве падіння операційної системи процесу</tspan></text>
<rect x="956.0" y="342.0" width="204.0" height="75.0" rx="6" fill="#fee2e2" stroke="#991b1b" stroke-width="1.2"/>
<rect x="958.0" y="345.0" width="200.0" height="68.0" rx="6" fill="#fee2e2" stroke="none" stroke-width="1.5"/><text x="1058.0" y="376.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="1058.0" dy="0.0">Симптом: Аварійна загибель воркера</tspan><tspan x="1058.0" dy="11.7">(CrashLoopBackOff, SIGSEGV, SIGKILL)</tspan></text>
<rect x="956.0" y="425.0" width="204.0" height="50.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/>
<rect x="958.0" y="428.0" width="200.0" height="44.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/><text x="1058.0" y="447.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle" font-weight="700"><tspan x="1058.0" dy="0.0">Звичайний Retry:</tspan><tspan x="1058.0" dy="11.7">100% ДЕТЕРМІНОВАНИЙ ЗБІЙ</tspan></text>
</svg>