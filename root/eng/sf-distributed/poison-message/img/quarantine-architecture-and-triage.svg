<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="760.0" height="530.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="395.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Контур виконання та автоматичної ізоляції (Execution &amp; Quarantine)</text>
<rect x="35.0" y="75.0" width="140.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Основна черга</tspan><tspan x="105.0" dy="14.3">або топік</tspan><tspan x="105.0" dy="14.3">(Primary Stream)</tspan></text>
<line x1="175.0" y1="107.0" x2="225.0" y2="107.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="200.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Fetch</text>
<rect x="225.0" y="65.0" width="290.0" height="230.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="370.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Воркер зі сторожовим таймером</text>
<rect x="240.0" y="102.0" width="260.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#93c5fd" stroke-width="1.5"/><text x="370.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">1. Ingress Filter &amp; Schema Validation</tspan><tspan x="370.0" dy="13.0">(Швидка синтаксична перевірка)</tspan></text>
<rect x="240.0" y="158.0" width="260.0" height="58.0" rx="6" fill="#fef9e7" stroke="#fcd34d" stroke-width="1.5"/><text x="370.0" y="178.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">2. Isolated Execution Sandbox</tspan><tspan x="370.0" dy="11.7">• Watchdog Deadline (таймаут CPU)</tspan><tspan x="370.0" dy="11.7">• Panic / Signal Interceptor (перехоплення)</tspan></text>
<rect x="240.0" y="224.0" width="260.0" height="58.0" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/><text x="370.0" y="244.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">3. Attempt Tracker &amp; Failure Classifier</tspan><tspan x="370.0" dy="11.7">• Transient (Мережа) vs Deterministic (Отрута)</tspan><tspan x="370.0" dy="11.7">• Delivery Counter: N з MAX_RETRIES</tspan></text>
<line x1="515.0" y1="126.0" x2="585.0" y2="126.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="550.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ACK</text>
<rect x="585.0" y="95.0" width="170.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Успішна фіксація</tspan><tspan x="670.0" dy="13.7">(Commit Offset / ACK)</tspan><tspan x="670.0" dy="13.7">Далі за конвеєром</tspan></text>
<line x1="515.0" y1="253.0" x2="585.0" y2="253.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="550.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">NACK</text>
<rect x="585.0" y="225.0" width="170.0" height="60.0" rx="6" fill="#fef9e7" stroke="#d97706" stroke-width="1.5"/><text x="670.0" y="246.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Retry з затримкою</tspan><tspan x="670.0" dy="11.7">(Backoff + Jitter)</tspan><tspan x="670.0" dy="11.7">Лише для перехідних збоїв</tspan></text>
<line x1="370.0" y1="295.0" x2="370.0" y2="345.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Фатальний дефект АБО attempts ≥ Limit</text>
<rect x="140.0" y="345.0" width="460.0" height="75.0" rx="8" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="370.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Формування діагностичного конверта карантину (Quarantine Envelope)</text>
<rect x="150.0" y="376.0" width="440.0" height="38.0" rx="6" fill="#ffe4e6" stroke="none" stroke-width="1.5"/><text x="370.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#881337" text-anchor="middle"><tspan x="370.0" dy="0.0">Payload + Headers + SHA-256 + Stacktrace + Exception Class + Host ID + Timestamp</tspan></text>
<line x1="370.0" y1="420.0" x2="370.0" y2="450.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="450.0" width="460.0" height="80.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="370.0" y="473.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сховище карантину (Quarantine Store / Parking Lot)</text>
<rect x="150.0" y="482.0" width="440.0" height="40.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="370.0" y="505.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Ізольований топік / Dead Letter DB: стан QUARANTINED, не блокує основний потік</tspan></text>
<rect x="795.0" y="15.0" width="370.0" height="530.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="980.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Контур тріажу та утилізації (Ops &amp; Triage)</text>
<rect x="810.0" y="70.0" width="340.0" height="102.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="822.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Моніторинг та алертинг</text>
<rect x="820.0" y="100.0" width="320.0" height="64.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="980.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">• Quarantine Influx Rate &gt; 0</tspan><tspan x="980.0" dy="12.3">• Кластерний сплеск отрути (Poison Burst)</tspan><tspan x="980.0" dy="12.3">• Активація аварійного Circuit Breaker</tspan></text>
<rect x="810.0" y="185.0" width="340.0" height="102.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.3"/>
<text x="822.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Інспекція та діагностика</text>
<rect x="820.0" y="215.0" width="320.0" height="64.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="980.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">• Web UI / CLI для перегляду стектейсу</tspan><tspan x="980.0" dy="12.3">• Порівняння схеми та тіла повідомлення</tspan><tspan x="980.0" dy="12.3">• Локалізація багу в коді або продюсері</tspan></text>
<rect x="810.0" y="300.0" width="340.0" height="102.0" rx="6" fill="#fef9e7" stroke="#b45309" stroke-width="1.3"/>
<text x="822.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Лікування та модифікація</text>
<rect x="820.0" y="330.0" width="320.0" height="64.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="980.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">• Payload Mutation (виправлення дефектних полів)</tspan><tspan x="980.0" dy="12.3">• Деплой хотфіксу споживача</tspan><tspan x="980.0" dy="12.3">• Оновлення Schema Registry</tspan></text>
<rect x="810.0" y="415.0" width="340.0" height="102.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.3"/>
<text x="822.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Безпечний Redrive (Drain)</text>
<rect x="820.0" y="445.0" width="320.0" height="64.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="980.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">• Canary Replay (прогін 1 екземпляра)</tspan><tspan x="980.0" dy="12.3">• Rate-Limited повторне введення в чергу</tspan><tspan x="980.0" dy="12.3">• Permanent Drop (утилізація з аудитом)</tspan></text>
</svg>