<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компроміси архітектури: пряма передача (Inline) проти Claim Check</text>
<rect x="15.0" y="55.0" width="455.0" height="365.0" rx="8" fill="#f8f9fa" stroke="#c0392b" stroke-width="1.4"/>
<text x="242.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Пряма передача в брокер (Inline Payload)</text>
<rect x="34.5" y="109.1" width="415.0" height="41.9" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="242.0" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="242.0" dy="0.0">Затримка p99: Мінімальна (0.5 – 2 мс)</tspan><tspan x="242.0" dy="12.3">Немає додаткових мережевих звернень до зовнішніх баз чи S3</tspan></text>
<rect x="34.5" y="177.9" width="415.0" height="54.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="242.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="242.0" dy="0.0">Використання RAM брокера: Критичне</tspan><tspan x="242.0" dy="12.3">10 000 повідомлень по 20 МБ = 200 ГБ буферів JVM/ОС</tspan><tspan x="242.0" dy="12.3">Ризик аварійного завершення OOM Kill та тривалих GC-пауз</tspan></text>
<rect x="34.5" y="257.9" width="415.0" height="54.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="242.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="242.0" dy="0.0">Трафік при 1:N розсилці (Pub/Sub): Неефективний</tspan><tspan x="242.0" dy="12.3">Для 10 підписників брокер пересилає 10 x 20 МБ = 200 МБ через NIC,</tspan><tspan x="242.0" dy="12.3">навіть якщо 9 підписників лише фільтрують подію за заголовком</tspan></text>
<rect x="34.5" y="344.1" width="415.0" height="41.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="242.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="242.0" dy="0.0">Оптимально для: Дрібних подій (&lt; 64–256 КБ),</tspan><tspan x="242.0" dy="12.3">сенсорної телеметрії, транзакційних повідомлень стану</tspan></text>
<rect x="490.0" y="55.0" width="455.0" height="365.0" rx="8" fill="#f8f9fa" stroke="#27ae60" stroke-width="1.4"/>
<text x="717.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Шаблон квитанції (Claim Check Pattern)</text>
<rect x="509.5" y="109.1" width="415.0" height="41.9" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/><text x="717.0" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="717.0" dy="0.0">Затримка p99: Вища (25 – 80 мс)</tspan><tspan x="717.0" dy="12.3">Додає 2 HTTP-запити через мережу (PUT у сховище + GET споживачем)</tspan></text>
<rect x="509.5" y="177.9" width="415.0" height="54.2" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="717.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="717.0" dy="0.0">Використання RAM брокера: Мінімальне</tspan><tspan x="717.0" dy="12.3">У черзі знаходяться лише дескриптори по 400 байтів.</tspan><tspan x="717.0" dy="12.3">Брокер стабільно тримає мільйони повідомлень у пам'яті</tspan></text>
<rect x="509.5" y="257.9" width="415.0" height="54.2" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="717.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="717.0" dy="0.0">Трафік при 1:N розсилці (Pub/Sub): Оптимальний</tspan><tspan x="717.0" dy="12.3">Брокер пересилає лише 10 x 400 Б = 4 КБ.</tspan><tspan x="717.0" dy="12.3">Тіло 20 МБ завантажує виключно 1 зацікавлений воркер</tspan></text>
<rect x="509.5" y="344.1" width="415.0" height="41.9" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="717.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="717.0" dy="0.0">Оптимально для: Важких блобів (медіа, PDF, XML-вивантаження,</tspan><tspan x="717.0" dy="12.3">навчальні матриці ML), пакетів &gt; 256 КБ, аудіо/відео фрагментів</tspan></text>
</svg>