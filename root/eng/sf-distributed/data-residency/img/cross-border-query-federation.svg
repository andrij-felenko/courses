<text x="490.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">НАЇВНИЙ ПІДХІД: Транскордонний запит рядків (Порушення GDPR + Латентність)</text>
