<text x="490.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Переваги: 100% відповідність GDPR Art. 44-49, мінімальний трафік (кілька кілобайтів замість гігабайтів),</text>
