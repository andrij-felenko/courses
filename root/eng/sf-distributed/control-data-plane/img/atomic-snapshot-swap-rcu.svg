<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неблокуюча підміна таблиці маршрутизації в Площині даних (Atomic Pointer Swap / RCU)</text>
<rect x="40.0" y="60.0" width="270.0" height="430.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="175.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Потік управління (Control Thread)</text>
<rect x="60.0" y="123.3" width="230.0" height="43.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="175.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">1. Отримання оновлення</tspan><tspan x="175.0" dy="14.3">(xDS gRPC подія / зміна)</tspan></text>
<rect x="60.0" y="201.2" width="230.0" height="57.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="175.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">2. Створення нового зліпка</tspan><tspan x="175.0" dy="14.3">(Candidate Snapshot B)</tspan><tspan x="175.0" dy="14.3">у фоновій пам'яті</tspan></text>
<rect x="60.0" y="296.5" width="230.0" height="67.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="175.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">3. Атомарний swap покажчика</tspan><tspan x="175.0" dy="13.0">std::atomic_store_explicit(</tspan><tspan x="175.0" dy="13.0">  &amp;active_config, new_snap,</tspan><tspan x="175.0" dy="13.0">  std::memory_order_release)</tspan></text>
<rect x="60.0" y="413.0" width="230.0" height="54.0" rx="6" fill="#fff8e7" stroke="#e67e22" stroke-width="1.5"/><text x="175.0" y="430.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">4. Очікування епохи читачів</tspan><tspan x="175.0" dy="13.0">та безпечне звільнення</tspan><tspan x="175.0" dy="13.0">старого Snapshot A (RCU)</tspan></text>
<line x1="175.0" y1="175.0" x2="175.0" y2="195.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="175.0" y1="265.0" x2="175.0" y2="290.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="175.0" y1="375.0" x2="175.0" y2="405.0" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340.0" y="60.0" width="310.0" height="430.0" rx="8" fill="#fcfdfe" stroke="#333333" stroke-width="1.5"/>
<text x="495.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пам'ять конфігурації (Heap / Shared)</text>
<rect x="370.0" y="118.3" width="250.0" height="43.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="495.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">Атомарний покажчик:</tspan><tspan x="495.0" dy="14.3">std::atomic&lt;ConfigSnapshot*&gt;</tspan></text>
<rect x="370.0" y="206.5" width="250.0" height="67.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="495.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Активний Snapshot A (v1)</tspan><tspan x="495.0" dy="13.0">• Таблиця маршрутів: 10.0.0.0/8</tspan><tspan x="495.0" dy="13.0">• Бекенди: [srv1, srv2]</tspan><tspan x="495.0" dy="13.0">(Читають старі потоки)</tspan></text>
<rect x="370.0" y="346.5" width="250.0" height="67.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="495.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Новий Snapshot B (v2)</tspan><tspan x="495.0" dy="13.0">• Таблиця маршрутів: 10.0.0.0/8</tspan><tspan x="495.0" dy="13.0">• Бекенди: [srv1, srv2, srv3]</tspan><tspan x="495.0" dy="13.0">(Читають нові потоки)</tspan></text>
<line x1="495.0" y1="170.0" x2="495.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="295.0" y1="330.0" x2="365.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="4 4"/>
<rect x="680.0" y="60.0" width="280.0" height="430.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="820.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Робочі потоки (Data Plane Workers)</text>
<rect x="700.0" y="120.0" width="240.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="137.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Data Worker 1 (Core 1)</tspan><tspan x="820.0" dy="13.0">rcu_read_lock()</tspan><tspan x="820.0" dy="13.0">Читає Snapshot A</tspan><tspan x="820.0" dy="13.0">Обробка пакета #1042</tspan><tspan x="820.0" dy="13.0">rcu_read_unlock()</tspan></text>
<rect x="700.0" y="270.0" width="240.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="287.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Data Worker 2 (Core 2)</tspan><tspan x="820.0" dy="13.0">rcu_read_lock()</tspan><tspan x="820.0" dy="13.0">Читає новий Snapshot B</tspan><tspan x="820.0" dy="13.0">Обробка пакета #1043</tspan><tspan x="820.0" dy="13.0">rcu_read_unlock()</tspan></text>
<rect x="700.0" y="403.0" width="240.0" height="54.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="420.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Нуль блокувань (Lock-Free)</tspan><tspan x="820.0" dy="13.0">Жоден потік не чекає на м'ютекс!</tspan><tspan x="820.0" dy="13.0">Затримка обробки: &lt; 100 нс</tspan></text>
<line x1="695.0" y1="160.0" x2="625.0" y2="240.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="695.0" y1="310.0" x2="625.0" y2="380.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>