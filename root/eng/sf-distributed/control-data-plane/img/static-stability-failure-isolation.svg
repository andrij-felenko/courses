<rect x="80.0" y="198.0" width="360.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="215.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Data Plane зупиняє запит і робить</tspan><tspan x="260.0" dy="13.0">СИНХРОННИЙ виклик у Control Plane:</tspan><tspan x="260.0" dy="13.0">«Куди маршрутизувати цей пакет?»</tspan></text>
<rect x="80.0" y="299.5" width="360.0" height="41.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Control Plane падає або зависає</tspan><tspan x="260.0" dy="13.0">(OOM / сплеск навантаження / таймаут)</tspan></text>
<rect x="80.0" y="391.5" width="360.0" height="67.0" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">КАТАСТРОФА СИСТЕМИ:</tspan><tspan x="260.0" dy="13.0">• Черги сокетів переповнені (100% Drop)</tspan><tspan x="260.0" dy="13.0">• Каскадні таймаути клієнтів</tspan><tspan x="260.0" dy="13.0">• Повна недоступність усієї мережі</tspan></text>
