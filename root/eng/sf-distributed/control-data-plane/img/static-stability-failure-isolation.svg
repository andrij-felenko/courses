<rect x="570.0" y="119.5" width="340.0" height="41.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="740.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Вхідний запит клієнта</tspan><tspan x="740.0" dy="13.0">(100 000 запитів/сек)</tspan></text>
<rect x="560.0" y="198.0" width="360.0" height="54.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="215.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Data Plane обробляє запит ЛОКАЛЬНО:</tspan><tspan x="740.0" dy="13.0">Пошук у локальній таблиці (FIB / Snapshot)</tspan><tspan x="740.0" dy="13.0">Нуль мережевих блокувань (Затримка: 15 мкс)</tspan></text>
<rect x="560.0" y="299.5" width="360.0" height="41.0" rx="6" fill="#fff8e7" stroke="#e67e22" stroke-width="1.5"/><text x="740.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Control Plane впав / недоступний 2 години</tspan><tspan x="740.0" dy="13.0">(Асинхронний канал gRPC xDS обірвано)</tspan></text>
<rect x="560.0" y="391.5" width="360.0" height="67.0" rx="6" fill="#d1e7dd" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">СИСТЕМА ПОВНІСТЮ ПРАЦЮЄ (100% Up):</tspan><tspan x="740.0" dy="13.0">• Трафік іде за останнім валідним зліпком</tspan><tspan x="740.0" dy="13.0">• Клієнти не помічають падіння оркестратора</tspan><tspan x="740.0" dy="13.0">• Відновлення без черг смерті (Thundering Herd)</tspan></text>
