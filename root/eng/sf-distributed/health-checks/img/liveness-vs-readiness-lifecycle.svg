<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розмежування проб у життєвому циклі контейнера: Startup, Liveness та Readiness</text>
<rect x="25.0" y="55.0" width="290.0" height="440.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="170.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Проба запуску (Startup Probe)</text>
<rect x="50.0" y="114.0" width="240.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Старт процесу</tspan><tspan x="170.0" dy="13.0">Завантаження конфігів,</tspan><tspan x="170.0" dy="13.0">прогрів JIT, виділення пулів</tspan></text>
<line x1="170.0" y1="185.0" x2="170.0" y2="220.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="229.0" width="250.0" height="52.0" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Startup Probe: перевірка</tspan><tspan x="170.0" dy="13.0">чи завершилася ініціалізація</tspan><tspan x="170.0" dy="13.0">(блокує liveness/readiness)</tspan></text>
<line x1="170.0" y1="295.0" x2="170.0" y2="335.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="344.0" width="240.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="360.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Збій таймауту старту:</tspan><tspan x="170.0" dy="13.0">перевищено failureThreshold</tspan><tspan x="170.0" dy="13.0">→ SIGKILL і перезапуск</tspan></text>
<rect x="35.0" y="420.0" width="270.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="170.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Призначення: захист повільних застосунків</tspan><tspan x="170.0" dy="11.7">від передчасного вбивства liveness-пробою</tspan><tspan x="170.0" dy="11.7">під час холодного старту.</tspan></text>
<rect x="340.0" y="55.0" width="305.0" height="440.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="492.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Проба живості (Liveness Probe)</text>
<rect x="372.0" y="114.0" width="240.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="492.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="492.0" dy="0.0">Процес працює</tspan><tspan x="492.0" dy="13.0">Обробка запитів,</tspan><tspan x="492.0" dy="13.0">фонові задачі</tspan></text>
<line x1="492.0" y1="185.0" x2="492.0" y2="220.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="362.0" y="229.0" width="260.0" height="52.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="492.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="492.0" dy="0.0">Liveness Probe: перевірка</tspan><tspan x="492.0" dy="13.0">чи живий внутрішній цикл</tspan><tspan x="492.0" dy="13.0">(deadlock, пам'ять, зависання)</tspan></text>
<line x1="492.0" y1="295.0" x2="492.0" y2="335.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="367.0" y="344.0" width="250.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="492.0" y="360.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="492.0" dy="0.0">Непоправний збій процесу:</tspan><tspan x="492.0" dy="13.0">Liveness повертає 500 / Timeout</tspan><tspan x="492.0" dy="13.0">→ Оркестратор рестартує под</tspan></text>
<rect x="350.0" y="420.0" width="285.0" height="65.0" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1.0"/>
<text x="492.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="492.0" dy="0.0">Суворе правило: Liveness ніколи не перевіряє</tspan><tspan x="492.0" dy="11.7">зовнішні залежності! Рестарт має сенс лише</tspan><tspan x="492.0" dy="11.7">коли зламано сам внутрішній процес.</tspan></text>
<rect x="670.0" y="55.0" width="305.0" height="440.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="822.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Проба готовності (Readiness Probe)</text>
<rect x="697.0" y="114.0" width="250.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="822.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="822.0" dy="0.0">Готовий до трафіку</tspan><tspan x="822.0" dy="13.0">Екземпляр включено в ротацію</tspan><tspan x="822.0" dy="13.0">балансувальника (Endpoints)</tspan></text>
<line x1="822.0" y1="185.0" x2="822.0" y2="220.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="692.0" y="229.0" width="260.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="822.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="822.0" dy="0.0">Readiness Probe: перевірка</tspan><tspan x="822.0" dy="13.0">здатності приймати запити</tspan><tspan x="822.0" dy="13.0">(пул з'єднань, черга, drain)</tspan></text>
<line x1="822.0" y1="295.0" x2="822.0" y2="335.0" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="684.5" y="344.0" width="275.0" height="52.0" rx="6" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5"/><text x="822.0" y="360.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="822.0" dy="0.0">Тимчасова неготовність:</tspan><tspan x="822.0" dy="13.0">Readiness повертає 503</tspan><tspan x="822.0" dy="13.0">→ Вилучення з балансувальника (без рестарту!)</tspan></text>
<rect x="680.0" y="420.0" width="285.0" height="65.0" rx="4" fill="#f0fff4" stroke="#27ae60" stroke-width="1.0"/>
<text x="822.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="822.0" dy="0.0">Суворе правило: збій готовності НЕ вбиває</tspan><tspan x="822.0" dy="11.7">процес. Він дає час відновитися (очистити чергу,</tspan><tspan x="822.0" dy="11.7">дочекатися БД, завершити прогрів кешу).</tspan></text>
</svg>