<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="45.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ПРОТОКОЛ КЛІЄНТСЬКОГО ТРЕКІНГУ REDIS 6+ (RESP3 CLIENT-SIDE TRACKING)</tspan></text>
<rect x="40.0" y="75.0" width="320.0" height="460.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="55.0" y="90.0" width="290.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="200.0" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">СЕРВІС А (ЧИТАЧ З L1 КЕШЕМ)</tspan></text>
<rect x="55.0" y="140.0" width="290.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="200.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">1. Включення трекінгу:</tspan><tspan x="200.0" dy="14.3">CLIENT TRACKING on REDIRECT ...</tspan><tspan x="200.0" dy="14.3">(Реєструє клієнта в сервері)</tspan></text>
<rect x="55.0" y="215.0" width="290.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="200.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">2. Читання ключа:</tspan><tspan x="200.0" dy="14.3">GET item:99 → повертає 'Phone'</tspan><tspan x="200.0" dy="14.3">Зберігає 'Phone' у локальний L1 RAM</tspan></text>
<rect x="55.0" y="295.0" width="290.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="200.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">3. Швидкі повторні читання:</tspan><tspan x="200.0" dy="14.3">Читання прямо з локальної RAM (0 мс)</tspan><tspan x="200.0" dy="14.3">Жодних звернень до мережі!</tspan></text>
<rect x="55.0" y="375.0" width="290.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="200.0" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">5. Асинхронне push-повідомлення:</tspan><tspan x="200.0" dy="14.3">&lt;-push- ['invalidate', ['item:99']]</tspan><tspan x="200.0" dy="14.3">Миттєве вилучення item:99 з L1</tspan></text>
<rect x="55.0" y="455.0" width="290.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="200.0" y="477.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">6. Наступний GET:</tspan><tspan x="200.0" dy="14.3">L1 Miss → новий похід у Redis/БД</tspan><tspan x="200.0" dy="14.3">Отримання оновленої ціни!</tspan></text>
<rect x="400.0" y="75.0" width="380.0" height="460.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="415.0" y="90.0" width="350.0" height="36.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="590.0" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">СЕРВЕР REDIS (ТАБЛИЦЯ ТРЕКІНГУ / RADIX TREE)</tspan></text>
<rect x="415.0" y="140.0" width="350.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="590.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Таблиця недійсності (Invalidation Table):</tspan><tspan x="590.0" dy="14.3">item:99 → [Client_ID: 104 (Сервіс A)]</tspan></text>
<rect x="415.0" y="215.0" width="350.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="590.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Сервер запам'ятовує, що Клієнт 104</tspan><tspan x="590.0" dy="14.3">зчитав ключ item:99 і кешує його в себе</tspan></text>
<rect x="415.0" y="295.0" width="350.0" height="65.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.2"/><text x="590.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">4. Отримано запис від Сервісу B:</tspan><tspan x="590.0" dy="14.3">MSET item:99 'NewPhone'</tspan><tspan x="590.0" dy="14.3">Мутація значення ключа в пам'яті</tspan></text>
<rect x="415.0" y="375.0" width="350.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Пошук підписників на item:99:</tspan><tspan x="590.0" dy="14.3">Знайдено Client 104 → Push Invalidation!</tspan><tspan x="590.0" dy="14.3">Запис вилучається з Tracking Table</tspan></text>
<rect x="415.0" y="455.0" width="350.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="590.0" y="477.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Оптимізація інвалідації:</tspan><tspan x="590.0" dy="14.3">Одне сповіщення на ключ до наступного GET.</tspan><tspan x="590.0" dy="14.3">Немає спаму повідомлень при серії записів!</tspan></text>
<rect x="820.0" y="75.0" width="320.0" height="460.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="835.0" y="90.0" width="290.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="980.0" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">СЕРВІС B (ПИСЬМЕННИК)</tspan></text>
<rect x="835.0" y="140.0" width="290.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="980.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">Сервіс B оновлює каталог товарів</tspan><tspan x="980.0" dy="14.3">(зміна характеристик item:99)</tspan></text>
<rect x="835.0" y="215.0" width="290.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="980.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">Транзакційне оновлення в СКБД</tspan><tspan x="980.0" dy="14.3">та публікація в спільний Redis</tspan></text>
<rect x="835.0" y="295.0" width="290.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="980.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">4. Виклик команди:</tspan><tspan x="980.0" dy="14.3">SET item:99 'NewPhone'</tspan><tspan x="980.0" dy="14.3">Зміна ціни або опису товару</tspan></text>
<rect x="835.0" y="375.0" width="290.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="980.0" y="404.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">Сервісу B не потрібно знати про L1 кеші</tspan><tspan x="980.0" dy="14.3">інших 50-ти інстансів сервісів!</tspan></text>
<rect x="835.0" y="455.0" width="290.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="980.0" y="484.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">ПЕРЕВАГА:</tspan><tspan x="980.0" dy="11.7">Автоматична когерентність L1 на рівні ядра Redis.</tspan></text>
<line x1="345.0" y1="247.0" x2="415.0" y2="247.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="835.0" y1="327.0" x2="765.0" y2="327.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="415.0" y1="407.0" x2="345.0" y2="407.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>