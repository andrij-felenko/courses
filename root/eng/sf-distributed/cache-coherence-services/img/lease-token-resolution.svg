<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="42.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="45.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">РОЗВ'ЯЗАННЯ ГОНКИ ЧЕРЕЗ МАРКЕРИ ОРЕНДИ (LEASE TOKENS / GENERATION CAS)</tspan></text>
<rect x="40.0" y="75.0" width="340.0" height="460.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="55.0" y="90.0" width="310.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="210.0" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">СЕРВІС А (ЧИТАННЯ З ОРЕНДОЮ)</tspan></text>
<rect x="55.0" y="140.0" width="310.0" height="60.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.2"/><text x="210.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">1. GET_LEASE user:42</tspan><tspan x="210.0" dy="14.3">Кеш повертає: MISS + Lease_ID: 0x9A4F</tspan><tspan x="210.0" dy="14.3">(Токен дійсний для поповнення кешу)</tspan></text>
<rect x="55.0" y="215.0" width="310.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">2. Читання зі СКБД:</tspan><tspan x="210.0" dy="14.3">Отримано {balance: 100} (Версія 1)</tspan><tspan x="210.0" dy="14.3">Затримка потоку (GC / мережа 80 мс)</tspan></text>
<rect x="55.0" y="290.0" width="310.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="210.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">5. Спроба запису в кеш із токеном:</tspan><tspan x="210.0" dy="14.3">SET user:42 {balance: 100}</tspan><tspan x="210.0" dy="14.3">LEASE_TOKEN = 0x9A4F</tspan></text>
<rect x="55.0" y="385.0" width="310.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">6. Відповідь кешу:</tspan><tspan x="210.0" dy="14.3">❌ REJECTED / LEASE_INVALIDATED</tspan><tspan x="210.0" dy="14.3">Запис відхилено кеш-сервером!</tspan></text>
<rect x="55.0" y="455.0" width="310.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="484.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">РЕЗУЛЬТАТ: Застарілий запис ВІДХИЛЕНО.</tspan><tspan x="210.0" dy="14.3">Кеш захищено від отруєння старим станом!</tspan></text>
<rect x="420.0" y="75.0" width="340.0" height="460.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="435.0" y="90.0" width="310.0" height="36.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="590.0" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">КЕШ ІЗ СЕРВЕРОМ ОРЕНДИ (LEASE SERVER)</tspan></text>
<rect x="435.0" y="140.0" width="310.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.0"/><text x="590.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Реєстрація активної оренди:</tspan><tspan x="590.0" dy="14.3">ActiveLeases[user:42] = 0x9A4F</tspan><tspan x="590.0" dy="14.3">Таймаут оренди = 10 секунд</tspan></text>
<rect x="435.0" y="215.0" width="310.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="590.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Очікування поповнення або інвалідації</tspan><tspan x="590.0" dy="14.3">Ключ заблокований від stampede</tspan></text>
<rect x="435.0" y="290.0" width="310.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="590.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">4. Отримано INVAL user:42 від Сервісу B:</tspan><tspan x="590.0" dy="14.3">ActiveLeases[user:42] → СКАСОВАНО!</tspan><tspan x="590.0" dy="14.3">Усі видані токени 0x9A4F стають недійсними</tspan></text>
<rect x="435.0" y="385.0" width="310.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.4"/><text x="590.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Перевірка токена Сервісу A:</tspan><tspan x="590.0" dy="14.3">Token 0x9A4F != ActiveLease (Скасовано)</tspan><tspan x="590.0" dy="14.3">→ Повернення помилки клієнту</tspan></text>
<rect x="435.0" y="455.0" width="310.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="590.0" y="484.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Кеш лишається порожнім або оновлюється</tspan><tspan x="590.0" dy="14.3">наступним читачем зі свіжою орендою</tspan></text>
<rect x="800.0" y="75.0" width="340.0" height="460.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="815.0" y="90.0" width="310.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="970.0" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">СЕРВІС B (ЗАПИС ТА ІНВАЛІДАЦІЯ)</tspan></text>
<rect x="815.0" y="140.0" width="310.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="970.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">Сервіс B готує транзакцію запису</tspan><tspan x="970.0" dy="14.3">(зміна балансу на 150 грн)</tspan></text>
<rect x="815.0" y="215.0" width="310.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="970.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">3. Успішний COMMIT у СКБД:</tspan><tspan x="970.0" dy="14.3">Новий стан: balance = 150 (Версія 2)</tspan><tspan x="970.0" dy="14.3">Дані надійно збережено на диску</tspan></text>
<rect x="815.0" y="290.0" width="310.0" height="80.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.2"/><text x="970.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">4. Публікація інвалідації:</tspan><tspan x="970.0" dy="14.3">INVALIDATE user:42</tspan><tspan x="970.0" dy="14.3">Скидає стан оренди в кеш-сервері</tspan></text>
<rect x="815.0" y="385.0" width="310.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="970.0" y="411.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">Інвалідація гарантовано випередила</tspan><tspan x="970.0" dy="14.3">запізнілий SET від Сервісу A</tspan></text>
<rect x="815.0" y="455.0" width="310.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="484.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">СТАН УЗГОДЖЕНОСТІ:</tspan><tspan x="970.0" dy="14.3">БД = 150 | Кеш = Безпечно очищено</tspan></text>
