<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">НАСКРІЗНА НАДІЙНІСТЬ: Transactional Outbox на відправнику + Transactional Inbox на отримувачі</tspan></text>
<rect x="40.0" y="80.0" width="340.0" height="445.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<rect x="50.0" y="95.0" width="320.0" height="36.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="210.0" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">ВИРОБНИК (PRODUCER SERVICE)</tspan></text>
<rect x="55.0" y="145.0" width="310.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Локальна транзакція:</tspan><tspan x="210.0" dy="14.3">1. Зміна бізнес-стану (таблиця A)</tspan><tspan x="210.0" dy="14.3">2. Запис події (таблиця outbox)</tspan><tspan x="210.0" dy="14.3">3. COMMIT</tspan></text>
<line x1="210.0" y1="230.0" x2="210.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="265.0" width="310.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Ретранслятор (Relay / CDC):</tspan><tspan x="210.0" dy="14.3">• Читає подію з outbox / WAL</tspan><tspan x="210.0" dy="14.3">• broker.send(event)</tspan><tspan x="210.0" dy="14.3">• Очікує підтвердження ACK</tspan></text>
<rect x="55.0" y="360.0" width="310.0" height="65.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.2"/><text x="210.0" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">При втраті ACK або таймауті:</tspan><tspan x="210.0" dy="14.3">Воркер надсилає повтор (RETRY)</tspan><tspan x="210.0" dy="14.3">→ Гарантія: AT-LEAST-ONCE</tspan></text>
<rect x="55.0" y="440.0" width="310.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.0"/><text x="210.0" y="464.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Захист від втрат:</tspan><tspan x="210.0" dy="14.3">Подія ніколи не зникне,</tspan><tspan x="210.0" dy="14.3">доки брокер не прийме її.</tspan></text>
<rect x="415.0" y="80.0" width="350.0" height="445.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="425.0" y="95.0" width="330.0" height="36.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.2"/><text x="590.0" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ТРАНСПОРТ (MESSAGE BROKER)</tspan></text>
<line x1="380.0" y1="290.0" x2="415.0" y2="200.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="380.0" y1="380.0" x2="415.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="397.5" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">повтор (дубль)</text>
<rect x="430.0" y="150.0" width="320.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.0"/><text x="590.0" y="169.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Kafka Partition / RabbitMQ Queue</tspan><tspan x="590.0" dy="15.0"></tspan><tspan x="590.0" dy="15.0">• Зберігає потік повідомлень на диск</tspan><tspan x="590.0" dy="15.0">• Може містити дублікати через</tspan><tspan x="590.0" dy="15.0">  повтори мережевих запитів</tspan></text>
<rect x="430.0" y="260.0" width="320.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="590.0" y="290.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Ненадійний зв'язок:</tspan><tspan x="590.0" dy="14.3">Збій мережі на відрізку повернення ACK</tspan><tspan x="590.0" dy="14.3">змушує відправника штурмувати брокер,</tspan><tspan x="590.0" dy="14.3">створюючи два однакових записи</tspan><tspan x="590.0" dy="14.3">з ідентичним event_id.</tspan></text>
<rect x="430.0" y="385.0" width="320.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="590.0" y="438.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ФУНДАМЕНТАЛЬНИЙ ФАКТ:</tspan><tspan x="590.0" dy="11.7"></tspan><tspan x="590.0" dy="11.7">Брокер не може магічно усунути дублікати без координації стану зі споживачем.</tspan></text>
<rect x="800.0" y="80.0" width="340.0" height="445.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<rect x="810.0" y="95.0" width="320.0" height="36.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="970.0" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">СПОЖИВАЧ (CONSUMER SERVICE)</tspan></text>
<line x1="765.0" y1="195.0" x2="800.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="765.0" y1="330.0" x2="800.0" y2="270.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="815.0" y="145.0" width="310.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/><text x="970.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">Локальна транзакція дедуплікації:</tspan><tspan x="970.0" dy="13.7">1. INSERT INTO inbox (message_id)</tspan><tspan x="970.0" dy="13.7">   ON CONFLICT (message_id) DO NOTHING</tspan><tspan x="970.0" dy="13.7">2. Якщо вставка успішна:</tspan><tspan x="970.0" dy="13.7">   • Виконати мутацію стану</tspan><tspan x="970.0" dy="13.7">   • COMMIT</tspan></text>
<rect x="815.0" y="270.0" width="310.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.0"/><text x="970.0" y="293.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">Обробка повторного повідомлення:</tspan><tspan x="970.0" dy="13.7">• message_id вже є в таблиці inbox</tspan><tspan x="970.0" dy="13.7">• Вставка дає 0 рядків або конфлікт</tspan><tspan x="970.0" dy="13.7">• Транзакція ігнорує бізнес-дію</tspan><tspan x="970.0" dy="13.7">• Брокеру підтверджується ACK</tspan></text>
<rect x="815.0" y="380.0" width="310.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">ПІДСУМКОВА СЕМАНТИКА:</tspan><tspan x="970.0" dy="14.3"></tspan><tspan x="970.0" dy="14.3">Outbox (At-Least-Once на відправці)</tspan><tspan x="970.0" dy="14.3">           +</tspan><tspan x="970.0" dy="14.3">Inbox (Ідемпотентність на прийомі)</tspan><tspan x="970.0" dy="14.3">           =</tspan><tspan x="970.0" dy="14.3">EFFECTIVELY-ONCE ОБРОБКА</tspan></text>
<rect x="40.0" y="545.0" width="1100.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="576.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">СИМЕТРІЯ ПАТЕРНІВ: Outbox гарантує, що подія обов'язково вийде у світ без втрат. Inbox гарантує, що неминучі дублікати цієї події не спотворять бізнес-стан отримувача.</tspan></text>
</svg>