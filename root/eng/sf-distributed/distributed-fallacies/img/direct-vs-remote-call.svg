<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локальний виклик у пам'яті проти віддаленого виклику через мережу</text>
<rect x="10.0" y="10.0" width="980.0" height="420.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="500.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локальний виклик функції проти віддаленого виклику (RPC)</text>
<rect x="30.0" y="60.0" width="450.0" height="350.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="255.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Локальний виклик (In-Process Memory)</text>
<rect x="60.0" y="129.3" width="140.0" height="41.3" rx="6" fill="#e8f0fe" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Функція-ініціатор</tspan><tspan x="130.0" dy="14.3">(Caller Stack)</tspan></text>
<rect x="310.0" y="129.3" width="140.0" height="41.3" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Виконувана функція</tspan><tspan x="380.0" dy="14.3">(Callee Body)</tspan></text>
<line x1="205.0" y1="135.0" x2="305.0" y2="135.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="255.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вказівник / регістри</text>
<line x1="305.0" y1="165.0" x2="205.0" y2="165.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="255.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">значення у стеку</text>
<rect x="45.0" y="215.0" width="420.0" height="180.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="255.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Властивості виконання в пам'яті:</text>
<text x="60.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">• Адресний простір: спільна оперативна пам'ять (RAM)</tspan><tspan x="60.0" dy="15.2">• Затримка: детермінована (~1–10 наносекунд)</tspan><tspan x="60.0" dy="15.2">• Передача аргументів: за посиланням (нуль копіювань)</tspan><tspan x="60.0" dy="15.2">• Доля процесу: спільна (або працюють обидва, або падіння OS)</tspan><tspan x="60.0" dy="15.2">• Видимість результату: успіх або перехоплений виняток</tspan></text>
<rect x="520.0" y="60.0" width="450.0" height="350.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="745.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Віддалений виклик (RPC через мережу)</text>
<rect x="529.0" y="129.3" width="131.9" height="41.3" rx="6" fill="#e8f0fe" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Клієнтський вузол</tspan><tspan x="595.0" dy="14.3">(Process A)</tspan></text>
<rect x="685.0" y="132.5" width="120.0" height="35.0" rx="6" fill="#fff3cd" stroke="#c0392b" stroke-width="1.5"/><text x="745.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Мережа / Канал</tspan><tspan x="745.0" dy="13.0">(Ненадійний)</tspan></text>
<rect x="835.0" y="129.3" width="120.0" height="41.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="895.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">Серверний вузол</tspan><tspan x="895.0" dy="14.3">(Process B)</tspan></text>
<line x1="660.0" y1="135.0" x2="680.0" y2="135.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="810.0" y1="135.0" x2="830.0" y2="135.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="830.0" y1="165.0" x2="810.0" y2="165.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="680.0" y1="165.0" x2="660.0" y2="165.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="535.0" y="215.0" width="420.0" height="180.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="745.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Властивості виконання через мережу:</text>
<text x="550.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="550.0" dy="0.0">• Адресний простір: ізольовані вузли, серіалізація байтів</tspan><tspan x="550.0" dy="15.2">• Затримка: недетермінована (~0.5–100+ мілісекунд)</tspan><tspan x="550.0" dy="15.2">• Передача аргументів: глибоке копіювання через сокет</tspan><tspan x="550.0" dy="15.2">• Доля процесу: незалежна (клієнт живий, сервер завис)</tspan><tspan x="550.0" dy="15.2">• Видимість результату: три стани (Успіх / Збій / Невідомо)</tspan></text>
</svg>