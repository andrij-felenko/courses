<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три закони ⊔ рівносильні порядку, де злиття — супремум пари</text>
<rect x="40.0" y="70.0" width="360.0" height="300.0" rx="12" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.4"/>
<text x="220.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгебра</text>
<text x="220.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">a ⊔ b = b ⊔ a</text>
<text x="220.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">комутативність</text>
<text x="220.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">(a⊔b)⊔c = a⊔(b⊔c)</text>
<text x="220.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">асоціативність</text>
<text x="220.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">a ⊔ a = a</text>
<text x="220.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ідемпотентність</text>
<text x="490.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">той самий об'єкт</text>
<text x="490.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="48" fill="#27ae60" text-anchor="middle" font-weight="700">⟺</text>
<rect x="406.2" y="313.0" width="167.6" height="34.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">a ⊑ b  ⟺  a⊔b = b</tspan></text>
