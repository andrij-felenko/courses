<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стратегії оновлення стрічки: Fan-Out on Write (Push) проти Fan-Out on Read (Pull)</text>
<rect x="15.0" y="45.0" width="445.0" height="440.0" rx="8" fill="#f8f9fa" stroke="#c0392b" stroke-width="1.2"/>
<text x="237.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Fan-Out on Write (Push / Ingestion-Time)</text>
<rect x="55.0" y="103.5" width="110.0" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Користувач</tspan><tspan x="110.0" dy="13.0">публікує допис</tspan></text>
<line x1="170.0" y1="125.0" x2="215.0" y2="125.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="216.8" y="97.0" width="156.4" height="56.0" rx="6" fill="#fff3cd" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Сервіс публікації</tspan><tspan x="295.0" dy="13.0">Отримує 10 000 читачів</tspan><tspan x="295.0" dy="13.0">Генерує 10 000 записів</tspan></text>
<line x1="295.0" y1="160.0" x2="295.0" y2="195.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="345.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Віяло записів</text>
<rect x="82.5" y="209.1" width="135.0" height="41.9" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="227.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Вхідна скринька 1</tspan><tspan x="150.0" dy="12.3">(Redis List / Cache)</tspan></text>
<rect x="82.5" y="259.1" width="135.0" height="41.9" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="277.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Вхідна скринька 2</tspan><tspan x="150.0" dy="12.3">(Redis List / Cache)</tspan></text>
<rect x="82.5" y="309.1" width="135.0" height="41.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Вхідна скринька N</tspan><tspan x="150.0" dy="12.3">(10 000 користувачів)</tspan></text>
<line x1="295.0" y1="195.0" x2="235.0" y2="195.0" stroke="#c0392b" stroke-width="1.3"/>
<line x1="235.0" y1="195.0" x2="235.0" y2="330.0" stroke="#c0392b" stroke-width="1.3"/>
<line x1="235.0" y1="230.0" x2="220.0" y2="230.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="235.0" y1="280.0" x2="220.0" y2="280.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="235.0" y1="330.0" x2="220.0" y2="330.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="279.3" y="252.9" width="161.4" height="54.2" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Читач відкриває стрічку:</tspan><tspan x="360.0" dy="12.3">O(1) читання з кешу</tspan><tspan x="360.0" dy="12.3">Латентність: 2–5 мс</tspan></text>
<line x1="80.0" y1="280.0" x2="20.0" y2="280.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="29.5" y="386.7" width="415.0" height="66.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="237.0" y="404.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="237.0" dy="0.0">Характеристики Push:</tspan><tspan x="237.0" dy="12.3">• Запис: O(F) — важкий, ризик лавини для суперзірок</tspan><tspan x="237.0" dy="12.3">• Читання: O(1) — миттєве, дешеве для 99% запитів</tspan><tspan x="237.0" dy="12.3">• Вузьке місце: посилення запису (Write Amplification)</tspan></text>
<rect x="480.0" y="45.0" width="445.0" height="440.0" rx="8" fill="#f8f9fa" stroke="#2457d6" stroke-width="1.2"/>
<text x="702.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Fan-Out on Read (Pull / Query-Time)</text>
<rect x="520.0" y="103.5" width="110.0" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="575.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">Користувач</tspan><tspan x="575.0" dy="13.0">публікує допис</tspan></text>
<line x1="635.0" y1="125.0" x2="685.0" y2="125.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="704.9" y="97.0" width="150.2" height="56.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Сховище автора</tspan><tspan x="780.0" dy="13.0">Один запис у таблицю:</tspan><tspan x="780.0" dy="13.0">O(1) операція</tspan></text>
<rect x="493.7" y="258.5" width="162.6" height="43.0" rx="6" fill="#fff3cd" stroke="#2457d6" stroke-width="1.5"/><text x="575.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">Читач відкриває стрічку</tspan><tspan x="575.0" dy="13.0">(читає 500 авторів)</tspan></text>
<line x1="645.0" y1="280.0" x2="695.0" y2="280.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="697.5" y="246.7" width="184.9" height="66.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="264.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Агрегатор стрічки:</tspan><tspan x="790.0" dy="12.3">Віяло запитів до 500 авторів</tspan><tspan x="790.0" dy="12.3">Сортування та злиття (Merge)</tspan><tspan x="790.0" dy="12.3">Латентність: 150–400 мс</tspan></text>
<rect x="494.5" y="386.7" width="415.0" height="66.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="702.0" y="404.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="702.0" dy="0.0">Характеристики Pull:</tspan><tspan x="702.0" dy="12.3">• Запис: O(1) — легкий, суперзірки не створюють хвиль</tspan><tspan x="702.0" dy="12.3">• Читання: O(F·log k) — важке віяло розпитування (Scatter)</tspan><tspan x="702.0" dy="12.3">• Вузьке місце: колосальне навантаження на читання та БД</tspan></text>
</svg>