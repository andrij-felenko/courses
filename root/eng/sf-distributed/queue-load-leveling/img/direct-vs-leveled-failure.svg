<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1100.0" height="440.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="570.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Сценарій сплеску 10 000 RPS: Прямий синхронний виклик проти Демпфування чергою</text>
<rect x="40.0" y="70.0" width="510.0" height="370.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.4"/>
<text x="295.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">❌ Прямий синхронний виклик (Direct RPC / REST)</text>
<rect x="60.0" y="115.0" width="470.0" height="45.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="141.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">1. Сплеск 10 000 RPS надходить на API Gateway</tspan></text>
<line x1="295.0" y1="160.0" x2="295.0" y2="180.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="180.0" width="470.0" height="55.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">2. API Gateway відкриває 10 000 паралельних з'єднань до БД</tspan><tspan x="295.0" dy="14.3">Вичерпання пулу потоків веб-сервера, сплеск споживання RAM</tspan></text>
<line x1="295.0" y1="235.0" x2="295.0" y2="255.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="255.0" width="470.0" height="60.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="281.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">3. База даних зазнає блокувань дискового I/O та вичерпання пам'яті</tspan><tspan x="295.0" dy="14.3">Латентність зростає від 10 мс до 60 с → Масові 504 Gateway Timeout</tspan></text>
<line x1="295.0" y1="315.0" x2="295.0" y2="335.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="335.0" width="470.0" height="85.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="367.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">4. Клієнти повторюють спроби (Retry Storm)</tspan><tspan x="295.0" dy="14.3">Крах системи: Out Of Memory Killer аварійно вбиває процес БД,</tspan><tspan x="295.0" dy="14.3">всі користувачі втрачають доступ (Повний блекаут)</tspan></text>
<rect x="590.0" y="70.0" width="510.0" height="370.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="845.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">✅ Вирівнювання навантаження чергою (Load Leveling)</text>
<rect x="610.0" y="115.0" width="470.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="845.0" y="141.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">1. Сплеск 10 000 RPS надходить на API Gateway</tspan></text>
<line x1="845.0" y1="160.0" x2="845.0" y2="180.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="610.0" y="180.0" width="470.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="845.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">2. Шлюз записує задачі в чергу (&lt; 2 мс) і повертає 202 Accepted</tspan><tspan x="845.0" dy="14.3">З'єднання з клієнтами закриваються негайно, ресурси вільні</tspan></text>
<line x1="845.0" y1="235.0" x2="845.0" y2="255.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="610.0" y="255.0" width="470.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="845.0" y="281.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">3. Буфер черги тимчасово зростає (Backlog), поглинаючи надлишок</tspan><tspan x="845.0" dy="14.3">Воркери вичитують задачі з фіксованим темпом 400 req/s</tspan></text>
<line x1="845.0" y1="315.0" x2="845.0" y2="335.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="610.0" y="335.0" width="470.0" height="85.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="845.0" y="367.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">4. База даних працює в штатному лінійному режимі (80% CPU)</tspan><tspan x="845.0" dy="14.3">Жодної втраченої транзакції; черга плавно розвантажується;</tspan><tspan x="845.0" dy="14.3">система зберігає 100% працездатність</tspan></text>
</svg>