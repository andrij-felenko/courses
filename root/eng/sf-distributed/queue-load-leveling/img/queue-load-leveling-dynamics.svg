<line x1="80.0" y1="185.0" x2="510.0" y2="185.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="5,4"/>
<text x="420.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Ємність бекенду μ = 400 RPS</text>
<rect x="155.0" y="160.0" width="180.0" height="36.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/><text x="245.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Надлишковий обсяг (Backlog)</tspan><tspan x="245.0" dy="13.0">Акумулюється в черзі</tspan></text>
<rect x="570.0" y="70.0" width="510.0" height="190.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="825.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Динаміка наповнення та зливу черги Q(t)</text>
<line x1="610.0" y1="230.0" x2="1050.0" y2="230.0" stroke="#333333" stroke-width="1.5"/>
