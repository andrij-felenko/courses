<rect x="20.0" y="20.0" width="1080.0" height="480.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="560.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Гідродинаміка демпфування: вхідний сплеск, буферизація та контрольований злив</text>
