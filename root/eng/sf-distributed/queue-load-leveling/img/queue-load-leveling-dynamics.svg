<text x="910.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза зливу T_drain (λ &lt; μ)</text>
<rect x="40.0" y="280.0" width="1040.0" height="200.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="560.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">3. Режим роботи захищеного бекенду (База даних / Зовнішній API)</text>
<rect x="60.0" y="325.0" width="300.0" height="135.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="210.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Навантаження на CPU та I/O:</tspan><tspan x="210.0" dy="14.3">Стабільне 75-80%</tspan><tspan x="210.0" dy="14.3"></tspan><tspan x="210.0" dy="14.3">• Пул з'єднань БД: фіксований (50)</tspan><tspan x="210.0" dy="14.3">• Немає вичерпання пам'яті (OOM)</tspan><tspan x="210.0" dy="14.3">• Відсутня деградація дискового WAL</tspan></text>
<rect x="410.0" y="325.0" width="300.0" height="135.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="560.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Пропускна здатність вичитування:</tspan><tspan x="560.0" dy="14.3">Контрольовані 400 req/s</tspan><tspan x="560.0" dy="14.3"></tspan><tspan x="560.0" dy="14.3">• Рівномірний темп обробки</tspan><tspan x="560.0" dy="14.3">• Відсутність збоїв через сплеск</tspan><tspan x="560.0" dy="14.3">• 100% збереження транзакцій</tspan></text>
<rect x="760.0" y="325.0" width="300.0" height="135.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="910.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Компроміс затримки (Trade-off):</tspan><tspan x="910.0" dy="14.3">Латентність зростає контрольовано</tspan><tspan x="910.0" dy="14.3"></tspan><tspan x="910.0" dy="14.3">• T_wait = Q(t) / μ</tspan><tspan x="910.0" dy="14.3">• Клієнт отримує 202 Accepted</tspan><tspan x="910.0" dy="14.3">• Результат через опитування або Webhook</tspan></text>
</svg>