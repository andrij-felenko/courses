<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="46.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">СТРАТЕГІЇ БОРОТЬБИ ІЗ ЗАТРИМКОЮ: послідовний ретрай, паралельне дублювання та відкладений гедж</tspan></text>
<rect x="40.0" y="80.0" width="1100.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="60.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Послідовний повтор за таймаутом (Sequential Retry)</text>
<text x="60.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Чекаємо повного вичерпання таймауту (200 мс), перш ніж зробити другу спробу</text>
<line x1="240.0" y1="185.0" x2="1060.0" y2="185.0" stroke="#333333" stroke-width="1.5"/>
<circle cx="240.0" cy="185.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="240.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">t = 0</text>
<rect x="240.0" y="145.0" width="480.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="480.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Спроба 1: зависла (чекаємо таймаут 200 мс)</text>
<circle cx="720.0" cy="185.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="720.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">t = 200 мс (Timeout)</text>
<rect x="720.0" y="145.0" width="120.0" height="30.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="780.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Спроба 2 (15 мс)</text>
<circle cx="840.0" cy="185.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="840.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">t = 215 мс (Успіх)</text>
<rect x="890.0" y="140.0" width="230.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1005.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">Сумарний час: 215 мс</tspan><tspan x="1005.0" dy="13.7">Користувач чекав таймаут</tspan></text>
<rect x="40.0" y="245.0" width="1100.0" height="155.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="60.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Агресивне подвійне надсилання (Eager Dual-Send)</text>
<text x="60.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Надсилаємо запит одночасно на 2 репліки при кожному виклику: +100% трафіку і роботи CPU</text>
<line x1="240.0" y1="360.0" x2="1060.0" y2="360.0" stroke="#333333" stroke-width="1.5"/>
<circle cx="240.0" cy="360.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="240.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">t = 0</text>
<rect x="240.0" y="310.0" width="480.0" height="22.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="480.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Репліка A: повільна (800 мс)</text>
<rect x="240.0" y="335.0" width="120.0" height="22.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="300.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Репліка B: швидка (15 мс)</text>
<circle cx="360.0" cy="360.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="360.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">t = 15 мс (Успіх)</text>
<rect x="890.0" y="305.0" width="230.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1005.0" y="321.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">Сумарний час: 15 мс</tspan><tspan x="1005.0" dy="13.7">АЛЕ: +100% навантаження</tspan></text>
<rect x="40.0" y="415.0" width="1100.0" height="205.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">3. Відкладений геджований запит (Delayed Hedged Request) — ОПТИМУМ</text>
<text x="60.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Репліка 1 стартує в t = 0. Якщо немає відповіді до P95 (20 мс), надсилаємо Репліку 2. Хто перший — перемагає.</text>
<line x1="240.0" y1="560.0" x2="1060.0" y2="560.0" stroke="#333333" stroke-width="1.5"/>
<circle cx="240.0" cy="560.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="240.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">t = 0</text>
<rect x="240.0" y="480.0" width="280.0" height="24.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="340.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Репліка 1 (GC-пауза)</text>
<line x1="400.0" y1="505.0" x2="400.0" y2="560.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3,3"/>
<circle cx="400.0" cy="560.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="400.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">t = 20 мс (P95 поріг)</text>
<rect x="400.0" y="510.0" width="120.0" height="24.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="460.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Гедж: Репліка 2 (15 мс)</text>
<circle cx="520.0" cy="560.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="520.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">t = 35 мс (Фініш)</text>
<line x1="520.0" y1="510.0" x2="520.0" y2="480.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Cancel Репліки 1</text>
<rect x="770.0" y="480.0" width="350.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="945.0" y="514.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">Сумарний час: 35 мс замість 215 мс чи 800 мс!</tspan><tspan x="945.0" dy="11.7">Додатковий трафік: лише ~5% (спрацьовує тільки для найповільніших 5% запитів)</tspan></text>
</svg>