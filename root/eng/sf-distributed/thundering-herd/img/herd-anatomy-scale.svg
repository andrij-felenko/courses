<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1100.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="46.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Анатомія гримучої отари: фазова синхронізація та резонансний колапс системи</tspan></text>
<rect x="40.0" y="80.0" width="330.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="55.0" y="95.0" width="300.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">1. Тригер та скидання сесій</tspan></text>
<rect x="55.0" y="140.0" width="300.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="205.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Подія в системі:</tspan><tspan x="205.0" dy="13.0">• Перезапуск шлюзу / BGP-флап</tspan><tspan x="205.0" dy="13.0">• Одночасне скидання 2 000 000 з'єднань</tspan></text>
<rect x="55.0" y="195.0" width="300.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="209.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Детермінована поведінка клієнтів:</tspan><tspan x="205.0" dy="12.3">Код клієнта: sleep(1.0) -&gt; connect()</tspan><tspan x="205.0" dy="12.3">Усі 2 млн таймерів завершуються в мить</tspan><tspan x="205.0" dy="12.3">t = 03:00:01.000 (точність до мс)</tspan></text>
<line x1="205.0" y1="265.0" x2="205.0" y2="295.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="55.0" y="300.0" width="300.0" height="105.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Синхронізований імпульс (Herd Surge):</tspan><tspan x="205.0" dy="13.0">Вхідний пік: 2 000 000 запитів/с</tspan><tspan x="205.0" dy="13.0">(нормальна пропускна здатність 50 000 RPS)</tspan><tspan x="205.0" dy="13.0">Стрибок навантаження у 40 разів</tspan><tspan x="205.0" dy="13.0">за інтервал часу &lt; 50 мілісекунд</tspan></text>
<rect x="55.0" y="415.0" width="300.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="457.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Фазова узгодженість (Phase Coherence):</tspan><tspan x="205.0" dy="12.3">Клієнти діють як єдиний когерентний осцилятор:</tspan><tspan x="205.0" dy="12.3">всі сплять одночасно і б'ють одночасно,</tspan><tspan x="205.0" dy="12.3">утворюючи резонансний шторм</tspan></text>
<rect x="390.0" y="80.0" width="380.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="405.0" y="95.0" width="350.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">2. Колапс вузького місця (Шлюз)</tspan></text>
<rect x="405.0" y="140.0" width="350.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="154.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Виснаження черг сокетів:</tspan><tspan x="580.0" dy="12.3">• Черга listen queue (somaxconn) переповнена</tspan><tspan x="580.0" dy="12.3">• Ядро дропає 98% вхідних TCP SYN пакетів</tspan><tspan x="580.0" dy="12.3">• CPU витрачається на softirq та handshake</tspan></text>
<rect x="405.0" y="210.0" width="350.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">TLS Handshake &amp; Обчислювальний тупик:</tspan><tspan x="580.0" dy="12.3">• 2.5 мс CPU на повний TLS 1.3 ECDH обмін</tspan><tspan x="580.0" dy="12.3">• 128 ядр здатні виконати лише 51k TLS/s</tspan><tspan x="580.0" dy="12.3">• 100% CPU зайнято криптографією</tspan></text>
<rect x="405.0" y="280.0" width="350.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="294.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Деградація затримки та таймаути:</tspan><tspan x="580.0" dy="12.3">• Затримка підключення: 10 мс -&gt; 30 000 мс</tspan><tspan x="580.0" dy="12.3">• Спрацьовує клієнтський таймаут 3.0 с</tspan><tspan x="580.0" dy="12.3">• Сервер витратив ресурси даремно</tspan></text>
<rect x="405.0" y="350.0" width="350.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="404.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Метастабільний резонанс (Metastability):</tspan><tspan x="580.0" dy="13.0">1. Мільйони відхилених клієнтів знову сплять</tspan><tspan x="580.0" dy="13.0">   однаковий час (наприклад, ще 3 секунди).</tspan><tspan x="580.0" dy="13.0">2. О 03:00:04.000 приходить Друга Хвиля.</tspan><tspan x="580.0" dy="13.0">3. О 03:00:07.000 приходить Третя Хвиля.</tspan><tspan x="580.0" dy="13.0">4. Корисна робота (goodput) = 0%.</tspan><tspan x="580.0" dy="13.0">5. Система ніколи не відновлюється сама!</tspan></text>
<rect x="790.0" y="80.0" width="350.0" height="470.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<rect x="805.0" y="95.0" width="320.0" height="34.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">3. Десинхронізація та бар'єри</tspan></text>
<rect x="805.0" y="140.0" width="320.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="162.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">А. Клієнтський джитер (Decorrelated Jitter):</tspan><tspan x="965.0" dy="12.3">Розмазування повторних спроб у часі:</tspan><tspan x="965.0" dy="12.3">t = min(cap, uniform(base, prev * 3))</tspan><tspan x="965.0" dy="12.3">Руйнує фазову когерентність імпульсу.</tspan></text>
<rect x="805.0" y="225.0" width="320.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">Б. Вхідний контроль (Admission / Token Bucket):</tspan><tspan x="965.0" dy="12.3">Шлюз миттєво відсікає надлишок SYN/TCP,</tspan><tspan x="965.0" dy="12.3">пропускаючи лише гарантовані 50k conn/s.</tspan><tspan x="965.0" dy="12.3">Захищає CPU від перевантаження.</tspan></text>
<rect x="805.0" y="310.0" width="320.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="332.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">В. TLS Session Tickets (RFC 8446):</tspan><tspan x="965.0" dy="12.3">Скорочення часу хендшейку з 2.5 мс до 0.1 мс.</tspan><tspan x="965.0" dy="12.3">Пропускна здатність TLS зростає у 25 разів</tspan><tspan x="965.0" dy="12.3">при масових повторних підключеннях.</tspan></text>
<rect x="805.0" y="395.0" width="320.0" height="135.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">Г. Ступінчастий плавний старт (Slow-Start):</tspan><tspan x="965.0" dy="12.3">Відновлений вузол нарощує ліміт трафіку</tspan><tspan x="965.0" dy="12.3">поступово: 10% -&gt; 25% -&gt; 50% -&gt; 100%,</tspan><tspan x="965.0" dy="12.3">не провокуючи миттєвий прорив дамби</tspan><tspan x="965.0" dy="12.3">і не захоплюючи весь трафік отари.</tspan></text>
<line x1="370.0" y1="220.0" x2="390.0" y2="220.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="770.0" y1="220.0" x2="790.0" y2="220.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>