<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="25.0" y="15.0" width="1090.0" height="465.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="570.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка глобальної канонічної моделі проти локальних схем контекстів</text>
<text x="570.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Чому «єдина модель усього підприємства» зазнала фіаско і як діють сучасні розподілені системи</text>
<rect x="50.0" y="95.0" width="1040.0" height="155.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="570.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Антипатерн: Єдина всеохопна корпоративна супер-схема (The Global CDM Trap)</text>
<rect x="75.0" y="135.0" width="285.0" height="100.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="217.5" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Роздуті DTO (God Objects)</text>
<text x="217.5" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сотні опціональних полів, де</text>
<text x="217.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">кожній команді потрібні лише 5%.</text>
<text x="217.5" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Найменший спільний знаменник.</text>
<rect x="400.0" y="135.0" width="310.0" height="100.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="555.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Бюрократичний тупик змін</text>
<text x="555.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Будь-яка зміна поля вимагає</text>
<text x="555.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">погодження 12 відділів компанії.</text>
<text x="555.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Релізи заморожуються на місяці.</text>
<rect x="750.0" y="135.0" width="310.0" height="100.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="905.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Семантичний конфлікт</text>
<text x="905.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Поняття «Клієнт» у білінгу, CRM,</text>
<text x="905.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">логістиці та підтримці має зовсім</text>
<text x="905.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">різний зміст та життєвий цикл.</text>
<rect x="50.0" y="270.0" width="1040.0" height="190.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="570.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сучасне рішення: Федеративні контракти за межами обмежених контекстів (DDD + Schema Registry)</text>
<rect x="75.0" y="310.0" width="285.0" height="135.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="217.5" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Контекст Замовлень (Orders)</text>
<line x1="90.0" y1="342.0" x2="345.0" y2="342.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="90.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Канонічна модель замовлення:</text>
<text x="95.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• OrderID, CustomerRef</text>
<text x="95.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• LineItems, Pricing</text>
<text x="95.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• OrderState, Timestamp</text>
<rect x="400.0" y="310.0" width="310.0" height="135.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="555.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Контекст Доставки (Shipping)</text>
<line x1="415.0" y1="342.0" x2="695.0" y2="342.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="415.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Канонічна модель відправлення:</text>
<text x="420.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• ParcelID, DestinationAddress</text>
<text x="420.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• WeightKg, CarrierCode</text>
<text x="420.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• DeliveryStatus</text>
<rect x="750.0" y="310.0" width="310.0" height="135.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="905.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Контекст Рахунків (Invoicing)</text>
<line x1="765.0" y1="342.0" x2="1045.0" y2="342.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="765.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Канонічна модель оплати:</text>
<text x="770.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• InvoiceID, TaxID</text>
<text x="770.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• AmountCents, Currency</text>
<text x="770.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• PaymentStatus</text>
</svg>