<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння моделей передачі: Push, Наївний Poll та Кредитний потік</text>
<rect x="40.0" y="50.0" width="280.0" height="425.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/>
<text x="180.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Некерований Push</text>
<rect x="115.6" y="94.3" width="128.9" height="41.3" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Джерело (Producer)</tspan><tspan x="180.0" dy="14.3">Шле без обмежень</tspan></text>
<line x1="180.0" y1="145.0" x2="180.0" y2="215.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="185.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">data(1..10000)</text>
<rect x="109.3" y="229.3" width="141.4" height="41.3" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Одержувач (Consumer)</tspan><tspan x="180.0" dy="14.3">Буфер переповнюється</tspan></text>
<rect x="55.0" y="305.0" width="250.0" height="155.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.0"/>
<text x="180.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідки перевантаження:</text>
<text x="180.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Буфер росте без меж</text>
<text x="180.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• OOM-crash / скидання даних</text>
<text x="180.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Падіння стабільності мережі</text>
<text x="180.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Швидкість диктує джерело!</text>
<rect x="360.0" y="50.0" width="280.0" height="425.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/>
<text x="500.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">2. Наївний Poll (Опитування)</text>
<rect x="441.8" y="94.3" width="116.3" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Джерело / Брокер</tspan><tspan x="500.0" dy="14.3">Зберігає чергу</tspan></text>
<line x1="470.0" y1="215.0" x2="470.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">poll() запит</text>
<line x1="530.0" y1="145.0" x2="530.0" y2="215.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="535.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">відповідь з даними</text>
<rect x="429.3" y="229.3" width="141.4" height="41.3" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="500.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Одержувач (Consumer)</tspan><tspan x="500.0" dy="14.3">Опитує у циклі</tspan></text>
<rect x="375.0" y="305.0" width="250.0" height="155.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.0"/>
<text x="500.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Властивості опитування:</text>
<text x="500.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Безпечно від переповнення</text>
<text x="500.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Зайві RTT на кожну пачку</text>
<text x="500.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Марні пусті запити (Spin)</text>
<text x="500.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Висока затримка доставки!</text>
<rect x="680.0" y="50.0" width="280.0" height="425.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/>
<text x="820.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Кредитний потік (Reactive)</text>
<rect x="743.0" y="94.3" width="153.9" height="41.3" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Джерело (Publisher)</tspan><tspan x="820.0" dy="14.3">Має баланс: credit = N</tspan></text>
<line x1="790.0" y1="215.0" x2="790.0" y2="145.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="785.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">request(N)</text>
<line x1="850.0" y1="145.0" x2="850.0" y2="215.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="855.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">N подій (onNext)</text>
<rect x="743.0" y="229.3" width="153.9" height="41.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Одержувач (Subscriber)</tspan><tspan x="820.0" dy="14.3">Видає точні кредити</tspan></text>
<rect x="695.0" y="305.0" width="250.0" height="155.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="820.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Ідеальний баланс:</text>
<text x="820.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Нульовий ризик OOM</text>
<text x="820.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Потокова передача без пауз</text>
<text x="820.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Максимальна утилізація BDP</text>
<text x="820.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Швидкість диктує споживач!</text>
</svg>