<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мультиплексування в HTTP/2 та HTTP/3: ізоляція протитиску між потоками</text>
<rect x="60.0" y="55.0" width="880.0" height="370.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,6"/>
<text x="190.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Фізичне з'єднання TCP / QUIC (Connection Window)</text>
<rect x="80.0" y="95.0" width="840.0" height="95.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="100.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Потік #1 (Stream 1: Великий експорт / важкий звіт)</text>
<rect x="245.6" y="132.5" width="148.8" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Одержувач зайнятий:</tspan><tspan x="320.0" dy="13.0">Stream Window = 0 байтів</tspan></text>
<rect x="577.0" y="132.5" width="126.0" height="35.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Джерело ПРИЗУПИНЕНО:</tspan><tspan x="640.0" dy="13.0">Чекає WINDOW_UPDATE</tspan></text>
<line x1="410.0" y1="150.0" x2="540.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="210.0" width="840.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="100.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Потік #2 (Stream 3: Критичний RPC / Оплата / Heartbeat)</text>
<rect x="254.2" y="247.5" width="131.7" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Одержувач вільний:</tspan><tspan x="320.0" dy="13.0">Stream Window = 64 КБ</tspan></text>
<rect x="588.4" y="247.5" width="103.2" height="35.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Джерело ПЕРЕДАЄ:</tspan><tspan x="640.0" dy="13.0">Повна швидкість</tspan></text>
<line x1="540.0" y1="265.0" x2="410.0" y2="265.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="80.0" y="320.0" width="840.0" height="90.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="100.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Потік #3 (Stream 5: Стандартний запит API Gateway)</text>
<rect x="254.2" y="357.5" width="131.7" height="35.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Одержувач готовий:</tspan><tspan x="320.0" dy="13.0">Stream Window = 32 КБ</tspan></text>
<rect x="588.4" y="357.5" width="103.2" height="35.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="640.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Джерело ПЕРЕДАЄ:</tspan><tspan x="640.0" dy="13.0">Штатний режим</tspan></text>
<line x1="540.0" y1="375.0" x2="410.0" y2="375.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="435.0" width="880.0" height="48.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="500.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевага роздільного контролю потоку на рівні Stream:</text>
<text x="500.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зупинка Потоку #1 не викликає блокування голови черги (Head-of-Line Blocking) для Потоку #2 та Потоку #3.</text>
</svg>