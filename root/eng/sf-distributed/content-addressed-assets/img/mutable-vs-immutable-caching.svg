<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="20.0" width="440.0" height="480.0" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="235.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Мутабельна адресація (/app.js)</text>
<text x="235.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Постійна ревалідація та ризик version skew</text>
<rect x="485.0" y="20.0" width="440.0" height="480.0" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="705.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Контентна адресація (/app.8f4a1c.js)</text>
<text x="705.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Cache-Control: immutable — нульові RTT</text>
<rect x="47.6" y="111.3" width="124.9" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Браузер (Клієнт)</tspan><tspan x="110.0" dy="14.3">Кеш: старий app.js</tspan></text>
<rect x="297.6" y="111.3" width="124.9" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Сервер / CDN Edge</tspan><tspan x="360.0" dy="14.3">ETag / If-Modified</tspan></text>
<line x1="180.0" y1="120.0" x2="290.0" y2="120.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">GET /app.js</text>
<line x1="290.0" y1="145.0" x2="180.0" y2="145.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">304 Not Modified (100 мс)</text>
<rect x="60.8" y="212.2" width="348.3" height="55.6" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Проблема 1: Шторм 304-запитів</tspan><tspan x="235.0" dy="14.3">Мільйони клієнтів перевіряють ETag на кожен перегляд,</tspan><tspan x="235.0" dy="14.3">створюючи навантаження на Origin і затримку RTT.</tspan></text>
<rect x="32.6" y="332.2" width="404.7" height="55.6" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Проблема 2: Розсинхронізація (Version Skew)</tspan><tspan x="235.0" dy="14.3">Новий index.html завантажився, але app.js взято зі старого</tspan><tspan x="235.0" dy="14.3">кешу -&gt; падіння функцій, невідповідність типів, 404 на чанках.</tspan></text>
<rect x="97.3" y="441.4" width="275.3" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="456.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Підсумок: або затримка на кожному кроці,</tspan><tspan x="235.0" dy="14.3">або ризик зламаного інтерфейсу користувача</tspan></text>
<rect x="523.8" y="111.3" width="112.3" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Браузер (Клієнт)</tspan><tspan x="580.0" dy="14.3">Local Disk Cache</tspan></text>
<rect x="770.7" y="111.3" width="118.6" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">CDN Edge / Origin</tspan><tspan x="830.0" dy="14.3">Immutable Storage</tspan></text>
<line x1="650.0" y1="130.0" x2="760.0" y2="130.0" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="705.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Мережевий запит ВІДСУТНІЙ</text>
<text x="705.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 мс HIT (max-age=31536000)</text>
<rect x="499.5" y="212.2" width="411.0" height="55.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Перевага 1: Нульовий трафік на ревалідацію</tspan><tspan x="705.0" dy="14.3">Заголовок 'immutable' блокує умовні GET навіть при Reload (F5).</tspan><tspan x="705.0" dy="14.3">Браузер гарантовано бере файл з пам'яті/диска.</tspan></text>
<rect x="518.3" y="332.2" width="373.4" height="55.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Перевага 2: Атомарне оновлення версії</tspan><tspan x="705.0" dy="14.3">index.html (no-cache) вказує на новий /app.9e3b4d.js.</tspan><tspan x="705.0" dy="14.3">Нові та старі клієнти працюють ізольовано без конфліктів.</tspan></text>
<rect x="564.2" y="441.4" width="281.6" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="456.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Підсумок: 100% кеш-хіт на периферії,</tspan><tspan x="705.0" dy="14.3">миттєве відкриття та абсолютна узгодженість</tspan></text>
</svg>