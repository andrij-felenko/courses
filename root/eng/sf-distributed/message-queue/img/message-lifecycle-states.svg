<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="1060.0" height="465.0" rx="8" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<text x="550.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат станів повідомлення в точці-точці</text>
<rect x="50.0" y="160.0" width="180.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="140.0" y="184.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1. ГОТОВЕ (Ready)</tspan><tspan x="140.0" dy="15.0"></tspan><tspan x="140.0" dy="15.0">Повідомлення записане</tspan><tspan x="140.0" dy="15.0">в буфер і чекає</tspan><tspan x="140.0" dy="15.0">на вільного споживача</tspan></text>
<line x1="50.0" y1="100.0" x2="140.0" y2="160.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="75.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Публікація
(publish)</text>
<line x1="230.0" y1="210.0" x2="370.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оренда / Видача</text>
<text x="300.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">acquire / consume</text>
<rect x="370.0" y="150.0" width="220.0" height="120.0" rx="6" fill="#fef9e7" stroke="#d97706" stroke-width="2.0"/><text x="480.0" y="184.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">2. В ОБРОБЦІ (In-Flight)</tspan><tspan x="480.0" dy="15.0"></tspan><tspan x="480.0" dy="15.0">Повідомлення заблоковане</tspan><tspan x="480.0" dy="15.0">(Visibility Timeout).</tspan><tspan x="480.0" dy="15.0">Інші воркери його не бачать</tspan></text>
<line x1="590.0" y1="190.0" x2="780.0" y2="130.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="685.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Успіх: ACK</text>
<text x="685.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Роботу завершено</text>
<rect x="780.0" y="85.0" width="260.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="910.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">3. ПІДТВЕРДЖЕНО (Acked)</tspan><tspan x="910.0" dy="15.0"></tspan><tspan x="910.0" dy="15.0">Повідомлення видаляється</tspan><tspan x="910.0" dy="15.0">із пам'яті та диску.</tspan><tspan x="910.0" dy="15.0">(Кінцевий стан)</tspan></text>
<line x1="480.0" y1="270.0" x2="480.0" y2="360.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="545.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка (NACK) або
Таймаут оренди</text>
<rect x="380.0" y="360.0" width="200.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="480.0" y="391.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Перевірка ліміту спроб</tspan><tspan x="480.0" dy="15.0">(Delivery Attempts)</tspan></text>
<line x1="380.0" y1="395.0" x2="140.0" y2="395.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="140.0" y1="395.0" x2="140.0" y2="260.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="250.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Спроб &lt; MAX: requeue / redelivery (з бекофом)</text>
<line x1="580.0" y1="395.0" x2="780.0" y2="395.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="680.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Спроб ≥ MAX</text>
<rect x="780.0" y="350.0" width="260.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="910.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">4. МЕРТВА ЧЕРГА (DLQ)</tspan><tspan x="910.0" dy="15.0"></tspan><tspan x="910.0" dy="15.0">Отруйне повідомлення (Poison Pill)</tspan><tspan x="910.0" dy="15.0">ізольовано для аналізу інженерами.</tspan><tspan x="910.0" dy="15.0">(Кінцевий стан)</tspan></text>
</svg>