<rect x="640.0" y="395.0" width="510.0" height="220.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="895.0" y="470.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Ключові властивості хореографії:</tspan><tspan x="895.0" dy="15.6">• Немає єдиного центру керування чи точки відмови</tspan><tspan x="895.0" dy="15.6">• Сервіси публікують факти (події) про зміни стану</tspan><tspan x="895.0" dy="15.6">• Повна часова автономія та слабке зв'язування</tspan><tspan x="895.0" dy="15.6">• Загальний бізнес-процес розмазаний між кодом обробників</tspan><tspan x="895.0" dy="15.6">• Відкат вимагає узгодженого ланцюга компенсаційних подій</tspan></text>
