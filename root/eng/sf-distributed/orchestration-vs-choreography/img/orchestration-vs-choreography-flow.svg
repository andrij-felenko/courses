<rect x="50.0" y="370.0" width="510.0" height="245.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="457.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Ключові властивості оркестрації:</tspan><tspan x="305.0" dy="15.6">• Координатор явно знає повний граф та стан процесу</tspan><tspan x="305.0" dy="15.6">• Команди надсилаються адресно конкретним виконавцям</tspan><tspan x="305.0" dy="15.6">• Централізований журнал виконання (Audit Trail)</tspan><tspan x="305.0" dy="15.6">• Відмовостійкість: перезапуск та відкат координує рушій</tspan><tspan x="305.0" dy="15.6">• Сервіси не знають про існування один одного</tspan></text>
