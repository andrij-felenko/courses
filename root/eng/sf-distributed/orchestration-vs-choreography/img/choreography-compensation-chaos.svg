<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.0" y="30.0" width="1100.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="600.0" y="57.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Каскадний колапс компенсацій у реактивній хореографії</tspan></text>
<rect x="50.0" y="100.0" width="1100.0" height="140.0" rx="6" fill="#f9fdfa" stroke="#27ae60" stroke-width="1.5"/>
<text x="150.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПРЯМИЙ ХІД (Успішні кроки 1 і 2)</text>
<rect x="80.0" y="145.0" width="200.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">1. Склад (Inventory)</tspan><tspan x="180.0" dy="15.6">Зарезервовано товар</tspan></text>
<line x1="280.0" y1="180.0" x2="430.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="355.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">StockReserved</text>
<rect x="430.0" y="145.0" width="200.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">2. Оплата (Payments)</tspan><tspan x="530.0" dy="15.6">Списано 45 000 грн</tspan></text>
<line x1="630.0" y1="180.0" x2="780.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="705.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">PaymentCaptured</text>
<rect x="780.0" y="145.0" width="230.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="895.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">3. Доставка (Logistics)</tspan><tspan x="895.0" dy="14.3">АВАРІЯ: Немає вільних кур'єрів</tspan></text>
<rect x="50.0" y="270.0" width="1100.0" height="180.0" rx="6" fill="#fef8f8" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЗВОРОТНИЙ ХІД (Розмазані компенсаційні події)</text>
<line x1="895.0" y1="215.0" x2="895.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="905.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">DeliveryFailedEvent</text>
<rect x="740.0" y="330.0" width="220.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Платіжний сервіс</tspan><tspan x="850.0" dy="15.0">Слухає: DeliveryFailed</tspan><tspan x="850.0" dy="15.0">Виконує: Refund 45 000 грн</tspan></text>
<line x1="740.0" y1="365.0" x2="580.0" y2="365.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="660.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">PaymentRefunded</text>
<rect x="360.0" y="330.0" width="220.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Складський сервіс</tspan><tspan x="470.0" dy="15.0">Слухає: PaymentRefunded</tspan><tspan x="470.0" dy="15.0">Виконує: ReleaseStock</tspan></text>
<line x1="360.0" y1="365.0" x2="220.0" y2="365.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="290.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">StockReleased</text>
<rect x="80.0" y="330.0" width="140.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="361.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Сервіс замовлень</tspan><tspan x="150.0" dy="15.0">Статус: CANCELLED</tspan></text>
<rect x="50.0" y="480.0" width="340.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="534.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. Стан перегонів компенсації:</tspan><tspan x="220.0" dy="15.0">Якщо DeliveryFailed надійде до</tspan><tspan x="220.0" dy="15.0">завершення PaymentCaptured, платіж</tspan><tspan x="220.0" dy="15.0">не знайде що повертати, а потім</tspan><tspan x="220.0" dy="15.0">спише гроші назавжди (фантомне списання)</tspan></text>
<rect x="430.0" y="480.0" width="340.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="534.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">2. Непомітне зависання (Silent Stall):</tspan><tspan x="600.0" dy="15.0">Якщо платіжний сервіс впаде і не</tspan><tspan x="600.0" dy="15.0">опублікує PaymentRefunded, склад ніколи</tspan><tspan x="600.0" dy="15.0">не дізнається про потребу розблокувати</tspan><tspan x="600.0" dy="15.0">товар. Немає таймера-супервізора.</tspan></text>
<rect x="810.0" y="480.0" width="340.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="980.0" y="534.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">3. Комбінаторний вибух топіків:</tspan><tspan x="980.0" dy="15.0">Кожен сервіс має знати всі варіанти</tspan><tspan x="980.0" dy="15.0">подій збою від усіх наступних сервісів.</tspan><tspan x="980.0" dy="15.0">Зв'язність за схемами подій зростає</tspan><tspan x="980.0" dy="15.0">квадратично: N сервісів → N*(N-1) зв'язків.</tspan></text>
</svg>