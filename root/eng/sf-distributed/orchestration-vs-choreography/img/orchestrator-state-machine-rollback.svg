<rect x="720.0" y="95.0" width="420.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="184.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">1. SagaStarted { order_id: &quot;ORD-981&quot; }</tspan><tspan x="930.0" dy="15.0">2. StepScheduled { name: &quot;ReserveInventory&quot; }</tspan><tspan x="930.0" dy="15.0">3. StepCompleted { result: &quot;RESERVED_OK&quot; }</tspan><tspan x="930.0" dy="15.0">4. CompensationRegistered { action: &quot;Release&quot; }</tspan><tspan x="930.0" dy="15.0">5. StepScheduled { name: &quot;ChargePayment&quot; }</tspan><tspan x="930.0" dy="15.0">6. StepCompleted { result: &quot;PAYMENT_OK&quot; }</tspan><tspan x="930.0" dy="15.0">7. CompensationRegistered { action: &quot;Refund&quot; }</tspan><tspan x="930.0" dy="15.0">8. StepScheduled { name: &quot;BookDelivery&quot; }</tspan><tspan x="930.0" dy="15.0">9. StepFailed { error: &quot;NO_COURIERS_503&quot; }</tspan><tspan x="930.0" dy="15.0">10. RollbackStarted { stack_depth: 2 }</tspan><tspan x="930.0" dy="15.0">11. CompensationExecuted { action: &quot;Refund&quot; }</tspan><tspan x="930.0" dy="15.0">12. CompensationExecuted { action: &quot;Release&quot; }</tspan><tspan x="930.0" dy="15.0">13. SagaTerminated { status: &quot;ROLLED_BACK&quot; }</tspan></text>
<rect x="720.0" y="465.0" width="420.0" height="165.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="930.0" y="512.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Гарантії Orchestrator Engine:</tspan><tspan x="930.0" dy="15.6">• Точний стан збережено на кожному кроці</tspan><tspan x="930.0" dy="15.6">• При падінні вузла: відновлення журналу й</tspan><tspan x="930.0" dy="15.6">  продовження відкату рівно з точки аварії</tspan><tspan x="930.0" dy="15.6">• Неможливість втрати компенсації</tspan><tspan x="930.0" dy="15.6">• Вбудовані політики повторів з джитером</tspan></text>
