<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1120.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="600.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">АНАТОМІЯ ОТРУЙНОЇ ПЕТЛІ (POISON LOOP) ТА 4-РІВНЕВИЙ МЕХАНІЗМ РОЗРИВУ</tspan></text>
<rect x="50.0" y="85.0" width="530.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="315.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">НЕБЕЗПЕКА: ЯК УТВОРЮЄТЬСЯ ОТРУЙНА ПЕТЛЯ</tspan></text>
<rect x="50.0" y="145.0" width="530.0" height="260.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="315.0" y="171.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">┌─────────────────────────────────────────────────────────────┐</tspan><tspan x="315.0" dy="14.3">│ 1. Брокер видає 'отруйне' повідомлення msg-99 (битий JSON /  │</tspan><tspan x="315.0" dy="14.3">│    несумісна бізнес-логіка / збій стороннього сервісу).     │</tspan><tspan x="315.0" dy="14.3">│                                                             │</tspan><tspan x="315.0" dy="14.3">│ 2. Споживач бере повідомлення в обробку:                   │</tspan><tspan x="315.0" dy="14.3">│    - Або падає з фатальною помилкою (Panic/OOM/SIGSEGV)     │</tspan><tspan x="315.0" dy="14.3">│    - Або виконує неідемпотентний сайд-ефект і падає до ACK! │</tspan><tspan x="315.0" dy="14.3">│                                                             │</tspan><tspan x="315.0" dy="14.3">│ 3. Брокер НЕ отримує ACK протягом Visibility Timeout.       │</tspan><tspan x="315.0" dy="14.3">│                                                             │</tspan><tspan x="315.0" dy="14.3">│ 4. Брокер повертає msg-99 на початок черги.                 │</tspan><tspan x="315.0" dy="14.3">│                                                             │</tspan><tspan x="315.0" dy="14.3">│ 5. Споживач знову читає msg-99 і ЗНОВУ ПАДАЄ!               │</tspan><tspan x="315.0" dy="14.3">└─────────────────────────────────────────────────────────────┘</tspan><tspan x="315.0" dy="14.3">НАСЛІДКИ: 100% завантаження CPU, блокування всієї партиції,</tspan><tspan x="315.0" dy="14.3">каскадне падіння пулу воркерів та подвоєння побічних ефектів.</tspan></text>
<rect x="50.0" y="415.0" width="530.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="315.0" y="441.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">ПАСТКА БЕЗЗАХИСНОГО RETRY:</tspan><tspan x="315.0" dy="15.0">Необмежені повторні спроби (infinite retries) за наявності</tspan><tspan x="315.0" dy="15.0">детермінованої помилки перетворюють споживача на генератор збоїв,</tspan><tspan x="315.0" dy="15.0">паралізуючи обробку всіх наступних валідних повідомлень.</tspan></text>
<rect x="620.0" y="85.0" width="530.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="885.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">РІШЕННЯ: 4-РІВНЕВИЙ РОЗРИВ ОТРУЙНОЇ ПЕТЛІ</tspan></text>
<rect x="620.0" y="145.0" width="530.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="885.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">РІВЕНЬ 1: Лічильник спроб (Delivery Attempts / Redelivery Count)</tspan><tspan x="885.0" dy="14.3">Брокер або заголовок повідомлення фіксує лічильник N.</tspan><tspan x="885.0" dy="14.3">Якщо N &gt; MaxRetries (наприклад, 3-5), повідомлення маркується як отруйне.</tspan></text>
<rect x="620.0" y="220.0" width="530.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="885.0" y="244.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">РІВЕНЬ 2: Транзакційна ліза обробки (Processing Lease)</tspan><tspan x="885.0" dy="14.3">Фіксація взяття повідомлення в базі даних із таймаутом оренди.</tspan><tspan x="885.0" dy="14.3">Якщо воркер зависає, ліза захищає від одночасного подвійного виконання.</tspan></text>
<rect x="620.0" y="295.0" width="530.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="885.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">РІВЕНЬ 3: Ізоляція в Dead Letter Queue (DLQ) з компенсацією</tspan><tspan x="885.0" dy="14.3">Отруйне повідомлення вилучається з основного потоку й записується в DLQ;</tspan><tspan x="885.0" dy="14.3">зсув (offset) у брокері підтверджується, звільняючи чергу.</tspan></text>
<rect x="620.0" y="370.0" width="530.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="885.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">РІВЕНЬ 4: Аварійний розривач ланцюга (Circuit Breaker)</tspan><tspan x="885.0" dy="14.3">Якщо частка збійних повідомлень перевищує 15% за 1 хвилину,</tspan><tspan x="885.0" dy="14.3">консюмер призупиняє вичитку (pause), щоб не спалити зовнішнє API.</tspan></text>
<rect x="620.0" y="445.0" width="530.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="885.0" y="471.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">РЕЗУЛЬТАТ: Черга продовжує рух, збійні події безпечно ізолюються,</tspan><tspan x="885.0" dy="15.0">а споживач ніколи не потрапляє в нескінченний цикл рестартів.</tspan></text>
<rect x="50.0" y="550.0" width="1100.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="576.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ІНЖЕНЕРНИЙ ЗАКОН ОТРУЙНИХ ПОВІДОМЛЕНЬ:</tspan><tspan x="600.0" dy="15.6">Будь-який ідемпотентний консюмер зобов'язаний мати жорсткий ліміт спроб і детермінований маршрут у DLQ.</tspan><tspan x="600.0" dy="15.6">Ніколи не дозволяйте непідтвердженому збою блокувати просування зсуву в черзі безстроково.</tspan></text>
</svg>