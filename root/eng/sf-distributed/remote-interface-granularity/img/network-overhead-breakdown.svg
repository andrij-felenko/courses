<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1040.0" height="44.0" rx="6" fill="#fff3cd" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">АНАТОМІЯ НАКЛАДНИХ ВИТРАТ МЕРЕЖЕВОГО ВИКЛИКУ: МІКРОСЕКУНДИ ПРОТИ МІЛІСЕКУНД</tspan></text>
<rect x="40.0" y="80.0" width="340.0" height="175.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="210.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Маршалінг у пам'яті</text>
<rect x="55.0" y="122.0" width="310.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="153.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Серіалізація структури в байти (JSON/Protobuf/FlatBuffers),</tspan><tspan x="210.0" dy="11.7">виділення буферів у heap, перевірка схеми.</tspan></text>
<rect x="55.0" y="200.0" width="310.0" height="42.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.2"/>
<text x="210.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Затримка: 0.01 – 0.5 мс</text>
<rect x="400.0" y="80.0" width="340.0" height="175.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/>
<text x="570.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">2. Системний виклик ядра</text>
<rect x="415.0" y="122.0" width="310.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="570.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Виклик sendmsg(), перемикання User -&gt; Kernel Space,</tspan><tspan x="570.0" dy="12.0">копіювання пам'яті в sk_buff сокета.</tspan></text>
<rect x="415.0" y="200.0" width="310.0" height="42.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/>
<text x="570.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">Затримка: 0.005 – 0.02 мс</text>
<rect x="760.0" y="80.0" width="340.0" height="175.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/>
<text x="930.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">3. Стек TCP/IP та NIC</text>
<rect x="775.0" y="122.0" width="310.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="930.0" y="153.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">TCP фреймінг, обчислення чексум, черга кільцевого буфера Tx,</tspan><tspan x="930.0" dy="11.7">передача даних контролеру через DMA.</tspan></text>
<rect x="775.0" y="200.0" width="310.0" height="42.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/>
<text x="930.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">Затримка: 0.01 – 0.05 мс</text>
<rect x="40.0" y="275.0" width="340.0" height="175.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">4. Фізичний транзит (Канал)</text>
<rect x="55.0" y="317.0" width="310.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="348.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Швидкість світла у волокні (~200 км/мс), затримки комутаторів,</tspan><tspan x="210.0" dy="11.7">буферизація в чергах маршрутизаторів (RTT).</tspan></text>
<rect x="55.0" y="395.0" width="310.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="210.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Затримка: 1.0 – 150.0 мс
(98% часу!)</text>
<rect x="400.0" y="275.0" width="340.0" height="175.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/>
<text x="570.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">5. Прийом NIC і ядром</text>
<rect x="415.0" y="317.0" width="310.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="570.0" y="348.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">DMA в Rx буфер, переривання ядра, TCP ACK generation,</tspan><tspan x="570.0" dy="12.0">пробудження потоку з epoll_wait() / recvmsg().</tspan></text>
<rect x="415.0" y="395.0" width="310.0" height="42.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/>
<text x="570.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">Затримка: 0.01 – 0.05 мс</text>
<rect x="760.0" y="275.0" width="340.0" height="175.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="930.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">6. Дезеріалізація та логіка</text>
<rect x="775.0" y="317.0" width="310.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="930.0" y="348.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Парсинг байтів у структуру об'єкта, валідація полів,</tspan><tspan x="930.0" dy="12.0">передача параметрів у функцію бізнес-логіки.</tspan></text>
<rect x="775.0" y="395.0" width="310.0" height="42.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.2"/>
<text x="930.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Затримка: 0.01 – 0.5 мс</text>
