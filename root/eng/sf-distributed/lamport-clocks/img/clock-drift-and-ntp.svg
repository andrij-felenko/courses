<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому фізичний годинник бреше: дрейф генераторів та аномалії NTP</text>
<rect x="20.0" y="16.0" width="440.0" height="44.0" rx="6" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.5"/><text x="240.0" y="42.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Дрейф кварцових генераторів</tspan></text>
<rect x="500.0" y="16.0" width="440.0" height="44.0" rx="6" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.5"/><text x="720.0" y="42.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Корекція NTP: плавне підтягування vs стрибок</tspan></text>
<rect x="20.0" y="70.0" width="440.0" height="390.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="40.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Ідеальний час T (еталон):</text>
<line x1="40.0" y1="120.0" x2="430.0" y2="120.0" stroke="#333333" stroke-width="1.8"/>
<line x1="60.0" y1="115.0" x2="60.0" y2="125.0" stroke="#333333" stroke-width="1.5"/>
<text x="60.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0 с</text>
<line x1="170.0" y1="115.0" x2="170.0" y2="125.0" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+100 с</text>
<line x1="280.0" y1="115.0" x2="280.0" y2="125.0" stroke="#333333" stroke-width="1.5"/>
<text x="280.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+200 с</text>
<line x1="390.0" y1="115.0" x2="390.0" y2="125.0" stroke="#333333" stroke-width="1.5"/>
<text x="390.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+300 с</text>
<text x="40.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Сервер A (частота +30 ppm — поспішає):</text>
<line x1="40.0" y1="200.0" x2="430.0" y2="200.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="60.0" y1="195.0" x2="60.0" y2="205.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="60.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">0.00 с</text>
<line x1="170.0" y1="195.0" x2="170.0" y2="205.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="170.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">+100.003 с</text>
<line x1="280.0" y1="195.0" x2="280.0" y2="205.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="280.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">+200.006 с</text>
<line x1="390.0" y1="195.0" x2="390.0" y2="205.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="390.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">+300.009 с</text>
<text x="40.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Сервер B (частота −40 ppm — відстає):</text>
<line x1="40.0" y1="280.0" x2="430.0" y2="280.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="60.0" y1="275.0" x2="60.0" y2="285.0" stroke="#2457d6" stroke-width="1.5"/>
<text x="60.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">0.00 с</text>
<line x1="170.0" y1="275.0" x2="170.0" y2="285.0" stroke="#2457d6" stroke-width="1.5"/>
<text x="170.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">+99.996 с</text>
<line x1="280.0" y1="275.0" x2="280.0" y2="285.0" stroke="#2457d6" stroke-width="1.5"/>
<text x="280.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">+199.992 с</text>
<line x1="390.0" y1="275.0" x2="390.0" y2="285.0" stroke="#2457d6" stroke-width="1.5"/>
<text x="390.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">+299.988 с</text>
<rect x="40.0" y="330.0" width="400.0" height="110.0" rx="6" fill="#fef9f8" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="365.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Розходження (skew) через 300 с = 21 мс</tspan><tspan x="240.0" dy="15.6">За добу накопичується понад 6 секунд розриву.</tspan><tspan x="240.0" dy="15.6">Настінний годинник фізично не здатен гарантувати</tspan><tspan x="240.0" dy="15.6">однаковий час на різних материнських платах.</tspan></text>
<rect x="500.0" y="70.0" width="440.0" height="390.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="520.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">1. Плавне зведення (Slewing / adjtime):</text>
<line x1="520.0" y1="140.0" x2="910.0" y2="140.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="520.0" y1="150.0" x2="700.0" y2="145.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="700.0" y1="145.0" x2="910.0" y2="140.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="710.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">годинник плавно сповільнюється/прискорюється (монотонно)</text>
<text x="520.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2. Стрибок (Clock Step / settimeofday):</text>
<line x1="520.0" y1="240.0" x2="680.0" y2="210.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="680.0" y1="210.0" x2="680.0" y2="255.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="680.0" y1="255.0" x2="910.0" y2="225.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="678.4" y="193.2" width="183.1" height="23.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Стрибок назад на −50 мс!</tspan></text>
<rect x="520.0" y="280.0" width="400.0" height="160.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="325.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Катастрофа стрибка назад (t_новше &lt; t_давніше):</tspan><tspan x="720.0" dy="15.6">• Порушення монотонності часу (t2 &lt; t1)</tspan><tspan x="720.0" dy="15.6">• Відповідь у логах з'являється РАНІШЕ за запит</tspan><tspan x="720.0" dy="15.6">• Таймаути зависають або спрацьовують миттєво</tspan><tspan x="720.0" dy="15.6">• База даних з Last-Write-Wins стирає свіжі транзакції</tspan><tspan x="720.0" dy="15.6">  старішим фізичним штампом часу.</tspan></text>
</svg>