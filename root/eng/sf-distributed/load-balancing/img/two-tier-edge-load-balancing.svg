<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівнева архітектура балансування: масштабування межі (L4) та логіки (L7)</text>
<rect x="45.0" y="84.0" width="150.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="120.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Клієнти в Інтернеті</tspan><tspan x="120.0" dy="13.0">Мільйони підключень</tspan><tspan x="120.0" dy="13.0">(Єдина Anycast IP)</tspan></text>
<line x1="200.0" y1="110.0" x2="250.0" y2="110.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="265.0" y="55.0" width="225.0" height="440.0" rx="6" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="377.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Рівень 1: L4 Межа (Edge)</text>
<rect x="282.0" y="111.7" width="190.0" height="36.7" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="377.0" y="127.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="377.0" dy="0.0">BGP Router (ECMP)</tspan><tspan x="377.0" dy="11.7">Розподіл за 5-tuple хешем</tspan></text>
<line x1="377.0" y1="155.0" x2="377.0" y2="185.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="279.5" y="187.5" width="195.0" height="65.0" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="377.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="377.0" dy="0.0">L4 Вузли (Katran / Maglev)</tspan><tspan x="377.0" dy="13.0">Консистентне хешування</tspan><tspan x="377.0" dy="13.0">Пакетна швидкість (Mpps)</tspan><tspan x="377.0" dy="13.0">Інкапсуляція (GRE / IPIP)</tspan></text>
<rect x="280.0" y="310.0" width="195.0" height="170.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="377.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="377.0" dy="0.0">Функції L4 Edge:</tspan><tspan x="377.0" dy="12.6">• Поглинання DDoS-атак</tspan><tspan x="377.0" dy="12.6">• Anycast-маршрутизація</tspan><tspan x="377.0" dy="12.6">• Захист від втрати сесій</tspan><tspan x="377.0" dy="12.6">  при падінні L7 вузлів</tspan><tspan x="377.0" dy="12.6">• Stateless або мін. стан</tspan></text>
<line x1="490.0" y1="220.0" x2="525.0" y2="220.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="535.0" y="55.0" width="225.0" height="440.0" rx="6" fill="#fffaf5" stroke="#d35400" stroke-width="1.2"/>
<text x="647.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">Рівень 2: L7 Пул (Proxies)</text>
<rect x="557.0" y="111.7" width="180.0" height="36.7" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="647.0" y="127.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="647.0" dy="0.0">L7 Proxy 1 (Envoy)</tspan><tspan x="647.0" dy="11.7">TLS, WAF, Routing</tspan></text>
<rect x="557.0" y="171.7" width="180.0" height="36.7" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="647.0" y="187.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="647.0" dy="0.0">L7 Proxy 2 (Envoy)</tspan><tspan x="647.0" dy="11.7">TLS, WAF, Routing</tspan></text>
<rect x="557.0" y="231.7" width="180.0" height="36.7" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="647.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="647.0" dy="0.0">L7 Proxy 3 (Envoy)</tspan><tspan x="647.0" dy="11.7">TLS, WAF, Routing</tspan></text>
<rect x="550.0" y="310.0" width="195.0" height="170.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="647.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="647.0" dy="0.0">Функції L7 Fleet:</tspan><tspan x="647.0" dy="12.6">• Термінація TLS/HTTPS</tspan><tspan x="647.0" dy="12.6">• Авторизація (JWT/mTLS)</tspan><tspan x="647.0" dy="12.6">• Path-based routing</tspan><tspan x="647.0" dy="12.6">• Retry, Circuit Breaking</tspan><tspan x="647.0" dy="12.6">• Автомасштабування (HPA)</tspan></text>
<line x1="760.0" y1="190.0" x2="795.0" y2="190.0" stroke="#d35400" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="805.0" y="55.0" width="175.0" height="440.0" rx="6" fill="#fcfdfe" stroke="#27ae60" stroke-width="1.2"/>
<text x="892.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Рівень 3: Сервіси</text>
<rect x="819.5" y="111.7" width="145.0" height="36.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="892.0" y="127.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="892.0" dy="0.0">Auth Service</tspan><tspan x="892.0" dy="11.7">(gRPC / HTTP)</tspan></text>
<rect x="819.5" y="181.7" width="145.0" height="36.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="892.0" y="197.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="892.0" dy="0.0">Order Service</tspan><tspan x="892.0" dy="11.7">(Бізнес-логіка)</tspan></text>
<rect x="819.5" y="251.7" width="145.0" height="36.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="892.0" y="267.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="892.0" dy="0.0">Payment Service</tspan><tspan x="892.0" dy="11.7">(Транзакції)</tspan></text>
<rect x="819.5" y="321.6" width="145.0" height="36.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="892.0" y="337.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="892.0" dy="0.0">Media Storage</tspan><tspan x="892.0" dy="11.7">(Статика)</tspan></text>
