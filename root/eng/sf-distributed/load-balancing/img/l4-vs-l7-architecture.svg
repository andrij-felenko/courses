<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектури балансування на 4-му (L4) та 7-му (L7) рівнях OSI</text>
<rect x="20.0" y="55.0" width="485.0" height="455.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="262.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">L4: Балансування транспортного рівня (TCP / UDP)</text>
<rect x="25.7" y="119.0" width="118.6" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="85.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="85.0" dy="0.0">Клієнт</tspan><tspan x="85.0" dy="13.0">(IP: 198.51.100.2)</tspan><tspan x="85.0" dy="13.0">SrcPort: 54321</tspan></text>
<line x1="145.0" y1="145.0" x2="175.0" y2="145.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="136.1" y="112.5" width="257.8" height="65.0" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">L4 Балансувальник (VIP)</tspan><tspan x="265.0" dy="13.0">Селекція за 5-tuple:</tspan><tspan x="265.0" dy="13.0">(SrcIP, SrcPort, DstIP, DstPort, Proto)</tspan><tspan x="265.0" dy="13.0">Без розшифрування TLS</tspan></text>
<line x1="355.0" y1="145.0" x2="385.0" y2="145.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="392.5" y="115.0" width="95.0" height="60.1" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="440.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Бекенд A</tspan><tspan x="440.0" dy="11.7">(IP: 10.0.1.10)</tspan><tspan x="440.0" dy="11.7">Термінація</tspan><tspan x="440.0" dy="11.7">TCP / TLS</tspan></text>
<rect x="35.0" y="215.0" width="455.0" height="275.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="262.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові властивості L4:</text>
<text x="262.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="262.0" dy="0.0">• Семантична сліпота: балансувальник не знає про HTTP, куки, URI чи заголовки.</tspan><tspan x="262.0" dy="15.0">• Маршрутизація з'єднань: усе TCP-з'єднання цілком закріплюється за одним бекендом.</tspan><tspan x="262.0" dy="15.0">• Продуктивність: мільйони пакетів за секунду (Mpps) при мінімальному CPU.</tspan><tspan x="262.0" dy="15.0">• Робота з пакетами: трансляція адрес (NAT) або пряма підміна MAC-адрес (DSR).</tspan><tspan x="262.0" dy="15.0">• Протокол TLS: наскрізне шифрування між клієнтом і бекендом (Pass-through).</tspan></text>
<rect x="535.0" y="55.0" width="485.0" height="455.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="777.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">L7: Балансування прикладного рівня (HTTP / gRPC / TLS)</text>
<rect x="542.5" y="119.0" width="105.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="595.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Клієнт</tspan><tspan x="595.0" dy="13.0">TCP Con 1</tspan><tspan x="595.0" dy="13.0">TLS Handshake</tspan></text>
<line x1="650.0" y1="145.0" x2="680.0" y2="145.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="680.2" y="112.5" width="189.6" height="65.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">L7 Проксі (Envoy/NGINX)</tspan><tspan x="775.0" dy="13.0">Термінація TLS + розбір HTTP</tspan><tspan x="775.0" dy="13.0">/api/orders -&gt; Бекенд A</tspan><tspan x="775.0" dy="13.0">/static/* -&gt; Бекенд B</tspan></text>
<line x1="867.0" y1="130.0" x2="895.0" y2="120.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="905.0" y="96.7" width="100.0" height="36.7" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="955.0" y="112.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">Бекенд A (/api)</tspan><tspan x="955.0" dy="11.7">TCP Con 2</tspan></text>
<line x1="867.0" y1="160.0" x2="895.0" y2="170.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="900.8" y="156.7" width="108.3" height="36.7" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="955.0" y="172.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">Бекенд B (Статика)</tspan><tspan x="955.0" dy="11.7">TCP Con 3</tspan></text>
<rect x="550.0" y="215.0" width="455.0" height="275.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="777.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові властивості L7:</text>
<text x="777.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="777.0" dy="0.0">• Семантична обізнаність: аналіз URI, методів, заголовків, Cookie, JWT-токенів.</tspan><tspan x="777.0" dy="15.0">• Два окремих TCP-стеки: з'єднання клієнт ⟷ проксі та проксі ⟷ бекенд.</tspan><tspan x="777.0" dy="15.0">• Розумна маршрутизація: розщеплення запитів з одного клієнтського TCP-потоку.</tspan><tspan x="777.0" dy="15.0">• Розширені можливості: повтор запитів (retries), канареечні релізи, кешування, gRPC.</tspan><tspan x="777.0" dy="15.0">• Витрати ресурсів: значне споживання пам'яті під буфери та CPU під TLS/парсинг.</tspan></text>
</svg>