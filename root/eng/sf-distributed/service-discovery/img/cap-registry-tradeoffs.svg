<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компроміс CAP у виявленні сервісів: CP-реєстри проти AP-реєстрів</text>
<rect x="40.0" y="55.0" width="420.0" height="380.0" rx="6" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<text x="250.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">CP-модель (Consul Raft, etcd, ZooKeeper)</text>
<rect x="83.9" y="117.0" width="332.2" height="26.0" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Пріоритет: Сувора узгодженість (Strong Consistency)</tspan></text>
<text x="250.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Механізм консенсусу (Raft / Paxos):</tspan><tspan x="250.0" dy="13.0">• Усі записи проходять через лідера кворуму</tspan><tspan x="250.0" dy="13.0">• Гарантія: немає розбіжностей у топології</tspan></text>
<rect x="60.0" y="240.0" width="380.0" height="100.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="250.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Поведінка під час мережевого розділення (Partition):</text>
<text x="250.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="250.0" dy="0.0">Вузли у меншості втрачають кворум.</tspan><tspan x="250.0" dy="13.0">Записи та оновлення статусів БЛОКУЮТЬСЯ.</tspan><tspan x="250.0" dy="13.0">Реєстр жертвує доступністю заради істини.</tspan></text>
<rect x="76.7" y="377.0" width="346.6" height="26.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="393.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Застосування: критичні сервіси, Service Mesh control plane</tspan></text>
<rect x="500.0" y="55.0" width="420.0" height="380.0" rx="6" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<text x="710.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">AP-модель (Eureka, DNS-SD, Gossip Serf)</text>
<rect x="543.9" y="117.0" width="332.2" height="26.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Пріоритет: Постійна доступність (High Availability)</tspan></text>
<text x="710.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Асинхронна реплікація (Peer-to-Peer / Gossip):</tspan><tspan x="710.0" dy="13.0">• Будь-який вузол приймає запис і читання</tspan><tspan x="710.0" dy="13.0">• Гарантія: миттєва відповідь навіть під час аварій</tspan></text>
<rect x="520.0" y="240.0" width="380.0" height="100.0" rx="4" fill="#f0fff4" stroke="#27ae60" stroke-width="1.0"/>
<text x="710.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Поведінка під час мережевого розділення (Partition):</text>
<text x="710.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="710.0" dy="0.0">Обидва боки продовжують обслуговувати трафік.</tspan><tspan x="710.0" dy="13.0">Допускаються застарілі або часткові дані (Stale Read).</tspan><tspan x="710.0" dy="13.0">Краще надіслати запит до мертвого вузла й спробувати знову,</tspan><tspan x="710.0" dy="13.0">ніж повністю зупинити маршрутизацію.</tspan></text>
<rect x="522.5" y="377.0" width="375.1" height="26.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="710.0" y="393.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Застосування: високонавантажений роутинг, мікросервісні виклики</tspan></text>
</svg>