<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл інстанса в реєстрі: Оренда (Lease), Пульс (Heartbeat) та Евікція</text>
<rect x="40.0" y="65.0" width="260.0" height="160.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="170.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Реєстрація (Register)</text>
<text x="170.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Інстанс відправляє дескриптор:</tspan><tspan x="170.0" dy="13.0">• IP-адреса та TCP-порт</tspan><tspan x="170.0" dy="13.0">• Теги (v1.2, canary, dc-west)</tspan><tspan x="170.0" dy="13.0">• Час оренди: TTL = 10 с</tspan></text>
<rect x="85.0" y="182.0" width="170.0" height="26.0" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Статус: STARTING / HEALTHY</tspan></text>
<rect x="350.0" y="65.0" width="260.0" height="160.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="480.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Пульс (Heartbeat Loop)</text>
<text x="480.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Періодичне оновлення оренди:</tspan><tspan x="480.0" dy="13.0">• Інтервал T = TTL / 3 (кожні 3.3 с)</tspan><tspan x="480.0" dy="13.0">• HTTP PUT /v1/agent/check/pass</tspan><tspan x="480.0" dy="13.0">• Скидання таймера евікції</tspan></text>
<rect x="392.2" y="182.0" width="175.6" height="26.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Статус: PASSING (в роутингу)</tspan></text>
<rect x="660.0" y="65.0" width="260.0" height="160.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="790.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. Збій та Евікція (Eviction)</text>
<text x="790.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Пропуск пульсу або збій чека:</tspan><tspan x="790.0" dy="13.0">• Таймер TTL сплив (10 с без пульсу)</tspan><tspan x="790.0" dy="13.0">• Реєстр маркує вузол CRITICAL</tspan><tspan x="790.0" dy="13.0">• Видалення зі списку маршрутизації</tspan></text>
<rect x="693.6" y="182.0" width="192.7" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Статус: CRITICAL / DEREGISTERED</tspan></text>
<line x1="300.0" y1="145.0" x2="345.0" y2="145.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="610.0" y1="145.0" x2="655.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="260.0" width="880.0" height="175.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="480.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синхронізація локальних кешів клієнтів (Watch / Streaming Push)</text>
<rect x="75.9" y="335.5" width="208.2" height="39.0" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Реєстр сервісів</tspan><tspan x="180.0" dy="13.0">[Подія: Зміна індексу версії X]</tspan></text>
<rect x="397.9" y="329.0" width="204.1" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Блокуючий запит / gRPC Watch</tspan><tspan x="500.0" dy="13.0">Long Polling: чекає зміни індексу</tspan><tspan x="500.0" dy="13.0">Або HTTP/2 SSE / xDS Delta</tspan></text>
<rect x="720.0" y="329.0" width="160.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Клієнтський SDK</tspan><tspan x="800.0" dy="13.0">Атомарне оновлення кешу</tspan><tspan x="800.0" dy="13.0">(Atomic Pointer Swap)</tspan></text>
<line x1="275.0" y1="355.0" x2="390.0" y2="355.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="605.0" y1="355.0" x2="715.0" y2="355.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>