<text x="910.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Вартість простою / Втрата доступності →</text>
<text x="105.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Ризик порушення безпеки та фінансових втрат →</text>
<text x="325.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">СУВОРИЙ FAIL-CLOSED</text>
<text x="325.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повна зупинка при збої валідатора</text>
<rect x="150.0" y="140.0" width="350.0" height="95.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="165.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Фінансові транзакції та кліринг (double-spend)</text>
<text x="165.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Криптографічні підписи та валідація mTLS</text>
<text x="165.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Регуляторний аудит-лог (не можна втратити)</text>
<text x="165.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Дозування в медичних та промислових АСУТП</text>
<text x="735.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">ГІБРИД / АДАПТИВНИЙ / ЕСКРОУ</text>
<text x="735.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Fail-Open з обмеженням ризику (ліміти, скоринг)</text>
