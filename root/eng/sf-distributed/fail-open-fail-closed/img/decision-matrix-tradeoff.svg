<text x="575.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Офлайн-авторизація дрібних оплат (транспорт, літаки)</text>
<text x="575.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• WAF: пропуск перевірених сесій при перевантаженні</text>
<text x="575.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Токенізація з кешуванням відкликаних ключів</text>
<text x="575.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="start">• Білінговий овердрафт із кредитним лімітом</text>
<text x="325.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">СТАНДАРТНИЙ FAIL-CLOSED</text>
<text x="325.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Просте відхилення (не критично для виручки)</text>
<rect x="150.0" y="335.0" width="350.0" height="95.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="165.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Адміністративні панелі та бек-офіс</text>
<text x="165.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Нічні пакетні генератори звітів</text>
<text x="165.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Допоміжні синхронізатори внутрішніх схем</text>
<text x="165.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Деплой та конфігураційні пайплайни</text>
<text x="735.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ЧИСТИЙ FAIL-OPEN</text>
<text x="735.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Максимальна доступність, фонове відновлення</text>
<rect x="560.0" y="335.0" width="350.0" height="95.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="575.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Збір розподілених метрик і трейсів (OpenTelemetry)</text>
<text x="575.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Рекомендаційні блоки та персоналізація</text>
<text x="575.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пошукові підказки (autocomplete)</text>
<text x="575.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">• Кеш рекламних банерів та публічний контент</text>
