<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модульне розгортання 32-бітного лічильника у монотонну 64-бітну шкалу</text>
<circle cx="220.0" cy="225.0" r="110.0" fill="#f8fafc" stroke="#333333" stroke-width="2.0"/>
<text x="220.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">0 / 2³²</text>
<text x="354.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2³¹ - 1</text>
<text x="220.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2³¹</text>
<text x="86.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">3 · 2³⁰</text>
<circle cx="180.0" cy="123.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="170.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">t_prev (0xFFFFF800)</text>
<circle cx="265.0" cy="125.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="275.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">t_curr (0x00000800)</text>
<line x1="180.0" y1="123.0" x2="265.0" y2="125.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="153.0" y="199.3" width="134.1" height="61.4" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="219.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Перехід через 0</tspan><tspan x="220.0" dy="15.0">t_curr &lt; t_prev,</tspan><tspan x="220.0" dy="15.0">але Δt &gt; 0</tspan></text>
<rect x="450.0" y="80.0" width="350.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="104.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Формула знакової різниці в доповняльному коді:</tspan></text>
<rect x="450.0" y="135.0" width="350.0" height="180.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">int32_t delta = (int32_t)(t_curr - t_prev);</tspan><tspan x="625.0" dy="15.0">// 0x00000800 - 0xFFFFF800 = 0x00001000 (+4096)</tspan><tspan x="625.0" dy="15.0"></tspan><tspan x="625.0" dy="15.0">int64_t unwrapped_t += (int64_t)delta;</tspan><tspan x="625.0" dy="15.0"></tspan><tspan x="625.0" dy="15.0">Умова однозначності (теорема дискретизації):</tspan><tspan x="625.0" dy="15.0">|справжня зміна часу| &lt; 2³¹ тактів</tspan><tspan x="625.0" dy="15.0">• delta &gt; 0: звичайний хід часу вперед</tspan><tspan x="625.0" dy="15.0">• delta &lt; 0: перевпорядкування пакетів у мережі</tspan></text>
<rect x="450.0" y="330.0" width="350.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Гарантія: 64-бітна шкала лишається суворо монотонною</tspan><tspan x="625.0" dy="12.3">і захищеною від збоїв при переповненні лічильника.</tspan></text>
</svg>