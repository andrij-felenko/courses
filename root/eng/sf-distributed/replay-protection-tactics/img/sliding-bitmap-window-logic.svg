<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1120.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">МЕХАНІКА КОВЗНОГО БІТМАПА: Перевірка порядкових номерів у вікні W за O(1)</tspan></text>
<rect x="50.0" y="80.0" width="1100.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">СТРУКТУРА СТАНУ ФІЛЬТРА: Максимальний номер Seq_max = 100, Розмір вікна W = 64 біти</tspan></text>
<line x1="60.0" y1="160.0" x2="1140.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1150.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Seq No</text>
<rect x="80.0" y="135.0" width="300.0" height="50.0" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
<text x="230.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">ЗОНА 1: Застарілі (s &lt;= 36) [REJECT]</text>
<rect x="390.0" y="130.0" width="470.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.5"/>
<text x="625.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЗОНА 2: Активне вікно W=64 біти (Seq ∈ [37 .. 100])</text>
<rect x="870.0" y="135.0" width="250.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="995.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ЗОНА 3: Нові (s &gt; 100) [ADVANCE]</text>
<line x1="390.0" y1="120.0" x2="390.0" y2="205.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="390.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Seq_max - W (36)</text>
<line x1="860.0" y1="120.0" x2="860.0" y2="205.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="860.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Seq_max = 100</text>
<rect x="50.0" y="250.0" width="350.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="225.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">ВИПАДОК 1: s &lt;= Seq_max - W (s = 30)</tspan></text>
<rect x="50.0" y="298.0" width="350.0" height="175.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="225.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">УМОВА: Номер випав за ліву межу вікна.</tspan><tspan x="225.0" dy="14.3"></tspan><tspan x="225.0" dy="14.3">ПЕРЕВІРКА:</tspan><tspan x="225.0" dy="14.3">• Пакет занадто старий.</tspan><tspan x="225.0" dy="14.3">• Інформація про нього вже витіснена.</tspan><tspan x="225.0" dy="14.3"></tspan><tspan x="225.0" dy="14.3">ДІЯ:</tspan><tspan x="225.0" dy="14.3">→ Негайне відхилення (DROP).</tspan><tspan x="225.0" dy="14.3">→ Бітмап НЕ змінюється.</tspan><tspan x="225.0" dy="14.3">→ Лічильник drop_stale++.</tspan></text>
<rect x="425.0" y="250.0" width="350.0" height="42.0" rx="6" fill="#fff8e1" stroke="#333333" stroke-width="1.8"/><text x="600.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ВИПАДОК 2: Seq_max - W &lt; s &lt;= Seq_max (s = 85)</tspan></text>
<rect x="425.0" y="298.0" width="350.0" height="175.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="600.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">УМОВА: Номер усередині активного вікна.</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">БІТОВА ПЕРЕВІРКА:</tspan><tspan x="600.0" dy="14.3">• diff = Seq_max - s = 100 - 85 = 15.</tspan><tspan x="600.0" dy="14.3">• bit = (bitmap &gt;&gt; diff) &amp; 1ULL.</tspan><tspan x="600.0" dy="14.3"></tspan><tspan x="600.0" dy="14.3">ДІЯ:</tspan><tspan x="600.0" dy="14.3">→ Якщо bit == 1: ДУБЛІКАТ (DROP).</tspan><tspan x="600.0" dy="14.3">→ Якщо bit == 0: ПРИЙНЯТИ.</tspan><tspan x="600.0" dy="14.3">→ bitmap |= (1ULL &lt;&lt; diff).</tspan></text>
<rect x="800.0" y="250.0" width="350.0" height="42.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="975.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">ВИПАДОК 3: s &gt; Seq_max (s = 105)</tspan></text>
<rect x="800.0" y="298.0" width="350.0" height="175.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="975.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">УМОВА: Новий максимальний номер.</tspan><tspan x="975.0" dy="14.3"></tspan><tspan x="975.0" dy="14.3">ЗСУВ ВІКНА:</tspan><tspan x="975.0" dy="14.3">• shift = s - Seq_max = 105 - 100 = 5.</tspan><tspan x="975.0" dy="14.3">• bitmap = (bitmap &lt;&lt; shift) | 1ULL.</tspan><tspan x="975.0" dy="14.3">• Seq_max = s = 105.</tspan><tspan x="975.0" dy="14.3"></tspan><tspan x="975.0" dy="14.3">ДІЯ:</tspan><tspan x="975.0" dy="14.3">→ Пакет приймається (ACCEPT).</tspan><tspan x="975.0" dy="14.3">→ Старі 5 бітів зліва витісняються.</tspan></text>
<rect x="50.0" y="495.0" width="1100.0" height="175.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="556.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ПЕРЕВАГИ СТРУКТУРИ КОВЗНОГО БІТМАПА (IPsec RFC 4303 / RFC 6479, QUIC):</tspan><tspan x="600.0" dy="15.0">1. Пам'ять O(1): Фіксований розмір стану (лише 8 байтів для W=64 або 128 байтів для W=1024).</tspan><tspan x="600.0" dy="15.0">2. Швидкість O(1): Перевірка та встановлення прапорця за 2–3 такти процесора (бітові зсуви &lt;&lt;, &gt;&gt; та маски &amp;).</tspan><tspan x="600.0" dy="15.0">3. Стійкість до перевпорядкування (Out-of-Order): Пакети, затримані мережею на відстань &lt; W, успішно приймаються.</tspan><tspan x="600.0" dy="15.0">4. Без блокувань (Lock-Free): У багатопотоковому середовищі реалізується через atomic compare-and-swap (CAS).</tspan></text>
</svg>