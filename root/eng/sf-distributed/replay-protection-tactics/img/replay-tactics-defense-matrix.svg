<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1120.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">БАГАТОРІВНЕВА СИСТЕМА ТАКТИК ЗАХИСТУ ВІД ПЕРЕГРАВАННЯ В АРХІТЕКТУРІ</tspan></text>
<rect x="45.0" y="80.0" width="1110.0" height="32.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="600.0" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">РІВЕНЬ 1: МЕРЕЖА ТА ТРАНСПОРТ (Wire &amp; Transport)</tspan></text>
<rect x="45.0" y="114.0" width="450.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="270.0" y="145.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">ІНСТРУМЕНТИ:</tspan><tspan x="270.0" dy="11.7">Ковзні бітмапи (Sliding Bitmaps, IPsec / QUIC), криптографічні Nonce, монотонні лічильники пакетів</tspan></text>
<rect x="500.0" y="114.0" width="655.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="827.5" y="145.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="827.5" dy="0.0">ПРИЗНАЧЕННЯ ТА ЕФЕКТ:</tspan><tspan x="827.5" dy="11.7">Відсікання мережевого шторму дублікатів та MitM-атак на рівні ядра / sidecar за лічені наносекунди (O(1) пам'ять).</tspan></text>
<rect x="45.0" y="194.0" width="1110.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="600.0" y="214.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">РІВЕНЬ 2: ПРИКОРДОННИЙ ШЛЮЗ (API Gateway / Ingress)</tspan></text>
<rect x="45.0" y="228.0" width="450.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="270.0" y="259.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">ІНСТРУМЕНТИ:</tspan><tspan x="270.0" dy="11.7">Часові мітки (Timestamps) + TTL-вікно (напр. ±300 с) + розподілений кеш Nonce (Redis / Memory)</tspan></text>
<rect x="500.0" y="228.0" width="655.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="827.5" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="827.5" dy="0.0">ПРИЗНАЧЕННЯ ТА ЕФЕКТ:</tspan><tspan x="827.5" dy="13.0">Захист публічних HTTP/gRPC API. Відсікає 99.9% застарілих та повторних запитів до передачі у внутрішню мережу.</tspan></text>
<rect x="45.0" y="308.0" width="1110.0" height="32.0" rx="6" fill="#fff8e1" stroke="#333333" stroke-width="1.8"/><text x="600.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">РІВЕНЬ 3: ШЛЮЗ ЗАСТОСУНКУ (Idempotency Key Interceptor)</tspan></text>
<rect x="45.0" y="342.0" width="450.0" height="68.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="270.0" y="373.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">ІНСТРУМЕНТИ:</tspan><tspan x="270.0" dy="11.7">Заголовки Idempotency-Key (UUIDv7) + збереження результату первинної відповіді в кеші / БД</tspan></text>
<rect x="500.0" y="342.0" width="655.0" height="68.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="827.5" y="373.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="827.5" dy="0.0">ПРИЗНАЧЕННЯ ТА ЕФЕКТ:</tspan><tspan x="827.5" dy="11.7">Гарантія того, що клієнт при retry отримає точний збережений результат першого виклику без повторного виконання бізнес-логіки.</tspan></text>
<rect x="45.0" y="422.0" width="1110.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="600.0" y="442.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">РІВЕНЬ 4: РОЗПОДІЛЕНА КООРДИНАЦІЯ (Distributed Coordination)</tspan></text>
<rect x="45.0" y="456.0" width="450.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="270.0" y="487.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">ІНСТРУМЕНТИ:</tspan><tspan x="270.0" dy="11.7">Токени огорожі (Fencing Tokens), монотонні номери епох (Epoch Numbers, Raft / Paxos)</tspan></text>
<rect x="500.0" y="456.0" width="655.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="827.5" y="487.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="827.5" dy="0.0">ПРИЗНАЧЕННЯ ТА ЕФЕКТ:</tspan><tspan x="827.5" dy="13.0">Захист від зомбі-лідерів після спліт-брейну або тривалих пауз процесу під час запису в спільні ресурси.</tspan></text>
<rect x="45.0" y="536.0" width="1110.0" height="32.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="600.0" y="556.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">РІВЕНЬ 5: ДОМЕННЕ ЯДРО ТА БАЗА ДАНИХ (Domain Core &amp; Storage)</tspan></text>
<rect x="45.0" y="570.0" width="450.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="270.0" y="601.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">ІНСТРУМЕНТИ:</tspan><tspan x="270.0" dy="11.7">Transactional Inbox Table, оптимістичне блокування (OCC / version), монотонні FSM-автомати</tspan></text>
<rect x="500.0" y="570.0" width="655.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="827.5" y="601.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="827.5" dy="0.0">ПРИЗНАЧЕННЯ ТА ЕФЕКТ:</tspan><tspan x="827.5" dy="11.7">Остаточний рубеж оборони: перевірка версії агрегату (WHERE version = expected) унеможливлює повторну мутацію стану.</tspan></text>
<rect x="45.0" y="655.0" width="1110.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="675.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ПРАВИЛО ГЛИБОКОГО ЗАХИСТУ: Жоден окремий рівень не дає 100% гарантії. Стійкість виникає лише з комбінації тактик.</tspan></text>
</svg>