<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="1120.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ТОКЕНИ ОГОРОЖІ (FENCING TOKENS): Захист від запізнілого перегравання команд зомбі-лідером</tspan></text>
<rect x="45.0" y="80.0" width="240.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="165.0" y="98.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">КЛІЄНТ 1 (Лідер А)</tspan><tspan x="165.0" dy="15.6">[Зомбі через GC pause]</tspan></text>
<rect x="335.0" y="80.0" width="240.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="455.0" y="98.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">СЕРВЕР БЛОКУВАНЬ</tspan><tspan x="455.0" dy="15.6">(Zookeeper / Raft / etcd)</tspan></text>
<rect x="625.0" y="80.0" width="240.0" height="45.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="745.0" y="98.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">КЛІЄНТ 2 (Лідер Б)</tspan><tspan x="745.0" dy="15.6">[Новий легітимний лідер]</tspan></text>
<rect x="915.0" y="80.0" width="240.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="1035.0" y="98.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1035.0" dy="0.0">СПІЛЬНЕ СХОВИЩЕ (БД)</tspan><tspan x="1035.0" dy="15.6">[Огорожа: max_token = 34]</tspan></text>
<line x1="165.0" y1="130.0" x2="165.0" y2="520.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="455.0" y1="130.0" x2="455.0" y2="520.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="745.0" y1="130.0" x2="745.0" y2="520.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="1035.0" y1="130.0" x2="1035.0" y2="520.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="165.0" y1="150.0" x2="455.0" y2="150.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="310.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. AcquireLock()</text>
<line x1="455.0" y1="175.0" x2="165.0" y2="175.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="310.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. Granted (Fencing Token = 33)</text>
<rect x="145.0" y="195.0" width="40.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="165.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">GC PAUSE</text>
<text x="250.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Клієнт 1 завис на 15 секунд;
Оренда блокування спливає!</text>
<line x1="745.0" y1="285.0" x2="455.0" y2="285.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. AcquireLock()</text>
<line x1="455.0" y1="310.0" x2="745.0" y2="310.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">4. Granted (Fencing Token = 34)</text>
<line x1="745.0" y1="345.0" x2="1035.0" y2="345.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="890.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5. Write(data, token=34)</text>
<rect x="935.0" y="360.0" width="200.0" height="45.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1035.0" y="379.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1035.0" dy="0.0">Сховище: 34 &gt; 0</tspan><tspan x="1035.0" dy="13.7">Запис OK! max_token = 34</tspan></text>
<line x1="165.0" y1="435.0" x2="1035.0" y2="435.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="600.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">6. Запізнілий запис Клієнта 1: Write(stale_data, token=33) [ЗОМБІ-ПЕРЕГРАВАННЯ]</text>
<rect x="935.0" y="450.0" width="200.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1035.0" y="464.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1035.0" dy="0.0">Сховище: 33 &lt; 34!</tspan><tspan x="1035.0" dy="13.7">ВІДХИЛЕНО: Fencing Error!</tspan></text>
<line x1="1035.0" y1="510.0" x2="165.0" y2="510.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">7. Error 409 Conflict: Stale Fencing Token</text>
<rect x="45.0" y="545.0" width="1110.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="591.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ЧОМУ РОЗПОДІЛЕНИЙ ЗАМОК БЕЗ ТОКЕНА ОГОРОЖІ Є ІЛЮЗІЄЮ БЕЗПЕКИ:</tspan><tspan x="600.0" dy="15.0">Жоден клієнт не може знати, чи володіє він замком у момент здійснення запису в базу даних (GC-паузи, свопінг, мережеві затримки).</tspan><tspan x="600.0" dy="15.0">Тому кінцеве сховище ЗОБОВ'ЯЗАНЕ саме виступати бар'єром огорожі, приймаючи тільки монотонно зростаючі номери епох (Epochs / Fencing Tokens).</tspan><tspan x="600.0" dy="15.0">Будь-який запит із токеном token &lt;= max_seen_token відкидається як запізніле перегравання.</tspan></text>
</svg>