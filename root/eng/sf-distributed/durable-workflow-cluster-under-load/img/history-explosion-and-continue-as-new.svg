<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="425.0" height="430.0" rx="8" fill="#fff8f7" stroke="#e0b4b0" stroke-width="1.5"/><text x="232.5" y="234.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0"></tspan></text>
<text x="232.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Вибух історії подій (Unbounded History)</text>
<rect x="82.0" y="64.3" width="300.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="232.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="232.0" dy="0.0">Тривалий цикл / Сутність без відсікання</tspan><tspan x="232.0" dy="14.3">(10 000+ подій у межах одного запуску)</tspan></text>
<line x1="232.0" y1="115.0" x2="232.0" y2="145.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="82.0" y="158.1" width="300.0" height="53.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="232.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="232.0" dy="0.0">Квадратична вартість Replay O(N²):</tspan><tspan x="232.0" dy="13.7">На кожну подію воркер вичитує всі минулі кроки,</tspan><tspan x="232.0" dy="13.7">перепарсує мегабайти JSON та проганяє CPU-цикл</tspan></text>
<line x1="232.0" y1="230.0" x2="232.0" y2="260.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35.0" y="270.0" width="395.0" height="160.0" rx="6" fill="#ffffff" stroke="#e0b4b0" stroke-width="1.2"/><text x="232.5" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">Руйнівні наслідки для кластера:</tspan><tspan x="232.5" dy="13.7">• Гігабайти пам'яті воркерів під кеш історії -&gt; OOM</tspan><tspan x="232.5" dy="13.7">• Затримка обробки сигналу зростає з 2 мс до секунд</tspan><tspan x="232.5" dy="13.7">• Трафік між сховищем та воркерами забиває мережу</tspan><tspan x="232.5" dy="13.7">• Ризик перевищення ліміту розміру одного запису БД</tspan></text>
<rect x="475.0" y="15.0" width="425.0" height="430.0" rx="8" fill="#f4faf6" stroke="#a3d9b8" stroke-width="1.5"/><text x="687.5" y="234.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="687.5" dy="0.0"></tspan></text>
<text x="687.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Атомарне відсікання: Continue-As-New</text>
<rect x="537.0" y="64.3" width="300.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="687.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="687.0" dy="0.0">Запуск 1 (Ітерація 1..N)</tspan><tspan x="687.0" dy="14.3">Накопичення компактного знімка стану</tspan></text>
<line x1="687.0" y1="115.0" x2="687.0" y2="145.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="537.0" y="158.1" width="300.0" height="53.8" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="687.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="687.0" dy="0.0">Атомарний перехід Continue-As-New:</tspan><tspan x="687.0" dy="13.7">Завершення поточного запуску + старт нового</tspan><tspan x="687.0" dy="13.7">з чистим журналом подій та збереженим станом</tspan></text>
<line x1="687.0" y1="230.0" x2="687.0" y2="260.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="490.0" y="270.0" width="395.0" height="160.0" rx="6" fill="#ffffff" stroke="#a3d9b8" stroke-width="1.2"/><text x="687.5" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="687.5" dy="0.0">Переваги на масштабі:</tspan><tspan x="687.5" dy="13.7">• Лінійна вартість обчислень O(N) та стабільна пам'ять</tspan><tspan x="687.5" dy="13.7">• Час відтворення лишається фіксованим (&lt; 5 мс)</tspan><tspan x="687.5" dy="13.7">• Збереження єдиного WorkflowID для зовнішніх систем</tspan><tspan x="687.5" dy="13.7">• Архівування старого журналу в дешеве сховище</tspan></text>
</svg>