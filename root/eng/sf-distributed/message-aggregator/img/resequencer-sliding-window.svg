<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 954.21 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="954.21" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ресеквенсер повідомлень: буферизація, усунення прогалин та відновлення порядку</text>
<rect x="15.0" y="55.0" width="910.0" height="90.0" rx="8" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/>
<text x="470.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхідний потік через ненадійну мережу (Out-of-Order Delivery)</text>
<rect x="40.0" y="90.0" width="80.0" height="40.0" rx="4" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="80.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Seq #1</text>
<rect x="140.0" y="90.0" width="80.0" height="40.0" rx="4" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="180.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Seq #2</text>
<rect x="240.0" y="90.0" width="80.0" height="40.0" rx="4" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/>
<text x="280.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Seq #4</text>
<rect x="340.0" y="90.0" width="80.0" height="40.0" rx="4" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/>
<text x="380.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Seq #5</text>
<rect x="440.0" y="90.0" width="90.0" height="40.0" rx="4" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.8"/>
<text x="485.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Seq #3 (Затримка)</text>
<rect x="550.0" y="90.0" width="80.0" height="40.0" rx="4" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/>
<text x="590.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Seq #7</text>
<rect x="650.0" y="90.0" width="80.0" height="40.0" rx="4" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/>
<text x="690.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Seq #6</text>
<text x="810.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Порядок прибуття:
1 -&gt; 2 -&gt; 4 -&gt; 5 -&gt; 3...</text>
<line x1="470.0" y1="150.0" x2="470.0" y2="185.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="15.0" y="190.0" width="910.0" height="140.0" rx="8" fill="#f8f9fa" stroke="#27ae60" stroke-width="1.5"/>
<text x="470.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Стан внутрішнього буфера ресеквенсера (Next Expected Sequence = 3)</text>
<rect x="90.0" y="225.6" width="200.0" height="78.9" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Випущено в потік:</tspan><tspan x="190.0" dy="12.3">Seq #1, Seq #2 (OK)</tspan><tspan x="190.0" dy="12.3"></tspan><tspan x="190.0" dy="12.3">Поточний покажчик:</tspan><tspan x="190.0" dy="12.3">next_seq = 3</tspan></text>
<rect x="320.0" y="225.6" width="300.0" height="78.9" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="1.5"/><text x="470.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Буфер очікування (PriorityQueue / Map):</tspan><tspan x="470.0" dy="12.3">• Затримано: {4, 5}</tspan><tspan x="470.0" dy="12.3">• Прогалина (Gap): очікується #3!</tspan><tspan x="470.0" dy="12.3">• Gap Timeout: 250 ms до примусового пропуску</tspan><tspan x="470.0" dy="12.3">Прибуття #3 запускає каскадну емісію: [3, 4, 5]</tspan></text>
<rect x="640.9" y="231.7" width="258.3" height="66.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Політика прогалин (Gaps):</tspan><tspan x="770.0" dy="12.3">1. Strict: чекати до упору</tspan><tspan x="770.0" dy="12.3">2. Timeout: пропустити #3, залогувати втрату</tspan><tspan x="770.0" dy="12.3">3. NACK: запит на повтор відправнику</tspan></text>
<line x1="470.0" y1="335.0" x2="470.0" y2="370.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="15.0" y="375.0" width="910.0" height="70.0" rx="8" fill="#f8f9fa" stroke="#27ae60" stroke-width="1.2"/>
<text x="140.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Вихідний монотонний потік:</text>
<rect x="260.0" y="390.0" width="80.0" height="40.0" rx="4" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="300.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Seq #1</text>
<rect x="360.0" y="390.0" width="80.0" height="40.0" rx="4" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="400.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Seq #2</text>
<rect x="460.0" y="390.0" width="80.0" height="40.0" rx="4" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="500.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Seq #3</text>
<rect x="560.0" y="390.0" width="80.0" height="40.0" rx="4" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="600.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Seq #4</text>
<rect x="660.0" y="390.0" width="80.0" height="40.0" rx="4" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="700.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Seq #5</text>
<text x="820.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Ідеальна послідовність
(Strict Monotonic Order)</text>
</svg>