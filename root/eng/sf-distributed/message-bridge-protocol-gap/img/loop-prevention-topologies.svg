<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запобігання зацикленню повідомлень у двонаправлених мостах</text>
<rect x="10.0" y="10.0" width="980.0" height="440.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запобігання зацикленню повідомлень у двонаправлених мостах</text>
<rect x="30.0" y="65.0" width="940.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="500.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпека луни: нескінченний пінг-понг між шинами без контролю походження</text>
<rect x="100.0" y="127.3" width="120.0" height="35.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Шина А</tspan><tspan x="160.0" dy="14.3">(Франкфурт)</tspan></text>
<rect x="445.0" y="99.5" width="110.0" height="31.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Міст А → Б</tspan><tspan x="500.0" dy="13.0">(Forward A)</tspan></text>
<rect x="445.0" y="159.5" width="110.0" height="31.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Міст Б → А</tspan><tspan x="500.0" dy="13.0">(Forward B)</tspan></text>
<rect x="780.0" y="127.3" width="120.0" height="35.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Шина Б</tspan><tspan x="840.0" dy="14.3">(Вірджинія)</tspan></text>
<line x1="225.0" y1="130.0" x2="440.0" y2="115.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560.0" y1="115.0" x2="775.0" y2="130.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="775.0" y1="160.0" x2="560.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440.0" y1="175.0" x2="225.0" y2="160.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Повідомлення M реплікується в Б → Б повертає M в А → лавиноподібний шторм повідомлень</text>
<rect x="35.0" y="245.0" width="290.0" height="180.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.2"/>
<text x="180.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Заголовки трасування</text>
<text x="180.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">(Trace &amp; Hop Limit)</text>
<text x="180.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Додавання X-Forwarded-By: [A, B].</text>
<text x="180.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Якщо ідентифікатор поточної шини</text>
<text x="180.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">вже є в списку — скидання (Drop).</text>
<text x="180.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Ліміт стрибків max_hops ≤ 3.</text>
<rect x="355.0" y="245.0" width="290.0" height="180.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.2"/>
<text x="500.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. Розділення просторів</text>
<text x="500.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">(Split Namespaces)</text>
<text x="500.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Шина А публікує в local.orders.</text>
<text x="500.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Міст пересилає в remote.a.orders.</text>
<text x="500.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Міст Б слухає виключно local.*,</text>
<text x="500.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">ігноруючи репліковані теми remote.*.</text>
<rect x="675.0" y="245.0" width="290.0" height="180.0" rx="6" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.2"/>
<text x="820.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">3. Вікно дедуплікації</text>
<text x="820.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">(Deduplication Cache)</text>
<text x="820.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Збереження message_id у ковзному</text>
<text x="820.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">фільтрі Блума або LRU-кеші.</text>
<text x="820.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Повторне надходження дубліката</text>
<text x="820.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">відсікається до публікації в шину.</text>
</svg>