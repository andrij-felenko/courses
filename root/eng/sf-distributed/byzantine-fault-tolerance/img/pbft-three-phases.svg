<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1000 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1000" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фази протоколу PBFT</text>
<rect x="0.0" y="0.0" width="980.0" height="460.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трифазний протокол узгодження PBFT (Castro &amp; Liskov, 1999)</text>
<rect x="25.0" y="55.0" width="220.0" height="380.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="25.0" y="55.0" width="220.0" height="32.0" rx="8" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="135.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1. Pre-Prepare</text>
<rect x="33.0" y="97.0" width="204.0" height="175.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="135.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Первинний вузол (Primary)</tspan><tspan x="135.0" dy="13.0">отримує запит клієнта m,</tspan><tspan x="135.0" dy="13.0">присвоює номер послідовності n,</tspan><tspan x="135.0" dy="13.0">вид v та транслює повідомлення</tspan><tspan x="135.0" dy="13.0">&lt;PRE-PREPARE, v, n, d&gt;.</tspan></text>
<rect x="33.0" y="285.0" width="204.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/><text x="135.0" y="342.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Ціль:</tspan><tspan x="135.0" dy="14.3">Однозначно задати чергу</tspan><tspan x="135.0" dy="14.3">запитів у поточному виді.</tspan></text>
<rect x="260.0" y="55.0" width="225.0" height="380.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="260.0" y="55.0" width="225.0" height="32.0" rx="8" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="372.5" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2. Prepare</text>
<rect x="268.0" y="97.0" width="209.0" height="175.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="372.5" y="159.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="372.5" dy="0.0">Репліки перевіряють підпис</tspan><tspan x="372.5" dy="14.3">та геш d і транслюють</tspan><tspan x="372.5" dy="14.3">&lt;PREPARE, v, n, d, i&gt;.</tspan><tspan x="372.5" dy="14.3">Вузол чекає 2f підтверджень</tspan><tspan x="372.5" dy="14.3">від різних реплік.</tspan></text>
<rect x="268.0" y="285.0" width="209.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/><text x="372.5" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="372.5" dy="0.0">Результат:</tspan><tspan x="372.5" dy="13.0">Prepared Certificate.</tspan><tspan x="372.5" dy="13.0">Порядок зафіксовано у виді v.</tspan></text>
<rect x="500.0" y="55.0" width="225.0" height="380.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="500.0" y="55.0" width="225.0" height="32.0" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="612.5" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3. Commit</text>
<rect x="508.0" y="97.0" width="209.0" height="175.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="612.5" y="159.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="612.5" dy="0.0">Після збору сертифіката</tspan><tspan x="612.5" dy="14.3">репліка транслює</tspan><tspan x="612.5" dy="14.3">&lt;COMMIT, v, n, d, i&gt;.</tspan><tspan x="612.5" dy="14.3">Вузол чекає 2f + 1 повідомлень</tspan><tspan x="612.5" dy="14.3">Commit від різних учасників.</tspan></text>
<rect x="508.0" y="285.0" width="209.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/><text x="612.5" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="612.5" dy="0.0">Результат:</tspan><tspan x="612.5" dy="13.0">Committed-Local стан.</tspan><tspan x="612.5" dy="13.0">Запит виконується в автоматі.</tspan></text>
<rect x="740.0" y="55.0" width="215.0" height="380.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="740.0" y="55.0" width="215.0" height="32.0" rx="8" fill="#e5e7eb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="847.5" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Відповідь (Reply)</text>
<rect x="748.0" y="97.0" width="199.0" height="175.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="847.5" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="847.5" dy="0.0">Кожна репліка надсилає</tspan><tspan x="847.5" dy="14.3">результат виконання клієнту:</tspan><tspan x="847.5" dy="14.3">&lt;REPLY, v, t, c, i, r&gt;.</tspan></text>
<rect x="748.0" y="285.0" width="199.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/><text x="847.5" y="342.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="847.5" dy="0.0">Клієнт чекає:</tspan><tspan x="847.5" dy="14.3">f + 1 однакових відповідей</tspan><tspan x="847.5" dy="14.3">для фіксації успіху.</tspan></text>
</svg>