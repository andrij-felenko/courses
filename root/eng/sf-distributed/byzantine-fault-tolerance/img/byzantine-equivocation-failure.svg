<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння моделей CFT та BFT при дворушництві лідера</text>
<rect x="0.0" y="0.0" width="960.0" height="430.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Провал моделі аварійних зупинок (CFT) проти візантійського захисту (BFT)</text>
<rect x="30.0" y="50.0" width="435.0" height="360.0" rx="8" fill="#fdfbfb" stroke="#e8c4c4" stroke-width="1.5"/>
<rect x="30.0" y="50.0" width="435.0" height="32.0" rx="8" fill="#f9e8e8" stroke="#e8c4c4" stroke-width="1.5"/>
<text x="247.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">CFT (Raft / Paxos): довіра до лідера</text>
<rect x="45.0" y="90.0" width="405.0" height="45.0" rx="6" fill="#ffffff" stroke="#f0d0d0" stroke-width="1.5"/><text x="247.5" y="116.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Лідер надсилає суперечливі пропозиції двом групам реплік.</tspan></text>
<rect x="185.0" y="145.0" width="125.0" height="36.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="247.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Лідер (зрадник)</text>
<rect x="55.0" y="205.0" width="160.0" height="46.0" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="135.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол 1 (кворум A)</text>
<text x="135.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Прийнято: x = 1</text>
<rect x="280.0" y="205.0" width="160.0" height="46.0" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="360.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол 2 (кворум B)</text>
<text x="360.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Прийнято: x = 2</text>
<line x1="215.0" y1="181.0" x2="155.0" y2="203.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="280.0" y1="181.0" x2="340.0" y2="203.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="265.0" width="405.0" height="135.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="247.5" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Чому CFT ламається:</tspan><tspan x="247.5" dy="11.7">• Репліки не перевіряють пропозицію з іншими вузлами.</tspan><tspan x="247.5" dy="11.7">• Вузол 1 і Вузол 2 утворюють кворуми з лідером окремо.</tspan><tspan x="247.5" dy="11.7">• Наслідок: розкол системи (Split-Brain) та незворотне пошкодження реплікованого журналу.</tspan></text>
<rect x="495.0" y="50.0" width="435.0" height="360.0" rx="8" fill="#f8fbf9" stroke="#c3e6cb" stroke-width="1.5"/>
<rect x="495.0" y="50.0" width="435.0" height="32.0" rx="8" fill="#e2f5e8" stroke="#c3e6cb" stroke-width="1.5"/>
<text x="712.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">BFT (PBFT): нульова довіра й перехресний контроль</text>
<rect x="510.0" y="90.0" width="405.0" height="45.0" rx="6" fill="#ffffff" stroke="#d4edda" stroke-width="1.5"/><text x="712.5" y="116.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">Репліки обмінюються підписаними підтвердженнями між собою.</tspan></text>
<rect x="650.0" y="145.0" width="125.0" height="36.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="712.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Лідер (зрадник)</text>
<rect x="520.0" y="205.0" width="160.0" height="46.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
<text x="600.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол 1 (BFT)</text>
<text x="600.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перевірка гешу</text>
<rect x="745.0" y="205.0" width="160.0" height="46.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
<text x="825.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол 2 (BFT)</text>
<text x="825.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перевірка гешу</text>
<line x1="680.0" y1="181.0" x2="620.0" y2="203.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="745.0" y1="181.0" x2="805.0" y2="203.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="682.0" y1="220.0" x2="743.0" y2="220.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="743.0" y1="235.0" x2="682.0" y2="235.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="265.0" width="405.0" height="135.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="712.5" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">Чому BFT працює:</tspan><tspan x="712.5" dy="11.7">• Репліки вимагають кворум 2f + 1 ідентичних голосів від сусідів.</tspan><tspan x="712.5" dy="11.7">• Брехня лідера виявляється негайно: репліки бачать різні геші й блокують фіксацію.</tspan><tspan x="712.5" dy="11.7">• Запускається тайм-аут і скидання зрадника через зміну виду (View Change).</tspan></text>
</svg>