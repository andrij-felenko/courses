<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процедура View Change у PBFT</text>
<rect x="0.0" y="0.0" width="960.0" height="440.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол зміни виду (View Change) у PBFT при збоях первинного вузла</text>
<rect x="35.0" y="55.0" width="275.0" height="360.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="35.0" y="55.0" width="275.0" height="32.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="172.5" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Тайм-аут лідера</text>
<rect x="45.0" y="99.0" width="255.0" height="140.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="172.5" y="150.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="172.5" dy="0.0">Якщо репліка надіслала запит,</tspan><tspan x="172.5" dy="15.0">але первинний вузол мовчить</tspan><tspan x="172.5" dy="15.0">або надсилає підроблені геші,</tspan><tspan x="172.5" dy="15.0">спрацьовує локальний таймер.</tspan></text>
<rect x="45.0" y="255.0" width="255.0" height="140.0" rx="6" fill="#f8f9fa" stroke="#d0d7de" stroke-width="1.5"/><text x="172.5" y="300.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="172.5" dy="0.0">Дія вузла:</tspan><tspan x="172.5" dy="14.3">Репліка переходить у новий стан,</tspan><tspan x="172.5" dy="14.3">відкидає старі повідомлення</tspan><tspan x="172.5" dy="14.3">і розсилає усім реплікам пакет</tspan><tspan x="172.5" dy="14.3">&lt;VIEW-CHANGE, v+1, n, C, P, i&gt;.</tspan></text>
<rect x="345.0" y="55.0" width="275.0" height="360.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="345.0" y="55.0" width="275.0" height="32.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="482.5" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Збір доказів</text>
<rect x="355.0" y="99.0" width="255.0" height="140.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="482.5" y="150.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="482.5" dy="0.0">Новий первинний вузол</tspan><tspan x="482.5" dy="15.0">p = (v + 1) mod N збирає</tspan><tspan x="482.5" dy="15.0">набір із 2f повідомлень</tspan><tspan x="482.5" dy="15.0">View-Change від інших реплік.</tspan></text>
<rect x="355.0" y="255.0" width="255.0" height="140.0" rx="6" fill="#f8f9fa" stroke="#d0d7de" stroke-width="1.5"/><text x="482.5" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="482.5" dy="0.0">Формування New-View:</tspan><tspan x="482.5" dy="11.7">Лідер аналізує надіслані сертифікати P,</tspan><tspan x="482.5" dy="11.7">визначає останній стабільний стан</tspan><tspan x="482.5" dy="11.7">і формує зведений доказ V.</tspan></text>
<rect x="655.0" y="55.0" width="275.0" height="360.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="655.0" y="55.0" width="275.0" height="32.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="792.5" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Вхід у новий вид v + 1</text>
<rect x="665.0" y="99.0" width="255.0" height="140.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="792.5" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="792.5" dy="0.0">Новий первинний вузол транслює</tspan><tspan x="792.5" dy="15.0">&lt;NEW-VIEW, v+1, V, O&gt;,</tspan><tspan x="792.5" dy="15.0">де O — узгоджені Pre-Prepare.</tspan></text>
<rect x="665.0" y="255.0" width="255.0" height="140.0" rx="6" fill="#f8f9fa" stroke="#d0d7de" stroke-width="1.5"/><text x="792.5" y="307.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="792.5" dy="0.0">Верифікація репліками:</tspan><tspan x="792.5" dy="14.3">Усі вузли перевіряють доказ V.</tspan><tspan x="792.5" dy="14.3">Якщо докази валідні, система</tspan><tspan x="792.5" dy="14.3">відновлює консенсус у виді v+1.</tspan></text>
</svg>