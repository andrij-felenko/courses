<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="900.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="45.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Матриця розділення кластера: перетин більшостей і правило N/2 + 1</tspan></text>
<rect x="40.0" y="80.0" width="900.0" height="115.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="55.0" y="95.0" width="180.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Кластер із 3 вузлів</tspan><tspan x="145.0" dy="15.6">Кворум: 2 із 3</tspan><tspan x="145.0" dy="15.6">(Q &gt;= 2)</tspan></text>
<rect x="260.0" y="95.0" width="300.0" height="85.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Розділення мережі [2] та [1]:</tspan><tspan x="410.0" dy="15.0">Частина із 2 вузлів має кворум (2 &gt;= 2) ✓</tspan><tspan x="410.0" dy="15.0">Частина із 1 вузла блокує записи (1 &lt; 2) ✗</tspan></text>
<rect x="580.0" y="95.0" width="340.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Результат:</tspan><tspan x="750.0" dy="15.0">Робота триває без розщеплення.</tspan><tspan x="750.0" dy="15.0">Витримує відмову f = 1 вузла.</tspan></text>
<rect x="40.0" y="210.0" width="900.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<rect x="55.0" y="225.0" width="180.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="256.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Кластер із 4 вузлів</tspan><tspan x="145.0" dy="15.6">Кворум: 3 із 4</tspan><tspan x="145.0" dy="15.6">(Q &gt;= 3)</tspan></text>
<rect x="260.0" y="225.0" width="300.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="256.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Симетричний розрив [2] та [2]:</tspan><tspan x="410.0" dy="15.0">Перша половина: 2 &lt; 3 (немає кворуму) ✗</tspan><tspan x="410.0" dy="15.0">Друга половина: 2 &lt; 3 (немає кворуму) ✗</tspan></text>
<rect x="580.0" y="225.0" width="340.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="256.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="750.0" dy="0.0">Результат:</tspan><tspan x="750.0" dy="15.0">Повна зупинка кластера (Deadlock).</tspan><tspan x="750.0" dy="15.0">4 вузли витримують лише f = 1 відмову!</tspan></text>
<rect x="40.0" y="340.0" width="900.0" height="115.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="55.0" y="355.0" width="180.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Кластер із 5 вузлів</tspan><tspan x="145.0" dy="15.6">Кворум: 3 із 5</tspan><tspan x="145.0" dy="15.6">(Q &gt;= 3)</tspan></text>
<rect x="260.0" y="355.0" width="300.0" height="85.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Розділення мережі [3] та [2]:</tspan><tspan x="410.0" dy="15.0">Більшість із 3 вузлів продовжує роботу ✓</tspan><tspan x="410.0" dy="15.0">Меншість із 2 вузлів чекає зв'язку ✗</tspan></text>
<rect x="580.0" y="355.0" width="340.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Результат:</tspan><tspan x="750.0" dy="15.0">Стійкість до f = 2 одночасних відмов.</tspan><tspan x="750.0" dy="15.0">Найкращий баланс надійності та ціни.</tspan></text>
</svg>