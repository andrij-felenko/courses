<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="25.0" width="425.0" height="465.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="60.0" y="45.0" width="385.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="252.5" y="64.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="252.5" dy="0.0">Апаратне відсікання (STONITH)</tspan><tspan x="252.5" dy="16.9">«Вбий інший вузол у голову»</tspan></text>
<rect x="60.0" y="105.0" width="385.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="252.5" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">1. Вузол 2 виявив зникнення серцебиття від Вузла 1.</tspan></text>
<rect x="60.0" y="180.0" width="385.0" height="75.0" rx="6" fill="#fff3cd" stroke="#c0392b" stroke-width="1.5"/><text x="252.5" y="206.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">2. Вузол 2 через мережу керування шле команду</tspan><tspan x="252.5" dy="15.0">на блок живлення (PDU) або IPMI/iLO:</tspan><tspan x="252.5" dy="15.0">POWER OFF / RESET Вузол 1</tspan></text>
<rect x="60.0" y="270.0" width="385.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="252.5" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">3. Отримано апаратне підтвердження відключення.</tspan></text>
<rect x="60.0" y="345.0" width="385.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="252.5" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">4. Вузол 2 безпечно перебирає спільні диски</tspan><tspan x="252.5" dy="15.0">та IP-адресу лідера (безпека 100%).</tspan></text>
<rect x="60.0" y="425.0" width="385.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="252.5" y="446.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="252.5" dy="0.0">Слабке місце: залежить від окремої мережі IPMI;</tspan><tspan x="252.5" dy="14.3">зависання BMC залишає кластер заблокованим.</tspan></text>
<rect x="495.0" y="25.0" width="425.0" height="465.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="515.0" y="45.0" width="385.0" height="46.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="707.5" y="64.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="707.5" dy="0.0">Логічний фенсинг (Fencing Tokens)</tspan><tspan x="707.5" dy="16.9">«Перевірка версії на точці збереження»</tspan></text>
<rect x="515.0" y="105.0" width="385.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="707.5" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">1. Консенсус (etcd / Raft) обирає нового лідера</tspan><tspan x="707.5" dy="15.0">з монотонно більшим номером терму (e = 42).</tspan></text>
<rect x="515.0" y="180.0" width="385.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="707.5" y="206.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">2. Старий Вузол 1 НЕ вбивають фізично:</tspan><tspan x="707.5" dy="15.0">він може продовжувати виконувати локальний код,</tspan><tspan x="707.5" dy="15.0">але його токен застарів (e = 41).</tspan></text>
<rect x="515.0" y="270.0" width="385.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="707.5" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">3. Сховище даних запам'ятовує останній токен 42.</tspan></text>
<rect x="515.0" y="345.0" width="385.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="707.5" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">4. Будь-який запис від Вузла 1 відхиляється на диску:</tspan><tspan x="707.5" dy="15.0">41 &lt; 42 -&gt; помилка StaleEpoch.</tspan></text>
<rect x="515.0" y="425.0" width="385.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="707.5" y="446.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="707.5" dy="0.0">Перевага: не потребує спец-заліза, працює в хмарі;</tspan><tspan x="707.5" dy="14.3">вимагає підтримки токенів у сховищі/API.</tspan></text>
</svg>