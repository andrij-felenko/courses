<rect x="60.0" y="438.0" width="960.0" height="90.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="460.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Стратегія захисту: комбінація Count-Min Sketch + L1 Near-Cache + RESP3 Tracking</tspan><tspan x="540.0" dy="13.0">1. Детектор Heavy Hitters виявляє зростання популярності ключа за ковзне вікно (наприклад, 100 мс);</tspan><tspan x="540.0" dy="13.0">2. Ключ миттєво кешується в локальній пам'яті процесу (L1) кожного інстансу вебсервера;</tspan><tspan x="540.0" dy="13.0">3. Мережевий трафік до кластера L2 падає на 99.9%, унеможливлюючи відмову вузлів Redis;</tspan><tspan x="540.0" dy="13.0">4. У разі модифікації даних шина інвалідації миттєво очищує L1, зберігаючи високу узгодженість.</tspan></text>
