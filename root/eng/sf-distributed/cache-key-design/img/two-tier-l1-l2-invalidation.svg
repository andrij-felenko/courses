<rect x="375.0" y="170.0" width="260.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="505.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Локальний кеш L1 (TinyLFU / LRU)</tspan><tspan x="505.0" dy="12.3">product:9901 (TTL = 3 сек)</tspan><tspan x="505.0" dy="12.3">Попадання: 99.8% звернень</tspan></text>
<rect x="375.0" y="226.0" width="260.0" height="68.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="505.0" y="263.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Підписка на інвалідацію:</tspan><tspan x="505.0" dy="11.7">Redis RESP3 Tracking / Pub-Sub</tspan><tspan x="505.0" dy="11.7">Слухає сигнал скидання L1</tspan></text>
<rect x="55.0" y="320.0" width="590.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="350.0" y="342.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Переваги L1:</tspan><tspan x="350.0" dy="12.3">• Нульова мережева затримка (RAM lookup: &lt; 50 наносекунд);</tspan><tspan x="350.0" dy="12.3">• Повне розвантаження віддаленого кластера від мільйонів однакових GET-запитів;</tspan><tspan x="350.0" dy="12.3">• Single-Flight усередині процесу блокує паралельні виходи в мережу при промаху.</tspan></text>
