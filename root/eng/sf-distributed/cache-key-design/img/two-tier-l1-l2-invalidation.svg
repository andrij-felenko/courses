<rect x="705.0" y="130.0" width="320.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Redis Cluster Shards</tspan><tspan x="865.0" dy="13.0"></tspan><tspan x="865.0" dy="13.0">Зберігає персистентний кеш</tspan><tspan x="865.0" dy="13.0">(TTL = 1..24 години)</tspan><tspan x="865.0" dy="13.0">Отримує лише 0.2% запитів (L1 miss)</tspan></text>
<rect x="705.0" y="220.0" width="320.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Шина інвалідації (RESP3 / PubSub)</tspan><tspan x="865.0" dy="13.0"></tspan><tspan x="865.0" dy="13.0">При зміні ціни товару надсилає:</tspan><tspan x="865.0" dy="13.0">INVALIDATE product:9901</tspan><tspan x="865.0" dy="13.0">усім підключеним інстансам L1</tspan></text>
<rect x="705.0" y="320.0" width="320.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="342.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Основна База Даних (RDBMS/NoSQL)</tspan><tspan x="865.0" dy="12.3"></tspan><tspan x="865.0" dy="12.3">Надійно захищена двома шарами кешу;</tspan><tspan x="865.0" dy="12.3">Кількість звернень знижена до одиниць.</tspan></text>
