<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 631" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="631" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири сесійні гарантії узгодженості (модель Террі, Xerox PARC)</text>
<rect x="30.0" y="65.0" width="540.0" height="240.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<rect x="30.0" y="65.0" width="540.0" height="36.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="300.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Читай власні записи (Read-Your-Writes / RYW)</text>
<rect x="45.0" y="113.0" width="510.0" height="180.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="175.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Гарантія: Клієнт завжди бачить власні попередні записи в усіх наступних читаннях.</tspan><tspan x="300.0" dy="12.3"></tspan><tspan x="300.0" dy="12.3">Сценарій без гарантії: Користувач оновив біографію, оновив сторінку й бачить старий текст.</tspan><tspan x="300.0" dy="12.3">Він надсилає форму повторно, створюючи дублікати й плутанину.</tspan><tspan x="300.0" dy="12.3"></tspan><tspan x="300.0" dy="12.3">Формально: W_k(x) &lt;_session R_m(x) =&gt; R_m повертає версію x &gt;= версії від W_k.</tspan></text>
<rect x="590.0" y="65.0" width="540.0" height="240.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<rect x="590.0" y="65.0" width="540.0" height="36.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="860.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Монотонне читання (Monotonic Reads / MR)</text>
<rect x="605.0" y="113.0" width="510.0" height="180.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Гарантія: Наступні читання клієнта ніколи не повертають старіший стан, ніж уже бачений.</tspan><tspan x="860.0" dy="11.7"></tspan><tspan x="860.0" dy="11.7">Сценарій без гарантії: Перший запит прочитав 10 коментарів з актуальної репліки R1.</tspan><tspan x="860.0" dy="11.7">Наступний запит потрапив на відсталу репліку R2 — 3 коментарі раптом «зникли».</tspan><tspan x="860.0" dy="11.7"></tspan><tspan x="860.0" dy="11.7">Формально: R_k(x) повернуло версію v_1 =&gt; для будь-якого R_m(x) пізніше у сесії версія v_2 &gt;= v_1.</tspan></text>
<rect x="30.0" y="335.0" width="540.0" height="240.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<rect x="30.0" y="335.0" width="540.0" height="36.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="300.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Монотонний запис (Monotonic Writes / MW)</text>
<rect x="45.0" y="383.0" width="510.0" height="180.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="446.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Гарантія: Записи одного клієнта застосовуються на всіх репліках у порядку їх надсилання.</tspan><tspan x="300.0" dy="11.7"></tspan><tspan x="300.0" dy="11.7">Сценарій без гарантії: Запис W1 (створити замовлення) і запис W2 (скасувати його).</tspan><tspan x="300.0" dy="11.7">Якщо W2 застосується раніше за W1, скасування впаде з помилкою, а потім створиться вічне замовлення.</tspan><tspan x="300.0" dy="11.7"></tspan><tspan x="300.0" dy="11.7">Формально: W_k &lt;_session W_m =&gt; на будь-якому вузлі W_k виконується перед W_m.</tspan></text>
<rect x="590.0" y="335.0" width="540.0" height="240.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<rect x="590.0" y="335.0" width="540.0" height="36.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="860.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Запис слідує за читанням (Writes-Follow-Reads / WFR)</text>
<rect x="605.0" y="383.0" width="510.0" height="180.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="446.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Гарантія: Якщо клієнт прочитав стан V і зробив запис W, W упорядковується після всіх записів у V.</tspan><tspan x="860.0" dy="11.7"></tspan><tspan x="860.0" dy="11.7">Сценарій без гарантії: Аліса прочитала пост і написала відповідь «Погоджуюсь». Боб бачить</tspan><tspan x="860.0" dy="11.7">відповідь Аліси на іншій репліці, де сам початковий пост ще не з'явився (відповідь у нікуди).</tspan><tspan x="860.0" dy="11.7"></tspan><tspan x="860.0" dy="11.7">Формально: R_k(x) спостерігав W_prev =&gt; для будь-якого наступного W_m маємо W_prev &lt; W_m.</tspan></text>
<rect x="130.0" y="585.0" width="900.0" height="26.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="602.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Сесійні гарантії ізолюють очікування одного клієнта без потреби блокувати всю систему глобальним консенсусом.</tspan></text>
</svg>