<rect x="40.0" y="170.0" width="400.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="198.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Наслідки фрагментації:</tspan><tspan x="240.0" dy="14.3">• Сумарно вільної пам'яті багато (40%), але</tspan><tspan x="240.0" dy="14.3">  немає суцільного блоку на 4 KB.</tspan><tspan x="240.0" dy="14.3">• Аллокатор відмовляє (OOM) або смикає mmap.</tspan><tspan x="240.0" dy="14.3">• Непередбачувані затримки при виділенні пам'яті.</tspan><tspan x="240.0" dy="14.3">• RSS процесу зростає, хоча даних мало.</tspan></text>
<line x1="480.0" y1="30.0" x2="480.0" y2="460.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="740.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Slab Allocator (Memcached)</text>
<text x="740.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Пам'ять розбита на класи зі сталим розміром чанків</text>
<rect x="510.0" y="95.0" width="450.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="735.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Slab Class 1 (Chunk size = 96 B, 1 MB Page = 10922 чанки)</tspan><tspan x="735.0" dy="13.0">[96B: KeyA][96B: KeyB][96B: Free][96B: KeyC][... 10918 чанків ...]</tspan></text>
<rect x="510.0" y="165.0" width="450.0" height="60.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="735.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Slab Class 2 (Chunk size = 120 B, множник росту factor=1.25)</tspan><tspan x="735.0" dy="13.0">[120B: Session1][120B: Session2][120B: Free][... 8738 чанків ...]</tspan></text>
<rect x="510.0" y="235.0" width="450.0" height="60.0" rx="6" fill="#fff3cd" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Slab Class N (Chunk size = 1 MB, 1 MB Page = 1 чанк)</tspan><tspan x="735.0" dy="13.0">[1 MB: Великий JSON / Граф користувача / HTML кеш]</tspan></text>
<rect x="510.0" y="315.0" width="450.0" height="145.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="358.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Переваги та компроміси Slab Allocation:</tspan><tspan x="735.0" dy="13.0">✓ Нульова зовнішня фрагментація (виділення за O(1))</tspan><tspan x="735.0" dy="13.0">✓ Незалежний LRU-список для кожного Slab-класу окремо</tspan><tspan x="735.0" dy="13.0">⚠ Внутрішня фрагментація: значення 97 B займає чанк 120 B (23 B відходу)</tspan><tspan x="735.0" dy="13.0">⚠ Закальцинування (Slab Calcification): якщо сторінки роздані</tspan><tspan x="735.0" dy="13.0">  класу 1, а трафік пішов у клас 2, клас 2 витісняє дані (evictions)!</tspan></text>
</svg>