<text x="130.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">FREE</text>
<rect x="155.0" y="100.0" width="90.0" height="40.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="200.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1.5 KB</text>
