<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура обробки запитів: Однопотокове ядро + Багатопотоковий I/O</text>
<text x="500.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чому кеш у пам'яті не потребує блокувань на структурах даних</text>
<rect x="40.0" y="100.0" width="140.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Клієнт 1</tspan><tspan x="110.0" dy="14.3">(TCP Сокет)</tspan></text>
<rect x="40.0" y="170.0" width="140.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="191.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Клієнт 2</tspan><tspan x="110.0" dy="14.3">(TCP Сокет)</tspan></text>
<rect x="40.0" y="240.0" width="140.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Клієнт N</tspan><tspan x="110.0" dy="14.3">(TCP Сокет)</tspan></text>
<line x1="180.0" y1="125.0" x2="250.0" y2="170.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="180.0" y1="195.0" x2="250.0" y2="195.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="180.0" y1="265.0" x2="250.0" y2="220.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="250.0" y="130.0" width="200.0" height="150.0" rx="6" fill="#fff3cd" stroke="#c0392b" stroke-width="1.5"/><text x="350.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">I/O Threads (Redis 6+)</tspan><tspan x="350.0" dy="13.0">(epoll / kqueue)</tspan><tspan x="350.0" dy="13.0"></tspan><tspan x="350.0" dy="13.0">• Зчитування байтів із сокета</tspan><tspan x="350.0" dy="13.0">• Парсинг протоколу RESP</tspan><tspan x="350.0" dy="13.0">• Формування черги команд</tspan><tspan x="350.0" dy="13.0">• Серіалізація відповідей</tspan></text>
<line x1="450.0" y1="205.0" x2="530.0" y2="205.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="490.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Команди</text>
<rect x="530.0" y="100.0" width="230.0" height="210.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Головний потік (Main Thread)</tspan><tspan x="645.0" dy="14.3">Event Loop (AeEvent)</tspan><tspan x="645.0" dy="14.3"></tspan><tspan x="645.0" dy="14.3">1. Атомарне виконання:</tspan><tspan x="645.0" dy="14.3">   GET / SET / HINCRBY / ZADD</tspan><tspan x="645.0" dy="14.3">2. Порядок викликів гарантовано</tspan><tspan x="645.0" dy="14.3">3. Жодних Mutex / RWLock!</tspan><tspan x="645.0" dy="14.3">4. Модифікація RAM таблиць</tspan><tspan x="645.0" dy="14.3">5. Витіснення (LRU/LFU)</tspan></text>
<line x1="760.0" y1="205.0" x2="830.0" y2="205.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="795.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">RAM</text>
<rect x="830.0" y="100.0" width="140.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Структури даних</tspan><tspan x="900.0" dy="13.0"></tspan><tspan x="900.0" dy="13.0">• Dict (Хеш-таблиці)</tspan><tspan x="900.0" dy="13.0">• Skiplist (ZSet)</tspan><tspan x="900.0" dy="13.0">• Quicklist (Lists)</tspan><tspan x="900.0" dy="13.0">• Intset / Radix Tree</tspan><tspan x="900.0" dy="13.0">• SDS (Рядки)</tspan></text>
<rect x="40.0" y="340.0" width="930.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="505.0" y="375.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Чому однопотокове ядро швидше за багатопотокове з блокуваннями:</tspan><tspan x="505.0" dy="14.3">1. Час операції над структурою в L1/L2 кеші процесора — 50–200 наносекунд.</tspan><tspan x="505.0" dy="14.3">2. Захоплення mutex/pthread_mutex з перемиканням контексту — 1000–5000 наносекунд (в 10-50 разів довше!).</tspan><tspan x="505.0" dy="14.3">3. Вузьке місце кешу — не обчислення, а системні виклики I/O ядра (read/write/epoll) та пропускна здатність мережі.</tspan><tspan x="505.0" dy="14.3">4. I/O-потоки паралелять мережу, а ядро лишається безблокувальним і детермінованим.</tspan></text>
</svg>