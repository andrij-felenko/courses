<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр інвалідації на основі захоплення змін даних (CDC / Log Tailing)</text>
<rect x="40.0" y="130.0" width="160.0" height="100.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="120.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Первинна БД</tspan><tspan x="120.0" dy="14.3">(PostgreSQL / MySQL)</tspan><tspan x="120.0" dy="14.3"></tspan><tspan x="120.0" dy="14.3">COMMIT → WAL</tspan></text>
<rect x="260.0" y="135.0" width="140.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">CDC-агент</tspan><tspan x="330.0" dy="14.3">(Debezium / Canal)</tspan><tspan x="330.0" dy="14.3"></tspan><tspan x="330.0" dy="14.3">Читає журнал WAL</tspan></text>
<rect x="470.0" y="135.0" width="140.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="165.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Брокер подій</tspan><tspan x="540.0" dy="11.7">(Kafka / Redis Stream)</tspan><tspan x="540.0" dy="11.7"></tspan><tspan x="540.0" dy="11.7">Топік: `db-changes`</tspan></text>
<rect x="680.0" y="135.0" width="140.0" height="90.0" rx="6" fill="#fff3cd" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Воркер інвалідації</tspan><tspan x="750.0" dy="14.3"></tspan><tspan x="750.0" dy="14.3">Мапінг таблиць</tspan><tspan x="750.0" dy="14.3">у ключі / теги</tspan></text>
<rect x="875.0" y="135.0" width="110.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="930.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">Кеш</tspan><tspan x="930.0" dy="14.3">(Redis / CDN)</tspan><tspan x="930.0" dy="14.3"></tspan><tspan x="930.0" dy="14.3">`DEL key`</tspan><tspan x="930.0" dy="14.3">`PURGE tag`</tspan></text>
<line x1="200.0" y1="180.0" x2="260.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="196.2" y="156.5" width="67.6" height="15.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">LSN / Binlog</tspan></text>
<line x1="400.0" y1="180.0" x2="470.0" y2="180.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="403.8" y="156.5" width="62.4" height="15.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="435.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">JSON / Avro</tspan></text>
<line x1="610.0" y1="180.0" x2="680.0" y2="180.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="616.4" y="156.5" width="57.3" height="15.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="645.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Асинхронно</tspan></text>
<line x1="820.0" y1="180.0" x2="875.0" y2="180.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="830.5" y="156.5" width="33.9" height="15.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="847.5" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="847.5" dy="0.0">Purge</tspan></text>
<rect x="60.0" y="360.0" width="900.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Переваги CDC-інвалідації:</tspan><tspan x="510.0" dy="14.3">1. Повне усунення проблеми подвійного запису (Dual-Write) — джерелом правди є журнал транзакцій.</tspan><tspan x="510.0" dy="14.3">2. Застосунок звільняється від оркестрації кешу: відкат або збій транзакції не призводить до розсинхронізації.</tspan></text>
</svg>