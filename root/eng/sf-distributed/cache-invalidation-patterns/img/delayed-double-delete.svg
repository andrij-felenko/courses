<line x1="120.0" y1="120.0" x2="900.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="416.1" y="96.0" width="187.8" height="18.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">1. Перше видалення: `DEL key`</tspan></text>
<line x1="120.0" y1="170.0" x2="380.0" y2="170.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="180.9" y="146.0" width="138.2" height="18.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="158.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">2. UPDATE v₂ (commit)</tspan></text>
<line x1="380.0" y1="180.0" x2="640.0" y2="320.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
