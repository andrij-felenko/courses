<rect x="670.0" y="252.0" width="200.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="267.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Паралельний читач:</tspan><tspan x="770.0" dy="11.7">читає зі старої репліки v₁ → кеш!</tspan></text>
<line x1="120.0" y1="370.0" x2="900.0" y2="370.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="292.1" y="346.0" width="435.8" height="18.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="358.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">3. Друге видалення (через T_delay): `DEL key` (зачищає отруєний стан)</tspan></text>
<rect x="60.0" y="435.0" width="900.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="456.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Відкладене повторне видалення гарантує зачистку кешу навіть якщо запізнілий читач підтягнув дані з відсталої репліки.</tspan></text>
