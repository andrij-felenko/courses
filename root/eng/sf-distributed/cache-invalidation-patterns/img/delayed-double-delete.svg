<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відкладене подвійне видалення (Delayed Double-Delete) для компенсації лагу реплікації</text>
<rect x="60.0" y="50.0" width="120.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Записувач</tspan></text>
<rect x="320.0" y="50.0" width="120.0" height="38.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Майстер БД</tspan></text>
<rect x="580.0" y="50.0" width="120.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="640.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Репліка БД</tspan></text>
<rect x="840.0" y="50.0" width="120.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">Кеш (Redis)</tspan></text>
<line x1="120.0" y1="88.0" x2="120.0" y2="420.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
