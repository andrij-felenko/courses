<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інвалідація простору імен через версійні епохи (Generation Bumping)</text>
<rect x="80.0" y="50.0" width="240.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Глобальний лічильник епохи</tspan></text>
<rect x="90.0" y="130.0" width="220.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Попередня епоха:</tspan><tspan x="200.0" dy="15.6">`gen:tenant_42 = 1`</tspan></text>
<line x1="200.0" y1="190.0" x2="200.0" y2="260.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="221.9" y="216.0" width="76.2" height="18.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="228.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">INCR (O(1))</tspan></text>
<rect x="90.0" y="260.0" width="220.0" height="60.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="200.0" y="286.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Нова актуальна епоха:</tspan><tspan x="200.0" dy="15.6">`gen:tenant_42 = 2`</tspan></text>
<rect x="440.0" y="50.0" width="480.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Сховище ключів (Redis / Memcached)</tspan></text>
<rect x="450.0" y="120.0" width="460.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="150.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Ключі епохи v1 (Миттєво застаріли, стануть CACHE_MISS):</tspan><tspan x="680.0" dy="13.0">• `t42:v1:user:1` | `t42:v1:orders` | `t42:v1:settings`</tspan><tspan x="680.0" dy="13.0">Стан: Не видаляються фізично, звільняться за природним TTL / LRU</tspan></text>
<rect x="450.0" y="250.0" width="460.0" height="80.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Ключі епохи v2 (Свіжі записи після промаху й оновлення):</tspan><tspan x="680.0" dy="13.0">• `t42:v2:user:1` | `t42:v2:orders` | `t42:v2:settings`</tspan><tspan x="680.0" dy="13.0">Стан: Усі наступні читачі автоматично формують запити з префіксом v2</tspan></text>
<line x1="310.0" y1="160.0" x2="450.0" y2="160.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="310.0" y1="290.0" x2="450.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="395.0" width="900.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="421.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Інкремент одного лічильника версії за O(1) робить мільйони ключів недосяжними без сканування пам'яті.</tspan></text>
</svg>