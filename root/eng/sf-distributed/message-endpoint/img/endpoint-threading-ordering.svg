<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="1100.0" height="490.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="570.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багатониткова обробка в Endpoint: збереження послідовності за Partition Key</text>
<rect x="40.0" y="75.0" width="515.0" height="405.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="297.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний спільний пул (Гонка стану)</text>
<rect x="60.0" y="125.0" width="150.0" height="110.0" rx="4" fill="#fef9e7" stroke="#333333" stroke-width="1.1"/>
<text x="135.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Черга подій</text>
<text x="135.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. [User#42: Created]</text>
<text x="135.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">2. [User#42: Paid]</text>
<text x="135.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">3. [User#42: Canceled]</text>
<rect x="360.0" y="125.0" width="175.0" height="110.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/>
<text x="447.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Спільний пул ниток</text>
<text x="447.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Нитка A → Подія 1 (зависла)</text>
<text x="447.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Нитка B → Подія 2 (виконалася)</text>
<text x="447.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Нитка C → Подія 3 (виконалася)</text>
<line x1="210.0" y1="172.0" x2="355.0" y2="172.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="210.0" y1="195.0" x2="355.0" y2="195.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="210.0" y1="218.0" x2="355.0" y2="218.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="255.0" width="475.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="297.5" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="297.5" dy="0.0">Катастрофа неупорядкованості:</tspan><tspan x="297.5" dy="11.7">• Подія «Оплачено» або «Скасовано» обганяє повільну подію «Створено».</tspan><tspan x="297.5" dy="11.7">• Доменна сутність User#42 потрапляє в некоректний стан (скасування неіснуючого замовлення).</tspan><tspan x="297.5" dy="11.7">• Блокування всієї черги однією ниткою вбиває паралелізм.</tspan></text>
<rect x="60.0" y="370.0" width="475.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/><text x="297.5" y="412.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="297.5" dy="0.0">Результат: Застосування єдиного логічного каналу без прив'язки до ключа агрегата</tspan><tspan x="297.5" dy="12.3">руйнує причинно-наслідковий зв'язок бізнес-операцій.</tspan></text>
<rect x="585.0" y="75.0" width="515.0" height="405.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="842.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Key Affinity / Шардований диспетчер</text>
<rect x="605.0" y="130.0" width="135.0" height="105.0" rx="4" fill="#fef9e7" stroke="#333333" stroke-width="1.1"/>
<text x="672.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхідний потік</text>
<text x="672.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">User#42 (Hash=0)</text>
<text x="672.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">User#99 (Hash=1)</text>
<text x="672.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">User#17 (Hash=2)</text>
<rect x="770.0" y="145.0" width="95.0" height="75.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="817.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Хешування</text>
<text x="817.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">hash(key) % N</text>
<rect x="900.0" y="125.0" width="180.0" height="115.0" rx="4" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.1"/>
<text x="990.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Виділені черги воркерів</text>
<text x="990.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Worker Queue 0 (User#42)</text>
<text x="990.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Worker Queue 1 (User#99)</text>
<text x="990.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Worker Queue 2 (User#17)</text>
<line x1="740.0" y1="182.0" x2="765.0" y2="182.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="865.0" y1="182.0" x2="895.0" y2="182.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="605.0" y="255.0" width="475.0" height="100.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.1"/><text x="842.5" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="842.5" dy="0.0">Гарантії порядку та паралелізму:</tspan><tspan x="842.5" dy="11.7">• Усі повідомлення одного Aggregate ID (наприклад, User#42) завжди потрапляють в одну нитку.</tspan><tspan x="842.5" dy="11.7">• Сувора послідовність (FIFO) всередині конкретного сутності без глобальних локів.</tspan><tspan x="842.5" dy="11.7">• Різні користувачі (User#42 та User#99) обробляються абсолютно паралельно на різних ядрах CPU.</tspan></text>
<rect x="605.0" y="370.0" width="475.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.1"/><text x="842.5" y="412.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="842.5" dy="0.0">Формула префетчу: Розмір черги воркера B = Bandwidth × Latency. При перевищенні High Watermark</tspan><tspan x="842.5" dy="11.7">ендпоінт тимчасово призупиняє вичитування з мережевого сокета (TCP/AMQP Backpressure).</tspan></text>
</svg>