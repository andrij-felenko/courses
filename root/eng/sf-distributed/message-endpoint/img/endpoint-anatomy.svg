<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="1100.0" height="490.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="570.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія Message Endpoint: подвійний міст між доменом і чергою</text>
<rect x="45.0" y="80.0" width="240.0" height="395.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="165.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Доменний шар застосунку</text>
<rect x="60.0" y="130.0" width="210.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="165.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">OrderService</tspan><tspan x="165.0" dy="14.3">• processOrder(order)</tspan><tspan x="165.0" dy="14.3">• cancelOrder(id)</tspan></text>
<rect x="60.0" y="210.0" width="210.0" height="55.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="165.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Доменні сутності (Entity/DTO)</tspan><tspan x="165.0" dy="14.3">• Order, PaymentResult</tspan><tspan x="165.0" dy="14.3">• Чисті структури пам'яті</tspan></text>
<rect x="60.0" y="295.0" width="210.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="165.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Транзакційні межі (ACID)</tspan><tspan x="165.0" dy="14.3">• Репозиторій банку/БД</tspan><tspan x="165.0" dy="14.3">• Синхронні виклики</tspan></text>
<rect x="60.0" y="375.0" width="210.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.1"/><text x="165.0" y="395.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Вимоги домену:</tspan><tspan x="165.0" dy="13.7">• Жодних сокетів і фреймів</tspan><tspan x="165.0" dy="13.7">• Немає брокерських ACK</tspan><tspan x="165.0" dy="13.7">• Детерміновані винятки</tspan></text>
<rect x="340.0" y="80.0" width="460.0" height="395.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="570.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">MESSAGE ENDPOINT (Шлюз, Мапер, Адаптер)</text>
<rect x="360.0" y="130.0" width="420.0" height="100.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="570.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідний шлюз (Messaging Gateway &amp; Outbox)</text>
<text x="570.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1. Отримує Order від домену → 2. Мапер серіалізує в JSON/Proto</text>
<text x="570.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3. Додає заголовки (Trace-ID, Message-ID) → 4. Публікує в Outbox/Канал</text>
<text x="570.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: Домен викликає звичайний метод інтерфейсу без AMQP-коду</text>
<rect x="360.0" y="245.0" width="420.0" height="135.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="570.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхідний активатор (Service Activator &amp; Listener)</text>
<text x="570.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1. Читає фрейм із черги → 2. Перевіряє ідемпотентність (Inbox-кеш)</text>
<text x="570.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3. Десеріалізує Payload → 4. Кличе OrderService.processOrder()</text>
<text x="570.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">5. Фіксує успіх/помилку → 6. Шле ACK/NACK або редирект у DLQ</text>
<text x="570.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Контроль потоку: префетч (Prefetch Buffer) та пул воркерів</text>
<rect x="360.0" y="395.0" width="420.0" height="65.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.1"/><text x="570.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Ендпоінт інкапсулює: мережеві сокети, серіалізацію, повтори (Retries),</tspan><tspan x="570.0" dy="12.3">розподілені транзакції, дедуплікацію та керування потоками ОС.</tspan></text>
<rect x="850.0" y="80.0" width="245.0" height="395.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/>
<text x="972.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Брокер / Мережевий канал</text>
<rect x="865.0" y="130.0" width="215.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="972.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">Черги й Теми (Channels)</tspan><tspan x="972.5" dy="14.3">• AMQP Queue / Exchange</tspan><tspan x="972.5" dy="14.3">• Kafka Topic / Partition</tspan></text>
<rect x="865.0" y="205.0" width="215.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="972.5" y="218.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">Мережеві фрейми (Wire Msg)</tspan><tspan x="972.5" dy="13.7">• Бінарний payload (байти)</tspan><tspan x="972.5" dy="13.7">• Заголовки (Headers)</tspan><tspan x="972.5" dy="13.7">• Delivery Tag, Offset</tspan></text>
<rect x="865.0" y="285.0" width="215.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="972.5" y="302.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">Протокольні операції</tspan><tspan x="972.5" dy="13.7">• basic.ack / basic.nack</tspan><tspan x="972.5" dy="13.7">• Commit offset / Heartbeat</tspan></text>
<rect x="865.0" y="360.0" width="215.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="972.5" y="390.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">Dead-Letter Queue (DLQ)</tspan><tspan x="972.5" dy="13.7">• Сховище отруйних листів</tspan><tspan x="972.5" dy="13.7">• Невалідовані повідомлення</tspan><tspan x="972.5" dy="13.7">• Вичерпані ліміти повторів</tspan></text>
<line x1="285.0" y1="180.0" x2="355.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="780.0" y1="180.0" x2="845.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="845.0" y1="310.0" x2="785.0" y2="310.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="355.0" y1="310.0" x2="290.0" y2="310.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>