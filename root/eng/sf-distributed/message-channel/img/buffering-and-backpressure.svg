<text x="497.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Б. Обмежений буфер (Bounded)</text>
<rect x="417.0" y="122.5" width="160.0" height="35.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="497.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="497.0" dy="0.0">Продюсер</tspan><tspan x="497.0" dy="13.0">(Кредитне вікно / Пауза)</tspan></text>
<rect x="391.8" y="206.0" width="210.4" height="48.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="497.0" y="220.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="497.0" dy="0.0">Кільцевий буфер (N = 1000)</tspan><tspan x="497.0" dy="13.0">[Елемент 1] [Елемент 2] [Вільне]</tspan><tspan x="497.0" dy="13.0">Сигнал зворотного тиску (Pause)</tspan></text>
<rect x="417.0" y="302.5" width="160.0" height="35.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="497.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="497.0" dy="0.0">Споживач</tspan><tspan x="497.0" dy="13.0">(Видача кредитів / ACK)</tspan></text>
