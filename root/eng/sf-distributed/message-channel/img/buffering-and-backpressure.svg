<text x="172.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">А. Нульова місткість (Rendezvous)</text>
<rect x="92.0" y="122.5" width="160.0" height="35.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="172.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="172.0" dy="0.0">Продюсер</tspan><tspan x="172.0" dy="13.0">(Блокується під час send)</tspan></text>
<rect x="82.3" y="206.0" width="179.4" height="48.0" rx="6" fill="#fff3cd" stroke="#333333" stroke-width="1.5"/><text x="172.0" y="220.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="172.0" dy="0.0">Канал без буфера</tspan><tspan x="172.0" dy="13.0">(Capacity = 0)</tspan><tspan x="172.0" dy="13.0">Пряма передача з рук у руки</tspan></text>
<rect x="92.0" y="302.5" width="160.0" height="35.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="172.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="172.0" dy="0.0">Споживач</tspan><tspan x="172.0" dy="13.0">(Блокується під час recv)</tspan></text>
