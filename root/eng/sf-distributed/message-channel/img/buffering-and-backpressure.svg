<text x="825.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">В. Необмежений буфер (Unbounded)</text>
<rect x="745.0" y="122.5" width="160.0" height="35.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="825.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Продюсер</tspan><tspan x="825.0" dy="13.0">(λ = 50 000 msg/s)</tspan></text>
<rect x="729.1" y="206.0" width="191.8" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="825.0" y="220.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">Буфер без ліміту (N → ∞)</tspan><tspan x="825.0" dy="13.0">[10 млн накопичених msg]</tspan><tspan x="825.0" dy="13.0">Латентність зростає до хвилин</tspan></text>
<rect x="739.2" y="302.5" width="171.6" height="35.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="825.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Споживач</tspan><tspan x="825.0" dy="13.0">(μ = 10 000 msg/s — відстає)</tspan></text>
<line x1="825.0" y1="175.0" x2="825.0" y2="195.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="825.0" y1="265.0" x2="825.0" y2="285.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="825.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">✗ Ризик аварії OOM Killer у пам'яті
✗ Некерована затримка (Lag)</text>
</svg>