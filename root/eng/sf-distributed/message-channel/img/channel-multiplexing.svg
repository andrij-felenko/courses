<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мультиплексування логічних каналів у фізичному з'єднанні</text>
<rect x="10.0" y="10.0" width="980.0" height="430.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мультиплексування логічних каналів у єдиному фізичному з'єднанні (TCP Connection)</text>
<rect x="40.0" y="93.5" width="140.0" height="33.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Канал #1: Замовлення</tspan><tspan x="110.0" dy="13.0">(OrderService)</tspan></text>
<rect x="40.0" y="198.5" width="140.0" height="33.0" rx="6" fill="#fff3cd" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Канал #2: Телеметрія</tspan><tspan x="110.0" dy="13.0">(TelemetryStream)</tspan></text>
<rect x="40.0" y="303.5" width="140.0" height="33.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Канал #3: Heartbeat</tspan><tspan x="110.0" dy="13.0">(Ping / Status)</tspan></text>
<rect x="213.9" y="171.5" width="142.2" height="87.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.5"/><text x="285.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">МУЛЬТИПЛЕКСОР</tspan><tspan x="285.0" dy="13.0">(Framer / Mux)</tspan><tspan x="285.0" dy="13.0"></tspan><tspan x="285.0" dy="13.0">• Додавання ChID</tspan><tspan x="285.0" dy="13.0">• Кадрування (Frames)</tspan><tspan x="285.0" dy="13.0">• Чергування часток</tspan></text>
