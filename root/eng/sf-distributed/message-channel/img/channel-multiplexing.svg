<rect x="637.7" y="171.5" width="154.6" height="87.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.5"/><text x="715.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">ДЕМУЛЬТИПЛЕКСОР</tspan><tspan x="715.0" dy="13.0">(Demux / Parser)</tspan><tspan x="715.0" dy="13.0"></tspan><tspan x="715.0" dy="13.0">• Зчитування ChID</tspan><tspan x="715.0" dy="13.0">• Маршрутизація в буфер</tspan><tspan x="715.0" dy="13.0">• Збірка повідомлень</tspan></text>
<rect x="820.0" y="93.5" width="140.0" height="33.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="890.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Буфер каналу #1</tspan><tspan x="890.0" dy="13.0">(Черга замовлень)</tspan></text>
<rect x="820.0" y="198.5" width="140.0" height="33.0" rx="6" fill="#fff3cd" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Буфер каналу #2</tspan><tspan x="890.0" dy="13.0">(Потік телеметрії)</tspan></text>
<rect x="820.0" y="303.5" width="140.0" height="33.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Буфер каналу #3</tspan><tspan x="890.0" dy="13.0">(Диспетчер Ping)</tspan></text>
