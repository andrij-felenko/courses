<line x1="785.0" y1="245.0" x2="815.0" y2="320.0" stroke="#27ae60" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="500.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Економія ресурсів ОС: замість тисяч важких TCP-з'єднань працює єдиний потік із віртуальними каналами</text>
