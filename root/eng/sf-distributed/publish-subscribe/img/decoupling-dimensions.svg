<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="330.0" height="370.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="205.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Прямий виклик (RPC / REST)</text>
<rect x="52.0" y="75.0" width="306.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="62.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Простір:</text>
<rect x="60.0" y="101.0" width="290.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="205.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Тісний зв'язок: клієнт знає IP, порт і URL кожного отримувача</tspan></text>
<rect x="52.0" y="145.0" width="306.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="62.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Час:</text>
<rect x="60.0" y="171.0" width="290.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="205.0" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Тісний зв'язок: обидва сервіси мусять бути в мережі одночасно</tspan></text>
<rect x="52.0" y="215.0" width="306.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="62.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Синхронізація:</text>
<rect x="60.0" y="241.0" width="290.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="205.0" y="260.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Блокування: клієнт чекає завершення обробки кожним вузлом</tspan></text>
<rect x="52.0" y="285.0" width="306.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="62.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Масштабування 1:N:</text>
<rect x="60.0" y="311.0" width="290.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="205.0" y="330.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Важке: додавання нового споживача вимагає правки коду відправника</tspan></text>
<rect x="390.0" y="20.0" width="360.0" height="370.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="570.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Черга повідомлень (Point-to-Point)</text>
<rect x="402.0" y="75.0" width="336.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="412.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Простір:</text>
<rect x="410.0" y="101.0" width="320.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="570.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Частковий: знають ім'я черги, але не мережеву адресу одне одного</tspan></text>
<rect x="402.0" y="145.0" width="336.0" height="62.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="412.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Час:</text>
<rect x="410.0" y="171.0" width="320.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="570.0" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Розв'язано: черга зберігає повідомлення, якщо споживач офлайн</tspan></text>
<rect x="402.0" y="215.0" width="336.0" height="62.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="412.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Синхронізація:</text>
<rect x="410.0" y="241.0" width="320.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="570.0" y="260.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Розв'язано: відправник публікує асинхронно й не чекає обробки</tspan></text>
<rect x="402.0" y="285.0" width="336.0" height="62.0" rx="6" fill="#fef9e7" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="412.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Масштабування 1:N:</text>
<rect x="410.0" y="311.0" width="320.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="570.0" y="330.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Обмежене: 1 повідомлення = 1 споживач (конкурентна обробка)</tspan></text>
<rect x="770.0" y="20.0" width="330.0" height="370.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="935.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Публікація-Підписка (Pub/Sub)</text>
<rect x="782.0" y="75.0" width="306.0" height="62.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="792.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Простір:</text>
<rect x="790.0" y="101.0" width="290.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="935.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Повне розв'язання: видавець не знає кількості й адрес підписників</tspan></text>
<rect x="782.0" y="145.0" width="306.0" height="62.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="792.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Час:</text>
<rect x="790.0" y="171.0" width="290.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="935.0" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Розв'язано: довговічні підписки буферизують події для офлайн-вузлів</tspan></text>
<rect x="782.0" y="215.0" width="306.0" height="62.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="792.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Синхронізація:</text>
<rect x="790.0" y="241.0" width="290.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="935.0" y="260.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Розв'язано: подійне сповіщення (push/pull) без блокування видавця</tspan></text>
<rect x="782.0" y="285.0" width="306.0" height="62.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="792.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Масштабування 1:N:</text>
<rect x="790.0" y="311.0" width="290.0" height="32.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="935.0" y="330.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Ідеальне (Fan-out): 1 публікація транслюється M незалежним службам</tspan></text>
<rect x="40.0" y="405.0" width="1060.0" height="55.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.3"/><text x="570.0" y="435.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Підсумок: Pub/Sub розриває всі три залежності водночас. Видавець транслює факт події, а брокер бере на себе просторову маршрутизацію, буферизацію в часі та доставку багатьом споживачам.</tspan></text>
</svg>