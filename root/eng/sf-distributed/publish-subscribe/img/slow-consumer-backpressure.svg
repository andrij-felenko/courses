<text x="240.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Публікація</text>
<rect x="280.0" y="40.0" width="360.0" height="420.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="460.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Pub/Sub Брокер (Fan-out Engine)</text>
<rect x="300.0" y="100.0" width="320.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="315.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Буфер підписки А (Швидкий)</text>
<rect x="315.0" y="140.0" width="290.0" height="22.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<rect x="315.0" y="140.0" width="35.0" height="22.0" rx="3" fill="#27ae60" stroke="none" stroke-width="1.5"/>
<text x="360.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Заповнення: 10% (100 / 1000 msg) — стан стабільний</text>
<text x="315.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">Вихідний потік: 10 000 msg/s (черга порожня)</text>
<rect x="300.0" y="260.0" width="320.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="315.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Буфер підписки B (Повільний споживач!)</text>
<rect x="315.0" y="300.0" width="290.0" height="24.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<rect x="315.0" y="300.0" width="290.0" height="24.0" rx="3" fill="#c0392b" stroke="none" stroke-width="1.5"/>
<text x="460.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">ПЕРЕПОВНЕНО 1000 / 1000 (OOM Risk!)</text>
<text x="315.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Стратегії розв'язання кризи буфера:</text>
<text x="315.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">1. Drop-oldest / Drop-newest (втрата даних)</text>
<text x="315.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">2. Backpressure (зупиняє видавця і всіх інших!)</text>
<text x="315.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">3. DLQ / Скидання на диск (ізоляція збою)</text>
<line x1="640.0" y1="155.0" x2="730.0" y2="155.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="685.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">push/pull</text>
<line x1="640.0" y1="340.0" x2="730.0" y2="340.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="685.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">деградація</text>
<rect x="730.0" y="100.0" width="370.0" height="110.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.3"/>
<text x="750.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Споживач A: Сервіс балансів</text>
<text x="750.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Пропускна здатність: μ_A = 12 000 msg/s</text>
<text x="750.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Затримка: &lt; 2 мс (встигає за видавцем)</text>
<rect x="730.0" y="280.0" width="370.0" height="150.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="750.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Споживач B: Експорт у PDF / CRM</text>
<text x="750.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Пропускна здатність: μ_B = 200 msg/s (блокування БД)</text>
<text x="750.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">Відставання: зростає зі швидкістю 9 800 msg/s!</text>
<text x="750.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Наслідок: вичерпання RAM брокера або drop</text>
</svg>