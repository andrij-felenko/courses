<rect x="40.0" y="160.0" width="160.0" height="140.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/>
<text x="120.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Видавець</text>
<text x="120.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Платіжний шлюз)</text>
<rect x="53.0" y="249.2" width="134.1" height="31.5" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="120.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">λ = 10 000 msg/s</tspan></text>
