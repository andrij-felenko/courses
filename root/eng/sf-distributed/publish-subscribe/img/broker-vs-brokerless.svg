<rect x="605.0" y="220.0" width="485.0" height="210.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="847.5" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="847.5" dy="0.0">Властивості безброкерної топології:</tspan><tspan x="847.5" dy="11.7"></tspan><tspan x="847.5" dy="11.7">• Ультранизька затримка: пряма доставка сокет-у-сокет (мікросекунди).</tspan><tspan x="847.5" dy="11.7">• Немає центральної точки відмови або посередника.</tspan><tspan x="847.5" dy="11.7">• Трафік видавця зростає лінійно з кількістю клієнтів (якщо unicast).</tspan><tspan x="847.5" dy="11.7">• Складність: динамічне виявлення пірів (discovery), втрата повідомлень при офлайні.</tspan></text>
</svg>