<rect x="50.0" y="220.0" width="485.0" height="210.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="292.5" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="292.5" dy="0.0">Властивості брокерної топології:</tspan><tspan x="292.5" dy="11.7"></tspan><tspan x="292.5" dy="11.7">• Мережевий трафік видавця мінімальний: рівно 1 копія в мережу.</tspan><tspan x="292.5" dy="11.7">• Розмноження (fan-out) і фільтрацію бере на себе брокер.</tspan><tspan x="292.5" dy="11.7">• Довговічність (durable subscriptions): брокер тримає черги для офлайн-вузлів.</tspan><tspan x="292.5" dy="11.7">• Ціна: додатковий хоп мережі (латентність +1..5 мс), брокер є вузьким місцем CPU/RAM.</tspan></text>
