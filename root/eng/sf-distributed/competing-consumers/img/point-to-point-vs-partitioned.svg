<rect x="50.0" y="280.0" width="480.0" height="150.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="290.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Властивості Point-to-Point моделі:</tspan><tspan x="290.0" dy="13.0">• Одиниця роздачі — Окреме повідомлення.</tspan><tspan x="290.0" dy="13.0">• Балансування — Динамічне: швидкі воркери забирають більше задач.</tspan><tspan x="290.0" dy="13.0">• Масштабування — Необмежене: додавання 5-го воркера миттєво піднімає throughput.</tspan><tspan x="290.0" dy="13.0">• Порядок — Строгий FIFO руйнується при паралельній обробці.</tspan><tspan x="290.0" dy="13.0">• Ціна — Витрати брокера на стан кожного In-Flight повідомлення.</tspan></text>
<rect x="590.0" y="30.0" width="520.0" height="420.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="850.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Partitioned Log (Apache Kafka / Pulsar)</text>
