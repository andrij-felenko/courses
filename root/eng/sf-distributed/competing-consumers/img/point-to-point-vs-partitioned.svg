<text x="870.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✖</text>
<rect x="610.0" y="280.0" width="480.0" height="150.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="850.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Властивості Partitioned Log моделі:</tspan><tspan x="850.0" dy="13.0">• Одиниця роздачі — Ціла партиція (Partition).</tspan><tspan x="850.0" dy="13.0">• Стеля масштабування — Max воркерів = Кількість партицій (4-й воркер простоює).</tspan><tspan x="850.0" dy="13.0">• Балансування — Статичне: важка партиція перевантажує одного споживача.</tspan><tspan x="850.0" dy="13.0">• Порядок — Строгий порядок у межах кожного ключа/партиції.</tspan><tspan x="850.0" dy="13.0">• Ціна — Мінімальна: брокер зберігає лише числовий offset консюмер-групи.</tspan></text>
<rect x="30.0" y="460.0" width="1080.0" height="30.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.2"/><text x="570.0" y="478.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Ключова різниця: черга конкуруючих споживачів розподіляє окремі задачі (дрібне зерно), а журнал партицій — цілі потоки даних.</tspan></text>
</svg>