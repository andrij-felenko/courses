<rect x="620.0" y="130.0" width="230.0" height="28.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Партиція 1 [M1, M4, M7]</tspan></text>
