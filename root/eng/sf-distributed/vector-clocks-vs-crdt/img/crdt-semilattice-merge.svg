<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="440.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><rect x="157.0" y="12.0" width="506.1" height="36.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="35.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Об'єднавча напівґратка (Join-Semilattice) у CvRDT</tspan></text><rect x="155.0" y="336.2" width="150.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Початковий стан ⊥</tspan><tspan x="230.0" dy="15.6">s₀ = { A: 0, B: 0 }</tspan></text><rect x="45.5" y="185.1" width="149.0" height="49.9" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="120.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Вузол A: стан s₁</tspan><tspan x="120.0" dy="16.9">{ A: 3, B: 1 }</tspan></text><rect x="265.5" y="185.1" width="149.0" height="49.9" rx="6" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="340.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Вузол B: стан s₂</tspan><tspan x="340.0" dy="16.9">{ A: 1, B: 4 }</tspan></text><rect x="66.9" y="46.6" width="326.3" height="66.8" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/><text x="230.0" y="67.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Точна верхня межа (LUB)</tspan><tspan x="230.0" dy="16.9">s₁ ⊔ s₂ = { A: max(3,1), B: max(1,4) }</tspan><tspan x="230.0" dy="16.9">= { A: 3, B: 4 }</tspan></text><line x1="190.0" y1="335.0" x2="140.0" y2="235.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><text x="125.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">s₀ ⊑ s₁</text><line x1="270.0" y1="335.0" x2="320.0" y2="235.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><text x="335.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">s₀ ⊑ s₂</text><line x1="150.0" y1="185.0" x2="190.0" y2="112.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><text x="130.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">s₁ ⊑ (s₁ ⊔ s₂)</text><line x1="310.0" y1="185.0" x2="270.0" y2="112.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><text x="330.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">s₂ ⊑ (s₁ ⊔ s₂)</text><rect x="470.0" y="60.0" width="330.0" height="350.0" rx="8" fill="#fcfcfc" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгебраїчні закони злиття (⊔)</text><line x1="485.0" y1="102.0" x2="785.0" y2="102.0" stroke="#6b7280" stroke-width="1.0"/><text x="500.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1. Комутативність (Commutativity):</text><text x="520.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">x ⊔ y = y ⊔ x</text><text x="520.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Порядок прибуття пакетів не має значення</text><text x="500.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">2. Асоціативність (Associativity):</text><text x="520.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">(x ⊔ y) ⊔ z = x ⊔ (y ⊔ z)</text><text x="520.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Групування пакетів не впливає на результат</text><text x="500.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">3. Ідемпотентність (Idempotence):</text><text x="520.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">x ⊔ x = x</text><text x="520.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Дублікати повідомлень та повтори безпечні</text><line x1="485.0" y1="325.0" x2="785.0" y2="325.0" stroke="#e0e0e0" stroke-width="1.0"/><text x="500.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Монотонне зростання:</text><text x="500.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Стан системи в часі лише зростає вздовж ⊑,</text><text x="500.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">гарантуючи детерміновану збіжність (SEC).</text>
</svg>