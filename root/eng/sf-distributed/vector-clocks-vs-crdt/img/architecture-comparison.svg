<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="440.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><rect x="157.0" y="12.0" width="506.1" height="36.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="35.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Архітектурний конвеєр: Векторні годинники vs CRDT</tspan></text><rect x="20.0" y="65.0" width="370.0" height="355.0" rx="8" fill="#fcfcfc" stroke="#2457d6" stroke-width="1.5"/><text x="205.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Конвеєр векторних годинників (Dynamo / Riak)</text><line x1="35.0" y1="105.0" x2="375.0" y2="105.0" stroke="#cce5ff" stroke-width="1.0"/><rect x="69.6" y="107.3" width="270.8" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Клієнтський запис payload + Vector Clock</tspan><tspan x="205.0" dy="14.3">VC = [A:1, B:0]</tspan></text><line x1="205.0" y1="150.0" x2="205.0" y2="170.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="75.9" y="169.3" width="258.3" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="188.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Реплікація та виявлення конкурентності</tspan><tspan x="205.0" dy="14.3">VC₁ ≰ VC₂ та VC₂ ≰ VC₁ → Конфлікт (∥)</tspan></text><line x1="205.0" y1="218.0" x2="205.0" y2="238.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="69.6" y="242.3" width="270.8" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Розгалуження версій (Siblings explosion)</tspan><tspan x="205.0" dy="14.3">База даних зберігає обидві гілки</tspan></text><line x1="205.0" y1="288.0" x2="205.0" y2="308.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="51.8" y="325.2" width="306.4" height="59.6" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/><text x="205.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Ручне злиття в коді застосунку</tspan><tspan x="205.0" dy="14.3">(Клієнт або сервіс вирішує бізнес-конфлікт</tspan><tspan x="205.0" dy="14.3">і надсилає новий спільний вектор)</tspan></text><rect x="420.0" y="65.0" width="380.0" height="355.0" rx="8" fill="#fcfcfc" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Конвеєр CRDT (Automerge / Yjs / Redis-CRDT)</text><line x1="435.0" y1="105.0" x2="785.0" y2="105.0" stroke="#c3e6cb" stroke-width="1.0"/><rect x="474.6" y="107.3" width="270.8" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Локальна монотонна мутація CRDT</tspan><tspan x="610.0" dy="14.3">(стан переходить у новий елемент ґратки)</tspan></text><line x1="610.0" y1="150.0" x2="610.0" y2="175.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="484.0" y="177.3" width="252.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Асинхронне поширення стану / дельти</tspan><tspan x="610.0" dy="14.3">(мережевий порядок пакетів довільний)</tspan></text><line x1="610.0" y1="222.0" x2="610.0" y2="248.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="505.9" y="252.3" width="208.1" height="45.3" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Автоматичне алгебраїчне злиття</tspan><tspan x="610.0" dy="14.3">s_merged = s_local ⊔ s_remote</tspan></text><line x1="610.0" y1="298.0" x2="610.0" y2="325.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="460.2" y="330.2" width="299.6" height="59.6" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Гарантована детермінована збіжність (SEC)</tspan><tspan x="610.0" dy="14.3">Нуль конфліктів для бізнес-коду,</tspan><tspan x="610.0" dy="14.3">стан усіх реплік 100% ідентичний</tspan></text>
</svg>