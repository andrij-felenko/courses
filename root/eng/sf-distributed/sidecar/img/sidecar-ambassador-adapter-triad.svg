<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріада архітектурних шаблонів: Sidecar, Ambassador та Adapter</text>
<rect x="30.0" y="55.0" width="300.0" height="500.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<text x="180.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">1. SIDECAR (Помічник)</text>
<text x="180.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розширення функціональності без змін</text>
<rect x="75.0" y="128.3" width="210.0" height="43.3" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Основний застосунок</tspan><tspan x="180.0" dy="14.3">(Пише логи у файл)</tspan></text>
<line x1="180.0" y1="185.0" x2="180.0" y2="225.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">emptyDir (/var/log)</text>
<rect x="75.0" y="238.3" width="210.0" height="43.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Sidecar Container</tspan><tspan x="180.0" dy="14.3">(Fluentbit / Log Agent)</tspan></text>
<line x1="180.0" y1="295.0" x2="180.0" y2="335.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">HTTPS / TLS Batch</text>
<rect x="75.0" y="348.4" width="210.0" height="43.3" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="180.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Централізований кластер</tspan><tspan x="180.0" dy="14.3">(Elasticsearch / Loki)</tspan></text>
<rect x="50.0" y="446.5" width="260.0" height="67.0" rx="6" fill="#fffdfa" stroke="#fcd34d" stroke-width="1.5"/><text x="180.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Ключова роль:</tspan><tspan x="180.0" dy="13.0">Паралельне виконання задач:</tspan><tspan x="180.0" dy="13.0">збір логів, ротація сертифікатів,</tspan><tspan x="180.0" dy="13.0">синхронізація файлів конфігурації.</tspan></text>
<rect x="350.0" y="55.0" width="300.0" height="500.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="500.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. AMBASSADOR (Посол)</text>
<text x="500.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Проксування вихідного трафіку</text>
<rect x="395.0" y="128.3" width="210.0" height="43.3" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Основний застосунок</tspan><tspan x="500.0" dy="14.3">(Клієнт HTTP :5000)</tspan></text>
<line x1="500.0" y1="185.0" x2="500.0" y2="225.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">127.0.0.1:5000 (lo)</text>
<rect x="395.0" y="231.2" width="210.0" height="57.6" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Ambassador Proxy</tspan><tspan x="500.0" dy="14.3">(Envoy / gRPC Bridge)</tspan><tspan x="500.0" dy="14.3">Ретраї, Discovery, mTLS</tspan></text>
<line x1="500.0" y1="295.0" x2="500.0" y2="335.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">mTLS / Sharded RPC</text>
<rect x="395.0" y="348.4" width="210.0" height="43.3" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Зовнішній шар сервісів</tspan><tspan x="500.0" dy="14.3">(Шардована БД / API)</tspan></text>
<rect x="370.0" y="446.5" width="260.0" height="67.0" rx="6" fill="#f0f7ff" stroke="#93c5fd" stroke-width="1.5"/><text x="500.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Ключова роль:</tspan><tspan x="500.0" dy="13.0">Приховує складність зовнішньої</tspan><tspan x="500.0" dy="13.0">мережі: роутинг, шардування,</tspan><tspan x="500.0" dy="13.0">автентифікація, розрив ланцюгів.</tspan></text>
<rect x="670.0" y="55.0" width="300.0" height="500.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="820.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. ADAPTER (Адаптер)</text>
<text x="820.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стандартизація вхідного інтерфейсу</text>
<rect x="715.0" y="128.3" width="210.0" height="43.3" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Сервер моніторингу</tspan><tspan x="820.0" dy="14.3">(Prometheus Scraper)</tspan></text>
<line x1="820.0" y1="185.0" x2="820.0" y2="225.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="820.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">GET /metrics (OpenMetrics)</text>
<rect x="705.3" y="231.2" width="229.4" height="57.6" rx="6" fill="#d1fae5" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Adapter Container</tspan><tspan x="820.0" dy="14.3">(JMX / Status Exporter)</tspan><tspan x="820.0" dy="14.3">Трансляція у стандартний формат</tspan></text>
<line x1="820.0" y1="295.0" x2="820.0" y2="335.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="820.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">lo: JMX / /custom_stat</text>
<rect x="715.0" y="348.4" width="210.0" height="43.3" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Legacy / Нетиповий сервіс</tspan><tspan x="820.0" dy="14.3">(Внутрішній бінарний формат)</tspan></text>
<rect x="690.0" y="446.5" width="260.0" height="67.0" rx="6" fill="#f2fbf6" stroke="#86efac" stroke-width="1.5"/><text x="820.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Ключова роль:</tspan><tspan x="820.0" dy="13.0">Приводить різнорідні інтерфейси</tspan><tspan x="820.0" dy="13.0">до єдиного корпоративного стандарту</tspan><tspan x="820.0" dy="13.0">без модифікації самого коду.</tspan></text>
</svg>