<text x="524.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c07000" text-anchor="start" font-weight="700">ЗЛАМАЛО інваріант</text>
<rect x="175.3" y="326.8" width="369.4" height="46.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="360.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">інваріант із доведення → assert на межі ітерації:</tspan><tspan x="360.0" dy="15.0">падає точно там, де припущення вперше зламалося</tspan></text>
