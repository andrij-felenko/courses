<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інваріант циклу: три кроки доведення коректності</text>
<text x="130.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1 · ІНІЦІАЛІЗАЦІЯ</text>
<rect x="35.0" y="119.3" width="190.0" height="61.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="130.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">інваріант істинний</tspan><tspan x="130.0" dy="15.0">ПЕРЕД першою</tspan><tspan x="130.0" dy="15.0">ітерацією</tspan></text>
<text x="130.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">база індукції</text>
<text x="380.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c07000" text-anchor="middle" font-weight="700">2 · ЗБЕРЕЖЕННЯ</text>
<rect x="285.0" y="119.3" width="190.0" height="61.4" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="2.0"/><text x="380.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">якщо істинний перед</tspan><tspan x="380.0" dy="15.0">ітерацією — лишається</tspan><tspan x="380.0" dy="15.0">істинним і після</tspan></text>
<text x="380.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">крок індукції</text>
<text x="630.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3 · ЗАВЕРШЕННЯ</text>
<rect x="535.0" y="119.3" width="190.0" height="61.4" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.0"/><text x="630.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">інваріант + умова</tspan><tspan x="630.0" dy="15.0">виходу = потрібний</tspan><tspan x="630.0" dy="15.0">результат</tspan></text>
<text x="630.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">висновок</text>
<line x1="225.0" y1="150.0" x2="285.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475.0" y1="150.0" x2="535.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="158.0" y="276.2" width="444.1" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="380.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">доведено всі три → інваріант істинний на КОЖНІЙ ітерації,</tspan><tspan x="380.0" dy="15.6">а на виході дає коректний результат</tspan></text>
<text x="380.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">це математична індукція, перенесена на цикл</text>
</svg>