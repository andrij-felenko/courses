<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структурна анатомія промислового бюлетеня випуску</text>
<rect x="60.0" y="50.0" width="1060.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="590.0" y="78.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">1. Метадані випуску (Версія SemVer, Дата, Цільова платформа, Мінімальний бутлоадер)</tspan></text>
<rect x="60.0" y="116.0" width="1060.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="590.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">2. Головні підсумки (Highlights: 2–3 ключові зміни, що визначають мету релізу)</tspan></text>
<rect x="60.0" y="170.0" width="1060.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="590.0" y="203.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">3. ДІЇ ТА ЛАМКІ ЗМІНИ (Breaking Changes &amp; Action Required — червона зона для оператора)</tspan></text>
<rect x="60.0" y="236.0" width="1060.0" height="54.0" rx="6" fill="#fef8e7" stroke="#d97706" stroke-width="2.0"/><text x="590.0" y="267.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">4. Матриця сумісності та відкату (Rollback safety: чи дозволено даунгрейд Flash/NVM)</tspan></text>
<rect x="60.0" y="298.0" width="1060.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="328.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">5. Деталізований журнал компонентів (Firmware Core, Drivers, Network Stack, UI)</tspan><tspan x="590.0" dy="16.2">   • Нові можливості (Features)</tspan><tspan x="590.0" dy="16.2">   • Виправлення дефектів (Bug Fixes)</tspan></text>
<rect x="60.0" y="390.0" width="1060.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="590.0" y="423.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">6. Бюлетені безпеки (Security Advisories: CVE, CVSS, пом'якшення без експлойт-інструкцій)</tspan></text>
<rect x="60.0" y="456.0" width="1060.0" height="50.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.8"/><text x="590.0" y="485.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">7. Таблиця артефактів (Імена файлів, контрольні суми SHA-256, підписи SBOM)</tspan></text>
<rect x="60.0" y="516.0" width="1060.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="545.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Принцип побудови: від критичних ризиків і дій (зверху) до технічних деталей і гешів (знизу).</tspan></text>
</svg>