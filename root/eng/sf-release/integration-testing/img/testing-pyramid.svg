<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1131 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1131" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Піраміда тестування у вбудованих системах</text>
<rect x="150.0" y="74.6" width="580.0" height="70.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="440.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Фізичний кремній: стенди HIL</tspan><tspan x="440.0" dy="16.9">Реальні плати, кероване живлення, реле, логічні аналізатори</tspan><tspan x="440.0" dy="16.9">Час: 10–60 с/тест · Охоплення: кремній, таймінги, електрика</tspan></text>
<rect x="100.0" y="194.6" width="680.0" height="70.8" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="2.0"/><text x="440.0" y="217.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Емуляція та симуляція: Renode, QEMU, Arm FVP</tspan><tspan x="440.0" dy="16.9">Цільовий бінарник ARM/RISC-V, віртуальна периферія та датчики</tspan><tspan x="440.0" dy="16.9">Час: 50–500 мс/тест · Охоплення: регістри, переривання, драйвери</tspan></text>
<rect x="50.0" y="324.6" width="780.0" height="70.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="440.0" y="347.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Хостові модульні тести (x86 / Native)</tspan><tspan x="440.0" dy="16.9">Чиста бізнес-логіка, кінцеві автомати, моки HAL, ASan / UBSan</tspan><tspan x="440.0" dy="16.9">Час: &lt; 1 мс/тест · Охоплення: алгоритми, парсери, обробка помилок</tspan></text>
<line x1="890.0" y1="420.0" x2="890.0" y2="70.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="890.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратна точність та реалізм</text>
<text x="890.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Абстрактні припущення</text>
<line x1="990.0" y1="70.0" x2="990.0" y2="420.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="990.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Швидкість і спостережуваність</text>
<text x="990.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Детермінізм, ASan, швидкий зворотний зв'язок</text>
<text x="540.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Основа піраміди дає миттєву діагностику логіки; вершина підтверджує фізичну поведінку кремнію.</text>
</svg>