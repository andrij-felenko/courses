<text x="540.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керівний комп'ютер повністю контролює фізичне середовище, шини даних та живлення цільового чипа.</text>
