<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна архітектура автоматизованого стенду HIL</text>
<rect x="60.0" y="198.6" width="240.0" height="82.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="180.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Керівний хост (CI / Pytest)</tspan><tspan x="180.0" dy="15.6">• Запуск тестових сценаріїв</tspan><tspan x="180.0" dy="15.6">• Прошивання бінарника (ELF)</tspan><tspan x="180.0" dy="15.6">• Аналіз телеметрії та звіт</tspan></text>
<rect x="395.0" y="89.3" width="290.0" height="41.3" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="540.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Кероване джерело живлення</tspan><tspan x="540.0" dy="14.3">Просідання напруги, brownout, 3.3 В / 5 В</tspan></text>
<rect x="395.0" y="179.3" width="290.0" height="41.3" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="540.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Апаратний налагоджувач (SWD / JTAG)</tspan><tspan x="540.0" dy="14.3">Прошивання Flash, контроль RTT / ITM</tspan></text>
<rect x="395.0" y="269.4" width="290.0" height="41.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Матриця реле й інжекції відмов</tspan><tspan x="540.0" dy="14.3">Розрив ліній, КЗ на GND, імітація брязкоту</tspan></text>
<rect x="390.9" y="359.4" width="298.1" height="41.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Аналізатор протоколів (CAN / SPI / I2C)</tspan><tspan x="540.0" dy="14.3">Захоплення пакетів, валідація CRC і таймінгів</tspan></text>
<rect x="790.0" y="198.6" width="240.0" height="82.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="910.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Цільовий пристрій (DUT)</tspan><tspan x="910.0" dy="15.6">• Реальний мікроконтролер</tspan><tspan x="910.0" dy="15.6">• Сенсори та трансивери</tspan><tspan x="910.0" dy="15.6">• Робоча друкована плата</tspan></text>
