<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сліпа зона хостових моків проти поведінки кремнію</text>
<rect x="40.0" y="70.0" width="470.0" height="370.0" rx="8" fill="#f9fbfe" stroke="#2457d6" stroke-width="1.8"/>
<text x="275.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Хостовий запуск (x86 + Мок HAL)</text>
<rect x="70.0" y="128.2" width="410.0" height="43.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="275.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Функція викликає HAL_SPI_Transmit_DMA()</tspan><tspan x="275.0" dy="15.6">Буфер лежить на локальному стеку</tspan></text>
<rect x="70.0" y="208.2" width="410.0" height="43.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="275.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Мок миттєво копіює байти й повертає HAL_OK</tspan><tspan x="275.0" dy="15.6">Стек валідний, виконання завершується успішно</tspan></text>
<rect x="70.0" y="287.1" width="410.0" height="45.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="275.0" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">Результат: ТЕСТ ЗЕЛЕНИЙ (&lt; 1 мс)</tspan><tspan x="275.0" dy="16.9">Ілюзія повної працездатності</tspan></text>
<line x1="275.0" y1="180.0" x2="275.0" y2="205.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="275.0" y1="260.0" x2="275.0" y2="285.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="570.0" y="70.0" width="470.0" height="370.0" rx="8" fill="#fdfaf9" stroke="#c0392b" stroke-width="1.8"/>
<text x="805.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Реальний чип (Cortex-M7 + Контролер DMA)</text>
<rect x="600.0" y="128.2" width="410.0" height="43.6" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="805.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Контролер DMA запускається асинхронно</tspan><tspan x="805.0" dy="15.6">Процесор виходить із функції та звільняє стек</tspan></text>
<rect x="600.0" y="208.2" width="410.0" height="43.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="805.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Інша задача перезаписує пам'ять стека;</tspan><tspan x="805.0" dy="15.6">D-Cache не скинуто у SRAM перед транзакцією</tspan></text>
<rect x="600.0" y="287.1" width="410.0" height="45.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="805.0" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Результат: Пошкодження даних або HardFault</tspan><tspan x="805.0" dy="16.9">Асинхронний збій під час передачі по шині SPI</tspan></text>
<line x1="805.0" y1="180.0" x2="805.0" y2="205.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="805.0" y1="260.0" x2="805.0" y2="285.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мок не враховує асинхронний час роботи шини, кеш-когерентність і реальний життєвий цикл пам'яті.</text>
</svg>