<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ескалація дефектів донизу: перенесення знань із HIL на хост</text>
<rect x="60.0" y="178.4" width="220.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="170.0" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">1. Збій на HIL</tspan><tspan x="170.0" dy="15.6">Помилка CRC на шині SPI</tspan><tspan x="170.0" dy="15.6">під час зміни живлення</tspan></text>
<rect x="340.0" y="178.4" width="220.0" height="63.2" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.8"/><text x="450.0" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">2. Модель у Renode</tspan><tspan x="450.0" dy="15.6">Додано емуляцію затримки</tspan><tspan x="450.0" dy="15.6">відповіді датчика</tspan></text>
<rect x="620.0" y="178.4" width="220.0" height="63.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="730.0" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">3. Тест на хості</tspan><tspan x="730.0" dy="15.6">Мок емулює таймаут</tspan><tspan x="730.0" dy="15.6">і перевіряє відновлення</tspan></text>
<rect x="875.0" y="178.4" width="170.0" height="63.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="960.0" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">4. Захист у CI</tspan><tspan x="960.0" dy="15.6">Перевірка за &lt; 1 с</tspan><tspan x="960.0" dy="15.6">на кожен комміт</tspan></text>
<line x1="290.0" y1="210.0" x2="330.0" y2="210.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="210.0" x2="610.0" y2="210.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="850.0" y1="210.0" x2="865.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="140.0" y="340.0" width="800.0" height="70.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.6"/>
<text x="540.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило: кожен дефект із HIL спускають до рівня симуляції та хостового моку,</text>
<text x="540.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">щоб регресія ловилася за мілісекунди на машині розробника, не чекаючи залізного стенду.</text>
</svg>