<text x="500.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат життєвого циклу Argo Rollouts Blue-Green</text>
<text x="500.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат Blue-Green розгортання в Argo Rollouts</text>
<rect x="26.5" y="75.0" width="207.0" height="69.9" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.6"/><text x="130.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">1. Ініціалізація Green</tspan><tspan x="130.0" dy="14.3">(Provisioning)</tspan><tspan x="130.0" dy="14.3">Створення нового ReplicaSet</tspan><tspan x="130.0" dy="14.3">Масштабування реплік до 100%</tspan></text>
<rect x="252.9" y="75.0" width="234.2" height="69.9" rx="6" fill="#fff9e6" stroke="#d97706" stroke-width="1.6"/><text x="370.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">2. Зондування Preview</tspan><tspan x="370.0" dy="14.3">(Smoke &amp; Warmup)</tspan><tspan x="370.0" dy="14.3">Спрямування тестового трафіку</tspan><tspan x="370.0" dy="14.3">на preview-service; прогрів кешу</tspan></text>
<rect x="523.1" y="75.0" width="213.8" height="69.9" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.6"/><text x="630.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">3. Pre-Promotion аналіз</tspan><tspan x="630.0" dy="14.3">(SLI Verification)</tspan><tspan x="630.0" dy="14.3">Перевірка частоти помилок,</tspan><tspan x="630.0" dy="14.3">затримок та метрик Prometheus</tspan></text>
<rect x="766.5" y="75.0" width="207.0" height="69.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/><text x="870.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">4. Просування (Promoted)</tspan><tspan x="870.0" dy="14.3">(Active Switch)</tspan><tspan x="870.0" dy="14.3">Active Service переключає</tspan><tspan x="870.0" dy="14.3">селектор на новий ReplicaSet</tspan></text>
<rect x="769.9" y="275.1" width="200.1" height="69.9" rx="6" fill="#fff9e6" stroke="#d97706" stroke-width="1.6"/><text x="870.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">5. Період вистоювання</tspan><tspan x="870.0" dy="14.3">(scaleDownDelay / Soak)</tspan><tspan x="870.0" dy="14.3">Старий ReplicaSet активний</tspan><tspan x="870.0" dy="14.3">в режимі очікування відкату</tspan></text>
<rect x="372.6" y="275.1" width="254.7" height="69.9" rx="6" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.6"/><text x="500.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">6. Фінал або Відкат</tspan><tspan x="500.0" dy="14.3">(Decommission / Rollback)</tspan><tspan x="500.0" dy="14.3">Успіх: scaleDown старого до 0</tspan><tspan x="500.0" dy="14.3">Аномалія: миттєвий відкат селектора</tspan></text>
