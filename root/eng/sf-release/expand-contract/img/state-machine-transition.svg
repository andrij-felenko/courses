<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат життєвого циклу елемента API: від створення до вилучення</text>
<rect x="60.0" y="180.0" width="200.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="160.0" y="203.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1. СТАБІЛЬНИЙ (v1)</tspan><tspan x="160.0" dy="15.6">Основний контракт,</tspan><tspan x="160.0" dy="15.6">100% активного трафіку</tspan></text>
<rect x="350.0" y="180.0" width="220.0" height="70.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.8"/><text x="460.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">2. РОЗШИРЕНИЙ (v1 + v2)</tspan><tspan x="460.0" dy="14.3">Новий контракт опубліковано,</tspan><tspan x="460.0" dy="14.3">активні обидві версії</tspan></text>
<rect x="660.0" y="180.0" width="220.0" height="70.0" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.8"/><text x="770.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">3. ЗАСТАРІЛИЙ (DEPRECATED)</tspan><tspan x="770.0" dy="14.3">v1 позначено застарілим,</tspan><tspan x="770.0" dy="14.3">Sunset заголовок, телеметрія</tspan></text>
<rect x="970.0" y="180.0" width="160.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1050.0" y="203.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">4. ВИЛУЧЕНИЙ</tspan><tspan x="1050.0" dy="15.6">v1 стерто з коду,</tspan><tspan x="1050.0" dy="15.6">трафік v1 = 0</tspan></text>
<line x1="263.0" y1="215.0" x2="347.0" y2="215.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="305.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Expand</text>
<line x1="573.0" y1="215.0" x2="657.0" y2="215.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="615.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Deprecate</text>
<line x1="883.0" y1="215.0" x2="967.0" y2="215.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="925.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Contract</text>
<line x1="660.0" y1="265.0" x2="260.0" y2="265.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="460.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Аварійний відкат: виявлено регресію у v2 → повернення трафіку на v1</text>
<rect x="60.0" y="335.0" width="1070.0" height="145.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="595.0" y="372.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Критерії та захисні гейти для переходів між станами:</tspan><tspan x="595.0" dy="15.6"></tspan><tspan x="595.0" dy="15.6">• Перехід 1 → 2 (Expand): додавання нових полів/методів як необов'язкових (non-breaking, мінорний реліз SemVer).</tspan><tspan x="595.0" dy="15.6">• Перехід 2 → 3 (Deprecate): публікація дат застарівання, заголовків Sunset/Deprecation та початок аудиту клієнтів.</tspan><tspan x="595.0" dy="15.6">• Перехід 3 → 4 (Contract): дозволений ТІЛЬКИ тоді, коли показник metrics_legacy_calls_total == 0 за повний бізнес-цикл.</tspan><tspan x="595.0" dy="15.6">• Зворотність: доки система перебуває у стані 2 або 3, будь-який збій утилізує v1 як безпечну подушку відкату.</tspan></text>
</svg>