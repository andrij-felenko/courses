<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка міграції стану: подвійний запис, фоновий бекфіл і перемикання читань</text>
<rect x="40.0" y="70.0" width="255.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="167.5" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.5" dy="0.0">1. Додавання нової схеми</tspan></text>
<rect x="40.0" y="118.0" width="255.0" height="190.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="167.5" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">Створення колонки / таблиці B</tspan><tspan x="167.5" dy="15.6">(nullable, без обмежень)</tspan><tspan x="167.5" dy="15.6"></tspan><tspan x="167.5" dy="15.6">• Старий код пише і читає A</tspan><tspan x="167.5" dy="15.6">• Сховище готове приймати B</tspan></text>
<rect x="325.0" y="70.0" width="255.0" height="40.0" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.8"/><text x="452.5" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="452.5" dy="0.0">2. Подвійний запис</tspan></text>
<rect x="325.0" y="118.0" width="255.0" height="190.0" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="1.4"/><text x="452.5" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="452.5" dy="0.0">Застосунок пише в A і B</tspan><tspan x="452.5" dy="15.6">(атомарно або через Outbox)</tspan><tspan x="452.5" dy="15.6"></tspan><tspan x="452.5" dy="15.6">• Нові мутації йдуть у B</tspan><tspan x="452.5" dy="15.6">• Читання все ще з A</tspan></text>
<rect x="610.0" y="70.0" width="255.0" height="40.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.8"/><text x="737.5" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="737.5" dy="0.0">3. Фоновий бекфіл</tspan></text>
<rect x="610.0" y="118.0" width="255.0" height="190.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="737.5" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Пакетний воркер копіює</tspan><tspan x="737.5" dy="15.6">історичні записи з A в B</tspan><tspan x="737.5" dy="15.6"></tspan><tspan x="737.5" dy="15.6">• Умовний запис (без затирання)</tspan><tspan x="737.5" dy="15.6">• Досягнення збіжності A ≡ B</tspan></text>
<rect x="895.0" y="70.0" width="255.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1022.5" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1022.5" dy="0.0">4. Перемикання й очищення</tspan></text>
<rect x="895.0" y="118.0" width="255.0" height="190.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="1022.5" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1022.5" dy="0.0">Читання перемикається на B</tspan><tspan x="1022.5" dy="15.6">Зупинка запису в A</tspan><tspan x="1022.5" dy="15.6"></tspan><tspan x="1022.5" dy="15.6">• Видалення колонки A</tspan><tspan x="1022.5" dy="15.6">• Чистий стан схеми B</tspan></text>
<line x1="298.0" y1="210.0" x2="322.0" y2="210.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="583.0" y1="210.0" x2="607.0" y2="210.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="868.0" y1="210.0" x2="892.0" y2="210.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="330.0" width="1100.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Анатомія захисту від гонки даних під час міграції сховища:</tspan><tspan x="590.0" dy="15.6"></tspan><tspan x="590.0" dy="15.6">1. Подвійний запис обов'язково вмикається ДО запуску фонового бекфілу — щоб не втратити жодної нової мутації.</tspan><tspan x="590.0" dy="15.6">2. Фоновий бекфіл копіює записи пакетами від старіших до новіших і використовує умовний запис (Conditional Update / Version Check),</tspan><tspan x="590.0" dy="15.6">   аби фоновий процес випадково не перезаписав старішим значенням свіжішу мутацію, яку вже зафіксував подвійний запис.</tspan><tspan x="590.0" dy="15.6">3. Перемикання читання здійснюється через динамічний прапорець (Feature Flag) з поступовим зростанням частки 1% → 10% → 100%,</tspan><tspan x="590.0" dy="15.6">   що дозволяє миттєво відкотити читання назад на A у разі виявлення дефекту в новому форматі B.</tspan></text>
</svg>