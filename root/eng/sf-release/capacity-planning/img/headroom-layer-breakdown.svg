<svg xmlns="http://www.w3.org/2000/svg" viewBox="-103.5 -10 1063.5 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-103.5" y="-10" width="1063.5" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="500.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія Headroom: з яких інженерних шарів складається загальна потужність</text>
<rect x="80.0" y="315.0" width="240.0" height="120.0" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="200.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">1. Базове навантаження (Baseline)</text>
<text x="200.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">Постійний нічний/денний мінімум трафіку</text>
<rect x="80.0" y="245.0" width="240.0" height="70.0" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="200.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="700">2. Добові коливання (Diurnal Peak)</text>
<text x="200.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Прогнозований денний пік активності</text>
<rect x="80.0" y="200.0" width="240.0" height="45.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="200.0" y="216.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">3. Дисперсія і спалахи (Burst Factor)</text>
<text x="200.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">Короткі стрибки (акції, розсилки, пуші)</text>
<rect x="80.0" y="125.0" width="240.0" height="75.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="200.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">4. Резерв відмов (N+1 / Multi-AZ)</text>
<text x="200.0" y="174.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Запас на випадання вузла чи цілої зони</text>
<rect x="80.0" y="75.0" width="240.0" height="50.0" rx="0" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="200.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">5. Буфер лагу постачання (Lead Time)</text>
<text x="200.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7e22ce" text-anchor="middle">Запас на час створення нових VM/серверів</text>
<line x1="65.0" y1="435.0" x2="65.0" y2="245.0" stroke="#2563eb" stroke-width="2.0"/>
<text x="55.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="end" font-weight="700">Регулярний попит (60%)</text>
<line x1="65.0" y1="245.0" x2="65.0" y2="75.0" stroke="#dc2626" stroke-width="2.0"/>
<text x="55.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="end" font-weight="700">Динамічний Headroom (40%)</text>
<rect x="360.0" y="75.0" width="560.0" height="50.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.4"/>
<text x="376.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9333ea" text-anchor="start" font-weight="700">5. Час закупівлі й розгортання</text>
<text x="376.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Автоскейлу потрібні 2–5 хв на старт подів і до 10 хв на підйом VM. Без запасу сервіс ляже до появи нод.</text>
<line x1="328.0" y1="100.0" x2="352.0" y2="100.0" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="360.0" y="125.0" width="560.0" height="75.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="376.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">4. Відмовостійкість інфраструктури</text>
<text x="376.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Якщо кластер із 3 вузлів працює на 80%, падіння 1 вузла підніме навантаження на решту до 120% (крах).</text>
<line x1="328.0" y1="162.5" x2="352.0" y2="162.5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="360.0" y="200.0" width="560.0" height="45.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="376.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">3. Мікросплески та флуктуації</text>
<text x="376.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Реальний трафік не є ламінарним: пуш-сповіщення генерують миттєвий 3–5-кратний сплеск на 30–60 секунд.</text>
<line x1="328.0" y1="222.5" x2="352.0" y2="222.5" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="360.0" y="245.0" width="560.0" height="70.0" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="376.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">2. Добова ритміка бізнесу</text>
<text x="376.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Різниця між нічним мінімумом (04:00) та вечірнім піком (20:00) у споживчих сервісах сягає 300–600%.</text>
<line x1="328.0" y1="280.0" x2="352.0" y2="280.0" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="360.0" y="315.0" width="560.0" height="120.0" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/>
<text x="376.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700">1. Базове ядро системи</text>
<text x="376.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Мінімальна постійна місткість, необхідна для фонових задач, реплікації сховищ та чергового трафіку.</text>
<line x1="328.0" y1="375.0" x2="352.0" y2="375.0" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3,3"/>
</svg>