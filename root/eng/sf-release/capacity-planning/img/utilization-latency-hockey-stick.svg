<text x="676.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="676.0" dy="0.0">1. Коліно затримки (Knee):</tspan><tspan x="676.0" dy="14.2">При U &gt; 70–75% швидкість</tspan><tspan x="676.0" dy="14.2">росту черги вибухає.</tspan><tspan x="676.0" dy="14.2"></tspan><tspan x="676.0" dy="14.2">2. Нелінійний ефект:</tspan><tspan x="676.0" dy="14.2">Навантаження +20% при U=80%</tspan><tspan x="676.0" dy="14.2">збільшує затримку на 400–800%,</tspan><tspan x="676.0" dy="14.2">а не на 20%.</tspan><tspan x="676.0" dy="14.2"></tspan><tspan x="676.0" dy="14.2">3. Цільовий Headroom:</tspan><tspan x="676.0" dy="14.2">Тримати середнє U ≤ 65–70%,</tspan><tspan x="676.0" dy="14.2">щоб сплески не перетинали</tspan><tspan x="676.0" dy="14.2">критичну точку насичення.</tspan><tspan x="676.0" dy="14.2"></tspan><tspan x="676.0" dy="14.2">4. Формула Кінгмана:</tspan><tspan x="676.0" dy="14.2">Коли U → 100%, час черги</tspan><tspan x="676.0" dy="14.2">прямує до нескінченності.</tspan></text>
