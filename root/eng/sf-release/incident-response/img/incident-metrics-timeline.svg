<text x="400.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Час впливу на користувачів (Customer Impact Duration) = MTTD + MTTA + MTTI + MTTM</text>
