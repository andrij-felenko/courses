<text x="310.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Середній час між аваріями; зростає завдяки системним діям за підсумками постмортемів</text>
