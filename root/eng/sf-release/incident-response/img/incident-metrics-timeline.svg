<text x="310.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Час до взяття інциденту черговим інженером; ціль: ≤5 хв для SEV-1</text>
<circle cx="44.0" cy="323.0" r="3.5" fill="#16a34a" stroke="#16a34a" stroke-width="1.0"/>
<text x="56.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">MTTM (Mean Time to Mitigate):</text>
<text x="310.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Час до повернення сервісу до працездатного стану; головна ціль екстреного реагування</text>
<circle cx="44.0" cy="343.0" r="3.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.0"/>
