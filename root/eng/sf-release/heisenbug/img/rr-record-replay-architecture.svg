<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура детермінованого запису й відтворення (Mozilla rr)</text>
<rect x="35.0" y="65.0" width="490.0" height="420.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="280.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза запису: rr record ./app</text>
<line x1="55.0" y1="107.0" x2="505.0" y2="107.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="100.6" y="142.5" width="148.8" height="35.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="175.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">CPU execution</tspan><tspan x="175.0" dy="13.0">Детерміновані інструкції</tspan></text>
<rect x="312.1" y="142.5" width="165.9" height="35.0" rx="6" fill="#fff8e1" stroke="#d97706" stroke-width="1.5"/><text x="395.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">PMU Hardware Counter</tspan><tspan x="395.0" dy="13.0">Лічильник умовних переходів</tspan></text>
<text x="280.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерела недетермінізму (перехоплюються через ptrace / seccomp):</text>
<rect x="76.3" y="264.6" width="107.5" height="30.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="277.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Системні виклики</tspan><tspan x="130.0" dy="11.7">(read, time, epoll)</tspan></text>
<rect x="228.8" y="264.6" width="102.3" height="30.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="277.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Асинхронні сигнали</tspan><tspan x="280.0" dy="11.7">(SIGINT, SIGALRM)</tspan></text>
<rect x="376.3" y="264.6" width="107.5" height="30.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="277.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Інструкції часу/CPU</tspan><tspan x="430.0" dy="11.7">(rdtsc, cpuid)</tspan></text>
<line x1="280.0" y1="325.0" x2="280.0" y2="365.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="98.1" y="382.2" width="363.8" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Компактний слід виконання (Trace Directory)</tspan><tspan x="280.0" dy="14.3">• Повна фіксація всіх входів і результатів syscalls</tspan><tspan x="280.0" dy="14.3">• Точні часові мітки переходів PMU</tspan></text>
<rect x="555.0" y="65.0" width="490.0" height="420.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="800.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза відтворення: rr replay</text>
<line x1="575.0" y1="107.0" x2="1025.0" y2="107.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="668.6" y="141.3" width="262.8" height="37.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Читання збереженого сліду (Trace Log)</tspan><tspan x="800.0" dy="14.3">Всі зовнішні дані інжектуються з журналу</tspan></text>
<line x1="800.0" y1="200.0" x2="800.0" y2="235.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="638.4" y="252.2" width="323.2" height="55.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">100% Детерміноване виконання в 1 потік</tspan><tspan x="800.0" dy="14.3">• PMU відраховує точну кількість переходів</tspan><tspan x="800.0" dy="14.3">• Стан регістрів і пам'яті біт-у-біт повторюється</tspan></text>
<line x1="800.0" y1="330.0" x2="800.0" y2="370.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="648.8" y="392.2" width="302.4" height="55.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="409.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Time-Travel Debugging у GDB:</tspan><tspan x="800.0" dy="14.3">• reverse-continue  • reverse-stepi</tspan><tspan x="800.0" dy="14.3">• reverse-watchpoints (хто змінив змінну!)</tspan></text>
</svg>