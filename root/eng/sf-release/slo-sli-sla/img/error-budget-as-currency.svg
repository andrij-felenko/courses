<text x="480.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Залишок &gt; 0 → релізи дозволено</tspan><tspan x="480.0" dy="12.8">Залишок ≤ 0 → релізний фриз і стабілізація</tspan></text>
