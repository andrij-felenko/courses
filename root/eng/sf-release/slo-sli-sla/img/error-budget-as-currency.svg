<text x="785.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c026d3" text-anchor="middle" font-weight="700">Експлуатація / SRE</text>
<text x="665.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="665.0" dy="0.0">Ціль: захист користувацького досвіду.</tspan><tspan x="665.0" dy="14.7"></tspan><tspan x="665.0" dy="14.7">Дії при вичерпанні бюджету:</tspan><tspan x="665.0" dy="14.7">• Автоматичне блокування CI/CD;</tspan><tspan x="665.0" dy="14.7">• 100% фокус на багах і надійності;</tspan><tspan x="665.0" dy="14.7">• Покращення автотестів і канарок;</tspan><tspan x="665.0" dy="14.7">• Розширення моніторингу та алертингу;</tspan><tspan x="665.0" dy="14.7">• Оновлення архітектури відмовостійкості.</tspan></text>
