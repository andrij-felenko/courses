<text x="55.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">Ціль: максимальна швидкість постачання.</tspan><tspan x="55.0" dy="14.7"></tspan><tspan x="55.0" dy="14.7">На що витрачається бюджет:</tspan><tspan x="55.0" dy="14.7">• Часті релізи нових фіч;</tspan><tspan x="55.0" dy="14.7">• Експерименти та A/B-тести;</tspan><tspan x="55.0" dy="14.7">• Оновлення версій фреймворків;</tspan><tspan x="55.0" dy="14.7">• Ризиковані рефакторинги коду;</tspan><tspan x="55.0" dy="14.7">• Масштабні міграції баз даних.</tspan></text>
