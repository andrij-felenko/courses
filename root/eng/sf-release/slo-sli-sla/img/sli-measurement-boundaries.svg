<rect x="40.0" y="210.0" width="280.0" height="220.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
<text x="180.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">Клієнт (Real User Monitoring)</text>
<text x="55.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">+ Справжнє сприйняття користувачем</tspan><tspan x="55.0" dy="14.5">+ Враховує DNS, рендеринг і мережу</tspan><tspan x="55.0" dy="14.5">− Шум від поганого Wi-Fi/мобільного зв'язку</tspan><tspan x="55.0" dy="14.5">− Недоставка логів при повному збої мережі</tspan><tspan x="55.0" dy="14.5">− Неможливо гарантувати SLA інфраструктури</tspan></text>
<rect x="340.0" y="210.0" width="280.0" height="220.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="480.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">Ingress / API Gateway (Стандарт)</text>
<text x="355.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="355.0" dy="0.0">+ Золотий стандарт для SLI доступності</tspan><tspan x="355.0" dy="14.5">+ Бачить усі вхідні запити та відмови бекенду</tspan><tspan x="355.0" dy="14.5">+ Фіксує 5xx, таймаути проксі та затримки</tspan><tspan x="355.0" dy="14.5">+ Ізольовано від шуму останньої милі клієнта</tspan><tspan x="355.0" dy="14.5">+ Ідеальна основа для SLO та алертів вигорання</tspan></text>
<rect x="640.0" y="210.0" width="280.0" height="220.0" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.4"/>
<text x="780.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c026d3" text-anchor="middle" font-weight="700">Внутрішній сервіс / База даних</text>
<text x="655.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="655.0" dy="0.0">+ Точна діагностика конкретного компонента</tspan><tspan x="655.0" dy="14.5">+ Вимірює чистий час обробки процесором</tspan><tspan x="655.0" dy="14.5">− Сліпий до падінь балансувальника та шлюзу</tspan><tspan x="655.0" dy="14.5">− Не враховує мережеві черги та Envoy timeouts</tspan><tspan x="655.0" dy="14.5">− Застосовується як компонентний, а не бізнес-SLI</tspan></text>
</svg>