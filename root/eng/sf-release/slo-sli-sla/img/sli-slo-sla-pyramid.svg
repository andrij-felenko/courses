<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 985.34 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="985.34" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="480.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія та зв'язок між SLI, SLO, SLA та бюджетом помилок</text>
<rect x="40.0" y="70.0" width="420.0" height="110.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="60.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">1. SLI (Service Level Indicator) — Індикатор</text>
<text x="60.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">Фактичний числовий вимір якості роботи системи в рантаймі.</tspan><tspan x="60.0" dy="14.9">Формула: (Кількість успішних подій) ÷ (Загальна кількість подій) · 100%</tspan><tspan x="60.0" dy="14.9">Приклад: 99.93% запитів успішно виконано із затримкою &lt; 200 мс.</tspan></text>
<rect x="40.0" y="200.0" width="420.0" height="110.0" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.6"/>
<text x="60.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c026d3" text-anchor="start" font-weight="700">2. SLO (Service Level Objective) — Внутрішня ціль</text>
<text x="60.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">Цільовий рівень надійності, узгоджений розробкою та продуктом.</tspan><tspan x="60.0" dy="14.9">Визначає допустиму частку збоїв — Бюджет помилок (100% − SLO).</tspan><tspan x="60.0" dy="14.9">Приклад: Ціль 99.9% за ковзне 30-денне вікно (бюджет = 0.1%).</tspan></text>
<rect x="40.0" y="330.0" width="420.0" height="110.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="60.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="700">3. SLA (Service Level Agreement) — Зовнішній контракт</text>
<text x="60.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">Юридична угода з клієнтами із прямими фінансовими санкціями.</tspan><tspan x="60.0" dy="14.9">Завжди м'якша за SLO для створення захисного буфера безпеки.</tspan><tspan x="60.0" dy="14.9">Приклад: 99.5% доступності (при порушенні — повернення 25% вартості).</tspan></text>
<rect x="510.0" y="70.0" width="410.0" height="370.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="715.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шкала надійності та захисні інтервали</text>
<rect x="550.0" y="135.0" width="330.0" height="65.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="715.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Бюджет помилок (Error Budget): 0.1%</text>
<text x="715.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Простір для релізів, експериментів та міграцій</text>
<line x1="535.0" y1="200.0" x2="895.0" y2="200.0" stroke="#c026d3" stroke-width="2.0"/>
<text x="900.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c026d3" text-anchor="start" font-weight="700">SLO = 99.9%</text>
<rect x="550.0" y="200.0" width="330.0" height="85.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
<text x="715.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Захисний буфер безпеки: 0.4%</text>
<text x="715.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle"><tspan x="715.0" dy="0.0">Внутрішній інцидент: замороження релізів,</tspan><tspan x="715.0" dy="13.0">але клієнтський контракт SLA ще НЕ порушено</tspan></text>
<line x1="535.0" y1="285.0" x2="895.0" y2="285.0" stroke="#d97706" stroke-width="2.0"/>
<text x="900.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">SLA = 99.5%</text>
<rect x="550.0" y="285.0" width="330.0" height="105.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="715.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">Зона фінансових штрафів та виплат</text>
<text x="715.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle"><tspan x="715.0" dy="0.0">Порушення договірних зобов'язань SLA,</tspan><tspan x="715.0" dy="13.0">виплата неустойки, втрата репутації бізнесу</tspan></text>
<text x="530.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="700">Золоте правило інженерії:  SLA  &lt;  SLO  &lt;  100%</text>
</svg>