<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="980.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність завантаження та динамічної конфігурації (Boot Flow)</text>
<rect x="28.0" y="90.0" width="170.0" height="140.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="113.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Phase 0: Reset Vector</text>
<text x="113.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="113.0" dy="0.0">Вектор скидання, копіювання</tspan><tspan x="113.0" dy="12.8">.data в SRAM, обнулення .bss,</tspan><tspan x="113.0" dy="12.8">старт внутрішнього RC-генератора</tspan></text>
<line x1="201.0" y1="160.0" x2="217.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="220.0" y="90.0" width="170.0" height="140.0" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.6"/>
<text x="305.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c026d3" text-anchor="middle" font-weight="700">Phase 1: Board Sniffing</text>
<text x="305.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Зчитування ADC дільника або</tspan><tspan x="305.0" dy="12.8">Strapping пінів примітивним</tspan><tspan x="305.0" dy="12.8">неблокуючим драйвером</tspan></text>
<line x1="393.0" y1="160.0" x2="409.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="412.0" y="90.0" width="170.0" height="140.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="497.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Phase 2: Table Lookup</text>
<text x="497.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="497.0" dy="0.0">Пошук ревізії у статичній</tspan><tspan x="497.0" dy="12.8">таблиці board_desc_table[].</tspan><tspan x="497.0" dy="12.8">Верифікація підтримуваності</tspan></text>
<line x1="585.0" y1="160.0" x2="601.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="604.0" y="90.0" width="170.0" height="140.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="689.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">Phase 3: Pinmux &amp; Power</text>
<text x="689.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="689.0" dy="0.0">Реконфігурація GPIO матриці,</tspan><tspan x="689.0" dy="12.8">увімкнення стабілізаторів живлення</tspan><tspan x="689.0" dy="12.8">для сенсорів цієї ревізії</tspan></text>
<line x1="777.0" y1="160.0" x2="793.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="796.0" y="90.0" width="170.0" height="140.0" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="881.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Phase 4: Driver Binding</text>
<text x="881.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="881.0" dy="0.0">Прив'язка драйверів (VTable),</tspan><tspan x="881.0" dy="12.8">ініціалізація BMI160/270, Flash,</tspan><tspan x="881.0" dy="12.8">старт бізнес-логіки</tspan></text>
<rect x="28.0" y="260.0" width="944.0" height="185.0" rx="6" fill="#fafafa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="500.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захисні механізми на етапі запуску (Fail-Safe Guards)</text>
<rect x="48.0" y="305.0" width="290.0" height="120.0" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
<text x="193.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">1. Невідомий Board ID</text>
<text x="193.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="193.0" dy="0.0">Якщо ADC повернув значення поза</tspan><tspan x="193.0" dy="13.5">дозволеними вікнами або ревізія</tspan><tspan x="193.0" dy="13.5">новіша за підтримувану прошивкою:</tspan><tspan x="193.0" dy="13.5">──&gt; Перехід у Safe Recovery Mode</tspan></text>
<rect x="354.0" y="305.0" width="290.0" height="120.0" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
<text x="499.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">2. Затримка стабілізації VDD</text>
<text x="499.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="499.0" dy="0.0">ADC не опитується до завершення</tspan><tspan x="499.0" dy="13.5">наростання напруги живлення Vref.</tspan><tspan x="499.0" dy="13.5">Апаратний Power-On-Reset + delay</tspan><tspan x="499.0" dy="13.5">──&gt; Виключає випадковий збій ID</tspan></text>
<rect x="660.0" y="305.0" width="290.0" height="120.0" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
<text x="805.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="middle" font-weight="700">3. Zero-Allocation VTable</text>
<text x="805.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Усі таблиці драйверів розміщені</tspan><tspan x="805.0" dy="13.5">у Flash (секція .rodata). Жодного</tspan><tspan x="805.0" dy="13.5">динамічного malloc() у runtime.</tspan><tspan x="805.0" dy="13.5">──&gt; Детерміністичний час старту</tspan></text>
</svg>