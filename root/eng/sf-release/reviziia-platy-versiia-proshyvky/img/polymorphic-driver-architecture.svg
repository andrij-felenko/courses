<text x="255.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">Конфігурація Rev A (2023)</text>
<rect x="60.0" y="305.0" width="390.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="255.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Драйвер IMU: Bosch BMI160</text>
<text x="255.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">• I2C адреса: 0x68 (провідний пін SDO=GND)</tspan><tspan x="255.0" dy="12.3">• SPI Chip Select: GPIOA_Pin_4</tspan><tspan x="255.0" dy="12.3">• Таблиця ops: bmi160_init, bmi160_read, bmi160_sleep</tspan></text>
<rect x="60.0" y="395.0" width="390.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="255.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Драйвер Flash: Winbond W25Q128</text>
<text x="255.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">• JEDEC ID: 0xEF4018 (Quad-SPI Dummy Cycles = 6)</tspan><tspan x="255.0" dy="12.3">• Розмір сектора: 4 КБ, розмір блоку: 64 КБ</tspan><tspan x="255.0" dy="12.3">• Таблиця ops: w25q_init, w25q_read, w25q_write</tspan></text>
<rect x="530.0" y="262.0" width="430.0" height="225.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="745.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Конфігурація Rev B / Rev C (2024–2025)</text>
<rect x="550.0" y="305.0" width="390.0" height="75.0" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="745.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Драйвер IMU: Bosch BMI270</text>
<text x="745.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">• I2C адреса: 0x69 (SDO=VDD) / SPI CS: GPIOC_Pin_13</tspan><tspan x="745.0" dy="12.3">• Завантаження фірмового мікрокоду ініціалізації в ASIC</tspan><tspan x="745.0" dy="12.3">• Таблиця ops: bmi270_init, bmi270_read, bmi270_sleep</tspan></text>
<rect x="550.0" y="395.0" width="390.0" height="75.0" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="745.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Драйвер Flash: Macronix MX25L128</text>
<text x="745.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">• JEDEC ID: 0xC22018 (Quad-SPI Dummy Cycles = 8)</tspan><tspan x="745.0" dy="12.3">• Змінені таймінги підтяжки та регістри конфігурації QPI</tspan><tspan x="745.0" dy="12.3">• Таблиця ops: mx25l_init, mx25l_read, mx25l_write</tspan></text>
