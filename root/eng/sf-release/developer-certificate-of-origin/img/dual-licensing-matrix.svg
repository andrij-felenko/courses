<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця подвійного ліцензування: копілефт та комерційні винятки</text>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура подвійного ліцензування: Копілефтний важіль (Dual Licensing)</text>
<rect x="270.0" y="58.0" width="340.0" height="82.0" rx="10" fill="#f4eefb" stroke="#5b328a" stroke-width="2.0"/>
<text x="440.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#5b328a" text-anchor="middle" font-weight="700">Єдина кодова база продукту</text>
<text x="440.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">100% майнових прав належить вендору</text>
<text x="440.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Власний штат + обов'язкова CLA для контриб'юторів)</text>
<path d="M 350 140 L 220 200" fill="none" stroke="#236932" stroke-width="2.5"/>
<polygon points="215.0,203.0 228.0,197.0 222.0,190.0" fill="#236932" stroke="none" stroke-width="0.0"/>
<text x="210.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#236932" text-anchor="middle" font-weight="700">Гілка 1: Відкритий випуск</text>
<path d="M 530 140 L 660 200" fill="none" stroke="#a64b18" stroke-width="2.5"/>
<polygon points="665.0,203.0 658.0,190.0 652.0,197.0" fill="#a64b18" stroke="none" stroke-width="0.0"/>
<text x="670.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a64b18" text-anchor="middle" font-weight="700">Гілка 2: Комерційний випуск</text>
<rect x="35.0" y="210.0" width="380.0" height="245.0" rx="10" fill="#eaf5ec" stroke="#236932" stroke-width="1.8"/>
<text x="225.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#236932" text-anchor="middle" font-weight="700">Строга копілефтна ліцензія (GPLv3 / AGPLv3)</text>
<line x1="50.0" y1="248.0" x2="400.0" y2="248.0" stroke="#236932" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="53.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#236932" text-anchor="start" font-weight="700">Ціна:</text>
<text x="53.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">0 грн (Безкоштовно у вихідному коді)</text>
<text x="53.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#236932" text-anchor="start" font-weight="700">Умова взаємності:</text>
<text x="53.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Увесь похідний код мусить бути відкритим під GPL</text>
<text x="53.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#236932" text-anchor="start" font-weight="700">Мережевий ефект (AGPL):</text>
<text x="53.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Використання як SaaS вимагає відкриття бекенду</text>
<text x="53.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#236932" text-anchor="start" font-weight="700">Цільова аудиторія:</text>
<text x="53.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Опенсорс-спільнота, науковці, некомерційні проєкти</text>
<text x="53.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#236932" text-anchor="start" font-weight="700">Бізнес-ефект:</text>
<text x="53.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Створює широке визнання та формує ринковий стандарт</text>
<rect x="465.0" y="210.0" width="380.0" height="245.0" rx="10" fill="#fcf0e8" stroke="#a64b18" stroke-width="1.8"/>
<text x="655.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a64b18" text-anchor="middle" font-weight="700">Комерційна ліцензія (Proprietary OEM / SaaS)</text>
<line x1="480.0" y1="248.0" x2="830.0" y2="248.0" stroke="#a64b18" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="483.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a64b18" text-anchor="start" font-weight="700">Ціна:</text>
<text x="483.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Платна підписка або роялті за кожну копію</text>
<text x="483.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a64b18" text-anchor="start" font-weight="700">Звільнення від GPL:</text>
<text x="483.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Дозвіл вбудовувати у закриті пропрієтарні пристрої</text>
<text x="490.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a64b18" text-anchor="start" font-weight="700">Комерційна таємниця:</text>
<text x="483.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Немає зобов'язання оприлюднювати власний код</text>
<text x="483.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a64b18" text-anchor="start" font-weight="700">Цільова аудиторія:</text>
<text x="483.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Корпорації, вендори заліза, хмарні провайдери</text>
<text x="483.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a64b18" text-anchor="start" font-weight="700">Бізнес-ефект:</text>
<text x="483.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Пряма монетизація розробки компанії-власника</text>
<rect x="390.0" y="315.0" width="100.0" height="52.0" rx="6" fill="#fbeeed" stroke="#9c2626" stroke-width="1.5"/>
<text x="440.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9c2626" text-anchor="middle" font-weight="700">Копілефтний важіль</text>
<text x="440.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Хто не ділиться кодом,</text>
<text x="440.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9c2626" text-anchor="middle" font-weight="700">той купує OEM</text>
</svg>