<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Петля закостеніння платформи (Platform Ossification Loop)</text>
<rect x="60.0" y="90.0" width="230.0" height="110.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.8"/><text x="175.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">1. Випуск API</tspan><tspan x="175.0" dy="15.6">та оптимізація</tspan><tspan x="175.0" dy="15.6"></tspan><tspan x="175.0" dy="15.6">Платформа випускає API</tspan><tspan x="175.0" dy="15.6">з детермінованою,</tspan><tspan x="175.0" dy="15.6">але незадокументованою</tspan><tspan x="175.0" dy="15.6">деталлю реалізації</tspan></text>
<rect x="350.0" y="90.0" width="230.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="465.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">2. Неявне</tspan><tspan x="465.0" dy="15.6">зв'язування клієнтів</tspan><tspan x="465.0" dy="15.6"></tspan><tspan x="465.0" dy="15.6">Клієнти виявляють деталь</tspan><tspan x="465.0" dy="15.6">(порядок ключів, latency)</tspan><tspan x="465.0" dy="15.6">і зав'язують на неї</tspan><tspan x="465.0" dy="15.6">свої тести та логіку</tspan></text>
<rect x="640.0" y="90.0" width="230.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="755.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">3. Рефакторинг</tspan><tspan x="755.0" dy="15.6">або виправлення</tspan><tspan x="755.0" dy="15.6"></tspan><tspan x="755.0" dy="15.6">Автор змінює деталь</tspan><tspan x="755.0" dy="15.6">(новий хеш-алгоритм,</tspan><tspan x="755.0" dy="15.6">швидший пул потоків)</tspan><tspan x="755.0" dy="15.6">у межах SemVer PATCH</tspan></text>
<rect x="930.0" y="90.0" width="230.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1045.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1045.0" dy="0.0">4. Аварія</tspan><tspan x="1045.0" dy="15.6">та регресія клієнтів</tspan><tspan x="1045.0" dy="15.6"></tspan><tspan x="1045.0" dy="15.6">Клієнтські сервіси</tspan><tspan x="1045.0" dy="15.6">падають у продакшені.</tspan><tspan x="1045.0" dy="15.6">Звинувачують автора</tspan><tspan x="1045.0" dy="15.6">у порушенні сумісності</tspan></text>
<line x1="290.0" y1="145.0" x2="345.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="580.0" y1="145.0" x2="635.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="870.0" y1="145.0" x2="925.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="200.0" y="280.0" width="800.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="600.0" y="317.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">5. Закостеніння системи (Ossification)</tspan><tspan x="600.0" dy="16.9">Автор змушений скасувати оптимізацію, заморозити старий баг або додати шар емуляції.</tspan><tspan x="600.0" dy="16.9">Незадокументована поведінка назавжди стає частиною незмінного стандарту.</tspan></text>
<line x1="1045.0" y1="200.0" x2="1045.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="1045.0" y1="330.0" x2="1005.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="200.0" y1="330.0" x2="175.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="175.0" y1="330.0" x2="175.0" y2="205.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="120.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Параліч
розвитку</text>
<rect x="150.0" y="415.0" width="900.0" height="75.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="448.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Наслідок закостеніння: чим популярніша бібліотека чи протокол (TCP, TLS, Win32),</tspan><tspan x="600.0" dy="16.2">тим вища ціна будь-якої внутрішньої зміни. Система втрачає здатність до еволюції.</tspan></text>
</svg>