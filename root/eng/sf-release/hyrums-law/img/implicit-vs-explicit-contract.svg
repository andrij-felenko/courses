<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Айсберг API: задокументований контракт проти спостережуваної поведінки</text>
<line x1="50.0" y1="190.0" x2="1130.0" y2="190.0" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="6,6"/>
<text x="1120.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-style="italic">Межа специфікації (водна лінія)</text>
<rect x="200.0" y="65.0" width="780.0" height="100.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.0"/><text x="590.0" y="102.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ЯВНИЙ ДОКУМЕНТОВАНИЙ КОНТРАКТ (Верхівка)</tspan><tspan x="590.0" dy="16.9">• Типи аргументів і повертаних значень  • Коди помилок (HTTP 404, errno 2)</tspan><tspan x="590.0" dy="16.9">• Формальні схеми даних (Protobuf, JSON Schema)  • Семантичні гарантії SemVer</tspan></text>
<rect x="100.0" y="220.0" width="980.0" height="240.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="590.0" y="348.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">СПОСТЕРЕЖУВАНА ПОВЕДІНКА РЕАЛІЗАЦІЇ (Підводна частина)</tspan><tspan x="590.0" dy="16.9">За законом Гайрама, клієнти неминуче прив'язуються до цих недекларованих властивостей:</tspan></text>
<rect x="120.0" y="280.0" width="290.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="265.0" y="306.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Порядок ітерації колекцій</tspan><tspan x="265.0" dy="15.0">Хеш-таблиці без гарантії порядку,</tspan><tspan x="265.0" dy="15.0">послідовність полів у JSON</tspan></text>
<rect x="445.0" y="280.0" width="290.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="590.0" y="306.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Тексти та форматування помилок</tspan><tspan x="590.0" dy="15.0">Парсинг рядків 'file not found'</tspan><tspan x="590.0" dy="15.0">замість числових кодів</tspan></text>
<rect x="770.0" y="280.0" width="290.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="915.0" y="306.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">Часові характеристики (Latency)</tspan><tspan x="915.0" dy="15.0">Очікування відповіді за 5 мс,</tspan><tspan x="915.0" dy="15.0">порядок фонових операцій</tspan></text>
<rect x="120.0" y="370.0" width="290.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="265.0" y="396.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Мікроструктура протоколів</tspan><tspan x="265.0" dy="15.0">Регістр заголовків HTTP,</tspan><tspan x="265.0" dy="15.0">розмір буферів, TLS-розширення</tspan></text>
<rect x="445.0" y="370.0" width="290.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="590.0" y="396.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Внутрішній стек і стан</tspan><tspan x="590.0" dy="15.0">Глибина стека, порядок викликів,</tspan><tspan x="590.0" dy="15.0">побічні ефекти алокатора</tspan></text>
<rect x="770.0" y="370.0" width="290.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="915.0" y="396.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">Терпимість до сміття (Postel)</tspan><tspan x="915.0" dy="15.0">Прийняття некоректних полів,</tspan><tspan x="915.0" dy="15.0">які тепер не можна відкинути</tspan></text>
<rect x="100.0" y="485.0" width="980.0" height="105.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.6"/><text x="590.0" y="517.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Парадокс сумісності:</tspan><tspan x="590.0" dy="16.2">Автор вважає публічним інтерфейсом лише верхівку над лінією.</tspan><tspan x="590.0" dy="16.2">Клієнтський код на практиці виконується проти всього айсберга.</tspan><tspan x="590.0" dy="16.2">Будь-яка зміна в підводній частині ламає клієнта так само, як і зміна публічного підпису.</tspan></text>
</svg>