<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захисна рандомізація: штучний шум проти неявного зв'язування</text>
<rect x="50.0" y="75.0" width="510.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="305.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">ДЕТЕРМІНОВАНА РЕАЛІЗАЦІЯ (Хибна стабільність)</tspan></text>
<rect x="50.0" y="135.0" width="510.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="305.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Порядок ключів у хеш-таблиці завжди однаковий</tspan><tspan x="305.0" dy="15.0">(наприклад, залежить лише від порядку вставки).</tspan></text>
<rect x="50.0" y="215.0" width="510.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="305.0" y="244.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Клієнт пише тест: assert response == ['alpha', 'beta'].</tspan><tspan x="305.0" dy="15.0">Тест проходить у 100% випадків на CI.</tspan></text>
<rect x="50.0" y="295.0" width="510.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="305.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Автор оновлює хеш-функцію заради швидкості.</tspan><tspan x="305.0" dy="15.0">Порядок змінився на ['beta', 'alpha'].</tspan></text>
<rect x="50.0" y="375.0" width="510.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="305.0" y="404.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">КАТАСТРОФА В ПРОДАКШЕНІ:</tspan><tspan x="305.0" dy="15.0">Тести клієнта впали, білд заблоковано,</tspan><tspan x="305.0" dy="15.0">автора звинувачують у ламкому релізі.</tspan></text>
<line x1="305.0" y1="200.0" x2="305.0" y2="213.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="305.0" y1="280.0" x2="305.0" y2="293.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="305.0" y1="360.0" x2="305.0" y2="373.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="620.0" y="75.0" width="510.0" height="45.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.0"/><text x="875.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">ЗАХИСНА РАНДОМІЗАЦІЯ (Активна ентропія)</tspan></text>
<rect x="620.0" y="135.0" width="510.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="875.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Порядок ітерації навмисно тасується щоразу</tspan><tspan x="875.0" dy="15.0">(випадковий сід хешування, рандомний старт у Go map).</tspan></text>
<rect x="620.0" y="215.0" width="510.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="875.0" y="244.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Наївний тест клієнта падає на 2-му запуску локально.</tspan><tspan x="875.0" dy="15.0">Клієнт бачить: порядок недетермінований!</tspan></text>
<rect x="620.0" y="295.0" width="510.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="875.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Клієнт пише стійкий код:</tspan><tspan x="875.0" dy="15.0">викликає sort() або перевіряє невпорядковану множину.</tspan></text>
<rect x="620.0" y="375.0" width="510.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="875.0" y="404.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">БЕЗПЕЧНА ЕВОЛЮЦІЯ:</tspan><tspan x="875.0" dy="15.0">Автор оновлює хеш-функцію, архітектуру та кеші.</tspan><tspan x="875.0" dy="15.0">Жоден клієнт не зламався, бо контракт дотримано.</tspan></text>
<line x1="875.0" y1="200.0" x2="875.0" y2="213.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="875.0" y1="280.0" x2="875.0" y2="293.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="875.0" y1="360.0" x2="875.0" y2="373.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="120.0" y="475.0" width="940.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="590.0" y="495.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Правило проєктування стійких систем:</tspan><tspan x="590.0" dy="16.2">Якщо поведінка не гарантована специфікацією, зробіть її активно нестабільною.</tspan><tspan x="590.0" dy="16.2">Штучний шум примушує клієнтів поважати межі контракту з першого дня.</tspan></text>
</svg>