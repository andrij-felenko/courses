<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка компілятора при мікробенчмаркінгу</text>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПАСТКА ОПТИМІЗАЦІЇ: НАЇВНИЙ ВИМІР ПРОТИ БАР'ЄРА</text>
<rect x="25.0" y="52.0" width="245.0" height="320.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="147.5" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НАЇВНИЙ КОД</text>
<text x="147.5" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">без бар'єрів компілятора</text>
<text x="37.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">uint64_t t0 = rdtsc();</text>
<text x="37.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">for (int i = 0; i &lt; N; ++i) {</text>
<text x="37.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">    uint64_t v = hash(i);</text>
<text x="37.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">}</text>
<text x="37.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">uint64_t dt = rdtsc() - t0;</text>
<line x1="40.0" y1="222.0" x2="255.0" y2="222.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="147.5" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ЩО РОБИТЬ КОМПІЛЯТОР:</text>
<text x="147.5" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Змінна v не читається</text>
<text x="147.5" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2. hash(i) немає побічних дій</text>
<text x="147.5" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">3. Цикл викинуто (DCE)</text>
<rect x="40.0" y="322.0" width="215.0" height="34.0" rx="4" fill="#fbecec" stroke="#c0392b" stroke-width="1.2"/>
<text x="147.5" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Результат: 0.00 нс (ілюзія)</text>
<line x1="276.0" y1="212.0" x2="302.0" y2="212.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="306.0" y="52.0" width="245.0" height="320.0" rx="8" fill="#fef9e7" stroke="#d35400" stroke-width="1.8"/>
<text x="428.5" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">АСЕМБЛЕР (O3)</text>
<text x="428.5" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">реальні інструкції CPU</text>
<text x="318.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">rdtsc           ; t0</text>
<text x="318.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">mov  rsi, rax</text>
<text x="318.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">rdtsc           ; t1</text>
<text x="318.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">sub  rax, rsi   ; dt</text>
<text x="318.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="start" font-weight="700">; ТІЛО ЦИКЛУ ЗНИКЛО</text>
<line x1="321.0" y1="222.0" x2="536.0" y2="222.0" stroke="#d35400" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="428.5" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">НАСЛІДОК:</text>
<text x="428.5" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Виміряно лише накладні</text>
<text x="428.5" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">витрати читання таймера</text>
<text x="428.5" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(~15-25 тактів ядра)</text>
<rect x="321.0" y="322.0" width="215.0" height="34.0" rx="4" fill="#fef5e7" stroke="#d35400" stroke-width="1.2"/>
<text x="428.5" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Помилка: 100% хибний вимір</text>
<line x1="557.0" y1="212.0" x2="583.0" y2="212.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="588.0" y="52.0" width="245.0" height="320.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="710.5" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЗАХИЩЕНИЙ ВИМІР</text>
<text x="710.5" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">з оптимізаційним бар'єром</text>
<text x="598.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">uint64_t t0 = rdtsc_fence();</text>
<text x="598.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">for (int i = 0; i &lt; N; ++i) {</text>
<text x="598.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">    uint64_t v = hash(i);</text>
<text x="598.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">    asm volatile(&quot;&quot; :: &quot;r,m&quot;(v)</text>
<text x="598.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">                 : &quot;memory&quot;);</text>
<text x="598.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">}</text>
<text x="598.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">uint64_t dt = rdtsc_fence() - t0;</text>
<line x1="603.0" y1="237.0" x2="818.0" y2="237.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="710.5" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ПОВЕДІНКА БАР'ЄРА:</text>
<text x="710.5" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Змушує обчислити v у регістр</text>
<text x="710.5" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2. Забороняє викидати цикл</text>
<text x="710.5" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">3. Не додає зайвих інструкцій</text>
<rect x="603.0" y="322.0" width="215.0" height="34.0" rx="4" fill="#d4efdf" stroke="#27ae60" stroke-width="1.2"/>
<text x="710.5" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: 4.82 нс (чесна затримка)</text>
</svg>