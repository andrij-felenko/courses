<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр обробки та маршрутизації в Alertmanager</text>
<rect x="35.0" y="98.3" width="150.0" height="43.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Prometheus / Mimir</tspan><tspan x="110.0" dy="14.3">(потік алертів)</tspan></text>
<rect x="250.0" y="98.3" width="140.0" height="43.3" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">1. Дедуплікація</tspan><tspan x="320.0" dy="14.3">(Fingerprint хеш)</tspan></text>
<rect x="435.8" y="98.3" width="168.5" height="43.3" rx="6" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">2. Замовчування</tspan><tspan x="520.0" dy="14.3">(Silences / Вікна робіт)</tspan></text>
<rect x="640.1" y="98.3" width="199.8" height="43.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">3. Інгібування</tspan><tspan x="740.0" dy="14.3">(Inhibition / Батько глушить)</tspan></text>
<line x1="190.0" y1="120.0" x2="245.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="395.0" y1="120.0" x2="440.0" y2="120.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="120.0" x2="650.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="261.2" width="240.0" height="57.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">4. Згрупування (Grouping)</tspan><tspan x="210.0" dy="14.3">group_by: [alertname, cluster]</tspan><tspan x="210.0" dy="14.3">group_wait: 30s</tspan></text>
<rect x="410.0" y="261.2" width="260.0" height="57.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">5. Дерево маршрутизації (Route Tree)</tspan><tspan x="540.0" dy="14.3">Зіставлення міток (labels)</tspan><tspan x="540.0" dy="14.3">severity = critical / warning</tspan></text>
<line x1="740.0" y1="155.0" x2="330.0" y2="250.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="335.0" y1="290.0" x2="405.0" y2="290.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="209.5" width="200.0" height="41.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="830.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">PagerDuty (P1 / Critical)</tspan><tspan x="830.0" dy="13.0">Дзвінок / SMS черговому</tspan></text>
<rect x="730.0" y="269.5" width="200.0" height="41.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="830.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Slack / Matrix (P2 / Warn)</tspan><tspan x="830.0" dy="13.0">Робочий канал команди</tspan></text>
<rect x="730.0" y="329.5" width="200.0" height="41.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Jira / Bugzilla (P3 / Info)</tspan><tspan x="830.0" dy="13.0">Автоматичний таск</tspan></text>
<line x1="675.0" y1="270.0" x2="725.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="675.0" y1="290.0" x2="725.0" y2="290.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="675.0" y1="310.0" x2="725.0" y2="350.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Alertmanager фільтрує шум через замовчування, інгібування та згрупування перед надсиланням.</text>
</svg>