<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат станів публікації випуску</text>
<text x="500.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат життєвого циклу публікації релізу на OTA-сервері</text>
<rect x="41.6" y="100.2" width="176.9" height="59.6" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/><text x="130.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">1. DRAFT (Чернетка)</tspan><tspan x="130.0" dy="14.3">Ініціалізація випуску,</tspan><tspan x="130.0" dy="14.3">завантаження артефактів</tspan></text>
<rect x="297.9" y="100.2" width="204.1" height="59.6" rx="6" fill="#fff9e6" stroke="#d97706" stroke-width="1.8"/><text x="400.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">2. VALIDATING (Перевірка)</tspan><tspan x="400.0" dy="14.3">Розрахунок хешів, валідація</tspan><tspan x="400.0" dy="14.3">Ed25519, перевірка схеми</tspan></text>
<line x1="220.0" y1="130.0" x2="305.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="262.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Commit upload</text>
<rect x="297.9" y="273.1" width="204.1" height="73.9" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/><text x="400.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">ПОМИЛКА ВАЛІДАЦІЇ</tspan><tspan x="400.0" dy="14.3">(Validation Failed)</tspan><tspan x="400.0" dy="14.3">Невідповідність хешу,</tspan><tspan x="400.0" dy="14.3">недійсний підпис, битий DTB</tspan></text>
<line x1="400.0" y1="180.0" x2="400.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="465.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Збій перевірки</text>
<rect x="53.6" y="277.5" width="152.8" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="130.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">КАРАНТИН / АНУЛЬОВАНО</tspan><tspan x="130.0" dy="13.0">(Quarantined / Rejected)</tspan><tspan x="130.0" dy="13.0">Артефакти блокуються,</tspan><tspan x="130.0" dy="13.0">випуск відхилено</tspan></text>
<line x1="300.0" y1="310.0" x2="215.0" y2="310.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="255.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Ізоляція</text>
<rect x="587.9" y="100.2" width="204.1" height="59.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/><text x="690.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">3. STAGED (Випробування)</tspan><tspan x="690.0" dy="14.3">Доступно ТІЛЬКИ для стендів</tspan><tspan x="690.0" dy="14.3">і внутрішньої канарки (QA)</tspan></text>
<line x1="495.0" y1="130.0" x2="585.0" y2="130.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Усі перевірки OK</text>
<rect x="577.7" y="280.2" width="224.6" height="59.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/><text x="690.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">4. PUBLISHED (Опубліковано)</tspan><tspan x="690.0" dy="14.3">Випуск закріплено (Immutable).</tspan><tspan x="690.0" dy="14.3">Доступний для бойових кампаній</tspan></text>
<line x1="690.0" y1="180.0" x2="690.0" y2="260.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="760.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Апрув релізу (Sign-off)</text>
<rect x="576.5" y="424.0" width="226.9" height="52.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="440.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">5. DEPRECATED / REVOKED (Відкликано)</tspan><tspan x="690.0" dy="13.0">Замінено новою версією або анульовано</tspan><tspan x="690.0" dy="13.0">через критичну вразливість 0-day</tspan></text>
<line x1="690.0" y1="360.0" x2="690.0" y2="420.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="760.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вихід нового релізу</text>
<rect x="35.8" y="422.0" width="528.4" height="56.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/><text x="300.0" y="440.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">ІНВАРІАНТ НЕЗМІННОСТІ (IMMUTABILITY):</tspan><tspan x="300.0" dy="13.0">Опублікований реліз заборонено модифікувати або перезаписувати.</tspan><tspan x="300.0" dy="13.0">Будь-яке виправлення дефекту вимагає створення нового релізу з інкрементом SemVer.</tspan></text>
</svg>