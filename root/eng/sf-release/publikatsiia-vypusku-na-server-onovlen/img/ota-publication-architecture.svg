<text x="240.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ОБ'ЄКТНЕ СХОВИЩЕ ТА CDN (S3 / CloudFront)</text>
<text x="240.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Збереження бінарних блоків та образів rootfs</text>
<text x="240.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Генерація підписаних тимчасових посилань (Presigned URLs)</text>
<text x="240.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Розподілене кешування на крайових вузлах CDN</text>
