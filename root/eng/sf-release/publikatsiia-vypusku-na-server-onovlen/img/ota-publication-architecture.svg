<text x="760.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ПАРК ПРИСТРОЇВ (Edge Devices &amp; IoT Fleet)</text>
<text x="760.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Агенти оновлення (RAUC, Mender-client, SWUpdate)</text>
<text x="760.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Локальна верифікація відкритого ключа заліза</text>
