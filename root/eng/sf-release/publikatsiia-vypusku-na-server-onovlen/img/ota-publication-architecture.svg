<text x="340.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлюз прийому</text>
<text x="340.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">валідація схеми JSON</text>
<line x1="420.0" y1="285.0" x2="420.0" y2="335.0" stroke="#d97706" stroke-width="1.0"/>
