<text x="180.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">КОНВЕЄР ЗБІРКИ (CI/CD)</text>
<text x="180.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Генерація rootfs, бінарників, delta</text>
<text x="180.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Обчислення хешів SHA-256/BLAKE3</text>
<text x="180.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Формування чернетки маніфесту</text>
<text x="180.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Передача на підпис у KMS/HSM</text>
<rect x="680.0" y="60.0" width="280.0" height="130.0" rx="8" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
<text x="820.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#be185d" text-anchor="middle" font-weight="700">МОДУЛЬ ПІДПИСУ (HSM / KMS)</text>
<text x="820.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Апаратне збереження приватного ключа</text>
<text x="820.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Асиметричний підпис (Ed25519 / RSA-PSS)</text>
<text x="820.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Захист від витоку ключів релізу</text>
<text x="820.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Додавання відбитку відкритого ключа</text>
