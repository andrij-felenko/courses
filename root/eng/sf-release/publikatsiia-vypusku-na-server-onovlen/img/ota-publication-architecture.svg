<text x="500.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">підписи Ed25519 та хеші</text>
<line x1="580.0" y1="285.0" x2="580.0" y2="335.0" stroke="#d97706" stroke-width="1.0"/>
<text x="655.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця заліза</text>
<text x="655.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">сумісність ревізій плат</text>
<line x1="275.0" y1="345.0" x2="725.0" y2="345.0" stroke="#d97706" stroke-width="1.0"/>
<text x="500.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Реєстр випусків • Автомат станів: Draft → Staged → Published</text>
<text x="500.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Гарантія незмінності: після публікації бінарники та маніфест заблоковані від змін</text>
