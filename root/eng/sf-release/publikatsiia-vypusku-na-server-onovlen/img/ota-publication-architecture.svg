<text x="500.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Eclipse hawkBit / Mender Server / AWS IoT OTA / RAUC Backend)</text>
