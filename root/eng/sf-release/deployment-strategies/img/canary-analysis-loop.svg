<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільце автоматизованого аналізу канаркового випуску</text>
<rect x="68.7" y="94.2" width="202.6" height="51.6" rx="6" fill="#fff9e6" stroke="#d97706" stroke-width="1.8"/><text x="170.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">1. Зріз трафіку</tspan><tspan x="170.0" dy="15.6">(Canary Weight 5% → 20%)</tspan></text>
<rect x="349.0" y="86.4" width="262.1" height="67.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="480.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">2. Збір SLI-метрик</tspan><tspan x="480.0" dy="15.6">(HTTP 5xx помилки, p99 затримка,</tspan><tspan x="480.0" dy="15.6">CPU/пам'ять, бізнес-конверсія)</tspan></text>
<rect x="659.0" y="86.4" width="262.1" height="67.2" rx="6" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1.8"/><text x="790.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">3. Статистичний арбітраж</tspan><tspan x="790.0" dy="15.6">(Порівняння baseline vs canary,</tspan><tspan x="790.0" dy="15.6">тест Манна-Вітні, поріг помилок)</tspan></text>
<line x1="265.0" y1="120.0" x2="365.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="595.0" y1="120.0" x2="685.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="154.1" y="308.6" width="291.8" height="82.8" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.0"/><text x="300.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Рішення: Аварійний відкіт (Rollback)</tspan><tspan x="300.0" dy="15.6">• Вага канарки → 0%</tspan><tspan x="300.0" dy="15.6">• Активація сповіщення черговому</tspan><tspan x="300.0" dy="15.6">• Радіус ураження обмежено 5%</tspan></text>
<rect x="517.8" y="308.6" width="284.4" height="82.8" rx="6" fill="#f6faf7" stroke="#27ae60" stroke-width="2.0"/><text x="660.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Рішення: Крок промоції (Promotion)</tspan><tspan x="660.0" dy="15.6">• Збільшення ваги (наприклад, +25%)</tspan><tspan x="660.0" dy="15.6">• При досягненні 100% — фіналізація</tspan><tspan x="660.0" dy="15.6">• Версія v2 стає новим baseline</tspan></text>
<line x1="740.0" y1="165.0" x2="390.0" y2="305.0" stroke="#b91c1c" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="510.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">Помилки &gt; Порогу (Fail)</text>
