<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сумісність протоколів та схема даних у змішаному парку</text>
<text x="500.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємодія у змішаному парку (Mixed Fleet): сумісність протоколів та ізоляція стану</text>
<rect x="50.0" y="70.0" width="380.0" height="230.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="240.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ВУЗОЛ СТАРОЇ ВЕРСІЇ (v1.0)</text>
<text x="240.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Парк оновлено на 50% — працює паралельно з v2.0</text>
<rect x="142.8" y="129.5" width="194.4" height="61.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="240.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Схема повідомлення v1:</tspan><tspan x="240.0" dy="13.0">• tag 1: transaction_id (uint64)</tspan><tspan x="240.0" dy="13.0">• tag 2: amount_cents (uint64)</tspan><tspan x="240.0" dy="13.0">• tag 3: timestamp (uint64)</tspan></text>
<rect x="102.9" y="221.0" width="274.2" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="240.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Обробка невідомих полів:</tspan><tspan x="240.0" dy="13.0">Збереження unknown fields у бінарному буфері</tspan><tspan x="240.0" dy="13.0">Запобігання втраті даних при транзиті через v1</tspan></text>
<rect x="570.0" y="70.0" width="380.0" height="230.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="760.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ВУЗОЛ НОВОЇ ВЕРСІЇ (v2.0)</text>
<text x="760.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Канаркова ревізія з розширеним бінарним контрактом</text>
<rect x="637.1" y="116.5" width="245.7" height="87.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="760.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Схема повідомлення v2 (Розширена):</tspan><tspan x="760.0" dy="13.0">• tag 1: transaction_id (uint64)</tspan><tspan x="760.0" dy="13.0">• tag 2: amount_cents (uint64)</tspan><tspan x="760.0" dy="13.0">• tag 3: timestamp (uint64)</tspan><tspan x="760.0" dy="13.0">• tag 4: currency_code (string, OPTIONAL)</tspan><tspan x="760.0" dy="13.0">• tag 5: trace_context (bytes, OPTIONAL)</tspan></text>
<rect x="605.8" y="231.0" width="308.4" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="760.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Пряма сумісність (Forward Compatibility):</tspan><tspan x="760.0" dy="13.0">Обов'язкові дефолтні значення для відсутніх полів v1</tspan><tspan x="760.0" dy="13.0">Обробка запитів від клієнтів зі старою схемою</tspan></text>
<line x1="430.0" y1="140.0" x2="570.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">RPC v1 → v2 (Forward)</text>
<line x1="570.0" y1="190.0" x2="430.0" y2="190.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">RPC v2 → v1 (Backward)</text>
<rect x="50.0" y="330.0" width="430.0" height="195.0" rx="8" fill="#fff9e6" stroke="#d97706" stroke-width="1.8"/>
<text x="265.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">МЕХАНІЗМ ЗАПОБІГАННЯ SPLIT-BRAIN</text>
<text x="265.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Розподілений консенсус (Raft / Lease / Fencing)</text>
<rect x="130.8" y="399.5" width="268.5" height="61.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.0"/><text x="265.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">• Генераційні токени (Epoch Fencing Tokens)</tspan><tspan x="265.0" dy="13.0">• Кожен запис супроводжується номером релізу</tspan><tspan x="265.0" dy="13.0">• Вузли старої епохи автоматично відхиляються</tspan><tspan x="265.0" dy="13.0">• Захист від подвійної обробки транзакцій</tspan></text>
<text x="265.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ідемпотентність операцій за ключем UUIDv7</text>
<rect x="520.0" y="330.0" width="430.0" height="195.0" rx="8" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.8"/>
<text x="735.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700">СУМІСНІСТЬ СХЕМИ СУБД (EXPAND-CONTRACT)</text>
<text x="735.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Спільна база даних при частковому розгортанні</text>
<rect x="583.6" y="399.5" width="302.7" height="61.0" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.0"/><text x="735.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">• Фаза Expand: нові стовпці NULLable з тригерами</tspan><tspan x="735.0" dy="13.0">• Подвійний запис (Dual-Write) у старі та нові поля</tspan><tspan x="735.0" dy="13.0">• Старі вузли v1 не ламаються при читанні рядків</tspan><tspan x="735.0" dy="13.0">• У разі зупинки кампанії відкат не потребує DDL</tspan></text>
<text x="735.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпечна зупинка без пошкодження реляційного стану</text>
<line x1="240.0" y1="300.0" x2="240.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="760.0" y1="300.0" x2="760.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>