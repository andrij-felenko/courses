<rect x="66.2" y="129.6" width="187.7" height="120.8" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="160.0" y="150.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1. Дефекти (Bug Bar)</tspan><tspan x="160.0" dy="14.3"></tspan><tspan x="160.0" dy="14.3">• P0 (Блокери): 0</tspan><tspan x="160.0" dy="14.3">• P1 (Критичні): 0</tspan><tspan x="160.0" dy="14.3">• P2/P3: задокументовані</tspan><tspan x="160.0" dy="14.3">• Crash / Panic rate: 0%</tspan><tspan x="160.0" dy="14.3">• Memory Leak: 0 байт</tspan></text>
<rect x="282.5" y="129.6" width="215.0" height="120.8" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="390.0" y="150.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">2. HIL Верифікація</tspan><tspan x="390.0" dy="14.3"></tspan><tspan x="390.0" dy="14.3">• 100% проходження HIL</tspan><tspan x="390.0" dy="14.3">• CAN / UART / SPI тести: OK</tspan><tspan x="390.0" dy="14.3">• Flash Wear стрес: OK</tspan><tspan x="390.0" dy="14.3">• WDT Recovery тест: OK</tspan><tspan x="390.0" dy="14.3">• Симуляція збоїв живлення</tspan></text>
<rect x="512.5" y="129.6" width="215.0" height="120.8" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="620.0" y="150.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">3. Бюджети заліза</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">• Flash ROM: &lt;= 85% сектора</tspan><tspan x="620.0" dy="14.3">• RAM (Stack watermark): OK</tspan><tspan x="620.0" dy="14.3">• Струм сну: &lt;= 15 мкА</tspan><tspan x="620.0" dy="14.3">• Піковий струм TX: у ліміті</tspan><tspan x="620.0" dy="14.3">• Холодний старт: &lt; 250 мс</tspan></text>
<rect x="737.5" y="129.6" width="215.0" height="120.8" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="845.0" y="150.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">4. 72h Soak / Burn-in</tspan><tspan x="845.0" dy="14.3"></tspan><tspan x="845.0" dy="14.3">• 50 пристроїв на стенді</tspan><tspan x="845.0" dy="14.3">• 72 год безперервної роботи</tspan><tspan x="845.0" dy="14.3">• Температура: -20..+70 °C</tspan><tspan x="845.0" dy="14.3">• 0 перезавантажень</tspan><tspan x="845.0" dy="14.3">• Стабільність радіоканалу</tspan></text>
