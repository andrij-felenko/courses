<text x="560.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Усі 120 досяжних значень RPN на відрізку 1…1000. Решта 880 цілих — недосяжні: 11 не вийде ніколи (просте, більше за 10),</tspan><tspan x="560.0" dy="18.8">625 = 5⁴ теж (чотири п'ятірки не вкласти у три множники ≤ 10). Шкала «від 1 до 1000» — ілюзія: справжніх поділок 120,</tspan><tspan x="560.0" dy="18.8">вони збиті внизу й розсіяні вгорі, а між 900 і 1000 зяє провал завширшки в десяту частину шкали.</tspan><tspan x="560.0" dy="18.8">Тому «RPN = 240» і «RPN = 200» — не сусіди на рівномірній лінійці, а дві сходинки нерівної та щербатої драбини.</tspan></text>
</svg>