<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відмова — це ланцюг: причина → вид → наслідок</text>
<rect x="40.0" y="118.0" width="210.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="145.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Причина</text><text x="145.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="145.0" dy="0.0">повторний запит</tspan><tspan x="145.0" dy="15.0">без захисту</tspan><tspan x="145.0" dy="15.0">від дублювання</tspan></text>
<rect x="340.0" y="118.0" width="210.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="445.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вид відмови</text><text x="445.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="445.0" dy="0.0">платіж</tspan><tspan x="445.0" dy="15.0">провівся двічі</tspan></text>
<rect x="730.0" y="118.0" width="210.0" height="104.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.7"/><text x="835.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідок</text><text x="835.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="835.0" dy="0.0">клієнта списано</tspan><tspan x="835.0" dy="15.0">двічі → втрата</tspan><tspan x="835.0" dy="15.0">довіри</tspan></text>
<line x1="250.0" y1="170.0" x2="340.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="550.0" y1="170.0" x2="610.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="700.0" y1="170.0" x2="730.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="610.0" y="142.0" width="90.0" height="56.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.7"/>
<text x="655.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">контроль</text>
<line x1="145.0" y1="222.0" x2="145.0" y2="246.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="145.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">O — частота</text><text x="145.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">як часто виникає причина</text>
<line x1="655.0" y1="198.0" x2="655.0" y2="246.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="655.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">D — виявність</text><text x="655.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">чи спіймаємо вчасно</text>
<line x1="835.0" y1="222.0" x2="835.0" y2="246.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 4"/><text x="835.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">S — тяжкість</text><text x="835.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">наскільки боляче наслідок</text>
<line x1="870.0" y1="314.0" x2="110.0" y2="314.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="490.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">тяжкість — на кінці ланцюга, тож читати варто справа наліво</text>
</svg>