<text x="65.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start" font-weight="700">Layer 3: /app/server (Бінарник застосунку v1.0.0)</text>
