<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="1020.0" height="520.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="520.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Монтаж та композиція шарів у ядрі Linux через OverlayFS</text>
<text x="520.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Об'єднання незмінних стеків lowerdir, семантика Copy-Up та видалення через whiteouts</text>
<rect x="30.0" y="85.0" width="470.0" height="430.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="265.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Структура каталогів на хості (Storage Driver)</text>
<rect x="45.0" y="125.0" width="440.0" height="85.0" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="55.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">upperdir (Контейнерний шар Read-Write)</text>
<text x="55.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• /etc/config.json (Створено новий файл конфігурації)</text>
<text x="55.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• /var/log/app.log (Запис логів процесу)</text>
<text x="55.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">• /bin/.wh.old_tool (Whiteout: видалення утиліти з нижнього шару)</text>
<rect x="45.0" y="220.0" width="440.0" height="45.0" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="55.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="start" font-weight="700">workdir (Службовий каталог ядра для атомарних операцій Copy-Up)</text>
<text x="55.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">Порожній у стані спокою; гарантує транзакційність мутацій</text>
<rect x="45.0" y="275.0" width="440.0" height="225.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="55.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">lowerdir stack (Незмінні шари образу Read-Only)</text>
