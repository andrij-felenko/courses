<text x="775.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#047857" text-anchor="middle" font-weight="700">mount -t overlay overlay -o lowerdir=L3:L2:L1:L0,upperdir=U,workdir=W merged</text>
