<rect x="24.0" y="256.0" width="892.0" height="170.0" rx="10" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.6"/>
<text x="44.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Головний закон швидкодії: перевірка рівня ДО обчислення параметрів</text>
<rect x="44.0" y="300.0" width="852.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="319.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">if (logger.IsEnabled(Level::Debug)) { logger.Debug(&quot;payload&quot;, ExpensiveSerialize(large_object)); }</tspan><tspan x="470.0" dy="14.3">Або через ліниві лямбди / вирази: logger.Debug(&quot;payload&quot;, [&amp;]{ return ExpensiveSerialize(obj); });</tspan></text>
<text x="44.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Без цієї перевірки виклик `logger.Debug(&quot;data: &quot; + serialize(obj))` виконає дорогу серіалізацію на кожній ітерації,</text>
<text x="44.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">навіть якщо рівень DEBUG вимкнено в конфігурації. Логер має відсікати неактивні рівні за 1 такт CPU.</text>
