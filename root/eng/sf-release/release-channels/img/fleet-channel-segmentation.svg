<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сегментація парку пристроїв за каналами оновлення</text>
<rect x="20.5" y="102.6" width="209.0" height="114.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="125.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">Nightly (~0.5% парку)</tspan><tspan x="125.0" dy="14.3"></tspan><tspan x="125.0" dy="14.3">• Розробники ядра</tspan><tspan x="125.0" dy="14.3">• Лабораторія HIL-тестів</tspan><tspan x="125.0" dy="14.3">• Експериментальні стенди</tspan><tspan x="125.0" dy="14.3"></tspan><tspan x="125.0" dy="14.3">Толерантність: критичні збої</tspan></text>
<rect x="236.9" y="102.6" width="236.2" height="114.8" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/><text x="355.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">Beta (~5% парку)</tspan><tspan x="355.0" dy="14.3"></tspan><tspan x="355.0" dy="14.3">• Early adopters і співробітники</tspan><tspan x="355.0" dy="14.3">• Пілотні об'єкти партнерів</tspan><tspan x="355.0" dy="14.3">• Нечутливі до збоїв вузли</tspan><tspan x="355.0" dy="14.3"></tspan><tspan x="355.0" dy="14.3">Толерантність: окремі баги</tspan></text>
<rect x="493.9" y="102.6" width="202.1" height="114.8" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="595.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Stable (~85% парку)</tspan><tspan x="595.0" dy="14.3"></tspan><tspan x="595.0" dy="14.3">• Кінцеві споживачі</tspan><tspan x="595.0" dy="14.3">• Основна комерційна мережа</tspan><tspan x="595.0" dy="14.3">• Виробничі сервери</tspan><tspan x="595.0" dy="14.3"></tspan><tspan x="595.0" dy="14.3">Толерантність: нульова</tspan></text>
<rect x="720.3" y="102.6" width="229.4" height="114.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="835.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="835.0" dy="0.0">LTS (~9.5% парку)</tspan><tspan x="835.0" dy="14.3"></tspan><tspan x="835.0" dy="14.3">• Енергопідстанції та лікарні</tspan><tspan x="835.0" dy="14.3">• Авіоніка та регульовані вузли</tspan><tspan x="835.0" dy="14.3">• Air-gapped середовища</tspan><tspan x="835.0" dy="14.3"></tspan><tspan x="835.0" dy="14.3">Толерантність: абсолютний нуль</tspan></text>
<line x1="60.0" y1="330.0" x2="900.0" y2="330.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="279.6" y="318.5" width="400.7" height="23.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Напрямок зростання ціни збою та вимог до надійності (SLO)</tspan></text>
<rect x="130.4" y="31.5" width="699.1" height="27.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="49.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Сегментація парку пристроїв: мінімізація радіуса ураження через диверсифікацію ризику</tspan></text>
<text x="480.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чим вища критичність вузла, тим довша затримка оновлення і жорсткіші критерії стабільності.</text>
</svg>