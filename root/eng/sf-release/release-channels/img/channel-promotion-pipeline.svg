<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр просування артефакту крізь канали</text>
<rect x="12.3" y="104.0" width="195.3" height="71.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="110.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">1. Nightly (Нічний)</tspan><tspan x="110.0" dy="14.3">• Збірка щоночі з trunk</tspan><tspan x="110.0" dy="14.3">• Автоматичні CI/HIL</tspan><tspan x="110.0" dy="14.3">• Ризик: високий (95% SLI)</tspan></text>
<rect x="268.9" y="104.0" width="202.1" height="71.9" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/><text x="370.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">2. Beta (Тестовий)</tspan><tspan x="370.0" dy="14.3">• Щотижневі збірки</tspan><tspan x="370.0" dy="14.3">• Early adopters і пілоти</tspan><tspan x="370.0" dy="14.3">• Ризик: помірний (99% SLI)</tspan></text>
<rect x="522.1" y="104.0" width="215.8" height="71.9" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">3. Stable (Стабільний)</tspan><tspan x="630.0" dy="14.3">• Реліз раз на 4-6 тижнів</tspan><tspan x="630.0" dy="14.3">• Масовий парк пристроїв</tspan><tspan x="630.0" dy="14.3">• Ризик: мінімальний (99.95%)</tspan></text>
<rect x="805.0" y="104.0" width="170.0" height="71.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">4. LTS (Довготривалий)</tspan><tspan x="890.0" dy="14.3">• Цикл 1-3 роки</tspan><tspan x="890.0" dy="14.3">• Промислові об'єкти</tspan><tspan x="890.0" dy="14.3">• Лише патчі безпеки</tspan></text>
<rect x="156.9" y="266.5" width="166.2" height="67.0" rx="6" fill="#fdf6e3" stroke="#d35400" stroke-width="1.5"/><text x="240.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Шлюз 1 (Trunk → Beta)</tspan><tspan x="240.0" dy="13.0">• 100% проходження тестів</tspan><tspan x="240.0" dy="13.0">• Відсутність збоїв збірки</tspan><tspan x="240.0" dy="13.0">• Статичний аналіз і ASan</tspan></text>
<rect x="399.8" y="266.5" width="200.4" height="67.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Шлюз 2 (Beta → Stable)</tspan><tspan x="500.0" dy="13.0">• Вікно витримування ≥ 14 днів</tspan><tspan x="500.0" dy="13.0">• Crash-free rate ≥ 99.95%</tspan><tspan x="500.0" dy="13.0">• Нуль регресій затримки/пам'яті</tspan></text>
<rect x="662.6" y="266.5" width="194.7" height="67.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Шлюз 3 (Stable → LTS)</tspan><tspan x="760.0" dy="13.0">• Кваліфікація в бойових умовах</tspan><tspan x="760.0" dy="13.0">• Заморозка API/ABI</tspan><tspan x="760.0" dy="13.0">• Підпис кворумом ключів HSM</tspan></text>
