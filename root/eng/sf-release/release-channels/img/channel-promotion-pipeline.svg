<text x="500.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Просування бінарника крізь канали гарантує поступове зниження ентропії та захист масового парку.</text>
