<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист промислового контуру від потрапляння нічних бінарників</text>
<rect x="35.8" y="149.8" width="188.5" height="100.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="168.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">1. Зовнішня зона</tspan><tspan x="130.0" dy="14.3">(Public Cloud)</tspan><tspan x="130.0" dy="14.3"></tspan><tspan x="130.0" dy="14.3">• Nightly / Beta / Stable</tspan><tspan x="130.0" dy="14.3">• Автоматичний CI/CD</tspan><tspan x="130.0" dy="14.3">• Відкриті мережі</tspan></text>
<rect x="282.6" y="149.8" width="174.9" height="100.5" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/><text x="370.0" y="168.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">2. Ключова ізоляція</tspan><tspan x="370.0" dy="14.3">(HSM Key Rings)</tspan><tspan x="370.0" dy="14.3"></tspan><tspan x="370.0" dy="14.3">• Nightly: CI ключ</tspan><tspan x="370.0" dy="14.3">• Beta: Dev ключ</tspan><tspan x="370.0" dy="14.3">• LTS: Кворум HSM 3-з-5</tspan></text>
<rect x="519.2" y="149.8" width="181.7" height="100.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="610.0" y="168.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">3. Шлюз безпеки</tspan><tspan x="610.0" dy="14.3">(Air-Gap Gateway)</tspan><tspan x="610.0" dy="14.3"></tspan><tspan x="610.0" dy="14.3">• Whitelist лише LTS</tspan><tspan x="610.0" dy="14.3">• Блокування URL Nightly</tspan><tspan x="610.0" dy="14.3">• Дезінфекція маніфестів</tspan></text>
<rect x="738.7" y="149.8" width="222.6" height="100.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="168.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">4. Промисловий вузол</tspan><tspan x="850.0" dy="14.3">(Hardware Lock)</tspan><tspan x="850.0" dy="14.3"></tspan><tspan x="850.0" dy="14.3">• eFuse апаратний ключ</tspan><tspan x="850.0" dy="14.3">• Захист BootROM</tspan><tspan x="850.0" dy="14.3">• Відхилення не-LTS бінарників</tspan></text>
<line x1="220.0" y1="200.0" x2="280.0" y2="200.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="460.0" y1="200.0" x2="520.0" y2="200.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="700.0" y1="200.0" x2="760.0" y2="200.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="165.8" y="356.0" width="648.4" height="28.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="490.0" y="374.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Ешелонована оборона: навіть при компрометації сервера OTA залізо відкине нічну збірку</tspan></text>
<rect x="156.6" y="31.5" width="666.9" height="27.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="49.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Архітектура багаторівневого захисту промислового контуру від нестабільних релізів</tspan></text>
<text x="490.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Апаратні ф'юзи та кворумні криптографічні підписи унеможливлюють випадковий апдейт промисловості.</text>
</svg>