<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія архітектурної ізоляції локальних модифікацій</text>
<rect x="60.0" y="65.0" width="700.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Рівень застосунку (Application &amp; Business Logic)</tspan><tspan x="410.0" dy="15.6">Власні алгоритми, мережеві протоколи, бізнес-правила системи</tspan></text>
<rect x="60.0" y="140.0" width="700.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="168.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Шар адаптації та фасаду (Glue / Shim Abstraction Layer)</tspan><tspan x="410.0" dy="15.6">Стабільний API для застосунку; приховує зміни версій ядра/RTOS</tspan></text>
<rect x="60.0" y="220.0" width="700.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="248.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Позадеревні драйвери (Out-of-Tree Drivers &amp; Modules)</tspan><tspan x="410.0" dy="15.6">Драйвери датчиків, кастомних шин (Zephyr modules, Linux loadable modules)</tspan></text>
<rect x="60.0" y="300.0" width="700.0" height="60.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/><text x="410.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Апаратна конфігурація (Device Tree Overlays &amp; Board Definitions)</tspan><tspan x="410.0" dy="15.6">.overlay файли, Kconfig дефконфіги специфічної плати без правок у dts вендора</tspan></text>
<rect x="60.0" y="375.0" width="700.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="403.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Чистий апстрим (Clean Upstream RTOS / Linux Baseline)</tspan><tspan x="410.0" dy="15.6">Незмінний оригінальний код ядра; 0 змінених рядків у дереві апстриму</tspan></text>
<line x1="410.0" y1="125.0" x2="410.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="410.0" y1="205.0" x2="410.0" y2="220.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="410.0" y1="285.0" x2="410.0" y2="300.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="410.0" y1="360.0" x2="410.0" y2="375.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="45.0" y1="367.0" x2="775.0" y2="367.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>
<rect x="152.7" y="447.5" width="514.7" height="21.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="461.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">МЕЖА ІЗОЛЯЦІЇ: Жоден комміт продукту не модифікує файли всередині апстриму</tspan></text>
</svg>