<rect x="480.0" y="360.0" width="310.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="635.0" y="384.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Спроба злиття через 18 місяців:</tspan><tspan x="635.0" dy="14.3">• 340 конфліктів у 85 файлах ядра</tspan><tspan x="635.0" dy="14.3">• Зсув архітектури підсистем (API drift)</tspan><tspan x="635.0" dy="14.3">• Неможливість отримати безпекові латки</tspan></text>
