<rect x="715.0" y="280.0" width="230.0" height="110.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
<text x="830.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">АРБІТРАЖ СТАНУ</text>
<text x="830.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Умови не виконані? (Рух / Низький заряд)</text>
<text x="830.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">→ Відкладення до зупинки (Safety Hold)</text>
<text x="830.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">→ Watchdog безпечного очікування</text>
<text x="830.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">→ Аварійна зупинка місії (Safe Fallback)</text>
<line x1="830.0" y1="390.0" x2="830.0" y2="430.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="895.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Інтерлоки OK</text>
<rect x="715.0" y="430.0" width="230.0" height="145.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="830.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">АКТИВАЦІЯ ТА РЕСТАРТ</text>
<text x="830.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Скидання кешів ФС (sync)</text>
<text x="830.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Атомарне перемикання A/B слота</text>
<text x="830.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Увімкнення апаратного Watchdog</text>
<text x="830.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Перезавантаження ядра Linux</text>
<text x="830.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• Підтвердження працездатності</text>
<line x1="300.0" y1="515.0" x2="355.0" y2="515.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="645.0" y1="515.0" x2="715.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
