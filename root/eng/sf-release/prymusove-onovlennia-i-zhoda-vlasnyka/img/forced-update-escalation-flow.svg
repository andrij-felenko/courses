<text x="830.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">БЕЗПЕЧНЕ ВИКОНАННЯ</text>
<rect x="715.0" y="110.0" width="230.0" height="130.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="830.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ШЛЮЗ БЕЗПЕКИ (INTERLOCKS)</text>
<text x="830.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Швидкість руху = 0 км/год</text>
<text x="830.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Стоянкове гальмо = АКТИВНЕ</text>
<text x="830.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Заряд АКБ &gt;= 50% або 220V</text>
<text x="830.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Актуатори знеструмлені</text>
<text x="830.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Drain фонових I/O операцій</text>
