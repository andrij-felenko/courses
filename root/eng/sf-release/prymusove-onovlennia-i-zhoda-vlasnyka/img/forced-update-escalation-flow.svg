<text x="500.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Кнопки: [Встановити зараз] / [Відкласти на 4 год]</text>
<line x1="500.0" y1="185.0" x2="500.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="355.0" y="210.0" width="290.0" height="95.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
<text x="500.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Фаза 2: Попередження з таймером</text>
<text x="500.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Вичерпано 80% часу або ліміт відмов</text>
<text x="500.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Банер у інтерфейсі + звукове сповіщення</text>
<text x="500.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">Відлік: «Оновлення відбудеться через 30 хв»</text>
<line x1="500.0" y1="305.0" x2="500.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="355.0" y="330.0" width="290.0" height="105.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="500.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза 3: Настання жорсткого дедлайну</text>
<text x="500.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Hard Deadline вичерпано (Time &gt;= T_deadline)</text>
<text x="500.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Блокування кнопки відхилення (Snooze Disabled)</text>
<text x="500.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Запит на вхід у режим підготовки до перезапуску</text>
<text x="500.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Перехід до арбітражу фізичної безпеки</text>
