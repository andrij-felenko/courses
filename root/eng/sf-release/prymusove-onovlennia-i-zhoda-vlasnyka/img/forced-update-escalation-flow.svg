<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік ескалації примусового оновлення та взаємодії з оператором</text>
<text x="500.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контур ескалації примусового оновлення: від сповіщення до дедлайну</text>
<rect x="40.0" y="60.0" width="260.0" height="150.0" rx="8" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="170.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ВХІДНИЙ МАНІФЕСТ</text>
<text x="170.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Рівень терміновості (Urgency)</text>
<text x="170.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Hard Deadline (Unix Timestamp)</text>
<text x="170.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Ліміт відкладень (Max Deferrals)</text>
<text x="170.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Підпис Ed25519 та перелік передумов</text>
<line x1="170.0" y1="210.0" x2="170.0" y2="255.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оцінка політики</text>
<rect x="40.0" y="255.0" width="260.0" height="335.0" rx="8" fill="#fffbf0" stroke="#d97706" stroke-width="1.8"/>
<text x="170.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">КЛАСИФІКАЦІЯ ТЕРМІНОВОСТІ</text>
<rect x="55.0" y="300.0" width="230.0" height="75.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="170.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">STANDARD_FEATURE</text>
<text x="170.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Безстрокове або м'яке вікно</text>
<text x="170.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Пріоритет повної згоди власника</text>
<rect x="55.0" y="385.0" width="230.0" height="85.0" rx="6" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.2"/>
<text x="170.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a21caf" text-anchor="middle" font-weight="700">MANDATORY_COMPLIANCE</text>
<text x="170.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Вікно відкладення: 7-14 діб</text>
<text x="170.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• До 5 відкладань користувачем</text>
<text x="170.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Стандарти UN R156 / ENISA</text>
<rect x="55.0" y="480.0" width="230.0" height="95.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="170.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">CRITICAL_ZERO_DAY</text>
<text x="170.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Жорсткий дедлайн: 2-24 години</text>
<text x="170.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Максимум 1-2 відкладення</text>
<text x="170.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Автоматична ескалація</text>
<rect x="340.0" y="60.0" width="320.0" height="530.0" rx="8" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="500.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ДИНАМІКА ВЗАЄМОДІЇ З ОПЕРАТОРОМ</text>
