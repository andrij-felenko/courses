<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 830" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="830" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один текст sendFrame — два шви, дві різні програми</text>
<rect x="260.0" y="73.9" width="780.0" height="60.2" rx="6" fill="#fffbea" stroke="#1a1a1a" stroke-width="2.2"/><text x="650.0" y="99.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">template &lt;class Transport&gt;   —   ОДИН текст у заголовку</tspan><tspan x="650.0" dy="18.2">Uplink&lt;Transport&gt;::sendFrame(frame)</tspan></text>
<rect x="60.0" y="168.0" width="540.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="330.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Transport = ITransport</tspan><tspan x="330.0" dy="18.2">ШОВ У ТАБЛИЦІ ВІРТУАЛЬНИХ МЕТОДІВ</tspan></text>
<rect x="700.0" y="168.0" width="540.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="970.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">Transport = UdpTransport | FakeTransport | SpyTransport</tspan><tspan x="970.0" dy="18.2">ШОВ У ТИПІ (шаблонний параметр)</tspan></text>
<rect x="60.0" y="252.0" width="540.0" height="132.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="330.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">ціль виклику знаходять у РАНТАЙМІ:</tspan><tspan x="330.0" dy="17.6"></tspan><tspan x="330.0" dy="17.6">mov  rax, [rdi]          ; vptr об'єкта</tspan><tspan x="330.0" dy="17.6">call [rax + 16]          ; слот send</tspan></text>
<rect x="700.0" y="252.0" width="540.0" height="132.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="970.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">ціль відома КОМПІЛЯТОРОВІ; на кожен тип</tspan><tspan x="970.0" dy="17.6">постає окрема копія функції:</tspan><tspan x="970.0" dy="17.6"></tspan><tspan x="970.0" dy="17.6">sendFrame⟨Udp⟩   sendFrame⟨Fake⟩   sendFrame⟨Spy⟩</tspan></text>
<rect x="60.0" y="400.0" width="540.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="330.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">тіло send лишається окремою функцією —</tspan><tspan x="330.0" dy="17.6">компілятор не бачить, куди веде стрибок</tspan></text>
<rect x="700.0" y="400.0" width="540.0" height="82.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="970.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">mtu() згортається в константу,</tspan><tspan x="970.0" dy="17.6">тіло send зливається з циклом</tspan></text>
<rect x="60.0" y="500.0" width="540.0" height="190.0" rx="6" fill="#f7fbff" stroke="#2457d6" stroke-width="1.8"/><text x="330.0" y="555.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">+  підміна в РАНТАЙМІ: транспорт із конфіга</tspan><tspan x="330.0" dy="17.6">+  одна копія коду на всі транспорти</tspan><tspan x="330.0" dy="17.6">+  реалізація ховається в .cpp</tspan><tspan x="330.0" dy="17.6">−  немає вбудовування й згортання констант</tspan><tspan x="330.0" dy="17.6">−  промах предиктора — перезапуск конвеєра</tspan><tspan x="330.0" dy="17.6">−  дубль МУСИТЬ успадкувати ITransport</tspan></text>
<rect x="700.0" y="500.0" width="540.0" height="190.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.8"/><text x="970.0" y="555.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">+  прямий виклик, вбудовування, згортання</tspan><tspan x="970.0" dy="17.6">+  дублеві досить мати методи потрібної форми</tspan><tspan x="970.0" dy="17.6">+  можна обійтися без віртуальних викликів зовсім</tspan><tspan x="970.0" dy="17.6">−  окрема копія коду на КОЖЕН тип: тиск на кеш</tspan><tspan x="970.0" dy="17.6">−  реалізація в заголовку: масова перезбірка</tspan><tspan x="970.0" dy="17.6">−  підміни в рантаймі немає взагалі</tspan></text>
<rect x="349.2" y="734.5" width="601.5" height="55.1" rx="6" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="1.8"/><text x="650.0" y="758.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Дублер живе там, де шов. Який шов прорізали — такі й вимоги до дубля:</tspan><tspan x="650.0" dy="17.6">підтип ITransport ліворуч, просто потрібна форма методів праворуч.</tspan></text>
</svg>