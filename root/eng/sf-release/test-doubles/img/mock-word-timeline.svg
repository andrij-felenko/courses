<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="900" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прийом стояв на місці — слово поїхало</text>
<line x1="214.0" y1="92.0" x2="214.0" y2="726.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="214.0" cy="164.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<line x1="224.0" y1="164.0" x2="262.0" y2="164.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="112.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">червень</tspan><tspan x="112.0" dy="16.9">2000</tspan></text>
<rect x="268.0" y="118.0" width="936.0" height="92.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="282.0" y="128.0" width="908.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.3"/><text x="736.0" y="147.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="736.0" dy="0.0">XP2000, Кальярі (Сардинія): доповідь «Endo-Testing»</tspan></text>
<rect x="282.0" y="164.0" width="908.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="736.0" y="178.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="736.0" dy="0.0">Мок — підміна, що НЕСЕ В СОБІ очікування й судить сама,</tspan><tspan x="736.0" dy="16.2">просто в мить неправильного виклику.</tspan></text>
<circle cx="214.0" cy="270.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<line x1="224.0" y1="270.0" x2="262.0" y2="270.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="112.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">2001</tspan></text>
<rect x="268.0" y="224.0" width="936.0" height="92.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="282.0" y="234.0" width="908.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.3"/><text x="736.0" y="253.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="736.0" dy="0.0">EasyMock: мок більше не пишуть руками</tspan></text>
<rect x="282.0" y="270.0" width="908.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="736.0" y="284.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="736.0" dy="0.0">Динамічний заступник під інтерфейс, режим «запис — відтворення».</tspan><tspan x="736.0" dy="16.2">Ціна створення дубля падає майже до нуля.</tspan></text>
<circle cx="214.0" cy="376.0" r="9.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<line x1="224.0" y1="376.0" x2="262.0" y2="376.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="112.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">липень</tspan><tspan x="112.0" dy="16.9">2004</tspan></text>
<rect x="268.0" y="330.0" width="936.0" height="92.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<rect x="282.0" y="340.0" width="908.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="736.0" y="359.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="736.0" dy="0.0">Фаулер, «Mocks Aren't Stubs»</tspan></text>
<rect x="282.0" y="376.0" width="908.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="736.0" y="390.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="736.0" dy="0.0">Дві школи розведені: класична звіряє стан,</tspan><tspan x="736.0" dy="16.2">мокістська — взаємодію. Слово вже потребує тлумача.</tspan></text>
<circle cx="214.0" cy="482.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<line x1="224.0" y1="482.0" x2="262.0" y2="482.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="112.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">жовтень</tspan><tspan x="112.0" dy="16.9">2004</tspan></text>
<rect x="268.0" y="436.0" width="936.0" height="92.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="282.0" y="446.0" width="908.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.3"/><text x="736.0" y="465.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="736.0" dy="0.0">OOPSLA, Ванкувер: «Mock Roles, not Objects»</tspan></text>
<rect x="282.0" y="482.0" width="908.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="736.0" y="496.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="736.0" dy="0.0">Самі автори друкують, що назва невдала: суть не в підміні,</tspan><tspan x="736.0" dy="16.2">а у відкритті вузьких ролей. З'являється jMock.</tspan></text>
<circle cx="214.0" cy="588.0" r="9.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<line x1="224.0" y1="588.0" x2="262.0" y2="588.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="112.0" y="593.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">2007</tspan></text>
<rect x="268.0" y="542.0" width="936.0" height="92.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<rect x="282.0" y="552.0" width="908.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="736.0" y="571.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="736.0" dy="0.0">Мезарош, xUnit Test Patterns</tspan></text>
<rect x="282.0" y="588.0" width="908.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="736.0" y="602.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="736.0" dy="0.0">Спільне ім'я для всіх підмін — тестовий дублер.</tspan><tspan x="736.0" dy="16.2">Мок стає однією з п'яти назв, а не парасолькою.</tspan></text>
<circle cx="214.0" cy="694.0" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.0"/>
<line x1="224.0" y1="694.0" x2="262.0" y2="694.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="112.0" y="699.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">2008</tspan></text>
<rect x="268.0" y="648.0" width="936.0" height="92.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<rect x="282.0" y="658.0" width="908.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.3"/><text x="736.0" y="677.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="736.0" dy="0.0">Mockito, а слідом gMock</tspan></text>
<rect x="282.0" y="694.0" width="908.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="736.0" y="708.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="736.0" dy="0.0">mock() дає дубля даром. Роль вирішує вже не назва об'єкта,</tspan><tspan x="736.0" dy="16.2">а те, чи покликав ти verify() наприкінці.</tspan></text>
<rect x="60.0" y="760.0" width="560.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="340.0" y="789.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">ЩО МАЛИ НА УВАЗІ АВТОРИ</tspan><tspan x="340.0" dy="16.9"></tspan><tspan x="340.0" dy="16.9">Спосіб вести проєктування: тест називає роль,</tspan><tspan x="340.0" dy="16.9">якої одиниця потребує, — і роль стає вузьким інтерфейсом.</tspan></text>
<rect x="640.0" y="760.0" width="540.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="910.0" y="789.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">ЩО СЛОВО ОЗНАЧАЄ ТЕПЕР</tspan><tspan x="910.0" dy="16.9"></tspan><tspan x="910.0" dy="16.9">Будь-яка підміна в тесті, зроблена бібліотекою, —</tspan><tspan x="910.0" dy="16.9">незалежно від того, яку роль вона насправді грає.</tspan></text>
</svg>