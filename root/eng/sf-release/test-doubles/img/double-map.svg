<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дублер — це відповідь на два незалежні питання</text>
<text x="755.5" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">чи КЕРУЄ тест тим, що одиниця чує  →</text>
<rect x="320.0" y="96.0" width="285.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="462.5" y="118.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="462.5" dy="0.0">дубль нічого</tspan><tspan x="462.5" dy="16.2">не відповідає</tspan></text>
<rect x="613.0" y="96.0" width="285.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="755.5" y="118.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.5" dy="0.0">готова відповідь,</tspan><tspan x="755.5" dy="16.2">яку задав тест</tspan></text>
<rect x="906.0" y="96.0" width="285.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="1048.5" y="118.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1048.5" dy="0.0">справжня логіка,</tspan><tspan x="1048.5" dy="16.2">тільки спрощена</tspan></text>
<rect x="50.0" y="96.0" width="250.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="175.0" y="118.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">↑ чи ДАЄ ПОБАЧИТИ,</tspan><tspan x="175.0" dy="16.2">що одиниця каже</tspan></text>
<rect x="50.0" y="180.0" width="250.0" height="105.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="175.0" y="220.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">несе очікування</tspan><tspan x="175.0" dy="16.2">НАПЕРЕД —</tspan><tspan x="175.0" dy="16.2">судить себе сам</tspan></text>
<rect x="50.0" y="333.0" width="250.0" height="105.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="175.0" y="373.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">записує виклики —</tspan><tspan x="175.0" dy="16.2">звіряєш їх ти</tspan><tspan x="175.0" dy="16.2">ПІСЛЯ дії</tspan></text>
<rect x="50.0" y="486.0" width="250.0" height="105.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="175.0" y="534.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">не дивиться,</tspan><tspan x="175.0" dy="16.2">кого й з чим кликали</tspan></text>
<rect x="320.0" y="466.0" width="285.0" height="145.0" rx="6" fill="#f7fbff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="334.0" y="480.0" width="257.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="462.5" y="499.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="462.5" dy="0.0">ПУСТУШКА</tspan><tspan x="462.5" dy="18.2">(dummy)</tspan></text>
<rect x="334.0" y="540.0" width="257.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="462.5" y="563.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="462.5" dy="0.0">аби заповнити</tspan><tspan x="462.5" dy="15.6">порожній параметр</tspan></text>
<rect x="613.0" y="466.0" width="285.0" height="145.0" rx="6" fill="#f7fbff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="627.0" y="480.0" width="257.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="755.5" y="499.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.5" dy="0.0">ЗАГЛУШКА</tspan><tspan x="755.5" dy="18.2">(stub)</tspan></text>
<rect x="627.0" y="540.0" width="257.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="755.5" y="563.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.5" dy="0.0">подає одиниці</tspan><tspan x="755.5" dy="15.6">заготований вхід</tspan></text>
<rect x="906.0" y="466.0" width="285.0" height="145.0" rx="6" fill="#f7fbff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="920.0" y="480.0" width="257.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="1048.5" y="499.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1048.5" dy="0.0">ФЕЙК</tspan><tspan x="1048.5" dy="18.2">(fake)</tspan></text>
<rect x="920.0" y="540.0" width="257.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1048.5" y="563.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1048.5" dy="0.0">робоча реалізація</tspan><tspan x="1048.5" dy="15.6">на спрощеній основі</tspan></text>
<rect x="320.0" y="160.0" width="578.0" height="145.0" rx="6" fill="#fff8f7" stroke="#c0392b" stroke-width="1.8"/>
<rect x="336.0" y="176.0" width="546.0" height="46.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="609.0" y="204.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="609.0" dy="0.0">МОК (mock)</tspan></text>
<rect x="336.0" y="234.0" width="546.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="609.0" y="257.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="609.0" dy="0.0">Очікування задані до дії; сам валить тест,</tspan><tspan x="609.0" dy="16.2">щойно виклик не той або зайвий.</tspan></text>
<rect x="320.0" y="313.0" width="578.0" height="145.0" rx="6" fill="#fff8f7" stroke="#c0392b" stroke-width="1.8"/>
<rect x="336.0" y="329.0" width="546.0" height="46.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="609.0" y="357.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="609.0" dy="0.0">ШПИГУН (spy)</tspan></text>
<rect x="336.0" y="387.0" width="546.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="609.0" y="410.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="609.0" dy="0.0">Мовчки веде журнал викликів;</tspan><tspan x="609.0" dy="16.2">вирок виносиш ти після дії.</tspan></text>
<rect x="906.0" y="160.0" width="285.0" height="298.0" rx="6" fill="#f6f6f6" stroke="#6b7280" stroke-width="1.4"/><text x="1048.5" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1048.5" dy="0.0">Ці дві клітинки теж</tspan><tspan x="1048.5" dy="15.6">трапляються: фейк,</tspan><tspan x="1048.5" dy="15.6">що веде журнал</tspan><tspan x="1048.5" dy="15.6">викликів.</tspan><tspan x="1048.5" dy="15.6"></tspan><tspan x="1048.5" dy="15.6">Усталеної назви їм</tspan><tspan x="1048.5" dy="15.6">не дали — важить</tspan><tspan x="1048.5" dy="15.6">не назва, а дві осі.</tspan></text>
<rect x="286.8" y="614.0" width="626.5" height="51.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="600.0" y="636.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Питання не «який дубль модніший», а: чи треба керувати тим, що одиниця чує,</tspan><tspan x="600.0" dy="16.9">і чи треба бачити те, що вона каже.</tspan></text>
</svg>