<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Error і warning: та сама стадія, різний наслідок</text>
<rect x="275.9" y="71.3" width="208.1" height="49.3" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/><text x="380.0" y="92.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Компілятор — стадія розбору</tspan><tspan x="380.0" dy="14.3">(граматика й типи)</tspan></text>
<rect x="40.0" y="150.0" width="320.0" height="150.0" rx="12" fill="#fbecec" stroke="#c0392b" stroke-width="2.2"/>
<text x="200.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ERROR — стоп-знак</text>
<text x="200.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">«не можу перекласти цей рядок»</text>
<text x="200.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">збірку спинено</text>
<text x="200.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">прошивки немає</text>
<text x="200.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">баг не доходить до чипа</text>
<rect x="400.0" y="150.0" width="320.0" height="150.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2.2"/>
<text x="560.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#caa24a" text-anchor="middle" font-weight="700">WARNING — жовтий знак</text>
<text x="560.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">«переклав, але підозріло»</text>
<text x="560.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">збірка триває</text>
<text x="560.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">прошивка є — з прихованим багом</text>
<text x="560.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">баг мовчки усередині чипа</text>
<line x1="275.9" y1="110.0" x2="230.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="484.1" y1="110.0" x2="530.0" y2="150.0" stroke="#caa24a" stroke-width="2.2"/>
<text x="380.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ігнорований ворнінг небезпечніший за помилку: ніщо не кричить</text>
</svg>