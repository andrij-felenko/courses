<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві осі перевірки: статична й динамічна</text>
<rect x="30.0" y="80.0" width="360.0" height="210.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="210.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">статична (без запуску)</text>
<text x="210.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ворнінги · статичний аналіз</text>
<line x1="50.0" y1="142.0" x2="370.0" y2="142.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="54.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">+ бачить весь код, усі шляхи</text>
<text x="54.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">+ не потребує виконання</text>
<text x="54.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">+ дешево і швидко</text>
<text x="54.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">− не знає реальних даних</text>
<text x="54.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">− можливі хибні тривоги</text>
<rect x="430.0" y="80.0" width="360.0" height="210.0" rx="12" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="610.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">динамічна (із запуском)</text>
<text x="610.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">тести · відлагоджувач · санітайзери</text>
<line x1="450.0" y1="142.0" x2="770.0" y2="142.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="454.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">+ бачить реальні значення</text>
<text x="454.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">+ ловить рантайм-баги</text>
<text x="454.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">+ перевіряє фізичну поведінку</text>
<text x="454.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">− лише пройдені шляхи</text>
<text x="454.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">− потрібне залізо або симулятор</text>
<circle cx="410.0" cy="185.0" r="24.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<text x="410.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="700">+</text>
<text x="410.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">статика ловить структурні вади; динаміка — поведінкові з реальними даними</text>
<text x="410.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">разом — повна сітка; порізно — сліпа пляма</text>
</svg>