<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири підсумки аналізу: тривога правдива чи хибна</text>
<text x="340.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">аналізатор мовчить</text>
<text x="560.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">аналізатор кричить</text>
<text x="214.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="214.0" dy="0.0">код</tspan><tspan x="214.0" dy="13.2">справний</tspan></text>
<text x="214.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="214.0" dy="0.0">код</tspan><tspan x="214.0" dy="13.2">дефектний</tspan></text>
<rect x="230.0" y="90.0" width="220.0" height="96.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="340.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">правильно тихо</text>
<text x="340.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">усе гаразд — і тиша</tspan></text>
<rect x="450.0" y="90.0" width="220.0" height="96.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="560.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">ХИБНА ТРИВОГА</text>
<text x="560.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">галас на чистому коді</tspan><tspan x="560.0" dy="12.3">(false positive)</tspan></text>
<rect x="230.0" y="186.0" width="220.0" height="96.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="340.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ПРОПУСК</text>
<text x="340.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">дефект проліз повз</tspan><tspan x="340.0" dy="12.3">(false negative)</tspan></text>
<rect x="450.0" y="186.0" width="220.0" height="96.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="560.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">правильна знахідка</text>
<text x="560.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">дефект і спіймано</tspan></text>
<text x="360.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">агресивніший аналіз ловить більше дефектів, але дає більше хибних тривог</text>
<text x="360.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">налаштування = вибір точки балансу між пропуском і галасом</text>
</svg>