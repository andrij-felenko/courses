<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аналіз потоку даних: стан змінної як решітка</text>
<rect x="30.0" y="110.0" width="150.0" height="92.0" rx="10" fill="#f1f1f1" stroke="#6b7280" stroke-width="2.0"/>
<text x="105.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">unknown</text>
<text x="105.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">ще нічого</tspan><tspan x="105.0" dy="12.3">не відомо</tspan></text>
<rect x="213.3" y="110.0" width="150.0" height="92.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="288.3" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">allocated</text>
<text x="288.3" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="288.3" dy="0.0">malloc повернув</tspan><tspan x="288.3" dy="12.3">живу пам'ять</tspan></text>
<line x1="184.0" y1="156.0" x2="209.3" y2="156.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="196.7" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">malloc</text>
