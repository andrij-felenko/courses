<text x="471.7" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="700">freed</text>
<text x="471.7" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="471.7" dy="0.0">free() —</tspan><tspan x="471.7" dy="12.3">пам'ять мертва</tspan></text>
<line x1="367.3" y1="156.0" x2="392.7" y2="156.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="380.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">free</text>
<rect x="580.0" y="110.0" width="150.0" height="92.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="655.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">use</text>
<text x="655.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">розіменування</tspan><tspan x="655.0" dy="12.3">мертвого = дефект</tspan></text>
<line x1="550.7" y1="156.0" x2="576.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="563.3" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">*ptr</text>
<text x="380.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">аналізатор веде стан покажчика крізь усі шляхи; перехід у «use» після «freed» — дефект</text>
<text x="380.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">те саме для NULL (може-NULL → розіменовано) і для меж (індекс поза розміром)</text>
