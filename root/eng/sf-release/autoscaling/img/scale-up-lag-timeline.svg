<text x="945.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Час після стрибка →</text>
<rect x="24.0" y="70.0" width="172.0" height="135.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="110.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">1. Збір метрик</text>
