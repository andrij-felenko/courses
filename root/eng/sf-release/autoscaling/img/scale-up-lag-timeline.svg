<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія затримки масштабування: чому новий сервер з'являється лише через 2-5 хвилин</text>
