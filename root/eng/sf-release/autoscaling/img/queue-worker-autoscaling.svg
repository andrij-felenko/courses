<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1003.5 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1003.5" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Масштабування асинхронних обробників за глибиною черги (Event/Queue-driven)</text>
<rect x="30.0" y="65.0" width="260.0" height="200.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
<text x="160.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">1. Джерело подій / Черга</text>
<rect x="50.0" y="110.0" width="220.0" height="65.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="160.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Kafka Lag / SQS Backlog</text>
<text x="160.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">L = 45 000 повідомлень</text>
<text x="160.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Швидкість приходу: λ = 500 msg/s</text>
<text x="160.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Дедлайн обробки: T_target = 60 s</text>
<text x="160.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Час обробки 1 задачі: t_task = 0.2 s</text>
<rect x="340.0" y="65.0" width="300.0" height="200.0" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.4"/>
<text x="490.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c026d3" text-anchor="middle" font-weight="700">2. Контролер черги (KEDA / HPA)</text>
<rect x="360.0" y="110.0" width="260.0" height="80.0" rx="4" fill="#ffffff" stroke="#f0abfc" stroke-width="1.2"/>
<text x="490.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Формула розрахунку воркерів:</text>
<text x="490.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c026d3" text-anchor="middle" font-weight="700">N = ceil( L · t_task / T_target )</text>
<text x="490.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">N = ceil( 45000 · 0.2 / 60 ) = 150</text>
<text x="490.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Scale-to-Zero: якщо L = 0 → N = 0</text>
<text x="490.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Захист БД: N ≤ MaxWorkers (200)</text>
<rect x="690.0" y="65.0" width="260.0" height="200.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
<text x="820.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">3. Пул воркерів (Workers)</text>
<rect x="715.0" y="115.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="737.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W1</text>
<rect x="770.0" y="115.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="792.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W2</text>
<rect x="825.0" y="115.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="847.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W3</text>
<rect x="880.0" y="115.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="902.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W4</text>
<rect x="715.0" y="155.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="737.5" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W5</text>
<rect x="770.0" y="155.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="792.5" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W6</text>
<rect x="825.0" y="155.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="847.5" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W7</text>
<rect x="880.0" y="155.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="902.5" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W8</text>
<rect x="715.0" y="195.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="737.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W9</text>
<rect x="770.0" y="195.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="792.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W10</text>
<rect x="825.0" y="195.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="847.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W11</text>
<rect x="880.0" y="195.0" width="45.0" height="30.0" rx="4" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
<text x="902.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">W12</text>
<text x="820.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">Пропускна здатність: 750 msg/s</text>
<line x1="293.0" y1="165.0" x2="337.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="643.0" y1="165.0" x2="687.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="290.0" width="920.0" height="165.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Чому метрика CPU не працює для черг, а довжина черги (Lag) — працює:</text>
<circle cx="52.0" cy="340.0" r="3.5" fill="#dc2626" stroke="#dc2626" stroke-width="1.0"/>
<text x="66.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">Проблема CPU для воркерів:</text>
<text x="340.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Якщо є 2 воркери і 1 000 000 задач, обидва завантажені на 100% CPU. Завантаження не каже, чи треба 3 воркери, чи 500.</text>
<circle cx="52.0" cy="366.0" r="3.5" fill="#059669" stroke="#059669" stroke-width="1.0"/>
<text x="66.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="700">Перевага довжини черги (Lag):</text>
<text x="340.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Кількість задач у черзі точно вказує обсяг накопиченої роботи. Формула дає точну кількість воркерів під SLA.</text>
<circle cx="52.0" cy="392.0" r="3.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.0"/>
<text x="66.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700">Масштабування до нуля (Scale-to-Zero):</text>
<text x="340.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Коли черга порожня, можна зупинити всі воркери (N=0) і заощадити 100% вартості compute.</text>
<circle cx="52.0" cy="418.0" r="3.5" fill="#d97706" stroke="#d97706" stroke-width="1.0"/>
<text x="66.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">Захист від перевантаження сховища:</text>
<text x="340.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Якщо воркери пишуть в один PostgreSQL, ліміт maxReplicas рятує базу від загибелі під час сплеску.</text>
</svg>