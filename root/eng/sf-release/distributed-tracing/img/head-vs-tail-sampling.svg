<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння стратегій вибірки трейсів: Head-based проти Tail-based</text>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння стратегій вибірки: Head-based проти Tail-based</text>
<rect x="30.0" y="60.0" width="430.0" height="390.0" rx="8" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.2"/>
<text x="245.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Head-based семплінг (на вході)</text>
<rect x="85.0" y="118.3" width="320.0" height="43.3" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="245.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">1. Вхідний запит на API Gateway</tspan><tspan x="245.0" dy="14.3">[Рішення приймається миттєво]</tspan></text>
<line x1="245.0" y1="170.0" x2="245.0" y2="205.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="85.0" y="206.2" width="320.0" height="57.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="245.0" y="224.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Імовірнісний фільтр (наприклад, 1%)</tspan><tspan x="245.0" dy="14.3">99% — прапорець sampled=0</tspan><tspan x="245.0" dy="14.3">1% — прапорець sampled=1</tspan></text>
<line x1="245.0" y1="275.0" x2="245.0" y2="310.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="75.0" y="341.0" width="340.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="355.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Переваги: нульова затримка, мінімум пам'яті.</tspan><tspan x="245.0" dy="13.0">Недолік: рідкісні помилки (HTTP 500) у 99%</tspan><tspan x="245.0" dy="13.0">відкинутих трейсів губляться назавжди!</tspan></text>
<rect x="500.0" y="60.0" width="430.0" height="390.0" rx="8" fill="#fcfdfe" stroke="#27ae60" stroke-width="1.2"/>
<text x="715.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Tail-based семплінг (на виході)</text>
<rect x="550.0" y="118.3" width="330.0" height="43.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="715.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">1. Усі сервіси генерують спани</tspan><tspan x="715.0" dy="14.3">[100% спанів надсилаються в OTel Collector]</tspan></text>
<line x1="715.0" y1="170.0" x2="715.0" y2="205.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="545.0" y="195.0" width="340.0" height="80.0" rx="6" fill="#fff3e0" stroke="#333333" stroke-width="1.5"/><text x="715.0" y="212.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Буферизація в пам'яті OTel Collector (30с)</tspan><tspan x="715.0" dy="13.0">Оцінка завершеного графа трейсу:</tspan><tspan x="715.0" dy="13.0">• Помилка (error=true) → ЗБЕРЕГТИ 100%</tspan><tspan x="715.0" dy="13.0">• Затримка &gt; 500ms → ЗБЕРЕГТИ 100%</tspan><tspan x="715.0" dy="13.0">• Успішні швидкі → ЗБЕРЕГТИ 0.1%</tspan></text>
<line x1="715.0" y1="290.0" x2="715.0" y2="320.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="545.0" y="351.0" width="340.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="715.0" y="365.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Переваги: 100% видимість усіх збоїв та хвостів p99.</tspan><tspan x="715.0" dy="13.0">Недолік: вимагає буфера пам'яті на колекторі</tspan><tspan x="715.0" dy="13.0">та маршрутизації за Trace ID (routing connector).</tspan></text>
</svg>