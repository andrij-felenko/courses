<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дилема інтеграції: наскрізні тести, моки та контрактні тести</text>
<text x="540.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три підходи до перевірки міжсервісних стиків</text>
<rect x="40.0" y="75.0" width="320.0" height="360.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="200.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Наскрізні тести (E2E)</text>
<line x1="60.0" y1="123.0" x2="340.0" y2="123.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="71.9" y="161.5" width="66.2" height="27.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="105.0" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">Сервіс А</tspan></text>
<rect x="166.9" y="161.5" width="66.2" height="27.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Сервіс Б</tspan></text>
<rect x="261.9" y="161.5" width="66.2" height="27.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="295.0" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">Сервіс В</tspan></text>
<line x1="140.0" y1="175.0" x2="165.0" y2="175.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="235.0" y1="175.0" x2="260.0" y2="175.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="143.0" width="280.0" height="68.0" rx="5" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="200.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">спільне важке середовище</text>
<text x="200.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">3+ сервіси разом у тестовому</tspan><tspan x="200.0" dy="16.8">середовищі; висока вартість,</tspan><tspan x="200.0" dy="16.8">миготіння, пошук серед тисяч рядків</tspan></text>
<rect x="100.7" y="369.0" width="198.6" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Зона підозри: вся мережа</tspan></text>
<rect x="380.0" y="75.0" width="320.0" height="360.0" rx="8" fill="#ffffff" stroke="#b8860b" stroke-width="2.0"/>
<text x="540.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b8860b" text-anchor="middle" font-weight="700">Ізольовані моки</text>
<line x1="400.0" y1="123.0" x2="680.0" y2="123.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="426.9" y="161.5" width="66.2" height="27.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Сервіс А</tspan></text>
<rect x="564.4" y="161.5" width="91.2" height="27.0" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="610.0" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Ручний мок Б</tspan></text>
<line x1="505.0" y1="175.0" x2="555.0" y2="175.0" stroke="#b8860b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="540.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-style="italic">віра в поведінку без перевірки</text>
<text x="540.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Кожен сервіс окремо; замість</tspan><tspan x="540.0" dy="16.8">сусідів — вигадані стаби. Швидко,</tspan><tspan x="540.0" dy="16.8">але моки тихо дрейфують від реальності</tspan></text>
<rect x="440.7" y="369.0" width="198.6" height="32.0" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="540.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Ризик: хибнозелені тести</tspan></text>
<rect x="720.0" y="75.0" width="320.0" height="360.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="880.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Контрактні тести</text>
<line x1="740.0" y1="123.0" x2="1020.0" y2="123.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="771.9" y="152.0" width="46.2" height="22.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="795.0" y="166.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Тест А</tspan></text>
<rect x="846.7" y="178.5" width="66.6" height="23.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Контракт</tspan></text>
<rect x="941.9" y="152.0" width="46.2" height="22.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="965.0" y="166.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">Тест Б</tspan></text>
<line x1="825.0" y1="167.0" x2="838.0" y2="185.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="922.0" y1="185.0" x2="935.0" y2="167.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="880.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">обидва звіряються з одним файлом</text>
<text x="880.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Два швидкі ізольовані тести,</tspan><tspan x="880.0" dy="16.8">пов'язані єдиним виконуваним</tspan><tspan x="880.0" dy="16.8">артефактом-контрактом у CI</tspan></text>
<rect x="758.4" y="369.0" width="243.2" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Ізоляція + доведена сумісність</tspan></text>
<text x="540.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контрактний тест розділяє інтеграцію на дві локальні перевірки без розгортання спільного стенда.</text>
