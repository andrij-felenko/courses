<rect x="40.0" y="420.0" width="876.0" height="36.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/><text x="478.0" y="441.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="478.0" dy="0.0">Помилка людини — симптом, а не причина · Дія інженера є лише спусковим гачком; аварія відбувається тому, що захисні шари містили латентні пробоїни.</tspan></text>
<rect x="40.0" y="462.0" width="876.0" height="36.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/><text x="478.0" y="483.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="478.0" dy="0.0">Покарання маскує вразливості · Звільнення інженера не закриває жодного отвору в системі: наступний інженер зіткнеться з тією ж пасткою.</tspan></text>
