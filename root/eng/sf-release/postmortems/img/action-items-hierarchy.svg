<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія надійності коригувальних дій (Hierarchy of Action Items)</text>
<rect x="40.0" y="64.0" width="880.0" height="92.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="60.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">1 · Архітектурне усунення (Elimination)</text>
<rect x="730.0" y="76.0" width="174.0" height="26.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="817.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Найвища стійкість</text>
<rect x="60.0" y="104.0" width="840.0" height="42.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/><text x="480.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Повне вилучення класу вразливості: статична типізація, незмінна інфраструктура, закриття небезпечних CLI-команд.</tspan></text>
<rect x="40.0" y="168.0" width="880.0" height="92.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="60.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">2 · Інженерна автоматизація (Automation &amp; Guardrails)</text>
<rect x="730.0" y="180.0" width="174.0" height="26.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="817.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Висока стійкість</text>
<rect x="60.0" y="208.0" width="840.0" height="42.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/><text x="480.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Автоматичний відкіт при деградації метрик, валідаційні вебхуки у k8s, обмеження ретраїв, circuit breakers.</tspan></text>
<rect x="40.0" y="272.0" width="880.0" height="92.0" rx="8" fill="#fdf6e3" stroke="#b08900" stroke-width="1.8"/>
<text x="60.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="start" font-weight="700">3 · Діагностика та спостережуваність (Detection &amp; Alerts)</text>
<rect x="730.0" y="284.0" width="174.0" height="26.0" rx="4" fill="#ffffff" stroke="#b08900" stroke-width="1.2"/>
<text x="817.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700">Середня стійкість</text>
<rect x="60.0" y="312.0" width="840.0" height="42.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/><text x="480.0" y="336.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Додавання гранулярних SLI-метрик, нові правила алертів, розподілене трасування вузьких місць.</tspan></text>
<rect x="40.0" y="376.0" width="880.0" height="92.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="60.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">4 · Процедурні вимоги та інструкції (Administrative &amp; Runbooks)</text>
<rect x="730.0" y="388.0" width="174.0" height="26.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="817.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Найнижча стійкість (крихкість)</text>
<rect x="60.0" y="416.0" width="840.0" height="42.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/><text x="480.0" y="440.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Оновлення регламентів, документації, заклик «бути уважнішим під час деплою», додатковий ручний чеклист.</tspan></text>
<rect x="40.0" y="484.0" width="880.0" height="24.0" rx="4" fill="#fbfbfb" stroke="#333333" stroke-width="1.0"/>
<text x="480.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" font-weight="700">▲ ЕФЕКТИВНІСТЬ ЗРОСТАЄ: Від пасивного покладання на пам'ять людини до автоматичних системних гарантій</text>
</svg>