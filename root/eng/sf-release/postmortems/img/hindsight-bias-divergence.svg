<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Омана ретроспективного погляду: сприйняття в момент дії проти погляду постфактум</text>
<rect x="24.0" y="56.0" width="436.0" height="420.0" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="242.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ПІД ЧАС ІНЦИДЕНТУ (ПОГЛЯД ЗСЕРЕДИНИ)</text>
<text x="242.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Принцип локальної раціональності (Local Rationality)</text>
<rect x="40.0" y="120.0" width="404.0" height="76.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="242.0" y="155.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="242.0" dy="0.0">Шум та неповнота даних</tspan><tspan x="242.0" dy="11.7">Десятки суперечливих алертів, графіки латентності зростають у 15 сервісах одночасно.</tspan></text>
<rect x="40.0" y="206.0" width="404.0" height="76.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="242.0" y="241.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="242.0" dy="0.0">Психологічний тиск часу</tspan><tspan x="242.0" dy="11.7">Падіння SLO, кожна хвилина простою коштує бізнесу тисячі доларів, черговий діє швидко.</tspan></text>
<rect x="40.0" y="292.0" width="404.0" height="76.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="242.0" y="327.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="242.0" dy="0.0">Локальна обґрунтованість</tspan><tspan x="242.0" dy="11.7">Вибрана гіпотеза повністю відповідала даним і документації, доступним черговому о 03:15.</tspan></text>
<rect x="40.0" y="378.0" width="404.0" height="76.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="242.0" y="413.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="242.0" dy="0.0">Розпорошена увага</tspan><tspan x="242.0" dy="11.7">Інженер оперує поточною робочою пам'яттю і не може знати про паралельний реліз сусідньої команди.</tspan></text>
<rect x="500.0" y="56.0" width="436.0" height="420.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="718.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ПІСЛЯ ІНЦИДЕНТУ (РЕТРОСПЕКТИВНА ОМАНА)</text>
<text x="718.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ілюзія очевидності та неминучості наслідків</text>
<rect x="516.0" y="120.0" width="404.0" height="76.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="718.0" y="155.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="718.0" dy="0.0">Знання результату спотворює аналіз</tspan><tspan x="718.0" dy="11.7">Коли фінал відомий, ланцюг подій здається простим, лінійним і заздалегідь визначеним.</tspan></text>
<rect x="516.0" y="206.0" width="404.0" height="76.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="718.0" y="241.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="718.0" dy="0.0">Ігнорування інформаційного шуму</tspan><tspan x="718.0" dy="11.7">Критики бачать лише один ключовий лог, забуваючи про 10 000 паралельних нерелевантних повідомлень.</tspan></text>
<rect x="516.0" y="292.0" width="404.0" height="76.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="718.0" y="327.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="718.0" dy="0.0">Звинувачення інженера («як можна було...»)</tspan><tspan x="718.0" dy="11.7">«Чому він не перевірив рядок 42?» — хоча до аварії рядок 42 ніколи не викликав збоїв.</tspan></text>
<rect x="516.0" y="378.0" width="404.0" height="76.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="718.0" y="413.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="718.0" dy="0.0">Хибне відчуття безпеки</tspan><tspan x="718.0" dy="11.7">Покарання «винного» створює ілюзію вирішення проблеми, залишаючи системну пастку незмінною.</tspan></text>
</svg>