<line x1="75.0" y1="315.0" x2="180.0" y2="315.0" stroke="#2563eb" stroke-width="2.2"/>
<line x1="180.0" y1="315.0" x2="260.0" y2="415.0" stroke="#ea580c" stroke-width="2.2"/>
<line x1="260.0" y1="415.0" x2="300.0" y2="465.0" stroke="#dc2626" stroke-width="2.2"/>
<line x1="300.0" y1="465.0" x2="475.0" y2="465.0" stroke="#dc2626" stroke-width="2.2"/>
<text x="180.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">Команда 0x20 (Erase)</text>
<text x="240.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="700">Brownout фаза</text>
<text x="350.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">0 В (Повне знеструмлення)</text>
<rect x="520.0" y="235.0" width="490.0" height="280.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="765.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Трансформація стану напівпровідникової комірки</text>
<rect x="540.0" y="285.0" width="450.0" height="60.0" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="550.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="start" font-weight="700">Стертий сектор (0xFF)</text>
<text x="550.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">Усі електрони видалені з плаваючого затвора. Порогова напруга V_th низька.</text>
<rect x="540.0" y="355.0" width="450.0" height="75.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
<text x="550.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">Метастабільний стан (Torn Write / Half-Erased)</text>
<text x="550.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start">Зарядовий насос згас на середині тунелювання. V_th знаходиться рівно</text>
<text x="550.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start">на межі компаратора читання. Байт читається як 0 або 1 залежно від температури.</text>
<rect x="540.0" y="440.0" width="450.0" height="60.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="550.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">Коректно записані дані (0x00..0xFE)</text>
<text x="550.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">Фіксований інжектований заряд, валідний CRC32 сторінки.</text>
