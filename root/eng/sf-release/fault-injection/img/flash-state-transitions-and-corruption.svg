<text x="70.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="end">2.7 В (BOR Поріг)</text>
<line x1="75.0" y1="415.0" x2="475.0" y2="415.0" stroke="#dc2626" stroke-width="1.0" stroke-dasharray="4,4"/>
