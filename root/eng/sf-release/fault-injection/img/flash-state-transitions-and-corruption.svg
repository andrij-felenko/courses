<text x="475.0" y="481.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#44403c" text-anchor="end">Час (t)</text>
<text x="70.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#44403c" text-anchor="end">V_DD (В)</text>
<line x1="75.0" y1="315.0" x2="475.0" y2="315.0" stroke="#16a34a" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="70.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="end">3.3 В (Номінал)</text>
