<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25.5 -10 1065.5 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-25.5" y="-10" width="1065.5" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="1020.0" height="520.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="520.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Фізика збою Flash-пам'яті: часові масштаби операцій та вікно метастабільності</text>
<text x="520.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Колапс зарядового насоса, розрив транзакції стирання та утворення нестабільних бітів</text>
<rect x="30.0" y="85.0" width="980.0" height="130.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text x="520.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Ієрархія тривалості операцій кремнієвого накопичувача (NOR / NAND Flash)</text>
<rect x="50.0" y="125.0" width="160.0" height="45.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<text x="130.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0369a1" text-anchor="middle" font-weight="700">Читання байта/слова</text>
<text x="130.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0c4a6e" text-anchor="middle">20 – 50 нс (Безпечно)</text>
<rect x="230.0" y="125.0" width="240.0" height="45.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="350.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Програмування сторінки (Page)</text>
<text x="350.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#78350f" text-anchor="middle">100 – 400 мкс (Вікно Torn Write)</text>
<rect x="490.0" y="125.0" width="500.0" height="45.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
<text x="740.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">Стирання сектора / блоку (Sector Erase, 4 КБ – 64 КБ)</text>
<text x="740.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">20 – 400 мс: Критична зона високовольтного тунелювання заряду (12-18 В)</text>
<text x="520.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">Асиметрія: стирання триває у 1000 разів довше за запис — 95% обривів живлення вражають саме його</text>
<rect x="30.0" y="235.0" width="470.0" height="280.0" rx="6" fill="#fafaf9" stroke="#78716c" stroke-width="1.3"/>
<text x="265.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#292524" text-anchor="middle" font-weight="700">Динаміка напруги живлення та колапс Flash</text>
