<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="1020.0" height="530.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="520.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Атомарне перемикання A/B-слотів під час обриву живлення</text>
<text x="520.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Двобанкова схема прошивки, маркери стану завантажувача та безпечний відкат (Rollback)</text>
<rect x="30.0" y="85.0" width="270.0" height="440.0" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="165.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Завантажувальний сектор (MCUboot)</text>
<text x="165.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">ROM / Первинний Bootloader (Фіксований)</text>
<rect x="45.0" y="150.0" width="240.0" height="170.0" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/>
<text x="165.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Таблиця стану OTA (Metadata)</text>
<text x="165.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">• Active Slot: SLOT_A (v1.0)</text>
<text x="165.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">• Target Slot: SLOT_B (v2.0)</text>
<text x="165.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">• State: UPDATING (0x01)</text>
<text x="165.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">• CRC32 Expected: 0x8F3C21A4</text>
<text x="165.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">• Boot Attempts Left: 3</text>
<text x="165.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">• Magic Header: 0x544F4F42</text>
<rect x="45.0" y="340.0" width="240.0" height="155.0" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.1"/>
<text x="165.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Логіка верифікації при рестарті</text>
<text x="165.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">1. Читання маркерів OTA метаданих</text>
<text x="165.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">2. Перевірка цілісності слота B</text>
<text x="165.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-weight="700">3. CRC32 пошкоджено? (Обрив)</text>
<text x="165.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">4. Анулювання спроби запису</text>
<text x="165.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700">5. Атомарний запуск слота A</text>
<text x="165.0" y="481.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">Пристрій залишається працездатним</text>
<rect x="330.0" y="85.0" width="320.0" height="440.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="490.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Слот A: Поточна стабільна версія (v1.0)</text>
<text x="490.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Flash адреса: 0x08020000 – 0x080A0000 (512 КБ)</text>
<rect x="345.0" y="150.0" width="290.0" height="110.0" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.2"/>
<text x="490.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Заголовок образу (Image Header)</text>
<text x="490.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">• Версія: v1.0.4-release</text>
<text x="490.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">• Підпис ECDSA-256: Валідний</text>
<text x="490.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">• CRC32: 0xA1B2C3D4 (Збігається)</text>
<text x="490.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">• Прапорець: CONFIRMED</text>
<rect x="345.0" y="275.0" width="290.0" height="220.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="490.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Тіло прошивки (Vector Table + Code)</text>
<text x="490.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Вектори переривань ARM Cortex-M</text>
<text x="490.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Ядро операційної системи (FreeRTOS)</text>
<text x="490.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Драйвери зв'язку та периметра безпеки</text>
<text x="490.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Стек протоколів та бізнес-логіка</text>
<text x="490.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Недоторканний банк під час оновлення!</text>
<text x="490.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Жоден біт слота A не змінюється, доки</text>
<text x="490.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">новий образ не пройде повний POST тест.</text>
<text x="490.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Стан: СТАБІЛЬНИЙ / РОБОЧИЙ</text>
<rect x="680.0" y="85.0" width="330.0" height="440.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
<text x="845.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#be123c" text-anchor="middle" font-weight="700">Слот B: Цільовий банк (v2.0) [ОБРИВ]</text>
<text x="845.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Flash адреса: 0x080A0000 – 0x08120000 (512 КБ)</text>
<rect x="695.0" y="150.0" width="300.0" height="110.0" rx="4" fill="#ffffff" stroke="#f43f5e" stroke-width="1.2"/>
<text x="845.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9f1239" text-anchor="middle" font-weight="700">Заголовок нового образу (v2.0.0)</text>
<text x="845.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e11d48" text-anchor="middle">• Записано блоків: 64 з 128</text>
<text x="845.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e11d48" text-anchor="middle" font-weight="700">• Стан: Сектор 0x080E0000 недотертий</text>
<text x="845.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">• Обчислений CRC32: 0x00000000 (Помилка)</text>
<text x="845.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9f1239" text-anchor="middle" font-weight="700">• Прапорець: CORRUPTED_IMAGE</text>
<rect x="695.0" y="275.0" width="300.0" height="220.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="845.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Анатомія розриву (Power-Cut Impact)</text>
<text x="845.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle">Блок 0–63: Валідний бінарний код v2.0</text>
<text x="845.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">Блок 64: Обрив напруги на 320 мкс стирання</text>
<text x="845.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Блок 65–127: Залишки старої версії / 0xFF</text>
<text x="845.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">Наслідок без A/B слотів:</text>
<text x="845.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">Пристрій перетворюється на «цеглину».</text>
<text x="845.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Наслідок з A/B схемою:</text>
<text x="845.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">Bootloader ігнорує слот B і стартує слот A.</text>
<text x="845.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#be123c" text-anchor="middle" font-weight="700">Стан: ВІДХИЛЕНО / ВІДКОЧЕНО</text>
<line x1="300.0" y1="215.0" x2="330.0" y2="215.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
