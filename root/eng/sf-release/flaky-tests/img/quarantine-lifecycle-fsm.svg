<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінцевий автомат системи автоматичного карантину миготливих тестів у CI</text>
<rect x="33.8" y="126.4" width="232.3" height="67.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="150.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">АКТИВНИЙ ТЕСТ</tspan><tspan x="150.0" dy="15.6">(Active / Blocking)</tspan><tspan x="150.0" dy="15.6">Блокує злиття PR у разі збою</tspan></text>
<rect x="431.3" y="126.4" width="217.4" height="67.2" rx="6" fill="#fff8e1" stroke="#d97706" stroke-width="2.0"/><text x="540.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">ПІД ПІДОЗРОЮ</tspan><tspan x="540.0" dy="15.6">(Suspected Flaky)</tspan><tspan x="540.0" dy="15.6">Повторний прогін 3–5 разів</tspan></text>
<rect x="810.1" y="126.4" width="239.8" height="67.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="930.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">КАРАНТИН</tspan><tspan x="930.0" dy="15.6">(Quarantined)</tspan><tspan x="930.0" dy="15.6">Виконується, але НЕ блокує PR</tspan></text>
<rect x="394.1" y="376.4" width="291.8" height="67.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="540.0" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">ВЕРИФІКАЦІЯ ВИПРАВЛЕННЯ</tspan><tspan x="540.0" dy="15.6">(Verification Pool)</tspan><tspan x="540.0" dy="15.6">Стрес-перевірка: 500 чистих прогонів</tspan></text>
<line x1="266.2" y1="160.0" x2="431.3" y2="160.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="345.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Перший збій тесту</text>
<line x1="431.3" y1="180.0" x2="266.2" y2="180.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="345.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">3/3 успішні повтори</text>
<line x1="648.7" y1="160.0" x2="810.1" y2="160.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="735.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Миготіння (1 Pass + 1 Fail)</text>
<line x1="930.0" y1="193.6" x2="685.9" y2="410.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="900.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">Інженер задеплоїв фікс</text>
<line x1="394.1" y1="410.0" x2="150.0" y2="193.6" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="180.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">500/500 успішних прогонів
(Повернення в стрій)</text>
<line x1="640.0" y1="376.4" x2="880.0" y2="193.6" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="720.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Хоча б 1 збій у 500 тестах</text>
<rect x="227.9" y="474.4" width="624.2" height="41.3" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/><text x="540.0" y="491.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Золоте правило карантину: тест ізолюється від блокування пайплайну розробників,</tspan><tspan x="540.0" dy="14.3">але формує обов'язковий дефект у трекері та продовжує виконуватися у фоновому стендовому контурі.</tspan></text>
</svg>