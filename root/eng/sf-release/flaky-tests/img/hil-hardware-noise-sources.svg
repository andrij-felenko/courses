<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичні першопричини нестабільності тестів на HIL-стендах</text>
<rect x="35.0" y="65.0" width="490.0" height="225.0" rx="8" fill="#fff8e1" stroke="#d97706" stroke-width="1.5"/>
<text x="55.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="700">1. Брязкіт контактів реле (Contact Bounce)</text>
<line x1="55.0" y1="109.0" x2="505.0" y2="109.0" stroke="#d97706" stroke-width="1.0"/>
<circle cx="65.0" cy="133.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
<text x="77.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Механічні контакти пружно вібрують 2–15 мс після замикання.</text>
<circle cx="65.0" cy="169.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
<text x="77.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Генерується пачка мікроімпульсів замість чистого фронту 0→1.</text>
<circle cx="65.0" cy="205.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
<text x="77.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Якщо тест зчитує GPIO у цьому вікні, результат випадковий.</text>
<circle cx="65.0" cy="241.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
<text x="77.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Лікування: апаратний RC-фільтр або програмний антибрязкіт.</text>
<rect x="555.0" y="65.0" width="490.0" height="225.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="575.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">2. Просідання напруги живлення (Voltage Sag)</text>
<line x1="575.0" y1="109.0" x2="1025.0" y2="109.0" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="585.0" cy="133.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="597.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Комутація реле чи моторів створює імпульсний струм до 2–5 А.</text>
<circle cx="585.0" cy="169.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="597.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Напруга живлення MCU короткочасно просідає нижче порогу BOR.</text>
<circle cx="585.0" cy="205.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="597.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Спричиняє спонтанний перезапуск MCU або збій вимірювань АЦП.</text>
<circle cx="585.0" cy="241.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="597.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Лікування: роздільні лінії живлення, блокувальні конденсатори.</text>
<rect x="35.0" y="310.0" width="490.0" height="225.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="55.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">3. Плаваючий логічний рівень (Floating Pin / Hi-Z)</text>
<line x1="55.0" y1="354.0" x2="505.0" y2="354.0" stroke="#2457d6" stroke-width="1.0"/>
<circle cx="65.0" cy="378.0" r="3.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="77.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Вхідний пін без підтяжки (Pull-Up/Down) ловить наведення 50 Гц.</text>
<circle cx="65.0" cy="414.0" r="3.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="77.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Потенціал коливається поблизу порогу перемикання тригера Шмітта.</text>
<circle cx="65.0" cy="450.0" r="3.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="77.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Тест бачить серію фальшивих спрацьовувань переривань.</text>
<circle cx="65.0" cy="486.0" r="3.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="77.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Лікування: жорсткі зовнішні резистори підтяжки 4.7–10 кОм.</text>
<rect x="555.0" y="310.0" width="490.0" height="225.0" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="575.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">4. Переповнення буферів UART (Buffer Overflow)</text>
<line x1="575.0" y1="354.0" x2="1025.0" y2="354.0" stroke="#7c3aed" stroke-width="1.0"/>
<circle cx="585.0" cy="378.0" r="3.0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="597.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Швидкість 115200 бод = 1 байт кожні 86.8 мкс.</text>
<circle cx="585.0" cy="414.0" r="3.0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="597.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Тривале блокування переривань у RTOS (&gt;5 мс) затирає кільцевий буфер.</text>
<circle cx="585.0" cy="450.0" r="3.0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="597.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Тестовий фреймворк отримує битий JSON/ASCII-пакет телеметрії.</text>
<circle cx="585.0" cy="486.0" r="3.0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="597.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Лікування: DMA-прийом, апаратний контроль потоку RTS/CTS.</text>
</svg>