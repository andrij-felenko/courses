<rect x="55.0" y="160.0" width="230.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="170.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Таблиці даних</tspan><tspan x="170.0" dy="14.3">(Row Storage)</tspan><tspan x="170.0" dy="14.3">Живі OLTP транзакції</tspan></text>
<line x1="170.0" y1="235.0" x2="170.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="280.0" width="230.0" height="90.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.2"/><text x="170.0" y="307.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Журнал випереджального запису</tspan><tspan x="170.0" dy="14.3">(WAL / Binary Log)</tspan><tspan x="170.0" dy="14.3">Послідовний потік мутацій</tspan><tspan x="170.0" dy="14.3">із номерами LSN</tspan></text>
<rect x="55.0" y="390.0" width="230.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="170.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Початковий знімок (Snapshot)</tspan><tspan x="170.0" dy="13.7">LSN = 18452000</tspan><tspan x="170.0" dy="13.7">Фіксована точка відліку</tspan></text>
<line x1="300.0" y1="325.0" x2="370.0" y2="325.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="305.0" y="298.0" width="60.0" height="22.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="335.0" y="312.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0.0">CDC потік</tspan></text>
<line x1="300.0" y1="430.0" x2="370.0" y2="430.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="305.0" y="403.0" width="60.0" height="22.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="335.0" y="417.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0.0">Snapshot</tspan></text>
<rect x="370.0" y="90.0" width="400.0" height="400.0" rx="8" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/>
<rect x="385.0" y="105.0" width="370.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="570.0" y="119.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">РУШІЙ МІГРАЦІЇ ТА ОБРОБКИ ПОТОКУ</tspan><tspan x="570.0" dy="15.6">(Debezium / Kafka / Custom Consumer)</tspan></text>
<rect x="385.0" y="160.0" width="370.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="570.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">1. Буфер подій та упорядкування:</tspan><tspan x="570.0" dy="14.3">• Збереження монотонності за LSN</tspan><tspan x="570.0" dy="14.3">• Розпаралелювання за ключем шардування</tspan><tspan x="570.0" dy="14.3">• Дедуплікація повторів</tspan></text>
<rect x="385.0" y="275.0" width="370.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="570.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">2. Трансформація схеми (Schema Mapping):</tspan><tspan x="570.0" dy="14.3">• Перетворення типів (JSON -&gt; Колонки)</tspan><tspan x="570.0" dy="14.3">• Денормалізація / розщеплення полів</tspan><tspan x="570.0" dy="14.3">• Додавання метаданих версії</tspan></text>
<rect x="385.0" y="390.0" width="370.0" height="85.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="570.0" y="422.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">3. Дроселювання (Backpressure Control):</tspan><tspan x="570.0" dy="14.3">• Моніторинг відставання цільової бази</tspan><tspan x="570.0" dy="14.3">• Автоматичне регулювання швидкості</tspan></text>
<line x1="770.0" y1="290.0" x2="840.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="775.0" y="265.0" width="60.0" height="22.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="805.0" y="279.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Apply</tspan></text>
<rect x="840.0" y="90.0" width="300.0" height="400.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/>
<rect x="855.0" y="105.0" width="270.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="990.0" y="119.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">ЦІЛЬОВЕ СХОВИЩЕ</tspan><tspan x="990.0" dy="15.6">(Target Database)</tspan></text>
<rect x="855.0" y="160.0" width="270.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="990.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Нова схема даних</tspan><tspan x="990.0" dy="14.3">• Оптимізовані індекси</tspan><tspan x="990.0" dy="14.3">• Нова топологія (кластер)</tspan><tspan x="990.0" dy="14.3">• Готовність до навантаження</tspan></text>
<rect x="855.0" y="275.0" width="270.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="990.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Ідемпотентне застосування:</tspan><tspan x="990.0" dy="14.3">• UPSERT за первинним ключем</tspan><tspan x="990.0" dy="14.3">• Ігнорування LSN &lt; last_applied</tspan><tspan x="990.0" dy="14.3">• Постійний нагін відставання</tspan></text>
<rect x="855.0" y="390.0" width="270.0" height="85.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="990.0" y="422.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">Метрики відставання (Lag):</tspan><tspan x="990.0" dy="14.3">Lag = LSN_source - LSN_target</tspan><tspan x="990.0" dy="14.3">Коли Lag -&gt; 0 =&gt; Перемикання!</tspan></text>
<rect x="40.0" y="515.0" width="1100.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="590.0" y="549.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ПЕРЕВАГА CDC: Нульове навантаження на OLTP-рушій запитів (читання йде з бінарного журналу диска).</tspan><tspan x="590.0" dy="15.0">Постійний потік змін гарантує, що цільове сховище наздожене первинне навіть за мільйонів операцій запису на секунду.</tspan></text>
</svg>