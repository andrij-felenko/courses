<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура дистрибуції правил: відділення доставки від обчислення</text>
<rect x="39.5" y="115.0" width="241.1" height="69.9" rx="6" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Площина керування (Control Plane)</tspan><tspan x="160.0" dy="14.3">• UI інженера / менеджера</tspan><tspan x="160.0" dy="14.3">• Конфіг у Git (GitOps)</tspan><tspan x="160.0" dy="14.3">• Валідація правил і схем</tspan></text>
<rect x="40.0" y="285.1" width="240.0" height="69.9" rx="6" fill="#f6f8fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Сервер розповсюдження</tspan><tspan x="160.0" dy="14.3">(Flag Service / Edge Proxy)</tspan><tspan x="160.0" dy="14.3">• Генерація правил конфігурації</tspan><tspan x="160.0" dy="14.3">• Кешування та версіонування (ETag)</tspan></text>
<line x1="160.0" y1="205.0" x2="160.0" y2="270.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="365.0" y="180.3" width="270.0" height="39.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Потоковий Push (SSE / gRPC stream)</tspan><tspan x="500.0" dy="14.3">Миттєве оновлення правил (&lt; 1 сек)</tspan></text>
<rect x="365.0" y="300.4" width="270.0" height="39.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Фоновий Pull (полінг з ETag / 304)</tspan><tspan x="500.0" dy="14.3">Стійкість при обриві з'єднання</tspan></text>
<line x1="285.0" y1="305.0" x2="360.0" y2="215.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="285.0" y1="335.0" x2="360.0" y2="330.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="173.5" width="260.0" height="173.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Застосунок (Application Node)</tspan><tspan x="800.0" dy="13.0"></tspan><tspan x="800.0" dy="13.0">┌───────────────────────────────┐</tspan><tspan x="800.0" dy="13.0">│ In-Memory сховище правил      │</tspan><tspan x="800.0" dy="13.0">│ (атомарний swap копії правил) │</tspan><tspan x="800.0" dy="13.0">└──────────────┬────────────────┘</tspan><tspan x="800.0" dy="13.0">               │ 0 мережевих викликів</tspan><tspan x="800.0" dy="13.0">               ▼</tspan><tspan x="800.0" dy="13.0">┌───────────────────────────────┐</tspan><tspan x="800.0" dy="13.0">│ Рушій обчислення (SDK Engine) │</tspan><tspan x="800.0" dy="13.0">│ hash() + правила (&lt; 0.1 мс)   │</tspan><tspan x="800.0" dy="13.0">└───────────────────────────────┘</tspan></text>
<line x1="640.0" y1="210.0" x2="665.0" y2="235.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="640.0" y1="320.0" x2="665.0" y2="285.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Правила доставляються у фоні; саме обчислення виконується повністю в локальній пам'яті вузла.</text>
</svg>