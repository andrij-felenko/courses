<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1155.5 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1155.5" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="1040.0" height="580.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="530.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Анатомія файлу мапи лінкера (Linker Memory Map)</text>
<text x="530.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Розподіл простору Flash і RAM, таблиця перехресних посилань і контроль колізії стека й купи</text>
<rect x="40.0" y="85.0" width="300.0" height="485.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="190.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Регіон FLASH (ROM) [512 КБ]</text>
<text x="190.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Адреси: 0x08000000 - 0x08080000</text>
<rect x="55.0" y="150.0" width="270.0" height="68.0" rx="4" fill="#ffffff" stroke="#1e40af" stroke-width="1.1"/>
<text x="65.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">0x08000000</text>
<text x="65.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="start" font-weight="700">.isr_vector (Вектори переривань)</text>
<text x="65.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">1 КБ | Таблиця векторів ARM Cortex-M</text>
<rect x="55.0" y="230.0" width="270.0" height="68.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.1"/>
<text x="65.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">0x08000400</text>
<text x="65.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">.text (Машинні інструкції коду)</text>
<text x="65.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">148 КБ | Функції застосунку та RTOS</text>
<rect x="55.0" y="310.0" width="270.0" height="68.0" rx="4" fill="#ffffff" stroke="#0891b2" stroke-width="1.1"/>
<text x="65.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">0x08025400</text>
<text x="65.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0891b2" text-anchor="start" font-weight="700">.rodata (Константи, таблиці LUT)</text>
<text x="65.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">32 КБ | Рядкові літерали, конфігурація</text>
<rect x="55.0" y="390.0" width="270.0" height="68.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.1"/>
<text x="65.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">0x0802D400</text>
<text x="65.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="700">.data (Образ завантаження LMA)</text>
<text x="65.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">12 КБ | Початкові значення для RAM</text>
<rect x="55.0" y="470.0" width="270.0" height="68.0" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.1"/>
<text x="65.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">0x08030400</text>
<text x="65.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="start" font-weight="700">[ Вільний простір FLASH ]</text>
<text x="65.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">319 КБ | Запас для майбутніх OTA оновлень</text>
<rect x="380.0" y="85.0" width="300.0" height="485.0" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.6"/>
<text x="530.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a21caf" text-anchor="middle" font-weight="700">Регіон SRAM (RAM) [128 КБ]</text>
<text x="530.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Адреси: 0x20000000 - 0x20020000</text>
<rect x="395.0" y="150.0" width="270.0" height="68.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.1"/>
<text x="405.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">0x20000000</text>
<text x="405.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="700">.data (Ініціалізовані змінні)</text>
<text x="405.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">12 КБ | Копіюються з Flash під час Startup</text>
<rect x="395.0" y="230.0" width="270.0" height="68.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.1"/>
<text x="405.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">0x20003000</text>
<text x="405.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">.bss (Обнулені змінні)</text>
<text x="405.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">48 КБ | Буфери пакетів, стан FreeRTOS</text>
<rect x="395.0" y="310.0" width="270.0" height="68.0" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.1"/>
<text x="405.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">0x2000F000</text>
<text x="405.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="700">Купа (Heap) [Зростає вгору ↑]</text>
<text x="405.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Символ _end: динамічне виділення пам'яті</text>
<rect x="395.0" y="390.0" width="270.0" height="68.0" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.1"/>
<text x="405.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">0x2001A000</text>
<text x="405.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="start" font-weight="700">[ Запас безпеки: Зазор стека ]</text>
<text x="405.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">20 КБ | Бар'єр захисту від переповнення</text>
<rect x="395.0" y="470.0" width="270.0" height="68.0" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.1"/>
<text x="405.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">0x20020000</text>
<text x="405.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">Стек (Stack) [Зростає вниз ↓]</text>
<text x="405.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Символ _estack: локальні змінні, фрейми</text>
<rect x="720.0" y="85.0" width="305.0" height="485.0" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
<text x="872.5" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Ключові метрики файлу .map</text>
<text x="872.5" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Генерація: -Wl,-Map=firmware.map,--cref</text>
<rect x="732.0" y="150.0" width="281.0" height="68.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="740.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start" font-weight="700">1. Перевірка лімітів пам'яті</text>
<rect x="612.0" y="185.5" width="521.0" height="17.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="872.5" y="197.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle"><tspan x="872.5" dy="0.0">Чи не перевищує розмір .text + .rodata доступну Flash-пам'ять, і який відсоток RAM зайнято статично.</tspan></text>
<rect x="732.0" y="230.0" width="281.0" height="68.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="740.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start" font-weight="700">2. Розподіл за модулями</text>
<rect x="609.4" y="265.5" width="526.1" height="17.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="872.5" y="277.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle"><tspan x="872.5" dy="0.0">Таблиця розмірів кожного об'єктного файлу (.o): хто саме вніс найбільший внесок у роздування пам'яті.</tspan></text>
<rect x="732.0" y="310.0" width="281.0" height="68.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="740.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start" font-weight="700">3. Крос-референси (--cref)</text>
<rect x="624.8" y="345.5" width="495.3" height="17.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="872.5" y="357.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle"><tspan x="872.5" dy="0.0">Повний граф викликів: який файл і функція посилаються на кожен символ, виявлення мертвого коду.</tspan></text>
<rect x="732.0" y="390.0" width="281.0" height="68.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="740.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">4. Запобігання колізії стека й купи</text>
<rect x="614.6" y="425.5" width="515.9" height="17.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="872.5" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle"><tspan x="872.5" dy="0.0">Оцінка відстані між вершиною купи (_end) та початком стека (_estack) під час пікового навантаження.</tspan></text>
<rect x="732.0" y="470.0" width="281.0" height="68.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="740.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="start" font-weight="700">5. Порівняння релізів (Diff Map)</text>
<rect x="650.5" y="505.5" width="444.0" height="17.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="872.5" y="517.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle"><tspan x="872.5" dy="0.0">Порівняння мапи v1.0.0 і v1.0.1 виявляє неочікуване розширення буферів перед релізом.</tspan></text>
</svg>