<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="1040.0" height="560.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="530.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Розділення налагоджувальних символів DWARF та виконуваного образу</text>
<text x="530.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Формування компактного бінарника для Flash-пам'яті та збереження повного ELF для тріажу крашів</text>
<rect x="30.0" y="85.0" width="270.0" height="465.0" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="165.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Повний вихід лінкера (LD)</text>
<text x="165.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">firmware.elf (~4.8 МБ)</text>
<rect x="45.0" y="150.0" width="240.0" height="44.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.0"/>
<text x="55.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">.text (машинний код)</text>
<text x="55.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">Виконуваний код мікроконтролера</text>
<rect x="45.0" y="202.0" width="240.0" height="44.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.0"/>
<text x="55.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">.rodata (константи, рядки)</text>
<text x="55.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">Таблиці, рядкові літерали</text>
<rect x="45.0" y="254.0" width="240.0" height="44.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.0"/>
<text x="55.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">.data (ініціалізовані дані)</text>
<text x="55.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">Початкові значення змінних</text>
<rect x="45.0" y="306.0" width="240.0" height="44.0" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.0"/>
<text x="55.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="start" font-weight="700">.bss (неініціалізовані дані)</text>
<text x="55.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">Обнулені змінні в RAM</text>
<rect x="45.0" y="358.0" width="240.0" height="44.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="55.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">.symtab &amp; .strtab</text>
<text x="55.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">Таблиця імен та глобальних символів</text>
<rect x="45.0" y="410.0" width="240.0" height="44.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="55.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">.debug_info &amp; .debug_line</text>
<text x="55.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">DWARF: відповідність адрес рядкам коду</text>
<rect x="45.0" y="462.0" width="240.0" height="44.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="55.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">.debug_frame &amp; .debug_loc</text>
<text x="55.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">DWARF: розгортання стека та регістри</text>
<rect x="335.0" y="175.0" width="300.0" height="110.0" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="485.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">1. Виділення бінарника для Flash</text>
<text x="485.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle">arm-none-eabi-objcopy -O binary</text>
<text x="485.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle">firmware.elf firmware.bin</text>
<text x="485.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Відсікання всіх .debug_* секцій</text>
<rect x="335.0" y="345.0" width="300.0" height="110.0" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.3"/>
<text x="485.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700">2. Ізоляція налагоджувального образу</text>
<text x="485.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle">arm-none-eabi-objcopy --only-keep-debug</text>
<text x="485.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle">firmware.elf firmware.debug</text>
<text x="485.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Збереження DWARF для довгострокового архіву</text>
<line x1="300.0" y1="230.0" x2="335.0" y2="230.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300.0" y1="400.0" x2="335.0" y2="400.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="670.0" y="150.0" width="360.0" height="155.0" rx="5" fill="#f0fdf4" stroke="#059669" stroke-width="1.4"/>
<text x="685.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#047857" text-anchor="start" font-weight="700">Виробничий образ: firmware.bin (192 КБ)</text>
<text x="685.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start">• Містить лише секції завантаження: .text + .rodata + .data</text>
<text x="685.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start">• Нульовий оверхед розміру — швидке прошивання по OTA</text>
<text x="685.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start">• Прошивається в фізичну Flash-пам'ять пристрою</text>
<text x="685.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">УВАГА: Без ELF аналіз крашів у полі неможливий!</text>
<line x1="635.0" y1="230.0" x2="670.0" y2="230.0" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="670.0" y="330.0" width="360.0" height="220.0" rx="5" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.4"/>
<text x="685.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6d28d9" text-anchor="start" font-weight="700">Розслідування аварії (Crash Triage)</text>
<rect x="685.0" y="370.0" width="330.0" height="50.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="695.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="start" font-weight="700">Дамп регістра при HardFault: PC = 0x08004F2C</text>
<text x="695.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">Без символів адреса 0x08004F2C — це невідомі байти.</text>
<text x="685.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start" font-weight="700">addr2line -e firmware.elf 0x08004F2C</text>
<rect x="685.0" y="450.0" width="330.0" height="50.0" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.0"/>
<text x="695.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="start" font-weight="700">РЕЗУЛЬТАТ: sensor_driver.c:142</text>
<text x="695.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start">Функція: bme280_read_pressure_raw()</text>
<text x="685.0" y="532.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4338ca" text-anchor="start" font-weight="700">Архів ELF гарантує відновлення контексту через роки</text>
<line x1="635.0" y1="400.0" x2="670.0" y2="400.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>