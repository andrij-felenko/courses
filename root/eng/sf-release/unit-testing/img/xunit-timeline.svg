<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія: SUnit, JUnit, родина xUnit</text>
<text x="530.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від разового прогону до постійного артефакту</text>
<line x1="292.0" y1="90.0" x2="292.0" y2="629.0" stroke="#6b7280" stroke-width="2.2"/>
<text x="252.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">кінець 1950-х</text>
<circle cx="292.0" cy="122.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="332.0" y="88.0" width="686.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="675.0" y="117.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Тест — крок роботи: прогін і звірка з очікуваним</tspan><tspan x="675.0" dy="18.2">результатом; готового діла після себе не лишає</tspan></text>
<text x="252.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">жовтень 1994</text>
<circle cx="292.0" cy="217.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="332.0" y="183.0" width="686.0" height="68.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.6"/><text x="675.0" y="212.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">SUnit: TestCase, TestSuite, TestResult</tspan><tspan x="675.0" dy="18.2">стаття «Simple Smalltalk Testing», Smalltalk Report</tspan></text>
<text x="252.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">жовтень 1997</text>
<circle cx="292.0" cy="312.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="332.0" y="278.0" width="686.0" height="68.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.6"/><text x="675.0" y="307.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">JUnit: SUnit переписано на Java в літаку</tspan><tspan x="675.0" dy="18.2">Цюрих → OOPSLA в Атланті (Бек і Гамма)</tspan></text>
<text x="252.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">липень 1998</text>
<circle cx="292.0" cy="407.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="332.0" y="373.0" width="686.0" height="68.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.6"/><text x="675.0" y="402.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">«Test Infected», Java Report: звичай пояснено</tspan><tspan x="675.0" dy="18.2">масовій аудиторії Java</tspan></text>
<text x="252.0" y="507.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1999</text>
<circle cx="292.0" cy="502.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="332.0" y="468.0" width="686.0" height="68.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.6"/><text x="675.0" y="497.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">«Extreme Programming Explained»: тест —</tspan><tspan x="675.0" dy="18.2">несуча деталь процесу, а не особиста чеснота</tspan></text>
<text x="252.0" y="602.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">2000-і</text>
<circle cx="292.0" cy="597.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="332.0" y="563.0" width="686.0" height="68.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.6"/><text x="675.0" y="592.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Родина xUnit: CppUnit, NUnit, PyUnit та інші —</tspan><tspan x="675.0" dy="18.2">той самий кістяк у десятках мов</tspan></text>
<text x="530.0" y="670.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Ліворуч від 1994-го тест живе рівно стільки, скільки триває прогін; праворуч — лежить у репозиторії поруч із кодом.</text>
</svg>