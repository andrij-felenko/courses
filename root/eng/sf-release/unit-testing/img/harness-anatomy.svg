<text x="560.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Жодної магії: таблиця — звичайний масив, ізоляція — стек, звіт — printf.</text>
<text x="560.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ключ --shuffle &lt;зерно&gt; міняє лише порядок обходу таблиці — і цим ловить стан, що протік між тестами.</text>
