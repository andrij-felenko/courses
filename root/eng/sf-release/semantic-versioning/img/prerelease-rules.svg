<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння передвипусків, коли ядро вже рівне</text>
<rect x="60.0" y="62.0" width="520.0" height="68.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.0"/><text x="320.0" y="91.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">Готовий випуск  &gt;  будь-який передвипуск</tspan><tspan x="320.0" dy="17.6">1.0.0-rc.1   &lt;   1.0.0</tspan></text>
<rect x="620.0" y="62.0" width="520.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="880.0" y="91.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">За рівного префікса довший набір старший</tspan><tspan x="880.0" dy="17.6">1.0.0-alpha   &lt;   1.0.0-alpha.1</tspan></text>
<text x="600.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">інакше — ідентифікатор за ідентифікатором, і кожну пару за трьома правилами:</text>
<rect x="60.0" y="194.0" width="340.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="230.0" y="228.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">обидва числові</tspan></text>
<text x="230.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">правило</text>
<rect x="60.0" y="294.0" width="340.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="323.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">порівнюй ЧИСЛАМИ,</tspan><tspan x="230.0" dy="16.9">не рядками</tspan></text>
<text x="230.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">приклад</text>
<rect x="60.0" y="400.0" width="340.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="430.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">beta.2  &lt;  beta.11</tspan></text>
<rect x="420.0" y="194.0" width="340.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="590.0" y="218.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">один числовий,</tspan><tspan x="590.0" dy="19.5">один буквений</tspan></text>
<text x="590.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">правило</text>
<rect x="420.0" y="294.0" width="340.0" height="66.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="323.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">числовий ЗАВЖДИ</tspan><tspan x="590.0" dy="16.9">нижчий за буквений</tspan></text>
<text x="590.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">приклад</text>
<rect x="420.0" y="400.0" width="340.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="430.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">alpha.1  &lt;  alpha.beta</tspan></text>
<rect x="780.0" y="194.0" width="340.0" height="58.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.2"/><text x="950.0" y="228.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="950.0" dy="0.0">обидва буквені</tspan></text>
<text x="950.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">правило</text>
<rect x="780.0" y="294.0" width="340.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="950.0" y="323.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="950.0" dy="0.0">лексично,</tspan><tspan x="950.0" dy="16.9">в ASCII-порядку</tspan></text>
<text x="950.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">приклад</text>
<rect x="780.0" y="400.0" width="340.0" height="50.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.5"/><text x="950.0" y="430.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="950.0" dy="0.0">alpha  &lt;  beta</tspan></text>
<rect x="60.0" y="488.0" width="1080.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="600.0" y="515.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Перша ж пара ідентифікаторів, що відрізняється, вирішує все — далі не дивимось.</tspan><tspan x="600.0" dy="16.9">Якщо всі спільні рівні, спрацьовує правило довшого набору (зверху праворуч).</tspan></text>
<rect x="60.0" y="564.0" width="1080.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="600.0" y="595.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Метадані збірки (+…) у старшинстві не беруть участі зовсім:  1.0.0+build.9  =  1.0.0</tspan></text>
</svg>