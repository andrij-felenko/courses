<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Методології спостережуваності: RED для сервісів проти USE для ресурсів</text>
<rect x="30.0" y="25.0" width="880.0" height="185.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/>
<text x="80.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">МЕТОД RED (Tom Wilkie) — Сервіси та запити</text>
<text x="80.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Орієнтований на користувача: як система виконує запити</text>
<rect x="75.8" y="98.4" width="228.3" height="63.2" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Rate (Частота)</tspan><tspan x="190.0" dy="15.6">Кількість запитів на секунду</tspan><tspan x="190.0" dy="15.6">(наприклад, req/s, rps)</tspan></text>
<rect x="363.3" y="98.4" width="213.4" height="63.2" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Errors (Помилки)</tspan><tspan x="470.0" dy="15.6">Кількість невдалих запитів</tspan><tspan x="470.0" dy="15.6">(частка 5xx або помилок)</tspan></text>
<rect x="628.4" y="98.4" width="243.2" height="63.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Duration (Тривалість)</tspan><tspan x="750.0" dy="15.6">Розподіл часу обробки</tspan><tspan x="750.0" dy="15.6">(перцентилі p95, p99 затримки)</tspan></text>
<rect x="30.0" y="245.0" width="880.0" height="185.0" rx="8" fill="#f6faf7" stroke="#27ae60" stroke-width="1.8"/>
<text x="80.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">МЕТОД USE (Brendan Gregg) — Ресурси та апаратне забезпечення</text>
<text x="80.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Орієнтований на залізо: CPU, пам'ять, диски, мережеві інтерфейси</text>
<rect x="72.1" y="318.4" width="235.8" height="63.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Utilization (Утилізація)</tspan><tspan x="190.0" dy="15.6">Частка часу активності</tspan><tspan x="190.0" dy="15.6">(наприклад, CPU % зайнятості)</tspan></text>
<rect x="355.8" y="318.4" width="228.3" height="63.2" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Saturation (Насиченість)</tspan><tspan x="470.0" dy="15.6">Черга очікування роботи</tspan><tspan x="470.0" dy="15.6">(load avg, disk queue depth)</tspan></text>
<rect x="628.4" y="318.4" width="243.2" height="63.2" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="750.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Errors (Помилки)</tspan><tspan x="750.0" dy="15.6">Апаратні та драйверні збої</tspan><tspan x="750.0" dy="15.6">(ECC-пам'ять, dropped packets)</tspan></text>
</svg>