<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння ієрархічної та багатовимірної моделей метрик</text>
<text x="230.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархічні шляхи (Graphite, StatsD)</text>
<text x="230.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Жорстко зашита послідовність сегментів у назві</text>
<rect x="80.6" y="91.0" width="298.7" height="28.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.6"/><text x="230.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">prod.eu-west.web-01.http.GET.200.count</tspan></text>
<rect x="76.9" y="141.0" width="306.2" height="28.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.6"/><text x="230.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">prod.us-east.web-02.http.POST.500.count</tspan></text>
<rect x="33.3" y="233.6" width="393.4" height="82.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="230.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">• Порядок сегментів не можна змінити</tspan><tspan x="230.0" dy="15.6">• Запит «помилки 500 по всіх регіонах»</tspan><tspan x="230.0" dy="15.6">  вимагає складних масок: prod.*.*.http.*.500.*</tspan><tspan x="230.0" dy="15.6">• Додавання мітки версії (v2) ламає всі існуючі запити</tspan></text>
<line x1="470.0" y1="30.0" x2="470.0" y2="450.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="705.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Багатовимірні мітки (Prometheus, OTel)</text>
<text x="705.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Метрика + довільний набір пар ключ-значення</text>
<rect x="550.4" y="80.0" width="309.3" height="69.9" rx="6" fill="#f4faf5" stroke="#27ae60" stroke-width="1.6"/><text x="705.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">http_requests_total{</tspan><tspan x="705.0" dy="14.3">  env=&quot;prod&quot;, dc=&quot;eu-west&quot;,</tspan><tspan x="705.0" dy="14.3">  host=&quot;web-01&quot;, method=&quot;GET&quot;, status=&quot;200&quot;</tspan><tspan x="705.0" dy="14.3">}</tspan></text>
<rect x="518.6" y="233.6" width="372.8" height="82.8" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="705.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">• Зрізи за довільними вимірами (slice-and-dice)</tspan><tspan x="705.0" dy="15.6">• Агрегація за будь-яким полем:</tspan><tspan x="705.0" dy="15.6">  sum by (status) (rate(http_requests_total[5m]))</tspan><tspan x="705.0" dy="15.6">• Нові мітки додаються без ламання старих дашбордів</tspan></text>
<rect x="129.5" y="398.5" width="680.9" height="33.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="419.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Багатовимірність замінює позиційний синтаксис гнучкою алгеброю реляційних фільтрів</tspan></text>
</svg>