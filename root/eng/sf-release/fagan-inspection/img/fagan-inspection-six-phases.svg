<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шість фаз формальної інспекції Фагана</text>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл формальної інспекції Фагана (шість послідовних фаз)</text>
<rect x="35.0" y="80.0" width="150.0" height="69.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="110.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">1. Планування</tspan><tspan x="110.0" dy="14.3">(Planning)</tspan><tspan x="110.0" dy="14.3">• Перевірка входу</tspan><tspan x="110.0" dy="14.3">• Призначення ролей</tspan></text>
<rect x="200.4" y="80.0" width="159.2" height="69.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="280.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">2. Огляд</tspan><tspan x="280.0" dy="14.3">(Overview)</tspan><tspan x="280.0" dy="14.3">• Контекст автора</tspan><tspan x="280.0" dy="14.3">• Архітектура (опція)</tspan></text>
<rect x="375.0" y="80.0" width="170.0" height="69.9" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">3. Підготовка</tspan><tspan x="460.0" dy="14.3">(Preparation)</tspan><tspan x="460.0" dy="14.3">• Читання за чеклістом</tspan><tspan x="460.0" dy="14.3">• Темп: 120 рядків/год</tspan></text>
<rect x="580.0" y="80.0" width="180.0" height="69.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">4. Засідання</tspan><tspan x="670.0" dy="14.3">(Meeting)</tspan><tspan x="670.0" dy="14.3">• Читець веде код</tspan><tspan x="670.0" dy="14.3">• Фіксація дефектів</tspan></text>
<rect x="810.0" y="80.0" width="160.0" height="69.9" rx="6" fill="#fdf6e3" stroke="#6b7280" stroke-width="1.5"/><text x="890.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">5. Доопрацювання</tspan><tspan x="890.0" dy="14.3">(Rework)</tspan><tspan x="890.0" dy="14.3">• Автор виправляє</tspan><tspan x="890.0" dy="14.3">• Без нових дефектів</tspan></text>
<line x1="185.0" y1="115.0" x2="205.0" y2="115.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="355.0" y1="115.0" x2="375.0" y2="115.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="545.0" y1="115.0" x2="580.0" y2="115.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="760.0" y1="115.0" x2="810.0" y2="115.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="807.0" y="235.1" width="166.0" height="69.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">6. Контроль</tspan><tspan x="890.0" dy="14.3">(Follow-up)</tspan><tspan x="890.0" dy="14.3">• Модератор звіряє</tspan><tspan x="890.0" dy="14.3">• Перевірка виправлень</tspan></text>
<line x1="890.0" y1="160.0" x2="890.0" y2="225.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="452.2" y="249.3" width="295.6" height="41.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Критерії виходу виконано (Exit Criteria)</tspan><tspan x="600.0" dy="14.3">Артефакт допущено до релізу / виробництва</tspan></text>
<line x1="810.0" y1="270.0" x2="740.0" y2="270.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="890.0" y1="315.0" x2="890.0" y2="395.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="890.0" y1="395.0" x2="460.0" y2="395.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="460.0" y1="395.0" x2="460.0" y2="163.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="422.0" y="410.0" width="506.0" height="20.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="675.0" y="423.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Повторна інспекція (Re-inspection), якщо виправлено &gt;5% коду або є системні хиби</tspan></text>
<rect x="90.0" y="239.5" width="240.0" height="61.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Вхідні критерії (Entry Criteria):</tspan><tspan x="210.0" dy="13.0">• Чистий статичний аналіз (MISRA/Linter)</tspan><tspan x="210.0" dy="13.0">• Пройдені юніт-тести та DRC схем</tspan><tspan x="210.0" dy="13.0">• Документована специфікація</tspan></text>
<line x1="210.0" y1="215.0" x2="110.0" y2="160.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Метод Фагана усуває дефекти до тестування: суворий порядок ролей і контроль кожного виправлення.</text>
</svg>