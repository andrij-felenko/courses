<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один рядок — три прочитання: усе є рядок</text>
<rect x="270.0" y="70.0" width="220.0" height="56.0" rx="10" fill="#13202a" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="380.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рядок:</text>
<text x="380.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#eef6ef" text-anchor="middle" font-weight="700">&quot;1 2 3&quot;</text>
<text x="380.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">самих байтів досить — тип домальовує контекст</text>
<line x1="380.0" y1="160.0" x2="134.0" y2="218.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="22.0" y="224.0" width="224.0" height="92.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="134.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">як ЧИСЛО</text>
<text x="134.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">expr {&quot;5&quot;+1} → 6</text>
<text x="134.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">коли команда чекає число</text>
<line x1="380.0" y1="160.0" x2="380.0" y2="218.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="268.0" y="224.0" width="224.0" height="92.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="380.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">як СПИСОК</text>
<text x="380.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">llength {1 2 3} → 3</text>
<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">коли команда чекає список</text>
<line x1="380.0" y1="160.0" x2="626.0" y2="218.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="514.0" y="224.0" width="224.0" height="92.0" rx="8" fill="#f6f4ec" stroke="#7a6312" stroke-width="2.0"/>
<text x="626.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a6312" text-anchor="middle" font-weight="700">як КОД</text>
<text x="626.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">eval &quot;set x 5&quot;</text>
<text x="626.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">коли команда чекає скрипт</text>
</svg>