<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лічильник посилань Tcl_Obj: 0 → 1 → 0 і пастка висіння вказівника</text>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життя одного значення: лічильник посилань керує звільненням</text>
<rect x="40.0" y="78.0" width="190.0" height="96.0" rx="9" fill="#13202a" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="135.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#eef6ef" text-anchor="middle" font-weight="700">щойно створений</text>
<text x="135.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#8fd0ff" text-anchor="middle" font-weight="700">refCount = 0</text>
<text x="135.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Tcl_NewIntObj(42)</text>
<rect x="315.0" y="78.0" width="190.0" height="96.0" rx="9" fill="#13202a" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="410.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#eef6ef" text-anchor="middle" font-weight="700">покладений у змінну</text>
<text x="410.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#8fd0ff" text-anchor="middle" font-weight="700">refCount = 1</text>
<text x="410.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">змінна тримає посилання</text>
<rect x="590.0" y="78.0" width="190.0" height="96.0" rx="9" fill="#13202a" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="685.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#eef6ef" text-anchor="middle" font-weight="700">звільнений</text>
<text x="685.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#8fd0ff" text-anchor="middle" font-weight="700">refCount = 0</text>
<text x="685.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">пам'ять повертається</text>
<line x1="234.0" y1="126.0" x2="311.0" y2="126.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="272.5" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">IncrRefCount</text>
<text x="272.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 → 1</text>
<line x1="509.0" y1="126.0" x2="586.0" y2="126.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="547.5" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">DecrRefCount</text>
<text x="547.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 → 0</text>
<rect x="40.0" y="208.0" width="740.0" height="44.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="410.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#256b38" text-anchor="middle" font-weight="700">Правило: 0 посилань → значення живе «нічиє» й може зникнути будь-коли.</text>
<text x="410.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Хочеш утримати вказівник — спершу підніми лічильник; відпустив — опусти.</text>
<text x="40.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Пастка — вказівник переживає eval без утримання:</text>
<rect x="40.0" y="300.0" width="360.0" height="150.0" rx="8" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.8"/>
<text x="220.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">НЕБЕЗПЕЧНО</text>
<text x="54.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a1f14" text-anchor="start">Tcl_Obj *o = objv[1];      // тримаю сирий</text>
<text x="54.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a1f14" text-anchor="start">Tcl_EvalObjEx(interp, body, 0);  // тут body</text>
<text x="54.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a1f14" text-anchor="start">                           // міг звільнити o</text>
<text x="54.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a1f14" text-anchor="start" font-weight="700">Tcl_GetString(o);          // ← читаю мертве</text>
<rect x="430.0" y="300.0" width="350.0" height="150.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="605.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#256b38" text-anchor="middle" font-weight="700">БЕЗПЕЧНО</text>
<text x="444.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#215c33" text-anchor="start">Tcl_Obj *o = objv[1];</text>
<text x="444.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#215c33" text-anchor="start" font-weight="700">Tcl_IncrRefCount(o);       // утримав</text>
<text x="444.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#215c33" text-anchor="start">Tcl_EvalObjEx(interp, body, 0);</text>
<text x="444.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#215c33" text-anchor="start">Tcl_GetString(o);          // живе — я тримаю</text>
<text x="444.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#215c33" text-anchor="start" font-weight="700">Tcl_DecrRefCount(o);       // відпустив</text>
</svg>