<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння парадигм: Імперативне виконання проти Декларативної специфікації</text>
<rect x="35.0" y="65.0" width="370.0" height="320.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="220.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Імперативна парадигма (Фокус на «ЯК»)</text>
<text x="220.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Покрокова зміна мутабельного стану в часі</text>
<line x1="51.0" y1="117.0" x2="389.0" y2="117.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="49.0" y="133.0" width="342.0" height="38.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="220.0" y="155.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. Вхідний стан: S0 = { i = 0, buf = [], sum = 0 }</tspan></text>
<rect x="49.0" y="177.0" width="342.0" height="38.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="220.0" y="199.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">2. Цикл / переходи: if (user.age &gt; 18) goto ...</tspan></text>
<rect x="49.0" y="221.0" width="342.0" height="38.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="220.0" y="243.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">3. Мутація пам'яті: buf[i++] = user.name; sum += 1</tspan></text>
<rect x="49.0" y="265.0" width="342.0" height="38.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="220.0" y="287.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">4. Керування ресурсами: manual free(ptr), unlock()</tspan></text>
<rect x="49.0" y="339.0" width="342.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="220.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Часова прив'язка, побічні ефекти, покажчики</text>
<rect x="435.0" y="65.0" width="370.0" height="320.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="620.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Декларативна парадигма (Фокус на «ЩО»)</text>
<text x="620.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Опис цільового результату та інваріантів</text>
<line x1="451.0" y1="117.0" x2="789.0" y2="117.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="449.0" y="133.0" width="342.0" height="38.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="620.0" y="155.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">1. Специфікація цілі: предикат P(x) = (age &gt; 18)</tspan></text>
<rect x="449.0" y="177.0" width="342.0" height="38.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="620.0" y="199.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">2. Трансформація: чиста функція f(x) → x.name</tspan></text>
<rect x="449.0" y="221.0" width="342.0" height="38.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="620.0" y="243.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">3. Реляційне відношення: SELECT name WHERE P(x)</tspan></text>
<rect x="449.0" y="265.0" width="342.0" height="38.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="620.0" y="287.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">4. Рушій виконання: оптимізує план і чергу сам</tspan></text>
<rect x="449.0" y="339.0" width="342.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="620.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Референційна прозорість, безчасові інваріанти</text>
<text x="420.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імперативний код задає алгоритм покроково; декларативний код задає властивості результату</text>
</svg>