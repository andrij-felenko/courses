<rect x="50.0" y="135.0" width="220.0" height="140.0" rx="6" fill="#ffffff" stroke="#d4ac0d" stroke-width="1.5"/><text x="160.0" y="171.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">void Default_Handler(void) {</tspan><tspan x="160.0" dy="12.3">    while (1) {} // Зависання</tspan><tspan x="160.0" dy="12.3">}</tspan><tspan x="160.0" dy="12.3">// Слабкі псевдоніми (weak, alias):</tspan><tspan x="160.0" dy="12.3">• SysTick_Handler (weak)</tspan><tspan x="160.0" dy="12.3">• USART1_IRQHandler (weak)</tspan><tspan x="160.0" dy="12.3">• TIM2_IRQHandler (weak)</tspan></text>
