<text x="160.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">main.c / uart.c (Сильні)</text>
<rect x="50.0" y="330.0" width="220.0" height="145.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="351.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">// main.c (Сильний символ)</tspan><tspan x="160.0" dy="13.7">void SysTick_Handler(void) {</tspan><tspan x="160.0" dy="13.7">    g_ticks++;</tspan><tspan x="160.0" dy="13.7">}</tspan><tspan x="160.0" dy="13.7">// uart.c (Сильний символ)</tspan><tspan x="160.0" dy="13.7">void USART1_IRQHandler(void) {</tspan><tspan x="160.0" dy="13.7">    rx_byte(USART1-&gt;RDR);</tspan><tspan x="160.0" dy="13.7">}</tspan><tspan x="160.0" dy="13.7">// TIM2 НЕ перевизначено!</tspan></text>
