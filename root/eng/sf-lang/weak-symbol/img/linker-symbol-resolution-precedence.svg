<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця пріоритетів розв'язання символів у лінкері (ELF Symbol Resolution)</text>
<rect x="30.0" y="60.0" width="415.0" height="445.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<rect x="30.0" y="60.0" width="415.0" height="38.0" rx="8" fill="#eaeded" stroke="#333333" stroke-width="1.5"/>
<text x="237.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комбінація визначень (Definitions)</text>
<rect x="45.0" y="110.0" width="385.0" height="114.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="60.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1. Сильний + Сильний (Strong + Strong)</text>
<text x="60.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">Два звичайні глобальні символи (STB_GLOBAL)</tspan><tspan x="60.0" dy="14.3">з однаковим ім'ям у різних .o файлах</tspan></text>
<rect x="55.0" y="186.0" width="365.0" height="28.0" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1.0"/>
<text x="237.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ПОМИЛКА: multiple definition</text>
<rect x="45.0" y="238.0" width="385.0" height="114.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">2. Сильний + Слабкий (Strong + Weak)</text>
<text x="60.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">Один звичайний символ (STB_GLOBAL)</tspan><tspan x="60.0" dy="14.3">та один або кілька слабких (STB_WEAK)</tspan></text>
<rect x="55.0" y="314.0" width="365.0" height="28.0" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.0"/>
<text x="237.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">УСПІХ: Обирається Сильний</text>
<rect x="45.0" y="366.0" width="385.0" height="114.0" rx="6" fill="#ffffff" stroke="#b7950b" stroke-width="1.5"/>
<text x="60.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7950b" text-anchor="start" font-weight="700">3. Слабкий + Слабкий (Weak + Weak)</text>
<text x="60.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">Кілька слабких символів (STB_WEAK)</tspan><tspan x="60.0" dy="14.3">і жодного сильного визначення</tspan></text>
<rect x="55.0" y="442.0" width="365.0" height="28.0" rx="4" fill="#fef9e7" stroke="#b7950b" stroke-width="1.0"/>
<text x="237.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7950b" text-anchor="middle" font-weight="700">УСПІХ: Обирається перший слабкий</text>
<rect x="475.0" y="60.0" width="415.0" height="445.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<rect x="475.0" y="60.0" width="415.0" height="38.0" rx="8" fill="#eaeded" stroke="#333333" stroke-width="1.5"/>
<text x="682.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Слабкі та сильні посилання (References)</text>
<rect x="490.0" y="110.0" width="385.0" height="114.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="505.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">4. Сильне посилання без визначення</text>
<text x="505.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="505.0" dy="0.0">Виклик extern void func(void);</tspan><tspan x="505.0" dy="14.3">Визначення func відсутнє в усіх .o та .a</tspan></text>
<rect x="500.0" y="186.0" width="365.0" height="28.0" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1.0"/>
<text x="682.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ПОМИЛКА: undefined reference</text>
<rect x="490.0" y="238.0" width="385.0" height="114.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="505.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">5. Слабке посилання без визначення</text>
<text x="505.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="505.0" dy="0.0">Оголошення extern __attribute__((weak))</tspan><tspan x="505.0" dy="14.3">Визначення відсутнє в таблиці символів</tspan></text>
<rect x="500.0" y="314.0" width="365.0" height="28.0" rx="4" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.0"/>
<text x="682.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">УСПІХ: Адреса символу = 0 (NULL)</text>
<rect x="490.0" y="366.0" width="385.0" height="114.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="505.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">6. Слабке посилання + Визначення</text>
<text x="505.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="505.0" dy="0.0">Оголошення extern __attribute__((weak))</tspan><tspan x="505.0" dy="14.3">Визначення присутнє в одному з .o файлів</tspan></text>
<rect x="500.0" y="442.0" width="365.0" height="28.0" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.0"/>
<text x="682.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">УСПІХ: Адреса символу = &amp;func</text>
</svg>