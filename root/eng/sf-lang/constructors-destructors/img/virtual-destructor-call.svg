<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Видалення через покажчик на базовий клас: Base* p = new Derived();</text>
<rect x="25.0" y="55.0" width="370.0" height="310.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ДЕСТРУКТОР НЕ ВІРТУАЛЬНИЙ (~Base())</text>
<rect x="81.7" y="108.5" width="256.5" height="23.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Виклик delete p; (статичне зв'язування)</tspan></text>
<line x1="210.0" y1="138.0" x2="210.0" y2="170.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="88.0" y="171.3" width="244.0" height="37.3" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. Викликається ЛИШЕ ~Base()</tspan><tspan x="210.0" dy="14.3">Компілятор дивиться лише на тип Base*</tspan></text>
<line x1="210.0" y1="215.0" x2="210.0" y2="250.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="67.6" y="251.3" width="284.8" height="37.3" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">2. ~Derived() ПРОПУЩЕНО!</tspan><tspan x="210.0" dy="14.3">Буфери, сокети й поля Derived НЕ очищено</tspan></text>
<line x1="210.0" y1="295.0" x2="210.0" y2="325.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.6" y="331.5" width="318.9" height="23.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="346.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Результат: Невизначена поведінка (UB) + витік</tspan></text>
<rect x="425.0" y="55.0" width="370.0" height="310.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="610.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ВІРТУАЛЬНИЙ ДЕСТРУКТОР (virtual ~Base())</text>
<rect x="478.6" y="108.5" width="262.8" height="23.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="610.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Виклик delete p; (динамічне зв'язування)</tspan></text>
<line x1="610.0" y1="138.0" x2="610.0" y2="170.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="481.7" y="171.3" width="256.5" height="37.3" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">1. Пошук адреси через vtable</tspan><tspan x="610.0" dy="14.3">Виклик реального деструктора ~Derived()</tspan></text>
<line x1="610.0" y1="215.0" x2="610.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="491.1" y="251.3" width="237.7" height="37.3" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">2. ~Derived() звільняє свої ресурси,</tspan><tspan x="610.0" dy="14.3">а потім автоматично викликає ~Base()</tspan></text>
<line x1="610.0" y1="295.0" x2="610.0" y2="325.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="471.0" y="331.5" width="278.0" height="23.0" rx="6" fill="#d1fae5" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="346.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Результат: 100% коректне повне очищення</tspan></text>
</svg>