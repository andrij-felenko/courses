<text x="410.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">РЕАКЦІЯ РАНТАЙМУ: РОЗГОРТАННЯ СТЕКА (Stack Unwinding)</text>
<text x="60.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Деструктор САМОГО КЛАСУ ~MyClass() НЕ викликається (об'єкт офіційно не народився).</text>
<text x="60.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Компілятор автоматично викликає деструктори вже ініціалізованих полів у зворотному порядку:</text>
<text x="80.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">1. ~vector() знищує буфер  →  2. ~string() звільняє пам'ять  →  пам'ять сирого об'єкта повертається.</text>
