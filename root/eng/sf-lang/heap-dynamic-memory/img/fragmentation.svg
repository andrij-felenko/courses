<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зовнішня фрагментація: вільного вистачає, та немає суцільного шматка</text>
<text x="70.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">спочатку — суцільний вільний простір:</text>
<rect x="70.0" y="82.0" width="760.0" height="28.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="450.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">вільно</text>
<text x="70.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">після багатьох alloc/free — дірки між зайнятими блоками:</text>
<rect x="70.0" y="160.0" width="120.0" height="28.0" rx="2" fill="#e9eefb" stroke="#2457d6" stroke-width="1.3"/>
<rect x="190.0" y="160.0" width="70.0" height="28.0" rx="2" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="225.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">70</text>
<rect x="260.0" y="160.0" width="90.0" height="28.0" rx="2" fill="#e9eefb" stroke="#2457d6" stroke-width="1.3"/>
<rect x="350.0" y="160.0" width="60.0" height="28.0" rx="2" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="380.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">60</text>
<rect x="410.0" y="160.0" width="110.0" height="28.0" rx="2" fill="#e9eefb" stroke="#2457d6" stroke-width="1.3"/>
<rect x="520.0" y="160.0" width="80.0" height="28.0" rx="2" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="560.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">80</text>
<rect x="600.0" y="160.0" width="100.0" height="28.0" rx="2" fill="#e9eefb" stroke="#2457d6" stroke-width="1.3"/>
<rect x="700.0" y="160.0" width="90.0" height="28.0" rx="2" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="745.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">90</text>
<rect x="70.0" y="224.0" width="300.0" height="30.0" rx="6" fill="#fff8ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="220.0" y="242.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a7322" text-anchor="middle" font-weight="700">запит: блок на 200 байтів</text>
<text x="390.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">не влазить — немає суцільних 200</text>
<rect x="50.0" y="278.0" width="800.0" height="63.8" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="450.0" y="299.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Вільного загалом ВИСТАЧАЄ (70+60+80+90 = 300), та суцільного шматка на 200 поспіль немає.</tspan><tspan x="450.0" dy="14.3">Як паркінг із проміжками, у який не влазить автобус, хоч вільних місць сумарно й багато.</tspan><tspan x="450.0" dy="14.3">Наростає поступово й непомітно, аж велике виділення раптом провалюється.</tspan></text>
</svg>