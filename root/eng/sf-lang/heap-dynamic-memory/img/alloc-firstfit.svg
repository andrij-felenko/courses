<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виділення first-fit: перший, що влазить, і відрізання хвоста</text>
<text x="60.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">malloc(40) пробігає список:</text>
<rect x="60.0" y="92.0" width="120.0" height="46.0" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="120.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">16 Б</text>
<text x="120.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">мале ✗</text>
<rect x="180.0" y="92.0" width="150.0" height="46.0" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="255.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">24 Б</text>
<text x="255.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">мале ✗</text>
<rect x="330.0" y="92.0" width="260.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="460.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">96 Б</text>
<text x="460.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">підходить ✓</text>
<text x="60.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">блок 96 Б ділимо (split):</text>
<rect x="60.0" y="200.0" width="110.0" height="46.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.7"/>
<text x="115.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">40 Б віддано</text>
<rect x="170.0" y="200.0" width="150.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="245.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">≈56 Б лишок (вільний)</text>
<line x1="380.0" y1="223.0" x2="420.0" y2="223.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">якщо лишок &lt; поріг — блок віддають цілим</text>
<rect x="50.0" y="274.0" width="800.0" height="63.8" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="450.0" y="295.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">First-fit бере НАЙПЕРШИЙ придатний блок: не оптимально, зате швидко (best-fit — найтісніший).</tspan><tspan x="450.0" dy="14.3">Знайдений майже завжди більший за запит: перші n байтів зайняті, хвіст лишається вільним.</tspan><tspan x="450.0" dy="14.3">Повертають покажчик на ТІЛО — одразу за заголовком.</tspan></text>
</svg>