<text x="240.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">volatile-запис</text>
<line x1="580.0" y1="106.0" x2="580.0" y2="262.0" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="580.0" cy="118.0" r="6.0" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
