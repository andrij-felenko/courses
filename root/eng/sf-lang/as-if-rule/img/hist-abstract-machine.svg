<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знахідка комітету: один еталон, багато реальних доріг</text>
<rect x="235.0" y="62.0" width="350.0" height="74.0" rx="14" fill="#eef4ff" stroke="#2457d6" stroke-width="2.4"/>
<text x="410.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">АБСТРАКТНА МАШИНА зі стандарту</text>
<text x="410.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">кожен крок чесно й по черзі</text>
<text x="410.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">існує лише на папері — еталон</text>
<rect x="90.0" y="250.0" width="150.0" height="66.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="165.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">реалізація A</text>
<text x="165.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">багато регістрів,</tspan><tspan x="165.0" dy="11.7">рахує сталі наперед</tspan></text>
<line x1="410.0" y1="138.0" x2="165.0" y2="246.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="335.0" y="250.0" width="150.0" height="66.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="410.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">реалізація B</text>
<text x="410.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">мало регістрів,</tspan><tspan x="410.0" dy="11.7">свій порядок дій</tspan></text>
<line x1="410.0" y1="138.0" x2="410.0" y2="246.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="580.0" y="250.0" width="150.0" height="66.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="655.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">реалізація C</text>
<text x="655.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">інший кремній,</tspan><tspan x="655.0" dy="11.7">викидає мертве</tspan></text>
<line x1="410.0" y1="138.0" x2="655.0" y2="246.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="342.0" width="680.0" height="40.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="410.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">МЕЖА СПОСТЕРЕЖУВАНОГО — тут результат КОЖНОЇ реалізації = еталон</text>
<text x="410.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">дорога вільна · збігтися має лише те, що перетинає межу</text>
</svg>