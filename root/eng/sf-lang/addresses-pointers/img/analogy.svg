<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покажчик — це адреса будинку, записана на папірці</text>
<rect x="70.0" y="110.0" width="150.0" height="56.0" rx="4" fill="#fffdf2" stroke="#c0392b" stroke-width="1.8"/>
<text x="145.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">папірець (покажчик)</text>
<text x="145.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">адреса:</text>
<text x="145.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">вул. Пам'яті, 0x20</text>
<rect x="470.0" y="104.0" width="150.0" height="70.0" rx="4" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="545.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">будинок (дані)</text>
<text x="545.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0x20</text>
<text x="545.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">42</text>
<line x1="222.0" y1="138.0" x2="466.0" y2="139.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="350.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">«піди за адресою» = розіменування</text>
<text x="350.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">копіювати папірець (два → той самий будинок · кілька покажчиків на ті самі дані)</text>
<text x="350.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">дати другові (піде за адресою й перефарбує будинок · функція змінить ваші дані)</text>
<text x="350.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ламається: стара / хибна адреса → знесений чи чужий будинок (висячий / дикий)</text>
</svg>