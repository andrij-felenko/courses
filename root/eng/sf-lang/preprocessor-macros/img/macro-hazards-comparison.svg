<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння побічних ефектів у макросах та функціях</text>
<rect x="10.0" y="10.0" width="800.0" height="300.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="25.0" y="35.0" width="375.0" height="240.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="212.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">МАКРОС: #define SQUARE(x) ((x) * (x))</text>
<rect x="40.0" y="80.0" width="345.0" height="45.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/><text x="212.5" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Виклик: int y = SQUARE(i++);</tspan></text>
<line x1="212.0" y1="125.0" x2="212.0" y2="145.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="145.0" width="345.0" height="55.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="212.5" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="212.5" dy="0.0">Результат підстановки в текст:</tspan><tspan x="212.5" dy="14.3">int y = ((i++) * (i++));</tspan></text>
<rect x="40.0" y="210.0" width="345.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="212.5" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="212.5" dy="0.0">Наслідок: i інкрементується ДВІЧІ,</tspan><tspan x="212.5" dy="13.0">невизначена або спотворена поведінка!</tspan></text>
<rect x="420.0" y="35.0" width="375.0" height="240.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="607.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ФУНКЦІЯ: constexpr auto square(auto x)</text>
<rect x="435.0" y="80.0" width="345.0" height="45.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/><text x="607.5" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Виклик: int y = square(i++);</tspan></text>
<line x1="607.0" y1="125.0" x2="607.0" y2="145.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="435.0" y="145.0" width="345.0" height="55.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.2"/><text x="607.5" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="607.5" dy="0.0">Семантика передачі аргументу:</tspan><tspan x="607.5" dy="14.3">аргумент обчислюється рівно 1 раз</tspan></text>
<rect x="435.0" y="210.0" width="345.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="607.5" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="607.5" dy="0.0">Наслідок: i інкрементується ОДИН раз,</tspan><tspan x="607.5" dy="13.0">повноцінна перевірка типів компілятором</tspan></text>
<text x="410.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Текстова підстановка дублює вирази з побічними ефектами; функції гарантують одиничне обчислення</text>
</svg>