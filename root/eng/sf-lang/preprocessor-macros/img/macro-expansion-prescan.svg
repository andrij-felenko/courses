<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Етапи розгортання макросів та Prescan</text>
<rect x="10.0" y="10.0" width="800.0" height="320.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="30.0" y="40.0" width="200.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#4b5563" stroke-width="1.5"/><text x="130.0" y="61.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Виклик макросу:</tspan><tspan x="130.0" dy="14.3">FOO(BAR, 42)</tspan></text>
<line x1="130.0" y1="90.0" x2="130.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="120.0" width="200.0" height="60.0" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.5"/><text x="130.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Перевірка параметрів:</tspan><tspan x="130.0" dy="14.3">чи є оператори # або ## ?</tspan></text>
<line x1="230.0" y1="140.0" x2="310.0" y2="140.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК (#, ##)</text>
<rect x="310.0" y="115.0" width="230.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="425.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="425.0" dy="0.0">Без Prescan: аргумент береться</tspan><tspan x="425.0" dy="14.3">буквально як сирі токени</tspan></text>
<line x1="130.0" y1="180.0" x2="130.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="175.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">НІ (звичайне)</text>
<rect x="30.0" y="210.0" width="200.0" height="60.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="130.0" dy="0.0">Argument Prescan:</tspan><tspan x="130.0" dy="14.3">розгортання вкладених</tspan><tspan x="130.0" dy="14.3">макросів у аргументі</tspan></text>
<line x1="230.0" y1="240.0" x2="310.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="215.0" width="230.0" height="55.0" rx="6" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.5"/><text x="425.0" y="239.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="425.0" dy="0.0">Підстановка токенів</tspan><tspan x="425.0" dy="14.3">у тіло заміни макросу</tspan></text>
<line x1="425.0" y1="170.0" x2="425.0" y2="215.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540.0" y1="240.0" x2="590.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="205.0" width="200.0" height="75.0" rx="6" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/><text x="690.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#581c87" text-anchor="middle"><tspan x="690.0" dy="0.0">Rescan (повторне сканування):</tspan><tspan x="690.0" dy="11.7">розгортання інших макросів.</tspan><tspan x="690.0" dy="11.7">Поточний макрос заблоковано</tspan><tspan x="690.0" dy="11.7">(захист від нескінченної рекурсії)</tspan></text>
<text x="410.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Оператори # та ## блокують Prescan — тому для розгортання потрібен двоетапний макрос (STR / XSTR)</text>
</svg>