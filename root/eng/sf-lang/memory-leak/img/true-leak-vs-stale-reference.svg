<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="365.0" height="360.0" rx="10" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<rect x="71.8" y="28.9" width="280.4" height="52.2" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="50.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#78281f" text-anchor="middle" font-weight="700"><tspan x="212.0" dy="0.0">Справжній витік (True Leak)</tspan><tspan x="212.0" dy="18.2">Мови без GC (C, C++, Assembly)</tspan></text>
<rect x="119.9" y="101.2" width="184.2" height="47.6" rx="6" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="1.5"/><text x="212.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Root-покажчик на стеку</tspan><tspan x="212.0" dy="15.6">знищено або перезаписано</tspan></text>
<line x1="212.0" y1="155.0" x2="212.0" y2="185.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="212.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">✕ немає зв'язку</text>
<rect x="102.8" y="198.4" width="218.4" height="63.2" rx="6" fill="#fce4ec" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#880e4f" text-anchor="middle"><tspan x="212.0" dy="0.0">Об'єкт у купі (Heap Object)</tspan><tspan x="212.0" dy="15.6">Фізично зайнятий в алокаторі,</tspan><tspan x="212.0" dy="15.6">але недосяжний (Unreachable)</tspan></text>
<rect x="108.0" y="290.2" width="208.1" height="59.6" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/><text x="212.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle"><tspan x="212.0" dy="0.0">Наслідок: пам'ять неможливо</tspan><tspan x="212.0" dy="14.3">звільнити жодним штатним кодом</tspan><tspan x="212.0" dy="14.3">до завершення процесу</tspan></text>
<rect x="425.0" y="20.0" width="365.0" height="360.0" rx="10" fill="none" stroke="#2980b9" stroke-width="1.5"/>
<rect x="445.1" y="28.9" width="323.8" height="52.2" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="607.0" y="50.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1b4f72" text-anchor="middle" font-weight="700"><tspan x="607.0" dy="0.0">Логічне утримання (Stale Reference)</tspan><tspan x="607.0" dy="18.2">Керовані мови з GC (Java, JS, Go)</tspan></text>
<rect x="470.5" y="101.2" width="273.1" height="47.6" rx="6" fill="#d4e6f1" stroke="#2980b9" stroke-width="1.5"/><text x="607.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#154360" text-anchor="middle"><tspan x="607.0" dy="0.0">GC Root (статична мапа,</tspan><tspan x="607.0" dy="15.6">глобальний Event Listener, замикання)</tspan></text>
<line x1="607.0" y1="155.0" x2="607.0" y2="195.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="655.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2980b9" text-anchor="middle">сильне посилання</text>
<rect x="467.0" y="198.4" width="279.9" height="63.2" rx="6" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/><text x="607.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#154360" text-anchor="middle"><tspan x="607.0" dy="0.0">Непотрібний об'єкт (Stale Data)</tspan><tspan x="607.0" dy="15.6">Дані більше ніколи не будуть потрібні,</tspan><tspan x="607.0" dy="15.6">але GC вважає їх живими (Reachable)</tspan></text>
<rect x="499.8" y="290.2" width="214.4" height="59.6" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/><text x="607.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle"><tspan x="607.0" dy="0.0">Наслідок: GC не має права</tspan><tspan x="607.0" dy="14.3">видалити живий ланцюг об'єктів;</tspan><tspan x="607.0" dy="14.3">пам'ять невпинно зростає</tspan></text>
</svg>