<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.5" y="17.5" width="299.0" height="35.0" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="200.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Стек процесу (локальні змінні)</tspan></text>
<rect x="489.1" y="17.5" width="261.8" height="35.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="620.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Купа (Heap Memory Manager)</tspan></text>
<rect x="40.0" y="75.0" width="330.0" height="150.0" rx="8" fill="none" stroke="#27ae60" stroke-width="1.5"/>
<text x="205.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e8449" text-anchor="middle" font-weight="700">Сценарій А: Коректне звільнення</text>
<rect x="106.1" y="111.2" width="197.8" height="47.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Покажчик ptr = 0x7fa0</tspan><tspan x="205.0" dy="15.6">(на стеку в кадрі функції)</tspan></text>
<rect x="101.0" y="167.3" width="208.1" height="45.3" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#196f3d" text-anchor="middle"><tspan x="205.0" dy="0.0">Виклик free(ptr) перед виходом</tspan><tspan x="205.0" dy="14.3">→ блок повернуто алокатору</tspan></text>
<rect x="504.0" y="108.4" width="232.0" height="63.2" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#196f3d" text-anchor="middle"><tspan x="620.0" dy="0.0">Блок пам'яті 0x7fa0 [4 KB]</tspan><tspan x="620.0" dy="15.6">Статус: ВІЛЬНИЙ (FREED)</tspan><tspan x="620.0" dy="15.6">Доступний для повторного malloc</tspan></text>
<line x1="340.0" y1="135.0" x2="480.0" y2="135.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">free()</text>
<rect x="40.0" y="250.0" width="330.0" height="160.0" rx="8" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="205.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#922b21" text-anchor="middle" font-weight="700">Сценарій Б: Витік пам'яті (Memory Leak)</text>
<rect x="95.8" y="291.2" width="218.4" height="47.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#922b21" text-anchor="middle"><tspan x="205.0" dy="0.0">Кадр функції завершився,</tspan><tspan x="205.0" dy="15.6">покажчик ptr ЗНИЩЕНО зі стека</tspan></text>
<rect x="94.7" y="352.4" width="220.6" height="45.3" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78281f" text-anchor="middle"><tspan x="205.0" dy="0.0">Адресу 0x8bc0 назавжди втрачено;</tspan><tspan x="205.0" dy="14.3">програма не має доступу</tspan></text>
<rect x="504.0" y="293.4" width="232.0" height="63.2" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="313.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#78281f" text-anchor="middle"><tspan x="620.0" dy="0.0">Блок пам'яті 0x8bc0 [4 KB]</tspan><tspan x="620.0" dy="15.6">Статус: ЗАЙНЯТИЙ (ALLOCATED)</tspan><tspan x="620.0" dy="15.6">Вказівників немає (UNREACHABLE)</tspan></text>
<line x1="340.0" y1="315.0" x2="470.0" y2="315.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="5,4"/>
<line x1="395.0" y1="300.0" x2="415.0" y2="330.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="415.0" y1="300.0" x2="395.0" y2="330.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="405.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Втрачено зв'язок</text>
</svg>