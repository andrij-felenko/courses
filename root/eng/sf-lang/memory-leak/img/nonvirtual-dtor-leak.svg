<rect x="484.1" y="317.4" width="245.7" height="45.3" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="607.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#196f3d" text-anchor="middle"><tspan x="607.0" dy="0.0">Результат: повне і коректне очищення</tspan><tspan x="607.0" dy="14.3">всієї ієрархії об'єкта без витоків</tspan></text>
