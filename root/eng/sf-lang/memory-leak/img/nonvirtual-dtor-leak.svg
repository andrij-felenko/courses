<rect x="65.0" y="30.0" width="294.0" height="49.9" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="51.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#78281f" text-anchor="middle" font-weight="700"><tspan x="212.0" dy="0.0">Без virtual ~Base()</tspan><tspan x="212.0" dy="16.9">(Статичне зв'язування деструктора)</tspan></text>
<rect x="96.0" y="96.2" width="232.0" height="47.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Base* p = new Derived();</tspan><tspan x="212.0" dy="15.6">delete p; // виклик через Base*</tspan></text>
<rect x="104.8" y="174.5" width="214.4" height="31.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="212.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#196f3d" text-anchor="middle"><tspan x="212.0" dy="0.0">1. Викликається Base::~Base() ✓</tspan></text>
<rect x="73.5" y="227.3" width="277.1" height="45.3" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78281f" text-anchor="middle"><tspan x="212.0" dy="0.0">2. Derived::~Derived() НЕ викликається! ✕</tspan><tspan x="212.0" dy="14.3">(динамічний буфер Derived::buf витікає)</tspan></text>
<rect x="86.0" y="317.4" width="252.0" height="45.3" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78281f" text-anchor="middle"><tspan x="212.0" dy="0.0">Результат: витік внутрішніх ресурсів</tspan><tspan x="212.0" dy="14.3">нащадка та невизначена поведінка (UB)</tspan></text>
<rect x="425.0" y="20.0" width="365.0" height="370.0" rx="8" fill="none" stroke="#27ae60" stroke-width="1.5"/>
