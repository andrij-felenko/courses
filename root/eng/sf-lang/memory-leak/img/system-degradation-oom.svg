<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="30.0" width="230.0" height="320.0" rx="8" fill="none" stroke="#27ae60" stroke-width="1.5"/>
<rect x="58.4" y="40.0" width="173.1" height="49.9" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="145.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#196f3d" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Фаза 1: Розбухання</tspan><tspan x="145.0" dy="16.9">(Working Set Bloat)</tspan></text>
<rect x="50.4" y="113.0" width="189.3" height="73.9" rx="6" fill="#ffffff" stroke="#a9dfbf" stroke-width="1.5"/><text x="145.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Анонімна пам'ять (RSS)</tspan><tspan x="145.0" dy="14.3">постійно зростає.</tspan><tspan x="145.0" dy="14.3">Купа витісняє кеші сторінок</tspan><tspan x="145.0" dy="14.3">(Page Cache).</tspan></text>
<rect x="31.5" y="235.2" width="226.9" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="145.0" y="254.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#145a32" text-anchor="middle"><tspan x="145.0" dy="0.0">Симптом:</tspan><tspan x="145.0" dy="14.3">Зниження швидкодії дискового I/O,</tspan><tspan x="145.0" dy="14.3">падіння пропускної здатності</tspan></text>
<line x1="265.0" y1="180.0" x2="295.0" y2="180.0" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="300.0" y="30.0" width="230.0" height="320.0" rx="8" fill="none" stroke="#f39c12" stroke-width="1.5"/>
<rect x="288.1" y="40.0" width="253.7" height="49.9" rx="6" fill="#fdebd0" stroke="#f39c12" stroke-width="1.5"/><text x="415.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9c640c" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">Фаза 2: Свопінг і пробуксовка</tspan><tspan x="415.0" dy="16.9">(Page Thrashing)</tspan></text>
<rect x="310.9" y="113.0" width="208.1" height="73.9" rx="6" fill="#ffffff" stroke="#f9e79f" stroke-width="1.5"/><text x="415.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">RAM вичерпано.</tspan><tspan x="415.0" dy="14.3">Ядро витісняє сторінки в swap.</tspan><tspan x="415.0" dy="14.3">kswapd споживає 100% CPU.</tspan><tspan x="415.0" dy="14.3">Дисковий I/O заблоковано.</tspan></text>
<rect x="298.4" y="228.1" width="233.2" height="73.9" rx="6" fill="#fef5e7" stroke="#f39c12" stroke-width="1.5"/><text x="415.0" y="247.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e5109" text-anchor="middle"><tspan x="415.0" dy="0.0">Симптом:</tspan><tspan x="415.0" dy="14.3">Затримки (latency) стрибають</tspan><tspan x="415.0" dy="14.3">від мілісекунд до десятків секунд;</tspan><tspan x="415.0" dy="14.3">система «зависає»</tspan></text>
<line x1="535.0" y1="180.0" x2="565.0" y2="180.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="570.0" y="30.0" width="220.0" height="320.0" rx="8" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<rect x="593.4" y="40.0" width="173.1" height="49.9" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#78281f" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Фаза 3: Спрацювання</tspan><tspan x="680.0" dy="16.9">Linux OOM Killer</tspan></text>
<rect x="579.1" y="113.0" width="201.8" height="73.9" rx="6" fill="#ffffff" stroke="#f5b7b1" stroke-width="1.5"/><text x="680.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Вичерпано і RAM, і Swap.</tspan><tspan x="680.0" dy="14.3">Ядро обчислює oom_score:</tspan><tspan x="680.0" dy="14.3">points = RSS + swap_usage.</tspan><tspan x="680.0" dy="14.3">SIGKILL надсилається процесу.</tspan></text>
<rect x="591.6" y="228.1" width="176.8" height="73.9" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="247.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#641e16" text-anchor="middle"><tspan x="680.0" dy="0.0">Симптом:</tspan><tspan x="680.0" dy="14.3">Аварійне вбивство сервісу</tspan><tspan x="680.0" dy="14.3">або випадкового сусіда</tspan><tspan x="680.0" dy="14.3">(out-of-memory crash)</tspan></text>
</svg>