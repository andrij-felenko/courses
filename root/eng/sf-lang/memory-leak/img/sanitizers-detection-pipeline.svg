<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="25.0" width="235.0" height="340.0" rx="8" fill="none" stroke="#8e44ad" stroke-width="1.5"/>
<rect x="32.2" y="40.0" width="229.6" height="49.9" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/><text x="147.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#5b2c6f" text-anchor="middle" font-weight="700"><tspan x="147.0" dy="0.0">Valgrind Memcheck</tspan><tspan x="147.0" dy="16.9">(Емуляція двійкового коду)</tspan></text>
<rect x="21.0" y="103.0" width="252.0" height="73.9" rx="6" fill="#ffffff" stroke="#d2b4de" stroke-width="1.5"/><text x="147.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="147.0" dy="0.0">Як працює:</tspan><tspan x="147.0" dy="14.3">JIT-трансляція у VEX IR,</tspan><tspan x="147.0" dy="14.3">побайтова тіньова пам'ять (A/V-біти),</tspan><tspan x="147.0" dy="14.3">дерево всіх виділень.</tspan></text>
<rect x="36.7" y="198.1" width="220.6" height="73.9" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.5"/><text x="147.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4a235a" text-anchor="middle"><tspan x="147.0" dy="0.0">Швидкодія: 10×–30× сповільнення.</tspan><tspan x="147.0" dy="14.3">Де застосовувати:</tspan><tspan x="147.0" dy="14.3">Глибоке налагодження в тестах,</tspan><tspan x="147.0" dy="14.3">непридатний для продакшену.</tspan></text>
<rect x="25.9" y="298.5" width="242.3" height="43.0" rx="6" fill="#ebdef0" stroke="#8e44ad" stroke-width="1.5"/><text x="147.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="147.0" dy="0.0">Класифікація витоків:</tspan><tspan x="147.0" dy="13.0">Definite, Indirect, Possible, Reachable</tspan></text>
<rect x="292.0" y="25.0" width="235.0" height="340.0" rx="8" fill="none" stroke="#2980b9" stroke-width="1.5"/>
<rect x="282.1" y="40.0" width="253.7" height="49.9" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="409.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b4f72" text-anchor="middle" font-weight="700"><tspan x="409.0" dy="0.0">LeakSanitizer (LSan)</tspan><tspan x="409.0" dy="16.9">(Компіляторна інструментація)</tspan></text>
<rect x="273.6" y="103.0" width="270.8" height="73.9" rx="6" fill="#ffffff" stroke="#aed6f1" stroke-width="1.5"/><text x="409.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="409.0" dy="0.0">Як працює:</tspan><tspan x="409.0" dy="14.3">Перехоплення malloc/free,</tspan><tspan x="409.0" dy="14.3">Mark-and-Sweep сканування коренів</tspan><tspan x="409.0" dy="14.3">(стек, регістри, .data/.bss) при exit().</tspan></text>
<rect x="286.1" y="198.1" width="245.7" height="73.9" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="409.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#154360" text-anchor="middle"><tspan x="409.0" dy="0.0">Швидкодія: ~1.5×–2× сповільнення.</tspan><tspan x="409.0" dy="14.3">Де застосовувати:</tspan><tspan x="409.0" dy="14.3">CI/CD пайплайни, інтеграційні тести,</tspan><tspan x="409.0" dy="14.3">щоденна розробка (-fsanitize=leak).</tspan></text>
<rect x="322.1" y="298.5" width="173.9" height="43.0" rx="6" fill="#d4e6f1" stroke="#2980b9" stroke-width="1.5"/><text x="409.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="409.0" dy="0.0">Миттєвий звіт:</tspan><tspan x="409.0" dy="13.0">Стек виклику точки алокації</tspan></text>
<rect x="555.0" y="25.0" width="235.0" height="340.0" rx="8" fill="none" stroke="#27ae60" stroke-width="1.5"/>
<rect x="565.3" y="40.0" width="213.4" height="49.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="672.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#145a32" text-anchor="middle" font-weight="700"><tspan x="672.0" dy="0.0">eBPF memleak</tspan><tspan x="672.0" dy="16.9">(Трасування ядра наживо)</tspan></text>
<rect x="539.7" y="103.0" width="264.5" height="73.9" rx="6" fill="#ffffff" stroke="#a9dfbf" stroke-width="1.5"/><text x="672.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="672.0" dy="0.0">Як працює:</tspan><tspan x="672.0" dy="14.3">Uprobes на libc malloc/free,</tspan><tspan x="672.0" dy="14.3">агрегація активних алокацій у BPF-мапах</tspan><tspan x="672.0" dy="14.3">без зупинки процесу.</tspan></text>
<rect x="549.1" y="198.1" width="245.7" height="73.9" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="672.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0e6251" text-anchor="middle"><tspan x="672.0" dy="0.0">Швидкодія: &lt; 2% накладних витрат.</tspan><tspan x="672.0" dy="14.3">Де застосовувати:</tspan><tspan x="672.0" dy="14.3">Живий продакшен під навантаженням,</tspan><tspan x="672.0" dy="14.3">пошук повільних витоків на серверах.</tspan></text>
<rect x="579.4" y="298.5" width="185.3" height="43.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="672.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="672.0" dy="0.0">Аналіз у часі:</tspan><tspan x="672.0" dy="13.0">Стек + тривалість життя блоку</tspan></text>
</svg>