<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння стратегій: Call-by-Value, Call-by-Name та Call-by-Need</text>
<rect x="30.0" y="64.0" width="244.0" height="326.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="152.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Call-by-Value (Строге)</text>
<text x="152.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Аплікативний порядок</text>
<line x1="46.0" y1="120.0" x2="258.0" y2="120.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="42.0" y="144.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="152.0" y="168.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="152.0" dy="0.0">Аргументи рахуються ДО виклику</tspan></text>
<rect x="42.0" y="192.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="152.0" y="216.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="152.0" dy="0.0">Простий стек і передбачуваний час</tspan></text>
<rect x="42.0" y="240.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="152.0" y="264.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="152.0" dy="0.0">Зайва робота, якщо аргумент не треба</tspan></text>
<rect x="42.0" y="288.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="152.0" y="312.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="152.0" dy="0.0">Падає на ⊥, навіть якщо аргумент оминули</tspan></text>
<rect x="42.0" y="342.0" width="220.0" height="34.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="152.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">f(2+3, loop())  →  ЗАВИСАЄ</text>
<rect x="298.0" y="64.0" width="244.0" height="326.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="420.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Call-by-Name (За ім'ям)</text>
<text x="420.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Нормальний порядок (дерево)</text>
<line x1="314.0" y1="120.0" x2="526.0" y2="120.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="310.0" y="144.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="420.0" y="168.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Вираз підставляється нерозкритим</tspan></text>
<rect x="310.0" y="192.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="420.0" y="216.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Не використано → 0 обчислень</tspan></text>
<rect x="310.0" y="240.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="420.0" y="264.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Безпечно оминає ⊥ у невикористаному</tspan></text>
<rect x="310.0" y="288.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="420.0" y="312.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Повторює обчислення за кожним зверненням</tspan></text>
<rect x="310.0" y="342.0" width="220.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="420.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">sq(2+3)  →  (2+3)*(2+3)  (2 рази)</text>
<rect x="566.0" y="64.0" width="244.0" height="326.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="688.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Call-by-Need (Ліниве)</text>
<text x="688.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Редукція графа (спільне)</text>
<line x1="582.0" y1="120.0" x2="794.0" y2="120.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="578.0" y="144.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="688.0" y="168.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="688.0" dy="0.0">Вираз підставляється як санк (Thunk)</tspan></text>
<rect x="578.0" y="192.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="688.0" y="216.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="688.0" dy="0.0">Рахується під час першого читання</tspan></text>
<rect x="578.0" y="240.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="688.0" y="264.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="688.0" dy="0.0">Результат мутує граф (мемоізація)</tspan></text>
<rect x="578.0" y="288.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="688.0" y="312.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="688.0" dy="0.0">Наступні звернення читають готове (1 раз)</tspan></text>
<rect x="578.0" y="342.0" width="220.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="688.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">sq(thunk)  →  5 * 5 = 25  (1 раз)</text>
<text x="420.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Call-by-need поєднує безпеку нормального порядку з ефективністю однократного обчислення</text>
</svg>