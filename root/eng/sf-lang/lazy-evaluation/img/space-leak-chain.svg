<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витік пам'яті (Space Leak): накопичення ланцюгів санків</text>
<rect x="35.0" y="66.0" width="370.0" height="308.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="220.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Лінивий foldl (+) 0 [1..N]</text>
<text x="220.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Ланцюг невиконаних санків росте в купі</text>
<rect x="55.0" y="128.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="220.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Thunk 4: (((0 + 1) + 2) + 3) + 4</text>
<rect x="55.0" y="174.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="220.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Thunk 3: ((0 + 1) + 2) + 3</text>
<rect x="55.0" y="220.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="220.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Thunk 2: (0 + 1) + 2</text>
<rect x="55.0" y="266.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="220.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Thunk 1: 0 + 1</text>
<rect x="55.0" y="312.0" width="330.0" height="48.0" rx="6" fill="#f9d7d3" stroke="#c0392b" stroke-width="1.4"/>
<text x="220.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Пам'ять: O(N) у купі</text>
<text x="220.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">При читанні: переповнення стека!</text>
<rect x="435.0" y="66.0" width="370.0" height="308.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="620.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Строгий foldl' (+) 0 [1..N]</text>
<text x="620.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Акумулятор обчислюється на кожному кроці</text>
<rect x="455.0" y="128.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="620.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 1: acc = 0 + 1  →  1</text>
<rect x="455.0" y="174.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="620.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 2: acc = 1 + 2  →  3</text>
<rect x="455.0" y="220.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="620.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 3: acc = 3 + 3  →  6</text>
<rect x="455.0" y="266.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="620.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 4: acc = 6 + 4  →  10</text>
<rect x="455.0" y="312.0" width="330.0" height="48.0" rx="6" fill="#d5f0df" stroke="#27ae60" stroke-width="1.4"/>
<text x="620.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Пам'ять: O(1) у регістрі/стеку</text>
<text x="620.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Жодних санків у купі та переповнення</text>
<text x="420.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витік пам'яті через санки: накопичення відкладеної роботи замість швидкого обчислення</text>
</svg>