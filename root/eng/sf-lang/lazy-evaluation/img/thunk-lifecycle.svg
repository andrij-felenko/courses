<text x="420.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">info_ptr → BLACKHOLE</text>
<text x="420.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">пастка самовиклику</text>
<rect x="326.0" y="184.0" width="188.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
