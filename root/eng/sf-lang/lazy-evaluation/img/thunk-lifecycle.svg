<text x="145.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">info_ptr → eval_fn()</text>
<text x="145.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">вказівник на код</text>
<rect x="51.0" y="184.0" width="188.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
