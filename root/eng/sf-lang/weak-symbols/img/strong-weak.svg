<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сила символу: сильне перемагає слабке, слабке поступається</text>
<text x="200.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">те саме ім'я — двічі</text>
<rect x="70.0" y="96.0" width="260.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="115.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">СИЛЬНЕ визначення</tspan><tspan x="200.0" dy="14.3">void SysTick_Handler(){…}</tspan></text>
<rect x="70.0" y="168.0" width="260.0" height="46.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">СЛАБКЕ визначення</tspan><tspan x="200.0" dy="14.3">__attribute__((weak)) …</tspan></text>
<line x1="330.0" y1="119.0" x2="392.0" y2="150.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="330.0" y1="191.0" x2="392.0" y2="160.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="405.0" y="131.2" width="130.0" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="151.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">лінкер бере</tspan><tspan x="470.0" dy="15.6">СИЛЬНЕ</tspan></text>
<text x="200.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">слабке мовчки відкинуто — без «multiple definition»</text>
<line x1="380.0" y1="96.0" x2="380.0" y2="250.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="600.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">а якщо сильного нема —</text>
<rect x="500.0" y="300.0" width="200.0" height="32.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="319.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">лишається слабке → його й беруть</tspan></text>
