<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія Static Initialization Order Fiasco (SIOF)</text>
<text x="220.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Одиниця трансляції A (logger.cpp)</text>
<rect x="30.0" y="85.0" width="380.0" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">class Logger { ... };</tspan><tspan x="220.0" dy="14.3"></tspan><tspan x="220.0" dy="14.3">// Глобальний об'єкт журналу</tspan><tspan x="220.0" dy="14.3">Logger g_logger(&quot;app.log&quot;);</tspan><tspan x="220.0" dy="14.3"></tspan><tspan x="220.0" dy="14.3">[Ініціалізатор додається до .init_array]</tspan></text>
<text x="700.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Одиниця трансляції B (network.cpp)</text>
<rect x="510.0" y="85.0" width="380.0" height="110.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">class NetworkClient {</tspan><tspan x="700.0" dy="14.3">  NetworkClient() {</tspan><tspan x="700.0" dy="14.3">    g_logger.log(&quot;Init net...&quot;); // ВИКЛИК A!</tspan><tspan x="700.0" dy="14.3">  }</tspan><tspan x="700.0" dy="14.3">};</tspan><tspan x="700.0" dy="14.3">NetworkClient g_net;</tspan><tspan x="700.0" dy="14.3">[Ініціалізатор додається до .init_array]</tspan></text>
<rect x="150.0" y="220.0" width="620.0" height="50.0" rx="6" fill="#f8f9f9" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="248.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Лінкування: порядок у секції .init_array залежить від прапорців, порядку файлів та тулчейну</tspan></text>
<line x1="220.0" y1="195.0" x2="320.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="195.0" x2="600.0" y2="220.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="460.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій катастрофи під час запуску програми (до main)</text>
<rect x="30.0" y="315.0" width="410.0" height="85.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Крок 1: CRT першим викликає ініціалізатор B</tspan><tspan x="235.0" dy="14.3">Конструктор NetworkClient() починає роботу.</tspan><tspan x="235.0" dy="14.3">Він намагається використати g_logger.</tspan></text>
<rect x="480.0" y="315.0" width="410.0" height="85.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="685.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Крок 2: Пам'ять g_logger ще не ініціалізована!</tspan><tspan x="685.0" dy="14.3">Внутрішні вказівники та буфери є нулями (0x00) або сміттям.</tspan><tspan x="685.0" dy="14.3">Виклик методу log() спричиняє Segmentation Fault або UB.</tspan></text>
<line x1="440.0" y1="357.0" x2="480.0" y2="357.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="425.0" width="860.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="459.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Причина аварії: порядок виклику конструкторів між різними .cpp не гарантується.</tspan><tspan x="460.0" dy="14.3">Розв'язок: ідіома Meyer's Singleton (ініціалізація за першим викликом) або C++20 constinit.</tspan></text>
</svg>