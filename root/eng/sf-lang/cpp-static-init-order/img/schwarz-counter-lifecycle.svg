<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ідіома Nifty Counter (Schwarz Counter) у заголовковому файлі</text>
<rect x="160.0" y="55.0" width="600.0" height="75.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Заголовковий файл (наприклад, &lt;iostream&gt; або logger.hpp)</tspan><tspan x="460.0" dy="14.3">static struct StreamInitializer { StreamInitializer(); ~StreamInitializer(); } s_init;</tspan><tspan x="460.0" dy="14.3">Кожен .cpp файл, що робить #include, отримує власну статичну копію s_init</tspan></text>
<rect x="30.0" y="155.0" width="260.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Одиниця трансляції 1</tspan><tspan x="160.0" dy="14.3">#include &lt;iostream&gt;</tspan><tspan x="160.0" dy="14.3">-&gt; static s_init (TU1)</tspan></text>
<rect x="330.0" y="155.0" width="260.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Одиниця трансляції 2</tspan><tspan x="460.0" dy="14.3">#include &lt;iostream&gt;</tspan><tspan x="460.0" dy="14.3">-&gt; static s_init (TU2)</tspan></text>
<rect x="630.0" y="155.0" width="260.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Одиниця трансляції 3</tspan><tspan x="760.0" dy="14.3">#include &lt;iostream&gt;</tspan><tspan x="760.0" dy="14.3">-&gt; static s_init (TU3)</tspan></text>
<line x1="300.0" y1="130.0" x2="160.0" y2="155.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460.0" y1="130.0" x2="460.0" y2="155.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="130.0" x2="760.0" y2="155.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="245.0" width="410.0" height="145.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="235.0" y="278.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Стадія запуску (конструктори s_init):</tspan><tspan x="235.0" dy="14.3">1. Перший TU: ++g_count (стає 1)</tspan><tspan x="235.0" dy="14.3">   -&gt; Виклик placement new для cout/logger</tspan><tspan x="235.0" dy="14.3">2. Другий TU: ++g_count (стає 2)</tspan><tspan x="235.0" dy="14.3">   -&gt; Об'єкт уже готовий, пропуск</tspan><tspan x="235.0" dy="14.3">3. Третій TU: ++g_count (стає 3)</tspan><tspan x="235.0" dy="14.3">   -&gt; Об'єкт уже готовий, пропуск</tspan></text>
<rect x="480.0" y="245.0" width="410.0" height="145.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="685.0" y="278.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Стадія завершення (деструктори s_init):</tspan><tspan x="685.0" dy="14.3">1. Третій TU: --g_count (стає 2)</tspan><tspan x="685.0" dy="14.3">   -&gt; Ресурс залишається активним</tspan><tspan x="685.0" dy="14.3">2. Другий TU: --g_count (стає 1)</tspan><tspan x="685.0" dy="14.3">   -&gt; Ресурс залишається активним</tspan><tspan x="685.0" dy="14.3">3. Перший TU: --g_count (стає 0)</tspan><tspan x="685.0" dy="14.3">   -&gt; Явний виклик деструктора ресурсу</tspan></text>
<rect x="30.0" y="415.0" width="860.0" height="85.0" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="460.0" y="447.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Гарантія безпеки:</tspan><tspan x="460.0" dy="14.3">Оскільки s_init оголошено у заголовку, його конструктор виконується ДО будь-яких глобальних змінних у цьому .cpp файлі.</tspan><tspan x="460.0" dy="14.3">Ресурс знищується лише тоді, коли останній .cpp файл завершить роботу.</tspan></text>
</svg>