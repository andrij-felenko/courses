<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фази ініціалізації та руйнування глобальних і статичних об'єктів</text>
<text x="220.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. СТАТИЧНА ІНІЦІАЛІЗАЦІЯ (компіляція та завантаження)</text>
<rect x="30.0" y="85.0" width="380.0" height="75.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Zero Initialization (нульова фаза)</tspan><tspan x="220.0" dy="14.3">Завантажувач обнуляє сегмент .bss</tspan><tspan x="220.0" dy="14.3">Усі глобальні байти заповнюються нулями (0x00)</tspan></text>
<rect x="30.0" y="175.0" width="380.0" height="75.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Constant Initialization (константна фаза)</tspan><tspan x="220.0" dy="14.3">Компілятор обчислює constexpr / constinit вирази</tspan><tspan x="220.0" dy="14.3">Значення напряму записуються в секцію .data / .rodata</tspan></text>
<line x1="220.0" y1="160.0" x2="220.0" y2="175.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">2. ДИНАМІЧНА ІНІЦІАЛІЗАЦІЯ (до входу в main)</text>
<rect x="30.0" y="290.0" width="380.0" height="95.0" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="220.0" y="319.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Dynamic Initialization (виклики конструкторів)</tspan><tspan x="220.0" dy="14.3">CRT обходить список показників .init_array / .ctors</tspan><tspan x="220.0" dy="14.3">Порядок всередині одного .cpp: строго зверху вниз</tspan><tspan x="220.0" dy="14.3">Порядок між різними .cpp: НЕ ВИЗНАЧЕНИЙ (ризик SIOF!)</tspan></text>
<line x1="220.0" y1="250.0" x2="220.0" y2="265.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="235.0" width="80.0" height="50.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
<text x="470.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Виконання</text>
<text x="470.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">main()</text>
<line x1="410.0" y1="335.0" x2="430.0" y2="280.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="280.0" x2="530.0" y2="335.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="710.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">3. ДИНАМІЧНЕ РУЙНУВАННЯ (після виходу з main)</text>
<rect x="520.0" y="290.0" width="380.0" height="95.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Static Destruction (виклики деструкторів)</tspan><tspan x="710.0" dy="13.0">Виконання обробників стека atexit / __cxa_atexit</tspan><tspan x="710.0" dy="13.0">Порядок: строго LIFO (зворотний до завершення конструювання)</tspan><tspan x="710.0" dy="13.0">Якщо порядок конструювання був хибним -&gt; ризик SDOF!</tspan></text>
<rect x="30.0" y="420.0" width="860.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="447.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Критичне правило стандарту C++:</tspan><tspan x="460.0" dy="14.3">Статична ініціалізація завжди передує будь-якій динамічній ініціалізації.</tspan><tspan x="460.0" dy="14.3">Конструктори глобальних змінних не мають визначеного порядку між одиницями трансляції.</tspan></text>
</svg>