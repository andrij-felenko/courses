<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спадкування (IS-A, біла скринька) проти Композиції (HAS-A, чорна скринька)</text>
<text x="190.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Спадкування (Біла скринька)</text>
<rect x="40.0" y="75.0" width="300.0" height="160.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/>
<rect x="70.0" y="90.0" width="240.0" height="45.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="190.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Базовий клас (Base)</text>
<text x="190.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">розкриває деталі реалізації нащадку</text>
<line x1="190.0" y1="175.0" x2="190.0" y2="138.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="175.0" width="240.0" height="45.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="190.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Похідний клас (Derived)</text>
<text x="190.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">жорстко зв'язаний з порядком викликів Base</text>
<text x="190.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ламкість: зміна Base ламає Derived</text>
<text x="550.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Композиція (Чорна скринька)</text>
<rect x="400.0" y="75.0" width="300.0" height="160.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.5"/>
<rect x="430.0" y="90.0" width="240.0" height="45.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="550.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Інтерфейс / Компонент</text>
<text x="550.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">лише відкритий публічний контракт</text>
<line x1="550.0" y1="175.0" x2="550.0" y2="138.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="175.0" width="240.0" height="45.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="550.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клас-клієнт (Holder)</text>
<text x="550.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">володіє об'єктом через поле/покажчик</text>
<text x="550.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Гнучкість: заміна компонента без наслідків</text>
<rect x="100.7" y="280.5" width="538.7" height="23.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="370.0" y="295.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Принцип проєктування: надавайте перевагу композиції об'єктів над спадкуванням класів</tspan></text>
</svg>