<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема funarg: передача вниз проти повернення вгору</text>
<rect x="30.0" y="60.0" width="360.0" height="270.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="210.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Downward Funarg (Низхідний)</text>
<text x="210.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Замикання передається як аргумент углиб стека</text>
<rect x="60.0" y="130.0" width="300.0" height="40.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="210.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Кадр caller(): локальна змінна x</text>
<rect x="60.0" y="180.0" width="300.0" height="40.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="210.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Кадр sort(arr, predicate) [виконується]</text>
<rect x="60.0" y="240.0" width="300.0" height="65.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="210.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Безпечно на стеку (Stack Allocation)</tspan><tspan x="210.0" dy="14.3">Час життя predicate коротший за caller.</tspan><tspan x="210.0" dy="14.3">Накладні витрати = 0 байтів на купі.</tspan></text>
<rect x="430.0" y="60.0" width="360.0" height="270.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="610.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Upward Funarg (Висхідний)</text>
<text x="610.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Замикання повертається назовні або зберігається</text>
<rect x="460.0" y="130.0" width="300.0" height="40.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="610.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Кадр factory(): знищується під час RET!</text>
<line x1="610.0" y1="175.0" x2="610.0" y2="210.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="215.0" width="300.0" height="90.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="610.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="610.0" dy="0.0">Втеча на купу (Heap Escape)</tspan><tspan x="610.0" dy="14.3">Якщо зберегти на стеку — висячий покажчик!</tspan><tspan x="610.0" dy="14.3">Компілятор переносить оточення на купу</tspan><tspan x="610.0" dy="14.3">(malloc / new / garbage collection).</tspan></text>
</svg>