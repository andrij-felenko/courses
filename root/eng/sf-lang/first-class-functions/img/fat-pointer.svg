<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня будова замикання: товстий покажчик (Fat Pointer)</text>
<rect x="50.0" y="80.0" width="240.0" height="220.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Замикання (Fat Pointer)</text>
<rect x="70.0" y="140.0" width="200.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="170.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">code_ptr (8 байтів)</tspan><tspan x="170.0" dy="15.6">Покажчик на машинний код</tspan></text>
<rect x="70.0" y="215.0" width="200.0" height="50.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="170.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">env_ptr (8 байтів)</tspan><tspan x="170.0" dy="15.6">Покажчик на оточення</tspan></text>
<rect x="460.0" y="70.0" width="310.0" height="115.0" rx="8" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="615.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Сегмент коду (.text / Flash)</text>
<text x="615.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">fn_impl(env, args...):</tspan><tspan x="615.0" dy="14.3">  MOV rax, [rdi + 8]   ; читання env-&gt;x</tspan><tspan x="615.0" dy="14.3">  ADD rax, rsi         ; додавання аргументу</tspan><tspan x="615.0" dy="14.3">  RET</tspan></text>
<rect x="460.0" y="210.0" width="310.0" height="115.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="615.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Захоплене оточення (RAM / Купа)</text>
<text x="615.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">struct Env_Record {</tspan><tspan x="615.0" dy="14.3">  uint32_t ref_count;   ; керування пам'яттю</tspan><tspan x="615.0" dy="14.3">  int captured_x = 42;  ; захоплена змінна</tspan><tspan x="615.0" dy="14.3">}</tspan></text>
<line x1="270.0" y1="165.0" x2="455.0" y2="125.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
