<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня структура двійкового ELF-образу: двоїстий погляд (Dual View)</text>
<text x="170.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичний ELF-файл на диску</text>
<rect x="40.0" y="95.0" width="260.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="118.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">ELF Header (Elf32_Ehdr / Elf64_Ehdr)</tspan><tspan x="170.0" dy="11.7">Magic 0x7F 'ELF', Клас, Ендіан, e_entry, e_phoff, e_shoff</tspan></text>
<rect x="40.0" y="155.0" width="260.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="175.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Program Header Table (таблиця сегментів)</tspan><tspan x="170.0" dy="11.7">Elf32_Phdr: PT_LOAD 1 (RX), PT_LOAD 2 (RW)</tspan></text>
<rect x="40.0" y="209.0" width="260.0" height="32.0" rx="6" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.5"/><text x="170.0" y="228.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Секція .isr_vector (Таблиця векторів переривань)</tspan></text>
<rect x="40.0" y="247.0" width="260.0" height="34.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Секція .text (Машинний код функцій / Flash)</tspan></text>
<rect x="40.0" y="287.0" width="260.0" height="34.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="307.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Секція .rodata (Рядкові константи, таблиці)</tspan></text>
<rect x="40.0" y="327.0" width="260.0" height="34.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="347.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Секція .data (Початкові значення змінних)</tspan></text>
<rect x="40.0" y="367.0" width="260.0" height="34.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="387.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Секція .symtab &amp; .strtab (Таблиця імен і символів)</tspan></text>
<rect x="40.0" y="407.0" width="260.0" height="34.0" rx="6" fill="#f5eef8" stroke="#7d3c98" stroke-width="1.5"/><text x="170.0" y="427.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Секції .debug_* (DWARF інформація налагодження)</tspan></text>
<rect x="40.0" y="447.0" width="260.0" height="32.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="466.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Секція .shstrtab (Рядки імен секцій)</tspan></text>
<rect x="40.0" y="487.0" width="260.0" height="48.0" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="508.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Section Header Table (таблиця заголовків секцій)</tspan><tspan x="170.0" dy="11.7">Elf32_Shdr: зміщення, розміри, прапорці SHF_*</tspan></text>
<text x="490.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Погляд завантажувача (Execution View)</text>
<rect x="340.0" y="100.0" width="290.0" height="205.0" rx="6" fill="#fdfefe" stroke="#27ae60" stroke-width="1.8"/>
<rect x="340.0" y="100.0" width="290.0" height="30.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.8"/>
<text x="485.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Сегмент PT_LOAD 1: FLASH (R-X)</text>
<rect x="350.0" y="136.0" width="270.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="485.0" y="146.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">p_vaddr = p_paddr = 0x08000000</tspan><tspan x="485.0" dy="13.0">p_flags = PF_R | PF_X</tspan><tspan x="485.0" dy="13.0">p_filesz = p_memsz</tspan></text>
<rect x="350.0" y="180.0" width="270.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="485.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">Включає секції коду та констант:</tspan><tspan x="485.0" dy="13.0">.isr_vector + .text + .rodata</tspan></text>
<rect x="350.0" y="218.0" width="270.0" height="42.0" rx="6" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.5"/><text x="485.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">LMA образ даних .data (Flash):</tspan><tspan x="485.0" dy="13.0">Сирі початкові байти для RAM</tspan></text>
<rect x="350.0" y="264.0" width="270.0" height="34.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="485.0" y="284.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="485.0" dy="0.0">Заливається у Flash безпосередньо</tspan></text>
<rect x="340.0" y="325.0" width="290.0" height="210.0" rx="6" fill="#fdfefe" stroke="#c0392b" stroke-width="1.8"/>
<rect x="340.0" y="325.0" width="290.0" height="30.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.8"/>
<text x="485.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сегмент PT_LOAD 2: RAM (RW-)</text>
<rect x="350.0" y="361.0" width="270.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="485.0" y="371.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">p_vaddr = 0x20000000 (VMA в RAM)</tspan><tspan x="485.0" dy="13.0">p_paddr = LMA у Flash (звідки копіювати)</tspan><tspan x="485.0" dy="13.0">p_flags = PF_R | PF_W</tspan></text>
<rect x="350.0" y="405.0" width="270.0" height="38.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="485.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">.data: p_filesz байтів з файлу</tspan><tspan x="485.0" dy="13.0">(початкові значення змінних)</tspan></text>
<rect x="350.0" y="447.0" width="270.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="485.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">.bss: p_memsz - p_filesz байтів</tspan><tspan x="485.0" dy="13.0">(у файлі немає, обнуляється в RAM)</tspan></text>
<rect x="350.0" y="493.0" width="270.0" height="34.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="485.0" y="513.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="485.0" dy="0.0">Розгортається в оперативній пам'яті</tspan></text>
<text x="810.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Погляд лінкера / GDB (Linkage View)</text>
<rect x="660.0" y="100.0" width="290.0" height="435.0" rx="6" fill="#fdfefe" stroke="#2457d6" stroke-width="1.8"/>
<rect x="660.0" y="100.0" width="290.0" height="30.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="805.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Таблиця Section Headers (Elf32_Shdr)</text>
<rect x="670.0" y="136.0" width="270.0" height="52.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">sh_name -&gt; .text (PROGBITS, ALLOC|EXEC)</tspan><tspan x="805.0" dy="13.0">sh_addr = 0x08000100, sh_offset = 0x1000</tspan></text>
<rect x="670.0" y="192.0" width="270.0" height="52.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">sh_name -&gt; .rodata (PROGBITS, ALLOC)</tspan><tspan x="805.0" dy="13.0">sh_addr = 0x08008000, sh_offset = 0x8F00</tspan></text>
<rect x="670.0" y="248.0" width="270.0" height="52.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="805.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">sh_name -&gt; .data (PROGBITS, ALLOC|WRITE)</tspan><tspan x="805.0" dy="13.0">sh_addr = 0x20000000, sh_offset = 0x9800</tspan></text>
<rect x="670.0" y="304.0" width="270.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="327.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">sh_name -&gt; .bss (NOBITS, ALLOC|WRITE)</tspan><tspan x="805.0" dy="11.7">sh_addr = 0x20000400, sh_offset = 0 (0 байт у файлі!)</tspan></text>
<rect x="670.0" y="360.0" width="270.0" height="52.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="805.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">sh_name -&gt; .symtab (SYMTAB, нічого в чип!)</tspan><tspan x="805.0" dy="13.0">Таблиця символів: функції, адреси, змінні</tspan></text>
<rect x="670.0" y="416.0" width="270.0" height="52.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="805.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">sh_name -&gt; .strtab (STRTAB, рядки символів)</tspan><tspan x="805.0" dy="13.0">Імена функцій: main, Reset_Handler...</tspan></text>
<rect x="670.0" y="472.0" width="270.0" height="52.0" rx="6" fill="#f5eef8" stroke="#7d3c98" stroke-width="1.5"/><text x="805.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">sh_name -&gt; .debug_info (DWARF для GDB)</tspan><tspan x="805.0" dy="13.0">Відповідність адрес рядкам сирцевого коду</tspan></text>
<line x1="302.0" y1="178.0" x2="338.0" y2="178.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="302.0" y1="344.0" x2="338.0" y2="370.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="302.0" y1="511.0" x2="658.0" y2="480.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>