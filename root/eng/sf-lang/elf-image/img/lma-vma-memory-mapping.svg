<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відображення пам'яті мікроконтролера: LMA (Flash) проти VMA (SRAM)</text>
<text x="210.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Flash пам'ять (LMA — Load Memory Address)</text>
<rect x="50.0" y="95.0" width="320.0" height="390.0" rx="8" fill="#fdfefe" stroke="#27ae60" stroke-width="2.0"/>
<rect x="50.0" y="95.0" width="320.0" height="32.0" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.0"/>
<text x="210.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Flash (Енергонезалежна ROM: 0x08000000)</text>
<rect x="60.0" y="135.0" width="300.0" height="48.0" rx="6" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.5"/><text x="210.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">0x08000000: .isr_vector (Вектори Cortex-M)</tspan><tspan x="210.0" dy="13.0">Початковий SP (_estack) та Reset_Handler</tspan></text>
<rect x="60.0" y="189.0" width="300.0" height="52.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">0x08000100: .text (Машинні інструкції коду)</tspan><tspan x="210.0" dy="13.0">Виконується процесором прямо з Flash (XIP)</tspan></text>
<rect x="60.0" y="247.0" width="300.0" height="48.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">0x08008000: .rodata (Незмінні константи)</tspan><tspan x="210.0" dy="13.0">Рядкові літерали, таблиці перерахунку</tspan></text>
<rect x="60.0" y="301.0" width="300.0" height="65.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">0x08009800: .data (Початковий образ у Flash)</tspan><tspan x="210.0" dy="13.0">LMA адреса = символ _sidata</tspan><tspan x="210.0" dy="13.0">(Сирі початкові значення змінних)</tspan></text>
<rect x="60.0" y="372.0" width="300.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Вільний залишок Flash пам'яті</tspan><tspan x="210.0" dy="13.0">(Доступний для розширення коду)</tspan></text>
<rect x="60.0" y="422.0" width="300.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="443.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">.bss у Flash МІСЦЯ НЕ ЗАЙМАЄ! (0 байтів)</tspan></text>
<text x="490.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ініціалізація C/C++ рантайму</text>
<rect x="390.0" y="160.0" width="200.0" height="130.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
<text x="490.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7950b" text-anchor="middle" font-weight="700">1. Копіювання .data</text>
<rect x="396.0" y="196.0" width="188.0" height="86.0" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.5"/><text x="490.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">memcpy(</tspan><tspan x="490.0" dy="12.3">  &amp;_sdata,</tspan><tspan x="490.0" dy="12.3">  &amp;_sidata,</tspan><tspan x="490.0" dy="12.3">  &amp;_edata - &amp;_sdata</tspan><tspan x="490.0" dy="12.3">);</tspan><tspan x="490.0" dy="12.3">Копіює Flash LMA -&gt; RAM VMA</tspan></text>
<rect x="390.0" y="310.0" width="200.0" height="130.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/>
<text x="490.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. Очищення .bss</text>
<rect x="396.0" y="346.0" width="188.0" height="86.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="355.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">memset(</tspan><tspan x="490.0" dy="12.3">  &amp;_sbss,</tspan><tspan x="490.0" dy="12.3">  0,</tspan><tspan x="490.0" dy="12.3">  &amp;_ebss - &amp;_sbss</tspan><tspan x="490.0" dy="12.3">);</tspan><tspan x="490.0" dy="12.3">Обнуляє статичні змінні</tspan><tspan x="490.0" dy="12.3">без початкових значень</tspan></text>
<line x1="362.0" y1="335.0" x2="388.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="592.0" y1="230.0" x2="618.0" y2="175.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="592.0" y1="375.0" x2="618.0" y2="245.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="770.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">SRAM пам'ять (VMA — Virtual Memory Address)</text>
<rect x="610.0" y="95.0" width="320.0" height="390.0" rx="8" fill="#fdfefe" stroke="#c0392b" stroke-width="2.0"/>
<rect x="610.0" y="95.0" width="320.0" height="32.0" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="2.0"/>
<text x="770.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">SRAM (Оперативна RAM: 0x20000000)</text>
<rect x="620.0" y="135.0" width="300.0" height="55.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">0x20000000: .data (_sdata .. _edata)</tspan><tspan x="770.0" dy="13.0">VMA = адреса виконання в RAM</tspan><tspan x="770.0" dy="13.0">(Змінні читаються і записуються CPU)</tspan></text>
<rect x="620.0" y="196.0" width="300.0" height="55.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/><text x="770.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">0x20000400: .bss (_sbss .. _ebss)</tspan><tspan x="770.0" dy="13.0">Змінні за замовчуванням = 0</tspan><tspan x="770.0" dy="13.0">(Ініціалізуються нулями під час старту)</tspan></text>
<rect x="620.0" y="257.0" width="300.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="273.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">0x20000800: Купа (Heap / _ebss .. _end)</tspan><tspan x="770.0" dy="13.0">Динамічна пам'ять malloc / new</tspan><tspan x="770.0" dy="13.0">(Зростає за адресами ВГОРУ -&gt;)</tspan></text>
<rect x="620.0" y="315.0" width="300.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Вільна пам'ять SRAM (Запас між стеком і купою)</tspan><tspan x="770.0" dy="13.0">Контроль переповнення стека</tspan></text>
<rect x="620.0" y="367.0" width="300.0" height="54.0" rx="6" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.5"/><text x="770.0" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">0x2001FFFC: Стек (Stack / _estack)</tspan><tspan x="770.0" dy="13.0">Локальні змінні, кадри функцій</tspan><tspan x="770.0" dy="13.0">(Зростає за адресами ВНИЗ &lt;-)</tspan></text>
<rect x="620.0" y="427.0" width="300.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="446.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">0x20020000: Вершина RAM (Кінець фізичної SRAM)</tspan></text>
</svg>