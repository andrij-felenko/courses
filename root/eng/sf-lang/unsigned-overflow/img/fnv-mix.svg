<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геш FNV-1a: множення з wrap за модулем 2³² перемішує біти</text>
<text x="360.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">FNV-1a: два кроки на байт, обидва на перекоті</text>
<rect x="40.0" y="84.0" width="300.0" height="70.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="190.0" y="99.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">hash ^= байт</tspan><tspan x="190.0" dy="15.6"></tspan><tspan x="190.0" dy="15.6">вкидаємо новий байт</tspan><tspan x="190.0" dy="15.6">у молодші біти слова</tspan></text>
<line x1="190.0" y1="158.0" x2="190.0" y2="186.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="190.0" width="300.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="190.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">hash *= FNV_PRIME  (mod 2³²)</tspan><tspan x="190.0" dy="15.6"></tspan><tspan x="190.0" dy="15.6">добуток перевалює за 2³²,</tspan><tspan x="190.0" dy="15.6">старші біти завертаються</tspan><tspan x="190.0" dy="15.6">у молодші — перемішування</tspan></text>
<text x="540.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">32-бітні константи</text>
<text x="380.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">OFFSET = 0x811C9DC5</text>
<text x="380.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">PRIME  = 0x01000193</text>
<rect x="374.0" y="178.0" width="306.0" height="96.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.6"/><text x="527.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="527.0" dy="0.0">саме перекіт mod 2³²</tspan><tspan x="527.0" dy="15.6">розганяє інформацію</tspan><tspan x="527.0" dy="15.6">по всіх 32 бітах.</tspan><tspan x="527.0" dy="15.6">тип — тільки uint32_t,</tspan><tspan x="527.0" dy="15.6">суфікс u обовʼязковий</tspan></text>
<text x="360.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">знаковий тип → множення на перекоті стає UB, геш ламається</text>
</svg>