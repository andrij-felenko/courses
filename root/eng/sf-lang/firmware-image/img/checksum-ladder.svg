<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина сили: байтова сума → CRC → криптохеш</text>
<rect x="80.0" y="60.0" width="560.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="100.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">байтова сума (8 біт)</text>
<text x="100.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">промах ~ 1/256; дві помилки гасяться</text>
<text x="624.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">▲ сильніше</text>
<rect x="80.0" y="136.0" width="560.0" height="60.0" rx="6" fill="#eef4ff" stroke="#3a5bb8" stroke-width="1.8"/>
<text x="100.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#3a5bb8" text-anchor="start" font-weight="700">CRC (16/32 біт)</text>
<text x="100.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ловить пакетні помилки; промах ~ 1/4 млрд</text>
<text x="624.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3a5bb8" text-anchor="end">▲ сильніше</text>
<rect x="80.0" y="212.0" width="560.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="100.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">криптохеш (128/256 біт)</text>
<text x="100.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">будь-яка зміна → інший хеш</text>
<text x="624.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end">▲ сильніше</text>
<text x="360.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">за силу платять часом і пам'яттю — беруть найдешевше, що ловить потрібне</text>
</svg>