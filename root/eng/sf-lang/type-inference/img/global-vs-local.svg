<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Глобальне виведення (Hindley-Milner) проти локального (C++, Rust, Go)</text>
<rect x="30.0" y="55.0" width="385.0" height="290.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="222.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Глобальне виведення (Haskell, OCaml)</text>
<rect x="47.0" y="105.5" width="350.0" height="39.0" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/><text x="222.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="222.0" dy="0.0">1. Побудова графа обмежень для всього модуля</tspan><tspan x="222.0" dy="13.0">Усі вирази отримують вільні змінні типів (α, β, γ)</tspan></text>
<rect x="47.0" y="165.5" width="350.0" height="39.0" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/><text x="222.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="222.0" dy="0.0">2. Наскрізна глобальна уніфікація</tspan><tspan x="222.0" dy="13.0">Розв'язання системи рівнянь між усіма функціями</tspan></text>
<rect x="47.0" y="225.5" width="350.0" height="39.0" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/><text x="222.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="222.0" dy="0.0">3. Узагальнення схеми типів (Let-поліморфізм)</tspan><tspan x="222.0" dy="13.0">Сигнатури виводяться автоматично без анотацій</tspan></text>
<text x="222.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">Плюс: нуль шуму в коді. Мінус: помилка в рядку 50 б'є в рядок 5.</text>
<rect x="445.0" y="55.0" width="385.0" height="290.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="637.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локальне виведення (C++ auto, Rust let, Go :=)</text>
<rect x="462.0" y="105.5" width="350.0" height="39.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="637.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="637.0" dy="0.0">1. Жорсткі контрактні межі (Сигнатури)</tspan><tspan x="637.0" dy="13.0">Типи параметрів і повернення функцій фіксовані явно</tspan></text>
<rect x="455.1" y="165.5" width="363.7" height="39.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="637.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="637.0" dy="0.0">2. Виведення лише всередині тіла функції</tspan><tspan x="637.0" dy="13.0">Компілятор іде зверху вниз / зліва направо за ініціалізатором</tspan></text>
<rect x="462.0" y="225.5" width="350.0" height="39.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="637.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="637.0" dy="0.0">3. Ізоляція одиниць трансляції</tspan><tspan x="637.0" dy="13.0">Зміна всередині функції не ламає типів зовнішніх клієнтів</tspan></text>
<text x="637.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Плюс: швидка збірка, локальні помилки, підтримка підтипів.</text>
</svg>