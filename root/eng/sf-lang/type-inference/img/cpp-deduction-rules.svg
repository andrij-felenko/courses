<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правила виведення типів у C++: auto, посилання та decltype(auto)</text>
<rect x="30.0" y="52.0" width="190.0" height="320.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="125.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">auto</text>
<text x="125.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">За значенням (Value)</text>
<line x1="40.0" y1="102.0" x2="210.0" y2="102.0" stroke="#2457d6" stroke-width="0.8"/>
<text x="42.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Відкидає посилання (&amp;, &amp;&amp;)</text>
<text x="42.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Відкидає top-level const</text>
<text x="42.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Масив спадає до покажчика</text>
<text x="42.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Приклад:</text>
<text x="42.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">const int&amp; x = 10;</text>
<text x="42.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">auto a = x;  // тип: int</text>
<rect x="230.0" y="52.0" width="190.0" height="320.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="325.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">auto&amp; / const auto&amp;</text>
<text x="325.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Lvalue-посилання</text>
<line x1="240.0" y1="102.0" x2="410.0" y2="102.0" stroke="#27ae60" stroke-width="0.8"/>
<text x="242.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Зберігає const / volatile</text>
<text x="242.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Гарантує посилання на об'єкт</text>
<text x="242.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Забороняє rvalue до non-const</text>
<text x="242.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Приклад:</text>
<text x="242.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">const int x = 10;</text>
<text x="242.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">auto&amp; b = x;  // const int&amp;</text>
<rect x="430.0" y="52.0" width="190.0" height="320.0" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.4"/>
<text x="525.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ca8a04" text-anchor="middle" font-weight="700">auto&amp;&amp;</text>
<text x="525.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Універсальне посилання</text>
<line x1="440.0" y1="102.0" x2="610.0" y2="102.0" stroke="#ca8a04" stroke-width="0.8"/>
<text x="442.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Згортання посилань:</text>
<text x="442.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  &amp; + &amp; → &amp;,   &amp;&amp; + &amp; → &amp;</text>
<text x="442.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  &amp; + &amp;&amp; → &amp;,  &amp;&amp; + &amp;&amp; → &amp;&amp;</text>
<text x="442.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Зберігає категорію значення</text>
<text x="442.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Приклад:</text>
<text x="442.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">auto&amp;&amp; c = 10; // int&amp;&amp;</text>
<text x="442.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">auto&amp;&amp; d = x;  // int&amp;</text>
<rect x="630.0" y="52.0" width="200.0" height="320.0" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.4"/>
<text x="730.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9333ea" text-anchor="middle" font-weight="700">decltype(auto)</text>
<text x="730.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Точний запит типу</text>
<line x1="640.0" y1="102.0" x2="820.0" y2="102.0" stroke="#9333ea" stroke-width="0.8"/>
<text x="642.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Не використовує шаблони</text>
<text x="642.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Застосовує decltype(expr)</text>
<text x="642.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Зберігає категорію виразу:</text>
<text x="642.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  ім'я x → точний тип T</text>
<text x="642.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  вираз (x) → T&amp; (lvalue)</text>
<text x="642.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Приклад:</text>
<text x="642.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">decltype(auto) r = get_ref();</text>
</svg>