<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підтипізація (Subtyping) та неоднозначність глобального виведення</text>
<rect x="30.0" y="52.0" width="380.0" height="345.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/>
<text x="220.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Решітка підтипів: відсутність єдиного MGU</text>
<rect x="141.0" y="99.5" width="157.9" height="31.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Any / Object (Top тип)</tspan></text>
<rect x="67.0" y="169.5" width="135.9" height="31.0" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="188.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Інтерфейс IReader</tspan></text>
<rect x="237.0" y="169.5" width="135.9" height="31.0" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/><text x="305.0" y="188.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Інтерфейс ICloser</tspan></text>
<rect x="111.1" y="242.3" width="217.8" height="45.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Клас FileStream</tspan><tspan x="220.0" dy="14.3">(реалізує IReader та ICloser)</tspan></text>
<line x1="220.0" y1="240.0" x2="145.0" y2="205.0" stroke="#27ae60" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="220.0" y1="240.0" x2="295.0" y2="205.0" stroke="#27ae60" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="135.0" y1="165.0" x2="205.0" y2="130.0" stroke="#2457d6" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="305.0" y1="165.0" x2="235.0" y2="130.0" stroke="#2457d6" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="220.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">FileStream має дві незрівнянні суперформи: IReader та ICloser</text>
<rect x="430.0" y="52.0" width="400.0" height="345.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/>
<text x="630.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дилема компілятора при розв'язанні обмежень</text>
<text x="448.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start" font-weight="700">Вираз: let process = \x -&gt; (read x, close x)</text>
<text x="448.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">В системі Гіндлі-Мілнера (без підтипів):</text>
<text x="448.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• x повинен мати точний структурний тип.</text>
<text x="448.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Уніфікація знаходить єдиний головний тип.</text>
<text x="448.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="start" font-weight="700">З підтипізацією (Java, C#, C++):</text>
<text x="448.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Обмеження: x &lt;: IReader  ТА  x &lt;: ICloser</text>
<text x="448.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Який тип вивести для аргументу x?</text>
<text x="448.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  1) FileStream? Надто вузько для інших потоків.</text>
<text x="448.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  2) Object? Втрачає методи read та close.</text>
<text x="448.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  3) Перетин (IReader &amp; ICloser)? Потребує union/inter.</text>
<text x="448.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Висновок: глобальне виведення стає експоненційним</text>
<text x="448.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">або нерозв'язним без явних сигнатур функцій.</text>
</svg>