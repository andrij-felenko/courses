<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка знак/беззнак: тихе перетворення все псує</text>
<text x="190.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">−1 &lt; sizeof(x) ?</text>
<rect x="40.0" y="84.0" width="300.0" height="40.0" rx="6" fill="#fdecea" stroke="#1a1a1a" stroke-width="1.5"/><text x="190.0" y="108.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">int −1  vs  size_t</tspan></text>
<text x="346.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">різні знаки</text>
<rect x="40.0" y="134.0" width="300.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">−1 стає беззнаковим</tspan></text>
<text x="346.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">правила C</text>
<rect x="40.0" y="184.0" width="300.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">−1 → 0xFFFFFFFF</tspan></text>
<text x="346.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">≈ 4.3 млрд</text>
<rect x="40.0" y="234.0" width="300.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">отже −1 &gt; будь-що</tspan></text>
<text x="346.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">умова бреше</text>
<text x="540.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">for(u = n; u &gt;= 0; u--)</text>
<rect x="400.0" y="84.0" width="300.0" height="66.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="550.0" y="106.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">u — беззнаковий</tspan><tspan x="550.0" dy="14.3">дійшло до 0, u-- дає</tspan><tspan x="550.0" dy="14.3">не −1, а найбільше число</tspan></text>
<rect x="400.0" y="162.0" width="300.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="550.0" y="182.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">u &gt;= 0 — завжди істина</tspan><tspan x="550.0" dy="14.3">(беззнакове ніколи &lt; 0)</tspan><tspan x="550.0" dy="14.3">→ нескінченний цикл</tspan></text>
<line x1="60.0" y1="300.0" x2="660.0" y2="300.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 4"/>
<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">у виразі змішали знакове й беззнакове → знакове мовчки стало беззнаковим</text>
</svg>