<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція обчислень під час компіляції в стандартах C++</text>
<line x1="50.0" y1="75.0" x2="850.0" y2="75.0" stroke="#333333" stroke-width="3.0"/>
<line x1="840.0" y1="75.0" x2="870.0" y2="75.0" stroke="#333333" stroke-width="3.0" marker-end="url(#arrow)"/>
<circle cx="110.0" cy="75.0" r="8.0" fill="#3f51b5" stroke="#ffffff" stroke-width="2.0"/>
<text x="110.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#3f51b5" text-anchor="middle" font-weight="700">C++11</text>
<line x1="110.0" y1="83.0" x2="110.0" y2="110.0" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="35.0" y="115.0" width="150.0" height="310.0" rx="6" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/><text x="110.0" y="236.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Народження constexpr</tspan><tspan x="110.0" dy="12.3"></tspan><tspan x="110.0" dy="12.3">• Тільки один return</tspan><tspan x="110.0" dy="12.3">• Рекурсія замість циклів</tspan><tspan x="110.0" dy="12.3">• ?: замість if</tspan><tspan x="110.0" dy="12.3">• Без локальних змінних</tspan><tspan x="110.0" dy="12.3">• Literal Types</tspan></text>
<circle cx="280.0" cy="75.0" r="8.0" fill="#00796b" stroke="#ffffff" stroke-width="2.0"/>
<text x="280.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#00796b" text-anchor="middle" font-weight="700">C++14</text>
<line x1="280.0" y1="83.0" x2="280.0" y2="110.0" stroke="#00796b" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="205.0" y="115.0" width="150.0" height="310.0" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/><text x="280.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Імперативність</tspan><tspan x="280.0" dy="11.7"></tspan><tspan x="280.0" dy="11.7">• Звичайні цикли (for/while)</tspan><tspan x="280.0" dy="11.7">• Локальні змінні та їх мутація</tspan><tspan x="280.0" dy="11.7">• Розгалуження if / switch</tspan><tspan x="280.0" dy="11.7">• Декілька return</tspan><tspan x="280.0" dy="11.7">• void constexpr методи</tspan></text>
<circle cx="450.0" cy="75.0" r="8.0" fill="#e65100" stroke="#ffffff" stroke-width="2.0"/>
<text x="450.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="700">C++17</text>
<line x1="450.0" y1="83.0" x2="450.0" y2="110.0" stroke="#e65100" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="375.0" y="115.0" width="150.0" height="310.0" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="450.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Статичне розгалуження</tspan><tspan x="450.0" dy="11.7"></tspan><tspan x="450.0" dy="11.7">• if constexpr</tspan><tspan x="450.0" dy="11.7">• constexpr лямбда-функції</tspan><tspan x="450.0" dy="11.7">• constexpr у std::array</tspan><tspan x="450.0" dy="11.7">• Автоматичний інлайн</tspan><tspan x="450.0" dy="11.7">• Послаблення для типів</tspan></text>
<circle cx="620.0" cy="75.0" r="8.0" fill="#c2185b" stroke="#ffffff" stroke-width="2.0"/>
<text x="620.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c2185b" text-anchor="middle" font-weight="700">C++20</text>
<line x1="620.0" y1="83.0" x2="620.0" y2="110.0" stroke="#c2185b" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="545.0" y="115.0" width="150.0" height="310.0" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/><text x="620.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Повноцінна мова</tspan><tspan x="620.0" dy="11.7"></tspan><tspan x="620.0" dy="11.7">• consteval (тільки compile-time)</tspan><tspan x="620.0" dy="11.7">• constinit (статична ініціалізація)</tspan><tspan x="620.0" dy="11.7">• std::vector / string у CTFE</tspan><tspan x="620.0" dy="11.7">• constexpr virtual методи</tspan><tspan x="620.0" dy="11.7">• is_constant_evaluated()</tspan></text>
<circle cx="790.0" cy="75.0" r="8.0" fill="#7b1fa2" stroke="#ffffff" stroke-width="2.0"/>
<text x="790.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7b1fa2" text-anchor="middle" font-weight="700">C++23/26</text>
<line x1="790.0" y1="83.0" x2="790.0" y2="110.0" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="715.0" y="115.0" width="150.0" height="310.0" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/><text x="790.0" y="243.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Зрілість і зручність</tspan><tspan x="790.0" dy="11.7"></tspan><tspan x="790.0" dy="11.7">• if consteval</tspan><tspan x="790.0" dy="11.7">• constexpr для cmath та charconv</tspan><tspan x="790.0" dy="11.7">• Зменшення обмежень пам'яті</tspan><tspan x="790.0" dy="11.7">• Підготовка до статичної рефлексії</tspan></text>
