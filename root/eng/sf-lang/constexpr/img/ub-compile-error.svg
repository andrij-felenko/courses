<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка при помилках: Невизначена поведінка (UB) vs constexpr</text>
<rect x="230.0" y="60.0" width="400.0" height="55.0" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="430.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Помилкова операція з коду</tspan><tspan x="430.0" dy="15.6">(Вихід за межі масиву arr[10], ділення на 0,</tspan><tspan x="430.0" dy="15.6">розіменування nullptr, знакове переповнення)</tspan></text>
<line x1="330.0" y1="115.0" x2="200.0" y2="160.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="210.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Виконання в Runtime</text>
<line x1="530.0" y1="115.0" x2="660.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Виконання в constexpr</text>
<rect x="40.0" y="165.0" width="360.0" height="230.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="220.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Класичний Runtime (UB)</text>
<rect x="60.0" y="215.0" width="320.0" height="160.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">• Непередбачувана поведінка програми</tspan><tspan x="220.0" dy="13.7">• Пошкодження пам'яті (Memory corruption)</tspan><tspan x="220.0" dy="13.7">• Приховані вразливості безпеки</tspan><tspan x="220.0" dy="13.7">• Можливе аварійне падіння (SIGSEGV)</tspan><tspan x="220.0" dy="13.7">• Компілятор оптимізує код, вважаючи UB неможливим</tspan></text>
<rect x="460.0" y="165.0" width="360.0" height="230.0" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
<text x="640.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Compile-Time Evaluator (CTFE)</text>
<rect x="480.0" y="215.0" width="320.0" height="160.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">• Порушення умов константного виразу</tspan><tspan x="640.0" dy="13.7">• Компіляція НЕГАЙНО ЗУПИНЯЄТЬСЯ</tspan><tspan x="640.0" dy="13.7">• Точне повідомлення про помилку від компілятора</tspan><tspan x="640.0" dy="13.7">• Повний стек викликів функцій на момент збою</tspan><tspan x="640.0" dy="13.7">• Нульовий шанс потрапляння UB у релізний бінарник</tspan></text>
</svg>