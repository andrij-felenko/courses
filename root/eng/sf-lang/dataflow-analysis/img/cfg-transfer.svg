<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія базового блоку: вхідні факти, трансформація та вихід</text>
<rect x="103.6" y="58.2" width="112.7" height="43.6" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="160.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Попередник P₁</tspan><tspan x="160.0" dy="15.6">OUT[P₁]</tspan></text>
<rect x="303.6" y="58.2" width="112.7" height="43.6" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="360.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Попередник P₂</tspan><tspan x="360.0" dy="15.6">OUT[P₂]</tspan></text>
<circle cx="260.0" cy="150.0" r="22.0" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.8"/>
<text x="260.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d6608" text-anchor="middle" font-weight="700">⊓ / ∪</text>
<text x="340.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Оператор злиття (Meet)</text>
<line x1="160.0" y1="105.0" x2="245.0" y2="138.0" stroke="#2980b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="360.0" y1="105.0" x2="275.0" y2="138.0" stroke="#2980b9" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="260.0" y1="172.0" x2="260.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="275.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">IN[B] = OUT[P₁] ⊓ OUT[P₂]</text>
<rect x="140.0" y="210.0" width="240.0" height="115.0" rx="8" fill="#f4f7f9" stroke="#2c3e50" stroke-width="1.8"/>
<text x="260.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Базовий блок B</text>
<rect x="155.0" y="238.0" width="210.0" height="51.9" rx="6" fill="#1b2631" stroke="#0a120d" stroke-width="1.4"/><text x="165.0" y="251.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#d1f2eb" text-anchor="start">a = b + c</text><text x="165.0" y="267.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#d1f2eb" text-anchor="start">d = a * 2</text>
<line x1="260.0" y1="325.0" x2="260.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">OUT[B] = f_B(IN[B])</text>
<rect x="500.0" y="70.0" width="310.0" height="280.0" rx="8" fill="#fafafa" stroke="#bdc3c7" stroke-width="1.2"/>
<text x="655.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">Передавальна функція (Transfer)</text>
<text x="516.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="516.0" dy="0.0">Стан програми перетворюється</tspan><tspan x="516.0" dy="14.9">інструкціями блоку B за формулою:</tspan><tspan x="516.0" dy="14.9"></tspan><tspan x="516.0" dy="14.9">f_B(x) = GEN[B] ∪ (x \ KILL[B])</tspan><tspan x="516.0" dy="14.9"></tspan><tspan x="516.0" dy="14.9">• GEN[B] — факти, породжені блоком</tspan><tspan x="516.0" dy="14.9">  (нові визначення або доступні вирази)</tspan><tspan x="516.0" dy="14.9">• KILL[B] — факти, знищені блоком</tspan><tspan x="516.0" dy="14.9">  (старі визначення або перезаписані змінні)</tspan><tspan x="516.0" dy="14.9">• x \ KILL[B] — збережені вхідні факти</tspan></text>
</svg>