<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="780.0" height="340.0" rx="12" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="410.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм розподілу регістрів: звичайний вихід (=r) проти Earlyclobber (=&amp;amp;r)</text>
<rect x="40.0" y="70.0" width="360.0" height="270.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="220.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпека: вихід &quot;=r&quot; без раннього клірингу</text>
<rect x="55.0" y="115.0" width="330.0" height="50.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="220.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">asm (&quot;add %1, %0\n  inc %0&quot;</tspan><tspan x="220.0" dy="14.3">     : &quot;=r&quot; (out) : &quot;r&quot; (in1));</tspan></text>
<rect x="55.0" y="175.0" width="330.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="220.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. Компілятор вважає, що in1 читається ДО запису out</tspan><tspan x="220.0" dy="11.7">2. Алокатор призначає out та in1 ОДИН регістр (наприклад RAX)</tspan><tspan x="220.0" dy="11.7">3. Підстановка: add %rax, %rax (in1 пошкоджено на першому кроці!)</tspan></text>
<rect x="55.0" y="260.0" width="330.0" height="65.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="289.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">НАСЛІДОК: тихий збій обчислень при -O2,</tspan><tspan x="220.0" dy="13.7">коли оптимізатор мінімізує кількість регістрів</tspan></text>
<rect x="420.0" y="70.0" width="360.0" height="270.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="600.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Коректно: Earlyclobber &quot;=&amp;amp;r&quot; гарантує унікальність</text>
<rect x="435.0" y="115.0" width="330.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="600.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">asm (&quot;add %1, %0\n  inc %0&quot;</tspan><tspan x="600.0" dy="14.3">     : &quot;=&amp;r&quot; (out) : &quot;r&quot; (in1));</tspan></text>
<rect x="435.0" y="175.0" width="330.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="600.0" y="198.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">1. Модифікатор &amp; забороняє повторне використання регістрів</tspan><tspan x="600.0" dy="11.7">2. Алокатор зобов'язаний обрати різні регістри:</tspan><tspan x="600.0" dy="11.7">   out -&gt; RDX, in1 -&gt; RAX</tspan><tspan x="600.0" dy="11.7">3. Підстановка: add %rax, %rdx — вхідні дані непошкоджені!</tspan></text>
<rect x="435.0" y="260.0" width="330.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="289.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">РЕЗУЛЬТАТ: коректна робота за будь-якого рівня</tspan><tspan x="600.0" dy="13.7">оптимізації та тиску на регістровий файл</tspan></text>
</svg>