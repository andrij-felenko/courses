<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 531" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="531" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичний адресний простір, LMA (завантаження) та VMA (виконання)</text>
<text x="220.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">FLASH (ROM / NVM) — LMA</text>
<text x="220.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0x08000000..0x08080000 (512 KB, rx)</text>
<rect x="60.0" y="95.0" width="320.0" height="370.0" rx="8" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/>
<rect x="75.0" y="110.0" width="290.0" height="55.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">.isr_vector (Вектори переривань)</tspan><tspan x="220.0" dy="14.3">VMA = 0x08000000 | LMA = 0x08000000</tspan><tspan x="220.0" dy="14.3">Початковий MSP + адреса Reset_Handler</tspan></text>
<rect x="75.0" y="175.0" width="290.0" height="65.0" rx="6" fill="#fdebd0" stroke="#d35400" stroke-width="1.5"/><text x="220.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">.text (Машинні інструкції коду)</tspan><tspan x="220.0" dy="14.3">VMA = 0x08000100 | LMA = 0x08000100</tspan><tspan x="220.0" dy="14.3">Пряме виконання з Flash (XIP — I-Code bus)</tspan></text>
<rect x="75.0" y="250.0" width="290.0" height="55.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="220.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">.rodata (Константи, рядкові літерали)</tspan><tspan x="220.0" dy="14.3">VMA = 0x08005400 | LMA = 0x08005400</tspan><tspan x="220.0" dy="14.3">Незмінні таблиці, const-дані (D-Code bus)</tspan></text>
<rect x="75.0" y="315.0" width="290.0" height="80.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Початкові значення .data (_sidata)</tspan><tspan x="220.0" dy="13.0">LMA = 0x08006200  (зберігається у Flash!)</tspan><tspan x="220.0" dy="13.0">Копіюється стартовим кодом у RAM при Reset</tspan><tspan x="220.0" dy="13.0">Flash зберігає стан між вимкненнями живлення</tspan></text>
<rect x="75.0" y="405.0" width="290.0" height="48.0" rx="6" fill="#eaeded" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Вільний простір Flash (Unused ROM)</tspan><tspan x="220.0" dy="13.0">0x08006800 .. 0x0807FFFF (~486 KB вільних)</tspan></text>
<text x="720.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">SRAM (RAM) — VMA</text>
<text x="720.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0x20000000..0x20020000 (128 KB, xrw)</text>
<rect x="560.0" y="95.0" width="320.0" height="370.0" rx="8" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/>
<rect x="575.0" y="110.0" width="290.0" height="65.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="124.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">.data (Ініціалізовані змінні)</tspan><tspan x="720.0" dy="14.3">VMA = 0x20000000..0x20000600</tspan><tspan x="720.0" dy="14.3">Змінні з ненульовим початком: int x = 42;</tspan><tspan x="720.0" dy="14.3">Сюди копіюються дані з _sidata при старті</tspan></text>
<rect x="575.0" y="185.0" width="290.0" height="60.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="197.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">.bss (Нульові змінні та буфери)</tspan><tspan x="720.0" dy="14.3">VMA = 0x20000600..0x20002100</tspan><tspan x="720.0" dy="14.3">int y = 0; static char buf[4096];</tspan><tspan x="720.0" dy="14.3">Стартовий код обнуляє ділянку (0x00)</tspan></text>
<rect x="575.0" y="255.0" width="290.0" height="55.0" rx="6" fill="#e8daef" stroke="#8e44ad" stroke-width="1.5"/><text x="720.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">._user_heap_stack (Купа та стек)</tspan><tspan x="720.0" dy="14.3">Купа росте вгору (-&gt; 0x20002100+)</tspan><tspan x="720.0" dy="14.3">Стек росте вниз (&lt;- _estack = 0x20020000)</tspan></text>
<rect x="575.0" y="320.0" width="290.0" height="55.0" rx="6" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.5"/><text x="720.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">CCMRAM / Backup SRAM (Спеціальні банки)</tspan><tspan x="720.0" dy="13.0">0x10000000 (64 KB швидкої RAM для FPU/DSP)</tspan><tspan x="720.0" dy="13.0">0x40024000 (4 KB пам'яті батарейного живлення)</tspan></text>
<rect x="575.0" y="385.0" width="290.0" height="68.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="409.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Верхівка стека (_estack = 0x20020000)</tspan><tspan x="720.0" dy="13.0">MSP апаратно завантажується з адреси 0x08000000</tspan><tspan x="720.0" dy="13.0">при виникненні апаратного сигналу RESET</tspan></text>
<line x1="365.0" y1="355.0" x2="410.0" y2="355.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="410.0" y1="355.0" x2="410.0" y2="210.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="410.0" y1="210.0" x2="480.0" y2="210.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="480.0" y1="210.0" x2="480.0" y2="142.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="480.0" y1="142.0" x2="560.0" y2="142.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="395.0" y="235.0" width="150.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Стартове копіювання:</tspan><tspan x="470.0" dy="13.0">Flash LMA -&gt; SRAM VMA</tspan></text>
<rect x="60.0" y="475.0" width="820.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="489.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">VMA (Virtual/Execution Address) — де код і змінні знаходяться під час виконання.</tspan><tspan x="470.0" dy="14.3">LMA (Load Memory Address) — де секція фізично зберігається у прошивці до запуску.</tspan></text>
</svg>