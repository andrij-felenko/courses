<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія скрипта компонувальника GNU LD (.ld)</text>
<rect x="40.0" y="60.0" width="260.0" height="75.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">ENTRY(Reset_Handler)</tspan><tspan x="170.0" dy="14.3">Визначає точку входу для налагоджувача</tspan><tspan x="170.0" dy="14.3">(gdb, OpenOCD, Segger J-Link)</tspan></text>
<rect x="340.0" y="60.0" width="560.0" height="75.0" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="620.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">MEMORY { FLASH (rx) : ORIGIN = 0x08000000, LENGTH = 512K</tspan><tspan x="620.0" dy="14.3">         RAM (xrw)  : ORIGIN = 0x20000000, LENGTH = 128K }</tspan><tspan x="620.0" dy="14.3">Оголошує фізичні банки пам'яті, їхній розмір та права доступу (r/w/x)</tspan></text>
<text x="470.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">SECTIONS { ... } — Розподіл вхідних секцій об'єктних файлів (*.o) по вихідних сегментах</text>
<rect x="40.0" y="175.0" width="860.0" height="240.0" rx="8" fill="#fbfcfc" stroke="#333333" stroke-width="1.5"/>
<rect x="60.0" y="195.0" width="255.0" height="205.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="187.5" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="187.5" dy="0.0">.isr_vector : {</tspan><tspan x="187.5" dy="14.3">  KEEP(*(.isr_vector))</tspan><tspan x="187.5" dy="14.3">} &gt;FLASH</tspan><tspan x="187.5" dy="14.3"></tspan><tspan x="187.5" dy="14.3">.text : {</tspan><tspan x="187.5" dy="14.3">  . = ALIGN(4);</tspan><tspan x="187.5" dy="14.3">  *(.text*)</tspan><tspan x="187.5" dy="14.3">  *(.rodata*)</tspan><tspan x="187.5" dy="14.3">  . = ALIGN(4);</tspan><tspan x="187.5" dy="14.3">} &gt;FLASH</tspan></text>
<rect x="340.0" y="195.0" width="260.0" height="205.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">.data : {</tspan><tspan x="470.0" dy="14.3">  . = ALIGN(4);</tspan><tspan x="470.0" dy="14.3">  _sdata = .;</tspan><tspan x="470.0" dy="14.3">  *(.data*)</tspan><tspan x="470.0" dy="14.3">  . = ALIGN(4);</tspan><tspan x="470.0" dy="14.3">  _edata = .;</tspan><tspan x="470.0" dy="14.3">} &gt;RAM AT&gt;FLASH</tspan><tspan x="470.0" dy="14.3"></tspan><tspan x="470.0" dy="14.3">_sidata = LOADADDR(.data);</tspan></text>
<rect x="625.0" y="195.0" width="255.0" height="205.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="752.5" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="752.5" dy="0.0">.bss : {</tspan><tspan x="752.5" dy="14.3">  . = ALIGN(4);</tspan><tspan x="752.5" dy="14.3">  _sbss = .;</tspan><tspan x="752.5" dy="14.3">  *(.bss*)</tspan><tspan x="752.5" dy="14.3">  *(COMMON)</tspan><tspan x="752.5" dy="14.3">  . = ALIGN(4);</tspan><tspan x="752.5" dy="14.3">  _ebss = .;</tspan><tspan x="752.5" dy="14.3">} &gt;RAM</tspan><tspan x="752.5" dy="14.3"></tspan><tspan x="752.5" dy="14.3">_estack = ORIGIN(RAM) + LENGTH(RAM);</tspan></text>
<rect x="40.0" y="430.0" width="860.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="454.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Ключові оператори:  . (Location Counter) — поточна адреса  |  ALIGN(n) — вирівнювання за межею n байтів</tspan><tspan x="470.0" dy="14.3">KEEP() — заборона видалення секції оптимізатором --gc-sections  |  PROVIDE() — умовний символ</tspan></text>
</svg>