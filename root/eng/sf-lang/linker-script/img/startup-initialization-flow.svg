<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне скидання та послідовність виконання Startup-коду</text>
<rect x="30.0" y="65.0" width="250.0" height="110.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="155.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">1. АПАРАТНИЙ RESET</tspan><tspan x="155.0" dy="13.0">Апаратний контролер Cortex-M:</tspan><tspan x="155.0" dy="13.0">• Зчитує 0x08000000 -&gt; MSP (_estack)</tspan><tspan x="155.0" dy="13.0">• Зчитує 0x08000004 -&gt; PC (Reset_Handler)</tspan><tspan x="155.0" dy="13.0">• Встановлює режим Thumb (T-біт = 1)</tspan></text>
<line x1="280.0" y1="120.0" x2="340.0" y2="120.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="340.0" y="65.0" width="260.0" height="110.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="88.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. КОПІЮВАННЯ .data</tspan><tspan x="470.0" dy="14.3">Цикл копіювання байтів/слів:</tspan><tspan x="470.0" dy="14.3">• Джерело: Flash LMA (_sidata)</tspan><tspan x="470.0" dy="14.3">• Приймач: RAM VMA (_sdata)</tspan><tspan x="470.0" dy="14.3">• Межа: _edata</tspan><tspan x="470.0" dy="14.3">• Відновлює ненульові змінні</tspan></text>
<line x1="600.0" y1="120.0" x2="660.0" y2="120.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="660.0" y="65.0" width="250.0" height="110.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="1.5"/><text x="785.0" y="88.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">3. ОБНУЛЕННЯ .bss</tspan><tspan x="785.0" dy="14.3">Цикл запису нулів (0x00):</tspan><tspan x="785.0" dy="14.3">• Початок: _sbss (RAM)</tspan><tspan x="785.0" dy="14.3">• Кінець: _ebss (RAM)</tspan><tspan x="785.0" dy="14.3">• Очищує пам'ять від випадкового</tspan><tspan x="785.0" dy="14.3">  сміття після ввімкнення живлення</tspan></text>
<line x1="785.0" y1="175.0" x2="785.0" y2="230.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="500.0" y="230.0" width="410.0" height="100.0" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="705.0" y="265.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">4. C++ КОНСТРУКТОРИ ТА СИСТЕМНІ ГОДИННИКИ</tspan><tspan x="705.0" dy="11.7">• Виклик SystemInit() (налаштування тактування PLL, FPU, Flash Latency)</tspan><tspan x="705.0" dy="11.7">• Виклик __libc_init_array() (обхід таблиці покажчиків .init_array)</tspan><tspan x="705.0" dy="11.7">• Виконання конструкторів глобальних і статичних об'єктів C++</tspan></text>
<line x1="500.0" y1="280.0" x2="440.0" y2="280.0" stroke="#d35400" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="230.0" width="410.0" height="100.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="235.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">5. ВИКЛИК ГОЛОВНОЇ ПРОГРАМИ main()</tspan><tspan x="235.0" dy="13.0">• main() починає виконання з гарантією підготовленої пам'яті</tspan><tspan x="235.0" dy="13.0">• Усі глобальні змінні містять валідні значення</tspan><tspan x="235.0" dy="13.0">• Стек сконфігурований, FPU увімкнено, периферія готова до роботи</tspan></text>
<rect x="30.0" y="355.0" width="880.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="400.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Символи компонувальника є точками синхронізації між .ld та кодом стартапу:</tspan><tspan x="470.0" dy="14.3">• _estack — адреса верхівки стека в оперативній пам'яті (записується у нульовий слот таблиці векторів);</tspan><tspan x="470.0" dy="14.3">• _sidata — початкова адреса джерела даних .data у Flash (повертається функцією LOADADDR(.data));</tspan><tspan x="470.0" dy="14.3">• _sdata / _edata — діапазон адрес призначення секції .data в RAM (VMA);</tspan><tspan x="470.0" dy="14.3">• _sbss / _ebss — діапазон адрес секції .bss в RAM, які обов'язково заповнюються нулями до виклику main().</tspan></text>
</svg>