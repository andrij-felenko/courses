<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сучасний виробничий стек оптимізації: ThinLTO + AutoFDO + BOLT</text>
<rect x="100.0" y="75.0" width="660.0" height="62.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.6"/>
<text x="430.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Базова компіляція + ThinLTO</text>
<text x="430.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Міжмодульний аналіз графу викликів, глобальне поширення констант та імпорт функцій між файлами</text>
<line x1="430.0" y1="137.0" x2="430.0" y2="159.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="100.0" y="159.0" width="660.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="430.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Profile-Guided Optimization (PGO / AutoFDO)</text>
<text x="430.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Точні ваги переходів, Pettis-Hansen block layout, hot/cold splitting та спекулятивна девіртуалізація</text>
<line x1="430.0" y1="221.0" x2="430.0" y2="243.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="100.0" y="243.0" width="660.0" height="62.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.6"/>
<text x="430.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Профілювання у продакшені (Linux perf / LBR)</text>
<text x="430.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Апаратні лічильники PMU зчитують Last Branch Record без сповільнення реального трафіку (&lt;1-2% накладних витрат)</text>
<line x1="430.0" y1="305.0" x2="430.0" y2="327.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="100.0" y="327.0" width="660.0" height="62.0" rx="6" fill="#ebfbee" stroke="#27ae60" stroke-width="1.6"/>
<text x="430.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Пост-лінкерна оптимізація бінарника (BOLT)</text>
<text x="430.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Перевпорядкування машинних інструкцій на межах кеш-ліній (64B), розгортання переходів, усунення i-cache misses</text>
<rect x="780.0" y="75.0" width="55.0" height="314.0" rx="4" fill="#f1f3f5" stroke="#333333" stroke-width="1.2"/>
<text x="807.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">+5-10%</text>
<text x="807.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">+10-15%</text>
<text x="807.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">Sample</text>
<text x="807.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">+7-15%</text>
<text x="807.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">BOLT</text>
</svg>