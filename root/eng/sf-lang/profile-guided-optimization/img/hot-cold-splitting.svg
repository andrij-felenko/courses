<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розділення функцій на гарячі та холодні частини (Hot/Cold Function Splitting)</text>
<text x="210.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">До розділення: монолітна функція</text>
<rect x="60.0" y="70.0" width="300.0" height="230.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="210.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Функція process_request()</text>
<rect x="80.0" y="115.0" width="260.0" height="50.0" rx="4" fill="#ebfbee" stroke="#27ae60" stroke-width="1.5"/>
<text x="210.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Гаряче ядро (парсинг + розрахунок, 99%)</text>
<rect x="80.0" y="175.0" width="260.0" height="110.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/>
<text x="210.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">Холодний код (1% викликів):</text>
<text x="210.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Детальне логування та трасування помилок</text>
<text x="210.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Форматування стектрейсу і дамп пам'яті</text>
<text x="210.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Складне відновлення після збоїв мережі</text>
<rect x="50.0" y="324.1" width="320.0" height="41.9" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.3"/><text x="210.0" y="342.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Проблема: 70% обсягу функції — холодний код.</tspan><tspan x="210.0" dy="12.3">Він витісняє корисні інструкції з L1i та iTLB.</tspan></text>
<line x1="380.0" y1="185.0" x2="450.0" y2="185.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="415.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">PGO Splitting</text>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Після Hot/Cold Splitting (секції ELF)</text>
<rect x="480.0" y="70.0" width="340.0" height="130.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.8"/>
<text x="650.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Секція .text.hot (компактний робочий набір)</text>
<rect x="500.0" y="110.0" width="300.0" height="70.0" rx="4" fill="#ebfbee" stroke="#27ae60" stroke-width="1.5"/>
<text x="650.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">process_request.hot:</text>
<text x="650.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Парсинг та швидкий шлях (fast-path)</text>
<text x="650.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">jnz process_request.cold  ; рідкісний стрибок</text>
<rect x="480.0" y="220.0" width="340.0" height="95.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.3"/>
<text x="650.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Секція .text.cold (винесено на край пам'яті)</text>
<rect x="500.0" y="255.0" width="300.0" height="48.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/>
<text x="650.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">process_request.cold:</text>
<text x="650.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Логування, дамп, відновлення</text>
<line x1="750.0" y1="185.0" x2="750.0" y2="220.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="480.0" y="334.1" width="340.0" height="41.9" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.3"/><text x="650.0" y="352.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Результат: гарячий код спаковано в мінімум кеш-ліній.</tspan><tspan x="650.0" dy="12.3">Холодний код завантажується лише при реальних збоях.</tspan></text>
</svg>