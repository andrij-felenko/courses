<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди подіваються виправлення</text>
<rect x="470.0" y="78.0" width="470.0" height="52.0" rx="6" fill="#f2f2f2" stroke="#6b7280" stroke-width="2.0"/>
<text x="450.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">усі кроки ділення</text>
<text x="956.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="start" font-weight="700">100 %</text>
<line x1="483.0" y1="132.0" x2="483.0" y2="152.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="154.0" width="394.8" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="450.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">q̂ &gt; q — потрібне бодай одне виправлення</text>
<text x="880.8" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">≈ 33 %</text>
<line x1="483.0" y1="208.0" x2="483.0" y2="228.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="230.0" width="149.5" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="450.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">q̂ = q + 2 — потрібні аж два</text>
<text x="635.5" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">≈ 0.9 %</text>
<line x1="483.0" y1="284.0" x2="483.0" y2="304.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="306.0" width="109.5" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="450.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">після перевірки за vₙ₋₂ лишилося q̂ = q + 1</text>
<text x="595.5" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="start" font-weight="700">≈ 0.5 %</text>
<rect x="200.8" y="364.8" width="618.5" height="70.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="510.0" y="386.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Виміряно на 600 000 випадкових кроків при B = 64; ширина смуг логарифмічна.</tspan><tspan x="510.0" dy="18.2">Остання смуга спадає як ≈ 0.34/B: при B = 2⁶⁴ це ≈ 2·10⁻²⁰ —</tspan><tspan x="510.0" dy="18.2">гілка «додати дільник назад» практично ніколи не виконується.</tspan></text>
</svg>