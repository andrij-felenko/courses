<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">«i+1 &gt; i завжди істина» — бо переповнення оголошено неможливим</text>
<rect x="30.0" y="66.0" width="350.0" height="210.0" rx="10" fill="#0f1115" stroke="#b8860b" stroke-width="2.0"/>
<text x="205.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffd479" text-anchor="middle" font-weight="700">код</text>
<text x="52.0" y="128.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.0" fill="#e8e8e8" text-anchor="start" font-weight="700">int i = 0;</text>
<text x="52.0" y="158.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.0" fill="#e8e8e8" text-anchor="start" font-weight="700">while (i + 1 &gt; i)</text>
<text x="52.0" y="188.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.0" fill="#e8e8e8" text-anchor="start" font-weight="700">    i++;</text>
<text x="205.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">виглядає: «поки не переповниться»</text>
<rect x="420.0" y="66.0" width="330.0" height="210.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="585.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">як міркує оптимізатор</text>
<text x="585.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">знакове переповнення = UB</text>
<text x="585.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">отже його «не буває»</text>
<text x="585.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">→ i+1 &gt; i ЗАВЖДИ істина</text>
<text x="585.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">→ умова стала true</text>
<text x="585.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">→ вічний цикл</text>
</svg>