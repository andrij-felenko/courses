<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розширення типу: розділення валідного байта 0xFF та EOF (-1)</text>
<text x="380.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому getchar() повертає 32-бітний int, а не 8-бітний char</text>
<text x="160.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Байт 0xFF (255) з файлу:</text>
<rect x="340.0" y="64.0" width="100.0" height="30.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="390.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">11111111</text>
<text x="460.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">= 255 у беззнаковому байті</text>
<line x1="390.0" y1="98.0" x2="390.0" y2="130.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="405.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">розширення до 32 бітів (int)</text>
<rect x="60.0" y="145.0" width="640.0" height="60.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="80.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Валідний байт 255 як int:</text>
<text x="80.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">0x000000FF  (старші 24 біти = 0, молодші 8 бітів = 11111111)</text>
<text x="580.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">= +255</text>
<rect x="60.0" y="220.0" width="640.0" height="60.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.5"/>
<text x="80.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Вартове значення EOF (-1) як int:</text>
<text x="80.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">0xFFFFFFFF  (усі 32 біти встановлені в 1 у доповняльному коді)</text>
<text x="580.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">= −1 (EOF)</text>
<text x="380.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">У 32-бітному int значення 0x000000FF (255) та 0xFFFFFFFF (-1) ніколи не перетинаються!</text>
</svg>