<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 384" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="384" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий рядок: -O0 тримає виклик, -O2 лишає одну інструкцію</text>
<rect x="250.0" y="44.0" width="280.0" height="44.0" rx="8" fill="#0f1115" stroke="#2457d6" stroke-width="1.8"/>
<text x="390.0" y="64.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#ffd479" text-anchor="middle" font-weight="700">Pin&lt;5&gt;::high();</text>
<text x="390.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#bbbbbb" text-anchor="middle">той самий рядок C++</text>
<line x1="320.0" y1="90.0" x2="200.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="460.0" y1="90.0" x2="585.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="122.0" width="340.0" height="232.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="200.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">-O0  (debug)</text>
<text x="46.0" y="172.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7a1f16" text-anchor="start">push  {r7, lr}      ; пролог кадру</text>
<text x="46.0" y="191.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7a1f16" text-anchor="start">add   r7, sp, #0</text>
<text x="46.0" y="210.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7a1f16" text-anchor="start">bl    Pin&lt;5&gt;::high  ; РЕАЛЬНИЙ виклик</text>
<text x="46.0" y="229.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7a1f16" text-anchor="start"> ...                ; тіло high():</text>
<text x="46.0" y="248.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7a1f16" text-anchor="start"> ldr  r3, [pc,#..]  ; адреса GPIO</text>
<text x="46.0" y="267.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7a1f16" text-anchor="start"> movs r2, #32       ; 1&lt;&lt;5 = 0x20</text>
<text x="46.0" y="286.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7a1f16" text-anchor="start"> str  r2, [r3,#..]  ; запис</text>
<text x="46.0" y="305.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7a1f16" text-anchor="start"> bx   lr            ; повернення</text>
<text x="46.0" y="324.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#7a1f16" text-anchor="start">pop   {r7, pc}      ; епілог</text>
<text x="200.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">виклик + кадр + тіло — багато тактів</text>
<rect x="410.0" y="122.0" width="340.0" height="232.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="580.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">-O2  (release)</text>
<text x="426.0" y="210.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#155f38" text-anchor="start">ldr  r3, [pc, #..]  ; адреса GPIO</text>
<text x="426.0" y="232.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#155f38" text-anchor="start">movs r2, #32        ; 0x20 (згорнуто)</text>
<text x="426.0" y="254.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#155f38" text-anchor="start" font-weight="700">str  r2, [r3, #..]  ; єдиний запис</text>
<rect x="430.0" y="286.0" width="300.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="580.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">виклик, кадр, обгортка — зникли</text>
<text x="580.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">лишилась гола корисна інструкція</text>
</svg>