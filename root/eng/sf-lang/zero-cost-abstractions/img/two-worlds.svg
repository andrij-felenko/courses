<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="404" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві школи 1980-х і спроба їх поєднати</text>
<rect x="40.0" y="60.0" width="320.0" height="152.0" rx="10" fill="#f3faf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="200.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">світ Simula (1967)</text>
<text x="200.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">абстракція</text>
<text x="200.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">класи, об'єкти, успадкування</text>
<text x="200.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">віртуальні методи</text>
<text x="200.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">+ виражальність</text>
<text x="200.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">− прихована ціна виконання</text>
<rect x="400.0" y="60.0" width="320.0" height="152.0" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="560.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">світ C (1972)</text>
<text x="560.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">метал</text>
<text x="560.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">точний контроль над машиною</text>
<text x="560.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">рядок → кілька інструкцій</text>
<text x="560.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">+ передбачувана швидкість</text>
<text x="560.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">− жодних розкошів</text>
<line x1="200.0" y1="216.0" x2="355.0" y2="270.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="216.0" x2="405.0" y2="270.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="228.0" y="274.0" width="304.0" height="58.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="380.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">C with Classes (1979) → C++</text>
<text x="380.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">виражальність зліва за ціною справа</text>
<line x1="380.0" y1="334.0" x2="380.0" y2="358.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="380.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">правило нульових витрат — щоб не сповзти до повільного</text>
</svg>