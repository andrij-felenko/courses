<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння класичних заголовків та C++20 Modules</text>
<text x="190.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Класичні заголовки (#include)</text>
<rect x="40.0" y="85.0" width="300.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">#include &lt;vector&gt;</tspan><tspan x="190.0" dy="13.0">#define BUFFER_SIZE 1024</tspan><tspan x="190.0" dy="13.0"></tspan><tspan x="190.0" dy="13.0">Текстове копіювання в кожен TU.</tspan><tspan x="190.0" dy="13.0">Повторний парсинг N разів!</tspan></text>
<rect x="40.0" y="170.0" width="300.0" height="85.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Недоліки:</tspan><tspan x="190.0" dy="13.0">• Витік макросів у весь проєкт</tspan><tspan x="190.0" dy="13.0">• Тривалий час компіляції</tspan><tspan x="190.0" dy="13.0">• ODR-ризики через конфлікти порядку включення</tspan></text>
<line x1="380.0" y1="50.0" x2="380.0" y2="280.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="570.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">C++20 Modules (import / export)</text>
<rect x="420.0" y="85.0" width="300.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="105.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">export module math;</tspan><tspan x="570.0" dy="11.7">export int square(int x) { return x * x; }</tspan><tspan x="570.0" dy="11.7"></tspan><tspan x="570.0" dy="11.7">Компілюється 1 раз у бінарний інтерфейс (BMI: .pcm / .ifc)</tspan></text>
<rect x="420.0" y="170.0" width="300.0" height="85.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Переваги:</tspan><tspan x="570.0" dy="13.0">• Макроси НЕ експортуються назовні</tspan><tspan x="570.0" dy="13.0">• Миттєвий імпорт розібраного AST</tspan><tspan x="570.0" dy="13.0">• Модульне зв'язування (module linkage)</tspan><tspan x="570.0" dy="13.0">• Повна ізоляція від порядку імпорту</tspan></text>
<text x="380.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">C++20 модулі замінюють текстове вставляння токенів семантичним імпортом скомпільованого інтерфейсу</text>
</svg>