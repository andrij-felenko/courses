(Crash / UB)</text>
<line x1="40.0" y1="165.0" x2="720.0" y2="165.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="80.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Розв'язання: Патерн «Construct-On-First-Use» (Meyers' Singleton)</text>
<rect x="40.0" y="205.0" width="420.0" height="100.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Config&amp; getConfig() {</tspan><tspan x="250.0" dy="13.0">  // Ініціалізується гарантовано при першому вході</tspan><tspan x="250.0" dy="13.0">  // у функцію (потокобезпечно в C++11)</tspan><tspan x="250.0" dy="13.0">  static Config instance;</tspan><tspan x="250.0" dy="13.0">  return instance;</tspan><tspan x="250.0" dy="13.0">}</tspan></text>
