<rect x="30.0" y="65.0" width="200.0" height="90.0" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="130.0" y="76.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Вихідний файл C++</tspan><tspan x="130.0" dy="12.3"></tspan><tspan x="130.0" dy="12.3">class Device : public QObject {</tspan><tspan x="130.0" dy="12.3">    Q_OBJECT</tspan><tspan x="130.0" dy="12.3">    Q_PROPERTY(...)</tspan><tspan x="130.0" dy="12.3">signals: void ready();</tspan><tspan x="130.0" dy="12.3">};</tspan></text>
