<rect x="560.0" y="65.0" width="310.0" height="90.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="715.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Згенерований moc_device.cpp</tspan><tspan x="715.0" dy="13.7"></tspan><tspan x="715.0" dy="13.7">• static const uint qt_meta_data[]</tspan><tspan x="715.0" dy="13.7">• static const char qt_meta_stringdata[]</tspan><tspan x="715.0" dy="13.7">• static void qt_static_metacall(...)</tspan><tspan x="715.0" dy="13.7">• Реалізація сигналів (emit ready)</tspan></text>
