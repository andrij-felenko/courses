<rect x="280.0" y="65.0" width="230.0" height="90.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="395.0" y="78.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">Qt MOC (Прекомпілятор)</tspan><tspan x="395.0" dy="14.3"></tspan><tspan x="395.0" dy="14.3">• Розбирає синтаксис C++</tspan><tspan x="395.0" dy="14.3">• Шукає макрос Q_OBJECT</tspan><tspan x="395.0" dy="14.3">• Витягує сигнали, слоти,</tspan><tspan x="395.0" dy="14.3">  властивості та типи</tspan></text>
