<rect x="240.0" y="310.0" width="420.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="450.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Кінцевий бінарний образ (ELF / PE)</tspan><tspan x="450.0" dy="15.0"></tspan><tspan x="450.0" dy="15.0">• Машинний код методів у секції .text</tspan><tspan x="450.0" dy="15.0">• Незмінні таблиці QMetaObject у секції .rodata</tspan><tspan x="450.0" dy="15.0">• Рефлексивний доступ: пошук методів за рядковим ім'ям,</tspan><tspan x="450.0" dy="15.0">  з'єднання сигналів зі слотами через числові індекси</tspan></text>
