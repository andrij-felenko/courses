<rect x="690.0" y="230.0" width="200.0" height="125.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="790.0" y="255.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Ін'єкція в AST</tspan><tspan x="790.0" dy="13.7"></tspan><tspan x="790.0" dy="13.7">auto to_json(const auto&amp; s) {</tspan><tspan x="790.0" dy="13.7">    // Цикл розгортається</tspan><tspan x="790.0" dy="13.7">    json_write(s.[:m:]);</tspan><tspan x="790.0" dy="13.7">}</tspan><tspan x="790.0" dy="13.7">(прямий доступ до полів)</tspan></text>
