<rect x="30.0" y="70.0" width="230.0" height="120.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="145.0" y="90.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Вихідний тип C++</tspan><tspan x="145.0" dy="14.3"></tspan><tspan x="145.0" dy="14.3">struct SensorData {</tspan><tspan x="145.0" dy="14.3">    int id;</tspan><tspan x="145.0" dy="14.3">    double value;</tspan><tspan x="145.0" dy="14.3">    bool valid;</tspan><tspan x="145.0" dy="14.3">};</tspan></text>
