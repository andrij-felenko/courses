<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація механізмів рефлексії та метапрограмування</text>
<rect x="40.0" y="55.0" width="410.0" height="440.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="470.0" y="55.0" width="410.0" height="440.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="245.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">Час компіляції (Compile-Time)</text>
<text x="675.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#14532d" text-anchor="middle" font-weight="700">Час виконання (Runtime)</text>
<rect x="55.0" y="105.0" width="380.0" height="115.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="245.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Інтроспекція часу компіляції</tspan><tspan x="245.0" dy="15.0"></tspan><tspan x="245.0" dy="15.0">• C++ type traits (std::is_integral, void_t)</tspan><tspan x="245.0" dy="15.0">• C++20 Concepts (requires clauses)</tspan><tspan x="245.0" dy="15.0">• C++26 static reflection (^^, std::meta::info)</tspan><tspan x="245.0" dy="15.0">• Rust static type queries, TypeScript types</tspan></text>
<rect x="55.0" y="235.0" width="380.0" height="125.0" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="245.0" y="264.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Синтаксичні макроси та генерація коду</tspan><tspan x="245.0" dy="15.0"></tspan><tspan x="245.0" dy="15.0">• Lisp макроси (defmacro, homoiconicity)</tspan><tspan x="245.0" dy="15.0">• Rust macro_rules! та proc_macro_derive</tspan><tspan x="245.0" dy="15.0">• C++ Template Metaprogramming (SFINAE, if constexpr)</tspan><tspan x="245.0" dy="15.0">• Генератори збірки (Qt MOC, Protobuf, ANTLR)</tspan></text>
<rect x="55.0" y="375.0" width="380.0" height="105.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="245.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Властивості підходу:</tspan><tspan x="245.0" dy="14.3">✔ 100% перевірка типів до запуску</tspan><tspan x="245.0" dy="14.3">✔ Повний інлайнінг та нульовий рантайм-оверхед</tspan><tspan x="245.0" dy="14.3">✖ Довший час збірки, роздування двійкового коду</tspan></text>
<rect x="485.0" y="105.0" width="380.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="675.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Динамічна інтроспекція (Runtime Introspection)</tspan><tspan x="675.0" dy="15.0"></tspan><tspan x="675.0" dy="15.0">• C++ RTTI (typeid, dynamic_cast, vtable)</tspan><tspan x="675.0" dy="15.0">• Java Reflection API (Class, Method, Field)</tspan><tspan x="675.0" dy="15.0">• C# System.Reflection (Type, PropertyInfo)</tspan><tspan x="675.0" dy="15.0">• Python hasattr(), getattr(), isinstance()</tspan></text>
<rect x="485.0" y="235.0" width="380.0" height="125.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="675.0" y="264.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Інтероспекція та динамічна поведінка</tspan><tspan x="675.0" dy="15.0"></tspan><tspan x="675.0" dy="15.0">• Динамічний виклик методів (Method.invoke)</tspan><tspan x="675.0" dy="15.0">• Dynamic Proxy (java.lang.reflect.Proxy)</tspan><tspan x="675.0" dy="15.0">• Емісія байткоду (C# Reflection.Emit, Java cglib)</tspan><tspan x="675.0" dy="15.0">• Smalltalk Metaobject Protocol, Python Monkey Patching</tspan></text>
<rect x="485.0" y="375.0" width="380.0" height="105.0" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="675.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Властивості підходу:</tspan><tspan x="675.0" dy="14.3">✔ Динамічна конфігурація плагінів і JSON/ORM</tspan><tspan x="675.0" dy="14.3">✖ Накладні витрати CPU (boxing, no inlining)</tspan><tspan x="675.0" dy="14.3">✖ Ризик помилок у рантаймі (NoSuchMethodException)</tspan></text>
</svg>