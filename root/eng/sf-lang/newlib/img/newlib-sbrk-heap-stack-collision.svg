<rect x="10.0" y="10.0" width="820.0" height="510.0" rx="8" fill="#fafbfc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта оперативної пам'яті SRAM: механізм росту купи та детекція колізії зі стеком</text>
