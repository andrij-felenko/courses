<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оператор присвоєння: +1 до −1 рятує самоприсвоєння</text>
<text x="470.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">p = q,  коли p і q — той самий об'єкт (strong = 1)</text>
<text x="60.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">захопити, потім звільнити:</text>
<rect x="54.0" y="127.0" width="132.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="120.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">strong = 1</tspan></text>
<line x1="186.0" y1="152.0" x2="300.0" y2="152.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="243.0" cy="126.0" r="12.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="243.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<rect x="300.0" y="127.0" width="132.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="366.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">strong = 2</tspan></text>
<line x1="432.0" y1="152.0" x2="546.0" y2="152.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="489.0" cy="126.0" r="12.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="489.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<rect x="546.0" y="127.0" width="132.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="612.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="612.0" dy="0.0">strong = 1</tspan></text>
<line x1="678.0" y1="152.0" x2="772.0" y2="152.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="772.0" y="127.0" width="132.0" height="50.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="838.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="838.0" dy="0.0">об'єкт живий</tspan></text>
<text x="60.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">звільнити спершу:</text>
<rect x="54.0" y="267.0" width="132.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="120.0" y="296.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">strong = 1</tspan></text>
<line x1="186.0" y1="292.0" x2="300.0" y2="292.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="243.0" cy="266.0" r="12.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="243.0" y="270.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<rect x="300.0" y="267.0" width="132.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="366.0" y="296.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">strong = 0</tspan></text>
<text x="366.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">звільнено</text>
<line x1="432.0" y1="292.0" x2="546.0" y2="292.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="489.0" cy="266.0" r="12.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="489.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<rect x="546.0" y="267.0" width="132.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="612.0" y="296.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="612.0" dy="0.0">+1 на трупі</tspan></text>
<line x1="678.0" y1="292.0" x2="772.0" y2="292.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="772.0" y="267.0" width="132.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="838.0" y="296.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="838.0" dy="0.0">крах</tspan></text>
</svg>