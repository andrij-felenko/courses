<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двотактна модель обчислення Lisp: взаємодія eval та apply</text>
<rect x="30.0" y="140.0" width="130.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="95.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Вхідний вираз</text>
<text x="95.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#333333" text-anchor="middle" font-weight="700">(f x y)</text>
<line x1="160.0" y1="175.0" x2="225.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="192.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">expr, env</text>
<rect x="230.0" y="90.0" width="200.0" height="180.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="330.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">eval(expr, env)</text>
<line x1="245.0" y1="135.0" x2="415.0" y2="135.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="330.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">1. Атом → повернути значення</tspan><tspan x="330.0" dy="14.3">2. Символ → шукати в env</tspan><tspan x="330.0" dy="14.3">3. Спецформа (if, lambda, quote)</tspan><tspan x="330.0" dy="14.3">   → обробити безпосередньо</tspan><tspan x="330.0" dy="14.3">4. Виклик функції:</tspan><tspan x="330.0" dy="14.3">   eval(f), eval(x), eval(y)...</tspan></text>
<line x1="430.0" y1="140.0" x2="505.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="468.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">func, args</text>
<rect x="510.0" y="90.0" width="220.0" height="180.0" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.0"/>
<text x="620.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">apply(func, args)</text>
<line x1="525.0" y1="135.0" x2="715.0" y2="135.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="620.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">1. Примітив (C/апаратний):</tspan><tspan x="620.0" dy="14.3">   обчислити результат напряму</tspan><tspan x="620.0" dy="14.3">2. Користувацька функція (лямбда):</tspan><tspan x="620.0" dy="14.3">   створити новий фрейм env</tspan><tspan x="620.0" dy="14.3">   зв'язати параметри з args,</tspan><tspan x="620.0" dy="14.3">   підготувати тіло (body)</tspan></text>
<line x1="620.0" y1="270.0" x2="620.0" y2="310.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="620.0" y1="310.0" x2="330.0" y2="310.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="330.0" y1="310.0" x2="330.0" y2="272.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="475.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">eval(body, new_env) — виконання тіла замикання</text>
<line x1="730.0" y1="175.0" x2="775.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="755.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Значення</text>
</svg>