<text x="247.5" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">компілює</text>
<text x="472.5" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">перекомпілює</text>
<rect x="187.0" y="233.1" width="346.0" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Stage 1 і Stage 2 — з ТОГО САМОГО джерела.</tspan><tspan x="360.0" dy="16.9">Якщо байти збіглися — самопідняття зійшлося.</tspan></text>
