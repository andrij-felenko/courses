<rect x="78.4" y="105.0" width="173.1" height="49.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Крос-компілятор</tspan><tspan x="165.0" dy="16.9">(звичайна програма)</tspan></text>
<text x="165.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">x86-64, багато RAM,</text>
<text x="165.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">клавіатура, диск</text>
