<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Триетапна атака: три закладки, що прикривають одна одну</text>
<rect x="40.0" y="80.0" width="200.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="140.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Закладка 1</text>
<text x="140.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">у програмі входу</text>
<text x="140.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">впізнає таємний</text>
<text x="140.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">пароль → пускає</text>
<text x="140.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">чужого як root</text>
<text x="140.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700" font-style="italic">у ДЖЕРЕЛІ видно</text>
<rect x="260.0" y="80.0" width="200.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="360.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Закладка 2</text>
<text x="360.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">у компіляторі</text>
<text x="360.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">впізнає джерело</text>
<text x="360.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">входу й вставляє</text>
<text x="360.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">туди закладку 1</text>
<text x="360.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700" font-style="italic">у ДЖЕРЕЛІ видно</text>
<rect x="480.0" y="80.0" width="200.0" height="150.0" rx="6" fill="#f4eafb" stroke="#8e44ad" stroke-width="2.0"/>
<text x="580.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8e44ad" text-anchor="middle" font-weight="700">Закладка 3</text>
<text x="580.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">у компіляторі</text>
<text x="580.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">впізнає джерело</text>
<text x="580.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">компілятора й</text>
<text x="580.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">вписує 1 і 2</text>
<text x="580.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">в новий бінарник</text>
<text x="580.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700" font-style="italic">джерело ЧИСТЕ</text>
<line x1="254.0" y1="155.0" x2="246.0" y2="155.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-style="italic">відтворює</text>
<line x1="474.0" y1="185.0" x2="466.0" y2="185.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-style="italic">ховає обидві</text>
<rect x="122.0" y="245.6" width="476.0" height="48.8" rx="6" fill="#f4eafb" stroke="#8e44ad" stroke-width="1.5"/><text x="360.0" y="266.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Джерело компілятора можна вичистити до останнього рядка —</tspan><tspan x="360.0" dy="16.2">закладка 3 живе в бінарнику й щоразу переписує 1, 2 і саму себе.</tspan></text>
</svg>