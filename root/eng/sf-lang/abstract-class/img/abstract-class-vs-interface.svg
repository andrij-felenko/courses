<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Абстрактний клас (Is-A) проти Чистого інтерфейсу (Can-Do)</text>
<rect x="40.0" y="60.0" width="380.0" height="355.0" rx="8" fill="#fdfefe" stroke="#2457d6" stroke-width="2.0"/>
<rect x="40.0" y="60.0" width="380.0" height="42.0" rx="8" fill="#ebf5fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="230.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Абстрактний клас (Is-A / Різновид)</text>
<text x="58.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Семантика: «є спеціалізацією спільного предка»</text>
<text x="58.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Стан: містить поля даних, змінні екземпляра</text>
<text x="58.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. Реалізація: містить конкретні методи, каркасні алгоритми</text>
<text x="58.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4. Патерн: основа для Template Method / NVI ідіоми</text>
<text x="58.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">5. Зв'язування: одинарне спадкування (ієрархічне дерево)</text>
<text x="58.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">6. Конструктор: керує ініціалізацією спільного стану</text>
<text x="58.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">7. Ціна змін: зміна предка зачіпає всіх нащадків</text>
<rect x="460.0" y="60.0" width="380.0" height="355.0" rx="8" fill="#fdfefe" stroke="#27ae60" stroke-width="2.0"/>
<rect x="460.0" y="60.0" width="380.0" height="42.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="650.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Інтерфейс / Протокол (Can-Do / Роль)</text>
<text x="478.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Семантика: «володіє здатністю, грає роль у системі»</text>
<text x="478.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Стан: не має стану (жодних нестатичних полів)</text>
<text x="478.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. Реалізація: лише сигнатури (або чисті допоміжні default)</text>
<text x="478.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4. Патерн: основа для Strategy / Observer / DI</text>
<text x="478.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">5. Зв'язування: множинна реалізація без конфліктів стану</text>
<text x="478.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">6. Конструктор: відсутній (немає стану для ініціалізації)</text>
<text x="478.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">7. Ціна змін: легке підключення до неспоріднених типів</text>
</svg>