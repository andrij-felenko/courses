<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Девіртуалізація: як final перетворює непрямий виклик на прямий</text>
<rect x="40.0" y="60.0" width="800.0" height="160.0" rx="6" fill="#fcf3cf" stroke="#f39c12" stroke-width="1.5"/>
<text x="60.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7950b" text-anchor="start" font-weight="700">1. Звичайний віртуальний метод (відкрита ієрархія, без final)</text>
<rect x="60.0" y="105.0" width="350.0" height="95.0" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.5"/><text x="235.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Код виклику:</tspan><tspan x="235.0" dy="14.3">Shape* s = get_shape();</tspan><tspan x="235.0" dy="14.3">s-&gt;draw();</tspan><tspan x="235.0" dy="14.3">(Компілятор не знає конкретний підтип)</tspan></text>
<line x1="425.0" y1="150.0" x2="465.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="105.0" width="340.0" height="95.0" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Машинний код (непрямий стрибок):</tspan><tspan x="650.0" dy="11.7">1. mov (%rdi), %rax     [читання vptr]</tspan><tspan x="650.0" dy="11.7">2. mov 0x08(%rax), %rdx  [читання слоту vtable]</tspan><tspan x="650.0" dy="11.7">3. call *%rdx           [непрямий стрибок, без inline]</tspan></text>
<rect x="40.0" y="240.0" width="800.0" height="160.0" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2. Метод або клас позначено final / sealed (закрита точка розширення)</text>
<rect x="60.0" y="285.0" width="350.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="235.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Код виклику:</tspan><tspan x="235.0" dy="14.3">Circle* c = get_circle();</tspan><tspan x="235.0" dy="14.3">c-&gt;draw();  // Circle або draw() є final</tspan><tspan x="235.0" dy="14.3">(Компілятор точно знає тип наперед)</tspan></text>
<line x1="425.0" y1="330.0" x2="465.0" y2="330.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="285.0" width="340.0" height="95.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Оптимізований код (Девіртуалізація):</tspan><tspan x="650.0" dy="14.3">1. call Circle::draw   [прямий виклик]</tspan><tspan x="650.0" dy="14.3">АБО вбудовування тіла (inline):</tspan><tspan x="650.0" dy="14.3">// Тіло методу підставлено прямо на місце!</tspan></text>
</svg>