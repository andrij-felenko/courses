<rect x="82.1" y="187.0" width="95.8" height="26.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="130.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">NumNode (5)</tspan></text>
<rect x="218.4" y="187.0" width="103.3" height="26.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="270.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">NumNode (10)</tspan></text>
<text x="200.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">accept(visitor)</text>
<text x="200.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожен вузол викликає відповідний метод візитора</text>
<text x="620.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Операції над AST (Візитори)</text>
<rect x="537.0" y="102.2" width="166.0" height="55.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">EvaluatorVisitor</tspan><tspan x="620.0" dy="14.3">visit_binary() → a + b</tspan><tspan x="620.0" dy="14.3">visit_num() → val</tspan></text>
<rect x="502.9" y="192.2" width="234.2" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">CodeGeneratorVisitor (LLVM / JS)</tspan><tspan x="620.0" dy="14.3">visit_binary() → emit_add()</tspan><tspan x="620.0" dy="14.3">visit_num() → emit_const()</tspan></text>
<rect x="499.5" y="282.2" width="241.1" height="55.6" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">LinterVisitor (Static Analysis)</tspan><tspan x="620.0" dy="14.3">visit_binary() → check_overflow()</tspan><tspan x="620.0" dy="14.3">visit_num() → check_range()</tspan></text>
