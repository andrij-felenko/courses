<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коалесценція за граничними тегами: злиття вільних блоків за O(1)</text>
<text x="40.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. До free(B): три суміжні блоки в пам'яті</text>
<rect x="40.0" y="82.0" width="200.0" height="75.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="140.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Чанк A: ВІЛЬНИЙ</text>
<text x="140.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Розмір = 64 байти</text>
<rect x="180.0" y="132.0" width="56.0" height="20.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="208.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">size=64</text>
<rect x="250.0" y="82.0" width="240.0" height="75.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<text x="370.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Чанк B: ЗВІЛЬНЯЄТЬСЯ (free)</text>
<text x="370.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Розмір = 48 байтів | PREV_INUSE = 0</text>
<rect x="255.0" y="87.0" width="75.0" height="18.0" rx="2" fill="#fee2e2" stroke="#c0392b" stroke-width="1.0"/>
<text x="292.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Hdr: sz=48</text>
<rect x="500.0" y="82.0" width="240.0" height="75.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="620.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Чанк C: ВІЛЬНИЙ</text>
<text x="620.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Розмір = 80 байтів</text>
<rect x="505.0" y="87.0" width="75.0" height="18.0" rx="2" fill="#eff6ff" stroke="#2457d6" stroke-width="1.0"/>
<text x="542.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Hdr: sz=80</text>
<line x1="290.0" y1="167.0" x2="210.0" y2="167.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="245.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1. Погляд назад (prev_size) → A вільний</text>
<line x1="450.0" y1="167.0" x2="530.0" y2="167.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="495.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">2. Погляд вперед (B + 48) → C вільний</text>
<text x="40.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Після коалесценції: єдиний неперервний блок у списку вільних</text>
<rect x="40.0" y="235.0" width="700.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="390.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Об'єднаний вільний чанк A + B + C</text>
<text x="390.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Сумарний розмір = 64 + 48 + 80 = 192 байти (готові для великого malloc)</text>
<rect x="50.0" y="241.0" width="120.0" height="20.0" rx="2" fill="#dcfce7" stroke="#27ae60" stroke-width="1.0"/>
<text x="110.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Header: size = 192</text>
<rect x="610.0" y="285.0" width="120.0" height="20.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="670.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">prev_size = 192</text>
<text x="410.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Злиття усуває зовнішню фрагментацію миттєво без перебору всієї купи</text>
</svg>