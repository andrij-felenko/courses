<text x="605.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">buddy_addr = block_addr ^ block_size</text>
<text x="605.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Бінарний XOR знаходить пару за 1 такт</text>
<text x="605.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Якщо сусід вільний — миттєве злиття назад</text>
<text x="410.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Buddy-алокація гарантує миттєве злиття за O(1), але створює внутрішню фрагментацію</text>
