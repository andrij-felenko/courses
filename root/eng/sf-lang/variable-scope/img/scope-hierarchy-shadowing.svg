<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія областей видимості та затінення змінних</text>
<rect x="25.0" y="20.0" width="420.0" height="320.0" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="85.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle" font-weight="700">Глобальна область (Global)</text>
<text x="85.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">int x = 1; // [A] Global</text>
<rect x="45.0" y="80.0" width="380.0" height="245.0" rx="6" fill="#edf2ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="120.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Простір імен (Namespace app)</text>
<text x="120.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">int x = 2; // [B] Namespace</text>
<rect x="65.0" y="140.0" width="340.0" height="170.0" rx="6" fill="#ebfbee" stroke="#27ae60" stroke-width="1.5"/>
<text x="130.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Функція (Function run)</text>
<text x="130.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">int x = 3; // [C] Local</text>
<rect x="85.0" y="200.0" width="300.0" height="95.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="140.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Вкладений блок (Block { ... })</text>
<text x="140.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">int x = 4; // [D] Inner Block</text>
<text x="140.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Використання x -&gt; бачить [D] (x = 4)</text>
<rect x="465.0" y="20.0" width="290.0" height="320.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="92.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Оператори розв'язання:</tspan><tspan x="610.0" dy="13.0"></tspan><tspan x="610.0" dy="13.0">• Без префікса: x -&gt; [D] (4)</tspan><tspan x="610.0" dy="13.0">  (найближчий блок затінює решту)</tspan><tspan x="610.0" dy="13.0"></tspan><tspan x="610.0" dy="13.0">• C++ глобальний scope: ::x -&gt; [A] (1)</tspan><tspan x="610.0" dy="13.0"></tspan><tspan x="610.0" dy="13.0">• C++ простір імен: app::x -&gt; [B] (2)</tspan><tspan x="610.0" dy="13.0"></tspan><tspan x="610.0" dy="13.0">• Python nonlocal: зв'язує з [C] (3)</tspan><tspan x="610.0" dy="13.0"></tspan><tspan x="610.0" dy="13.0">• Python global: зв'язує з [A] (1)</tspan><tspan x="610.0" dy="13.0"></tspan><tspan x="610.0" dy="13.0">Затінення (Shadowing) ховає зовнішні</tspan><tspan x="610.0" dy="13.0">імена, але не знищує їх у пам'яті</tspan></text>
<text x="390.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Пошук імені йде зсередини назовні до першого збігу; внутрішнє ім'я затінює однойменні зовнішні</text>
</svg>