<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Область видимості проти тривалості життя об'єкта</text>
<rect x="20.0" y="20.0" width="360.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="39.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">ОБЛАСТЬ ВИДИМОСТІ (Scope)</tspan><tspan x="200.0" dy="14.3">Статичний простір коду, де ім'я є дійсним</tspan></text>
<rect x="400.0" y="20.0" width="360.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="39.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">ТРИВАЛІСТЬ ЖИТТЯ (Lifetime)</tspan><tspan x="580.0" dy="13.0">Динамічний інтервал часу, коли об'єкт існує в пам'яті</tspan></text>
<rect x="20.0" y="80.0" width="360.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">1. Локальна змінна (int x = 10; у блоці)</tspan><tspan x="200.0" dy="13.0">• Видимість: виключно всередині поточного блоку {}</tspan><tspan x="200.0" dy="13.0">• Пам'ять: автоматична (виділяється на стеку при вході)</tspan></text>
<rect x="400.0" y="80.0" width="360.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Тривалість: Автоматична (Automatic)</tspan><tspan x="580.0" dy="13.0">• Об'єкт створюється в момент оголошення</tspan><tspan x="580.0" dy="13.0">• Знищується автоматично при виході за межі блоку</tspan></text>
<rect x="20.0" y="150.0" width="360.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">2. Статична локальна (static int count = 0;)</tspan><tspan x="200.0" dy="13.0">• Видимість: локальна (тільки всередині однієї функції)</tspan><tspan x="200.0" dy="13.0">• Зовнішній код не може звернутися до імені count</tspan></text>
<rect x="400.0" y="150.0" width="360.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Тривалість: Статична (Static / .data / .bss)</tspan><tspan x="580.0" dy="13.0">• Об'єкт живе весь час роботи програми</tspan><tspan x="580.0" dy="13.0">• Зберігає значення між повторними викликами функції</tspan></text>
<rect x="20.0" y="220.0" width="360.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">3. Глобальна змінна (int g_system_state;)</tspan><tspan x="200.0" dy="13.0">• Видимість: глобальна / файлова (через extern)</tspan><tspan x="200.0" dy="13.0">• Ім'я доступне в будь-якому місці програми</tspan></text>
<rect x="400.0" y="220.0" width="360.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Тривалість: Статична (Static)</tspan><tspan x="580.0" dy="13.0">• Ініціалізується до старту main()</tspan><tspan x="580.0" dy="13.0">• Звільняється лише після завершення процесу</tspan></text>
<rect x="20.0" y="290.0" width="360.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="310.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">4. Динамічний об'єкт (*ptr = malloc / new Node)</tspan><tspan x="200.0" dy="13.0">• Видимість: імені в об'єкта немає (анонімний)</tspan><tspan x="200.0" dy="13.0">• Доступний через покажчик, поки покажчик у видимості</tspan></text>
<rect x="400.0" y="290.0" width="360.0" height="60.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="310.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Тривалість: Динамічна (Dynamic / Heap)</tspan><tspan x="580.0" dy="13.0">• Створюється вручну за запитом у купі</tspan><tspan x="580.0" dy="13.0">• Живе, поки не викличуть free() або не збере GC</tspan></text>
<text x="390.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Область видимості визначається текстом програми, а тривалість життя — часом виконання</text>
</svg>