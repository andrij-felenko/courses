<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія: правило старе, оптимізація нова</text>
<line x1="190.0" y1="60.0" x2="190.0" y2="400.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="190.0" cy="80.0" r="7.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<text x="174.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1989–90</text>
<rect x="210.0" y="58.0" width="540.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="83.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Правило вже в C90 (розділ 6.3): читати об'єкт лише сумісним типом. Тихий пункт — компілятори ним не користуються.</tspan></text>
<circle cx="190.0" cy="160.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="174.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">чер. 1998</text>
<rect x="210.0" y="138.0" width="540.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="163.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Патч Марка Мітчелла: type-based alias analysis у GCC. Прапорець -fstrict-aliasing «увімкнений типово під -O2».</tspan></text>
<circle cx="190.0" cy="240.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="174.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">лип. 1999</text>
<rect x="210.0" y="218.0" width="540.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="243.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">GCC 2.95: аналіз типово увімкнено. Сторінка релізу прямо: «expose bugs in the Linux kernel».</tspan></text>
<circle cx="190.0" cy="310.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="174.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">жовт. 1999</text>
<rect x="210.0" y="288.0" width="540.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="313.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">GCC 2.95.2: під тиском багів прапорець типово ВИМКНЕНО. «Знайдіть і виправте код, що порушує стандарт».</tspan></text>
<circle cx="190.0" cy="380.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="174.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">груд. 1999</text>
<rect x="210.0" y="358.0" width="540.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="383.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Аж тепер виходить C99 (розділ 6.5, «ефективний тип») — уже після того, як GCC це впровадив і відкотив.</tspan></text>
</svg>