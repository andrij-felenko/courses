<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм перевірки імені хоста клієнтом (SAN / RFC 6125)</text>
<rect x="7.4" y="64.3" width="305.2" height="61.4" rx="6" fill="#edf7ed" stroke="#2e7d32" stroke-width="1.5"/><text x="160.0" y="84.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Цільовий запит клієнта</tspan><tspan x="160.0" dy="15.0">URL: https://api.prod.example.com/v1</tspan><tspan x="160.0" dy="15.0">Хост для перевірки: api.prod.example.com</tspan></text>
<rect x="360.0" y="50.9" width="320.0" height="88.2" rx="6" fill="#fff8e1" stroke="#f57c00" stroke-width="1.5"/><text x="520.0" y="70.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Кінцевий сертифікат сервера (Leaf)</tspan><tspan x="520.0" dy="14.3">Subject Alternative Name (SAN):</tspan><tspan x="520.0" dy="14.3">1. DNS:api.prod.example.com</tspan><tspan x="520.0" dy="14.3">2. DNS:*.example.com</tspan><tspan x="520.0" dy="14.3">3. DNS:example.com</tspan></text>
<line x1="290.0" y1="95.0" x2="360.0" y2="95.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="175.0" width="860.0" height="265.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правила зіставлення та критерії прийняття рішення</text>
<rect x="55.0" y="220.0" width="510.0" height="42.0" rx="5" fill="#f4f6f8" stroke="#d1d5db" stroke-width="1.0"/>
<text x="65.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Сценарій 1: Точний збіг у SAN</text>
<text x="65.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">DNS:api.prod.example.com збігається з хостом api.prod.example.com</text>
<rect x="580.0" y="220.0" width="305.0" height="42.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3"/>
<text x="732.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">УСПІХ: ідентичність підтверджена</text>
<rect x="55.0" y="272.0" width="510.0" height="42.0" rx="5" fill="#f4f6f8" stroke="#d1d5db" stroke-width="1.0"/>
<text x="65.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Сценарій 2: Wildcard на рівень вище (*.example.com)</text>
<text x="65.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Шаблон *.example.com покриває ТІЛЬКИ один рівень (app.example.com), але НЕ api.prod</text>
<rect x="580.0" y="272.0" width="305.0" height="42.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="732.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ВІДХИЛЕНО: зірочка не покриває крапку</text>
<rect x="55.0" y="324.0" width="510.0" height="42.0" rx="5" fill="#f4f6f8" stroke="#d1d5db" stroke-width="1.0"/>
<text x="65.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Сценарій 3: Запит за IP-адресою (https://192.0.2.1)</text>
<text x="65.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Потрібен запис типу iPAddress:192.0.2.1 у SAN, запис dNSName не підходить</text>
<rect x="580.0" y="324.0" width="305.0" height="42.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/>
<text x="732.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">УМОВНИЙ: залежить від типу SAN</text>
<rect x="55.0" y="376.0" width="510.0" height="42.0" rx="5" fill="#f4f6f8" stroke="#d1d5db" stroke-width="1.0"/>
<text x="65.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Сценарій 4: Відсутній SAN, але присутній Subject CN</text>
<text x="65.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Застарілий підхід (RFC 2818). Сучасні клієнти (RFC 6125, Chrome, Python 3.7+) ігнорують CN</text>
<rect x="580.0" y="376.0" width="305.0" height="42.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="732.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ВІДХИЛЕНО: CN застарів і відкинутий</text>
</svg>