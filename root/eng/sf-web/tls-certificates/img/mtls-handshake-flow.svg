<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємна автентифікація mTLS у протоколі TLS 1.3 (RFC 8446)</text>
<rect x="60.0" y="55.0" width="230.0" height="440.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="175.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт (Client)</text>
<text x="175.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Має свій сертифікат і ключ</text>
<rect x="650.0" y="55.0" width="230.0" height="440.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="765.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер (Server)</text>
<text x="765.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вимагає перевірку клієнта</text>
<line x1="290.0" y1="140.0" x2="650.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. ClientHello: SupportedGroups, KeyShare (ECDH), SNI</text>
<line x1="650.0" y1="190.0" x2="290.0" y2="190.0" stroke="#1976d2" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1976d2" text-anchor="middle" font-weight="700">2. ServerHello + KeyShare (ECDH) [Відтепер трафік зашифровано]</text>
<text x="470.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0d47a1" text-anchor="middle">{EncryptedExtensions, CertificateRequest, Certificate, CertificateVerify, Finished}</text>
<rect x="665.0" y="217.0" width="200.0" height="56.0" rx="6" fill="#fff8e1" stroke="#f57c00" stroke-width="1.5"/><text x="765.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">CertificateRequest:</tspan><tspan x="765.0" dy="13.0">Сервер вказує допустимі CA</tspan><tspan x="765.0" dy="13.0">та алгоритми підпису</tspan></text>
<rect x="75.0" y="217.0" width="200.0" height="56.0" rx="6" fill="#edf7ed" stroke="#2e7d32" stroke-width="1.5"/><text x="175.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Клієнт валідує сервер:</tspan><tspan x="175.0" dy="13.0">1. Ланцюг сертифіката сервера</tspan><tspan x="175.0" dy="13.0">2. Збіг імені в розширенні SAN</tspan></text>
<line x1="290.0" y1="315.0" x2="650.0" y2="315.0" stroke="#2e7d32" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle" font-weight="700">3. {Certificate, CertificateVerify, Finished}</text>
<text x="470.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e4620" text-anchor="middle">Клієнт надсилає свій сертифікат і цифровий підпис транскрипту</text>
<rect x="663.8" y="340.5" width="202.4" height="69.0" rx="6" fill="#edf7ed" stroke="#2e7d32" stroke-width="1.5"/><text x="765.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Сервер валідує клієнта:</tspan><tspan x="765.0" dy="13.0">1. Підпис CertificateVerify</tspan><tspan x="765.0" dy="13.0">2. Ланцюг довіри клієнтського CA</tspan><tspan x="765.0" dy="13.0">3. Видобуває ID клієнта</tspan></text>
<line x1="290.0" y1="440.0" x2="650.0" y2="440.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="650.0" y1="465.0" x2="290.0" y2="465.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="470.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">4. Двосторонній захищений прикладний потік (HTTP/2, REST, gRPC)</text>
<text x="470.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сервер авторизує клієнта безпосередньо за його X.509 ідентичністю</text>
</svg>