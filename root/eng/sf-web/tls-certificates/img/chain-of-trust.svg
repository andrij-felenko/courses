<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія довіри X.509: від локального якоря до кінцевого сервера</text>
<rect x="40.0" y="55.0" width="520.0" height="125.0" rx="8" fill="#edf7ed" stroke="#2e7d32" stroke-width="1.8"/>
<text x="300.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e4620" text-anchor="middle" font-weight="700">Кореневий центр сертифікації (Root CA)</text>
<text x="300.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Subject: CN = GlobalTrust Root CA  |  Issuer: CN = GlobalTrust Root CA (Self-signed)</text>
<text x="300.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розширення: Basic Constraints (CA: TRUE, pathLen: 1), Key Usage: keyCertSign</text>
<text x="300.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle" font-weight="700">Відкритий ключ Root CA використовується для перевірки підпису Intermediate CA</text>
<text x="300.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Приватний ключ Root CA зберігається у вимкненому апаратному модулі (Offline HSM)</text>
<rect x="590.0" y="80.0" width="300.0" height="73.9" rx="6" fill="#f4f6f8" stroke="#2e7d32" stroke-width="1.5"/><text x="740.0" y="99.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Локальне сховище довіри</tspan><tspan x="740.0" dy="14.3">(Trust Store ОС / Браузера)</tspan><tspan x="740.0" dy="14.3">Попередньо встановлені сертифікати,</tspan><tspan x="740.0" dy="14.3">яким клієнт безумовно довіряє</tspan></text>
<line x1="560.0" y1="117.0" x2="590.0" y2="117.0" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="300.0" y1="180.0" x2="300.0" y2="215.0" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="315.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e4620" text-anchor="start" font-weight="700">Підпис Root CA (SHA-256 з RSA/ECDSA)</text>
<rect x="40.0" y="220.0" width="520.0" height="125.0" rx="8" fill="#e8f4fd" stroke="#1976d2" stroke-width="1.8"/>
<text x="300.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0d47a1" text-anchor="middle" font-weight="700">Проміжний центр сертифікації (Intermediate CA)</text>
<text x="300.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Subject: CN = GlobalTrust Server CA G2  |  Issuer: CN = GlobalTrust Root CA</text>
<text x="300.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розширення: Basic Constraints (CA: TRUE, pathLen: 0), Key Usage: keyCertSign</text>
<text x="300.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1976d2" text-anchor="middle" font-weight="700">Відкритий ключ Intermediate CA використовується для перевірки підпису Leaf</text>
<text x="300.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Працює онлайн для автоматичного щоденного випуску кінцевих сертифікатів</text>
<rect x="590.0" y="245.1" width="300.0" height="73.9" rx="6" fill="#f4f6f8" stroke="#1976d2" stroke-width="1.5"/><text x="740.0" y="264.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Передається сервером у TLS</tspan><tspan x="740.0" dy="14.3">Сервер зобов'язаний надіслати</tspan><tspan x="740.0" dy="14.3">Intermediate разом зі своїм сертифікатом</tspan><tspan x="740.0" dy="14.3">у повідомленні Certificate</tspan></text>
<line x1="560.0" y1="282.0" x2="590.0" y2="282.0" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="300.0" y1="345.0" x2="300.0" y2="380.0" stroke="#1976d2" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="315.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0d47a1" text-anchor="start" font-weight="700">Підпис Intermediate CA</text>
<rect x="40.0" y="385.0" width="520.0" height="120.0" rx="8" fill="#fff8e1" stroke="#f57c00" stroke-width="1.8"/>
<text x="300.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e65100" text-anchor="middle" font-weight="700">Кінцевий сертифікат сервера (Leaf / End-Entity)</text>
<text x="300.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Subject: CN = api.example.com  |  Issuer: CN = GlobalTrust Server CA G2</text>
<text x="300.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">SAN: DNS:api.example.com, DNS:example.com  |  EKU: id-kp-serverAuth</text>
<text x="300.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Basic Constraints: CA: FALSE (заборона випускати підлеглі сертифікати)</text>
<text x="300.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Приватний ключ належить веб-серверу (використовується в TLS Handshake)</text>
<rect x="590.0" y="408.1" width="300.0" height="73.9" rx="6" fill="#f4f6f8" stroke="#f57c00" stroke-width="1.5"/><text x="740.0" y="427.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Валідація клієнтом</tspan><tspan x="740.0" dy="14.3">1. Перевірка підписів знизу вгору</tspan><tspan x="740.0" dy="14.3">2. Перевірка дат notBefore..notAfter</tspan><tspan x="740.0" dy="14.3">3. Перевірка збігу SAN з URL хоста</tspan></text>
<line x1="560.0" y1="445.0" x2="590.0" y2="445.0" stroke="#f57c00" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>