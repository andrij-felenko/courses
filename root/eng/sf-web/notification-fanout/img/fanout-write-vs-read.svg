<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="50.0" width="385.0" height="410.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="212.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Fanout-on-Write (Push / Матеріалізація)</text>
<rect x="135.6" y="93.2" width="152.8" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="212.0" y="111.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Автор публікує подію</tspan><tspan x="212.0" dy="15.6">[Write: O(1)]</tspan></text>
<line x1="212.0" y1="140.0" x2="212.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Розмноження на N копій</text>
<rect x="50.7" y="191.3" width="118.6" height="37.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Стрічка Юзера 1</tspan><tspan x="110.0" dy="14.3">(Redis/RAM Inbox)</tspan></text>
<rect x="152.7" y="191.3" width="118.6" height="37.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="212.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Стрічка Юзера 2</tspan><tspan x="212.0" dy="14.3">(Redis/RAM Inbox)</tspan></text>
<rect x="254.7" y="191.3" width="118.6" height="37.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="314.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="314.0" dy="0.0">Стрічка Юзера N</tspan><tspan x="314.0" dy="14.3">(Redis/RAM Inbox)</tspan></text>
<line x1="212.0" y1="250.0" x2="212.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="212.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Читання зі своєї скриньки: O(1)</text>
<rect x="108.2" y="303.2" width="207.5" height="43.6" rx="6" fill="#edf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="212.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Користувач відкриває стрічку</tspan><tspan x="212.0" dy="15.6">[Миттєвий зріз пам'яті]</tspan></text>
<rect x="35.0" y="375.0" width="355.0" height="70.0" rx="6" fill="#fff2f2" stroke="#c0392b" stroke-width="1.5"/><text x="212.5" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Вузьке місце: Write Amplification.</tspan><tspan x="212.5" dy="14.3">Публікація селебріті (N = 10 млн) забиває черги,</tspan><tspan x="212.5" dy="14.3">диски та пам'ять для неактивних фоловерів.</tspan></text>
<rect x="435.0" y="50.0" width="385.0" height="410.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="627.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Fanout-on-Read (Pull / Ліниве злиття)</text>
<rect x="499.3" y="93.2" width="255.4" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="627.0" y="111.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">Автор публікує подію</tspan><tspan x="627.0" dy="15.6">[Запис у персональний Outbox: O(1)]</tspan></text>
<line x1="627.0" y1="140.0" x2="627.0" y2="185.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="627.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 запис у БД автора</text>
<rect x="552.0" y="191.3" width="149.9" height="37.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="627.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">Таблиця постів авторів</tspan><tspan x="627.0" dy="14.3">(1 запис на подію)</tspan></text>
<line x1="627.0" y1="245.0" x2="627.0" y2="290.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="627.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Запит: SELECT + K-way Merge</text>
<rect x="502.7" y="303.2" width="248.6" height="43.6" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.5"/><text x="627.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">Користувач відкриває стрічку</tspan><tspan x="627.0" dy="15.6">[Складне злиття K джерел на льоту]</tspan></text>
<rect x="450.0" y="375.0" width="355.0" height="70.0" rx="6" fill="#fff2f2" stroke="#c0392b" stroke-width="1.5"/><text x="627.5" y="400.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">Вузьке місце: Read Latency &amp; High IOPS.</tspan><tspan x="627.5" dy="13.0">Кожен перегляд стрічки вимагає опитування сотень</tspan><tspan x="627.5" dy="13.0">авторів і сортування. Не масштабується при високому RPS.</tspan></text>
</svg>