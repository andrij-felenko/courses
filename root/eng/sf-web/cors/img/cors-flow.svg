<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл запитів CORS: простий проти перевіреного (Preflight)</text>
<rect x="40.0" y="55.0" width="420.0" height="420.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1. Простий запит (GET / POST / HEAD)</text>
<text x="250.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стандартні заголовки, тіло urlencoded/form-data/text</text>
<rect x="60.0" y="115.0" width="110.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="115.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Браузер</text>
<rect x="330.0" y="115.0" width="110.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="385.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер API</text>
<line x1="115.0" y1="175.0" x2="385.0" y2="175.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">GET /items + Origin: https://app.com</text>
<rect x="323.7" y="203.8" width="122.6" height="52.4" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="385.0" y="221.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Сервер виконує запит</tspan><tspan x="385.0" dy="11.7">і повертає відповідь</tspan><tspan x="385.0" dy="11.7">разом із ACAO</tspan></text>
<line x1="385.0" y1="285.0" x2="115.0" y2="285.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">200 OK + Access-Control-Allow-Origin: *</text>
<rect x="40.9" y="327.9" width="148.2" height="64.1" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Браузер перевіряє ACAO:</tspan><tspan x="115.0" dy="11.7">• збігається → віддає JS</tspan><tspan x="115.0" dy="11.7">• помилка → ховає дані</tspan><tspan x="115.0" dy="11.7">(але запит уже виконано!)</tspan></text>
<rect x="480.0" y="55.0" width="420.0" height="420.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="690.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Запит із Preflight (PUT, DELETE, JSON, Auth)</text>
<text x="690.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Небезпечні методи, custom заголовки або application/json</text>
<rect x="500.0" y="115.0" width="110.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="555.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Браузер</text>
<rect x="770.0" y="115.0" width="110.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="825.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер API</text>
<line x1="555.0" y1="175.0" x2="825.0" y2="175.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="690.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">OPTIONS /users + ACR-Method: DELETE</text>
<line x1="825.0" y1="220.0" x2="555.0" y2="220.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="690.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">204 No Content + Allow-Methods: DELETE</text>
<line x1="555.0" y1="275.0" x2="825.0" y2="275.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">DELETE /users/42 + Origin: https://app.com</text>
<line x1="825.0" y1="330.0" x2="555.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">200 OK + Access-Control-Allow-Origin</text>
<rect x="495.0" y="374.6" width="390.0" height="40.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="392.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Якщо OPTIONS відхилено або сервер повернув 403/404,</tspan><tspan x="690.0" dy="11.7">браузер ВЗАГАЛІ НЕ ВІДПРАВЛЯЄ основний DELETE-запит</tspan></text>
<text x="470.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Preflight захищає застарілі бекенди від неочікуваних мутацій, тоді як прості запити виконуються негайно</text>
</svg>