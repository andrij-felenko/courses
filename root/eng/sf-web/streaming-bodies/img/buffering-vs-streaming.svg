<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння підходів: повне буферизування в RAM проти потокового конвеєра</text>
<rect x="30.0" y="60.0" width="425.0" height="340.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="242.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Повне буферизування (In-Memory Buffering)</text>
<text x="242.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Споживання пам'яті пропорційне розміру тіла: O(N)</text>
<rect x="50.0" y="130.0" width="385.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="242.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Пул оперативної пам'яті процесу (RAM)</text>
<rect x="60.0" y="182.3" width="150.0" height="45.3" rx="6" fill="#f9d5d5" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Запит 1: 500 МБ</tspan><tspan x="135.0" dy="14.3">(буфер у RAM)</tspan></text>
<rect x="240.0" y="182.3" width="150.0" height="45.3" rx="6" fill="#f9d5d5" stroke="#c0392b" stroke-width="1.5"/><text x="315.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">Запит 2: 500 МБ</tspan><tspan x="315.0" dy="14.3">(буфер у RAM)</tspan></text>
<rect x="43.9" y="290.2" width="396.2" height="59.6" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="242.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="242.0" dy="0.0">• 100 одночасних з'єднань = 50 ГБ RAM → ризик OOM-killer</tspan><tspan x="242.0" dy="14.3">• Висока затримка TTFB: клієнт чекає повного викачування</tspan><tspan x="242.0" dy="14.3">• Навантаження на збирач сміття (GC) та фрагментація пам'яті</tspan></text>
<rect x="485.0" y="60.0" width="425.0" height="340.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="697.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Потокове передавання (Streaming Pipeline)</text>
<text x="697.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Споживання пам'яті фіксоване й обмежене: O(1)</text>
<rect x="505.0" y="130.0" width="385.0" height="120.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="697.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Пул оперативної пам'яті процесу (RAM)</text>
<rect x="515.0" y="182.3" width="140.0" height="45.3" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/><text x="585.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">Чанк 1: 64 КБ</tspan><tspan x="585.0" dy="14.3">(обробка/запис)</tspan></text>
<rect x="700.0" y="182.3" width="140.0" height="45.3" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Чанк 2: 64 КБ</tspan><tspan x="770.0" dy="14.3">(обробка/запис)</tspan></text>
<rect x="495.8" y="290.2" width="402.5" height="59.6" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/><text x="697.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="697.0" dy="0.0">• 100 одночасних з'єднань = лише 6.4 МБ RAM у піку</tspan><tspan x="697.0" dy="14.3">• Мінімальна затримка TTFB: дані віддаються відразу</tspan><tspan x="697.0" dy="14.3">• Стабільне навантаження незалежно від розміру файлу (10 ГБ+)</tspan></text>
</svg>