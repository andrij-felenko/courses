<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг поширення зворотного тиску (Backpressure) від споживача до джерела</text>
<rect x="30.0" y="60.0" width="200.0" height="280.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="130.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Споживач (Sink)</text>
<text x="130.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повільна обробка / I/O</text>
<rect x="42.5" y="143.1" width="175.0" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Додаток не встигає</tspan><tspan x="130.0" dy="14.3">читати з сокета</tspan><tspan x="130.0" dy="14.3">через повільний диск</tspan><tspan x="130.0" dy="14.3">або довгий парсинг</tspan></text>
<text x="130.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Буфер SO_RCVBUF</text>
<text x="130.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">переповнюється (100%)</text>
<line x1="240.0" y1="200.0" x2="310.0" y2="200.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="275.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Зворотний</text>
<text x="275.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">тиск</text>
<rect x="320.0" y="60.0" width="280.0" height="280.0" rx="8" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/>
<text x="460.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e67e22" text-anchor="middle" font-weight="700">2. Стек TCP та Мережа</text>
<text x="460.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Керування потоком TCP Flow Control</text>
<rect x="335.0" y="143.1" width="250.0" height="73.9" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5"/><text x="460.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">TCP Receiver Window</tspan><tspan x="460.0" dy="14.3">звужується до 0:</tspan><tspan x="460.0" dy="14.3">Zero-Window Update</tspan><tspan x="460.0" dy="14.3">відправляється серверу</tspan></text>
<text x="460.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">Мережевий потік зупинено:</text>
<text x="460.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e67e22" text-anchor="middle">TCP ACK RWIN = 0</text>
<line x1="610.0" y1="200.0" x2="680.0" y2="200.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="645.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Зворотний</text>
<text x="645.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">тиск</text>
<rect x="690.0" y="60.0" width="220.0" height="280.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="800.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Джерело (Source)</text>
<text x="800.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Відправник даних</text>
<rect x="702.5" y="143.1" width="195.0" height="73.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Буфер SO_SNDBUF</tspan><tspan x="800.0" dy="14.3">заповнюється;</tspan><tspan x="800.0" dy="14.3">write() блокується або</tspan><tspan x="800.0" dy="14.3">вертає EAGAIN</tspan></text>
<text x="800.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Генерація призупинена:</text>
<text x="800.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">читання з диска на паузі</text>
<text x="470.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Саморегуляція: швидкість відправника автоматично підлаштовується під пропускну здатність споживача</text>
</svg>