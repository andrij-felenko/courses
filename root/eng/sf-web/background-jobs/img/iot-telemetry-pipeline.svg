<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр фонової обробки телеметрії IoT на базі Redis Streams</text>
<rect x="53.7" y="161.8" width="212.5" height="76.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="181.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">IoT Пристрої</tspan><tspan x="160.0" dy="15.0">50 000 польових сенсорів</tspan><tspan x="160.0" dy="15.0">Пакет: device_id, seq_no,</tspan><tspan x="160.0" dy="15.0">temp, pressure, battery, ts</tspan></text>
<rect x="303.1" y="161.8" width="233.9" height="76.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="181.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Ingestion Gateway</tspan><tspan x="420.0" dy="15.0">HTTP / MQTT веб-сервер</tspan><tspan x="420.0" dy="15.0">Валідація підпису та структури</tspan><tspan x="420.0" dy="15.0">XADD iot:telemetry:stream</tspan></text>
<line x1="266.3" y1="200.0" x2="303.1" y2="200.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="284.7" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">HTTP POST / MQTT</text>
<rect x="578.8" y="154.3" width="262.4" height="91.3" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="174.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Redis Stream</tspan><tspan x="710.0" dy="15.0">«iot:telemetry:stream»</tspan><tspan x="710.0" dy="15.0">Consumer Group «telemetry_workers»</tspan><tspan x="710.0" dy="15.0">PEL (Pending Entries List) облік</tspan><tspan x="710.0" dy="15.0">Гарантія At-least-once</tspan></text>
<line x1="537.0" y1="200.0" x2="578.8" y2="200.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="557.9" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">XADD stream *</text>
<rect x="894.1" y="103.0" width="251.9" height="73.9" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">Worker · Deduplication &amp; DB</tspan><tspan x="1020.0" dy="14.3">SET pkg:&lt;dev&gt;:&lt;seq&gt; NX EX 3600</tspan><tspan x="1020.0" dy="14.3">Запис у Time-Series DB (Timescale)</tspan><tspan x="1020.0" dy="14.3">XACK повідомлення в Stream</tspan></text>
<rect x="894.1" y="293.1" width="251.9" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1020.0" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">Dead Letter Stream (DLQ)</tspan><tspan x="1020.0" dy="14.3">«iot:telemetry:dlq»</tspan><tspan x="1020.0" dy="14.3">Пошкоджені або отруйні пакети</tspan><tspan x="1020.0" dy="14.3">Аудит аномалій сенсорів і алертинг</tspan></text>
<line x1="841.2" y1="180.0" x2="894.1" y2="140.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="867.6" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">XREADGROUP / успіх</text>
<line x1="841.2" y1="220.0" x2="894.1" y2="330.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="867.6" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">збій після 3 спроб</text>
<text x="590.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Вхідний шлюз скидає пакети в Redis Stream за частки мілісекунди, а пул воркерів з дедуплікацією надійно захищає часову базу даних від подвійних записів та перевантаження.</text>
</svg>