<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура періодичного планувальника (Beat) та розподілений замок</text>
<rect x="71.0" y="111.8" width="298.1" height="76.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Scheduler Вузол A (Active Leader)</tspan><tspan x="220.0" dy="15.0">Утримує розподілений замок у Redis</tspan><tspan x="220.0" dy="15.0">Генерує часові такти (Tick що секунду)</tspan><tspan x="220.0" dy="15.0">Обчислює розклад періодичних cron-задач</tspan></text>
<rect x="75.0" y="291.8" width="290.0" height="76.4" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="311.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Scheduler Вузол B (Standby)</tspan><tspan x="220.0" dy="15.0">Періодично намагається взяти замок</tspan><tspan x="220.0" dy="15.0">Спить, поки активний Вузол A</tspan><tspan x="220.0" dy="15.0">Миттєво стає лідером при збої вузла A</tspan></text>
<rect x="450.0" y="201.8" width="280.0" height="76.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="221.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Розподілений замок (Redlock)</tspan><tspan x="590.0" dy="15.0">SET lock:scheduler &lt;uuid&gt; NX EX 15</tspan><tspan x="590.0" dy="15.0">Автопродовження оренди кожні 5 с</tspan><tspan x="590.0" dy="15.0">Запобігає подвійному плануванню</tspan></text>
<line x1="369.0" y1="150.0" x2="450.0" y2="220.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="409.5" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">утримує замок</text>
<line x1="365.0" y1="330.0" x2="450.0" y2="260.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="407.5" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">опитує замок</text>
<rect x="811.7" y="111.8" width="276.7" height="76.4" rx="6" fill="#faf3e0" stroke="#1a1a1a" stroke-width="1.5"/><text x="950.0" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="950.0" dy="0.0">Ready Queue (Черга брокера)</tspan><tspan x="950.0" dy="15.0">Звичайна черга виконання задач</tspan><tspan x="950.0" dy="15.0">Планувальник НЕ виконує задачі сам —</tspan><tspan x="950.0" dy="15.0">він лише пушить task_id у чергу</tspan></text>
<rect x="808.1" y="291.8" width="283.8" height="76.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="950.0" y="311.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="950.0" dy="0.0">Worker Pool (Пул воркерів)</tspan><tspan x="950.0" dy="15.0">Вичерпує чергу готових задач</tspan><tspan x="950.0" dy="15.0">Воркери не знають, чи задача надійшла</tspan><tspan x="950.0" dy="15.0">від користувача, чи за cron-розкладом</tspan></text>
<line x1="369.0" y1="130.0" x2="811.7" y2="130.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="590.3" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">постановка задачі в чергу (XADD / LPUSH)</text>
<line x1="950.0" y1="188.2" x2="950.0" y2="291.8" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="1022.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">fetch &amp; execute</text>
<text x="570.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Планувальник відокремлений від воркерів: він відповідає лише за таймінг і постановку задач, а розподілений замок гарантує, що жодна щохвилинна задача не здублюється в кластері.</text>
</svg>