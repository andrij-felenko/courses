<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм повторів: експоненційний відступ, тремтіння та таймаути</text>
<line x1="218.2" y1="140.0" x2="335.0" y2="140.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="276.6" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">backoff #1 (2^1 · база + jitter)</text>
<line x1="485.0" y1="140.0" x2="635.0" y2="140.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="560.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">backoff #2 (2^2 · база + jitter)</text>
<line x1="805.0" y1="140.0" x2="940.0" y2="140.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="872.5" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ліміт спроб досягнуто</text>
<rect x="61.8" y="110.2" width="156.4" height="59.6" rx="6" fill="#faf3e0" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Спроба #1</tspan><tspan x="140.0" dy="14.3">Виконання</tspan><tspan x="140.0" dy="14.3">Збій: 429 Rate Limit</tspan></text>
<rect x="335.0" y="110.2" width="150.0" height="59.6" rx="6" fill="#faf3e0" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Спроба #2</tspan><tspan x="410.0" dy="14.3">Пауза ~2–4 с</tspan><tspan x="410.0" dy="14.3">Збій: Lock Timeout</tspan></text>
<rect x="635.0" y="110.2" width="170.0" height="59.6" rx="6" fill="#faf3e0" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Спроба #3</tspan><tspan x="720.0" dy="14.3">Пауза ~6–10 с</tspan><tspan x="720.0" dy="14.3">Збій: Connection Reset</tspan></text>
<rect x="940.0" y="110.2" width="200.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1040.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1040.0" dy="0.0">Вичерпано max_retries</tspan><tspan x="1040.0" dy="14.3">Перенаправлення в DLQ</tspan><tspan x="1040.0" dy="14.3">Сповіщення Sentry / Alert</tspan></text>
<rect x="85.0" y="314.4" width="390.0" height="91.3" rx="6" fill="#faf3e0" stroke="#1a1a1a" stroke-width="1.5"/><text x="280.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Soft Time Limit (М'який таймаут)</tspan><tspan x="280.0" dy="15.0">Сигнал SIGUSR1 / виняток SoftTimeLimitExceeded</tspan><tspan x="280.0" dy="15.0">Воркер перехоплює виняток у коді задачі</tspan><tspan x="280.0" dy="15.0">Коректне закриття транзакцій, файлів і сокетів</tspan><tspan x="280.0" dy="15.0">Збереження прогресу та планова реєстрація збою</tspan></text>
<rect x="725.0" y="314.4" width="390.0" height="91.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="920.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Hard Time Limit (Жорсткий таймаут)</tspan><tspan x="920.0" dy="15.0">Сигнал ядра SIGKILL (-9) процесу воркера</tspan><tspan x="920.0" dy="15.0">Примусове знищення процесу без очищення</tspan><tspan x="920.0" dy="15.0">Master-процес виявляє падіння дочірнього воркера</tspan><tspan x="920.0" dy="15.0">Перезапуск нового процесу та повернення задачі</tspan></text>
<line x1="475.0" y1="360.0" x2="725.0" y2="360.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="600.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="600.0" dy="0.0">якщо воркер не завершився</tspan><tspan x="600.0" dy="13.7">за Grace Period (напр. 15 с)</tspan></text>
<text x="600.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Випадковий джитер розбиває синхронні хвилі повторів, а подвійний таймаут (Soft + Hard) захищає пул від зависання на безкінечних циклах чи блокуючих сокетах.</text>
</svg>