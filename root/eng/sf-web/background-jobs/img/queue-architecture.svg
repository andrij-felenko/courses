<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотириланкова архітектура черги фонових задач</text>
<rect x="60.0" y="214.3" width="240.0" height="91.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="234.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Producer (Постачальник)</tspan><tspan x="180.0" dy="15.0">Веб-сервер · API Gateway</tspan><tspan x="180.0" dy="15.0">Генерація task_id</tspan><tspan x="180.0" dy="15.0">Серіалізація аргументів (JSON)</tspan><tspan x="180.0" dy="15.0">Повертає клієнту 202 Accepted</tspan></text>
<rect x="409.6" y="134.3" width="340.9" height="91.3" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="154.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Message Broker (Брокер)</tspan><tspan x="580.0" dy="15.0">Redis Streams · RabbitMQ · AMQP</tspan><tspan x="580.0" dy="15.0">Буферизація завдань у пам'яті / на диску</tspan><tspan x="580.0" dy="15.0">Черги очікування (FIFO / Priority)</tspan><tspan x="580.0" dy="15.0">Облік непідтверджених задач (PEL / In-flight)</tspan></text>
<rect x="427.4" y="421.8" width="305.2" height="76.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="441.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Dead Letter Queue (DLQ)</tspan><tspan x="580.0" dy="15.0">Черга збійних і отруйних повідомлень</tspan><tspan x="580.0" dy="15.0">Збереження тіла, помилки й стек-трейсу</tspan><tspan x="580.0" dy="15.0">Ручний аудит · Re-drive / Replay утиліта</tspan></text>
<rect x="838.1" y="134.3" width="283.8" height="91.3" rx="6" fill="#faf3e0" stroke="#1a1a1a" stroke-width="1.5"/><text x="980.0" y="154.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">Consumer (Worker Pool)</tspan><tspan x="980.0" dy="15.0">Master / Supervisor процес</tspan><tspan x="980.0" dy="15.0">Prefetch буфер · QoS обмеження</tspan><tspan x="980.0" dy="15.0">Пул воркерів (Fork / Threads / Async)</tspan><tspan x="980.0" dy="15.0">Виконання бізнес-логіки та ACK</tspan></text>
<rect x="841.7" y="414.4" width="276.7" height="91.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="434.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">Result Backend (Сховище)</tspan><tspan x="980.0" dy="15.0">Redis · PostgreSQL · S3 Key-Value</tspan><tspan x="980.0" dy="15.0">Статус (PENDING / SUCCESS / FAILURE)</tspan><tspan x="980.0" dy="15.0">Результат виклику або виняток</tspan><tspan x="980.0" dy="15.0">TTL автоматичної утилізації ключів</tspan></text>
<line x1="300.0" y1="230.0" x2="409.6" y2="200.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="344.8" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="344.8" dy="0.0">постановка задачі</tspan><tspan x="344.8" dy="13.7">(XADD / basic.publish)</tspan></text>
<line x1="750.4" y1="164.0" x2="838.1" y2="164.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="794.3" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">fetch / dispatch (Prefetch)</text>
<line x1="838.1" y1="196.0" x2="750.4" y2="196.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="794.3" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ACK (підтвердження) / NACK</text>
<line x1="980.0" y1="225.7" x2="980.0" y2="414.4" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="1070.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="1070.0" dy="0.0">запис результату</tspan><tspan x="1070.0" dy="13.7">(SET task:&lt;id&gt;)</tspan></text>
<line x1="858.1" y1="225.7" x2="732.6" y2="440.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="815.3" y="348.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="815.3" dy="0.0">після max_retries</tspan><tspan x="815.3" dy="13.7">→ вивантаження в DLQ</tspan></text>
<text x="590.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Чотири вузли повністю розв'язані в просторі й часі: веб-сервер не чекає виконання, а воркери масштабуються незалежно від обсягу HTTP-трафіку.</text>
</svg>