<rect x="564.0" y="130.2" width="192.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="660.0" y="150.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">лоток очікування</tspan><tspan x="660.0" dy="15.6">за пріоритетом</tspan></text>
