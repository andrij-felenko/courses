<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часове вікно (Time-Window) та дедуплікація Replay</text>
<line x1="80.0" y1="220.0" x2="920.0" y2="220.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="915.0" y1="220.0" x2="940.0" y2="220.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="935.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Час (t)</text>
<line x1="500.0" y1="90.0" x2="500.0" y2="350.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="4 4"/>
<rect x="385.8" y="59.0" width="228.3" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Поточний час сервера (T_now)</tspan></text>
<line x1="280.0" y1="120.0" x2="280.0" y2="330.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="5 5"/>
<line x1="720.0" y1="120.0" x2="720.0" y2="330.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="5 5"/>
<text x="280.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">T_now − Δt
(напр. −300 с)</text>
<text x="720.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">T_now + Δt
(напр. +300 с)</text>
<rect x="80.0" y="140.0" width="200.0" height="140.0" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1.0"/>
<text x="180.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Застарілий запит</text>
<text x="180.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">t &lt; T_now − 300s</text>
<text x="180.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ВІДХИЛЕНО (401/400)</text>
<rect x="280.0" y="140.0" width="440.0" height="140.0" rx="4" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="500.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Допустиме вікно валідності</text>
<text x="500.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">|T_now − t| ≤ 300s</text>
<text x="500.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1-й прихід: перевірка HMAC → OK → запис Nonce</text>
<text x="500.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Replay повтор: Nonce вже в базі → 200 (без дії)</text>
<rect x="720.0" y="140.0" width="200.0" height="140.0" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1.0"/>
<text x="820.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Запит із майбутнього</text>
<text x="820.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">t &gt; T_now + 300s</text>
<text x="820.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ВІДХИЛЕНО (400)</text>
<rect x="175.0" y="386.2" width="650.0" height="47.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="406.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Дворівневий захист: Часове вікно обмежує життя запиту до 5 хвилин,</tspan><tspan x="500.0" dy="15.6">а сховище Nonce / Event ID захищає від тисяч повторів усередині цього вікна.</tspan></text>
</svg>