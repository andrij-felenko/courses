<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будова HMAC-SHA256 (RFC 2104)</text>
<rect x="45.0" y="86.2" width="150.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="120.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Спільний секрет K</tspan><tspan x="120.0" dy="15.6">(байти ключа)</tspan></text>
<rect x="240.0" y="80.2" width="160.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">K' (64 байти)</tspan><tspan x="320.0" dy="14.3">(padding нулями</tspan><tspan x="320.0" dy="14.3">або SHA256 якщо &gt; 64)</tspan></text>
<line x1="195.0" y1="110.0" x2="240.0" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
