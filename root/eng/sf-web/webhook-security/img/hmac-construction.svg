<line x1="320.0" y1="200.0" x2="680.0" y2="240.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="110.0" y="246.2" width="140.0" height="47.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">K' ⊕ ipad</tspan><tspan x="180.0" dy="15.6">(ipad = 0x36...)</tspan></text>
<rect x="295.6" y="246.2" width="168.8" height="47.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Сире тіло запиту (M)</tspan><tspan x="380.0" dy="15.6">(Raw Bytes)</tspan></text>
<rect x="130.0" y="348.4" width="300.0" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Внутрішній SHA-256</tspan><tspan x="280.0" dy="15.6">HASH( (K' ⊕ ipad) || M )</tspan><tspan x="280.0" dy="15.6">→ 32 байти внутрішнього дайджесту</tspan></text>
<line x1="180.0" y1="293.8" x2="240.0" y2="348.4" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380.0" y1="293.8" x2="320.0" y2="348.4" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="610.0" y="246.2" width="140.0" height="47.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">K' ⊕ opad</tspan><tspan x="680.0" dy="15.6">(opad = 0x5C...)</tspan></text>
<rect x="530.0" y="348.4" width="300.0" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="680.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Зовнішній SHA-256</tspan><tspan x="680.0" dy="15.6">HASH( (K' ⊕ opad) || Inner_Hash )</tspan><tspan x="680.0" dy="15.6">→ 32 байти HMAC</tspan></text>
<line x1="680.0" y1="293.8" x2="680.0" y2="348.4" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430.0" y1="380.0" x2="530.0" y2="380.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="431.9" y="451.2" width="496.2" height="47.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="471.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">HMAC-SHA256 Підпис (HEX або Base64)</tspan><tspan x="680.0" dy="15.6">Передається у заголовку X-Hub-Signature-256 або Stripe-Signature</tspan></text>
