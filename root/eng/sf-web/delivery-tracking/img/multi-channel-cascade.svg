<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура каскадної доставки (Waterfall Fallback)</text>
<rect x="31.6" y="228.4" width="156.8" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Критична подія</tspan><tspan x="110.0" dy="15.6">(2FA-код / Алертинг)</tspan><tspan x="110.0" dy="15.6">TTL = 120 с</tspan></text>
<rect x="211.6" y="228.4" width="156.8" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="290.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Cascade Router</tspan><tspan x="290.0" dy="15.6">(Оцінка доступності</tspan><tspan x="290.0" dy="15.6">та вартості каналів)</tspan></text>
<line x1="188.4" y1="260.0" x2="211.6" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Outbox Event</text>
<text x="540.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Крок 1: Швидкий і дешевий канал (.00)</text>
<rect x="480.0" y="87.3" width="280.0" height="45.3" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Канал 1: Мобільний Push (APNs / FCM)</tspan><tspan x="620.0" dy="14.3">Перевірка валідності токена пристрою</tspan></text>
<rect x="830.0" y="87.3" width="120.0" height="45.3" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">DELIVERED ✓</tspan><tspan x="890.0" dy="14.3">(ACK за 2–5 с)</tspan></text>
<line x1="368.4" y1="245.0" x2="480.0" y2="110.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="760.0" y1="110.0" x2="830.0" y2="110.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="790.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Отримано ACK</text>
<text x="558.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d48806" text-anchor="start" font-weight="700">Крок 2: Fallback при таймауті або 410 Gone (.04/SMS)</text>
<rect x="480.0" y="237.3" width="280.0" height="45.3" rx="6" fill="#fff8e6" stroke="#d48806" stroke-width="1.5"/><text x="620.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Канал 2: SMS / WhatsApp (Twilio / Meta)</tspan><tspan x="620.0" dy="14.3">Відправка на підтверджений номер</tspan></text>
<rect x="829.8" y="237.3" width="120.3" height="45.3" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">DELIVERED ✓</tspan><tspan x="890.0" dy="14.3">(DSN за 10–20 с)</tspan></text>
<line x1="620.0" y1="132.7" x2="620.0" y2="237.3" stroke="#d48806" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="690.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d48806" text-anchor="middle">Таймаут 45 с / Нема токена</text>
<line x1="760.0" y1="260.0" x2="829.8" y2="260.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="790.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">DSN delivered</text>
<text x="558.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Крок 3: Резервний канал при збої стільникової мережі</text>
<rect x="480.0" y="387.4" width="280.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="406.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Канал 3: Транзакційний Email / Voice</tspan><tspan x="620.0" dy="14.3">(AWS SES / SMTP Gateway / Рободзвінок)</tspan></text>
<rect x="830.0" y="387.4" width="120.0" height="45.3" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="406.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">DELIVERED ✓</tspan><tspan x="890.0" dy="14.3">(SMTP 250 OK)</tspan></text>
<line x1="620.0" y1="282.6" x2="620.0" y2="387.4" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">SMPP failure / Таймаут 60 с</text>
<line x1="760.0" y1="410.0" x2="830.0" y2="410.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="469.5" width="860.0" height="31.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="488.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Захист від дублювання: успішне підтвердження в попередньому каналі негайно скасовує заплановані таски наступних кроків каскаду.</tspan></text>
