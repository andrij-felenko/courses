<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння накладних витрат: Одноразові з'єднання проти HTTP Keep-Alive</text>
<rect x="30.0" y="50.0" width="425.0" height="385.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="242.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Без Keep-Alive (окремий сокет на кожен запит)</text>
<rect x="45.0" y="95.0" width="395.0" height="85.0" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/>
<text x="60.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Запит 1:</text>
<text x="60.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• TCP Handshake (SYN -&gt; SYN-ACK -&gt; ACK): 1 RTT</text>
<text x="60.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• TLS 1.3 Handshake (Keys + Cert): 1 RTT</text>
<text x="60.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• HTTP GET /api/v1/user -&gt; 200 OK: 1 RTT  |  Закриття: FIN/ACK</text>
<rect x="45.0" y="190.0" width="395.0" height="85.0" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/>
<text x="60.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Запит 2:</text>
<text x="60.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Повторний TCP Handshake на новому порту: 1 RTT</text>
<text x="60.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Повторний TLS Handshake (нова асиметрична криптографія): 1 RTT</text>
<text x="60.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• HTTP GET /api/v1/orders -&gt; 200 OK: 1 RTT  |  Закриття: FIN/ACK</text>
<rect x="45.0" y="285.0" width="395.0" height="85.0" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/>
<text x="60.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Запит 3:</text>
<text x="60.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Повторний TCP Handshake: 1 RTT</text>
<text x="60.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Повторний TLS Handshake: 1 RTT</text>
<text x="60.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• HTTP GET /api/v1/items -&gt; 200 OK: 1 RTT  |  Закриття: FIN/ACK</text>
<rect x="45.0" y="380.0" width="395.0" height="45.0" rx="5" fill="#fde8e8" stroke="#c0392b" stroke-width="1.2"/>
<text x="242.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Загальна затримка: 9 RTT (при 50 мс = 450 мс)</text>
<text x="242.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3 сокети в стані TIME_WAIT (ризик виснаження портів)</text>
<rect x="485.0" y="50.0" width="425.0" height="385.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="697.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">З Keep-Alive та пулом (одне відкрите з'єднання)</text>
<rect x="500.0" y="95.0" width="395.0" height="85.0" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/>
<text x="515.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Запит 1 (встановлення зв'язку):</text>
<text x="515.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• TCP Handshake (SYN -&gt; SYN-ACK -&gt; ACK): 1 RTT</text>
<text x="515.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• TLS 1.3 Handshake (Keys + Cert): 1 RTT</text>
<text x="515.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">• HTTP GET /api/v1/user -&gt; 200 OK: 1 RTT  |  Сокет лишається відкритим</text>
<rect x="500.0" y="190.0" width="395.0" height="85.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.0"/>
<text x="515.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Запит 2 (повторне використання каналу):</text>
<text x="515.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">• Сокет вилучається з пулу без хендшейків (0 RTT)</text>
<text x="515.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• HTTP GET /api/v1/orders -&gt; 200 OK: 1 RTT</text>
<rect x="500.0" y="285.0" width="395.0" height="85.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.0"/>
<text x="515.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Запит 3 (повторне використання каналу):</text>
<text x="515.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">• Сокет вилучається з пулу без хендшейків (0 RTT)</text>
<text x="515.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• HTTP GET /api/v1/items -&gt; 200 OK: 1 RTT</text>
<rect x="500.0" y="380.0" width="395.0" height="45.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="697.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Загальна затримка: 3 RTT (при 50 мс = 150 мс, утричі швидше)</text>
<text x="697.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 сокетів у TIME_WAIT, мінімальне навантаження на процесор</text>
<text x="470.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Keep-Alive усуває повторні TCP/TLS-рукостискання для всіх наступних HTTP-запитів</text>
</svg>