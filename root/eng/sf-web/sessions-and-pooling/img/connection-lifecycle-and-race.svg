<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл з'єднання та гонка закриття (Idle Timeout Race)</text>
<rect x="30.0" y="55.0" width="415.0" height="385.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="237.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стани сокета в пулі з'єднань</text>
<rect x="60.0" y="105.0" width="355.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="237.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. NEW (Створення сокета)</text>
<text x="237.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">DNS -&gt; TCP Connect -&gt; TLS Handshake</text>
<line x1="237.0" y1="155.0" x2="237.0" y2="175.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="60.0" y="175.0" width="355.0" height="50.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.0"/>
<text x="237.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. ACQUIRED / LEASED (Використання)</text>
<text x="237.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Відправка HTTP Request -&gt; Читання Response</text>
<line x1="237.0" y1="225.0" x2="237.0" y2="245.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="60.0" y="245.0" width="355.0" height="55.0" rx="5" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="237.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">3. IDLE (Вільний у пулі LIFO)</text>
<text x="237.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Чекає наступного запиту; цокає таймер бездіяльності</text>
<line x1="237.0" y1="300.0" x2="237.0" y2="320.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="60.0" y="320.0" width="355.0" height="50.0" rx="5" fill="#fde8e8" stroke="#c0392b" stroke-width="1.0"/>
<text x="237.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">4. CLOSED / DISCARDED (Знищення)</text>
<text x="237.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Таймаут, помилка мережі або закриття сесії</text>
<text x="237.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Повторне використання: ACQUIRED ⇄ IDLE без створення нового сокета</text>
<rect x="475.0" y="55.0" width="435.0" height="385.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="692.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Гонка тайм-ауту бездіяльності (Server Idle Timeout)</text>
<line x1="540.0" y1="110.0" x2="540.0" y2="385.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="840.0" y1="110.0" x2="840.0" y2="385.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="540.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт</text>
<text x="840.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер</text>
<text x="840.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">Таймаут 5.0с вичерпано!</text>
<line x1="840.0" y1="155.0" x2="540.0" y2="225.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="690.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">TCP FIN / RST (у польоті)</text>
<text x="540.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Потік бере сокет з пулу</text>
<line x1="540.0" y1="185.0" x2="840.0" y2="255.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="690.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">HTTP GET /data (у польоті)</text>
<rect x="495.0" y="275.0" width="395.0" height="65.0" rx="5" fill="#fde8e8" stroke="#c0392b" stroke-width="1.2"/>
<text x="692.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Зіткнення пакетів у каналі:</text>
<text x="692.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сервер отримує GET на закритому сокеті -&gt; повертає TCP RST</text>
<text x="692.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Клієнт отримує ConnectionResetError (розрив з'єднання)</text>
<rect x="495.0" y="350.0" width="395.0" height="75.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="692.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Як запобігти збою:</text>
<text x="692.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. Перевірка сокета перед запитом (Socket Health Check через poll/select)</text>
<text x="692.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">2. Автоматичний повтор (Retry) для ідемпотентних методів (GET/HEAD)</text>
<text x="470.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Асинхронне закриття сокета сервером потребує валідації каналу перед запитом та ідемпотентних повторів</text>
</svg>