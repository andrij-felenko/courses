<text x="755.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">  Гешується лише вміст {}</text>
<text x="755.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">  ➔ ко-локація на одному шарді</text>
<rect x="20.0" y="430.0" width="920.0" height="50.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="480.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Redis Cluster не використовує централізований координатор (ZooKeeper/Etcd) — стан кластера підтримується через децентралізований Gossip-протокол</text>
