<text x="490.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">RFC 7516</text>
<text x="490.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">шифрування</text>
<rect x="630.0" y="196.0" width="200.0" height="74.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="730.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">JWK</text>
<text x="730.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">RFC 7517</text>
