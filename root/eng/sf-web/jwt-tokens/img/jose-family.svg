<text x="430.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">усі шість — травень 2015; JWT не замінює JOSE, а стоїть на ньому</text>
<text x="430.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">«none» жив у самому реєстрі алгоритмів — звідти й вразливість</text>
