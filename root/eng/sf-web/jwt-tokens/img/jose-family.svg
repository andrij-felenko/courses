<text x="430.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="700">JWA — спільний словник алгоритмів · RFC 7518</text>
<text x="430.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">HS256 · RS256 · ES256 · … і фатальний «none»</text>
