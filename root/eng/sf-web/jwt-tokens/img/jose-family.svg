<text x="252.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">JWT — веб-токен · RFC 7519</text>
<text x="252.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">= JWS, чиє навантаження — JSON-твердження</text>
<rect x="50.0" y="196.0" width="200.0" height="74.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="150.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">JWS</text>
<text x="150.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">RFC 7515</text>
<text x="150.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">підпис</text>
