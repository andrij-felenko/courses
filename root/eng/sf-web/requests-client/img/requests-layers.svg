<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багаторівнева архітектура виконання запиту в requests</text>
<rect x="40.0" y="55.0" width="880.0" height="70.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="80.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Клієнтський рівень (requests API)</text>
<text x="80.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">requests.get() / requests.post()   →   requests.Session (кукі, заголовки за замовчуванням, префікси адаптерів)</text>
<rect x="40.0" y="145.0" width="880.0" height="85.0" rx="8" fill="#edf2f7" stroke="#333333" stroke-width="1.5"/>
<text x="80.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень конвеєра підготовки (Request → PreparedRequest)</text>
<text x="80.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Нормалізація URL (IDNA/Punycode + percent-encoding)  •  CaseInsensitiveDict для заголовків  •  Серіалізація тіла (JSON/form/multipart)</text>
<text x="80.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">Автоматичне обчислення Content-Length або виставлення Transfer-Encoding: chunked  •  Витягнення cookie з CookieJar</text>
<rect x="40.0" y="250.0" width="880.0" height="75.0" rx="8" fill="#ebf8fa" stroke="#0284c7" stroke-width="1.5"/>
<text x="80.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0369a1" text-anchor="start" font-weight="700">Транспортний адаптер (requests.adapters.HTTPAdapter)</text>
<text x="80.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Маршрутизація за префіксом URL (https://, http://, unix://)  •  Трансляція таймаутів (connect/read)  •  Конфігурація проксі</text>
<text x="80.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Обгортка над пулом з'єднань urllib3.PoolManager  •  Управління політикою повторів urllib3.util.Retry</text>
<rect x="40.0" y="345.0" width="880.0" height="75.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="80.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a16207" text-anchor="start" font-weight="700">Низькорівневий рушій (urllib3: PoolManager → HTTPConnectionPool)</text>
<text x="80.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Потокобезпечні черги вільних з'єднань (LifoQueue)  •  Повторне використання TCP (keep-alive)  •  TLS Context &amp; SNI</text>
<text x="80.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Перевірка ланцюжків сертифікатів через OpenSSL/certifi  •  Формування HTTP-фреймів у http.client</text>
<rect x="40.0" y="440.0" width="880.0" height="60.0" rx="8" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="80.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Операційна система й мережевий стек (OS TCP/IP Sockets)</text>
<text x="80.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Системні виклики socket(), connect(), send(), recv()  •  TCP 3-Way Handshake  •  TLS ClientHello / ServerHello</text>
