<text x="795.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">[ Socket 1: TCP/TLS активний ]</text>
<text x="795.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">[ Socket 2: TCP/TLS активний ]</text>
<text x="795.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">[ Вільний слот пулу ... ]</text>
<text x="795.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">maxsize = 10 з'єднань</text>
<rect x="685.0" y="290.0" width="220.0" height="110.0" rx="6" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
<text x="795.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повторне використання</text>
<text x="795.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Запит бере сокет з черги,</text>
<text x="795.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">відправляє HTTP, читає дані,</text>
