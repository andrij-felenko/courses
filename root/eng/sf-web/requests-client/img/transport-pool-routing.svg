<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрутизація адаптерів Session та пулу з'єднань urllib3</text>
<rect x="40.0" y="60.0" width="260.0" height="360.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">requests.Session</text>
<text x="170.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Реєстр адаптерів (adapters)</text>
<rect x="55.0" y="140.0" width="230.0" height="75.0" rx="6" fill="#edf2f7" stroke="#333333" stroke-width="1.2"/>
