<text x="170.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HTTPAdapter(pool_connections=10,</text>
<text x="170.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">            pool_maxsize=10)</text>
<rect x="55.0" y="230.0" width="230.0" height="75.0" rx="6" fill="#edf2f7" stroke="#333333" stroke-width="1.2"/>
<text x="170.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Префікс 'http://'</text>
<text x="170.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HTTPAdapter(pool_connections=10,</text>
<text x="170.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">            pool_maxsize=10)</text>
<rect x="55.0" y="320.0" width="230.0" height="80.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<text x="170.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">Префікс 'unix://' або кастомний</text>
<text x="170.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">CustomAdapter / MockAdapter</text>
<text x="170.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">session.mount('prefix://', ...)</text>
<rect x="360.0" y="60.0" width="250.0" height="360.0" rx="8" fill="#ebf8fa" stroke="#0284c7" stroke-width="1.5"/>
<text x="485.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="700">HTTPAdapter</text>
<text x="485.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">urllib3.PoolManager</text>
<rect x="375.0" y="140.0" width="220.0" height="110.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
<text x="485.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кеш пулів за (схема, хост, порт)</text>
<text x="485.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">key: ('https', 'api.io', 443)</text>
<text x="485.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">key: ('https', 'cdn.io', 443)</text>
<text x="485.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Максимум num_pools (10)</text>
