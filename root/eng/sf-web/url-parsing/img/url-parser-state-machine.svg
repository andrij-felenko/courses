<line x1="860.0" y1="160.0" x2="730.0" y2="255.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="810.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">«#»</text>
<rect x="490.0" y="250.2" width="280.0" height="59.6" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="630.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Стан: FRAGMENT</tspan><tspan x="630.0" dy="14.3">Локальний якір документа до кінця рядка</tspan><tspan x="630.0" dy="14.3">(використовується лише клієнтом)</tspan></text>
<line x1="110.0" y1="160.0" x2="110.0" y2="280.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="110.0" y1="280.0" x2="480.0" y2="280.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="260.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Без authority (наприклад mailto:, file:)</text>
</svg>