<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат розбору компонентів URL</text>
<rect x="37.3" y="80.2" width="145.4" height="59.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Стан: SCHEME</tspan><tspan x="110.0" dy="14.3">Читання схеми до «:»</tspan><tspan x="110.0" dy="14.3">(http, https, ftp)</tspan></text>
<line x1="185.0" y1="110.0" x2="275.0" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="230.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">«://»</text>
<rect x="279.8" y="80.2" width="170.5" height="59.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="365.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">Стан: AUTHORITY</tspan><tspan x="365.0" dy="14.3">Парсинг user@host:port</tspan><tspan x="365.0" dy="14.3">(перевірка IPv6 «[...]»)</tspan></text>
<line x1="450.0" y1="110.0" x2="545.0" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="498.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">«/»</text>
<rect x="555.0" y="80.2" width="150.0" height="59.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Стан: PATH</tspan><tspan x="630.0" dy="14.3">Читання сегментів</tspan><tspan x="630.0" dy="14.3">до «?» або «#»</tspan></text>
<line x1="710.0" y1="110.0" x2="795.0" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="752.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">«?»</text>
<rect x="799.8" y="80.2" width="120.3" height="59.6" rx="6" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="860.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Стан: QUERY</tspan><tspan x="860.0" dy="14.3">Пари key=val</tspan><tspan x="860.0" dy="14.3">до «#» або кінця</tspan></text>
<line x1="630.0" y1="160.0" x2="630.0" y2="240.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)"/>
