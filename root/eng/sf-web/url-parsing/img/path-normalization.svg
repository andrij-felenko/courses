<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм нормалізації відносних шляхів (remove_dot_segments)</text>
<rect x="40.0" y="65.0" width="410.0" height="235.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхідний буфер (Input Buffer)</text>
<text x="55.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Початковий шлях: «/a/b/../c/./d»</text>
<text x="55.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Сегмент «/a» переміщується у вихід</text>
<text x="55.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. Сегмент «/b» переміщується у вихід</text>
<text x="55.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4. Префікс «/..» видаляє останній сегмент</text>
<text x="55.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">5. Сегмент «/c» переміщується у вихід</text>
<text x="55.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">6. Префікс «/.» ігнорується (поточний)</text>
<text x="55.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">7. Сегмент «/d» переміщується у вихід</text>
<line x1="460.0" y1="180.0" x2="520.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Цикл</text>
<rect x="530.0" y="65.0" width="370.0" height="235.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="715.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Вихідний буфер (Output Buffer)</text>
<text x="545.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Початок: «»</text>
<text x="545.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Додано: «/a»</text>
<text x="545.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Додано: «/a/b»</text>
<text x="545.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Видалено «/b» → лишається «/a»</text>
<text x="545.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Додано: «/a/c»</text>
<text x="545.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Без змін: «/a/c»</text>
<text x="545.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Результат: «/a/c/d»</text>
<rect x="40.0" y="315.0" width="860.0" height="38.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.0"/>
<text x="470.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">RFC 3986 §5.2.4: усуває «.» та «..», запобігаючи виходу за межі кореня та Directory Traversal</text>
</svg>