<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія URL за стандартом RFC 3986</text>
<rect x="30.0" y="55.0" width="900.0" height="34.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="76.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">https://user:pass@api.example.com:8443/v1/search?query=blue%20sky&amp;sort=desc#results</tspan></text>
<rect x="40.0" y="120.2" width="140.0" height="59.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Схема (Scheme)</tspan><tspan x="110.0" dy="14.3">https</tspan><tspan x="110.0" dy="14.3">(протокол доступу)</tspan></text>
<line x1="110.0" y1="92.0" x2="110.0" y2="122.0" stroke="#2457d6" stroke-width="1.5"/>
<text x="110.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Роздільник: «:»</text>
<rect x="200.0" y="120.2" width="280.0" height="59.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Орган повноважень (Authority)</tspan><tspan x="340.0" dy="14.3">user:pass@api.example.com:8443</tspan><tspan x="340.0" dy="14.3">(користувач, хост і TCP-порт)</tspan></text>
<line x1="340.0" y1="92.0" x2="340.0" y2="122.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="340.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Префікс: «//», хост:порт</text>
<rect x="124.8" y="245.0" width="430.4" height="30.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="340.0" y="263.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">userinfo: user:pass (застаріло)  ·  host: api.example.com  ·  port: 8443</tspan></text>
<line x1="340.0" y1="220.0" x2="340.0" y2="238.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="500.0" y="120.2" width="140.0" height="59.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Шлях (Path)</tspan><tspan x="570.0" dy="14.3">/v1/search</tspan><tspan x="570.0" dy="14.3">(ієрархія ресурсу)</tspan></text>
<line x1="570.0" y1="92.0" x2="570.0" y2="122.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="570.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сегменти через «/»</text>
<rect x="638.5" y="120.2" width="183.0" height="59.6" rx="6" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="730.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Запит (Query)</tspan><tspan x="730.0" dy="14.3">query=blue%20sky&amp;sort=desc</tspan><tspan x="730.0" dy="14.3">(параметри операції)</tspan></text>
<line x1="730.0" y1="92.0" x2="730.0" y2="122.0" stroke="#7e22ce" stroke-width="1.5"/>
<text x="730.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Початок: «?», пари «&amp;»</text>
<rect x="810.4" y="120.2" width="139.1" height="59.6" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="880.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Фрагмент (Fragment)</tspan><tspan x="880.0" dy="14.3">results</tspan><tspan x="880.0" dy="14.3">(якір клієнта)</tspan></text>
<line x1="880.0" y1="92.0" x2="880.0" y2="122.0" stroke="#b45309" stroke-width="1.5"/>
<text x="880.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Початок: «#» (не йде в HTTP)</text>
<rect x="40.0" y="310.0" width="880.0" height="36.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="480.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Загальний синтаксис: URI = scheme &quot;:&quot; [ &quot;//&quot; authority ] path [ &quot;?&quot; query ] [ &quot;#&quot; fragment ]</text>
</svg>