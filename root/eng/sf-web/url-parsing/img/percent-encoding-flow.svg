<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр відсоткового кодування (Percent-Encoding %XX)</text>
<rect x="40.0" y="65.2" width="180.0" height="59.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Вхідний символ / рядок</tspan><tspan x="130.0" dy="14.3">«Київ» або «пробіл»</tspan><tspan x="130.0" dy="14.3">(Юнікод-текст)</tspan></text>
<line x1="225.0" y1="95.0" x2="290.0" y2="95.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="258.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">UTF-8</text>
<rect x="298.5" y="65.2" width="183.0" height="59.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="390.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Послідовність байтів UTF-8</tspan><tspan x="390.0" dy="14.3">'К' = 0xD0 0x9A</tspan><tspan x="390.0" dy="14.3">' ' = 0x20</tspan></text>
<line x1="485.0" y1="95.0" x2="550.0" y2="95.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="518.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Аналіз</text>
<rect x="570.0" y="65.2" width="220.0" height="59.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Класифікація символу</tspan><tspan x="680.0" dy="14.3">Незарезервований чи</tspan><tspan x="680.0" dy="14.3">потребує екранування?</tspan></text>
<line x1="620.0" y1="140.0" x2="480.0" y2="220.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ALPHA / DIGIT / - . _ ~</text>
<line x1="740.0" y1="140.0" x2="780.0" y2="220.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="800.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Роздільники, пробіл, UTF-8</text>
<rect x="290.0" y="230.2" width="240.0" height="59.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Незарезервовані (Unreserved)</tspan><tspan x="410.0" dy="14.3">Залишаються без змін</tspan><tspan x="410.0" dy="14.3">'A' → 'A', '5' → '5', '-' → '-'</tspan></text>
<rect x="640.0" y="230.2" width="260.0" height="59.6" rx="6" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="770.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Екрановані байти (%HH)</tspan><tspan x="770.0" dy="14.3">Кожен байт стає %XX</tspan><tspan x="770.0" dy="14.3">0xD0 0x9A → %D0%9A, 0x20 → %20</tspan></text>
<rect x="40.0" y="330.0" width="860.0" height="36.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="470.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило: кодується не абстрактний «гліф», а окремі байти його UTF-8 представлення</text>
</svg>