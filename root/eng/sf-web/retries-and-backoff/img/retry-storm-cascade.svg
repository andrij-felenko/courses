<text x="125.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1000 клієнтів</text>
<text x="125.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Тайм-аут запиту</text>
<text x="125.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Негайний retry: ×3</text>
<text x="125.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 мс паузи</text>
<rect x="295.0" y="130.0" width="150.0" height="110.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
