<line x1="665.0" y1="210.0" x2="760.0" y2="210.0" stroke="#27ae60" stroke-width="1.0" marker-end="url(#arrow)"/>
<text x="712.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Розмитий потік</text>
<rect x="514.5" y="293.9" width="395.0" height="92.2" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/><text x="712.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="712.0" dy="0.0">Стабілізація системи:</tspan><tspan x="712.0" dy="14.3">1. Кожен клієнт відступає з експоненційним зростанням.</tspan><tspan x="712.0" dy="14.3">2. Випадкове тремтіння (Jitter) ліквідує синхронні піки.</tspan><tspan x="712.0" dy="14.3">3. Сервер встигає звільнити сокети та завершити транзакції.</tspan><tspan x="712.0" dy="14.3">4. Повторні спроби успішно проходять без перевантаження.</tspan></text>
</svg>