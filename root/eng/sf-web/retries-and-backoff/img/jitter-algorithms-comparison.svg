<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритми випадкового тремтіння: розподіл затримок для спроб i = 1, 2, 3</text>
<rect x="30.0" y="55.0" width="900.0" height="95.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="45.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">1. Pure Exponential (без Jitter)</text>
<text x="310.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">t = min(max_backoff, base · 2ⁱ)</text>
<text x="45.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Фіксований детермінований час</text>
<text x="45.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Синхронізація: клієнти б'ють одночасно точними хвилями</text>
<text x="590.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Діапазони затримок:</text>
<line x1="600.0" y1="70.0" x2="880.0" y2="70.0" stroke="#e5e7eb" stroke-width="1.0"/>
<circle cx="622.0" cy="87.0" r="4.0" fill="#c0392b" stroke="#333333" stroke-width="1.0"/>
<text x="630.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=1: 100 мс</text>
<circle cx="644.0" cy="105.0" r="4.0" fill="#c0392b" stroke="#333333" stroke-width="1.0"/>
<text x="652.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=2: 200 мс</text>
<circle cx="688.0" cy="123.0" r="4.0" fill="#c0392b" stroke="#333333" stroke-width="1.0"/>
<text x="696.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=3: 400 мс</text>
<rect x="30.0" y="160.0" width="900.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="45.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2. Full Jitter (Повний джитер)</text>
<text x="310.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">t = Uniform(0, min(max_backoff, base · 2ⁱ))</text>
<text x="45.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Рівномірно від 0 до верхньої межі</text>
<text x="45.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Максимальне розсіювання: найменше пікове навантаження на сервер</text>
<text x="590.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Діапазони затримок:</text>
<line x1="600.0" y1="175.0" x2="880.0" y2="175.0" stroke="#e5e7eb" stroke-width="1.0"/>
<rect x="600.0" y="188.0" width="22.0" height="8.0" rx="3" fill="#27ae60" stroke="none" stroke-width="1.5"/>
<text x="630.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=1: 0..100 мс</text>
<rect x="600.0" y="206.0" width="44.0" height="8.0" rx="3" fill="#27ae60" stroke="none" stroke-width="1.5"/>
<text x="652.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=2: 0..200 мс</text>
<rect x="600.0" y="224.0" width="88.0" height="8.0" rx="3" fill="#27ae60" stroke="none" stroke-width="1.5"/>
<text x="696.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=3: 0..400 мс</text>
<rect x="30.0" y="265.0" width="900.0" height="95.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="45.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">3. Equal Jitter (Рівний джитер)</text>
<text x="310.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">t = half + Uniform(0, half), де half = min/2</text>
<text x="45.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Гарантована основа + випадкова добавка</text>
<text x="45.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Уникає нульових затримок, зберігаючи помірне розсіювання</text>
<text x="590.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Діапазони затримок:</text>
<line x1="600.0" y1="280.0" x2="880.0" y2="280.0" stroke="#e5e7eb" stroke-width="1.0"/>
<rect x="611.0" y="293.0" width="11.0" height="8.0" rx="3" fill="#2457d6" stroke="none" stroke-width="1.5"/>
<text x="630.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=1: 50..100 мс</text>
<rect x="622.0" y="311.0" width="22.0" height="8.0" rx="3" fill="#2457d6" stroke="none" stroke-width="1.5"/>
<text x="652.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=2: 100..200 мс</text>
<rect x="644.0" y="329.0" width="44.0" height="8.0" rx="3" fill="#2457d6" stroke="none" stroke-width="1.5"/>
<text x="696.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=3: 200..400 мс</text>
<rect x="30.0" y="370.0" width="900.0" height="95.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.2"/>
<text x="45.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700">4. Decorrelated Jitter (Декорельований)</text>
<text x="310.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">t = min(max_backoff, Uniform(base, prev · 3))</text>
<text x="45.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Випадкове блукання від попередньої паузи</text>
<text x="45.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Повна незалежність від номерів спроб і відсутність кластеризації</text>
<text x="590.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Діапазони затримок:</text>
<line x1="600.0" y1="385.0" x2="880.0" y2="385.0" stroke="#e5e7eb" stroke-width="1.0"/>
<rect x="622.0" y="398.0" width="44.0" height="8.0" rx="3" fill="#8e44ad" stroke="none" stroke-width="1.5"/>
<text x="674.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=1: 100..300 мс</text>
<rect x="622.0" y="416.0" width="110.0" height="8.0" rx="3" fill="#8e44ad" stroke="none" stroke-width="1.5"/>
<text x="740.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=2: 100..600 мс</text>
<rect x="622.0" y="434.0" width="242.0" height="8.0" rx="3" fill="#8e44ad" stroke="none" stroke-width="1.5"/>
<text x="865.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">i=3: 100..1200 мс</text>
</svg>