<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="980.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="500.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія захисту бекенда: Асинхронна буферизація запитів та наскрізний протитиск</text>
<rect x="40.0" y="80.0" width="220.0" height="360.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="150.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Повільний клієнт (3G)</text>
<text x="150.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Швидкість віддачі: 25 КБ/с</tspan><tspan x="150.0" dy="14.9">Втрати пакетів: 4%</tspan><tspan x="150.0" dy="14.9">Передача тіла 2 МБ: 80 сек</tspan><tspan x="150.0" dy="14.9"></tspan><tspan x="150.0" dy="14.9">Якби підключався напряму —</tspan><tspan x="150.0" dy="14.9">заблокував би робочий</tspan><tspan x="150.0" dy="14.9">потік бекенда на 80 с</tspan></text>
<rect x="60.0" y="320.0" width="180.0" height="95.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="150.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">TCP Send Buffer</text>
<text x="150.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вікно прийому: 64 КБ</text>
<text x="150.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Отримує ACK порціями</text>
<rect x="330.0" y="80.0" width="340.0" height="360.0" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.5"/>
<text x="500.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#86198f" text-anchor="middle" font-weight="700">Зворотний проксі (Асинхронний I/O)</text>
<rect x="377.1" y="137.3" width="245.7" height="45.3" rx="6" fill="#ffffff" stroke="#e879f9" stroke-width="1.5"/><text x="500.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">1. Подієвий цикл (epoll / kqueue)</tspan><tspan x="500.0" dy="14.3">Читка чанками без блокування потоків</tspan></text>
<rect x="370.9" y="205.2" width="258.3" height="59.6" rx="6" fill="#ffffff" stroke="#e879f9" stroke-width="1.5"/><text x="500.0" y="224.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">2. Кільцевий буфер пам'яті</tspan><tspan x="500.0" dy="14.3">Накопичення повного HTTP-запиту;</tspan><tspan x="500.0" dy="14.3">При переповненні RAM — скидання на SSD</tspan></text>
<rect x="370.9" y="283.1" width="258.3" height="73.9" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="500.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">3. Протитиск (Backpressure)</tspan><tspan x="500.0" dy="14.3">Якщо клієнт повільно читає відповідь —</tspan><tspan x="500.0" dy="14.3">зупинка читання з сокета бекенда</tspan><tspan x="500.0" dy="14.3">(TCP ZeroWindow probing)</tspan></text>
<rect x="370.9" y="377.4" width="258.3" height="45.3" rx="6" fill="#ffffff" stroke="#e879f9" stroke-width="1.5"/><text x="500.0" y="396.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">4. Пул Keep-Alive з'єднань</tspan><tspan x="500.0" dy="14.3">Запит летить у вже відкритий TCP-канал</tspan></text>
<line x1="265.0" y1="175.0" x2="325.0" y2="175.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">Повільний потік (25 КБ/с)</text>
<line x1="325.0" y1="335.0" x2="265.0" y2="335.0" stroke="#e11d48" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#be123c" text-anchor="middle">Зменшення TCP Window</text>
<rect x="740.0" y="80.0" width="220.0" height="360.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="850.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Бекенд застосунку</text>
<text x="850.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Локальна мережа: 10 Гбіт/с</tspan><tspan x="850.0" dy="14.9">Затримка LAN: &lt; 0.2 мс</tspan><tspan x="850.0" dy="14.9">Обробка запиту: 4 мс</tspan><tspan x="850.0" dy="14.9"></tspan><tspan x="850.0" dy="14.9">Отримує ПОВНІСТЮ</tspan><tspan x="850.0" dy="14.9">зібраний запит;</tspan><tspan x="850.0" dy="14.9">Одразу повертає відповідь</tspan><tspan x="850.0" dy="14.9">й звільняє потік</tspan></text>
<rect x="760.0" y="320.0" width="180.0" height="95.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="850.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Пул обробників</text>
<text x="850.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">100% завантаження CPU</text>
<text x="850.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Нуль часу на очікування I/O</text>
<line x1="675.0" y1="235.0" x2="735.0" y2="235.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="705.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Миттєва передача (4 мс)</text>
<line x1="735.0" y1="275.0" x2="675.0" y2="275.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="705.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Швидка HTTP-відповідь</text>
</svg>