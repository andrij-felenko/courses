<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="980.0" height="500.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="500.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математичні моделі балансування: Від найменших з'єднань до P2C та хеш-кільця</text>
<rect x="30.0" y="70.0" width="460.0" height="200.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="260.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">1. Round Robin та Least Connections</text>
<rect x="75.2" y="125.5" width="139.7" height="69.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="145.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Round Robin (RR):</tspan><tspan x="145.0" dy="13.0">Циклічний лічильник:</tspan><tspan x="145.0" dy="13.0">i = (i + 1) % N</tspan><tspan x="145.0" dy="13.0">• Ігнорує вагу запиту</tspan></text>
<rect x="277.4" y="125.5" width="185.3" height="69.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="370.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Least Connections (LC):</tspan><tspan x="370.0" dy="13.0">Обирає сервер із:</tspan><tspan x="370.0" dy="13.0">min(активні_з'єднання / вага)</tspan><tspan x="370.0" dy="13.0">• Ризик «ефекту отари»</tspan></text>
<text x="260.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">Проблема LC: незалежні проксі одночасно обирають один і той самий вузол</text>
<rect x="510.0" y="70.0" width="460.0" height="200.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="740.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">2. Power of Two Random Choices (P2C)</text>
<rect x="561.9" y="110.5" width="356.3" height="69.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="740.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Алгоритм P2C (Azar et al.):</tspan><tspan x="740.0" dy="13.0">1. Випадково обрати два вузли: A та B з пулу N</tspan><tspan x="740.0" dy="13.0">2. Порівняти їхнє навантаження (активні з'єднання або EWMA)</tspan><tspan x="740.0" dy="13.0">3. Направити запит вузлу з меншим навантаженням</tspan></text>
<rect x="522.0" y="192.0" width="436.1" height="56.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="740.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Математичний ефект:</tspan><tspan x="740.0" dy="13.0">Максимальна довжина черги падає з O(ln N / ln ln N) до O(ln ln N / ln 2)!</tspan><tspan x="740.0" dy="13.0">Повністю ліквідує синхронізацію між незалежними проксі</tspan></text>
<rect x="30.0" y="290.0" width="940.0" height="200.0" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.5"/>
<text x="500.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#86198f" text-anchor="middle" font-weight="700">3. Узгоджене кільцеве хешування (Consistent Hashing з Virtual Nodes)</text>
<circle cx="170.0" cy="400.0" r="60.0" fill="#ffffff" stroke="#a855f7" stroke-width="2.0"/>
<text x="170.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Простір хешів</text>
<text x="170.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">[0 .. 2³² - 1]</text>
<circle cx="170.0" cy="340.0" r="6.0" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="170.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Node1-v1</text>
<circle cx="230.0" cy="400.0" r="6.0" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
<text x="265.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Node2-v1</text>
<circle cx="170.0" cy="460.0" r="6.0" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
<text x="170.0" y="479.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Node3-v1</text>
<circle cx="110.0" cy="400.0" r="6.0" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="75.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Node1-v2</text>
<rect x="349.2" y="359.0" width="521.6" height="82.0" rx="6" fill="#ffffff" stroke="#e879f9" stroke-width="1.5"/><text x="610.0" y="377.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Властивості узгодженого хешування:</tspan><tspan x="610.0" dy="13.0">• Ключ (User ID / Session Cookie / URL) проектується на кільце хеш-функцією (xxHash)</tspan><tspan x="610.0" dy="13.0">• Запит направляється на перший вузол за годинниковою стрілкою (Binary Search у vnodes)</tspan><tspan x="610.0" dy="13.0">• Додавання або видалення сервера переміщує лише 1/N частину ключів (замість 100%)</tspan><tspan x="610.0" dy="13.0">• Віртуальні ноди (100–256 на фізичний сервер) ліквідують дисперсію та гарантують баланс</tspan></text>
</svg>