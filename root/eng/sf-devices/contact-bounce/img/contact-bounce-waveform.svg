<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="36" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Електричні перехідні процеси під час замикання механічного контакту</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Пружний відскок пластин утворює серію хаотичних мікроперемикань тривалістю від 1 до 20 мс</text>

  <!-- Time Axis -->
  <line x1="100" y1="360" x2="880" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="890" y="364" font-size="12" fill="#1a1a1a">Час t</text>

  <!-- Voltage Axis -->
  <line x1="120" y1="380" x2="120" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="110" y="85" font-size="12" fill="#1a1a1a" text-anchor="end">Напруга U</text>

  <!-- Voltage Threshold Levels -->
  <line x1="120" y1="130" x2="860" y2="130" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="134" font-size="12" fill="#6b7280" text-anchor="end">V_CC (3.3V)</text>

  <line x1="120" y1="210" x2="860" y2="210" stroke="#2457d6" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="214" font-size="11" fill="#2457d6" text-anchor="end">V_IH (поріг 1)</text>

  <line x1="120" y1="280" x2="860" y2="280" stroke="#2457d6" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="284" font-size="11" fill="#2457d6" text-anchor="end">V_IL (поріг 0)</text>

  <!-- Highlight Bounce Region -->
  <rect x="250" y="110" width="300" height="230" fill="#fdecea" opacity="0.6"/>
  <text x="400" y="125" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Зона механічного брязкіту (1 - 10 мс)</text>

  <!-- Waveform Path -->
  <!-- Open state: high (y=130) from x=120 to x=250 -->
  <!-- Bounce pulses between x=250 and x=550 -->
  <!-- Settled low (y=340) after x=550 -->
  <path d="M 120 130 L 250 130 
           L 255 340 L 265 340 L 270 140 L 285 140 
           L 290 340 L 310 340 L 315 150 L 330 150 
           L 335 340 L 370 340 L 375 160 L 390 160 
           L 395 340 L 440 340 L 445 190 L 460 190 
           L 465 340 L 510 340 L 515 230 L 525 230 
           L 530 340 L 860 340" 
        fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Annotations -->
  <text x="180" y="150" font-size="12" fill="#1a1a1a" text-anchor="middle">Кнопка відкрита (HIGH)</text>
  <text x="700" y="325" font-size="12" fill="#27ae60" text-anchor="middle">Стабільний контакт (LOW)</text>

  <!-- Glitch multiple trigger note -->
  <rect x="260" y="380" width="280" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="400" y="396" font-size="11" fill="#c0392b" text-anchor="middle">Хибні спрацьовування переривань:</text>
  <text x="400" y="411" font-size="11" fill="#1a1a1a" text-anchor="middle">напруга багаторазово перетинає V_IH / V_IL</text>
</svg>