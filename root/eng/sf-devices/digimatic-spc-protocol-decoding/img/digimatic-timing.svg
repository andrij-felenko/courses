<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Часова діаграма транзакції протоколу Digimatic</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#6b7280">Апаратне квитування REQ / READY та синхронне стробування даних за спадним фронтом CLK</text>

  <!-- Main Timing Diagram Box -->
  <rect x="25" y="74" width="910" height="306" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Header Column -->
  <line x1="185" y1="84" x2="185" y2="370" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Signal Labels -->
  <!-- REQ -->
  <text x="40" y="112" font-size="14" font-weight="700" fill="#2457d6">REQ</text>
  <text x="40" y="128" font-size="12" fill="#6b7280">Запит хоста (~REQ)</text>

  <!-- READY -->
  <text x="40" y="167" font-size="14" font-weight="700" fill="#1a1a1a">READY</text>
  <text x="40" y="183" font-size="12" fill="#6b7280">Готовність (~RD)</text>

  <!-- CLK -->
  <text x="40" y="247" font-size="14" font-weight="700" fill="#1a1a1a">CLK</text>
  <text x="40" y="263" font-size="12" fill="#6b7280">Такти приладу</text>

  <!-- DATA -->
  <text x="40" y="324" font-size="14" font-weight="700" fill="#27ae60">DATA</text>
  <text x="40" y="340" font-size="12" fill="#6b7280">Дані (52 біти BCD)</text>

  <!-- ================= TIME INTERVALS & ANNOTATIONS ================= -->
  <!-- t_REQ pulse dimension -->
  <line x1="230" y1="94" x2="295" y2="94" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="262" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">t_REQ &gt; 100 мкс</text>

  <!-- t_resp delay dimension (REQ fall to READY fall) -->
  <line x1="230" y1="145" x2="265" y2="145" stroke="#6b7280" stroke-width="1.2" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="247" y="141" text-anchor="middle" font-size="12" fill="#6b7280">t_resp</text>

  <!-- Period T_CLK dimension -->
  <line x1="425" y1="232" x2="495" y2="232" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="460" y="228" text-anchor="middle" font-size="12" fill="#1a1a1a">T_CLK ≈ 100–300 мкс</text>

  <!-- Sampling Edge Banner / Label -->
  <text x="357" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Спадний фронт CLK (Sample ↓)</text>

  <!-- ================= SIGNAL WAVEFORMS ================= -->
  <!-- REQ Waveform: Idle HIGH (102), Active LOW (132) -->
  <path d="M 195,102 L 230,102 L 230,132 L 295,132 L 295,102 L 915,102" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- READY Waveform: Idle HIGH (157), Active LOW (187) -->
  <path d="M 195,157 L 265,157 L 265,187 L 785,187 L 785,157 L 915,157" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- CLK Waveform: Idle HIGH (240), Active LOW (270) -->
  <!-- 4 Clocks for Nibble 0 -->
  <path d="M 195,240 L 340,240 L 340,270 L 375,270 L 375,240 L 410,240 L 410,270 L 445,270 L 445,240 L 480,240 L 480,270 L 515,270 L 515,240 L 550,240 L 550,270 L 585,270 L 585,240 L 610,240" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  
  <!-- CLK Waveform break and Clock 52 -->
  <path d="M 685,240 L 710,240 L 710,270 L 745,270 L 745,240 L 915,240" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Break Indicators on waveforms: CLK break -->
  <line x1="605" y1="234" x2="615" y2="246" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="685" y1="234" x2="695" y2="246" stroke="#6b7280" stroke-width="1.5"/>
  <text x="650" y="244" text-anchor="middle" font-size="12" fill="#6b7280">···</text>
  <text x="650" y="224" text-anchor="middle" font-size="12" fill="#6b7280">52 такти CLK</text>

  <!-- DATA Cells (Nibble 0: bits 0..3) -->
  <!-- Bit 0 -->
  <rect x="322" y="316" width="70" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="357" y="333" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">b0 = 1</text>
  <text x="357" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">Біт 0 (LSB)</text>

  <!-- Bit 1 -->
  <rect x="392" y="316" width="70" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="427" y="333" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">b1 = 1</text>
  <text x="427" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">Біт 1</text>

  <!-- Bit 2 -->
  <rect x="462" y="316" width="70" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="497" y="333" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">b2 = 1</text>
  <text x="497" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">Біт 2</text>

  <!-- Bit 3 -->
  <rect x="532" y="316" width="70" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="567" y="333" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">b3 = 1</text>
  <text x="567" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">Біт 3 (MSB)</text>

  <!-- DATA Break and Bit 51 -->
  <line x1="605" y1="323" x2="615" y2="335" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="685" y1="323" x2="695" y2="335" stroke="#6b7280" stroke-width="1.5"/>
  <text x="650" y="333" text-anchor="middle" font-size="12" fill="#6b7280">···</text>
  <text x="650" y="358" text-anchor="middle" font-size="12" fill="#6b7280">13 ніблів BCD</text>

  <!-- Bit 51 -->
  <rect x="692" y="316" width="70" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="727" y="333" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">b51</text>
  <text x="727" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">Біт 51 (d12)</text>

  <!-- Idle DATA line -->
  <line x1="195" y1="329" x2="318" y2="329" stroke="#27ae60" stroke-width="2"/>
  <line x1="766" y1="329" x2="915" y2="329" stroke="#27ae60" stroke-width="2"/>

  <!-- ================= FALLING EDGE SAMPLE STROBES ================= -->
  <!-- Strobe 1 at x = 340 -->
  <line x1="340" y1="218" x2="340" y2="312" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="340" cy="240" r="3" fill="#2457d6"/>
  <path d="M 336,306 L 340,314 L 344,306" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- t_hold dimension -->
  <line x1="342" y1="288" x2="390" y2="288" stroke="#27ae60" stroke-width="1.2" marker-start="url(#arr-green-rev)" marker-end="url(#arr-green)"/>
  <text x="366" y="284" text-anchor="middle" font-size="12" fill="#27ae60">t_hold</text>

  <!-- Strobe 2 at x = 410 -->
  <line x1="410" y1="240" x2="410" y2="312" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="410" cy="240" r="3" fill="#2457d6"/>
  <path d="M 406,306 L 410,314 L 414,306" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Strobe 3 at x = 480 -->
  <line x1="480" y1="240" x2="480" y2="312" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="480" cy="240" r="3" fill="#2457d6"/>
  <path d="M 476,306 L 480,314 L 484,306" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Strobe 4 at x = 550 -->
  <line x1="550" y1="240" x2="550" y2="312" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="550" cy="240" r="3" fill="#2457d6"/>
  <path d="M 546,306 L 550,314 L 554,306" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Strobe 52 at x = 710 -->
  <line x1="710" y1="240" x2="710" y2="312" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="710" cy="240" r="3" fill="#2457d6"/>
  <path d="M 706,306 L 710,314 L 714,306" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- ================= THREE BOTTOM EXPLANATION CARDS ================= -->
  <!-- Card 1: Handshake -->
  <rect x="25" y="396" width="290" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="33" y="402" width="274" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">1. Апаратний запит (REQ / READY)</text>
  <text x="40" y="442" font-size="12"><tspan font-weight="700" fill="#1a1a1a">• Імпульс REQ: </tspan><tspan fill="#6b7280">МК спадає в 0 (t &gt; 100 мкс)</tspan></text>
  <text x="40" y="460" font-size="12"><tspan font-weight="700" fill="#1a1a1a">• Стан READY: </tspan><tspan fill="#6b7280">відповідь приладу нулем</tspan></text>
  <text x="40" y="478" font-size="12" fill="#6b7280">Затримка пробудження t_resp ≈ 0,5–1,2 мс</text>

  <!-- Card 2: Sampling & Clocking -->
  <rect x="335" y="396" width="290" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="343" y="402" width="274" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">2. Синхронізація та фіксація бітів</text>
  <text x="350" y="442" font-size="12"><tspan font-weight="700" fill="#1a1a1a">• Спадний фронт CLK: </tspan><tspan fill="#6b7280">стробування DATA</tspan></text>
  <text x="350" y="460" font-size="12"><tspan font-weight="700" fill="#1a1a1a">• Стабільність: </tspan><tspan fill="#6b7280">запас t_setup та t_hold</tspan></text>
  <text x="350" y="478" font-size="12" fill="#6b7280">Пачка 52 тактів: 13 ніблів BCD (LSB-first)</text>

  <!-- Card 3: Completion -->
  <rect x="645" y="396" width="290" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="653" y="402" width="274" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="790" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">3. Завершення кадру та пауза</text>
  <text x="660" y="442" font-size="12"><tspan font-weight="700" fill="#1a1a1a">• Звільнення шини: </tspan><tspan fill="#6b7280">READY повертається в '1'</tspan></text>
  <text x="660" y="460" font-size="12"><tspan font-weight="700" fill="#1a1a1a">• Інтервал t_gap: </tspan><tspan fill="#6b7280">пауза між кадрами &gt; 2 мс</tspan></text>
  <text x="660" y="478" font-size="12" fill="#6b7280">Захист від накладання та скидання FSM</text>

</svg>
