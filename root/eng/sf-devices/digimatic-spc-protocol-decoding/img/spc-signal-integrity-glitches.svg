<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Дефекти форми сигналу в інтерфейсах SPC та Digimatic</text>
  <text x="480" y="50" font-size="13" text-anchor="middle" fill="#6b7280">Вплив індуктивності кабелю, наведень та паразитної ємності на часові параметри передачі</text>
  <rect x="30" y="68" width="900" height="106" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="90" font-size="13" font-weight="700" fill="#2457d6">Ідеальний протокол SPC (детерміновані строби та стабільні рівні)</text>
  <text x="560" y="90" font-size="12" fill="#6b7280">Стабільне вікно зчитування (t_setup &gt; 100 мкс)</text>
  <text x="50" y="122" font-size="12" font-weight="700" fill="#1a1a1a">CLK</text>
  <path d="M 120,132 H 170 V 104 H 230 V 132 H 290 V 104 H 350 V 132 H 410 V 104 H 470 V 132 H 530 V 104 H 590 V 132 H 650 V 104 H 710 V 132 H 880" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="50" y="156" font-size="12" font-weight="700" fill="#1a1a1a">DATA</text>
  <path d="M 120,162 H 290 V 142 H 530 V 162 H 710 V 142 H 880" fill="none" stroke="#2457d6" stroke-width="2"/>
  <rect x="30" y="186" width="900" height="176" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="50" y="206" font-size="13" font-weight="700" fill="#c0392b">Реальна лінія: дзвін, глітчі та спотворення тривалості імпульсів</text>
  <text x="50" y="238" font-size="12" font-weight="700" fill="#1a1a1a">CLK (шум)</text>
  <text x="210" y="222" font-size="11" fill="#c0392b">Дзвін (L × dI/dt)</text>
  <line x1="120" y1="245" x2="880" y2="245" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="888" y="249" font-size="11" fill="#c0392b">V_th</text>
  <path d="M 120,258 H 168 L 172,228 L 176,242 L 180,230 L 184,236 L 190,232 H 230 L 233,264 L 237,254 L 241,260 H 270 L 273,238 L 276,258 H 290 L 294,228 L 298,236 H 350 L 354,258 H 410 L 414,228 H 470 L 474,258 H 530 L 534,228 H 590 L 594,258 H 650 L 654,228 H 710 L 714,258 H 880" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="270" y="276" font-size="11" fill="#c0392b">ВЧ-викид (глітч &gt; V_th)</text>
  <text x="50" y="316" font-size="12" font-weight="700" fill="#1a1a1a">DATA (RC)</text>
  <line x1="120" y1="318" x2="880" y2="318" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M 120,332 H 290 C 320,332 345,310 365,302 H 530 C 555,302 575,325 595,332 H 710 C 735,332 760,310 780,302 H 880" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="360" y="348" font-size="11" fill="#c0392b">Завал фронту через ємність кабелю (t_rise &gt; 50 мкс)</text>
  <rect x="30" y="374" width="900" height="92" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="50" y="396" font-size="13" font-weight="700" fill="#27ae60">Методи захисту від дефектів лінії</text>
  <rect x="50" y="408" width="270" height="46" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="65" y="426" font-size="12" font-weight="700" fill="#1a1a1a">Тригер Шмітта на GPIO</text>
  <text x="65" y="442" font-size="11" fill="#6b7280">Гістерезис блокує дзвін на порозі</text>
  <rect x="345" y="408" width="270" height="46" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="360" y="426" font-size="12" font-weight="700" fill="#1a1a1a">RC-фільтрація сигналів</text>
  <text x="360" y="442" font-size="11" fill="#6b7280">R=100..470 Ом, C=100 пФ зрізають глітчі</text>
  <rect x="640" y="408" width="270" height="46" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="655" y="426" font-size="12" font-weight="700" fill="#1a1a1a">Стробування за таймером</text>
  <text x="655" y="442" font-size="11" fill="#6b7280">Зчитування в центрі стабільного біта</text>
</svg>
