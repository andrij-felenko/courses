<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="38" fill="#1a1a1a" font-size="18" font-weight="bold" text-anchor="middle">Часові діаграми сигналів протоколів Digimatic 52-bit та 24-bit SPC</text>
  <text x="480" y="60" fill="#6b7280" font-size="13" text-anchor="middle">Співвідношення ліній REQ, CLK та DATA: синхронізація за спадним фронтом та формат пакетів</text>

  <rect x="40" y="80" width="880" height="180" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="104" fill="#1a1a1a" font-size="13" font-weight="bold">1. Протокол Mitutoyo Digimatic (52 біти / 13 ніблів BCD, опитування хостом через REQ)</text>

  <text x="60" y="132" fill="#2457d6" font-size="12" font-weight="bold">REQ</text>
  <text x="95" y="132" fill="#6b7280" font-size="12">(Запит від хоста)</text>
  <path d="M 210,124 L 250,124 L 250,142 L 350,142 L 350,124 L 880,124" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="300" y="156" fill="#2457d6" font-size="11" text-anchor="middle">Імпульс запиту REQ (t &gt; 100 мкс)</text>

  <text x="60" y="180" fill="#1a1a1a" font-size="12" font-weight="bold">CLK</text>
  <text x="95" y="180" fill="#6b7280" font-size="12">(Такти інструмента)</text>
  <path d="M 210,172 L 330,172 L 330,190 L 350,190 L 350,172 L 370,172 L 370,190 L 390,190 L 390,172 L 410,172 L 410,190 L 430,190 L 430,172 L 460,172" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 750,172 L 770,172 L 770,190 L 790,190 L 790,172 L 880,172" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="605" y="176" fill="#6b7280" font-size="12" text-anchor="middle">52 такти CLK (період ~1 мс / частота 1 кГц)</text>

  <text x="60" y="226" fill="#27ae60" font-size="12" font-weight="bold">DATA</text>
  <text x="100" y="226" fill="#6b7280" font-size="12">(Дані BCD)</text>
  <rect x="230" y="212" width="110" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="285" y="228" fill="#2457d6" font-size="11" font-weight="bold" text-anchor="middle">Ніблі 1–4: 0xF</text>
  <rect x="350" y="212" width="250" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="475" y="228" fill="#27ae60" font-size="11" font-weight="bold" text-anchor="middle">Ніблі 5–11: Знак + 6 BCD цифр</text>
  <rect x="610" y="212" width="120" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="670" y="228" fill="#2457d6" font-size="11" font-weight="bold" text-anchor="middle">Нібель 12: Кома</text>
  <rect x="740" y="212" width="130" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="805" y="228" fill="#c0392b" font-size="11" font-weight="bold" text-anchor="middle">Нібель 13: мм/дюйм</text>

  <rect x="40" y="280" width="880" height="170" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="304" fill="#1a1a1a" font-size="13" font-weight="bold">2. Протокол 24-bit SPC (Штангенциркулі та індикатори, безперервна циклічна передача)</text>

  <text x="60" y="344" fill="#1a1a1a" font-size="12" font-weight="bold">CLK</text>
  <text x="95" y="344" fill="#6b7280" font-size="12">(Періодичні пачки)</text>
  <path d="M 210,336 L 240,336 L 240,352 L 255,352 L 255,336 L 270,336 L 270,352 L 285,352 L 285,336 L 300,336 L 300,352 L 315,352 L 315,336 L 340,336" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="440" y="346" fill="#6b7280" font-size="12" text-anchor="middle">Пачка 24 такти (період ~13–20 мкс, пауза ~300 мс)</text>
  <path d="M 540,336 L 565,336 L 565,352 L 580,352 L 580,336 L 595,336 L 595,352 L 610,352 L 610,336 L 880,336" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <text x="60" y="398" fill="#27ae60" font-size="12" font-weight="bold">DATA</text>
  <text x="100" y="398" fill="#6b7280" font-size="12">(Біти LSB-first)</text>
  <rect x="230" y="384" width="280" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="370" y="400" fill="#27ae60" font-size="11" font-weight="bold" text-anchor="middle">Біти 0–19: Двійкове значення (0.01 мм)</text>
  <rect x="520" y="384" width="140" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="590" y="400" fill="#c0392b" font-size="11" font-weight="bold" text-anchor="middle">Біт 20: Знак (0:+, 1:-)</text>
  <rect x="670" y="384" width="160" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="750" y="400" fill="#2457d6" font-size="11" font-weight="bold" text-anchor="middle">Біти 21–23: Режим (мм/дюйм)</text>

  <text x="480" y="436" fill="#6b7280" font-size="12" text-anchor="middle">Обидва протоколи фіксують стан лінії DATA за спадним фронтом сигналу CLK (Falling Edge Latch)</text>
</svg>
