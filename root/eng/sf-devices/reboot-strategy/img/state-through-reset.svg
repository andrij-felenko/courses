<text x="287.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="287.0" dy="0.0">причину, лічильник,</tspan><tspan x="287.0" dy="12.3">prapor safe mode →</tspan><tspan x="287.0" dy="12.3">RTC або NVS</tspan></text>
