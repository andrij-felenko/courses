<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комплексна діагностика робочого потоку в RTOS</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Контроль зависань через TWDT, апаратне профілювання затримок через GPIO та захист стека</text>

  <!-- Left Container: Worker Thread Flow -->
  <rect x="40" y="80" width="280" height="350" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="180" y="106" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Потік-виконавець (Worker)</text>

  <rect x="60" y="125" width="240" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="180" y="146" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Отримання події</text>
  <text x="180" y="164" font-size="12" fill="#6b7280" text-anchor="middle">GPIO_HIGH | Фіксація старту</text>

  <rect x="60" y="195" width="240" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="180" y="216" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Виконання задачі</text>
  <text x="180" y="234" font-size="12" fill="#6b7280" text-anchor="middle">twdt_reset() | Робота з даними</text>

  <rect x="60" y="265" width="240" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="180" y="286" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Завершення операції</text>
  <text x="180" y="304" font-size="12" fill="#6b7280" text-anchor="middle">GPIO_LOW | Розрахунок дельти</text>

  <rect x="60" y="335" width="240" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="180" y="356" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Аудит переповнення</text>
  <text x="180" y="374" font-size="12" fill="#6b7280" text-anchor="middle">high_water_mark() | Перевірка стека</text>

  <!-- Flow Arrows inside Left Panel -->
  <path d="M180,177 L180,191" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M180,247 L180,261" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M180,317 L180,331" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Right Diagnostic Blocks -->

  <!-- Block 1: TWDT -->
  <rect x="360" y="80" width="560" height="102" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="380" y="106" font-size="14" font-weight="bold" fill="#c0392b">Сторожовий таймер задач (TWDT)</text>
  <text x="380" y="128" font-size="12" fill="#1a1a1a">Захист від дедлоків, безкінечних циклів та зависань на блокуючих викликах периферії.</text>
  <text x="380" y="148" font-size="12" fill="#1a1a1a">Якщо потік не скидає таймер протягом інтервалу t_watchdog — генерується аварійне переривання</text>
  <text x="380" y="168" font-size="12" fill="#6b7280">Дія: збереження дампу пам'яті (Backtrace) та контрольоване апаратне перезавантаження ядра.</text>

  <!-- Block 2: GPIO Profiling -->
  <rect x="360" y="204" width="560" height="102" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="380" y="230" font-size="14" font-weight="bold" fill="#2457d6">Апаратне профілювання затримок через GPIO</text>
  <text x="380" y="252" font-size="12" fill="#1a1a1a">Пряме перемикання фізичного виводу мікроконтролера на початку та в кінці обробки події.</text>
  <text x="380" y="272" font-size="12" fill="#1a1a1a">Тривалість імпульсу t_pulse фіксується логічним аналізатором із точністю до десятків наносекунд.</text>
  <text x="380" y="292" font-size="12" fill="#6b7280">Перевага: нульовий вплив на продуктивність CPU (без накладних витрат uart/printf).</text>

  <!-- Block 3: Stack Monitoring -->
  <rect x="360" y="328" width="560" height="102" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="380" y="354" font-size="14" font-weight="bold" fill="#27ae60">Моніторинг глибини та цілісності стека</text>
  <text x="380" y="376" font-size="12" fill="#1a1a1a">Контроль мінімального залишку пам'яті задачі через uxTaskGetStackHighWaterMark().</text>
  <text x="380" y="396" font-size="12" fill="#1a1a1a">Заповнення простору стека сигнатурою 0xA5 для виявлення пікового використання.</text>
  <text x="380" y="416" font-size="12" fill="#6b7280">Апаратний бар'єр MPU або Stack Pointer Limit Trap миттєво зупиняє переповнення.</text>

  <!-- Connecting Lines from Left to Right -->
  <path d="M300,221 L355,131" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M300,291 L355,255" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M300,361 L355,379" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
</svg>
