<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-vm" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-vm-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="480" y="36" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Діагностика та локалізація збоїв: механізм Post-Mortem VM</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Збереження бінарного знімка регістрів і стека віртуальної машини при виникненні аномалій</text>

  <!-- Step 1: Execution & Fault Trap -->
  <rect x="50" y="100" width="240" height="200" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="170" y="130" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">1. Виявлення збою VM</text>
  <rect x="70" y="145" width="200" height="30" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="170" y="165" font-size="11" fill="#c0392b" text-anchor="middle">Невідомий опкод (0xEE)</text>
  <rect x="70" y="185" width="200" height="30" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="170" y="205" font-size="11" fill="#c0392b" text-anchor="middle">Переповнення стека (SP > MAX)</text>
  <rect x="70" y="225" width="200" height="30" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="170" y="245" font-size="11" fill="#c0392b" text-anchor="middle">Помилка ділення на 0</text>
  <text x="170" y="280" font-size="11" fill="#6b7280" text-anchor="middle">Миттєве зупинення ядра</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="290" y1="200" x2="360" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-vm-red)"/>

  <!-- Step 2: Post-Mortem Snapshot -->
  <rect x="360" y="100" width="240" height="200" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="130" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. Формування дампу</text>
  <rect x="380" y="145" width="200" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="480" y="165" font-size="11" fill="#1a1a1a" text-anchor="middle">PC (Program Counter) = 0x014C</text>
  <rect x="380" y="185" width="200" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="480" y="205" font-size="11" fill="#1a1a1a" text-anchor="middle">SP (Stack Pointer) = 0x08</text>
  <rect x="380" y="225" width="200" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="480" y="245" font-size="11" fill="#1a1a1a" text-anchor="middle">Зміст 8 елементів стека</text>
  <text x="480" y="280" font-size="11" fill="#6b7280" text-anchor="middle">Запис у FRAM / Flash</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="600" y1="200" x2="670" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-vm)"/>

  <!-- Step 3: Offline Disassembly & Analysis -->
  <rect x="670" y="100" width="240" height="200" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="790" y="130" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">3. Дизінтерпретатор</text>
  <rect x="690" y="145" width="200" height="30" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="790" y="165" font-size="11" fill="#2457d6" text-anchor="middle">0x0148: PUSH R1</text>
  <rect x="690" y="185" width="200" height="30" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="790" y="205" font-size="11" fill="#2457d6" text-anchor="middle">0x014A: DIV (Zero Div Error!)</text>
  <rect x="690" y="225" width="200" height="30" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="790" y="245" font-size="11" fill="#2457d6" text-anchor="middle">0x014C: [Збій інструкції]</text>
  <text x="790" y="280" font-size="11" fill="#2457d6" text-anchor="middle">Точна локалізація в скрипті</text>

  <!-- Bottom Panel: Outcome -->
  <rect x="180" y="340" width="600" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="365" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Результат: локалізація помилки в скрипті без JTAG-підключення</text>
  <text x="480" y="385" font-size="11" fill="#1a1a1a" text-anchor="middle">Знімок містить стан віртуальної пам'яті в момент аварії для аналізу на хості</text>
</svg>