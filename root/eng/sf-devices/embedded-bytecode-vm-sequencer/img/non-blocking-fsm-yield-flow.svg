<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Покрокове виконання байткоду з опкодом YIELD у супер-лупі</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">VM зберігає Program Counter (PC) та повертає управління супер-лупу без використання купи (heap)</text>

  <!-- ==================== PANEL 1: SUPER-LOOP ==================== -->
  <rect x="20" y="68" width="280" height="392" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="160" y="94" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Супер-луп прошивки</text>
  <text x="160" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Головний неблокуючий цикл</text>

  <!-- Step 1A: Sensors / Peripherals -->
  <rect x="36" y="128" width="248" height="50" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="160" y="148" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Опитати периферію / HAL</text>
  <text x="160" y="165" font-size="12" fill="#6b7280" text-anchor="middle">system_tick(), read_sensors()</text>

  <!-- Down Arrow 1A -> 1B -->
  <line x1="160" y1="178" x2="160" y2="200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 1B: VM Exec Step -->
  <rect x="36" y="206" width="248" height="66" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="160" y="228" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Виклик vm_step(&amp;vm)</text>
  <text x="160" y="246" font-size="12" fill="#1a1a1a" text-anchor="middle">Виконання інструкцій до YIELD</text>
  <text x="160" y="262" font-size="11" fill="#6b7280" text-anchor="middle">Повертає стан VM_YIELD</text>

  <!-- Down Arrow 1B -> 1C -->
  <line x1="160" y1="272" x2="160" y2="294" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 1C: Background Tasks -->
  <rect x="36" y="300" width="248" height="50" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="160" y="320" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фонові задачі MCU</text>
  <text x="160" y="337" font-size="12" fill="#6b7280" text-anchor="middle">display_update(), comm_poll()</text>

  <!-- Loopback Arrow from 1C to 1A -->
  <polyline points="36,325 26,325 26,153 30,153" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)"/>

  <!-- Panel 1 Advantage Note -->
  <rect x="36" y="366" width="248" height="78" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="48" y="386" font-size="12" font-weight="bold" fill="#27ae60">Перевага квантування:</text>
  <text x="48" y="404" font-size="12" fill="#1a1a1a">MCU не зависає в очікуванні</text>
  <text x="48" y="420" font-size="12" fill="#1a1a1a">пауз між командами байткоду.</text>
  <text x="48" y="434" font-size="11" fill="#6b7280">Супер-луп працює без затримок</text>

  <!-- ==================== PANEL 2: VM ENGINE & YIELD ==================== -->
  <rect x="320" y="68" width="320" height="392" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="94" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Механіка vm_step() та YIELD</text>
  <text x="480" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Мікро-FSM та збереження стану в RAM</text>

  <!-- Subpanel 2A: RAM Context -->
  <rect x="336" y="128" width="288" height="62" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="348" y="148" font-size="13" font-weight="bold" fill="#27ae60">Контекст VM (Статична RAM):</text>
  <text x="348" y="166" font-size="12" fill="#1a1a1a">PC = 0x0003  |  state = VM_RUNNING</text>
  <text x="348" y="182" font-size="11" fill="#6b7280">Пам'ять в SRAM (0 байт у Heap)</text>

  <!-- Subpanel 2B: Switch loop -->
  <rect x="336" y="202" width="288" height="152" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="348" y="222" font-size="13" font-weight="bold" fill="#1a1a1a">Цикл інтерпретатора (switch):</text>
  <text x="360" y="242" font-size="12" fill="#1a1a1a">opcode = bytecode[PC++];</text>
  <text x="360" y="260" font-size="12" fill="#1a1a1a">switch (opcode) {</text>
  <text x="372" y="278" font-size="12" fill="#6b7280">case OP_SET_OUT: ... break;</text>

  <!-- OP_YIELD highlight box -->
  <rect x="368" y="286" width="244" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="378" y="304" font-size="12" font-weight="bold" fill="#2457d6">case OP_YIELD:</text>
  <text x="378" y="320" font-size="11" fill="#1a1a1a">  vm.PC = PC; return VM_YIELD;</text>

  <text x="360" y="346" font-size="12" fill="#1a1a1a">}</text>

  <!-- Subpanel 2C: Yield Output -->
  <rect x="336" y="366" width="288" height="78" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="348" y="386" font-size="12" font-weight="bold" fill="#2457d6">Повернення управління у супер-луп:</text>
  <text x="348" y="404" font-size="12" fill="#1a1a1a">1. Поточний PC збережено у vm.PC</text>
  <text x="348" y="420" font-size="12" fill="#1a1a1a">2. Функція vm_step() завершується</text>
  <text x="348" y="434" font-size="11" fill="#6b7280">3. Наступний виклик продовжить з PC</text>

  <!-- Inter-panel Call Arrow (1B -> 2B) -->
  <line x1="284" y1="239" x2="330" y2="239" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Inter-panel Return Arrow (2C -> 1C area) -->
  <polyline points="336,405 310,405 310,255 290,255" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-blue)"/>

  <!-- ==================== PANEL 3: BYTECODE & TIMELINE ==================== -->
  <rect x="660" y="68" width="280" height="392" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="800" y="94" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Сценарій та кванти часу</text>
  <text x="800" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Покрокове розбиття виконання</text>

  <!-- Subpanel 3A: Bytecode Array -->
  <rect x="676" y="128" width="248" height="152" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="688" y="148" font-size="13" font-weight="bold" fill="#1a1a1a">Масив байткоду (Flash/RAM):</text>

  <!-- Bytecode Rows -->
  <rect x="686" y="156" width="228" height="24" fill="#f4f6f8" rx="3"/>
  <text x="694" y="172" font-size="11" fill="#1a1a1a">[0x00] OP_SET_LED (Pin 13, 1)</text>

  <rect x="686" y="184" width="228" height="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="694" y="200" font-size="11" font-weight="bold" fill="#2457d6">[0x03] OP_YIELD</text>
  <text x="815" y="200" font-size="11" fill="#2457d6">← Пауза Кванту 1</text>

  <rect x="686" y="212" width="228" height="24" fill="#f4f6f8" rx="3"/>
  <text x="694" y="228" font-size="11" fill="#1a1a1a">[0x04] OP_WAIT_MS (100 ms)</text>

  <rect x="686" y="240" width="228" height="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="694" y="256" font-size="11" font-weight="bold" fill="#2457d6">[0x07] OP_YIELD</text>
  <text x="815" y="256" font-size="11" fill="#2457d6">← Пауза Кванту 2</text>

  <!-- Subpanel 3B: Timeline -->
  <rect x="676" y="292" width="248" height="152" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="688" y="312" font-size="13" font-weight="bold" fill="#1a1a1a">Часова шкала (Timeline):</text>

  <!-- Tick N -->
  <rect x="686" y="322" width="108" height="48" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="740" y="340" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Квант 1 (Tick N)</text>
  <text x="740" y="356" font-size="11" fill="#1a1a1a" text-anchor="middle">PC: 0x00 → 0x03</text>

  <!-- Tick N+1 -->
  <rect x="806" y="322" width="108" height="48" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="860" y="340" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Квант 2 (Tick N+1)</text>
  <text x="860" y="356" font-size="11" fill="#1a1a1a" text-anchor="middle">PC: 0x04 → 0x07</text>

  <!-- Bottom Result Note -->
  <rect x="686" y="380" width="228" height="52" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="696" y="398" font-size="11" font-weight="bold" fill="#1a1a1a">Результат розбиття:</text>
  <text x="696" y="414" font-size="11" fill="#6b7280">Кожен крок триває &lt; 5 мкс,</text>
  <text x="696" y="426" font-size="11" fill="#6b7280">інші задачі отримують квант.</text>
</svg>
