<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Взаємодія задачі рендерингу RTOS, DMA та переривання TCIE</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Синхронізація через семафор із передачею контексту portYIELD_FROM_ISR</text>

  <!-- Фонова панель часових діаграм -->
  <rect x="30" y="75" width="900" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вертикальні роздільники фаз -->
  <line x1="280" y1="85" x2="280" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="680" y1="85" x2="680" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="770" y1="85" x2="770" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Фазові заголовки зверху -->
  <text x="160" y="102" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Фаза 1: Запуск DMA</text>
  <text x="480" y="102" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Фаза 2: Апаратна передача та блокування задачі</text>
  <text x="725" y="102" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фаза 3: ISR</text>
  <text x="840" y="102" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Фаза 4: Розблокування</text>

  <!-- 1. RTOS GUI Task -->
  <text x="50" y="145" font-size="13" font-weight="bold" fill="#1a1a1a">Задача RTOS (GUI)</text>
  <rect x="50" y="155" width="220" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="160" y="174" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Рендеринг + старт DMA</text>

  <rect x="285" y="155" width="485" height="28" rx="3" fill="#ffffff" stroke="#6b7280" stroke-dasharray="3 3"/>
  <text x="525" y="174" font-size="11" fill="#6b7280" text-anchor="middle">Стан BLOCKED (очікування семафора xSemaphoreTake)</text>

  <rect x="780" y="155" width="130" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="845" y="174" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Активна: кадр N+1</text>

  <!-- 2. DMA Controller & SPI -->
  <text x="50" y="215" font-size="13" font-weight="bold" fill="#1a1a1a">Канал DMA та шина SPI</text>
  <rect x="50" y="225" width="220" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="160" y="244" font-size="11" fill="#6b7280" text-anchor="middle">Очікування налаштування</text>

  <rect x="285" y="225" width="385" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="475" y="244" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Апаратне пересилання пікселів через SPI (NDTR &gt; 0)</text>

  <rect x="680" y="225" width="230" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="795" y="244" font-size="11" fill="#6b7280" text-anchor="middle">Транзакція завершена (TC)</text>

  <!-- 3. DMA ISR (TCIE) -->
  <text x="50" y="285" font-size="13" font-weight="bold" fill="#1a1a1a">Переривання DMA ISR</text>
  <line x1="50" y1="305" x2="675" y2="305" stroke="#d0d7de" stroke-width="2"/>
  <rect x="680" y="290" width="85" height="30" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="722" y="310" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">DMA_TC_ISR</text>
  <line x1="770" y1="305" x2="910" y2="305" stroke="#d0d7de" stroke-width="2"/>

  <!-- Дії всередині ISR -->
  <text x="680" y="340" font-size="11" fill="#c0392b">1. Скидання прапорця TCIF</text>
  <text x="680" y="358" font-size="11" fill="#c0392b">2. xSemaphoreGiveFromISR()</text>
  <text x="680" y="376" font-size="11" font-weight="bold" fill="#27ae60">3. portYIELD_FROM_ISR()</text>

  <!-- Пояснення внизу -->
  <rect x="50" y="395" width="860" height="42" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="480" y="421" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Планувальник RTOS негайно перемикає контекст на розблоковану графічну задачу без затримок тику</text>
</svg>
