<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конвеєр подвійного буфера Ping-Pong для виведення SPI DMA</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Паралельний рендеринг у CPU та передача через DMA з керуванням лінією D/C і перериванням TC</text>

  <!-- Ліва колонка: Такт 1 (Ping) -->
  <rect x="30" y="75" width="435" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="102" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фаза 1: Буфер A заповнюється, Буфер B передається</text>

  <!-- Блок CPU рендерингу (Буфер A) -->
  <rect x="50" y="125" width="395" height="85" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="70" y="150" font-size="13" font-weight="bold" fill="#2457d6">Буфер A (Ping): Робота ядра CPU</text>
  <text x="70" y="172" font-size="12" fill="#1a1a1a">Рендеринг пікселів кадру N або смуги тайлів</text>
  <text x="70" y="192" font-size="11" fill="#6b7280">Прямий запис у пам'ять SRAM без затримок</text>

  <!-- Блок DMA передачі (Буфер B) -->
  <rect x="50" y="230" width="395" height="95" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="70" y="255" font-size="13" font-weight="bold" fill="#27ae60">Буфер B (Pong): Апаратна передача DMA</text>
  <text x="70" y="277" font-size="12" fill="#1a1a1a">Виштовхування пікселів кадру N-1 у шину SPI</text>
  <text x="70" y="297" font-size="11" fill="#27ae60">Лінія D/C = 1 (Data Mode — потік пікселів GRAM)</text>
  <text x="70" y="315" font-size="11" fill="#6b7280">Шина SPI працює на повній швидкості без участі ядра</text>

  <!-- Подія перемикання -->
  <rect x="50" y="345" width="395" height="85" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="370" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнал DMA TC Interrupt (Transfer Complete):</text>
  <text x="70" y="392" font-size="11" fill="#6b7280">1. Лінія D/C переводиться в 0 для команд вікна (RASET/RAMWR)</text>
  <text x="70" y="412" font-size="11" font-weight="bold" fill="#2457d6">2. Покажчики ролей буферів міняються місцями (Swap)</text>

  <!-- Права колонка: Такт 2 (Pong) -->
  <rect x="495" y="75" width="435" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="102" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фаза 2: Буфер B заповнюється, Буфер A передається</text>

  <!-- Блок DMA передачі (Буфер A) -->
  <rect x="515" y="125" width="395" height="95" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="535" y="150" font-size="13" font-weight="bold" fill="#27ae60">Буфер A (Ping): Апаратна передача DMA</text>
  <text x="535" y="172" font-size="12" fill="#1a1a1a">Виштовхування пікселів кадру N у шину SPI</text>
  <text x="535" y="192" font-size="11" fill="#27ae60">Лінія D/C = 1 (Data Mode — потік пікселів GRAM)</text>
  <text x="535" y="210" font-size="11" fill="#6b7280">Канал DMA самостійно читає Буфер A</text>

  <!-- Блок CPU рендерингу (Буфер B) -->
  <rect x="515" y="240" width="395" height="85" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="535" y="265" font-size="13" font-weight="bold" fill="#2457d6">Буфер B (Pong): Робота ядра CPU</text>
  <text x="535" y="287" font-size="12" fill="#1a1a1a">Рендеринг пікселів наступного кадру N+1</text>
  <text x="535" y="307" font-size="11" fill="#6b7280">CPU не чекає на завершення транзакції SPI</text>

  <!-- Переваги конвеєра -->
  <rect x="515" y="345" width="395" height="85" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="535" y="370" font-size="12" font-weight="bold" fill="#27ae60">Ефект конвеєризації:</text>
  <text x="535" y="392" font-size="11" fill="#1a1a1a">Час кадру T_frame = max(T_render, T_dma_spi)</text>
  <text x="535" y="412" font-size="11" fill="#6b7280">Подвоєння кадрової частоти без збільшення тактової частоти шини</text>
</svg>
