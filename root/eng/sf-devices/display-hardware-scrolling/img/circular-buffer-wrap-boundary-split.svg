<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розщеплення вікна оновлення на межі буфера VSA</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Єдине логічне вікно при переході через край GRAM ділиться на дві апаратні транзакції</text>

  <!-- Ліва панель: Логічний кадр -->
  <rect x="40" y="75" width="380" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="230" y="102" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Логічний кадр дисплея (Viewport)</text>
  <text x="230" y="120" font-size="12" fill="#6b7280" text-anchor="middle">Безперервне зображення для користувача</text>

  <!-- Екранний прямокутник -->
  <rect x="80" y="140" width="300" height="280" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Суцільний об'єкт (спрайт / вікно) на межі -->
  <rect x="130" y="220" width="200" height="150" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="230" y="250" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Цільове вікно оновлення</text>
  <text x="230" y="272" font-size="12" fill="#1a1a1a" text-anchor="middle">Ширина W × Висота H</text>

  <!-- Пунктирна лінія шва: розриваємо на дві частини, щоб не перетинати текст -->
  <line x1="80" y1="300" x2="120" y2="300" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="340" y1="300" x2="380" y2="300" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  
  <text x="230" y="325" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Межа кільцевого буфера VSA</text>
  <text x="230" y="345" font-size="11" fill="#6b7280" text-anchor="middle">(Шов переходу адреси на нуль)</text>

  <!-- Стрілка трансформації -->
  <path d="M430,260 L470,260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" fill="none"/>
  <text x="450" y="250" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розбиття</text>

  <!-- Права панель: Фізична пам'ять GRAM -->
  <rect x="480" y="75" width="440" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="102" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фізична пам'ять GRAM контролера</text>
  <text x="700" y="120" font-size="12" fill="#6b7280" text-anchor="middle">Кільцевий адресний простір VSA (0 .. VSA_BOTTOM)</text>

  <!-- GRAM каркас -->
  <rect x="520" y="140" width="360" height="280" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Частина 2: Верх буфера -->
  <rect x="550" y="150" width="300" height="60" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="700" y="172" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Частина 2: Верхній блок GRAM</text>
  <text x="700" y="192" font-size="12" fill="#1a1a1a" text-anchor="middle">Транзакція B: Y = 0 .. (H - H1 - 1)</text>

  <!-- Проміжна незмінна область GRAM -->
  <rect x="550" y="220" width="300" height="110" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="700" y="278" font-size="12" fill="#6b7280" text-anchor="middle">Основне тіло буфера кадрів GRAM</text>

  <!-- Частина 1: Низ буфера -->
  <rect x="550" y="340" width="300" height="70" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="700" y="365" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Частина 1: Нижній блок GRAM</text>
  <text x="700" y="385" font-size="12" fill="#1a1a1a" text-anchor="middle">Транзакція A: Y = Y_start .. VSA_BOTTOM</text>

  <!-- Позначки межі буфера -->
  <text x="525" y="155" font-size="11" fill="#6b7280">Адреса 0</text>
  <text x="525" y="415" font-size="11" fill="#6b7280">VSA_BOTTOM</text>
</svg>
