<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма показує розсув між монотонним відліком uptime та календарним</text>
  <text x="480" y="64" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">реальним часом під час коригування годинника, де видно безперервність тиків та</text>
  <text x="480" y="88" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">стрибки календарної шкали</text>
  <text x="480" y="118" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння монотонного шкалювання uptime та стрибкоподібної корекції wall-clock часу.</text>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="180" y="156" width="600" height="240" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="220" y="196" width="200" height="160" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="540" y="196" width="200" height="160" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="420" y1="276" x2="525" y2="276" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="266" font-size="14" fill="#1a1a1a" text-anchor="middle">Архітектура та</text>
  <text x="320" y="284" font-size="14" fill="#1a1a1a" text-anchor="middle">компоненти</text>
  <text x="640" y="266" font-size="14" fill="#1a1a1a" text-anchor="middle">Схема функціонування</text>
</svg>