<rect x="60.0" y="240.0" width="700.0" height="95.0" rx="6" fill="#f0e6fa" stroke="#7d3c98" stroke-width="1.8"/>
<text x="410.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="middle" font-weight="700">Апаратне об'єднання у 32-бітне ціле без Undefined Behavior</text>
<text x="410.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">uint32_t raw_u = ((uint32_t)buf[0] &lt;&lt; 12) | ((uint32_t)buf[1] &lt;&lt; 4) | ((uint32_t)buf[2] &gt;&gt; 4);</text>
<text x="410.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#566573" text-anchor="middle">Знакове розширення (якщо 20-біт signed): int32_t val = (int32_t)(raw_u &lt;&lt; 12) &gt;&gt; 12; // Арифметичний зсув</text>
<line x1="410.0" y1="340.0" x2="410.0" y2="365.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="370.0" width="700.0" height="125.0" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.8"/>
<text x="410.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">Калібрувальний поліном у фіксованій комі (Fixed-Point Q24.8)</text>
<text x="80.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">var1 = (((int32_t)raw_temp &gt;&gt; 3) - ((int32_t)dig_T1 &lt;&lt; 1)) * ((int32_t)dig_T2) &gt;&gt; 11;</text>
<text x="80.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">var2 = (((((raw_temp &gt;&gt; 4) - dig_T1) * ((raw_temp &gt;&gt; 4) - dig_T1)) &gt;&gt; 12) * dig_T3) &gt;&gt; 14;</text>
<text x="80.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">t_fine = var1 + var2;   // Q24.8 накопичувач температури</text>
<text x="80.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">int32_t temp_centidegrees = (t_fine * 5 + 128) &gt;&gt; 8;  // Результат: 2465 -&gt; 24.65 °C</text>
