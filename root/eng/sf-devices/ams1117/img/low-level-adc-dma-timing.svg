<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова діаграма низькорівневої обробки ADC DMA при просіданні живлення</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Затримка між падінням VCC та початком запису в аварійну Flash-пам'ять</text>

  <text x="120" y="120" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end">VCC Power</text>
  <path d="M140,110 L300,110 L450,160 L850,160" fill="none" stroke="#c0392b" stroke-width="2"/>

  <text x="120" y="210" font-size="13" font-weight="700" fill="#2457d6" text-anchor="end">ADC Interrupt</text>
  <path d="M140,220 L350,220 L350,190 L380,190 L380,220 L850,220" fill="none" stroke="#2457d6" stroke-width="2"/>

  <text x="120" y="310" font-size="13" font-weight="700" fill="#27ae60" text-anchor="end">Flash NVS Save</text>
  <path d="M140,310 L400,310 L400,280 L700,280 L700,310 L850,310" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Timing marks -->
  <line x1="300" y1="80" x2="300" y2="350" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="350" y1="80" x2="350" y2="350" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="80" x2="400" y2="350" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="325" y="375" font-size="11" fill="#6b7280" text-anchor="middle">t_latency</text>
  <text x="550" y="375" font-size="11" fill="#27ae60" text-anchor="middle">t_flash_write (до вимкнення)</text>
</svg>