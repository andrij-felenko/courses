<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Архітектура програмного моніторингу живлення в реальному часі</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Фільтрація вимірів ADC та аварійне збереження контексту в Flash/NVS</text>

  <rect x="50" y="140" width="220" height="160" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="160" y="170" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">ADC Sense Stage</text>
  <rect x="70" y="200" width="180" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="160" y="225" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">V_SENSE Divider</text>
  <rect x="70" y="250" width="180" height="35" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="160" y="272" font-size="12" fill="#1a1a1a" text-anchor="middle">DMA Continuous Read</text>

  <rect x="370" y="140" width="220" height="160" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="170" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">DSP Filter &amp; Check</text>
  <rect x="390" y="200" width="180" height="40" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="480" y="225" font-size="12" fill="#1a1a1a" text-anchor="middle">EMA Filter (alpha=0.1)</text>
  <rect x="390" y="250" width="180" height="35" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="480" y="272" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Power-Fail Detector</text>

  <rect x="690" y="140" width="220" height="160" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="800" y="170" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Emergency Task</text>
  <rect x="710" y="200" width="180" height="40" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="800" y="225" font-size="12" fill="#1a1a1a" text-anchor="middle">Save System Logs</text>
  <rect x="710" y="250" width="180" height="35" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="800" y="272" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Safe Hardware Stop</text>

  <line x1="270" y1="220" x2="370" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="590" y1="265" x2="690" y2="265" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
</svg>