<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Внутрішня структура лінійного регулятора LDO (AMS1117)</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Схема зворотного зв'язку з джерелом опорної напруги Bandgap 1.25V</text>

  <!-- Outer LDO Chip -->
  <rect x="140" y="90" width="680" height="320" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="115" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">AMS1117 LDO Integrated Circuit</text>

  <!-- Pass Transistor -->
  <rect x="420" y="150" width="140" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="490" y="175" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">NPN Power</text>
  <text x="490" y="195" font-size="12" fill="#6b7280" text-anchor="middle">Pass Transistor</text>

  <!-- Error Amplifier -->
  <polygon points="320,240 320,320 400,280" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="340" y="285" font-size="13" font-weight="700" fill="#1a1a1a">OpAmp</text>

  <!-- Bandgap Ref -->
  <rect x="180" y="320" width="140" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="250" y="342" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Bandgap Ref</text>
  <text x="250" y="360" font-size="11" fill="#6b7280" text-anchor="middle">V_ref = 1.25V</text>

  <!-- Resistor Divider -->
  <rect x="640" y="220" width="30" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="680" y="255" font-size="12" fill="#1a1a1a">R1</text>
  <rect x="640" y="300" width="30" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="680" y="335" font-size="12" fill="#1a1a1a">R2</text>

  <!-- Connections -->
  <line x1="60" y1="180" x2="420" y2="180" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="100" y="170" font-size="13" font-weight="700" fill="#c0392b">VIN (+5V)</text>

  <line x1="560" y1="180" x2="880" y2="180" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="820" y="170" font-size="13" font-weight="700" fill="#27ae60">VOUT (+3.3V)</text>

  <line x1="655" y1="180" x2="655" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="655" y1="280" x2="655" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="655" y1="290" x2="320" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="250" y1="320" x2="250" y2="260" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="250" y1="260" x2="320" y2="260" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="280" x2="490" y2="280" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="490" y1="280" x2="490" y2="210" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
</svg>