<rect x="30.0" y="54.0" width="235.0" height="32.0" rx="0" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.8"/>
<text x="147.5" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="middle" font-weight="700">Публічний API (i2c_driver.h)</text>
