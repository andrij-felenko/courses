<text x="147.5" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Операції з дескриптором</text>
<text x="147.5" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a5276" text-anchor="middle"><tspan x="147.5" dy="0.0">i2c_init(h, &amp;cfg)</tspan><tspan x="147.5" dy="12.8">i2c_write_sync(h, ...)</tspan><tspan x="147.5" dy="12.8">i2c_read_async(h, ..., cb)</tspan><tspan x="147.5" dy="12.8">i2c_get_stats(h, &amp;st)</tspan></text>
