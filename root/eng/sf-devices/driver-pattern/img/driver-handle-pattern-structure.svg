<text x="147.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="147.5" dy="0.0">uint32_t clock_speed_hz</tspan><tspan x="147.5" dy="12.3">uint8_t sda_pin, scl_pin</tspan><tspan x="147.5" dy="12.3">uint16_t timeout_ms</tspan></text>
