<text x="147.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">typedef struct i2c_dev* i2c_h;</text>
<rect x="40.0" y="174.0" width="215.0" height="95.0" rx="4" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.2"/>
