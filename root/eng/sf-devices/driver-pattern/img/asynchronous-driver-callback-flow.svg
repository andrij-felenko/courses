<text x="225.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a5276" text-anchor="middle">3. return DRIVER_OK (1.2 мкс)</text>
<rect x="105.0" y="215.0" width="30.0" height="95.0" rx="2" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.4"/>
<rect x="145.0" y="230.0" width="140.0" height="55.0" rx="4" fill="#f0f7fc" stroke="#1a5276" stroke-width="1.0"/>
<text x="215.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a5276" text-anchor="middle"><tspan x="215.0" dy="0.0">Задача виконує</tspan><tspan x="215.0" dy="10.8">іншу логіку або спить</tspan><tspan x="215.0" dy="10.8">в очікуванні події RTOS</tspan></text>
<rect x="525.0" y="185.0" width="30.0" height="125.0" rx="2" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.4"/>
<rect x="565.0" y="220.0" width="145.0" height="55.0" rx="4" fill="#f0faf4" stroke="#1e8449" stroke-width="1.0"/>
<text x="637.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e8449" text-anchor="middle"><tspan x="637.0" dy="0.0">Апаратна передача байтів</tspan><tspan x="637.0" dy="10.8">по фізичній шині</tspan><tspan x="637.0" dy="10.8">без задіяння CPU</tspan></text>
<line x1="540.0" y1="315.0" x2="740.0" y2="315.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="640.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">4. Апаратне IRQ (Transfer Complete)</text>
<rect x="725.0" y="320.0" width="30.0" height="85.0" rx="2" fill="#fadbd8" stroke="#c0392b" stroke-width="1.4"/>
<line x1="740.0" y1="350.0" x2="330.0" y2="350.0" stroke="#7d3c98" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="535.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d3c98" text-anchor="middle">5. Очищення прапорців, state -&gt; IDLE</text>
<line x1="740.0" y1="390.0" x2="120.0" y2="390.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="430.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">6. Виклик cb(STATUS_OK, bytes, ctx) / надсилання події в чергу</text>
<rect x="105.0" y="395.0" width="30.0" height="50.0" rx="2" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.4"/>
<rect x="145.0" y="400.0" width="140.0" height="42.0" rx="4" fill="#f0f7fc" stroke="#1a5276" stroke-width="1.0"/>
<text x="215.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a5276" text-anchor="middle"><tspan x="215.0" dy="0.0">Обробка результату</tspan><tspan x="215.0" dy="10.8">у фоновій задачі</tspan></text>
<text x="430.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Контекст ISR повинен бути мінімальним: зміна стану та сигналізація, без важких обчислень чи блокувань</text>
