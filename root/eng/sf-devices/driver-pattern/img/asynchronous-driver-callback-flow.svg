<text x="120.0" y="69.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="700">Застосунок (Task)</text>
<line x1="120.0" y1="80.0" x2="120.0" y2="465.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="245.0" y="48.0" width="170.0" height="32.0" rx="4" fill="#f0e6fa" stroke="#7d3c98" stroke-width="1.6"/>
<text x="330.0" y="69.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7d3c98" text-anchor="middle" font-weight="700">Драйвер (API)</text>
<line x1="330.0" y1="80.0" x2="330.0" y2="465.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="455.0" y="48.0" width="170.0" height="32.0" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.6"/>
<text x="540.0" y="69.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e8449" text-anchor="middle" font-weight="700">Контролер / DMA</text>
<line x1="540.0" y1="80.0" x2="540.0" y2="465.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="655.0" y="48.0" width="170.0" height="32.0" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1.6"/>
<text x="740.0" y="69.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Обробник IRQ / Callback</text>
<line x1="740.0" y1="80.0" x2="740.0" y2="465.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="120.0" y1="110.0" x2="330.0" y2="110.0" stroke="#1a5276" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="225.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a5276" text-anchor="middle" font-weight="700">1. transfer_async(&amp;req, cb, ctx)</text>
<rect x="315.0" y="120.0" width="30.0" height="50.0" rx="2" fill="#f0e6fa" stroke="#7d3c98" stroke-width="1.4"/>
<text x="355.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d3c98" text-anchor="start">state: IDLE -&gt; BUSY</text>
<text x="355.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">зберегти cb та ctx</text>
<line x1="330.0" y1="175.0" x2="540.0" y2="175.0" stroke="#1e8449" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="435.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e8449" text-anchor="middle" font-weight="700">2. Запуск DMA / IRQ (CR1/CR2)</text>
