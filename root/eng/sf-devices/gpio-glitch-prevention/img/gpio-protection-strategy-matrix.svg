<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="480" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Матриця вибору стратегії захисту ліній GPIO</text>
  <text x="480" y="50" font-size="13" text-anchor="middle" fill="#6b7280">Вибір між програмним та апаратним захистом залежно від вимог</text>

  <!-- Axes -->
  <!-- X axis -->
  <path d="M 160 420 L 800 420" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="800" y="410" font-size="14" font-weight="bold" text-anchor="end" fill="#1a1a1a">Критичність та рівень завад</text>
  <text x="200" y="445" font-size="13" text-anchor="middle" fill="#6b7280">Низький</text>
  <text x="700" y="445" font-size="13" text-anchor="middle" fill="#6b7280">Високий</text>

  <!-- Y axis (horizontal text) -->
  <path d="M 160 420 L 160 100" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="160" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Частота сигналу</text>
  <text x="140" y="360" font-size="13" text-anchor="end" fill="#6b7280">Низька (до 1 кГц)</text>
  <text x="140" y="180" font-size="13" text-anchor="end" fill="#6b7280">Висока (МГц)</text>

  <!-- Grid / matrix lines (optional, maybe just blocks) -->
  
  <!-- Quadrant 1: Bottom Left (Low/Low) -->
  <rect x="180" y="270" width="280" height="130" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="320" y="300" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Програмний дебаунс</text>
  <text x="320" y="325" font-size="13" text-anchor="middle" fill="#2457d6">Затримки, мажоритарний фільтр</text>
  <text x="320" y="355" font-size="13" text-anchor="middle" fill="#6b7280">Сфера: Кнопки, енкодери, UI</text>
  <text x="320" y="375" font-size="13" text-anchor="middle" fill="#6b7280">Переваги: Відсутність апаратних витрат</text>

  <!-- Quadrant 2: Bottom Right (Low Freq / High Noise) -->
  <rect x="490" y="270" width="300" height="130" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="640" y="300" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RC-фільтр + Тригер Шмітта</text>
  <text x="640" y="325" font-size="13" text-anchor="middle" fill="#27ae60">Пасивне згладжування + Гістерезис</text>
  <text x="640" y="355" font-size="13" text-anchor="middle" fill="#6b7280">Сфера: Кінцеві вимикачі, верстати CNC</text>
  <text x="640" y="375" font-size="13" text-anchor="middle" fill="#6b7280">Переваги: Апаратне придушення імпульсів</text>

  <!-- Quadrant 3: Top Left (High Freq / Low Noise) -->
  <rect x="180" y="110" width="280" height="130" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="320" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Внутрішні Pull-Up/Down</text>
  <text x="320" y="165" font-size="13" text-anchor="middle" fill="#2457d6">Оптимальне трасування PCB</text>
  <text x="320" y="195" font-size="13" text-anchor="middle" fill="#6b7280">Сфера: I2C/SPI датчики на одній платі</text>
  <text x="320" y="215" font-size="13" text-anchor="middle" fill="#6b7280">Переваги: Висока швидкість передачі</text>

  <!-- Quadrant 4: Top Right (High Freq / High Noise) -->
  <rect x="490" y="110" width="300" height="130" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="640" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Гальванічна розв'язка</text>
  <text x="640" y="165" font-size="13" text-anchor="middle" fill="#c0392b">Цифрові ізолятори, Оптопари, Диференціал</text>
  <text x="640" y="195" font-size="13" text-anchor="middle" fill="#6b7280">Сфера: Промислові шини (RS-485, CAN)</text>
  <text x="640" y="215" font-size="13" text-anchor="middle" fill="#6b7280">Переваги: Захист від земляних петель та ЕМІ</text>

</svg>