<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <!-- Background -->
    <rect x="0" y="0" width="960" height="480" fill="white"/>

    <!-- Title and Subtitle -->
    <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перехідний процес на лінії GPIO</text>
    <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Ідеальний прямокутний імпульс проти реального сигналу з дзвоном та завадами</text>

    <!-- Definitions for markers -->
    <defs>
        <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
        </marker>
        <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
        </marker>
    </defs>

    <!-- Axes -->
    <path d="M 80 400 L 880 400" fill="none" stroke="#1a1a1a" stroke-width="2" /> <!-- X axis -->
    <path d="M 80 400 L 80 100" fill="none" stroke="#1a1a1a" stroke-width="2" /> <!-- Y axis -->
    
    <!-- Axis Labels -->
    <text x="890" y="405" font-size="14" fill="#1a1a1a">t</text>
    <text x="70" y="90" font-size="14" fill="#1a1a1a" text-anchor="end">U</text>
    
    <text x="60" y="155" font-size="14" fill="#1a1a1a" text-anchor="end">VCC</text>
    <path d="M 75 150 L 880 150" fill="none" stroke="#d0d7de" stroke-width="1" stroke-dasharray="5,5" />
    
    <text x="60" y="355" font-size="14" fill="#1a1a1a" text-anchor="end">GND</text>
    <path d="M 75 350 L 880 350" fill="none" stroke="#d0d7de" stroke-width="1" stroke-dasharray="5,5" />

    <!-- Ideal Signal -->
    <path d="M 80 350 L 200 350 L 200 150 L 860 150" fill="none" stroke="#2457d6" stroke-width="3" stroke-dasharray="8,4" />
    
    <!-- Real Signal with bounce and ringing -->
    <path d="M 80 350 
             L 190 350 
             L 210 110 L 218 170 L 225 140 
             L 235 330 L 245 350 
             L 260 100 L 270 180 L 280 130 
             L 295 360 L 305 340 
             L 325 350 
             L 340 80 L 355 210 L 370 110 L 385 180 L 400 130 L 420 165 L 440 140 L 470 155 L 500 147 L 540 151 L 590 149 L 650 150
             L 860 150" 
          fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Text Labels -->
    <text x="700" y="190" font-size="14" fill="#2457d6">Ідеальний сигнал</text>
    <text x="700" y="90" font-size="14" fill="#c0392b">Реальний сигнал</text>
    <text x="700" y="110" font-size="14" fill="#c0392b">(брязкіт, глітчі, дзвін)</text>

    <!-- Annotations for signal parts -->
    <text x="260" y="60" font-size="14" fill="#c0392b" text-anchor="middle">Брязкіт контактів</text>
    <text x="400" y="60" font-size="14" fill="#c0392b" text-anchor="middle">Викид та дзвін</text>

    <!-- Pointers -->
    <path d="M 260 70 L 260 90" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)" />
    <path d="M 400 70 L 345 80" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)" />
    
    <!-- Legend-like markers or additional info if needed -->
    <!-- We can add a time axis bracket for the bounce duration -->
    <path d="M 200 415 L 200 425 L 340 425 L 340 415" fill="none" stroke="#6b7280" stroke-width="1.5" />
    <text x="270" y="445" font-size="12" fill="#6b7280" text-anchor="middle">t_bounce (1–10 ms)</text>
    
    <path d="M 340 415 L 340 425 L 650 425 L 650 415" fill="none" stroke="#6b7280" stroke-width="1.5" />
    <text x="495" y="445" font-size="12" fill="#6b7280" text-anchor="middle">Перехідний процес (ringing)</text>

</svg>
