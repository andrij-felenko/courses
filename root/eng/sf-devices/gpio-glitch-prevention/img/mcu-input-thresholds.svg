<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Uncertainty Zone -->
  <rect x="130" y="140" width="760" height="60" fill="#fdecea"/>
  <line x1="130" y1="140" x2="890" y2="140" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="130" y1="200" x2="890" y2="200" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="510" y="174" text-anchor="middle" font-size="14" fill="#c0392b">Зона невизначеності (V<tspan dy="2" font-size="11">IL</tspan><tspan dy="-2"> ... V</tspan><tspan dy="2" font-size="11">IH</tspan><tspan dy="-2">)</tspan></text>

  <!-- Titles -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порогові напруги вхідного каскаду та хибні перемикання</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#6b7280">Сплески напруги в зоні невизначеності між V<tspan dy="2" font-size="11">IL</tspan><tspan dy="-2"> та V</tspan><tspan dy="2" font-size="11">IH</tspan><tspan dy="-2"> призводять до зчитування хибних станів</tspan></text>

  <!-- Axes Analog -->
  <line x1="130" y1="280" x2="130" y2="70" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="260" x2="910" y2="260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="915" y="264" text-anchor="start" font-size="13" fill="#1a1a1a">t</text>
  <text x="130" y="60" text-anchor="middle" font-size="13" fill="#1a1a1a">U, В</text>

  <!-- Axes Digital -->
  <line x1="130" y1="440" x2="130" y2="330" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="420" x2="910" y2="420" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="915" y="424" text-anchor="start" font-size="13" fill="#1a1a1a">t</text>
  <text x="130" y="320" text-anchor="middle" font-size="13" fill="#1a1a1a">Біт</text>

  <!-- Vertical dashed lines for crossings -->
  <line x1="240" y1="140" x2="240" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="258" y1="200" x2="258" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="269" y1="140" x2="269" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="289" y1="200" x2="289" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="303" y1="140" x2="303" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>

  <line x1="638" y1="200" x2="638" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="658" y1="140" x2="658" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="668" y1="200" x2="668" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="689" y1="140" x2="689" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="701" y1="200" x2="701" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Ticks and Labels -->
  <line x1="125" y1="100" x2="130" y2="100" stroke="#1a1a1a" stroke-width="1"/>
  <text x="120" y="104" text-anchor="end" font-size="13" fill="#1a1a1a">3.3 V</text>
  
  <line x1="125" y1="140" x2="130" y2="140" stroke="#1a1a1a" stroke-width="1"/>
  <text x="120" y="144" text-anchor="end" font-size="13" fill="#1a1a1a">V<tspan dy="2" font-size="11">IH</tspan><tspan dy="-2"> (2.31 V)</tspan></text>
  
  <line x1="125" y1="200" x2="130" y2="200" stroke="#1a1a1a" stroke-width="1"/>
  <text x="120" y="204" text-anchor="end" font-size="13" fill="#1a1a1a">V<tspan dy="2" font-size="11">IL</tspan><tspan dy="-2"> (0.99 V)</tspan></text>

  <text x="120" y="264" text-anchor="end" font-size="13" fill="#1a1a1a">0 V</text>

  <line x1="125" y1="360" x2="130" y2="360" stroke="#1a1a1a" stroke-width="1"/>
  <text x="120" y="364" text-anchor="end" font-size="13" fill="#1a1a1a">Логічна 1</text>
  
  <text x="120" y="424" text-anchor="end" font-size="13" fill="#1a1a1a">Логічний 0</text>

  <!-- Signal Paths -->
  <path d="M130,260 L230,260 L245,80 L260,220 L275,90 L290,210 L310,100 L630,100 L645,280 L660,120 L675,270 L690,130 L710,260 L890,260" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round"/>
  
  <path d="M130,420 L240,420 L240,360 L258,360 L258,420 L269,420 L269,360 L289,360 L289,420 L303,420 L303,360 L638,360 L638,420 L658,420 L658,360 L668,360 L668,420 L689,420 L689,360 L701,360 L701,420 L890,420" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Annotations -->
  <text x="325" y="90" font-size="12" fill="#6b7280">Паразитний дзвін та глітчі</text>
  <path d="M320,86 L255,86" fill="none" stroke="#6b7280" marker-end="url(#arr-gray)"/>
  
  <text x="515" y="90" font-size="12" fill="#6b7280">Сплески в зоні невизначеності</text>
  <path d="M570,95 L650,115" fill="none" stroke="#6b7280" marker-end="url(#arr-gray)"/>

  <text x="275" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Хибні перемикання</text>
  <path d="M275,350 L263,370" fill="none" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-red)"/>
  <path d="M275,350 L296,370" fill="none" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-red)"/>

  <text x="670" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Хибні перемикання</text>
  <path d="M670,350 L663,370" fill="none" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-red)"/>
  <path d="M670,350 L695,370" fill="none" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-red)"/>

</svg>
