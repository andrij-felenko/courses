<rect x="540.0" y="220.0" width="260.0" height="190.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
<text x="670.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм розмотування FP</text>
<text x="552.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">1. fp = %rbp (поточний кадр)</text>
<text x="552.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">2. return_ip = *(fp + 8)</text>
<text x="552.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">3. Зберегти return_ip у трейс</text>
<text x="552.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">4. fp = *fp (перехід до caller)</text>
<text x="552.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">5. Повторювати, доки fp != 0</text>
