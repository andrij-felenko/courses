<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг покажчиків кадру: [RBP] веде до попереднього кадру, [RBP+8] — до адреси повернення</text>
