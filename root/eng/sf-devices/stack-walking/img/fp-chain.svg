<rect x="170.0" y="210.0" width="320.0" height="22.0" rx="4" fill="#d0e1fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="330.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Кадр 1: worker()</text>
<text x="185.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Локальні змінні worker()</text>
<text x="185.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">[RBP_1 + 8] = Збережений RIP (адреса в main)</text>
<text x="185.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">[RBP_1 + 0] = Збережений RBP (покажчик на RBP_0)</text>
<rect x="170.0" y="80.0" width="320.0" height="95.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<rect x="170.0" y="80.0" width="320.0" height="22.0" rx="4" fill="#fad1cc" stroke="#c0392b" stroke-width="1.0"/>
<text x="330.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Кадр 2: leaf() (активна функція)</text>
<text x="185.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Локальні змінні leaf()</text>
<text x="185.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">[RBP_2 + 8] = Збережений RIP (адреса у worker)</text>
<text x="185.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">[RBP_2 + 0] = Збережений RBP (покажчик на RBP_1)</text>
