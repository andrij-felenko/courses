<svg xmlns="http://www.w3.org/2000/svg" viewBox="-47.5 -10 887.5 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-47.5" y="-10" width="887.5" height="490" fill="#ffffff"/>
