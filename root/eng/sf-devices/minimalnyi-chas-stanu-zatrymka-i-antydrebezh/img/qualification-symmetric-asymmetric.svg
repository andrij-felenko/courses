<text x="587.5" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="587.5" dy="0.0">Застосування: захист двигунів і тиску.</tspan><tspan x="587.5" dy="13.0">Швидке відсікання аварії (T_trip = 100 мс),</tspan><tspan x="587.5" dy="13.0">але тривала стабілізація (T_recover = 10 с).</tspan></text>
<text x="400.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Симетричний фільтр підходить для HMI; несиметричний — стандарт промислової безпеки</text>
