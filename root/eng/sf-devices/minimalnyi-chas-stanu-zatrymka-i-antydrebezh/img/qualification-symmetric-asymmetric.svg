<text x="250.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">T_off</text>
<text x="212.5" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Застосування: клавіші HMI, кінцевики.</tspan><tspan x="212.5" dy="13.0">Обидва переходи фільтруються однаково</tspan><tspan x="212.5" dy="13.0">(типово 20–50 мс).</tspan></text>
