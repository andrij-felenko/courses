<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний ланцюг довіри (Chain of Trust)</text>
<rect x="40.0" y="60.0" width="220.0" height="320.0" rx="8" fill="#fdf2f0" stroke="#c0392b" stroke-width="2.0"/>
<text x="150.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратний корінь (RoT)</text>
<text x="150.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Масковане ROM</tspan><tspan x="150.0" dy="16.8">OTP eFuse (хеш ключа)</tspan><tspan x="150.0" dy="16.8">Апаратні криптоакселератори</tspan></text>
<line x1="260.0" y1="220.0" x2="350.0" y2="220.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="265.0" y="175.0" width="80.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="190.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">ROM валідує</tspan><tspan x="305.0" dy="11.7">MCUboot</tspan></text>
<rect x="350.0" y="60.0" width="220.0" height="320.0" rx="8" fill="#f0f4fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="460.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Завантажувач (MCUboot)</text>
<text x="460.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Вбудований відкритий ключ</tspan><tspan x="460.0" dy="16.8">Перевірка SHA-256/підпису</tspan><tspan x="460.0" dy="16.8">Звірка лічильника eFuse</tspan><tspan x="460.0" dy="16.8">Керування A/B слотами</tspan></text>
<line x1="570.0" y1="220.0" x2="660.0" y2="220.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="575.0" y="175.0" width="80.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="615.0" y="190.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">MCUboot валідує</tspan><tspan x="615.0" dy="11.7">підпис App</tspan></text>
<rect x="660.0" y="60.0" width="220.0" height="320.0" rx="8" fill="#f4fbf6" stroke="#27ae60" stroke-width="2.0"/>
<text x="770.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Образ застосунку (App)</text>
<text x="770.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Заголовок (Header)</tspan><tspan x="770.0" dy="16.8">Виконуваний бінарний код</tspan><tspan x="770.0" dy="16.8">Захищені TLV (Anti-Rollback)</tspan><tspan x="770.0" dy="16.8">TLV підпису (ECDSA/Ed25519)</tspan></text>
<rect x="40.0" y="400.0" width="840.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="425.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Незмінний апаратний якір (eFuse Hash) → Безпечний завантажувач → Перевірений застосунок</tspan></text>
</svg>