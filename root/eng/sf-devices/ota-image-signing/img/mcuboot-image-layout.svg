<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія підписаного двійкового образу MCUboot</text>
<rect x="50.0" y="70.0" width="800.0" height="85.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="450.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Заголовок образу — MCUboot Image Header (32 байти)</text>
<text x="450.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Magic (0x96f3b83d)  |  Load Addr (4B)  |  Hdr Size (2B)  |  Protected TLV Size (2B)</tspan><tspan x="450.0" dy="15.6">Image Size (4B)     |  Flags (4B)      |  Version (Major.Minor.Revision.Build, 8B)</tspan></text>
<rect x="50.0" y="170.0" width="800.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="450.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тіло прошивки — Executable Payload</text>
<text x="450.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="450.0" dy="0.0">Векторна таблиця переривань (Vector Table: Initial SP, Reset_Handler)</tspan><tspan x="450.0" dy="15.6">Секції .text (код програми), .rodata (константи), .data (початкові значення змінних)</tspan></text>
<rect x="50.0" y="285.0" width="800.0" height="90.0" rx="6" fill="#fef6e7" stroke="#d97706" stroke-width="2.0"/>
<text x="450.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">Захищені дескриптори — Protected TLV Area (Включаються в підпис)</text>
<text x="450.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">TLV Header (Magic 0x6908, Length)  |  TAG_SEC_CNT (Апаратний лічильник захисту від відкату, 4B)</tspan><tspan x="450.0" dy="15.6">TAG_BOOT_RECORD (CBOR-запис вимірюваного завантаження)</tspan></text>
<rect x="50.0" y="390.0" width="800.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="450.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Трейлер підпису — Non-Protected TLV Trailer</text>
<text x="450.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">TLV Header (Magic 0x6907, Length)  |  TAG_SHA256 (32B дайджест: Header + Payload + Protected TLV)</tspan><tspan x="450.0" dy="15.6">TAG_SIGNATURE (Криптографічний підпис: ECDSA secp256r1 64B або Ed25519 64B)</tspan></text>
</svg>