<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від відкату версій за допомогою eFuse лічильника</text>
<rect x="40.0" y="60.0" width="390.0" height="330.0" rx="8" fill="#f4fbf6" stroke="#27ae60" stroke-width="2.0"/>
<text x="235.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Легітимне оновлення (Успіх)</text>
<rect x="60.0" y="115.0" width="350.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">1. Образ v2 (Sec Counter = 2) залито в слот</tspan><tspan x="235.0" dy="14.3">Підпис дійсний (ECDSA / Ed25519 OK)</tspan></text>
<rect x="60.0" y="185.0" width="350.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="235.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">2. MCUboot читає eFuse (NV Counter = 1)</tspan><tspan x="235.0" dy="14.3">Перевірка: Image Sec (2) ≥ eFuse (1) → УСПІХ</tspan></text>
<rect x="60.0" y="255.0" width="350.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="277.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">3. Самотестування пройдено вдало!</tspan><tspan x="235.0" dy="14.3">Апаратне спалювання eFuse: NV Counter = 2</tspan><tspan x="235.0" dy="14.3">(Одноразовий необоротний запис 0b0011)</tspan></text>
<rect x="470.0" y="60.0" width="390.0" height="330.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="665.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Спроба Downgrade-атаки (Блокування)</text>
<rect x="490.0" y="115.0" width="350.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">1. Зловмисник заливає стару прошивку v1</tspan><tspan x="665.0" dy="14.3">(Має легітимний підпис виробника!)</tspan></text>
<rect x="490.0" y="185.0" width="350.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">2. MCUboot читає образ (Sec Counter = 1)</tspan><tspan x="665.0" dy="14.3">та апаратний eFuse (NV Counter = 2)</tspan></text>
<rect x="490.0" y="255.0" width="350.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="665.0" y="277.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">3. Перевірка: Image Sec (1) &lt; eFuse (2)!</tspan><tspan x="665.0" dy="14.3">ВІДМОВА ЗАВАНТАЖЕННЯ (Downgrade Rejected)</tspan><tspan x="665.0" dy="14.3">Запуск блокується, перехід у Safe Recovery</tspan></text>
<rect x="40.0" y="415.0" width="820.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="440.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Криптопідпис гарантує АВТОРСТВО, а апаратний eFuse гарантує СВІЖІСТЬ версії</tspan></text>
</svg>