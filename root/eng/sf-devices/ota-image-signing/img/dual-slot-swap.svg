<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл оновлення: A/B Swap, пробний запуск та автоматичний відкат</text>
<rect x="40.0" y="70.0" width="250.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="110.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">1. Завантаження OTA</tspan><tspan x="165.0" dy="14.3">Новий підписаний образ</tspan><tspan x="165.0" dy="14.3">записується у Slot 1</tspan><tspan x="165.0" dy="14.3">(Вторинний / Пасивний).</tspan><tspan x="165.0" dy="14.3">Slot 0 працює в штатному режимі.</tspan></text>
<rect x="335.0" y="70.0" width="250.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="110.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">2. Перевірка підпису</tspan><tspan x="460.0" dy="14.3">MCUboot перевіряє хеш,</tspan><tspan x="460.0" dy="14.3">криптографічний підпис</tspan><tspan x="460.0" dy="14.3">та Sec Counter у Slot 1.</tspan><tspan x="460.0" dy="14.3">Виконується swap у Slot 0.</tspan></text>
<rect x="630.0" y="70.0" width="250.0" height="130.0" rx="6" fill="#fef6e7" stroke="#d97706" stroke-width="1.5"/><text x="755.0" y="110.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">3. Тестовий запуск (Trial)</tspan><tspan x="755.0" dy="14.3">Запуск у стані TESTING.</tspan><tspan x="755.0" dy="14.3">Активація сторожового</tspan><tspan x="755.0" dy="14.3">таймера (Hardware Watchdog).</tspan><tspan x="755.0" dy="14.3">Очікування самотесту.</tspan></text>
<line x1="290.0" y1="135.0" x2="335.0" y2="135.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="585.0" y1="135.0" x2="630.0" y2="135.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="500.0" y="260.0" width="380.0" height="120.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">УСПІХ: Самотест пройдено!</tspan><tspan x="690.0" dy="14.3">Прошивка викликає mcuboot_mark_confirmed()</tspan><tspan x="690.0" dy="14.3">Образ закріплюється назавжди (PERMANENT).</tspan><tspan x="690.0" dy="14.3">Оновлюється eFuse Counter при потребі.</tspan></text>
<line x1="755.0" y1="200.0" x2="755.0" y2="260.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="260.0" width="380.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">АВАРІЯ: Падіння коду або спрацювання Watchdog!</tspan><tspan x="230.0" dy="14.3">MCUboot фіксує незавершений стан тесту.</tspan><tspan x="230.0" dy="14.3">Автоматичний зворотний SWAP у Slot 0.</tspan><tspan x="230.0" dy="14.3">Повернення попередньої робочої версії!</tspan></text>
<line x1="630.0" y1="160.0" x2="420.0" y2="290.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>