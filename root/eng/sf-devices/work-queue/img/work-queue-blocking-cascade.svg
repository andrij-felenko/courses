<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-flow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-stop" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Каскадне блокування у спільній черзі робіт (Work Queue)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Один блокуючий обробник зупиняє єдиний потік-виконавець і заморожує всі наступні задачі</text>

  <!-- Top Container: Queue Buffer State -->
  <rect x="30" y="85" width="900" height="165" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="110" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Стан буфера задач (FIFO) єдиного системного потоку Worker Thread</text>

  <!-- Item 1: Running Blocked Task -->
  <rect x="50" y="125" width="190" height="105" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="145" y="148" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Елемент 1 (Виконується)</text>
  <text x="145" y="168" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Обробник кнопки</text>
  <rect x="60" y="178" width="170" height="42" rx="4" fill="white" stroke="#c0392b"/>
  <text x="145" y="194" font-size="10" font-weight="700" fill="#c0392b" text-anchor="middle">ПОМИЛКА: vTaskDelay(200)</text>
  <text x="145" y="210" font-size="10" fill="#6b7280" text-anchor="middle">Сон або блокуючий I/O</text>

  <!-- Cascade Arrow 1 -> 2 -->
  <line x1="245" y1="175" x2="270" y2="175" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-stop)"/>

  <!-- Item 2: Frozen Sensor Task -->
  <rect x="275" y="125" width="190" height="105" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="370" y="148" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Елемент 2 (У черзі)</text>
  <text x="370" y="168" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Аварійний датчик темп.</text>
  <rect x="285" y="178" width="170" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="370" y="194" font-size="10" font-weight="700" fill="#c0392b" text-anchor="middle">ЗАМОРОЖЕНО (Head-of-Line)</text>
  <text x="370" y="210" font-size="10" fill="#6b7280" text-anchor="middle">Чекає 200 мс на потік</text>

  <!-- Cascade Arrow 2 -> 3 -->
  <line x1="470" y1="175" x2="495" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arr-flow)"/>

  <!-- Item 3: Frozen UART Task -->
  <rect x="500" y="125" width="190" height="105" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="595" y="148" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Елемент 3 (У черзі)</text>
  <text x="595" y="168" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Парсер пакетів UART</text>
  <rect x="510" y="178" width="170" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="595" y="194" font-size="10" font-weight="700" fill="#c0392b" text-anchor="middle">ЗАМОРОЖЕНО</text>
  <text x="595" y="210" font-size="10" fill="#6b7280" text-anchor="middle">Переповнення буфера UART</text>

  <!-- Cascade Arrow 3 -> 4 -->
  <line x1="695" y1="175" x2="720" y2="175" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-stop)"/>

  <!-- Item 4: Dropped New Interrupt -->
  <rect x="725" y="125" width="185" height="105" rx="6" fill="#fdecea" stroke="#c0392b" stroke-dasharray="4,4"/>
  <text x="817" y="148" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Нове переривання ISR</text>
  <text x="817" y="168" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Буфер переповнено</text>
  <rect x="735" y="178" width="165" height="42" rx="4" fill="white" stroke="#c0392b"/>
  <text x="817" y="194" font-size="10" font-weight="700" fill="#c0392b" text-anchor="middle">DROP: ВТРАТА ПОДІЇ</text>
  <text x="817" y="210" font-size="10" fill="#6b7280" text-anchor="middle">Немає місця в черзі</text>

  <!-- Bottom Rules Comparison: Left Problem vs Right Solution -->
  <!-- Left Box: Dangerous Patterns -->
  <rect x="30" y="265" width="440" height="165" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="250" y="290" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Категорично заборонено у Work Queue</text>

  <rect x="45" y="305" width="410" height="110" rx="6" fill="white" stroke="#c0392b"/>
  <text x="55" y="325" font-size="11" font-weight="700" fill="#c0392b">1. Блокуючі затримки:</text>
  <text x="190" y="325" font-size="11" fill="#1a1a1a">vTaskDelay(), delay_ms(), sleep()</text>

  <text x="55" y="352" font-size="11" font-weight="700" fill="#c0392b">2. Очікування ресурсів:</text>
  <text x="200" y="352" font-size="11" fill="#1a1a1a">xSemaphoreTake() з таймаутом &gt; 0</text>

  <text x="55" y="380" font-size="11" font-weight="700" fill="#c0392b">3. Тривалі обчислення:</text>
  <text x="205" y="380" font-size="11" fill="#1a1a1a">складний парсинг чи flash-запис</text>

  <text x="55" y="402" font-size="10" fill="#6b7280">Наслідок: T_wait = T_exec_1 + ... + T_exec_n + T_block</text>

  <!-- Right Box: Safe Design Patterns -->
  <rect x="490" y="265" width="440" height="165" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="710" y="290" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Правила неблокуючого проектування (Safe)</text>

  <rect x="505" y="305" width="410" height="110" rx="6" fill="white" stroke="#27ae60"/>
  <text x="515" y="325" font-size="11" font-weight="700" fill="#27ae60">1. Неблокуюча вибірка:</text>
  <text x="655" y="325" font-size="11" fill="#1a1a1a">опитування з нульовим таймаутом (poll)</text>

  <text x="515" y="352" font-size="11" font-weight="700" fill="#27ae60">2. Швидке повернення:</text>
  <text x="660" y="352" font-size="11" fill="#1a1a1a">лише зміна прапорця чи копіювання</text>

  <text x="515" y="380" font-size="11" font-weight="700" fill="#27ae60">3. Окремий RTOS-потік:</text>
  <text x="660" y="380" font-size="11" fill="#1a1a1a">для тривалих та блокуючих операцій</text>

  <text x="515" y="402" font-size="10" fill="#6b7280">Гарантія: час обробника у черзі робіт &lt; 20-50 мкс</text>
</svg>
