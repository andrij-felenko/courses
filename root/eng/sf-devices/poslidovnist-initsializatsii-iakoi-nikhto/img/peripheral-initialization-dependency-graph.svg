<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф залежностей ініціалізації мікроконтролера та периферії</text>
<rect x="10.0" y="10.0" width="840.0" height="510.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="430.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф строгого порядку ініціалізації апаратних підсистем мікроконтролера</text>
<line x1="240.0" y1="93.0" x2="240.0" y2="117.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240.0" y1="153.0" x2="240.0" y2="177.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240.0" y1="213.0" x2="240.0" y2="237.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240.0" y1="273.0" x2="240.0" y2="297.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240.0" y1="333.0" x2="240.0" y2="357.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240.0" y1="393.0" x2="240.0" y2="417.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="57.0" width="380.0" height="36.0" rx="5" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="240.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Живлення та Flash Wait States</text>
<text x="240.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">V_CORE регулятори, Flash Latency для частоти ядра</text>
<rect x="50.0" y="117.0" width="380.0" height="36.0" rx="5" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="240.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Тактове дерево (Clock Tree)</text>
<text x="240.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">HSE/HSI -&gt; PLL Lock -&gt; System Clock -&gt; APB/AHB</text>
<rect x="50.0" y="177.0" width="380.0" height="36.0" rx="5" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="240.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Тактування шин (RCC Clocks)</text>
<text x="240.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Clock Gating для портів GPIO, DMA та периферії</text>
<rect x="50.0" y="237.0" width="380.0" height="36.0" rx="5" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="240.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Виводи: Засувка -&gt; PinMux</text>
<text x="240.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Запис 1 у BSRR для nCS/nRST -&gt; Режим виводу / AF</text>
<rect x="50.0" y="297.0" width="380.0" height="36.0" rx="5" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="240.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">5. Пам'ять та канали DMA</text>
<text x="240.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Буфери в RAM -&gt; Конфігурація та старт DMA Stream</text>
<rect x="50.0" y="357.0" width="380.0" height="36.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="240.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">6. Периферія та переривання</text>
<text x="240.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Очищення прапорців -&gt; CR/Baud -&gt; NVIC -&gt; Enable</text>
<rect x="50.0" y="417.0" width="380.0" height="36.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="240.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">7. Зняття Reset зовнішнього чипа</text>
<text x="240.0" y="447.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">nRST = 1 -&gt; Пауза t_READY -&gt; Перший обмін на шині</text>
<line x1="430.0" y1="105.0" x2="470.0" y2="105.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
<rect x="470.0" y="85.0" width="340.0" height="40.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.3"/>
<text x="640.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">PLL увімкнено до Flash WS</text>
<text x="640.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Збій вибірки команд -&gt; HardFault ядра</text>
<line x1="430.0" y1="225.0" x2="470.0" y2="225.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
<rect x="470.0" y="205.0" width="340.0" height="40.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.3"/>
<text x="640.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Регістри периферії до RCC</text>
<text x="640.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Запис у знеструмлений блок -&gt; Bus Fault</text>
<line x1="430.0" y1="285.0" x2="470.0" y2="285.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
<rect x="470.0" y="265.0" width="340.0" height="40.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.3"/>
<text x="640.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">PinMux до запису BSRR=1</text>
<text x="640.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Паразитний імпульс (Glitch) на nCS</text>
<line x1="430.0" y1="345.0" x2="470.0" y2="345.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
<rect x="470.0" y="325.0" width="340.0" height="40.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.3"/>
<text x="640.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Периферія (Enable) до DMA</text>
<text x="640.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Втрата першого байта -&gt; Overrun (ORE)</text>
<line x1="430.0" y1="405.0" x2="470.0" y2="405.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
<rect x="470.0" y="385.0" width="340.0" height="40.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.3"/>
<text x="640.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">NVIC до скидання прапорців</text>
<text x="640.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Хибний виклик ISR на порожньому буфері</text>
<rect x="30.0" y="480.0" width="800.0" height="24.0" rx="4" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порушення послідовності на будь-якому рівні призводить до апаратних блокувань або збоїв зв'язку.</text>
</svg>