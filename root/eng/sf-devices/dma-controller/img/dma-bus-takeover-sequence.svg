<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Захоплення та звільнення шини контролером DMA</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Часова діаграма сигналів арбітражу BUSREQ і BUSACK та перемикання майстра шини</text>

  <!-- Загальна рамка діаграми -->
  <rect x="40" y="80" width="880" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Розмітка тактових періодів T1 .. T7 -->
  <line x1="260" y1="95" x2="260" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="95" x2="360" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="460" y1="95" x2="460" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="560" y1="95" x2="560" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="660" y1="95" x2="660" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="760" y1="95" x2="760" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="860" y1="95" x2="860" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="210" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">T1 (CPU)</text>
  <text x="310" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">T2 (Запит)</text>
  <text x="410" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">T3 (Акцепт)</text>
  <text x="510" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">T4 (DMA)</text>
  <text x="610" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">T5 (DMA)</text>
  <text x="710" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">T6 (Реліз)</text>
  <text x="810" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">T7 (CPU)</text>

  <!-- 1. Сигнал CLK -->
  <text x="60" y="142" font-size="13" font-weight="700" fill="#1a1a1a">CLK (Такти)</text>
  <path d="M 160 148 L 185 148 L 185 128 L 210 128 L 210 148 L 235 148 L 235 128 L 260 128 L 260 148 L 285 148 L 285 128 L 310 128 L 310 148 L 335 148 L 335 128 L 360 128 L 360 148 L 385 148 L 385 128 L 410 128 L 410 148 L 435 148 L 435 128 L 460 128 L 460 148 L 485 148 L 485 128 L 510 128 L 510 148 L 535 148 L 535 128 L 560 128 L 560 148 L 585 148 L 585 128 L 610 128 L 610 148 L 635 148 L 635 128 L 660 128 L 660 148 L 685 148 L 685 128 L 710 128 L 710 148 L 735 148 L 735 128 L 760 128 L 760 148 L 785 148 L 785 128 L 810 128 L 810 148 L 835 148 L 835 128 L 860 128 L 860 148 L 880 148" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>

  <!-- 2. Сигнал BUSREQ -->
  <text x="60" y="195" font-size="13" font-weight="700" fill="#2457d6">BUSREQ (Запит)</text>
  <path d="M 160 205 L 285 205 L 285 175 L 685 175 L 685 205 L 880 205" stroke="#2457d6" stroke-width="2" fill="none"/>
  <text x="300" y="170" font-size="12" font-weight="700" fill="#2457d6">DMA виставляє запит</text>
  <text x="700" y="170" font-size="12" font-weight="700" fill="#6b7280">Зняття запиту</text>

  <!-- 3. Сигнал BUSACK -->
  <text x="60" y="250" font-size="13" font-weight="700" fill="#27ae60">BUSACK (Дозвіл)</text>
  <path d="M 160 260 L 385 260 L 385 230 L 735 230 L 735 260 L 880 260" stroke="#27ae60" stroke-width="2" fill="none"/>
  <text x="400" y="225" font-size="12" font-weight="700" fill="#27ae60">CPU підтверджує (ACK)</text>
  <text x="750" y="225" font-size="12" font-weight="700" fill="#6b7280">Повернення CPU</text>

  <!-- 4. Володіння шиною (Master) -->
  <text x="60" y="305" font-size="13" font-weight="700" fill="#1a1a1a">Майстер шини</text>
  <rect x="160" y="285" width="225" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="272" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">CPU керує шиною</text>

  <rect x="385" y="285" width="75" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="422" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Передача</text>

  <rect x="460" y="285" width="275" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="597" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">DMA Контролер (Bus Master)</text>

  <rect x="735" y="285" width="145" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="807" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">CPU керує шиною</text>

  <!-- 5. Шина адреси та даних (Addr / Data) -->
  <text x="60" y="365" font-size="13" font-weight="700" fill="#1a1a1a">Шина даних</text>

  <!-- CPU пакети -->
  <polygon points="160,345 170,335 375,335 385,345 375,355 170,355" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="272" y="349" text-anchor="middle" font-size="12" fill="#1a1a1a">Команди та дані ядра CPU</text>

  <!-- Z-стан -->
  <line x1="385" y1="345" x2="460" y2="345" stroke="#c0392b" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="422" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Hi-Z</text>

  <!-- DMA пакети -->
  <polygon points="460,345 470,335 725,335 735,345 725,355 470,355" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="597" y="349" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Пакетний DMA-обмін (Burst Transfer без участі CPU)</text>

  <!-- Повернення CPU -->
  <polygon points="735,345 745,335 870,335 880,345 870,355 745,355" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="807" y="349" text-anchor="middle" font-size="12" fill="#1a1a1a">Команди CPU</text>

  <!-- Анотація знизу -->
  <text x="480" y="405" text-anchor="middle" font-size="12" fill="#6b7280">Процесор завершує поточний машинний цикл, ізолює шини в Hi-Z і віддає керування каналу DMA</text>

  <text x="480" y="462" text-anchor="middle" font-size="12" fill="#6b7280">Апаратний арбітраж шини унеможливлює конфлікти адресації під час прямого доступу до пам'яті</text>
</svg>
