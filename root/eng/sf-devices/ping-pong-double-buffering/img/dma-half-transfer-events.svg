<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розбиття безперервного масиву на дві рівні половини з тригерами Half Transfer та</text>
  <text x="480" y="64" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Transfer Complete.</text>
  <text x="480" y="94" font-size="13" fill="#6b7280" text-anchor="middle">Суцільний масив діє як два буфери завдяки перериванням від DMA на етапах половинної та повної передачі даних.</text>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="180" y="132" width="600" height="240" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="220" y="172" width="200" height="160" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="540" y="172" width="200" height="160" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="420" y1="252" x2="525" y2="252" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="242" font-size="14" fill="#1a1a1a" text-anchor="middle">Архітектура та</text>
  <text x="320" y="260" font-size="14" fill="#1a1a1a" text-anchor="middle">компоненти</text>
  <text x="640" y="242" font-size="14" fill="#1a1a1a" text-anchor="middle">Схема функціонування</text>
</svg>