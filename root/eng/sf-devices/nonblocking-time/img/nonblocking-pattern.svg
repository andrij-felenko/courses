<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Неблокуючий патерн: «чи вже час?» замість «зачекай»</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не зупиняємось — лише перевіряємо різницю часів і йдемо далі</text>
<rect x="120.0" y="90.0" width="720.0" height="150.0" rx="10" fill="#0f1115" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="140" y="120" font-family="Consolas, monospace" font-size="14.5" fill="#7fb4ff">unsigned long last = 0;</text>
<text x="140" y="146" font-family="Consolas, monospace" font-size="14.5" fill="#e8e8e8">void loop() {</text>
<text x="140" y="172" font-family="Consolas, monospace" font-size="14.5" fill="#e8e8e8">  if (millis() - last &gt;= interval) {</text>
<text x="140" y="198" font-family="Consolas, monospace" font-size="14.5" fill="#7ee0a0">    last += interval;   // наступний строк</text>
<text x="140" y="224" font-family="Consolas, monospace" font-size="14.5" fill="#e8e8e8">    /* зробити дію */ }</text>
<text x="600" y="224" font-family="Consolas, monospace" font-size="14.5" fill="#caa24a">// + інша робота</text>
<text x="250.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ще НЕ час → нічого не робимо,</text>
<text x="250.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">просто йдемо далі по loop()</text>
<text x="710.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">ВЖЕ час → робимо дію</text>
<text x="710.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">й запам'ятовуємо новий строк</text>
<rect x="180.0" y="330.0" width="600.0" height="50.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключ: loop() НЕ зупиняється. Він лиш питає «чи минув інтервал?» — і завжди вільний</text>
<text x="480.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">робити інше. Це і є «блимання без delay».</text>
</svg>
