<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Джитер тривалості імпульсів у bit-bang генерації</text>
  <text x="480" y="53" text-anchor="middle" font-size="13" fill="#6b7280">Переривання CPU та затримки пам'яті спотворюють номінальний період тактування T_nom</text>

  <!-- Main Logic Analyzer Frame -->
  <rect x="24" y="66" width="912" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Status Bar / Header -->
  <circle cx="44" cy="80" r="4" fill="#27ae60"/>
  <text x="56" y="84" font-size="12" font-weight="700" fill="#1a1a1a">ЛОГІЧНИЙ АНАЛІЗАТОР</text>
  <text x="215" y="84" font-size="12" fill="#6b7280">Частота: 100 MS/s • Синхронізація: CH0 ↑ (фронт GPIO)</text>
  <text x="918" y="84" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">Шкала: 10 мкс / поділ</text>
  <line x1="24" y1="92" x2="936" y2="92" stroke="#d0d7de" stroke-width="1"/>

  <!-- Time Ruler -->
  <rect x="200" y="92" width="736" height="24" fill="#eaf0fd"/>
  <line x1="200" y1="116" x2="936" y2="116" stroke="#d0d7de" stroke-width="1"/>

  <text x="220" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">0 мкс</text>
  <text x="320" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">10 мкс</text>
  <text x="420" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">20 мкс</text>
  <text x="520" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">30 мкс</text>
  <text x="620" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">40 мкс</text>
  <text x="720" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">50 мкс</text>
  <text x="820" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">60 мкс</text>
  <text x="910" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">70 мкс</text>

  <line x1="220" y1="112" x2="220" y2="116" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="320" y1="112" x2="320" y2="116" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="420" y1="112" x2="420" y2="116" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="520" y1="112" x2="520" y2="116" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="620" y1="112" x2="620" y2="116" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="720" y1="112" x2="720" y2="116" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="820" y1="112" x2="820" y2="116" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="910" y1="112" x2="910" y2="116" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Shaded Background Columns for Anomalies -->
  <rect x="320" y="117" width="120" height="78" fill="#fdecea"/>
  <rect x="460" y="117" width="160" height="238" fill="#fdecea"/>

  <!-- Channel Column Separator -->
  <line x1="200" y1="92" x2="200" y2="356" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Row Dividers with graduation ticks -->
  <line x1="24" y1="196" x2="936" y2="196" stroke="#d0d7de" stroke-width="1"/>
  <line x1="24" y1="276" x2="936" y2="276" stroke="#d0d7de" stroke-width="1"/>
  <line x1="24" y1="356" x2="936" y2="356" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Graduation ticks on row dividers -->
  <line x1="220" y1="193" x2="220" y2="199" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="320" y1="193" x2="320" y2="199" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="420" y1="193" x2="420" y2="199" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="520" y1="193" x2="520" y2="199" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="620" y1="193" x2="620" y2="199" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="720" y1="193" x2="720" y2="199" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="820" y1="193" x2="820" y2="199" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="910" y1="193" x2="910" y2="199" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Alignment Guides (between CH0, CH1, CH2) -->
  <line x1="220" y1="116" x2="220" y2="196" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="220" y1="196" x2="220" y2="276" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="320" y1="116" x2="320" y2="196" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="320" y1="196" x2="320" y2="276" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Micro-jitter Guide & Badge at x=420 vs x=440 -->
  <rect x="420" y="174" width="20" height="18" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="430" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Δt</text>
  <line x1="420" y1="193" x2="420" y2="216" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="440" y1="193" x2="440" y2="216" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Guide: ISR start at 460 and return at 620 -->
  <line x1="460" y1="138" x2="460" y2="296" stroke="#2457d6" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="620" y1="138" x2="620" y2="296" stroke="#2457d6" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Channel 0: GPIO Bit-bang -->
  <text x="36" y="146" font-size="13" font-weight="700" fill="#c0392b">CH0: GPIO (Bit-bang)</text>
  <text x="36" y="164" font-size="12" fill="#6b7280">Програмна генерація</text>
  <text x="190" y="140" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="190" y="176" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Channel 1: Hardware Reference -->
  <text x="36" y="226" font-size="13" font-weight="700" fill="#27ae60">CH1: Еталон (Hardware)</text>
  <text x="36" y="244" font-size="12" fill="#6b7280">Апаратний таймер / SPI</text>
  <text x="190" y="220" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="190" y="256" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Channel 2: CPU ISR -->
  <text x="36" y="306" font-size="13" font-weight="700" fill="#2457d6">CH2: CPU ISR</text>
  <text x="36" y="324" font-size="12" fill="#6b7280">Обробник переривання</text>
  <text x="190" y="300" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="190" y="336" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Waveform CH1: Hardware Reference (Nominal square wave) -->
  <path d="M 210,216 L 270,216 L 270,252 L 320,252 L 320,216 L 370,216 L 370,252 L 420,252 L 420,216 L 470,216 L 470,252 L 520,252 L 520,216 L 570,216 L 570,252 L 620,252 L 620,216 L 670,216 L 670,252 L 720,252 L 720,216 L 770,216 L 770,252 L 820,252 L 820,216 L 870,216 L 870,252 L 910,252" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Waveform CH2: CPU ISR Activity -->
  <path d="M 210,332 L 460,332 L 460,296 L 620,296 L 620,332 L 910,332" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="540" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">t_ISR = 16.0 мкс</text>

  <!-- Waveform CH0: Bit-bang GPIO -->
  <path d="M 210,136 L 270,136 L 270,172 L 320,172 L 320,136 L 380,136 L 380,172 L 440,172 L 440,136 L 650,136 L 650,172 L 700,172 L 700,136 L 750,136 L 750,172 L 800,172 L 800,136 L 845,136 L 845,172 L 890,172 L 890,136 L 910,136" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Trace In-Pulse Indicators in CH0 -->
  <text x="245" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">10 мкс</text>
  <text x="350" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">12 мкс</text>
  <text x="540" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">T = 26.0 мкс (ISR)</text>
  <text x="725" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">10 мкс</text>
  <text x="822" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">9 мкс</text>

  <!-- Trace In-Pulse Indicators in CH1 -->
  <text x="245" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">T_nom</text>
  <text x="345" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">T_nom</text>
  <text x="445" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">T_nom</text>

  <!-- Bottom Diagnosis / Measurement Cards -->
  <!-- Card 1: Nominal -->
  <rect x="36" y="366" width="270" height="58" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="48" y="384" font-size="12" font-weight="700" fill="#27ae60">1. Еталон: T_nom = 10.0 мкс</text>
  <text x="48" y="399" font-size="12" fill="#1a1a1a">Стабільний період апаратного таймера</text>
  <text x="48" y="413" font-size="12" fill="#6b7280">Джитер відсутній (Δt = 0.0 мкс)</text>

  <!-- Card 2: Micro-jitter -->
  <rect x="322" y="366" width="290" height="58" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="334" y="384" font-size="12" font-weight="700" fill="#c0392b">2. Мікроджитер: T = 12.0 мкс</text>
  <text x="334" y="399" font-size="12" fill="#1a1a1a">Δt = +2.0 мкс (промах Flash I-Cache)</text>
  <text x="334" y="413" font-size="12" fill="#6b7280">Такти очікування CPU спотворюють такт</text>

  <!-- Card 3: Macro-jitter (ISR) -->
  <rect x="628" y="366" width="294" height="58" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="640" y="384" font-size="12" font-weight="700" fill="#c0392b">3. Макроджитер: T = 26.0 мкс</text>
  <text x="640" y="399" font-size="12" fill="#1a1a1a">+t_ISR = 16.0 мкс (переривання ядра)</text>
  <text x="640" y="413" font-size="12" fill="#6b7280">Ядро в ISR — лінія GPIO застигла</text>
</svg>
