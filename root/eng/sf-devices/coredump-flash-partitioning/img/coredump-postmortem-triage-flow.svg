<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Definitions for Arrow Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Конвеєр післяаварійної діагностики: від Flash до GDB</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Пошук валідного слота під час старту, експорт бінарного дампу та реконструкція стеку викликів</text>

  <!-- Inter-stage Transition Arrows (Header level) -->
  <line x1="310" y1="102" x2="335" y2="102" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="623" y1="102" x2="648" y2="102" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Inter-stage Data Flow Arrows (Payload level) -->
  <line x1="310" y1="319" x2="335" y2="319" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arr-blue)"/>
  <line x1="623" y1="319" x2="648" y2="319" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arr-blue)"/>

  <!-- ==================== COLUMN 1: MCU STARTUP & FLASH ==================== -->
  <rect x="24" y="78" width="286" height="442" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="34" y="88" width="266" height="28" rx="5" fill="#2457d6"/>
  <text x="167" y="107" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1. MCU: Старт та аналіз Flash</text>
  <text x="167" y="132" font-size="12" fill="#6b7280" text-anchor="middle">Пошук і валідація слота після ребуту</text>

  <!-- Card 1.1: Reset Cause -->
  <rect x="34" y="144" width="266" height="94" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="42" y="152" width="18" height="18" rx="3" fill="#eaf0fd"/>
  <text x="51" y="165" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">A</text>
  <text x="68" y="166" font-size="13" font-weight="700" fill="#1a1a1a">Детекція причини скиду</text>
  <text x="44" y="188" font-size="12" fill="#1a1a1a">Регістр скиду: <tspan font-family="Consolas, monospace" font-weight="700" fill="#2457d6">RCC_CSR</tspan></text>
  <text x="44" y="206" font-size="12" fill="#c0392b">Статус: <tspan font-weight="700">WWDGRST / HardFault</tspan></text>
  <text x="44" y="224" font-size="12" fill="#2457d6">➔ Запуск перевірки Flash-розділу</text>

  <!-- Arrow 1.1 -> 1.2 -->
  <line x1="167" y1="238" x2="167" y2="250" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Card 1.2: Slot Table -->
  <rect x="34" y="252" width="266" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="42" y="260" width="18" height="18" rx="3" fill="#eaf0fd"/>
  <text x="51" y="273" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">B</text>
  <text x="68" y="274" font-size="13" font-weight="700" fill="#1a1a1a">Обхід слотів (Flash Ring)</text>

  <!-- Slot 0: DIRTY -->
  <rect x="42" y="284" width="250" height="22" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="299" font-size="12" fill="#6b7280">Слот 0: [0x0000] seq=41</text>
  <rect x="226" y="286" width="62" height="18" rx="3" fill="#fdecea"/>
  <text x="257" y="300" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">DIRTY</text>

  <!-- Slot 1: VALID -->
  <rect x="42" y="308" width="250" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="48" y="323" font-size="12" font-weight="700" fill="#1a1a1a">Слот 1: [0x1000] seq=42</text>
  <rect x="226" y="310" width="62" height="18" rx="3" fill="#27ae60"/>
  <text x="257" y="324" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">VALID</text>

  <!-- Slot 2: ERASED -->
  <rect x="42" y="332" width="250" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="347" font-size="12" fill="#6b7280">Слот 2: [0x2000] 0xFF..FF</text>
  <rect x="222" y="334" width="66" height="18" rx="3" fill="#f4f6f8"/>
  <text x="255" y="348" font-size="12" fill="#6b7280" text-anchor="middle">ERASED</text>

  <text x="167" y="372" font-size="12" font-weight="600" fill="#2457d6" text-anchor="middle">Вибір Слот 1: max(seq) та VALID</text>

  <!-- Arrow 1.2 -> 1.3 -->
  <line x1="167" y1="388" x2="167" y2="400" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Card 1.3: CRC Validation -->
  <rect x="34" y="402" width="266" height="106" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <rect x="42" y="410" width="18" height="18" rx="3" fill="#e9f7ef"/>
  <text x="51" y="423" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">C</text>
  <text x="68" y="424" font-size="13" font-weight="700" fill="#27ae60">Валідація цілісності (CRC)</text>
  <text x="44" y="446" font-size="12" fill="#1a1a1a">Заголовок: <tspan font-family="Consolas, monospace" font-weight="700">Magic 0x434F5245</tspan></text>
  <text x="44" y="464" font-size="12" fill="#1a1a1a">Контрольна сума: <tspan font-weight="700" fill="#27ae60">CRC32 OK</tspan></text>
  <rect x="42" y="474" width="250" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="167" y="491" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Дамп готовий до експорту</text>

  <!-- ==================== COLUMN 2: TRANSPORT & EXPORT ==================== -->
  <rect x="337" y="78" width="286" height="442" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="347" y="88" width="266" height="28" rx="5" fill="#2457d6"/>
  <text x="480" y="107" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2. Експорт бінарного дампу</text>
  <text x="480" y="132" font-size="12" fill="#6b7280" text-anchor="middle">Передача сирих даних на хост</text>

  <!-- Card 2.1: Transport Channel -->
  <rect x="347" y="144" width="266" height="94" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="355" y="152" width="18" height="18" rx="3" fill="#eaf0fd"/>
  <text x="364" y="165" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D</text>
  <text x="381" y="166" font-size="13" font-weight="700" fill="#1a1a1a">Канал зв'язку та протокол</text>
  <text x="357" y="188" font-size="12" fill="#1a1a1a">Інтерфейс: <tspan font-weight="600" fill="#2457d6">UART / USB CDC / CAN</tspan></text>
  <text x="357" y="206" font-size="12" fill="#6b7280">Протокол: <tspan fill="#1a1a1a">COBS-кадрування / CRC16</tspan></text>
  <text x="357" y="224" font-size="12" fill="#2457d6">Команда: <tspan font-family="Consolas, monospace" font-weight="700">coredump export</tspan></text>

  <!-- Arrow 2.1 -> 2.2 -->
  <line x1="480" y1="238" x2="480" y2="250" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Card 2.2: Binary Structure -->
  <rect x="347" y="252" width="266" height="136" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="355" y="260" width="18" height="18" rx="3" fill="#eaf0fd"/>
  <text x="364" y="273" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">E</text>
  <text x="381" y="274" font-size="13" font-weight="700" fill="#2457d6">Структура coredump.bin</text>

  <!-- Row 1: Header -->
  <rect x="355" y="284" width="250" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="362" y="299" font-size="12" fill="#1a1a1a">Header: Magic, SHA, CFSR</text>
  <text x="597" y="299" font-size="12" font-weight="600" fill="#2457d6" text-anchor="end">32 B</text>

  <!-- Row 2: Regs -->
  <rect x="355" y="308" width="250" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="362" y="323" font-size="12" fill="#1a1a1a">Регістри: R0-R12, SP, LR, PC</text>
  <text x="597" y="323" font-size="12" font-weight="600" fill="#2457d6" text-anchor="end">68 B</text>

  <!-- Row 3: Stack -->
  <rect x="355" y="332" width="250" height="22" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="362" y="347" font-size="12" fill="#1a1a1a">Стек: дамп активного MSP/PSP</text>
  <text x="597" y="347" font-size="12" font-weight="600" fill="#6b7280" text-anchor="end">2 KB</text>

  <text x="480" y="372" font-size="12" font-weight="600" fill="#2457d6" text-anchor="middle">Формат сумісний із GDB / ELF core</text>

  <!-- Arrow 2.2 -> 2.3 -->
  <line x1="480" y1="388" x2="480" y2="400" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Card 2.3: ACK & Mark -->
  <rect x="347" y="402" width="266" height="106" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="355" y="410" width="18" height="18" rx="3" fill="#fef3c7"/>
  <text x="364" y="423" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">F</text>
  <text x="381" y="424" font-size="13" font-weight="700" fill="#1a1a1a">Квитування та маркування</text>
  <text x="357" y="446" font-size="12" fill="#1a1a1a">Хост: <tspan font-weight="700" fill="#27ae60">ACK отримано (файл записано)</tspan></text>
  <text x="357" y="464" font-size="12" fill="#1a1a1a">MCU: скидання біта <tspan font-family="Consolas, monospace" font-weight="700">1→0</tspan> (без стирання)</text>
  <rect x="355" y="474" width="250" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="480" y="491" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">Слот 1 → DIRTY (захист від циклу)</text>

  <!-- ==================== COLUMN 3: HOST & GDB TRIAGE ==================== -->
  <rect x="650" y="78" width="286" height="442" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="660" y="88" width="266" height="28" rx="5" fill="#2457d6"/>
  <text x="793" y="107" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3. Хост: Реконструкція у GDB</text>
  <text x="793" y="132" font-size="12" fill="#6b7280" text-anchor="middle">Постмортем-аналіз на ПК інженера</text>

  <!-- Card 3.1: Artifacts -->
  <rect x="660" y="144" width="266" height="94" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="668" y="152" width="18" height="18" rx="3" fill="#eaf0fd"/>
  <text x="677" y="165" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">G</text>
  <text x="694" y="166" font-size="13" font-weight="700" fill="#1a1a1a">Вхідні артефакти збірки</text>
  <text x="670" y="188" font-size="12" fill="#1a1a1a">1) <tspan font-family="Consolas, monospace" font-weight="700" fill="#2457d6">coredump.bin</tspan> (дамп пам'яті)</text>
  <text x="670" y="206" font-size="12" fill="#1a1a1a">2) <tspan font-family="Consolas, monospace" font-weight="700" fill="#2457d6">app.elf</tspan> (символи DWARF)</text>
  <text x="670" y="224" font-size="12" fill="#27ae60">✔ Збіг Git SHA: <tspan font-weight="700">0x7a3f81c9</tspan></text>

  <!-- Arrow 3.1 -> 3.2 -->
  <line x1="793" y1="238" x2="793" y2="250" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Card 3.2: GDB Terminal Session -->
  <rect x="660" y="252" width="266" height="136" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="668" y="260" width="18" height="18" rx="3" fill="#eaf0fd"/>
  <text x="677" y="273" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">H</text>
  <text x="694" y="274" font-size="13" font-weight="700" fill="#2457d6">Команди відлагоджувача</text>

  <rect x="668" y="284" width="250" height="96" rx="4" fill="#1a1a1a"/>
  <text x="676" y="301" font-size="12" font-family="Consolas, monospace" fill="#6b7280">$ <tspan fill="#ffffff">arm-none-eabi-gdb app.elf</tspan></text>
  <text x="676" y="318" font-size="12" font-family="Consolas, monospace" fill="#6b7280">(gdb) <tspan fill="#eaf0fd">target core coredump.bin</tspan></text>
  <text x="676" y="335" font-size="12" font-family="Consolas, monospace" fill="#27ae60">Core loaded: PC=0x08004128</text>
  <text x="676" y="352" font-size="12" font-family="Consolas, monospace" fill="#6b7280">(gdb) <tspan fill="#ffffff">bt</tspan> <tspan fill="#6b7280">#0 calc_pid at motor.c:142</tspan></text>
  <text x="676" y="368" font-size="12" font-family="Consolas, monospace" fill="#eaf0fd">#1 motor_task (params=0x0)</text>

  <!-- Arrow 3.2 -> 3.3 -->
  <line x1="793" y1="388" x2="793" y2="400" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Card 3.3: Root Cause Triage -->
  <rect x="660" y="402" width="266" height="106" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="668" y="410" width="18" height="18" rx="3" fill="#fdecea"/>
  <text x="677" y="423" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">I</text>
  <text x="694" y="424" font-size="13" font-weight="700" fill="#c0392b">Локалізація причини аварії</text>
  <text x="670" y="446" font-size="12" fill="#1a1a1a">Стек: <tspan font-weight="700" fill="#2457d6">calc_pid()</tspan> ➔ <tspan font-weight="600">motor_task()</tspan></text>
  <text x="670" y="464" font-size="12" fill="#c0392b">CFSR: <tspan font-family="Consolas, monospace" font-weight="700">0x00008200</tspan> (PRECISERR)</text>
  <rect x="668" y="474" width="250" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="793" y="491" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Причина: розіменування NULL-pointer</text>
</svg>
