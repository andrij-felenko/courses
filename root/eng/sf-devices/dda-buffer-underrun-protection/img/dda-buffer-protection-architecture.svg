<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="960" height="540" fill="#ffffff"/>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
  <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
</defs>

<!-- Header -->
<text x="480" y="27" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Внутрішньосистемна архітектура модуля захисту від спустошення буфера DDA</text>
<text x="480" y="46" font-size="13" fill="#6b7280" text-anchor="middle">Взаємодія планувальника RTOS, SPSC кільцевого буфера, автомата захисту в ISR та тіньових регістрів</text>

<!-- PANEL 1: RTOS Planner (Producer) -->
<rect x="20" y="60" width="270" height="305" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="32" y="70" width="246" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="155" y="86" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">ДОМЕН RTOS: ПЛАНУВАЛЬНИК (Producer)</text>

<rect x="32" y="102" width="246" height="66" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="42" y="120" font-size="13" font-weight="700" fill="#1a1a1a">Генератор траєкторії руху</text>
<text x="42" y="138" font-size="12" fill="#6b7280">• Розрахунок профілю швидкості v(t)</text>
<text x="42" y="154" font-size="12" fill="#6b7280">• Квантування на мікросегменти Δt_k</text>

<rect x="32" y="176" width="246" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="42" y="194" font-size="13" font-weight="700" fill="#1a1a1a">Пакет кванта DdaStepCommand_t</text>
<text x="42" y="212" font-size="12" font-weight="600" fill="#2457d6">step_ticks, dir_mask, duration_us</text>
<text x="42" y="230" font-size="12" fill="#1a1a1a">head = (head + 1) &amp; MASK; __DMB()</text>
<text x="42" y="248" font-size="12" font-weight="600" fill="#27ae60">total_time_avail_us += duration_us</text>
<text x="42" y="264" font-size="12" fill="#6b7280">Атомарний запис покажчика head</text>

<rect x="32" y="280" width="246" height="74" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="42" y="298" font-size="13" font-weight="700" fill="#d97706">Обробка сигналу тривоги</text>
<text x="42" y="316" font-size="12" fill="#1a1a1a">xTaskNotifyWait(): поріг T_warn</text>
<text x="42" y="332" font-size="12" fill="#1a1a1a">Підвищення пріоритету задачі</text>
<text x="42" y="348" font-size="12" fill="#6b7280">Екстрене поповнення черги квантів</text>

<!-- PANEL 2: Shared Memory SPSC Ring Buffer -->
<rect x="325" y="60" width="310" height="305" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="337" y="70" width="286" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="480" y="86" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">БЕЗБЛОКУВАЛЬНИЙ КІЛЬЦЕВИЙ БУФЕР SPSC</text>

<rect x="337" y="102" width="286" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="347" y="120" font-size="13" font-weight="700" fill="#1a1a1a">Кільцева черга команд (FIFO N=128)</text>
<rect x="347" y="128" width="30" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<rect x="381" y="128" width="30" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<rect x="415" y="128" width="30" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<rect x="449" y="128" width="38" height="22" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="468" y="143" font-size="12" fill="#6b7280" text-anchor="middle">...</text>
<rect x="491" y="128" width="30" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<rect x="525" y="128" width="30" height="22" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<rect x="559" y="128" width="54" height="22" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="362" y="166" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">tail (ISR)</text>
<text x="506" y="166" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">head (Plan)</text>
<text x="586" y="166" font-size="12" fill="#6b7280" text-anchor="middle">N=128</text>

<rect x="337" y="190" width="286" height="82" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="347" y="208" font-size="13" font-weight="700" fill="#2457d6">Контроль фізичного часу T_avail</text>
<text x="347" y="226" font-size="12" font-weight="700" fill="#1a1a1a">T_avail = ∑ Δt_k [мкс] (запас часу)</text>
<text x="347" y="244" font-size="12" fill="#6b7280">• Захист від пастки швидких мікросегментів</text>
<text x="347" y="262" font-size="12" fill="#6b7280">• Кількість N оманлива — T_avail єдиний критерій</text>

<rect x="337" y="280" width="286" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="347" y="298" font-size="13" font-weight="700" fill="#1a1a1a">Порогові уставки захисту</text>
<text x="347" y="316" font-size="12" font-weight="600" fill="#d97706">T_warn : поріг попередження (сигнал в RTOS)</text>
<text x="347" y="334" font-size="12" font-weight="600" fill="#c0392b">T_decel = v_0 / a_max + T_margin : старт гальмування</text>
<text x="347" y="349" font-size="12" fill="#6b7280">Гарантія повної зупинки до опустошення буфера</text>

<!-- PANEL 3: ISR Consumer & State Machine -->
<rect x="670" y="60" width="270" height="305" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="682" y="70" width="246" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="805" y="86" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">ДОМЕН ISR: АВТОМАТ СТАНІВ (Consumer)</text>

<rect x="682" y="102" width="246" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="692" y="120" font-size="13" font-weight="700" fill="#1a1a1a">Вибірка кванта руху в ISR</text>
<text x="692" y="138" font-size="12" fill="#1a1a1a">tail++; total_time_avail_us -= duration_us</text>

<rect x="682" y="162" width="246" height="192" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="692" y="179" font-size="13" font-weight="700" fill="#1a1a1a">Автомат станів захисту DDA</text>

<rect x="692" y="188" width="226" height="25" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="700" y="205" font-size="12" font-weight="700" fill="#2457d6">NORMAL:</text>
<text x="754" y="205" font-size="12" fill="#1a1a1a">T_avail &gt; T_warn (штат)</text>

<rect x="692" y="219" width="226" height="25" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="700" y="236" font-size="12" font-weight="700" fill="#d97706">WARNING:</text>
<text x="762" y="236" font-size="12" fill="#1a1a1a">сигнал xTaskNotify in RTOS</text>

<rect x="692" y="250" width="226" height="37" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="700" y="265" font-size="12" font-weight="700" fill="#c0392b">DECELERATING:</text>
<text x="792" y="265" font-size="12" fill="#1a1a1a">T_avail ≤ T_decel</text>
<text x="700" y="281" font-size="12" font-weight="600" fill="#c0392b">Автономний Тейлор Q16 (v → 0)</text>

<rect x="692" y="293" width="226" height="25" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="700" y="310" font-size="12" font-weight="700" fill="#27ae60">STOPPED:</text>
<text x="760" y="310" font-size="12" fill="#1a1a1a">v = 0, кроки збережено</text>

<rect x="692" y="324" width="226" height="25" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
<text x="700" y="341" font-size="12" font-weight="700" fill="#6b7280">RECOVERY:</text>
<text x="768" y="341" font-size="12" fill="#1a1a1a">буфер &gt; watermark → рух</text>

<!-- Inter-panel arrows in gaps -->
<line x1="290" y1="210" x2="325" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<line x1="325" y1="316" x2="290" y2="316" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-amber)"/>

<line x1="635" y1="128" x2="670" y2="128" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<line x1="635" y1="240" x2="670" y2="240" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

<!-- Vertical link to lower hardware section -->
<line x1="805" y1="365" x2="805" y2="380" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

<!-- PANEL 4: Hardware Timer & Shadow Registers -->
<rect x="20" y="380" width="450" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="32" y="390" width="426" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="245" y="406" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">АПАРАТНИЙ ТАЙМЕР: ТІНЬОВІ РЕГІСТРИ ТА ПОДІЯ UEV</text>

<rect x="32" y="422" width="206" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="42" y="440" font-size="13" font-weight="700" fill="#1a1a1a">Регістр періоду ARR</text>
<text x="42" y="458" font-size="12" font-weight="600" fill="#2457d6">ARR Preload (буферний, ARPE=1)</text>
<text x="42" y="476" font-size="12" font-weight="600" fill="#27ae60">ARR Shadow (активний тіньовий)</text>
<text x="42" y="494" font-size="12" fill="#6b7280">Перенесення: строго по події UEV</text>
<text x="42" y="508" font-size="12" fill="#6b7280">Синхронізація на переповненні CNT</text>

<rect x="248" y="422" width="210" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="258" y="440" font-size="13" font-weight="700" fill="#27ae60">Захист від гонитви (Race Condition)</text>
<text x="258" y="458" font-size="12" fill="#1a1a1a">• Лічильник CNT рахує без пауз</text>
<text x="258" y="474" font-size="12" fill="#1a1a1a">• Новий період діє з наступного кроку</text>
<text x="258" y="490" font-size="12" font-weight="700" fill="#c0392b">• Виключає пропуск збігу CNT == ARR</text>
<text x="258" y="506" font-size="12" fill="#6b7280">• Запобігає затримкам на 65536 тактів</text>

<!-- PANEL 5: Low-Level Math & Step Generation -->
<rect x="490" y="380" width="450" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="502" y="390" width="426" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="715" y="406" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ДЕКРЕМЕНТ ШВИДКОСТІ ТА ВИХОДИ КЕРУВАННЯ</text>

<rect x="502" y="422" width="238" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="512" y="440" font-size="13" font-weight="700" fill="#1a1a1a">Розрахунок інтервалу c_n (ISR)</text>
<text x="512" y="457" font-size="12" font-weight="700" fill="#2457d6">c_n = c_{n-1} + Δc_n</text>
<text x="512" y="473" font-size="12" font-weight="700" fill="#2457d6">де Δc_n = (c_prev · K_Q16[n]) &gt;&gt; 16</text>
<text x="512" y="490" font-size="12" fill="#27ae60">• Швидкість: 2–3 такти процесора</text>
<text x="512" y="506" font-size="12" fill="#6b7280">• Без ділень і FPU: нуль джитера</text>

<rect x="750" y="422" width="178" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="758" y="440" font-size="13" font-weight="700" fill="#1a1a1a">Виходи на драйвер</text>
<text x="758" y="458" font-size="12" font-weight="700" fill="#2457d6">STEP : канал таймера CCR</text>
<text x="758" y="476" font-size="12" fill="#1a1a1a">DIR   : лінія GPIO (напрямок)</text>
<text x="758" y="494" font-size="12" font-weight="700" fill="#27ae60">Soft-Stop без втрати кроків</text>
<text x="758" y="508" font-size="12" fill="#6b7280">Збереження координат приводу</text>

<!-- Connection between Taylor math and ARR Preload -->
<line x1="490" y1="468" x2="470" y2="468" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

</svg>
