<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" fill="#1a1a1a" font-size="18" font-weight="bold" text-anchor="middle">Автономний конвеєр обчислень CORDIC через DMA та таймер ШІМ</text>
  <text x="480" y="60" fill="#6b7280" font-size="13" text-anchor="middle">Апаратна обробка вибірок без участі процесора усуває часове тремтіння (CPU load = 0%)</text>

  <!-- 1. Синхронізація та АЦП -->
  <rect x="25" y="82" width="155" height="316" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="102" y="104" fill="#1a1a1a" font-size="13" font-weight="bold" text-anchor="middle">1. Генератор подій</text>
  <text x="102" y="120" fill="#6b7280" font-size="12" text-anchor="middle">Синхронізація циклу</text>

  <rect x="35" y="132" width="135" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="102" y="152" fill="#2457d6" font-size="13" font-weight="bold" text-anchor="middle">Таймер ШІМ</text>
  <text x="102" y="170" fill="#1a1a1a" font-size="12" text-anchor="middle">TIM1 (Advanced)</text>
  <text x="102" y="190" fill="#1a1a1a" font-size="12" text-anchor="middle">Строб TRGO</text>
  <text x="102" y="210" fill="#6b7280" font-size="12" text-anchor="middle">f_PWM = 20–50 кГц</text>

  <line x1="102" y1="232" x2="102" y2="262" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="35" y="262" width="135" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="102" y="282" fill="#1a1a1a" font-size="13" font-weight="bold" text-anchor="middle">Модуль АЦП</text>
  <text x="102" y="302" fill="#1a1a1a" font-size="12" text-anchor="middle">Вибірка струмів</text>
  <text x="102" y="322" fill="#2457d6" font-size="12" font-weight="bold" text-anchor="middle">Фази (Ia, Ib)</text>
  <text x="102" y="342" fill="#1a1a1a" font-size="12" text-anchor="middle">Регістр ADC_DR</text>
  <text x="102" y="364" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle">Запит DMA (EOC)</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="180" y1="333" x2="210" y2="333" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 2. Канал DMA 1 -->
  <rect x="210" y="82" width="150" height="316" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="285" y="104" fill="#1a1a1a" font-size="13" font-weight="bold" text-anchor="middle">2. Канал DMA 1</text>
  <text x="285" y="120" fill="#6b7280" font-size="12" text-anchor="middle">Вхідне пересилання</text>

  <rect x="220" y="132" width="130" height="138" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="285" y="152" fill="#2457d6" font-size="13" font-weight="bold" text-anchor="middle">Транзакція DMA 1</text>
  <text x="285" y="172" fill="#1a1a1a" font-size="12" text-anchor="middle">Звідки: ADC_DR</text>
  <text x="285" y="192" fill="#1a1a1a" font-size="12" text-anchor="middle">Кут θ / Струми</text>
  <text x="285" y="214" fill="#2457d6" font-size="12" font-weight="bold" text-anchor="middle">Формат Q1.31</text>
  <text x="285" y="234" fill="#6b7280" font-size="12" text-anchor="middle">32 біти / такт</text>
  <text x="285" y="254" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle">Куди: WDATA</text>

  <line x1="285" y1="284" x2="285" y2="270" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="220" y="284" width="130" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="285" y="304" fill="#1a1a1a" font-size="12" font-weight="bold" text-anchor="middle">Апаратний тригер</text>
  <text x="285" y="324" fill="#2457d6" font-size="12" font-weight="bold" text-anchor="middle">Сигнал ADC_EOC</text>
  <text x="285" y="344" fill="#1a1a1a" font-size="12" text-anchor="middle">Автостарт каналу</text>
  <text x="285" y="364" fill="#6b7280" font-size="12" text-anchor="middle">Нуль тактів CPU</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="360" y1="166" x2="390" y2="166" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 3. CORDIC -->
  <rect x="390" y="82" width="180" height="316" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="104" fill="#1a1a1a" font-size="13" font-weight="bold" text-anchor="middle">3. Співпроцесор CORDIC</text>
  <text x="480" y="120" fill="#6b7280" font-size="12" text-anchor="middle">Апаратний прискорювач</text>

  <rect x="400" y="132" width="160" height="68" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="152" fill="#2457d6" font-size="13" font-weight="bold" text-anchor="middle">Порт CORDIC_WDATA</text>
  <text x="480" y="170" fill="#1a1a1a" font-size="12" text-anchor="middle">Запис аргументу (θ, x, y)</text>
  <text x="480" y="188" fill="#2457d6" font-size="12" font-weight="bold" text-anchor="middle">Автостарт обчислення</text>

  <line x1="480" y1="200" x2="480" y2="216" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="400" y="216" width="160" height="88" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="234" fill="#1a1a1a" font-size="13" font-weight="bold" text-anchor="middle">Апаратне ядро CORDIC</text>
  <text x="480" y="252" fill="#2457d6" font-size="12" text-anchor="middle">Регістри X, Y, Z + ROM αᵢ</text>
  <text x="480" y="270" fill="#1a1a1a" font-size="12" text-anchor="middle">Псевдообертання (зсуви)</text>
  <text x="480" y="288" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle">24 такти (0.16 мкс)</text>

  <line x1="480" y1="304" x2="480" y2="320" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="400" y="320" width="160" height="64" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="340" fill="#27ae60" font-size="13" font-weight="bold" text-anchor="middle">Порт CORDIC_RDATA</text>
  <text x="480" y="358" fill="#1a1a1a" font-size="12" text-anchor="middle">Результати: sin(θ), cos(θ)</text>
  <text x="480" y="374" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle">Прапорець RRDY = 1</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="570" y1="352" x2="600" y2="352" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- 4. Канал DMA 2 -->
  <rect x="600" y="82" width="150" height="316" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="675" y="104" fill="#1a1a1a" font-size="13" font-weight="bold" text-anchor="middle">4. Канал DMA 2</text>
  <text x="675" y="120" fill="#6b7280" font-size="12" text-anchor="middle">Вихідне пересилання</text>

  <rect x="610" y="132" width="130" height="94" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="675" y="152" fill="#1a1a1a" font-size="12" font-weight="bold" text-anchor="middle">Режим пересилання</text>
  <text x="675" y="172" fill="#2457d6" font-size="12" text-anchor="middle">Циклічний (Circular)</text>
  <text x="675" y="192" fill="#1a1a1a" font-size="12" text-anchor="middle">Подвійна буферизація</text>
  <text x="675" y="212" fill="#6b7280" font-size="12" text-anchor="middle">Без участі процесора</text>

  <line x1="675" y1="226" x2="675" y2="240" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="610" y="240" width="130" height="142" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="675" y="260" fill="#27ae60" font-size="13" font-weight="bold" text-anchor="middle">Вивантаження DMA</text>
  <text x="675" y="280" fill="#1a1a1a" font-size="12" text-anchor="middle">Тригер: CORDIC_RRDY</text>
  <text x="675" y="300" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle">Звідки: RDATA</text>
  <text x="675" y="322" fill="#1a1a1a" font-size="12" text-anchor="middle">Формат 2 × Q1.15</text>
  <text x="675" y="342" fill="#6b7280" font-size="12" text-anchor="middle">або Q1.31 (32 біти)</text>
  <text x="675" y="364" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle">Куди: TIM_CCR / RAM</text>

  <!-- Стрілки 4 -> 5 -->
  <line x1="750" y1="352" x2="780" y2="352" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="750" y1="177" x2="780" y2="177" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- 5. Споживачі даних -->
  <rect x="780" y="82" width="155" height="316" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="857" y="104" fill="#1a1a1a" font-size="13" font-weight="bold" text-anchor="middle">5. Споживачі даних</text>
  <text x="857" y="120" fill="#6b7280" font-size="12" text-anchor="middle">Керування та пам'ять</text>

  <rect x="790" y="132" width="135" height="94" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="857" y="152" fill="#1a1a1a" font-size="12" font-weight="bold" text-anchor="middle">Буфер ОЗП (SRAM)</text>
  <text x="857" y="172" fill="#2457d6" font-size="12" text-anchor="middle">Подвійний буфер (A/B)</text>
  <text x="857" y="192" fill="#1a1a1a" font-size="12" text-anchor="middle">DMA наповнює буфер A</text>
  <text x="857" y="212" fill="#6b7280" font-size="12" text-anchor="middle">CPU читає буфер B</text>

  <rect x="790" y="240" width="135" height="142" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="857" y="260" fill="#27ae60" font-size="13" font-weight="bold" text-anchor="middle">Регістри ШІМ</text>
  <text x="857" y="280" fill="#1a1a1a" font-size="12" font-weight="bold" text-anchor="middle">TIM1_CCR1..3</text>
  <text x="857" y="300" fill="#1a1a1a" font-size="12" text-anchor="middle">Миттєве оновлення</text>
  <text x="857" y="322" fill="#2457d6" font-size="12" text-anchor="middle">Коефіцієнт ШІМ</text>
  <text x="857" y="344" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle">Керування інвертором</text>
  <text x="857" y="366" fill="#6b7280" font-size="12" text-anchor="middle">Нульовий jitter</text>

  <!-- Статус CPU Core & RTOS -->
  <rect x="25" y="414" width="910" height="62" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="37" y="423" width="130" height="44" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="102" y="442" fill="#27ae60" font-size="13" font-weight="bold" text-anchor="middle">Cortex-M Core</text>
  <text x="102" y="458" fill="#1a1a1a" font-size="12" text-anchor="middle">CPU Load = 0%</text>

  <text x="185" y="440" fill="#1a1a1a" font-size="13" font-weight="bold">Повна апаратна ізоляція: процесор не бере участі в потокових обчисленнях</text>
  <text x="185" y="460" fill="#6b7280" font-size="12">Нульовий jitter • Ядро процесора вільне для регуляторів швидкості, завдань RTOS та діагностики</text>
</svg>
