<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр збору, агрегації метрик здоров'я та ухвалення рішень супервізором</text>
<rect x="15.0" y="15.0" width="910.0" height="490.0" rx="8" fill="#fafbfc" stroke="#d1d5db" stroke-width="1.2"/>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр супервізора: від сирих апаратних подій до інтегрального індексу здоров'я</text>
<text x="125.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Джерела сигналів</text>
<rect x="25.0" y="100.0" width="200.0" height="58.0" rx="6" fill="#eef6fc" stroke="#2457d6" stroke-width="1.4"/><text x="125.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Апаратний рівень</tspan><tspan x="125.0" dy="13.7">(IWDG / WWDG / EWI)</tspan></text>
<line x1="225.0" y1="129.0" x2="285.0" y2="129.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="25.0" y="180.0" width="200.0" height="58.0" rx="6" fill="#fff9e6" stroke="#b78103" stroke-width="1.4"/><text x="125.0" y="205.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Підсистема живлення</tspan><tspan x="125.0" dy="13.7">(PVD / BOR / Ripple ADC)</tspan></text>
<line x1="225.0" y1="209.0" x2="285.0" y2="209.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="25.0" y="260.0" width="200.0" height="58.0" rx="6" fill="#f3faf4" stroke="#27ae60" stroke-width="1.4"/><text x="125.0" y="285.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Планувальник RTOS</tspan><tspan x="125.0" dy="13.7">(Stack Watermark / Jitter)</tspan></text>
<line x1="225.0" y1="289.0" x2="285.0" y2="289.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="25.0" y="340.0" width="200.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="125.0" y="365.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Периферійні шини</tspan><tspan x="125.0" dy="13.7">(I2C lock / CAN Bus-off)</tspan></text>
<line x1="225.0" y1="369.0" x2="285.0" y2="369.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="25.0" y="420.0" width="200.0" height="58.0" rx="6" fill="#f5f0fa" stroke="#6c3483" stroke-width="1.4"/><text x="125.0" y="445.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Фізичний знос</tspan><tspan x="125.0" dy="13.7">(Flash cycles / Relay ESR)</tspan></text>
<line x1="225.0" y1="449.0" x2="285.0" y2="449.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. Нормалізація та згладжування</text>
<rect x="285.0" y="115.0" width="210.0" height="58.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="390.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Приведення до цілочисельного</tspan><tspan x="390.0" dy="12.3">індексу [0 ... 1000] (Fixed-Point)</tspan></text>
<line x1="495.0" y1="144.0" x2="555.0" y2="270.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="285.0" y="211.0" width="210.0" height="58.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="390.0" y="237.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Ковзне експоненційне вікно</tspan><tspan x="390.0" dy="12.3">EWMA: H[k] = α·x[k] + (1-α)·H[k-1]</tspan></text>
<line x1="495.0" y1="240.0" x2="555.0" y2="270.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="285.0" y="307.0" width="210.0" height="58.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="390.0" y="332.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Виявлення спалахів та трендів</tspan><tspan x="390.0" dy="13.7">(Burst / Drift Detection)</tspan></text>
<line x1="495.0" y1="336.0" x2="555.0" y2="270.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="285.0" y="403.0" width="210.0" height="58.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="390.0" y="428.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Динамічний дебаунсинг</tspan><tspan x="390.0" dy="13.7">(Фільтрація завад N з M)</tspan></text>
<line x1="495.0" y1="432.0" x2="555.0" y2="270.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="650.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">3. Розрахунок Health Score</text>
<rect x="555.0" y="140.0" width="190.0" height="260.0" rx="6" fill="#f8f9fa" stroke="#2457d6" stroke-width="1.8"/><text x="650.0" y="205.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Вагова матриця W_i</tspan><tspan x="650.0" dy="13.7">та нелінійний штраф:</tspan><tspan x="650.0" dy="13.7"></tspan><tspan x="650.0" dy="13.7">Score = Σ (w_i · h_i)</tspan><tspan x="650.0" dy="13.7">× Penalty_critical</tspan><tspan x="650.0" dy="13.7"></tspan><tspan x="650.0" dy="13.7">Критичний вузол = 0</tspan><tspan x="650.0" dy="13.7">→ Системний Score = 0</tspan><tspan x="650.0" dy="13.7"></tspan><tspan x="650.0" dy="13.7">Детекція деградації</tspan><tspan x="650.0" dy="13.7">та оцінка залишку MTBF</tspan></text>
<line x1="745.0" y1="270.0" x2="785.0" y2="270.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="855.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">4. Дії супервізора</text>
<rect x="785.0" y="100.0" width="140.0" height="58.0" rx="6" fill="#f3faf4" stroke="#27ae60" stroke-width="1.5"/><text x="855.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">Nominal (900-1000)</tspan><tspan x="855.0" dy="13.0">Годівля Watchdog</tspan></text>
<rect x="785.0" y="180.0" width="140.0" height="58.0" rx="6" fill="#fff9e6" stroke="#b78103" stroke-width="1.5"/><text x="855.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">Degraded (700-899)</tspan><tspan x="855.0" dy="13.0">Лог + Warning flags</tspan></text>
<rect x="785.0" y="260.0" width="140.0" height="58.0" rx="6" fill="#fff0ea" stroke="#d35400" stroke-width="1.5"/><text x="855.0" y="286.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">Critical (400-699)</tspan><tspan x="855.0" dy="11.7">Failover резерву / I2C reset</tspan></text>
<rect x="785.0" y="340.0" width="140.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="855.0" y="366.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">Emergency (&lt; 400)</tspan><tspan x="855.0" dy="11.7">Safe State + NMI + Dump</tspan></text>
</svg>