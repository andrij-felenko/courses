<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Часова діаграма сигналів STEP та DIR крокового приводу</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Вимоги драйвера крокового двигуна: t_setup, t_hold та t_high відносно активного фронту</text>

  <rect x="40" y="80" width="880" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1. Сигнал DIR (Напрямок руху) -->
  <text x="60" y="145" font-size="14" font-weight="700" fill="#2457d6">DIR (Напрямок)</text>
  <path d="M 180 160 L 300 160 L 330 125 L 860 125" stroke="#2457d6" stroke-width="2.5" fill="none"/>

  <text x="230" y="152" text-anchor="middle" font-size="12" fill="#6b7280">Рівень 0 (CW)</text>
  <text x="750" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Рівень 1 (CCW)</text>

  <!-- 2. Сигнал STEP (Імпульси кроку) -->
  <text x="60" y="245" font-size="14" font-weight="700" fill="#27ae60">STEP (Імпульс)</text>
  <path d="M 180 260 L 480 260 L 480 210 L 640 210 L 640 260 L 860 260" stroke="#27ae60" stroke-width="2.5" fill="none"/>

  <!-- Активний наростаючий фронт -->
  <line x1="480" y1="100" x2="480" y2="400" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="480" cy="235" r="4" fill="#c0392b"/>
  <text x="490" y="195" font-size="12" font-weight="700" fill="#c0392b">Активний наростаючий фронт</text>

  <!-- t_setup: від зміни DIR до фронту STEP -->
  <line x1="330" y1="140" x2="330" y2="300" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="335" y1="290" x2="475" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr-main)"/>
  <text x="405" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">t_setup (Час встановлення DIR)</text>
  <text x="405" y="308" text-anchor="middle" font-size="12" fill="#6b7280">типово &gt;= 5 мкс (TMC2209 / A4988)</text>

  <!-- t_high: тривалість імпульсу STEP -->
  <line x1="640" y1="210" x2="640" y2="300" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="485" y1="225" x2="635" y2="225" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="560" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">t_high (&gt;= 1-2 мкс)</text>

  <!-- t_hold: час утримання DIR після фронту -->
  <line x1="720" y1="125" x2="720" y2="300" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="485" y1="290" x2="715" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr-main)"/>
  <text x="600" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">t_hold (Час утримання)</text>
  <text x="600" y="308" text-anchor="middle" font-size="12" fill="#6b7280">типово &gt;= 5 мкс</text>

  <!-- Пояснювальні плашки внизу -->
  <rect x="60" y="340" width="400" height="75" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="260" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Помилка: зміна DIR одночасно зі STEP</text>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#1a1a1a">Порушення t_setup призводить до хибного кроку</text>
  <text x="260" y="398" text-anchor="middle" font-size="12" fill="#6b7280">у зворотному напрямку або пропуску кроку</text>

  <rect x="490" y="340" width="410" height="75" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="695" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Рішення: випереджальний запис через DMA</text>
  <text x="695" y="380" text-anchor="middle" font-size="12" fill="#1a1a1a">Регістр BSRR оновлює DIR на 1 таймерний такт</text>
  <text x="695" y="398" text-anchor="middle" font-size="12" fill="#6b7280">раніше за строб підняття лінії STEP</text>

  <text x="480" y="462" text-anchor="middle" font-size="12" fill="#6b7280">Суворе дотримання t_setup та t_hold гарантує надійність крокового позиціонування ЧПК-верстатів</text>
</svg>
