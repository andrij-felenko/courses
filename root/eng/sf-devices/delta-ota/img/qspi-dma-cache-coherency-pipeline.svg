<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Когерентність кеша D-Cache при роботі DMA та QSPI</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Синхронізація Clean/Invalidate та бар'єри DSB між ядром, кешем, SRAM і периферією</text>

  <!-- Стовпці / Учасники -->
  <!-- Ядро CPU -->
  <rect x="50" y="85" width="150" height="46" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Ядро Cortex-M7</text>
  <line x1="125" y1="131" x2="125" y2="440" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- D-Cache -->
  <rect x="235" y="85" width="150" height="46" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="310" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">L1 D-Cache</text>
  <line x1="310" y1="131" x2="310" y2="440" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- SRAM Пам'ять -->
  <rect x="420" y="85" width="150" height="46" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="495" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">AXI SRAM</text>
  <line x1="495" y1="131" x2="495" y2="440" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- DMA Контролер -->
  <rect x="605" y="85" width="150" height="46" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="680" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">MDMA / DMA</text>
  <line x1="680" y1="131" x2="680" y2="440" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- QSPI Периферія -->
  <rect x="790" y="85" width="130" height="46" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="855" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">QSPI Flash</text>
  <line x1="855" y1="131" x2="855" y2="440" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Секція 1: Передача TX (Ядро -> QSPI) -->
  <rect x="35" y="145" width="890" height="135" rx="6" fill="#f4f6f8" fill-opacity="0.4" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="162" font-size="12" font-weight="700" fill="#2457d6">Етап 1: Запис дельта-блоку (TX: Ядро готує буфер для запису у Flash)</text>

  <!-- 1.1 CPU пише в кеш -->
  <line x1="125" y1="180" x2="302" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="215" y="174" text-anchor="middle" font-size="12" fill="#1a1a1a">Запис у буфер (Dirty рядок у D-Cache)</text>

  <!-- 1.2 Clean + DSB -->
  <line x1="125" y1="212" x2="302" y2="212" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="215" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">SCB_CleanDCache() + DSB()</text>

  <!-- 1.3 Flush кеша в SRAM -->
  <line x1="310" y1="228" x2="487" y2="228" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="402" y="222" text-anchor="middle" font-size="12" fill="#2457d6">Виштовхування рядка в SRAM</text>

  <!-- 1.4 Запуск DMA та передача -->
  <line x1="125" y1="256" x2="672" y2="256" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="400" y="250" text-anchor="middle" font-size="12" fill="#c0392b">Старт DMA-передачі (SRAM → QSPI FIFO)</text>

  <line x1="680" y1="268" x2="847" y2="268" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="765" y="262" text-anchor="middle" font-size="12" fill="#27ae60">Запис у Flash</text>

  <!-- Секція 2: Прийом RX (QSPI -> Ядро) -->
  <rect x="35" y="295" width="890" height="135" rx="6" fill="#f4f6f8" fill-opacity="0.4" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="312" font-size="12" font-weight="700" fill="#27ae60">Етап 2: Зчитування верифікаційного блоку (RX: DMA читає з Flash в SRAM)</text>

  <!-- 2.1 DMA вичитує з QSPI в SRAM -->
  <line x1="855" y1="330" x2="688" y2="330" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="765" y="324" text-anchor="middle" font-size="12" fill="#27ae60">Зчитування байтів</text>

  <line x1="680" y1="345" x2="503" y2="345" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="590" y="339" text-anchor="middle" font-size="12" fill="#c0392b">DMA пише в SRAM (повз кеш)</text>

  <!-- 2.2 Invalidate D-Cache + DSB -->
  <line x1="125" y1="375" x2="302" y2="375" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="215" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">SCB_InvalidateDCache() + DSB()</text>

  <!-- 2.3 Анулювання рядка -->
  <rect x="240" y="390" width="140" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="310" y="407" text-anchor="middle" font-size="12" fill="#c0392b">Анулювання тегів у кеші</text>

  <!-- 2.4 CPU читає з пам'яті -->
  <line x1="125" y1="418" x2="487" y2="418" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="310" y="426" text-anchor="middle" font-size="12" fill="#27ae60">Ядро читає оновлені дані безпосередньо з SRAM</text>

  <text x="480" y="462" text-anchor="middle" font-size="12" fill="#6b7280">Без інвалідації D-Cache ядро прочитало б застарілі дані з кеша замість результату DMA</text>
</svg>
