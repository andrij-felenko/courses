<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Аварійне відновлення після збою живлення при OTA-оновленні</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Спрацьовування порогів PVD/BOR, фіксація стану оновлення та відкат на стабільний слот</text>

  <!-- Верхня панель: Графік напруги та порогові детектори -->
  <rect x="40" y="80" width="880" height="175" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="104" font-size="14" font-weight="700" fill="#1a1a1a">Фаза 1: Спад напруги живлення Vdd та апаратні пороги</text>

  <!-- Осі графіка -->
  <line x1="120" y1="225" x2="680" y2="225" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <line x1="120" y1="225" x2="120" y2="115" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="690" y="229" font-size="12" fill="#6b7280">Час t</text>
  <text x="110" y="115" text-anchor="end" font-size="12" fill="#6b7280">Vdd</text>

  <!-- Рівні напруги -->
  <line x1="120" y1="135" x2="680" y2="135" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="110" y="139" text-anchor="end" font-size="12" font-weight="700" fill="#27ae60">3.3 В</text>
  <text x="690" y="139" font-size="12" fill="#27ae60">3.3 В (Номінальне Vdd)</text>

  <line x1="120" y1="165" x2="680" y2="165" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="110" y="169" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">2.7 В</text>
  <text x="690" y="169" font-size="12" fill="#2457d6">2.7 В (Поріг PVD — NMI)</text>

  <line x1="120" y1="200" x2="680" y2="200" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="110" y="204" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b">2.1 В</text>
  <text x="690" y="204" font-size="12" fill="#c0392b">2.1 В (Поріг BOR — Reset)</text>

  <!-- Крива спаду напруги -->
  <path d="M 120 135 L 260 135 C 320 135, 380 165, 430 165 C 470 165, 520 200, 580 215" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>

  <!-- Події на графіку -->
  <circle cx="430" cy="165" r="4" fill="#2457d6"/>
  <line x1="430" y1="165" x2="430" y2="120" stroke="#2457d6" stroke-width="1"/>
  <text x="430" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">PVD Interrupt: збереження транзакції</text>

  <circle cx="545" cy="200" r="4" fill="#c0392b"/>
  <line x1="545" y1="200" x2="545" y2="182" stroke="#c0392b" stroke-width="1"/>
  <text x="545" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">BOR: блокування Flash</text>

  <!-- Нижня панель: Логіка завантажувача після відновлення живлення -->
  <rect x="40" y="270" width="880" height="175" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="294" font-size="14" font-weight="700" fill="#1a1a1a">Фаза 2: Відновлення живлення та процедура відкату (Rollback)</text>

  <!-- Блок 1: Старт Bootloader -->
  <rect x="60" y="315" width="180" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="150" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">1. Старт завантажувача</text>
  <text x="150" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">Аналіз регістра скидання</text>
  <text x="150" y="376" text-anchor="middle" font-size="12" fill="#1a1a1a">(Прапорець BOR/POR)</text>
  <text x="150" y="394" text-anchor="middle" font-size="12" fill="#6b7280">Зчитування метаданих</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="240" y1="362" x2="278" y2="362" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- Блок 2: Перевірка транзакції -->
  <rect x="280" y="315" width="190" height="95" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="375" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">2. Валідація образу</text>
  <text x="375" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">Стан транзакції: UNFINISHED</text>
  <text x="375" y="376" text-anchor="middle" font-size="12" fill="#1a1a1a">Помилка CRC32 або</text>
  <text x="375" y="394" text-anchor="middle" font-size="12" fill="#c0392b">лічильник спроб = 0</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="470" y1="362" x2="508" y2="362" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- Блок 3: Відкат на безпечний слот -->
  <rect x="510" y="315" width="190" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="605" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">3. Активація Rollback</text>
  <text x="605" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">Позначення слота B як INVALID</text>
  <text x="605" y="376" text-anchor="middle" font-size="12" fill="#1a1a1a">Вибір слота A (Golden Image)</text>
  <text x="605" y="394" text-anchor="middle" font-size="12" fill="#6b7280">Оновлення лічильника збоїв</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="700" y1="362" x2="738" y2="362" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- Блок 4: Успішний запуск -->
  <rect x="740" y="315" width="165" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="822" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">4. Безпечний запуск</text>
  <text x="822" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">Запуск стабільного</text>
  <text x="822" y="376" text-anchor="middle" font-size="12" fill="#1a1a1a">образу з слота A</text>
  <text x="822" y="394" text-anchor="middle" font-size="12" fill="#27ae60">Пристрій працездатний</text>

  <text x="480" y="462" text-anchor="middle" font-size="12" fill="#6b7280">Дворівневий захист гарантує неподільність перемикання образів навіть при раптовому вимкненні</text>
</svg>
