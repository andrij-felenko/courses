<svg viewBox="0 0 960 480" width="960" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="960" height="480" fill="white"/>

    <defs>
        <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
        </marker>
        <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
        </marker>
    </defs>

    <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32 IO MUX &amp; GPIO Matrix Routing Architecture</text>
    <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">IO MUX provides direct high-speed routing, while GPIO Matrix offers flexible peripheral mapping</text>

    <rect x="60" y="100" width="220" height="80" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
    <text x="170" y="135" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">High-Speed Peripherals</text>
    <text x="170" y="155" font-size="13" fill="#6b7280" text-anchor="middle">SPI, JTAG, Ethernet MAC</text>

    <rect x="60" y="240" width="220" height="140" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
    <text x="170" y="295" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Standard Peripherals</text>
    <text x="170" y="315" font-size="13" fill="#6b7280" text-anchor="middle">UART, I2C, PWM, I2S</text>
    <text x="170" y="335" font-size="13" fill="#6b7280" text-anchor="middle">General Purpose I/O</text>

    <rect x="380" y="240" width="200" height="140" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="8"/>
    <text x="480" y="295" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO Matrix</text>
    <text x="480" y="315" font-size="13" fill="#1a1a1a" text-anchor="middle">Flexible any-to-any</text>
    <text x="480" y="335" font-size="13" fill="#1a1a1a" text-anchor="middle">signal routing</text>

    <rect x="680" y="100" width="140" height="280" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="750" y="230" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">IO MUX</text>
    <text x="750" y="250" font-size="13" fill="#1a1a1a" text-anchor="middle">Direct fixed</text>
    <text x="750" y="270" font-size="13" fill="#1a1a1a" text-anchor="middle">pin mapping</text>

    <rect x="870" y="125" width="40" height="30" fill="#d0d7de" rx="2"/>
    <rect x="870" y="185" width="40" height="30" fill="#d0d7de" rx="2"/>
    <rect x="870" y="245" width="40" height="30" fill="#d0d7de" rx="2"/>
    <rect x="870" y="305" width="40" height="30" fill="#d0d7de" rx="2"/>
    <text x="915" y="145" font-size="12" fill="#6b7280">Pad 1</text>
    <text x="915" y="205" font-size="12" fill="#6b7280">Pad 2</text>
    <text x="915" y="265" font-size="12" fill="#6b7280">Pad 3</text>
    <text x="915" y="325" font-size="12" fill="#6b7280">Pad 4</text>

    <path d="M 280 140 L 670 140" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)" fill="none"/>
    <text x="480" y="130" font-size="13" fill="#2457d6" text-anchor="middle">Direct Connection (Bypass Matrix)</text>

    <path d="M 280 290 L 370 290" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)" fill="none"/>
    <path d="M 280 330 L 370 330" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)" fill="none"/>

    <path d="M 580 290 L 670 290" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)" fill="none"/>
    <path d="M 580 330 L 670 330" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)" fill="none"/>

    <path d="M 820 140 L 860 140" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)" fill="none"/>
    <path d="M 820 200 L 860 200" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)" fill="none"/>
    <path d="M 820 260 L 860 260" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)" fill="none"/>
    <path d="M 820 320 L 860 320" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)" fill="none"/>

    <rect x="60" y="410" width="840" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="4"/>
    <text x="80" y="430" font-size="13" font-weight="bold" fill="#c0392b">Constraint:</text>
    <text x="160" y="430" font-size="13" fill="#1a1a1a">GPIO Matrix introduces slight latency and frequency limits (e.g. max ~40MHz).</text>
    <text x="160" y="450" font-size="13" fill="#1a1a1a">High-speed signals must use the IO MUX directly to bypass this latency for maximum performance.</text>
</svg>
