<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Titles -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння часових затримок і джитера при програмному та апаратному формуванні імпульсу</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#6b7280">Програмне перемикання GPIO залежить від процесора, тоді як апаратний таймер формує імпульс із наносекундною точністю</text>

  <!-- Axes & Reference Lines -->
  <path d="M 130,150 L 900,150" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 130,240 L 900,240" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 130,360 L 900,360" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 130,440 L 900,440" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <path d="M 200,120 L 200,460" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 350,190 L 350,460" fill="none" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 600,190 L 600,460" fill="none" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Top Section (GPIO) -->
  <text x="130" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Програмне керування (GPIO)</text>
  <text x="200" y="110" text-anchor="middle" font-size="12" fill="#6b7280">Тригер</text>

  <text x="20" y="145" font-size="13" fill="#6b7280">Вхідний тригер</text>
  <!-- Trigger Top -->
  <path d="M 130,150 L 200,150 L 200,120 L 220,120 L 220,150 L 900,150" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Jitter areas -->
  <rect x="280" y="190" width="140" height="50" fill="#fdecea"/>
  <rect x="500" y="190" width="250" height="50" fill="#fdecea"/>

  <text x="20" y="235" font-size="13" fill="#6b7280">Вихід GPIO</text>
  <!-- Dashed bounds (fast and slow) -->
  <path d="M 130,240 L 280,240 L 280,190 L 500,190 L 500,240 L 900,240" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M 130,240 L 420,240 L 420,190 L 750,190 L 750,240 L 900,240" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- Nominal Output -->
  <path d="M 130,240 L 350,240 L 350,190 L 600,190 L 600,240 L 900,240" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Jitter start dim -->
  <path d="M 280,185 L 280,175 M 420,185 L 420,175 M 280,180 L 420,180" fill="none" stroke="#c0392b" stroke-width="1"/>
  <text x="350" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Джитер запуску</text>

  <!-- Jitter duration dim -->
  <path d="M 500,185 L 500,175 M 750,185 L 750,175 M 500,180 L 750,180" fill="none" stroke="#c0392b" stroke-width="1"/>
  <text x="625" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Джитер тривалості</text>

  <!-- Interrupt Latency dim -->
  <path d="M 200,245 L 200,260 M 350,245 L 350,260 M 200,252 L 350,252" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="275" y="270" text-anchor="middle" font-size="12" fill="#1a1a1a">Затримка переривання</text>

  <!-- Bottom Section (OPM) -->
  <text x="130" y="310" font-size="14" font-weight="bold" fill="#1a1a1a">Апаратний таймер (OPM)</text>

  <text x="20" y="355" font-size="13" fill="#6b7280">Вхідний тригер</text>
  <!-- Trigger Bottom -->
  <path d="M 130,360 L 200,360 L 200,330 L 220,330 L 220,360 L 900,360" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Hardware precise area -->
  <rect x="350" y="390" width="250" height="50" fill="#e9f7ef"/>

  <text x="20" y="435" font-size="13" fill="#6b7280">Вихід OPM</text>
  <!-- OPM Output -->
  <path d="M 130,440 L 350,440 L 350,390 L 600,390 L 600,440 L 900,440" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- OPM fixed delay dim -->
  <path d="M 200,445 L 200,460 M 350,445 L 350,460 M 200,452 L 350,452" fill="none" stroke="#27ae60" stroke-width="1"/>
  <text x="275" y="470" text-anchor="middle" font-size="12" fill="#27ae60">Фіксована затримка</text>

  <!-- OPM exact duration dim -->
  <path d="M 350,445 L 350,460 M 600,445 L 600,460 M 350,452 L 600,452" fill="none" stroke="#27ae60" stroke-width="1"/>
  <text x="475" y="470" text-anchor="middle" font-size="12" fill="#27ae60">Точний імпульс (t_pulse)</text>
</svg>
