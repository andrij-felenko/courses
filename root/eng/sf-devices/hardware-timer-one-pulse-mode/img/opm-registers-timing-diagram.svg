<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-l" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-r" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="white"/>

  <!-- Titles -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма наростання лічильника CNT та його взаємодії з</text>
  <text x="480" y="55" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">пороговими значеннями CCR і ARR у режимі One-Pulse Mode</text>
  <text x="480" y="80" font-size="13" fill="#6b7280" text-anchor="middle">При досягненні порогового значення CCR вихідний сигнал змінює стан,</text>
  <text x="480" y="100" font-size="13" fill="#6b7280" text-anchor="middle">а при співпадінні з ARR напрямок виходу відновлюється і лічильник зупиняється.</text>

  <!-- Labels Left -->
  <text x="20" y="155" font-size="14" fill="#1a1a1a">TRGI (Тригер)</text>
  <text x="20" y="225" font-size="14" fill="#2457d6">CEN (Старт)</text>
  <text x="20" y="350" font-size="14" fill="#c0392b">CNT (Лічильник)</text>
  <text x="20" y="485" font-size="14" fill="#27ae60">CH2 (Вихід)</text>

  <text x="170" y="285" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="end">ARR</text>
  <text x="170" y="355" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="end">CCR</text>
  <text x="170" y="425" font-size="14" fill="#1a1a1a" text-anchor="end">0</text>

  <!-- Grid and Dashed Lines -->
  <line x1="200" y1="280" x2="850" y2="280" stroke="#c0392b" stroke-dasharray="4,4"/>
  <line x1="200" y1="350" x2="575" y2="350" stroke="#2457d6" stroke-dasharray="4,4"/>
  
  <line x1="280" y1="210" x2="280" y2="490" stroke="#6b7280" stroke-dasharray="4,4"/>
  <line x1="555" y1="350" x2="555" y2="490" stroke="#6b7280" stroke-dasharray="4,4"/>
  <line x1="830" y1="210" x2="830" y2="490" stroke="#6b7280" stroke-dasharray="4,4"/>

  <!-- Signal Paths -->
  <!-- TRGI -->
  <path d="M180,160 L230,160 L230,140 L250,140 L250,160 L920,160" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  
  <!-- CEN -->
  <path d="M180,230 L280,230 L280,210 L830,210 L830,230 L920,230" stroke="#2457d6" stroke-width="2" fill="none"/>
  
  <!-- CNT Ramp -->
  <path d="M180,420 L280,420 L830,280 L830,420 L920,420" stroke="#c0392b" stroke-width="2" fill="none"/>
  
  <!-- Output CH2 -->
  <path d="M180,490 L555,490 L555,460 L830,460 L830,490 L920,490" stroke="#27ae60" stroke-width="2" fill="none"/>

  <!-- Intervals and Measurements -->
  <line x1="282" y1="260" x2="828" y2="260" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-l)" marker-end="url(#arr-r)"/>
  <text x="555" y="255" font-size="13" fill="#6b7280" text-anchor="middle">t_total = ARR * t_tick</text>

  <line x1="282" y1="520" x2="553" y2="520" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-l)" marker-end="url(#arr-r)"/>
  <text x="417" y="515" font-size="13" fill="#6b7280" text-anchor="middle">t_delay = CCR * t_tick</text>

  <line x1="557" y1="520" x2="828" y2="520" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-l)" marker-end="url(#arr-r)"/>
  <text x="692" y="515" font-size="13" fill="#6b7280" text-anchor="middle">t_pulse = (ARR - CCR) * t_tick</text>

  <!-- UEV Indicator -->
  <text x="830" y="190" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">UEV</text>
  <path d="M830,195 L830,225" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
</svg>
