<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура керування SEGGER RTT у пам'яті SRAM мікроконтролера</text>
<rect x="40.0" y="56.0" width="430.0" height="400.0" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<rect x="40.0" y="56.0" width="430.0" height="36.0" rx="6" fill="#f0e6fa" stroke="#7d3c98" stroke-width="1.5"/>
<text x="255.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d3c98" text-anchor="middle" font-weight="700">SRAM мікроконтролера: Дескриптор SEGGER_RTT_CB</text>
<rect x="55.0" y="104.0" width="400.0" height="42.0" rx="4" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.2"/>
<text x="65.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="start" font-weight="700">char acID[16]</text>
<text x="65.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">&quot;SEGGER RTT&quot;  (магічний сигнатурний рядок для пошуку зондом)</text>
<rect x="55.0" y="152.0" width="400.0" height="42.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="65.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="start" font-weight="700">int MaxNumUpBuffers</text>
<text x="65.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Кількість висхідних каналів MCU → Host (наприклад, 3)</text>
<rect x="55.0" y="200.0" width="400.0" height="42.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="65.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="start" font-weight="700">int MaxNumDownBuffers</text>
<text x="65.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Кількість низхідних каналів Host → MCU (наприклад, 3)</text>
<rect x="55.0" y="248.0" width="400.0" height="42.0" rx="4" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.2"/>
<text x="65.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="start" font-weight="700">RING_BUFFER aUp[0]</text>
<text x="65.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Конфігурація каналу виводу #0 (&quot;Terminal&quot;): </text>
<rect x="55.0" y="296.0" width="400.0" height="150.0" rx="4" fill="#ffffff" stroke="#1a5276" stroke-width="1.2"/>
<text x="65.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">char* sName:</text>
<text x="210.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Вказівник на назву &quot;Terminal&quot;</text>
<text x="65.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">char* pBuffer:</text>
<text x="210.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Вказівник на виділений масив байтів у SRAM</text>
<text x="65.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">unsigned SizeOfBuffer:</text>
<text x="210.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Розмір кільцевого буфера (наприклад, 1024 байти)</text>
<text x="65.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">unsigned WrOff:</text>
<text x="210.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">Зсув запису (ОНОВЛЮЄТЬСЯ МІКРОКОНТРОЛЕРОМ)</text>
<text x="65.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e8449" text-anchor="start" font-weight="700">unsigned RdOff:</text>
<text x="210.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e8449" text-anchor="start">Зсув читання (ОНОВЛЮЄТЬСЯ НАЛАГОДЖУВАЧЕМ)</text>
<text x="65.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">unsigned Flags:</text>
<text x="210.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Режим: NO_BLOCK_SKIP / NO_BLOCK_TRIM / BLOCK_IF_FIFO_FULL</text>
<rect x="510.0" y="56.0" width="270.0" height="400.0" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5"/>
<rect x="510.0" y="56.0" width="270.0" height="36.0" rx="6" fill="#1e8449" stroke="#1e8449" stroke-width="1.5"/>
<text x="645.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Хост-налагоджувач (J-Link / OpenOCD)</text>
<text x="645.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e8449" text-anchor="middle" font-weight="700">Апаратний зонд SWD / JTAG</text>
<text x="645.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1. Сканує SRAM на наявність</text>
<text x="645.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">сигнатури &quot;SEGGER RTT&quot;</text>
<text x="645.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2. Зчитує адресу буфера</text>
<text x="645.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">та поточні WrOff / RdOff</text>
<text x="645.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3. Вичитує нові байти логу</text>
<text x="645.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">через фоновий порт AHB-AP</text>
<text x="645.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">4. Записує новий RdOff</text>
<text x="645.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">прямо в пам'ять SRAM чіпа</text>
<text x="645.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">Ядро MCU продовжує роботу</text>
<text x="645.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">без жодних пауз і переривань!</text>
<line x1="510.0" y1="240.0" x2="455.0" y2="240.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="455.0" y1="350.0" x2="510.0" y2="350.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
