<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві ціни біт-бенгінгу</text>
<text x="390.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">швидкість виклику й зайнятість ядра</text>
<rect x="40.0" y="76.0" width="350.0" height="240.0" rx="10" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/>
<text x="215.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкість одного перемикання</text>
<text x="70.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">digitalWrite</text>
<rect x="70.0" y="158.0" width="280.0" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">≈ 2 мкс  (ледача шина)</text>
<text x="70.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">прямий регістр</text>
<rect x="70.0" y="232.0" width="56.0" height="28.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="220.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">наносекунди  (швидка)</text>
<text x="215.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">швидкість шини = темп вашого циклу</text>
<rect x="410.0" y="76.0" width="330.0" height="240.0" rx="10" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/>
<text x="575.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто жене дані</text>
<text x="575.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">біт-бенгінг</text>
<rect x="470.0" y="149.1" width="210.0" height="57.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="575.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="575.0" dy="0.0">ядро зайняте</tspan><tspan x="575.0" dy="13.7">цілком — більше</tspan><tspan x="575.0" dy="13.7">нічого не робить</tspan></text>
<text x="575.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">апаратний блок</text>
<rect x="470.0" y="253.9" width="210.0" height="44.1" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="272.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="575.0" dy="0.0">жене дані у фоні —</tspan><tspan x="575.0" dy="13.7">ядро вільне</tspan></text>
</svg>