<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #212121; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #616161; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #424242; }
      .row-detail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #757575; }
      .trace-val { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9px; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9e9e9e" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="#ffffff" rx="8" />
  <text x="25" y="32" class="title" font-size="15">Часова діаграма реакції контролера на тепловий пробій та просідання батареї</text>
  <text x="25" y="48" class="subtitle" font-size="11">Послідовність аварійного скидання навантаження (Load Shedding), струмового тротлінгу та стабілізації</text>
  <rect x="175" y="65" width="145" height="365" fill="#e8f5e9" opacity="0.35" />
  <rect x="181" y="67" width="133" height="18" fill="#ffffff" stroke="#2e7d32" stroke-width="1" rx="3" />
  <text x="247.5" y="80" font-size="10" font-weight="700" text-anchor="middle" fill="#2e7d32">NORMAL</text>
  <line x1="175" y1="87" x2="175" y2="430" stroke="#d0d0d0" stroke-dasharray="3,3" />
  <rect x="320" y="65" width="160" height="365" fill="#fffde7" opacity="0.35" />
  <rect x="326" y="67" width="148" height="18" fill="#ffffff" stroke="#f57f17" stroke-width="1" rx="3" />
  <text x="400.0" y="80" font-size="10" font-weight="700" text-anchor="middle" fill="#f57f17">THERMAL SPIKE</text>
  <line x1="320" y1="87" x2="320" y2="430" stroke="#d0d0d0" stroke-dasharray="3,3" />
  <rect x="480" y="65" width="180" height="365" fill="#fff3e0" opacity="0.35" />
  <rect x="486" y="67" width="168" height="18" fill="#ffffff" stroke="#e65100" stroke-width="1" rx="3" />
  <text x="570.0" y="80" font-size="10" font-weight="700" text-anchor="middle" fill="#e65100">LIMP L1 (SHED 1)</text>
  <line x1="480" y1="87" x2="480" y2="430" stroke="#d0d0d0" stroke-dasharray="3,3" />
  <rect x="660" y="65" width="210" height="365" fill="#ffebee" opacity="0.35" />
  <rect x="666" y="67" width="198" height="18" fill="#ffffff" stroke="#c62828" stroke-width="1" rx="3" />
  <text x="765.0" y="80" font-size="10" font-weight="700" text-anchor="middle" fill="#c62828">LIMP L2 (GLIDE)</text>
  <line x1="660" y1="87" x2="660" y2="430" stroke="#d0d0d0" stroke-dasharray="3,3" />
  <line x1="870" y1="87" x2="870" y2="430" stroke="#d0d0d0" stroke-dasharray="3,3" />
  <text x="25" y="120" class="axis-label" font-size="11">T MOSFET (°C)</text>
  <text x="25" y="134" class="row-detail" font-size="9">Поріг 95°C / 115°C</text>
  <line x1="175" y1="150" x2="870" y2="150" stroke="#e0e0e0" />
  <line x1="175" y1="125" x2="870" y2="125" stroke="#fbc02d" stroke-dasharray="2,2" stroke-width="1" />
  <text x="876" y="128" class="trace-val" font-size="9" fill="#f57f17">95°C</text>
  <line x1="175" y1="102" x2="870" y2="102" stroke="#e53935" stroke-dasharray="2,2" stroke-width="1" />
  <text x="876" y="105" class="trace-val" font-size="9" fill="#c62828">115°C</text>
  <path d="M 175 142 L 320 142 C 370 138 430 108 480 105 C 540 102 600 130 660 133 L 870 135" fill="none" stroke="#d32f2f" stroke-width="2.2" />
  <circle cx="480" cy="105" r="3.5" fill="#d32f2f" />
  <text x="480" y="96" class="trace-val" font-size="9" text-anchor="middle" fill="#d32f2f">112°C</text>
  <text x="25" y="190" class="axis-label" font-size="11">Струм батареї I (A)</text>
  <text x="25" y="204" class="row-detail" font-size="9">Піковий: 80A → 30A</text>
  <line x1="175" y1="220" x2="870" y2="220" stroke="#e0e0e0" />
  <path d="M 175 190 L 320 190 L 325 170 L 480 172 L 485 194 L 660 196 L 665 210 L 870 210" fill="none" stroke="#1976d2" stroke-width="2.2" />
  <text x="340" y="165" class="trace-val" font-size="9" fill="#1976d2">78A (Пік)</text>
  <text x="500" y="190" class="trace-val" font-size="9" fill="#1976d2">45A (-42%)</text>
  <text x="680" y="206" class="trace-val" font-size="9" fill="#1976d2">30A (Глайд)</text>
  <text x="25" y="260" class="axis-label" font-size="11">Напруга шини V (В)</text>
  <text x="25" y="274" class="row-detail" font-size="9">6S LiPo: Sag 20.8V</text>
  <line x1="175" y1="290" x2="870" y2="290" stroke="#e0e0e0" />
  <path d="M 175 248 L 320 248 L 325 278 L 480 276 L 485 260 L 660 258 L 665 252 L 870 252" fill="none" stroke="#7b1fa2" stroke-width="2" />
  <text x="340" y="286" class="trace-val" font-size="9" fill="#7b1fa2">20.8V (Sag)</text>
  <text x="680" y="248" class="trace-val" font-size="9" fill="#7b1fa2">23.1V (Norm)</text>
  <text x="25" y="330" class="axis-label" font-size="11">Скидання ліній</text>
  <text x="25" y="350" class="row-detail" font-size="9">Tier 1: Підвіс + Фари</text>
  <path d="M 175 345 L 480 345 L 480 365 L 870 365" fill="none" stroke="#e65100" stroke-width="2" />
  <text x="435" y="341" class="trace-val" font-size="9" fill="#e65100">ON</text>
  <text x="500" y="361" class="trace-val" font-size="9" fill="#757575">OFF (t=4.2s)</text>
  <text x="25" y="390" class="row-detail" font-size="9">Tier 2: SBC / AI Модуль</text>
  <path d="M 175 385 L 660 385 L 660 405 L 870 405" fill="none" stroke="#c62828" stroke-width="2" />
  <text x="615" y="381" class="trace-val" font-size="9" fill="#c62828">ON</text>
  <text x="680" y="401" class="trace-val" font-size="9" fill="#757575">OFF (t=7.8s)</text>
  <line x1="175" y1="445" x2="870" y2="445" stroke="#616161" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="876" y="449" class="axis-label" font-size="11">t (с)</text>
  <line x1="175" y1="441" x2="175" y2="449" stroke="#616161" stroke-width="1.2" />
  <text x="175" y="461" font-size="9" text-anchor="middle" fill="#757575">0.0с</text>
  <line x1="320" y1="441" x2="320" y2="449" stroke="#616161" stroke-width="1.2" />
  <text x="320" y="461" font-size="9" text-anchor="middle" fill="#757575">2.5с (Аномалія)</text>
  <line x1="480" y1="441" x2="480" y2="449" stroke="#616161" stroke-width="1.2" />
  <text x="480" y="461" font-size="9" text-anchor="middle" fill="#757575">4.2с (Скид 1)</text>
  <line x1="660" y1="441" x2="660" y2="449" stroke="#616161" stroke-width="1.2" />
  <text x="660" y="461" font-size="9" text-anchor="middle" fill="#757575">7.8с (Скид 2)</text>
  <line x1="850" y1="441" x2="850" y2="449" stroke="#616161" stroke-width="1.2" />
  <text x="850" y="461" font-size="9" text-anchor="middle" fill="#757575">15.0с (Доліт)</text>
</svg>