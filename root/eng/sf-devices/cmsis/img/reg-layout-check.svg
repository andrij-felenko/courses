<text x="497.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="497.0" dy="0.0">RCC-&gt;AHB1ENR |= 1  насправді пише за 0x24 — це APB2RSTR, молодший біт TIM1RST:</tspan><tspan x="497.0" dy="13.7">тактування GPIOA не вмикається, зате TIM1 стає в reset — два несхожі симптоми з однієї помилки</tspan></text>
