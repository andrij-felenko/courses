<text x="497.0" y="527.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#186a3b" text-anchor="middle">_Static_assert(offsetof(RCC_TypeDef, AHB1ENR) == 0x30, &quot;зсув&quot;);   — падає на етапі компіляції</text>
<text x="450.0" y="576.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Заглушка — не косметика: пропущене слово зсуває кожне наступне поле, і запис іде в чужий регістр</text>
