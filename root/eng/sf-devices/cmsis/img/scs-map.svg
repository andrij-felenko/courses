<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 566" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="566" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де лежать блоки ядра, якими керує CMSIS-Core</text>
<text x="440.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e8449" text-anchor="middle" font-weight="700">SCS_BASE = 0xE000_E000 — архітектурна адреса, однакова в усіх виробників</text>
<text x="170.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">адреса</text>
<text x="224.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">блок ядра і структура CMSIS</text>
<text x="170.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="end">0xE000_E010</text>
<rect x="210.0" y="116.0" width="620.0" height="60.0" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.8"/>
<text x="226.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e8449" text-anchor="start" font-weight="700">SysTick  —  системний таймер</text>
<text x="226.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">SysTick_Type:  CTRL · LOAD · VAL · CALIB</text>
<text x="170.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="end">0xE000_E100</text>
<rect x="210.0" y="186.0" width="620.0" height="60.0" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.8"/>
<text x="226.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e8449" text-anchor="start" font-weight="700">NVIC  —  контролер переривань</text>
<text x="226.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">NVIC_Type:  ISER · ICER · ISPR · ICPR · IABR · IPR[240] · STIR</text>
<text x="170.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="end">0xE000_ED00</text>
<rect x="210.0" y="256.0" width="620.0" height="60.0" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.8"/>
<text x="226.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e8449" text-anchor="start" font-weight="700">SCB  —  блок системного керування</text>
<text x="226.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">SCB_Type:  CPUID · ICSR · VTOR · AIRCR · SCR · CCR · SHPR · CFSR</text>
<text x="170.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="end">0xE000_ED90</text>
<rect x="210.0" y="326.0" width="620.0" height="60.0" rx="6" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.8"/>
<text x="226.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="start" font-weight="700">MPU  —  блок захисту пам'яті</text>
<text x="226.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">MPU_Type — лише якщо __MPU_PRESENT == 1</text>
<text x="170.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="end">0xE000_EF30</text>
<rect x="210.0" y="396.0" width="620.0" height="60.0" rx="6" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.8"/>
<text x="226.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="start" font-weight="700">FPU  —  блок дробових чисел</text>
<text x="226.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">FPU_Type — лише якщо __FPU_PRESENT == 1</text>
<line x1="60.0" y1="474.0" x2="820.0" y2="474.0" stroke="#d5d8dc" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="440.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">поза SCS:   ITM 0xE000_0000   ·   DWT 0xE000_1000   ·   DCB 0xE000_EDF0   ·   TPIU 0xE004_0000</text>
<text x="440.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Виробник не обирає ці адреси — тому шар доступу до ядра пишеться раз і збирається скрізь</text>
</svg>