<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа переносності: ядро проти периферії</text>
<rect x="295.0" y="52.0" width="170.0" height="50.0" rx="8" fill="#fbfbfc" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="380.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Cortex-M чип</tspan><tspan x="380.0" dy="14.3">ядро + периферія</tspan></text>
<rect x="60.0" y="150.0" width="300.0" height="232.0" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.0"/>
<text x="210.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e8449" text-anchor="middle" font-weight="700">Ядро ARM — переносне</text>
<text x="210.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">CMSIS-Core дає той самий код скрізь</text>
<text x="80.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#186a3b" text-anchor="start">✓  NVIC — контролер переривань</text>
<text x="80.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#186a3b" text-anchor="start">✓  SysTick — таймер ядра</text>
<text x="80.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#186a3b" text-anchor="start">✓  SCB · MPU · FPU</text>
<text x="80.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#186a3b" text-anchor="start">✓  інтринсики __DSB / __WFI / __NOP</text>
<text x="210.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#186a3b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">той самий вихідний код</tspan><tspan x="210.0" dy="13.7">на ST, NXP, Nordic, RP2040</tspan></text>
<rect x="400.0" y="150.0" width="300.0" height="232.0" rx="8" fill="#fdf3d6" stroke="#b9770e" stroke-width="2.0"/>
<text x="550.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">Периферія виробника</text>
<text x="550.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">CMSIS дає лише ТИПОВАНИЙ доступ</text>
<text x="420.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a5200" text-anchor="start">•  GPIO · UART · SPI · таймери</text>
<text x="420.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a5200" text-anchor="start">•  розкладка бітів у ST ≠ NXP</text>
<text x="420.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a5200" text-anchor="start">•  структура регістрів — своя в кожного</text>
<text x="550.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a5200" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">спільний API периферії —</tspan><tspan x="550.0" dy="13.7">це CMSIS-Driver / HAL</tspan><tspan x="550.0" dy="13.7">(окремий шар, не CMSIS-Core)</tspan></text>
<line x1="350.0" y1="102.0" x2="210.0" y2="150.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="410.0" y1="102.0" x2="550.0" y2="150.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="380.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Стандарт уніфікує спільне (ядро) і дає спільну ФОРМУ для різного (типовані регістри)</text>
</svg>