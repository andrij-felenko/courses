<line x1="705.0" y1="419.0" x2="705.0" y2="431.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="415.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">PST (Process Safety Time: граничний час розвитку небезпеки)</text>
<rect x="165.0" y="445.0" width="380.0" height="26.0" rx="4" fill="#e8f8f5" stroke="#1e8449" stroke-width="1.5"/>
<text x="355.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">Критична вимога: FDTI + FRT ≤ PST</text>
