<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класи функційної безпеки та часовий бюджет</text>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація функційної безпеки та часовий бюджет реакції на відмову</text>
<rect x="45.0" y="55.0" width="240.0" height="160.0" rx="6" fill="#f8f9f9" stroke="#6b7280" stroke-width="1.5"/>
<rect x="45.0" y="55.0" width="240.0" height="34.0" rx="6" fill="#ebedef" stroke="#6b7280" stroke-width="1.5"/>
<text x="165.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Class A (IEC 60730)</text>
<text x="165.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Некритичні функції</tspan><tspan x="165.0" dy="14.3">Відмова не створює небезпеки</tspan><tspan x="165.0" dy="14.3">Приклади: дисплей, підсвітка,</tspan><tspan x="165.0" dy="14.3">клавіатура інтерфейсу</tspan></text>
<rect x="310.0" y="55.0" width="240.0" height="160.0" rx="6" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.8"/>
<rect x="310.0" y="55.0" width="240.0" height="34.0" rx="6" fill="#fdebd0" stroke="#b9770e" stroke-width="1.8"/>
<text x="430.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">Class B (SIL 2 / ASIL B)</text>
<text x="430.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Запобігання небезпечній роботі</tspan><tspan x="430.0" dy="14.3">Одинична відмова в MCU/ПЗ</tspan><tspan x="430.0" dy="14.3">Приклади: контроль дверцят,</tspan><tspan x="430.0" dy="14.3">термостат бойлера, пралки</tspan></text>
<rect x="575.0" y="55.0" width="240.0" height="160.0" rx="6" fill="#fcdcd7" stroke="#c0392b" stroke-width="1.8"/>
<rect x="575.0" y="55.0" width="240.0" height="34.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.8"/>
<text x="695.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Class C (SIL 3 / ASIL D)</text>
<text x="695.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Запобігання вибуху та пожежі</tspan><tspan x="695.0" dy="14.3">Одиничні та подвійні відмови</tspan><tspan x="695.0" dy="14.3">Приклади: газові котли, клапани</tspan><tspan x="695.0" dy="14.3">палива, медичні апарати</tspan></text>
<rect x="45.0" y="240.0" width="750.0" height="245.0" rx="8" fill="#fcfcfc" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a5276" text-anchor="middle" font-weight="700">Часовий бюджет безпеки: Process Safety Time (PST)</text>
<line x1="85.0" y1="330.0" x2="755.0" y2="330.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="740.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Час (t)</text>
