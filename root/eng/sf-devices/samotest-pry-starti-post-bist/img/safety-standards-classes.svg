<text x="125.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Виникнення відмови</text>
<line x1="125.0" y1="330.0" x2="125.0" y2="400.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
