<text x="485.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6c3483" text-anchor="middle" font-weight="700">FRT (час переходу)</text>
<line x1="125.0" y1="425.0" x2="705.0" y2="425.0" stroke="#c0392b" stroke-width="2.0"/>
