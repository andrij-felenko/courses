<text x="385.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">Виявлення (BIST)</text>
<line x1="385.0" y1="330.0" x2="385.0" y2="400.0" stroke="#b9770e" stroke-width="1.2" stroke-dasharray="4,4"/>
<circle cx="585.0" cy="330.0" r="5.0" fill="#1e8449" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="585.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">Безпечний стан</text>
<line x1="585.0" y1="330.0" x2="585.0" y2="400.0" stroke="#1e8449" stroke-width="1.2" stroke-dasharray="4,4"/>
<circle cx="705.0" cy="330.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="705.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Межа шкоди (аварія)</text>
<line x1="705.0" y1="330.0" x2="705.0" y2="450.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="125.0" y1="365.0" x2="385.0" y2="365.0" stroke="#1a5276" stroke-width="2.0"/>
<line x1="125.0" y1="360.0" x2="125.0" y2="370.0" stroke="#1a5276" stroke-width="2.0"/>
<line x1="385.0" y1="360.0" x2="385.0" y2="370.0" stroke="#1a5276" stroke-width="2.0"/>
<text x="255.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="700">FDTI (період діагностики BIST)</text>
<line x1="385.0" y1="365.0" x2="585.0" y2="365.0" stroke="#6c3483" stroke-width="2.0"/>
