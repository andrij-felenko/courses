<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехресна перевірка частоти тактування</text>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехресна перевірка тактування (Clock Plausibility via Cross-Checking)</text>
<rect x="50.0" y="65.0" width="220.0" height="110.0" rx="6" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.8"/>
<text x="160.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a5276" text-anchor="middle" font-weight="700">Основний тактовий домен</text>
<text x="160.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">HSE (кварцовий резонатор)</tspan><tspan x="160.0" dy="13.7">+ PLL (наприклад, 168 МГц)</tspan><tspan x="160.0" dy="13.7">Тактує ядро та таймер TIM_A</tspan></text>
<rect x="50.0" y="215.0" width="220.0" height="110.0" rx="6" fill="#ebdef0" stroke="#6c3483" stroke-width="1.8"/>
<text x="160.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6c3483" text-anchor="middle" font-weight="700">Допоміжне джерело (LSI / RTC)</text>
<text x="160.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Внутрішній RC (LSI ~32 кГц)</tspan><tspan x="160.0" dy="13.7">або годинниковий кварц LSE</tspan><tspan x="160.0" dy="13.7">Фізично незалежне живлення</tspan></text>
<rect x="330.0" y="110.0" width="230.0" height="170.0" rx="8" fill="#fcfcfc" stroke="#333333" stroke-width="1.5"/>
<text x="445.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол вимірювання (TIM_IC)</text>
<text x="445.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="445.0" dy="0.0">Таймер TIM_A рахує на частоті PLL.</tspan><tspan x="445.0" dy="13.7">Сигнал від LSI подається на канал</tspan><tspan x="445.0" dy="13.7">вхідного захоплення (Input Capture).</tspan><tspan x="445.0" dy="13.7">Вимірюється кількість тактів PLL</tspan><tspan x="445.0" dy="13.7">між двома фронтами LSI.</tspan></text>
<line x1="270.0" y1="120.0" x2="330.0" y2="150.0" stroke="#1a5276" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="middle" font-weight="700">f_main</text>
<line x1="270.0" y1="270.0" x2="330.0" y2="230.0" stroke="#6c3483" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6c3483" text-anchor="middle" font-weight="700">f_ref</text>
<rect x="610.0" y="110.0" width="185.0" height="170.0" rx="8" fill="#ffffff" stroke="#b9770e" stroke-width="1.8"/>
<text x="702.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700">Верифікація вікна</text>
<text x="702.5" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="702.5" dy="0.0">N_actual = T_ref / T_main</tspan><tspan x="702.5" dy="13.7">Очікувано: N_nom ± ΔN</tspan><tspan x="702.5" dy="13.7">(допуск, наприклад, ±5%)</tspan><tspan x="702.5" dy="13.7"></tspan><tspan x="702.5" dy="13.7">N_min ≤ N_actual ≤ N_max</tspan></text>
<line x1="560.0" y1="195.0" x2="610.0" y2="195.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="200.0" y="330.0" width="200.0" height="50.0" rx="5" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5"/>
<text x="300.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">В межах норми</tspan><tspan x="300.0" dy="14.3">→ Дозвіл роботи / WDT</tspan></text>
<rect x="480.0" y="330.0" width="220.0" height="50.0" rx="5" fill="#fcdcd7" stroke="#c0392b" stroke-width="1.5"/>
<text x="590.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Вихід за межі вікна</tspan><tspan x="590.0" dy="14.3">→ Відмова такту → Safe State</tspan></text>
<line x1="682.5" y1="280.0" x2="300.0" y2="330.0" stroke="#1e8449" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="722.5" y1="280.0" x2="590.0" y2="330.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Якщо головний кварц розколовся або PLL зірвався, таймер зафіксує аномалію ще до виходу з ладу логіки</text>
</svg>