<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий подвійний буфер DMA та D-Cache</text>
<text x="420.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Конвеєр паралельного приймання периферією та обробки ядром з обслуговуванням D-Cache</text>
<rect x="40.0" y="80.0" width="160.0" height="70.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.8"/>
<text x="120.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2980b9" text-anchor="middle" font-weight="700">Периферія RX</text>
<text x="120.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">USART_DR / SPI_DR</text>
<line x1="200.0" y1="115.0" x2="270.0" y2="115.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="235.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2980b9" text-anchor="middle">Апаратний запит</text>
<rect x="270.0" y="80.0" width="180.0" height="70.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="360.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">DMA Controller</text>
<text x="360.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Circular Mode (NDTR=2N)</text>
<line x1="450.0" y1="115.0" x2="520.0" y2="115.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="485.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">AHB Master</text>
<rect x="520.0" y="75.0" width="280.0" height="120.0" rx="6" fill="#fdfefe" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="660.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SRAM Buffer (Вирівняно по 32 байти)</text>
<rect x="535.0" y="110.0" width="120.0" height="65.0" rx="4" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
<text x="595.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Буфер A (Half 0)</text>
<text x="595.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 .. N-1 байтів</text>
<rect x="665.0" y="110.0" width="120.0" height="65.0" rx="4" fill="#fef9e7" stroke="#b7950b" stroke-width="1.5"/>
<text x="725.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7950b" text-anchor="middle" font-weight="700">Буфер B (Half 1)</text>
<text x="725.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">N .. 2N-1 байтів</text>
<rect x="40.0" y="230.0" width="760.0" height="140.0" rx="6" fill="#fafbfc" stroke="#bdc3c7" stroke-width="1.2"/>
<text x="420.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часовий розподіл: DMA та CPU працюють паралельно без простоїв</text>
<rect x="60.0" y="270.0" width="340.0" height="40.0" rx="4" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
<text x="230.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. DMA наповнює Буфер A</text>
<rect x="60.0" y="315.0" width="340.0" height="40.0" rx="4" fill="#f4f6f7" stroke="#bdc3c7" stroke-width="1.0"/>
<text x="230.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">CPU виконує іншу роботу / спить (WFI)</text>
<line x1="400.0" y1="265.0" x2="400.0" y2="365.0" stroke="#8e44ad" stroke-width="2.0" stroke-dasharray="4,3"/>
<rect x="350.0" y="365.0" width="100.0" height="24.0" rx="3" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.2"/>
<text x="400.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">HTIF Interrupt</text>
<rect x="420.0" y="270.0" width="360.0" height="40.0" rx="4" fill="#fef9e7" stroke="#b7950b" stroke-width="1.5"/>
<text x="600.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7950b" text-anchor="middle" font-weight="700">2. DMA автономно наповнює Буфер B</text>
<rect x="420.0" y="315.0" width="360.0" height="40.0" rx="4" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="600.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">CPU інвалідує D-Cache для Буфера A</text>
<text x="600.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">та обробляє готові дані Half 0</text>
<rect x="40.0" y="400.0" width="760.0" height="110.0" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
<text x="420.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">Обслуговування когерентності D-Cache (Cortex-M7 / SCB Maintenance)</text>
<rect x="60.0" y="438.0" width="340.0" height="58.0" rx="4" fill="#ffffff" stroke="#8e44ad" stroke-width="1.0"/>
<text x="230.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Приймання (RX): Invalidate</text>
<text x="230.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">SCB_InvalidateDCache_by_Addr(BufA, N)</text>
<text x="230.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Скидає старі копії кешу перед читанням CPU</text>
<rect x="420.0" y="438.0" width="360.0" height="58.0" rx="4" fill="#ffffff" stroke="#8e44ad" stroke-width="1.0"/>
<text x="600.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Передача (TX): Clean</text>
<text x="600.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">SCB_CleanDCache_by_Addr(BufA, N)</text>
<text x="600.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Виштовхує брудні рядки з кешу в SRAM перед DMA TX</text>
<text x="420.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Подвійна буферизація дозволяє передавати дані безперервно без втрат байтів та блокувань процесора</text>
</svg>