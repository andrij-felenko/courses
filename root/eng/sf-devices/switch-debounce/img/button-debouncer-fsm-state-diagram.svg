<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="480" y="40" fill="#1a1a1a" font-size="18" font-weight="bold" text-anchor="middle">Автомат обробки натискань кнопки</text>
  <text x="480" y="65" fill="#6b7280" font-size="13" text-anchor="middle">Стани та переходи для програмного усунення брязкоту</text>

  <circle cx="60" cy="240" r="6" fill="#1a1a1a"/>
  <path d="M 66 240 L 112 240" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="89" y="234" fill="#6b7280" font-size="12" text-anchor="middle">init</text>

  <!-- IDLE / ВІДПУЩЕНО -->
  <rect x="120" y="208" width="160" height="64" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="200" y="246" fill="#1a1a1a" font-size="16" font-weight="bold" text-anchor="middle">ВІДПУЩЕНО</text>

  <!-- DEBOUNCE PRESS -->
  <rect x="400" y="80" width="160" height="64" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="110" fill="#2457d6" font-size="16" font-weight="bold" text-anchor="middle">ФІЛЬТР</text>
  <text x="480" y="130" fill="#2457d6" font-size="14" text-anchor="middle">НАТИСКАННЯ</text>

  <!-- PRESSED / НАТИСНЕНО -->
  <rect x="680" y="208" width="160" height="64" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="760" y="246" fill="#1a1a1a" font-size="16" font-weight="bold" text-anchor="middle">НАТИСНЕНО</text>

  <!-- DEBOUNCE RELEASE -->
  <rect x="400" y="336" width="160" height="64" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="366" fill="#2457d6" font-size="16" font-weight="bold" text-anchor="middle">ФІЛЬТР</text>
  <text x="480" y="386" fill="#2457d6" font-size="14" text-anchor="middle">ВІДПУСКАННЯ</text>

  <!-- Paths -->
  <path d="M 240 208 Q 240 80 392 80" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 400 144 Q 200 144 200 200" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 560 80 Q 720 80 720 200" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 720 272 Q 720 400 568 400" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 560 336 Q 760 336 760 280" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 400 400 Q 240 400 240 280" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Texts -->
  <text x="230" y="120" fill="#1a1a1a" font-size="13" text-anchor="end">натискання</text>
  
  <text x="300" y="120" fill="#1a1a1a" font-size="13" text-anchor="middle">відпускання</text>
  <text x="300" y="135" fill="#6b7280" font-size="12" text-anchor="middle">(брязкіт)</text>
  
  <text x="640" y="70" fill="#1a1a1a" font-size="13" text-anchor="middle">таймер сплив</text>

  <text x="730" y="340" fill="#1a1a1a" font-size="13" text-anchor="start">відпускання</text>
  
  <text x="660" y="350" fill="#1a1a1a" font-size="13" text-anchor="middle">натискання</text>
  <text x="660" y="365" fill="#6b7280" font-size="12" text-anchor="middle">(брязкіт)</text>
  
  <text x="320" y="415" fill="#1a1a1a" font-size="13" text-anchor="middle">таймер сплив</text>

</svg>
