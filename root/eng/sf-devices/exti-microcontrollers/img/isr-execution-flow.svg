<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="white"/>

  <text x="480" y="40" fill="#1a1a1a" font-size="18" font-weight="bold" text-anchor="middle">Потік виконання обробника переривання (ISR)</text>
  <text x="480" y="65" fill="#6b7280" font-size="13" text-anchor="middle">Апаратне збереження контексту, виконання коду та повернення до основного циклу</text>

  <!-- Dimension lines at the top -->
  <line x1="340" y1="140" x2="340" y2="85" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="620" y1="140" x2="620" y2="85" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="480" y1="90" x2="346" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="480" y1="90" x2="614" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="480" y="83" fill="#1a1a1a" font-size="13" text-anchor="middle">Час виконання ISR (Execution Time)</text>

  <line x1="160" y1="180" x2="160" y2="120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="340" y1="140" x2="340" y2="120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="250" y1="125" x2="166" y2="125" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="250" y1="125" x2="334" y2="125" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="250" y="118" fill="#1a1a1a" font-size="13" text-anchor="middle">Затримка входу (Latency)</text>

  <line x1="620" y1="140" x2="620" y2="120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="780" y1="180" x2="780" y2="120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="700" y1="125" x2="626" y2="125" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="700" y1="125" x2="774" y2="125" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="700" y="118" fill="#1a1a1a" font-size="13" text-anchor="middle">Відновлення (Return)</text>

  <!-- Flow execution blocks -->
  <rect x="40" y="180" width="120" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="100" y="215" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">Основний цикл</text>

  <rect x="180" y="180" width="140" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="250" y="206" fill="#27ae60" font-size="14" font-weight="bold" text-anchor="middle">Збереження</text>
  <text x="250" y="226" fill="#27ae60" font-size="14" font-weight="bold" text-anchor="middle">регістрів</text>

  <rect x="340" y="140" width="280" height="140" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="165" fill="#2457d6" font-size="15" font-weight="bold" text-anchor="middle">Обробник переривання (ISR)</text>
  <rect x="360" y="180" width="240" height="26" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="198" fill="#1a1a1a" font-size="13" text-anchor="middle">1. Скидання прапорця EXTI</text>
  <rect x="360" y="214" width="240" height="26" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="232" fill="#1a1a1a" font-size="13" text-anchor="middle">2. Читання стану пінів (GPIO)</text>
  <rect x="360" y="248" width="240" height="26" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="266" fill="#1a1a1a" font-size="13" text-anchor="middle">3. Оновлення стану енкодера</text>

  <rect x="640" y="180" width="140" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="710" y="206" fill="#27ae60" font-size="14" font-weight="bold" text-anchor="middle">Відновлення</text>
  <text x="710" y="226" fill="#27ae60" font-size="14" font-weight="bold" text-anchor="middle">регістрів</text>

  <rect x="800" y="180" width="120" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="860" y="215" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">Основний цикл</text>

  <!-- Flow arrows -->
  <line x1="160" y1="210" x2="174" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="320" y1="210" x2="334" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="620" y1="210" x2="634" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="780" y1="210" x2="794" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- Time Axis and Event -->
  <line x1="40" y1="420" x2="920" y2="420" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="920" y="440" fill="#6b7280" font-size="14" text-anchor="end">Вісь часу (CPU Time)</text>

  <!-- Hardware Event -->
  <line x1="160" y1="420" x2="160" y2="218" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="150" y="380" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="end">Апаратна подія</text>
  <text x="150" y="400" fill="#c0392b" font-size="12" text-anchor="end">(фронт сигналу EXTI)</text>
  <circle cx="160" cy="210" r="4" fill="#c0392b"/>

  <!-- Dashed guides down to the time axis -->
  <line x1="340" y1="280" x2="340" y2="420" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="620" y1="280" x2="620" y2="420" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="780" y1="240" x2="780" y2="420" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
</svg>
