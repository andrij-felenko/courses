<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a" />
        </marker>
        <marker id="eventArrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b" />
        </marker>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="white" />
    
    <!-- Title and Subtitle -->
    <text x="480" y="38" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма: Опитування (Polling) проти Переривань (Interrupt)</text>
    <text x="480" y="65" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Порівняння завантаження процесора та затримки реакції на зовнішню подію</text>
    
    <!-- ==================== POLLING TIMELINE ==================== -->
    <text x="50" y="105" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">1. Метод періодичного опитування (Polling)</text>
    <text x="50" y="128" font-family="sans-serif" font-size="13" fill="#6b7280">Процесор постійно перевіряє стан піна. Високе споживання, випадкова затримка реакції.</text>

    <!-- Base Axis -->
    <line x1="50" y1="235" x2="880" y2="235" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" />
    <text x="890" y="240" font-family="sans-serif" font-size="13" fill="#1a1a1a">Час</text>

    <!-- Checks (Blue) -->
    <!-- Check 1 -->
    <rect x="70" y="155" width="90" height="45" rx="4" fill="#2457d6" />
    <text x="115" y="182" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle">Опитування</text>
    <text x="115" y="145" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Нема події</text>
    
    <!-- Delay/Work 1 -->
    <rect x="170" y="165" width="90" height="30" fill="#e5e7eb" stroke="#d1d5db" />
    <text x="215" y="184" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle">Затримка</text>

    <!-- Check 2 -->
    <rect x="270" y="155" width="90" height="45" rx="4" fill="#2457d6" />
    <text x="315" y="182" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle">Опитування</text>
    <text x="315" y="145" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Нема події</text>
    
    <!-- Delay/Work 2 -->
    <rect x="370" y="165" width="90" height="30" fill="#e5e7eb" stroke="#d1d5db" />
    <text x="415" y="184" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle">Затримка</text>

    <!-- Check 3 -->
    <rect x="470" y="155" width="90" height="45" rx="4" fill="#2457d6" />
    <text x="515" y="182" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle">Опитування</text>
    <text x="515" y="145" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Нема події</text>

    <!-- Delay/Work 3 -->
    <rect x="570" y="165" width="120" height="30" fill="#e5e7eb" stroke="#d1d5db" />
    <text x="630" y="184" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle">Затримка / Код</text>

    <!-- Event Occurs -->
    <line x1="640" y1="100" x2="640" y2="155" stroke="#c0392b" stroke-width="2.5" marker-end="url(#eventArrow)" />
    <text x="640" y="92" font-family="sans-serif" font-weight="bold" font-size="12" fill="#c0392b" text-anchor="middle">Зовнішня подія</text>

    <!-- Processing (Green) -->
    <rect x="700" y="150" width="140" height="55" rx="4" fill="#27ae60" />
    <text x="770" y="176" font-family="sans-serif" font-weight="bold" font-size="12" fill="white" text-anchor="middle">Обробка</text>
    <text x="770" y="193" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle">Виявлено подію</text>
    
    <!-- Latency Indicator -->
    <line x1="640" y1="215" x2="700" y2="215" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="640" y1="210" x2="640" y2="220" stroke="#c0392b" stroke-width="2" />
    <line x1="700" y1="210" x2="700" y2="220" stroke="#c0392b" stroke-width="2" />
    <text x="670" y="230" font-family="sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Затримка</text>

    <!-- ==================== INTERRUPT TIMELINE ==================== -->
    <text x="50" y="280" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">2. Метод апаратних переривань (Interrupt / EXTI)</text>
    <text x="50" y="303" font-family="sans-serif" font-size="13" fill="#6b7280">Процесор спить або виконує фонові задачі. Апаратний блок миттєво викликає ISR.</text>

    <!-- Base Axis -->
    <line x1="50" y1="435" x2="880" y2="435" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" />
    <text x="890" y="440" font-family="sans-serif" font-size="13" fill="#1a1a1a">Час</text>

    <!-- Main Program / Sleep -->
    <rect x="70" y="345" width="560" height="40" rx="4" fill="#9ca3af" />
    <text x="350" y="370" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle">Фонова програма / Енергозберігаючий режим (Sleep)</text>

    <!-- Event Occurs -->
    <line x1="640" y1="285" x2="640" y2="340" stroke="#c0392b" stroke-width="2.5" marker-end="url(#eventArrow)" />
    <text x="640" y="278" font-family="sans-serif" font-weight="bold" font-size="12" fill="#c0392b" text-anchor="middle">Зовнішня подія</text>

    <!-- ISR (Green) -->
    <rect x="645" y="335" width="130" height="60" rx="4" fill="#27ae60" />
    <text x="710" y="362" font-family="sans-serif" font-weight="bold" font-size="12" fill="white" text-anchor="middle">Обробник ISR</text>
    <text x="710" y="380" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle">Миттєва реакція</text>

    <!-- Return to Main Program -->
    <rect x="785" y="345" width="100" height="40" rx="4" fill="#9ca3af" />
    <text x="835" y="370" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle">Фоновий код</text>

    <!-- Hardware note -->
    <text x="710" y="415" font-family="sans-serif" font-weight="bold" font-size="11" fill="#27ae60" text-anchor="middle">Затримка реакції &lt; 12-16 тактів CPU</text>
</svg>
