<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">RTOS — невелике ядро з готовими засобами багатозадачності</text>
  
  <rect x="50" y="65" width="660" height="205" rx="12" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
  <text x="380" y="92" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ядро RTOS</text>
  
  <rect x="75" y="108" width="180" height="60" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
  <text x="165" y="134" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">задачі</text>
  <text x="165" y="153" font-size="10" fill="#6b7280" text-anchor="middle">кілька програм нараз</text>
  
  <rect x="290" y="108" width="180" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="380" y="134" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">планувальник</text>
  <text x="380" y="153" font-size="10" fill="#6b7280" text-anchor="middle">хто й коли</text>
  
  <rect x="505" y="108" width="180" height="60" rx="6" fill="#fdf6e3" stroke="#b07d2a" stroke-width="1.6"/>
  <text x="595" y="134" font-size="12" fill="#b07d2a" text-anchor="middle" font-weight="700">час</text>
  <text x="595" y="153" font-size="10" fill="#6b7280" text-anchor="middle">тіки, паузи</text>
  
  <rect x="180" y="190" width="180" height="60" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.6"/>
  <text x="270" y="216" font-size="12" fill="#8a5fb0" text-anchor="middle" font-weight="700">обмін</text>
  <text x="270" y="235" font-size="10" fill="#6b7280" text-anchor="middle">черги, семафори</text>
  
  <rect x="400" y="190" width="180" height="60" rx="6" fill="#e6f6f4" stroke="#2aa198" stroke-width="1.6"/>
  <text x="490" y="216" font-size="12" fill="#2aa198" text-anchor="middle" font-weight="700">пам'ять</text>
  <text x="490" y="235" font-size="10" fill="#6b7280" text-anchor="middle">стеки задач</text>
  
  <rect x="50" y="290" width="660" height="52" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
  <text x="380" y="312" font-size="11" fill="#1a1a1a" text-anchor="middle">
    <tspan x="380" dy="0">не велика настільна ОС: ні файлів, ні вікон — крихітний набір,</tspan>
    <tspan x="380" dy="16">що перетворює голий чип на багатозадачну систему</tspan>
  </text>
</svg>