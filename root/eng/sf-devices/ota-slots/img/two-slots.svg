<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два слоти для прошивки: ota_0 і ota_1</text>
<rect x="70.0" y="120.4" width="250.0" height="63.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/><text x="195.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">ota_0</tspan><tspan x="195.0" dy="15.6">ПРАЦЮЄ зараз</tspan><tspan x="195.0" dy="15.6">недоторканий</tspan></text>
<rect x="400.0" y="100.0" width="250.0" height="104.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="525.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">ota_1</tspan><tspan x="525.0" dy="15.6">вільний слот</tspan><tspan x="525.0" dy="15.6">сюди новий образ</tspan></text>
<line x1="326.0" y1="152.0" x2="394.0" y2="152.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="360.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">новий</text>
<text x="360.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поки пишемо в ota_1, ota_0 спокійно виконується далі —</text>
<text x="360.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">збій під час запису не чіпає робочої прошивки.</text>
</svg>