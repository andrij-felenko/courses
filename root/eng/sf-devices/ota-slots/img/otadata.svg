<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перемикач завантаження: крихітна otadata</text>
<rect x="75.4" y="104.0" width="109.3" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="130.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">завантажувач</tspan></text>
<line x1="184.6" y1="120.0" x2="300.0" y2="120.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="298.6" y="97.3" width="142.8" height="45.3" rx="6" fill="#fdf6e3" stroke="#caa24a" stroke-width="1.8"/><text x="370.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">otadata</tspan><tspan x="370.0" dy="14.3">«старт зі слота 1»</tspan></text>
<line x1="441.4" y1="120.0" x2="560.0" y2="120.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="569.1" y="96.2" width="101.8" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="620.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">ota_1</tspan><tspan x="620.0" dy="15.6">новий образ</tspan></text>
<rect x="80.0" y="200.0" width="580.0" height="96.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.4"/><text x="370.0" y="237.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Порядок незмінний:</tspan><tspan x="370.0" dy="14.3">1) записати новий образ у вільний слот ПОВНІСТЮ;  2) перевірити його;</tspan><tspan x="370.0" dy="14.3">3) аж тоді перемкнути otadata на цей слот — одним коротким кроком.</tspan></text>
<text x="370.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Збій до кроку 3 → стартує старий слот; після → новий. Без «напівоновлення».</text>
</svg>