<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому RTC переживає watchdog, але не brown-out</text>
<rect x="50.0" y="70.0" width="320.0" height="200.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="210.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Core Reset</tspan></text>
<text x="210.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ядро скинуто, RTC-домен живий</tspan></text>
<rect x="74.0" y="144.0" width="272.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="161.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">watchdog (TASK_WDT / INT_WDT)</tspan></text>
<rect x="74.0" y="178.0" width="272.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="195.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">panic (PANIC)</tspan></text>
<rect x="74.0" y="212.0" width="272.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">програмний esp_restart()</tspan></text>
<text x="210.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">RTC-пам'ять зберігається → лічильник доїде</tspan></text>
<rect x="390.0" y="70.0" width="320.0" height="200.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="2.0"/>
<text x="550.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">System Reset</tspan></text>
<text x="550.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">скидається весь чип разом з RTC</tspan></text>
<rect x="414.0" y="144.0" width="272.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="550.0" y="161.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">power-on (POWERON)</tspan></text>
<rect x="414.0" y="178.0" width="272.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="550.0" y="195.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">brown-out (BROWNOUT)</tspan></text>
<text x="550.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">у RTC_NOINIT — сміття, не нуль</tspan></text>
<text x="550.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">тому магічне число вартує лічильник</tspan></text>
</svg>