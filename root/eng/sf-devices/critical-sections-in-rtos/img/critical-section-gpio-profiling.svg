<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Standard right-pointing arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>

    <!-- Left-pointing arrow markers for dimension spans -->
    <marker id="arr-blue-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Осцилограма профілювання критичної секції через вивід GPIO</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Фізичний моніторинг виводу GPIO фіксує активний стан T_cs, найгірший час WCET та фазовий джитер відгуку</text>

  <!-- ==================== MAIN PANEL: OSCILLOGRAM VIEW ==================== -->
  <rect x="24" y="72" width="912" height="282" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Main Panel Header -->
  <path d="M 24,80 Q 24,72 32,72 L 928,72 Q 936,72 936,80 L 936,102 L 24,102 Z" fill="#f4f6f8"/>
  <line x1="24" y1="102" x2="936" y2="102" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="38" y="92" font-size="14" font-weight="700" fill="#1a1a1a">Багатоканальна діаграма: сигнал GPIO, запит переривання IRQ та запуск ISR</text>
  <text x="922" y="92" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">Тригер: Pulse Width &gt; 5.0 μs</text>

  <!-- Channel Legends / Labels (Left side) -->
  <!-- Channel 1: GPIO -->
  <rect x="36" y="118" width="126" height="44" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="44" y="135" font-size="12" font-weight="700" fill="#2457d6">CH1: GPIO (PA5)</text>
  <text x="44" y="151" font-size="12" fill="#6b7280">Критична секція</text>

  <!-- Channel 2: IRQ -->
  <rect x="36" y="176" width="126" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="44" y="193" font-size="12" font-weight="700" fill="#b45309">CH2: EXTI / IRQ</text>
  <text x="44" y="209" font-size="12" fill="#6b7280">Апаратна подія</text>

  <!-- Channel 3: ISR -->
  <rect x="36" y="234" width="126" height="44" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="44" y="251" font-size="12" font-weight="700" fill="#27ae60">CH3: Обробник ISR</text>
  <text x="44" y="267" font-size="12" fill="#6b7280">Виконання коду</text>

  <!-- Oscilloscope Display Grid Area -->
  <rect x="178" y="106" width="746" height="236" rx="6" fill="#f8fafc" stroke="#d0d7de" stroke-width="1"/>

  <!-- Subtle Horizontal Grid Lines -->
  <line x1="224" y1="150" x2="924" y2="150" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="224" y1="176" x2="924" y2="176" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="178" y1="202" x2="924" y2="202" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="178" y1="226" x2="924" y2="226" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="178" y1="254" x2="924" y2="254" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="178" y1="278" x2="924" y2="278" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Vertical Divider separating Cycle 1 and Cycle 2 -->
  <line x1="518" y1="106" x2="518" y2="314" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Cycle Banners -->
  <rect x="220" y="110" width="250" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="345" y="123" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ЦИКЛ 1: Номінальний стан (2.0 μs)</text>

  <rect x="580" y="110" width="280" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="720" y="123" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">ЦИКЛ 2: Аномалія WCET та джитер</text>

  <!-- ==================== CYCLE 1 (LEFT HALF) ==================== -->
  <!-- Voltage Level Ticks on GPIO -->
  <text x="216" y="154" font-size="12" fill="#6b7280" text-anchor="end">3.3V</text>
  <text x="216" y="176" font-size="12" fill="#6b7280" text-anchor="end">0V</text>

  <!-- Dimension Arrow T_nom -->
  <line x1="230" y1="140" x2="320" y2="140" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-left)" marker-end="url(#arr-blue)"/>
  <text x="275" y="137" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">T_nom = 2.0 μs</text>

  <!-- Waveform CH1: GPIO (Nominal Pulse) -->
  <path d="M 184,176 L 230,176 L 230,150 L 320,150 L 320,176 L 508,176" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <rect x="230" y="150" width="90" height="26" fill="#eaf0fd" opacity="0.6"/>
  <text x="275" y="167" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Критична дія</text>

  <!-- Waveform CH2: IRQ Event -->
  <path d="M 184,226 L 260,226 L 260,202 L 285,202 L 285,226 L 508,226" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="272" y="196" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">IRQ подія</text>

  <!-- Masking indicator in Cycle 1 -->
  <rect x="290" y="208" width="50" height="16" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="315" y="220" font-size="12" fill="#b45309" text-anchor="middle">У черзі</text>

  <!-- Hardware context save / entry delay to ISR (0.3 μs) -->
  <rect x="320" y="254" width="14" height="24" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Waveform CH3: ISR Active (Nominal Response) -->
  <path d="M 184,278 L 334,278 L 334,254 L 410,254 L 410,278 L 508,278" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <rect x="334" y="254" width="76" height="24" fill="#e9f7ef" opacity="0.6"/>
  <text x="372" y="270" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ISR обробка</text>

  <!-- Latency Dimension Arrow Cycle 1 -->
  <line x1="260" y1="294" x2="334" y2="294" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green-left)" marker-end="url(#arr-green)"/>
  <text x="297" y="308" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">t_lat = 1.9 μs</text>

  <!-- ==================== CYCLE 2 (RIGHT HALF) ==================== -->
  <!-- Dimension Arrow WCET -->
  <line x1="560" y1="140" x2="770" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="665" y="137" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">T_wcet = 8.5 μs (1428 тактів)</text>

  <!-- Waveform CH1: GPIO (Worst-Case Pulse) -->
  <path d="M 528,176 L 560,176 L 560,150 L 770,150 L 770,176 L 918,176" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Left part of pulse: Nominal baseline -->
  <rect x="560" y="150" width="90" height="26" fill="#eaf0fd" opacity="0.6"/>
  <text x="605" y="167" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Номінал</text>

  <!-- Nominal edge reference (dashed line) -->
  <line x1="650" y1="146" x2="650" y2="176" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Shaded Jitter Envelope (ΔT_jitter) -->
  <rect x="650" y="150" width="120" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="710" y="167" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Джитер 6.5 μs</text>

  <!-- Waveform CH2: IRQ Event (Blocked) -->
  <path d="M 528,226 L 590,226 L 590,202 L 615,202 L 615,226 L 918,226" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="602" y="196" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">IRQ подія</text>

  <!-- Prolonged Masking Indicator in Cycle 2 -->
  <rect x="615" y="210" width="155" height="15" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="692" y="222" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Заблоковано маскою BASEPRI</text>

  <!-- Waveform CH3: ISR Active (Delayed by Jitter) -->
  <!-- Ghost Box of Expected ISR Execution -->
  <rect x="664" y="254" width="76" height="24" rx="2" fill="none" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="702" y="248" font-size="12" fill="#27ae60" text-anchor="middle">Очікуваний старт</text>

  <!-- Actual ISR Pulse -->
  <rect x="770" y="254" width="14" height="24" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 528,278 L 784,278 L 784,254 L 860,254 L 860,278 L 918,278" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <rect x="784" y="254" width="76" height="24" fill="#e9f7ef" opacity="0.6"/>
  <text x="822" y="270" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ISR обробка</text>

  <!-- Phase Jitter Bracket on ISR -->
  <line x1="664" y1="294" x2="784" y2="294" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-left)" marker-end="url(#arr-red)"/>
  <text x="724" y="308" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Фазовий дрейф відгуку: Δt_jitter = 6.5 μs (t_lat = 8.4 μs)</text>

  <!-- ==================== TIMELINE / TIME AXIS ==================== -->
  <line x1="190" y1="324" x2="910" y2="324" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="914" y="328" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start">Час, t</text>

  <!-- Timeline Ticks Cycle 1 -->
  <line x1="230" y1="322" x2="230" y2="326" stroke="#6b7280" stroke-width="1.5"/>
  <text x="230" y="339" font-size="12" fill="#6b7280" text-anchor="middle">0 μs</text>

  <line x1="320" y1="322" x2="320" y2="326" stroke="#6b7280" stroke-width="1.5"/>
  <text x="320" y="339" font-size="12" fill="#2457d6" text-anchor="middle">2.0 μs</text>

  <line x1="410" y1="322" x2="410" y2="326" stroke="#6b7280" stroke-width="1.5"/>
  <text x="410" y="339" font-size="12" fill="#27ae60" text-anchor="middle">4.0 μs</text>

  <!-- Timeline Ticks Cycle 2 -->
  <line x1="560" y1="322" x2="560" y2="326" stroke="#6b7280" stroke-width="1.5"/>
  <text x="560" y="339" font-size="12" fill="#6b7280" text-anchor="middle">0 μs</text>

  <line x1="650" y1="322" x2="650" y2="326" stroke="#6b7280" stroke-width="1.5"/>
  <text x="650" y="339" font-size="12" fill="#27ae60" text-anchor="middle">2.0 μs</text>

  <line x1="770" y1="322" x2="770" y2="326" stroke="#6b7280" stroke-width="1.5"/>
  <text x="770" y="339" font-size="12" fill="#c0392b" text-anchor="middle">8.5 μs</text>

  <line x1="860" y1="322" x2="860" y2="326" stroke="#6b7280" stroke-width="1.5"/>
  <text x="860" y="339" font-size="12" fill="#27ae60" text-anchor="middle">10.5 μs</text>

  <!-- ==================== BOTTOM CARDS: CODE & ANALYSIS ==================== -->
  <!-- Left Card: Atomic GPIO Control -->
  <rect x="24" y="368" width="444" height="152" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 24,376 Q 24,368 32,368 L 460,368 Q 468,368 468,376 L 468,396 L 24,396 Z" fill="#eaf0fd"/>
  <line x1="24" y1="396" x2="468" y2="396" stroke="#2457d6" stroke-width="1.5"/>
  <text x="36" y="386" font-size="13" font-weight="700" fill="#2457d6">Апаратне профілювання: атомарне керування GPIO</text>

  <rect x="36" y="404" width="420" height="52" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="46" y="418" font-size="12" font-family="monospace" fill="#1a1a1a">GPIO-&gt;BSRR = (1 &lt;&lt; 5);  <tspan fill="#2457d6">// SET: 1 такт CPU (3.3 В)</tspan></text>
  <text x="46" y="434" font-size="12" font-family="monospace" fill="#1a1a1a">taskENTER_CRITICAL(); /* RMW */ taskEXIT_CRITICAL();</text>
  <text x="46" y="450" font-size="12" font-family="monospace" fill="#1a1a1a">GPIO-&gt;BSRR = (1 &lt;&lt; 21); <tspan fill="#2457d6">// RESET: 1 такт CPU (0 В)</tspan></text>

  <text x="36" y="472" font-size="12" fill="#1a1a1a">• <tspan font-weight="700">Мінімальний оверхед:</tspan> атомарний запис у BSRR за 1 такт CPU</text>
  <text x="36" y="490" font-size="12" fill="#1a1a1a">• <tspan font-weight="700">Безпечно для кешу:</tspan> без виклику функцій та скидання стека</text>
  <text x="36" y="508" font-size="12" fill="#6b7280">• <tspan font-weight="700">Чистий сигнал:</tspan> ширина імпульсу дорівнює часу маскування T_cs</text>

  <!-- Right Card: Jitter & WCET Detection -->
  <rect x="492" y="368" width="444" height="152" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 492,376 Q 492,368 500,368 L 928,368 Q 936,368 936,376 L 936,396 L 492,396 Z" fill="#fdecea"/>
  <line x1="492" y1="396" x2="936" y2="396" stroke="#c0392b" stroke-width="1.5"/>
  <text x="504" y="386" font-size="13" font-weight="700" fill="#c0392b">Детекція аномалій WCET та природа джитеру</text>

  <rect x="504" y="404" width="420" height="52" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="514" y="418" font-size="12" font-weight="700" fill="#c0392b">Тригер осцилографа: Pulse Width &gt; 5.0 μs (фільтрує номінал)</text>
  <text x="514" y="434" font-size="12" fill="#1a1a1a">T_nom = 2.0 μs (336 тактів) • T_wcet = 8.5 μs (1428 тактів)</text>
  <text x="514" y="450" font-size="12" font-weight="700" fill="#2457d6">Фазовий джитер: ΔT = T_wcet - T_nom = 6.5 μs (варіація)</text>

  <text x="504" y="472" font-size="12" fill="#1a1a1a">• <tspan font-weight="700">Причини джитеру:</tspan> промахи кешу I-Cache та очікування шин</text>
  <text x="504" y="490" font-size="12" fill="#1a1a1a">• <tspan font-weight="700">Фазовий дрейф ISR:</tspan> варіація T_cs зсуває початок обробки</text>
  <text x="504" y="508" font-size="12" fill="#6b7280">• <tspan font-weight="700">Автозахоплення:</tspan> режим Single ловить рідкісні аномалії WCET</text>
</svg>
