<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-axis" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Загальне тло -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Порівняння механізмів критичних секцій в RTOS</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">BASEPRI затримує виконання ISR, а блокування планувальника відкладає лише витіснення задач</text>

  <!-- ================= ПАНЕЛЬ 1: BASEPRI ================= -->
  <rect x="30" y="66" width="900" height="216" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок панелі 1 -->
  <rect x="44" y="76" width="270" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="54" y="92" font-size="13" font-weight="700" fill="#c0392b">1. Маскування переривань (BASEPRI)</text>
  <text x="326" y="92" font-size="12" fill="#6b7280">taskENTER_CRITICAL() — апаратне маскування переривань з пріоритетом ≤ MAX_SYSCALL</text>

  <!-- Назви треків панелі 1 -->
  <text x="44" y="122" font-size="13" font-weight="700" fill="#1a1a1a">Задача A (поточна)</text>
  <text x="44" y="156" font-size="13" font-weight="700" fill="#1a1a1a">Переривання (ISR)</text>
  <text x="44" y="190" font-size="13" font-weight="700" fill="#1a1a1a">Задача B (висока)</text>

  <!-- Базові напрямні треків (рейки) панелі 1 -->
  <rect x="210" y="106" width="700" height="22" rx="4" fill="#f4f6f8"/>
  <rect x="210" y="140" width="700" height="22" rx="4" fill="#f4f6f8"/>
  <rect x="210" y="174" width="700" height="22" rx="4" fill="#f4f6f8"/>

  <!-- Блоки виконання Треку 1 (Задача A) -->
  <rect x="210" y="106" width="80" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="250" y="122" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Виконання</text>

  <rect x="290" y="106" width="280" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="430" y="122" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Критична секція: BASEPRI = MAX_SYSCALL</text>

  <rect x="780" y="106" width="130" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="845" y="122" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Продовження A</text>

  <!-- Блоки виконання Треку 2 (ISR) -->
  <text x="285" y="156" font-size="12" fill="#9ca3af" text-anchor="middle">Очікування події</text>

  <!-- Стрілка приходу апаратного запиту IRQ -->
  <line x1="370" y1="130" x2="370" y2="138" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="370" y="140" width="200" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="470" y="156" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Масковано в NVIC (T_cs)</text>

  <rect x="570" y="140" width="70" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="605" y="156" font-size="12" font-weight="700" fill="#1e7e44" text-anchor="middle">ISR</text>

  <!-- Сигнал розблокування від ISR до Задачі B -->
  <line x1="640" y1="164" x2="640" y2="172" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блоки виконання Треку 3 (Задача B) -->
  <text x="285" y="190" font-size="12" fill="#9ca3af" text-anchor="middle">Блокована (очікує)</text>

  <rect x="640" y="174" width="140" height="22" rx="4" fill="#2457d6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="710" y="190" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Задача B (виконання)</text>

  <!-- Часова вісь панелі 1 -->
  <line x1="210" y1="206" x2="910" y2="206" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr-axis)"/>
  <line x1="290" y1="206" x2="290" y2="210" stroke="#9ca3af" stroke-width="1"/>
  <text x="290" y="220" font-size="12" fill="#6b7280" text-anchor="middle">t1: Enter CS</text>
  <line x1="370" y1="206" x2="370" y2="210" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="220" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t2: IRQ</text>
  <line x1="570" y1="206" x2="570" y2="210" stroke="#6b7280" stroke-width="1"/>
  <text x="570" y="220" font-size="12" fill="#6b7280" text-anchor="middle">t3: Exit CS</text>
  <line x1="640" y1="206" x2="640" y2="210" stroke="#6b7280" stroke-width="1"/>
  <text x="640" y="220" font-size="12" fill="#6b7280" text-anchor="middle">t4: ISR кін.</text>
  <line x1="780" y1="206" x2="780" y2="210" stroke="#6b7280" stroke-width="1"/>
  <text x="780" y="220" font-size="12" fill="#6b7280" text-anchor="middle">t5: Задача B кін.</text>
  <text x="910" y="220" font-size="12" fill="#6b7280" text-anchor="end">Час t</text>

  <!-- Підсумок панелі 1 -->
  <rect x="44" y="230" width="860" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="56" y="254" font-size="12" font-weight="700" fill="#b45309">Властивість:</text>
  <text x="145" y="254" font-size="12" fill="#1a1a1a">Затримка апаратного ISR = T_cs (джерело джитеру). Захищає спільні ресурси Task ↔ ISR (короткі операції).</text>

  <!-- ================= ПАНЕЛЬ 2: SCHEDULER LOCK ================= -->
  <rect x="30" y="296" width="900" height="216" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок панелі 2 -->
  <rect x="44" y="306" width="270" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="54" y="322" font-size="13" font-weight="700" fill="#1e7e44">2. Блокування планувальника RTOS</text>
  <text x="326" y="322" font-size="12" fill="#6b7280">vTaskSuspendAll() — переривання НЕ блокуються, витіснення відкладено до xTaskResumeAll()</text>

  <!-- Назви треків панелі 2 -->
  <text x="44" y="352" font-size="13" font-weight="700" fill="#1a1a1a">Задача A (поточна)</text>
  <text x="44" y="386" font-size="13" font-weight="700" fill="#1a1a1a">Переривання (ISR)</text>
  <text x="44" y="420" font-size="13" font-weight="700" fill="#1a1a1a">Задача B (висока)</text>

  <!-- Базові напрямні треків (рейки) панелі 2 -->
  <rect x="210" y="336" width="700" height="22" rx="4" fill="#f4f6f8"/>
  <rect x="210" y="370" width="700" height="22" rx="4" fill="#f4f6f8"/>
  <rect x="210" y="404" width="700" height="22" rx="4" fill="#f4f6f8"/>

  <!-- Блоки виконання Треку 1 (Задача A) -->
  <rect x="210" y="336" width="80" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="250" y="352" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Виконання</text>

  <rect x="290" y="336" width="80" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="352" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Lock RTOS</text>

  <rect x="370" y="336" width="70" height="22" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="405" y="352" font-size="12" fill="#9ca3af" text-anchor="middle">Пауза</text>

  <rect x="440" y="336" width="130" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="505" y="352" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Завершення секції</text>

  <rect x="710" y="336" width="200" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="810" y="352" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Продовження задачі A</text>

  <!-- Блоки виконання Треку 2 (ISR) -->
  <text x="285" y="386" font-size="12" fill="#9ca3af" text-anchor="middle">Очікування події</text>

  <!-- Стрілка приходу апаратного запиту IRQ -->
  <line x1="370" y1="360" x2="370" y2="368" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="370" y="370" width="70" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="405" y="386" font-size="12" font-weight="700" fill="#1e7e44" text-anchor="middle">ISR (T=0)</text>

  <!-- Сигнал розблокування від ISR до Задачі B -->
  <line x1="440" y1="394" x2="440" y2="402" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Блоки виконання Треку 3 (Задача B) -->
  <text x="285" y="420" font-size="12" fill="#9ca3af" text-anchor="middle">Блокована (очікує)</text>

  <rect x="440" y="404" width="130" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="505" y="420" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Готова (очікує)</text>

  <rect x="570" y="404" width="140" height="22" rx="4" fill="#2457d6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="640" y="420" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Задача B (виконання)</text>

  <!-- Часова вісь панелі 2 -->
  <line x1="210" y1="436" x2="910" y2="436" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr-axis)"/>
  <line x1="290" y1="436" x2="290" y2="440" stroke="#9ca3af" stroke-width="1"/>
  <text x="290" y="450" font-size="12" fill="#6b7280" text-anchor="middle">t1: Suspend</text>
  <line x1="370" y1="436" x2="370" y2="440" stroke="#27ae60" stroke-width="1.5"/>
  <text x="370" y="450" font-size="12" font-weight="700" fill="#1e7e44" text-anchor="middle">t2: IRQ</text>
  <line x1="440" y1="436" x2="440" y2="440" stroke="#6b7280" stroke-width="1"/>
  <text x="440" y="450" font-size="12" fill="#6b7280" text-anchor="middle">t3: ISR кін.</text>
  <line x1="570" y1="436" x2="570" y2="440" stroke="#6b7280" stroke-width="1"/>
  <text x="570" y="450" font-size="12" fill="#6b7280" text-anchor="middle">t4: Resume</text>
  <line x1="710" y1="436" x2="710" y2="440" stroke="#6b7280" stroke-width="1"/>
  <text x="710" y="450" font-size="12" fill="#6b7280" text-anchor="middle">t5: Задача B кін.</text>
  <text x="910" y="450" font-size="12" fill="#6b7280" text-anchor="end">Час t</text>

  <!-- Підсумок панелі 2 -->
  <rect x="44" y="460" width="860" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="56" y="484" font-size="12" font-weight="700" fill="#1e7e44">Властивість:</text>
  <text x="145" y="484" font-size="12" fill="#1a1a1a">Затримка ISR = 0 (нульова!). Відкладається лише витіснення задач на T_lock. Захищає структури Task ↔ Task.</text>
</svg>
