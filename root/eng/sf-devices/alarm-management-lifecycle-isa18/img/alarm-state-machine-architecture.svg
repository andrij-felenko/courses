<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Автомат станів тривог за стандартом ISA-18.2</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Переходи між станами: Норма, Непідтверджена тривога, Підтверджена тривога</text>

  <!-- States -->
  <rect x="60" y="180" width="200" height="90" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="160" y="215" font-size="15" font-weight="700" fill="#27ae60" text-anchor="middle">НОРМА (Normal)</text>
  <text x="160" y="240" font-size="12" fill="#6b7280" text-anchor="middle">Параметри в межах</text>

  <rect x="380" y="100" width="220" height="90" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <text x="490" y="130" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">НЕПІДТВЕРДЖЕНА (Unack)</text>
  <text x="490" y="155" font-size="12" fill="#6b7280" text-anchor="middle">Блимання та зумер</text>

  <rect x="380" y="260" width="220" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="490" y="290" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">ПІДТВЕРДЖЕНА (Acked)</text>
  <text x="490" y="315" font-size="12" fill="#6b7280" text-anchor="middle">Постійне свічення</text>

  <rect x="700" y="180" width="200" height="90" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="800" y="215" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">ПОВЕРНЕННЯ (RTN)</text>
  <text x="800" y="240" font-size="12" fill="#6b7280" text-anchor="middle">Очікує квитування</text>

  <!-- Transitions -->
  <line x1="260" y1="200" x2="380" y2="145" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="290" y="150" font-size="12" font-weight="700" fill="#c0392b">Умова тривоги</text>

  <line x1="490" y1="190" x2="490" y2="260" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="510" y="230" font-size="12" font-weight="700" fill="#2457d6">Квитування (ACK)</text>

  <line x1="600" y1="305" x2="700" y2="255" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="630" y="310" font-size="12" fill="#27ae60">Нормалізація</text>

  <line x1="700" y1="225" x2="260" y2="225" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="480" y="215" font-size="12" fill="#27ae60" text-anchor="middle">Скидання (ACK на RTN)</text>
</svg>