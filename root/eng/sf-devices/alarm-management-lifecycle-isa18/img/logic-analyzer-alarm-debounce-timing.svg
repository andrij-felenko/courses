  <line x1="450" y1="70" x2="450" y2="390" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="550" y1="70" x2="550" y2="390" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="500" y="390" font-size="12" fill="#2457d6" text-anchor="middle">Час витримки T_debounce</text>
