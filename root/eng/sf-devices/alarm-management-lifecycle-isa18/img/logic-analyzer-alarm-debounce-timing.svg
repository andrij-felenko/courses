<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова осцилограма антидребізгу тривожного сигналу</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Захист від коротких сплесків та хибних спрацьовувань (Glitch Filtering)</text>

