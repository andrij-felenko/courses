<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Життєвий цикл керування тривогами за ISA-18.2</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Замкнений цикл проектування, впровадження, експлуатації та аудиту</text>

  <rect x="50" y="100" width="160" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="130" y="125" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">1. Філософія</text>
  <text x="130" y="145" font-size="11" fill="#6b7280" text-anchor="middle">Правила та класи</text>

  <rect x="270" y="100" width="160" height="60" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="350" y="125" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. Ідентифікація</text>
  <text x="350" y="145" font-size="11" fill="#6b7280" text-anchor="middle">HAZOP / РКД</text>

  <rect x="490" y="100" width="160" height="60" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="570" y="125" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. Раціоналізація</text>
  <text x="570" y="145" font-size="11" fill="#6b7280" text-anchor="middle">Пріоритети</text>

  <rect x="710" y="100" width="160" height="60" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="790" y="125" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">4. Проектування</text>
  <text x="790" y="145" font-size="11" fill="#6b7280" text-anchor="middle">Уставки HMI</text>

  <rect x="710" y="260" width="160" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="790" y="285" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">5. Впровадження</text>
  <text x="790" y="305" font-size="11" fill="#6b7280" text-anchor="middle">Тестування в ПЛК</text>

  <rect x="490" y="260" width="160" height="60" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="570" y="285" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">6. Експлуатація</text>
  <text x="570" y="305" font-size="11" fill="#6b7280" text-anchor="middle">Оперативний контроль</text>

  <rect x="270" y="260" width="160" height="60" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="350" y="285" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">7. Обслуговування</text>
  <text x="350" y="305" font-size="11" fill="#6b7280" text-anchor="middle">Калібрування</text>

  <rect x="50" y="260" width="160" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="130" y="285" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">8. Аудит та MOC</text>
  <text x="130" y="305" font-size="11" fill="#6b7280" text-anchor="middle">Аналіз ефективності</text>

  <!-- Flow Arrows -->
  <line x1="210" y1="130" x2="270" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="130" x2="490" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="130" x2="710" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="790" y1="160" x2="790" y2="260" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="290" x2="650" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="290" x2="430" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="290" x2="210" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="130" y1="260" x2="130" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>