<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими буферизації дисплея в графічному рушії мікроконтролера</text>
<rect x="30.0" y="55.0" width="780.0" height="105.0" rx="6" fill="#fcfcfc" stroke="#6b7280" stroke-width="1.2"/>
<rect x="45.0" y="67.0" width="230.0" height="26.0" rx="4" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.4"/>
<text x="160.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">1. Single Partial Buffer (1/10 екрана)</text>
<text x="160.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">SRAM: ~15-30 КБ</tspan><tspan x="160.0" dy="11.9">Чергування: CPU малює -&gt; чекає DMA</tspan><tspan x="160.0" dy="11.9">Низька швидкість (FPS) через простої CPU</tspan></text>
<rect x="300.0" y="70.0" width="120.0" height="36.0" rx="4" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.3"/>
<text x="360.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="700">CPU: Рендер 1</text>
<rect x="430.0" y="70.0" width="120.0" height="36.0" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.3"/>
<text x="490.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e8449" text-anchor="middle" font-weight="700">DMA: Вивід 1</text>
<rect x="560.0" y="70.0" width="120.0" height="36.0" rx="4" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.3"/>
<text x="620.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="700">CPU: Рендер 2</text>
<rect x="690.0" y="70.0" width="100.0" height="36.0" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.3"/>
<text x="740.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e8449" text-anchor="middle" font-weight="700">DMA: Вивід 2</text>
<rect x="300.0" y="117.0" width="490.0" height="28.0" rx="3" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.0"/>
<text x="545.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">Послідовне виконання: CPU заблокований під час роботи DMA (FPS падає в 1.8-2 рази)</text>
<rect x="30.0" y="175.0" width="780.0" height="115.0" rx="6" fill="#fcfcfc" stroke="#27ae60" stroke-width="1.6"/>
<rect x="45.0" y="187.0" width="230.0" height="26.0" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.4"/>
<text x="160.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">2. Double Partial Buffer (Ping-Pong)</text>
<text x="160.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">SRAM: ~30-60 КБ (два буфери в ОЗП)</tspan><tspan x="160.0" dy="11.9">Повне перекриття рендерингу й DMA</tspan><tspan x="160.0" dy="11.9">Оптимальний баланс для MCU без SDRAM</tspan></text>
<rect x="300.0" y="190.0" width="150.0" height="34.0" rx="4" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.3"/>
<text x="375.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a5276" text-anchor="middle" font-weight="700">CPU: Рендер у Буфер A</text>
<rect x="460.0" y="190.0" width="150.0" height="34.0" rx="4" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.3"/>
<text x="535.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a5276" text-anchor="middle" font-weight="700">CPU: Рендер у Буфер B</text>
<rect x="620.0" y="190.0" width="170.0" height="34.0" rx="4" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.3"/>
<text x="705.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a5276" text-anchor="middle" font-weight="700">CPU: Рендер у Буфер A</text>
<rect x="460.0" y="233.0" width="150.0" height="34.0" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.3"/>
<text x="535.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e8449" text-anchor="middle" font-weight="700">DMA: Передача Буфера A</text>
<rect x="620.0" y="233.0" width="170.0" height="34.0" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.3"/>
<text x="705.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e8449" text-anchor="middle" font-weight="700">DMA: Передача Буфера B</text>
<text x="545.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Паралельна робота: CPU обчислює наступну смугу, поки DMA спустошує попередню</text>
<rect x="30.0" y="305.0" width="780.0" height="105.0" rx="6" fill="#fcfcfc" stroke="#6b7280" stroke-width="1.2"/>
<rect x="45.0" y="317.0" width="230.0" height="26.0" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1.4"/>
<text x="160.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. Full Double Buffer / Direct Mode</text>
<text x="160.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">RAM: 600-1600 КБ (потрібна SDRAM/PSRAM)</tspan><tspan x="160.0" dy="11.9">Нульовий тиринг при VSYNC-синхронізації</tspan><tspan x="160.0" dy="11.9">Direct: малювання лише брудних пікселів</tspan></text>
<rect x="300.0" y="320.0" width="235.0" height="75.0" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1.3"/>
<text x="417.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Фреймбуфер 1 (Front / Active)</text>
<text x="417.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">Відображається на дисплеї</tspan><tspan x="417.0" dy="10.8">через LTDC / паралельну шину</tspan></text>
<rect x="550.0" y="320.0" width="240.0" height="75.0" rx="4" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.3"/>
<text x="670.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="700">Фреймбуфер 2 (Back / Draw)</text>
<text x="670.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">CPU / DMA2D малює новий кадр</tspan><tspan x="670.0" dy="10.8">Своп покажчиків по сигналу VSYNC</tspan></text>
</svg>