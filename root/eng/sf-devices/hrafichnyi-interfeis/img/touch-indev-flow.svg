<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр обробки сенсорного введення (Touch Driver InDev) в LVGL</text>
<rect x="30.0" y="65.0" width="175.0" height="95.0" rx="6" fill="#f0e6fa" stroke="#7d3c98" stroke-width="1.5"/>
<text x="117.5" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="middle" font-weight="700">1. Апаратний давач</text>
<text x="117.5" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="117.5" dy="0.0">Сенсорний контролер</tspan><tspan x="117.5" dy="11.9">(FT6206 / CST816 / GT911)</tspan><tspan x="117.5" dy="11.9">Переривання IRQ або I2C</tspan></text>
<rect x="235.0" y="65.0" width="175.0" height="95.0" rx="6" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.5"/>
<text x="322.5" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="middle" font-weight="700">2. Драйвер InDev</text>
<text x="322.5" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="322.5" dy="0.0">read_cb(indev_drv, data)</tspan><tspan x="322.5" dy="11.9">Зчитування сирих (X, Y)</tspan><tspan x="322.5" dy="11.9">Стан PR (Pressed) / REL</tspan></text>
<rect x="435.0" y="65.0" width="175.0" height="95.0" rx="6" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.5"/>
<text x="522.5" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">3. Нормалізація</text>
<text x="522.5" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="522.5" dy="0.0">Калібрування матриці</tspan><tspan x="522.5" dy="11.9">Фільтрація шумів (медіана)</tspan><tspan x="522.5" dy="11.9">Поворот під орієнтацію</tspan></text>
<rect x="635.0" y="65.0" width="175.0" height="95.0" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5"/>
<text x="722.5" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">4. Черга подій LVGL</text>
<text x="722.5" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="722.5" dy="0.0">Генерація LV_EVENT_:</tspan><tspan x="722.5" dy="11.9">CLICKED, PRESSING, SCROLL</tspan><tspan x="722.5" dy="11.9">Диспетчеризація до віджета</tspan></text>
<line x1="205.0" y1="112.0" x2="235.0" y2="112.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
