<rect x="30.0" y="185.0" width="780.0" height="180.0" rx="6" fill="#fcfcfc" stroke="#6b7280" stroke-width="1.3"/>
<text x="420.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Машина станів обробника жесту та віджета у фокусі</text>
<rect x="50.0" y="230.0" width="220.0" height="80.0" rx="4" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.3"/>
<text x="160.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="700">Дотик (Touch Down)</text>
<text x="160.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">LV_INDEV_STATE_PR</tspan><tspan x="160.0" dy="11.2">Пошук віджета за координатами</tspan><tspan x="160.0" dy="11.2">Надсилання LV_EVENT_PRESSED</tspan></text>
<rect x="310.0" y="230.0" width="220.0" height="80.0" rx="4" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.3"/>
<text x="420.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">Утримання / Рух (Drag)</text>
<text x="420.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Зміна координат (dX, dY)</tspan><tspan x="420.0" dy="11.2">Поріг скролу (scroll_limit)</tspan><tspan x="420.0" dy="11.2">LV_EVENT_PRESSING / SCROLL</tspan></text>
<rect x="570.0" y="230.0" width="220.0" height="80.0" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.3"/>
<text x="680.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e8449" text-anchor="middle" font-weight="700">Відпускання (Touch Up)</text>
<text x="680.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">LV_INDEV_STATE_REL</tspan><tspan x="680.0" dy="11.2">Якщо курсор у межах віджета:</tspan><tspan x="680.0" dy="11.2">LV_EVENT_CLICKED / SHORT_CLICK</tspan></text>
<line x1="270.0" y1="270.0" x2="310.0" y2="270.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="270.0" x2="570.0" y2="270.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Період опитування lv_indev_drv_t.read_timer за замовчуванням: 30 мс (~33 Гц) для плавної анімації</text>
