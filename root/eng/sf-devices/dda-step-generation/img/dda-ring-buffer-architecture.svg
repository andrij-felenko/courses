<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="400" y="35" fill="#58a6ff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Архітектура кільцевого буфера між планувальником та ISR DDA</text>
  <rect x="60" y="120" width="180" height="90" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="150" y="160" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Планувальник руху</text>
  <text x="150" y="185" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">Запис сегментів (Head)</text>
  <rect x="300" y="100" width="200" height="130" rx="8" fill="#238636" stroke="#3fb950" stroke-width="2"/>
  <text x="400" y="140" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Кільцевий буфер</text>
  <text x="400" y="170" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">Lock-free SPSC queue</text>
  <text x="400" y="195" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Head: 4 | Tail: 1</text>
  <rect x="560" y="120" width="180" height="90" rx="8" fill="#8957e5" stroke="#a371f7" stroke-width="2"/>
  <text x="650" y="160" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">DDA Таймер ISR</text>
  <text x="650" y="185" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">Зчитування (Tail)</text>
  <line x1="240" y1="165" x2="300" y2="165" stroke="#58a6ff" stroke-width="2"/>
  <line x1="500" y1="165" x2="560" y2="165" stroke="#3fb950" stroke-width="2"/>
</svg>
