<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Квантування траєкторії таймером та дробовий акумулятор DDA</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Обробник ISR щотакту додає приріст ΔA: переповнення генерує крок, а залишок виключає втрату фази</text>

  <!-- TOP PANEL: FIRMWARE ARCHITECTURE -->
  <rect x="24" y="66" width="912" height="186" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="42" y="88" font-size="13" font-weight="700" fill="#1a1a1a">Архітектура DDA-генератора кроків в обробнику таймерного переривання (Timer ISR)</text>

  <!-- Top Card 1: Timer & ISR Trigger -->
  <rect x="42" y="102" width="190" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="52" y="112" width="96" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="100" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">1. Тактування</text>
  <text x="52" y="148" font-size="13" font-weight="700" fill="#1a1a1a">Апаратний таймер</text>
  <text x="52" y="168" font-size="12" fill="#6b7280">Частота F_ISR = 100 кГц</text>
  <text x="52" y="186" font-size="12" fill="#6b7280">Період T_ISR = 10 мкс</text>
  <text x="52" y="206" font-size="12" fill="#1a1a1a">Виклик переривання:</text>
  <text x="52" y="224" font-size="12" font-weight="700" fill="#2457d6">Ініціює крок DDA в ISR</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="232" y1="170" x2="246" y2="170" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Top Card 2: Phase Increment ΔA -->
  <rect x="248" y="102" width="206" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="258" y="112" width="105" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="310" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">2. Приріст фази</text>
  <text x="258" y="148" font-size="13" font-weight="700" fill="#1a1a1a">Регістр приросту ΔA</text>
  <text x="258" y="168" font-size="12" font-weight="700" fill="#2457d6">ΔA = round((f_step/F_ISR)·2³²)</text>
  <text x="258" y="186" font-size="12" fill="#6b7280">Задає швидкість осі v(t)</text>
  <text x="258" y="206" font-size="12" fill="#6b7280">Оновлюється планувальником</text>
  <text x="258" y="224" font-size="12" fill="#1a1a1a">Дробова частина кроку / такт</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="454" y1="170" x2="468" y2="170" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Top Card 3: 32-bit Accumulator Register -->
  <rect x="470" y="102" width="216" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="480" y="112" width="100" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="530" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">3. Акумулятор</text>
  <text x="480" y="148" font-size="13" font-weight="700" fill="#1a1a1a">Регістр acc (uint32_t)</text>
  <text x="480" y="168" font-size="12" font-weight="700" fill="#1a1a1a">acc += ΔA (щотакту ISR)</text>
  <text x="480" y="186" font-size="12" fill="#6b7280">Інтегрує швидкість у координату</text>
  <text x="480" y="206" font-size="12" font-weight="700" fill="#27ae60">Залишок: acc &amp; 0xFFFFFFFF</text>
  <text x="480" y="224" font-size="12" fill="#27ae60">не скидається в 0 при кроці!</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="686" y1="170" x2="700" y2="170" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Top Card 4: Overflow Detector & STEP Pulse -->
  <rect x="702" y="102" width="216" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="712" y="112" width="102" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="763" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">4. Подія кроку</text>
  <text x="712" y="148" font-size="13" font-weight="700" fill="#1a1a1a">Детектор переповнення</text>
  <text x="712" y="168" font-size="12" font-weight="700" fill="#1a1a1a">Умова: acc ≥ 2³² (1.0 крок)</text>
  <text x="712" y="186" font-size="12" font-weight="700" fill="#27ae60">✓ STEP_PIN = HIGH (імпульс)</text>
  <text x="712" y="206" font-size="12" fill="#1a1a1a">acc -= 2³² → дробовий залишок</text>
  <text x="712" y="224" font-size="12" fill="#6b7280">Якщо ні: STEP_PIN = LOW</text>


  <!-- BOTTOM PANEL: TIMING & QUANTIZATION DYNAMICS -->
  <rect x="24" y="264" width="912" height="258" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="42" y="286" font-size="13" font-weight="700" fill="#1a1a1a">Квантування у часі: такти ISR, накопичення дробового залишку та генерація імпульсів STEP</text>

  <!-- Left Subpanel: Waveforms Box -->
  <rect x="42" y="298" width="554" height="212" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Row 1: ISR Ticks Header & Labels -->
  <text x="52" y="318" font-size="12" font-weight="700" fill="#1a1a1a">Такти таймера ISR</text>
  <text x="52" y="332" font-size="12" fill="#6b7280">квант T_ISR = 10 мкс</text>

  <!-- Tick column markers (k=0..7) -->
  <text x="180" y="316" text-anchor="middle" font-size="12" fill="#6b7280">k=0</text>
  <text x="232" y="316" text-anchor="middle" font-size="12" fill="#6b7280">k=1</text>
  <text x="284" y="316" text-anchor="middle" font-size="12" fill="#6b7280">k=2</text>
  <text x="336" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">k=3</text>
  <text x="388" y="316" text-anchor="middle" font-size="12" fill="#6b7280">k=4</text>
  <text x="440" y="316" text-anchor="middle" font-size="12" fill="#6b7280">k=5</text>
  <text x="492" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">k=6</text>
  <text x="544" y="316" text-anchor="middle" font-size="12" fill="#6b7280">k=7</text>

  <!-- Tick circles on axis -->
  <circle cx="180" cy="326" r="3" fill="#27ae60"/>
  <circle cx="232" cy="326" r="3" fill="#27ae60"/>
  <circle cx="284" cy="326" r="3" fill="#27ae60"/>
  <circle cx="336" cy="326" r="3" fill="#27ae60"/>
  <circle cx="388" cy="326" r="3" fill="#27ae60"/>
  <circle cx="440" cy="326" r="3" fill="#27ae60"/>
  <circle cx="492" cy="326" r="3" fill="#27ae60"/>
  <circle cx="544" cy="326" r="3" fill="#27ae60"/>

  <!-- T_ISR dimension line between k=0 and k=1 -->
  <line x1="180" y1="336" x2="232" y2="336" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="206" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">T_ISR</text>

  <!-- Vertical guide lines from y=350 to y=464 (offset from labels) -->
  <line x1="180" y1="352" x2="180" y2="464" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="232" y1="352" x2="232" y2="464" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="284" y1="352" x2="284" y2="464" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="388" y1="352" x2="388" y2="464" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="440" y1="352" x2="440" y2="464" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="544" y1="352" x2="544" y2="464" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Row 2: DDA Accumulator Waveform -->
  <text x="52" y="374" font-size="12" font-weight="700" fill="#2457d6">Акумулятор DDA</text>
  <text x="52" y="388" font-size="12" fill="#6b7280">acc += 0.35 щотакту</text>
  <text x="52" y="406" font-size="12" font-weight="700" fill="#c0392b">Поріг 2³² (1.0)</text>

  <!-- Threshold line A_max at y=368 -->
  <line x1="175" y1="368" x2="560" y2="368" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="564" y="372" font-size="12" font-weight="700" fill="#c0392b">1.0</text>

  <!-- Accumulator Staircase Path -->
  <!-- y values: 0.00->420, 0.35->400, 0.70->380, 1.05->360, rem 0.05->417, 0.40->396, 0.75->375, 1.10->355, rem 0.10->414, 0.45->393 -->
  <path d="M 180,420 L 232,420 L 232,400 L 284,400 L 284,380 L 336,380 L 336,360 L 336,417 L 388,417 L 388,396 L 440,396 L 440,375 L 492,375 L 492,355 L 492,414 L 544,414 L 544,393 L 560,393" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Overflow points & Remainder tags -->
  <circle cx="336" cy="360" r="3.5" fill="#27ae60"/>
  <text x="336" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">1.05 ≥ 1.0 (залишок 0.05)</text>

  <circle cx="492" cy="355" r="3.5" fill="#27ae60"/>
  <text x="492" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">1.10 ≥ 1.0 (залишок 0.10)</text>

  <!-- Row 3: Output STEP Pin Waveform -->
  <text x="52" y="446" font-size="12" font-weight="700" fill="#27ae60">Вихідний пін STEP</text>
  <text x="52" y="460" font-size="12" fill="#6b7280">Строб при переповненні</text>

  <!-- STEP Baseline at y=464 -->
  <line x1="175" y1="464" x2="560" y2="464" stroke="#6b7280" stroke-width="1.5"/>

  <!-- STEP Pulses at k=3 (336) and k=6 (492) -->
  <rect x="336" y="440" width="18" height="24" fill="#e9f7ef" stroke="none"/>
  <rect x="492" y="440" width="18" height="24" fill="#e9f7ef" stroke="none"/>
  <path d="M 175,464 L 336,464 L 336,440 L 354,440 L 354,464 L 492,464 L 492,440 L 510,440 L 510,464 L 560,464" fill="none" stroke="#27ae60" stroke-width="2"/>

  <text x="345" y="434" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Крок 1</text>
  <text x="501" y="434" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Крок 2</text>

  <!-- Dimension line for step period -->
  <line x1="345" y1="484" x2="501" y2="484" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="423" y="498" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Інтервал = 3 · T_ISR (30 мкс)</text>


  <!-- Right Subpanel: State Trace Table -->
  <rect x="612" y="298" width="306" height="212" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <rect x="622" y="308" width="286" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="765" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Таблиця станів DDA (ΔA = 0.35 кроку)</text>

  <!-- Table Header -->
  <text x="642" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Такт</text>
  <text x="712" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">acc + ΔA</text>
  <text x="792" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">STEP</text>
  <text x="868" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">A_rem</text>
  <line x1="622" y1="352" x2="898" y2="352" stroke="#d0d7de" stroke-width="1"/>

  <!-- Row 0 -->
  <text x="642" y="368" text-anchor="middle" font-size="12" fill="#6b7280">k=0</text>
  <text x="712" y="368" text-anchor="middle" font-size="12" fill="#6b7280">0.00</text>
  <text x="792" y="368" text-anchor="middle" font-size="12" fill="#6b7280">0</text>
  <text x="868" y="368" text-anchor="middle" font-size="12" fill="#6b7280">0.00</text>

  <!-- Row 1 -->
  <text x="642" y="384" text-anchor="middle" font-size="12" fill="#6b7280">k=1</text>
  <text x="712" y="384" text-anchor="middle" font-size="12" fill="#1a1a1a">0.35</text>
  <text x="792" y="384" text-anchor="middle" font-size="12" fill="#6b7280">0</text>
  <text x="868" y="384" text-anchor="middle" font-size="12" fill="#6b7280">0.35</text>

  <!-- Row 2 -->
  <text x="642" y="400" text-anchor="middle" font-size="12" fill="#6b7280">k=2</text>
  <text x="712" y="400" text-anchor="middle" font-size="12" fill="#1a1a1a">0.70</text>
  <text x="792" y="400" text-anchor="middle" font-size="12" fill="#6b7280">0</text>
  <text x="868" y="400" text-anchor="middle" font-size="12" fill="#6b7280">0.70</text>

  <!-- Row 3 (Overflow 1) -->
  <rect x="626" y="405" width="278" height="16" rx="3" fill="#e9f7ef"/>
  <text x="642" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">k=3</text>
  <text x="712" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">1.05 (≥1)</text>
  <text x="792" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">1 (КРОК)</text>
  <text x="868" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">0.05</text>

  <!-- Row 4 -->
  <text x="642" y="434" text-anchor="middle" font-size="12" fill="#6b7280">k=4</text>
  <text x="712" y="434" text-anchor="middle" font-size="12" fill="#1a1a1a">0.40</text>
  <text x="792" y="434" text-anchor="middle" font-size="12" fill="#6b7280">0</text>
  <text x="868" y="434" text-anchor="middle" font-size="12" fill="#6b7280">0.40</text>

  <!-- Row 5 -->
  <text x="642" y="450" text-anchor="middle" font-size="12" fill="#6b7280">k=5</text>
  <text x="712" y="450" text-anchor="middle" font-size="12" fill="#1a1a1a">0.75</text>
  <text x="792" y="450" text-anchor="middle" font-size="12" fill="#6b7280">0</text>
  <text x="868" y="450" text-anchor="middle" font-size="12" fill="#6b7280">0.75</text>

  <!-- Row 6 (Overflow 2) -->
  <rect x="626" y="455" width="278" height="16" rx="3" fill="#e9f7ef"/>
  <text x="642" y="467" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">k=6</text>
  <text x="712" y="467" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">1.10 (≥1)</text>
  <text x="792" y="467" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">1 (КРОК)</text>
  <text x="868" y="467" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">0.10</text>

  <!-- Summary card at bottom of table -->
  <rect x="622" y="478" width="286" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="765" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Залишок переноситься: дрейф = 0 кроків!</text>
</svg>
