<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="400" y="35" fill="#58a6ff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Координація ведучої та ведених осей DDA</text>

  <!-- Master Axis -->
  <rect x="50" y="100" width="200" height="80" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="150" y="135" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ведуча вісь X</text>
  <text x="150" y="160" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">Кроки за ітерацією = Max Delta</text>

  <!-- DDA Interpolator -->
  <rect x="300" y="150" width="200" height="100" rx="8" fill="#238636" stroke="#3fb950" stroke-width="2"/>
  <text x="400" y="190" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">DDA Інтерполятор</text>
  <text x="400" y="220" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">Acc_Y += Delta_Y; Acc_Z += Delta_Z</text>

  <!-- Follower Axis Y -->
  <rect x="550" y="100" width="200" height="80" rx="8" fill="#8957e5" stroke="#a371f7" stroke-width="2"/>
  <text x="650" y="135" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ведена вісь Y</text>
  <text x="650" y="160" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">Крок при Acc_Y >= MODULO</text>

  <!-- Follower Axis Z -->
  <rect x="550" y="220" width="200" height="80" rx="8" fill="#8957e5" stroke="#a371f7" stroke-width="2"/>
  <text x="650" y="255" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ведена вісь Z</text>
  <text x="650" y="280" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">Крок при Acc_Z >= MODULO</text>

  <!-- Connections -->
  <line x1="250" y1="140" x2="300" y2="180" stroke="#58a6ff" stroke-width="2"/>
  <line x1="500" y1="180" x2="550" y2="140" stroke="#3fb950" stroke-width="2"/>
  <line x1="500" y1="220" x2="550" y2="260" stroke="#3fb950" stroke-width="2"/>
</svg>
