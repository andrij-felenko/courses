<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-start-green" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-start-red" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Механізм виникнення часового джитера при таймерному квантуванні DDA</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Дискретизація часу обробником ISR викликає фазову похибку Δt між ідеальним та реальним кроком</text>

  <!-- Main Panel -->
  <rect x="30" y="75" width="900" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Left Column Row Labels -->
  <!-- Row 1 Label -->
  <text x="45" y="112" font-size="13" font-weight="700" fill="#1a1a1a">Такти ISR</text>
  <text x="45" y="128" font-size="12" fill="#6b7280">f_ISR = 1 / T_ISR</text>

  <!-- Row 2 Label -->
  <text x="45" y="172" font-size="13" font-weight="700" fill="#2457d6">Ідеальний час</text>
  <text x="45" y="188" font-size="12" fill="#2457d6">t_ideal (DDA)</text>

  <!-- Row 3 Label -->
  <text x="45" y="242" font-size="13" font-weight="700" fill="#1a1a1a">Акумулятор DDA</text>
  <text x="45" y="258" font-size="12" fill="#6b7280">A_k = A_{k-1} + ΔA</text>

  <!-- Row 4 Label -->
  <text x="45" y="338" font-size="13" font-weight="700" fill="#c0392b">Вихід STEP</text>
  <text x="45" y="354" font-size="12" fill="#c0392b">Квантований ISR</text>

  <!-- Vertical Grid Lines (ISR Ticks at x = 240, 300, 360, 420, 480, 540, 600, 660, 720, 780, 840) -->
  <line x1="240" y1="110" x2="240" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="300" y1="110" x2="300" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="110" x2="360" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="420" y1="110" x2="420" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="110" x2="480" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="540" y1="110" x2="540" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="110" x2="600" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="660" y1="110" x2="660" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="720" y1="110" x2="720" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="780" y1="110" x2="780" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="840" y1="110" x2="840" y2="385" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Row 1: ISR Ticks & Labels -->
  <!-- Tick numbers -->
  <text x="240" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=0</text>
  <text x="300" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=1</text>
  <text x="360" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=2</text>
  <text x="420" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=3</text>
  <text x="480" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=4</text>
  <text x="540" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=5</text>
  <text x="600" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=6</text>
  <text x="660" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=7</text>
  <text x="720" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=8</text>
  <text x="780" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=9</text>
  <text x="840" y="98" text-anchor="middle" font-size="12" fill="#6b7280">k=10</text>

  <!-- ISR Pulse ticks (small vertical ticks) -->
  <circle cx="240" cy="115" r="3" fill="#27ae60"/>
  <circle cx="300" cy="115" r="3" fill="#27ae60"/>
  <circle cx="360" cy="115" r="3" fill="#27ae60"/>
  <circle cx="420" cy="115" r="3" fill="#27ae60"/>
  <circle cx="480" cy="115" r="3" fill="#27ae60"/>
  <circle cx="540" cy="115" r="3" fill="#27ae60"/>
  <circle cx="600" cy="115" r="3" fill="#27ae60"/>
  <circle cx="660" cy="115" r="3" fill="#27ae60"/>
  <circle cx="720" cy="115" r="3" fill="#27ae60"/>
  <circle cx="780" cy="115" r="3" fill="#27ae60"/>
  <circle cx="840" cy="115" r="3" fill="#27ae60"/>

  <!-- T_ISR period dimension line between k=1 (300) and k=2 (360) -->
  <line x1="300" y1="132" x2="360" y2="132" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-start-green)" marker-end="url(#arr-green)"/>
  <text x="330" y="146" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="700">T_ISR</text>

  <!-- Row 2: Ideal Step Timestamps (Blue vertical lines & markers) -->
  <!-- Ideal 1: x = 378 -->
  <line x1="378" y1="150" x2="378" y2="385" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="378" cy="175" r="4" fill="#2457d6"/>
  <text x="378" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">t_ideal,1</text>

  <!-- Ideal 2: x = 582 -->
  <line x1="582" y1="150" x2="582" y2="385" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="582" cy="175" r="4" fill="#2457d6"/>
  <text x="582" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">t_ideal,2</text>

  <!-- Ideal 3: x = 768 -->
  <line x1="768" y1="150" x2="768" y2="385" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="768" cy="175" r="4" fill="#2457d6"/>
  <text x="768" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">t_ideal,3</text>

  <!-- Ideal period T_ideal line between t_ideal,1 (378) and t_ideal,2 (582) -->
  <line x1="378" y1="192" x2="582" y2="192" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="480" y="188" text-anchor="middle" font-size="12" fill="#2457d6" font-weight="700">Ідеальний період T_ideal</text>

  <!-- Row 3: Accumulator A(t) Staircase Chart -->
  <!-- Threshold Line A_max at y = 228 -->
  <line x1="230" y1="228" x2="860" y2="228" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="230" y="222" font-size="12" fill="#c0392b" font-weight="700">Поріг A_max</text>

  <!-- Accumulator Staircase Path -->
  <path d="M240,285 L300,285 L300,268 L360,268 L360,251 L420,251 L420,223 L420,276 L480,276 L480,259 L540,259 L540,242 L600,242 L600,221 L600,274 L660,274 L660,257 L720,257 L720,240 L780,240 L780,220 L780,272 L840,272" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Overflow points markers -->
  <circle cx="420" cy="223" r="4" fill="#27ae60"/>
  <text x="420" y="211" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="700">A ≥ A_max</text>

  <circle cx="600" cy="221" r="4" fill="#27ae60"/>
  <text x="600" y="209" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="700">A ≥ A_max</text>

  <circle cx="780" cy="220" r="4" fill="#27ae60"/>
  <text x="780" y="208" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="700">A ≥ A_max</text>

  <!-- Row 4: Real STEP Pulses and Jitter Areas -->
  <!-- Jitter Shading 1 (x=378 to 420, width 42) -->
  <rect x="378" y="315" width="42" height="50" fill="#fdecea" fill-opacity="0.7" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="378" y1="308" x2="420" y2="308" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-start-red)" marker-end="url(#arr-red)"/>
  <text x="399" y="302" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">Δt_1</text>

  <!-- Jitter Shading 2 (x=582 to 600, width 18) -->
  <rect x="582" y="315" width="18" height="50" fill="#fdecea" fill-opacity="0.7" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="582" y1="308" x2="600" y2="308" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-start-red)" marker-end="url(#arr-red)"/>
  <text x="591" y="302" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">Δt_2</text>

  <!-- Jitter Shading 3 (x=768 to 780, width 12) -->
  <rect x="768" y="315" width="12" height="50" fill="#fdecea" fill-opacity="0.7" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="768" y1="308" x2="780" y2="308" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-start-red)" marker-end="url(#arr-red)"/>
  <text x="774" y="302" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">Δt_3</text>

  <!-- STEP Waveform baseline & Pulses -->
  <line x1="220" y1="365" x2="860" y2="365" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Pulse 1 at k=3 (x=420) -->
  <path d="M420,365 L420,332 L440,332 L440,365" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="420" y="332" width="20" height="33" fill="#fdecea" fill-opacity="0.5"/>
  <text x="430" y="380" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">Крок 1</text>

  <!-- Pulse 2 at k=6 (x=600) -->
  <path d="M600,365 L600,332 L620,332 L620,365" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="600" y="332" width="20" height="33" fill="#fdecea" fill-opacity="0.5"/>
  <text x="610" y="380" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">Крок 2</text>

  <!-- Pulse 3 at k=9 (x=780) -->
  <path d="M780,365 L780,332 L800,332 L800,365" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="780" y="332" width="20" height="33" fill="#fdecea" fill-opacity="0.5"/>
  <text x="790" y="380" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">Крок 3</text>

  <!-- Real inter-step period T_real dimension line between Pulse 1 (430) and Pulse 2 (610) -->
  <line x1="430" y1="398" x2="610" y2="398" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-start-red)" marker-end="url(#arr-red)"/>
  <text x="520" y="412" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">Реальний період T_real ≠ T_ideal</text>

  <!-- Bottom Explanatory Summary Cards -->
  <!-- Card 1: Quantization -->
  <rect x="30" y="440" width="285" height="75" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="462" font-size="13" font-weight="700" fill="#1a1a1a">1. Квантування часу</text>
  <text x="45" y="482" font-size="12" fill="#6b7280">Ідеальний крок t_ideal обчислюється</text>
  <text x="45" y="498" font-size="12" fill="#6b7280">аналітично за допомогою DDA.</text>

  <!-- Card 2: Phase Jitter -->
  <rect x="337" y="440" width="285" height="75" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-opacity="0.5"/>
  <text x="352" y="462" font-size="13" font-weight="700" fill="#c0392b">2. Часовий джитер (Jitter)</text>
  <text x="352" y="482" font-size="12" fill="#1a1a1a">Вихідний імпульс чекає ISR:</text>
  <text x="352" y="498" font-size="12" fill="#6b7280">похибка Δt_jitter ∈ [0, T_ISR).</text>

  <!-- Card 3: Fractional Accumulator -->
  <rect x="645" y="440" width="285" height="75" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" stroke-opacity="0.5"/>
  <text x="660" y="462" font-size="13" font-weight="700" fill="#27ae60">3. Дробовий акумулятор</text>
  <text x="660" y="482" font-size="12" fill="#1a1a1a">A_k = A_{k-1} + ΔA накопичує дроби,</text>
  <text x="660" y="498" font-size="12" fill="#6b7280">усуваючи накопичення похибок.</text>
</svg>
