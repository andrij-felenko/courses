<text x="615.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Зазор вибрано, ведучий зуб штовхає</tspan><tspan x="615.0" dy="13.0">протилежну грань, рух відновився.</tspan></text>
<text x="380.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Під час зміни напрямку стіл стоїть нерухомо, поки вал двигуна долає зазор Δx</text>
