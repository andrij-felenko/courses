<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механічний зазор у зачепленні зубчастих коліс при реверсі</text>
