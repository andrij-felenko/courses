<line x1="220.0" y1="315.0" x2="220.0" y2="325.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="300.0" y1="315.0" x2="300.0" y2="325.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="260.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Люфт зазору Δx</text>
<rect x="500.0" y="60.0" width="235.0" height="255.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="617.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівняння гістерезису</text>
<text x="515.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">1. Рух уперед (v &gt; 0):</text>
<text x="525.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">x_load = x_motor - Δx/2</text>
<text x="515.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">2. Рух назад (v &lt; 0):</text>
<text x="525.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">x_load = x_motor + Δx/2</text>
<text x="515.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">3. Реверс (перетин зазору):</text>
<text x="525.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">dx_load / dt = 0</text>
<text x="525.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">(виконавчий орган стоїть)</text>
<line x1="515.0" y1="265.0" x2="720.0" y2="265.0" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="617.5" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="617.5" dy="0.0">Помилка позиції є нелінійною</tspan><tspan x="617.5" dy="11.7">і залежить від передісторії руху</tspan></text>
<text x="380.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Петля гістерезису розділяє рух уперед і назад на величину повного мертвого ходу Δx</text>
</svg>