<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гістерезисна петля передачі положення з люфтом</text>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гістерезисна петля переміщення: координата навантаження від кута мотора</text>
<line x1="80.0" y1="190.0" x2="440.0" y2="190.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="260.0" y1="310.0" x2="260.0" y2="70.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="455.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">x_motor (вал)</text>
<text x="260.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x_load (виконавчий орган)</text>
<line x1="160.0" y1="290.0" x2="400.0" y2="90.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="320.0" y1="90.0" x2="80.0" y2="290.0" stroke="#2457d6" stroke-width="2.5"/>
<line x1="400.0" y1="90.0" x2="320.0" y2="90.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 3"/>
<line x1="80.0" y1="290.0" x2="160.0" y2="290.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 3"/>
<line x1="320.0" y1="160.0" x2="360.0" y2="125.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="400.0" y1="90.0" x2="350.0" y2="90.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="200.0" y1="220.0" x2="160.0" y2="255.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="80.0" y1="290.0" x2="130.0" y2="290.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
