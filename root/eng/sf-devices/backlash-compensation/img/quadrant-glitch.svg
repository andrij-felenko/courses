<text x="570.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">+Δy влито</text>
<text x="570.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="570.0" dy="0.0">Планувальник додає зміщення при реверсі:</tspan><tspan x="570.0" dy="11.7">ідеальний круглий контур без сходинок</tspan></text>
<text x="380.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Реверс швидкості на полюсах квадрантів вимагає точного впорскування імпульсів компенсації</text>
