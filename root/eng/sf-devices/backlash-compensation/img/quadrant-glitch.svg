<text x="190.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Реверс Y</text>
<text x="190.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="190.0" dy="0.0">«Пласкі зуби» через затримку осей:</tspan><tspan x="190.0" dy="11.7">коло деформується на 0°, 90°, 180°, 270°</tspan></text>
