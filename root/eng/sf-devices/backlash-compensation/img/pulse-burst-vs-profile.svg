<text x="560.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="560.0" dy="0.0">Кроки люфту видаються трапецеїдальним</tspan><tspan x="560.0" dy="11.7">або S-подібним профілем зі швидкістю v_comp:</tspan><tspan x="560.0" dy="11.7">мотор тримає момент, зачеплення плавне</tspan></text>
