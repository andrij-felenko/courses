<text x="200.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="200.0" dy="0.0">Миттєвий викид усіх кроків за один такт:</tspan><tspan x="200.0" dy="11.7">зрив синхронізації крокового мотора,</tspan><tspan x="200.0" dy="11.7">пропуск кроків, удар по зубах шестерень</tspan></text>
