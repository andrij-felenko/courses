<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова діаграма читання байта з 74HC165</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Асинхронне захоплення SH/LD виставляє D7, а імпульси CLK послідовно висувають біти D6–D0</text>

  <!-- Phase Header Panels -->
  <rect x="180" y="70" width="80" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="220" y="86" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Захоплення</text>

  <rect x="276" y="70" width="644" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="598" y="86" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Послідовний зсув 8 бітів (D7 → D0)</text>

  <!-- Signal Labels (Left) -->
  <text x="155" y="128" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="end">SH / LD</text>
  <text x="155" y="144" font-size="12" fill="#6b7280" text-anchor="end">(Захоплення / PL)</text>

  <text x="155" y="198" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="end">CLK</text>
  <text x="155" y="214" font-size="12" fill="#6b7280" text-anchor="end">(Тактування / CP)</text>

  <text x="155" y="272" font-size="13" font-weight="700" fill="#2457d6" text-anchor="end">DATA</text>
  <text x="155" y="288" font-size="12" fill="#6b7280" text-anchor="end">(Вихід Q7 / QH)</text>

  <!-- SH/LD Waveform -->
  <path d="M175,118 L200,118 L200,148 L250,148 L250,118 L920,118" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="225" y="165" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Захоплення D0–D7</text>

  <!-- Shift Annotation above CLK -->
  <text x="580" y="148" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Фронти CLK (0→1): зсув регістру на один біт праворуч</text>

  <!-- CLK Waveform -->
  <path d="M175,218 L330,218 L330,188 L355,188 L355,218 L410,218 L410,188 L435,188 L435,218 L490,218 L490,188 L515,188 L515,218 L570,218 L570,188 L595,188 L595,218 L650,218 L650,188 L675,188 L675,218 L730,218 L730,188 L755,188 L755,218 L810,218 L810,188 L835,188 L835,218 L890,218 L890,188 L915,188 L915,218 L920,218" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- CLK Pulse Numbers -->
  <text x="342" y="180" font-size="12" fill="#6b7280" text-anchor="middle">1</text>
  <text x="422" y="180" font-size="12" fill="#6b7280" text-anchor="middle">2</text>
  <text x="502" y="180" font-size="12" fill="#6b7280" text-anchor="middle">3</text>
  <text x="582" y="180" font-size="12" fill="#6b7280" text-anchor="middle">4</text>
  <text x="662" y="180" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
  <text x="742" y="180" font-size="12" fill="#6b7280" text-anchor="middle">6</text>
  <text x="822" y="180" font-size="12" fill="#6b7280" text-anchor="middle">7</text>
  <text x="902" y="180" font-size="12" fill="#6b7280" text-anchor="middle">8</text>

  <!-- DATA Inactive Line (before parallel load) -->
  <line x1="175" y1="277" x2="200" y2="277" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="200" y1="277" x2="250" y2="277" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- DATA 8 Bit Cells -->
  <polygon points="250,277 256,262 324,262 330,277 324,292 256,292" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="290" y="281" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D7 (MSB)</text>

  <polygon points="330,277 336,262 404,262 410,277 404,292 336,292" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="370" y="281" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D6</text>

  <polygon points="410,277 416,262 484,262 490,277 484,292 416,292" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="450" y="281" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D5</text>

  <polygon points="490,277 496,262 564,262 570,277 564,292 496,292" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="530" y="281" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D4</text>

  <polygon points="570,277 576,262 644,262 650,277 644,292 576,292" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="610" y="281" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D3</text>

  <polygon points="650,277 656,262 724,262 730,277 724,292 656,292" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="690" y="281" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D2</text>

  <polygon points="730,277 736,262 804,262 810,277 804,292 736,292" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="281" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D1</text>

  <polygon points="810,277 816,262 884,262 890,277 884,292 816,292" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="850" y="281" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D0 (LSB)</text>

  <!-- DATA Inactive Line (after byte) -->
  <line x1="890" y1="277" x2="920" y2="277" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Shift Moment Lines (Connecting CLK rising edges to DATA transitions) -->
  <line x1="330" y1="218" x2="330" y2="255" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>
  <line x1="410" y1="218" x2="410" y2="255" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>
  <line x1="490" y1="218" x2="490" y2="255" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>
  <line x1="570" y1="218" x2="570" y2="255" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>
  <line x1="650" y1="218" x2="650" y2="255" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>
  <line x1="730" y1="218" x2="730" y2="255" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>
  <line x1="810" y1="218" x2="810" y2="255" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>

  <!-- Annotations below DATA -->
  <text x="290" y="318" font-size="12" fill="#27ae60" text-anchor="middle">↑ D7 готовий без такту CLK</text>
  <text x="610" y="318" font-size="12" fill="#6b7280" text-anchor="middle">Зчитування (Sample) виконується перед наступним тактом зсуву</text>

  <!-- Bottom Summary Card -->
  <rect x="30" y="365" width="900" height="75" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="388" font-size="12" font-weight="700" fill="#c0392b">1. Захоплення (SH/LD = 0):</text>
  <text x="50" y="407" font-size="12" fill="#1a1a1a">Асинхронний запис входів D0–D7 у тригери;</text>
  <text x="50" y="425" font-size="12" fill="#1a1a1a">розряд D7 одразу з'являється на DATA</text>

  <text x="350" y="388" font-size="12" font-weight="700" fill="#27ae60">2. Перша вибірка (D7):</text>
  <text x="350" y="407" font-size="12" fill="#1a1a1a">MCU зчитує D7 до першого такту CLK;</text>
  <text x="350" y="425" font-size="12" fill="#1a1a1a">для читання байта потрібно 7 тактів зсуву</text>

  <text x="660" y="388" font-size="12" font-weight="700" fill="#2457d6">3. Такти зсуву (CLK 0→1):</text>
  <text x="660" y="407" font-size="12" fill="#1a1a1a">Кожен позитивний фронт зсуває регістр,</text>
  <text x="660" y="425" font-size="12" fill="#1a1a1a">послідовно виводячи розряди D6 ... D0</text>
</svg>
