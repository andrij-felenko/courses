<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Читання станів 74HC165 на логічному аналізаторі</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Асинхронний імпульс /PL фіксує D0–D7, а такти CP висувають біти для декодування байта 0xA5</text>

  <!-- Main Logic Analyzer Frame -->
  <rect x="24" y="68" width="912" height="344" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Toolbar Header -->
  <circle cx="42" cy="85" r="4.5" fill="#27ae60"/>
  <text x="54" y="89" font-size="12" font-weight="700" fill="#1a1a1a">LOGIC ANALYZER</text>
  <text x="175" y="89" font-size="12" fill="#6b7280">24 MS/s • Тригер: Спадний фронт CH0 (/PL ↓) • SPI Mode 0 (MSB-first)</text>
  <text x="918" y="89" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">Шкала: 500 нс / поділ</text>

  <!-- Divider Line below Toolbar -->
  <line x1="24" y1="102" x2="936" y2="102" stroke="#d0d7de" stroke-width="1"/>

  <!-- Vertical Channel Separator -->
  <line x1="180" y1="102" x2="180" y2="382" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Phase Region Badges (Top of Waveforms) -->
  <rect x="210" y="107" width="94" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="257" y="121" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">1. Запис (/PL)</text>

  <rect x="314" y="107" width="98" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="363" y="121" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">2. Вибірка D7</text>

  <rect x="422" y="107" width="398" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="621" y="121" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">3. Послідовний зсув 7 тактами CP (біти D6 → D0)</text>

  <rect x="830" y="107" width="92" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="876" y="121" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">4. Байт 0xA5</text>

  <!-- Horizontal Channel Dividers -->
  <line x1="24" y1="192" x2="936" y2="192" stroke="#e1e4e8" stroke-width="1"/>
  <line x1="24" y1="254" x2="936" y2="254" stroke="#e1e4e8" stroke-width="1"/>
  <line x1="24" y1="318" x2="936" y2="318" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Channel 0 Labels -->
  <text x="36" y="152" font-size="13" font-weight="700" fill="#c0392b">CH0: /PL</text>
  <text x="36" y="170" font-size="12" fill="#6b7280">Засувка входів</text>
  <text x="172" y="146" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="172" y="176" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Channel 1 Labels -->
  <text x="36" y="214" font-size="13" font-weight="700" fill="#1a1a1a">CH1: CP</text>
  <text x="36" y="232" font-size="12" fill="#6b7280">Тактування (CLK)</text>
  <text x="172" y="208" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="172" y="238" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Channel 2 Labels -->
  <text x="36" y="276" font-size="13" font-weight="700" fill="#2457d6">CH2: Q7</text>
  <text x="36" y="294" font-size="12" fill="#6b7280">Вихід даних (DATA)</text>
  <text x="172" y="270" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="172" y="300" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Channel 3 Labels -->
  <text x="36" y="342" font-size="13" font-weight="700" fill="#27ae60">ДЕКОДЕР</text>
  <text x="36" y="360" font-size="12" fill="#6b7280">Аналізатор шини</text>

  <!-- Waveform CH0: /PL -->
  <path d="M180,142 L220,142 L220,172 L270,172 L270,142 L920,142" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="245" y="161" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t_w</text>
  <text x="325" y="161" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">t_su</text>
  <line x1="274" y1="172" x2="376" y2="172" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Waveform CH1: CP (7 Clock Pulses) -->
  <path d="M180,234 L380,234 L380,204 L415,204 L415,234 L450,234 L450,204 L485,204 L485,234 L520,234 L520,204 L555,204 L555,234 L590,234 L590,204 L625,204 L625,234 L660,234 L660,204 L695,204 L695,234 L730,234 L730,204 L765,204 L765,234 L800,234 L800,204 L835,234 L835,234 L920,234" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Clock Pulse Numbers -->
  <text x="397" y="198" font-size="12" fill="#6b7280" text-anchor="middle">1</text>
  <text x="467" y="198" font-size="12" fill="#6b7280" text-anchor="middle">2</text>
  <text x="537" y="198" font-size="12" fill="#6b7280" text-anchor="middle">3</text>
  <text x="607" y="198" font-size="12" fill="#6b7280" text-anchor="middle">4</text>
  <text x="677" y="198" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
  <text x="747" y="198" font-size="12" fill="#6b7280" text-anchor="middle">6</text>
  <text x="817" y="198" font-size="12" fill="#6b7280" text-anchor="middle">7</text>

  <!-- Waveform CH2: Q7 (Data = 0xA5 = 10100101b) -->
  <line x1="180" y1="296" x2="235" y2="296" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M235,296 L235,266 L380,266 L380,296 L450,296 L450,266 L520,266 L520,296 L660,296 L660,266 L730,266 L730,296 L800,296 L800,266 L870,266 L870,296 L920,296" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Shift Moment Lines (Connecting CLK rising edges to Q7 transitions) -->
  <line x1="380" y1="234" x2="380" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="450" y1="234" x2="450" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="520" y1="234" x2="520" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="590" y1="234" x2="590" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="660" y1="234" x2="660" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="730" y1="234" x2="730" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="800" y1="234" x2="800" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Decoded Bit Cells in Channel 3 -->
  <rect x="235" y="330" width="139" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="304" y="345" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D7: 1 (MSB)</text>

  <rect x="380" y="330" width="64" height="22" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="412" y="345" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">D6: 0</text>

  <rect x="450" y="330" width="64" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="482" y="345" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D5: 1</text>

  <rect x="520" y="330" width="64" height="22" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="552" y="345" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">D4: 0</text>

  <rect x="590" y="330" width="64" height="22" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="622" y="345" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">D3: 0</text>

  <rect x="660" y="330" width="64" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="692" y="345" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D2: 1</text>

  <rect x="730" y="330" width="64" height="22" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="762" y="345" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">D1: 0</text>

  <rect x="800" y="330" width="64" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="832" y="345" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D0: 1</text>

  <!-- Decoded Result Badge -->
  <rect x="870" y="328" width="56" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="898" y="345" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">0xA5</text>

  <!-- Explanatory note in Decoder row -->
  <text x="550" y="369" font-size="12" fill="#6b7280" text-anchor="middle">Повний прийнятий бітовий потік: 1 0 1 0 0 1 0 1 (двійкове) = 0xA5 (шістнадцяткове) = 165</text>

  <!-- Trigger Indicator -->
  <path d="M216,134 L224,134 L220,140 Z" fill="#c0392b"/>
  <line x1="220" y1="140" x2="220" y2="172" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="220" y="130" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Trig</text>

  <!-- Time Axis & Ticks -->
  <line x1="180" y1="384" x2="920" y2="384" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="926" y="388" font-size="12" font-weight="700" fill="#1a1a1a">t</text>

  <line x1="220" y1="381" x2="220" y2="387" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="220" y="401" font-size="12" fill="#6b7280" text-anchor="middle">0 нс</text>

  <line x1="270" y1="381" x2="270" y2="387" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="270" y="401" font-size="12" fill="#6b7280" text-anchor="middle">+500 нс</text>

  <line x1="380" y1="381" x2="380" y2="387" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="380" y="401" font-size="12" fill="#6b7280" text-anchor="middle">+1.5 мкс</text>

  <line x1="520" y1="381" x2="520" y2="387" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="520" y="401" font-size="12" fill="#6b7280" text-anchor="middle">+3.0 мкс</text>

  <line x1="660" y1="381" x2="660" y2="387" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="660" y="401" font-size="12" fill="#6b7280" text-anchor="middle">+4.5 мкс</text>

  <line x1="800" y1="381" x2="800" y2="387" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="800" y="401" font-size="12" fill="#6b7280" text-anchor="middle">+6.0 мкс</text>

  <line x1="870" y1="381" x2="870" y2="387" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="870" y="401" font-size="12" fill="#6b7280" text-anchor="middle">+6.7 мкс</text>

  <!-- Bottom Summary Cards -->
  <rect x="24" y="424" width="292" height="84" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="36" y="442" font-size="12" font-weight="700" fill="#c0392b">1. Асинхронний запис (/PL):</text>
  <text x="36" y="460" font-size="12" fill="#1a1a1a">• Спад /PL = 0 фіксує входи D0–D7</text>
  <text x="36" y="478" font-size="12" fill="#6b7280">• Біт D7 одразу виходить на Q7</text>
  <text x="36" y="496" font-size="12" fill="#6b7280">• Контроль t_w відсікає глічі</text>

  <rect x="334" y="424" width="292" height="84" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="346" y="442" font-size="12" font-weight="700" fill="#2457d6">2. Вибірка та тактування (CP):</text>
  <text x="346" y="460" font-size="12" fill="#1a1a1a">• Біт D7 зчитується ДО такту CP</text>
  <text x="346" y="478" font-size="12" fill="#6b7280">• Фронти CP (0→1) зсувають D6..D0</text>
  <text x="346" y="496" font-size="12" fill="#6b7280">• Для читання байта треба 7 тактів</text>

  <rect x="644" y="424" width="292" height="84" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="656" y="442" font-size="12" font-weight="700" fill="#27ae60">3. Діагностика протоколу:</text>
  <text x="656" y="460" font-size="12" fill="#1a1a1a">• Витримка t_su усуває збої шини</text>
  <text x="656" y="478" font-size="12" fill="#6b7280">• Аналізатор дешифрує байт 0xA5</text>
  <text x="656" y="496" font-size="12" fill="#6b7280">• Чіткі фронти без наводок і бруду</text>
</svg>
