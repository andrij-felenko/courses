<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/></marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Алгоритм цифрового придушення дребізгу кнопок (Debouncing)</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Зсувний масив історії стану (History Shift Register) для кожного входу PISO</text>

  <!-- Blocks -->
  <rect x="50" y="100" width="220" height="110" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="160" y="125" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. Сирий кадр PISO</text>
  <text x="160" y="150" font-size="12" fill="#6b7280" text-anchor="middle">uint8_t raw_byte = 0b10110101</text>
  <rect x="70" y="165" width="180" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="160" y="185" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Періодичний опит 100Гц</text>

  <rect x="370" y="100" width="220" height="110" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="125" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. Оновлення історії</text>
  <text x="480" y="150" font-size="12" fill="#6b7280" text-anchor="middle">history[i] = (history[i] &lt;&lt; 1) | bit</text>
  <rect x="390" y="165" width="180" height="30" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="480" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">Вікно 8 відліків (80 мс)</text>

  <rect x="690" y="100" width="220" height="110" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="800" y="125" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. Перевірка маски</text>
  <text x="800" y="150" font-size="12" fill="#6b7280" text-anchor="middle">Порівняння зі стабільними 0x00 / 0xFF</text>
  <rect x="710" y="165" width="180" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="800" y="185" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Фільтрований вихід</text>

  <!-- Bottom Details -->
  <rect x="50" y="270" width="860" height="140" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="295" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Приклад стану реєстру історії буфера для одного входу:</text>

  <!-- History states visualization -->
  <rect x="90" y="320" width="220" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="200" y="345" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Дребізг при натисканні</text>
  <text x="200" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">history = 0b01011101 (негарант.)</text>

  <rect x="370" y="320" width="220" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="480" y="345" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Стабільна одиниця (High)</text>
  <text x="480" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">history == 0xFF -&gt; State = 1</text>

  <rect x="650" y="320" width="220" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="760" y="345" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Стабільний нуль (Low)</text>
  <text x="760" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">history == 0x00 -&gt; State = 0</text>

  <!-- Connectors -->
  <line x1="270" y1="155" x2="370" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="590" y1="155" x2="690" y2="155" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="480" y1="210" x2="480" y2="270" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>