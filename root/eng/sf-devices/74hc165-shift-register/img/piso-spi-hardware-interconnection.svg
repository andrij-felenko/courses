<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Апаратне підключення 74HC165 до периферичного модуля SPI</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">З'єднання виводів Q7 -&gt; MISO, CP -&gt; SCK та PL -&gt; GPIO_CS</text>

  <!-- MCU Box -->
  <rect x="80" y="110" width="280" height="280" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="220" y="140" font-size="16" font-weight="700" fill="#2457d6" text-anchor="middle">Мікроконтролер (STM32 / ESP32)</text>

  <rect x="110" y="170" width="220" height="45" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="220" y="197" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">SPI_MISO (Вхід даних)</text>

  <rect x="110" y="240" width="220" height="45" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="220" y="267" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">SPI_SCK (Тактовий вихід)</text>

  <rect x="110" y="310" width="220" height="45" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="220" y="337" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">GPIO_OUTPUT (PL Load Pin)</text>

  <!-- 74HC165 Box -->
  <rect x="600" y="110" width="280" height="280" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="740" y="140" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зсувний регістр 74HC165</text>

  <rect x="630" y="170" width="220" height="45" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="740" y="197" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pin 9: Q7 (Serial Output)</text>

  <rect x="630" y="240" width="220" height="45" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="740" y="267" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pin 2: CP (Clock Input)</text>

  <rect x="630" y="310" width="220" height="45" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="740" y="337" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pin 1: /PL (Parallel Load)</text>

  <!-- Connections -->
  <line x1="630" y1="192" x2="330" y2="192" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="330" y1="262" x2="630" y2="262" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="330" y1="332" x2="630" y2="332" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
</svg>