<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-rev-red" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-rev-gray" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Осцилограма зсуву даних на MISO відносно SCK та імпульсу PL</text>
  <text x="480" y="53" text-anchor="middle" font-size="13" fill="#6b7280">D7 з'являється за імпульсом PL; MCU зчитує по фронту SCK, а регістр зсуває по спаду</text>

  <!-- Main Frame -->
  <rect x="24" y="68" width="912" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Phase Badges -->
  <rect x="200" y="78" width="105" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="252" y="93" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Фіксація PL</text>

  <rect x="317" y="78" width="505" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="569" y="93" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Серійне опитування SPI: 8 тактів SCK (Mode 0, MSB-first)</text>

  <rect x="834" y="78" width="88" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="878" y="93" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Байт OK</text>

  <!-- Vertical Channel Separator -->
  <line x1="185" y1="68" x2="185" y2="340" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Channel 1: PL -->
  <text x="40" y="122" font-size="13" font-weight="bold" fill="#c0392b">PL (SH/LD)</text>
  <text x="40" y="139" font-size="12" fill="#6b7280">GPIO вихід MCU</text>

  <!-- Channel 2: SCK -->
  <text x="40" y="196" font-size="13" font-weight="bold" fill="#1a1a1a">SCK (CP)</text>
  <text x="40" y="213" font-size="12" fill="#6b7280">Такти SPI (Mode 0)</text>

  <!-- Channel 3: MISO -->
  <text x="40" y="254" font-size="13" font-weight="bold" fill="#2457d6">MISO (Q7)</text>
  <text x="40" y="271" font-size="12" fill="#6b7280">Послідовні дані</text>

  <!-- Channel 4: Sampling Strobe -->
  <text x="40" y="308" font-size="13" font-weight="bold" fill="#27ae60">Вибірка MCU</text>
  <text x="40" y="324" font-size="12" fill="#6b7280">Фронт зчитування</text>

  <!-- PL Waveform -->
  <path d="M 195 120 L 225 120 L 225 144 L 285 144 L 285 120 L 915 120" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- PL Measurements -->
  <line x1="225" y1="156" x2="285" y2="156" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-rev-red)" marker-end="url(#arr-red)"/>
  <text x="255" y="169" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_PL</text>

  <line x1="285" y1="156" x2="335" y2="156" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-rev-gray)" marker-end="url(#arr-gray)"/>
  <text x="310" y="169" font-size="12" fill="#6b7280" text-anchor="middle">t_su</text>

  <!-- SCK Waveform -->
  <path d="M 195 214 L 335 214 L 335 190 L 365 190 L 365 214 L 400 214 L 400 190 L 430 190 L 430 214 L 465 214 L 465 190 L 495 190 L 495 214 L 530 214 L 530 190 L 560 190 L 560 214 L 595 214 L 595 190 L 625 190 L 625 214 L 660 214 L 660 190 L 690 190 L 690 214 L 725 214 L 725 190 L 755 190 L 755 214 L 790 214 L 790 190 L 820 190 L 820 214 L 915 214" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>

  <!-- SCK Pulse Numbers -->
  <text x="350" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="415" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="480" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>
  <text x="545" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4</text>
  <text x="610" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5</text>
  <text x="675" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6</text>
  <text x="740" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">7</text>
  <text x="805" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">8</text>

  <!-- MISO Idle -->
  <line x1="195" y1="256" x2="255" y2="256" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- MISO Shaded Cells -->
  <polygon points="255,256 265,244 365,244 375,256 365,268 265,268" fill="#eaf0fd"/>
  <polygon points="365,256 375,244 430,244 440,256 430,268 375,268" fill="#eaf0fd"/>
  <polygon points="430,256 440,244 495,244 505,256 495,268 440,268" fill="#eaf0fd"/>
  <polygon points="495,256 505,244 560,244 570,256 560,268 505,268" fill="#eaf0fd"/>
  <polygon points="560,256 570,244 625,244 635,256 625,268 570,268" fill="#eaf0fd"/>
  <polygon points="625,256 635,244 690,244 700,256 690,268 635,268" fill="#eaf0fd"/>
  <polygon points="690,256 700,244 755,244 765,256 755,268 700,268" fill="#eaf0fd"/>
  <polygon points="755,256 765,244 820,244 830,256 820,268 765,268" fill="#eaf0fd"/>

  <!-- MISO Boundary Lines -->
  <path d="M 255 256 L 265 244 L 365 244 L 375 268 L 430 268 L 440 244 L 495 244 L 505 268 L 560 268 L 570 244 L 625 244 L 635 268 L 690 268 L 700 244 L 755 244 L 765 268 L 820 268 L 830 256 L 915 256" fill="none" stroke="#2457d6" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 255 256 L 265 268 L 365 268 L 375 244 L 430 244 L 440 268 L 495 268 L 505 244 L 560 244 L 570 268 L 625 268 L 635 244 L 690 244 L 700 268 L 755 268 L 765 244 L 820 244 L 830 256" fill="none" stroke="#2457d6" stroke-width="2" stroke-linejoin="round"/>

  <!-- MISO Bit Labels -->
  <text x="315" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D7</text>
  <text x="402" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D6</text>
  <text x="467" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D5</text>
  <text x="532" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D4</text>
  <text x="597" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D3</text>
  <text x="662" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D2</text>
  <text x="727" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D1</text>
  <text x="792" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D0</text>

  <!-- Sampling Strobes -->
  <line x1="335" y1="305" x2="335" y2="278" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="400" y1="305" x2="400" y2="278" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="465" y1="305" x2="465" y2="278" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="530" y1="305" x2="530" y2="278" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="595" y1="305" x2="595" y2="278" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="660" y1="305" x2="660" y2="278" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="725" y1="305" x2="725" y2="278" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="790" y1="305" x2="790" y2="278" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <text x="335" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">b7</text>
  <text x="400" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">b6</text>
  <text x="465" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">b5</text>
  <text x="530" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">b4</text>
  <text x="595" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">b3</text>
  <text x="660" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">b2</text>
  <text x="725" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">b1</text>
  <text x="790" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">b0</text>

  <!-- Bottom Explanatory Cards -->
  <rect x="38" y="348" width="230" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="368" font-size="12" font-weight="bold" fill="#c0392b">1. Завантаження (PL = 0):</text>
  <text x="50" y="387" font-size="12" fill="#1a1a1a">• Асинхронна засувка D0..D7</text>
  <text x="50" y="406" font-size="12" fill="#1a1a1a">• Тривалість t_PL ≥ 20 нс</text>

  <rect x="282" y="348" width="330" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="294" y="368" font-size="12" font-weight="bold" fill="#2457d6">2. Вихід MSB та зсув SPI:</text>
  <text x="294" y="387" font-size="12" fill="#1a1a1a">• Біт D7 на MISO одразу, без SCK</text>
  <text x="294" y="406" font-size="12" fill="#1a1a1a">• Біти D6..D0 зсуваються по спаду</text>

  <rect x="626" y="348" width="294" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="638" y="368" font-size="12" font-weight="bold" fill="#27ae60">3. Зчитування в буфер:</text>
  <text x="638" y="387" font-size="12" fill="#1a1a1a">• Вибірка по передньому фронту</text>
  <text x="638" y="406" font-size="12" fill="#1a1a1a">• Прийом 1 байта за 8 тактів</text>
</svg>
