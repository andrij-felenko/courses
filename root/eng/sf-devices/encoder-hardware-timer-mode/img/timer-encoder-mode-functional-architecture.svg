<svg viewBox="0 0 960 480" width="960" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня апаратна логіка квадратурного декодера</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Фазовий комбінатор автоматично керує лічильником і генерує переривання при переповненні</text>

  <!-- Input Signals -->
  <line x1="30" y1="200" x2="130" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="80" y="186" font-size="13" fill="#1a1a1a" text-anchor="middle">TI1_F (Кан. A)</text>

  <line x1="30" y1="260" x2="130" y2="260" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="80" y="246" font-size="13" fill="#1a1a1a" text-anchor="middle">TI2_F (Кан. B)</text>

  <!-- Box 1: Phase Decoder -->
  <rect x="140" y="140" width="220" height="180" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="250" y="170" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фазовий декодатор</text>
  <text x="250" y="190" font-size="13" fill="#6b7280" text-anchor="middle">(Квадратурний комбінатор)</text>

  <!-- Connections from Phase Decoder to Counter -->
  <line x1="360" y1="200" x2="440" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="186" font-size="12" fill="#1a1a1a" text-anchor="middle">Тактування</text>

  <line x1="360" y1="260" x2="440" y2="260" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="246" font-size="12" fill="#1a1a1a" text-anchor="middle">Напрямок</text>

  <!-- Box 2: Counter -->
  <rect x="450" y="140" width="200" height="180" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="550" y="170" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лічильник CNT</text>
  <text x="550" y="190" font-size="13" fill="#6b7280" text-anchor="middle">(Up / Down Counter)</text>
  <text x="550" y="270" font-size="24" font-weight="bold" fill="#2457d6" text-anchor="middle">0 ... ARR</text>

  <!-- Box 3: ARR -->
  <rect x="450" y="370" width="200" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="550" y="395" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регістр ARR</text>
  <text x="550" y="415" font-size="13" fill="#6b7280" text-anchor="middle">(Auto-Reload Register)</text>

  <!-- Connection from ARR to Counter -->
  <line x1="550" y1="370" x2="550" y2="330" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="560" y="355" font-size="12" fill="#1a1a1a" text-anchor="start">Межа рахунку</text>

  <!-- Connections from Counter to Interrupt Box -->
  <line x1="650" y1="200" x2="740" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="695" y="175" font-size="12" fill="#1a1a1a" text-anchor="middle">CNT == ARR</text>
  <text x="695" y="190" font-size="12" fill="#6b7280" text-anchor="middle">(Вперед)</text>

  <line x1="650" y1="260" x2="740" y2="260" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="695" y="235" font-size="12" fill="#1a1a1a" text-anchor="middle">CNT == 0</text>
  <text x="695" y="250" font-size="12" fill="#6b7280" text-anchor="middle">(Назад)</text>

  <!-- Box 4: Interrupt -->
  <rect x="750" y="160" width="180" height="140" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="840" y="190" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Переривання</text>
  <text x="840" y="210" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">UIF</text>
  <text x="840" y="255" font-size="13" fill="#6b7280" text-anchor="middle">Переповнення /</text>
  <text x="840" y="270" font-size="13" fill="#6b7280" text-anchor="middle">Спустошення</text>
</svg>
