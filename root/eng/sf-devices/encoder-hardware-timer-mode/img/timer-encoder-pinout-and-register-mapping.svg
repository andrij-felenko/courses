<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комутація сигналів енкодера до таймера та їх конфігурація</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Шлях від виводів мікроконтролера через матрицю GPIO до цифрових фільтрів і декодера</text>

  <!-- Left: Encoder Inputs -->
  <text x="95" y="210" font-size="14" fill="#1a1a1a" text-anchor="end">Фаза A</text>
  <text x="95" y="290" font-size="14" fill="#1a1a1a" text-anchor="end">Фаза B</text>
  <text x="95" y="370" font-size="14" fill="#1a1a1a" text-anchor="end">Мітка Z</text>

  <path d="M 100 205 L 116 205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 100 285 L 116 285" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 100 365 L 116 365" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel: Physical Pins -->
  <rect x="120" y="140" width="100" height="280" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="170" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фізичні</text>
  <text x="170" y="180" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">виводи</text>

  <rect x="130" y="190" width="80" height="30" fill="white" stroke="#d0d7de" rx="2"/>
  <text x="170" y="210" font-size="13" fill="#1a1a1a" text-anchor="middle">Вивід</text>
  
  <rect x="130" y="270" width="80" height="30" fill="white" stroke="#d0d7de" rx="2"/>
  <text x="170" y="290" font-size="13" fill="#1a1a1a" text-anchor="middle">Вивід</text>

  <rect x="130" y="350" width="80" height="30" fill="white" stroke="#d0d7de" rx="2"/>
  <text x="170" y="370" font-size="13" fill="#1a1a1a" text-anchor="middle">Вивід</text>

  <path d="M 220 205 L 266 205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 220 285 L 266 285" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 220 365 L 266 365" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel: GPIO Matrix -->
  <rect x="270" y="140" width="130" height="280" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="335" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Матриця GPIO</text>
  <text x="335" y="180" font-size="13" fill="#6b7280" text-anchor="middle">(I/O MUX)</text>

  <path d="M 270 205 L 400 205" stroke="#2457d6" stroke-width="2" stroke-dasharray="4"/>
  <path d="M 270 285 L 400 285" stroke="#2457d6" stroke-width="2" stroke-dasharray="4"/>
  <path d="M 270 365 L 400 365" stroke="#2457d6" stroke-width="2" stroke-dasharray="4"/>

  <text x="335" y="390" font-size="12" fill="#6b7280" text-anchor="middle">Конфігурація:</text>
  <text x="335" y="405" font-size="13" fill="#2457d6" text-anchor="middle">GPIOx_AFR</text>

  <path d="M 400 205 L 566 205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 400 285 L 566 285" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 400 365 L 566 365" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel: Timer -->
  <rect x="440" y="90" width="490" height="340" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="685" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний таймер (TIMx)</text>

  <text x="490" y="198" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">TI1</text>
  <text x="490" y="278" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">TI2</text>
  <text x="490" y="358" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">TI3</text>

  <!-- Clock Generator inside Timer -->
  <text x="475" y="145" font-size="12" fill="#1a1a1a" text-anchor="end">f_CK_INT</text>
  <path d="M 480 140 L 496 140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <text x="550" y="115" font-size="12" fill="#2457d6" text-anchor="middle">TIMx_CR1 (CKD)</text>
  <rect x="500" y="125" width="100" height="30" fill="white" stroke="#1a1a1a" rx="2"/>
  <text x="550" y="145" font-size="12" fill="#1a1a1a" text-anchor="middle">Дільник f_DTS</text>

  <path d="M 550 155 L 550 355" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4"/>
  <path d="M 550 195 L 566 195" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 550 275 L 566 275" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 550 355 L 566 355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Filters -->
  <rect x="570" y="185" width="110" height="40" fill="white" stroke="#1a1a1a" rx="2"/>
  <text x="625" y="210" font-size="13" fill="#1a1a1a" text-anchor="middle">Цифр. фільтр</text>
  <text x="625" y="240" font-size="12" fill="#2457d6" text-anchor="middle">TIMx_CCMR1 (IC1F)</text>

  <rect x="570" y="265" width="110" height="40" fill="white" stroke="#1a1a1a" rx="2"/>
  <text x="625" y="290" font-size="13" fill="#1a1a1a" text-anchor="middle">Цифр. фільтр</text>
  <text x="625" y="320" font-size="12" fill="#2457d6" text-anchor="middle">TIMx_CCMR1 (IC2F)</text>

  <rect x="570" y="345" width="110" height="40" fill="white" stroke="#1a1a1a" rx="2"/>
  <text x="625" y="370" font-size="13" fill="#1a1a1a" text-anchor="middle">Цифр. фільтр</text>
  <text x="625" y="405" font-size="12" fill="#2457d6" text-anchor="middle">TIMx_CCMR2 (IC3F)</text>

  <path d="M 680 205 L 726 205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 680 285 L 726 285" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 680 365 L 726 365" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Decoder -->
  <rect x="730" y="185" width="110" height="200" fill="white" stroke="#1a1a1a" rx="2"/>
  <text x="785" y="275" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Квадратурний</text>
  <text x="785" y="290" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">декодер</text>
  <text x="785" y="305" font-size="12" fill="#6b7280" text-anchor="middle">(та скидання)</text>
  <text x="785" y="405" font-size="12" fill="#2457d6" text-anchor="middle">TIMx_SMCR (SMS)</text>

  <path d="M 840 285 L 866 285" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Counter -->
  <rect x="870" y="185" width="40" height="200" fill="white" stroke="#1a1a1a" rx="2"/>
  <text x="890" y="275" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C</text>
  <text x="890" y="290" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">N</text>
  <text x="890" y="305" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">T</text>
  <text x="890" y="405" font-size="12" fill="#2457d6" text-anchor="middle">TIMx_CNT</text>

</svg>
