<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">millis() і micros(): скільки минуло від старту чипа</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">не «котра година», а лічильник, що пішов із нуля при ввімкненні</text>
<circle cx="110.0" cy="150.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="110.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">увімкнення</text>
<text x="110.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(t = 0)</text>
<line x1="110.0" y1="150.0" x2="840.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="343.6" y1="145.0" x2="343.6" y2="155.0" stroke="#6b7280" stroke-width="1.3"/>
<line x1="511.5" y1="145.0" x2="511.5" y2="155.0" stroke="#6b7280" stroke-width="1.3"/>
<line x1="679.4" y1="145.0" x2="679.4" y2="155.0" stroke="#6b7280" stroke-width="1.3"/>
<text x="812.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">час →</text>
<rect x="249.0" y="206.2" width="160.0" height="47.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="329.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="329.0" dy="0.0">millis()</tspan><tspan x="329.0" dy="15.6">= мс від старту</tspan></text>
<rect x="482.6" y="206.2" width="160.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="562.6" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="562.6" dy="0.0">micros()</tspan><tspan x="562.6" dy="15.6">= мкс від старту</tspan></text>
<line x1="329.0" y1="155.0" x2="329.0" y2="208.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="562.6" y1="155.0" x2="562.6" y2="208.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="450.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обидві читають апаратний лічильник і переводять його в мс або мкс.</text>
<text x="450.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Скинеться він лише при перезавантаженні — тоді відлік знову з нуля.</text>
</svg>