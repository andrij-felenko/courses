<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точність дорівнює точності кварцу (а не лічильника)</text>
<rect x="70.0" y="96.2" width="180.0" height="47.6" rx="6" fill="#fef7e9" stroke="#b08900" stroke-width="1.5"/><text x="160.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">кварц</tspan><tspan x="160.0" dy="15.6">(біжить/відстає)</tspan></text>
<line x1="250.0" y1="120.0" x2="360.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="365.0" y="96.2" width="190.0" height="47.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">лічильник</tspan><tspan x="460.0" dy="15.6">рахує тіки точно</tspan></text>
<line x1="560.0" y1="120.0" x2="670.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="660.0" y="96.8" width="230.0" height="46.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="775.0" y="116.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">millis()/micros()</tspan><tspan x="775.0" dy="15.0">похибка = похибка кварцу</tspan></text>
<text x="460.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дрейф у ppm (частинах на мільйон):</text>
<text x="300.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">±10 ppm</text>
<text x="330.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">≈ ±0.86 с/добу</text>
<text x="600.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">звичайний кварц</text>
<text x="300.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">±20 ppm</text>
<text x="330.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">≈ ±1.73 с/добу</text>
<text x="600.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">звичайний кварц</text>
<text x="300.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">±50 ppm</text>
<text x="330.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">≈ ±4.32 с/добу</text>
<text x="600.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">дешевий кварц</text>
<text x="460.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">На секундах-хвилинах непомітно; за дні набігає. Треба «справжній час» — RTC чи мережа.</text>
</svg>