<rect x="42.0" y="156.0" width="316.0" height="46.0" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="50.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Прошивка через SWD / JTAG</text>
<text x="50.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Запис у Flash: 10–30 с (швидкість 50–100 КБ/с)</text>
