<rect x="42.0" y="210.0" width="316.0" height="46.0" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="50.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Виконання на голій пам'яті</text>
<text x="50.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Немає MMU: тихе затирання пам'яті суміжних структур</text>
<line x1="200.0" y1="256.0" x2="200.0" y2="264.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="42.0" y="264.0" width="316.0" height="46.0" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="50.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Аварія без контексту</text>
<text x="50.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Німий HardFault або зависання через тисячі тактів</text>
<line x1="200.0" y1="310.0" x2="200.0" y2="318.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="42.0" y="318.0" width="316.0" height="46.0" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="50.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">5. Пошук проблеми наосліп</text>
<text x="50.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Лише 2–4 апаратні watchpoints, повільний printf</text>
