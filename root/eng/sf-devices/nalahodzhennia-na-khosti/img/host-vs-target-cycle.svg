<text x="200.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Налагодження на чипі (Target)</text>
<line x1="45.0" y1="88.0" x2="355.0" y2="88.0" stroke="#fecaca" stroke-width="1.0"/>
<rect x="42.0" y="102.0" width="316.0" height="46.0" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="50.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Cross-компіляція (arm-none-eabi)</text>
<text x="50.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Генерація .elf / .bin через важкий тулчейн</text>
