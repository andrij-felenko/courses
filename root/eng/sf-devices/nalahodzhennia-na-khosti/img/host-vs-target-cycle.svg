<text x="200.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Тривалість ітерації: 30–120 секунд на тест</text>
<rect x="390.0" y="50.0" width="340.0" height="360.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="560.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Налагодження на хості (Host-Based)</text>
<line x1="405.0" y1="88.0" x2="715.0" y2="88.0" stroke="#bbf7d0" stroke-width="1.0"/>
<rect x="402.0" y="102.0" width="316.0" height="46.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="410.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Нативна компіляція (Clang / GCC)</text>
<text x="410.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Збірка під x86-64 / ARM64 з прапорцями санітайзерів</text>
<line x1="560.0" y1="148.0" x2="560.0" y2="156.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="402.0" y="156.0" width="316.0" height="46.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="410.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Запуск у пам'яті хоста (RAM)</text>
<text x="410.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Виконання стартує за 1–5 мілісекунд без прошивки</text>
<line x1="560.0" y1="202.0" x2="560.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="402.0" y="210.0" width="316.0" height="46.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="410.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Повний захист пам'яті (MMU + ASan)</text>
<text x="410.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Тіньова пам'ять ловить вихід за межі на 1 байт</text>
<line x1="560.0" y1="256.0" x2="560.0" y2="264.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="402.0" y="264.0" width="316.0" height="46.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="410.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Миттєва локалізація</text>
<text x="410.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">UBSan та ASan зупиняють процес на точному рядку коду</text>
<line x1="560.0" y1="310.0" x2="560.0" y2="318.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="402.0" y="318.0" width="316.0" height="46.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="410.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">5. Інтерактивний GDB + Valgrind</text>
<text x="410.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Необмежені breakpoints, зворотний слід, аналіз пам'яті</text>
<rect x="402.0" y="375.0" width="316.0" height="26.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.0"/>
<text x="560.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Тривалість ітерації: 0.1–0.5 секунди на 100 тестів</text>
