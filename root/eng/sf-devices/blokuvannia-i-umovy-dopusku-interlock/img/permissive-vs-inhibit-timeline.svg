<rect x="400.0" y="50.0" width="340.0" height="280.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="210.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Умова допуску (Permissive)</text>
<text x="570.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Захисне блокування (Inhibit)</text>
<text x="210.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Перевірка ПЕРЕД стартом (Entry Gate)</text>
<text x="570.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Перевірка ПІД ЧАС роботи (Safety Guard)</text>
