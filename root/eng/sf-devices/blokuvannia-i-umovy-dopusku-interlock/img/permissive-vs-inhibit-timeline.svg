<line x1="735.0" y1="112.0" x2="470.0" y2="112.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="470.0" y1="112.0" x2="470.0" y2="125.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">НІ: продовження циклу</text>
<rect x="415.0" y="290.0" width="310.0" height="30.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="570.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Захищає від: розвитку катастрофи під час процесу</text>
<rect x="52.6" y="342.5" width="674.7" height="31.0" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="1.5"/><text x="390.0" y="361.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Permissive дає дозвіл на зміну стану (Gate), Inhibit примусово повертає в безпечний стан (Trip).</tspan></text>
</svg>