<rect x="409.8" y="127.3" width="120.3" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">СТАН: RUNNING</tspan><tspan x="470.0" dy="14.3">(Нормальний рух)</tspan></text>
<line x1="530.0" y1="150.0" x2="575.0" y2="150.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="580.0" y="125.0" width="140.0" height="50.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="650.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Аварійний сигнал?</tspan><tspan x="650.0" dy="13.0">(E-Stop, обрив, двері)</tspan></text>
<line x1="650.0" y1="175.0" x2="650.0" y2="220.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК (трип)</text>
<rect x="589.8" y="232.3" width="120.3" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="650.0" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">СТАН: SAFE_STOP</tspan><tspan x="650.0" dy="14.3">(Аварійний зрив)</tspan></text>
<line x1="720.0" y1="150.0" x2="735.0" y2="150.0" stroke="#27ae60" stroke-width="1.5"/>
