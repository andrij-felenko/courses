<line x1="320.0" y1="275.0" x2="360.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="250.0" width="100.0" height="50.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
