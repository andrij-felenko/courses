<rect x="60.0" y="245.0" width="120.0" height="65.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="120.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Силове живлення</tspan><tspan x="120.0" dy="13.0">(+24V / +400V)</tspan></text>
<line x1="180.0" y1="275.0" x2="220.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
