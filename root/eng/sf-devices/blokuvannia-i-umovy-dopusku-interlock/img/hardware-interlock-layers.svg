<line x1="460.0" y1="275.0" x2="500.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="245.0" width="110.0" height="65.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="555.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">Реле безпеки /</tspan><tspan x="555.0" dy="11.7">Вхід STO драйвера</tspan></text>
<line x1="610.0" y1="275.0" x2="645.0" y2="275.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="645.0" y="245.0" width="85.0" height="65.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="687.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="687.0" dy="0.0">Актуатор</tspan><tspan x="687.0" dy="13.0">(Мотор)</tspan></text>
<line x1="550.0" y1="155.0" x2="550.0" y2="245.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="677.0" y1="155.0" x2="580.0" y2="245.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 2"/>
<line x1="582.0" y1="240.0" x2="580.0" y2="245.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Фізичний розрив кола знеструмлює актуатор навіть при зависанні або збої прошивки.</text>
</svg>