<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Машина станів A/B розділів та відкату</text>
<rect x="65.0" y="76.4" width="190.0" height="67.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/><text x="160.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">INVALID / EMPTY</tspan><tspan x="160.0" dy="15.6">Слот не містить</tspan><tspan x="160.0" dy="15.6">валідної прошивки</tspan></text>
<rect x="330.0" y="76.4" width="220.0" height="67.2" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.0"/><text x="440.0" y="105.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#854d0e" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">PENDING_VERIFY</tspan><tspan x="440.0" dy="15.6">Пробний запуск образу</tspan><tspan x="440.0" dy="15.6">(boot_count &lt; max_retries)</tspan></text>
<rect x="625.0" y="76.4" width="190.0" height="67.2" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="2.2"/><text x="720.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">VALID / SUCCESS</tspan><tspan x="720.0" dy="15.6">Підтверджений образ</tspan><tspan x="720.0" dy="15.6">(self-test пройдено)</tspan></text>
<rect x="330.0" y="326.4" width="220.0" height="67.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="2.2"/><text x="440.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">MARKED_BAD / ROLLBACK</tspan><tspan x="440.0" dy="15.6">Слот визнано збійним</tspan><tspan x="440.0" dy="15.6">Відкат на робочий слот</tspan></text>
<line x1="255.0" y1="110.0" x2="330.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Запис образу + SHA-256/ECDSA</text>
<line x1="550.0" y1="110.0" x2="625.0" y2="110.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="580.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2. ota_mark_valid()</text>
<line x1="440.0" y1="143.6" x2="440.0" y2="326.4" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="448.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">3. Збій / WDT / паніка</text>
<text x="448.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">(boot_count &gt;= max)</text>
<line x1="550.0" y1="360.0" x2="720.0" y2="143.6" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">4. Активація слота B/A</text>
<line x1="330.0" y1="360.0" x2="160.0" y2="143.6" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="240.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Нове оновлення</text>
<rect x="60.0" y="435.0" width="760.0" height="65.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="440.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключовий інваріант: завантажувач перемикає активний слот у PENDING_VERIFY лише після валідації підпису.</text>
<text x="440.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Якщо нова прошивка падає або не скидає watchdog, boot_count перевищує ліміт і спричиняє негайний відкат.</text>
</svg>