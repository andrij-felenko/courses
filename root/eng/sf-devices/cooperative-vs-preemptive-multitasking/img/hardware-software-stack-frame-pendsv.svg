<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Стек задачі Cortex-M під час перемикання контексту в обробнику PendSV</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Апаратне збереження R0–R3, R12, LR, PC, xPSR процесором та програмне збереження R4–R11 ядром RTOS</text>

  <!-- Ліва колонка: Структура стека -->
  <rect x="30" y="75" width="460" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="260" y="98" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Організація стека задачі (Full Descending)</text>

  <!-- Вісь росту стека та адрес -->
  <text x="55" y="122" font-size="12" fill="#6b7280" text-anchor="middle">Вищі</text>
  <text x="55" y="136" font-size="12" fill="#6b7280" text-anchor="middle">адреси</text>
  <line x1="55" y1="145" x2="55" y2="465" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)\"/>
  <text x="55" y="488" font-size="12" fill="#6b7280" text-anchor="middle">Нижчі</text>
  <text x="55" y="502" font-size="12" fill="#6b7280" text-anchor="middle">адреси</text>

  <!-- Блок: Попередні дані задачі -->
  <rect x="85" y="120" width="210" height="26" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="190" y="137" font-size="12" fill="#6b7280" text-anchor="middle">Дані задачі (стек до винятку)</text>

  <!-- Блок: Hardware Frame (32 байти) -->
  <rect x="85" y="158" width="210" height="152" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <line x1="85" y1="177" x2="295" y2="177" stroke="#cbd5e1"/>
  <line x1="85" y1="196" x2="295" y2="196" stroke="#cbd5e1"/>
  <line x1="85" y1="215" x2="295" y2="215" stroke="#cbd5e1"/>
  <line x1="85" y1="234" x2="295" y2="234" stroke="#cbd5e1"/>
  <line x1="85" y1="253" x2="295" y2="253" stroke="#cbd5e1"/>
  <line x1="85" y1="272" x2="295" y2="272" stroke="#cbd5e1"/>
  <line x1="85" y1="291" x2="295" y2="291" stroke="#cbd5e1"/>

  <text x="102" y="172" font-size="12" font-weight="700" fill="#2457d6">xPSR</text>
  <text x="282" y="172" font-size="12" fill="#6b7280" text-anchor="end">Стан CPU (T-біт)</text>

  <text x="102" y="191" font-size="12" font-weight="700" fill="#2457d6">PC</text>
  <text x="282" y="191" font-size="12" fill="#6b7280" text-anchor="end">Return Address</text>

  <text x="102" y="210" font-size="12" font-weight="700" fill="#2457d6">LR</text>
  <text x="282" y="210" font-size="12" fill="#6b7280" text-anchor="end">R14 (Link Register)</text>

  <text x="102" y="229" font-size="12" font-weight="700" fill="#2457d6">R12</text>
  <text x="282" y="229" font-size="12" fill="#6b7280" text-anchor="end">Внутрішній IP</text>

  <text x="102" y="248" font-size="12" font-weight="700" fill="#2457d6">R3</text>
  <text x="282" y="248" font-size="12" fill="#6b7280" text-anchor="end">Аргумент 4</text>

  <text x="102" y="267" font-size="12" font-weight="700" fill="#2457d6">R2</text>
  <text x="282" y="267" font-size="12" fill="#6b7280" text-anchor="end">Аргумент 3</text>

  <text x="102" y="286" font-size="12" font-weight="700" fill="#2457d6">R1</text>
  <text x="282" y="286" font-size="12" fill="#6b7280" text-anchor="end">Аргумент 2</text>

  <text x="102" y="305" font-size="12" font-weight="700" fill="#2457d6">R0</text>
  <text x="282" y="305" font-size="12" fill="#6b7280" text-anchor="end">Аргумент 1 / Return</text>

  <!-- Блок: Software Frame (32 байти) -->
  <rect x="85" y="326" width="210" height="152" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <line x1="85" y1="345" x2="295" y2="345" stroke="#cbd5e1"/>
  <line x1="85" y1="364" x2="295" y2="364" stroke="#cbd5e1"/>
  <line x1="85" y1="383" x2="295" y2="383" stroke="#cbd5e1"/>
  <line x1="85" y1="402" x2="295" y2="402" stroke="#cbd5e1"/>
  <line x1="85" y1="421" x2="295" y2="421" stroke="#cbd5e1"/>
  <line x1="85" y1="440" x2="295" y2="440" stroke="#cbd5e1"/>
  <line x1="85" y1="459" x2="295" y2="459" stroke="#cbd5e1"/>

  <text x="102" y="340" font-size="12" font-weight="700" fill="#27ae60">R11</text>
  <text x="282" y="340" font-size="12" fill="#6b7280" text-anchor="end">Збережений регістр</text>

  <text x="102" y="359" font-size="12" font-weight="700" fill="#27ae60">R10</text>
  <text x="282" y="359" font-size="12" fill="#6b7280" text-anchor="end">Збережений регістр</text>

  <text x="102" y="378" font-size="12" font-weight="700" fill="#27ae60">R9</text>
  <text x="282" y="378" font-size="12" fill="#6b7280" text-anchor="end">Збережений регістр</text>

  <text x="102" y="397" font-size="12" font-weight="700" fill="#27ae60">R8</text>
  <text x="282" y="397" font-size="12" fill="#6b7280" text-anchor="end">Збережений регістр</text>

  <text x="102" y="416" font-size="12" font-weight="700" fill="#27ae60">R7</text>
  <text x="282" y="416" font-size="12" fill="#6b7280" text-anchor="end">Збережений регістр</text>

  <text x="102" y="435" font-size="12" font-weight="700" fill="#27ae60">R6</text>
  <text x="282" y="435" font-size="12" fill="#6b7280" text-anchor="end">Збережений регістр</text>

  <text x="102" y="454" font-size="12" font-weight="700" fill="#27ae60">R5</text>
  <text x="282" y="454" font-size="12" fill="#6b7280" text-anchor="end">Збережений регістр</text>

  <text x="102" y="473" font-size="12" font-weight="700" fill="#27ae60">R4</text>
  <text x="282" y="473" font-size="12" fill="#6b7280" text-anchor="end">Збережений регістр</text>

  <!-- Блок: Вільний простір стека -->
  <rect x="85" y="490" width="210" height="24" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4,4" rx="4"/>
  <text x="190" y="506" font-size="12" fill="#6b7280" text-anchor="middle">Вільний стек (резерв пам&apos;яті)</text>

  <!-- Вказівники стека (PSP) та опис кадрів -->
  <path d="M330,158 L300,158" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="338" y="154" font-size="12" font-weight="700" fill="#1a1a1a">PSP початковий</text>
  <text x="338" y="168" font-size="12" fill="#6b7280">Стек перед викликом</text>

  <text x="338" y="226" font-size="12" font-weight="700" fill="#2457d6">Hardware Frame</text>
  <text x="338" y="242" font-size="12" fill="#6b7280">8 регістрів (32 B)</text>
  <text x="338" y="258" font-size="12" fill="#6b7280">Апаратний автоскид</text>

  <path d="M330,318 L300,318" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="338" y="314" font-size="12" font-weight="700" fill="#2457d6">PSP після NVIC</text>
  <text x="338" y="328" font-size="12" fill="#6b7280">Вхід у PendSV (–32 B)</text>

  <text x="338" y="394" font-size="12" font-weight="700" fill="#27ae60">Software Frame</text>
  <text x="338" y="410" font-size="12" fill="#6b7280">8 регістрів (32 B)</text>
  <text x="338" y="426" font-size="12" fill="#6b7280">Асемблерний PUSH</text>

  <path d="M330,478 L300,478" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="338" y="474" font-size="12" font-weight="700" fill="#27ae60">PSP після PendSV</text>
  <text x="338" y="488" font-size="12" fill="#6b7280">Запис у TCB (–64 B)</text>

  <!-- Права колонка: Пояснювальні картки процесу -->
  <!-- Картка 1: Апаратний кадр -->
  <rect x="510" y="75" width="420" height="135" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <rect x="510" y="75" width="420" height="28" fill="#eaf0fd" rx="6"/>
  <text x="525" y="94" font-size="13" font-weight="700" fill="#2457d6">1. Апаратний кадр (Hardware Frame) — NVIC</text>
  <text x="525" y="122" font-size="12" fill="#1a1a1a">• Виконується автоматично CPU за 12 тактів конвеєра</text>
  <text x="525" y="142" font-size="12" fill="#1a1a1a">• Зберігає: xPSR, PC, LR, R12, R3, R2, R1, R0 (8 слів / 32 B)</text>
  <text x="525" y="162" font-size="12" fill="#1a1a1a">• Стандарт AAPCS: caller-saved регістри виклику функцій</text>
  <text x="525" y="182" font-size="12" fill="#6b7280">• У регістр LR записується службовий код EXC_RETURN</text>

  <!-- Картка 2: Програмний кадр -->
  <rect x="510" y="225" width="420" height="135" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="510" y="225" width="420" height="28" fill="#e9f7ef" rx="6"/>
  <text x="525" y="244" font-size="13" font-weight="700" fill="#27ae60">2. Програмний кадр (Software Frame) — PendSV</text>
  <text x="525" y="272" font-size="12" fill="#1a1a1a">• Зберігається вручну асемблерним кодом PendSV_Handler</text>
  <text x="525" y="292" font-size="12" fill="#1a1a1a">• Інструкція: stmdb r0!, {r4-r11} зберігає 8 регістрів (32 B)</text>
  <text x="525" y="312" font-size="12" fill="#1a1a1a">• Стандарт AAPCS: callee-saved регістри поточної задачі</text>
  <text x="525" y="332" font-size="12" fill="#6b7280">• Оновлений вказівник PSP фіксується у TCB задачі</text>

  <!-- Картка 3: Перемикання контексту -->
  <rect x="510" y="375" width="420" height="145" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <rect x="510" y="375" width="420" height="28" fill="#ffffff" rx="6"/>
  <text x="525" y="394" font-size="13" font-weight="700" fill="#1a1a1a">3. Відновлення та перемикання на нову задачу</text>
  <text x="525" y="422" font-size="12" fill="#1a1a1a">• Вибір нового TCB: pxCurrentTCB = pxNextTCB</text>
  <text x="525" y="442" font-size="12" fill="#1a1a1a">• Відновлення Software Frame: ldmia r0!, {r4-r11}</text>
  <text x="525" y="462" font-size="12" fill="#1a1a1a">• Оновлення стека нової задачі: msr psp, r0</text>
  <text x="525" y="482" font-size="12" fill="#1a1a1a">• Вихід: bx lr (EXC_RETURN) перемикає процесор у Thread Mode</text>
  <text x="525" y="502" font-size="12" fill="#2457d6">• Апаратне відновлення: CPU сам знімає Hardware Frame зі стека</text>
</svg>
