<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-f" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="480" y="36" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Порівняння затримки запису FatFs: динамічне виділення проти pre-allocation</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Попереднє виділення кластерів усуває хвостові сплески затримки (tail latency) оновлення таблиці FAT</text>

  <!-- Left: Dynamic Allocation (Spikes) -->
  <rect x="50" y="90" width="410" height="320" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="255" y="120" font-size="15" font-weight="700" fill="#c0392b" text-anchor="middle">Динамічне зростання (f_write / f_sync)</text>

  <!-- Axes -->
  <line x1="90" y1="340" x2="420" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-f)"/>
  <line x1="90" y1="340" x2="90" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-f)"/>
  <text x="90" y="142" font-size="11" fill="#1a1a1a">Затримка t (мс)</text>
  <text x="425" y="344" font-size="11" fill="#1a1a1a">Блоки</text>

  <!-- Bars with sudden huge spikes -->
  <rect x="120" y="320" width="16" height="20" fill="#c0392b"/>
  <rect x="150" y="320" width="16" height="20" fill="#c0392b"/>
  <rect x="180" y="320" width="16" height="20" fill="#c0392b"/>
  <rect x="210" y="170" width="16" height="170" fill="#c0392b"/>
  <text x="218" y="162" font-size="10" font-weight="700" fill="#c0392b" text-anchor="middle">380 мс</text>

  <rect x="240" y="320" width="16" height="20" fill="#c0392b"/>
  <rect x="270" y="320" width="16" height="20" fill="#c0392b"/>
  <rect x="300" y="320" width="16" height="20" fill="#c0392b"/>
  <rect x="330" y="185" width="16" height="155" fill="#c0392b"/>
  <text x="338" y="177" font-size="10" font-weight="700" fill="#c0392b" text-anchor="middle">320 мс</text>

  <rect x="360" y="320" width="16" height="20" fill="#c0392b"/>

  <text x="255" y="375" font-size="11" fill="#c0392b" text-anchor="middle">Сплески tail latency через пошук вільних</text>
  <text x="255" y="392" font-size="11" fill="#c0392b" text-anchor="middle">кластерів та перезапис секторів FAT</text>

  <!-- Right: Preallocated File -->
  <rect x="500" y="90" width="410" height="320" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="705" y="120" font-size="15" font-weight="700" fill="#27ae60" text-anchor="middle">Попереднє виділення (f_expand)</text>

  <!-- Axes -->
  <line x1="540" y1="340" x2="870" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-f)"/>
  <line x1="540" y1="340" x2="540" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-f)"/>
  <text x="540" y="142" font-size="11" fill="#1a1a1a">Затримка t (мс)</text>
  <text x="875" y="344" font-size="11" fill="#1a1a1a">Блоки</text>

  <!-- Bars with flat predictable timing -->
  <rect x="570" y="315" width="16" height="25" fill="#27ae60"/>
  <rect x="600" y="315" width="16" height="25" fill="#27ae60"/>
  <rect x="630" y="315" width="16" height="25" fill="#27ae60"/>
  <rect x="660" y="315" width="16" height="25" fill="#27ae60"/>
  <rect x="690" y="315" width="16" height="25" fill="#27ae60"/>
  <rect x="720" y="315" width="16" height="25" fill="#27ae60"/>
  <rect x="750" y="315" width="16" height="25" fill="#27ae60"/>
  <rect x="780" y="315" width="16" height="25" fill="#27ae60"/>
  <rect x="810" y="315" width="16" height="25" fill="#27ae60"/>

  <text x="690" y="295" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">Стабільні 4 - 8 мс на сектор</text>
  <text x="705" y="375" font-size="11" fill="#27ae60" text-anchor="middle">Кластери вже виділені суцільним масивом.</text>
  <text x="705" y="392" font-size="11" fill="#27ae60" text-anchor="middle">Нуль звернень до FAT під час потокового запису.</text>
</svg>