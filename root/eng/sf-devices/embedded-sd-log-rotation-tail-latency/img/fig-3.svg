<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подвійна буферизація DMA для передачі даних через SDMMC</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Конвеєр Buffer A / Buffer B ізолює потік логів ядра від хвостових затримок запису на карту</text>

  <!-- Панель 1: Джерело даних (Ядро / RTOS) -->
  <rect x="30" y="80" width="220" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="140" y="110" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Задача збору даних</text>
  <text x="140" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Ядро мікроконтролера</text>

  <rect x="45" y="150" width="190" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">Потік телеметрії:</text>
  <text x="55" y="192" font-size="12" fill="#2457d6">Високошвидкісні логи</text>
  <text x="55" y="212" font-size="12" fill="#6b7280">Датчики, шини CAN / SPI</text>

  <rect x="45" y="250" width="190" height="150" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="140" y="275" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Неблокуючий запис</text>
  <text x="55" y="300" font-size="12" fill="#1a1a1a">Ядро заповнює активний</text>
  <text x="55" y="320" font-size="12" fill="#1a1a1a">буфер і не очікує</text>
  <text x="55" y="340" font-size="12" fill="#1a1a1a">завершення шини SD.</text>
  <text x="55" y="375" font-size="12" font-weight="bold" fill="#27ae60">Затримка ядра: O(1)</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="250" y1="220" x2="310" y2="220" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Панель 2: Подвійний буфер Ping-Pong в ОЗП (Центр) -->
  <rect x="320" y="80" width="280" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="460" y="110" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подвійний буфер SRAM</text>
  <text x="460" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Вирівнювання під розмір сектора 512 Б</text>

  <!-- Buffer A -->
  <rect x="335" y="150" width="250" height="100" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="345" y="175" font-size="13" font-weight="bold" fill="#27ae60">Buffer A [512 Байт]</text>
  <text x="345" y="198" font-size="12" fill="#1a1a1a">Стан: <tspan font-weight="bold" fill="#27ae60">WRITING (Ядро)</tspan></text>
  <text x="345" y="218" font-size="12" fill="#6b7280">Накопичення свіжих пакетів</text>
  <text x="345" y="238" font-size="12" fill="#27ae60">Вільний для наповнення</text>

  <!-- Buffer B -->
  <rect x="335" y="270" width="250" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="345" y="295" font-size="13" font-weight="bold" fill="#2457d6">Buffer B [512 Байт]</text>
  <text x="345" y="318" font-size="12" fill="#1a1a1a">Стан: <tspan font-weight="bold" fill="#2457d6">DMA TX (Апаратний)</tspan></text>
  <text x="345" y="338" font-size="12" fill="#6b7280">Автономне вивантаження в SDIO</text>
  <text x="345" y="358" font-size="12" fill="#2457d6">Захищений від перезапису</text>

  <!-- Перемикання Ping-Pong -->
  <text x="460" y="398" font-size="12" fill="#6b7280" text-anchor="middle">Перемикання ролей за подією TC ISR</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="600" y1="320" x2="650" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Панель 3: Периферія мікроконтролера та SD-карта (Справа) -->
  <rect x="660" y="80" width="270" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="795" y="110" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний тракт SDMMC</text>
  <text x="795" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Автономна передача шиною</text>

  <!-- Контролер DMA -->
  <rect x="675" y="150" width="240" height="65" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="685" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">Контролер DMA</text>
  <text x="685" y="192" font-size="12" fill="#2457d6">Direct Memory Access канал</text>
  <text x="685" y="208" font-size="11" fill="#6b7280">0% навантаження CPU під час TX</text>

  <!-- Периферійний модуль SDMMC -->
  <rect x="675" y="228" width="240" height="65" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="685" y="250" font-size="12" font-weight="bold" fill="#1a1a1a">Периферія SDMMC / SDIO</text>
  <text x="685" y="270" font-size="12" fill="#2457d6">Апаратний FIFO та скінченний автомат</text>
  <text x="685" y="286" font-size="11" fill="#6b7280">4-бітна шина даних SD (до 50 МГц)</text>

  <!-- SD-карта -->
  <rect x="675" y="306" width="240" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="685" y="328" font-size="12" font-weight="bold" fill="#1a1a1a">SD Card Flash Storage</text>
  <text x="685" y="348" font-size="12" fill="#1a1a1a">Внутрішній Flash контролер</text>
  <text x="685" y="368" font-size="12" fill="#c0392b">Затримка програмування сторінки</text>
  <text x="685" y="388" font-size="11" fill="#6b7280">Хвостові затримки не впливають на ядро</text>
</svg>
