<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 837.5 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="837.5" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвенція викликів AAPCS та кадр стека</text>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвенція викликів AAPCS (ARM Cortex-M): регістри та кадр стека</text>
<text x="210.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Регістровий файл ядра (R0 — R15)</text>
<rect x="40.0" y="75.0" width="340.0" height="65.0" rx="4" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.6"/>
<text x="210.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">R0 — R3 (Caller-saved / Scratch)</text>
<text x="210.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Перші 4 аргументи функції; R0/R1 повертають результат</tspan><tspan x="210.0" dy="11.4">Викликана функція може вільно перезаписувати</tspan></text>
<rect x="40.0" y="148.0" width="340.0" height="85.0" rx="4" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.6"/>
<text x="210.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="middle" font-weight="700">R4 — R11 (Callee-saved / Preserved)</text>
<text x="210.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Локальні змінні та регістровий розподіл</tspan><tspan x="210.0" dy="11.4">Функція ЗОБОВ'ЯЗАНА зберегти на стек (PUSH)</tspan><tspan x="210.0" dy="11.4">і відновити перед поверненням (POP)</tspan></text>
<rect x="40.0" y="241.0" width="340.0" height="105.0" rx="4" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.6"/>
<text x="210.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">R12, R13(SP), R14(LR), R15(PC)</text>
<text x="210.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">R12 (IP): внутрішній скретч виклику</tspan><tspan x="210.0" dy="11.4">R13 (SP): вказівник активного стека (вирівнювання 8 байт)</tspan><tspan x="210.0" dy="11.4">R14 (LR): адреса повернення (Link Register)</tspan><tspan x="210.0" dy="11.4">R15 (PC): лічильник команд (Program Counter)</tspan></text>
<rect x="40.0" y="356.0" width="160.0" height="26.0" rx="3" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.2"/>
<text x="120.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e8449" text-anchor="middle" font-weight="700">Caller-saved (R0-R3, R12)</text>
<rect x="220.0" y="356.0" width="160.0" height="26.0" rx="3" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.2"/>
<text x="300.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a5276" text-anchor="middle" font-weight="700">Callee-saved (R4-R11)</text>
<text x="600.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кадр стека в RAM (SP росте вниз)</text>
<rect x="440.0" y="80.0" width="320.0" height="24.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="600.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Вищі адреси пам'яті (RAM)</text>
<rect x="440.0" y="104.0" width="320.0" height="35.0" rx="0" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="600.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">5-й, 6-й... аргументи (якщо параметрів &gt; 4)</text>
<rect x="440.0" y="139.0" width="320.0" height="32.0" rx="0" fill="#fdf3d6" stroke="#b9770e" stroke-width="1.5"/>
<text x="600.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">Збережений LR (R14) — адреса повернення</text>
<rect x="440.0" y="171.0" width="320.0" height="38.0" rx="0" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.5"/>
<text x="600.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a5276" text-anchor="middle" font-weight="700">Збережені Callee-saved регістри (R4 — R11)</text>
<rect x="440.0" y="209.0" width="320.0" height="38.0" rx="0" fill="#f0e6fa" stroke="#7d3c98" stroke-width="1.5"/>
<text x="600.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7d3c98" text-anchor="middle" font-weight="700">Локальні змінні / буфери на стеку</text>
<rect x="440.0" y="247.0" width="320.0" height="28.0" rx="0" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/>
<text x="600.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Padding для вирівнювання SP на 8 байт</text>
<rect x="440.0" y="275.0" width="320.0" height="30.0" rx="0" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5"/>
<text x="600.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e8449" text-anchor="middle" font-weight="700">Поточний SP (Top of Stack) -&gt; Нижчі адреси</text>
<line x1="780.0" y1="110.0" x2="780.0" y2="280.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="795.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start"><tspan x="795.0" dy="0.0">Стек</tspan><tspan x="795.0" dy="10.8">росте</tspan><tspan x="795.0" dy="10.8">вниз</tspan></text>
<text x="410.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">AAPCS гарантує збереження R4-R11 між викликами та 8-байтне вирівнювання SP на публічних межах</text>
</svg>