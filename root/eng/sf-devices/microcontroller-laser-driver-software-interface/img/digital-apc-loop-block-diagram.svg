<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <rect width="960" height="480" fill="white"/>
  
  <text x="480" y="40" fill="#1a1a1a" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Digital APC Loop Block Diagram</text>
  <text x="480" y="65" fill="#6b7280" font-family="sans-serif" font-size="16" text-anchor="middle">Microcontroller Laser Driver Software Interface</text>

  <rect x="60" y="160" width="160" height="100" rx="8" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="140" y="205" fill="#1a1a1a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Target Power</text>
  <text x="140" y="235" fill="#6b7280" font-family="sans-serif" font-size="14" text-anchor="middle">Setpoint Input</text>

  <rect x="280" y="140" width="180" height="140" rx="8" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="370" y="195" fill="#2457d6" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Digital APC Core</text>
  <text x="370" y="225" fill="#1a1a1a" font-family="sans-serif" font-size="14" text-anchor="middle">Error Calc</text>
  <text x="370" y="250" fill="#1a1a1a" font-family="sans-serif" font-size="14" text-anchor="middle">PID Controller</text>

  <rect x="520" y="160" width="160" height="100" rx="8" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="205" fill="#27ae60" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Output Interface</text>
  <text x="600" y="235" fill="#1a1a1a" font-family="sans-serif" font-size="14" text-anchor="middle">DAC / PWM Driver</text>

  <rect x="740" y="160" width="160" height="100" rx="8" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="820" y="205" fill="#c0392b" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Laser Diode</text>
  <text x="820" y="235" fill="#1a1a1a" font-family="sans-serif" font-size="14" text-anchor="middle">+ Monitor PD</text>

  <rect x="520" y="320" width="160" height="100" rx="8" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="600" y="365" fill="#2457d6" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Input Interface</text>
  <text x="600" y="395" fill="#1a1a1a" font-family="sans-serif" font-size="14" text-anchor="middle">ADC Driver</text>

  <line x1="220" y1="210" x2="280" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="280,210 270,205 270,215" fill="#1a1a1a"/>

  <line x1="460" y1="210" x2="520" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="520,210 510,205 510,215" fill="#1a1a1a"/>

  <line x1="680" y1="210" x2="740" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="740,210 730,205 730,215" fill="#1a1a1a"/>

  <line x1="820" y1="260" x2="820" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="820" y1="370" x2="680" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="680,370 690,365 690,375" fill="#1a1a1a"/>

  <line x1="520" y1="370" x2="370" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="370" y1="370" x2="370" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="370,280 365,290 375,290" fill="#1a1a1a"/>

  <text x="250" y="200" fill="#6b7280" font-family="sans-serif" font-size="12" text-anchor="middle">Ref</text>
  <text x="490" y="200" fill="#6b7280" font-family="sans-serif" font-size="12" text-anchor="middle">Control</text>
  <text x="710" y="200" fill="#6b7280" font-family="sans-serif" font-size="12" text-anchor="middle">Drive</text>
  <text x="750" y="360" fill="#6b7280" font-family="sans-serif" font-size="12" text-anchor="middle">Sense</text>
  <text x="445" y="360" fill="#6b7280" font-family="sans-serif" font-size="12" text-anchor="middle">Measured</text>

</svg>
