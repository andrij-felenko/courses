<svg viewBox="0 0 960 480" width="960" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr-flow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-err" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-ok" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Laser Driver State Machine</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Architectural schema of functioning and state transitions</text>

  <!-- States -->
  <rect x="90" y="140" width="140" height="60" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="160" y="176" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">INIT</text>

  <rect x="290" y="140" width="140" height="60" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="360" y="176" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IDLE</text>

  <rect x="490" y="140" width="140" height="60" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="560" y="176" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">WARM_UP</text>

  <rect x="690" y="140" width="140" height="60" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="760" y="176" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">EMITTING</text>

  <rect x="490" y="300" width="140" height="60" rx="6" ry="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="560" y="336" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">FAULT</text>

  <!-- Transitions -->
  <path d="M230,170 L280,170" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="255" y="160" font-size="12" fill="#6b7280" text-anchor="middle">Self-test OK</text>

  <path d="M430,170 L480,170" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-flow)"/>
  <text x="455" y="160" font-size="12" fill="#2457d6" text-anchor="middle">Enable Cmd</text>

  <path d="M630,170 L680,170" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-ok)"/>
  <text x="655" y="160" font-size="12" fill="#27ae60" text-anchor="middle">Temp Ready</text>

  <path d="M560,140 L560,120 L380,120 L380,130" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="470" y="108" font-size="12" fill="#6b7280" text-anchor="middle">Disable Cmd</text>

  <path d="M760,140 L760,90 L340,90 L340,130" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="550" y="78" font-size="12" fill="#6b7280" text-anchor="middle">Disable Cmd</text>

  <path d="M160,200 L160,330 L480,330" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-err)"/>
  <text x="170" y="265" font-size="12" fill="#c0392b" text-anchor="start">Self-test Fail</text>

  <path d="M560,200 L560,290" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-err)"/>
  <text x="570" y="245" font-size="12" fill="#c0392b" text-anchor="start">Timeout / Interlock</text>

  <path d="M760,200 L760,330 L640,330" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-err)"/>
  <text x="750" y="265" font-size="12" fill="#c0392b" text-anchor="end">Overcurrent / Thermal</text>

  <path d="M560,360 L560,400 L70,400 L70,170 L80,170" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-flow)"/>
  <text x="315" y="388" font-size="12" fill="#2457d6" text-anchor="middle">Reset Command</text>
</svg>
