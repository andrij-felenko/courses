<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480">
  <rect width="960" height="480" fill="white"/>
  
  <!-- Title and Subtitle -->
  <text x="480" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Laser Diode L-I Thermal Curves</text>
  <text x="480" y="70" font-family="Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">Optical Power vs. Forward Current at Various Temperatures</text>
  
  <!-- Axes and Grid -->
  <g stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4">
    <!-- horizontal grid -->
    <line x1="120" y1="120" x2="840" y2="120"/>
    <line x1="120" y1="180" x2="840" y2="180"/>
    <line x1="120" y1="240" x2="840" y2="240"/>
    <line x1="120" y1="300" x2="840" y2="300"/>
    <line x1="120" y1="360" x2="840" y2="360"/>
    
    <!-- vertical grid -->
    <line x1="240" y1="120" x2="240" y2="420"/>
    <line x1="360" y1="120" x2="360" y2="420"/>
    <line x1="480" y1="120" x2="480" y2="420"/>
    <line x1="600" y1="120" x2="600" y2="420"/>
    <line x1="720" y1="120" x2="720" y2="420"/>
  </g>

  <!-- Axes Base -->
  <g stroke="#1a1a1a" stroke-width="2">
    <!-- Y-axis -->
    <line x1="120" y1="100" x2="120" y2="420"/>
    <!-- X-axis -->
    <line x1="120" y1="420" x2="860" y2="420"/>
  </g>

  <!-- Y-axis Labels -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end">
    <text x="110" y="425">0</text>
    <text x="110" y="365">10</text>
    <text x="110" y="305">20</text>
    <text x="110" y="245">30</text>
    <text x="110" y="185">40</text>
    <text x="110" y="125">50</text>
  </g>
  
  <g transform="translate(40, 260)">
    <text font-family="Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90)">Optical Power (mW)</text>
  </g>

  <!-- X-axis Labels -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">
    <text x="120" y="440">0</text>
    <text x="240" y="440">20</text>
    <text x="360" y="440">40</text>
    <text x="480" y="440">60</text>
    <text x="600" y="440">80</text>
    <text x="720" y="440">100</text>
    <text x="840" y="440">120</text>
  </g>
  <text x="480" y="470" font-family="Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">Forward Current (mA)</text>

  <!-- L-I Curves -->
  <!-- 25C -->
  <path d="M 120 420 L 270 420 L 570 120" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round" />
  <!-- 50C -->
  <path d="M 120 420 L 390 420 L 765 120" fill="none" stroke="#27ae60" stroke-width="3" stroke-linejoin="round" />
  <!-- 75C -->
  <path d="M 120 420 L 510 420 L 840 222" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" />

  <!-- Legend -->
  <g transform="translate(680, 140)">
    <rect x="0" y="0" width="120" height="90" fill="white" stroke="#6b7280" stroke-width="1"/>
    
    <line x1="10" y1="20" x2="40" y2="20" stroke="#2457d6" stroke-width="3"/>
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="14" fill="#1a1a1a">T = 25°C</text>
    
    <line x1="10" y1="45" x2="40" y2="45" stroke="#27ae60" stroke-width="3"/>
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="14" fill="#1a1a1a">T = 50°C</text>
    
    <line x1="10" y1="70" x2="40" y2="70" stroke="#c0392b" stroke-width="3"/>
    <text x="50" y="75" font-family="Arial, sans-serif" font-size="14" fill="#1a1a1a">T = 75°C</text>
  </g>
  
  <!-- Annotations for Threshold Current (Ith) -->
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="start">
    <circle cx="270" cy="420" r="4" fill="#2457d6"/>
    <text x="260" y="405" fill="#2457d6" font-weight="bold">Ith</text>
    
    <circle cx="390" cy="420" r="4" fill="#27ae60"/>
    <text x="380" y="405" fill="#27ae60" font-weight="bold">Ith</text>
    
    <circle cx="510" cy="420" r="4" fill="#c0392b"/>
    <text x="500" y="405" fill="#c0392b" font-weight="bold">Ith</text>
  </g>
</svg>
