<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" fill="#1a1a1a" font-size="18" font-weight="bold" text-anchor="middle">Апаратний інтерфейс мікроконтролера та лазера</text>
  <text x="480" y="65" fill="#6b7280" font-size="13" text-anchor="middle">Підключення лазерного діода з контуром автоматичного регулювання потужності (APC)</text>

  <!-- Мікроконтролер -->
  <rect x="40" y="100" width="220" height="280" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="150" y="130" fill="#1a1a1a" font-size="16" font-weight="bold" text-anchor="middle">Мікроконтролер (MCU)</text>
  
  <rect x="60" y="160" width="180" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="150" y="185" fill="#1a1a1a" font-size="14" text-anchor="middle">ШІМ (PWM) - Модуляція</text>

  <rect x="60" y="220" width="180" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="150" y="245" fill="#1a1a1a" font-size="14" text-anchor="middle">GPIO - Дозвіл (Enable)</text>

  <rect x="60" y="280" width="180" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="150" y="305" fill="#1a1a1a" font-size="14" text-anchor="middle">АЦП (ADC) - Моніторинг</text>

  <!-- Драйвер лазера -->
  <rect x="360" y="100" width="240" height="280" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="130" fill="#2457d6" font-size="16" font-weight="bold" text-anchor="middle">Драйвер лазера</text>
  
  <rect x="380" y="160" width="200" height="60" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="185" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">Схема модуляції</text>
  <text x="480" y="205" fill="#6b7280" font-size="12" text-anchor="middle">Ключовий транзистор</text>

  <rect x="380" y="240" width="200" height="60" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="265" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">Контур APC</text>
  <text x="480" y="285" fill="#6b7280" font-size="12" text-anchor="middle">Стабілізація потужності</text>

  <!-- Лазерний модуль -->
  <rect x="700" y="100" width="220" height="280" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="810" y="130" fill="#c0392b" font-size="16" font-weight="bold" text-anchor="middle">Лазерний модуль</text>

  <rect x="720" y="160" width="180" height="60" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="810" y="185" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">Лазерний діод (LD)</text>
  <text x="810" y="205" fill="#6b7280" font-size="12" text-anchor="middle">Джерело випромінювання</text>

  <rect x="720" y="240" width="180" height="60" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="810" y="265" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">Фотодіод (mPD)</text>
  <text x="810" y="285" fill="#6b7280" font-size="12" text-anchor="middle">Сенсор випромінювання</text>

  <!-- Зв'язки -->
  <!-- PWM -> Модулятор -->
  <path d="M 260 180 L 380 180" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="320" y="172" fill="#2457d6" font-size="12" text-anchor="middle">PWM_IN</text>

  <!-- GPIO -> Модулятор / APC -->
  <path d="M 260 240 L 320 240 L 320 270 L 380 270" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="232" fill="#1a1a1a" font-size="12" text-anchor="middle">EN_LASER</text>

  <!-- APC -> ADC -->
  <path d="M 380 290 L 340 290 L 340 300 L 260 300" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="318" fill="#1a1a1a" font-size="12" text-anchor="middle">V_MONITOR</text>

  <!-- Модулятор -> LD -->
  <path d="M 580 180 L 720 180" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="650" y="172" fill="#2457d6" font-size="12" text-anchor="middle">I_LD (Струм)</text>

  <!-- mPD -> APC -->
  <path d="M 720 270 L 580 270" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="650" y="262" fill="#1a1a1a" font-size="12" text-anchor="middle">I_PD (Струм PD)</text>

</svg>
