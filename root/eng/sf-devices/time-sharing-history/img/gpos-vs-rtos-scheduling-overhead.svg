<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Накладні витрати перемикання контексту та затримка відгуку</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Компроміс між пропускною здатністю (GPOS) та детермінізмом реального часу (RTOS)</text>

  <!-- Left Card: RTOS Domain -->
  <rect x="30" y="85" width="230" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="85" width="230" height="36" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="145" y="108" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">Область RTOS (Малий квант)</text>

  <rect x="45" y="135" width="200" height="44" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="55" y="153" font-size="12" font-weight="700" fill="#1a1a1a">Квант T_tick: 0.1 .. 1 мс</text>
  <text x="55" y="169" font-size="11" fill="#6b7280">Часті переривання таймера</text>

  <rect x="45" y="190" width="200" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="55" y="209" font-size="12" font-weight="700" fill="#27ae60">Затримка відгуку (Latency):</text>
  <text x="55" y="229" font-size="12" font-weight="700" fill="#1a1a1a">Мінімальна (10 .. 100 мкс)</text>

  <rect x="45" y="254" width="200" height="52" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="55" y="273" font-size="12" font-weight="700" fill="#c0392b">Втрати часу (Overhead eta):</text>
  <text x="55" y="293" font-size="12" font-weight="700" fill="#1a1a1a">Помітні: 2% .. 10% CPU</text>

  <rect x="45" y="318" width="200" height="92" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="55" y="338" font-size="12" font-weight="700" fill="#1a1a1a">Головна мета:</text>
  <text x="55" y="358" font-size="11" fill="#6b7280">Суворий часовий детермінізм,</text>
  <text x="55" y="376" font-size="11" fill="#6b7280">гарантований час реакції (WCET)</text>
  <text x="55" y="394" font-size="11" fill="#6b7280">та пріоритетне витіснення</text>

  <!-- Center Chart Area -->
  <rect x="280" y="85" width="400" height="340" rx="8" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="110" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Залежність характеристик від кванта T_tick</text>

  <!-- Legend in Chart -->
  <line x1="320" y1="130" x2="350" y2="130" stroke="#c0392b" stroke-width="2.5"/>
  <text x="355" y="134" font-size="11" font-weight="700" fill="#c0392b">η (Overhead)</text>

  <line x1="490" y1="130" x2="520" y2="130" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="525" y="134" font-size="11" font-weight="700" fill="#2457d6">Затримка (Latency)</text>

  <!-- Sweet Spot Box -->
  <rect x="400" y="145" width="125" height="215" fill="#f4f6f8" stroke="#94a3b8" stroke-dasharray="4,4"/>
  <text x="462" y="165" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Баланс для MCU</text>
  <text x="462" y="180" font-size="10" fill="#6b7280" text-anchor="middle">T_tick = 1 .. 5 мс</text>

  <!-- Axes -->
  <!-- X axis -->
  <line x1="320" y1="360" x2="650" y2="360" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="480" y="395" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Тривалість кванта T_tick (мс)</text>
  <text x="340" y="375" font-size="11" fill="#6b7280" text-anchor="middle">0.1</text>
  <text x="420" y="375" font-size="11" fill="#6b7280" text-anchor="middle">1.0</text>
  <text x="500" y="375" font-size="11" fill="#6b7280" text-anchor="middle">10</text>
  <text x="600" y="375" font-size="11" fill="#6b7280" text-anchor="middle">100</text>

  <!-- Left Y axis (Overhead) -->
  <line x1="320" y1="360" x2="320" y2="160" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="305" y="155" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">η (%)</text>
  <text x="305" y="195" font-size="10" fill="#c0392b" text-anchor="end">20%</text>
  <text x="305" y="260" font-size="10" fill="#c0392b" text-anchor="end">5%</text>
  <text x="305" y="335" font-size="10" fill="#c0392b" text-anchor="end">0.5%</text>

  <!-- Right Y axis (Latency) -->
  <line x1="640" y1="360" x2="640" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="655" y="155" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">T_lat</text>
  <text x="655" y="200" font-size="10" fill="#2457d6">100мс</text>
  <text x="655" y="270" font-size="10" fill="#2457d6">10мс</text>
  <text x="655" y="340" font-size="10" fill="#2457d6">1мс</text>

  <!-- Curve: Overhead eta (Red, hyperbolic drop) -->
  <path d="M330,175 Q360,280 430,325 T630,350" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Curve: Latency (Blue, linear rise) -->
  <path d="M330,345 L430,310 L530,250 L630,180" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- Formula Callout at Bottom of Chart -->
  <text x="480" y="415" font-size="11" fill="#475569" text-anchor="middle">Overhead = (T_switch ÷ T_tick) × 100%</text>

  <!-- Right Card: GPOS Domain -->
  <rect x="700" y="85" width="230" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="700" y="85" width="230" height="36" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="815" y="108" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">Область GPOS (Великий квант)</text>

  <rect x="715" y="135" width="200" height="44" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="725" y="153" font-size="12" font-weight="700" fill="#1a1a1a">Квант T_tick: 10 .. 100 мс</text>
  <text x="725" y="169" font-size="11" fill="#6b7280">Рідкісні перемикання задач</text>

  <rect x="715" y="190" width="200" height="52" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="725" y="209" font-size="12" font-weight="700" fill="#c0392b">Затримка відгуку (Latency):</text>
  <text x="725" y="229" font-size="12" font-weight="700" fill="#1a1a1a">Велика (до 10 .. 100 мс)</text>

  <rect x="715" y="254" width="200" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="725" y="273" font-size="12" font-weight="700" fill="#27ae60">Втрати часу (Overhead eta):</text>
  <text x="725" y="293" font-size="12" font-weight="700" fill="#1a1a1a">Мінімальні: менше 0.1% CPU</text>

  <rect x="715" y="318" width="200" height="92" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="725" y="338" font-size="12" font-weight="700" fill="#1a1a1a">Головна мета:</text>
  <text x="725" y="358" font-size="11" fill="#6b7280">Максимальна пропускна</text>
  <text x="725" y="376" font-size="11" fill="#6b7280">здатність (throughput), кешування</text>
  <text x="725" y="394" font-size="11" fill="#6b7280">та справедливість (CFS)</text>
</svg>
