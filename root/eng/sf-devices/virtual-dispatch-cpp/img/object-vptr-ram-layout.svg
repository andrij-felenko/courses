<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Object Memory Layout in RAM (C++)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">RAM layout of a class instance with virtual functions and its connection to the vtable</text>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Object Instance (RAM) -->
  <rect x="250" y="120" width="200" height="240" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="350" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Object Instance (RAM)</text>
  
  <rect x="250" y="120" width="200" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="350" y="155" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">vptr (Virtual Pointer)</text>
  
  <rect x="250" y="180" width="200" height="60" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="215" font-size="14" fill="#1a1a1a" text-anchor="middle">Member Data 1</text>
  
  <rect x="250" y="240" width="200" height="60" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="275" font-size="14" fill="#1a1a1a" text-anchor="middle">Member Data 2</text>
  
  <rect x="250" y="300" width="200" height="60" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="335" font-size="14" fill="#1a1a1a" text-anchor="middle">Member Data N</text>
  
  <!-- VTable (ROM/RAM) -->
  <rect x="580" y="120" width="200" height="200" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="680" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VTable (RODATA)</text>
  
  <rect x="580" y="120" width="200" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="680" y="145" font-size="13" fill="#27ae60" text-anchor="middle">RTTI Pointer</text>

  <rect x="580" y="160" width="200" height="40" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="680" y="185" font-size="14" fill="#1a1a1a" text-anchor="middle">&amp;Class::Method1()</text>
  
  <rect x="580" y="200" width="200" height="40" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="680" y="225" font-size="14" fill="#1a1a1a" text-anchor="middle">&amp;Class::Method2()</text>
  
  <rect x="580" y="240" width="200" height="40" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="680" y="265" font-size="14" fill="#1a1a1a" text-anchor="middle">&amp;Class::Method3()</text>

  <rect x="580" y="280" width="200" height="40" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="680" y="305" font-size="14" fill="#1a1a1a" text-anchor="middle">...</text>
  
  <!-- Arrow from vptr to VTable -->
  <path d="M 450 150 L 510 150 L 510 180 L 565 180" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <!-- Additional explanations -->
  <text x="350" y="395" font-size="13" fill="#6b7280" text-anchor="middle">vptr is injected by compiler</text>
  <text x="350" y="415" font-size="13" fill="#6b7280" text-anchor="middle">usually at offset 0 of object</text>
  
  <text x="680" y="340" font-size="13" fill="#6b7280" text-anchor="middle">Shared across all instances</text>
  <text x="680" y="360" font-size="13" fill="#6b7280" text-anchor="middle">of the same Class</text>

  <!-- Low / High addresses marks -->
  <text x="230" y="125" font-size="12" fill="#6b7280" text-anchor="end">Low Address</text>
  <text x="230" y="355" font-size="12" fill="#6b7280" text-anchor="end">High Address</text>

  <!-- Arrow pointing down for addresses -->
  <path d="M 230 140 L 230 330" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <polygon points="227,330 233,330 230,335" fill="#6b7280"/>

</svg>
