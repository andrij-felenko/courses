<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>
  
  <text x="480" y="40" fill="#1a1a1a" font-size="18" font-weight="bold" text-anchor="middle">Диспетчеризація віртуальних функцій у C++</text>
  <text x="480" y="65" fill="#6b7280" font-size="13" text-anchor="middle">Об'єкт у RAM містить лише вказівник (vptr) на єдину таблицю у постійній пам'яті (Flash)</text>

  <!-- Object in RAM -->
  <rect x="40" y="180" width="220" height="150" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="150" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">Екземпляр об'єкта (RAM)</text>
  
  <rect x="60" y="220" width="180" height="40" rx="2" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="150" y="245" font-size="13" text-anchor="middle" fill="#1a1a1a">vptr (вказівник)</text>
  
  <rect x="60" y="270" width="180" height="40" rx="2" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="150" y="295" font-size="13" text-anchor="middle" fill="#1a1a1a">Поля даних (int, ...)</text>

  <text x="150" y="350" font-size="12" fill="#6b7280" text-anchor="middle">Кожен екземпляр</text>
  <text x="150" y="365" font-size="12" fill="#6b7280" text-anchor="middle">має власний vptr</text>

  <!-- VTable in .rodata -->
  <rect x="360" y="160" width="220" height="200" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="470" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">vtable (.rodata)</text>
  
  <rect x="380" y="200" width="180" height="40" rx="2" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="470" y="225" font-size="13" text-anchor="middle" fill="#6b7280">type_info (RTTI)</text>
  
  <rect x="380" y="250" width="180" height="40" rx="2" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="470" y="275" font-size="13" text-anchor="middle" fill="#1a1a1a">&amp;MyClass::Func1</text>
  
  <rect x="380" y="300" width="180" height="40" rx="2" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="470" y="325" font-size="13" text-anchor="middle" fill="#1a1a1a">&amp;MyClass::Func2</text>

  <text x="470" y="380" font-size="12" fill="#6b7280" text-anchor="middle">Спільна для всіх</text>
  <text x="470" y="395" font-size="12" fill="#6b7280" text-anchor="middle">об'єктів цього класу</text>

  <!-- Code in .text -->
  <rect x="700" y="180" width="220" height="150" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="810" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Реалізація методів (.text)</text>
  
  <rect x="720" y="220" width="180" height="40" rx="2" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="810" y="245" font-size="13" text-anchor="middle" fill="#1a1a1a">MyClass::Func1()</text>
  
  <rect x="720" y="280" width="180" height="40" rx="2" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="810" y="305" font-size="13" text-anchor="middle" fill="#1a1a1a">MyClass::Func2()</text>

  <text x="810" y="350" font-size="12" fill="#6b7280" text-anchor="middle">Інструкції процесора</text>
  <text x="810" y="365" font-size="12" fill="#6b7280" text-anchor="middle">(зберігаються у Flash)</text>

  <!-- Arrows -->
  <path d="M 240 240 C 310 240, 310 270, 372 270" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="310" y="235" font-size="12" fill="#2457d6" text-anchor="middle">вказівник</text>

  <path d="M 560 270 C 640 270, 640 240, 712 240" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <path d="M 560 320 C 640 320, 640 300, 712 300" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  
  <text x="640" y="235" font-size="12" fill="#6b7280" text-anchor="middle">виклик</text>
</svg>
