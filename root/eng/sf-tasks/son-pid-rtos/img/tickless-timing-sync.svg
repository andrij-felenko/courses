<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синхронізація системного часу RTOS у режимі Tickless Idle</text>
<text x="380.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">компенсація тактів планувальника через vTaskStepTick() при плановому та асинхронному пробудженні</text>
<text x="35.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Сценарій А: Планове пробудження за таймаутом LPTIM (сон N тактів)</text>
<line x1="40.0" y1="115.0" x2="710.0" y2="115.0" stroke="#333333" stroke-width="1.5"/>
<line x1="690.0" y1="115.0" x2="715.0" y2="115.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="95.0" width="110.0" height="42.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="95.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Idle: старт сну</text>
<rect x="155.0" y="95.0" width="380.0" height="42.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="345.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Глибокий сон Stop 1 (LPTIM рахує N = 500 тактів)</text>
<text x="345.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">SysTick зупинено • HCLK OFF • Споживання 1.5 мкА</text>
<rect x="540.0" y="95.0" width="160.0" height="42.0" rx="4" fill="#fff7e6" stroke="#caa24a" stroke-width="1.2"/>
<text x="620.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#caa24a" text-anchor="middle" font-weight="700">LPTIM IRQ: пробудження</text>
<text x="620.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">vTaskStepTick(500)</text>
<text x="35.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Сценарій Б: Передчасне пробудження зовнішньою подією (EXTI / Датчик у момент M &lt; N)</text>
<line x1="40.0" y1="225.0" x2="710.0" y2="225.0" stroke="#333333" stroke-width="1.5"/>
<line x1="690.0" y1="225.0" x2="715.0" y2="225.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="205.0" width="110.0" height="42.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="95.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Idle: план N=500</text>
<rect x="155.0" y="205.0" width="210.0" height="42.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="260.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Сон Stop 1 (фактично M = 180 тактів)</text>
<text x="260.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Перервано подією EXTI GPIO</text>
<rect x="370.0" y="205.0" width="175.0" height="42.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="457.5" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">EXTI IRQ: ядро прокинулося</text>
<text x="457.5" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зчитування CNT → vTaskStepTick(180)</text>
<rect x="550.0" y="205.0" width="150.0" height="42.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="625.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Обробка задачі давача</text>
<text x="625.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">SysTick відновлено</text>
<rect x="35.0" y="295.0" width="690.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="320.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Механізм vTaskStepTick() гарантує монотонність і точність системного часу:</tspan><tspan x="380.0" dy="13.7">при передчасному пробудженні хук зчитує поточний стан лічильника LPTIM, розраховує фактично</tspan><tspan x="380.0" dy="13.7">прожиті такти, передає їх планувальнику для оновлення черг таймаутів і перезапускає SysTick.</tspan><tspan x="380.0" dy="13.7">Завдяки цьому жодна затримка не спрацьовує завчасно, а системний час не збивається.</tspan></text>
</svg>