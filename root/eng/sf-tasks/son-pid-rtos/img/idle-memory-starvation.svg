<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Самовидалення задач і пастка голодування Idle Task</text>
<text x="380.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">чому задача не може звільнити власний стек і як активні потоки викликають витік купи</text>
<rect x="35.0" y="75.0" width="335.0" height="215.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="202.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпека: блокування очищення</text>
<rect x="45.0" y="115.0" width="315.0" height="160.0" rx="6" fill="#ffffff" stroke="#f5c6cb" stroke-width="1.5"/><text x="202.5" y="163.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="202.5" dy="0.0">1. Задача кличе vTaskDelete(NULL) для самоліквідації.</tspan><tspan x="202.5" dy="11.7">2. Задача НЕ може викликати free() для власного</tspan><tspan x="202.5" dy="11.7">   стеку, бо її код виконується прямо на цьому стеку!</tspan><tspan x="202.5" dy="11.7">3. Ядро поміщає TCB у список xTasksWaitingTermination.</tspan><tspan x="202.5" dy="11.7">4. Якщо задачі з пріоритетом &gt;= 1 постійно працюють</tspan><tspan x="202.5" dy="11.7">   і не блокуються, Idle Task ніколи не отримає CPU.</tspan><tspan x="202.5" dy="11.7">5. Результат: безперервний витік RAM і падіння купи!</tspan></text>
<rect x="390.0" y="75.0" width="335.0" height="215.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="557.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Штатний процес звільнення пам'яті</text>
<rect x="400.0" y="115.0" width="315.0" height="160.0" rx="6" fill="#ffffff" stroke="#c3e6cb" stroke-width="1.5"/><text x="557.5" y="168.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="557.5" dy="0.0">1. Високорівневі задачі переходять у стан Blocked</tspan><tspan x="557.5" dy="11.7">   через vTaskDelay(), очікування семафора чи черги.</tspan><tspan x="557.5" dy="11.7">2. Планувальник перемикає контекст на Idle Task (пріоритет 0).</tspan><tspan x="557.5" dy="11.7">3. prvCheckTasksWaitingTermination() бере блоки зі списку.</tspan><tspan x="557.5" dy="11.7">4. Викликаються vPortFree(pxTCB-&gt;pxStack) та vPortFree(pxTCB).</tspan><tspan x="557.5" dy="11.7">5. Купа FreeRTOS повністю повертає виділену пам'ять.</tspan></text>
<line x1="370.0" y1="180.0" x2="390.0" y2="180.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35.0" y="305.0" width="690.0" height="60.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.5"/><text x="380.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Золоте правило архітектури FreeRTOS: якщо в системі динамічно створюються й видаляються задачі,</tspan><tspan x="380.0" dy="13.7">задачі високих пріоритетів обов'язково повинні періодично блокуватися. Голодування Idle Task</tspan><tspan x="380.0" dy="13.7">унеможливлює вивільнення TCB і стеків, перетворюючи завершені задачі на «зомбі-пам'ять».</tspan></text>
</svg>