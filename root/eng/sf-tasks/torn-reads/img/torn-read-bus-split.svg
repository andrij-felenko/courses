<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний механізм розривного читання (Torn Read) на 32-бітній шині</text>
<text x="590.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний механізм розривного читання (Torn Read) на 32-бітній шині</text>
<rect x="30.0" y="65.0" width="340.0" height="525.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="200.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Ядро 0: Письменник (Writer)</text>
<text x="200.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Запис 64-бітного значення 0x00000001_FFFFFFFF</text>
<rect x="50.0" y="145.0" width="300.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Початковий стан пам'яті:</tspan><tspan x="200.0" dy="15.6">0x00000000_00000000</tspan><tspan x="200.0" dy="15.6">Цільове: 0x00000001_FFFFFFFF</tspan></text>
<rect x="50.0" y="255.0" width="300.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Крок 1 (Шинна транзакція 1):</tspan><tspan x="200.0" dy="15.6">Запис молодших 32 бітів (Low 32)</tspan><tspan x="200.0" dy="15.6">STR W1, [addr] -&gt; 0xFFFFFFFF</tspan></text>
<line x1="200.0" y1="335.0" x2="200.0" y2="375.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="375.0" width="300.0" height="65.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">ПАУЗА / ПЕРЕМИКАННЯ ШИНИ:</tspan><tspan x="200.0" dy="15.6">Шина перехоплюється Ядром 1</tspan><tspan x="200.0" dy="15.6">Старше слово ще НЕ записане!</tspan></text>
<line x1="200.0" y1="440.0" x2="200.0" y2="475.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="475.0" width="300.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="498.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Крок 2 (Шинна транзакція 2):</tspan><tspan x="200.0" dy="15.6">Запис старших 32 бітів (High 32)</tspan><tspan x="200.0" dy="15.6">STR W2, [addr+4] -&gt; 0x00000001</tspan><tspan x="200.0" dy="15.6">(Запізнілий запис)</tspan></text>
<rect x="400.0" y="65.0" width="380.0" height="525.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="590.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична пам'ять (RAM / L1-L2)</text>
<text x="590.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Ширина апаратної шини даних — 32 біти (4 байти)</text>
<rect x="420.0" y="145.0" width="340.0" height="75.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Стан 0 (До запису):</tspan><tspan x="590.0" dy="15.6">[addr+4] = 0x00000000 (High)</tspan><tspan x="590.0" dy="15.6">[addr+0] = 0x00000000 (Low)</tspan></text>
<rect x="420.0" y="255.0" width="340.0" height="185.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="590.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">РОЗРИВНИЙ СТАН ПАМ'ЯТІ (Torn State)</text>
<rect x="435.0" y="295.0" width="310.0" height="55.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="318.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">[addr+4] = 0x00000000 (СТАРЕ High)</tspan><tspan x="590.0" dy="15.6">[addr+0] = 0xFFFFFFFF (НОВЕ Low)</tspan></text>
<text x="590.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сумарне значення в комірці:</text>
<text x="590.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">0x00000000_FFFFFFFF = 4 294 967 295</text>
<text x="590.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">Фантомне число: лічильник стрибнув угору!</text>
<rect x="420.0" y="475.0" width="340.0" height="85.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="498.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Стан 2 (Після завершення кроку 2):</tspan><tspan x="590.0" dy="15.6">[addr+4] = 0x00000001 (High)</tspan><tspan x="590.0" dy="15.6">[addr+0] = 0xFFFFFFFF (Low)</tspan><tspan x="590.0" dy="15.6">Повне коректне значення: 8 589 934 591</tspan></text>
<rect x="810.0" y="65.0" width="340.0" height="525.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="980.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро 1: Читач (Reader)</text>
<text x="980.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Зчитування 64-бітного значення uint64_t</text>
<rect x="830.0" y="255.0" width="300.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="273.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">Цикл читання 1:</tspan><tspan x="980.0" dy="15.6">Зчитування молодших 32 бітів</tspan><tspan x="980.0" dy="15.6">LDR R0, [addr] -&gt; 0xFFFFFFFF</tspan><tspan x="980.0" dy="15.6">(Отримано нові дані)</tspan></text>
<line x1="830.0" y1="290.0" x2="760.0" y2="290.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="980.0" y1="330.0" x2="980.0" y2="360.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="830.0" y="360.0" width="300.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="378.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">Цикл читання 2:</tspan><tspan x="980.0" dy="15.6">Зчитування старших 32 бітів</tspan><tspan x="980.0" dy="15.6">LDR R1, [addr+4] -&gt; 0x00000000</tspan><tspan x="980.0" dy="15.6">(Отримано старі дані)</tspan></text>
<line x1="830.0" y1="395.0" x2="760.0" y2="335.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="980.0" y1="435.0" x2="980.0" y2="465.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="830.0" y="465.0" width="300.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="980.0" y="493.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">РЕЗУЛЬТАТ РОЗРИВНОГО ЧИТАННЯ:</tspan><tspan x="980.0" dy="15.6">Регістри: R1:R0 = 0x00000000_FFFFFFFF</tspan><tspan x="980.0" dy="15.6">Значення: 4 294 967 295</tspan><tspan x="980.0" dy="15.6">Крах логіки: значення пошкоджено!</tspan></text>
</svg>