<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Невирівняний доступ до пам'яті через межу кеш-ліній (Split Lock)</text>
<text x="590.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Невирівняний доступ до пам'яті через межу кеш-ліній (Split Lock)</text>
<rect x="40.0" y="55.0" width="1100.0" height="235.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="590.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл 64-байтових ліній кешу L1 у фізичній пам'яті</text>
<rect x="60.0" y="100.0" width="500.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="310.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Кеш-лінія N (Адреса 0x...00 — 0x...3F, 64 байти)</text>
<rect x="80.0" y="145.0" width="390.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="275.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Байти 0 .. 59 (Вирівняна частина)</text>
<rect x="480.0" y="145.0" width="70.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="515.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">60..63</text>
<rect x="620.0" y="100.0" width="500.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="870.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Кеш-лінія N+1 (Адреса 0x...40 — 0x...7F, 64 байти)</text>
<rect x="630.0" y="145.0" width="70.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="665.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">64..67</text>
<rect x="710.0" y="145.0" width="390.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="905.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Байти 68 .. 127 (Вирівняна частина)</text>
<line x1="590.0" y1="95.0" x2="590.0" y2="215.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="590.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Межа кеш-лінії (64 байти)</text>
<rect x="470.0" y="245.0" width="240.0" height="35.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="590.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Невирівняна 64-бітна змінна (8 байтів)</text>
<line x1="515.0" y1="195.0" x2="515.0" y2="245.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="665.0" y1="195.0" x2="665.0" y2="245.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="310.0" width="530.0" height="245.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="305.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">А. Звичайний неатомарний доступ (Torn Read)</text>
<rect x="60.0" y="355.0" width="490.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="373.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Процесор змушений виконати ДВІ окремі операції читання кешу:</tspan><tspan x="305.0" dy="15.6">1. Читання кеш-лінії N -&gt; 2. Читання кеш-лінії N+1</tspan></text>
<rect x="60.0" y="410.0" width="490.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Апаратна вразливість:</tspan><tspan x="305.0" dy="15.6">Якщо інше ядро оновлює лінію N+1 між цими двома тактами,</tspan><tspan x="305.0" dy="15.6">читач отримує пошкоджені розірвані дані (Torn Read)</tspan></text>
<rect x="60.0" y="480.0" width="490.0" height="55.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="305.0" y="503.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Результат: Втрата когерентності на рівні змінної,</tspan><tspan x="305.0" dy="15.6">виникнення прихованих пошкоджень пам'яті під навантаженням</tspan></text>
<rect x="610.0" y="310.0" width="530.0" height="245.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="875.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Б. Атомарний Split Lock (LOCK CMPXCHG)</text>
<rect x="630.0" y="355.0" width="490.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="875.0" y="373.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Кеш-блокування (Cache Lock) неможливе:</tspan><tspan x="875.0" dy="15.6">MESI працює лише в межах однієї лінії</tspan></text>
<rect x="630.0" y="410.0" width="490.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="875.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">Апаратне блокування шини (Bus Lock / Split Lock):</tspan><tspan x="875.0" dy="15.6">Процесор активує сигнал #LOCK на системній шині,</tspan><tspan x="875.0" dy="15.6">заморожуючи пам'ять для ВСІХ ядер на ~250-400 нс</tspan></text>
<rect x="630.0" y="480.0" width="490.0" height="55.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/><text x="875.0" y="503.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Результат: Катастрофічне падіння пропускної здатності CPU,</tspan><tspan x="875.0" dy="15.6">ризик відмови у системному обслуговуванні (DoS)</tspan></text>
</svg>