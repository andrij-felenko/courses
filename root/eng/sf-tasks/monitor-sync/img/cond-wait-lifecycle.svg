<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл виклику wait: атомарний перехід, сон і повторний замок</text>
<rect x="30.0" y="65.0" width="175.0" height="240.0" rx="8" fill="#ebf3fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="117.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Крок 1: Запит</text>
<rect x="45.0" y="110.0" width="145.0" height="48.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="117.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">М'ютекс: УТРИМУЄТЬСЯ</text>
<text x="117.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Потік у критичній секції</text>
<text x="117.5" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Предикат хибний:</text>
<text x="117.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">queue.empty() == true</text>
<text x="117.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Виклик:</text>
<text x="117.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">cond_wait(&amp;c, &amp;m)</text>
<line x1="205.0" y1="185.0" x2="230.0" y2="185.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="230.0" y="65.0" width="175.0" height="240.0" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2.0"/>
<text x="317.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">Крок 2: Засинання</text>
<rect x="245.0" y="110.0" width="145.0" height="48.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="317.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">М'ютекс: ВІДПУЩЕНО</text>
<text x="317.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Атомарно з переходом у сон</text>
<text x="317.5" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Потік у черзі CV:</text>
<text x="317.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стан: BLOCKED (сон)</text>
<text x="317.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">CPU не витрачається</text>
<text x="317.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Чекає на сигнал у ядрі</text>
<line x1="405.0" y1="185.0" x2="430.0" y2="185.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="430.0" y="65.0" width="175.0" height="240.0" rx="8" fill="#fef5e7" stroke="#d35400" stroke-width="2.0"/>
<text x="517.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">Крок 3: Сигнал</text>
<rect x="445.0" y="110.0" width="145.0" height="48.0" rx="5" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/>
<text x="517.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">cond_signal(&amp;c)</text>
<text x="517.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Виробник додав дані</text>
<text x="517.5" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік прокинувся,</text>
<text x="517.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">але НЕ працює!</text>
<text x="517.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Чекає в черзі м'ютексу</text>
<text x="517.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">pthread_mutex_lock(&amp;m)</text>
<line x1="605.0" y1="185.0" x2="630.0" y2="185.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="630.0" y="65.0" width="175.0" height="240.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="717.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Крок 4: Вихід</text>
<rect x="645.0" y="110.0" width="145.0" height="48.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="717.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">М'ютекс: ЗНОВУ ЗАХОПЛЕНО</text>
<text x="717.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">wait() завершив роботу</text>
<text x="717.5" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обов'язкова дія:</text>
<text x="717.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Повторна перевірка while!</text>
<text x="717.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Якщо готова — забирає,</text>
<text x="717.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">якщо ні — знову wait()</text>
<rect x="30.0" y="318.0" width="775.0" height="30.0" rx="4" fill="#fdfefe" stroke="#6b7280" stroke-width="1.0"/>
<text x="417.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключова гарантія: вихід із wait() відбувається ВИКЛЮЧНО з захопленим м'ютексом</text>
</svg>