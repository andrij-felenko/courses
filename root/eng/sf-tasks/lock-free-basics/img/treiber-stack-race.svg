<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек Трайбера: конкурентне додавання вузла (Push) через CAS</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Потік готує новий вузол локально, скеровує його next на поточний Head і атомарно перемикає Head</text>
<text x="160.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Початковий стек:</text>
<rect x="60.0" y="110.0" width="90.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="105.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Head</text>
<rect x="190.0" y="110.0" width="90.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="235.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Node A</text>
<rect x="320.0" y="110.0" width="90.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="365.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Node B</text>
<line x1="150.0" y1="127.0" x2="190.0" y2="127.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="127.0" x2="320.0" y2="127.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Новий вузол (локально у Потоку 1):</text>
<rect x="570.0" y="110.0" width="110.0" height="34.0" rx="6" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.5"/>
<text x="625.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">New Node X</text>
<text x="680.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">1. Node X-&gt;next = Node A (старий Head)</text>
<line x1="570.0" y1="127.0" x2="280.0" y2="127.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="50.0" y1="200.0" x2="830.0" y2="200.0" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="440.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. CAS(&amp;Head, expected=Node A, desired=Node X)</text>
<rect x="100.0" y="260.0" width="90.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="145.0" y="280.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Head</text>
<rect x="250.0" y="260.0" width="110.0" height="34.0" rx="6" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.5"/>
<text x="305.0" y="280.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Node X</text>
<rect x="420.0" y="260.0" width="90.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="465.0" y="280.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Node A</text>
<rect x="570.0" y="260.0" width="90.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="615.0" y="280.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Node B</text>
<line x1="190.0" y1="277.0" x2="250.0" y2="277.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="360.0" y1="277.0" x2="420.0" y2="277.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="277.0" x2="570.0" y2="277.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="340.0" width="780.0" height="46.6" rx="6" fill="#fff8e6" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Якщо інший потік встиг вставити свій вузол між кроками 1 і 2, Head вже не дорівнює Node A.</tspan><tspan x="440.0" dy="14.3">CAS повертає false, Node X переприв'язується до нового Head, і спроба повторюється без дедлоків.</tspan></text>
</svg>