<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 956.78 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="956.78" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класичний цикл оновлення на базі CAS (Optimistic Retry Loop)</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Оптимістична спроба: читаємо стан, рахуємо зміну локально, намагаємося зафіксувати через CAS</text>
<rect x="320.0" y="80.0" width="240.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="440.0" y="101.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Читаємо поточний стан (old)</text>
<rect x="320.0" y="145.0" width="240.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="440.0" y="166.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Рахуємо новий стан (new) у регістрах</text>
<rect x="290.0" y="210.0" width="300.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="228.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">3. CAS(&amp;target, expected=old, desired=new)</tspan><tspan x="440.0" dy="14.3">[Атомарна спроба запису]</tspan></text>
<line x1="440.0" y1="116.0" x2="440.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="181.0" x2="440.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="290.0" width="220.0" height="40.0" rx="6" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">УСПІХ (true):</tspan><tspan x="230.0" dy="14.3">Дію зафіксовано, вихід</tspan></text>
<line x1="340.0" y1="254.0" x2="230.0" y2="290.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="255.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Конфлікту не було</text>
<rect x="540.0" y="290.0" width="240.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">НЕВДАЧА (false):</tspan><tspan x="660.0" dy="14.3">Хтось встиг змінити target раніше</tspan></text>
<line x1="540.0" y1="254.0" x2="630.0" y2="290.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="625.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Конфлікт оновлення</text>
<line x1="780.0" y1="310.0" x2="820.0" y2="310.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="820.0" y1="310.0" x2="820.0" y2="98.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="820.0" y1="98.0" x2="560.0" y2="98.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="825.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Повтор зі свіжим станом</text>
<rect x="50.0" y="360.0" width="780.0" height="46.6" rx="6" fill="#fff8e6" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Невдача в CAS означає, що ЯКИЙСЬ ІНШИЙ потік успішно завершив свою роботу.</tspan><tspan x="440.0" dy="14.3">Отже, вся система гарантовано робить поступ (lock-free прогрес).</tspan></text>
</svg>