<text x="460.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Алокатор виділяє для нового вузла ТУ САМУ адресу A! Стек: [A* -&gt; C].</text>
<text x="70.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Крок 4</text>
