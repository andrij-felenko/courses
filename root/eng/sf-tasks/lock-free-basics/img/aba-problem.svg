<text x="380.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Потік 1 прокидається: CAS(Head, A, B) успішний! Head стає B (сміття/краш). Node C загублено!</text>
<rect x="50.0" y="365.0" width="780.0" height="46.6" rx="6" fill="#fff8e6" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Розв'язання ABA: Tagged Pointers (лічильник генерації разом із покажчиком) або</tspan><tspan x="440.0" dy="14.3">безпечне керування пам'яттю (Hazard Pointers / Epoch-Based Reclamation).</tspan></text>
