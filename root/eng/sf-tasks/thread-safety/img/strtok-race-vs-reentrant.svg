<text x="605.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ПОВНА ПОТОКОВА БЕЗПЕКА ТА РЕЕНТРАБЕЛЬНІСТЬ</text>
<text x="605.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Кожен потік володіє власним станом на стеку.</text>
<text x="605.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Блокування відсутні, масштабування лінійне.</text>
