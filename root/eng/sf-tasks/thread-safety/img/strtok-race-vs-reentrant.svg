<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія гонки: внутрішній статичний буфер strtok проти стека strtok_r</text>
<rect x="30.0" y="55.0" width="370.0" height="360.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="215.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">strtok() — Статичний спільний стан</text>
<rect x="75.0" y="103.0" width="280.0" height="50.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="215.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">static char* last_ptr (Глобальна пам'ять)</text>
<text x="215.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Єдиний спільний вказівник на всю програму</text>
<rect x="50.0" y="185.0" width="155.0" height="120.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="127.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Потік 1: розбір URI</text>
<text x="127.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Рядок: &quot;a/b/c&quot;</text>
<text x="127.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">strtok(&quot;a/b/c&quot;, &quot;/&quot;)</text>
<text x="127.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">last_ptr = &amp;&quot;b/c&quot;</text>
<rect x="225.0" y="185.0" width="155.0" height="120.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="302.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Потік 2: розбір CSV</text>
<text x="302.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Рядок: &quot;1,2,3&quot;</text>
<text x="302.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">strtok(&quot;1,2,3&quot;, &quot;,&quot;)</text>
<text x="302.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">last_ptr = &amp;&quot;2,3&quot;</text>
<line x1="127.0" y1="185.0" x2="150.0" y2="153.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="302.0" y1="185.0" x2="280.0" y2="153.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="325.0" width="330.0" height="70.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="215.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ПОШКОДЖЕННЯ ДАНИХ ТА АВАРІЯ</text>
<text x="215.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Потік 2 затирає last_ptr Потоку 1.</text>
<text x="215.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Наступний strtok(NULL) прочитає чужий буфер!</text>
