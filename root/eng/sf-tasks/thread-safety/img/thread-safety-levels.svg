<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 966.5 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="966.5" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр і рівні потокової безпеки коду</text>
<rect x="30.0" y="55.0" width="760.0" height="75.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<rect x="30.0" y="55.0" width="8.0" height="75.0" rx="2" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">1. Потоконебезпечний (Thread-Unsafe)</text>
<text x="50.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Спільний мутабельний стан без синхронізації. Одночасний виклик кількома потоками призводить до перегонів даних, пошкодження пам'яті та аварійного завершення.</text>
<text x="50.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Приклади: strtok(), asctime(), несинхронізовані глобальні лічильники.</text>
<rect x="30.0" y="138.0" width="760.0" height="75.0" rx="6" fill="#fef8f0" stroke="#e08a1e" stroke-width="1.5"/>
<rect x="30.0" y="138.0" width="8.0" height="75.0" rx="2" fill="#e08a1e" stroke="#e08a1e" stroke-width="1.0"/>
<text x="50.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="start" font-weight="700">2. Прив'язаний до потоку (Thread-Affinity)</text>
<text x="50.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Код або об'єкт може безпечно викликатися виключно з одного конкретного потоку (наприклад, головного потоку GUI або циклу подій). Доступ з інших потоків заборонено.</text>
<text x="50.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Приклади: віджети Qt/GTK, OpenGL-контексти, однопотокові апартаменти COM.</text>
<rect x="30.0" y="221.0" width="760.0" height="75.0" rx="6" fill="#fefdf0" stroke="#d4ac0d" stroke-width="1.5"/>
<rect x="30.0" y="221.0" width="8.0" height="75.0" rx="2" fill="#d4ac0d" stroke="#d4ac0d" stroke-width="1.0"/>
<text x="50.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d4ac0d" text-anchor="start" font-weight="700">3. Умовно безпечний (Conditionally Thread-Safe)</text>
<text x="50.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Різні потоки можуть одночасно працювати з різними екземплярами об'єкта. Одночасний доступ кількох потоків до одного екземпляра вимагає зовнішнього замка.</text>
<text x="50.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Приклади: std::vector, std::string, більшість класів стандартних бібліотек.</text>
<rect x="30.0" y="304.0" width="760.0" height="75.0" rx="6" fill="#edf2fc" stroke="#2457d6" stroke-width="1.5"/>
<rect x="30.0" y="304.0" width="8.0" height="75.0" rx="2" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="50.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">4. Потокобезпечний (Thread-Safe)</text>
<text x="50.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Внутрішній стан повністю синхронізовано (замками або атоміками). Довільна кількість потоків може одночасно викликати будь-які операції без зовнішніх блокувань.</text>
<text x="50.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Приклади: concurrent_queue, std::atomic, потокобезпечні пули з'єднань.</text>
<rect x="30.0" y="387.0" width="760.0" height="75.0" rx="6" fill="#edfbf2" stroke="#27ae60" stroke-width="1.5"/>
<rect x="30.0" y="387.0" width="8.0" height="75.0" rx="2" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="50.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">5. Реентрабельний (Reentrant)</text>
<text x="50.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Функція не використовує глобальний чи статичний стан; працює лише з локальним стеком та аргументами. Безпечна для повторного входу з обробників сигналів.</text>
<text x="50.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Приклади: strtok_r(), memcpy(), математичні функції без побічних ефектів.</text>
</svg>