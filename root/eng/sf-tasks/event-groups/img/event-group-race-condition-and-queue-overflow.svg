<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Втрата подій в Event Groups: гонитва ручного скидання та переповнення черги</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Затримка ручного ClearBits стирає проміжний біт, а сплеск переривань переповнює xTimerQueue (pdFAIL)</text>

  <!-- ПАНЕЛЬ 1: Ручне скидання -->
  <rect x="24" y="72" width="912" height="228" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="94" font-size="14" font-weight="700" fill="#1a1a1a">1. Гонитва станів: затримка ручного скидання бітів (xClearOnExit = pdFALSE)</text>

  <rect x="610" y="80" width="310" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="765" y="96" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✔ Захист: xClearOnExit = pdTRUE (атомарно в ядрі)</text>

  <line x1="190" y1="108" x2="190" y2="288" stroke="#d0d7de" stroke-width="1"/>

  <!-- Канал 1: ISR -->
  <text x="40" y="128" font-size="13" font-weight="700" fill="#1a1a1a">Переривання ISR</text>
  <text x="40" y="144" font-size="12" fill="#6b7280">Джерело подій</text>

  <!-- Канал 2: uxEventBits -->
  <text x="40" y="180" font-size="13" font-weight="700" fill="#1a1a1a">Регістр uxEventBits</text>
  <text x="40" y="196" font-size="12" fill="#6b7280">Стан BIT_0 у групі</text>

  <!-- Канал 3: Задача -->
  <text x="40" y="234" font-size="13" font-weight="700" fill="#1a1a1a">Прикладна задача</text>
  <text x="40" y="250" font-size="12" fill="#6b7280">Контекст потоку</text>

  <!-- Хвиля ISR 1 -->
  <path d="M 200 144 L 255 144 L 255 124 L 285 124 L 285 144 L 475 144 L 475 124 L 505 124 L 505 144 L 620 144" fill="none" stroke="#2457d6" stroke-width="2"/>
  <rect x="246" y="106" width="48" height="16" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="270" y="119" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Подія 1</text>

  <rect x="466" y="106" width="48" height="16" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="490" y="119" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Подія 2</text>

  <!-- Хвиля uxEventBits -->
  <path d="M 200 196 L 285 196 L 285 174 L 655 174 L 655 196 L 910 196" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="204" y="192" font-size="12" fill="#6b7280">0</text>
  <text x="294" y="168" font-size="12" font-weight="700" fill="#2457d6">BIT_0 = 1</text>

  <!-- Підсвічування накладання Події 2 на вже активний біт -->
  <rect x="430" y="158" width="190" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="525" y="171" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Біт уже 1 (немає лічильника)</text>

  <!-- Задача стани -->
  <rect x="200" y="222" width="115" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="257" y="241" font-size="12" fill="#6b7280" text-anchor="middle">Сон (WaitBits)</text>

  <rect x="327" y="222" width="295" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="474" y="241" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Обробка Події 1 (затримка виконання)</text>

  <rect x="634" y="222" width="92" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="680" y="241" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">ClearBits()</text>

  <rect x="738" y="222" width="174" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="825" y="241" font-size="12" fill="#6b7280" text-anchor="middle">Сон (очікує BIT_0)</text>

  <!-- Повідомлення про втрату 1 -->
  <rect x="630" y="108" width="285" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="772" y="125" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">❌ ПОДІЯ 2 ВТРАЧЕНА НАЗАВЖДИ!</text>
  <text x="772" y="141" font-size="12" fill="#1a1a1a" text-anchor="middle">ClearBits() скинув біт до 0 перед обробкою</text>

  <!-- Стрілка втрати в Panel 1 -->
  <line x1="505" y1="124" x2="625" y2="124" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>

  <!-- Шкала часу Panel 1 -->
  <line x1="200" y1="266" x2="880" y2="266" stroke="#d0d7de" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="888" y="270" font-size="12" fill="#6b7280">Час t</text>
  <text x="270" y="284" font-size="12" fill="#2457d6" text-anchor="middle">t₁: Подія 1</text>
  <text x="360" y="284" font-size="12" fill="#2457d6" text-anchor="middle">t₂: Старт</text>
  <text x="490" y="284" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t₃: Подія 2</text>
  <text x="680" y="284" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t₄: ClearBits</text>
  <text x="825" y="284" font-size="12" fill="#6b7280" text-anchor="middle">t₅: Сон</text>

  <!-- ПАНЕЛЬ 2: Сплеск ISR -->
  <rect x="24" y="312" width="912" height="228" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="334" font-size="14" font-weight="700" fill="#1a1a1a">2. Сплеск переривань: переповнення командної черги xTimerQueue</text>

  <rect x="560" y="320" width="360" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="740" y="336" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✔ Захист: збільшити чергу або Direct Task Notifications</text>

  <line x1="190" y1="348" x2="190" y2="528" stroke="#d0d7de" stroke-width="1"/>

  <text x="40" y="368" font-size="13" font-weight="700" fill="#1a1a1a">Сплеск ISR (IRQ)</text>
  <text x="40" y="384" font-size="12" fill="#6b7280">SetBitsFromISR()</text>

  <text x="40" y="420" font-size="13" font-weight="700" fill="#1a1a1a">Черга xTimerQueue</text>
  <text x="40" y="436" font-size="12" fill="#6b7280">Місткість N = 3 слоти</text>

  <text x="40" y="474" font-size="13" font-weight="700" fill="#1a1a1a">Демон таймерів</text>
  <text x="40" y="490" font-size="12" fill="#6b7280">prvTimerTask (потік)</text>

  <!-- Імпульси IRQ -->
  <path d="M 200 384 L 220 384 L 220 364 L 246 364 L 246 384 L 276 384 L 276 364 L 302 364 L 302 384 L 332 384 L 332 364 L 358 364 L 358 384 L 400 384 L 400 364 L 430 364 L 430 384 L 590 384" fill="none" stroke="#2457d6" stroke-width="2"/>

  <rect x="214" y="346" width="38" height="16" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="233" y="359" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">IRQ 1</text>

  <rect x="270" y="346" width="38" height="16" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="289" y="359" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">IRQ 2</text>

  <rect x="326" y="346" width="38" height="16" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="345" y="359" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">IRQ 3</text>

  <rect x="392" y="346" width="46" height="16" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="415" y="359" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">IRQ 4</text>

  <!-- Стан черги -->
  <rect x="200" y="412" width="50" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="225" y="429" font-size="12" fill="#6b7280" text-anchor="middle">0 / 3</text>

  <rect x="256" y="412" width="62" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="287" y="429" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">1/3 [E1]</text>

  <rect x="324" y="412" width="62" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="355" y="429" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">2/3 [E2]</text>

  <rect x="392" y="412" width="80" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="432" y="429" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">3/3 FULL</text>

  <rect x="480" y="412" width="95" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="527" y="429" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">pdFAIL (відмова)</text>

  <rect x="595" y="412" width="120" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="655" y="429" font-size="12" fill="#27ae60" text-anchor="middle">Спорожнення (0/3)</text>

  <!-- Стан Демона -->
  <rect x="200" y="466" width="320" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="360" y="485" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Витіснений серією ISR (не може спорожнити чергу)</text>

  <rect x="532" y="466" width="220" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="642" y="485" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Обробка E1..E3 ➔ SetBits()</text>

  <rect x="764" y="466" width="150" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="839" y="485" font-size="12" fill="#6b7280" text-anchor="middle">E4 не надійшла!</text>

  <!-- Повідомлення про відмову IRQ 4 -->
  <rect x="605" y="348" width="308" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="759" y="365" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">❌ ПОДІЯ 4 ВТРАЧЕНА В ISR!</text>
  <text x="759" y="381" font-size="12" fill="#1a1a1a" text-anchor="middle">xTimerQueue повна: SetBitsFromISR вернув pdFAIL</text>

  <!-- Стрілка скидання IRQ 4 -->
  <line x1="430" y1="364" x2="600" y2="364" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>

  <!-- Шкала часу Panel 2 -->
  <line x1="200" y1="508" x2="880" y2="508" stroke="#d0d7de" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="888" y="512" font-size="12" fill="#6b7280">Час t</text>
  <text x="233" y="524" font-size="12" fill="#2457d6" text-anchor="middle">t₁</text>
  <text x="289" y="524" font-size="12" fill="#2457d6" text-anchor="middle">t₂</text>
  <text x="345" y="524" font-size="12" fill="#2457d6" text-anchor="middle">t₃</text>
  <text x="415" y="524" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t₄: pdFAIL</text>
  <text x="642" y="524" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">t₅: Старт prvTimerTask</text>
  <text x="839" y="524" font-size="12" fill="#6b7280" text-anchor="middle">t₆: IRQ 4 втрачено</text>
</svg>
