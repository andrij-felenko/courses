<rect x="670.0" y="230.0" width="125.0" height="46.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="732.5" y="250.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="732.5" dy="0.0">become(new_state)</tspan><tspan x="732.5" dy="12.3">зміна логіки</tspan></text>
