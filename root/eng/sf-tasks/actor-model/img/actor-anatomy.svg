<line x1="635.0" y1="220.0" x2="653.0" y2="220.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40.0" y="355.0" width="800.0" height="47.7" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Актор складається з трьох частин: поштової скриньки, ізольованого приватного стану та поточної поведінки.</tspan><tspan x="440.0" dy="14.3">Повідомлення обробляються строго по одному — це усуває стан гонки без застосування замків чи блокувань.</tspan></text>
