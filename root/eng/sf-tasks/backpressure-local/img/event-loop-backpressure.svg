<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асинхронний протитиск у циклі подій (Reactor / epoll / Event Loop)</text>
<text x="460.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Керування масками дескрипторів EPOLLIN / EPOLLOUT без блокування робочого потоку</text>
<rect x="50.0" y="80.0" width="240.0" height="265.0" rx="8" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="170.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Вхідний дескриптор</text>
<text x="170.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Source Socket / fd_in)</text>
<rect x="65.0" y="138.0" width="210.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="155.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">epoll_ctl(EPOLL_CTL_MOD)</tspan><tspan x="170.0" dy="12.3">Маска: EPOLLIN</tspan></text>
<rect x="65.0" y="188.0" width="210.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Реакція на переповнення:</tspan><tspan x="170.0" dy="12.3">Зняти EPOLLIN з fd_in;</tspan><tspan x="170.0" dy="12.3">ядро перестає будити цикл</tspan></text>
<rect x="65.0" y="250.0" width="210.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Реакція на дренаж (LWM):</tspan><tspan x="170.0" dy="12.3">Повернути EPOLLIN;</tspan><tspan x="170.0" dy="12.3">відновити читання байтів</tspan></text>
<text x="170.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Ядро затримує TCP вікно (Zero-Window)</text>
<line x1="290.0" y1="200.0" x2="340.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="315.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">read()</text>
<rect x="340.0" y="80.0" width="240.0" height="265.0" rx="8" fill="#fef5e7" stroke="#d35400" stroke-width="1.6"/>
<text x="460.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">Буфер застосунку</text>
<text x="460.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(User-space Stream Queue)</text>
<rect x="355.0" y="138.0" width="210.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="155.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">write(chunk) -&gt; false</tspan><tspan x="460.0" dy="12.3">Буфер досяг HWM (64 KB)</tspan></text>
<rect x="355.0" y="188.0" width="210.0" height="52.0" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="460.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Сигнал протитиску:</tspan><tspan x="460.0" dy="12.3">Джерело призупиняється</tspan><tspan x="460.0" dy="12.3">stream.pause()</tspan></text>
<rect x="355.0" y="250.0" width="210.0" height="52.0" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="460.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Подія 'drain':</tspan><tspan x="460.0" dy="12.3">Буфер спорожнів &lt; LWM</tspan><tspan x="460.0" dy="12.3">stream.resume()</tspan></text>
<text x="460.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Пам'ять процесу під строгим контролем</text>
<line x1="580.0" y1="200.0" x2="630.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="605.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">write()</text>
<rect x="630.0" y="80.0" width="240.0" height="265.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="750.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вихідний дескриптор</text>
<text x="750.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Sink Socket / fd_out)</text>
<rect x="645.0" y="138.0" width="210.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="155.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">write() повертає EAGAIN</tspan><tspan x="750.0" dy="12.3">Буфер сокета ядра повний</tspan></text>
<rect x="645.0" y="188.0" width="210.0" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Реєстрація EPOLLOUT:</tspan><tspan x="750.0" dy="12.3">Чекати готовності сокета</tspan><tspan x="750.0" dy="12.3">на запис нових байтів</tspan></text>
<rect x="645.0" y="250.0" width="210.0" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Скидання даних у мережу:</tspan><tspan x="750.0" dy="12.3">Видалити EPOLLOUT після</tspan><tspan x="750.0" dy="12.3">повного спустошення черги</tspan></text>
<text x="750.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Асинхронне виштовхування без зависання</text>
<line x1="650.0" y1="305.0" x2="270.0" y2="305.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4"/>
<line x1="270.0" y1="305.0" x2="245.0" y2="305.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="460.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ланцюг зворотного протитиску (Backpressure Chain)</text>
<rect x="40.0" y="380.0" width="840.0" height="47.7" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="460.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">В асинхронних однопотокових циклах (Node.js, Tokio, libuv, epoll) блокувати потік викликом sleep() заборонено.</tspan><tspan x="460.0" dy="14.3">Протитиск реалізується через маніпуляцію прапорцями подій ядра (EPOLLIN/EPOLLOUT) та подію вичерпання черги (drain).</tspan></text>
</svg>