<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 920 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-20" y="-10" width="920" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динаміка заповнення буфера: гістерезис водяних знаків (HWM / LWM)</text>
<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Гістерезисна зона запобігає високочастотному деренчанню перемикань (thrashing) між блокуванням і розблокуванням</text>
<rect x="70.0" y="80.0" width="520.0" height="260.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="71.0" y="150.0" width="518.0" height="120.0" rx="6" fill="#fff9e6" stroke="none" stroke-width="1.5"/>
<line x1="70.0" y1="150.0" x2="590.0" y2="150.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,3"/>
<line x1="70.0" y1="270.0" x2="590.0" y2="270.0" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="5,3"/>
<line x1="70.0" y1="100.0" x2="590.0" y2="100.0" stroke="#888888" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="62.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Ємність N (100%)</text>
<text x="62.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">HWM (80%)</text>
<text x="62.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">LWM (30%)</text>
<text x="62.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">0</text>
<text x="575.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">Зупинка виробника (Pause / Block)</text>
<text x="575.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">Відновлення виробника (Resume / Unblock)</text>
<path d="M 90 320 L 200 150 L 320 270 L 440 150 L 560 270" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<circle cx="200.0" cy="150.0" r="5.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="320.0" cy="270.0" r="5.0" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="440.0" cy="150.0" r="5.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="560.0" cy="270.0" r="5.0" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
<text x="145.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Наповнення</text>
<text x="145.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Виробник &gt; Споживач)</text>
<text x="260.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Дренаж (Drain)</text>
<text x="260.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Виробник спить)</text>
<rect x="620.0" y="80.0" width="245.0" height="260.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<text x="742.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура кільцевого буфера</text>
<rect x="635.0" y="125.0" width="215.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="742.5" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Head (Споживач читає)</text>
<rect x="635.0" y="168.0" width="215.0" height="34.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="742.5" y="188.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Tail (Виробник пише)</text>
<rect x="635.0" y="211.0" width="215.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="742.5" y="229.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Заповнення:</tspan><tspan x="742.5" dy="12.3">occupancy = (tail - head) &amp; mask</tspan></text>
<rect x="635.0" y="262.0" width="215.0" height="62.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="742.5" y="277.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Правило HWM:</tspan><tspan x="742.5" dy="12.3">occupancy ≥ 80% → pause</tspan><tspan x="742.5" dy="12.3">Правило LWM:</tspan><tspan x="742.5" dy="12.3">occupancy ≤ 30% → resume</tspan></text>
<rect x="35.0" y="365.0" width="830.0" height="62.6" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="450.0" y="385.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Без LWM (якщо будити джерело одразу при HWM - 1) потік прокидається на кожне вилучене повідомлення —</tspan><tspan x="450.0" dy="14.3">це генерує тисячі непотрібних перемикань контексту ядра (context switches) та інвалідацій процесорного кешу.</tspan><tspan x="450.0" dy="14.3">Гістерезис гарантує пакетну обробку даних і стабільну роботу планувальника.</tspan></text>
</svg>