<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимізація циклу опитування компілятором: без volatile проти volatile</text>
<rect x="30.0" y="50.0" width="530.0" height="480.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="295.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Опитування без volatile (Оптимізація LICM)</text>
<text x="295.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Компілятор вважає змінну незмінною в однопотоковому коді</text>
<rect x="55.0" y="125.0" width="480.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">C: while (!(*STATUS_PTR &amp; READY_BIT)) {</tspan><tspan x="295.0" dy="15.6">       /* очікування готовності периферії */</tspan><tspan x="295.0" dy="15.6">   }</tspan></text>
<rect x="55.0" y="195.0" width="480.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">Оптимізатор (GCC/Clang -O2):</tspan><tspan x="295.0" dy="15.6">Виносить читання пам'яті за межі циклу (Loop Invariant)</tspan></text>
<rect x="55.0" y="260.0" width="480.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="292.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">ARM Cortex-M Асемблер:</tspan><tspan x="295.0" dy="13.0">  LDR  R0, [R1]      ; Одноразове читання адреси в регістр R0</tspan><tspan x="295.0" dy="13.0">  TST  R0, #1        ; Перевірка біта готовності</tspan><tspan x="295.0" dy="13.0">.L_loop:</tspan><tspan x="295.0" dy="13.0">  BEQ  .L_loop       ; ЗАВИСАННЯ: перевірка R0 без повторного читання!</tspan></text>
<rect x="55.0" y="385.0" width="480.0" height="125.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="428.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">Апаратний наслідок:</tspan><tspan x="295.0" dy="15.6">- Процесор крутиться у нескінченному циклі в регістрах CPU</tspan><tspan x="295.0" dy="15.6">- Жодної транзакції на системній шині APB/AHB не відбувається</tspan><tspan x="295.0" dy="15.6">- Навіть якщо залізо виставило READY_BIT = 1, CPU цього не побачить</tspan></text>
<rect x="600.0" y="50.0" width="530.0" height="480.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="865.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Опитування через volatile uint32_t*</text>
<text x="865.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Кожне звернення є обов'язковим сайд-ефектом (Side Effect)</text>
<rect x="625.0" y="125.0" width="480.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">C: while (!(*(volatile uint32_t*)STATUS_PTR &amp; READY_BIT)) {</tspan><tspan x="865.0" dy="15.6">       /* очікування готовності периферії */</tspan><tspan x="865.0" dy="15.6">   }</tspan></text>
<rect x="625.0" y="195.0" width="480.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Оптимізатор (GCC/Clang -O2):</tspan><tspan x="865.0" dy="15.6">Заборонено кешувати значення або викидати читання з циклу</tspan></text>
<rect x="625.0" y="260.0" width="480.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="290.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="865.0" dy="0.0">ARM Cortex-M Асемблер:</tspan><tspan x="865.0" dy="14.3">.L_loop:</tspan><tspan x="865.0" dy="14.3">  LDR  R0, [R1]      ; Читання з адреси пам'яті на КОЖНІЙ ітерації!</tspan><tspan x="865.0" dy="14.3">  TST  R0, #1        ; Перевірка біта готовності</tspan><tspan x="865.0" dy="14.3">  BEQ  .L_loop       ; Перехід на початок циклу з новим LDR</tspan></text>
<rect x="625.0" y="385.0" width="480.0" height="125.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="428.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Апаратний наслідок:</tspan><tspan x="865.0" dy="15.6">- На кожній ітерації генерується реальний шинний цикл зчитування</tspan><tspan x="865.0" dy="15.6">- Процесор негайно бачить оновлення апаратного статусу залізом</tspan><tspan x="865.0" dy="15.6">- Цикл коректно завершується після підняття прапорця</tspan></text>
</svg>