<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл обов'язків між volatile, компіляторними бар'єрами та апаратними бар'єрами</text>
<rect x="40.0" y="50.0" width="1080.0" height="140.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="60.0" y="65.0" width="220.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">1. Рівень компілятора</tspan><tspan x="170.0" dy="16.9"></tspan><tspan x="170.0" dy="16.9">Статичний аналіз та</tspan><tspan x="170.0" dy="16.9">генерація інструкцій</tspan></text>
<rect x="300.0" y="65.0" width="390.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Семантика volatile:</tspan><tspan x="495.0" dy="15.6">- Забороняє кешування у регістрах CPU</tspan><tspan x="495.0" dy="15.6">- Забороняє видалення записів (DSE)</tspan><tspan x="495.0" dy="15.6">- Фіксує порядок volatile-доступів в asm</tspan><tspan x="495.0" dy="15.6">- НЕ впорядковує звичайні змінні!</tspan></text>
<rect x="710.0" y="65.0" width="390.0" height="110.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="905.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">Компіляторний бар'єр asm(&quot;&quot; ::: &quot;memory&quot;):</tspan><tspan x="905.0" dy="15.6">- Забороняє компілятору переносити</tspan><tspan x="905.0" dy="15.6">  БУДЬ-ЯКІ читання/записи крізь межу</tspan><tspan x="905.0" dy="15.6">- Скидає змінні з регістрів у RAM</tspan><tspan x="905.0" dy="15.6">- НЕ генерує жодних інструкцій CPU!</tspan></text>
<text x="580.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Згенерований потік машинних інструкцій (Асемблер)</text>
<line x1="350.0" y1="209.0" x2="400.0" y2="209.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="810.0" y1="209.0" x2="760.0" y2="209.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="230.0" width="1080.0" height="135.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="60.0" y="245.0" width="220.0" height="105.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="278.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">2. Рівень процесора і шини</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">Динамічне виконання та</tspan><tspan x="170.0" dy="15.6">апаратна буферизація</tspan></text>
<rect x="300.0" y="245.0" width="800.0" height="105.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="278.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Апаратна мікроархітектура (Out-of-Order, Store Buffers, Write Buffers, Interconnect):</tspan><tspan x="700.0" dy="15.6">- Конвеєр CPU може виконувати шинні запити поза порядком (Out-of-Order)</tspan><tspan x="700.0" dy="15.6">- Буфери запису (Store Buffer) затримують потрапляння даних у пам'ять або периферію</tspan><tspan x="700.0" dy="15.6">- Інструкції volatile в асемблері НЕ захищають від апаратного перевпорядкування шини!</tspan></text>
<text x="580.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">Керування мікроархітектурою через спеціальні інструкції бар'єрів</text>
<line x1="310.0" y1="387.0" x2="360.0" y2="387.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="850.0" y1="387.0" x2="800.0" y2="387.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="410.0" width="1080.0" height="200.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="60.0" y="425.0" width="220.0" height="170.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="480.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">3. Апаратні бар'єри (ARM)</tspan><tspan x="170.0" dy="16.9"></tspan><tspan x="170.0" dy="16.9">Керування конвеєром,</tspan><tspan x="170.0" dy="16.9">буферами запису та</tspan><tspan x="170.0" dy="16.9">шинними транзакціями</tspan></text>
<rect x="300.0" y="425.0" width="260.0" height="170.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="475.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">DMB (Data Memory Barrier):</tspan><tspan x="430.0" dy="15.6"></tspan><tspan x="430.0" dy="15.6">Гарантує строгий порядок доступу</tspan><tspan x="430.0" dy="15.6">до пам'яті: усі попередні</tspan><tspan x="430.0" dy="15.6">звернення завершуються перед</tspan><tspan x="430.0" dy="15.6">наступними для пам'яті та DMA.</tspan></text>
<rect x="575.0" y="425.0" width="260.0" height="170.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="475.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">DSB (Data Synchronization Barrier):</tspan><tspan x="705.0" dy="15.6"></tspan><tspan x="705.0" dy="15.6">Зупиняє виконання коду CPU</tspan><tspan x="705.0" dy="15.6">до повного завершення всіх</tspan><tspan x="705.0" dy="15.6">шинних операцій (скидання буферів</tspan><tspan x="705.0" dy="15.6">запису до MMIO та RAM).</tspan></text>
<rect x="850.0" y="425.0" width="250.0" height="170.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="975.0" y="475.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">ISB (Instruction Sync Barrier):</tspan><tspan x="975.0" dy="15.6"></tspan><tspan x="975.0" dy="15.6">Скидає конвеєр інструкцій CPU,</tspan><tspan x="975.0" dy="15.6">змушуючи вибирати код заново</tspan><tspan x="975.0" dy="15.6">після зміни таблиць векторів</tspan><tspan x="975.0" dy="15.6">або налаштувань MPU.</tspan></text>
</svg>