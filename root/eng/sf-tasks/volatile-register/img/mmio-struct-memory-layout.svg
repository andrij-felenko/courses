<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Організація пам'яті MMIO-структури та відображення регістрів периферії</text>
<rect x="40.0" y="50.0" width="520.0" height="450.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="300.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Апаратна пам'ять периферійного модуля (MMIO)</text>
<rect x="60.0" y="100.0" width="480.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Базова адреса + 0x00: Control Register 1 (CR1)</tspan><tspan x="300.0" dy="15.6">32-бітний регістр конфігурації (RW)</tspan></text>
<rect x="60.0" y="160.0" width="480.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="181.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Базова адреса + 0x04: Control Register 2 (CR2)</tspan><tspan x="300.0" dy="15.6">32-бітний регістр налаштування швидкості (RW)</tspan></text>
<rect x="60.0" y="220.0" width="480.0" height="50.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="241.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Базова адреса + 0x08: Status Register (SR)</tspan><tspan x="300.0" dy="15.6">32-бітний регістр стану заліза (Тільки читання / RO)</tspan></text>
<rect x="60.0" y="280.0" width="480.0" height="50.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="301.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Базова адреса + 0x0C .. +0x10: RESERVED</tspan><tspan x="300.0" dy="15.6">Нездійснені апаратні адреси (Зміщення 8 байтів)</tspan></text>
<rect x="60.0" y="340.0" width="480.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Базова адреса + 0x14: Data Register (DR)</tspan><tspan x="300.0" dy="15.6">32-бітний регістр передачі/прийому даних (RW)</tspan></text>
<text x="300.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен регістр займає строго 4 байти (32-бітна сітка APB/AHB)</text>
<text x="300.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Доступ через байтові операції (LDRB) може викликати Bus Fault!</text>
<rect x="600.0" y="50.0" width="520.0" height="450.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="860.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Оголошення C/C++ структури та накладання вказівника</text>
<rect x="620.0" y="100.0" width="480.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="146.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">typedef struct {</tspan><tspan x="860.0" dy="15.6">    volatile uint32_t CR1;        /* +0x00: RW */</tspan><tspan x="860.0" dy="15.6">    volatile uint32_t CR2;        /* +0x04: RW */</tspan><tspan x="860.0" dy="15.6">    const volatile uint32_t SR;   /* +0x08: RO */</tspan><tspan x="860.0" dy="15.6">    uint32_t RESERVED[2];         /* +0x0C..+0x10 */</tspan><tspan x="860.0" dy="15.6">    volatile uint32_t DR;         /* +0x14: RW */</tspan><tspan x="860.0" dy="15.6">} USART_TypeDef;</tspan><tspan x="860.0" dy="15.6"></tspan><tspan x="860.0" dy="15.6">#define USART1 ((USART_TypeDef*)0x40013800UL)</tspan></text>
<rect x="620.0" y="325.0" width="480.0" height="145.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="860.0" y="372.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Правила безпечного проектування:</tspan><tspan x="860.0" dy="14.3">1. volatile uint32_t гарантує 32-бітний LDR/STR без кешу</tspan><tspan x="860.0" dy="14.3">2. const volatile захищає регістри тільки-для-читання на рівні типів</tspan><tspan x="860.0" dy="14.3">3. Масиви RESERVED зберігають апаратні зміщення без packing</tspan><tspan x="860.0" dy="14.3">4. Без __attribute__((packed)), щоб компілятор не дробив слова</tspan></text>
</svg>