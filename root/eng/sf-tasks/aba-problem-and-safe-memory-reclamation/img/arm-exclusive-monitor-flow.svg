<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" />

  <!-- States -->
  <rect x="150" y="150" width="160" height="80" rx="15" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" />
  <text x="230" y="195" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1565c0" text-anchor="middle">Open</text>
  <text x="230" y="215" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">(Відкритий)</text>

  <rect x="490" y="150" width="160" height="80" rx="15" fill="#fff3e0" stroke="#f4511e" stroke-width="3" />
  <text x="570" y="195" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e64a19" text-anchor="middle">Exclusive</text>
  <text x="570" y="215" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">(Ексклюзивний)</text>

  <!-- Transitions -->
  <!-- Open to Exclusive -->
  <path d="M 310 170 L 480 170" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="395" y="160" font-family="monospace" font-size="14" fill="#333" text-anchor="middle">LDREXD</text>
  <text x="395" y="145" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">Завантаження адреси</text>

  <!-- Exclusive to Open (STREXD Success) -->
  <path d="M 490 210 L 320 210" fill="none" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow)" />
  <text x="405" y="225" font-family="monospace" font-size="14" fill="#2e7d32" text-anchor="middle">STREXD (Успіх)</text>
  <text x="405" y="240" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">status = 0</text>

  <!-- Exclusive to Open (Interference) -->
  <path d="M 570 150 C 570 60, 230 60, 230 150" fill="none" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow)" />
  <text x="400" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d32f2f" text-anchor="middle">Переривання (ISR), CLREX, DMA</text>
  <text x="400" y="95" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">Скидання монітора без запису</text>

  <!-- Open to Open (STREXD Fail) -->
  <path d="M 170 230 C 170 300, 290 300, 290 230" fill="none" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)" />
  <text x="230" y="290" font-family="monospace" font-size="14" fill="#e65100" text-anchor="middle">STREXD (Збій)</text>
  <text x="230" y="305" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">status = 1</text>

  <!-- Exclusive to Exclusive (Repeated LDREXD) -->
  <path d="M 630 230 C 630 300, 510 300, 510 230" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="570" y="290" font-family="monospace" font-size="14" fill="#333" text-anchor="middle">LDREXD</text>
  <text x="570" y="305" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">Повторне завантаження</text>

</svg>