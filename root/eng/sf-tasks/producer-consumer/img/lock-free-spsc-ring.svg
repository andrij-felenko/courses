    <text x="580" y="265" font-size="12" fill="#1a1a1a" text-anchor="middle">Порожньо</text>
    
    <rect x="178" y="303" width="145" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="250" y="324.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Head (Споживач)</text>
