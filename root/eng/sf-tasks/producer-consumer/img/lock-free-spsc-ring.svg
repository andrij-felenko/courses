  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Неблокувальний кільцевий буфер SPSC</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Структура Single-Producer Single-Consumer черги</text>
  
