<text x="480" y="204.9" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Кільцевий масив (Ring Buffer)</text>
    
    <rect x="330" y="240" width="300" height="40" fill="#white" stroke="#6b7280" stroke-width="2"/>
    <line x1="430" y1="240" x2="430" y2="280" stroke="#6b7280" stroke-width="2"/>
    <line x1="530" y1="240" x2="530" y2="280" stroke="#6b7280" stroke-width="2"/>
    
    <text x="380" y="265" font-size="12" fill="#1a1a1a" text-anchor="middle">Дані 1</text>
