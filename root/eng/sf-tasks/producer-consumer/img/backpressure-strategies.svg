<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стратегії обробки переповнення буфера</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Backpressure: скидання, блокування або масштабування</text>
  
    <rect x="392" y="133" width="176" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="480" y="154.9" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Переповнення Буфера</text>
    
    <rect x="112" y="233" width="176" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="200" y="254.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Drop (Скинути дані)</text>
    <rect x="362" y="233" width="237" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="480" y="254.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Block (Блокувати виробника)</text>
    <rect x="615" y="233" width="291" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="760" y="254.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Scale (Збільшити буфер/споживачів)</text>
    
    <path d="M 400 180 L 250 220" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 480 180 L 480 220" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 560 180 L 710 220" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    
</svg>