<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Протокол коректної зупинки системи</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Вичерпання черги та безпечне завершення потоків (Graceful Shutdown)</text>
  
    <rect x="369" y="103" width="222" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="480" y="124.9" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Сигнал зупинки (Shutdown)</text>
    
    <rect x="342" y="183" width="276" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="480" y="204.9" font-size="14" fill="#1a1a1a" text-anchor="middle">1. Виробники припиняють додавати</text>
    <path d="M 480 150 L 480 180" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    
    <rect x="342" y="263" width="276" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="480" y="284.9" font-size="14" fill="#1a1a1a" text-anchor="middle">2. Споживачі допрацьовують буфер</text>
    <path d="M 480 230 L 480 260" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    
    <rect x="354" y="343" width="253" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="480" y="364.9" font-size="14" fill="#1a1a1a" text-anchor="middle">3. Потоки завершуються (Join)</text>
    <path d="M 480 310 L 480 340" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    
</svg>