<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура патерну Виробник–Споживач з обмеженим буфером</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Виробники додають задачі в обмежений FIFO-буфер, а споживачі паралельно вилучають їх</text>

  <!-- Producers -->
  <rect x="100" y="120" width="120" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="160" y="150" font-size="14" fill="#1a1a1a" text-anchor="middle">Виробник 1</text>

  <rect x="100" y="200" width="120" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="160" y="230" font-size="14" fill="#1a1a1a" text-anchor="middle">Виробник 2</text>

  <rect x="100" y="280" width="120" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="160" y="310" font-size="14" fill="#1a1a1a" text-anchor="middle">Виробник 3</text>

  <!-- Buffer Panel -->
  <rect x="360" y="160" width="240" height="150" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="185" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спільний буфер (FIFO)</text>
  
  <!-- Queue elements -->
  <rect x="390" y="210" width="50" height="40" fill="#white" stroke="#6b7280" stroke-width="1"/>
  <text x="415" y="235" font-size="12" fill="#1a1a1a" text-anchor="middle">задача</text>
  
  <rect x="455" y="210" width="50" height="40" fill="#white" stroke="#6b7280" stroke-width="1"/>
  <text x="480" y="235" font-size="12" fill="#1a1a1a" text-anchor="middle">задача</text>

  <rect x="520" y="210" width="50" height="40" fill="#white" stroke="#6b7280" stroke-width="1"/>
  <text x="545" y="235" font-size="12" fill="#1a1a1a" text-anchor="middle">задача</text>
  
  <text x="480" y="290" font-size="12" fill="#6b7280" text-anchor="middle">М'ютекс та Умовні змінні</text>

  <!-- Consumers -->
  <rect x="740" y="150" width="120" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="800" y="180" font-size="14" fill="#1a1a1a" text-anchor="middle">Споживач 1</text>

  <rect x="740" y="250" width="120" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="800" y="280" font-size="14" fill="#1a1a1a" text-anchor="middle">Споживач 2</text>

  <!-- Arrows Producers -> Buffer -->
  <path d="M 220 145 L 350 200" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 220 225 L 350 235" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 220 305 L 350 270" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Arrows Buffer -> Consumers -->
  <path d="M 600 215 L 730 175" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 600 255 L 730 275" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
</svg>
