<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вплив маскування переривань на латентність системного таймера</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Довгі критичні секції викликають джитер та затримки в обробці переривань</text>

  <!-- Section 1: Normal Execution -->
  <text x="50" y="105" font-size="15" font-weight="bold" fill="#1a1a1a">1. Нормальне виконання (Без маскування)</text>
  
  <text x="550" y="130" font-size="12" fill="#c0392b" text-anchor="middle">IRQ (SysTick) виникає тут</text>
  <line x1="550" y1="135" x2="550" y2="160" stroke="#c0392b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arr-red)"/>

  <rect x="150" y="165" width="400" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="350" y="185" font-size="13" fill="#27ae60" text-anchor="middle">Звичайний код потоку</text>

  <rect x="550" y="165" width="120" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="610" y="185" font-size="13" fill="#2457d6" text-anchor="middle">Timer ISR (негайно)</text>
  
  <line x1="50" y1="210" x2="900" y2="210" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="910" y="215" font-size="13" fill="#1a1a1a">Час (t)</text>

  <!-- Section 2: Execution with Critical Section -->
  <text x="50" y="270" font-size="15" font-weight="bold" fill="#1a1a1a">2. Виконання з критичною секцією (Маскування переривань)</text>
  
  <text x="350" y="325" font-size="12" fill="#6b7280" text-anchor="middle">Вимкнення IRQ</text>
  <text x="700" y="325" font-size="12" fill="#6b7280" text-anchor="middle">Увімкнення IRQ</text>
  
  <text x="550" y="325" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">IRQ (SysTick) виникає тут</text>
  <line x1="550" y1="332" x2="550" y2="360" stroke="#c0392b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arr-red)"/>

  <rect x="150" y="365" width="200" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="250" y="385" font-size="13" fill="#27ae60" text-anchor="middle">Звичайний код</text>

  <rect x="350" y="365" width="350" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="525" y="385" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="middle">Критична секція (PRIMASK = 1)</text>

  <rect x="700" y="365" width="120" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="760" y="385" font-size="13" fill="#2457d6" text-anchor="middle">Timer ISR (відкладено)</text>

  <line x1="50" y1="410" x2="900" y2="410" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="910" y="415" font-size="13" fill="#1a1a1a">Час (t)</text>

  <!-- Latency Marker -->
  <line x1="550" y1="400" x2="550" y2="445" stroke="#c0392b" stroke-width="1" stroke-dasharray="2"/>
  <line x1="700" y1="400" x2="700" y2="445" stroke="#c0392b" stroke-width="1" stroke-dasharray="2"/>
  <line x1="550" y1="435" x2="700" y2="435" stroke="#c0392b" stroke-width="2" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="625" y="455" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="middle">Латентність (Затримка виконання ISR)</text>
</svg>