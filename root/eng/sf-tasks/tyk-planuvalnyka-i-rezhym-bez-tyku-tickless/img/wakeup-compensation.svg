<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="20.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Сценарій А: Планове пробудження (таймаут LPTIM)</text>
<line x1="40.0" y1="65.0" x2="820.0" y2="65.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="60.0" y1="55.0" x2="60.0" y2="75.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="60.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">t = 0</text>
<line x1="660.0" y1="55.0" x2="660.0" y2="75.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="660.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">t = N (план)</text>
<rect x="62.0" y="58.0" width="596.0" height="14.0" rx="2" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="360.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0e6251" text-anchor="middle" font-weight="700">Сон тривав повні N тактів → виклик vTaskStepTick(N)</text>
<text x="20.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Сценарій Б: Передчасне асинхронне пробудження (EXTI / UART / Давач)</text>
<line x1="40.0" y1="175.0" x2="820.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="60.0" y1="165.0" x2="60.0" y2="185.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="60.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">t = 0</text>
<line x1="360.0" y1="160.0" x2="360.0" y2="190.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="360.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">t = M (асинхронна подія)</text>
<line x1="660.0" y1="165.0" x2="660.0" y2="185.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="660.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = N (не досягнуто)</text>
<rect x="62.0" y="168.0" width="296.0" height="14.0" rx="2" fill="#fef9e7" stroke="#f39c12" stroke-width="1.2"/>
<text x="210.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d6608" text-anchor="middle" font-weight="700">Фактичний сон M тактів</text>
<rect x="362.0" y="168.0" width="296.0" height="14.0" rx="2" fill="#f2f3f4" stroke="#6b7280" stroke-width="1.0"/>
<text x="510.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Недоспаний залишок (N − M)</text>
<rect x="82.2" y="224.5" width="715.6" height="31.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="243.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Зчитування LPTIM_CNT → обчислення M = LPTIM_CNT / counts_per_tick → vTaskStepTick(M) → рестарт SysTick</tspan></text>
</svg>