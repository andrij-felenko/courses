<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 370.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="370.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критична секція: noInterrupts() … interrupts() огороджують цілісну дію</text>
<line x1="80.0" y1="150.0" x2="800.0" y2="150.0" stroke="#cfd6e2" stroke-width="2.0"/>
<text x="64.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">час</text>
<line x1="300.0" y1="90.0" x2="300.0" y2="230.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="560.0" y1="90.0" x2="560.0" y2="230.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="300.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">noInterrupts()</text>
<text x="560.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">interrupts()</text>
<rect x="300.0" y="128.0" width="260.0" height="44.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="430.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">робота зі спільними даними — цілісно</text>
<circle cx="420.0" cy="150.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="420.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">подія прийшла тут</text>
<line x1="420.0" y1="156.0" x2="420.0" y2="244.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3,3"/>
<line x1="420.0" y1="268.0" x2="560.0" y2="268.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="2,3"/>
<line x1="560.0" y1="268.0" x2="590.0" y2="268.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="592.0" y="252.0" width="150.0" height="32.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="667.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">обробник спрацює</text>
<text x="490.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">чекає кілька тактів</text>
<rect x="80.0" y="304.0" width="720.0" height="46.6" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Подія, що прийшла всередині секції, не губиться — обробник лише ЧЕКАЄ до її кінця.</tspan><tspan x="440.0" dy="14.3">За неподільність ми платимо крихітною затримкою тих переривань, що зібрались.</tspan></text>
</svg>