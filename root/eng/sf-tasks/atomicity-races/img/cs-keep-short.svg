<rect x="80.0" y="264.0" width="700.0" height="46.6" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Секція додає затримку КОЖНОМУ перериванню: усі обробники чекають до виходу.</tspan><tspan x="430.0" dy="14.3">Усередині — лише пара інструкцій, без Serial, delay чи Flash.</tspan></text>
