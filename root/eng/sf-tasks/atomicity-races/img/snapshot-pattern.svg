<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 352.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="352.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Патерн «знімок»: копіювати під захистом, працювати поза ним</text>
<line x1="80.0" y1="150.0" x2="800.0" y2="150.0" stroke="#cfd6e2" stroke-width="2.0"/>
<rect x="220.0" y="130.0" width="100.0" height="40.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="270.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">секція (мить)</text>
<text x="270.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">n = pulses</text>
<line x1="220.0" y1="104.0" x2="220.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="320.0" y1="104.0" x2="320.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="350.0" y="130.0" width="420.0" height="40.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="560.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Serial.println(n) — з копією, поза секцією</text>
<line x1="320.0" y1="150.0" x2="348.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">переривання вимкнені — мить</text>
<text x="560.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">переривання знову ввімкнені — працюй скільки треба</text>
<line x1="320.0" y1="174.0" x2="320.0" y2="248.0" stroke="#cfd6e2" stroke-width="1.0" stroke-dasharray="2,3"/>
<rect x="70.0" y="286.0" width="720.0" height="46.6" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="430.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Під захистом — лише копіювання спільного в локальне (лічені такти).</tspan><tspan x="430.0" dy="14.3">Уся «важка» робота — поза секцією, з копією. Секція лишається якнайкоротшою.</tspan></text>
</svg>