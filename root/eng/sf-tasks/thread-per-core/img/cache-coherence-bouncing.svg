<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний колапс спільної пам'яті: Cache Line Bouncing у протоколі MESI</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Як паралельний запис в одну кеш-лінію паралізує міжпроцесорну шину (UPI / Infinity Fabric)</text>
<rect x="40.0" y="75.0" width="230.0" height="255.0" rx="8" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="155.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро 0 (CPU Core 0)</text>
<rect x="55.0" y="120.0" width="200.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="155.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік 0 виконує write(X)</text>
<rect x="55.0" y="170.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">L1/L2 Кеш (64 байти)</tspan><tspan x="155.0" dy="12.3">Рядок X: Стан MODIFIED (M)</tspan><tspan x="155.0" dy="12.3">Ексклюзивне володіння</tspan></text>
<rect x="55.0" y="245.0" width="200.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="155.0" y="268.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="155.0" dy="0.0">Отримано BusRdX від Ядра 32:</tspan><tspan x="155.0" dy="12.3">1. Примусове скидання даних</tspan><tspan x="155.0" dy="12.3">2. Перехід у стан INVALID (I)</tspan></text>
<rect x="305.0" y="110.0" width="270.0" height="185.0" rx="8" fill="#fffaf0" stroke="#caa24a" stroke-width="1.8"/>
<text x="440.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">Міжпроцесорна шина (Interconnect)</text>
<text x="440.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">UPI / Infinity Fabric (Затримка: 60-120 нс)</text>
<rect x="320.0" y="170.0" width="240.0" height="50.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Транзакція BusRdX (Invalidate):</tspan><tspan x="440.0" dy="12.3">Шина блокується для передачі</tspan><tspan x="440.0" dy="12.3">кеш-лінії між сокетами</tspan></text>
<rect x="320.0" y="230.0" width="240.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="440.0" dy="0.0">Швидкість доступу до пам'яті:</tspan><tspan x="440.0" dy="12.3">L1 кеш: ~1 нс (4 такти)</tspan><tspan x="440.0" dy="12.3">Cache Bounce: ~80-120 нс (300 тактів)</tspan></text>
<line x1="257.0" y1="200.0" x2="318.0" y2="200.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="623.0" y1="200.0" x2="562.0" y2="200.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="75.0" width="230.0" height="255.0" rx="8" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="725.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро 32 (CPU Core 32)</text>
<rect x="625.0" y="120.0" width="200.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="725.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік 32 виконує write(X)</text>
<rect x="625.0" y="170.0" width="200.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="725.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="725.0" dy="0.0">L1/L2 Кеш (64 байти)</tspan><tspan x="725.0" dy="12.3">Рядок X: Стан INVALID (I)</tspan><tspan x="725.0" dy="12.3">Кеш-промах! Запит на шину</tspan></text>
<rect x="625.0" y="245.0" width="200.0" height="65.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="725.0" y="268.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Отримано рядок X з Ядра 0:</tspan><tspan x="725.0" dy="12.3">1. Запис нового значення</tspan><tspan x="725.0" dy="12.3">2. Перехід у стан MODIFIED (M)</tspan></text>
<rect x="40.0" y="350.0" width="800.0" height="47.7" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="370.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Коли різні ядра пишуть у спільну змінну або лічильник, 64-байтна кеш-лінія безперервно «стрибає» між L1/L2 кешами.</tspan><tspan x="440.0" dy="14.3">Цей ping-pong забирає до 300 тактів на кожну операцію, знецінюючи паралелізм багатоядерного процесора.</tspan></text>
</svg>