<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цикл виконання дерева поведінки</text>
<text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Передача тику та статусів між вузлами</text>

<!-- Root -->
<rect x="400" y="100" width="160" height="60" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="480" y="135" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Selector</text>

<!-- Condition -->
<rect x="200" y="250" width="200" height="60" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="300" y="285" font-size="14" fill="#1a1a1a" text-anchor="middle">Condition (Check)</text>

<!-- Action -->
<rect x="560" y="250" width="200" height="60" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="660" y="285" font-size="14" fill="#1a1a1a" text-anchor="middle">Action (Move)</text>

<!-- Arrows -->
<path d="M 450 160 L 320 250" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="350" y="195" font-size="13" fill="#1a1a1a" text-anchor="middle">Tick</text>

<path d="M 510 160 L 640 250" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="610" y="195" font-size="13" fill="#1a1a1a" text-anchor="middle">Tick</text>

<!-- Blackboard -->
<rect x="330" y="380" width="300" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" stroke-dasharray="5,5"/>
<text x="480" y="415" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Blackboard (Спільний стан)</text>
<path d="M 300 310 L 400 380" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 660 310 L 560 380" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
</svg>