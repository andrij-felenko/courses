<svg viewBox="0 0 720 360" width="720" height="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="720" height="360" fill="white"/>

<defs>
    <marker id="tick-arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
</defs>

<text x="360" y="55" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол Sequence із пам'яттю станів</text>
<text x="360" y="75" font-size="13" fill="#6b7280" text-anchor="middle">Наступний тик оминає завершені вузли та йде прямо до активного</text>

<polyline points="360,170 360,190" fill="none" stroke="#d0d7de" stroke-width="2"/>
<polyline points="160,190 560,190" fill="none" stroke="#d0d7de" stroke-width="2"/>
<polyline points="160,190 160,240" fill="none" stroke="#d0d7de" stroke-width="2"/>
<polyline points="560,190 560,240" fill="none" stroke="#d0d7de" stroke-width="2"/>
<polyline points="360,190 360,240" fill="none" stroke="#d0d7de" stroke-width="2"/>

<text x="260" y="182" font-size="12" fill="#6b7280" text-anchor="middle">оминається</text>
<text x="460" y="182" font-size="12" fill="#6b7280" text-anchor="middle">не викликається</text>

<rect x="280" y="120" width="160" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="360" y="144" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Sequence*</text>
<text x="360" y="162" font-size="12" fill="#6b7280" text-anchor="middle">зберігає стан</text>

<rect x="90" y="240" width="140" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="160" y="262" font-size="14" fill="#1a1a1a" text-anchor="middle">Завдання 1</text>
<text x="160" y="280" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Виконано</text>

<rect x="290" y="240" width="140" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="360" y="262" font-size="14" fill="#1a1a1a" text-anchor="middle">Завдання 2</text>
<text x="360" y="280" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Виконується</text>

<rect x="490" y="240" width="140" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="560" y="262" font-size="14" fill="#1a1a1a" text-anchor="middle">Завдання 3</text>
<text x="560" y="280" font-size="12" fill="#6b7280" text-anchor="middle">Очікує</text>

<line x1="360" y1="95" x2="360" y2="115" stroke="#2457d6" stroke-width="3" marker-end="url(#tick-arr)"/>
<text x="370" y="110" font-size="14" font-weight="bold" fill="#2457d6">Tick</text>

<line x1="360" y1="170" x2="360" y2="235" stroke="#2457d6" stroke-width="3" marker-end="url(#tick-arr)"/>
<text x="370" y="215" font-size="14" font-weight="bold" fill="#2457d6">Tick</text>

</svg>
