<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="440" fill="white"/>
  
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структура дерева поведінки</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Кореневий вузол ретранслює тики, вузли керування задають логіку, листки виконують дії</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-tick" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <path d="M400,60 L400,77" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-tick)"/>
  <text x="408" y="73" font-size="13" fill="#1a1a1a">Tick</text>

  <path d="M400,120 L400,157" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>

  <path d="M400,200 L400,225 L250,225 L250,247" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M400,200 L400,225 L550,225 L550,247" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>

  <path d="M250,290 L250,315 L160,315 L160,337" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M250,290 L250,315 L340,315 L340,337" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>

  <text x="325" y="218" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="bold">1</text>
  <text x="475" y="218" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="bold">2</text>
  <text x="205" y="308" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="bold">1</text>
  <text x="295" y="308" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="bold">2</text>

  <rect x="325" y="80" width="150" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Root</text>

  <rect x="325" y="160" width="150" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="400" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Selector (?)</text>

  <rect x="175" y="250" width="150" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="250" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Sequence (→)</text>

  <rect x="475" y="250" width="150" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="550" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Action (Patrol)</text>

  <rect x="85" y="340" width="150" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="160" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Cond: Target?</text>

  <rect x="265" y="340" width="150" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="340" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Action (Attack)</text>
</svg>
