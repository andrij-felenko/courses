<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дисципліна порядку розриває кільце</text>
<line x1="370.0" y1="50.0" x2="370.0" y2="290.0" stroke="#dddddd" stroke-width="1.2"/>
<text x="185.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Протилежні порядки → дедлок</text>
<rect x="40.0" y="100.0" width="150.0" height="56.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="115.0" y="124.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">A:</tspan><tspan x="115.0" dy="14.3">spi → sd</tspan></text>
<rect x="180.0" y="100.0" width="150.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="255.0" y="124.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">B:</tspan><tspan x="255.0" dy="14.3">sd → spi</tspan></text>
<line x1="190.0" y1="120.0" x2="180.0" y2="120.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="180.0" y1="145.0" x2="190.0" y2="145.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="185.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="185.0" dy="0.0">кожен дивиться у свій бік →</tspan><tspan x="185.0" dy="13.0">очікування замикається в коло</tspan></text>
<text x="555.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Єдиний порядок → безпечно</text>
<rect x="420.0" y="100.0" width="150.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="495.0" y="124.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">A:</tspan><tspan x="495.0" dy="14.3">spi → sd</tspan></text>
<rect x="540.0" y="100.0" width="150.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="615.0" y="124.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">B:</tspan><tspan x="615.0" dy="14.3">spi → sd</tspan></text>
<text x="555.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1) завжди spi</text>
<text x="555.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2) потім sd</text>
<text x="555.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="555.0" dy="0.0">усі беруть в ОДНОМУ порядку →</tspan><tspan x="555.0" dy="13.0">кругове очікування неможливе</tspan></text>
<text x="370.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">і то задарма — самою домовленістю, без нового механізму</text>
</svg>