<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві відмінності м'ютекса від семафора</text>
<line x1="360.0" y1="50.0" x2="360.0" y2="290.0" stroke="#dddddd" stroke-width="1.2"/>
<text x="180.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Власник</text>
<rect x="118.8" y="100.2" width="122.3" height="59.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="180.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">м'ютекс:</tspan><tspan x="180.0" dy="14.3">віддає лише та,</tspan><tspan x="180.0" dy="14.3">що ВЗЯЛА</tspan></text>
<rect x="139.3" y="200.2" width="81.4" height="59.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="180.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">семафор:</tspan><tspan x="180.0" dy="14.3">дати може</tspan><tspan x="180.0" dy="14.3">БУДЬ-ХТО</tspan></text>
<text x="540.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Успадкування пріоритету</text>
<rect x="410.0" y="94.0" width="260.0" height="30.0" rx="6" fill="#f7f7f7" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">низька тримає замок</tspan></text>
<rect x="410.0" y="154.0" width="260.0" height="30.0" rx="6" fill="#f7f7f7" stroke="#b8860b" stroke-width="1.5"/><text x="540.0" y="172.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">середня НЕ витісняє</tspan></text>
<rect x="410.0" y="214.0" width="260.0" height="30.0" rx="6" fill="#f7f7f7" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="232.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">висока чекає замок</tspan></text>
<line x1="540.0" y1="126.0" x2="540.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="540.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="540.0" dy="0.0">низькій тимчасово піднімають пріоритет —</tspan><tspan x="540.0" dy="13.0">рятує від інверсії пріоритетів</tspan></text>
</svg>