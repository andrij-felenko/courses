<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Глобальні епохи та трьохфазне звільнення вузлів (EBR)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Відкладене звільнення вузлів через Epoch-Based Reclamation</text>
  
    <rect x="159" y="163" width="83" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="200" y="184.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Епоха N</text>
    <rect x="431" y="163" width="99" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="480" y="184.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Епоха N+1</text>
    <rect x="711" y="163" width="99" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="760" y="184.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Епоха N+2</text>
    
    <path d="M 280 180 L 380 180" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 580 180 L 660 180" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    
    <text x="200" y="240" font-size="12" fill="#6b7280" text-anchor="middle">Від'єднання вузла</text>
    <text x="480" y="240" font-size="12" fill="#6b7280" text-anchor="middle">Очікування (Grace Period)</text>
    <text x="760" y="240" font-size="12" fill="#6b7280" text-anchor="middle">Звільнення пам'яті</text>
    
</svg>