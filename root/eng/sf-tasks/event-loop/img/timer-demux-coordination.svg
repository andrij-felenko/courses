<text x="415.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Обчислення таймауту:</text>
<text x="415.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">timeout = 1000.045 - now</text>
<text x="415.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">timeout = 45 мс</text>
<line x1="510.0" y1="116.0" x2="560.0" y2="116.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="50.0" width="240.0" height="210.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="680.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Системний виклик ядра</text>
<text x="680.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">epoll_wait(epfd, evs, max, 45)</text>
