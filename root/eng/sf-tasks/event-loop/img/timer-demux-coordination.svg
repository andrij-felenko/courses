<rect x="575.0" y="120.0" width="210.0" height="55.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="680.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Сценарій А: Прийшов пакет сокета</text>
<text x="680.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Пробудження за 12 мс</text>
<text x="680.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Обробляємо сокет, таймер чекає</text>
