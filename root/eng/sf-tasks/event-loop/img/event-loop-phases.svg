<rect x="30.0" y="135.0" width="240.0" height="70.0" rx="6" fill="#fdf8e6" stroke="#d35400" stroke-width="1.5"/>
<text x="150.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">6. UI Render / Housekeeping</text>
<text x="150.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Перемалювання кадрів (requestAnimationFrame),</text>
<text x="150.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">очищення закритих дескрипторів</text>
