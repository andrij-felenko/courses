<rect x="30.0" y="250.0" width="240.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="150.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">5. Check / setImmediate</text>
<text x="150.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Обслуговування сокетів після Poll</text>
