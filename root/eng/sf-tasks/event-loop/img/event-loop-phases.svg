<rect x="540.0" y="250.0" width="250.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="665.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Обробники I/O (Callbacks)</text>
<text x="665.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Виклик колбеків для прочитаних сокетів</text>
<line x1="540.0" y1="290.0" x2="480.0" y2="325.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
