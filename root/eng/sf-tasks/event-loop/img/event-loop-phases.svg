<rect x="540.0" y="135.0" width="250.0" height="70.0" rx="6" fill="#f4faf6" stroke="#27ae60" stroke-width="2.0"/>
<text x="665.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2. Опитування I/O (Poll / epoll_wait)</text>
<text x="665.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сон до появи готових сокетів або</text>
