<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="480" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Взаємодія ініціатора, джерела та маркера скасування</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Взаємодія джерела скасування та токена: джерело атомарно змінює прапорець, а виконувач задачі періодично перевіряє стан у точках скасування.</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Component 1: Initiator -->
  <rect x="50" y="150" width="180" height="150" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="140" y="180" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ініціатор</text>
  
  <rect x="70" y="210" width="140" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="140" y="235" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">cancel()</text>
  
  <text x="140" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Генерує подію</text>

  <!-- Component 2: Cancellation Source -->
  <rect x="290" y="120" width="380" height="210" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="480" y="145" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Інфраструктура Скасування</text>

  <rect x="310" y="170" width="160" height="130" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="390" y="200" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CancellationSource</text>
  
  <rect x="330" y="230" width="120" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="390" y="250" font-size="12" fill="#1a1a1a" text-anchor="middle">Atomic State = true</text>
  
  <rect x="490" y="170" width="160" height="130" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="570" y="200" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CancellationToken</text>

  <rect x="510" y="230" width="120" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="570" y="250" font-size="12" fill="#1a1a1a" text-anchor="middle">is_requested()</text>

  <path d="M 470 245 L 490 245" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="235" font-size="12" fill="#2457d6" text-anchor="middle">Shared</text>

  <!-- Component 3: Worker -->
  <rect x="730" y="150" width="180" height="150" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="820" y="180" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Виконувач (Worker)</text>
  
  <rect x="750" y="210" width="140" height="40" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="820" y="235" font-size="13" fill="#1a1a1a" text-anchor="middle">Перевірка токена</text>
  
  <text x="820" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Вихід з циклу</text>

  <!-- Interactions -->
  <path d="M 230 230 L 310 230" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="270" y="220" font-size="12" fill="#c0392b" text-anchor="middle">Виклик</text>
  
  <path d="M 750 230 L 650 230" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="700" y="220" font-size="12" fill="#2457d6" text-anchor="middle">Опитування</text>

</svg>