<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="480" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовна діаграма роботи блоків очищення try/finally та RAII при виникненні винятку скасування</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Послідовна діаграма автоматичного звільнення ресурсів об'єктами RAII та виконання блоків try/finally при скасуванні задачі.</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="100" y="100" width="760" height="350" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="480" y="130" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Call Stack (Стек Викликів)</text>

  <!-- Frame 1 -->
  <rect x="150" y="150" width="660" height="280" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="175" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Функція ProcessData()</text>

  <rect x="200" y="190" width="200" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="300" y="210" font-size="12" fill="#1a1a1a" text-anchor="middle">RAII: LockGuard(mutex)</text>
  
  <!-- Frame 2 -->
  <rect x="250" y="240" width="540" height="170" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="270" y="265" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Функція DownloadFile()</text>

  <rect x="300" y="280" width="200" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="400" y="300" font-size="12" fill="#1a1a1a" text-anchor="middle">RAII: FileHandle(file)</text>

  <rect x="300" y="330" width="200" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="400" y="355" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">throw CancellationException</text>
  
  <!-- Unwinding Arrows -->
  <path d="M 520 360 L 620 360 L 620 295 L 520 295" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
  <text x="630" y="330" font-size="12" fill="#27ae60" text-anchor="start">~FileHandle() -> Закриває файл</text>

  <path d="M 520 280 L 720 280 L 720 205 L 420 205" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
  <text x="730" y="245" font-size="12" fill="#27ae60" text-anchor="start">~LockGuard() -> Звільняє м'ютекс</text>

</svg>