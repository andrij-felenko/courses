<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="480" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хронограма апаратного скасування DMA та скидання регістрів периферії</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Часова послідовність виявлення сигналу скасування, зупинки шини DMA та скидання регістрів периферійного модуля.</text>
  
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="100" y="140" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">CPU (Задача)</text>
  <path d="M 120 135 L 900 135" fill="none" stroke="#d0d7de" stroke-width="2"/>
  
  <text x="100" y="240" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">Шина DMA</text>
  <path d="M 120 235 L 900 235" fill="none" stroke="#d0d7de" stroke-width="2"/>
  
  <text x="100" y="340" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">Регістри Периферії</text>
  <path d="M 120 335 L 900 335" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- CPU activities -->
  <rect x="150" y="120" width="100" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="200" y="140" font-size="13" fill="#1a1a1a" text-anchor="middle">Обчислення</text>

  <rect x="280" y="120" width="80" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="320" y="140" font-size="13" fill="#2457d6" text-anchor="middle">Перевірка</text>

  <rect x="390" y="120" width="100" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="440" y="140" font-size="13" fill="#1a1a1a" text-anchor="middle">Обчислення</text>

  <rect x="520" y="120" width="80" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="560" y="140" font-size="13" fill="#c0392b" text-anchor="middle">Сигнал!</text>

  <!-- DMA activities -->
  <rect x="150" y="220" width="200" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="250" y="240" font-size="13" fill="#27ae60" text-anchor="middle">Передача Блоку 1</text>

  <rect x="370" y="220" width="180" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="460" y="240" font-size="13" fill="#27ae60" text-anchor="middle">Передача Блоку 2</text>
  
  <!-- Cleanup -->
  <rect x="620" y="120" width="120" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="680" y="140" font-size="13" fill="#1a1a1a" text-anchor="middle">Зупинка DMA</text>
  
  <path d="M 680 150 L 680 235" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="4,4"/>
  
  <rect x="760" y="120" width="120" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="820" y="140" font-size="13" fill="#1a1a1a" text-anchor="middle">Скидання Регістрів</text>
  
  <path d="M 820 150 L 820 335" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="4,4"/>

  <!-- Peripheral activities -->
  <rect x="150" y="320" width="600" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="450" y="340" font-size="13" fill="#1a1a1a" text-anchor="middle">Активний Стан (ENABLE = 1)</text>
  
  <rect x="800" y="320" width="80" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="840" y="340" font-size="13" fill="#27ae60" text-anchor="middle">IDLE</text>

</svg>