<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Моделі впорядкування пам'яті</text>
<text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння апаратного перевпорядкування архітектур</text>

<!-- x86-64 -->
<rect x="50" y="100" width="250" height="300" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="175" y="140" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">x86-64 (TSO)</text>
<text x="175" y="200" font-size="14" fill="#1a1a1a" text-anchor="middle">Дозволено лише:</text>
<text x="175" y="230" font-size="14" fill="#1a1a1a" text-anchor="middle">Store -> Load</text>

<!-- ARM64 -->
<rect x="350" y="100" width="260" height="300" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="480" y="140" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ARM64 (Weak)</text>
<text x="480" y="200" font-size="14" fill="#1a1a1a" text-anchor="middle">Дозволено все:</text>
<text x="480" y="230" font-size="14" fill="#1a1a1a" text-anchor="middle">Load -> Load</text>
<text x="480" y="260" font-size="14" fill="#1a1a1a" text-anchor="middle">Load -> Store</text>
<text x="480" y="290" font-size="14" fill="#1a1a1a" text-anchor="middle">Store -> Store</text>
<text x="480" y="320" font-size="14" fill="#1a1a1a" text-anchor="middle">Store -> Load</text>

<!-- DEC Alpha -->
<rect x="660" y="100" width="250" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="785" y="140" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DEC Alpha</text>
<text x="785" y="200" font-size="14" fill="#1a1a1a" text-anchor="middle">Додатково:</text>
<text x="785" y="230" font-size="14" fill="#1a1a1a" text-anchor="middle">Спекулятивне читання</text>
<text x="785" y="260" font-size="14" fill="#1a1a1a" text-anchor="middle">без інвалідації кешу</text>
</svg>