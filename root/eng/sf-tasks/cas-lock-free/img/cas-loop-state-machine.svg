<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="960" height="480" fill="white"/>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
</defs>
<text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Algorithmic State Machine of the CAS Retry Loop</text>
<text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">The cycle of reading, computing, and attempting to swap, returning to start upon failure.</text>
<rect x="100" y="200" width="180" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6"/>
<text x="190.0" y="230.0" font-size="14" text-anchor="middle" fill="#1a1a1a">State: Read State</text>
<rect x="390" y="200" width="180" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
<text x="480.0" y="230.0" font-size="14" text-anchor="middle" fill="#1a1a1a">State: Modify Local</text>
<rect x="680" y="200" width="180" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6"/>
<text x="770.0" y="230.0" font-size="14" text-anchor="middle" fill="#1a1a1a">State: Attempt CAS</text>
<line x1="280" y1="225" x2="390" y2="225" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="570" y1="225" x2="680" y2="225" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="770" y1="200" x2="770" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#none)"/>
<line x1="770" y1="120" x2="190" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#none)"/>
<text x="480.0" y="110.0" font-size="12" text-anchor="middle" fill="#c0392b">Failure (Conflict)</text>
<line x1="190" y1="120" x2="190" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
<line x1="770" y1="250" x2="770" y2="320" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="770.0" y="275.0" font-size="12" text-anchor="middle" fill="#27ae60">Success</text>
</svg>