<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Витіснення потоків та перегони зчитування</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Другий потік перезаписує результат першого під час Read-Modify-Write</text>
  
    <rect x="166" y="133" width="168" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="250" y="154.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Потік 1: Читає X=5</text>
    <rect x="626" y="133" width="168" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="710" y="154.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Потік 2: Читає X=5</text>
    
    <rect x="170" y="233" width="160" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="250" y="254.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Потік 1: Пише X=6</text>
    <rect x="630" y="233" width="160" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="710" y="254.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Потік 2: Пише X=6</text>
    
    <path d="M 250 180 L 250 220" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 710 180 L 710 220" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
    
    <rect x="350" y="303" width="261" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="480" y="324.9" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Результат: X=6 (Очікувалося 7)</text>
    <path d="M 250 280 L 400 320" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 710 280 L 560 320" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
    
</svg>