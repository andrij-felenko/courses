<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="960" height="480" fill="white"/>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
</defs>
<text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">CAS Retry Latency vs. Contention Level</text>
<text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">High numbers of competing threads cause cache line bouncing and exponentially increase retry latency.</text>
<text x="100" y="100" font-size="14" text-anchor="middle" fill="#1a1a1a">Latency</text>
<text x="800" y="420" font-size="14" text-anchor="middle" fill="#1a1a1a">Contention (Threads)</text>
<line x1="150" y1="400" x2="800" y2="400" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="150" y1="400" x2="150" y2="100" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="150" y1="380" x2="300" y2="370" stroke="#c0392b" stroke-width="2" marker-end="url(#none)"/>
<text x="225.0" y="365.0" font-size="12" text-anchor="middle" fill="#c0392b">Low Contention</text>
<line x1="300" y1="370" x2="500" y2="320" stroke="#c0392b" stroke-width="2" marker-end="url(#none)"/>
<line x1="500" y1="320" x2="650" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#none)"/>
<line x1="650" y1="200" x2="750" y2="50" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
<text x="700.0" y="115.0" font-size="12" text-anchor="middle" fill="#c0392b">Exponential Bouncing</text>
</svg>