<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="960" height="480" fill="white"/>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
</defs>
<text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Immutable Copy-on-Write Pointer Swap</text>
<text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Atomic update of composite state by copying to a new allocation and swapping the root pointer via CAS.</text>
<rect x="100" y="150" width="160" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6"/>
<text x="180.0" y="180.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Root Pointer</text>
<rect x="400" y="100" width="180" height="80" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="6"/>
<text x="490.0" y="145.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Old Object</text>
<rect x="400" y="250" width="180" height="80" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="6"/>
<text x="490.0" y="295.0" font-size="14" text-anchor="middle" fill="#1a1a1a">New Object (Copy)</text>
<line x1="260" y1="175" x2="400" y2="140" stroke="#c0392b" stroke-width="2" marker-end="url(#none)"/>
<text x="330.0" y="147.5" font-size="12" text-anchor="middle" fill="#c0392b">Old Reference</text>
<line x1="490" y1="180" x2="490" y2="250" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="490.0" y="205.0" font-size="12" text-anchor="middle" fill="#1a1a1a">Copy & Modify Locally</text>
<line x1="260" y1="175" x2="400" y2="290" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="330.0" y="222.5" font-size="12" text-anchor="middle" fill="#27ae60">CAS Swap to New</text>
</svg>