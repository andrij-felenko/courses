<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="960" height="480" fill="white"/>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
</defs>
<text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ARM Cortex-M Exclusive Monitor LDREX / STREX</text>
<text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">LDREX establishes an exclusive lock which is checked by STREX and can be cleared by context switches/interrupts.</text>
<rect x="100" y="100" width="200" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
<text x="200.0" y="130.0" font-size="14" text-anchor="middle" fill="#1a1a1a">LDREX (Load Exclusive)</text>
<rect x="380" y="220" width="200" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6"/>
<text x="480.0" y="250.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Exclusive Monitor State</text>
<rect x="660" y="100" width="200" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="6"/>
<text x="760.0" y="130.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Interrupt / Exception</text>
<rect x="380" y="350" width="200" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
<text x="480.0" y="380.0" font-size="14" text-anchor="middle" fill="#1a1a1a">STREX (Store Exclusive)</text>
<line x1="200" y1="150" x2="380" y2="245" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="290.0" y="187.5" font-size="12" text-anchor="middle" fill="#1a1a1a">Sets Monitor to Exclusive</text>
<line x1="760" y1="150" x2="580" y2="245" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
<text x="670.0" y="187.5" font-size="12" text-anchor="middle" fill="#c0392b">Clears Monitor (Open)</text>
<line x1="480" y1="350" x2="480" y2="270" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="480.0" y="300.0" font-size="12" text-anchor="middle" fill="#1a1a1a">Checks Monitor State</text>
</svg>