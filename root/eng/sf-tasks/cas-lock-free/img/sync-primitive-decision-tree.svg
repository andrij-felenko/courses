<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Матриця вибору примітивів синхронізації</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Прийняття рішень: CAS-цикли, м'ютекси чи Copy-on-Write</text>
  
    <rect x="373" y="103" width="214" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="480" y="124.9" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Структура даних складна?</text>
    
    <rect x="158" y="203" width="184" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="250" y="224.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Так (Часте читання?)</text>
    <rect x="603" y="203" width="214" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="710" y="224.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Ні (Одне поле/вказівник)</text>
    
    <path d="M 400 140 L 300 190" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 560 140 L 660 190" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    
    <rect x="62" y="303" width="176" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="150" y="324.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Copy-on-Write (RCU)</text>
    <rect x="289" y="303" width="122" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="350" y="324.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Mutex / Lock</text>
    <rect x="638" y="303" width="145" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="710" y="324.9" font-size="14" fill="#1a1a1a" text-anchor="middle">CAS (Lock-Free)</text>
    
    <path d="M 200 250 L 150 290" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 300 250 L 350 290" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 710 250 L 710 290" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
    
    <text x="175" y="270" font-size="12" fill="#6b7280" text-anchor="middle">Так</text>
    <text x="325" y="270" font-size="12" fill="#6b7280" text-anchor="middle">Ні</text>
    
</svg>