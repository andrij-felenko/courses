<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="960" height="480" fill="white"/>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
</defs>
<text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">CAS Livelock and Backoff Mitigation</text>
<text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Under severe contention, introducing an exponential backoff delay resolves cache line bouncing livelocks.</text>
<rect x="150" y="150" width="200" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="6"/>
<text x="250.0" y="185.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Thread A (Retry)</text>
<rect x="610" y="150" width="200" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="6"/>
<text x="710.0" y="185.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Thread B (Retry)</text>
<rect x="380" y="280" width="200" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="6"/>
<text x="480.0" y="315.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Backoff Delay</text>
<line x1="350" y1="180" x2="610" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
<text x="480.0" y="170.0" font-size="12" text-anchor="middle" fill="#c0392b">Continuous RFO Conflicts</text>
<line x1="250" y1="210" x2="380" y2="310" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="315.0" y="250.0" font-size="12" text-anchor="middle" fill="#1a1a1a">Pause execution</text>
<line x1="710" y1="210" x2="580" y2="310" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="645.0" y="250.0" font-size="12" text-anchor="middle" fill="#1a1a1a">Pause execution</text>
</svg>