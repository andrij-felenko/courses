<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="960" height="480" fill="white"/>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
</defs>
<text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ARM Exclusive Monitor State Machine</text>
<text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Transitions of the exclusive monitor state upon LDREX, STREX, and external events.</text>
<rect x="200" y="200" width="150" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6"/>
<text x="275.0" y="235.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Open State</text>
<rect x="600" y="200" width="150" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
<text x="675.0" y="235.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Exclusive State</text>
<line x1="350" y1="210" x2="600" y2="210" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="475.0" y="200.0" font-size="12" text-anchor="middle" fill="#1a1a1a">LDREX</text>
<line x1="600" y1="250" x2="350" y2="250" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="475.0" y="240.0" font-size="12" text-anchor="middle" fill="#27ae60">STREX (Success)</text>
<line x1="675" y1="200" x2="675" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#none)"/>
<line x1="675" y1="120" x2="275" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#none)"/>
<text x="475.0" y="110.0" font-size="12" text-anchor="middle" fill="#c0392b">Interrupt / Exception</text>
<line x1="275" y1="120" x2="275" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
</svg>