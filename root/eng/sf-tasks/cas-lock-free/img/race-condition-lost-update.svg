<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="960" height="480" fill="white"/>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
</defs>
<text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Data Race: Lost Update in Concurrent Execution</text>
<text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Unsynchronized parallel updates result in overwriting valid data, causing lost updates.</text>
<rect x="100" y="120" width="200" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
<text x="200.0" y="150.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Thread A: Read(10)</text>
<rect x="380" y="180" width="200" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="6"/>
<text x="480.0" y="210.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Thread B: Read(10)</text>
<rect x="100" y="240" width="200" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
<text x="200.0" y="270.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Thread A: Write(11)</text>
<rect x="380" y="300" width="200" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="6"/>
<text x="480.0" y="330.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Thread B: Write(11)</text>
<rect x="660" y="210" width="200" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6"/>
<text x="760.0" y="240.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Shared Memory: 11</text>
<line x1="300" y1="145" x2="660" y2="235" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="480.0" y="180.0" font-size="12" text-anchor="middle" fill="#2457d6">Reads 10</text>
<line x1="580" y1="205" x2="660" y2="235" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
<text x="620.0" y="210.0" font-size="12" text-anchor="middle" fill="#c0392b">Reads 10</text>
<line x1="300" y1="265" x2="660" y2="235" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="480.0" y="240.0" font-size="12" text-anchor="middle" fill="#2457d6">Writes 11</text>
<line x1="580" y1="325" x2="660" y2="235" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
<text x="620.0" y="270.0" font-size="12" text-anchor="middle" fill="#c0392b">Overwrites 11</text>
</svg>