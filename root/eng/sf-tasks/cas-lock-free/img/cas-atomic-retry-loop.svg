<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="960" height="480" fill="white"/>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
</defs>
<text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Atomic Retry Loop for State Recovery</text>
<text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Failed CAS attempts recover by updating their expected state to the latest valid memory state.</text>
<rect x="380" y="100" width="200" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
<text x="480.0" y="130.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Read Current State</text>
<rect x="380" y="190" width="200" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6"/>
<text x="480.0" y="220.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Compute New State</text>
<rect x="380" y="280" width="200" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
<text x="480.0" y="310.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Attempt CAS</text>
<rect x="100" y="190" width="150" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="6"/>
<text x="175.0" y="220.0" font-size="14" text-anchor="middle" fill="#1a1a1a">Update Local Expected</text>
<line x1="480" y1="150" x2="480" y2="190" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="480" y1="240" x2="480" y2="280" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="480" y1="330" x2="480" y2="390" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="480.0" y="350.0" font-size="12" text-anchor="middle" fill="#27ae60">True (Success)</text>
<line x1="380" y1="305" x2="175" y2="305" stroke="#c0392b" stroke-width="2" marker-end="url(#none)"/>
<text x="277.5" y="295.0" font-size="12" text-anchor="middle" fill="#c0392b">False (CAS Fails)</text>
<line x1="175" y1="305" x2="175" y2="240" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
<line x1="175" y1="190" x2="175" y2="125" stroke="#c0392b" stroke-width="2" marker-end="url(#none)"/>
<line x1="175" y1="125" x2="380" y2="125" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
</svg>