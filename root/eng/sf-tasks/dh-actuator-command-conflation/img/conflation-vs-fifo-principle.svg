<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Conflation vs FIFO Principle</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Instant replacement of stale values prevents phase lag and queue buildup.</text>
  <text x="200" y="150" font-size="16" fill="#1a1a1a" font-weight="bold">FIFO Queue</text>
  <rect x="200" y="170" width="60" height="40" fill="#fdecea" stroke="#c0392b"/>
  <text x="230" y="195" font-size="14" fill="#1a1a1a" text-anchor="middle">10°</text>
  <rect x="270" y="170" width="60" height="40" fill="#fdecea" stroke="#c0392b"/>
  <text x="300" y="195" font-size="14" fill="#1a1a1a" text-anchor="middle">20°</text>
  <rect x="340" y="170" width="60" height="40" fill="#fdecea" stroke="#c0392b"/>
  <text x="370" y="195" font-size="14" fill="#1a1a1a" text-anchor="middle">30°</text>
  <text x="430" y="195" font-size="14" fill="#c0392b">Queue fills up, old data processed.</text>
  
  <text x="200" y="280" font-size="16" fill="#1a1a1a" font-weight="bold">Conflating Queue</text>
  <rect x="200" y="300" width="60" height="40" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="230" y="325" font-size="14" fill="#1a1a1a" text-anchor="middle">30°</text>
  <text x="280" y="325" font-size="14" fill="#27ae60">Replaces 10° and 20° instantly.</text>
  <path d="M 140 320 L 180 320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="160" y="310" font-size="12" fill="#2457d6" text-anchor="middle">New</text>
</svg>