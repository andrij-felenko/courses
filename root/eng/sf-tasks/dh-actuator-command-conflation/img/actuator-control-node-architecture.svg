<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня структура вузла керування актуатором</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Згортання команд, фільтрація мертвої зони та безглічевий вивід у тіньові регістри</text>

  <!-- Блок 1: Поштова скринька стану -->
  <rect x="24" y="74" width="206" height="362" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="127" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Поштова скринька</text>
  <text x="127" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Слот стану (latest-wins)</text>

  <rect x="38" y="128" width="178" height="76" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="127" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Слот устави u_target</text>
  <text x="127" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">Вхід: u_cmd [RTOS-задача]</text>
  <text x="127" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Атомарний перезапис</text>

  <line x1="127" y1="204" x2="127" y2="222" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="38" y="226" width="178" height="82" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="127" y="250" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип latest-wins</text>
  <text x="127" y="272" font-size="12" fill="#6b7280" text-anchor="middle">Заміна старих устав</text>
  <text x="127" y="294" font-size="12" fill="#2457d6" text-anchor="middle">Лічильник drop_count++</text>

  <line x1="127" y1="308" x2="127" y2="328" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="38" y="332" width="178" height="84" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="127" y="356" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Гарантія свіжості</text>
  <text x="127" y="378" font-size="12" fill="#1a1a1a" text-anchor="middle">Розмір черги Q = 1</text>
  <text x="127" y="400" font-size="12" fill="#6b7280" text-anchor="middle">Нульове роздування черги</text>

  <!-- Зв'язок 1 -> 2 -->
  <line x1="230" y1="166" x2="252" y2="166" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Блок 2: Фільтр мертвої зони -->
  <rect x="254" y="74" width="206" height="362" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="357" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Фільтр мертвої зони</text>
  <text x="357" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Селектор приросту |Δu|</text>

  <rect x="268" y="128" width="178" height="76" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="357" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фільтр приросту устави</text>
  <text x="357" y="168" font-size="12" fill="#2457d6" text-anchor="middle">|Δu| = |u_target − u_last|</text>
  <text x="357" y="188" font-size="12" fill="#27ae60" text-anchor="middle">Умова: |Δu| &gt; δ_dead</text>

  <line x1="357" y1="204" x2="357" y2="230" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="268" y="234" width="178" height="84" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="357" y="256" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">|Δu| ≤ δ_dead: Пригнічено</text>
  <text x="357" y="278" font-size="12" fill="#1a1a1a" text-anchor="middle">Ігнорування шуму АЦП</text>
  <text x="357" y="300" font-size="12" fill="#6b7280" text-anchor="middle">Команда не йде на привід</text>

  <line x1="357" y1="318" x2="357" y2="338" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="268" y="342" width="178" height="74" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="357" y="366" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захист механіки</text>
  <text x="357" y="388" font-size="12" fill="#27ae60" text-anchor="middle">Усунення дрижання вала</text>
  <text x="357" y="406" font-size="12" fill="#6b7280" text-anchor="middle">Збереження ресурсу зубців</text>

  <!-- Зв'язок 2 -> 3 -->
  <line x1="460" y1="166" x2="482" y2="166" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Блок 3: Таймер охолодження -->
  <rect x="484" y="74" width="206" height="362" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="587" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Таймер охолодження</text>
  <text x="587" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Темпоральний бар'єр T_cool</text>

  <rect x="498" y="128" width="178" height="76" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="587" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контроль паузи виводу</text>
  <text x="587" y="168" font-size="12" fill="#2457d6" text-anchor="middle">Δt = t_now − t_last</text>
  <text x="587" y="188" font-size="12" fill="#27ae60" text-anchor="middle">Умова: Δt ≥ T_cooldown</text>

  <line x1="587" y1="204" x2="587" y2="230" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="498" y="234" width="178" height="84" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="587" y="256" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Δt &lt; T_cool: Очікування</text>
  <text x="587" y="278" font-size="12" fill="#1a1a1a" text-anchor="middle">Утримання у скриньці</text>
  <text x="587" y="300" font-size="12" fill="#6b7280" text-anchor="middle">Згортання нових устав</text>

  <line x1="587" y1="318" x2="587" y2="338" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="498" y="342" width="178" height="74" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="587" y="366" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тепловий захист</text>
  <text x="587" y="388" font-size="12" fill="#27ae60" text-anchor="middle">Обмеження частоти пусків</text>
  <text x="587" y="406" font-size="12" fill="#6b7280" text-anchor="middle">Запобігання перегріву ключів</text>

  <!-- Зв'язок 3 -> 4 -->
  <line x1="690" y1="166" x2="712" y2="166" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Блок 4: Конвеєр апаратного виводу -->
  <rect x="714" y="74" width="222" height="362" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="825" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Апаратний конвеєр</text>
  <text x="825" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Тіньові регістри таймера</text>

  <rect x="728" y="128" width="194" height="76" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="825" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Тіньовий регістр (Shadow)</text>
  <text x="825" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">Буфер: TIMx_CCR Preload</text>
  <text x="825" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Атомарний запис прошивкою</text>

  <line x1="825" y1="204" x2="825" y2="224" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="728" y="226" width="194" height="82" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="825" y="248" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подія оновлення UEV</text>
  <text x="825" y="270" font-size="12" fill="#2457d6" text-anchor="middle">Строб: CNT = ARR (період)</text>
  <text x="825" y="292" font-size="12" fill="#6b7280" text-anchor="middle">Апаратне перенесення</text>

  <line x1="825" y1="308" x2="825" y2="328" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="728" y="332" width="194" height="84" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="825" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Активний регістр (Active)</text>
  <text x="825" y="376" font-size="12" fill="#1a1a1a" text-anchor="middle">TIMx_CCR → Компаратор</text>
  <text x="825" y="398" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Безглічевий вивід ШІМ</text>
</svg>
