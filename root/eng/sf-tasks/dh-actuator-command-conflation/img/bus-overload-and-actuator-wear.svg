<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Bus Overload and Actuator Wear</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">High-frequency control commands cause network congestion and mechanical wear.</text>
  <rect x="100" y="150" width="120" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="160" y="175" font-size="14" fill="#1a1a1a" text-anchor="middle">Producer A</text>
  <rect x="100" y="210" width="120" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="160" y="235" font-size="14" fill="#1a1a1a" text-anchor="middle">Producer B</text>
  <rect x="100" y="270" width="120" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="160" y="295" font-size="14" fill="#1a1a1a" text-anchor="middle">Producer C</text>
  
  <rect x="350" y="100" width="260" height="260" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="4"/>
  <text x="480" y="130" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">Network Bus Congestion</text>
  
  <path d="M 230 170 L 330 200" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M 230 230 L 330 230" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M 230 290 L 330 260" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>
  
  <rect x="400" y="160" width="160" height="30" fill="#c0392b" opacity="0.8"/>
  <text x="480" y="180" font-size="12" fill="white" text-anchor="middle">Command 1</text>
  <rect x="400" y="200" width="160" height="30" fill="#c0392b" opacity="0.8"/>
  <text x="480" y="220" font-size="12" fill="white" text-anchor="middle">Command 2</text>
  <rect x="400" y="240" width="160" height="30" fill="#c0392b" opacity="0.8"/>
  <text x="480" y="260" font-size="12" fill="white" text-anchor="middle">Command 3</text>
  <rect x="400" y="280" width="160" height="30" fill="#c0392b" opacity="0.8"/>
  <text x="480" y="300" font-size="12" fill="white" text-anchor="middle">Command 4</text>
  
  <rect x="700" y="210" width="120" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="760" y="235" font-size="14" fill="#1a1a1a" text-anchor="middle">Actuator</text>
  <path d="M 620 230 L 680 230" stroke="#2457d6" stroke-width="3" marker-end="url(#arr)"/>
  
  <text x="760" y="275" font-size="12" fill="#c0392b" text-anchor="middle">Mechanical Wear!</text>
</svg>