<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-rev-red" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Вплив черги FIFO та згортання команд на динаміку актуатора</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Згортання (latest-wins) усуває накопичення фазової затримки та захищає механіку від дріботіння</text>

  <!-- ================= ВЕРХНЯ ПАНЕЛЬ: ЧЕРГА FIFO (ПРОБЛЕМА) ================= -->
  <rect x="25" y="68" width="910" height="216" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>

  <!-- Бейдж статусу FIFO -->
  <rect x="45" y="78" width="220" height="22" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="155" y="94" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">БЕЗ ЗГОРТАННЯ: ЧЕРГА FIFO</text>
  <text x="280" y="94" font-size="12" fill="#6b7280">Накопичення проміжних команд спричиняє фазове запізнення</text>

  <!-- Ліва картка: структура черги FIFO -->
  <rect x="45" y="106" width="280" height="166" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="185" y="126" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Буфер міжзадачного обміну FIFO</text>

  <!-- Потік і пакети у черзі -->
  <line x1="55" y1="158" x2="72" y2="158" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <rect x="76" y="142" width="168" height="32" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="80" y="146" width="36" height="24" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="98" y="163" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">30°</text>

  <rect x="122" y="146" width="36" height="24" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="140" y="163" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">60°</text>

  <rect x="164" y="146" width="36" height="24" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="182" y="163" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">25°</text>

  <rect x="206" y="146" width="34" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="223" y="163" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">85°</text>

  <line x1="248" y1="158" x2="265" y2="158" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="268" y="142" width="50" height="32" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="293" y="162" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Привід</text>

  <!-- Пояснення в картці FIFO -->
  <text x="185" y="196" font-size="12" text-anchor="middle" fill="#c0392b">Черга переповнена застарілими станами</text>
  <text x="185" y="214" font-size="12" text-anchor="middle" fill="#6b7280">Привід відпрацьовує всі проміжні кроки</text>
  <text x="185" y="232" font-size="12" text-anchor="middle" fill="#6b7280">Швидкість вичитування лімітована τ_mech</text>
  <text x="185" y="250" font-size="12" text-anchor="middle" fill="#1a1a1a">Затримка доставки: N × τ_step</text>

  <!-- Права картка: часова діаграма FIFO -->
  <rect x="340" y="106" width="580" height="166" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Легенда FIFO -->
  <text x="355" y="124" font-size="12" font-weight="bold" fill="#1a1a1a">Динаміка кута θ(t)</text>
  <line x1="560" y1="120" x2="585" y2="120" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="592" y="124" font-size="12" fill="#2457d6">Уставка θ_cmd</text>
  <line x1="710" y1="120" x2="735" y2="120" stroke="#c0392b" stroke-width="2.5"/>
  <text x="742" y="124" font-size="12" fill="#c0392b">Фактичний кут θ_act</text>

  <!-- Вісі графіка FIFO -->
  <line x1="410" y1="134" x2="410" y2="238" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="410" y1="238" x2="890" y2="238" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="898" y="242" font-size="12" fill="#1a1a1a">t, мс</text>

  <!-- Позначки вертикальної вісі θ -->
  <text x="402" y="242" font-size="12" text-anchor="end" fill="#6b7280">0°</text>
  <line x1="406" y1="238" x2="410" y2="238" stroke="#1a1a1a"/>

  <text x="402" y="196" font-size="12" text-anchor="end" fill="#6b7280">45°</text>
  <line x1="406" y1="192" x2="410" y2="192" stroke="#1a1a1a"/>

  <text x="402" y="148" font-size="12" text-anchor="end" fill="#6b7280">90°</text>
  <line x1="406" y1="144" x2="410" y2="144" stroke="#1a1a1a"/>

  <!-- Часові мітки та засічки t -->
  <line x1="490" y1="234" x2="490" y2="238" stroke="#1a1a1a"/>
  <text x="490" y="254" font-size="12" text-anchor="middle" fill="#6b7280">25</text>

  <line x1="570" y1="234" x2="570" y2="238" stroke="#1a1a1a"/>
  <text x="570" y="254" font-size="12" text-anchor="middle" fill="#6b7280">50</text>

  <line x1="650" y1="234" x2="650" y2="238" stroke="#1a1a1a"/>
  <text x="650" y="254" font-size="12" text-anchor="middle" fill="#6b7280">75</text>

  <line x1="730" y1="234" x2="730" y2="238" stroke="#1a1a1a"/>
  <text x="730" y="254" font-size="12" text-anchor="middle" fill="#6b7280">100</text>

  <line x1="810" y1="234" x2="810" y2="238" stroke="#1a1a1a"/>
  <text x="810" y="254" font-size="12" text-anchor="middle" fill="#6b7280">125</text>

  <!-- Траєкторія уставки θ_cmd(t) -->
  <polyline points="410,238 410,206 490,206 490,174 570,174 570,211 650,211 650,149 880,149"
            fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Траєкторія актуатора θ_act(t) в черзі FIFO: відставання, коливання, реверс -->
  <path d="M410,238 C440,238 460,208 490,206 C520,204 540,176 570,174 C600,172 620,209 650,211 C690,213 740,154 810,149 L880,149"
        fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Анотація дріботіння / реверсу -->
  <text x="605" y="148" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Паразитний реверс</text>
  <text x="605" y="162" font-size="12" text-anchor="middle" fill="#c0392b">(механічний знос)</text>

  <!-- Стрілка та вимір затримки Δt_lag -->
  <line x1="650" y1="138" x2="810" y2="138" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-rev-red)" marker-end="url(#arr-red)"/>
  <text x="730" y="133" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Фазова затримка Δt_lag</text>


  <!-- ================= НИЖНЯ ПАНЕЛЬ: ЗГОРТАННЯ КОМАНД (РОЗВ'ЯЗОК) ================= -->
  <rect x="25" y="298" width="910" height="216" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>

  <!-- Бейдж статусу Conflation -->
  <rect x="45" y="308" width="260" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="175" y="324" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">ЗГОРТАННЯ КОМАНД: LATEST-WINS</text>
  <text x="320" y="324" font-size="12" fill="#6b7280">Перезапис старих устав усуває затримку та дріботіння</text>

  <!-- Ліва картка: структура поштової скриньки -->
  <rect x="45" y="336" width="280" height="166" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="185" y="356" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Поштова скринька стану (1 слот)</text>

  <!-- Потік і слот згортання -->
  <line x1="55" y1="388" x2="72" y2="388" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="76" y="372" width="168" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <rect x="115" y="376" width="90" height="24" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="160" y="393" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">85° (актуальна)</text>

  <line x1="248" y1="388" x2="265" y2="388" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="268" y="372" width="50" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="293" y="392" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Привід</text>

  <!-- Пояснення в картці Conflation -->
  <text x="185" y="426" font-size="12" text-anchor="middle" fill="#27ae60">Проміжні устави 30°, 60°, 25° перезаписано</text>
  <text x="185" y="444" font-size="12" text-anchor="middle" fill="#6b7280">Привід отримує лише фінальну координату</text>
  <text x="185" y="462" font-size="12" text-anchor="middle" fill="#6b7280">Обсяг буфера O(1), відсутність черги</text>
  <text x="185" y="480" font-size="12" text-anchor="middle" fill="#1a1a1a">Затримка доставки: Δt_queue = 0</text>

  <!-- Права картка: часова діаграма Conflation -->
  <rect x="340" y="336" width="580" height="166" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Легенда Conflation -->
  <text x="355" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">Динаміка кута θ(t)</text>
  <line x1="560" y1="350" x2="585" y2="350" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="592" y="354" font-size="12" fill="#2457d6">Уставка θ_cmd</text>
  <line x1="710" y1="350" x2="735" y2="350" stroke="#27ae60" stroke-width="2.5"/>
  <text x="742" y="354" font-size="12" fill="#27ae60">Фактичний кут θ_act</text>

  <!-- Вісі графіка Conflation -->
  <line x1="410" y1="364" x2="410" y2="468" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="410" y1="468" x2="890" y2="468" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="898" y="472" font-size="12" fill="#1a1a1a">t, мс</text>

  <!-- Позначки вертикальної вісі θ -->
  <text x="402" y="472" font-size="12" text-anchor="end" fill="#6b7280">0°</text>
  <line x1="406" y1="468" x2="410" y2="468" stroke="#1a1a1a"/>

  <text x="402" y="426" font-size="12" text-anchor="end" fill="#6b7280">45°</text>
  <line x1="406" y1="422" x2="410" y2="422" stroke="#1a1a1a"/>

  <text x="402" y="378" font-size="12" text-anchor="end" fill="#6b7280">90°</text>
  <line x1="406" y1="374" x2="410" y2="374" stroke="#1a1a1a"/>

  <!-- Часові мітки та засічки t -->
  <line x1="490" y1="464" x2="490" y2="468" stroke="#1a1a1a"/>
  <text x="490" y="484" font-size="12" text-anchor="middle" fill="#6b7280">25</text>

  <line x1="570" y1="464" x2="570" y2="468" stroke="#1a1a1a"/>
  <text x="570" y="484" font-size="12" text-anchor="middle" fill="#6b7280">50</text>

  <line x1="650" y1="464" x2="650" y2="468" stroke="#1a1a1a"/>
  <text x="650" y="484" font-size="12" text-anchor="middle" fill="#6b7280">75</text>

  <line x1="730" y1="464" x2="730" y2="468" stroke="#1a1a1a"/>
  <text x="730" y="484" font-size="12" text-anchor="middle" fill="#6b7280">100</text>

  <line x1="810" y1="464" x2="810" y2="468" stroke="#1a1a1a"/>
  <text x="810" y="484" font-size="12" text-anchor="middle" fill="#6b7280">125</text>

  <!-- Траєкторія уставки θ_cmd(t) -->
  <polyline points="410,468 410,436 490,436 490,404 570,404 570,441 650,441 650,379 880,379"
            fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Траєкторія актуатора θ_act(t) зі згортанням: прямий плавний перехід без дріботіння -->
  <path d="M410,468 C450,468 530,448 610,395 C640,381 670,379 700,379 L880,379"
        fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Анотація відсутності затримки та прямого руху -->
  <text x="770" y="416" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Прямий вихід на 85°</text>
  <text x="770" y="432" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Затримка черги Δt_lag = 0</text>
  <text x="770" y="448" font-size="12" text-anchor="middle" fill="#6b7280">Час переходу лімітовано лише τ_mech</text>
</svg>
