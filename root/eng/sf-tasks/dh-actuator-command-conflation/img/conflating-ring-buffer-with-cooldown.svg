<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457d6"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Conflating Ring Buffer with Cooldown Timer</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">State overwrite by actuator key and mandatory cooling intervals.</text>
  <rect x="150" y="140" width="250" height="200" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="275" y="170" font-size="14" fill="#27ae60" font-weight="bold" text-anchor="middle">Ring Buffer Map</text>
  
  <rect x="170" y="190" width="210" height="35" fill="white" stroke="#d0d7de"/>
  <text x="180" y="212" font-size="12" fill="#1a1a1a">Key: Act1 | Val: 45°</text>
  
  <rect x="170" y="235" width="210" height="35" fill="white" stroke="#d0d7de"/>
  <text x="180" y="257" font-size="12" fill="#1a1a1a">Key: Act2 | Val: 10°</text>
  
  <rect x="170" y="280" width="210" height="35" fill="white" stroke="#d0d7de"/>
  <text x="180" y="302" font-size="12" fill="#1a1a1a">Key: Act3 | Val: 180°</text>
  
  <rect x="550" y="140" width="220" height="200" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="660" y="170" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Actuator Output Controller</text>
  
  <rect x="580" y="220" width="160" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="660" y="240" font-size="12" fill="#c0392b" text-anchor="middle">Cooldown Timer</text>
  <text x="660" y="260" font-size="12" fill="#1a1a1a" text-anchor="middle">T_wait = 15ms</text>
  
  <path d="M 420 240 L 530 240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="475" y="230" font-size="12" fill="#2457d6" text-anchor="middle">Check Ready</text>
</svg>