<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Характеристики згортання команд: коефіцієнт пригнічення та затримка</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Пригнічення S асимптотично прямує до 1.0, а верхня межа затримки L_max зростає строго лінійно з T_cd</text>

  <!-- ================= ПАНЕЛЬ А: КОЕФІЦІЄНТ ПРИГНІЧЕННЯ S ================= -->
  <rect x="24" y="70" width="444" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>

  <!-- Заголовок панелі А -->
  <rect x="38" y="82" width="210" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="143" y="98" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">КОЕФІЦІЄНТ ПРИГНІЧЕННЯ S</text>

  <rect x="256" y="82" width="198" height="24" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="355" y="98" font-size="12" text-anchor="middle" fill="#1a1a1a">S = 1 − 1 / k (де k = f_in · T_cd)</text>

  <!-- Біла картка графіка А -->
  <rect x="38" y="116" width="416" height="236" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Асимптота S = 1.0 -->
  <line x1="94" y1="146" x2="416" y2="146" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="250" y="138" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">Асимптота S = 1.0 (100% пригнічення)</text>

  <!-- Вісі координат графіка А -->
  <line x1="94" y1="296" x2="432" y2="296" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="94" y1="296" x2="94" y2="136" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="260" y="336" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Кратність потоку k = f_in · T_cd = T_cd / T_in</text>
  <text x="94" y="128" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">S</text>

  <!-- Позначки вертикальної вісі S -->
  <line x1="88" y1="296" x2="94" y2="296" stroke="#1a1a1a"/>
  <text x="84" y="300" font-size="12" text-anchor="end" fill="#6b7280">0.0</text>

  <line x1="88" y1="266" x2="94" y2="266" stroke="#1a1a1a"/>
  <text x="84" y="270" font-size="12" text-anchor="end" fill="#6b7280">0.2</text>

  <line x1="88" y1="236" x2="94" y2="236" stroke="#1a1a1a"/>
  <text x="84" y="240" font-size="12" text-anchor="end" fill="#6b7280">0.4</text>

  <line x1="88" y1="206" x2="94" y2="206" stroke="#1a1a1a"/>
  <text x="84" y="210" font-size="12" text-anchor="end" fill="#6b7280">0.6</text>

  <line x1="88" y1="176" x2="94" y2="176" stroke="#1a1a1a"/>
  <text x="84" y="180" font-size="12" text-anchor="end" fill="#6b7280">0.8</text>

  <line x1="88" y1="146" x2="94" y2="146" stroke="#1a1a1a"/>
  <text x="84" y="150" font-size="12" text-anchor="end" fill="#6b7280">1.0</text>

  <!-- Позначки горизонтальної вісі k -->
  <line x1="110" y1="296" x2="110" y2="302" stroke="#1a1a1a"/>
  <text x="110" y="316" font-size="12" text-anchor="middle" fill="#6b7280">1</text>

  <line x1="174" y1="296" x2="174" y2="302" stroke="#1a1a1a"/>
  <text x="174" y="316" font-size="12" text-anchor="middle" fill="#6b7280">5</text>

  <line x1="254" y1="296" x2="254" y2="302" stroke="#1a1a1a"/>
  <text x="254" y="316" font-size="12" text-anchor="middle" fill="#6b7280">10</text>

  <line x1="334" y1="296" x2="334" y2="302" stroke="#1a1a1a"/>
  <text x="334" y="316" font-size="12" text-anchor="middle" fill="#6b7280">15</text>

  <line x1="414" y1="296" x2="414" y2="302" stroke="#1a1a1a"/>
  <text x="414" y="316" font-size="12" text-anchor="middle" fill="#6b7280">20</text>

  <!-- Крива 2: Стохастичний потік S = k / (1 + k) -->
  <path d="M94,296 C105,250 120,205 174,171 C220,163 310,155 414,153.2" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- Крива 1: Періодичний потік S = 1 - 1/k -->
  <path d="M110,296 C120,230 135,188 174,176 C220,165 310,155 414,153.5" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Точка на кривій k = 20 -->
  <circle cx="414" cy="153.5" r="4" fill="#2457d6"/>

  <!-- Легенда кривих графіка А -->
  <line x1="180" y1="200" x2="204" y2="200" stroke="#2457d6" stroke-width="2.5"/>
  <text x="210" y="204" font-size="12" fill="#1a1a1a">Періодичний: S = 1 − 1/k</text>

  <line x1="180" y1="218" x2="204" y2="218" stroke="#27ae60" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="210" y="222" font-size="12" fill="#1a1a1a">Пуассон: S = k / (1 + k)</text>

  <!-- Бейдж робочої точки -->
  <rect x="180" y="234" width="226" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="293" y="250" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Робоча точка: k = 20 → S = 95%</text>
  <text x="293" y="266" font-size="12" text-anchor="middle" fill="#6b7280">f_in = 500 Гц, T_cd = 40 мс</text>

  <!-- Нижня картка аналізу панелі А -->
  <rect x="38" y="362" width="416" height="74" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="50" y="372" width="130" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="115" y="386" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">ВИСНОВОК: ЕФЕКТ</text>
  <text x="50" y="408" font-size="12" fill="#1a1a1a">При k ≥ 10 коефіцієнт пригнічення сягає 90–95%.</text>
  <text x="50" y="426" font-size="12" fill="#6b7280">Шина повністю захищена від перевантаження проміжними уставами.</text>

  <!-- ================= ПАНЕЛЬ Б: ВЕРХНЯ МЕЖА ЗАТРИМКИ L ================= -->
  <rect x="492" y="70" width="444" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>

  <!-- Заголовок панелі Б -->
  <rect x="506" y="82" width="210" height="24" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="611" y="98" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">ВЕРХНЯ МЕЖА ЗАТРИМКИ L</text>

  <rect x="724" y="82" width="198" height="24" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="823" y="98" font-size="12" text-anchor="middle" fill="#1a1a1a">L_max = T_cd + T_tx (строго лінійна)</text>

  <!-- Біла картка графіка Б -->
  <rect x="506" y="116" width="416" height="236" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Вісі координат графіка Б -->
  <line x1="562" y1="296" x2="900" y2="296" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="562" y1="296" x2="562" y2="136" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="722" y="336" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Тривалість вікна охолодження T_cd, мс</text>
  <text x="562" y="128" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">L, мс</text>

  <!-- Позначки вертикальної вісі L -->
  <line x1="556" y1="296" x2="562" y2="296" stroke="#1a1a1a"/>
  <text x="552" y="300" font-size="12" text-anchor="end" fill="#6b7280">0</text>

  <line x1="556" y1="266" x2="562" y2="266" stroke="#1a1a1a"/>
  <text x="552" y="270" font-size="12" text-anchor="end" fill="#6b7280">10</text>

  <line x1="556" y1="236" x2="562" y2="236" stroke="#1a1a1a"/>
  <text x="552" y="240" font-size="12" text-anchor="end" fill="#6b7280">20</text>

  <line x1="556" y1="206" x2="562" y2="206" stroke="#1a1a1a"/>
  <text x="552" y="210" font-size="12" text-anchor="end" fill="#6b7280">30</text>

  <line x1="556" y1="176" x2="562" y2="176" stroke="#1a1a1a"/>
  <text x="552" y="180" font-size="12" text-anchor="end" fill="#6b7280">40</text>

  <line x1="556" y1="146" x2="562" y2="146" stroke="#1a1a1a"/>
  <text x="552" y="150" font-size="12" text-anchor="end" fill="#6b7280">50</text>

  <!-- Позначки горизонтальної вісі T_cd -->
  <line x1="562" y1="296" x2="562" y2="302" stroke="#1a1a1a"/>
  <text x="562" y="316" font-size="12" text-anchor="middle" fill="#6b7280">0</text>

  <line x1="626" y1="296" x2="626" y2="302" stroke="#1a1a1a"/>
  <text x="626" y="316" font-size="12" text-anchor="middle" fill="#6b7280">10</text>

  <line x1="690" y1="296" x2="690" y2="302" stroke="#1a1a1a"/>
  <text x="690" y="316" font-size="12" text-anchor="middle" fill="#6b7280">20</text>

  <line x1="754" y1="296" x2="754" y2="302" stroke="#1a1a1a"/>
  <text x="754" y="316" font-size="12" text-anchor="middle" fill="#6b7280">30</text>

  <line x1="818" y1="296" x2="818" y2="302" stroke="#1a1a1a"/>
  <text x="818" y="316" font-size="12" text-anchor="middle" fill="#6b7280">40</text>

  <line x1="882" y1="296" x2="882" y2="302" stroke="#1a1a1a"/>
  <text x="882" y="316" font-size="12" text-anchor="middle" fill="#6b7280">50</text>

  <!-- Нижня межа: L_min = T_tx = 0.25 мс -->
  <line x1="562" y1="295" x2="882" y2="295" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Середня затримка: E[L] = T_cd / 2 + T_tx -->
  <line x1="562" y1="295" x2="882" y2="220" stroke="#27ae60" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- Верхня межа: L_max = T_cd + T_tx -->
  <line x1="562" y1="295" x2="882" y2="145" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Пунктир і точка дедлайну для T_cd = 40 мс -->
  <line x1="818" y1="175" x2="818" y2="296" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="818" cy="175" r="4" fill="#c0392b"/>
  <text x="810" y="168" font-size="12" font-weight="bold" text-anchor="end" fill="#c0392b">40.25 мс</text>

  <!-- Легенда ліній графіка Б -->
  <line x1="576" y1="154" x2="600" y2="154" stroke="#c0392b" stroke-width="2.5"/>
  <text x="606" y="158" font-size="12" fill="#1a1a1a">L_max = T_cd + T_tx</text>

  <line x1="576" y1="172" x2="600" y2="172" stroke="#27ae60" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="606" y="176" font-size="12" fill="#1a1a1a">E[L] = T_cd / 2 + T_tx</text>

  <line x1="576" y1="190" x2="600" y2="190" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="606" y="194" font-size="12" fill="#1a1a1a">L_min = T_tx = 0.25 мс</text>

  <!-- Нижня картка аналізу панелі Б -->
  <rect x="506" y="362" width="416" height="74" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="518" y="372" width="130" height="20" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="583" y="386" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">ВИСНОВОК: ДЕДЛАЙН</text>
  <text x="518" y="408" font-size="12" fill="#1a1a1a">Затримка обмежена: при T_cd = 40 мс дедлайн L_max = 40.25 мс.</text>
  <text x="518" y="426" font-size="12" fill="#6b7280">Строго лінійне зростання забезпечує передбачуваність затримок RTOS.</text>

  <!-- ================= НИЖНЯ СМУГА ПІДСУМКУ ================= -->
  <rect x="24" y="462" width="912" height="54" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>

  <rect x="36" y="470" width="422" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="48" y="486" font-size="12" font-weight="bold" fill="#2457d6">Виграш у трафіку:</text>
  <text x="48" y="500" font-size="12" fill="#1a1a1a">Асимптота S → 1.0 усуває до 95–99% надлишкового трафіку шини</text>

  <rect x="478" y="470" width="446" height="38" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="490" y="486" font-size="12" font-weight="bold" fill="#c0392b">Ціна згортання:</text>
  <text x="490" y="500" font-size="12" fill="#1a1a1a">Лінійне зростання затримки: L_max = T_cd + T_tx під час паузи</text>
</svg>
