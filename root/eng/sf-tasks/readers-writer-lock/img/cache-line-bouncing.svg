<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна спільних лічильників: Cache Line Bouncing на багатьох ядрах</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен атомарний read_lock() інвалідує спільний рядок кешу на всіх інших процесорних ядрах</text>
<rect x="40.0" y="75.0" width="380.0" height="245.0" rx="8" fill="#fcfcfc" stroke="#c0392b" stroke-width="1.2"/>
<text x="230.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Централізований RWLock</text>
<rect x="90.0" y="120.0" width="120.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Ядро 0</tspan><tspan x="150.0" dy="13.0">fetch_add()</tspan></text>
<rect x="270.0" y="120.0" width="120.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Ядро 1</tspan><tspan x="330.0" dy="13.0">fetch_add()</tspan></text>
<rect x="90.0" y="180.0" width="120.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Ядро 2</tspan><tspan x="150.0" dy="13.0">fetch_add()</tspan></text>
<rect x="270.0" y="180.0" width="120.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Ядро 3</tspan><tspan x="330.0" dy="13.0">fetch_add()</tspan></text>
<rect x="100.0" y="245.0" width="260.0" height="40.0" rx="6" fill="#fff3cd" stroke="#caa24a" stroke-width="1.5"/><text x="230.0" y="262.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Спільний рядок кешу (atomic reader_count)</tspan><tspan x="230.0" dy="11.7">Інвалідація L1/L2 через шину MESI!</tspan></text>
<rect x="460.0" y="75.0" width="380.0" height="245.0" rx="8" fill="#fcfcfc" stroke="#27ae60" stroke-width="1.2"/>
<text x="650.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Розподілений (Per-CPU) RWLock</text>
<rect x="490.0" y="120.0" width="140.0" height="35.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Ядро 0</tspan><tspan x="560.0" dy="13.0">local_count_0++</tspan></text>
<rect x="670.0" y="120.0" width="140.0" height="35.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Ядро 1</tspan><tspan x="740.0" dy="13.0">local_count_1++</tspan></text>
<rect x="490.0" y="180.0" width="140.0" height="35.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Ядро 2</tspan><tspan x="560.0" dy="13.0">local_count_2++</tspan></text>
<rect x="670.0" y="180.0" width="140.0" height="35.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Ядро 3</tspan><tspan x="740.0" dy="13.0">local_count_3++</tspan></text>
<rect x="490.0" y="245.0" width="320.0" height="40.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="262.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Читачі пишуть лише у свій локальний рядок!</tspan><tspan x="650.0" dy="11.7">Письменник підсумовує всі ядра (повільний write, миттєвий read)</tspan></text>
<rect x="40.0" y="355.0" width="800.0" height="44.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">На 32–128 ядрах звичайний RWLock втрачає швидкість через апаратні конфлікти кешу.</tspan><tspan x="440.0" dy="13.0">Для систем із домінуванням читання застосовують розподілені Per-CPU замки або RCU.</tspan></text>
</svg>