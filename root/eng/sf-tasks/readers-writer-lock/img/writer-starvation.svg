<rect x="30.0" y="345.0" width="820.0" height="44.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Небезпека: за неперервного потоку читачів сума активних читачів завжди більша за нуль.</tspan><tspan x="440.0" dy="13.0">Письменник не отримує доступу, доки не зміниться політика на користь черги або письменників.</tspan></text>
