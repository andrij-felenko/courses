<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів атомарного Readers-Writer Lock</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Як одне 32-бітне атомарне слово кодує вільний стан, читачів і чергу запису</text>
<rect x="80.0" y="160.0" width="180.0" height="70.0" rx="6" fill="#f8f9fa" stroke="#27ae60" stroke-width="2.0"/><text x="170.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">ВІЛЬНИЙ (UNLOCKED)</tspan><tspan x="170.0" dy="14.3">readers = 0</tspan><tspan x="170.0" dy="14.3">writer_active = 0</tspan></text>
<rect x="350.0" y="80.0" width="210.0" height="70.0" rx="6" fill="#d4edda" stroke="#1b7340" stroke-width="2.0"/><text x="455.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b7340" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">СПІЛЬНЕ ЧИТАННЯ (SHARED)</tspan><tspan x="455.0" dy="14.3">readers = N (N &gt; 0)</tspan><tspan x="455.0" dy="14.3">writer_active = 0</tspan></text>
<rect x="620.0" y="160.0" width="210.0" height="70.0" rx="6" fill="#fff3cd" stroke="#d35400" stroke-width="2.0"/><text x="725.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">ОЧІКУВАННЯ ЗАПИСУ</tspan><tspan x="725.0" dy="14.3">readers = N (падає до 0)</tspan><tspan x="725.0" dy="14.3">writers_waiting &gt; 0</tspan></text>
<rect x="350.0" y="260.0" width="210.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="455.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">ЕКСКЛЮЗИВНИЙ ЗАПИС</tspan><tspan x="455.0" dy="14.3">readers = 0</tspan><tspan x="455.0" dy="14.3">writer_active = 1</tspan></text>
<line x1="210.0" y1="160.0" x2="350.0" y2="120.0" stroke="#1b7340" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="240.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1b7340" text-anchor="middle" font-weight="700">+1 читач (CAS)</text>
<line x1="350.0" y1="140.0" x2="240.0" y2="180.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="300.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">останній reader_unlock</text>
<line x1="560.0" y1="120.0" x2="650.0" y2="160.0" stroke="#d35400" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="640.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">write_lock() чекає</text>
<line x1="670.0" y1="230.0" x2="560.0" y2="280.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="660.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">readers == 0 (сигнал)</text>
<line x1="220.0" y1="220.0" x2="350.0" y2="280.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="230.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">write_lock() (CAS)</text>
<line x1="350.0" y1="290.0" x2="170.0" y2="230.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="210.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">write_unlock()</text>
<rect x="30.0" y="365.0" width="820.0" height="44.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Атомарний стан контролює всі переходи: атомарний інкремент для читачів,</tspan><tspan x="440.0" dy="13.0">встановлення прапорця письменника і пробудження потоків через системний виклик futex.</tspan></text>
</svg>