<rect x="495.0" y="124.5" width="330.0" height="31.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Свіжий стек викликів: eventLoop() → onSuccess()</tspan></text>
<rect x="495.0" y="177.3" width="330.0" height="45.3" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Якщо всередині onSuccess() стається помилка:</tspan><tspan x="660.0" dy="14.3">контексту try { ... } з Фази 1 ВЖЕ НЕ ІСНУЄ!</tspan></text>
