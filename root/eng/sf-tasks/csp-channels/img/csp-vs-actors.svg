<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурне порівняння: Модель CSP проти Моделі Акторів</text>
<text x="440.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Канали як незалежні сутності першого класу (CSP) проти прямої адресації поштових скриньок (Актори)</text>
<rect x="30.0" y="70.0" width="395.0" height="305.0" rx="8" fill="#fdfefe" stroke="#27ae60" stroke-width="1.8"/>
<text x="227.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Модель CSP (Go, Occam, Clojure core.async)</text>
<text x="227.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Фокус на КАНАЛАХ (першокласні об'єкти)</text>
<rect x="45.0" y="135.0" width="90.0" height="45.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="90.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процес P1</text>
<rect x="45.0" y="195.0" width="90.0" height="45.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="90.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процес P2</text>
<rect x="170.0" y="150.0" width="115.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="227.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Канал C</text>
<text x="227.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Анонімний конвеєр</text>
<rect x="320.0" y="160.0" width="90.0" height="45.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="365.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процес P3</text>
<line x1="135.0" y1="157.0" x2="170.0" y2="170.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="135.0" y1="217.0" x2="170.0" y2="190.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="285.0" y1="182.0" x2="320.0" y2="182.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="270.0" width="365.0" height="90.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="227.5" y="299.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="227.5" dy="0.0">• Анонімність: процеси не знають ідентифікаторів один одного</tspan><tspan x="227.5" dy="12.3">• Канал можна передавати як значення через інший канал</tspan><tspan x="227.5" dy="12.3">• Синхронізація: природне рандеву та мультиплексування select</tspan><tspan x="227.5" dy="12.3">• Гнучка N:M топологія (багато відправників, багато отримувачів)</tspan></text>
<rect x="455.0" y="70.0" width="395.0" height="305.0" rx="8" fill="#fdfefe" stroke="#2457d6" stroke-width="1.8"/>
<text x="652.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Модель Акторів (Erlang, Elixir, Akka)</text>
<text x="652.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Фокус на СУТНОСТЯХ (пряма адресація через PID)</text>
<rect x="470.0" y="140.0" width="100.0" height="45.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Актор A</tspan><tspan x="520.0" dy="12.3">PID: &lt;0.41.0&gt;</tspan></text>
<rect x="610.0" y="135.0" width="225.0" height="95.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="722.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Актор B (PID: &lt;0.82.0&gt;)</text>
<rect x="620.0" y="163.0" width="105.0" height="55.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="672.5" y="187.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="672.5" dy="0.0">Поштова</tspan><tspan x="672.5" dy="11.7">скринька FIFO</tspan></text>
<rect x="735.0" y="163.0" width="90.0" height="55.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/><text x="780.0" y="187.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Приватний</tspan><tspan x="780.0" dy="11.7">стан</tspan></text>
<line x1="570.0" y1="162.0" x2="620.0" y2="185.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="595.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">send(PID_B, msg)</text>
<rect x="470.0" y="270.0" width="365.0" height="90.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="652.5" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="652.5" dy="0.0">• Адресація: повідомлення шлеться на конкретний PID актора</tspan><tspan x="652.5" dy="11.7">• Поштова скринька жорстко прив'язана до життєвого циклу актора</tspan><tspan x="652.5" dy="11.7">• Асинхронність: відправник ніколи не чекає отримувача (fire &amp; forget)</tspan><tspan x="652.5" dy="11.7">• Відмовостійкість: вбудовані дерева нагляду та ізоляція крахів</tspan></text>
<rect x="30.0" y="390.0" width="820.0" height="32.2" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Узагальнення: CSP структурує потік передачі даних через незалежні канали; модель акторів структурує життєвий цикл, стан та відмовостійкість обчислювальних одиниць.</tspan></text>
</svg>