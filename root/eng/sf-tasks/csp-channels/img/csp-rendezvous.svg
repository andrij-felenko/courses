<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Семантика каналів: синхронне рандеву та буферизація</text>
<text x="440.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Рандеву синхронізує час виконання процесів; буфер розв'язує їх у часі до заповнення</text>
<rect x="30.0" y="70.0" width="395.0" height="305.0" rx="8" fill="#fafbfc" stroke="#d35400" stroke-width="1.6"/>
<text x="227.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">Синхронний канал (Unbuffered / Rendezvous)</text>
<text x="227.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Місткість буфера = 0 (точка зустрічі)</text>
<rect x="50.0" y="140.0" width="105.0" height="55.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="102.5" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="102.5" dy="0.0">Процес A</tspan><tspan x="102.5" dy="14.3">(Відправник)</tspan></text>
<rect x="300.0" y="140.0" width="105.0" height="55.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="352.5" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="352.5" dy="0.0">Процес B</tspan><tspan x="352.5" dy="14.3">(Отримувач)</tspan></text>
<rect x="180.0" y="135.0" width="95.0" height="65.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="2.0"/>
<text x="227.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">Рандеву</text>
<text x="227.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Бар'єр синхр.</text>
<line x1="155.0" y1="167.0" x2="180.0" y2="167.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="275.0" y1="167.0" x2="300.0" y2="167.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="220.0" width="355.0" height="60.0" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/><text x="227.5" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="227.5" dy="0.0">Відправник блокується, доки отримувач не викличе recv()</tspan><tspan x="227.5" dy="13.0">Отримувач блокується, доки відправник не викличе send()</tspan><tspan x="227.5" dy="13.0">Дані копіюються безпосередньо стек-у-стек</tspan></text>
<rect x="50.0" y="295.0" width="355.0" height="65.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/><text x="227.5" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="227.5" dy="0.0">Гарантія: у момент завершення передачі</tspan><tspan x="227.5" dy="13.0">обидва процеси гарантовано дійшли до точки зв'язку,</tspan><tspan x="227.5" dy="13.0">повна синхронізація станів у часі</tspan></text>
<rect x="455.0" y="70.0" width="395.0" height="305.0" rx="8" fill="#fafbfc" stroke="#27ae60" stroke-width="1.6"/>
<text x="652.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Буферизований канал (Buffered Channel)</text>
<text x="652.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кільцевий буфер місткістю N &gt; 0</text>
<rect x="475.0" y="140.0" width="105.0" height="55.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="527.5" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="527.5" dy="0.0">Процес A</tspan><tspan x="527.5" dy="14.3">(Відправник)</tspan></text>
<rect x="725.0" y="140.0" width="105.0" height="55.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="777.5" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">Процес B</tspan><tspan x="777.5" dy="14.3">(Отримувач)</tspan></text>
<rect x="600.0" y="135.0" width="105.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="652.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Буфер [N=4]</text>
<rect x="608.0" y="168.0" width="20.0" height="22.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="618.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">D1</text>
<rect x="630.0" y="168.0" width="20.0" height="22.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="640.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">D2</text>
<rect x="652.0" y="168.0" width="20.0" height="22.0" rx="6" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.0"/>
<text x="662.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">·</text>
<rect x="674.0" y="168.0" width="20.0" height="22.0" rx="6" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.0"/>
<text x="684.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">·</text>
<line x1="580.0" y1="167.0" x2="600.0" y2="167.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="705.0" y1="167.0" x2="725.0" y2="167.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="475.0" y="220.0" width="355.0" height="60.0" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/><text x="652.5" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="652.5" dy="0.0">Відправник не блокується, поки в буфері є вільне місце</tspan><tspan x="652.5" dy="13.0">Отримувач не блокується, поки в буфері є хоч один елемент</tspan><tspan x="652.5" dy="13.0">Розв'язка за швидкістю та згладжування сплесків</tspan></text>
<rect x="475.0" y="295.0" width="355.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="652.5" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="652.5" dy="0.0">Зворотний тиск (Backpressure): коли буфер заповнений,</tspan><tspan x="652.5" dy="13.0">відправник примусово блокується, що запобігає</tspan><tspan x="652.5" dy="13.0">неконтрольованому вичерпанню оперативної пам'яті</tspan></text>
<rect x="30.0" y="390.0" width="820.0" height="32.2" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Висновок: Рандеву створює жорсткий спільний часовий бар'єр без витрат пам'яті; буферизація вводить керований зворотний тиск і усуває затримки коротких сплесків.</tspan></text>
</svg>