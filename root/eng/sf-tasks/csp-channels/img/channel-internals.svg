<text x="505.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">elemsize: 8 байтів | dataqsiz: 8 | qcount: 3</text>
