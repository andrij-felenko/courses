<text x="640.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d35400" text-anchor="middle" font-style="italic">Отримувач забирає з буфера і будить G5, вносячи ValA</text>
<rect x="40.0" y="420.0" width="800.0" height="32.2" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Канал координує пам'ять без прямого обміну між потоками: спільний лок захищає лише метадані, а перехід стану перетворює блокування в перемикання планувальника рантайму.</tspan></text>
