<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мультиплексування каналів: примітив select / alt</text>
<text x="440.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Недетермінований вибір готової події вводу-виводу, тайм-аути та кооперативне скасування</text>
<text x="130.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерела повідомлень</text>
<rect x="30.0" y="105.0" width="200.0" height="50.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">ch_data (Дані датчика)</tspan><tspan x="130.0" dy="13.7">Готовий до читання</tspan></text>
<rect x="30.0" y="175.0" width="200.0" height="50.0" rx="6" fill="#f8f9fa" stroke="#aaaaaa" stroke-width="1.5"/><text x="130.0" y="196.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">ch_control (Команди)</tspan><tspan x="130.0" dy="13.7">Порожній (блокований)</tspan></text>
<rect x="30.0" y="245.0" width="200.0" height="50.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="130.0" y="266.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">time.After(50ms) (Таймер)</tspan><tspan x="130.0" dy="13.7">Спрацює при затримці</tspan></text>
<rect x="30.0" y="315.0" width="200.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="336.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">ctx.Done() (Скасування)</tspan><tspan x="130.0" dy="13.7">Сигнал зупинки потоку</tspan></text>
<rect x="290.0" y="90.0" width="280.0" height="290.0" rx="10" fill="#f8faff" stroke="#2457d6" stroke-width="2.0"/>
<text x="430.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Оператор select / alt</text>
<text x="430.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Атомарне опитування всіх гілок</text>
<line x1="230.0" y1="130.0" x2="290.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="230.0" y1="200.0" x2="290.0" y2="200.0" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="230.0" y1="270.0" x2="290.0" y2="250.0" stroke="#caa24a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="230.0" y1="340.0" x2="290.0" y2="300.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="310.0" y="165.0" width="240.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">1. Блокує всі залучені канали</tspan><tspan x="430.0" dy="12.3">2. Якщо готово кілька —</tspan><tspan x="430.0" dy="12.3">   випадковий псевдовибір (fair)</tspan><tspan x="430.0" dy="12.3">3. Якщо жоден не готовий —</tspan><tspan x="430.0" dy="12.3">   потік спить у чергах усіх гілок</tspan></text>
<rect x="310.0" y="255.0" width="240.0" height="105.0" rx="6" fill="#f4f6f8" stroke="#888888" stroke-width="1.5"/><text x="430.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Гілка default (опціонально):</tspan><tspan x="430.0" dy="12.3">• Перетворює select на</tspan><tspan x="430.0" dy="12.3">  неблокувальний запит (polling)</tspan><tspan x="430.0" dy="12.3">• Виконується миттєво,</tspan><tspan x="430.0" dy="12.3">  якщо жоден канал не готовий</tspan></text>
<text x="720.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виконання обраної гілки</text>
<rect x="630.0" y="105.0" width="220.0" height="50.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Обробка пакета даних</tspan><tspan x="740.0" dy="13.7">v := &lt;-ch_data</tspan></text>
<rect x="630.0" y="175.0" width="220.0" height="50.0" rx="6" fill="#f8f9fa" stroke="#aaaaaa" stroke-width="1.5"/><text x="740.0" y="196.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Обробка команди</tspan><tspan x="740.0" dy="13.7">cmd := &lt;-ch_control</tspan></text>
<rect x="630.0" y="245.0" width="220.0" height="50.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="740.0" y="266.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Логіка таймауту</tspan><tspan x="740.0" dy="13.7">лог помилки та ретрай</tspan></text>
<rect x="630.0" y="315.0" width="220.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="336.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Коректне завершення</tspan><tspan x="740.0" dy="13.7">звільнення ресурсів</tspan></text>
<line x1="570.0" y1="160.0" x2="630.0" y2="130.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="210.0" x2="630.0" y2="200.0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="570.0" y1="260.0" x2="630.0" y2="270.0" stroke="#caa24a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570.0" y1="310.0" x2="630.0" y2="340.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="395.0" width="820.0" height="32.2" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="414.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Принцип: select об'єднує незалежні канали зв'язку в єдину реактивну систему; випадковий арбітраж запобігає голодуванню (starvation) швидких каналів.</tspan></text>
</svg>