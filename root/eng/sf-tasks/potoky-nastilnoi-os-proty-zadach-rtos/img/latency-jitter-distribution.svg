<rect x="30.0" y="335.0" width="760.0" height="50.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.5"/><text x="410.0" y="356.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">• RTOS: весь розподіл лежить строго лівіше дедлайну — система на 100% передбачувана.</tspan><tspan x="410.0" dy="13.7">• GPOS: попри високий середній темп, випадкові сплески перетинають дедлайн, спричиняючи відмову.</tspan></text>
