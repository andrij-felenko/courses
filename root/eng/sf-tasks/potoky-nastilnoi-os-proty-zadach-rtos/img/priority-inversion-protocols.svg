<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інверсія пріоритетів: протокол успадкування (PIP) проти стелі пріоритетів (PCP)</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Як RTOS запобігає блокуванню критичної задачі через проміжні фонові потоки</text>
<rect x="30.0" y="68.0" width="250.0" height="310.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="155.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Без протоколу (Катастрофа)</text>
<text x="155.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Необмежене блокування</text>
<rect x="42.0" y="118.0" width="226.0" height="30.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="155.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Низька (L) захоплює м'ютекс M</text>
<rect x="42.0" y="153.0" width="226.0" height="30.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="155.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Висока (H) блокується на M</text>
<rect x="42.0" y="188.0" width="226.0" height="40.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="155.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Середня (M) витісняє L!</text>
<text x="155.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(M не потрібен замок, але він біжить)</text>
<rect x="42.0" y="236.0" width="226.0" height="130.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="155.0" y="267.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Результат: High чекає</tspan><tspan x="155.0" dy="12.3">завершення Medium, хоча</tspan><tspan x="155.0" dy="12.3">Medium має нижчий пріоритет!</tspan><tspan x="155.0" dy="12.3">Затримка High стає</tspan><tspan x="155.0" dy="12.3">необмеженою (Unbounded).</tspan><tspan x="155.0" dy="12.3">Причина збою Mars Pathfinder</tspan><tspan x="155.0" dy="12.3">у 1997 році на Марсі.</tspan></text>
<rect x="295.0" y="68.0" width="250.0" height="310.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="420.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Успадкування (PIP / FreeRTOS)</text>
<text x="420.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Динамічне підняття пріоритету</text>
<rect x="307.0" y="118.0" width="226.0" height="30.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="420.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Низька (L) захоплює м'ютекс M</text>
<rect x="307.0" y="153.0" width="226.0" height="32.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="420.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">High блокується на M →</text>
<text x="420.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">L тимчасово дістає пріоритет High</text>
<rect x="307.0" y="190.0" width="226.0" height="38.0" rx="3" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="420.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Medium НЕ може витіснити L!</text>
<text x="420.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">L швидко добігає і віддає M</text>
<rect x="307.0" y="236.0" width="226.0" height="130.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="267.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Результат: Затримка High</tspan><tspan x="420.0" dy="12.3">обмежена тривалістю</tspan><tspan x="420.0" dy="12.3">критичної секції Low.</tspan><tspan x="420.0" dy="12.3">Особливість:</tspan><tspan x="420.0" dy="12.3">• Динамічна зміна черг планувальника</tspan><tspan x="420.0" dy="12.3">• Можливе ланцюгове блокування</tspan><tspan x="420.0" dy="12.3">  за наявності декількох замків.</tspan></text>
<rect x="560.0" y="68.0" width="250.0" height="310.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="685.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Стеля пріоритетів (PCP / Zephyr)</text>
<text x="685.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Статична верхня межа замка</text>
<rect x="572.0" y="118.0" width="226.0" height="32.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="685.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">М'ютекс має фіксовану стелю</text>
<text x="685.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ceiling = max(пріоритети задач)</text>
<rect x="572.0" y="153.0" width="226.0" height="32.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="685.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">L захоплює M → пріоритет L</text>
<text x="685.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">миттєво стає рівним Ceiling!</text>
<rect x="572.0" y="190.0" width="226.0" height="38.0" rx="3" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="685.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Жодна задача не витісняє L</text>
<text x="685.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Deadlock неможливий математично</text>
<rect x="572.0" y="236.0" width="226.0" height="130.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="273.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Результат: Найсуворіший захист.</tspan><tspan x="685.0" dy="12.3">• Задача блокується щонайбільше</tspan><tspan x="685.0" dy="12.3">  один раз за весь час виконання.</tspan><tspan x="685.0" dy="12.3">• Повне усунення взаємних</tspan><tspan x="685.0" dy="12.3">  блокувань (Deadlock).</tspan><tspan x="685.0" dy="12.3">• Проста реалізація без динаміки.</tspan></text>
<rect x="30.0" y="388.0" width="780.0" height="50.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.5"/><text x="420.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Висновок: Без захисту пріоритет втрачає сенс через втручання фонових задач середнього рівня.</tspan><tspan x="420.0" dy="13.7">PIP вирішує проблему реактивно в момент конфлікту; PCP запобігає затримкам превентивно.</tspan></text>
</svg>