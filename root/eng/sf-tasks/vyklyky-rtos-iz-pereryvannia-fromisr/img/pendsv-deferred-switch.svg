<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відкладене перемикання контексту: механіка PendSV у Cortex-M</text>
<text x="380.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">чому перемикання контексту чекає завершення всіх апаратних обробників</text>
<line x1="50.0" y1="85.0" x2="710.0" y2="85.0" stroke="#333333" stroke-width="2.0"/>
<line x1="690.0" y1="85.0" x2="715.0" y2="85.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="715.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Час (t)</text>
<rect x="60.0" y="100.0" width="100.0" height="55.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="110.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Задача A</text>
<text x="110.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(низька)</text>
<line x1="60.0" y1="80.0" x2="60.0" y2="90.0" stroke="#333333" stroke-width="1.5"/>
<rect x="170.0" y="100.0" width="140.0" height="55.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="240.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне IRQ</text>
<text x="240.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(UART ISR)</text>
<line x1="170.0" y1="80.0" x2="170.0" y2="90.0" stroke="#333333" stroke-width="1.5"/>
<rect x="320.0" y="100.0" width="120.0" height="55.0" rx="5" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="380.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вкладене IRQ</text>
<text x="380.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Timer ISR)</text>
<line x1="320.0" y1="80.0" x2="320.0" y2="90.0" stroke="#333333" stroke-width="1.5"/>
<rect x="450.0" y="100.0" width="90.0" height="55.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="495.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихід з IRQ</text>
<text x="495.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(завершення)</text>
<line x1="450.0" y1="80.0" x2="450.0" y2="90.0" stroke="#333333" stroke-width="1.5"/>
<rect x="550.0" y="100.0" width="70.0" height="55.0" rx="5" fill="#fff7e6" stroke="#caa24a" stroke-width="1.5"/>
<text x="585.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">PendSV</text>
<text x="585.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(перемикання)</text>
<line x1="550.0" y1="80.0" x2="550.0" y2="90.0" stroke="#333333" stroke-width="1.5"/>
<rect x="630.0" y="100.0" width="80.0" height="55.0" rx="5" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="670.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Задача B</text>
<text x="670.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(висока)</text>
<line x1="630.0" y1="80.0" x2="630.0" y2="90.0" stroke="#333333" stroke-width="1.5"/>
<text x="240.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">▲ xQueueSendFromISR() будить Задачу B</text>
<text x="240.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">  portYIELD_FROM_ISR() виставляє біт PendSV</text>
<text x="380.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">▲ Вкладене переривання виконується на MSP</text>
<text x="380.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">  PendSV не запускається, бо має найнижчий пріоритет!</text>
<text x="585.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="700">▲ PendSV виконує зміну TCB</text>
<text x="585.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">  зберігає PSP_A, вантажить PSP_B</text>
<rect x="45.0" y="275.0" width="670.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="305.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Чому PendSV на найнижчому пріоритеті: якби перемикання контексту відбувалося прямо в ISR периферії,</tspan><tspan x="380.0" dy="13.7">воно пошкодило б апаратний стек вкладених переривань. Завдяки PendSV процесор спочатку чисто</tspan><tspan x="380.0" dy="13.7">завершує всі вкладені обробники, і лише при поверненні в режим потоку (Thread Mode) безпечно</tspan><tspan x="380.0" dy="13.7">передає керування новорозбудженій високій задачі.</tspan></text>
</svg>