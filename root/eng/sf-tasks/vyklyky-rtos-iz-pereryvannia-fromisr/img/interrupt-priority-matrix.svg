<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця пріоритетів NVIC та поріг configMAX_SYSCALL_INTERRUPT_PRIORITY</text>
<text x="380.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">розподіл рівнів у Cortex-M: нульовий джитер проти викликів RTOS API</text>
<rect x="40.0" y="70.0" width="180.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="130.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шкала Cortex-M</text>
<text x="130.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Рівень 0 (найвищий)</text>
<text x="130.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Рівень 1 .. 4</text>
<line x1="55.0" y1="148.0" x2="205.0" y2="148.0" stroke="#caa24a" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="130.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#caa24a" text-anchor="middle" font-weight="700">configMAX_SYSCALL (5)</text>
<line x1="55.0" y1="175.0" x2="205.0" y2="175.0" stroke="#caa24a" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="130.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Рівень 6 .. 14</text>
<text x="130.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Рівень 15 (найнижчий)</text>
<text x="130.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Число менше → пріоритет вищий!</text>
<rect x="240.0" y="70.0" width="480.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="480.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Зона нульового джитеру (Пріоритети 0 .. MAX_SYSCALL - 1)</text>
<rect x="250.0" y="102.0" width="460.0" height="52.0" rx="6" fill="#ffffff" stroke="#f5c6cb" stroke-width="1.5"/><text x="480.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">• Ніколи не маскуються ядром RTOS (BASEPRI їх не чіпає)</tspan><tspan x="480.0" dy="12.3">• Миттєвий відгук для керування моторами, ШІМ та аварійного захисту</tspan><tspan x="480.0" dy="12.3">• КАТЕГОРИЧНО ЗАБОРОНЕНО викликати будь-які функції RTOS FromISR!</tspan></text>
<rect x="240.0" y="175.0" width="480.0" height="95.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="480.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Зона під керуванням RTOS (Пріоритети MAX_SYSCALL .. 15)</text>
<rect x="250.0" y="207.0" width="460.0" height="55.0" rx="6" fill="#ffffff" stroke="#c3e6cb" stroke-width="1.5"/><text x="480.0" y="225.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">• Маскуються під час критичних секцій ядра (BASEPRI = MAX_SYSCALL)</tspan><tspan x="480.0" dy="12.3">• Мають невеликий джитер (тривалість критичної секції RTOS)</tspan><tspan x="480.0" dy="12.3">• ПОВНІСТЮ БЕЗПЕЧНО викликати функції xQueueSendFromISR тощо.</tspan></text>
<rect x="40.0" y="285.0" width="680.0" height="58.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.5"/><text x="380.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Найчастіша фатальна помилка початківців: надати перериванню пріоритет 0 і викликати FromISR API.</tspan><tspan x="380.0" dy="13.7">Це призводить до хаотичного пошкодження черг RTOS через переривання критичної секції ядра.</tspan><tspan x="380.0" dy="13.7">Пам'ятайте: в ARM Cortex-M вищий пріоритет позначається МЕНШИМ числом!</tspan></text>
</svg>