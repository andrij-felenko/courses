<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вододіл контекстів: режим задачі проти режиму переривання</text>
<text x="380.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">різні стеки, відсутність TCB в обробника та неможливість блокування</text>
<rect x="35.0" y="70.0" width="330.0" height="225.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="200.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Режим задачі (Thread Mode)</text>
<text x="200.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Контекст звичайної задачі RTOS</text>
<rect x="50.0" y="135.0" width="300.0" height="24.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="200.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Стек задачі: PSP (Process Stack Pointer)</text>
<rect x="50.0" y="165.0" width="300.0" height="24.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="200.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Має власний блок керування (TCB)</text>
<rect x="50.0" y="195.0" width="300.0" height="24.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="200.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Може засинати, чекати та блокуватися</text>
<rect x="50.0" y="225.0" width="300.0" height="24.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="200.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Планувальник перемикає витісненням</text>
<rect x="50.0" y="255.0" width="300.0" height="24.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="200.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Звичайні API (xQueueSend, vTaskDelay)</text>
<rect x="395.0" y="70.0" width="330.0" height="225.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="560.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Режим обробника (Handler Mode)</text>
<text x="560.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Контекст апаратного переривання (ISR)</text>
<rect x="410.0" y="135.0" width="300.0" height="24.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="560.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Головний стек: MSP (Main Stack Pointer)</text>
<rect x="410.0" y="165.0" width="300.0" height="24.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="560.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">НЕ має власного TCB (не є задачею)</text>
<rect x="410.0" y="195.0" width="300.0" height="24.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="560.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЗАБОРОНЕНО блокуватися чи засинати</text>
<rect x="410.0" y="225.0" width="300.0" height="24.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="560.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Керується апаратним контролером NVIC</text>
<rect x="410.0" y="255.0" width="300.0" height="24.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="560.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Тільки неблокуючі виклики ...FromISR</text>
<rect x="50.0" y="305.0" width="660.0" height="42.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.5"/><text x="380.0" y="322.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Обробник переривання не має власного TCB і виконується на стеку ядра (MSP).</tspan><tspan x="380.0" dy="13.7">Будь-яка спроба заблокувати ISR пошкоджує випадкову перервану задачу й вішає систему.</tspan></text>
</svg>