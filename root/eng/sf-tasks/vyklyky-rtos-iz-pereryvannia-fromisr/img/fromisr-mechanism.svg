<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура FromISR: неблокуюча дія та прапорець витіснення</text>
<text x="380.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">як функція RTOS фіксує пробудження важливої задачі без прямого перемикання контексту</text>
<rect x="35.0" y="75.0" width="205.0" height="205.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="137.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Дія в ISR</text>
<rect x="45.0" y="115.0" width="185.0" height="150.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="137.5" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="137.5" dy="0.0">xQueueSendFromISR(</tspan><tspan x="137.5" dy="13.0">  q, &amp;data,</tspan><tspan x="137.5" dy="13.0">  &amp;xHigherWoken</tspan><tspan x="137.5" dy="13.0">);</tspan><tspan x="137.5" dy="13.0"></tspan><tspan x="137.5" dy="13.0">• Запис у буфер за O(1)</tspan><tspan x="137.5" dy="13.0">• Ніколи не блокується</tspan><tspan x="137.5" dy="13.0">• Повертає pdPASS / err</tspan></text>
<line x1="245.0" y1="175.0" x2="275.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="75.0" width="215.0" height="205.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="387.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Реакція ядра</text>
<rect x="290.0" y="115.0" width="195.0" height="150.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="387.5" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="387.5" dy="0.0">Черга розблоковує задачу:</tspan><tspan x="387.5" dy="13.0"></tspan><tspan x="387.5" dy="13.0">• Переносить задачу зі</tspan><tspan x="387.5" dy="13.0">  списку очікування в Ready</tspan><tspan x="387.5" dy="13.0">• Якщо пріоритет вищий за</tspan><tspan x="387.5" dy="13.0">  поточний перерваний:</tspan><tspan x="387.5" dy="13.0">  *pxHigherWoken = pdTRUE;</tspan></text>
<line x1="500.0" y1="175.0" x2="530.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="535.0" y="75.0" width="190.0" height="205.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.5"/>
<text x="630.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">3. portYIELD_FROM_ISR</text>
<rect x="545.0" y="115.0" width="170.0" height="150.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Якщо xHigherWoken:</tspan><tspan x="630.0" dy="13.0"></tspan><tspan x="630.0" dy="13.0">• Виставляє переривання</tspan><tspan x="630.0" dy="13.0">  PendSV у регістрі ICSR</tspan><tspan x="630.0" dy="13.0">• Контекст перемкнеться</tspan><tspan x="630.0" dy="13.0">  МИТТЄВО при виході</tspan><tspan x="630.0" dy="13.0">  з переривання!</tspan></text>
<rect x="45.0" y="295.0" width="670.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Прапорець pxHigherPriorityTaskWoken запобігає зайвим перемиканням:</tspan><tspan x="380.0" dy="13.7">якщо розбуджена задача має нижчий пріоритет за перервану, CPU повертається назад без зволікань.</tspan><tspan x="380.0" dy="13.7">Якщо ж її пріоритет вищий — portYIELD_FROM_ISR() забезпечує негайне витіснення.</tspan></text>
</svg>