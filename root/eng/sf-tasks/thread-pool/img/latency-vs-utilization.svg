<text x="602.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Висока пропускна здатність,</text>
<text x="602.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">передбачуваний низький час відгуку.</text>
<rect x="590.0" y="250.0" width="220.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="602.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">3. Насичення (ρ &gt; 85–90%)</text>
<text x="602.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вибухове накопичення в черзі,</text>
<text x="602.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">деградація пам'яті та тайм-аути.</text>
<text x="420.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">За законом масового обслуговування при наближенні завантаження до 100% затримка прямує до нескінченності</text>
