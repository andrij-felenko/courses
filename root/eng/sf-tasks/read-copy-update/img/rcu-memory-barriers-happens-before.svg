<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Бар'єри пам'яті та відношення happens-before</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Формування гарантії happens-before між публікацією нової копії та її зчитуванням</text>

  <!-- Writer column -->
  <rect x="180" y="100" width="240" height="320" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="300" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Письменник</text>

  <rect x="200" y="160" width="200" height="40" fill="white" stroke="#1a1a1a" rx="4"/>
  <text x="300" y="185" font-size="13" text-anchor="middle" fill="#1a1a1a">1. node-&gt;data = 42;</text>

  <path d="M 300 200 L 300 250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="180" y="230" font-size="12" text-anchor="end" fill="#2457d6">Впорядковано</text>
  <text x="180" y="245" font-size="12" text-anchor="end" fill="#2457d6">компілятором</text>

  <rect x="200" y="260" width="200" height="50" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="300" y="280" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">2. rcu_assign_pointer</text>
  <text x="300" y="300" font-size="12" text-anchor="middle" fill="#2457d6">(Store-Release)</text>

  <!-- Reader column -->
  <rect x="540" y="100" width="240" height="320" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="660" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Читач</text>

  <rect x="560" y="260" width="200" height="50" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="660" y="280" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">3. rcu_dereference</text>
  <text x="660" y="300" font-size="12" text-anchor="middle" fill="#27ae60">(Load-Acquire / Consume)</text>

  <path d="M 660 310 L 660 350" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="780" y="330" font-size="12" text-anchor="start" fill="#27ae60">Залежність</text>
  <text x="780" y="345" font-size="12" text-anchor="start" fill="#27ae60">за даними</text>

  <rect x="560" y="360" width="200" height="40" fill="white" stroke="#1a1a1a" rx="4"/>
  <text x="660" y="385" font-size="13" text-anchor="middle" fill="#1a1a1a">4. val = p-&gt;data;</text>

  <!-- Inter-thread happens-before arrow -->
  <path d="M 400 285 L 550 285" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arr-red)"/>
  <text x="475" y="275" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">Синхронізація (happens-before)</text>

  <!-- Transitive guarantee -->
  <path d="M 160 180 L 120 180 L 120 440 L 660 440 L 660 410" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arr-gray)"/>
  <text x="390" y="430" font-size="13" font-weight="bold" text-anchor="middle" fill="#6b7280">Транзитивна гарантія: ініціалізація завжди передує зчитуванню</text>

</svg>