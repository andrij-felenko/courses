<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підміни глобального вказівника</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Старі читачі опрацьовують стару версію A, а нові читачі отримують вказівник на версію B</text>
  
<rect x="108" y="133" width="184" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="200" y="154.9" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Глобальний вказівник</text>
<rect x="404" y="133" width="153" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="480" y="154.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Версія A (Стара)</text>
<rect x="408" y="233" width="145" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="480" y="254.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Версія B (Нова)</text>

<path d="M 280 150 L 390 150" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="4" marker-end="url(#arr)"/>
<path d="M 280 160 L 390 250" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

<rect x="692" y="133" width="137" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="760" y="154.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Старий читач 1</text>
<rect x="695" y="233" width="130" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="760" y="254.9" font-size="14" fill="#1a1a1a" text-anchor="middle">Новий читач 2</text>

<path d="M 570 150 L 680 150" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 570 250 L 680 250" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

<text x="480" y="320" font-size="13" fill="#1a1a1a" text-anchor="middle">Атомарна підміна вказівника спрямовує нових читачів на Версію B</text>

</svg>