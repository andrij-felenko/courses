<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Видалення вузла зі зв'язаного списку RCU</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Від'єднання вказівника, очікування старих читачів та безпечне вивільнення пам'яті</text>

  <!-- Step 1 -->
  <rect x="40" y="100" width="260" height="320" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="40" y="100" width="260" height="40" fill="#eaf0fd" stroke="#d0d7de" rx="8"/>
  <text x="170" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">1. Від'єднання (Unlink)</text>
  <text x="170" y="165" font-size="13" text-anchor="middle" fill="#1a1a1a">rcu_assign_pointer(A-&gt;next, C)</text>

  <rect x="70" y="200" width="60" height="40" fill="white" stroke="#1a1a1a" rx="4"/>
  <text x="100" y="225" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">A</text>
  
  <rect x="140" y="280" width="60" height="40" fill="#fdecea" stroke="#c0392b" rx="4"/>
  <text x="170" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">B</text>

  <rect x="210" y="200" width="60" height="40" fill="white" stroke="#1a1a1a" rx="4"/>
  <text x="240" y="225" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">C</text>

  <path d="M 130 220 L 200 220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 200 300 L 220 300 L 220 250" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)" stroke-dasharray="4 2"/>
  
  <text x="170" y="350" font-size="12" text-anchor="middle" fill="#c0392b">Вузол B більше не доступний</text>
  <text x="170" y="365" font-size="12" text-anchor="middle" fill="#c0392b">через глобальні вказівники</text>

  <path d="M 310 260 L 350 260" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- Step 2 -->
  <rect x="360" y="100" width="240" height="320" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="360" y="100" width="240" height="40" fill="#fdecea" stroke="#d0d7de" rx="8"/>
  <text x="480" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">2. Очікування (Grace Period)</text>
  <text x="480" y="165" font-size="13" text-anchor="middle" fill="#1a1a1a">synchronize_rcu()</text>

  <rect x="450" y="240" width="60" height="40" fill="#fdecea" stroke="#c0392b" rx="4"/>
  <text x="480" y="265" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">B</text>

  <rect x="390" y="320" width="180" height="30" fill="white" stroke="#6b7280" rx="4"/>
  <text x="480" y="340" font-size="13" text-anchor="middle" fill="#6b7280">Старі читачі ще працюють</text>

  <path d="M 480 310 L 480 290" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-gray)"/>

  <text x="480" y="380" font-size="12" text-anchor="middle" fill="#c0392b">Чекаємо, поки всі потоки</text>
  <text x="480" y="395" font-size="12" text-anchor="middle" fill="#c0392b">не пройдуть спокійний стан</text>

  <path d="M 610 260 L 650 260" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- Step 3 -->
  <rect x="660" y="100" width="260" height="320" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="660" y="100" width="260" height="40" fill="#e9f7ef" stroke="#d0d7de" rx="8"/>
  <text x="790" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">3. Утилізація (Reclamation)</text>
  <text x="790" y="165" font-size="13" text-anchor="middle" fill="#1a1a1a">free(B)</text>

  <rect x="760" y="240" width="60" height="40" fill="none" stroke="#6b7280" stroke-dasharray="4 4" rx="4"/>
  <text x="790" y="265" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b7280">B</text>
  <line x1="760" y1="240" x2="820" y2="280" stroke="#c0392b" stroke-width="2"/>
  <line x1="820" y1="240" x2="760" y2="280" stroke="#c0392b" stroke-width="2"/>

  <text x="790" y="330" font-size="12" text-anchor="middle" fill="#27ae60">Безпечне вивільнення пам'яті</text>
  <text x="790" y="345" font-size="12" text-anchor="middle" fill="#27ae60">Жоден читач більше не має</text>
  <text x="790" y="360" font-size="12" text-anchor="middle" fill="#27ae60">вказівника на цей вузол</text>

</svg>