<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="960" height="480" fill="white"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
</marker>
</defs>
<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CAS Spin Loop Contention</text>
<text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Many threads loop on a single CAS operation; only one succeeds, others spin.</text>
<rect x="400" y="150" width="160" height="200" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/><text x="480" y="190" font-size="16" text-anchor="middle">CAS Spin Loop</text><path d="M500 220 Q560 250 500 280" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/><text x="540" y="255" font-size="12" fill="#c0392b">Retry on failure</text>
</svg>