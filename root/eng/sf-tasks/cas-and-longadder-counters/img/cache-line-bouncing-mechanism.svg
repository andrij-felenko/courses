<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect width="960" height="480" fill="white"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
</marker>
</defs>
<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cache-Line Bouncing Mechanism</text>
<text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Continuous invalidation and transfer of a single cache line across cores causes bus saturation.</text>
<rect x="300" y="200" width="360" height="80" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/><text x="480" y="245" font-size="16" text-anchor="middle">Shared Memory (Cache Line)</text><path d="M200 150 Q300 100 400 190" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/><text x="280" y="130" font-size="14" fill="#c0392b">Invalidate Signal</text><rect x="100" y="100" width="120" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/><text x="160" y="135" font-size="14" text-anchor="middle">CPU Core 1</text><rect x="740" y="100" width="120" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/><text x="800" y="135" font-size="14" text-anchor="middle">CPU Core 2</text>
</svg>