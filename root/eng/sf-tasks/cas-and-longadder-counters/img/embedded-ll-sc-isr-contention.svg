<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Embedded LL/SC & ISR Contention</text>
<text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Interrupt Service Routines can clear the exclusive monitor, breaking LL/SC sequences.</text>
