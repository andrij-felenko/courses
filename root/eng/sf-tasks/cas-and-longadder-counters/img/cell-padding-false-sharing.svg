<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cell Padding & False Sharing</text>
<text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Padding cells prevents them from sharing a cache line, eliminating false sharing.</text>
