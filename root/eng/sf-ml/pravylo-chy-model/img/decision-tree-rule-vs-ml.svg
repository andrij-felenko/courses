<rect x="280.0" y="350.0" width="280.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="420.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Автономна модель (Чистий ML)</tspan><tspan x="420.0" dy="15.6">• Ендпоінт без верифікатора</tspan><tspan x="420.0" dy="15.6">• Фокус на середній точності</tspan></text>
