<rect x="520.0" y="460.0" width="400.0" height="75.0" rx="6" fill="#fef3d6" stroke="#d97706" stroke-width="2.0"/><text x="720.0" y="481.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Гібридний Simplex-селектор (ML + Правило)</tspan><tspan x="720.0" dy="13.0">• Нейромережа генерує пропозицію керування (Proposer)</tspan><tspan x="720.0" dy="13.0">• Детермінований фільтр (Safety Barrier) блокує порушення меж</tspan><tspan x="720.0" dy="13.0">• Миттєве перемикання на резервне правило (Fallback)</tspan></text>
