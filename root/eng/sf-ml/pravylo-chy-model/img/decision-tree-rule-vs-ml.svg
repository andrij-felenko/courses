<rect x="340.0" y="130.0" width="280.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="480.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Детерміноване правило / PID</tspan><tspan x="480.0" dy="15.6">• Час O(1), доведена стійкість</tspan><tspan x="480.0" dy="15.6">• Сертифікація DO-178C (DAL-A)</tspan></text>
