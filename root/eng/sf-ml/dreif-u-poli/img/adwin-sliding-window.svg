<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адаптивне вікно ADWIN: поділ ковзного буфера та перевірка за Гоффдінгом</text>
<rect x="40.0" y="55.0" width="800.0" height="75.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="150.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Потік вимірювань у часі (t →)</text>
<line x1="280.0" y1="74.0" x2="810.0" y2="74.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="100.0" cy="105.0" r="14.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="100.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x₁</text>
<circle cx="190.0" cy="105.0" r="14.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="190.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x₂</text>
<circle cx="280.0" cy="105.0" r="14.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="280.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">...</text>
<circle cx="370.0" cy="105.0" r="14.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="370.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x_{t-k}</text>
<circle cx="460.0" cy="105.0" r="14.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="460.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">...</text>
<circle cx="550.0" cy="105.0" r="14.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="550.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x_{t-2}</text>
<circle cx="640.0" cy="105.0" r="14.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="640.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x_{t-1}</text>
<circle cx="730.0" cy="105.0" r="14.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="730.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x_t</text>
<rect x="40.0" y="150.0" width="800.0" height="160.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="440.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поточне адаптивне вікно спостережень W (розмір |W| = n₀ + n₁)</text>
<rect x="60.0" y="190.0" width="360.0" height="100.0" rx="6" fill="#edf2f7" stroke="#2457d6" stroke-width="1.8"/>
<text x="240.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Підвікно W₀ (старіші спостереження)</text>
<text x="240.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Кількість зразків: n₀  |  Середнє значення: μ₀</text>
<text x="240.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Гістограма бакетів розміру 2ʲ (пам'ять O(log W))</text>
<line x1="440.0" y1="185.0" x2="440.0" y2="300.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="440.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Точка розрізу (cut)</text>
<rect x="460.0" y="190.0" width="360.0" height="100.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="640.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Підвікно W₁ (найновіші спостереження)</text>
<text x="640.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Кількість зразків: n₁  |  Середнє значення: μ₁</text>
<text x="640.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Свіжі бакети малого розміру (актуальний стан)</text>
<rect x="40.0" y="345.0" width="800.0" height="115.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="440.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Статистична умова виявлення дрейфу (Нерівність Гоффдінга):</text>
<text x="440.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">|μ₀ − μ₁|  ≥  ε_cut = √ [ (1 / (2·m)) · ln (4 / δ) ]</text>
<text x="440.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">де m = 1 / (1/n₀ + 1/n₁) — гармонійне середнє обсягів, δ — рівень хибної тривоги</text>
<text x="440.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Якщо умову виконано: старі бакети з W₀ видаляються, розмір вікна W зменшується до |W₁|</text>
</svg>