<text x="480" y="344" font-size="10.2" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Ключове: ядро тут — ВИВЧЕНЕ (градієнтним спуском, 50.4), а не рукотворне (Собель, 49.4).</text>
<text x="480" y="366" font-size="9.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Мережа сама винаходить, які ознаки шукати — від простих країв до складних візерунків.</text>
<text x="480.0" y="448" font-size="10.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Згортка в мережі = мале спільне ядро, що ковзає кадром. Звідси й мало ваг, і байдужість до позиції.</text>
