<text x="255" y="300" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кожен піксель → кожен нейрон</text>
<rect x="86" y="318" width="348" height="74" rx="9" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.3"/>
<text x="260" y="340" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">кадр 200×200×3 = 120 000 входів</text>
<text x="260" y="359" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">× 1000 нейронів = 120 000 000 ваг!</text>
<text x="260" y="380" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">один шар — і вже не влазить</text>
<rect x="510" y="108" width="400" height="300" rx="12" fill="#fffbeb" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="710" y="132" font-size="10.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">НЕ ДІЛИТЬ ЗНАННЯ ЗА ПОЗИЦІЄЮ</text>
<rect x="540" y="156" width="160" height="110" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="576" cy="191" r="14" fill="#f59e0b" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="720" y="156" width="160" height="110" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="844" cy="241" r="14" fill="#f59e0b" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="710" y="284" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">той самий кіт — у різних кутах</text>
<text x="710" y="304" font-size="9" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">для повноз'єднаної це ДВА різні входи:</text>
<text x="710" y="320" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">вона вчить кожну позицію наново</text>
<text x="710" y="358" font-size="9.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">→ марнує і ваги, і приклади</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Зображення ламають звичайну мережу: забагато зв'язків і жодного спільного знання між позиціями. Потрібен інший підхід.</text>
