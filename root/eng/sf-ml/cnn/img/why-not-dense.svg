<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому звичайна мережа давиться зображенням</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">повноз'єднана: КОЖЕН піксель тягне зв'язок до КОЖНОГО нейрона → мільйони ваг; та ще й не впізнає ту саму річ в іншому куті</text>
