<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди переїхав інференс: хмара → прискорювач → борт</text>
<rect x="30.0" y="92.0" width="230.0" height="96.0" rx="10" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="145.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">ХМАРА</tspan><tspan x="145.0" dy="16.9">(дата-центр)</tspan></text>
<text x="145.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="145.0" dy="0.0">GPU-ферми, кіловати</tspan><tspan x="145.0" dy="14.3">кадр летить туди й назад</tspan></text>
<rect x="300.0" y="92.0" width="230.0" height="96.0" rx="10" fill="#eafbf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="415.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">ПРИСКОРЮВАЧ</tspan><tspan x="415.0" dy="16.9">інференсу</tspan></text>
<text x="415.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="415.0" dy="0.0">спец-ASIC / модуль</tspan><tspan x="415.0" dy="14.3">вати, не кіловати</tspan></text>
<rect x="570.0" y="92.0" width="220.0" height="96.0" rx="10" fill="#fdf0e6" stroke="#c0392b" stroke-width="2.2"/>
<text x="680.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">БОРТ</tspan><tspan x="680.0" dy="16.9">(on-device)</tspan></text>
<text x="680.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="680.0" dy="0.0">чип у самому апараті</tspan><tspan x="680.0" dy="14.3">мілівати, batch = 1</tspan></text>
<line x1="260.0" y1="140.0" x2="300.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="530.0" y1="140.0" x2="570.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="30.0" y="234.0" width="760.0" height="52.0" rx="6" fill="#fff9e6" stroke="#b9770e" stroke-width="1.5"/><text x="410.0" y="256.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Дві сили тягнуть інференс на борт: ЛАТЕНТНІСТЬ (немає часу гнати кадр у хмару</tspan><tspan x="410.0" dy="16.9">й чекати відповідь) і ПРИВАТНІСТЬ (сирі дані не покидають пристрій).</tspan></text>
<line x1="30.0" y1="308.0" x2="790.0" y2="308.0" stroke="#6b7280" stroke-width="1.3"/>
<text x="145.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2012 — AlexNet на 2 GPU</text>
<text x="415.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2015 TPU · 2015 Jetson TX1</text>
<text x="680.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2018–19 Edge TPU, on-device</text>
</svg>