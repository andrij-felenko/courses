<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що тримає прохід: лічба множень чи читання ваг</text>
<rect x="120.0" y="180.0" width="130.0" height="70.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="185.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">лічба множень</tspan><tspan x="185.0" dy="15.6">(FLOPs ÷ швидкість)</tspan></text>
<text x="185.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">≈ 5 мс</text>
<rect x="450.0" y="100.0" width="130.0" height="150.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="515.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">читання ваг</tspan><tspan x="515.0" dy="15.6">(байти ÷ пропускна)</tspan></text>
<text x="515.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">≈ 12 мс</text>
<line x1="120.0" y1="294.0" x2="580.0" y2="294.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="390.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">реальний час ≈ БІЛЬША з двох = 12 мс (впертися в пам'ять)</text>
<rect x="240.0" y="58.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="74.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="390.0" dy="0.0">batch = 1: лічильники простоюють,</tspan><tspan x="390.0" dy="15.6">чекаючи, поки приїдуть ваги</tspan></text>
</svg>