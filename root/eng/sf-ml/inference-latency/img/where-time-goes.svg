<rect x="282.0" y="90.0" width="300.0" height="78.0" rx="8" fill="#eef4ff" stroke="#333333" stroke-width="1.6"/>
<text x="432.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="432.0" dy="0.0">прохід мережі</tspan><tspan x="432.0" dy="15.6">forward</tspan></text>
