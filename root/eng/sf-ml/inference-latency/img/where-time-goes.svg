<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди тече час одного кадру (бюджет 33 мс)</text>
<rect x="30.0" y="90.0" width="90.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="75.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="75.0" dy="0.0">захоплення</tspan><tspan x="75.0" dy="15.6">кадру</tspan></text>
<rect x="126.0" y="90.0" width="150.0" height="78.0" rx="8" fill="#eafbf0" stroke="#333333" stroke-width="1.6"/>
