<text x="648.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700"><tspan x="648.0" dy="0.0">розбір</tspan><tspan x="648.0" dy="15.6">виходу (NMS)</tspan></text>
<rect x="714.0" y="90.0" width="70.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="749.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="749.0" dy="0.0">дія</tspan><tspan x="749.0" dy="15.6">(команда)</tspan></text>
<line x1="30.0" y1="202.0" x2="784.0" y2="202.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="30.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">0 мс</text>
<text x="784.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">33 мс</text>
<text x="390.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">весь ланцюг мусить влізти в один інтервал</text>
<rect x="90.0" y="246.0" width="600.0" height="44.0" rx="6" fill="#fff9e6" stroke="#b9770e" stroke-width="1.5"/><text x="390.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Затримка = сума ВСІХ ланок. Мережа — лише одна з них; часто</tspan><tspan x="390.0" dy="16.2">підготовка й розбір з’їдають не менше за сам прохід.</tspan></text>
