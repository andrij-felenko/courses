<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Велика асиметрія: де й скільки коштує</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">навчання — години-тижні, ферма GPU, увесь набір, гора енергії, РАЗ; вивід — мілісекунди, один чип, лише модель, ЩОКАДРУ</text>
<rect x="330" y="110" width="280" height="36" rx="7" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="470" y="133" font-size="12" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">НАВЧАННЯ</text>
<rect x="630" y="110" width="280" height="36" rx="7" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="770" y="133" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ВИВІД</text>
<text x="60" y="179" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">час</text>
<rect x="330" y="154" width="280" height="42" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="470" y="180" font-size="9.6" fill="#b06b00" text-anchor="middle" font-weight="normal" font-style="normal">тижні (один раз)</text>
<rect x="630" y="154" width="280" height="42" rx="6" fill="#f6fef9" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="770" y="180" font-size="9.6" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">мілісекунди (щоразу)</text>
<text x="60" y="229" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">залізо</text>
<rect x="330" y="204" width="280" height="42" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="470" y="230" font-size="9.6" fill="#b06b00" text-anchor="middle" font-weight="normal" font-style="normal">ферма GPU / хмара</text>
<rect x="630" y="204" width="280" height="42" rx="6" fill="#f6fef9" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="770" y="230" font-size="9.6" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">один чип на борту</text>
<text x="60" y="279" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">дані</text>
<rect x="330" y="254" width="280" height="42" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="470" y="280" font-size="9.6" fill="#b06b00" text-anchor="middle" font-weight="normal" font-style="normal">увесь набір прикладів</text>
<rect x="630" y="254" width="280" height="42" rx="6" fill="#f6fef9" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="770" y="280" font-size="9.6" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">лише новий вхід</text>
<text x="60" y="329" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">енергія</text>
<rect x="330" y="304" width="280" height="42" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="470" y="330" font-size="9.6" fill="#b06b00" text-anchor="middle" font-weight="normal" font-style="normal">величезна</text>
<rect x="630" y="304" width="280" height="42" rx="6" fill="#f6fef9" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="770" y="330" font-size="9.6" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">мала</text>
<text x="60" y="379" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">як часто</text>
<rect x="330" y="354" width="280" height="42" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="470" y="380" font-size="9.6" fill="#b06b00" text-anchor="middle" font-weight="normal" font-style="normal">РАЗ (чи зрідка)</text>
<rect x="630" y="354" width="280" height="42" rx="6" fill="#f6fef9" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="770" y="380" font-size="9.6" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">ПОСТІЙНО</text>
<rect x="60" y="410" width="850" height="36" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="485" y="433" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Тренуй там, де потужно (хмара); застосовуй там, де треба (апарат). Звідси й уся архітектура — 50.8.</text>
</svg>
