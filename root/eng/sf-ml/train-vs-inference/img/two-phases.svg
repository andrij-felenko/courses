<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Дві фази життя моделі: навчання й вивід</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">навчання — модель ЗМІНЮЄТЬСЯ під дані (важко, раз); вивід — модель ЗАМОРОЖЕНА, лише відповідає (легко, щоразу)</text>
<rect x="50" y="104" width="400" height="300" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<text x="250" y="127" font-size="12.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">НАВЧАННЯ</text>
<text x="250" y="143" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(модель змінюється)</text>
<rect x="78" y="166" width="104" height="48" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="130" y="187" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">дані</text>
<text x="130" y="202" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">+ мітки</text>
<line x1="184" y1="190" x2="222" y2="190" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="226" y="162" width="162" height="56" rx="8" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="307" y="184" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">модель підкручує</text>
<text x="307" y="201" font-size="10.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">ВАГИ ↻</text>
<text x="307" y="234" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">↻ повторювати по всіх даних</text>
<line x1="250" y1="244" x2="250" y2="268" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="150" y="270" width="200" height="48" rx="9" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="250" y="290" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">навчена МОДЕЛЬ</text>
<text x="250" y="306" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(файл ваг)</text>
<text x="250" y="344" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">важко · раз · потужні машини (GPU / хмара)</text>
<rect x="510" y="104" width="400" height="300" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<text x="710" y="127" font-size="12.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ВИВІД (інференс)</text>
<text x="710" y="143" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(модель заморожена)</text>
<rect x="534" y="196" width="92" height="50" rx="7" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="580" y="225" font-size="8.4" fill="white" text-anchor="middle" font-weight="normal" font-style="normal">новий вхід</text>
<line x1="630" y1="221" x2="666" y2="221" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="670" y="194" width="110" height="54" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="725" y="214" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">МОДЕЛЬ</text>
<polyline points="714,234 714,228 728,228 728,234" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3" stroke-linejoin="round"/>
<rect x="710" y="234" width="22" height="12" rx="2" fill="#94a3b8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="0.8"/>
<text x="745" y="243" font-size="7.4" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">заморожено</text>
<line x1="784" y1="221" x2="820" y2="221" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="824" y="196" width="78" height="50" rx="8" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="863" y="225" font-size="8.4" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">відповідь</text>
<text x="710" y="300" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ваги НЕ міняються — лише читаються</text>
<text x="710" y="344" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">легко · щоразу · на пристрої (борт)</text>
<line x1="352" y1="294" x2="506" y2="224" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="432" y="250" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">розгорнути</text>
<text x="480.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Натренуй РАЗ (важко) — застосовуй БЕЗЛІЧ разів (легко). Дрон майже завжди робить лише вивід.</text>
</svg>
