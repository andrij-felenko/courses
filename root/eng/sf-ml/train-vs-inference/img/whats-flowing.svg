<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Що тече в кожній фазі: вперед — і назад</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">вивід — лише прохід ВПЕРЕД (вхід → відповідь); навчання додає прохід НАЗАД: виміряти похибку й підправити ваги</text>
<text x="70" y="122" font-size="11" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">ВИВІД — лише ВПЕРЕД</text>
<rect x="70" y="146" width="84" height="44" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.1"/>
<text x="112" y="172" font-size="9" fill="white" text-anchor="middle" font-weight="normal" font-style="normal">вхід</text>
<rect x="250" y="146" width="44" height="44" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<rect x="340" y="146" width="44" height="44" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<rect x="430" y="146" width="44" height="44" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<line x1="156" y1="168" x2="248" y2="168" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="294" y1="168" x2="338" y2="168" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="384" y1="168" x2="428" y2="168" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="472" y1="168" x2="516" y2="168" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="520" y="146" width="96" height="44" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="568" y="172" font-size="8.6" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">відповідь</text>
<text x="740" y="168" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">ваги НЕ міняються</text>
<line x1="60" y1="224" x2="900" y2="224" stroke="#e5e7eb" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="70" y="256" font-size="11" fill="#b06b00" text-anchor="start" font-weight="bold" font-style="normal">НАВЧАННЯ — ВПЕРЕД + НАЗАД</text>
<rect x="70" y="280" width="84" height="44" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.1"/>
<text x="112" y="306" font-size="9" fill="white" text-anchor="middle" font-weight="normal" font-style="normal">вхід</text>
<rect x="250" y="280" width="44" height="44" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<rect x="340" y="280" width="44" height="44" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<rect x="430" y="280" width="44" height="44" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<line x1="156" y1="302" x2="248" y2="302" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="294" y1="302" x2="338" y2="302" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="384" y1="302" x2="428" y2="302" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="472" y1="302" x2="516" y2="302" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="520" y="280" width="96" height="44" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="568" y="300" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">передба-</text>
<text x="568" y="313" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">чення</text>
<text x="700" y="286" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">порівняти</text>
<rect x="656" y="295" width="90" height="30" rx="6" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.3"/>
<text x="701" y="314" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ПОХИБКА</text>
<text x="701" y="280" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">↑ vs мітка</text>
<line x1="656" y1="348" x2="250" y2="348" stroke="#cc0000" stroke-width="1.8" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="453" y="366" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">← прохід НАЗАД: підправити ВАГИ (↻ багато разів, епохи)</text>
<rect x="150" y="392" width="660" height="50" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="480" y="414" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Вивід — це лише ПОЛОВИНА навчання (прохід уперед). Саме прохід НАЗАД (50.4) і є «вчитися».</text>
<text x="480" y="432" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">тому вивід і дешевший за навчання</text>
</svg>
