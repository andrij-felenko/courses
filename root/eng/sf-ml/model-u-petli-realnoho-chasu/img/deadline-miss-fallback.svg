<text x="440.0" y="39.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура обробки пропуску дедлайну та автомат аварійного перемикання</text>
<rect x="25.0" y="80.0" width="140.0" height="80.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/>
