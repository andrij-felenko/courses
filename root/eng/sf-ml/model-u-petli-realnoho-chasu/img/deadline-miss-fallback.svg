<rect x="442.0" y="160.0" width="156.0" height="30.0" rx="4" fill="#fcf3cf" stroke="#f39c12" stroke-width="1.2"/>
<text x="520.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b7950b" text-anchor="middle" font-weight="700">2. Екстраполяція ZOH / EKF</text>
<rect x="442.0" y="197.0" width="156.0" height="30.0" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1.2"/>
<text x="520.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">3. Fallback PID / LQR</text>
<rect x="442.0" y="234.0" width="156.0" height="30.0" rx="4" fill="#ebedef" stroke="#7f8c8d" stroke-width="1.2"/>
<text x="520.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Безпечна зупинка</text>
<line x1="390.0" y1="220.0" x2="430.0" y2="220.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="230.0" y="80.0" width="160.0" height="50.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/>
<text x="310.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Швидкий EKF стан</text>
<text x="310.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">500 Гц прогностик</text>
