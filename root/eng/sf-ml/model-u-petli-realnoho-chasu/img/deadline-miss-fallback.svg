<text x="310.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Watchdog Timer</text>
<line x1="310.0" y1="290.0" x2="310.0" y2="270.0" stroke="#d35400" stroke-width="1.4" marker-end="url(#arrow)"/>
