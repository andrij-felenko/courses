<rect x="650.0" y="110.0" width="200.0" height="130.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
<text x="750.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Контур безпеки (CBF)</text>
<text x="750.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Bumpless Transfer</text>
<text x="750.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Захисні інваріанти</text>
<text x="750.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Обмеження струму/кутів</text>
<text x="750.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Вихід на мотори (PWM)</text>
<line x1="610.0" y1="175.0" x2="650.0" y2="175.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25.0" y="385.0" width="830.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="440.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Ієрархія захисту: При настанні дедлайну система не зависає, а автоматично деградує якість оцінки:</tspan><tspan x="440.0" dy="14.2">від екстраполяції кінематики до детермінованого ПІД-регулятора. Механізм Bumpless Transfer узгоджує</tspan><tspan x="440.0" dy="14.2">інтегратор регулятора, запобігаючи механічним ударам та стрибкам струму приводів.</tspan></text>
</svg>