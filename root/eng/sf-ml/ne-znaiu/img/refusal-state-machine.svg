<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура каскадного фільтра невизначеності та обробки відмови</text>
<rect x="40.0" y="70.0" width="160.0" height="65.0" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="120.0" y="92.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">1. Сенсорний вхід</tspan><tspan x="120.0" dy="13.7">Кадр камери / лідара</tspan><tspan x="120.0" dy="13.7">x ∈ ℝ^D</tspan></text>
<rect x="250.0" y="70.0" width="180.0" height="65.0" rx="6" fill="#ebf5fb" stroke="#2471a3" stroke-width="1.5"/><text x="340.0" y="92.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">2. Нейромережа</tspan><tspan x="340.0" dy="13.7">Логіти f(x) та</tspan><tspan x="340.0" dy="13.7">ембеддінги z</tspan></text>
<line x1="200.0" y1="102.0" x2="248.0" y2="102.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="480.0" y="60.0" width="190.0" height="85.0" rx="6" fill="#fefde8" stroke="#d4ac0d" stroke-width="1.5"/><text x="575.0" y="93.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">3. Енергетичний тест</tspan><tspan x="575.0" dy="12.3">E(x; T) = −T·ln ∑ e^{f_i/T}</tspan><tspan x="575.0" dy="12.3">E(x) ≤ τ_E  (ID-дані?)</tspan></text>
<line x1="430.0" y1="102.0" x2="478.0" y2="102.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="710.0" y="60.0" width="180.0" height="85.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="800.0" y="92.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">4. Ентропійний тест</tspan><tspan x="800.0" dy="13.7">H(p) = −∑ p_i ln p_i</tspan><tspan x="800.0" dy="13.7">H(p) ≤ τ_H (Впевнено?)</tspan></text>
<line x1="670.0" y1="102.0" x2="708.0" y2="102.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="689.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Так</text>
<rect x="710.0" y="200.0" width="180.0" height="70.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">5. Довірена відповідь</tspan><tspan x="800.0" dy="13.7">ŷ = argmax p_i</tspan><tspan x="800.0" dy="13.7">Штатне керування</tspan></text>
<line x1="800.0" y1="145.0" x2="800.0" y2="198.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="815.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Так</text>
<line x1="575.0" y1="145.0" x2="575.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="595.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ні (OOD)</text>
<line x1="710.0" y1="120.0" x2="640.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="690.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ні (Шум)</text>
<rect x="440.0" y="230.0" width="230.0" height="75.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="555.0" y="257.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">Штатна відмова («Не знаю»)</tspan><tspan x="555.0" dy="13.7">Класифікатор блокує прямий вивід</tspan><tspan x="555.0" dy="13.7">Вибір захисного протоколу</tspan></text>
<rect x="50.0" y="360.0" width="240.0" height="95.0" rx="6" fill="#f4f6f7" stroke="#566573" stroke-width="1.5"/><text x="170.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Стратегія 1: Активне зондування</tspan><tspan x="170.0" dy="12.3">• Запит додаткового кадру</tspan><tspan x="170.0" dy="12.3">• Зміна експозиції / підсвітка</tspan><tspan x="170.0" dy="12.3">• Поворот PTZ-камери / фокусу</tspan><tspan x="170.0" dy="12.3">• Зменшення алеаторного шуму</tspan></text>
<line x1="470.0" y1="305.0" x2="170.0" y2="358.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="120.0" y1="360.0" x2="120.0" y2="137.0" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2980b9" text-anchor="middle" font-style="italic">Новий вимір</text>
<rect x="340.0" y="360.0" width="250.0" height="95.0" rx="6" fill="#fbfcfc" stroke="#34495e" stroke-width="1.5"/><text x="465.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">Стратегія 2: Консервативні правила</tspan><tspan x="465.0" dy="12.3">• Перехід у безпечний режим (Limp mode)</tspan><tspan x="465.0" dy="12.3">• Зниження швидкості / зупинка</tspan><tspan x="465.0" dy="12.3">• Детермінований safety envelope</tspan><tspan x="465.0" dy="12.3">• Гарантія безаварійності</tspan></text>
<line x1="555.0" y1="305.0" x2="465.0" y2="358.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="640.0" y="360.0" width="240.0" height="95.0" rx="6" fill="#fdfefe" stroke="#7f8c8d" stroke-width="1.5"/><text x="760.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Стратегія 3: Запит на перехоплення</tspan><tspan x="760.0" dy="12.3">• Takeover Request (TOR) оператору</tspan><tspan x="760.0" dy="12.3">• Звукова / тактильна сигналізація</tspan><tspan x="760.0" dy="12.3">• Очікування підтвердження (1.5-3 с)</tspan><tspan x="760.0" dy="12.3">• Буфер безпечної траєкторії</tspan></text>
<line x1="630.0" y1="305.0" x2="760.0" y2="358.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="490.0" y="485.0" width="260.0" height="55.0" rx="6" fill="#eaecee" stroke="#2c3e50" stroke-width="1.5"/><text x="620.0" y="509.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Мінімальний стан ризику (MRM)</tspan><tspan x="620.0" dy="11.7">Автономне безпечне гальмування до повної зупинки</tspan></text>
<line x1="760.0" y1="455.0" x2="680.0" y2="483.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="750.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Таймаут TOR</text>
<line x1="465.0" y1="455.0" x2="560.0" y2="483.0" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrow)"/>
