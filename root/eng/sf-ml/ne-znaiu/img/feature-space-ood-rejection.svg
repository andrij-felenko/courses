<rect x="550.0" y="350.0" width="290.0" height="110.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.0"/><text x="695.0" y="384.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Критерії детекції OOD:</tspan><tspan x="695.0" dy="11.7">1. Вільна енергія: E(x; T) = −T·ln ∑ e^{f_i/T} &gt; τ_E</tspan><tspan x="695.0" dy="11.7">2. Махаланобіс: D_M(z) = √((z−μ)^T Σ⁻¹ (z−μ)) &gt; τ_M</tspan><tspan x="695.0" dy="11.7">3. Чому не Softmax: далекі точки можуть мати</tspan><tspan x="695.0" dy="11.7">високі логіти й хибно максимальну впевненість!</tspan></text>
