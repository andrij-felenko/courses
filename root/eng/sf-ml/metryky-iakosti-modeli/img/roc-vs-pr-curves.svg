<rect x="90.0" y="390.0" width="340.0" height="75.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="260.0" y="410.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Інваріантність ROC до балансу класів:</tspan><tspan x="260.0" dy="13.7">TPR і FPR рахуються суто у своїх класах (по рядках).</tspan><tspan x="260.0" dy="13.7">Крива ROC не змінюється при додаванні TN,</tspan><tspan x="260.0" dy="13.7">що може маскувати падіння точності при 1:100.</tspan></text>
<rect x="530.0" y="390.0" width="340.0" height="75.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="700.0" y="410.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Чутливість PR до рідкісних подій:</tspan><tspan x="700.0" dy="13.7">Precision ділить TP на (TP + FP). Якщо N ≫ P,</tspan><tspan x="700.0" dy="13.7">навіть крихітний FPR створює лавину FP,</tspan><tspan x="700.0" dy="13.7">і Precision катастрофічно обвалюється.</tspan></text>
