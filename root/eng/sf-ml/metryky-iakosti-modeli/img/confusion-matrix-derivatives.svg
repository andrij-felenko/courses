<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця плутанини 2×2 та похідні інженерні коефіцієнти</text>
<rect x="180.0" y="55.0" width="170.0" height="42.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="72.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Передбачено: POS (+)</tspan><tspan x="265.0" dy="14.3">Predicted Positive (PP)</tspan></text>
<rect x="360.0" y="55.0" width="170.0" height="42.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="72.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">Передбачено: NEG (−)</tspan><tspan x="445.0" dy="14.3">Predicted Negative (PN)</tspan></text>
<rect x="25.0" y="110.0" width="145.0" height="110.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="97.5" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="97.5" dy="0.0">Дійсно: POS (+)</tspan><tspan x="97.5" dy="15.6">Actual Positive</tspan><tspan x="97.5" dy="15.6">P = TP + FN</tspan></text>
<rect x="25.0" y="230.0" width="145.0" height="110.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="97.5" y="273.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="97.5" dy="0.0">Дійсно: NEG (−)</tspan><tspan x="97.5" dy="15.6">Actual Negative</tspan><tspan x="97.5" dy="15.6">N = FP + TN</tspan></text>
<rect x="180.0" y="110.0" width="170.0" height="110.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="265.0" y="142.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">TP (True Positive)</tspan><tspan x="265.0" dy="13.0">Істинно позитивні</tspan><tspan x="265.0" dy="13.0"></tspan><tspan x="265.0" dy="13.0">Влучання в ціль</tspan><tspan x="265.0" dy="13.0">(передбачено +, дійсно +)</tspan></text>
<rect x="360.0" y="110.0" width="170.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="445.0" y="142.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">FN (False Negative)</tspan><tspan x="445.0" dy="13.0">Помилка II роду (β)</tspan><tspan x="445.0" dy="13.0"></tspan><tspan x="445.0" dy="13.0">Пропуск цілі</tspan><tspan x="445.0" dy="13.0">(передбачено −, дійсно +)</tspan></text>
<rect x="180.0" y="230.0" width="170.0" height="110.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2.0"/><text x="265.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">FP (False Positive)</tspan><tspan x="265.0" dy="13.0">Помилка I роду (α)</tspan><tspan x="265.0" dy="13.0"></tspan><tspan x="265.0" dy="13.0">Фальшива тривога</tspan><tspan x="265.0" dy="13.0">(передбачено +, дійсно −)</tspan></text>
<rect x="360.0" y="230.0" width="170.0" height="110.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="2.0"/><text x="445.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">TN (True Negative)</tspan><tspan x="445.0" dy="13.0">Істинно негативні</tspan><tspan x="445.0" dy="13.0"></tspan><tspan x="445.0" dy="13.0">Коректний спокій</tspan><tspan x="445.0" dy="13.0">(передбачено −, дійсно −)</tspan></text>
<rect x="545.0" y="110.0" width="380.0" height="110.0" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/><text x="735.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Метрики щодо істинних позитивних (P):</tspan><tspan x="735.0" dy="14.3">• Recall / Sensitivity (TPR) = TP / (TP + FN)</tspan><tspan x="735.0" dy="14.3">  (частка виявлених цілей серед усіх реальних)</tspan><tspan x="735.0" dy="14.3">• Miss Rate / FNR = FN / P = 1 − TPR</tspan><tspan x="735.0" dy="14.3">  (частка критично пропущених дефектів)</tspan></text>
<rect x="545.0" y="230.0" width="380.0" height="110.0" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/><text x="735.0" y="260.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Метрики щодо істинних негативних (N):</tspan><tspan x="735.0" dy="14.3">• Specificity / Selectivity (TNR) = TN / (FP + TN)</tspan><tspan x="735.0" dy="14.3">  (здатність не давати тривогу на норму)</tspan><tspan x="735.0" dy="14.3">• Fall-out / FPR = FP / N = 1 − TNR</tspan><tspan x="735.0" dy="14.3">  (рівень фальшивих спрацювань на шумі)</tspan></text>
<rect x="180.0" y="355.0" width="170.0" height="105.0" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/><text x="265.0" y="382.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Точність (PPV):</tspan><tspan x="265.0" dy="14.3">Precision = TP/(TP+FP)</tspan><tspan x="265.0" dy="14.3"></tspan><tspan x="265.0" dy="14.3">FDR = FP/(TP+FP)</tspan><tspan x="265.0" dy="14.3">= 1 − Precision</tspan></text>
<rect x="360.0" y="355.0" width="170.0" height="105.0" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/><text x="445.0" y="382.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Надійність (NPV):</tspan><tspan x="445.0" dy="14.3">NPV = TN/(TN+FN)</tspan><tspan x="445.0" dy="14.3"></tspan><tspan x="445.0" dy="14.3">FOR = FN/(TN+FN)</tspan><tspan x="445.0" dy="14.3">= 1 − NPV</tspan></text>
<rect x="545.0" y="355.0" width="380.0" height="105.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="735.0" y="387.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Інтегральні коефіцієнти балансу:</tspan><tspan x="735.0" dy="11.7">• F₁ = 2·(Prec·Rec)/(Prec+Rec) = 2·TP / (2·TP + FP + FN)</tspan><tspan x="735.0" dy="11.7">• F_β = (1+β²)·(Prec·Rec)/(β²·Prec + Rec)  [β&gt;1: акцент на Recall]</tspan><tspan x="735.0" dy="11.7">• MCC = (TP·TN − FP·FN) / √((TP+FP)(TP+FN)(TN+FP)(TN+FN))</tspan><tspan x="735.0" dy="11.7">• Accuracy = (TP+TN)/(P+N),  Balanced Acc = (TPR + TNR)/2</tspan></text>
</svg>