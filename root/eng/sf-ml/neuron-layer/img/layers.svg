<text x="480" y="405" font-size="9.8" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Шар із m нейронів по n входів = m·n ваг + m зсувів → у великих мережах це МІЛЬЙОНИ параметрів (49.9, 50.7).</text>
<text x="480" y="425" font-size="9.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Глибші шари будують усе складніші ознаки: краї → форми → об'єкти (49.7) — рукотворна луна зорової кори.</text>
