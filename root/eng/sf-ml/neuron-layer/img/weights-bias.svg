<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Ваги і зсув: що нейрон ВИВЧАЄ</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">вага каже, наскільки ВАЖЛИВИЙ кожен вхід; зсув посуває поріг спрацювання; саме їх підкручує навчання (50.4)</text>
<rect x="50" y="108" width="420" height="300" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="260" y="132" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ВАГА = важливість входу</text>
<text x="76" y="184" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">вхід A</text>
<line x1="180" y1="180" x2="180" y2="180" stroke="#1a1a1a" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="180" y="168" width="2" height="24" rx="8" fill="#1a1a1a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="182" y="172" width="162.0" height="16" rx="3" fill="#0a8f3c" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="372" y="184" font-size="9.5" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">вага +0.9</text>
<text x="260" y="204" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">дуже важливий</text>
<text x="76" y="254" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">вхід B</text>
<line x1="180" y1="250" x2="180" y2="250" stroke="#1a1a1a" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="180" y="238" width="2" height="24" rx="8" fill="#1a1a1a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="182" y="242" width="27.0" height="16" rx="3" fill="#94a3b8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="372" y="254" font-size="9.5" fill="#94a3b8" text-anchor="end" font-weight="bold" font-style="normal">вага +0.1</text>
<text x="260" y="274" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">майже не важить</text>
<text x="76" y="324" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">вхід C</text>
<line x1="180" y1="320" x2="180" y2="320" stroke="#1a1a1a" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="180" y="308" width="2" height="24" rx="8" fill="#1a1a1a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="56.000000000000014" y="312" width="125.99999999999999" height="16" rx="3" fill="#cc0000" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="372" y="324" font-size="9.5" fill="#cc0000" text-anchor="end" font-weight="bold" font-style="normal">вага -0.7</text>
<text x="260" y="344" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">рахується ПРОТИ</text>
<rect x="490" y="108" width="420" height="300" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="700" y="132" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ЗСУВ b = посуває поріг</text>
<text x="520" y="166" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">більший зсув → нейронові ЛЕГШЕ</text>
<text x="520" y="190" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">«спрацювати»; менший → важче.</text>
<text x="520" y="214" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Це наче ручка чутливості.</text>
<rect x="520" y="250" width="360" height="138" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="700" y="276" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">Ваги + зсуви = ПАРАМЕТРИ</text>
<text x="542" y="300" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• навчена модель — це просто НАБІР</text>
<text x="542" y="321" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  цих чисел (мільйони у великих);</text>
<text x="542" y="342" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• навчання (50.4) і є їх підбором,</text>
<text x="542" y="363" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  щоб модель менше помилялась.</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Ваги й зсув — це і є «знання» нейрона. Дай ті самі входи, та зміни ваги — і рішення буде інше.</text>
</svg>
