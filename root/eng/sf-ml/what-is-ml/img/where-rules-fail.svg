<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Де правила безсилі — а приклади є</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">є задачі, де правило написати легко (арифметика, сортування), і де неможливо (впізнати кота, почерк, голос)</text>
<rect x="50" y="108" width="400" height="300" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="250" y="132" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ПРАВИЛО НАПИСАТИ ЛЕГКО</text>
<text x="80" y="168" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• 2 + 2 = 4 (арифметика)</text>
<text x="80" y="198" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• посортувати числа за зростанням</text>
<text x="80" y="228" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• «якщо напруга &lt; 3.3 В — тривога»</text>
<text x="80" y="258" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• «якщо темно — увімкнути світло»</text>
<rect x="80" y="300" width="340" height="84" rx="9" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<text x="250" y="326" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">→ звичайний код (49.6)</text>
<text x="250" y="348" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">чітке, дешеве, зрозуміле;</text>
<text x="250" y="366" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">машинне навчання тут зайве</text>
<rect x="510" y="108" width="400" height="300" rx="12" fill="#fef2f2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="710" y="132" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ПРАВИЛО НАПИСАТИ НЕМОЖЛИВО</text>
<text x="540" y="168" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• «це КІТ» — а які правила? вуха? хутро?</text>
<text x="540" y="198" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• «це цифра 7» — мільйон почерків</text>
<text x="540" y="228" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• «це слово ‘привіт’» — голоси, акценти</text>
<text x="540" y="258" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• «це перешкода попереду»</text>
<rect x="540" y="300" width="340" height="84" rx="9" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.3"/>
<text x="710" y="324" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">правила нема — зате ПРИКЛАДІВ безліч</text>
<text x="710" y="346" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">→ показати приклади й НАВЧИТИ модель</text>
<text x="710" y="366" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">саме тут сяє машинне навчання</text>
</svg>
