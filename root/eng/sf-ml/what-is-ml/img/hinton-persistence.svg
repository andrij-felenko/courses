<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Гінтон: сорок років проти течії</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">коли всі махнули рукою на нейромережі, він уперто шліфував їх — і дочекався, поки його учні довели його правоту</text>
<line x1="100" y1="240" x2="880" y2="240" stroke="#cbd5e1" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="100.0" cy="240" r="9" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="100.0" y1="231" x2="100.0" y2="200" stroke="#1f4ed8" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="100.0" y="160" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">1986</text>
<text x="100.0" y="178" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Зворотне поширення</text>
<text x="100.0" y="192" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">стаття в Nature:</text>
<circle cx="295.0" cy="240" r="9" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="295.0" y1="249" x2="295.0" y2="280" stroke="#1f4ed8" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="295.0" y="298" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">2006</text>
<text x="295.0" y="316" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Глибокі мережі довіри</text>
<text x="295.0" y="330" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">оживив саме</text>
<circle cx="490.0" cy="240" r="9" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="490.0" y1="231" x2="490.0" y2="200" stroke="#0a8f3c" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="490.0" y="160" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">2012</text>
<text x="490.0" y="178" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">AlexNet (його учні)</text>
<text x="490.0" y="192" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">перемога на ImageNet</text>
<circle cx="685.0" cy="240" r="9" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="685.0" y1="249" x2="685.0" y2="280" stroke="#d98a00" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="685.0" y="298" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">2018</text>
<text x="685.0" y="316" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Премія Тюрінга</text>
<text x="685.0" y="330" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">«Нобель</text>
<circle cx="880.0" cy="240" r="9" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="880.0" y1="231" x2="880.0" y2="200" stroke="#0a8f3c" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="880.0" y="160" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">2024</text>
<text x="880.0" y="178" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Нобель із фізики</text>
<text x="880.0" y="192" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">за нейромережі</text>
<rect x="120" y="360" width="720" height="60" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="480" y="384" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Більшу частину кар'єри він сперечався з усією галуззю — і виявився правий.</text>
<text x="480" y="404" font-size="9.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Тому Гінтона (поряд із Бенжіо й Лекуном) звуть «хрещеним батьком» глибокого навчання.</text>
</svg>
