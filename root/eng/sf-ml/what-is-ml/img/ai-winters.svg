<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Весни й зими штучного інтелекту</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">галузь двічі злітала на надіях і двічі провалювалася в «зиму»; нейромережі весь час вважали глухим кутом</text>
<rect x="250" y="138" width="130" height="220" rx="8" fill="#eef2f7" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="560" y="138" width="130" height="220" rx="8" fill="#eef2f7" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="315" y="156" font-size="8.5" fill="#64748b" text-anchor="middle" font-weight="bold" font-style="normal">1-а зима</text>
<text x="625" y="156" font-size="8.5" fill="#64748b" text-anchor="middle" font-weight="bold" font-style="normal">2-а зима</text>
<line x1="70" y1="358" x2="910" y2="358" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="908" y="380" font-size="9.5" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">час →</text>
<text x="64" y="132" font-size="9" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">↑ гроші / надії</text>
<polyline points="90,332 180,196 315,330 470,206 625,332 770,250 870,150" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="180" cy="196" r="6" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="180" y="146" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">1956</text>
<text x="180" y="161" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Дартмут:</text>
<text x="180" y="173" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">народження ШІ</text>
<circle cx="315" cy="330" r="6" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="315" y="346" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">~1974</text>
<text x="315" y="361" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">перша</text>
<text x="315" y="373" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зима</text>
<circle cx="470" cy="206" r="6" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="470" y="156" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">1980-ті</text>
<text x="470" y="171" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">експертні</text>
<text x="470" y="183" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">системи</text>
<circle cx="625" cy="332" r="6" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="625" y="348" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">~1987</text>
<text x="625" y="363" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">друга</text>
<text x="625" y="375" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зима</text>
<circle cx="870" cy="150" r="6" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="870" y="100" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">2012+</text>
<text x="870" y="115" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">глибоке</text>
<text x="870" y="127" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">навчання</text>
<text x="480.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">А Джеффрі Гінтон усі ці роки тримався нейромереж — попри глузування й безгрошів'я. Зрештою виявився правий.</text>
</svg>
