<text x="344" y="337" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">50.8</text>
<text x="378" y="326" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">де</text>
<text x="378" y="344" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">рахувати</text>
<line x1="320" y1="332" x2="280" y2="332" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="100" y="290" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<rect x="100" y="290" width="48" height="84" rx="10" fill="#d98a00" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="124" y="337" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">50.9</text>
<text x="158" y="326" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">межі,</text>
<text x="158" y="344" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">етика</text>
<text x="620" y="304" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">📜 50.5: окрема історія Лекуна й CNN</text>
<rect x="40" y="392" width="880" height="60" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="480" y="416" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Дев'ять кроків від «машина вчиться з прикладів» до навченої мережі, що працює на бортовому чипі.</text>
<text x="480" y="437" font-size="9.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Тут глибоке навчання з 49.7 нарешті відкривають зсередини — і саджають на апарат.</text>
