<line x1="540" y1="332" x2="500" y2="332" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="320" y="290" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
