<text x="638" y="164" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">як вчиться</text>
<text x="638" y="182" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(градієнт)</text>
