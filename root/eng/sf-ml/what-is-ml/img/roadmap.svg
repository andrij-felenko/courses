  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Куди ми йдемо: від «вчитися з даних» до «нейромережа на чипі»</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">що таке ML → дві фази → нейрон і шар → як вчиться → CNN → дані й узагальнення → TinyML → де рахувати → межі</text>
<rect x="40" y="128" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<rect x="40" y="128" width="48" height="84" rx="10" fill="#1f4ed8" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="64" y="175" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">50.1</text>
<text x="98" y="164" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">що таке</text>
<text x="98" y="182" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ML</text>
<line x1="200" y1="170" x2="220" y2="170" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
