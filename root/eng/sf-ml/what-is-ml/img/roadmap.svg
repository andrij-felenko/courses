<rect x="220" y="128" width="48" height="84" rx="10" fill="#1f4ed8" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="244" y="175" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">50.2</text>
<text x="278" y="164" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">навчання /</text>
<text x="278" y="182" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">вивід</text>
<line x1="380" y1="170" x2="400" y2="170" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
