<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Ліки від перенавчання — і головне правило</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">більше різноманітних даних, простіша модель, регуляризація/dropout, аугментація, рання зупинка</text>
<rect x="50" y="120" width="470" height="40" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<circle cx="72" cy="140" r="6" fill="#0a8f3c" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="90" y="138" font-size="10.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">більше ДАНИХ</text>
<text x="90" y="152" font-size="8.4" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">найсильніші ліки (50.1)</text>
<rect x="50" y="166" width="470" height="40" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<circle cx="72" cy="186" r="6" fill="#1f4ed8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="90" y="184" font-size="10.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">простіша модель</text>
<text x="90" y="198" font-size="8.4" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">менше параметрів — менше що зубрити</text>
<rect x="50" y="212" width="470" height="40" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<circle cx="72" cy="232" r="6" fill="#d98a00" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="90" y="230" font-size="10.5" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">dropout / регуляризація</text>
<text x="90" y="244" font-size="8.4" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">глушити зайву складність</text>
<rect x="50" y="258" width="470" height="40" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<circle cx="72" cy="278" r="6" fill="#1f4ed8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="90" y="276" font-size="10.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">аугментація</text>
<text x="90" y="290" font-size="8.4" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">відбити / обрізати / підсвітити → більше прикладів</text>
<rect x="50" y="304" width="470" height="40" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<circle cx="72" cy="324" r="6" fill="#0a8f3c" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="90" y="322" font-size="10.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">рання зупинка</text>
<text x="90" y="336" font-size="8.4" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">спинись на мінімумі валідації (50.6.3)</text>
<text x="720" y="138" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">аугментація: один кадр → багато</text>
<rect x="560" y="156" width="150" height="72" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="615" cy="192" r="16" fill="#f59e0b" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="635" y="242" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">оригінал</text>
<rect x="730" y="156" width="150" height="72" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="825" cy="192" r="16" fill="#f59e0b" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="805" y="242" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">відбито</text>
<rect x="560" y="246" width="150" height="72" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="615" cy="282" r="16" fill="#5a6472" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="635" y="332" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">темніше</text>
<rect x="730" y="246" width="150" height="72" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="785" cy="282" r="16" fill="#f59e0b" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="730" y="246" width="150" height="72" rx="8" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2" stroke-dasharray="4,3"/>
<text x="805" y="332" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">обрізано</text>
<rect x="50" y="392" width="850" height="50" rx="10" fill="#fffbeb" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="480" y="414" font-size="11" fill="#92400e" text-anchor="middle" font-weight="bold" font-style="normal">ДАНІ — ЦАР: представницькі, РІЗНОМАНІТНІ приклади важать понад усе (50.1).</text>
<text x="480" y="432" font-size="9.4" fill="#92400e" text-anchor="middle" font-weight="normal" font-style="normal">Для дрона — знімай і вдень, і вночі, і в різних місцях: інакше модель «бачитиме» лише свою лабораторію.</text>
</svg>
