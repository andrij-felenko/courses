<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Зубрить чи розуміє: симптом перенавчання</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">перенавчена модель — мов учень, що завчив відповіді минулих іспитів: блискуче на баченому, провал на новому</text>
<rect x="60" y="116" width="400" height="250" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="260" y="142" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">точність перенавченої моделі</text>
<line x1="110" y1="330" x2="430" y2="330" stroke="#1a1a1a" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="150" y="160" width="70" height="170" rx="4" fill="#0a8f3c" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1"/>
<text x="185" y="152" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">99%</text>
<text x="185" y="346" font-size="8.6" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">на ТРЕНУВАЛЬНИХ</text>
<text x="185" y="360" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(бачене)</text>
<rect x="320" y="226" width="70" height="104" rx="4" fill="#cc0000" fill-opacity="0.8" stroke="#1a1a1a" stroke-width="1"/>
<text x="355" y="218" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">60%</text>
<text x="355" y="346" font-size="8.6" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">на НОВИХ</text>
<text x="355" y="360" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(небачене)</text>
<line x1="225" y1="180" x2="315" y2="246" stroke="#cc0000" stroke-width="1.4" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="272" y="202" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">РОЗРИВ</text>
<rect x="500" y="116" width="400" height="250" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="700" y="142" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">як учень перед іспитом</text>
<text x="524" y="174" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• ЗАВЧИВ відповіді минулих білетів</text>
<text x="524" y="200" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  → блищить на тих самих питаннях,</text>
<text x="524" y="226" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  але плаває на нових;</text>
<text x="524" y="252" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• РОЗУМІЄ предмет</text>
<text x="524" y="278" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  → відповість і на небачене.</text>
<rect x="524" y="312" width="352" height="40" rx="8" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="700" y="337" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">велика різниця «бачене ↔ нове» = перенавчання</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Висока точність на тренувальних даних нічого не варта сама по собі — важить лише точність на НОВОМУ.</text>
</svg>
