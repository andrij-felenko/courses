<rect x="40.0" y="310.0" width="840.0" height="54.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="460.0" y="333.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Головний принцип: E-Stop розриває живлення приводів напряму на фізичному рівні.</tspan><tspan x="460.0" dy="15.6">Жодна команда моделі чи помилка в NPU не може програмно замкнути розімкнене коло.</tspan></text>
