<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема апаратного та програмного інтерлока безпеки (E-Stop)</text>
<rect x="40.0" y="60.0" width="220.0" height="84.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="82.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">NPU / Обчислювач ML</tspan><tspan x="150.0" dy="15.6">• Модель виявлення / аналізу</tspan><tspan x="150.0" dy="15.6">• Команда: ACTUATE_REQ</tspan><tspan x="150.0" dy="15.6">• Оцінка впевненості: 0.95</tspan></text>
<rect x="40.0" y="174.0" width="220.0" height="80.0" rx="6" fill="#f7f8fa" stroke="#c9ccd3" stroke-width="1.5"/><text x="150.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Журнал аудиту (Blackbox)</tspan><tspan x="150.0" dy="15.6">• Non-volatile Secure Flash</tspan><tspan x="150.0" dy="15.6">• Запис: стан + хеш ваг</tspan><tspan x="150.0" dy="15.6">• Збереження ДО дії</tspan></text>
<rect x="310.0" y="60.0" width="230.0" height="96.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="425.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">Контролер безпеки (MCU)</tspan><tspan x="425.0" dy="15.6">• Детерміновані перевірки</tspan><tspan x="425.0" dy="15.6">• Валідація токена людини</tspan><tspan x="425.0" dy="15.6">• Фіксація логу в пам'ять</tspan><tspan x="425.0" dy="15.6">• Сигнал: ARM_ENABLE</tspan></text>
<rect x="310.0" y="186.0" width="230.0" height="68.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="425.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">Пульт оператора (HITL)</tspan><tspan x="425.0" dy="15.6">• Кнопка підтвердження</tspan><tspan x="425.0" dy="15.6">• Токен авторизації (TTL)</tspan></text>
<rect x="590.0" y="80.0" width="120.0" height="60.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="650.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Апаратна</tspan><tspan x="650.0" dy="15.6">схема AND</tspan></text>
<rect x="590.0" y="174.0" width="120.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="203.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Кнопка E-Stop</tspan><tspan x="650.0" dy="14.3">Фізичний розрив</tspan><tspan x="650.0" dy="14.3">сухих контактів</tspan></text>
<rect x="750.0" y="120.0" width="120.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Силовий комутатор</tspan><tspan x="810.0" dy="13.0">MOSFET / Реле</tspan><tspan x="810.0" dy="13.0">Комутація</tspan><tspan x="810.0" dy="13.0">живлення V_PWR</tspan></text>
<rect x="740.0" y="240.0" width="140.0" height="50.0" rx="6" fill="#f7f8fa" stroke="#c9ccd3" stroke-width="1.5"/><text x="810.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Виконавчі приводи</tspan><tspan x="810.0" dy="15.6">Двигуни / Лазер</tspan></text>
