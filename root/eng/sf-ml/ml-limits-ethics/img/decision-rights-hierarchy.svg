<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія повноважень прийняття рішень у критичних системах</text>
<rect x="60.0" y="64.0" width="720.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Рівень 1: Фізичний E-Stop та апаратний інтерлок (Найвищий пріоритет)</tspan><tspan x="420.0" dy="16.9">Безумовне апаратне знеструмлення приводів; неможливо заблокувати програмно</tspan><tspan x="420.0" dy="16.9">Прямий розрив кола живлення сухими контактами без участі мікроконтролера</tspan></text>
<rect x="60.0" y="154.0" width="720.0" height="72.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="420.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Рівень 2: Людина-оператор (Human-in-the-Loop / Human-on-the-Loop)</tspan><tspan x="420.0" dy="16.9">Авторизація небезпечних дій, видача токенів доступу, негайне ручне вето</tspan><tspan x="420.0" dy="16.9">Відповідальність за наслідки та право скасування будь-якої дії системи</tspan></text>
<rect x="60.0" y="244.0" width="720.0" height="72.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Рівень 3: Детермінований програмний бар'єр безпеки (Safety Gate)</tspan><tspan x="420.0" dy="16.9">Перевірка лімітів (швидкість, струм, робоча зона), тайм-аутів та аудит логів</tspan><tspan x="420.0" dy="16.9">Апаратний сторожовий таймер (Watchdog) та блокування при збоях зв'язку</tspan></text>
<rect x="60.0" y="334.0" width="720.0" height="72.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="357.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Рівень 4: Модель машинного навчання (NPU / Deep Neural Network)</tspan><tspan x="420.0" dy="16.9">Лише ймовірнісні рекомендації, класифікація та оцінка стану</tspan><tspan x="420.0" dy="16.9">Повна відсутність прямого доступу до силових ключів та актуаторів</tspan></text>
<line x1="420.0" y1="138.0" x2="420.0" y2="152.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="228.0" x2="420.0" y2="242.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="318.0" x2="420.0" y2="332.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="420.0" width="720.0" height="44.0" rx="6" fill="#f7f8fa" stroke="#c9ccd3" stroke-width="1.5"/><text x="420.0" y="445.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Нейромережа знаходиться на найнижчому рівні: жодна дія не виконується без валідації рівнями 1–3</tspan></text>
</svg>