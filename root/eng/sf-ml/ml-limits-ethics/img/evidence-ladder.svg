<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири щаблі доказу: чим випадок відрізняється від переказу</text>
<rect x="150.0" y="58.0" width="726.0" height="84.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="166.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Втручання</text>
<text x="396.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">підозрювану ознаку прибирають і додають — відповідь іде за нею</text>
<text x="396.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">водяний знак на знімках коней, Nature Communications, 2019</text>
<rect x="150.0" y="152.0" width="726.0" height="84.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="166.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Опублікований дослід</text>
<text x="396.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">описано, як зібрано дані й що виміряно; можна повторити</text>
<text x="396.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">хаскі, вовки і сніг, KDD 2016; рентгени трьох лікарень, 2018</text>
<rect x="150.0" y="246.0" width="726.0" height="84.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/>
<text x="166.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Журналістський звіт</text>
<text x="396.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">названі видання й автор, джерела анонімні; повторити не можна</text>
<text x="396.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">інструмент добору кандидатів Amazon, Reuters, 2018</text>
<rect x="150.0" y="340.0" width="726.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="166.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Переказ</text>
<text x="396.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">немає першоджерела; кожен переповідач змінює подробиці</text>
<text x="396.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">танки, що ловили погоду</text>
<line x1="112.0" y1="424.0" x2="112.0" y2="58.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сильніше</text>
<text x="60.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">слабше</text>
<text x="450.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Що вище щабель, то менше лишається місця для «а може, було не так»</text>
</svg>