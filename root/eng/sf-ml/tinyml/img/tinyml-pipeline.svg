<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Конвеєр TinyML: від хмари до мікроконтролера</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">натренувати (хмара, float32) → конвертувати й квантувати (TFLite Micro) → розгорнути крихітну модель на МК → вивід за мілівати</text>
<rect x="70" y="130" width="200" height="92" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<text x="170" y="158" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">ХМАРА</text>
<text x="170" y="182" font-size="9.3" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">навчити модель</text>
<text x="170" y="200" font-size="9.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(float32, 50.2)</text>
<line x1="270" y1="176" x2="378" y2="176" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="380" y="130" width="200" height="92" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<text x="480" y="158" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">КОНВЕРТУВАТИ</text>
<text x="480" y="182" font-size="9.3" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">+ квантувати</text>
<text x="480" y="200" font-size="9.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(TFLite Micro)</text>
<line x1="580" y1="176" x2="688" y2="176" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="690" y="130" width="200" height="92" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<text x="790" y="158" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">МК / edge</text>
<text x="790" y="182" font-size="9.3" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">крихітна модель,</text>
<text x="790" y="200" font-size="9.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">вивід за мВт</text>
<text x="480.0" y="268" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">що вже бігає на крихітних чипах:</text>
<rect x="90" y="286" width="230" height="60" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="205" y="310" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">слово-команда</text>
<text x="205" y="330" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">«прокинься»</text>
<rect x="360" y="286" width="230" height="60" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="475" y="310" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">жест руки</text>
<text x="475" y="330" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">вгору / вниз</text>
<rect x="630" y="286" width="230" height="60" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="745" y="310" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">простий детектор</text>
<text x="745" y="330" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">є людина / нема</text>
<text x="480.0" y="430" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">TinyML несе машинне навчання навіть на найдрібніші чипи — за мілівати, без хмари й мережі.</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">А де саме рахувати — на МК, бортовому комп'ютері чи в хмарі — розважимо в наступній темі (50.8).</text>
</svg>
