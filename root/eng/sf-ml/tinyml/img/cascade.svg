<rect x="143.0" y="118.0" width="174.0" height="74.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="230.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Крихітна модель</tspan><tspan x="230.0" dy="18.2">(кілька КБ)</tspan></text>
<rect x="145.0" y="224.0" width="170.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="245.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="230.0" dy="0.0">завжди · мкВт</tspan></text>
