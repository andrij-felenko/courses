<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскад: дешева стадія працює завжди, дорога — зрідка</text>
<rect x="25.0" y="120.0" width="95.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="72.5" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="72.5" dy="0.0">Звук</tspan><tspan x="72.5" dy="16.9">завжди</tspan></text>
