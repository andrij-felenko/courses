<rect x="120.0" y="300.0" width="680.0" height="66.0" rx="6" fill="#f0f9f2" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="329.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Помнож потужність кожної стадії на частку часу, коли вона активна — і середнє</tspan><tspan x="460.0" dy="16.9">тримається в мікроватах, хоч найдорожча стадія й коштує на порядки більше.</tspan></text>
