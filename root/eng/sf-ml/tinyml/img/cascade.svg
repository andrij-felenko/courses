<rect x="685.0" y="224.0" width="170.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="244.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="770.0" dy="0.0">дуже зрідка · сотні мВт</tspan></text>
