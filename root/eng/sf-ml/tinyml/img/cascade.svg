<rect x="413.0" y="118.0" width="174.0" height="74.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="500.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Більша модель</tspan><tspan x="500.0" dy="18.2">(точніша)</tspan></text>
<rect x="415.0" y="224.0" width="170.0" height="34.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="500.0" y="245.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle"><tspan x="500.0" dy="0.0">зрідка · мВт</tspan></text>
<rect x="675.0" y="100.0" width="190.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
