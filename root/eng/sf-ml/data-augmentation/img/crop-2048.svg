<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки множник 2048: ковзне вікно 224 по кадру 256</text>
<rect x="60.0" y="70.0" width="250.0" height="250.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="185.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">кадр 256×256</text>
<rect x="79.5" y="89.5" width="218.8" height="218.8" rx="3" fill="#eafaf1" stroke="#27ae60" stroke-width="2.5"/>
<text x="188.9" y="203.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">вікно 224×224</text>
<line x1="60.0" y1="344.0" x2="91.2" y2="344.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="60.0" y1="339.0" x2="60.0" y2="349.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="91.2" y1="339.0" x2="91.2" y2="349.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="60.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">зсув x: 0…32  →  33 позиції</text>
<line x1="326.0" y1="70.0" x2="326.0" y2="101.2" stroke="#2457d6" stroke-width="2.0"/>
<line x1="321.0" y1="70.0" x2="331.0" y2="70.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="321.0" y1="101.2" x2="331.0" y2="101.2" stroke="#2457d6" stroke-width="2.0"/>
<text x="334.0" y="85.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">зсув y: 0…32</text>
<text x="500.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Рахунок</text>
<text x="500.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">по горизонталі:  256 − 224 = 32</text>
<text x="500.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">позицій по осі:  32 + 1 = 33</text>
<text x="500.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">усіх обрізків:   33 × 33 = 1089</text>
<text x="500.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">+ дзеркало:      × 2</text>
<text x="500.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">разом варіантів: ≈ 2048</text>
<rect x="538.6" y="303.9" width="158.9" height="52.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="618.0" y="325.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="618.0" dy="0.0">з 1 кадру —</tspan><tspan x="618.0" dy="18.2">≈ 2048 прикладів</tspan></text>
<text x="500.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(автори рахують 32²·2 = 2048;</text>
<text x="500.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">різниця з 33² — дрібниця для оцінки)</text>
</svg>