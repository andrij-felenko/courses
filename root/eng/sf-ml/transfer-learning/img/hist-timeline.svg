<text x="312.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">АЛГОРИТМ + ТЕРМІН</text>
<text x="312.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="312.0" dy="0.0">Пратт (1993, NIPS-5): DBT —</tspan><tspan x="312.0" dy="13.4">позичити ваги, а не вчити</tspan><tspan x="312.0" dy="13.4">з нуля. Воркшоп «Learning</tspan><tspan x="312.0" dy="13.4">to Learn» (NIPS-1995)</tspan></text>
