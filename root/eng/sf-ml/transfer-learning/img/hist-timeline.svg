<text x="704.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">МАСОВА ПРАКТИКА</text>
<text x="704.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="704.0" dy="0.0">DeCAF + Йосінскі та ін.</tspan><tspan x="704.0" dy="13.4">(2014): ознаки CNN</tspan><tspan x="704.0" dy="13.4">переносяться; ВИМІРЯНО</tspan><tspan x="704.0" dy="13.4">перехід загальне → своє</tspan></text>
