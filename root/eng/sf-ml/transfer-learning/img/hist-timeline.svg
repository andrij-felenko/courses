<text x="116.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="116.0" dy="0.0">Божиновський і Фулгоші</tspan><tspan x="116.0" dy="13.4">(1976): перша модель</tspan><tspan x="116.0" dy="13.4">переносу для перцептрона —</tspan><tspan x="116.0" dy="13.4">додатний / від'ємний / нульовий</tspan></text>
