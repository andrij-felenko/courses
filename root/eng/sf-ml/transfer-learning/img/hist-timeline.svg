<text x="508.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="508.0" dy="0.0">Пан і Ян (2010): чіткі</tspan><tspan x="508.0" dy="13.4">означення «домен» і «задача»,</tspan><tspan x="508.0" dy="13.4">схема видів переносу.</tspan><tspan x="508.0" dy="13.4">Спільна мова для поля</tspan></text>
