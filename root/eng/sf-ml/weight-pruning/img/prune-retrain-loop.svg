<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прорідження ітеративне: різати потроху й щоразу лікувати</text>
<rect x="50.0" y="125.0" width="140.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">1. Навчити</tspan><tspan x="120.0" dy="16.9">повну мережу</tspan></text>
<rect x="265.0" y="125.0" width="150.0" height="49.9" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">2. Викинути</tspan><tspan x="340.0" dy="16.9">найдрібніші ваги</tspan></text>
<rect x="500.0" y="125.0" width="150.0" height="49.9" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">3. Донавчити</tspan><tspan x="575.0" dy="16.9">(лікувати рану)</tspan></text>
<line x1="190.0" y1="150.0" x2="265.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="415.0" y1="150.0" x2="500.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="575.0" y1="125.0" x2="340.0" y2="101.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="340.0" y1="101.0" x2="340.0" y2="125.0" stroke="#333333" stroke-width="1.8"/>
<text x="457.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">повторювати, доки якість тримається</text>
<text x="360.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">різко викинути все й спинитись → якість провалюється;</text>
<text x="360.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">потроху + донавчання → мережа встигає перерозподілити роботу</text>
</svg>