<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскадне накопичення похибок конвеєра та руйнування активацій</text>
<rect x="40.0" y="75.0" width="180.0" height="80.0" rx="6" fill="#e6f7ff" stroke="#1890ff" stroke-width="1.5"/><text x="130.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">1. Сенсор та ISP</tspan><tspan x="130.0" dy="14.3">Шум фотодіодів,</tspan><tspan x="130.0" dy="14.3">дрейф AWB і AEC</tspan><tspan x="130.0" dy="14.3">Δ ≈ 3..6 LSB</tspan></text>
<rect x="255.0" y="75.0" width="180.0" height="80.0" rx="6" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/><text x="345.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">2. Зрізання бітів</tspan><tspan x="345.0" dy="14.3">Конверсія кольору</tspan><tspan x="345.0" dy="14.3">RGB888 → RGB565</tspan><tspan x="345.0" dy="14.3">Δ ≈ 2..4 LSB</tspan></text>
<rect x="470.0" y="75.0" width="180.0" height="80.0" rx="6" fill="#fff1f0" stroke="#f5222d" stroke-width="1.5"/><text x="560.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">3. Сітка Resize</tspan><tspan x="560.0" dy="14.3">Q16.16 субокруглення,</tspan><tspan x="560.0" dy="14.3">зсув півпікселя</tspan><tspan x="560.0" dy="14.3">Δ ≈ 1..3 LSB</tspan></text>
<rect x="685.0" y="75.0" width="180.0" height="80.0" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/><text x="775.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">4. Квантування</tspan><tspan x="775.0" dy="14.3">int8 афінний clamp,</tspan><tspan x="775.0" dy="14.3">округлення нуль-пункту</tspan><tspan x="775.0" dy="14.3">Δ ≈ 0.5..1 LSB</tspan></text>
<line x1="225.0" y1="115.0" x2="250.0" y2="115.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="115.0" x2="465.0" y2="115.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="655.0" y1="115.0" x2="680.0" y2="115.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="775.0" y1="160.0" x2="775.0" y2="230.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="130.0" y1="160.0" x2="130.0" y2="195.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="130.0" y1="195.0" x2="775.0" y2="195.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3 3"/>
<rect x="50.0" y="240.0" width="360.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Шар 0: Перша згортка (Conv 3x3)</tspan><tspan x="230.0" dy="14.3">Високочастотні фільтри градієнтів</tspan><tspan x="230.0" dy="14.3">Похибки підсилюються вагами (x2..x5)</tspan><tspan x="230.0" dy="14.3">Cosine Similarity падає: 0.999 → 0.982</tspan></text>
<rect x="470.0" y="240.0" width="360.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Функція активації (ReLU / Hard-Swish)</tspan><tspan x="650.0" dy="14.3">Зсув знаку перетворює слабкий сигнал на 0</tspan><tspan x="650.0" dy="14.3">Занулення каналів (Neuron Death)</tspan><tspan x="650.0" dy="14.3">Маска активацій розходиться на 15-30%</tspan></text>
<line x1="415.0" y1="280.0" x2="465.0" y2="280.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="325.0" x2="650.0" y2="360.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="170.0" y="365.0" width="600.0" height="48.0" rx="6" fill="#fff2e8" stroke="#d4380d" stroke-width="1.5"/><text x="470.0" y="385.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#871400" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Фінальний вихід моделі: деградація метрик (Top-1: 98% → 42%)</tspan><tspan x="470.0" dy="15.6">Паритет препроцесингу — єдиний захист від Training-Serving Skew</tspan></text>
</svg>