<rect x="354.0" y="300.0" width="340.0" height="116.0" rx="6" fill="#fdf3f0" stroke="#c0392b" stroke-width="1.3"/><text x="524.0" y="349.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="524.0" dy="0.0">Дешево, один прохід. Але хибиться, коли сцена НЕ сіра в середньому: велике червоне тло, зелене поле, синє небо на весь кадр — воно вважає той колір «перекосом світла» й вибілює його в сіре. Мало кольорів — теж хиба.</tspan></text>
