<rect x="754.0" y="300.0" width="340.0" height="116.0" rx="6" fill="#fdf3f0" stroke="#c0392b" stroke-width="1.3"/><text x="924.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="924.0" dy="0.0">Теж дешево. Але тримається на ОДНОМУ найяскравішому пікселі: пересвіт, відблиск від металу, кольоровий ліхтар у кадрі — і оцінку зносить. Тому беруть не пік, а перцентиль (верхній ~1%), щоб не ловити випадковий блиск.</tspan></text>
