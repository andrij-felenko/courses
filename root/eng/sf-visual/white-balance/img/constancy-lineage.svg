<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 923.75 576" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="923.75" height="576" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від загадки ока до трьох коефіцієнтів: ланцюг, не винахід</text>
<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">кожна ланка додала рівно один шар — нікого одного не можна назвати «автором балансу білого»</text>
<text x="40.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="start" font-weight="700">1902</text>
<text x="40.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Йоганн фон Кріс</text>
<text x="40.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">ідея (словами)</text>
<rect x="228.0" y="82.0" width="6.0" height="70.0" rx="3" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<rect x="250.0" y="82.0" width="610.0" height="70.0" rx="6" fill="#fbfbfd" stroke="#6b7280" stroke-width="1.2"/><text x="555.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Колбочки ока адаптуються НАРІЗНО: кожен тип множить свою чутливість на свій коефіцієнт. Це діагональне перетворення — жоден канал не підмішується в чужий.</tspan></text>
<line x1="231.0" y1="152.0" x2="231.0" y2="172.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="40.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="start" font-weight="700">1912</text>
<text x="40.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Герберт Айвз</text>
<text x="40.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">застосування</text>
<rect x="228.0" y="174.0" width="6.0" height="70.0" rx="3" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<rect x="250.0" y="174.0" width="610.0" height="70.0" rx="6" fill="#fbfbfd" stroke="#6b7280" stroke-width="1.2"/><text x="555.0" y="212.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Уперше застосував коефіцієнти фон Кріса до задачі: як їх обрати, щоб ВІДОМИЙ білий еталон лишався білим під різним світлом. Це — баланс по сірій картці.</tspan></text>
<line x1="231.0" y1="244.0" x2="231.0" y2="264.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="40.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="start" font-weight="700">1971</text>
<text x="40.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ленд і МакКанн</text>
<text x="40.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">модель зору (ретинекс)</text>
<rect x="228.0" y="266.0" width="6.0" height="70.0" rx="3" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<rect x="250.0" y="266.0" width="610.0" height="70.0" rx="6" fill="#fbfbfd" stroke="#6b7280" stroke-width="1.2"/><text x="555.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Світлість = відношення до НАЙЯСКРАВІШОГО вздовж дороги по зображенню. З цього нормування «до максимуму» й випала пізніша «біла пляма»: найяскравіше = біле.</tspan></text>
<line x1="231.0" y1="336.0" x2="231.0" y2="356.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="40.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#8a5a00" text-anchor="start" font-weight="700">1980</text>
<text x="40.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ґершон Бухсбаум</text>
<text x="40.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">формальна модель</text>
<rect x="228.0" y="358.0" width="6.0" height="70.0" rx="3" fill="#8a5a00" stroke="#8a5a00" stroke-width="0.0"/>
<rect x="250.0" y="358.0" width="610.0" height="70.0" rx="6" fill="#fbfbfd" stroke="#6b7280" stroke-width="1.2"/><text x="555.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Око оцінює світло з УСЬОГО поля зору; середня відбивність сцени сіра. Звідси прямо: середній колір кадру = колір світла. Це формальний «сірий світ».</tspan></text>
<line x1="231.0" y1="428.0" x2="231.0" y2="448.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="228.0" y="448.0" width="632.0" height="46.0" rx="8" fill="#eef6ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="555.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">інженерія камери</text>
<text x="555.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">три коефіцієнти g_R, g_G, g_B на канал — біла пляма й сірий світ сходяться сюди з різних кінців ланцюга</text>
</svg>