<text x="380.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Окрім ширини кожної літери, гарний шрифт має таблицю поправок для конкретних ПАР (AV, To).</text>
<text x="380.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">У дрібних embedded-шрифтах цю таблицю часто пропускають заради пам'яті.</text>
