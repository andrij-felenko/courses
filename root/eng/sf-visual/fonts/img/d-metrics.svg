<text x="380.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Крок (advance) більший за ширину карти на бічні проміжки; xOffset/yOffset зі знаком ставлять карту відносно курсора.</text>
