<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому саме 2012: три інгредієнти нарешті зійшлися</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ідея згорткових мереж була давно; бракувало даних і обчислень — поки не з'явилися ImageNet і GPU</text>
<rect x="70" y="110" width="220" height="184" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<rect x="70" y="110" width="220" height="34" rx="10" fill="#1f4ed8" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="180" y="133" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ДАНІ</text>
<text x="90" y="168" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ImageNet (2009):</text>
<text x="90" y="191" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">мільйони мічених</text>
<text x="90" y="214" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">фото, 1000 класів</text>
<text x="90" y="237" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ є на чому вчити</text>
<text x="302" y="206" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<line x1="180" y1="296" x2="480" y2="348" stroke="#cbd5e1" stroke-width="1.3" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="360" y="110" width="220" height="184" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<rect x="360" y="110" width="220" height="34" rx="10" fill="#d98a00" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="470" y="133" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">ОБЧИСЛЕННЯ</text>
<text x="380" y="168" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">GPU:</text>
<text x="380" y="191" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">тисячі ядер рахують</text>
<text x="380" y="214" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">згортки гуртом</text>
<text x="380" y="237" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ навчання за дні</text>
<text x="592" y="206" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<line x1="470" y1="296" x2="480" y2="348" stroke="#cbd5e1" stroke-width="1.3" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="650" y="110" width="220" height="184" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<rect x="650" y="110" width="220" height="34" rx="10" fill="#0a8f3c" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="760" y="133" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">АЛГОРИТМ</text>
<text x="670" y="168" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">глибока CNN +</text>
<text x="670" y="191" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">зворотне поширення</text>
<text x="670" y="214" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">+ ReLU, dropout</text>
<text x="670" y="237" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ глибше й стійкіше</text>
<line x1="760" y1="296" x2="480" y2="348" stroke="#cbd5e1" stroke-width="1.3" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="360" y="350" width="240" height="70" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.2"/>
<text x="480" y="376" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">усі три разом</text>
<text x="480" y="402" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">= AlexNet (2012)</text>
<text x="150" y="372" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">сама лиш ідея чекала</text>
<text x="150" y="386" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">на дані й залізо</text>
</svg>
