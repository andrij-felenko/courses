<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="25.0" y="50.0" width="200.0" height="75.0" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="125.0" y="68.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b4f72" text-anchor="middle"><tspan x="125.0" dy="0.0">Вхідні дані детектора:</tspan><tspan x="125.0" dy="15.6">• N рамок B = {b₁, …, b_N}</tspan><tspan x="125.0" dy="15.6">• Скори впевненості S</tspan><tspan x="125.0" dy="15.6">• Пороги T_score, T_nms</tspan></text>
<rect x="265.0" y="50.0" width="190.0" height="75.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="360.0" y="68.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d6608" text-anchor="middle"><tspan x="360.0" dy="0.0">Фільтрація за скором:</tspan><tspan x="360.0" dy="15.6">Видалити всі рамки b_i,</tspan><tspan x="360.0" dy="15.6">де s_i &lt; T_score</tspan><tspan x="360.0" dy="15.6">(відсікання фонового шуму)</tspan></text>
<line x1="225.0" y1="87.0" x2="265.0" y2="87.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="495.0" y="50.0" width="180.0" height="75.0" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/><text x="585.0" y="68.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#512e5f" text-anchor="middle"><tspan x="585.0" dy="0.0">Сортування (Sorting):</tspan><tspan x="585.0" dy="15.6">Впорядкувати рамки:</tspan><tspan x="585.0" dy="15.6">s₁ ≥ s₂ ≥ … ≥ s_M</tspan><tspan x="585.0" dy="15.6">Складність: O(M log M)</tspan></text>
<line x1="455.0" y1="87.0" x2="495.0" y2="87.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="715.0" y="50.0" width="160.0" height="75.0" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/><text x="795.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0e6251" text-anchor="middle"><tspan x="795.0" dy="0.0">Ініціалізація:</tspan><tspan x="795.0" dy="11.7">Фінальний список D = ∅</tspan><tspan x="795.0" dy="11.7">Кандидати C = {b₁, …, b_M}</tspan></text>
<line x1="675.0" y1="87.0" x2="715.0" y2="87.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="795.0" y1="125.0" x2="795.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="705.0" y="180.0" width="180.0" height="65.0" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.5"/><text x="795.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e3200" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">Умова циклу:</tspan><tspan x="795.0" dy="14.3">Чи список C непорожній?</tspan></text>
<line x1="705.0" y1="212.0" x2="600.0" y2="212.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="380.0" y="175.0" width="220.0" height="75.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="193.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#145a32" text-anchor="middle"><tspan x="490.0" dy="0.0">Вибір максимуму:</tspan><tspan x="490.0" dy="15.6">Витягнути перший елемент M</tspan><tspan x="490.0" dy="15.6">Додати M до списку D</tspan><tspan x="490.0" dy="15.6">C = C \ {M}</tspan></text>
<line x1="380.0" y1="212.0" x2="260.0" y2="212.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25.0" y="175.0" width="235.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="142.5" y="193.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#78281f" text-anchor="middle"><tspan x="142.5" dy="0.0">Попарне порівняння IoU:</tspan><tspan x="142.5" dy="15.6">Для кожної рамки b_j ∈ C:</tspan><tspan x="142.5" dy="15.6">Обчислити iou = IoU(M, b_j)</tspan><tspan x="142.5" dy="15.6">Якщо iou ≥ T_nms → видалити b_j</tspan></text>
<line x1="142.0" y1="250.0" x2="142.0" y2="305.0" stroke="#333333" stroke-width="1.5"/>
<line x1="142.0" y1="305.0" x2="795.0" y2="305.0" stroke="#333333" stroke-width="1.5"/>
<line x1="795.0" y1="305.0" x2="795.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="468.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Повернення на наступну ітерацію з оновленою множиною C</text>
<line x1="795.0" y1="245.0" x2="795.0" y2="360.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="810.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НІ</text>
<rect x="640.0" y="360.0" width="235.0" height="80.0" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/><text x="757.5" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1c2833" text-anchor="middle" font-weight="700"><tspan x="757.5" dy="0.0">Остаточний вихід:</tspan><tspan x="757.5" dy="15.6">Список чистих детекцій D</tspan><tspan x="757.5" dy="15.6">Рівно одна оптимальна рамка</tspan><tspan x="757.5" dy="15.6">на кожен фізичний об'єкт</tspan></text>
<rect x="25.0" y="360.0" width="580.0" height="80.0" rx="6" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="1.5"/><text x="315.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle"><tspan x="315.0" dy="0.0">Часова складність та оптимізація:</tspan><tspan x="315.0" dy="15.6">• Найгірший випадок: O(N²) попарних перевірок IoU</tspan><tspan x="315.0" dy="15.6">• Реальний час після фільтрації за скором (M ≪ N): O(M log M + K·M)</tspan><tspan x="315.0" dy="15.6">• На вбудованих CPU сортування Top-K QuickSelect скорочує час у рази.</tspan></text>
</svg>