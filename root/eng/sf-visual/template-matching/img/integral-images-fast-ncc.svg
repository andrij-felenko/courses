<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтегральні зображення: миттєве обчислення локального середнього та дисперсії</text>
<rect x="35.0" y="65.0" width="385.0" height="260.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="227.5" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтегральна таблиця: сума вікна за O(1)</text>
<rect x="60.0" y="90.0" width="335.0" height="190.0" rx="4" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<rect x="150.0" y="140.0" width="155.0" height="95.0" rx="2" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="227.5" y="187.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вікно W (M × N)</text>
<circle cx="150.0" cy="140.0" r="5.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="136.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">A</text>
<circle cx="305.0" cy="140.0" r="5.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="319.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">B</text>
<circle cx="150.0" cy="235.0" r="5.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="136.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">C</text>
<circle cx="305.0" cy="235.0" r="5.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="319.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">D</text>
<rect x="50.0" y="291.0" width="355.0" height="26.0" rx="6" fill="#edf2f7" stroke="#333333" stroke-width="1.0"/><text x="227.5" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="227.5" dy="0.0">Сума у вікні = S(D) − S(B) − S(C) + S(A)</tspan></text>
<rect x="445.0" y="65.0" width="360.0" height="260.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="625.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві таблиці для повного нормування</text>
<rect x="460.0" y="85.0" width="330.0" height="62.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="470.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Таблиця сум: S(x,y) = Σ I(u,v)</text>
<text x="470.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→ Локальне середнє: Ī = Sum(S, W) / (M·N)</text>
<rect x="460.0" y="157.0" width="330.0" height="62.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="470.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Таблиця квадратів: S₂(x,y) = Σ I²(u,v)</text>
<text x="470.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→ Локальна енергія: Σ I² = Sum(S₂, W)</text>
<rect x="460.0" y="229.0" width="330.0" height="78.0" rx="4" fill="#fdf2f8" stroke="#c0392b" stroke-width="1.2"/>
<text x="470.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Дисперсія патча за 8 звернень до пам'яті:</text>
<text x="470.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">σ_I = √[ Sum(S₂, W) − (Sum(S, W))² / (M·N) ]</text>
<text x="470.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Складність: O(1) незалежно від розміру шаблону!</text>
</svg>