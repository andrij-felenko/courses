<text x="718.5" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">θ</text>
<rect x="600.0" y="302.0" width="225.0" height="26.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/><text x="712.5" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="712.5" dy="0.0">ZNCC = cos(θ) = ⟨u_I, u_T⟩ ∈ [−1, 1]</tspan></text>
