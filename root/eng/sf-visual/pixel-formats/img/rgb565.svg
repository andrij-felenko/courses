<text x="360.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">проти 256 у 8-бітному каналі — грубше, зате піксель удвічі легший (2 Б замість 3)</text>
<rect x="70.0" y="214.0" width="580.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">16 біт діляться 5-6-5: зеленому дають зайвий біт, бо до нього око найгостріше (він несе</tspan><tspan x="360.0" dy="13.7">більшу частину яскравості). Такий піксель — рівно 2 байти: ідеально лягає у пам'ять</tspan><tspan x="360.0" dy="13.7">малих дисплеїв і економить удвічі проти RGB888, ціною видимих сходинок на плавних градієнтах.</tspan></text>
