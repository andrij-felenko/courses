<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Станції конвеєра: у кожної свій дефіцитний ресурс</text>
<rect x="56.0" y="74.0" width="320.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="216.0" y="111.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="216.0" dy="0.0">1.  Скласти потребу кадру</tspan></text>
<line x1="384.0" y1="106.0" x2="432.0" y2="106.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="440.0" y="74.0" width="480.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="680.0" y="102.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">процесор, мікросекунди, у потоці інтерфейсу</tspan><tspan x="680.0" dy="16.9">скасовувати нічого — потребу рахують наново щокадру</tspan></text>
<line x1="216.0" y1="142.0" x2="216.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="56.0" y="190.0" width="320.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="216.0" y="227.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="216.0" dy="0.0">2.  Пошук у кеші розпакованих</tspan></text>
<line x1="384.0" y1="222.0" x2="432.0" y2="222.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="440.0" y="190.0" width="480.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="680.0" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">оперативна пам'ять, наносекунди</tspan><tspan x="680.0" dy="16.9">влучання — тайл одразу йде малюватися</tspan></text>
<line x1="216.0" y1="258.0" x2="216.0" y2="302.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="56.0" y="306.0" width="320.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="216.0" y="343.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="216.0" dy="0.0">3.  Байти: диск, потім мережа</tspan></text>
<line x1="384.0" y1="338.0" x2="432.0" y2="338.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="440.0" y="306.0" width="480.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="680.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">канал і затримка, від одиниць до сотень мілісекунд</tspan><tspan x="680.0" dy="16.9">у черзі — скасувати; у польоті — дати завершити</tspan></text>
<line x1="216.0" y1="374.0" x2="216.0" y2="418.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="56.0" y="422.0" width="320.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="216.0" y="459.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="216.0" dy="0.0">4.  Розпакування картинки</tspan></text>
<line x1="384.0" y1="454.0" x2="432.0" y2="454.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="440.0" y="422.0" width="480.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="680.0" y="450.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">фонові потоки, ~2 мс на тайл, ×13 за обсягом</tspan><tspan x="680.0" dy="16.9">застарілий результат усе одно кладемо в кеш</tspan></text>
<line x1="216.0" y1="490.0" x2="216.0" y2="534.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="56.0" y="538.0" width="320.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="216.0" y="575.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="216.0" dy="0.0">5.  Завантаження текстури</tspan></text>
<line x1="384.0" y1="570.0" x2="432.0" y2="570.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="440.0" y="538.0" width="480.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="680.0" y="566.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">шина до GPU й час кадру, ~0.1 мс на тайл</tspan><tspan x="680.0" dy="16.9">квота на кадр: кілька штук, решта чекає</tspan></text>
<text x="490.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">між станціями — черги з обмеженою довжиною; кожна станція має власну межу паралельности</text>
</svg>