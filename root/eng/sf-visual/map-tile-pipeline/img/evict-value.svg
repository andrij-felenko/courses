<text x="336.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">тайли поточного рівня; синій прямокутник — екран</text>
<rect x="664.0" y="112.0" width="336.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="832.0" y="139.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="832.0" dy="0.0">цінність =</tspan><tspan x="832.0" dy="16.9">−2 · |z − z_екрана| − d²</tspan><tspan x="832.0" dy="16.9">d = 1 на краю екрана</tspan></text>
<rect x="664.0" y="208.0" width="336.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="832.0" y="235.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="832.0" dy="0.0">предок (z−1):</tspan><tspan x="832.0" dy="16.9">−2 − d² + 2 ≈ −0.5</tspan><tspan x="832.0" dy="16.9">тримаємо майже завжди</tspan></text>
<rect x="664.0" y="304.0" width="336.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="832.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="832.0" dy="0.0">чужий variant —</tspan><tspan x="832.0" dy="16.9">стиль, щільність, мова:</tspan><tspan x="832.0" dy="16.9">−10³⁰⁰, летить перед усім</tspan></text>
<rect x="664.0" y="400.0" width="336.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.4"/><text x="832.0" y="427.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="832.0" dy="0.0">товста рамка —</tspan><tspan x="832.0" dy="16.9">найнижча цінність:</tspan><tspan x="832.0" dy="16.9">ці чотири й витіснять</tspan></text>
<text x="530.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">порядок витіснення — не давність, а поле цінности навколо екрана;</tspan><tspan x="530.0" dy="16.9">воно змінюється щокадру, тому його не зберігають, а рахують одним проходом у мить перебору</tspan></text>
