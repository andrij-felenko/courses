<text x="480.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Машина не «бачить» куб — вона має лише числа. Перетворити числа на зміст і є вся задача машинного бачення.</text>
<text x="480.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Те, що мозок робить непомітно, машині треба збудувати покроково — від пікселя до поняття.</text>
