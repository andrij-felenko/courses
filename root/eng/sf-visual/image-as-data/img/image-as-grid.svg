<text x="96.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• адресуємо піксель як [рядок, стовпець]; зрушити, додати, порівняти — усе це дії над числами.</text>
