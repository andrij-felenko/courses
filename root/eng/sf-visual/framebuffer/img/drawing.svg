<text x="360.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle">база+(y·W+x)·бпп</text>
<line x1="440.0" y1="125.0" x2="500.0" y2="125.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
