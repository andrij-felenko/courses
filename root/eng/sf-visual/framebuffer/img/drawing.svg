<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Малювання — це послідовність записів у масив</text>
<rect x="70.0" y="90.0" width="150.0" height="70.0" rx="6" fill="#eef2f5" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="145.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">set_pixel(x,y,c)</text>
<text x="145.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">«постав піксель»</text>
<line x1="220.0" y1="125.0" x2="280.0" y2="125.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="280.0" y="90.0" width="160.0" height="70.0" rx="6" fill="#eef4f8" stroke="#1a1a1a" stroke-width="1.6"/>
