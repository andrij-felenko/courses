<text x="629.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">c</text>
<text x="646.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle">записати колір у комірку</text>
<text x="410.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Лінія, текст, картинка — усе зводиться до багатьох таких записів.</text>
<text x="410.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Кадровий буфер дає довільний доступ: торкайся будь-якого пікселя будь-коли,</text>
<text x="410.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">склади все в памʼяті — і виштовхни готовий кадр на екран.</text>
<text x="410.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Саме заради цієї свободи компонувати в памʼяті й тримають кадровий буфер.</text>
