<text x="665.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один контейнер</text>
<rect x="70.0" y="150.0" width="330.0" height="80.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="70.0" y="150.0" width="56.0" height="80.0" rx="4" fill="#c9d3dd" stroke="#333333" stroke-width="1.8"/>
<text x="98.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">тайл 700 Б</text>
<text x="263.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">3.4 КіБ порожньо</text>
<text x="235.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">один блок файлової системи — 4 КіБ</text>
<text x="235.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">56 327 тайлів = 56 327 файлів</text>
<text x="235.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">кожне читання: open() і close()</text>
<text x="235.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">видалити набір = 56 327 викликів</text>
