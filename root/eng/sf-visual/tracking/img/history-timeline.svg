<rect x="40.0" y="278.0" width="740.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="410.0" y="294.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Дві старі ідеї — вести ТОЧКИ за рухом яскравості (Лукас–Канаде) чи ПЛЯМУ за кольором (CAMShift) — не зникли.</tspan><tspan x="410.0" dy="12.3">SORT і DeepSORT вбудували їх у цикл «детектуй зрідка, веди щокадру»: нейромережа дає бокси, Калман і Hungarian — тяглість.</tspan></text>
