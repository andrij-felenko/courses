<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життя і смерть треку: народження → проба → підтвердження → смерть</text>
<rect x="73.0" y="96.9" width="74.1" height="46.1" rx="6" fill="#fbfbfd" stroke="#94a3b8" stroke-width="2.0"/><text x="110.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">детекція</tspan><tspan x="110.0" dy="13.7">без пари</tspan></text>
<rect x="253.2" y="96.9" width="93.6" height="46.1" rx="6" fill="#fbfbfd" stroke="#d98a00" stroke-width="2.0"/><text x="300.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">проба</tspan><tspan x="300.0" dy="13.7">(tentative)</tspan></text>
<rect x="456.7" y="96.9" width="106.6" height="46.1" rx="6" fill="#fbfbfd" stroke="#27ae60" stroke-width="2.0"/><text x="510.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">підтверджений</tspan><tspan x="510.0" dy="13.7">(confirmed)</tspan></text>
<rect x="671.7" y="96.9" width="80.6" height="46.1" rx="6" fill="#fbfbfd" stroke="#c0392b" stroke-width="2.0"/><text x="712.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">вбитий</tspan><tspan x="712.0" dy="13.7">(deleted)</tspan></text>
<line x1="149.0" y1="120.0" x2="251.2" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200.1" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">нова поява</text>
<line x1="348.8" y1="120.0" x2="454.7" y2="120.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><text x="401.7" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">min_hits збігів</text>
<path d="M 300 146 Q 506 216 706 146" fill="none" stroke="#c0392b" stroke-width="1.7" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text x="506.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">проба зірвалась (1 пропуск)</text>
<line x1="565.3" y1="116.0" x2="669.7" y2="116.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="611.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">max_missed пропусків</text>
<path d="M 494 102 q 30 -38 60 0" fill="none" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="528.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">збіг → веде далі</text>
<rect x="40.0" y="230.0" width="740.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="410.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Детекція без пари родить ПРОБНИЙ трек. Витримав min_hits збігів поспіль — стає ПІДТВЕРДЖЕНИМ і йде в вихід.</tspan><tspan x="410.0" dy="12.3">Пропустив ціль max_missed кадрів поспіль — трек убивають. Пробний помирає від першого ж зриву — щоб шум не плодив фантомів.</tspan></text>
</svg>