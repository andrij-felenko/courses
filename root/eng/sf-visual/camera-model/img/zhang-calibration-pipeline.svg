<rect x="310.0" y="80.0" width="240.0" height="34.0" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.0"/>
<text x="430.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2. Гомографії H_i</text>
<text x="430.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Для кожного кадру i:</text>
<text x="430.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">s · m = H_i · M</text>
<text x="430.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">де H_i = K [r_1  r_2  t]</text>
<text x="430.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Оцінка через DLT + SVD</text>
<text x="430.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">за знайденими кутами клітинок</text>
<rect x="330.0" y="280.0" width="200.0" height="60.0" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="430.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Кожен кадр дає 2 рівняння</text>
<text x="430.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">на внутрішню матрицю B</text>
<line x1="550.0" y1="220.0" x2="590.0" y2="220.0" stroke="#1a1a1a" stroke-width="2.0"/>
<polygon points="590,220 582,215 582,225" fill="#1a1a1a"/>
<rect x="600.0" y="30.0" width="300.0" height="380.0" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.0"/>
<rect x="600.0" y="30.0" width="300.0" height="34.0" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.0"/>
<text x="750.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3. Обчислення параметрів</text>
<rect x="620.0" y="80.0" width="260.0" height="115.0" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="750.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">Лінійний розв'язок (SVD):</text>
<text x="750.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">V · b = 0  ⇒  B = K^(-T) K^(-1)</text>
<text x="750.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Аналітичне вилучення:</text>
<text x="750.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">f_x, f_y, c_x, c_y, s та (R_i, t_i)</text>
<line x1="750.0" y1="205.0" x2="750.0" y2="225.0" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="750,225 745,217 755,217" fill="#1a1a1a"/>
<rect x="620.0" y="235.0" width="260.0" height="155.0" rx="6" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="750.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c026d3" text-anchor="middle" font-weight="700">Нелінійне уточнення (LM):</text>
<text x="750.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Мінімізація перепроекції:</text>
<text x="750.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">min Σ || m_ij - π(K, D, R_i, t_i, M_j) ||²</text>
<text x="750.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Оцінка дисторсії: k_1, k_2, p_1, p_2</text>
<text x="750.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Субпіксельна точність (0.1–0.3 px)</text>
