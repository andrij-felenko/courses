<text x="150.0" y="220.44" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<rect x="167" y="198" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="184.0" y="220.44" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="150" y="252" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">різниця «право − ліво»</text>
<text x="390" y="114" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Gy (горизонтальні межі)</text>
