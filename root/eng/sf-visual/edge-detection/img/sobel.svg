<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Собель: згортка, що оцінює градієнт</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Gx ловить вертикальні межі, Gy — горизонтальні; разом дають силу межі √(Gx²+Gy²) і напрям</text>
<text x="150" y="114" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Gx (вертикальні межі)</text>
