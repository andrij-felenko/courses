<text x="825" y="378" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">два ядра-похідні</text>
<text x="825" y="396" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">із 49.3</text>
