<text x="390" y="252" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">різниця «низ − верх»</text>
<rect x="560" y="150" width="360" height="124" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="740" y="174" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">сила межі в кожнім пікселі:</text>
<text x="740" y="204" font-size="14" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">|G| = √(Gx² + Gy²)</text>
<text x="740" y="234" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">напрям межі = atan2(Gy, Gx)</text>
<text x="740" y="256" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(куди дивиться перепад)</text>
<text x="125" y="312" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">вхід: квадрат</text>
<rect x="70" y="322" width="110" height="100" rx="8" fill="#10131a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="102" y="344" width="50" height="50" rx="8" fill="none" fill-opacity="1.0" stroke="#94a3b8" stroke-width="3"/>
<text x="232" y="372" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">→</text>
<text x="310" y="312" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Gx: бокові</text>
<rect x="255" y="322" width="110" height="100" rx="8" fill="#10131a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<line x1="287" y1="344" x2="287" y2="394" stroke="#f8fafc" stroke-width="3.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="337" y1="344" x2="337" y2="394" stroke="#f8fafc" stroke-width="3.5" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="460" y="312" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Gy: верх/низ</text>
<rect x="405" y="322" width="110" height="100" rx="8" fill="#10131a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<line x1="437" y1="344" x2="487" y2="344" stroke="#f8fafc" stroke-width="3.5" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="437" y1="394" x2="487" y2="394" stroke="#f8fafc" stroke-width="3.5" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="572" y="372" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">→</text>
<text x="655" y="312" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">|G|: повний контур</text>
