<text x="760.0" y="320" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">2 пороги: сильні + зв'язані</text>
<rect x="40" y="372" width="880" height="56" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="480" y="394" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Джон Канні (1986) вивів цей конвеєр як МАТЕМАТИЧНО оптимальний: добре виявити, точно локалізувати, один відгук на межу.</text>
<text x="480" y="414" font-size="9.2" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Результат — тонкі, чисті, зв'язані контури, на яких будують усе подальше (форми, лінії — 49.6).</text>
