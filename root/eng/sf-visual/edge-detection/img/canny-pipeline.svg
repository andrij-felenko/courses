<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Канні: конвеєр чистих, тонких, зв'язаних меж</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">розмити → градієнт (Собель) → стоншити (немаксимуми геть) → подвійний поріг із гістерезисом (з'єднати)</text>
