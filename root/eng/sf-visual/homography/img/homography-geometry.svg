<rect x="210.0" y="290.0" width="420.0" height="60.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="420.0" y="298.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Алгебраїчна структура матриці H:</tspan><tspan x="420.0" dy="16.9">H = K₂ · (R − t·nᵀ / d) · K₁⁻¹</tspan></text>
