<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр робастної оцінки гомографії: від точок до пози та деварпінгу</text>
<rect x="36.4" y="60.4" width="187.1" height="59.2" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="130.0" y="78.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">1. Вхідні пари точок</tspan><tspan x="130.0" dy="15.6">{xᵢ ↔ x'ᵢ} (ORB / SIFT)</tspan><tspan x="130.0" dy="15.6">Шум + викиди (outliers)</tspan></text>
<line x1="220.0" y1="90.0" x2="270.0" y2="90.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="271.6" y="60.4" width="216.9" height="59.2" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="380.0" y="78.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">2. Нормалізація Гартлі</tspan><tspan x="380.0" dy="15.6">x̃ = T·x,  x̃' = T'·x'</tspan><tspan x="380.0" dy="15.6">Центр (0,0), сер. відст. √2</tspan></text>
<line x1="490.0" y1="90.0" x2="540.0" y2="90.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="545.0" y="40.0" width="300.0" height="200.0" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.8"/>
<text x="695.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4338ca" text-anchor="middle" font-weight="700">3. Робастний цикл RANSAC</text>
<rect x="560.0" y="75.0" width="270.0" height="42.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="695.0" y="92.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Вибірка: 4 випадкові пари точок</tspan><tspan x="695.0" dy="14.3">(жодні три не на одній прямій)</tspan></text>
<line x1="695.0" y1="117.0" x2="695.0" y2="130.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="560.0" y="130.0" width="270.0" height="42.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="695.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Розв'язок DLT: A·h = 0 через SVD</tspan><tspan x="695.0" dy="14.3">Мінімальний правий вектор v₉</tspan></text>
<line x1="695.0" y1="172.0" x2="695.0" y2="185.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="560.0" y="185.0" width="270.0" height="45.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="695.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Підрахунок inliers за похибкою</tspan><tspan x="695.0" dy="14.3">Симетрична відстань перенесення &lt; ε</tspan></text>
<line x1="695.0" y1="240.0" x2="695.0" y2="280.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="575.4" y="290.4" width="239.2" height="59.2" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="695.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">4. Нелінійна оптимізація</tspan><tspan x="695.0" dy="15.6">Левенберг–Марквардт на inliers</tspan><tspan x="695.0" dy="15.6">Мін. похибки перепроєкції</tspan></text>
<line x1="580.0" y1="320.0" x2="480.0" y2="320.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="286.4" y="298.2" width="187.1" height="43.6" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Денормалізація матриці:</tspan><tspan x="380.0" dy="15.6">H = (T')⁻¹ · H̃ · T</tspan></text>
<line x1="280.0" y1="320.0" x2="210.0" y2="260.0" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="320.0" x2="210.0" y2="390.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="17.8" y="228.2" width="184.5" height="53.6" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="110.0" y="244.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">5a. Декомпозиція пози</tspan><tspan x="110.0" dy="14.3">H → {R, t/d, n}</tspan><tspan x="110.0" dy="14.3">Одометрія / Посадка дрона</tspan></text>
<rect x="0.7" y="368.2" width="218.6" height="53.6" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="110.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">5b. Деварпінг і IPM</tspan><tspan x="110.0" dy="14.3">Bird's Eye View для автопілота</tspan><tspan x="110.0" dy="14.3">Зворотний білінійний варпінг</tspan></text>
<rect x="280.0" y="400.0" width="560.0" height="60.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="560.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Ключова гарантія: Hartley-нормалізація зменшує число обумовленості матриці AᵀA з 10¹² до 10²,</tspan><tspan x="560.0" dy="13.0">що забезпечує стійкість SVD до шуму дискретизації та запобігає виродженню.</tspan></text>
</svg>