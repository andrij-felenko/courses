<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 442" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="442" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Якобіан перепроєкції: геометрія збурення пози та ланцюг множників 2×3 · 3×6</text>
<line x1="150.0" y1="250.0" x2="340.0" y2="110.0" stroke="#94a3b8" stroke-width="1.8"/>
<line x1="150.0" y1="250.0" x2="141.0" y2="162.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="150.0" y1="250.0" x2="158.0" y2="332.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3,4"/>
<text x="120.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">вісь φ</text>
<line x1="340.0" y1="110.0" x2="388.0" y2="174.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="396.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">φ × X_c</text>
<text x="396.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">= −[X_c]ₓ·φ</text>
<line x1="340.0" y1="110.0" x2="420.0" y2="110.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="428.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">δt</text>
<text x="428.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">(I)</text>
<line x1="330.3" y1="117.1" x2="337.4" y2="126.7" stroke="#6b7280" stroke-width="1.2"/>
<line x1="347.1" y1="119.7" x2="337.4" y2="126.7" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="150.0" cy="250.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="138.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">C</text>
<circle cx="340.0" cy="110.0" r="6.0" fill="#0f766e" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="352.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700">X_c</text>
<rect x="44.0" y="300.0" width="430.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/><text x="259.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="259.0" dy="0.0">Поворот φ несе X_c по колу навколо осі — миттєва швидкість φ×X_c</tspan><tspan x="259.0" dy="14.3">перпендикулярна радіусу C→X_c, тобто дорівнює −[X_c]ₓ·φ.</tspan><tspan x="259.0" dy="14.3">Зсув δt рухає точку 1:1, тому ∂X_c/∂δt = I.</tspan></text>
<rect x="515.0" y="150.0" width="118.0" height="64.0" rx="6" fill="#fbfbfd" stroke="#1a1a1a" stroke-width="1.7"/><text x="574.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="574.0" dy="0.0">Δ = (δt, φ)</tspan><tspan x="574.0" dy="15.6">ℝ⁶ · поза</tspan></text>
<rect x="705.0" y="150.0" width="96.0" height="64.0" rx="6" fill="#fbfbfd" stroke="#1a1a1a" stroke-width="1.7"/><text x="753.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="753.0" dy="0.0">δX_c</tspan><tspan x="753.0" dy="15.6">ℝ³ · камера</tspan></text>
<rect x="873.0" y="150.0" width="100.0" height="64.0" rx="6" fill="#fbfbfd" stroke="#1a1a1a" stroke-width="1.7"/><text x="923.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">δ(u, v)</tspan><tspan x="923.0" dy="15.6">ℝ² · піксель</tspan></text>
<line x1="638.0" y1="182.0" x2="700.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="669.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">( I₃ | −[X_c]ₓ )</text>
<text x="669.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">3×6</text>
<line x1="806.0" y1="182.0" x2="868.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="837.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">∂π ∕ ∂X_c</text>
<text x="837.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2×3</text>
<rect x="505.0" y="300.0" width="470.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/><text x="740.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Ланцюг: поза → точка в камері → піксель.</tspan><tspan x="740.0" dy="14.3">Перемножені блоки дають J = ∂π/∂X_c · ( I₃ | −[X_c]ₓ )</tspan><tspan x="740.0" dy="14.3">— 2×6 на кожну точку, цеглину нормальних рівнянь JᵀJ·Δ = −Jᵀr.</tspan></text>
</svg>