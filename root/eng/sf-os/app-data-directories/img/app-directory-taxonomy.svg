<rect x="250.0" y="164.0" width="200.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="192.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">~/.local/share</tspan><tspan x="350.0" dy="14.3">(FHS: /var/lib, /usr/share)</tspan></text>
<rect x="460.0" y="164.0" width="150.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="535.0" y="192.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">Диск (Disk)</tspan><tspan x="535.0" dy="15.6">0700 / 0755</tspan></text>
<rect x="620.0" y="164.0" width="170.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Обов'язкове (бази, сейви)</tspan><tspan x="705.0" dy="13.0">Великий обсяг</tspan></text>
<rect x="800.0" y="164.0" width="170.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="192.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Втрата важливих даних</tspan><tspan x="885.0" dy="15.6">і стану роботи</tspan></text>
<rect x="30.0" y="238.0" width="210.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Стан сесії (State)</tspan><tspan x="135.0" dy="15.6">$XDG_STATE_HOME</tspan></text>
<rect x="250.0" y="238.0" width="200.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">~/.local/state</tspan><tspan x="350.0" dy="15.6">(FHS: /var/log)</tspan></text>
<rect x="460.0" y="238.0" width="150.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="535.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">Диск (Disk)</tspan><tspan x="535.0" dy="15.6">0700</tspan></text>
<rect x="620.0" y="238.0" width="170.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Не резервується</tspan><tspan x="705.0" dy="15.6">(виключити з dotfiles)</tspan></text>
<rect x="800.0" y="238.0" width="170.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Скидання історії, логів</tspan><tspan x="885.0" dy="14.3">та геометрії вікон</tspan></text>
<rect x="30.0" y="312.0" width="210.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Кеш (Cache)</tspan><tspan x="135.0" dy="15.6">$XDG_CACHE_HOME</tspan></text>
<rect x="250.0" y="312.0" width="200.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">~/.cache</tspan><tspan x="350.0" dy="15.6">(FHS: /var/cache)</tspan></text>
<rect x="460.0" y="312.0" width="150.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="535.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">Диск (Disk)</tspan><tspan x="535.0" dy="15.6">0700 / 0755</tspan></text>
<rect x="620.0" y="312.0" width="170.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="705.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Суворо виключити</tspan><tspan x="705.0" dy="15.6">(сміття для бекапу)</tspan></text>
<rect x="800.0" y="312.0" width="170.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="885.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Безпечно видаляти;</tspan><tspan x="885.0" dy="15.6">програма перегенерує</tspan></text>
<rect x="30.0" y="386.0" width="210.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="414.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Рантайм-сокети (Runtime)</tspan><tspan x="135.0" dy="15.6">$XDG_RUNTIME_DIR</tspan></text>
<rect x="250.0" y="386.0" width="200.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="350.0" y="414.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">/run/user/$UID</tspan><tspan x="350.0" dy="15.6">(FHS: /run)</tspan></text>
<rect x="460.0" y="386.0" width="150.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="535.0" y="414.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">RAM (tmpfs)</tspan><tspan x="535.0" dy="15.6">Строго 0700</tspan></text>
<rect x="620.0" y="386.0" width="170.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="705.0" y="414.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Неможливо й не треба</tspan><tspan x="705.0" dy="15.6">(живе лише в сесії)</tspan></text>
<rect x="800.0" y="386.0" width="170.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="885.0" y="414.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Знищується ядром</tspan><tspan x="885.0" dy="15.6">при виході з системи</tspan></text>
