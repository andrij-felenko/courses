<rect x="250.0" y="90.0" width="200.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">~/.config</tspan><tspan x="350.0" dy="15.6">(FHS: /etc)</tspan></text>
<rect x="460.0" y="90.0" width="150.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="535.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">Диск (Disk)</tspan><tspan x="535.0" dy="15.6">0700 / 0755</tspan></text>
<rect x="620.0" y="90.0" width="170.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Критичне (в git/dotfiles)</tspan><tspan x="705.0" dy="13.0">Малий обсяг</tspan></text>
<rect x="800.0" y="90.0" width="170.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Втрата налаштувань</tspan><tspan x="885.0" dy="15.6">користувача</tspan></text>
