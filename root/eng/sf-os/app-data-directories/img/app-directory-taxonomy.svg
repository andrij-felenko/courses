<rect x="800.0" y="45.0" width="170.0" height="36.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="67.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">Наслідок видалення</tspan></text>
