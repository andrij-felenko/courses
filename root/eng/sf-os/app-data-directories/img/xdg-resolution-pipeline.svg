<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр резолюції каталогів: перевірка змінних оточення, fallback та права</text>
<rect x="30.0" y="60.0" width="220.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">1. Запит типу каталогу</tspan><tspan x="140.0" dy="15.6">(наприклад, CONFIG)</tspan><tspan x="140.0" dy="15.6">для програми &quot;myapp&quot;</tspan></text>
<line x1="250.0" y1="95.0" x2="290.0" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="290.0" y="60.0" width="240.0" height="70.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">2. Перевірка getenv()</tspan><tspan x="410.0" dy="15.6">$XDG_CONFIG_HOME</tspan><tspan x="410.0" dy="15.6">чи задано і чи шлях абсолютний?</tspan></text>
<line x1="530.0" y1="95.0" x2="620.0" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="575.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="620.0" y="65.0" width="340.0" height="60.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Шлях = $XDG_CONFIG_HOME / &quot;myapp&quot;</tspan><tspan x="790.0" dy="15.6">Використання вказаного каталогу</tspan></text>
<line x1="410.0" y1="130.0" x2="410.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">НІ</text>
<rect x="290.0" y="190.0" width="240.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">3. Fallback до HOME</tspan><tspan x="410.0" dy="15.6">Перевірка getenv(&quot;HOME&quot;)</tspan><tspan x="410.0" dy="15.6">якщо пусто -&gt; getpwuid(getuid())</tspan></text>
<line x1="530.0" y1="230.0" x2="620.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="200.0" width="340.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Шлях = $HOME / &quot;.config&quot; / &quot;myapp&quot;</tspan><tspan x="790.0" dy="15.6">Стандартний шлях за специфікацією</tspan></text>
<line x1="790.0" y1="125.0" x2="790.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="790.0" y1="260.0" x2="790.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="300.0" width="340.0" height="75.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">4. Рекурсивне створення mkdir_p()</tspan><tspan x="790.0" dy="15.6">з правами 0700 (приватні налаштування)</tspan><tspan x="790.0" dy="15.6">або 0755 за системною umask</tspan></text>
<rect x="30.0" y="290.0" width="220.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Каскадний пошук конфігів:</tspan><tspan x="140.0" dy="14.3">1. Користувацький каталог</tspan><tspan x="140.0" dy="14.3">2. $XDG_CONFIG_DIRS</tspan><tspan x="140.0" dy="14.3">(типово: /etc/xdg)</tspan></text>
</svg>