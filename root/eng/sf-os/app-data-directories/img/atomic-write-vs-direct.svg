<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння: прямий запис з обнуленням проти атомарної заміни через rename</text>
<rect x="30.0" y="45.0" width="440.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="67.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Прямий небезпечний запис (O_TRUNC)</tspan></text>
<rect x="50.0" y="95.0" width="400.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">1. open(&quot;app.conf&quot;, O_WRONLY|O_CREAT|O_TRUNC)</tspan><tspan x="250.0" dy="15.6">Файл миттєво обнуляється на диску (розмір = 0)</tspan></text>
<line x1="250.0" y1="145.0" x2="250.0" y2="175.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="175.0" width="400.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">2. write(fd, buf, len)</tspan><tspan x="250.0" dy="15.6">Побайтовий запис у файл частинами</tspan></text>
<line x1="250.0" y1="225.0" x2="250.0" y2="255.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="255.0" width="400.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">АВАРІЯ (SIGKILL, падіння або збій живлення)</tspan><tspan x="250.0" dy="15.6">під час кроку 1 або 2</tspan></text>
<line x1="250.0" y1="315.0" x2="250.0" y2="345.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="345.0" width="400.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="373.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">НАСЛІДОК: Порожній або пошкоджений файл (0 байт).</tspan><tspan x="250.0" dy="15.6">Конфігурацію втрачено, застосунок падає при старті!</tspan></text>
<rect x="530.0" y="45.0" width="440.0" height="36.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="67.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Надійний атомарний запис (tempfile + rename)</tspan></text>
<rect x="550.0" y="95.0" width="400.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">1. mkstemp(&quot;app.conf.tmpXXXXXX&quot;) або O_TMPFILE</tspan><tspan x="750.0" dy="14.3">Створення тимчасового файлу в тому ж каталозі</tspan></text>
<line x1="750.0" y1="140.0" x2="750.0" y2="160.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="160.0" width="400.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">2. write() повного вмісту та fsync(fd)</tspan><tspan x="750.0" dy="14.3">Гарантоване скидання даних ядра на фізичний диск</tspan></text>
<line x1="750.0" y1="205.0" x2="750.0" y2="225.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="225.0" width="400.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">3. rename(&quot;app.conf.tmp&quot;, &quot;app.conf&quot;)</tspan><tspan x="750.0" dy="14.3">Атомарна зміна покажчика в каталозі (VFS rename)</tspan></text>
<line x1="750.0" y1="270.0" x2="750.0" y2="290.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="290.0" width="400.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="309.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">4. fsync(dir_fd)</tspan><tspan x="750.0" dy="14.3">Синхронізація запису каталогу в журналі ФС</tspan></text>
<line x1="750.0" y1="335.0" x2="750.0" y2="355.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="355.0" width="400.0" height="55.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">РЕЗУЛЬТАТ: У будь-який момент аварії існує або</tspan><tspan x="750.0" dy="15.6">повністю стара валідна версія, або повністю нова!</tspan></text>
</svg>