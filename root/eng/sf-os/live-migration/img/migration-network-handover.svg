<text x="710.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">IP: 10.0.0.50, MAC: AA:BB:CC:DD:EE:FF</tspan><tspan x="710.0" dy="14.2">TCP стек збережено в ядрі гостя</tspan><tspan x="710.0" dy="14.2">Обробка вхідних пакетів без рестарту</tspan></text>
<line x1="610.0" y1="220.0" x2="600.0" y2="140.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
