<text x="250.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Пам'ять заморожена / звільняється</tspan><tspan x="250.0" dy="14.2">virtio-net дескриптори закриті</tspan><tspan x="250.0" dy="14.2">Старі пакети більше не приймаються</tspan></text>
