<text x="140.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Активна TCP-сесія до 10.0.0.50</tspan><tspan x="140.0" dy="14.2">Seq: 420910, Ack: 88120</tspan></text>
