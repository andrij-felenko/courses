<rect x="10.0" y="10.0" width="940.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="320.0" y="35.0" width="320.0" height="105.0" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="480.0" y="59.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">L2 Комутатор (ToR Switch / OVS)</text>
<text x="480.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Таблиця комутації (Forwarding Database - FDB):</text>
