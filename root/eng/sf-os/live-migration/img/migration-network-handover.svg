<text x="570.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">«MAC AA:BB:.. на Порту 2»</text>
<line x1="630.0" y1="140.0" x2="780.0" y2="220.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
