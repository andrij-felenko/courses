<text x="805.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">2. Новий потік TCP</text>
<text x="805.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1d4ed8" text-anchor="middle">Пакет скеровано на Порт 2</text>
<rect x="30.0" y="420.0" width="900.0" height="40.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="480.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Клієнт не розриває TCP: затримка switchover (30-80 мс) менша за таймаут повтору TCP RTO (200 мс)</text>
