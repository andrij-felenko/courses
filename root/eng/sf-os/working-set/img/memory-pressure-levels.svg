<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шкала тиску на пам'ять у Linux: механізми реакції ядра</text>
<rect x="45.0" y="60.0" width="212.0" height="370.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="53.0" y="72.0" width="196.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="151.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="151.0" dy="0.0">Рівень 1: Норма</tspan></text>
<rect x="53.0" y="122.0" width="196.0" height="185.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="151.0" y="200.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="151.0" dy="0.0">RAM &gt; WMARK_HIGH</tspan><tspan x="151.0" dy="11.7">Фонові алокації проходять без затримок.</tspan><tspan x="151.0" dy="11.7">kswapd спить, усі потоки працюють</tspan><tspan x="151.0" dy="11.7">на штатній швидкості.</tspan></text>
<rect x="53.0" y="318.0" width="196.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="151.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="151.0" dy="0.0">Показники PSI:</tspan><tspan x="151.0" dy="15.6">PSI some = 0%</tspan><tspan x="151.0" dy="15.6">PSI full = 0%</tspan></text>
<rect x="277.0" y="60.0" width="212.0" height="370.0" rx="8" fill="#f2f6fd" stroke="#2457d6" stroke-width="2.0"/>
<rect x="285.0" y="72.0" width="196.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="383.0" y="95.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="383.0" dy="0.0">Рівень 2: Фоновий реклейм</tspan></text>
<rect x="285.0" y="122.0" width="196.0" height="185.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="383.0" y="200.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="383.0" dy="0.0">RAM &lt; WMARK_LOW</tspan><tspan x="383.0" dy="11.7">Прокидається kswapd у фоні.</tspan><tspan x="383.0" dy="11.7">Звільняє сторінки до WMARK_HIGH.</tspan><tspan x="383.0" dy="11.7">Потоки не блокуються на CPU.</tspan></text>
<rect x="285.0" y="318.0" width="196.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.4"/><text x="383.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="383.0" dy="0.0">Показники PSI:</tspan><tspan x="383.0" dy="15.6">PSI some &lt; 15%</tspan><tspan x="383.0" dy="15.6">PSI full = 0%</tspan></text>
<rect x="509.0" y="60.0" width="212.0" height="370.0" rx="8" fill="#fdf8ee" stroke="#d97706" stroke-width="2.0"/>
<rect x="517.0" y="72.0" width="196.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#d97706" stroke-width="1.5"/><text x="615.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">Рівень 3: Прямий реклейм</tspan></text>
<rect x="517.0" y="122.0" width="196.0" height="185.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="615.0" y="200.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">RAM &lt; WMARK_MIN</tspan><tspan x="615.0" dy="11.7">Алокуючий потік блокується.</tspan><tspan x="615.0" dy="11.7">Ядро змушує його власноруч</tspan><tspan x="615.0" dy="11.7">вивільняти пам'ять перед алокацією.</tspan></text>
<rect x="517.0" y="318.0" width="196.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#d97706" stroke-width="1.4"/><text x="615.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">Показники PSI:</tspan><tspan x="615.0" dy="15.6">PSI some &gt; 40%</tspan><tspan x="615.0" dy="15.6">PSI full &gt; 10%</tspan></text>
<rect x="741.0" y="60.0" width="212.0" height="370.0" rx="8" fill="#fdeeec" stroke="#c0392b" stroke-width="2.0"/>
<rect x="749.0" y="72.0" width="196.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="847.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="847.0" dy="0.0">Рівень 4: Трішинг &amp; OOM Killer</tspan></text>
<rect x="749.0" y="122.0" width="196.0" height="185.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="847.0" y="200.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">RAM вичерпана, реклейм буксує.</tspan><tspan x="847.0" dy="11.7">systemd-oomd / kernel OOM Killer</tspan><tspan x="847.0" dy="11.7">обирає жертву за oom_score</tspan><tspan x="847.0" dy="11.7">і надсилає SIGKILL.</tspan></text>
<rect x="749.0" y="318.0" width="196.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.4"/><text x="847.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="847.0" dy="0.0">Показники PSI:</tspan><tspan x="847.0" dy="15.6">PSI full &gt; 50%</tspan><tspan x="847.0" dy="15.6">OOM Trigger</tspan></text>
<line x1="45.0" y1="460.0" x2="953.0" y2="460.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="500.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Наростання дефіциту фізичної пам'яті (Memory Pressure)</text>
</svg>