<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оцінка робочої множини в Linux: списки Active/Inactive та Refault Distance</text>
<rect x="50.0" y="60.0" width="940.0" height="190.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="70.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Списки сторінок ядра (per-cgroup / per-NUMA Node LRU)</text>
<rect x="80.0" y="105.0" width="380.0" height="120.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="270.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Active List (гаряча робоча множина)</text>
<text x="270.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Сторінки з бітом Referenced = 1</text>
<text x="270.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Захищені від негайного вилучення</text>
<text x="270.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Розмір: active_list_size</text>
<rect x="580.0" y="105.0" width="380.0" height="120.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="770.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Inactive List (кандидати на витіснення)</text>
<text x="770.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Сторінки з бітом Referenced = 0</text>
<text x="770.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">kswapd сканує та готує до скидання</text>
<text x="770.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">shrink_inactive_list()</text>
<line x1="460.0" y1="145.0" x2="580.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Демоція (kswapd)</text>
<line x1="580.0" y1="190.0" x2="460.0" y2="190.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Повторний доступ</text>
<rect x="50.0" y="270.0" width="940.0" height="225.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.5"/>
<text x="70.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Алгоритм Refault Distance (mm/workingset.c)</text>
<rect x="75.0" y="315.0" width="260.0" height="110.0" rx="6" fill="#fdf8ee" stroke="#d97706" stroke-width="1.5"/><text x="205.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">1. Витіснення з Inactive</tspan><tspan x="205.0" dy="15.6">Сторінка вилучається з RAM.</tspan><tspan x="205.0" dy="15.6">У Page Cache XArray записується</tspan><tspan x="205.0" dy="15.6">Тіньовий запис (Shadow Entry):</tspan><tspan x="205.0" dy="15.6">shadow = eviction_counter</tspan></text>
<line x1="340.0" y1="370.0" x2="385.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="390.0" y="315.0" width="260.0" height="110.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">2. Повторний збій (Refault)</tspan><tspan x="520.0" dy="15.6">Процес знову звертається до даних.</tspan><tspan x="520.0" dy="15.6">Обчислення дистанції вилучення:</tspan><tspan x="520.0" dy="15.6">distance = current_eviction -</tspan><tspan x="520.0" dy="15.6">           shadow_eviction</tspan></text>
<line x1="655.0" y1="370.0" x2="700.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="705.0" y="315.0" width="265.0" height="110.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="837.5" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="837.5" dy="0.0">3. Порівняння з Active List</tspan><tspan x="837.5" dy="14.3">Якщо distance ≤ active_list_size:</tspan><tspan x="837.5" dy="14.3">• Сторінка була вилучена передчасно!</tspan><tspan x="837.5" dy="14.3">• Промоція ПРЯМО в Active List</tspan><tspan x="837.5" dy="14.3">• Розширення списку Active List</tspan></text>
<rect x="75.0" y="435.0" width="895.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="522.5" y="453.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="522.5" dy="0.0">Висновок: Refault Distance дозволяє ядру динамічно адаптувати баланс Active/Inactive списків</tspan><tspan x="522.5" dy="15.6">без ручного налаштування, точно утримуючи активну робочу множину процесу в пам'яті.</tspan></text>
</svg>