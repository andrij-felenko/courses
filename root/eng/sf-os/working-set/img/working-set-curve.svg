<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1018.28 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1018.28" height="500" fill="#ffffff"/>
