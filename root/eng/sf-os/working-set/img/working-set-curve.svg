<text x="360.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Δ* (робоче вікно)</text>
<rect x="110.0" y="422.0" width="780.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="500.0" y="442.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">При перевищенні вікна Δ* розмір w(Δ) майже не зростає, а частота збоїв m(Δ) прямує до нуля.</tspan><tspan x="500.0" dy="15.6">Утримання саме цього обсягу сторінок у RAM гарантує максимум швидкодії за мінімуму кадрів.</tspan></text>
