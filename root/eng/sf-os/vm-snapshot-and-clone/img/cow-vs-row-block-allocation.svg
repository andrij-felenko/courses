<text x="710.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle"><tspan x="710.0" dy="0.0">Запит: Запис нових даних у блок #4</tspan><tspan x="710.0" dy="12.0">Штраф першого запису: 1 прямий запис + оновлення покажчика L2</tspan></text>
<rect x="520.0" y="165.0" width="175.0" height="50.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.0"/>
<text x="607.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle"><tspan x="607.0" dy="0.0">1. Прямий запис у дельту</tspan><tspan x="607.0" dy="12.0">Новий кластер #4 (D')</tspan></text>
<line x1="700.0" y1="190.0" x2="730.0" y2="190.0" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
