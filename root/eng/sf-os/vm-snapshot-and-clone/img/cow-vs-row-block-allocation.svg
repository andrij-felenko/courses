<rect x="720.0" y="240.0" width="185.0" height="140.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="812.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Активний оверлей (Read-Write)</text>
<rect x="730.0" y="275.0" width="165.0" height="25.0" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<text x="812.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">Блок 4 (модифікований D')</text>
<rect x="730.0" y="305.0" width="165.0" height="55.0" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="812.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle"><tspan x="812.0" dy="0.0">Незадіяні блоки відсилають</tspan><tspan x="812.0" dy="10.8">до базового образу</tspan></text>
