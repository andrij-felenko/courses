<text x="250.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle"><tspan x="250.0" dy="0.0">Запит: Запис нових даних у блок #4 основного тому</tspan><tspan x="250.0" dy="12.0">Штраф першого запису: 1 читання + 2 записи (I/O Amplication = 3)</tspan></text>
<rect x="60.0" y="165.0" width="110.0" height="50.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.0"/>
