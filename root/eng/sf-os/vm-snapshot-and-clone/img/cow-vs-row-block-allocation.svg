<text x="607.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Блок 4 (оригінальний D)</text>
<rect x="530.0" y="335.0" width="155.0" height="25.0" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
