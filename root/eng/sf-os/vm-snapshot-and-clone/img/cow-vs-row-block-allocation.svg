<text x="607.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Базовий образ (Read-Only)</text>
<rect x="530.0" y="275.0" width="155.0" height="25.0" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
