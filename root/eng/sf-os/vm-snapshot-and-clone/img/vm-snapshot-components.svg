<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="480.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Анатомія стану віртуальної машини та рівні збереження знімка</text>
<rect x="30.0" y="60.0" width="420.0" height="390.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="240.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Повний стан запущеної ВМ (Runtime State)</text>
<rect x="45.0" y="105.0" width="390.0" height="85.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="240.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">1. Стан віртуальних процесорів та пристроїв</text>
<text x="240.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="240.0" dy="0.0">Регістри vCPU: RIP, RSP, CR0/CR3/CR4, MSR, EFLAGS</tspan><tspan x="240.0" dy="13.0">Стан емульованих пристроїв: vAPIC, virtio-кільця, таймери TSC</tspan></text>
<rect x="45.0" y="205.0" width="390.0" height="95.0" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="240.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">2. Оперативна пам'ять гостя (Guest RAM)</text>
<text x="240.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle"><tspan x="240.0" dy="0.0">Сторінки фізичної пам'яті гостя (GPA) в адресному просторі хоста</tspan><tspan x="240.0" dy="13.0">Брудні кеші сторінок ОС (Page Cache), буфери транзакцій СУБД</tspan><tspan x="240.0" dy="13.0">Активні TCP-з'єднання, стеки потоків виконання, змінні ядра</tspan></text>
<rect x="45.0" y="315.0" width="390.0" height="115.0" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
<text x="240.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">3. Блокове сховище (Virtual Disk Image)</text>
<text x="240.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle"><tspan x="240.0" dy="0.0">Фіксовані сектори/кластери віртуального диска (LBA)</tspan><tspan x="240.0" dy="13.0">Журнал файлової системи (ext4 jbd2 / XFS log / NTFS journal)</tspan><tspan x="240.0" dy="13.0">Незмінні дані, записані на постійний носій до моменту знімка</tspan></text>
<rect x="480.0" y="60.0" width="450.0" height="390.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="705.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Рівні узгодженості та збереження (Snapshot Levels)</text>
<rect x="495.0" y="105.0" width="420.0" height="95.0" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
<text x="705.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="700">А. Краш-узгоджений знімок диска (Crash-Consistent)</text>
<text x="705.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle"><tspan x="705.0" dy="0.0">• Фіксує виключно стан диска (Блок 3); пам'ять і vCPU ігноруються.</tspan><tspan x="705.0" dy="13.0">• Аналог раптового вимкнення живлення сервера з розетки.</tspan><tspan x="705.0" dy="13.0">• Потребує відтворення журналу файлової системи (Journal Replay).</tspan></text>
<rect x="495.0" y="215.0" width="420.0" height="105.0" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="705.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Б. Узгоджений із гостем знімок (Quiesced / FS-Consistent)</text>
<text x="705.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle"><tspan x="705.0" dy="0.0">• QEMU Guest Agent / VSS тимчасово заморожує I/O (FIFREEZE ioctl).</tspan><tspan x="705.0" dy="13.0">• Брудні системні буфери та кеші скидаються на диск перед знімком.</tspan><tspan x="705.0" dy="13.0">• Суперблок чистий; гарантується цілісність файлових систем і БД.</tspan></text>
<rect x="495.0" y="335.0" width="420.0" height="100.0" rx="4" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.2"/>
<text x="705.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#86198f" text-anchor="middle" font-weight="700">В. Живий знімок із пам'яттю (Live Memory Snapshot)</text>
<text x="705.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#701a75" text-anchor="middle"><tspan x="705.0" dy="0.0">• Зберігає всі три складові: vCPU (1) + RAM (2) + Диск (3).</tspan><tspan x="705.0" dy="13.0">• Відновлення повертає ВМ у точну мілісекунду роботи без перезавантаження.</tspan><tspan x="705.0" dy="13.0">• Зберігаються всі активні сокети, дескриптори та процеси в пам'яті.</tspan></text>
</svg>