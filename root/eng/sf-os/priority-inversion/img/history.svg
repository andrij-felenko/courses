<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від замітки до Марса: як визрівала інверсія пріоритетів</text>
<line x1="60.0" y1="96.0" x2="820.0" y2="96.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="819.0" y1="96.0" x2="834.0" y2="96.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="826.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час</text>
<circle cx="190.0" cy="96.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="190.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1980</text>
<line x1="190.0" y1="102.0" x2="190.0" y2="142.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="3 3"/>
<rect x="72.0" y="142.0" width="236.0" height="93.9" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="190.0" y="162.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1980 — уперше названо</text><text x="190.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Lampson і Redell (Xerox):</text><text x="190.0" y="192.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">монітори в мові Mesa —</text><text x="190.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">інверсію описано як</text><text x="190.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">справжню ваду планування</text>
<circle cx="430.0" cy="96.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="430.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">1990</text>
<line x1="430.0" y1="102.0" x2="430.0" y2="142.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="3 3"/>
<rect x="312.0" y="142.0" width="236.0" height="93.9" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="430.0" y="162.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1990 — строга теорія</text><text x="430.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Sha · Rajkumar · Lehoczky,</text><text x="430.0" y="192.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">IEEE Trans. Computers:</text><text x="430.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">названо «неконтрольовану</text><text x="430.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">інверсію», лік і теореми</text>
<circle cx="670.0" cy="96.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="670.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">1997</text>
<line x1="670.0" y1="102.0" x2="670.0" y2="142.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 3"/>
<rect x="552.0" y="142.0" width="236.0" height="93.9" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="670.0" y="162.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">4 липня 1997 — Марс</text><text x="670.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Pathfinder сідає; за дні —</text><text x="670.0" y="192.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">рестарти від сторожа.</text><text x="670.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Причина — інверсія у VxWorks;</text><text x="670.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">лік залито з Землі</text>
<rect x="69.2" y="381.8" width="721.5" height="36.5" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="404.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Ваду знали 17 років до посадки, теорію ліку — 7: бракувало не ідеї, а ввімкненого прапорця</tspan></text>
</svg>