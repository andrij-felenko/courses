<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 418" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="418" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дозвіл на запис записано двічі — і працює саме розбіжність</text>
<rect x="26.0" y="52.0" width="236.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="144.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="144.0" dy="0.0">Права ділянки (VMA)</tspan></text>
<rect x="282.0" y="52.0" width="168.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="366.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">Біт W у таблиці</tspan></text>
<rect x="470.0" y="52.0" width="504.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="722.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="722.0" dy="0.0">Що станеться при записі</tspan></text>
<rect x="26.0" y="116.0" width="236.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="144.0" y="162.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="144.0" dy="0.0">читання + запис</tspan></text>
<rect x="282.0" y="116.0" width="168.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="366.0" y="162.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">W = 1</tspan></text>
<rect x="470.0" y="116.0" width="504.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="722.0" y="152.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="722.0" dy="0.0">запис іде прямо в пам'ять;</tspan><tspan x="722.0" dy="19.5">ядро про нього навіть не дізнається</tspan></text>
<rect x="26.0" y="216.0" width="236.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="144.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="144.0" dy="0.0">читання + запис</tspan></text>
<rect x="282.0" y="216.0" width="168.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="366.0" y="262.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">W = 0</tspan></text>
<rect x="470.0" y="216.0" width="504.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="722.0" y="252.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="722.0" dy="0.0">пастка; ядро бачить дозвіл у ділянці —</tspan><tspan x="722.0" dy="19.5">отже, це збій копіювання при записі</tspan></text>
<rect x="26.0" y="316.0" width="236.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="144.0" y="362.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="144.0" dy="0.0">тільки читання</tspan></text>
<rect x="282.0" y="316.0" width="168.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="366.0" y="362.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">W = 0</tspan></text>
<rect x="470.0" y="316.0" width="504.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="722.0" y="352.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="722.0" dy="0.0">пастка; дозволу нема й у ділянці —</tspan><tspan x="722.0" dy="19.5">отже, це справжнє порушення, SIGSEGV</tspan></text>
