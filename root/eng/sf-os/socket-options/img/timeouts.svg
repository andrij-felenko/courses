<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 396" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="396" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три таймери сокета: кожен стереже своє</text>
<rect x="34.0" y="74.0" width="276.0" height="60.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="172.0" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="172.0" dy="0.0">SO_RCVTIMEO</tspan><tspan x="172.0" dy="15.6">SO_SNDTIMEO</tspan></text>
<line x1="340.0" y1="91.0" x2="340.0" y2="117.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="610.0" y1="91.0" x2="610.0" y2="117.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="340.0" y1="104.0" x2="610.0" y2="104.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="475.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">один виклик recv або send</text>
<text x="475.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">виклик повертає EAGAIN — з'єднання лишається живим</text>
<rect x="34.0" y="182.0" width="276.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="172.0" y="216.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="172.0" dy="0.0">TCP_USER_TIMEOUT</tspan></text>
<line x1="340.0" y1="199.0" x2="340.0" y2="225.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="860.0" y1="199.0" x2="860.0" y2="225.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="340.0" y1="212.0" x2="860.0" y2="212.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="600.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">поки надіслані дані не підтверджено</text>
<text x="600.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ядро само рве з'єднання з ETIMEDOUT</text>
<rect x="34.0" y="290.0" width="276.0" height="60.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="172.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="172.0" dy="0.0">SO_KEEPALIVE</tspan><tspan x="172.0" dy="15.6">TCP_KEEPIDLE …</tspan></text>
<line x1="340.0" y1="307.0" x2="340.0" y2="333.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="860.0" y1="307.0" x2="860.0" y2="333.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="340.0" y1="320.0" x2="860.0" y2="320.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="600.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">поки в з'єднанні тиша, даних немає</text>
<text x="600.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зонд питає, чи живий інший бік, і тримає запис у NAT</text>
