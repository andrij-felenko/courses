<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 456" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="456" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли яку опцію ще не пізно ставити</text>
<rect x="312.7" y="84.5" width="74.6" height="31.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="350.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">socket()</tspan></text>
<line x1="350.0" y1="124.0" x2="350.0" y2="152.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="499.5" y="84.5" width="60.9" height="31.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="530.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">bind()</tspan></text>
<line x1="530.0" y1="124.0" x2="530.0" y2="152.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="674.3" y="77.3" width="81.4" height="45.3" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="715.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">listen()</tspan><tspan x="715.0" dy="14.3">connect()</tspan></text>
<line x1="715.0" y1="124.0" x2="715.0" y2="152.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="857.7" y="84.5" width="74.6" height="31.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="895.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">accept()</tspan></text>
<line x1="895.0" y1="124.0" x2="895.0" y2="152.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="997.5" y="84.5" width="95.0" height="31.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="1045.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1045.0" dy="0.0">send / recv</tspan></text>
<line x1="1045.0" y1="124.0" x2="1045.0" y2="152.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="300.0" y1="142.0" x2="1090.0" y2="142.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="24.0" y="180.0" width="244.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="146.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="146.0" dy="0.0">SO_REUSEADDR</tspan></text>
<rect x="350.0" y="191.0" width="180.0" height="26.0" rx="8" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="207.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="440.0" dy="0.0">від socket() до bind()</tspan></text>
<text x="440.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">зайнятість адреси перевіряє саме bind() — після нього перевіряти вже нічого</text>
<rect x="24.0" y="242.0" width="244.0" height="48.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="146.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="146.0" dy="0.0">SO_RCVBUF · SO_SNDBUF</tspan></text>
<rect x="350.0" y="253.0" width="365.0" height="26.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="532.5" y="269.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="532.5" dy="0.0">до connect() / listen()</tspan></text>
<text x="532.5" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">коефіцієнт масштабування вікна сторони домовляють у рукостисканні, і лише раз</text>
<rect x="24.0" y="304.0" width="244.0" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="146.0" y="324.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="146.0" dy="0.0">TCP_NODELAY · таймаути</tspan><tspan x="146.0" dy="15.0">keepalive · IP_TTL</tspan></text>
<rect x="350.0" y="315.0" width="740.0" height="26.0" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="720.0" dy="0.0">будь-коли</tspan></text>
<text x="720.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">діють із наступного виклику — момент не важить, важить лише те, що ти їх поставив</text>
<rect x="24.0" y="366.0" width="244.0" height="48.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="146.0" y="386.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="146.0" dy="0.0">профіль на сокеті</tspan><tspan x="146.0" dy="15.0">з accept()</tspan></text>
<rect x="895.0" y="377.0" width="195.0" height="26.0" rx="8" fill="#fff6e0" stroke="#b08900" stroke-width="1.5"/><text x="992.5" y="393.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle"><tspan x="992.5" dy="0.0">після accept()</tspan></text>
<text x="992.5" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">успадковано не все — постав ще раз</text>
<text x="560.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">пізно буває тільки буферам: усе інше ти просто забув поставити</text>
</svg>