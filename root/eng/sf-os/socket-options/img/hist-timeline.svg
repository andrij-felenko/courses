<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві доріжки: коли з'явилася кожна оптимізація і де вони зійшлися</text>
<rect x="645.0" y="86.0" width="200.0" height="278.0" rx="10" fill="#fff6e0" stroke="none" stroke-width="0.0"/>
<text x="150.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">липень 1982</text>
<text x="345.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">серпень 1983</text>
<text x="540.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">6 січня 1984</text>
<text x="745.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">червень 1986</text>
<text x="950.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">жовтень 1989</text>
<line x1="24.0" y1="76.0" x2="1056.0" y2="76.0" stroke="#d8dce2" stroke-width="1.2"/>
<text x="26.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Доріжка відправника: притримати дрібне</text>
<rect x="452.0" y="118.0" width="176.0" height="100.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">RFC 896, Джон Нейгл</tspan><tspan x="540.0" dy="14.3">(Ford Aerospace)</tspan><tspan x="540.0" dy="14.3">правило притримування;</tspan><tspan x="540.0" dy="14.3">таймер 200–500 мс</tspan><tspan x="540.0" dy="14.3">відхилено як хибний шлях</tspan></text>
<rect x="657.0" y="118.0" width="176.0" height="100.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="745.0" y="150.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">4.3BSD</tspan><tspan x="745.0" dy="14.3">idle || TF_NODELAY</tspan><tspan x="745.0" dy="14.3">притримування в ядрі —</tspan><tspan x="745.0" dy="14.3">і вимикач того ж дня</tspan></text>
<rect x="862.0" y="118.0" width="176.0" height="100.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="950.0" y="157.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">RFC 1122</tspan><tspan x="950.0" dy="14.3">SHOULD реалізувати,</tspan><tspan x="950.0" dy="14.3">MUST дати вимикач</tspan></text>
<text x="26.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="start" font-weight="700">Доріжка приймача: відкласти підтвердження</text>
<rect x="62.0" y="260.0" width="176.0" height="100.0" rx="6" fill="#fff6e0" stroke="#b08900" stroke-width="1.5"/><text x="150.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">RFC 813, Девід Кларк</tspan><tspan x="150.0" dy="14.3">(MIT)</tspan><tspan x="150.0" dy="14.3">підтвердження можна</tspan><tspan x="150.0" dy="14.3">відкласти — але тоді</tspan><tspan x="150.0" dy="14.3">треба завести таймер</tspan></text>
<rect x="257.0" y="260.0" width="176.0" height="100.0" rx="6" fill="#fff6e0" stroke="#b08900" stroke-width="1.5"/><text x="345.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">4.2BSD</tspan><tspan x="345.0" dy="14.3">TF_DELACK + fasttimo</tspan><tspan x="345.0" dy="14.3">змітання 5 разів на</tspan><tspan x="345.0" dy="14.3">секунду → крок 200 мс</tspan></text>
<rect x="862.0" y="260.0" width="176.0" height="100.0" rx="6" fill="#fff6e0" stroke="#b08900" stroke-width="1.5"/><text x="950.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">RFC 1122</tspan><tspan x="950.0" dy="14.3">SHOULD відкладати,</tspan><tspan x="950.0" dy="14.3">MUST менше за 0.5 с</tspan></text>
<text x="745.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="700">уперше в одному ядрі</text>
<text x="540.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">верхні клітинки 1982 і 1983 порожні: відкладене підтвердження вже їхало в робочому ядрі, коли правило притримування ще було чернеткою</text>
</svg>