<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки беруться сталі сорок мілісекунд</text>
<rect x="24.0" y="48.0" width="440.0" height="408.0" rx="10" fill="#fcfcfd" stroke="#c0392b" stroke-width="1.6"/>
<text x="244.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">два записи, тоді читання</text>
<rect x="84.6" y="88.2" width="62.8" height="31.5" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="116.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="116.0" dy="0.0">клієнт</tspan></text>
<rect x="340.6" y="88.2" width="62.8" height="31.5" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="372.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="372.0" dy="0.0">сервер</tspan></text>
<text x="244.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">заголовок 8 Б — іде одразу</text>
<line x1="148.0" y1="152.0" x2="340.0" y2="152.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="168.2" y="177.9" width="151.7" height="44.1" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="244.0" y="196.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="244.0" dy="0.0">тіло 200 Б притримано:</tspan><tspan x="244.0" dy="13.7">8 Б ще не підтверджено</tspan></text>
<rect x="141.2" y="239.9" width="205.5" height="44.1" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="244.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="244.0" dy="0.0">підтвердження відкладено:</tspan><tspan x="244.0" dy="13.7">сервер чекає повне повідомлення</tspan></text>
<rect x="147.2" y="310.8" width="193.6" height="30.5" rx="6" fill="#fff6e0" stroke="#b08900" stroke-width="1.5"/><text x="244.0" y="329.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle"><tspan x="244.0" dy="0.0">тиша 40 мс — розблокує таймер</tspan></text>
<text x="244.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">підтвердження</text>
<line x1="340.0" y1="382.0" x2="148.0" y2="382.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="244.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">тіло 200 Б</text>
<line x1="148.0" y1="430.0" x2="340.0" y2="430.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="496.0" y="48.0" width="440.0" height="408.0" rx="10" fill="#fcfcfd" stroke="#27ae60" stroke-width="1.6"/>
<text x="716.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">усе повідомлення одним записом</text>
<rect x="556.6" y="88.2" width="62.8" height="31.5" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="588.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="588.0" dy="0.0">клієнт</tspan></text>
<rect x="812.6" y="88.2" width="62.8" height="31.5" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="844.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="844.0" dy="0.0">сервер</tspan></text>
<text x="716.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">208 Б одним send</text>
<line x1="620.0" y1="152.0" x2="812.0" y2="152.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.2" y="183.9" width="151.7" height="44.1" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="716.0" y="202.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="716.0" dy="0.0">сегмент повний:</tspan><tspan x="716.0" dy="13.7">притримувати нема чого</tspan></text>
<text x="716.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">відповідь</text>
<line x1="812.0" y1="268.0" x2="620.0" y2="268.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="622.2" y="306.8" width="187.6" height="30.5" rx="6" fill="#fff6e0" stroke="#b08900" stroke-width="1.5"/><text x="716.0" y="325.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle"><tspan x="716.0" dy="0.0">затримка = один обіг мережею</tspan></text>
</svg>