<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що вирішує стек після того, як send уже повернувся</text>
<rect x="50.9" y="62.2" width="198.2" height="31.5" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">програма: send(12 байтів)</tspan></text>
<rect x="383.1" y="62.2" width="233.9" height="31.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">буфери й таймери сокета в ядрі</tspan></text>
<rect x="826.6" y="62.2" width="62.8" height="31.5" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="858.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="858.0" dy="0.0">мережа</tspan></text>
<line x1="262.0" y1="78.0" x2="348.0" y2="78.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="660.0" y1="78.0" x2="806.0" y2="78.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">між копіюванням і дротом ядро ухвалює чотири самостійні рішення</text>
<rect x="24.0" y="162.0" width="214.0" height="244.0" rx="10" fill="#eef3fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="131.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">скільки тримати</text>
<rect x="60.2" y="220.8" width="141.7" height="26.5" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="131.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="131.0" dy="0.0">SO_SNDBUF · SO_RCVBUF</tspan></text>
<text x="131.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="131.0" dy="0.0">вільне місце в прийманні —</tspan><tspan x="131.0" dy="15.4">це вікно, оголошене</tspan><tspan x="131.0" dy="15.4">відправникові, а вікно</tspan><tspan x="131.0" dy="15.4">задає стелю швидкості</tspan></text>
<rect x="270.0" y="162.0" width="214.0" height="244.0" rx="10" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="377.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">скільки чекати</text>
<rect x="291.2" y="220.8" width="171.6" height="26.5" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="377.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="377.0" dy="0.0">SO_RCVTIMEO · SO_KEEPALIVE</tspan></text>
<text x="377.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="377.0" dy="0.0">без ліміту виклик чекає</tspan><tspan x="377.0" dy="15.4">скільки завгодно, а мертвий</tspan><tspan x="377.0" dy="15.4">партнер просто мовчить</tspan></text>
<rect x="516.0" y="162.0" width="214.0" height="244.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="623.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">коли відсилати</text>
<rect x="582.1" y="220.8" width="81.8" height="26.5" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="623.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="623.0" dy="0.0">TCP_NODELAY</tspan></text>
<text x="623.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="623.0" dy="0.0">стек має право притримати</tspan><tspan x="623.0" dy="15.4">дрібні дані до підтвердження —</tspan><tspan x="623.0" dy="15.4">звідси сталі 40 мс</tspan></text>
<rect x="762.0" y="162.0" width="214.0" height="244.0" rx="10" fill="#fff6e0" stroke="#b08900" stroke-width="1.6"/>
<text x="869.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="700">як далеко пускати</text>
<rect x="786.2" y="220.8" width="165.6" height="26.5" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="869.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="869.0" dy="0.0">IP_TTL · IP_MULTICAST_TTL</tspan></text>
<text x="869.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="869.0" dy="0.0">у пакеті лічильник переходів;</tspan><tspan x="869.0" dy="15.4">для багатоадресної розсилки</tspan><tspan x="869.0" dy="15.4">типово 1 — своя підмережа</tspan></text>
<text x="500.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">жодне рішення стек не ухвалить правильно сам: наміру програми він не знає</text>
</svg>