<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="570.0" y1="96.0" x2="570.0" y2="464.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="6,6"/>
<text x="285.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Шлях конструктора</text>
<text x="285.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">будуєш з нуля щоразу</text>
<rect x="135.0" y="143.5" width="300.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="285.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">new Shape(</tspan><tspan x="285.0" dy="16.2">   x, y, колір, зброя,</tspan><tspan x="285.0" dy="16.2">   реакції, …десяток полів )</tspan></text>
<line x1="285.0" y1="208.5" x2="285.0" y2="316.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="185.0" y="331.5" width="200.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="352.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">новий об'єкт</tspan></text>
<text x="285.0" y="410.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">треба знати КЛАС</text>
<text x="285.0" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">і перелічити всі складники</text>
<text x="855.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Шлях прототипа</text>
<text x="855.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кажеш: ще один такий самий</text>
<rect x="705.0" y="143.5" width="300.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="855.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="855.0" dy="0.0">готовий зразок</tspan><tspan x="855.0" dy="16.2">усе вже налаштовано</tspan><tspan x="855.0" dy="16.2">clone()  ▶</tspan></text>
<line x1="855.0" y1="208.5" x2="855.0" y2="316.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="947.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-style="italic">копія</text>
<rect x="755.0" y="323.1" width="200.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="855.0" dy="0.0">новий незалежний</tspan><tspan x="855.0" dy="16.9">об'єкт</tspan></text>
<text x="855.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">потрібен лише</text>
<text x="855.0" y="440.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">готовий екземпляр</text>
<line x1="60.0" y1="486.0" x2="1080.0" y2="486.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="570.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знання «як зробити ще один такий» переїхало з місця виклику всередину об'єкта.</text>
</svg>