<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правильний clone() — рішення для КОЖНОГО поля окремо</text>
<text x="600.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">реєстр тривіальний; уся істина живе тут — глибину копії обирають на кожне поле</text>
<rect x="50.0" y="92.0" width="430.0" height="44.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.4"/><text x="265.0" y="118.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">поле такого роду</tspan></text>
<rect x="490.0" y="92.0" width="470.0" height="44.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.4"/><text x="725.0" y="118.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">що робить коректний clone()</tspan></text>
<rect x="970.0" y="92.0" width="180.0" height="44.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.4"/><text x="1060.0" y="118.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1060.0" dy="0.0">приклад-поле</tspan></text>
<rect x="50.0" y="136.0" width="430.0" height="70.0" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1.6"/><text x="265.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">скаляр: число, булеве,</tspan><tspan x="265.0" dy="16.2">незмінний рядок</tspan></text>
<rect x="490.0" y="136.0" width="470.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#c9ced6" stroke-width="1.6"/><text x="725.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">скопіювати значення</tspan><tspan x="725.0" dy="16.2">(стається саме собою)</tspan></text>
<rect x="970.0" y="136.0" width="180.0" height="70.0" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1.1"/><text x="1060.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1060.0" dy="0.0">hp,  name</tspan></text>
<rect x="50.0" y="214.0" width="430.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="265.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">вкладений ЗМІННИЙ</tspan><tspan x="265.0" dy="16.2">об'єкт або список</tspan></text>
<rect x="490.0" y="214.0" width="470.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="725.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">ГЛИБОКА копія —</tspan><tspan x="725.0" dy="16.2">власний примірник</tspan></text>
<rect x="970.0" y="214.0" width="180.0" height="70.0" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1.1"/><text x="1060.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1060.0" dy="0.0">loot[ ],  stats</tspan></text>
<rect x="50.0" y="292.0" width="430.0" height="70.0" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1.6"/><text x="265.0" y="323.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">незмінний вкладений</tspan><tspan x="265.0" dy="16.2">об'єкт</tspan></text>
<rect x="490.0" y="292.0" width="470.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#c9ced6" stroke-width="1.6"/><text x="725.0" y="323.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">поділити (shallow) —</tspan><tspan x="725.0" dy="16.2">безпечно й дешево</tspan></text>
<rect x="970.0" y="292.0" width="180.0" height="70.0" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1.1"/><text x="1060.0" y="323.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1060.0" dy="0.0">конфіг-</tspan><tspan x="1060.0" dy="15.6">константа</tspan></text>
<rect x="50.0" y="370.0" width="430.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="265.0" y="401.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">живий ресурс:</tspan><tspan x="265.0" dy="16.2">сокет, файл, лок</tspan></text>
<rect x="490.0" y="370.0" width="470.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="725.0" y="401.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">НЕ копіювати: поділити</tspan><tspan x="725.0" dy="16.2">або перевідкрити наново</tspan></text>
<rect x="970.0" y="370.0" width="180.0" height="70.0" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1.1"/><text x="1060.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1060.0" dy="0.0">socket,  fd</tspan></text>
<rect x="50.0" y="448.0" width="430.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="265.0" y="479.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">зворотне / циклічне</tspan><tspan x="265.0" dy="16.2">посилання</tspan></text>
<rect x="490.0" y="448.0" width="470.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="725.0" y="479.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">memo: та сама копія,</tspan><tspan x="725.0" dy="16.2">а не нова гілка</tspan></text>
<rect x="970.0" y="448.0" width="180.0" height="70.0" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1.1"/><text x="1060.0" y="479.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1060.0" dy="0.0">squad ↔</tspan><tspan x="1060.0" dy="15.6">member</tspan></text>
<text x="600.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм не вгадає семантику за тебе — саме тому clone() пишуть руками там, де поля різнорідні.</text>
</svg>