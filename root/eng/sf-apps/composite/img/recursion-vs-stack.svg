<rect x="105.0" y="200.0" width="210.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="210.0" y="227.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">traverse(ui)</tspan></text>
<rect x="105.0" y="254.0" width="210.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="210.0" y="281.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">traverse(a.ts)</tspan></text>
<line x1="75.0" y1="96.0" x2="75.0" y2="296.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="63.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">глибше</text>
<text x="210.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">дно листка → кадри згортаються вгору</text>
<line x1="410.0" y1="34.0" x2="410.0" y2="444.0" stroke="#d0d5dd" stroke-width="1.4" stroke-dasharray="5,5"/>
<text x="610.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Явний стек (цикл)</text>
<text x="610.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">власний список — у купі, не в стеку викликів</text>
<rect x="520.0" y="110.0" width="180.0" height="46.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.6"/><text x="610.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">ui</tspan></text>
<rect x="520.0" y="164.0" width="180.0" height="46.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.6"/><text x="610.0" y="192.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">docs</tspan></text>
<rect x="506.0" y="96.0" width="208.0" height="124.0" rx="10" fill="none" stroke="#27ae60" stroke-width="1.4"/>
<text x="610.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">stack = [...]</text>
<text x="610.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">цикл: node = stack.pop()</text>
<text x="610.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">для кожної дитини → stack.push(child)</text>
<text x="610.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">глибина дерева не чіпає стек викликів →</text>
<text x="610.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">переповнення неможливе</text>
</svg>