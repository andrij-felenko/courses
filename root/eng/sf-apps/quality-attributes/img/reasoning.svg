<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг рішення: від турботи стейкхолдера до свідомого компромісу</text>
<text x="104.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">турбота</text>
<rect x="30.0" y="102.0" width="148.0" height="62.0" rx="8" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/>
<text x="104.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="104.0" dy="0.0">«у пік не має</tspan><tspan x="104.0" dy="15.6">гальмувати»</tspan></text>
<text x="272.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">→ атрибут</text>
<rect x="198.0" y="102.0" width="148.0" height="62.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="272.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="272.0" dy="0.0">продуктивність</tspan></text>
<text x="440.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">→ сценарій</text>
<rect x="366.0" y="102.0" width="148.0" height="62.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="440.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">p95 ≤ 300 мс</tspan><tspan x="440.0" dy="15.6">при 1000 корист.</tspan></text>
<text x="608.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6508" text-anchor="middle" font-weight="700">→ тактика</text>
<rect x="534.0" y="102.0" width="148.0" height="62.0" rx="8" fill="#fef6e9" stroke="#8a6508" stroke-width="1.6"/>
<text x="608.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6508" text-anchor="middle" font-weight="700"><tspan x="608.0" dy="0.0">кеш + черга</tspan><tspan x="608.0" dy="15.6">на запис</tspan></text>
<text x="776.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">→ компроміс</text>
<rect x="702.0" y="102.0" width="148.0" height="62.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="776.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="776.0" dy="0.0">свіжість ↓,</tspan><tspan x="776.0" dy="15.6">складність ↑</tspan></text>
<line x1="179.0" y1="133.0" x2="197.0" y2="133.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="347.0" y1="133.0" x2="365.0" y2="133.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="515.0" y1="133.0" x2="533.0" y2="133.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="683.0" y1="133.0" x2="701.0" y2="133.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="222.0" width="740.0" height="60.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="440.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожна ланка витікає з попередньої. Пропустиш будь-яку — і рішення</text>
<text x="440.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">стає смаком, а не інженерією: нема числа, нема названого боку, який ти віддав.</text>
</svg>