<text x="1126.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час</text>
<circle cx="193.0" cy="300.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="193.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">1994</text>
<rect x="70.0" y="157.0" width="246.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="193.0" y="177.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="193.0" dy="0.0">«Банда чотирьох»</tspan><tspan x="193.0" dy="16.2">23 патерни —</tspan><tspan x="193.0" dy="16.2">пулу серед них НЕМА</tspan></text>
<line x1="193.0" y1="292.0" x2="193.0" y2="222.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4,4"/>
<circle cx="440.2" cy="300.0" r="8.0" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.4"/>
<text x="440.2" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">1999</text>
<rect x="317.2" y="388.0" width="246.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="440.2" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.2" dy="0.0">JDBC 2.0 Optional Package:</tspan><tspan x="440.2" dy="16.2">пул з'єднань —</tspan><tspan x="440.2" dy="16.2">у стандарті мови</tspan></text>
<line x1="440.2" y1="308.0" x2="440.2" y2="388.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="4,4"/>
<circle cx="687.4" cy="300.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="687.4" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">2002</text>
<rect x="564.4" y="157.0" width="246.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="687.4" y="177.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="687.4" dy="0.0">Kircher і Jain, «Pooling»</tspan><tspan x="687.4" dy="16.2">(EuroPLoP, с. 497–510):</tspan><tspan x="687.4" dy="16.2">пул описано як патерн</tspan></text>
<line x1="687.4" y1="292.0" x2="687.4" y2="222.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4,4"/>
<circle cx="975.8" cy="300.0" r="8.0" fill="#f3e9f7" stroke="#8e44ad" stroke-width="2.4"/>
<text x="975.8" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#8e44ad" text-anchor="middle" font-weight="700">2005</text>
<rect x="852.8" y="388.0" width="246.0" height="65.0" rx="6" fill="#f3e9f7" stroke="#8e44ad" stroke-width="1.6"/><text x="975.8" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.8" dy="0.0">Goetz і Bloch:</tspan><tspan x="975.8" dy="16.2">«пулити все» — міф;</tspan><tspan x="975.8" dy="16.2">лише важкі ресурси</tspan></text>
<line x1="975.8" y1="308.0" x2="975.8" y2="388.0" stroke="#8e44ad" stroke-width="1.3" stroke-dasharray="4,4"/>
<text x="590.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пул жив у практиці задовго до назви — і назву дістав уже після сумнівів</text>
<text x="590.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">з інженерії продуктивності (бази, сервери) → у каталог патернів → назад до «міряй, не вір»</text>
</svg>