<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="70.0" y1="258.0" x2="1110.0" y2="258.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="7,7"/>
<text x="590.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Короткоживучий об'єкт — без пулу: GC саме на це заточений</text>
<rect x="102.0" y="110.6" width="196.0" height="78.8" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.6"/><text x="200.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">народження</tspan><tspan x="200.0" dy="15.6">у молодшому поколінні</tspan><tspan x="200.0" dy="15.6">(зсув вказівника —</tspan><tspan x="200.0" dy="15.6">майже дарма)</tspan></text>
<rect x="462.0" y="118.4" width="196.0" height="63.2" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.6"/><text x="560.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">швидко вмирає</tspan><tspan x="560.0" dy="15.6">(гіпотеза поколінь:</tspan><tspan x="560.0" dy="15.6">молоде гине рано)</tspan></text>
<line x1="301.0" y1="150.0" x2="459.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="802.0" y="118.4" width="196.0" height="63.2" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.6"/><text x="900.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">малий GC копіює</tspan><tspan x="900.0" dy="15.6">лише ЖИВЕ;</tspan><tspan x="900.0" dy="15.6">мертве молоде — 0 роботи</tspan></text>
<line x1="661.0" y1="150.0" x2="799.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="590.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Пульований об'єкт — тримаємо живим: годуємо GC найважчим</text>
<rect x="80.0" y="376.2" width="170.0" height="47.6" rx="6" fill="#fdf0ea" stroke="#c0392b" stroke-width="1.6"/><text x="165.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">народження</tspan><tspan x="165.0" dy="15.6">(теж у молодшому)</tspan></text>
<rect x="325.0" y="376.2" width="170.0" height="47.6" rx="6" fill="#fdf0ea" stroke="#c0392b" stroke-width="1.6"/><text x="410.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">пул тримає</tspan><tspan x="410.0" dy="15.6">живим довго</tspan></text>
<line x1="253.0" y1="400.0" x2="322.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="604.8" y="376.2" width="170.5" height="47.6" rx="6" fill="#fdf0ea" stroke="#c0392b" stroke-width="1.6"/><text x="690.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">підвищення (promotion)</tspan><tspan x="690.0" dy="15.6">у старше покоління</tspan></text>
<line x1="498.0" y1="400.0" x2="601.8" y2="400.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="900.0" y="368.4" width="170.0" height="63.2" rx="6" fill="#fdf0ea" stroke="#c0392b" stroke-width="1.6"/><text x="985.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">кожен GC СКАНУЄ</tspan><tspan x="985.0" dy="15.6">знову; запис →</tspan><tspan x="985.0" dy="15.6">бар'єр old→young</tspan></text>
<line x1="778.2" y1="400.0" x2="897.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="590.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Пул робить дешеве народження обліком, дешеву смерть — підвищенням, і вимикає escape-аналіз</text>
</svg>