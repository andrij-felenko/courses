<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема ABA: CAS бачить те саме A — та стек уже інший</text>
<rect x="80.0" y="104.0" width="440.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="300.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Старт. Стек:  head →</tspan></text>
<rect x="602.0" y="104.0" width="44.0" height="32.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="624.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="624.0" dy="0.0">A</tspan></text>
<line x1="680.0" y1="120.0" x2="685.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="688.0" y="104.0" width="44.0" height="32.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="710.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">B</tspan></text>
<line x1="766.0" y1="120.0" x2="771.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="774.0" y="104.0" width="44.0" height="32.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="796.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="796.0" dy="0.0">C</tspan></text>
<rect x="80.0" y="192.2" width="440.0" height="47.6" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="300.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Потік 1: прочитав head=A, next=B;</tspan><tspan x="300.0" dy="15.6">готує CAS(A→B)… витіснений</tspan></text>
<rect x="602.0" y="200.0" width="44.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="624.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="624.0" dy="0.0">A</tspan></text>
<line x1="680.0" y1="216.0" x2="685.0" y2="216.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="688.0" y="200.0" width="44.0" height="32.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="710.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">B</tspan></text>
<line x1="766.0" y1="216.0" x2="771.0" y2="216.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="774.0" y="200.0" width="44.0" height="32.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="796.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="796.0" dy="0.0">C</tspan></text>
<rect x="80.0" y="296.0" width="440.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="300.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Потік 2: pop A, потім pop B</tspan></text>
<rect x="602.0" y="296.0" width="44.0" height="32.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="624.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="624.0" dy="0.0">C</tspan></text>
<rect x="80.0" y="384.2" width="440.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="300.0" y="404.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Потік 2: reset A, push A назад</tspan><tspan x="300.0" dy="15.6">(тепер A.next = C)</tspan></text>
<rect x="602.0" y="392.0" width="44.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="624.0" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="624.0" dy="0.0">A</tspan></text>
<line x1="680.0" y1="408.0" x2="685.0" y2="408.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="688.0" y="392.0" width="44.0" height="32.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="710.0" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">C</tspan></text>
<rect x="80.0" y="480.2" width="440.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="300.0" y="500.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Потік 1 прокинувся: CAS(head:A→B)</tspan><tspan x="300.0" dy="15.6">УСПІХ — head досі ==A!</tspan></text>
<rect x="602.0" y="488.0" width="44.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="624.0" y="508.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="624.0" dy="0.0">B</tspan></text>
<line x1="680.0" y1="504.0" x2="685.0" y2="504.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="688.0" y="488.0" width="44.0" height="32.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="710.0" y="508.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">?</tspan></text>
<text x="870.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">→ head→B→(вилучений B) — стек зруйновано</text>
<line x1="90.0" y1="560.0" x2="1150.0" y2="560.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="7,7"/>
<rect x="130.0" y="597.5" width="980.0" height="65.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.7"/><text x="620.0" y="618.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Лагодження — мічений покажчик (tagged pointer): head = {вказівник, лічильник}.</tspan><tspan x="620.0" dy="16.2">Кожен успішний CAS додає +1 до лічильника. Потік 1 тримає {A, v1}, а зараз уже {A, v3}</tspan><tspan x="620.0" dy="16.2">→ подвійний CAS не збігається за лічильником → безпечний повтор. Інший шлях — hazard pointers.</tspan></text>
</svg>