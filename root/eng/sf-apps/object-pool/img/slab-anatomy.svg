<text x="600.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">Кожна готова клітина вже містить сконструйований обʼєкт: стан збережено між використаннями.</text>
