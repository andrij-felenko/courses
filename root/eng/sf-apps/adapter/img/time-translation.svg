<line x1="558.0" y1="510.0" x2="722.0" y2="510.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="590.0" y="586.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кожен рядок треба замкнути — інакше час «протікає» крізь межу: загублена помилка, витік слухачів, подвійний виклик</text>
