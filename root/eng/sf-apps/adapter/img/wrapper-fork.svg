<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Wrapper» називає ФОРМУ, а не намір — тому імен два</text>
<rect x="290.0" y="109.5" width="520.0" height="51.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="550.0" y="130.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Wrapper — «обгортка»</tspan><tspan x="550.0" dy="17.6">об'єкт усередині об'єкта; виклик проходить крізь</tspan></text>
<rect x="145.0" y="318.1" width="310.0" height="83.7" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.9"/><text x="300.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Adapter (Адаптер)</tspan><tspan x="300.0" dy="16.9">МІНЯЄ інтерфейс</tspan><tspan x="300.0" dy="16.9">поведінку не додає</tspan><tspan x="300.0" dy="16.9">«інший роз'єм»</tspan></text>
<rect x="645.0" y="318.1" width="310.0" height="83.7" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.9"/><text x="800.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Decorator (Декоратор)</tspan><tspan x="800.0" dy="16.9">ЗБЕРІГАЄ інтерфейс</tspan><tspan x="800.0" dy="16.9">ДОДАЄ поведінку</tspan><tspan x="800.0" dy="16.9">«той самий роз'єм»</tspan></text>
<line x1="480.0" y1="160.5" x2="340.0" y2="316.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="160.5" x2="760.0" y2="316.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="170.0" y="448.0" width="760.0" height="54.0" rx="6" fill="#f7f2ea" stroke="#6b7280" stroke-width="1.4"/><text x="550.0" y="471.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Обидва фізично загортають чужий об'єкт — тому GoF позначив кожен і словом «Wrapper».</tspan><tspan x="550.0" dy="16.2">Але намір різний, тож у кожного лишилось і власне, точніше ім'я.</tspan></text>
</svg>