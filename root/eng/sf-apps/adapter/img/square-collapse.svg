<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Втрата інформації у f_in робить квадрат незамкненим</text>
<text x="460.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">два входи, які Target тримає нарізно</text>
<rect x="295.0" y="105.0" width="110.0" height="34.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="350.0" y="126.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">x₁</tspan></text>
<rect x="515.0" y="105.0" width="110.0" height="34.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="570.0" y="126.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">x₂</tspan></text>
<rect x="310.0" y="225.5" width="300.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="460.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">a = f_in(x₁) = f_in(x₂)</tspan></text>
<line x1="350.0" y1="141.0" x2="430.0" y2="223.5" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="570.0" y1="141.0" x2="490.0" y2="223.5" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="250.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">f_in склеює два входи</text>
<rect x="310.0" y="337.1" width="300.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="460.0" y="358.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">b = Adaptee(a)</tspan><tspan x="460.0" dy="16.9">один вихід</tspan></text>
<line x1="460.0" y1="260.5" x2="460.0" y2="335.1" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="662.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">робота Adaptee</text>
<rect x="310.0" y="475.1" width="300.0" height="49.9" rx="6" fill="#fff8f0" stroke="#c0392b" stroke-width="1.9"/><text x="460.0" y="496.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">v = f_out(b)</tspan><tspan x="460.0" dy="16.9">єдине значення</tspan></text>
<line x1="460.0" y1="388.9" x2="460.0" y2="473.1" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="662.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">f_out</text>
<rect x="295.0" y="595.0" width="110.0" height="34.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="350.0" y="616.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">y₁</tspan></text>
<rect x="515.0" y="595.0" width="110.0" height="34.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="570.0" y="616.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">y₂</tspan></text>
<text x="460.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#c0392b" text-anchor="middle" font-weight="700">≠</text>
<line x1="460.0" y1="527.0" x2="360.0" y2="593.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460.0" y1="527.0" x2="560.0" y2="593.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="356.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">=?</text>
<text x="564.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">=?</text>
<rect x="110.0" y="662.0" width="700.0" height="48.0" rx="6" fill="#f7f2ea" stroke="#6b7280" stroke-width="1.3"/><text x="460.0" y="682.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">v — одне значення, а мусило б дорівнювати водночас y₁ і y₂ (y₁ ≠ y₂).</tspan><tspan x="460.0" dy="15.6">Суперечність: квадрат не замкнути — втрату у f_in не відновить жодне f_out.</tspan></text>
</svg>