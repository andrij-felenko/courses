<line x1="388.0" y1="111.0" x2="416.0" y2="111.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="416.0" y="88.0" width="92.0" height="46.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="462.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="462.0" dy="0.0">сервіс 4</tspan></text>
<line x1="508.0" y1="111.0" x2="536.0" y2="111.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="536.0" y="88.0" width="92.0" height="46.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="582.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="582.0" dy="0.0">сервіс 5</tspan></text>
<text x="376.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">A = a·a·a·a·a = a⁵ = 0.99⁵ ≈ 0.951</text>
<text x="376.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">нижче за будь-яку окрему ланку — послідовність відбирає доступність</text>
<text x="40.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Паралельно — досить, щоб жила ХОЧ ОДНА копія:</text>
<rect x="70.0" y="262.0" width="128.0" height="34.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="134.0" y="282.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">копія «api»</tspan></text>
<line x1="198.0" y1="279.0" x2="250.0" y2="323.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="70.0" y="306.0" width="128.0" height="34.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="134.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">копія «api»</tspan></text>
<line x1="198.0" y1="323.0" x2="250.0" y2="323.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="70.0" y="350.0" width="128.0" height="34.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="134.0" y="370.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="134.0" dy="0.0">копія «api»</tspan></text>
<line x1="198.0" y1="367.0" x2="250.0" y2="323.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="250.0" y="306.0" width="118.0" height="34.0" rx="6" fill="#fff6e6" stroke="#b8860b" stroke-width="1.5"/><text x="309.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="309.0" dy="0.0">балансувальник</tspan></text>
<text x="470.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">A = 1 − (1−a)³ = 1 − 0.01³</text>
<text x="470.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-style="italic">≈ 0.999999 — надлишковість підіймає доступність</text>
<text x="470.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(за умови НЕЗАЛЕЖНИХ відмов копій)</text>
</svg>