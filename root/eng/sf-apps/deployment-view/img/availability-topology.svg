<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Топологія розгортання диктує доступність системи</text>
<text x="40.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Послідовно — на критичному шляху мусить жити КОЖНА ланка:</text>
<rect x="56.0" y="88.0" width="92.0" height="46.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="102.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="102.0" dy="0.0">сервіс 1</tspan></text>
<line x1="148.0" y1="111.0" x2="176.0" y2="111.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
