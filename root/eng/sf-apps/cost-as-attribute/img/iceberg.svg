<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна купівлі — верхівка; вартість живе під водою</text>
<line x1="60.0" y1="150.0" x2="940.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="7,5"/>
<text x="936.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-style="italic">видно при купівлі</text>
<text x="64.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">прихована вартість володіння</text>
<rect x="360.0" y="77.0" width="280.0" height="49.9" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">ціна купівлі / ліцензія</tspan><tspan x="500.0" dy="16.9">(те, що в рахунку)</tspan></text>
<rect x="97.5" y="241.5" width="175.0" height="33.0" rx="6" fill="#f7f7f7" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="262.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">ПОБУДУВАТИ</tspan></text>
<rect x="95.0" y="308.2" width="180.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">розробка, інтеграція,</tspan><tspan x="185.0" dy="15.6">міграція, навчання</tspan></text>
<rect x="327.5" y="241.5" width="175.0" height="33.0" rx="6" fill="#f7f7f7" stroke="#27ae60" stroke-width="1.5"/><text x="415.0" y="262.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">ЕКСПЛУАТУВАТИ</tspan></text>
<rect x="325.0" y="308.2" width="180.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">сервери, трафік,</tspan><tspan x="415.0" dy="15.6">чергування, підтримка</tspan></text>
<rect x="542.5" y="241.5" width="175.0" height="33.0" rx="6" fill="#f7f7f7" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="262.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">МІНЯТИ</tspan></text>
<rect x="540.0" y="308.2" width="180.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">правки, зчеплення,</tspan><tspan x="630.0" dy="15.6">технічний борг</tspan></text>
<rect x="747.5" y="241.5" width="175.0" height="33.0" rx="6" fill="#f7f7f7" stroke="#27ae60" stroke-width="1.5"/><text x="835.0" y="262.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="835.0" dy="0.0">ВИЙТИ</tspan></text>
<rect x="745.0" y="308.2" width="180.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">переписати, вивезти</tspan><tspan x="835.0" dy="15.6">дані, розірвати замок</tspan></text>
<text x="500.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">рішення порівнюють за сумою всіх чотирьох за весь строк життя, а не за верхівкою</text>
</svg>