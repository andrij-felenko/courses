<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вартість стає вимогою лише як сценарій із числом і порогом</text>
<rect x="35.0" y="125.0" width="230.0" height="49.9" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">турбота власника:</tspan><tspan x="150.0" dy="16.9">«щоб не розорило»</tspan></text>
<rect x="270.0" y="116.6" width="280.0" height="66.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">сценарій із числом:</tspan><tspan x="410.0" dy="16.9">≤ 0.002 $ на активного</tspan><tspan x="410.0" dy="16.9">користувача на місяць</tspan></text>
<line x1="265.0" y1="150.0" x2="270.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="605.0" y="80.2" width="230.0" height="47.6" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="720.0" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">поріг бюджету:</tspan><tspan x="720.0" dy="15.6">2000 $ / міс на 1 млн</tspan></text>
<rect x="605.0" y="178.2" width="230.0" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="198.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">прикидка: 1800 $ →</tspan><tspan x="720.0" dy="15.6">ВЛАЗИТЬ (запас ×1.1)</tspan></text>
<line x1="550.0" y1="150.0" x2="605.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550.0" y1="150.0" x2="605.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">без числа «дешево» не перевіриш і не автоматизуєш; з числом — його стереже машина, а не пам'ять</text>
</svg>