<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вартість — не окрема графа, а атрибут у спільному натягу</text>
<rect x="325.0" y="231.5" width="170.0" height="37.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="255.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">ВАРТІСТЬ</tspan></text>
<rect x="335.0" y="78.5" width="150.0" height="33.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">доступність</tspan></text>
<text x="410.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">резерв, репліки,  чергування 24/7</text>
<line x1="410.0" y1="95.0" x2="410.0" y2="250.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="605.0" y="233.5" width="150.0" height="33.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="680.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">продуктивність</tspan></text>
<text x="680.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">більше ядер,  кеш, ширший канал</text>
<line x1="680.0" y1="250.0" x2="410.0" y2="250.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="335.0" y="388.5" width="150.0" height="33.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="409.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">безпека</tspan></text>
<text x="410.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">шифрування, аудит,  ключі, перевірки</text>
<line x1="410.0" y1="405.0" x2="410.0" y2="250.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="65.0" y="233.5" width="150.0" height="33.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">змінюваність</tspan></text>
<text x="140.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">абстракції, шари,  точки розширення</text>
<line x1="140.0" y1="250.0" x2="410.0" y2="250.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="410.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кожен «покращ мене» тягне вартість угору — тому її ставлять у той самий натяг, що й решту</text>
</svg>