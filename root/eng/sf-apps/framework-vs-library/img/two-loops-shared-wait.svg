<text x="530.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">GLUT не вміє ні того, ні того — з ним лишаються способи 1 і 2.</text>
