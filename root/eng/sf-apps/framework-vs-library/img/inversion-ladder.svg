<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки саме керування віддано</text>
<text x="310.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Сходинка</text>
<text x="760.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Що вже не твоє</text>
<text x="52.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">глибше</text>
<line x1="52.0" y1="104.0" x2="52.0" y2="594.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="100.0" y="100.0" width="420.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="310.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Звичайний виклик</tspan><tspan x="310.0" dy="19.5">sort(v) — керування назад одразу</tspan></text>
<rect x="570.0" y="100.0" width="370.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="137.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">нічого</tspan></text>
<rect x="100.0" y="186.0" width="420.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="310.0" y="213.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Зворотний виклик</tspan><tspan x="310.0" dy="19.5">компаратор, таймер, обробник</tspan></text>
<rect x="570.0" y="186.0" width="370.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">мить одного виклику</tspan></text>
<rect x="100.0" y="272.0" width="420.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="310.0" y="299.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Гніздо для плагіна</tspan><tspan x="310.0" dy="19.5">ти даєш шматки, збирає їх чужий код</tspan></text>
<rect x="570.0" y="272.0" width="370.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="309.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">які шматки взагалі існують</tspan></text>
<rect x="100.0" y="358.0" width="420.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="310.0" y="385.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Шаблонний метод</tspan><tspan x="310.0" dy="19.5">кроки твої, послідовність — базового класу</tspan></text>
<rect x="570.0" y="358.0" width="370.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="395.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">порядок кроків операції</tspan></text>
<rect x="100.0" y="444.0" width="420.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="310.0" y="471.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Каркас із run()</tspan><tspan x="310.0" dy="19.5">точку входу пише він, ти — обробники</tspan></text>
<rect x="570.0" y="444.0" width="370.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="481.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">вхід у програму й життєвий цикл</tspan></text>
<rect x="100.0" y="530.0" width="420.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="310.0" y="557.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Платформа</tspan><tspan x="310.0" dy="19.5">serverless, мобільна ОС, браузер</tspan></text>
<rect x="570.0" y="530.0" width="370.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="567.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">сам процес і його розгортання</tspan></text>
</svg>