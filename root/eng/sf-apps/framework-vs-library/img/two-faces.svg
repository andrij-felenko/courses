<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="56.0" width="330.0" height="380.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="195.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Бібліотечне обличчя</text>
<rect x="50.0" y="100.0" width="290.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">1. зібрати pollfd:</tspan><tspan x="195.0" dy="16.9">свої fd + watches() ядра</tspan></text>
<line x1="195.0" y1="156.0" x2="195.0" y2="164.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="166.0" width="290.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="190.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">2. timeout — ближчий із двох:</tspan><tspan x="195.0" dy="16.9">свій дедлайн і next_deadline()</tspan></text>
<line x1="195.0" y1="222.0" x2="195.0" y2="230.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="232.0" width="290.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">3. poll(...) — чекаєш ТИ</tspan></text>
<line x1="195.0" y1="288.0" x2="195.0" y2="296.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="298.0" width="290.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">4. core.step(now, ready)</tspan></text>
<line x1="195.0" y1="354.0" x2="195.0" y2="362.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="364.0" width="290.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="396.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">5. take_event() → обробник</tspan></text>
<rect x="700.0" y="56.0" width="330.0" height="380.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="865.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Каркасне обличчя: run()</text>
<rect x="720.0" y="100.0" width="290.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">1. run() збирає pollfd</tspan><tspan x="865.0" dy="16.9">з watches() ядра</tspan></text>
<line x1="865.0" y1="156.0" x2="865.0" y2="164.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="720.0" y="166.0" width="290.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">2. timeout = next_deadline()</tspan></text>
<line x1="865.0" y1="222.0" x2="865.0" y2="230.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="720.0" y="232.0" width="290.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">3. poll(...) — чекає run()</tspan></text>
<line x1="865.0" y1="288.0" x2="865.0" y2="296.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="720.0" y="298.0" width="290.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">4. core.step(now, ready)</tspan></text>
<line x1="865.0" y1="354.0" x2="865.0" y2="362.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="720.0" y="364.0" width="290.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="388.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">5. take_event() → обробник,</tspan><tspan x="865.0" dy="16.9">який ти передав у run()</tspan></text>
<rect x="380.0" y="56.0" width="300.0" height="380.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.5"/>
<text x="530.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЯДРО — бібліотека</text>
<rect x="398.0" y="104.0" width="264.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="530.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">add(now, ціль, дані) → Id</tspan></text>
<rect x="398.0" y="144.0" width="264.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="530.0" y="165.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">step(now, ready)</tspan></text>
<rect x="398.0" y="184.0" width="264.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="530.0" y="205.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">next_deadline() → час?</tspan></text>
<rect x="398.0" y="224.0" width="264.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="530.0" y="245.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">watches() / generation()</tspan></text>
<rect x="398.0" y="264.0" width="264.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="530.0" y="285.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">take_event() → Event?</tspan></text>
<rect x="398.0" y="304.0" width="264.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="530.0" y="325.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">cancel(id)</tspan></text>
<text x="530.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">жодного циклу й sleep;</tspan><tspan x="530.0" dy="15.6">годинник приходить аргументом</tspan></text>
<line x1="195.0" y1="440.0" x2="195.0" y2="466.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="865.0" y1="440.0" x2="865.0" y2="466.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="195.0" y1="466.0" x2="865.0" y2="466.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="530.0" y1="466.0" x2="530.0" y2="440.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оболонку run() можна написати ЗЗОВНІ — самим лише публічним заголовком ядра.</text>
<text x="530.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Якщо не можна — бібліотечне обличчя неповне.</text>
</svg>