<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виворіт згортки: континуацію обертають на явний стан</text>
<line x1="530.0" y1="58.0" x2="530.0" y2="442.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="530.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">інверсія керування  +  defunctionalization</text>
<text x="270.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Внутрішня згортка (fold)</text>
<rect x="135.0" y="92.0" width="270.0" height="54.0" rx="6" fill="#f6faf6" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="115.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">колекція</tspan><tspan x="270.0" dy="16.9">[3, 1, 4]</tspan></text>
<line x1="270.0" y1="150.0" x2="270.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="288.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">сама рекурсує до кінця</text>
<rect x="135.0" y="200.0" width="270.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="228.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">f(3, f(1, f(4, z)))</tspan></text>
<line x1="270.0" y1="250.0" x2="270.0" y2="296.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="185.0" y="300.0" width="170.0" height="50.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">одне значення</tspan></text>
<rect x="120.0" y="384.0" width="300.0" height="48.0" rx="6" fill="#f6faf6" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="404.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">керує КОЛЕКЦІЯ</tspan><tspan x="270.0" dy="15.6">крок f неявний у рекурсії</tspan></text>
<text x="790.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Зовнішній ітератор</text>
<rect x="650.0" y="92.0" width="280.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="123.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">стан q = решта обходу</tspan></text>
<rect x="650.0" y="168.0" width="280.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">f(3, ▢)      ▢ = q</tspan></text>
<rect x="700.0" y="300.0" width="180.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="330.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">клієнт</tspan></text>
<line x1="790.0" y1="300.0" x2="790.0" y2="216.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="808.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">next() → 3</text>
<text x="808.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">q ↦ q′</text>
<rect x="645.0" y="384.0" width="290.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="405.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">керує КЛІЄНТ</tspan><tspan x="790.0" dy="11.7">«решту» згорнуто в дані (defunctionalization)</tspan></text>
<line x1="408.0" y1="223.0" x2="648.0" y2="191.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>