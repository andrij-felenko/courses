<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Згортка: заміна конструкторів і сходження до значення</text>
<text x="340.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">колекція як список (cons-цепочка)</text>
<rect x="175.0" y="84.0" width="58.0" height="48.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="204.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="204.0" dy="0.0">3</tspan></text>
<rect x="270.0" y="84.0" width="58.0" height="48.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="299.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="299.0" dy="0.0">1</tspan></text>
<rect x="365.0" y="84.0" width="58.0" height="48.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="394.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="394.0" dy="0.0">4</tspan></text>
<rect x="460.0" y="84.0" width="58.0" height="48.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="489.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="489.0" dy="0.0">[]</tspan></text>
<text x="249.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">:</text>
<text x="344.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">:</text>
<text x="439.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">:</text>
<line x1="340.0" y1="142.0" x2="340.0" y2="184.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="362.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">заміни конструктори:   (:) ↦ f,   [] ↦ z</text>
<rect x="175.0" y="190.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="218.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">f(3, f(1, f(4, z)))</tspan></text>
<line x1="340.0" y1="242.0" x2="340.0" y2="282.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="362.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">рахуємо зсередини (z) назовні</text>
<text x="340.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">з f = (+),  z = 0 :</text>
<text x="340.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">f(4, 0) = 4   →   f(1, 4) = 5   →   f(3, 5) = 8</text>
<rect x="280.0" y="350.0" width="120.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">8</tspan></text>
<text x="340.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">усю структуру згорнуто в одне значення</text>
<rect x="690.0" y="88.0" width="320.0" height="116.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">катаморфізм</tspan><tspan x="850.0" dy="16.2">(гр. kata — «вниз»  +  morphe — «форма»)</tspan><tspan x="850.0" dy="16.2">згортає структуру ВНИЗ</tspan><tspan x="850.0" dy="16.2">до одного значення</tspan></text>
<line x1="850.0" y1="214.0" x2="850.0" y2="300.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="690.0" y="306.0" width="320.0" height="96.0" rx="6" fill="#f6faf6" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="341.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">внутрішня ітерація</tspan><tspan x="850.0" dy="16.9">(reduce · forEach · map)</tspan><tspan x="850.0" dy="16.9">= згортка над колекцією</tspan></text>
</svg>