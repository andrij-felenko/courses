<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один крок next(): pop вершину, спуск лівим хребтом правого сина</text>
<text x="150.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">стек ДО кроку</text>
<rect x="105.0" y="150.0" width="90.0" height="48.0" rx="6" fill="#e7effe" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">4</tspan></text>
<text x="150.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вершина=4=наступний</text>
<line x1="212.0" y1="174.0" x2="362.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="374.0" y="92.0" width="296.0" height="172.0" rx="6" fill="#f6faf6" stroke="#27ae60" stroke-width="1.5"/><text x="522.0" y="141.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="522.0" dy="0.0">next() — один крок:</tspan><tspan x="522.0" dy="16.2">1) pop вершину 4  →  віддати «4»</tspan><tspan x="522.0" dy="16.2">2) pushLeft(праве[4]=6):</tspan><tspan x="522.0" dy="16.2">     штовхнути 6,</tspan><tspan x="522.0" dy="16.2">     тоді 5 (це 6.ліве),</tspan><tspan x="522.0" dy="16.2">     5.ліве порожнє → стоп</tspan></text>
<rect x="420.0" y="300.0" width="200.0" height="42.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="325.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">віддано ключ:  4</tspan></text>
<line x1="682.0" y1="174.0" x2="832.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="920.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">стек ПІСЛЯ</text>
<rect x="875.0" y="150.0" width="92.0" height="48.0" rx="6" fill="#e7effe" stroke="#2457d6" stroke-width="1.5"/><text x="921.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="921.0" dy="0.0">5 ← верш.</tspan></text>
<rect x="875.0" y="202.0" width="92.0" height="48.0" rx="6" fill="#e7effe" stroke="#2457d6" stroke-width="1.5"/><text x="921.0" y="231.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="921.0" dy="0.0">6</tspan></text>
<text x="920.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">наступний = 5</text>
</svg>