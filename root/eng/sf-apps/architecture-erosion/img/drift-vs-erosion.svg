<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві різні хвороби: дрейф і ерозія</text>
<rect x="50.0" y="58.0" width="330.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="215.0" y="86.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">ДРЕЙФ</tspan></text>
<rect x="50.0" y="116.0" width="330.0" height="150.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="215.0" y="161.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Правил ніхто не порушував —</tspan><tspan x="215.0" dy="16.9">їх просто перестали помічати.</tspan><tspan x="215.0" dy="16.9">Структура розмивається від</tspan><tspan x="215.0" dy="16.9">неуважності: рішення додають,</tspan><tspan x="215.0" dy="16.9">не звіряючись із задумом.</tspan></text>
<text x="215.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">причина: нечутливість до архітектури</text>
<rect x="420.0" y="58.0" width="330.0" height="46.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/><text x="585.0" y="86.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">ЕРОЗІЯ</tspan></text>
<rect x="420.0" y="116.0" width="330.0" height="150.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="585.0" y="161.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Правило знали — і свідомо</tspan><tspan x="585.0" dy="16.9">переступили заради швидкого</tspan><tspan x="585.0" dy="16.9">виграшу. Кожне порушення</tspan><tspan x="585.0" dy="16.9">лишає рубець, і наступне</tspan><tspan x="585.0" dy="16.9">переступити вже легше.</tspan></text>
<text x="585.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">причина: порушення архітектури</text>
</svg>