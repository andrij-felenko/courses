<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проєкція: діаграма — індукований підграф і підняті ребра</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">той самий зв'язок моделі виглядає по-різному на різних рівнях</text>
<rect x="130.0" y="99.0" width="200.0" height="58.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="230.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Замовлення</text><text x="230.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">компонент у API</text>
<rect x="485.0" y="99.0" width="150.0" height="58.0" rx="8" fill="#fef6e9" stroke="#8a6508" stroke-width="1.7"/><text x="560.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">База даних</text><text x="560.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">контейнер</text>
<line x1="332.0" y1="128.0" x2="483.0" y2="128.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="407.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">читає [SQL]</text>
<text x="230.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">рівень 3 — справжній зв'язок у моделі</text>
<line x1="395.0" y1="205.0" x2="395.0" y2="268.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">проєкція на рівень 2:</text>
<text x="410.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">кінець підняти до предка-контейнера</text>
<text x="410.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Замовлення  ⟹  API</text>
<rect x="130.0" y="301.0" width="200.0" height="58.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="230.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">API</text><text x="230.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">контейнер</text>
<rect x="485.0" y="301.0" width="150.0" height="58.0" rx="8" fill="#fef6e9" stroke="#8a6508" stroke-width="1.7"/><text x="560.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">База даних</text><text x="560.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">контейнер</text>
<line x1="332.0" y1="330.0" x2="483.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="407.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">читає [SQL]</text>
<text x="230.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">рівень 2 — той самий зв'язок, піднятий</text>
<rect x="667.0" y="142.7" width="210.0" height="184.7" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="772.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="772.0" dy="0.0">правило проєкції</tspan><tspan x="772.0" dy="13.7"></tspan><tspan x="772.0" dy="13.7">вершини: лишаємо ті,</tspan><tspan x="772.0" dy="13.7">що проходять предикат</tspan><tspan x="772.0" dy="13.7">(scope + рівень)</tspan><tspan x="772.0" dy="13.7"></tspan><tspan x="772.0" dy="13.7">ребро u→v лишається</tspan><tspan x="772.0" dy="13.7">тільки якщо обидва</tspan><tspan x="772.0" dy="13.7">кінці лишились</tspan><tspan x="772.0" dy="13.7"></tspan><tspan x="772.0" dy="13.7">глибший a→b підіймається</tspan><tspan x="772.0" dy="13.7">до предок(a) → предок(b)</tspan></text>
<text x="450.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожна діаграма читає той самий граф; ніщо не малюється двічі — тому в'ю не можуть суперечити одна одній.</text>
</svg>