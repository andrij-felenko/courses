<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджет читаності: чому межа — кільканадцять, а не з повітря</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">стежити доводиться зв'язки, а їх — до n·(n−1)/2; стеля сприйняття ріже саме їх</text>
<line x1="120.0" y1="410.0" x2="820.0" y2="410.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="120.0" y1="410.0" x2="120.0" y2="90.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="470.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кількість елементів на діаграмі  n</text>
<text x="28.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">скільки</text>
<text x="28.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">зв'язків</text>
<text x="28.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">стежити</text>
<line x1="120.0" y1="410.0" x2="120.0" y2="415.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="120.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0</text>
<line x1="236.7" y1="410.0" x2="236.7" y2="415.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="236.7" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4</text>
<line x1="353.3" y1="410.0" x2="353.3" y2="415.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="353.3" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">8</text>
<line x1="470.0" y1="410.0" x2="470.0" y2="415.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="470.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">12</text>
<line x1="586.7" y1="410.0" x2="586.7" y2="415.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="586.7" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">16</text>
<line x1="703.3" y1="410.0" x2="703.3" y2="415.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="703.3" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">20</text>
<line x1="820.0" y1="410.0" x2="820.0" y2="415.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="820.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">24</text>
<polyline points="120.0,410.0 149.2,410.0 178.3,408.9 207.5,406.6 236.7,403.1 265.8,398.6 295.0,392.9 324.2,386.0 353.3,378.0 382.5,368.9 411.7,358.6 440.8,347.1 470.0,334.6 499.2,320.9 528.3,306.0 557.5,290.0 586.7,272.9 615.8,254.6 645.0,235.1 674.2,214.6 703.3,192.9 732.5,170.0 761.7,146.0 790.8,120.9 820.0,94.6" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<text x="738.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">зв'язки ≈ n²/2</text>
<line x1="120.0" y1="410.0" x2="820.0" y2="382.6" stroke="#2457d6" stroke-width="2.0"/>
<text x="816.0" y="370.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end">елементи ~ n</text>
<line x1="120.0" y1="334.6" x2="820.0" y2="334.6" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="816.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">стеля сприйняття</text>
<line x1="470.0" y1="410.0" x2="470.0" y2="334.6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="470.0" cy="334.6" r="4.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<text x="478.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">n* ≈ 12</text>
<rect x="195.0" y="111.5" width="250.0" height="87.1" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="320.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">стеля стоїть на зв'язках,</tspan><tspan x="320.0" dy="13.7">а зв'язків ≈ n²/2, тому</tspan><tspan x="320.0" dy="13.7">бюджет елементів n* ≈ √(2·стеля)</tspan><tspan x="320.0" dy="13.7">— корінь із малого числа,</tspan><tspan x="320.0" dy="13.7">звідси «кільканадцять»</tspan></text>
<text x="450.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа не з повітря: подвоїш елементи — учетверо більше зв'язків стежити; корінь зі стелі й дає десятки, не сотні.</text>
</svg>