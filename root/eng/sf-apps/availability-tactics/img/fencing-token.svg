<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Огорожа токеном: як гасять розкол мозку на боці сховища</text>
<rect x="50.0" y="100.5" width="250.0" height="69.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="175.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Вузол A (завис і ожив)</tspan><tspan x="175.0" dy="16.2">думає: я головний</tspan><tspan x="175.0" dy="16.2">токен = 33 (старий)</tspan></text>
<rect x="50.0" y="265.5" width="250.0" height="69.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.2"/><text x="175.0" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Вузол B (підняли)</tspan><tspan x="175.0" dy="16.2">думає: я головний</tspan><tspan x="175.0" dy="16.2">токен = 34 (новий)</tspan></text>
<rect x="685.0" y="179.6" width="230.0" height="74.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.4"/><text x="800.0" y="204.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">СХОВИЩЕ</tspan><tspan x="800.0" dy="16.9">пам'ятає найбільший</tspan><tspan x="800.0" dy="16.9">бачений токен = 34</tspan></text>
<line x1="304.0" y1="150.0" x2="677.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="304.0" y1="300.0" x2="677.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="427.8" y="86.8" width="144.3" height="42.5" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="104.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">запис токеном 33</tspan><tspan x="500.0" dy="15.0">ВІДКИНУТО (менший)</tspan></text>
<rect x="402.1" y="318.8" width="165.7" height="42.5" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="485.0" y="336.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="485.0" dy="0.0">запис токеном 34</tspan><tspan x="485.0" dy="15.0">ПРИЙНЯТО (найбільший)</tspan></text>
<rect x="252.1" y="388.4" width="475.7" height="43.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="490.0" y="406.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">Огорожа (fencing) не заважає двом вважати себе головними —</tspan><tspan x="490.0" dy="14.3">вона робить це БЕЗПЕЧНИМ: воротар пропускає лише монотонно старший токен.</tspan></text>
</svg>