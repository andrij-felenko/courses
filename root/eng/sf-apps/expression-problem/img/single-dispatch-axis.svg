<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільний контракт перелічує одну вісь — саме її й закриває</text>
<line x1="490.0" y1="56.0" x2="490.0" y2="428.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<text x="245.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Об'єктний стиль — x.op()</text>
<text x="245.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">інтерфейс фіксує операції</text>
<rect x="65.0" y="118.0" width="360.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="245.0" y="137.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">interface Shape</tspan><tspan x="245.0" dy="16.2">{ area(); perimeter(); }</tspan></text>
<text x="245.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">перелічує ОПЕРАЦІЇ → вісь закрита</text>
<rect x="52.0" y="252.0" width="118.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="111.0" y="278.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="111.0" dy="0.0">Circle</tspan></text>
<rect x="186.0" y="252.0" width="118.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="245.0" y="278.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Rect</tspan></text>
<rect x="320.0" y="252.0" width="118.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="379.0" y="278.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="379.0" dy="0.0">+ новий тип</tspan></text>
<circle cx="432.0" cy="252.0" r="10.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="432.0" y="256.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="245.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">новий тип = новий клас,</text>
<text x="245.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">контракт недоторканий → відкрито</text>
<text x="735.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процедурний стиль — op(x)</text>
<text x="735.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">сума типів фіксує випадки</text>
<rect x="555.0" y="118.0" width="360.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="735.0" y="137.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">enum Kind</tspan><tspan x="735.0" dy="16.2">{ Circle, Rect }</tspan></text>
<text x="735.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">перелічує ТИПИ → вісь закрита</text>
<rect x="542.0" y="252.0" width="118.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="601.0" y="278.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="601.0" dy="0.0">area()</tspan></text>
<rect x="676.0" y="252.0" width="118.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="735.0" y="278.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">perimeter()</tspan></text>
<rect x="810.0" y="252.0" width="118.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="869.0" y="278.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="869.0" dy="0.0">+ нова оп.</tspan></text>
<circle cx="922.0" cy="252.0" r="10.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="922.0" y="256.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="735.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">нова операція = нова функція,</text>
<text x="735.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">контракт недоторканий → відкрито</text>
<text x="490.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Одна вісь мусить лягти у спільний контракт — саме вона й закрита.</text>
<text x="490.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Базова (одинарна) диспетчеризація тримає відкритою рівно одну вісь.</text>
</svg>