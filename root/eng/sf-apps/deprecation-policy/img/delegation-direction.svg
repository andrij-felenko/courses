<rect x="218.2" y="145.0" width="363.7" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="162.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a02419" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">валюти нізвідки взяти — новий формат скалічений</tspan></text>
<line x1="50.0" y1="214.0" x2="750.0" y2="214.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="400.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e7a44" text-anchor="middle" font-weight="700">Правильно: старий кличе нового</text>
<rect x="46.7" y="277.2" width="196.6" height="45.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="145.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a44" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">v2 (новий)</tspan><tspan x="145.0" dy="15.6">повний {value, currency}</tspan></text>
<rect x="567.0" y="277.2" width="176.0" height="45.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a44" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">v1 (старий)</tspan><tspan x="655.0" dy="15.6">тонка обгортка</tspan></text>
<line x1="561.0" y1="300.0" x2="239.0" y2="300.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="333.6" y="272.5" width="132.8" height="21.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="286.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e7a44" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">кличе, щоб звузити</tspan></text>
<rect x="188.4" y="345.0" width="423.2" height="26.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="362.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a44" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">валюту відкидаємо — стара відповідь = точний зріз нової</tspan></text>
</svg>