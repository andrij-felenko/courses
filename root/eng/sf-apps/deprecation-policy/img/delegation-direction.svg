<rect x="567.0" y="77.2" width="176.0" height="45.6" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/><text x="655.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">v1 (старий)</tspan><tspan x="655.0" dy="15.6">має лише ціле amount</tspan></text>
<line x1="239.0" y1="100.0" x2="561.0" y2="100.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
