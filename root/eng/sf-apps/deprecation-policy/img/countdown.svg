<rect x="107.4" y="327.0" width="665.3" height="30.0" rx="6" fill="#fdf3e7" stroke="#c98a2b" stroke-width="1.5"/><text x="440.0" y="346.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">сама дата — рядок, що легко забути; годинник тисне не на код, а на людину, що вагається</tspan></text>
