<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від спостереження Конвея (1968) до оберненого маневру (2010)</text>
<line x1="70.0" y1="150.0" x2="890.0" y2="150.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="888.0" y1="150.0" x2="910.0" y2="150.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="912.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">час</text>
<circle cx="152.0" cy="150.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="127.9" y="81.5" width="48.2" height="29.0" rx="6" fill="#eef1f5" stroke="#2457d6" stroke-width="1.4"/><text x="152.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">1968</tspan></text>
<line x1="152.0" y1="110.5" x2="152.0" y2="142.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="152.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Конвей публікує</text>
<text x="152.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="152.0" dy="0.0">«How Do Committees</tspan><tspan x="152.0" dy="12.5">Invent?» у Datamation —</tspan><tspan x="152.0" dy="12.5">саме спостереження</tspan></text>
<circle cx="316.0" cy="150.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<rect x="291.9" y="81.5" width="48.2" height="29.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.4"/><text x="316.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="316.0" dy="0.0">1968</tspan></text>
<line x1="316.0" y1="110.5" x2="316.0" y2="142.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="316.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Мілі дає назву</text>
<text x="316.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="316.0" dy="0.0">на симпозіумі з модульного</tspan><tspan x="316.0" dy="12.5">програмування Джордж Мілі</tspan><tspan x="316.0" dy="12.5">називає це «законом Конвея»</tspan></text>
<circle cx="480.0" cy="150.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<rect x="455.9" y="81.5" width="48.2" height="29.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.4"/><text x="480.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">1975</tspan></text>
<line x1="480.0" y1="110.5" x2="480.0" y2="142.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="480.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Брукс поширює</text>
<text x="480.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">«Mythical Man-Month»</tspan><tspan x="480.0" dy="12.5">робить назву відомою</tspan><tspan x="480.0" dy="12.5">усій індустрії</tspan></text>
<circle cx="644.0" cy="150.0" r="8.0" fill="#f3edfb" stroke="#7a4ea8" stroke-width="2.4"/>
<rect x="619.9" y="81.5" width="48.2" height="29.0" rx="6" fill="#f3edfb" stroke="#7a4ea8" stroke-width="2.0"/><text x="644.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4ea8" text-anchor="middle" font-weight="700"><tspan x="644.0" dy="0.0">2010</tspan></text>
<line x1="644.0" y1="110.5" x2="644.0" y2="142.0" stroke="#7a4ea8" stroke-width="1.4"/>
<text x="644.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4ea8" text-anchor="middle" font-weight="700">інверсія</text>
<text x="644.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="644.0" dy="0.0">ЛеРой і Саймонс:</tspan><tspan x="644.0" dy="12.5">не терпи закон —</tspan><tspan x="644.0" dy="12.5">оберни його у важіль</tspan></text>
<circle cx="808.0" cy="150.0" r="6.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="783.9" y="81.5" width="48.2" height="29.0" rx="6" fill="#eef1f5" stroke="#27ae60" stroke-width="1.4"/><text x="808.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="808.0" dy="0.0">2019</tspan></text>
<line x1="808.0" y1="110.5" x2="808.0" y2="142.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="808.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Team Topologies</text>
<text x="808.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="808.0" dy="0.0">Скелтон і Паїш —</tspan><tspan x="808.0" dy="12.5">ціла книга-інструкція</tspan><tspan x="808.0" dy="12.5">з оберненого маневру</tspan></text>
<line x1="480.0" y1="46.0" x2="644.0" y2="46.0" stroke="#7a4ea8" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="480.0" y1="46.0" x2="480.0" y2="76.0" stroke="#7a4ea8" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="644.0" y1="46.0" x2="644.0" y2="76.0" stroke="#7a4ea8" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="562.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a4ea8" text-anchor="middle" font-weight="700">≈ 35 років спостереження терпіли як прокляття</text>
<rect x="166.8" y="419.8" width="626.5" height="32.5" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="480.0" y="439.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">спершу — діагноз (система копіює організацію),  аж потім — рецепт (спроєктуй організацію під систему)</tspan></text>
</svg>