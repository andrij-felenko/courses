<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="258.2" y="58.8" width="383.6" height="38.5" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="450.0" y="83.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">клієнт main.c — той самий для всіх трьох</tspan></text>
<text x="450.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">бачить лише заголовок; тримає Stack*, не будову</text>
<line x1="450.0" y1="132.0" x2="450.0" y2="168.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="66.0" y="176.0" width="768.0" height="96.0" rx="9" fill="#f0fbf3" stroke="#27ae60" stroke-width="2.5"/>
<text x="450.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">stack.h — обіцянка, НЕ міняється ні на символ</text>
<text x="450.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">stack_new   stack_push   stack_pop   stack_size   stack_free</text>
<text x="450.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">typedef struct Stack Stack;   (тип є, будова прихована)</text>
<line x1="191.0" y1="274.0" x2="191.0" y2="356.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="66.0" y="360.0" width="250.0" height="150.0" rx="9" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="191.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">#1  масив 64</text>
<text x="191.0" y="408.0" font-family="monospace" font-size="11" fill="#1a1a1a" text-anchor="middle">struct { int data[64];</text>
<text x="191.0" y="428.0" font-family="monospace" font-size="11" fill="#1a1a1a" text-anchor="middle">         size_t top; }</text>
<text x="191.0" y="468.0" font-family="monospace" font-size="11" fill="#6b7280" text-anchor="middle">стеля 64 елементи</text>
<text x="191.0" y="488.0" font-family="monospace" font-size="11" fill="#6b7280" text-anchor="middle">один malloc / один free</text>
<line x1="450.0" y1="274.0" x2="450.0" y2="356.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="325.0" y="360.0" width="250.0" height="150.0" rx="9" fill="#f4f6f8" stroke="#b8860b" stroke-width="2.0"/>
<text x="450.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">#2  динамічний масив</text>
<text x="450.0" y="408.0" font-family="monospace" font-size="11" fill="#1a1a1a" text-anchor="middle">struct { int *data;</text>
<text x="450.0" y="428.0" font-family="monospace" font-size="11" fill="#1a1a1a" text-anchor="middle">         size_t len, cap; }</text>
<text x="450.0" y="468.0" font-family="monospace" font-size="11" fill="#6b7280" text-anchor="middle">росте вдвічі, без стелі</text>
<text x="450.0" y="488.0" font-family="monospace" font-size="11" fill="#6b7280" text-anchor="middle">перевірка переповнення</text>
<line x1="709.0" y1="274.0" x2="709.0" y2="356.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="584.0" y="360.0" width="250.0" height="150.0" rx="9" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="709.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">#3  потокобезпечний</text>
<text x="709.0" y="408.0" font-family="monospace" font-size="11" fill="#1a1a1a" text-anchor="middle">struct { int data[64];</text>
<text x="709.0" y="428.0" font-family="monospace" font-size="11" fill="#1a1a1a" text-anchor="middle">         size_t top;</text>
<text x="709.0" y="448.0" font-family="monospace" font-size="11" fill="#1a1a1a" text-anchor="middle">         mtx_t lock; }</text>
<text x="709.0" y="488.0" font-family="monospace" font-size="11" fill="#6b7280" text-anchor="middle">замок на push / pop</text>
<text x="450.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">змінюється ЛИШЕ цей рівень — клієнт і заголовок ні</text>
</svg>