<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один розріз — на кожному масштабі</text>
<rect x="50.0" y="80.0" width="840.0" height="520.0" rx="12" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2"/>
<rect x="120.0" y="180.0" width="700.0" height="380.0" rx="12" fill="#f2faf5" stroke="#27ae60" stroke-width="2.2"/>
<rect x="200.0" y="280.0" width="540.0" height="220.0" rx="12" fill="#fff5e6" stroke="#b8860b" stroke-width="2.2"/>
<rect x="290.0" y="370.0" width="360.0" height="100.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="470.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Служба / обмежений контекст</text>
<text x="470.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">одна служба — одна зона зміни й розгортання</text>
<text x="470.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Компонент / пакет — CCP</text>
<text x="470.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">класи, що міняються разом і в той самий час</text>
<text x="470.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">Клас — SRP</text>
<text x="470.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">один клас — один актор</text>
<text x="470.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Функція</text>
<text x="470.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рахує АБО друкує — не те й те разом</text>
<text x="470.0" y="626.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Та сама вісь «одна причина для зміни» — змінюється лише розмір коробки.</text>
</svg>