<text x="236.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="236.0" dy="0.0">стаття «There's more to menu systems</tspan><tspan x="236.0" dy="14.7">than meets the screen» — перша згадка</tspan><tspan x="236.0" dy="14.7">команди-об'єкта; про undo — побіжно</tspan></text>
