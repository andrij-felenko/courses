<text x="236.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="236.0" dy="0.0">«Object-Oriented Software Construction»,</tspan><tspan x="236.0" dy="14.7">§12.2 — перша РЕАЛІЗАЦІЯ undo/redo:</tspan><tspan x="236.0" dy="14.7">класи-команди execute/undo + історія</tspan></text>
