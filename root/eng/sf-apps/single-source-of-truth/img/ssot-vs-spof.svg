<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логічне єдине джерело (SSOT) не є фізичною єдиною точкою відмови (SPOF)</text>
<rect x="50.0" y="70.0" width="420.0" height="390.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="260.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Фізичний SPOF (небезпечна наївність)</text>
<rect x="140.0" y="165.1" width="240.0" height="49.9" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="260.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Один фізичний сервер</tspan><tspan x="260.0" dy="16.9">або єдиний диск БД</tspan></text>
<line x1="260.0" y1="235.0" x2="260.0" y2="285.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="270.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">аварія / збій живлення</text>
<rect x="110.0" y="296.1" width="300.0" height="87.7" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="260.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Повна зупинка всієї системи</tspan><tspan x="260.0" dy="16.9">• Немає куди писати</tspan><tspan x="260.0" dy="16.9">• Немає звідки читати</tspan><tspan x="260.0" dy="16.9">• Ризик втрати даних</tspan></text>
<text x="260.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">SSOT сплутано з відсутністю резервування</text>
<rect x="530.0" y="70.0" width="420.0" height="390.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="740.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Логічний SSOT + Фізична відмовостійкість</text>
<rect x="580.0" y="165.1" width="320.0" height="49.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="740.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Кластер консенсусу (Raft / Paxos)</tspan><tspan x="740.0" dy="16.9">Лідер приймає авторитетний запис</tspan></text>
<line x1="740.0" y1="235.0" x2="740.0" y2="285.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="750.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">синхронна/кворумна реплікація</text>
<rect x="580.0" y="296.1" width="320.0" height="87.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="740.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Високодоступний логічний SSOT</tspan><tspan x="740.0" dy="16.9">• Кворум із 3–5 вузлів</tspan><tspan x="740.0" dy="16.9">• Автоматичні перевибори лідера</tspan><tspan x="740.0" dy="16.9">• Кеші та репліки для читання</tspan></text>
<text x="740.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Одне авторитетне правило, багато надійних копій</text>
<text x="500.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">SSOT визначає авторитетність рішення, а не кількість фізичних машин</text>
</svg>