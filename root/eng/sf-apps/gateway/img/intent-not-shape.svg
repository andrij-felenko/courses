<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Однакова механіка — різний намір: що саме обгортка обіцяє</text>
<rect x="35.0" y="80.0" width="240.0" height="250.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="155.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Адаптер</text>
<rect x="55.0" y="142.3" width="200.0" height="45.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">чужий інтерфейс →</tspan><tspan x="155.0" dy="14.3">потрібна тобі форма</tspan></text>
<rect x="55.0" y="237.3" width="200.0" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="155.0" dy="0.0">намір: підігнати</tspan><tspan x="155.0" dy="14.3">невідповідні роз'єми</tspan></text>
<rect x="335.0" y="80.0" width="240.0" height="250.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="455.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Фасад</text>
<rect x="355.0" y="142.3" width="200.0" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="455.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">плутане нутро →</tspan><tspan x="455.0" dy="14.3">одні прості двері</tspan></text>
<rect x="355.0" y="237.3" width="200.0" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="455.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="455.0" dy="0.0">намір: сховати</tspan><tspan x="455.0" dy="14.3">складність підсистеми</tspan></text>
<rect x="635.0" y="80.0" width="240.0" height="250.0" rx="10" fill="#fff7e6" stroke="#d68910" stroke-width="2.0"/>
<text x="755.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#d68910" text-anchor="middle" font-weight="700">Шлюз</text>
<rect x="655.0" y="142.3" width="200.0" height="45.3" rx="6" fill="#ffffff" stroke="#d68910" stroke-width="1.5"/><text x="755.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">доступ до ЗОВНІШНЬОГО →</tspan><tspan x="755.0" dy="14.3">метод у мові домену</tspan></text>
<rect x="655.0" y="237.3" width="200.0" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="755.0" dy="0.0">намір: стерегти межу</tspan><tspan x="755.0" dy="14.3">із чужою системою</tspan></text>
<text x="450.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">код може виглядати однаково — назвою ти кажеш читачеві, ЧОМУ ця обгортка існує</text>
</svg>