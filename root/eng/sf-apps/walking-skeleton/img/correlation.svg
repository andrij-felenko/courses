<line x1="60.0" y1="340.0" x2="840.0" y2="340.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="450.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шанс лежить у вилці:   (1−q)^m  (усе незалежно, m = 16)   ≤   P   ≤   (1−q)  (усе спільне, одне рішення)</text>
<text x="450.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Два стики з кореляцією ρ:   P(обидва чисті) = p² + ρ·p(1−p) ≥ p²   —   додатна кореляція завжди піднімає шанс над добутком</text>
<text x="450.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Менше НЕЗАЛЕЖНИХ рішень на стиках — вищий шанс зібратися; тому одна схема на всю систему математично безпечніша</text>
