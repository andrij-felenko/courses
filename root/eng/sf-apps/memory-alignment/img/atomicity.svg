<text x="152.0" y="174.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#c0392b" text-anchor="middle" font-weight="700">uint32</text>
<text x="152.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">одна комірка</text>
<text x="264.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">сусідня</text>
<rect x="80.0" y="226.0" width="340.0" height="66.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="250.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">оновлення = 1 неподільна операція</text>
<text x="250.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">читач бачить або старе, або нове —</text>
<text x="250.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ніколи проміжне</text>
<text x="250.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Можна безпечно ділити між</text>
<text x="250.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">перериванням і кодом, між ядрами</text>
<rect x="460.0" y="84.0" width="380.0" height="300.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="650.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">✗ Невирівняне — розірване</text>
