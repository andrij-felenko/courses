<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атомарність тримається на вирівнюванні</text>
<rect x="60.0" y="84.0" width="380.0" height="300.0" rx="12" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="250.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">✓ Вирівняне — атомарне</text>
