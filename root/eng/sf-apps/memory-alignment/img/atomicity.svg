<rect x="608.0" y="150.0" width="112.0" height="36.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<rect x="552.0" y="150.0" width="112.0" height="36.0" rx="4" fill="#f7c9c0" stroke="#c0392b" stroke-width="2.2"/>
<text x="608.0" y="186.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#c0392b" text-anchor="middle" font-weight="700">uint32</text>
<line x1="496.0" y1="198.0" x2="608.0" y2="198.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="552.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">запис 1</text>
<line x1="608.0" y1="198.0" x2="720.0" y2="198.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="664.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">запис 2</text>
<rect x="480.0" y="250.0" width="340.0" height="76.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="650.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">запис = 2 операції; між ними</text>
<text x="650.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">встромляється інший виконавець →</text>
<text x="650.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">бачить половину нову, половину стару</text>
<text x="650.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">розірваний доступ (torn read/write)</text>
<rect x="60.0" y="400.0" width="780.0" height="52.0" rx="10" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/>
<text x="450.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ділиш змінну між виконавцями (переривання, ядра) — тримай її ВИРІВНЯНОЮ, інакше атомарність зникає.</text>
<text x="450.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Деякі ARMv7 навіть вирівняний 64-бітний доступ роблять двома 32-бітними записами — не покладайся наосліп.</text>
