<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два стилі організації ділової логіки — і тонка межа над кожним</text>
<rect x="70.0" y="78.0" width="800.0" height="66.0" rx="10" fill="#fff7e6" stroke="#d68910" stroke-width="2.0"/>
<text x="470.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b9770e" text-anchor="middle" font-weight="700">Сервісний шар — той самий перелік операцій над будь-яким стилем</text>
<text x="470.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle">placeOrder() · cancelSubscription() · recognizeRevenue()</text>
<line x1="300.0" y1="148.0" x2="260.0" y2="214.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="640.0" y1="148.0" x2="690.0" y2="214.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="220.0" width="320.0" height="200.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="250.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транзакційний сценарій</text>
<text x="250.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(Transaction Script)</text>
<text x="250.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">одна процедура на операцію,</text>
<text x="250.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">лінійно згори вниз</text>
<text x="250.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">просто, доки правил мало;</text>
<text x="250.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">плутається, коли правила</text>
<text x="250.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">множаться й міняються</text>
<rect x="530.0" y="220.0" width="320.0" height="200.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="690.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель домену</text>
<text x="690.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(Domain Model)</text>
<text x="690.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">мережа обʼєктів із поведінкою,</text>
<text x="690.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">правила поруч із даними</text>
<text x="690.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тримає складні, мінливі</text>
<text x="690.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">правила; дорожчий на старті,</text>
<text x="690.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">окупається на обсязі</text>
</svg>