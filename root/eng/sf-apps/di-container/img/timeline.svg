<text x="440.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">січень 2004</text>
<rect x="310.0" y="65.6" width="260.0" height="72.8" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.0"/><text x="440.0" y="89.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Мартін Фаулер</tspan><tspan x="440.0" dy="16.9">«dependency injection»</tspan><tspan x="440.0" dy="16.9">(вужче за IoC)</tspan></text>
