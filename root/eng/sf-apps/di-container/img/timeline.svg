<rect x="700.0" y="65.6" width="260.0" height="72.8" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.0"/><text x="830.0" y="89.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Марк Симан</tspan><tspan x="830.0" dy="16.9">«composition root»</tspan><tspan x="830.0" dy="16.9">(єдине місце на краю)</tspan></text>
