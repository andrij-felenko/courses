<circle cx="830.0" cy="260.0" r="8.0" fill="#c0392b" stroke="#8a2820" stroke-width="2.0"/>
<rect x="85.0" y="316.4" width="210.0" height="67.2" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="190.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="190.0" dy="0.0">кін. 1990-х – поч. 2000-х</tspan><tspan x="190.0" dy="15.6">усе — «інверсія</tspan><tspan x="190.0" dy="15.6">керування (IoC)»</tspan></text>
