<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Додати нову службу: два способи</text>
<text x="520.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що доведеться чіпнути з наявного</text>
<text x="260.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">switch</text>
<rect x="90.0" y="118.0" width="340.0" height="300.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="260.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">shippingCost() {</tspan><tspan x="260.0" dy="16.5">  switch (carrier) {</tspan><tspan x="260.0" dy="16.5">    case flat:      …</tspan><tspan x="260.0" dy="16.5">    case zonal:     …</tspan><tspan x="260.0" dy="16.5">    case free_over: …</tspan><tspan x="260.0" dy="16.5">    case courier:   …</tspan><tspan x="260.0" dy="16.5">    case postal:    …  ← новий</tspan><tspan x="260.0" dy="16.5">  }</tspan><tspan x="260.0" dy="16.5">}</tspan></text>
<text x="260.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">відкрити й перечитати ВЕСЬ метод</text>
<text x="260.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ризик зачепити сусідні гілки</text>
<text x="748.8" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">стратегія + мапа</text>
<rect x="578.8" y="130.4" width="340.0" height="63.2" rx="6" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.4"/><text x="748.8" y="150.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="748.8" dy="0.0">FlatRate · ZonalRate</tspan><tspan x="748.8" dy="15.6">FreeOverThreshold · CourierRate</tspan><tspan x="748.8" dy="15.6">shippingCost(): table[carrier].cost()</tspan></text>
<text x="748.8" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">наявне — НЕ чіпаємо</text>
<rect x="580.8" y="244.2" width="180.0" height="47.6" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="670.8" y="264.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.8" dy="0.0">class PostalRate</tspan><tspan x="670.8" dy="15.6">→ cost(s)</tspan></text>
<rect x="751.8" y="244.2" width="210.0" height="47.6" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="856.8" y="264.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="856.8" dy="0.0">мапа: postal →</tspan><tspan x="856.8" dy="15.6">new PostalRate()</tspan></text>
<text x="748.8" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">нове — клас збоку + один рядок</text>
<text x="748.8" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">наявне лишилось недоторканим</text>
<line x1="40.0" y1="536.0" x2="1000.0" y2="536.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="520.0" y="560.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">те саме додавання: хірургія в наявному  проти  дописування збоку</text>
</svg>