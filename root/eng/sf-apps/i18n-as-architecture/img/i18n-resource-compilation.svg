<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компіляція ресурсів інтернаціоналізації для Flash</text>
<text x="140.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідні текстові джерела</text>
<rect x="20.0" y="60.0" width="240.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Каталоги перекладів</tspan><tspan x="140.0" dy="15.6">(.po / .json / ICU .txt)</tspan><tspan x="140.0" dy="15.6">msgid / msgstr · контексти</tspan></text>
<rect x="20.0" y="154.0" width="240.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="181.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Дані локалей CLDR</tspan><tspan x="140.0" dy="15.6">(XML / JSON cldr-core)</tspan><tspan x="140.0" dy="15.6">правила множини · формати</tspan></text>
<rect x="20.0" y="248.0" width="240.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="275.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Конфігурація збірки</tspan><tspan x="140.0" dy="15.6">(список цільових мов,</tspan><tspan x="140.0" dy="15.6">обмеження Flash / RAM)</tspan></text>
<rect x="310.0" y="60.0" width="290.0" height="266.0" rx="6" fill="#fff7e6" stroke="#27ae60" stroke-width="2.0"/>
<text x="455.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Офлайн-пакувальник ресурсів</text>
<text x="455.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(i18n-compiler / msgfmt)</text>
<rect x="322.0" y="124.0" width="266.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="455.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">1. Перевірка плейсхолдерів {0}, {name}</tspan></text>
<rect x="322.0" y="162.0" width="266.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="455.0" y="181.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">2. Хешування ключів (MurmurHash3 / FNV-1a)</tspan></text>
<rect x="322.0" y="200.0" width="266.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="455.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">3. Компіляція множин у байткод VM</tspan></text>
<rect x="322.0" y="238.0" width="266.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="455.0" y="257.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">4. Дедуплікація однакових рядків UTF-8</tspan></text>
<rect x="322.0" y="276.0" width="266.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="455.0" y="295.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">5. Вирівнювання адрес під 4-байтне XIP</tspan></text>
<line x1="260.0" y1="99.0" x2="310.0" y2="99.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="260.0" y1="193.0" x2="310.0" y2="193.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="260.0" y1="287.0" x2="310.0" y2="287.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="650.0" y="60.0" width="290.0" height="266.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="795.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійковий образ у Flash (.bin / .mo)</text>
<rect x="662.0" y="104.0" width="266.0" height="36.0" rx="6" fill="#eafaf1" stroke="#2457d6" stroke-width="1.2"/><text x="795.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Заголовок (Magic: 0x4931384E, версія, зміщення)</tspan></text>
<rect x="662.0" y="146.0" width="266.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="795.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Таблиця локалей (ID, прапорці, оффсети множин)</tspan></text>
<rect x="662.0" y="188.0" width="266.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="795.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Хеш-індекс ключів (відсортовані хеші → оффсети)</tspan></text>
<rect x="662.0" y="230.0" width="266.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="795.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Пул байткоду правил множини (CLDR bytecode)</tspan></text>
<rect x="662.0" y="272.0" width="266.0" height="36.0" rx="6" fill="#eafaf1" stroke="#2457d6" stroke-width="1.2"/><text x="795.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Пул рядків UTF-8 (вирівняні null-terminated)</tspan></text>
<line x1="600.0" y1="193.0" x2="650.0" y2="193.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="20.0" y="360.0" width="920.0" height="85.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/>
<text x="44.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Виконання у вбудованій системі (XIP / Zero-RAM Copy)</text>
<text x="44.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="44.0" dy="0.0">• Образ відображається безпосередньо в адресний простір мікроконтролера (Memory Mapped Flash / ROM).</tspan><tspan x="44.0" dy="15.4">• Пошук рядка за хешем виконується бінарним пошуком O(log N) прямо у Flash без виділення купи (heap: 0 B).</tspan><tspan x="44.0" dy="15.4">• Форматувальник підставляє аргументи у статичний буфер на стеку — нуль динамічних алокацій.</tspan></text>
<line x1="795.0" y1="326.0" x2="795.0" y2="360.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>