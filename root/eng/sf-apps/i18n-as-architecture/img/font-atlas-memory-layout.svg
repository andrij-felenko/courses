<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкладка шрифтового атласу та метрик у Flash</text>
<rect x="20.0" y="40.0" width="440.0" height="390.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="240.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шрифтовий ресурс у Flash пам'яті (ROM)</text>
<rect x="32.0" y="84.0" width="416.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="240.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Заголовок шрифту (Font Header)</tspan><tspan x="240.0" dy="14.3">Magic · Ascent · Descent · LineGap · BPP (1/2/4/8) · GlyphCount</tspan></text>
<rect x="32.0" y="144.0" width="416.0" height="56.0" rx="6" fill="#eafaf1" stroke="#333333" stroke-width="1.2"/><text x="240.0" y="168.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Таблиця індексу кодових точок (Codepoint Map)</tspan><tspan x="240.0" dy="14.3">Unicode Range / Sorted Codepoint Array → Glyph Index</tspan></text>
<rect x="32.0" y="208.0" width="416.0" height="70.0" rx="6" fill="#fff7e6" stroke="#333333" stroke-width="1.2"/><text x="240.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Таблиця дескрипторів гліфів (Glyph Metrics Table)</tspan><tspan x="240.0" dy="13.0">struct { uint8_t w, h; int8_t off_x, off_y, adv_x; uint32_t bmp_off; }</tspan><tspan x="240.0" dy="13.0">Зсуви, розміри бітмапу та крок курсора (Advance X)</tspan></text>
<rect x="32.0" y="286.0" width="416.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="240.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Таблиця парного кернінгу (Kerning Pairs Table)</tspan><tspan x="240.0" dy="14.3">struct { uint16_t left, right; int8_t adjust_x; }</tspan><tspan x="240.0" dy="14.3">Опціональні поправки між парами символів (напр. 'AV', 'To')</tspan></text>
<rect x="32.0" y="364.0" width="416.0" height="54.0" rx="6" fill="#eafaf1" stroke="#333333" stroke-width="1.2"/><text x="240.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Пул растрових бітмапів / SDF атлас (Bitmap Stream)</tspan><tspan x="240.0" dy="13.0">Щільно упаковані біти 1-bpp (монохром) або 4/8-bpp (згладжування)</tspan></text>
<rect x="500.0" y="40.0" width="440.0" height="390.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="720.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія гліфа та відмалювання в Display RAM</text>
<rect x="530.0" y="90.0" width="380.0" height="200.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<line x1="550.0" y1="220.0" x2="890.0" y2="220.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="895.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-style="italic">Baseline</text>
<line x1="550.0" y1="125.0" x2="890.0" y2="125.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="895.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Ascent</text>
<line x1="550.0" y1="265.0" x2="890.0" y2="265.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="895.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Descent</text>
<rect x="620.0" y="145.0" width="110.0" height="105.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="2.0"/>
<text x="675.0" y="213.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="64" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<line x1="580.0" y1="110.0" x2="580.0" y2="275.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="580.0" y1="175.0" x2="620.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Bearing X</text>
<line x1="770.0" y1="110.0" x2="770.0" y2="275.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="580.0" y1="110.0" x2="770.0" y2="110.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="675.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Advance Width (крок курсора)</text>
<rect x="512.0" y="305.0" width="416.0" height="110.0" rx="6" fill="#fff7e6" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="337.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Алгоритм виводу рядка (Display Blit Pipeline):</tspan><tspan x="720.0" dy="13.0">1. Декодування UTF-8 кодової точки → бінарний пошук у Codepoint Map.</tspan><tspan x="720.0" dy="13.0">2. Зчитування дескриптора з Flash (w, h, off_x, off_y, adv_x).</tspan><tspan x="720.0" dy="13.0">3. Попіксельне накладання бітів з Flash Bitmap Stream у Framebuffer.</tspan><tspan x="720.0" dy="13.0">4. Зсув курсора: cursor_x += (adv_x + kerning_adjust).</tspan></text>
<line x1="460.0" y1="240.0" x2="500.0" y2="190.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>