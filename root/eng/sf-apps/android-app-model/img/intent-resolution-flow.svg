<text x="705.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Цільова активація</text>
<rect x="605.0" y="95.0" width="200.0" height="65.0" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="705.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Прямий запуск</text>
<text x="705.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Для явного наміру або</text>
<text x="705.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">якщо знайдено 1 компонент</text>
<rect x="605.0" y="175.0" width="200.0" height="70.0" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="705.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ca8a04" text-anchor="middle" font-weight="700">Системний вибір (Chooser)</text>
<text x="705.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Якщо збіглося &gt;1 застосунків</text>
<text x="705.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Діалог вибору користувача</text>
