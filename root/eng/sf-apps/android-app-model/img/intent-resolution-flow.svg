<text x="420.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700">PackageManagerService (PKMS)</text>
<text x="420.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Алгоритм резолюції фільтрів</text>
<rect x="300.0" y="110.0" width="240.0" height="42.0" rx="4" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
<text x="420.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Звіряння Action</text>
<text x="420.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Повинен збігатися з &lt;action&gt; у фільтрі</text>
<rect x="300.0" y="160.0" width="240.0" height="42.0" rx="4" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
<text x="420.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Звіряння Data / MIME</text>
<text x="420.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Схема (https, geo), хост, шлях і MIME-тип</text>
<rect x="300.0" y="210.0" width="240.0" height="42.0" rx="4" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
<text x="420.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Звіряння Category</text>
<text x="420.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Усі категорії Intent мусять бути у фільтрі</text>
<rect x="300.0" y="260.0" width="240.0" height="42.0" rx="4" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
<text x="420.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Перевірка безпеки</text>
<text x="420.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Exported=true або збіг підпису/UID</text>
