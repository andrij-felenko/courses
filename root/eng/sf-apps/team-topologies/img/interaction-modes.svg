<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три режими взаємодії команд</text>
<text x="450.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три режими взаємодії двох команд</text>
<line x1="70.0" y1="360.0" x2="830.0" y2="360.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="80.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">низьке тертя, автономія</text>
<text x="820.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">високе тертя, дороге</text>
<rect x="95.0" y="96.0" width="210.0" height="200.0" rx="9" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/>
<text x="200.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як-сервіс</text>
<text x="200.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">одна надає,</text>
<text x="200.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">друга споживає</text>
<text x="200.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">через інтерфейс</text>
<text x="200.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">— без розмов</text>
<text x="200.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">СТАЛИЙ режим</text>
<line x1="200.0" y1="296.0" x2="200.0" y2="353.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="3,3"/>
<circle cx="200.0" cy="360.0" r="6.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<rect x="365.0" y="96.0" width="210.0" height="200.0" rx="9" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2"/>
<text x="470.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наставництво</text>
<text x="470.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">одна навчає</text>
<text x="470.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">іншу подолати</text>
<text x="470.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">перешкоду</text>
<text x="470.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">— передав уміння</text>
<text x="470.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">і ВИЙШОВ</text>
<line x1="470.0" y1="296.0" x2="470.0" y2="353.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="3,3"/>
<circle cx="470.0" cy="360.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<rect x="635.0" y="96.0" width="210.0" height="200.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="740.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Співпраця</text>
<text x="740.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">щільно разом,</text>
<text x="740.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">щоб намацати</text>
<text x="740.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">нове (інтерфейс)</text>
<text x="740.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">— дорого</text>
<text x="740.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ТИМЧАСОВО</text>
<line x1="740.0" y1="296.0" x2="740.0" y2="353.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3,3"/>
<circle cx="740.0" cy="360.0" r="6.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
</svg>