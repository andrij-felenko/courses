<text x="90.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Видимість мови</text>
<text x="90.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">package-private (Java) · internal (C#)</text>
<text x="90.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ловить: компілятор: чужий клас просто НЕ ВИДНО за іменем</text>
<text x="90.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">не дістає: Python / TS / Ruby — там public усе</text>
<rect x="60.0" y="208.0" width="840.0" height="110.0" rx="6" fill="#fef6e7" stroke="#b9770e" stroke-width="2.0"/>
<text x="90.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Сторож у конвеєрі</text>
<text x="90.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">fitness-function: ArchUnit · Packwerk</text>
<text x="90.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ловить: тест архітектури червоніє на забороненій залежності</text>
<text x="90.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">ловить і непрямі, і межу таблиць — головний ешелон</text>
<rect x="60.0" y="336.0" width="840.0" height="110.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="90.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Лінт імпортів</text>
<text x="90.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">no-restricted-imports (TS) · import-linter (Py)</text>
<text x="90.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ловить: збірка падає на імпорті з чужих нутрощів</text>
<text x="90.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">де мова слабша — найдешевший сторож, ставиться першим</text>
<text x="480.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ешелони складають: слабший на мові компенсуй сторожем і лінтом</text>
