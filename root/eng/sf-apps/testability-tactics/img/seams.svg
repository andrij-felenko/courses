<rect x="50.0" y="440.0" width="1000.0" height="66.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="550.0" y="469.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Скромний об'єкт (humble object): на крайньому адаптері (напр. SmtpNotifier) лишай МІНІМУМ коду —</tspan><tspan x="550.0" dy="16.9">усю логіку винеси всередину, у чисту тестовану частину; оболонка лише делегує їй.</tspan></text>
