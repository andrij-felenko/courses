<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що взагалі потрібно, щоб протестувати шматок системи</text>
<text x="470.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тест мусить мати два важелі: задати вхід і побачити вихід</text>
<rect x="65.0" y="174.6" width="170.0" height="70.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="150.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">КЕРУВАННЯ</tspan><tspan x="150.0" dy="16.9">задати вхід</tspan><tspan x="150.0" dy="16.9">і стан</tspan></text>
<line x1="235.0" y1="210.0" x2="334.0" y2="210.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="287.5" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">стимул</text>
<rect x="705.0" y="174.6" width="170.0" height="70.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="790.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">СПОСТЕРЕЖЕННЯ</tspan><tspan x="790.0" dy="16.9">прочитати вихід</tspan><tspan x="790.0" dy="16.9">і стан</tspan></text>
<line x1="606.0" y1="210.0" x2="705.0" y2="210.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="652.5" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">реакція</text>
<rect x="340.0" y="175.9" width="260.0" height="68.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.4"/><text x="470.0" y="205.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Компонент</tspan><tspan x="470.0" dy="18.2">(логіка, яку перевіряємо)</tspan></text>
<text x="470.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Тестовність = наскільки легко дотягтися до обох важелів.</text>
</svg>