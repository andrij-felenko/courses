<text x="450.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">межа між моделлю (1) і в'ю (2) дає багато діаграм з одного джерела</text>
