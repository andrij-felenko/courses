<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будова рушія «модель → в'ю»</text>
<rect x="60.0" y="115.6" width="220.0" height="78.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">ОПИС МОДЕЛІ</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">сутності й зв'язки</tspan><tspan x="170.0" dy="15.6">джерело правди</tspan></text>
<text x="170.0" y="99.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1</text>
<rect x="340.0" y="115.6" width="220.0" height="78.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">ОПИС В'Ю</tspan><tspan x="450.0" dy="15.6"></tspan><tspan x="450.0" dy="15.6">замовлення-вибірки</tspan><tspan x="450.0" dy="15.6">«покажи контекст…»</tspan></text>
<text x="450.0" y="99.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<rect x="620.0" y="115.6" width="220.0" height="78.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">РУШІЙ РОЗКЛАДКИ</tspan><tspan x="730.0" dy="15.6"></tspan><tspan x="730.0" dy="15.6">малює діаграму</tspan><tspan x="730.0" dy="15.6">з кожного замовлення</tspan></text>
<text x="730.0" y="99.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">3</text>
