<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від хмари побажань — до кількох, що вирішують форму</text>
<rect x="58.0" y="54.0" width="64.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="90.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">швидко</tspan></text>
<rect x="176.1" y="80.0" width="67.9" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="210.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">надійно</tspan></text>
<rect x="292.6" y="50.0" width="74.7" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="330.0" y="70.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">безпечно</tspan></text>
<rect x="418.0" y="84.0" width="64.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="450.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">дешево</tspan></text>
<rect x="519.0" y="52.0" width="102.1" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="570.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">легко міняти</tspan></text>
<rect x="649.2" y="82.0" width="81.6" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="690.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">масштабно</tspan></text>
<rect x="778.0" y="56.0" width="64.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="810.0" y="76.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">зручно</tspan></text>
<rect x="228.0" y="112.0" width="64.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="260.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">стійко</tspan></text>
<rect x="606.1" y="112.0" width="67.9" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="640.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">прозоро</tspan></text>
<text x="430.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">десятки побажань — усі важливі, усіх однаково не досягти</text>
<path d="M 200 180 L 660 180 L 540 250 L 320 250 Z" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="430.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">пріоритет за ризиком і бізнес-цінністю</text>
<rect x="145.0" y="276.2" width="170.0" height="47.6" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/><text x="230.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">профіль за 200 мс</tspan><tspan x="230.0" dy="15.6">у пік (95%)</tspan></text>
<rect x="345.0" y="276.2" width="170.0" height="47.6" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/><text x="430.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">переживає</tspan><tspan x="430.0" dy="15.6">втрату вузла БД</tspan></text>
<rect x="545.0" y="276.2" width="170.0" height="47.6" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/><text x="630.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">нова валюта —</tspan><tspan x="630.0" dy="15.6">без правки ядра</tspan></text>
<text x="430.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">5–15 драйверних сценаріїв — конкретних і вимірних</text>
<line x1="430.0" y1="360.0" x2="430.0" y2="384.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="185.0" y="366.0" width="490.0" height="30.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.8"/><text x="430.0" y="385.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">ці кілька — і формують рішення про архітектуру</tspan></text>
</svg>