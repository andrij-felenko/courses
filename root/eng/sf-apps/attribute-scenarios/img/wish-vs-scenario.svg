<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна вимога — два формулювання</text>
<text x="235.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Розмите побажання</text>
<rect x="40.0" y="84.0" width="390.0" height="92.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.8"/><text x="235.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">«Система має бути</tspan><tspan x="235.0" dy="20.8">швидкою й надійною»</tspan></text>
<text x="235.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Швидкою — для кого, коли, наскільки?</text>
<text x="235.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Надійною — за яких збоїв?</text>
<text x="235.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Перевірити не можна.</text>
<text x="235.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Сперечатися можна безкінечно.</text>
<text x="665.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Конкретний сценарій</text>
<rect x="470.0" y="84.0" width="390.0" height="92.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/><text x="665.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">«У пік навантаження запит</tspan><tspan x="665.0" dy="18.2">профілю віддається за 200 мс</tspan><tspan x="665.0" dy="18.2">у 95% випадків»</tspan></text>
<text x="665.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Джерело+стимул: пік, запит профілю.</text>
<text x="665.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Міра: 200 мс, 95-й перцентиль.</text>
<text x="665.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Тест напише сам себе.</text>
<text x="665.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Виконано або ні — без суперечки.</text>
<line x1="450.0" y1="60.0" x2="450.0" y2="320.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,5"/>
</svg>