<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шість частин одного сценарію атрибута</text>
<rect x="65.0" y="95.0" width="150.0" height="49.9" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Джерело</tspan><tspan x="140.0" dy="16.9">(хто/що)</tspan></text>
<rect x="285.0" y="95.0" width="150.0" height="49.9" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Стимул</tspan><tspan x="360.0" dy="16.9">(подія)</tspan></text>
<rect x="535.0" y="95.0" width="170.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Артефакт</tspan><tspan x="620.0" dy="16.9">(що зачеплено)</tspan></text>
<rect x="490.0" y="42.0" width="260.0" height="156.0" rx="10" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<text x="620.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Середовище (за яких умов)</text>
<line x1="215.0" y1="120.0" x2="285.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="435.0" y1="120.0" x2="482.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="255.0" y="275.1" width="210.0" height="49.9" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Відповідь</tspan><tspan x="360.0" dy="16.9">(що робить система)</tspan></text>
<rect x="555.0" y="275.1" width="210.0" height="49.9" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.5"/><text x="660.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Міра відповіді</tspan><tspan x="660.0" dy="16.9">(скільки — число)</tspan></text>
<line x1="620.0" y1="200.0" x2="360.0" y2="271.1" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="465.0" y1="300.0" x2="555.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="450.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Читається як речення: коли &lt;джерело&gt; робить &lt;стимул&gt;, система &lt;відповідь&gt; — і це вимірюється &lt;мірою&gt;.</text>
</svg>