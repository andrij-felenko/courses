<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон дірявих абстракцій: коли фізика прориває інтерфейс</text>
<rect x="70.0" y="28.3" width="640.0" height="71.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="390.0" y="47.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">ОБІЦЯНКА АБСТРАКЦІЇ (ОХАЙНА МОДЕЛЬ)</tspan><tspan x="390.0" dy="13.7">• «Масив — це плоска пам'ять з доступом O(1) до будь-якого елемента»</tspan><tspan x="390.0" dy="13.7">• «Файлова система — це локальні синхронні read()/write() без відмов»</tspan><tspan x="390.0" dy="13.7">• «TCP — це неперервний надійний потік байтів без втрат і затримок»</tspan></text>
<line x1="50.0" y1="150.0" x2="730.0" y2="150.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 4"/>
<rect x="150.0" y="134.8" width="480.0" height="30.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="390.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">⚡ ПРОТІКАННЯ КРІЗЬ ШВИ АБСТРАКЦІЇ (LEAKY ABSTRACTION) ⚡</tspan></text>
<rect x="50.0" y="214.3" width="680.0" height="71.4" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="1.8"/><text x="390.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">ФІЗИЧНА РЕАЛЬНІСТЬ (ЩО ВІДБУВАЄТЬСЯ НАСПРАВДІ)</tspan><tspan x="390.0" dy="13.7">• Кеш-промахи: послідовний доступ 1 нс (L1), випадковий — 80 нс (RAM) → різниця у 80 разів!</tspan><tspan x="390.0" dy="13.7">• NFS/Мережевий диск: витягли кабель → read() блокує потік на 120 с у стані D</tspan><tspan x="390.0" dy="13.7">• TCP під час втрати зв'язку: ретрансміти, буферизація в сокеті, вичерпання дескрипторів</tspan></text>
<text x="390.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Абстракція спрощує мислення, але не скасовує фізичних законів роботи апаратури</text>
</svg>