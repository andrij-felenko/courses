<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="293.9" y="32.5" width="312.3" height="39.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="450.0" y="57.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Скільки правил над цими даними?</tspan></text>
<line x1="360.0" y1="78.0" x2="220.0" y2="128.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="255.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">майже нема</text>
<rect x="60.0" y="132.0" width="330.0" height="168.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="225.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">плаский об'єкт — доречно</text>
<text x="225.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">CRUD-форма, довідник, звіт,</tspan><tspan x="225.0" dy="16.8">перекладання даних між шарами.</tspan><tspan x="225.0" dy="16.8">Правил обмаль — сервіс-процедура</tspan><tspan x="225.0" dy="16.8">простий, зрозумілий, легкий.</tspan></text>
<text x="225.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-style="italic">це не хвороба, а вибір</text>
<line x1="540.0" y1="78.0" x2="690.0" y2="128.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="660.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">багато й ростуть</text>
<rect x="510.0" y="132.0" width="330.0" height="168.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="675.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">знекровлення — анти-патерн</text>
<text x="675.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Стани, переходи, інваріанти.</tspan><tspan x="675.0" dy="16.8">Правило розсипане по сервісах:</tspan><tspan x="675.0" dy="16.8">дублюється або губиться,</tspan><tspan x="675.0" dy="16.8">об'єкт не володіє собою.</tspan></text>
<text x="675.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">правило шукає дім — сам об'єкт</text>
</svg>