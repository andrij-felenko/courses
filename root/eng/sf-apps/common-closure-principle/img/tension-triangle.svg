<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три сили зв'язності компонента — і їхнє натягування</text>
<line x1="500.0" y1="150.0" x2="235.0" y2="470.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="500.0" y1="150.0" x2="765.0" y2="470.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="235.0" y1="470.0" x2="765.0" y2="470.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="370.0" y="108.0" width="260.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="500.0" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">REP</tspan><tspan x="500.0" dy="15.0">еквівалентність</tspan><tspan x="500.0" dy="15.0">випуску й повтору</tspan><tspan x="500.0" dy="15.0">(↑ більший компонент)</tspan></text>
<rect x="105.0" y="430.0" width="260.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="235.0" y="451.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">CRP</tspan><tspan x="235.0" dy="15.0">спільне повторне</tspan><tspan x="235.0" dy="15.0">використання</tspan><tspan x="235.0" dy="15.0">(↓ менший компонент)</tspan></text>
<rect x="635.0" y="430.0" width="260.0" height="80.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.4"/><text x="765.0" y="459.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">CCP</tspan><tspan x="765.0" dy="15.0">спільне закриття</tspan><tspan x="765.0" dy="15.0">(↑ більший компонент)</tspan></text>
<rect x="18.0" y="262.0" width="236.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="136.0" y="287.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">знехтувати CCP →</tspan><tspan x="136.0" dy="15.6">зміна б'є в багато</tspan><tspan x="136.0" dy="15.6">компонентів</tspan></text>
<rect x="746.0" y="262.0" width="236.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="864.0" y="287.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="864.0" dy="0.0">знехтувати CRP →</tspan><tspan x="864.0" dy="15.6">тягнеш зайве,</tspan><tspan x="864.0" dy="15.6">зайві випуски</tspan></text>
<rect x="316.0" y="506.0" width="368.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="500.0" y="530.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">знехтувати REP → нема чого повторно використати</tspan></text>
<rect x="120.0" y="566.0" width="760.0" height="40.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/><text x="500.0" y="589.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Молодий проєкт тулиться до CCP (швидко міняти важливіше за повтор); зрілий — зсувається до REP / CRP.</tspan></text>
</svg>