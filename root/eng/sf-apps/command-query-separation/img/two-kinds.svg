<text x="470.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метод — рівно одного роду</text>
<rect x="105.0" y="78.5" width="250.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">КОМАНДА</tspan></text>
<text x="230.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">міняє стан</tspan><tspan x="230.0" dy="18.2">нічого не повертає</tspan></text>
<text x="230.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">withdraw(200)</tspan><tspan x="230.0" dy="19.5">save()</tspan><tspan x="230.0" dy="19.5">shutdown()</tspan></text>
<text x="230.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">«зроби це»</text>
<rect x="585.0" y="78.5" width="250.0" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">ЗАПИТ</tspan></text>
<text x="710.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">повертає значення</tspan><tspan x="710.0" dy="18.2">стан не чіпає</tspan></text>
<text x="710.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">balance()</tspan><tspan x="710.0" dy="19.5">isEmpty()</tspan><tspan x="710.0" dy="19.5">size()</tspan></text>
<text x="710.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">«скажи мені»</text>
<circle cx="250.0" cy="372.0" r="22.0" fill="#fdecea" stroke="#c0392b" stroke-width="3.0"/>
<line x1="235.0" y1="387.0" x2="265.0" y2="357.0" stroke="#c0392b" stroke-width="3.0"/>
<rect x="300.0" y="347.1" width="420.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">один метод, що й повертає,</tspan><tspan x="510.0" dy="16.9">і потайки міняє стан</tspan></text>
<text x="470.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">питання не має міняти відповідь</text>
