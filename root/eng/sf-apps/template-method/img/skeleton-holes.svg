<text x="560.0" y="628.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">каркас пишемо ОДИН раз; кожен нащадок дає лише свій крок і вставляє його в дірку</text>
