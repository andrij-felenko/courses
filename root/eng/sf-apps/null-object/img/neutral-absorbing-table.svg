<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нейтральний і поглинальний елемент операції</text>
<text x="580.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">e лишає операнд незмінним;  z стягує будь-що до себе</text>
<text x="80.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">операція</text>
<text x="620.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">нейтральний  e</text>
<text x="940.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">поглинальний  z</text>
<line x1="70.0" y1="121.0" x2="1090.0" y2="121.0" stroke="#c9ced4" stroke-width="1.3"/>
<text x="80.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">додавання   a + b</text>
<text x="620.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">0</text>
<text x="940.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">— (немає)</text>
<line x1="70.0" y1="197.0" x2="1090.0" y2="197.0" stroke="#eef0f2" stroke-width="1.0"/>
<text x="80.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">множення   a · b</text>
<text x="620.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1</text>
<text x="940.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0</text>
<line x1="70.0" y1="247.0" x2="1090.0" y2="247.0" stroke="#eef0f2" stroke-width="1.0"/>
<text x="80.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">конкатенація   a ⧺ b</text>
<text x="620.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">&quot;&quot; — порожній рядок</text>
<text x="940.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">— (немає)</text>
<line x1="70.0" y1="297.0" x2="1090.0" y2="297.0" stroke="#eef0f2" stroke-width="1.0"/>
<text x="80.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">І (AND)   a ∧ b</text>
<text x="620.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">true</text>
<text x="940.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">false</text>
<line x1="70.0" y1="347.0" x2="1090.0" y2="347.0" stroke="#eef0f2" stroke-width="1.0"/>
<text x="80.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">АБО (OR)   a ∨ b</text>
<text x="620.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">false</text>
<text x="940.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">true</text>
<line x1="70.0" y1="397.0" x2="1090.0" y2="397.0" stroke="#eef0f2" stroke-width="1.0"/>
<text x="80.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">композиція   f ∘ g</text>
<text x="620.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">id — тотожність</text>
<text x="940.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">— (немає)</text>
<line x1="70.0" y1="447.0" x2="1090.0" y2="447.0" stroke="#eef0f2" stroke-width="1.0"/>
<text x="80.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ланцюг ефектів</text>
<text x="620.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ε — нічого не роблю</text>
<text x="940.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">— (немає)</text>
<line x1="70.0" y1="497.0" x2="1090.0" y2="497.0" stroke="#eef0f2" stroke-width="1.0"/>
<rect x="70.0" y="511.0" width="1020.0" height="108.0" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="580.0" y="544.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">⚠  Та сама позначка — різна роль, залежно від операції:</tspan><tspan x="580.0" dy="16.9">0 — нейтральний для + , але поглинальний для ×</tspan><tspan x="580.0" dy="16.9">false — нейтральний для ∨, поглинальний для ∧;   true — навпаки</tspan><tspan x="580.0" dy="16.9">коректність задає ПАРА (значення, операція), а не значення саме собою</tspan></text>
</svg>