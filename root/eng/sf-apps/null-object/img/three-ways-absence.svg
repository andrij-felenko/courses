<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи зустріти відсутність</text>
<text x="590.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">«значення може бути відсутнє» — і що з цим робити</text>
<text x="218.3" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">null + перевірка</text>
<rect x="68.3" y="175.6" width="300.0" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="218.3" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="218.3" dy="0.0">значення АБО null</tspan><tspan x="218.3" dy="16.2">if x ≠ null: …</tspan></text>
<text x="88.3" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">✗</text>
<text x="110.3" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">можна забути перевірку</text>
<text x="110.3" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">→ падіння в рантаймі</text>
<text x="590.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">порожній об'єкт</text>
<rect x="440.0" y="175.6" width="300.0" height="48.8" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.7"/><text x="590.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">об'єкт завжди є</tspan><tspan x="590.0" dy="16.2">кличеш наосліп</tspan></text>
<text x="460.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">✓</text>
<text x="482.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">безпечно, без розгалужень</text>
<text x="460.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="start" font-weight="700">⚠</text>
<text x="482.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">може тихо сховати помилку</text>
<text x="961.7" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Optional / сума-тип</text>
<rect x="811.7" y="175.6" width="300.0" height="48.8" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.7"/><text x="961.7" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="961.7" dy="0.0">тип: значення АБО нічого</tspan><tspan x="961.7" dy="16.2">compiler вимагає розбір</tspan></text>
<text x="831.7" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">✓</text>
<text x="853.7" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">змушує обробити обидва</text>
<text x="853.7" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">забути неможливо</text>
<line x1="401.2" y1="100.0" x2="401.2" y2="360.0" stroke="#e2e5e9" stroke-width="1.0"/>
<line x1="778.8" y1="100.0" x2="778.8" y2="360.0" stroke="#e2e5e9" stroke-width="1.0"/>
<line x1="40.0" y1="486.0" x2="1140.0" y2="486.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="590.0" y="514.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">порожній об'єкт прибирає розгалуження; Optional його вимагає — обирай за важливістю відсутності</text>
<text x="590.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">нейтральна поведінка чесна → порожній об'єкт;  відсутність щоразу важлива → Optional</text>
</svg>