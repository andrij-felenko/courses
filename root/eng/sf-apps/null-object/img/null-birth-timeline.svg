<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 812" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="812" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нитка: від винаходу null до патерна, що вчить без нього</text>
<text x="570.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">одна лінія коду 1965-го — і десятиліття, витрачені на те, щоб її обійти</text>
<line x1="176.0" y1="138.0" x2="176.0" y2="714.0" stroke="#cbd0d6" stroke-width="2.2"/>
<text x="142.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="end" font-weight="700">1965</text>
<rect x="220.0" y="104.0" width="876.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="658.0" y="133.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="658.0" dy="0.0">Тоні Гоар вбудовує null-посилання в систему типів для ALGOL W</tspan><tspan x="658.0" dy="17.6">(мову запропонував із Ніклаусом Віртом) — «бо це було до смішного легко»</tspan></text>
<circle cx="176.0" cy="138.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/>
<text x="142.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="end" font-weight="700">1988</text>
<rect x="220.0" y="200.0" width="876.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="658.0" y="229.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="658.0" dy="0.0">Роберт Седжвік описує вартового-«z-node» в «Algorithms»</tspan><tspan x="658.0" dy="17.6">процедурний предок: об'єкт-заглушка замість спецперевірок у структурах</tspan></text>
<circle cx="176.0" cy="234.0" r="9.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.6"/>
<text x="142.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="end" font-weight="700">1995</text>
<rect x="220.0" y="296.0" width="876.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="658.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="658.0" dy="0.0">Брюс Андерсон піднімає ім'я «Null Object» у списку розсилки патернів UIUC</tspan><tspan x="658.0" dy="17.6">ідея визріває спільно, ще до жодної статті</tspan></text>
<circle cx="176.0" cy="330.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.6"/>
<text x="142.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="end" font-weight="700">1996</text>
<rect x="220.0" y="392.0" width="876.0" height="68.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="658.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="658.0" dy="0.0">Боббі Вулф читає «The Null Object Pattern» на PLoP '96 (Аллертон-Парк, Іллінойс)</tspan><tspan x="658.0" dy="17.6">патерн уперше оформлено як патерн; наскрізний приклад — NoController зі Smalltalk</tspan></text>
<circle cx="176.0" cy="426.0" r="9.0" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.6"/>
<text x="142.0" y="527.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="end" font-weight="700">1998</text>
<rect x="220.0" y="488.0" width="876.0" height="68.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="658.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="658.0" dy="0.0">Патерн виходить друком у «Pattern Languages of Program Design 3» (Addison-Wesley)</tspan><tspan x="658.0" dy="17.6">усталена, багато цитована публікація</tspan></text>
<circle cx="176.0" cy="522.0" r="9.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="142.0" y="623.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="end" font-weight="700">2002</text>
<rect x="220.0" y="584.0" width="876.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="658.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="658.0" dy="0.0">Мартін Фаулер узагальнює його до «особливого випадку» (Special Case) у PoEAA</tspan><tspan x="658.0" dy="17.6">порожній об'єкт виявляється лише одним із багатьох особливих станів</tspan></text>
<circle cx="176.0" cy="618.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.6"/>
<text x="142.0" y="719.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="end" font-weight="700">2009</text>
<rect x="220.0" y="680.0" width="876.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="658.0" y="710.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="658.0" dy="0.0">Гоар привселюдно зве null своєю «помилкою на мільярд доларів» (QCon London)</tspan><tspan x="658.0" dy="17.6">коло замкнулося: сам винахідник діри публічно за неї перепрошує</tspan></text>
<circle cx="176.0" cy="714.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/>
<line x1="44.0" y1="754.0" x2="1096.0" y2="754.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="570.0" y="782.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">один винайшов діру · спільнота патернів дала спосіб її обходити · винахідник за неї перепросив</text>
</svg>