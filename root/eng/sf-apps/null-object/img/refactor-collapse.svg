<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Згортання: одна нейтральна гілка, скопійована чотири рази</text>
<text x="610.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">той самий else «вільний тариф» повторено в кожному методі</text>
<text x="311.1" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ДО — 4 перевірки, гілка ×4</text>
<rect x="61.1" y="260.6" width="500.0" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="311.1" y="280.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="311.1" dy="0.0">price   : sub≠null ? sub.price()      : 0</tspan><tspan x="311.1" dy="15.6">storage : sub≠null ? sub.storageGb()  : 1</tspan><tspan x="311.1" dy="15.6">seats   : sub≠null ? sub.seats()      : 1</tspan><tspan x="311.1" dy="15.6">feature : sub≠null ? sub.includes(f)  : BASIC</tspan></text>
<text x="311.1" y="365.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нейтральна гілка (0, 1, 1, BASIC) скопійована чотири рази</text>
<text x="610.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">згортаємо</text>
<line x1="575.1" y1="300.0" x2="658.9" y2="300.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">гілку в клас</text>
<text x="908.9" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ПІСЛЯ — гілка в одному класі, 0 перевірок</text>
<rect x="698.9" y="178.4" width="420.0" height="63.2" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.7"/><text x="908.9" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="908.9" dy="0.0">FreeSubscription  (порожній об'єкт)</tspan><tspan x="908.9" dy="15.6">price()=0   storageGb()=1</tspan><tspan x="908.9" dy="15.6">seats()=1   includes(f)=BASIC.has(f)</tspan></text>
<rect x="698.9" y="360.6" width="420.0" height="78.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="908.9" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="908.9" dy="0.0">price   : sub.price()</tspan><tspan x="908.9" dy="15.6">storage : sub.storageGb()</tspan><tspan x="908.9" dy="15.6">seats   : sub.seats()</tspan><tspan x="908.9" dy="15.6">feature : sub.includes(f)</tspan></text>
<line x1="908.9" y1="245.6" x2="908.9" y2="356.6" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="908.9" y="463.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">жодного розгалуження — Account лише делегує</text>
<line x1="40.0" y1="600.0" x2="1180.0" y2="600.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="610.0" y="628.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">чотири копії однієї політики → одне джерело правди; новий метод не тягне нової перевірки</text>
</svg>