<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр кооперації між контекстами (за Евансом)</text>
<text x="480.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">від найтіснішого злиття мов ліворуч — до найоборонішого перекладу праворуч</text>
<line x1="80.0" y1="210.0" x2="880.0" y2="210.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="80.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">тісно</text>
<text x="880.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">нарізно</text>
<circle cx="170.0" cy="210.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="111.0" y="132.5" width="118.0" height="31.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Спільне ядро</tspan></text>
<line x1="170.0" y1="163.5" x2="170.0" y2="202.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="170.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">ділимо шматок</tspan><tspan x="170.0" dy="13.0">моделі разом</tspan></text>
<circle cx="330.0" cy="210.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="271.0" y="125.3" width="118.0" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="144.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Замовник—</tspan><tspan x="330.0" dy="14.3">постачальник</tspan></text>
<line x1="330.0" y1="170.7" x2="330.0" y2="202.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="330.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="330.0" dy="0.0">нерівність,</tspan><tspan x="330.0" dy="13.0">але з голосом</tspan></text>
<circle cx="500.0" cy="210.0" r="6.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<rect x="441.0" y="132.5" width="118.0" height="31.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Конформіст</tspan></text>
<line x1="500.0" y1="163.5" x2="500.0" y2="202.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="500.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="500.0" dy="0.0">беремо чужу</tspan><tspan x="500.0" dy="13.0">модель як є</tspan></text>
<circle cx="680.0" cy="210.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<rect x="618.9" y="125.3" width="122.3" height="45.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="680.0" y="144.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Антикорупційний</tspan><tspan x="680.0" dy="14.3">шар</tspan></text>
<line x1="680.0" y1="170.7" x2="680.0" y2="202.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="680.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="680.0" dy="0.0">переклад +</tspan><tspan x="680.0" dy="13.0">оборона межі</tspan></text>
<circle cx="830.0" cy="210.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<rect x="771.0" y="132.5" width="118.0" height="31.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="830.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Окремі шляхи</tspan></text>
<line x1="830.0" y1="163.5" x2="830.0" y2="202.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="830.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="830.0" dy="0.0">розрив</tspan><tspan x="830.0" dy="13.0">навмисне</tspan></text>
<rect x="80.0" y="340.0" width="800.0" height="104.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="480.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Конформіст і ACL — обидва для випадку «ти внизу за течією, чужий велетень тобі непідвладний».</text>
<text x="480.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Конформіст здається — впускає чужу модель усередину. ACL б'ється — тримає перекладача на межі</text>
<text x="480.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">й не пускає чужі поняття далі. Той самий стик — протилежна відповідь.</text>
</svg>