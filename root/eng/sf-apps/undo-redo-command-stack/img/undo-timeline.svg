<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 830" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="830" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тридцять років між «можна передумати» і панеллю історії</text>
<line x1="196.0" y1="74.0" x2="196.0" y2="732.0" stroke="#b8c2cc" stroke-width="2.4"/><circle cx="196.0" cy="108.0" r="11.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/><text x="162.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">1966</text><rect x="236.0" y="64.0" width="960.0" height="88.0" rx="10" fill="#ffffff" stroke="#dfe5ec" stroke-width="1.4"/><rect x="258.0" y="72.0" width="192.0" height="32.0" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="354.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="354.0" dy="0.0">ідея</tspan></text><text x="258.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">PILOT — Воррен Тейтельман, MIT</text><text x="476.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">вказівка машині подана як порада, а пораду можна відкликати</text><circle cx="196.0" cy="224.0" r="11.0" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/><text x="162.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">1968–69</text><rect x="236.0" y="180.0" width="960.0" height="88.0" rx="10" fill="#ffffff" stroke="#dfe5ec" stroke-width="1.4"/><rect x="258.0" y="188.0" width="192.0" height="32.0" rx="12" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="354.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="354.0" dy="0.0">перша реалізація</tspan></text><text x="258.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">FRESS — Андріс ван Дам зі студентами, Браунський університет</text><text x="476.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">один крок назад; правка йде в тіньову версію — звідси й автозбереження</text><circle cx="196.0" cy="340.0" r="11.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/><text x="162.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">1970–71</text><rect x="236.0" y="296.0" width="960.0" height="88.0" rx="10" fill="#ffffff" stroke="#dfe5ec" stroke-width="1.4"/><rect x="258.0" y="304.0" width="192.0" height="32.0" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="354.0" y="324.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="354.0" dy="0.0">середовище</tspan></text><text x="258.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Programmer's Assistant у BBN-LISP — В. Тейтельман</text><text x="476.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">історія сесії зберігається як дані; відкотити можна навіть не по порядку</text><circle cx="196.0" cy="456.0" r="11.0" fill="#ffffff" stroke="#c07a1e" stroke-width="3.0"/><text x="162.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">1974</text><rect x="236.0" y="412.0" width="960.0" height="88.0" rx="10" fill="#ffffff" stroke="#dfe5ec" stroke-width="1.4"/><rect x="258.0" y="420.0" width="192.0" height="32.0" rx="12" fill="#ffffff" stroke="#c07a1e" stroke-width="1.8"/><text x="354.0" y="440.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c07a1e" text-anchor="middle"><tspan x="354.0" dy="0.0">масовий редактор</tspan></text><text x="258.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Bravo — Xerox PARC, перший WYSIWYG-редактор</text><text x="476.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">рівно один крок назад: рятує від описки, не рятує від катастрофи</text><circle cx="196.0" cy="572.0" r="11.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.0"/><text x="162.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">1976</text><rect x="236.0" y="528.0" width="960.0" height="88.0" rx="10" fill="#ffffff" stroke="#dfe5ec" stroke-width="1.4"/><rect x="258.0" y="536.0" width="192.0" height="32.0" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="354.0" y="556.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="354.0" dy="0.0">записана вимога</tspan></text><text x="258.0" y="594.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">звіт Ленса Міллера й Джона Томаса, IBM Research</text><text x="476.0" y="557.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">«назад» уперше названо тим, що інтерактивна система МУСИТЬ мати</text><circle cx="196.0" cy="688.0" r="11.0" fill="#ffffff" stroke="#7d3c98" stroke-width="3.0"/><text x="162.0" y="694.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">1998</text><rect x="236.0" y="644.0" width="960.0" height="88.0" rx="10" fill="#ffffff" stroke="#dfe5ec" stroke-width="1.4"/><rect x="258.0" y="652.0" width="192.0" height="32.0" rx="12" fill="#ffffff" stroke="#7d3c98" stroke-width="1.8"/><text x="354.0" y="672.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d3c98" text-anchor="middle"><tspan x="354.0" dy="0.0">багато кроків</tspan></text><text x="258.0" y="710.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Photoshop 5.0 — панель історії</text><text x="476.0" y="673.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">минуле стає видимим списком станів, до яких повертаються мишею</text><text x="716.0" y="784.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">далі сперечаються вже не про наявність скасування, а про його глибину, модель і те, чиє воно</text>
</svg>