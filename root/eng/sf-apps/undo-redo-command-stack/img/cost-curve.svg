 font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">4k*</text><text x="460.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">k — крок опорного знімка</text><text x="138.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">ціна C(k)</text><line x1="812.0" y1="112.0" x2="846.0" y2="112.0" stroke="#2457d6" stroke-width="4.0"/><text x="858.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">пам'ять:  A/k = N·S/k</text><line x1="812.0" y1="146.0" x2="846.0" y2="146.0" stroke="#c0392b" stroke-width="4.0"/><text x="858.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">час:  B·k = λ·t·k</text><line x1="812.0" y1="180.0" x2="846.0" y2="180.0" stroke="#1a1a1a" stroke-width="5.0"/><text x="858.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">сума C(k)</text><rect x="812.0" y="212.0" width="340.0" height="176.0" rx="6" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.5"/><text x="982.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="982.0" dy="0.0">C(k) = N·d + N·S/k + λ·(σ + (k−1)·t)</tspan><tspan x="982.0" dy="18.2">     = const + A/k + B·k</tspan><tspan x="982.0" dy="18.2">A = N·S,   B = λ·t</tspan><tspan x="982.0" dy="18.2">C′(k) = −A/k² + B = 0</tspan><tspan x="982.0" dy="18.2">k* = √(A/B) = √( N·S / (λ·t) )</tspan><tspan x="982.0" dy="18.2">C(k*) = const + 2·√(A·B)</tspan></text><rect x="812.0" y="402.0" width="340.0" height="86.0" rx="6" fill="#eef3f8" stroke="#6b7280" stroke-width="1.5"/><text x="982.0" y="432.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="982.0" dy="0.0">смуга k*/2 … 2k*:</tspan><tspan x="982.0" dy="16.9">ціна ≤ 1.25 × мінімум</tspan><tspan x="982.0" dy="16.9">(відношення = (m + 1/m)/2)</tspan></text>
