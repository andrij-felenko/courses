<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінія історії: два різні кінці, з яких кроки випадають по-різному</text>
<rect x="153.0" y="233.0" width="118.0" height="34.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="212.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">s0</tspan></text><rect x="289.0" y="233.0" width="118.0" height="34.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="348.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="348.0" dy="0.0">s1</tspan></text><rect x="425.0" y="233.0" width="118.0" height="34.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="484.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="484.0" dy="0.0">s2</tspan></text><rect x="561.0" y="233.0" width="118.0" height="34.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">s3</tspan></text><rect x="697.0" y="233.0" width="118.0" height="34.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="756.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="756.0" dy="0.0">s4</tspan></text><rect x="833.0" y="233.0" width="118.0" height="34.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="892.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="892.0" dy="0.0">s5</tspan></text><rect x="969.0" y="233.0" width="118.0" height="34.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="1028.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="1028.0" dy="0.0">s6</tspan></text><text x="416.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">застосовані кроки</text><text x="824.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">гілка повтору</text><line x1="688.0" y1="336.0" x2="688.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="688.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">index = 4 — стан, який людина бачить зараз</text><line x1="688.0" y1="214.0" x2="688.0" y2="286.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 5"/><line x1="960.0" y1="190.0" x2="960.0" y2="228.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="960.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">saved = 6</tspan><tspan x="960.0" dy="16.9">тут документ записали у файл</tspan></text><line x1="147.0" y1="250.0" x2="90.0" y2="250.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/><text x="120.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">з дна</text><rect x="40.0" y="410.0" width="560.0" height="170.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="320.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Випадає з ДНА — вичерпано бюджет</text><text x="320.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle"><tspan x="320.0" dy="0.0">гине корінь «до» найстарішого кроку</tspan><tspan x="320.0" dy="16.9">звільняється те, що крок ВИЛУЧИВ</tspan><tspan x="320.0" dy="16.9">saved з'їжджає вниз; пішов під нуль → −1</tspan></text><rect x="640.0" y="410.0" width="560.0" height="170.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="920.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зрізається ГІЛКА ПОВТОРУ — нова дія</text><text x="920.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="920.0" dy="0.0">гинуть корені «після» зрізаних кроків</tspan><tspan x="920.0" dy="16.9">звільняється те, що кроки ДОДАЛИ</tspan><tspan x="920.0" dy="16.9">saved опинився у зрізаному → −1 назавжди</tspan></text>
</svg>