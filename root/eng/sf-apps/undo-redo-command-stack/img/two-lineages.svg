<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1260" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два різні скасування, які випадково називають однаково</text>
<rect x="440.0" y="64.0" width="380.0" height="36.0" rx="12" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">одне слово — undo / redo</tspan></text><line x1="480.0" y1="100.0" x2="310.0" y2="142.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="780.0" y1="100.0" x2="950.0" y2="142.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40.0" y="150.0" width="540.0" height="490.0" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="310.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Скасування в інтерфейсі</text><line x1="60.0" y1="202.0" x2="560.0" y2="202.0" stroke="#dfe5ec" stroke-width="1.2"/><text x="64.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">хто вирішує скасувати</text><text x="64.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">людина, свідомо</tspan></text><line x1="60.0" y1="302.0" x2="560.0" y2="302.0" stroke="#eceff3" stroke-width="1.0"/><text x="64.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">що скасовують</text><text x="64.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">дію, яка ВДАЛАСЯ</tspan></text><line x1="60.0" y1="380.0" x2="560.0" y2="380.0" stroke="#eceff3" stroke-width="1.0"/><text x="64.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">одиниця скасування</text><text x="64.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">намір людини</tspan></text><line x1="60.0" y1="458.0" x2="560.0" y2="458.0" stroke="#eceff3" stroke-width="1.0"/><text x="64.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">коли скасування правильне</text><text x="64.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">коли стан збігається з тим,</tspan><tspan x="64.0" dy="17.6">що людина пам'ятає</tspan></text><line x1="60.0" y1="536.0" x2="560.0" y2="536.0" stroke="#eceff3" stroke-width="1.0"/><text x="64.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">родовід</text><text x="64.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">FRESS 1968 · Bravo 1974 ·</tspan><tspan x="64.0" dy="17.6">Міллер і Томас 1976</tspan></text><rect x="680.0" y="150.0" width="540.0" height="490.0" rx="12" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="950.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Скасування у відновленні бази</text><line x1="700.0" y1="202.0" x2="1200.0" y2="202.0" stroke="#dfe5ec" stroke-width="1.2"/><text x="704.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">хто вирішує скасувати</text><text x="704.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="704.0" dy="0.0">ніхто — так вирішив збій</tspan></text><line x1="700.0" y1="302.0" x2="1200.0" y2="302.0" stroke="#eceff3" stroke-width="1.0"/><text x="704.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">що скасовують</text><text x="704.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="704.0" dy="0.0">транзакцію, яка НЕ дійшла до кінця</tspan></text><line x1="700.0" y1="380.0" x2="1200.0" y2="380.0" stroke="#eceff3" stroke-width="1.0"/><text x="704.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">одиниця скасування</text><text x="704.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="704.0" dy="0.0">запис журналу</tspan></text><line x1="700.0" y1="458.0" x2="1200.0" y2="458.0" stroke="#eceff3" stroke-width="1.0"/><text x="704.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">коли скасування правильне</text><text x="704.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="704.0" dy="0.0">коли інваріанти бази</tspan><tspan x="704.0" dy="17.6">знову цілі</tspan></text><line x1="700.0" y1="536.0" x2="1200.0" y2="536.0" stroke="#eceff3" stroke-width="1.0"/><text x="704.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">родовід</text><text x="704.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="704.0" dy="0.0">журнал попереднього запису ·</tspan><tspan x="704.0" dy="17.6">ARIES 1992</tspan></text>
</svg>