<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транзакція: у стек лягає лише завершений намір</text>
<rect x="30.0" y="66.0" width="550.0" height="400.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="305.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Намір дійшов до кінця → commit</text><rect x="78.0" y="137.0" width="64.0" height="34.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle"><tspan x="110.0" dy="0.0">r₀</tspan></text><rect x="208.0" y="137.0" width="64.0" height="34.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle"><tspan x="240.0" dy="0.0">r₁</tspan></text><line x1="146.0" y1="154.0" x2="204.0" y2="154.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="338.0" y="137.0" width="64.0" height="34.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle"><tspan x="370.0" dy="0.0">r₂</tspan></text><line x1="276.0" y1="154.0" x2="334.0" y2="154.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="468.0" y="137.0" width="64.0" height="34.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle"><tspan x="500.0" dy="0.0">r₃</tspan></text><line x1="406.0" y1="154.0" x2="464.0" y2="154.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="305.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="305.0" dy="0.0">кожна правка одразу видна на екрані:</tspan><tspan x="305.0" dy="16.9">людина бачить, як фігура їде</tspan></text><rect x="70.0" y="268.0" width="470.0" height="86.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="306.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">в історію лягає ОДИН крок:</tspan><tspan x="305.0" dy="18.2">before = r₀,  after = r₃</tspan></text><text x="305.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="305.0" dy="0.0">межа кроку — межа наміру,</tspan><tspan x="305.0" dy="16.9">а не межа зміни моделі</tspan></text><rect x="620.0" y="66.0" width="550.0" height="400.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="895.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Намір урвався → rollback</text><text x="1090.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">перевірка не пропустила</text><rect x="668.0" y="137.0" width="64.0" height="34.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle"><tspan x="700.0" dy="0.0">r₀</tspan></text><rect x="798.0" y="137.0" width="64.0" height="34.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle"><tspan x="830.0" dy="0.0">r₁</tspan></text><line x1="736.0" y1="154.0" x2="794.0" y2="154.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="928.0" y="137.0" width="64.0" height="34.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle"><tspan x="960.0" dy="0.0">r₂</tspan></text><line x1="866.0" y1="154.0" x2="924.0" y2="154.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1058.0" y="137.0" width="64.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1090.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle"><tspan x="1090.0" dy="0.0">✖</tspan></text><line x1="996.0" y1="154.0" x2="1054.0" y2="154.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="1090.0" y1="188.0" x2="700.0" y2="188.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="895.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="895.0" dy="0.0">root = base — одне присвоєння;</tspan><tspan x="895.0" dy="16.9">усе побудоване стає сміттям</tspan></text><rect x="660.0" y="268.0" width="470.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="895.0" y="307.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">в історію не лягає НІЧОГО:</tspan><tspan x="895.0" dy="16.9">напіврозпочатий крок гірший за його відсутність</tspan></text><text x="895.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="895.0" dy="0.0">у C++ це робить деструктор,</tspan><tspan x="895.0" dy="16.9">у TypeScript — finally</tspan></text>
</svg>