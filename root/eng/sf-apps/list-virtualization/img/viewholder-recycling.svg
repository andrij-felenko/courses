<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл перевикористання DOM-вузлів (Recycling / ViewHolder)</text>
<rect x="50.0" y="70.0" width="360.0" height="490.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="230.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віртуальне вікно списку</text>
<rect x="70.0" y="120.0" width="320.0" height="60.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="230.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Вузол A: Item 0 (Виходить за буфер)</text>
<text x="230.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Старий контент: «Запис #0»</text>
<rect x="70.0" y="195.0" width="320.0" height="60.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="230.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол B: Item 1 (Видимий)</text>
<text x="230.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Контент: «Запис #1»</text>
<rect x="70.0" y="265.0" width="320.0" height="60.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="230.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол C: Item 2 (Видимий)</text>
<text x="230.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Контент: «Запис #2»</text>
<rect x="70.0" y="335.0" width="320.0" height="60.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="230.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол D: Item 3 (Видимий)</text>
<text x="230.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Контент: «Запис #3»</text>
<rect x="70.0" y="410.0" width="320.0" height="60.0" rx="4" fill="#e6f0fa" stroke="#2457d6" stroke-width="2.0"/>
<text x="230.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Нова позиція для Item 4</text>
<text x="230.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Потрібен DOM-вузол знизу!</text>
<line x1="30.0" y1="250.0" x2="30.0" y2="380.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="25.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Скрол</text>
<text x="25.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">вниз</text>
<rect x="460.0" y="160.0" width="180.0" height="260.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.0"/>
<text x="550.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">ПУЛ ВУЗЛІВ</text>
<text x="550.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle">(Recycler Pool)</text>
<rect x="480.0" y="240.0" width="140.0" height="60.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="550.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вільний вузол A</text>
<text x="550.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(не знищується)</text>
<rect x="480.0" y="320.0" width="140.0" height="60.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="550.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вільний вузол E</text>
<text x="550.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">в очікуванні</text>
<line x1="390.0" y1="150.0" x2="460.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="435.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Відкріплення</text>
<line x1="550.0" y1="420.0" x2="550.0" y2="470.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="550.0" y1="470.0" x2="390.0" y2="450.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Переміщення вниз + підстановка даних</text>
<rect x="680.0" y="90.0" width="300.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Чому не create/destroy:</tspan><tspan x="830.0" dy="15.6">• Створення DOM-вузла коштує ~10–50 мкс</tspan><tspan x="830.0" dy="15.6">• Знищення породжує сміття в пам'яті</tspan><tspan x="830.0" dy="15.6">• Збирач сміття (GC) викликає мікрофризи</tspan><tspan x="830.0" dy="15.6">• Перевикористання тримає пул сталим</tspan></text>
<rect x="680.0" y="240.0" width="300.0" height="150.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Фаза прив'язки (onBind / Patch):</tspan><tspan x="830.0" dy="16.9">1. Зміна тексту та атрибутів вузла</tspan><tspan x="830.0" dy="16.9">2. Оновлення CSS transform (зміщення)</tspan><tspan x="830.0" dy="16.9">3. Повна відсутність видалення з DOM</tspan><tspan x="830.0" dy="16.9">4. Вузол миттєво готовий до показу</tspan></text>
<rect x="680.0" y="410.0" width="300.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="830.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Пастка втрати стану:</tspan><tspan x="830.0" dy="15.6">• Внутрішній стан форми (input focus)</tspan><tspan x="830.0" dy="15.6">• Незавершені CSS-анімації</tspan><tspan x="830.0" dy="15.6">• Фокус клавіатури злітає при ресайклінгу</tspan><tspan x="830.0" dy="15.6">• Потрібне скидання або явне збереження</tspan></text>
</svg>