<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійна диспетчеризація: вибір за двома типами</text>
<text x="590.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">один віртуальний виклик обирає за одним типом — тут потрібні два</text>
<rect x="55.0" y="210.1" width="190.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="150.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">клієнт кличе</tspan><tspan x="150.0" dy="16.9">s.accept(v)</tspan></text>
<text x="150.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">s: Shape — підтип ?</text>
<text x="150.0" y="295.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">v: Visitor — підтип ?</text>
<rect x="425.0" y="210.6" width="270.0" height="48.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="560.0" y="231.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Circle.accept(v)</tspan><tspan x="560.0" dy="16.2">→ v.visitCircle(this)</tspan></text>
<text x="560.0" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">обрано за типом фігури</text>
<rect x="425.0" y="336.2" width="270.0" height="47.6" rx="6" fill="#eef1f4" stroke="#c2c8d0" stroke-width="1.4"/><text x="560.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">Rectangle.accept(v)</tspan><tspan x="560.0" dy="15.6">…</tspan></text>
<rect x="425.0" y="446.2" width="270.0" height="47.6" rx="6" fill="#eef1f4" stroke="#c2c8d0" stroke-width="1.4"/><text x="560.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">Triangle.accept(v)</tspan><tspan x="560.0" dy="15.6">…</tspan></text>
<text x="560.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">інші гілки accept — не обрані цим викликом</text>
<rect x="815.0" y="202.5" width="260.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.2"/><text x="945.0" y="223.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">AreaVisitor</tspan><tspan x="945.0" dy="16.2">visitCircle(c):</tspan><tspan x="945.0" dy="16.2">return π · c.r²</tspan></text>
<text x="945.0" y="190.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">обрано за типом візитора</text>
<rect x="815.0" y="368.4" width="260.0" height="63.2" rx="6" fill="#eef1f4" stroke="#c2c8d0" stroke-width="1.4"/><text x="945.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="945.0" dy="0.0">SvgVisitor</tspan><tspan x="945.0" dy="15.6">visitCircle(c):</tspan><tspan x="945.0" dy="15.6">return &lt;circle…&gt;</tspan></text>
<text x="945.0" y="449.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">інша операція — не обрана</text>
<line x1="251.0" y1="235.0" x2="419.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="335.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">① за типом ФІГУРИ</text>
<text x="335.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(accept — віртуальний)</text>
<line x1="701.0" y1="235.0" x2="809.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="755.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">② тип ВІЗИТОРА</text>
<text x="755.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(visit — віртуальний)</text>
<line x1="40.0" y1="562.0" x2="1140.0" y2="562.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="590.0" y="588.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">два віртуальні виклики поспіль обрали метод за ДВОМА типами — це подвійна диспетчеризація</text>
</svg>