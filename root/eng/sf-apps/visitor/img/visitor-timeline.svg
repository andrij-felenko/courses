<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три нитки, що сплелися у Відвідувача: хроніка</text>
<text x="560.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">механізм старший за патерн (1986), а його ціна дістала ім'я пізніше (1998)</text>
<circle cx="150.0" cy="88.0" r="6.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="164.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">механізм: подвійна диспетчеризація</text>
<circle cx="500.0" cy="88.0" r="6.0" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="514.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">рідна множинна диспетчеризація</text>
<circle cx="850.0" cy="88.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="864.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ціна: проблема вираження</text>
<line x1="178.0" y1="142.0" x2="178.0" y2="718.0" stroke="#c2c8d0" stroke-width="2.6"/>
<line x1="188.0" y1="142.0" x2="235.0" y2="142.0" stroke="#c0392b" stroke-width="1.6"/>
<rect x="240.0" y="116.0" width="816.0" height="51.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="648.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">Джон Рейнольдс: типи-АТД ⟷ процедурні дані — два додатки до абстракції.</tspan><tspan x="648.0" dy="16.9">Зерно майбутньої дилеми «легко типи ⟷ легко операції».</tspan></text>
<circle cx="178.0" cy="142.0" r="8.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="158.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1975</text>
<line x1="188.0" y1="238.0" x2="235.0" y2="238.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="240.0" y="212.1" width="816.0" height="51.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="648.0" y="234.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">Ден Інгаллс, «multiple polymorphism»: подвійна диспетчеризація у Smalltalk</tspan><tspan x="648.0" dy="16.9">на арифметиці різнотипних чисел — механізм за вісім років до патерна.</tspan></text>
<circle cx="178.0" cy="238.0" r="8.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="158.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1986</text>
<line x1="188.0" y1="334.0" x2="235.0" y2="334.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="240.0" y="308.1" width="816.0" height="51.9" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.8"/><text x="648.0" y="330.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">CommonLoops (Xerox PARC), та сама конференція: у Lisp множинна</tspan><tspan x="648.0" dy="16.9">диспетчеризація рідна — мовам із нею відвідувач не потрібен.</tspan></text>
<circle cx="178.0" cy="334.0" r="8.0" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="158.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1986</text>
<line x1="188.0" y1="430.0" x2="235.0" y2="430.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="240.0" y="404.1" width="816.0" height="51.9" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.8"/><text x="648.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">CLOS вносить мультиметоди у стандарт Common Lisp: диспетч за</tspan><tspan x="648.0" dy="16.9">всіма аргументами без жодного accept/visit.</tspan></text>
<circle cx="178.0" cy="430.0" r="8.0" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="158.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1988</text>
<line x1="192.0" y1="526.0" x2="235.0" y2="526.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="240.0" y="500.1" width="816.0" height="51.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="648.0" y="522.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">«Design Patterns»: прийом дістає ім'я «Відвідувач» і дім — дерево</tspan><tspan x="648.0" dy="16.9">компілятора. Механізм — Інгаллсів; ім'я й роль — банди чотирьох.</tspan></text>
<circle cx="178.0" cy="526.0" r="12.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="178.0" cy="526.0" r="16.0" fill="none" stroke="#2457d6" stroke-width="1.6"/>
<text x="154.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1994</text>
<line x1="192.0" y1="622.0" x2="235.0" y2="622.0" stroke="#c0392b" stroke-width="1.6"/>
<rect x="240.0" y="596.0" width="816.0" height="51.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="648.0" y="618.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">Філіп Вадлер: «проблема вираження» — ціну відвідувача нарешті названо.</tspan><tspan x="648.0" dy="16.9">«Нова назва старої задачі»; корінь — Рейнольдс, 1975.</tspan></text>
<circle cx="178.0" cy="622.0" r="12.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="178.0" cy="622.0" r="16.0" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<text x="154.0" y="626.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1998</text>
<line x1="188.0" y1="718.0" x2="235.0" y2="718.0" stroke="#c0392b" stroke-width="1.6"/>
<rect x="240.0" y="692.0" width="816.0" height="51.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="648.0" y="714.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">Бухловський і Тілеке: відвідувач ≈ згортка (катаморфізм) — той самий</tspan><tspan x="648.0" dy="16.9">обхід дерева, лише без церемоній accept/visit. Дзеркало у ФП.</tspan></text>
<circle cx="178.0" cy="718.0" r="8.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="158.0" y="722.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2005</text>
<line x1="60.0" y1="754.0" x2="1060.0" y2="754.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="560.0" y="778.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1994 — три нитки сходяться в патерні; 1998 — найглибшій із них, ціні, дають ім'я</text>
</svg>