<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інваріант lo ≤ hi зробити наслідком форми даних</text>
<polygon points="80.0,80.0 280.0,80.0 80.0,280.0" fill="#eafaf1" stroke="none"/>
<polygon points="280.0,80.0 280.0,280.0 80.0,280.0" fill="#fdecea" stroke="none"/>
<rect x="80.0" y="80.0" width="200.0" height="200.0" rx="6" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="80.0" y1="280.0" x2="280.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="140.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">hi ≥ lo</tspan><tspan x="140.0" dy="15.6">легально</tspan></text>
<text x="222.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="222.0" dy="0.0">hi &lt; lo</tspan><tspan x="222.0" dy="15.6">незаконно</tspan></text>
<text x="66.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">hi ↑</text>
<text x="180.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">lo →</text>
<text x="180.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">struct { lo, hi } — пів-квадрата незаконне</text>
<rect x="520.0" y="80.0" width="200.0" height="200.0" rx="6" fill="#eafaf1" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="620.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">будь-яке (lo, len)</tspan><tspan x="620.0" dy="15.6">hi = lo + len ≥ lo</tspan></text>
<text x="620.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">lo →</text>
<text x="620.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">struct { lo, len } — незаконного нема</text>
<line x1="300.0" y1="180.0" x2="500.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="352.8" y="126.2" width="94.4" height="47.6" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="400.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">переписати</tspan><tspan x="400.0" dy="15.6">подання</tspan></text>
