<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де живе гарантія інваріанта</text>
<rect x="130.0" y="62.0" width="540.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="88.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Перевіряти всюди</tspan><tspan x="400.0" dy="16.9">доказ ніде не живе — кожне місце боронить себе саме</tspan></text>
<rect x="130.0" y="138.0" width="540.0" height="60.0" rx="6" fill="#fff6e6" stroke="#c07a00" stroke-width="1.5"/><text x="400.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Розумний конструктор</tspan><tspan x="400.0" dy="16.9">доказ в одній точці входу; далі його носить сам тип</tspan></text>
<rect x="130.0" y="214.0" width="540.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="240.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Структурно неможливо</tspan><tspan x="400.0" dy="16.9">незаконне не має форми взагалі — нема чого доводити</tspan></text>
<rect x="130.0" y="290.0" width="540.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Уточнені / залежні типи</tspan><tspan x="400.0" dy="16.9">систему типів змушено довести інваріант — ціною складності</tspan></text>
<line x1="80.0" y1="74.0" x2="80.0" y2="356.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="80.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">слабше</text>
<text x="80.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сильніше</text>
</svg>