<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві породи ланцюга: хто зупиняє рух</text>
<text x="255.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">перший, хто може — бере</text>
<text x="785.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">кожен додає своє</text>
<line x1="520.0" y1="45.0" x2="520.0" y2="395.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="125.0" y="90.0" width="260.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="118.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Ланка 1</tspan><tspan x="255.0" dy="16.9">не моє → далі</tspan></text>
<line x1="255.0" y1="154.0" x2="255.0" y2="178.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="125.0" y="180.0" width="260.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="208.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Ланка 2</tspan><tspan x="255.0" dy="16.9">моє! → бере, зупиняє</tspan></text>
<text x="255.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">рух зупинився тут</text>
<rect x="125.0" y="270.0" width="260.0" height="64.0" rx="6" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="298.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Ланка 3</tspan><tspan x="255.0" dy="16.9">не бачить запиту</tspan></text>
<text x="255.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">приклади: погодження, обробка винятків</text>
<rect x="655.0" y="90.0" width="260.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="118.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Ланка 1</tspan><tspan x="785.0" dy="16.9">робить своє → далі</tspan></text>
<line x1="785.0" y1="154.0" x2="785.0" y2="178.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="655.0" y="180.0" width="260.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="208.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Ланка 2 · перевірка прав</tspan><tspan x="785.0" dy="15.6">звично → далі; інколи → обрив</tspan></text>
<line x1="785.0" y1="244.0" x2="785.0" y2="268.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="655.0" y="270.0" width="260.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="298.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Ланка 3</tspan><tspan x="785.0" dy="16.9">серцевина застосунку</tspan></text>
<line x1="915.0" y1="212.0" x2="938.0" y2="212.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="978.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">інколи</text>
<rect x="938.0" y="190.0" width="90.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="983.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="983.0" dy="0.0">обрив!</tspan></text>
<text x="785.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">приклади: логування, middleware</text>
<text x="520.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обидві породи — той самий каркас: різниця лише в одному рішенні всередині ланки.</text>
</svg>