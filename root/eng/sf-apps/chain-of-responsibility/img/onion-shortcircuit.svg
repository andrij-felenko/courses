<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коротке замикання: auth не кличе next() — і суть не бачить запиту</text>
<rect x="70.0" y="64.0" width="840.0" height="470.0" rx="10" fill="#f7f9fb" stroke="#333333" stroke-width="2.0"/>
<rect x="155.0" y="116.0" width="670.0" height="366.0" rx="10" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="240.0" y="168.0" width="500.0" height="262.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<rect x="325.0" y="220.0" width="330.0" height="158.0" rx="10" fill="#f0f0f0" stroke="#6b7280" stroke-width="2.2"/>
<text x="387.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700"><tspan x="387.0" dy="0.0">суть НЕ виконалася —</tspan><tspan x="387.0" dy="16.9">auth не покликав next()</tspan></text>
<circle cx="96.0" cy="90.0" r="12.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/><text x="96.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<text x="132.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">logger · запам'ятовує монотонний час t₀</text>
<circle cx="181.0" cy="142.0" r="12.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/><text x="181.0" y="146.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<text x="217.0" y="146.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">rateLimit · рахує цей запит — квота витрачена ВЖЕ ТУТ</text>
<circle cx="266.0" cy="194.0" r="12.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><text x="266.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3</text>
<text x="302.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">auth · токена нема → 401, next() НЕ кличемо</text>
<text x="302.0" y="408.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">auth · сюди керування не повертається</text>
<circle cx="181.0" cy="456.0" r="12.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/><text x="181.0" y="460.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">4</text>
<text x="217.0" y="460.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">rateLimit · після next() роботи не має</text>
<circle cx="96.0" cy="508.0" r="12.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/><text x="96.0" y="512.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">5</text>
<text x="132.0" y="512.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">logger · друкує «GET /profile → 401 за 0.0 мс» — лог однаково є</text>
<line x1="108.8" y1="97.8" x2="168.2" y2="134.2" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="193.8" y1="149.8" x2="253.2" y2="186.2" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="261.4" y1="208.3" x2="185.6" y2="441.7" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="168.2" y1="463.8" x2="108.8" y2="500.2" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">вниз — код ДО next()</text>
<text x="700.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">вгору — зовнішні ланки доробляють своє</text>
<text x="490.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Замикання відрізає лише те, що ГЛИБШЕ: зовнішні шари свою другу половину однаково відпрацюють.</text>
</svg>