<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1075 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1075" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="537.5" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Unibus: правило «не моє — передай сусідові», зашите в мідь</text>
<rect x="40.0" y="110.0" width="140.0" height="125.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">процесор</tspan><tspan x="110.0" dy="16.9">(арбітр)</tspan><tspan x="110.0" dy="16.9"></tspan><tspan x="110.0" dy="16.9">видає BG,</tspan><tspan x="110.0" dy="16.9">не знає кому</tspan></text>
<rect x="215.0" y="110.0" width="140.0" height="125.0" rx="8" fill="#f7f9fb" stroke="#333333" stroke-width="2.0"/>
<text x="285.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="700">диск</text>
<text x="285.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">не просив —</text>
<text x="285.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">повторює сигнал</text>
<rect x="380.0" y="110.0" width="140.0" height="125.0" rx="8" fill="#f0f0f0" stroke="#6b7280" stroke-width="2.0"/>
<text x="450.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">порожній слот</text>
<text x="450.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">перемичка G727:</text>
<text x="450.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">тільки пропускає</text>
<rect x="545.0" y="110.0" width="140.0" height="125.0" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="615.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">термінал</text>
<text x="615.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ПРОСИВ → бере</text>
<text x="615.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">далі не пускає</text>
<rect x="710.0" y="110.0" width="140.0" height="125.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="780.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">принтер</text>
<text x="780.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">теж просив, але</text>
<text x="780.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">сигналу не бачить</text>
<rect x="875.0" y="110.0" width="140.0" height="125.0" rx="8" fill="#f7f9fb" stroke="#6b7280" stroke-width="2.0"/>
<text x="945.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">стрічка</text>
<text x="945.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">не просила</text>
<text x="945.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">і не дізнається</text>
<line x1="180.0" y1="172.0" x2="213.0" y2="172.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="197.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">BG</text>
<line x1="215.0" y1="172.0" x2="355.0" y2="172.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="355.0" y1="172.0" x2="378.0" y2="172.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="380.0" y1="172.0" x2="520.0" y2="172.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="520.0" y1="172.0" x2="543.0" y2="172.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="545.0" y1="172.0" x2="612.0" y2="172.0" stroke="#2457d6" stroke-width="2.4"/>
<circle cx="612.0" cy="172.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<line x1="612.0" y1="172.0" x2="1015.0" y2="172.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="838.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сюди BG не доходить ніколи</text>
<line x1="1015.0" y1="292.0" x2="110.0" y2="292.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="612.0" y1="235.0" x2="612.0" y2="292.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="780.0" y1="235.0" x2="780.0" y2="292.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="110.0" y1="292.0" x2="110.0" y2="237.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="430.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">BR — один дріт на всіх: процесор чує, що хтось просив, і не чує хто</text>
<text x="537.5" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Гірлянда відповідає на «хто?» без арбітра: перший, хто просив, забирає сигнал і далі не пускає.</text>
<text x="537.5" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Порожній слот РОЗРИВАЄ ланцюг — тому туди ставлять перемичку, чия єдина робота — передати далі.</text>
</svg>