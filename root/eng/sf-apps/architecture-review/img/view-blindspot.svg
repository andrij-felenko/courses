<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рев'ю бачить лише те, що показує в'ю</text>
<rect x="90.1" y="181.4" width="119.8" height="67.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="203.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">сценарій:</tspan><tspan x="150.0" dy="15.6">стоп під піком</tspan><tspan x="150.0" dy="15.6">телеметрії</tspan></text>
<rect x="408.8" y="94.2" width="222.4" height="51.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">в'ю ПОКАЗУЄ спільну чергу</tspan><tspan x="520.0" dy="15.6">(динамічний в'ю потоку даних)</tspan></text>
<rect x="419.1" y="289.2" width="201.8" height="51.6" rx="6" fill="#edeff1" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="520.0" dy="0.0">в'ю ХОВАЄ чергу</tspan><tspan x="520.0" dy="15.6">(лише статичні контейнери)</tspan></text>
<rect x="791.5" y="95.2" width="141.0" height="49.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="862.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="862.0" dy="0.0">вада на світлі —</tspan><tspan x="862.0" dy="15.6">ловиться</tspan></text>
<rect x="798.9" y="290.2" width="126.2" height="49.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="862.0" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="862.0" dy="0.0">сценарій хибно</tspan><tspan x="862.0" dy="15.6">«проходить»</tspan></text>
<line x1="209.9" y1="192.0" x2="408.8" y2="134.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="209.9" y1="238.0" x2="419.1" y2="302.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="631.2" y1="120.0" x2="791.5" y2="120.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.9" y1="315.0" x2="798.9" y2="315.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">той самий сценарій, різні в'ю — вада ловиться лише там, де в'ю її показує</text>
</svg>