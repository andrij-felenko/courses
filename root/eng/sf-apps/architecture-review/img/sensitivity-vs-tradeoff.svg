<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один гвинтик і один атрибут — чутливість; той самий гвинтик і два навхрест — компроміс</text>
<line x1="450.0" y1="74.0" x2="450.0" y2="398.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,5"/>
<text x="225.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Точка ЧУТЛИВОСТІ</text>
<text x="675.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Точка КОМПРОМІСУ</text>
<rect x="143.6" y="116.5" width="162.8" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">розмір пулу потоків</tspan></text>
<rect x="137.4" y="282.5" width="175.1" height="35.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">пропускна здатність</tspan></text>
<line x1="225.0" y1="151.5" x2="225.0" y2="282.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">один гвинтик → один атрибут</text>
<text x="225.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">не крутити наосліп</text>
<rect x="589.9" y="116.5" width="170.2" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">синхронна копія бази</tspan></text>
<rect x="524.4" y="284.0" width="109.3" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="579.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="579.0" dy="0.0">надійність ↑</tspan></text>
<rect x="712.6" y="284.0" width="116.7" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="771.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="771.0" dy="0.0">латентність ↑</tspan></text>
<line x1="675.0" y1="151.5" x2="579.0" y2="284.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="675.0" y1="151.5" x2="771.0" y2="284.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="675.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">один гвинтик → ДВА атрибути навхрест</text>
<text x="675.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">не виграти все — обрати жертву</text>
</svg>