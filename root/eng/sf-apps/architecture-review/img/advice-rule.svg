<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="295.4" y="45.0" width="349.2" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="70.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">будь-хто ухвалює архітектурне рішення</tspan></text>
<rect x="316.9" y="131.5" width="306.1" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">⟺ лише якщо СПЕРШУ спитав пораду в:</tspan></text>
<line x1="470.0" y1="87.0" x2="470.0" y2="131.5" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180.3" y="227.1" width="157.4" height="53.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="259.0" y="250.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="259.0" dy="0.0">усіх, кого рішення</tspan><tspan x="259.0" dy="16.9">суттєво зачепить</tspan></text>
<rect x="606.0" y="227.1" width="150.0" height="53.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="681.0" y="250.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="681.0" dy="0.0">усіх, хто має фах</tspan><tspan x="681.0" dy="16.9">у цій царині</tspan></text>
<line x1="424.0" y1="168.5" x2="259.0" y2="227.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="516.0" y1="168.5" x2="681.0" y2="227.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="168.3" y="338.4" width="181.3" height="67.2" rx="6" fill="#fdf6ee" stroke="#6b7280" stroke-width="1.5"/><text x="259.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="259.0" dy="0.0">порада — НЕ дозвіл:</tspan><tspan x="259.0" dy="15.6">слухай і зваж,</tspan><tspan x="259.0" dy="15.6">рішення лишається твоїм</tspan></text>
<rect x="586.9" y="338.4" width="188.2" height="67.2" rx="6" fill="#fdf6ee" stroke="#6b7280" stroke-width="1.5"/><text x="681.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="681.0" dy="0.0">рішення записане</tspan><tspan x="681.0" dy="15.6">(архітектурний запис),</tspan><tspan x="681.0" dy="15.6">разом із почутою порадою</tspan></text>
<line x1="259.0" y1="280.9" x2="259.0" y2="338.4" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="681.0" y1="280.9" x2="681.0" y2="338.4" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>