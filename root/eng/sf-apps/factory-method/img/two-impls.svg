<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="590.0" y1="92.0" x2="590.0" y2="530.0" stroke="#d0d5db" stroke-width="1.2" stroke-dasharray="6,6"/>
<text x="296.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Класична: клас на кожну родину</text>
<text x="296.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">родина — це ТИП; N класів, метод на кожен вид</text>
<rect x="171.0" y="110.6" width="250.0" height="78.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="296.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="296.0" dy="0.0">«DbFactory» — інтерфейс</tspan><tspan x="296.0" dy="15.6">createConnection()</tspan><tspan x="296.0" dy="15.6">createCommand()</tspan><tspan x="296.0" dy="15.6">createTransaction()</tspan></text>
<line x1="296.0" y1="192.0" x2="206.0" y2="252.0" stroke="#2457d6" stroke-width="1.3"/>
<rect x="117.0" y="255.1" width="178.0" height="73.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="206.0" y="274.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="206.0" dy="0.0">PostgresFactory</tspan><tspan x="206.0" dy="14.3">new PgConnection</tspan><tspan x="206.0" dy="14.3">new PgCommand</tspan><tspan x="206.0" dy="14.3">new PgTransaction</tspan></text>
<line x1="296.0" y1="192.0" x2="386.0" y2="252.0" stroke="#2457d6" stroke-width="1.3"/>
<rect x="297.0" y="255.1" width="178.0" height="73.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="386.0" y="274.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="386.0" dy="0.0">MySqlFactory</tspan><tspan x="386.0" dy="14.3">new MyConnection</tspan><tspan x="386.0" dy="14.3">new MyCommand</tspan><tspan x="386.0" dy="14.3">new MyTransaction</tspan></text>
<text x="296.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">…і так на КОЖНУ СУБД (SQLite, Oracle, …)</text>
<text x="296.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">один клас = вся родина однієї СУБД, зшита ТИПАМИ</text>
<text x="296.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нова СУБД → +1 клас;  новий ВИД → метод у КОЖЕН клас</text>
<text x="884.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Прототипна: один клас + реєстр</text>
<text x="884.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">родина — це ДАНІ; продукти клонуємо зі взірців</text>
<rect x="724.0" y="118.4" width="320.0" height="63.2" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="884.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="884.0" dy="0.0">PrototypeFactory — ОДИН клас</tspan><tspan x="884.0" dy="15.6">create(kind):</tspan><tspan x="884.0" dy="15.6">    return registry[kind].clone()</tspan></text>
<line x1="884.0" y1="183.0" x2="884.0" y2="258.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="719.0" y="253.1" width="330.0" height="73.9" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.4"/><text x="884.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="884.0" dy="0.0">реєстр прототипів = Postgres</tspan><tspan x="884.0" dy="14.3">connection → PgConnection</tspan><tspan x="884.0" dy="14.3">command → PgCommand</tspan><tspan x="884.0" dy="14.3">transaction → PgTransaction</tspan></text>
<line x1="694.0" y1="327.0" x2="694.0" y2="383.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="884.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">▼ підмінити НАБІР — той самий клас, інша СУБД</text>
<rect x="719.0" y="381.1" width="330.0" height="73.9" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.4"/><text x="884.0" y="400.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="884.0" dy="0.0">реєстр прототипів = MySQL</tspan><tspan x="884.0" dy="14.3">connection → MyConnection</tspan><tspan x="884.0" dy="14.3">command → MyCommand</tspan><tspan x="884.0" dy="14.3">transaction → MyTransaction</tspan></text>
<text x="884.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 клас; яку СУБД брати — вирішують ДАНІ реєстру</text>
<text x="884.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">але узгодженість родини тепер тримають дані, не типи</text>
</svg>