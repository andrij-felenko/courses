<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Opaque handle: клієнт бачить лише вказівник, поля сховані в .c</text>
<rect x="60.0" y="66.0" width="330.0" height="300.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="225.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">sensor.h  (бачить клієнт)</text>
<rect x="78.0" y="108.0" width="294.0" height="30.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="225.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">typedef struct sensor sensor_t;</text>
<rect x="78.0" y="188.0" width="294.0" height="30.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="225.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">sensor_t *sensor_open(int pin);</text>
<rect x="78.0" y="228.0" width="294.0" height="30.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="225.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">float sensor_read(sensor_t *s);</text>
<rect x="78.0" y="268.0" width="294.0" height="30.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="225.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">void sensor_close(sensor_t *s);</text>
<text x="225.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">неповний тип: розмір і поля невідомі —</text>
<text x="225.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">лише вказівник, дерефом не дотягнешся</text>
<rect x="470.0" y="66.0" width="330.0" height="300.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="635.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">sensor.c  (сховане нутро)</text>
<text x="635.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">struct sensor {</text>
<rect x="500.0" y="126.0" width="270.0" height="28.0" rx="5" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.1"/>
<text x="635.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">int   pin;</text>
<rect x="500.0" y="164.0" width="270.0" height="28.0" rx="5" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.1"/>
<text x="635.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">float scale, offset;</text>
<rect x="500.0" y="202.0" width="270.0" height="28.0" rx="5" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.1"/>
<text x="635.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">uint16_t buf[64];  // кеш</text>
<rect x="500.0" y="240.0" width="270.0" height="28.0" rx="5" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.1"/>
<text x="635.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">uint32_t last_us;</text>
<text x="635.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">};</text>
<text x="635.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">переставляй, додавай, викидай поля —</text>
<text x="635.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">заголовок не змінюється, клієнт не перезбирається</text>
<line x1="392.0" y1="216.0" x2="468.0" y2="216.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">лише *</text>
<text x="430.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ширина схованого = міра свободи міняти нутро без перезбирання клієнтів.</text>
</svg>