<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один закон, троє й через півстоліття: межа переживає реалізацію</text>
<line x1="90.0" y1="150.0" x2="890.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="860.0" y1="150.0" x2="890.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="890.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">час</text>
<circle cx="245.0" cy="150.0" r="6.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="245.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">1972</text>
<line x1="245.0" y1="156.0" x2="245.0" y2="192.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,4"/>
<rect x="121.0" y="192.0" width="248.0" height="152.0" rx="10" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.7"/>
<text x="245.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Девід Парнас</text>
<text x="245.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">НАВІЩО межа</text>
<line x1="139.0" y1="252.0" x2="351.0" y2="252.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="245.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ділити за прихованим</text>
<text x="245.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">рішенням, не за потоком;</text>
<text x="245.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">інтерфейс виказує мінімум</text>
<circle cx="500.0" cy="150.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<text x="500.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">2006</text>
<line x1="500.0" y1="156.0" x2="500.0" y2="192.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3,4"/>
<rect x="376.0" y="192.0" width="248.0" height="152.0" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.7"/>
<text x="500.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джошуа Блох</text>
<text x="500.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">ЯК її проектувати</text>
<line x1="394.0" y1="252.0" x2="606.0" y2="252.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="500.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">усі ми — проектувальники API;</text>
<text x="500.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">публічне API — назавжди;</text>
<text x="500.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">додати можна, забрати — ні</text>
<circle cx="760.0" cy="150.0" r="6.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.6"/>
<text x="760.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">2016</text>
<line x1="760.0" y1="156.0" x2="760.0" y2="192.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,4"/>
<rect x="636.0" y="192.0" width="248.0" height="152.0" rx="10" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.7"/>
<text x="760.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Річ Гікі</text>
<text x="760.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">ЩО робити при зміні</text>
<line x1="654.0" y1="252.0" x2="866.0" y2="252.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="760.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">нарощування проти ламання;</text>
<text x="760.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">вимагай менше / давай більше;</text>
<text x="760.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">зламав — зробив іншу річ</text>
<rect x="90.0" y="402.0" width="800.0" height="46.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="428.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Спільний стрижень: межа коду — оприлюднене рішення, що переживає свою реалізацію, і тихо забрати його назад не можна.</tspan></text>
</svg>