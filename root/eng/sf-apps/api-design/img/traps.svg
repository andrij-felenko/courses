<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тихий злом: поле в середину — зсуви «пливуть», старий клієнт читає не те</text>
<text x="190.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">чого чекає v1-клієнт</text>
<rect x="90.0" y="82.0" width="200.0" height="30.0" rx="5" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.3"/>
<text x="190.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">pin   @0</text>
<text x="78.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">0</text>
<rect x="90.0" y="118.0" width="200.0" height="30.0" rx="5" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.3"/>
<text x="190.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">rate  @4</text>
<text x="78.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">4</text>
<rect x="90.0" y="154.0" width="200.0" height="30.0" rx="5" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.3"/>
<text x="190.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">gain  @8</text>
<text x="78.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">8</text>
<text x="190.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">читає gain за зсувом 8</text>
<text x="510.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">бібліотека вставила поле в СЕРЕДИНУ</text>
<rect x="410.0" y="82.0" width="200.0" height="30.0" rx="5" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="510.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">pin    @0</text>
<text x="398.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">0</text>
<rect x="410.0" y="118.0" width="200.0" height="30.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="510.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">mode  @4  ← нове</text>
<text x="398.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">4</text>
<rect x="410.0" y="154.0" width="200.0" height="30.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="510.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">rate   @8</text>
<text x="398.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">8</text>
<rect x="410.0" y="190.0" width="200.0" height="30.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="510.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">gain  @12</text>
<text x="398.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">12</text>
<text x="510.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">gain з'їхав на 12 — клієнт</text>
<text x="510.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">за зсувом 8 бере rate</text>
<line x1="300.0" y1="150.0" x2="406.0" y2="150.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="353.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">той самий</text>
<text x="353.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">заголовок?</text>
<text x="70.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="90.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Зсув поля = сума розмірів усього ДО нього: посунув одне — «попливло» все нижче.</text>
<text x="70.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="90.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Тихо змінив зміст (ті самі байти означають інше) — компілятор мовчить, поведінка бреше.</text>
<text x="70.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">•</text>
<text x="90.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Правило: нове поле — тільки в КІНЕЦЬ; порядок і зміст наявних не чіпати ніколи.</text>
</svg>