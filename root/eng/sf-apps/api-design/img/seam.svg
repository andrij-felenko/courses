<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">API — це шов: видиме публічне тримає обіцянку, приховане вільне</text>
<rect x="60.0" y="70.0" width="300.0" height="250.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="210.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">видиме назовні (API)</text>
<text x="210.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">обіцянка тим, хто викликає</text>
<rect x="80.0" y="140.0" width="260.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="210.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">open(path) -&gt; Handle</text>
<rect x="80.0" y="186.0" width="260.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="210.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">read(Handle, buf, n)</text>
<rect x="80.0" y="232.0" width="260.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="210.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">close(Handle)</text>
<text x="210.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">мінятимеш — ламаєш чужий код</text>
<rect x="460.0" y="70.0" width="300.0" height="250.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="610.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">приховане (реалізація)</text>
<text x="610.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">твоя приватна свобода</text>
<rect x="480.0" y="140.0" width="260.0" height="36.0" rx="6" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="610.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">буфер, кеш, блокування</text>
<rect x="480.0" y="186.0" width="260.0" height="36.0" rx="6" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="610.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">структура File усередині</text>
<rect x="480.0" y="232.0" width="260.0" height="36.0" rx="6" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="610.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">алгоритм читання з диска</text>
<text x="610.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">переписуй будь-коли — ніхто не помітить</text>
<line x1="410.0" y1="74.0" x2="410.0" y2="316.0" stroke="#1a1a1a" stroke-width="2.2" stroke-dasharray="7,5"/>
<text x="410.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">рівно по цій лінії проходить рішення: що обіцяти, а що лишити собі</text>
</svg>