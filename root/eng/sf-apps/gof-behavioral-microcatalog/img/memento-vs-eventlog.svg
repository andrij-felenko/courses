<text x="490.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Класичний обмін «пам'ять проти обчислення»: Знімок платить місцем за миттєвість, журнал — часом за компактність.</text>
