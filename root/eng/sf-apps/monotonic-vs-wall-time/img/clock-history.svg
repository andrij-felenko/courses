<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 894" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="894" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стрічка подій: як монотонний час став окремою сутністю</text>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як два годинники розділилися: ланцюг подій</text>
<rect x="103.1" y="56.0" width="122.7" height="28.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="164.5" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">передісторія</text>
<rect x="243.9" y="56.0" width="211.4" height="28.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="349.5" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">збій, за який заплатили</text>
<rect x="473.2" y="56.0" width="243.6" height="28.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/>
<text x="595.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">відповідь мови чи стандарту</text>
<line x1="208.0" y1="102.0" x2="208.0" y2="858.0" stroke="#c8ccd2" stroke-width="3.0"/>
<text x="180.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">1971</text>
<circle cx="208.0" cy="138.0" r="6.5" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.4"/>
<rect x="236.0" y="109.1" width="498.8" height="57.8" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="246.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="246.0" dy="0.0">Unix: time() рахує 1/60 секунди від 1 січня 1971 у 32 бітах.</tspan><tspan x="246.0" dy="18.9">Годинник один — переставляти його нікому, крім оператора.</tspan></text>
<text x="180.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1985</text>
<circle cx="208.0" cy="214.0" r="6.5" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<rect x="236.0" y="185.1" width="419.0" height="57.8" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="246.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="246.0" dy="0.0">RFC 958, Девід Міллз: NTP підганяє годинник темпом</tspan><tspan x="246.0" dy="18.9">або миттєвим стрибком. Настінний час став рухомим.</tspan></text>
<text x="180.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1993—2001</text>
<circle cx="208.0" cy="290.0" r="6.5" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<rect x="236.0" y="261.1" width="530.7" height="57.8" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="246.0" y="285.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="246.0" dy="0.0">POSIX: clock_gettime із реалтайм-розширень, далі CLOCK_MONOTONIC</tspan><tspan x="246.0" dy="18.9">— але як необов'язкова опція реалізації.</tspan></text>
<text x="180.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">2004</text>
<circle cx="208.0" cy="366.0" r="6.5" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<rect x="236.0" y="337.1" width="458.9" height="57.8" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="246.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="246.0" dy="0.0">Java 5: System.nanoTime() поруч із currentTimeMillis(),</tspan><tspan x="246.0" dy="18.9">з довідкою «лише для заміру тривалості».</tspan></text>
<text x="180.0" y="447.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">2010</text>
<circle cx="208.0" cy="442.0" r="6.5" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<rect x="236.0" y="413.1" width="506.8" height="57.8" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="246.0" y="437.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="246.0" dy="0.0">C++, документ N3128: monotonic_clock замінено на steady_clock</tspan><tspan x="246.0" dy="18.9">— «не йде назад» замало, треба «йде рівно й не підводиться».</tspan></text>
<text x="180.0" y="523.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">17.12.2012</text>
<circle cx="208.0" cy="518.0" r="6.5" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<rect x="236.0" y="489.1" width="514.8" height="57.8" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="246.0" y="513.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="246.0" dy="0.0">W3C High Resolution Time: performance.now() зобов'язаний рости</tspan><tspan x="246.0" dy="18.9">монотонно, різниця двох показів не сміє бути від'ємною.</tspan></text>
<text x="180.0" y="599.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">30.06.2012</text>
<circle cx="208.0" cy="594.0" r="6.5" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<rect x="236.0" y="565.1" width="466.9" height="57.8" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="246.0" y="589.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="246.0" dy="0.0">Високосна секунда: ядро Linux не оновило зсув таймерів —</tspan><tspan x="246.0" dy="18.9">очікування спливали миттєво. Reddit, Mozilla, Qantas.</tspan></text>
<text x="180.0" y="675.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">01.01.2017</text>
<circle cx="208.0" cy="670.0" r="6.5" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<rect x="236.0" y="641.1" width="474.9" height="57.8" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="246.0" y="665.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="246.0" dy="0.0">Cloudflare: заміряний час відповіді став від'ємним, вибір</tspan><tspan x="246.0" dy="18.9">резолвера впав у паніку — 0.2% DNS-запитів не пройшло.</tspan></text>
<text x="180.0" y="751.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">24.08.2017</text>
<circle cx="208.0" cy="746.0" r="6.5" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<rect x="236.0" y="717.1" width="427.0" height="57.8" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="246.0" y="741.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="246.0" dy="0.0">Go 1.9: time.Time несе монотонний відлік усередині,</tspan><tspan x="246.0" dy="18.9">віднімання само бере його, а не календарний показ.</tspan></text>
<text x="180.0" y="827.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">07.04.2022</text>
<circle cx="208.0" cy="822.0" r="6.5" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<rect x="236.0" y="793.1" width="474.9" height="57.8" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="246.0" y="817.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="246.0" dy="0.0">Rust 1.60: віднімання Instant насичується до нуля замість</tspan><tspan x="246.0" dy="18.9">паніки — бо монотонність порушує вже саме залізо.</tspan></text>
</svg>