<text x="445.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">✗  ПАСТКА: пряме порівняння дедлайну</text>
<text x="445.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="445.0" dy="0.0">uint32_t deadline = start + 500;  // 0xFFFFFF00 + 500 = 244 (оберт!)</tspan><tspan x="445.0" dy="17.4">if (now &gt;= deadline) ...          // 100 &gt;= 244  -&gt; FALSE</tspan><tspan x="445.0" dy="17.4">-&gt; Але якщо now було 0xFFFFFF50: 0xFFFFFF50 &gt;= 244 -&gt; TRUE!</tspan><tspan x="445.0" dy="17.4">Таймаут спрацює МИТТЄВО ще до переходу через 0!</tspan></text>
<rect x="430.0" y="250.0" width="430.0" height="155.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="445.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">✓  ПРАВИЛЬНО: беззнакова дельта</text>
<text x="445.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="445.0" dy="0.0">if ((uint32_t)(now - start) &gt;= timeout) ...</tspan><tspan x="445.0" dy="17.4">Обчислення: 100 - 0xFFFFFF00 = 100 - (-256) = 356 мс</tspan><tspan x="445.0" dy="17.4">356 &gt;= 500  -&gt; FALSE (минуло лише 356 мс, чекаємо ще 144 мс).</tspan><tspan x="445.0" dy="17.4">Коли now дійде до 244: (244 - start) = 500 -&gt; TRUE!</tspan></text>
