<text x="508.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="508.0" dy="0.0">Linux:  CLOCK_BOOTTIME</tspan><tspan x="508.0" dy="21.4">macOS:  CLOCK_MONOTONIC, mach_continuous_time</tspan><tspan x="508.0" dy="21.4">Windows:  QueryPerformanceCounter, GetTickCount64</tspan><tspan x="508.0" dy="21.4">Swift:  ContinuousClock</tspan></text>
