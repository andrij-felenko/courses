<text x="70.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="70.0" dy="0.0">Linux:  CLOCK_MONOTONIC</tspan><tspan x="70.0" dy="21.4">macOS:  CLOCK_UPTIME_RAW, mach_absolute_time</tspan><tspan x="70.0" dy="21.4">Windows:  QueryUnbiasedInterruptTime</tspan><tspan x="70.0" dy="21.4">Swift:  SuspendingClock</tspan></text>
