<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 486" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="486" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Який годинник для якої роботи</text>
<rect x="70.0" y="48.0" width="740.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="69.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">«Скільки минуло?»  →  монотонний</tspan><tspan x="440.0" dy="20.8">«Котра зараз за календарем?»  →  настінний</tspan></text>
<rect x="64.0" y="122.0" width="360.0" height="286.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<rect x="76.0" y="134.0" width="336.0" height="40.0" rx="6" fill="#eafaf1" stroke="#eafaf1" stroke-width="0.0"/><text x="244.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="244.0" dy="0.0">Монотонний — міряй ТРИВАЛІСТЬ</tspan></text>
<text x="88.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start"><tspan x="88.0" dy="0.0">• таймаути й бюджет часу</tspan><tspan x="88.0" dy="24.3">• паузи між повторами (бекоф)</tspan><tspan x="88.0" dy="24.3">• вікна обмеження швидкості</tspan><tspan x="88.0" dy="24.3">• заміри латентності для метрик</tspan><tspan x="88.0" dy="24.3">• «мине 30 с» усередині процесу</tspan></text>
<rect x="76.0" y="354.0" width="336.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="244.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="244.0" dy="0.0">локальний, не переживає рестарт —</tspan><tspan x="244.0" dy="15.6">між машинами беззмістовний</tspan></text>
<rect x="456.0" y="122.0" width="360.0" height="286.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<rect x="468.0" y="134.0" width="336.0" height="40.0" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="0.0"/><text x="636.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="636.0" dy="0.0">Настінний — фіксуй МОМЕНТ за календарем</tspan></text>
<text x="480.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start"><tspan x="480.0" dy="0.0">• коли спливає сесія / TTL</tspan><tspan x="480.0" dy="24.3">• поле exp у JWT-токені</tspan><tspan x="480.0" dy="24.3">• cron «щодня о 3:00»</tspan><tspan x="480.0" dy="24.3">• «підписка до 1 серпня»</tspan><tspan x="480.0" dy="24.3">• дата події в аудит-лозі</tspan></text>
<rect x="468.0" y="354.0" width="336.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="636.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="636.0" dy="0.0">переживає рестарт, летить між машинами —</tspan><tspan x="636.0" dy="15.6">але його підводять NTP та адмін</tspan></text>
</svg>