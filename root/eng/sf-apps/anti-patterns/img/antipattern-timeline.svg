<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 808" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="808" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Явище описали за двадцять років до того, як йому дали ім'я</text>
<text x="40.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">ЯВИЩЕ ВЖЕ ОПИСАНЕ — СЛОВА ЩЕ НЕМА</text>
<line x1="206.0" y1="88.0" x2="206.0" y2="392.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="224.0" y="82.0" width="706.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="186.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">1975</text>
<circle cx="206.0" cy="108.0" r="5.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="240.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Фред Брукс, «Міфічний людино-місяць»</text>
<text x="240.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">«додати людей до пізнього проєкту — і він стане ще пізнішим»: пастку названо, слова нема</text>
<rect x="224.0" y="148.0" width="706.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="186.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">1977</text>
<circle cx="206.0" cy="174.0" r="5.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="240.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Крістофер Александер, «A Pattern Language»</text>
<text x="240.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">патерн як форма повторюваного рішення — поки що про будівлі й міста, не про код</text>
<rect x="224.0" y="214.0" width="706.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="186.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">1987</text>
<circle cx="206.0" cy="240.0" r="5.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="240.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Кент Бек і Ворд Каннінгем, OOPSLA, Орландо</text>
<text x="240.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">патерни переносять з архітектури будівель в об'єктний код</text>
<rect x="224.0" y="280.0" width="706.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="186.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">1993</text>
<circle cx="206.0" cy="306.0" r="5.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="240.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Hillside Group, серпень, схил гори в Колорадо</text>
<text x="240.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">спільнота патернів дістає осідок; від 1994-го — щорічні PLoP в Аллертон-Парку</text>
<rect x="224.0" y="346.0" width="706.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="186.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">1994</text>
<circle cx="206.0" cy="372.0" r="5.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="240.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">«Банда чотирьох», Design Patterns — 21 жовтня, OOPSLA</text>
<text x="240.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">23 патерни, вибрані з систем, які вижили. Канон, від якого відштовхнеться Кеніг</text>
<text x="40.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">СЛОВО З'ЯВЛЯЄТЬСЯ — І ТУТ-ТАКИ МІСЦЕ, ДЕ ПРО НЬОГО СПЕРЕЧАТИСЯ</text>
<line x1="206.0" y1="444.0" x2="206.0" y2="552.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="224.0" y="440.0" width="706.0" height="52.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="186.0" y="471.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1995</text>
<circle cx="206.0" cy="466.0" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="240.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ендрю Кеніг, JOOP 8(1), с. 46–48: «Patterns and Antipatterns»</text>
<text x="240.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">березень–квітень: слово народжується. Оригіналу статті в мережі й досі нема</text>
<rect x="224.0" y="506.0" width="706.0" height="52.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="186.0" y="537.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1995</text>
<circle cx="206.0" cy="532.0" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="240.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ворд Каннінгем вмикає першу в світі вікі — 25 березня</text>
<text x="240.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">той самий місяць: у спільноти з'являється місце, де сперечатися вголос</text>
<text x="40.0" y="584.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ПОНЯТТЯ ЗБИРАЮТЬ У КАТАЛОГ</text>
<line x1="206.0" y1="604.0" x2="206.0" y2="778.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="224.0" y="600.0" width="706.0" height="52.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="186.0" y="631.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1996</text>
<circle cx="206.0" cy="626.0" r="5.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="240.0" y="622.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Майкл Акройд, Object World West</text>
<text x="240.0" y="642.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">«AntiPatterns: щеплення проти зловживання об'єктами» — поняття виходить на сцену</text>
<rect x="224.0" y="666.0" width="706.0" height="52.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="186.0" y="697.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1997</text>
<circle cx="206.0" cy="692.0" r="5.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="240.0" y="688.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Браян Фут і Джозеф Йодер, «Велика грудка багна», PLoP</text>
<text x="240.0" y="708.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">відмовляються від ярлика «анти»: надто популярне, щоб бути просто хибним</text>
<rect x="224.0" y="732.0" width="706.0" height="52.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="186.0" y="763.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1998</text>
<circle cx="206.0" cy="758.0" r="5.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="240.0" y="754.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Браун, Мальво, Маккормік, Моубрей — каталог у Wiley</text>
<text x="240.0" y="774.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">40 антипатернів, три погляди, обов'язковий «розв'язок-вихід» у кожного</text>
</svg>