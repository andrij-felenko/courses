<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="536" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каталог самих лише успіхів нічого не доводить</text>
<text x="450.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">щоб перевірити правило «цей хід допомагає», потрібні всі чотири клітинки</text>
<text x="406.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Система вдалася</text>
<text x="730.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Система лягла</text>
<text x="238.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">Хід ПРИСУТНІЙ</text>
<text x="238.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">Ходу НЕМАЄ</text>
<rect x="250.0" y="118.0" width="312.0" height="160.0" rx="9" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="406.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">СВІДЧИТЬ ЗА</text>
<text x="406.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="406.0" dy="0.0">Саме це зібрали 1994-го:</tspan><tspan x="406.0" dy="16.2">23 патерни, вибрані</tspan><tspan x="406.0" dy="16.2">з тих, хто вижив</tspan></text>
<rect x="574.0" y="118.0" width="312.0" height="160.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="730.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">СВІДЧИТЬ ПРОТИ</text>
<text x="730.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Хід був — і система лягла.</tspan><tspan x="730.0" dy="16.2">Отже, сам собою</tspan><tspan x="730.0" dy="16.2">він не рятує</tspan></text>
<rect x="250.0" y="290.0" width="312.0" height="160.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="406.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">СВІДЧИТЬ ПРОТИ</text>
<text x="406.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="406.0" dy="0.0">Без нього теж вдавалося.</tspan><tspan x="406.0" dy="16.2">Отже, він не був</tspan><tspan x="406.0" dy="16.2">потрібен</tspan></text>
<rect x="574.0" y="290.0" width="312.0" height="160.0" rx="9" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="730.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">СВІДЧИТЬ ЗА</text>
<text x="730.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Ходу не було — і система</tspan><tspan x="730.0" dy="16.2">лягла. Правило</tspan><tspan x="730.0" dy="16.2">тримається</tspan></text>
<text x="450.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">1994-й заповнив ОДНУ клітинку з чотирьох — ліву верхню.</text>
<text x="450.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Решта три — і є та контрольна група, по яку пішли антипатерни.</text>
</svg>