<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як фікус-душитель заступає дерево — три фази, той самий стовбур</text>
<line x1="55.0" y1="350.0" x2="315.0" y2="350.0" stroke="#8a6d3b" stroke-width="3.0"/>
<rect x="169.0" y="130.0" width="32.0" height="220.0" rx="4" fill="#efe7db" stroke="#a1887f" stroke-width="1.5"/>
<circle cx="185.0" cy="130.0" r="46.0" fill="#eef6ee" stroke="#bcd6bc" stroke-width="1.5"/>
<rect x="161.0" y="323.6" width="48.0" height="26.4" rx="6" fill="#d7efd7" stroke="#27ae60" stroke-width="2.0"/>
<text x="185.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 1</text>
<text x="185.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">насінина проросла</tspan><tspan x="185.0" dy="13.7">у розвилці згори</tspan></text>
<text x="185.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="185.0" dy="0.0">фікус — лише пагін нагорі;</tspan><tspan x="185.0" dy="13.7">дерево ще годує все</tspan></text>
<line x1="390.0" y1="350.0" x2="650.0" y2="350.0" stroke="#8a6d3b" stroke-width="3.0"/>
<rect x="504.0" y="130.0" width="32.0" height="220.0" rx="4" fill="#efe7db" stroke="#a1887f" stroke-width="1.5"/>
<circle cx="520.0" cy="130.0" r="46.0" fill="#eef6ee" stroke="#bcd6bc" stroke-width="1.5"/>
<rect x="496.0" y="240.0" width="48.0" height="110.0" rx="6" fill="#d7efd7" stroke="#27ae60" stroke-width="2.0"/>
<path d="M 520 84 A 46 46 0 0 1 520 176 Z" fill="#d7efd7" stroke="#27ae60" stroke-width="2"/>
<text x="520.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 2</text>
<text x="520.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">корені сповзли</tspan><tspan x="520.0" dy="13.7">по стовбуру донизу</tspan></text>
<text x="520.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="520.0" dy="0.0">половину крони тримає фікус,</tspan><tspan x="520.0" dy="13.7">половину — ще дерево</tspan></text>
<line x1="725.0" y1="350.0" x2="985.0" y2="350.0" stroke="#8a6d3b" stroke-width="3.0"/>
<rect x="839.0" y="130.0" width="32.0" height="220.0" rx="4" fill="#efe7db" stroke="#a1887f" stroke-width="1.5"/>
<circle cx="855.0" cy="130.0" r="46.0" fill="#eef6ee" stroke="#bcd6bc" stroke-width="1.5"/>
<rect x="831.0" y="147.6" width="48.0" height="202.4" rx="6" fill="#d7efd7" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="855.0" cy="130.0" r="46.0" fill="#d7efd7" stroke="#27ae60" stroke-width="2.0"/>
<text x="855.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 3</text>
<text x="855.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">фікус дійшов ґрунту,</tspan><tspan x="855.0" dy="13.7">обхопив стовбур</tspan></text>
<text x="855.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="855.0" dy="0.0">дерево зсередини зникло;</tspan><tspan x="855.0" dy="13.7">крону тримає сам фікус</tspan></text>
<text x="520.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">нове росте на старому й довкола нього; господар слабне поступово, а не гине від сокири в один день</text>
</svg>