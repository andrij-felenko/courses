<text x="540.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехоплювач на вході: клієнт стукає в одні двері, маршрут веде куди готово</text>
<rect x="45.0" y="203.4" width="120.0" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="105.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">клієнти</tspan><tspan x="105.0" dy="15.6">(той самий</tspan><tspan x="105.0" dy="15.6">домен-URL)</tspan></text>
<rect x="245.0" y="110.0" width="110.0" height="250.0" rx="10" fill="#fff7e6" stroke="#d68910" stroke-width="2.0"/>
<text x="300.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Перехоп-</tspan><tspan x="300.0" dy="15.6">лювач</tspan></text>
<text x="300.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="300.0" dy="0.0">дивиться</tspan><tspan x="300.0" dy="13.7">на запит,</tspan><tspan x="300.0" dy="13.7">обирає</tspan><tspan x="300.0" dy="13.7">маршрут</tspan></text>
