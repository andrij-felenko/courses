<text x="540.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">двері для клієнта одні й ті самі; за дверима перехоплювач тихо пересуває можливість зі старого в нове, по одній</text>
