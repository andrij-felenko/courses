<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обидва рази перемогла та сама відповідь: менше загальності — більше визначеності</text>
<rect x="430.0" y="64.0" width="380.0" height="54.0" rx="6" fill="#f2f2f5" stroke="#333333" stroke-width="2.0"/><text x="620.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Розвилка перша: скільки боків має зв'язок?</tspan></text>
<line x1="560.0" y1="118.0" x2="300.0" y2="172.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="680.0" y1="118.0" x2="940.0" y2="172.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="60.0" y="176.0" width="480.0" height="56.0" rx="6" fill="#fff6e6" stroke="#333333" stroke-width="1.8"/><text x="300.0" y="209.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Двобічний: обмеження без напрямку</tspan></text>
<text x="300.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Sketchpad, ThingLab, DeltaBlue</text>
<text x="300.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">ціна: хто саме посунеться — вирішує планувальник</text>
<rect x="700.0" y="176.0" width="480.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.8"/><text x="940.0" y="209.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">Однобічний: формула з одним виходом</tspan></text>
<text x="940.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Garnet, таблиці, всі чинні рушії прив'язки</text>
<text x="940.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">ціна: ввід доводиться доробляти окремим шляхом</text>
<line x1="60.0" y1="350.0" x2="1180.0" y2="350.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 8"/>
<rect x="430.0" y="384.0" width="380.0" height="54.0" rx="6" fill="#f2f2f5" stroke="#333333" stroke-width="2.0"/><text x="620.0" y="415.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Розвилка друга: коли рівність відновлено?</tspan></text>
<line x1="560.0" y1="438.0" x2="300.0" y2="492.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="680.0" y1="438.0" x2="940.0" y2="492.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="60.0" y="496.0" width="480.0" height="56.0" rx="6" fill="#fff6e6" stroke="#333333" stroke-width="1.8"/><text x="300.0" y="529.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Повторні проходи, доки не заспокоїться</tspan></text>
<text x="300.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">релаксація Sketchpad, VisiCalc</text>
<text x="300.0" y="602.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">ціна: проміжна неправда й жодної ознаки «готово»</text>
<rect x="700.0" y="496.0" width="480.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.8"/><text x="940.0" y="529.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">Один прохід у порядку залежностей</tspan></text>
<text x="940.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">LANPAR, Lotus 1-2-3, Garnet, сигнали</text>
<text x="940.0" y="602.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">ціна: граф мусить бути без циклів</text>
</svg>