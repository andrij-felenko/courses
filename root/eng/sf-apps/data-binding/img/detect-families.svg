<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 578" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="578" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири способи дізнатися, що джерело змінилося</text>
<rect x="232.0" y="84.0" width="250.0" height="54.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.8"/><text x="357.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="357.0" dy="0.0">Сповіщення</tspan></text>
<rect x="494.0" y="84.0" width="250.0" height="54.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.8"/><text x="619.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="619.0" dy="0.0">Звірка</tspan></text>
<rect x="756.0" y="84.0" width="250.0" height="54.0" rx="6" fill="#fff6e6" stroke="#333333" stroke-width="1.8"/><text x="881.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="881.0" dy="0.0">Перехоплення</tspan></text>
<rect x="1018.0" y="84.0" width="250.0" height="54.0" rx="6" fill="#f2f2f5" stroke="#333333" stroke-width="1.8"/><text x="1143.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1143.0" dy="0.0">На складанні</tspan></text>
<text x="212.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">як дізнається</text>
<rect x="232.0" y="154.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="357.0" y="191.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="357.0" dy="0.0">сетер гукає</tspan><tspan x="357.0" dy="16.2">підписників</tspan></text>
<rect x="494.0" y="154.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="619.0" y="191.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="619.0" dy="0.0">порівняння з копією</tspan><tspan x="619.0" dy="16.2">після оберту</tspan></text>
<rect x="756.0" y="154.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="881.0" y="191.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="881.0" dy="0.0">посередник ловить</tspan><tspan x="881.0" dy="16.2">читання й запис</tspan></text>
<rect x="1018.0" y="154.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="1143.0" y="191.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1143.0" dy="0.0">компілятор дописує</tspan><tspan x="1143.0" dy="16.2">сповіщення сам</tspan></text>
<text x="212.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">ціна</text>
<rect x="232.0" y="248.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="357.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="357.0" dy="0.0">дані мусять бути</tspan><tspan x="357.0" dy="16.2">спостережувані</tspan></text>
<rect x="494.0" y="248.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="619.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="619.0" dy="0.0">робота від розміру</tspan><tspan x="619.0" dy="16.2">екрана, не від змін</tspan></text>
<rect x="756.0" y="248.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="881.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="881.0" dy="0.0">посередник —</tspan><tspan x="881.0" dy="16.2">не той самий об'єкт</tspan></text>
<rect x="1018.0" y="248.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="1143.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1143.0" dy="0.0">потрібне компіляторове</tspan><tspan x="1143.0" dy="16.2">поле зору</tspan></text>
<text x="212.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">чого не бачить</text>
<rect x="232.0" y="342.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="357.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="357.0" dy="0.0">зміну всередині</tspan><tspan x="357.0" dy="16.2">значення</tspan></text>
<rect x="494.0" y="342.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="619.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="619.0" dy="0.0">нічого — але лише</tspan><tspan x="619.0" dy="16.2">у свій момент</tspan></text>
<rect x="756.0" y="342.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="881.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="881.0" dy="0.0">доступ повз</tspan><tspan x="881.0" dy="16.2">посередника</tspan></text>
<rect x="1018.0" y="342.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="1143.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1143.0" dy="0.0">зміну поза</tspan><tspan x="1143.0" dy="16.2">полем зору</tspan></text>
<text x="212.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">як мовчить</text>
<rect x="232.0" y="436.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="357.0" y="473.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="357.0" dy="0.0">забули сповістити —</tspan><tspan x="357.0" dy="16.2">екран відстає</tspan></text>
<rect x="494.0" y="436.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="619.0" y="473.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="619.0" dy="0.0">не влягається —</tspan><tspan x="619.0" dy="16.2">цикл до запобіжника</tspan></text>
<rect x="756.0" y="436.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="881.0" y="473.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="881.0" dy="0.0">залежність не</tspan><tspan x="881.0" dy="16.2">захопилася</tspan></text>
<rect x="1018.0" y="436.0" width="250.0" height="82.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="1143.0" y="473.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1143.0" dy="0.0">чуже присвоєння</tspan><tspan x="1143.0" dy="16.2">лишилося німим</tspan></text>
<text x="650.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Вибір родини — це вибір, що саме проґавити й чим заплатити; тихим лишається кожен</text>
</svg>