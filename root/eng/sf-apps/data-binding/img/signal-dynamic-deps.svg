<line x1="1059.0" y1="246.0" x2="999.0" y2="328.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="944.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">label.deps = { show, n }</text>
<text x="944.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">n.subs = { label }</text>
<text x="944.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">n.set(8) — label переобчислено</text>
<rect x="60.0" y="528.0" width="1140.0" height="92.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="630.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Ребро n → label з'являється й зникає саме тоді, коли label переобчислюється й проходить крізь гілку</text>
<text x="630.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">те, чого цього разу не прочитано, мусить бути знято зі списку підписників — інакше граф росте назавжди</text>
</svg>