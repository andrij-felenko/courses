<text x="440.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключ шукають у кошику ПОТОЧНОГО геша (7), а він лежить у кошику старого (3).</text>
<text x="440.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Запис видно перебором, але ключем не знайти — він загубився у власному кошику.</text>
