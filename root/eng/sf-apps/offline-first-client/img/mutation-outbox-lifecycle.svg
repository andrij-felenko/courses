<text x="410.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Інваріант: мутація видаляється з черги ЛИШЕ після підтвердження сервером або остаточного відкату</text>
