<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр стратегій розв'язання конфліктів реплікації</text>
<line x1="50.0" y1="60.0" x2="770.0" y2="60.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="760.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">Точність збереження наміру та складність моделі →</text>
<rect x="40.0" y="80.0" width="175.0" height="170.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="127.5" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="127.5" dy="0.0">1. Last-Write-Wins (LWW)</tspan><tspan x="127.5" dy="11.7"></tspan><tspan x="127.5" dy="11.7">• Фізичний годинник (NTP)</tspan><tspan x="127.5" dy="11.7">• Більший timestamp перемагає</tspan><tspan x="127.5" dy="11.7">• Перевага: простота</tspan><tspan x="127.5" dy="11.7">• Плата: втрата правок при</tspan><tspan x="127.5" dy="11.7">дрейфі годинника або гонках</tspan></text>
<rect x="230.0" y="80.0" width="175.0" height="170.0" rx="6" fill="#fdf8e2" stroke="#d4a017" stroke-width="1.5"/><text x="317.5" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="317.5" dy="0.0">2. Три-стороннє злиття</tspan><tspan x="317.5" dy="11.7"></tspan><tspan x="317.5" dy="11.7">• Звіряння Base + Our + Their</tspan><tspan x="317.5" dy="11.7">• Автозлиття непересічних полів</tspan><tspan x="317.5" dy="11.7">• Перевага: зрозуміла модель</tspan><tspan x="317.5" dy="11.7">• Плата: блокування при</tspan><tspan x="317.5" dy="11.7">перетині правок в одному полі</tspan></text>
<rect x="420.0" y="80.0" width="175.0" height="170.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="507.5" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="507.5" dy="0.0">3. Версійні вектори</tspan><tspan x="507.5" dy="11.7"></tspan><tspan x="507.5" dy="11.7">• Причинний порядок V₁ &lt; V₂</tspan><tspan x="507.5" dy="11.7">• Детекція паралельності V₁ || V₂</tspan><tspan x="507.5" dy="11.7">• Перевага: точне виявлення колізій</tspan><tspan x="507.5" dy="11.7">• Плата: збереження множинних</tspan><tspan x="507.5" dy="11.7">версій (siblings / MV-register)</tspan></text>
<rect x="610.0" y="80.0" width="175.0" height="170.0" rx="6" fill="#eef8f2" stroke="#27ae60" stroke-width="1.5"/><text x="697.5" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">4. Безконфліктні типи (CRDT)</tspan><tspan x="697.5" dy="11.7"></tspan><tspan x="697.5" dy="11.7">• Комутативні напівґратки (⊔)</tspan><tspan x="697.5" dy="11.7">• Детерміністичне автозлиття</tspan><tspan x="697.5" dy="11.7">• Перевага: 100% збіжність без втрат</tspan><tspan x="697.5" dy="11.7">• Плата: оверхед на метадані</tspan><tspan x="697.5" dy="11.7">та надгробки (tombstones)</tspan></text>
<text x="410.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Вибір стратегії залежить від гранулярності даних: LWW для профілю, 3-Way для форм, CRDT для спільного тексту</text>
</svg>