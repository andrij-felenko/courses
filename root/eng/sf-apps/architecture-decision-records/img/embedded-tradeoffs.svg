<text x="60.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Постійна сесія, брокер, QoS 0/1/2, накладні витрати TLS</text>
