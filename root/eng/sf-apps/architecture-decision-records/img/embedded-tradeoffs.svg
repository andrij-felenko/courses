<text x="460.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Варіант А: Статичні пули (Fixed Blocks)</text>
<text x="460.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Нульова фрагментація, O(1) виділення, фіксований RAM</text>
