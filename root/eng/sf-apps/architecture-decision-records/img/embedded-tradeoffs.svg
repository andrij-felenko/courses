<text x="60.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Витіснення, блокувальні черги, стек ~1-2 КБ/таск</text>
