<text x="452.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Криптозахист: HW Crypto vs SW Lib</text>
<rect x="450.0" y="306.0" width="360.0" height="64.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="460.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Варіант А: Апаратний рушій (AES/SHA/ECC)</text>
<text x="460.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">DMA-обробка, захищене сховище ключів, прив'язка до чіпа</text>
