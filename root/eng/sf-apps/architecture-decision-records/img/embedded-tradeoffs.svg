<text x="60.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Двоточкові запити, бінарний заголовок 4B, режим сну вузла</text>
<rect x="440.0" y="270.0" width="380.0" height="195.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
