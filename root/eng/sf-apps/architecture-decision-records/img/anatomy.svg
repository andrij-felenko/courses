<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кістяк ADR: сили ведуть до рішення, рішення — до наслідків</text>
<rect x="150.0" y="52.0" width="285.2" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="164.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Заголовок</text>
<text x="164.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">«0007. Гроші — в копійках, int64»</text>
<rect x="453.6" y="52.0" width="156.4" height="34.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="531.8" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Статус</text>
<text x="531.8" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ухвалено</text>
<rect x="150.0" y="112.0" width="460.0" height="96.0" rx="6" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="164.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">КОНТЕКСТ — сили в грі (ще без рішення)</text>
<circle cx="174.0" cy="150.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="186.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">вимога: фінансовий звіт не має губити копійку</text>
<circle cx="174.0" cy="167.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="186.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">факт: double дає похибку округлення на дробах</text>
<circle cx="174.0" cy="184.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="186.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">обмеження: суми до мільярдів — int64 вміщує з запасом</text>
<line x1="380.0" y1="208.0" x2="380.0" y2="232.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="392.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">випливає</text>
<rect x="150.0" y="236.0" width="460.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="164.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">РІШЕННЯ — активним голосом</text>
<text x="164.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">«Ми зберігаємо гроші як int64 у копійках.»</text>
<line x1="380.0" y1="286.0" x2="380.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="392.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">породжує</text>
<rect x="150.0" y="314.0" width="460.0" height="74.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
<text x="164.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">НАСЛІДКИ — і виграш, і ціна</text>
<circle cx="174.0" cy="354.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="174.0" y="357.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="190.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">арифметика точна, копійка не тікає</text>
<circle cx="174.0" cy="374.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="174.0" y="376.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="190.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">код багатослівніший, потрібне ділення на 100 для показу</text>
</svg>