<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Експозиція = ймовірність × втрата: важить ПЛОЩА, не висота й не ширина</text>
