<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один ризик — чотири відповіді; яку обрати, диктує експозиція</text>
<rect x="345.0" y="69.9" width="250.0" height="52.2" rx="6" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="470.0" y="91.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">РИЗИК</tspan><tspan x="470.0" dy="18.2">(ймовірність × втрата)</tspan></text>
<rect x="65.0" y="233.0" width="170.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Уникнути</tspan></text>
<text x="150.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">прибрати причину:</tspan><tspan x="150.0" dy="15.6">інший шлях, де ризику нема</tspan></text>
<line x1="470.0" y1="122.1" x2="150.0" y2="233.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="298.0" y="233.0" width="170.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="383.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="383.0" dy="0.0">Зменшити</tspan></text>
<text x="383.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="383.0" dy="0.0">збити ймовірність або втрату:</tspan><tspan x="383.0" dy="15.6">тест, шов, надлишок</tspan></text>
<line x1="470.0" y1="122.1" x2="383.0" y2="233.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="531.0" y="233.0" width="170.0" height="34.0" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="616.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="616.0" dy="0.0">Передати</tspan></text>
<text x="616.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="616.0" dy="0.0">віддати тому, хто впорається:</tspan><tspan x="616.0" dy="15.6">страхування, SLA, хмара</tspan></text>
<line x1="470.0" y1="122.1" x2="616.0" y2="233.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="764.0" y="233.0" width="170.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="849.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="849.0" dy="0.0">Прийняти</tspan></text>
<text x="849.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="849.0" dy="0.0">лишити свідомо + запас;</tspan><tspan x="849.0" dy="15.6">дешевше, ніж боротися</tspan></text>
<line x1="470.0" y1="122.1" x2="849.0" y2="233.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">мала експозиція → прийняти й записати; велика → уникнути чи зменшити, поки дешево;</text>
<text x="470.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">не своя компетенція → передати. «Нічого не робити» — теж вибір, лише коли він свідомий</text>
</svg>