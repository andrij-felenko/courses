<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три режими незнання — і зброя кожного</text>
<rect x="45.0" y="70.0" width="290.0" height="250.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="190.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Ризик</text>
<text x="190.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">розподіл ВІДОМИЙ</tspan><tspan x="190.0" dy="15.6">(шанси знаємо)</tspan></text>
<rect x="136.0" y="218.0" width="16.0" height="30.0" rx="1" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="159.0" y="196.0" width="16.0" height="52.0" rx="1" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="182.0" y="208.0" width="16.0" height="40.0" rx="1" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="205.0" y="190.0" width="16.0" height="58.0" rx="1" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="228.0" y="214.0" width="16.0" height="34.0" rx="1" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="67.0" y="265.0" width="246.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="283.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Зброя: арифметика —</tspan><tspan x="190.0" dy="15.6">експозиція p × L, важіль</tspan></text>
<rect x="360.0" y="70.0" width="290.0" height="250.0" rx="10" fill="#fff8e1" stroke="#b8860b" stroke-width="2.0"/>
<text x="505.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b8860b" text-anchor="middle" font-weight="700">Невизначеність</text>
<text x="505.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">розподіл Є, але</tspan><tspan x="505.0" dy="15.6">НЕВІДОМИЙ</tspan></text>
<rect x="451.0" y="218.0" width="16.0" height="30.0" rx="1" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/>
<rect x="474.0" y="196.0" width="16.0" height="52.0" rx="1" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/>
<rect x="497.0" y="208.0" width="16.0" height="40.0" rx="1" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/>
<rect x="520.0" y="190.0" width="16.0" height="58.0" rx="1" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/>
<rect x="543.0" y="214.0" width="16.0" height="34.0" rx="1" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/>
<rect x="382.0" y="265.0" width="246.0" height="44.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="505.0" y="283.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Зброя: сценарії, запас,</tspan><tspan x="505.0" dy="15.6">судження, рання перевірка</tspan></text>
<rect x="675.0" y="70.0" width="290.0" height="250.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="820.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Невідоме невідоме</text>
<text x="820.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">події годі</tspan><tspan x="820.0" dy="15.6">й НАЗВАТИ</tspan></text>
<text x="820.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="52" fill="#c0392b" text-anchor="middle" font-weight="700">?</text>
<rect x="697.0" y="265.0" width="246.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="820.0" y="283.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Зброя: зворотність,</tspan><tspan x="820.0" dy="15.6">надлишок, ізоляція вибуху</tspan></text>
<line x1="70.0" y1="352.0" x2="950.0" y2="352.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що менше знаємо про ймовірності — тим слабший розрахунок і тим важливіша структура</text>
<text x="500.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Помилка режиму — рахувати там, де рахувати нема чого — одна з найдорожчих</text>
</svg>