<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 424" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="424" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шов синхронізації: у презентаційній моделі його пише програміст, у MVVM — рушій</text>
<line x1="560.0" y1="40.0" x2="560.0" y2="396.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="290.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Липень 2004: презентаційна модель</text>
<rect x="60.0" y="110.0" width="180.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.8"/><text x="150.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Подання</tspan></text>
<rect x="330.0" y="110.0" width="200.0" height="80.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.8"/><text x="430.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Презентаційна</tspan><tspan x="430.0" dy="19.5">модель</tspan></text>
<text x="285.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">синхронізація</text>
<line x1="245.0" y1="136.0" x2="325.0" y2="136.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="325.0" y1="168.0" x2="245.0" y2="168.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="214.0" width="470.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="295.0" y="247.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">у поданні — тести моделі її не бачать</tspan></text>
<rect x="60.0" y="286.0" width="470.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="295.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">у моделі — вона знову залежить від подання</tspan></text>
<text x="290.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">цей код хтось мусить написати — обидва місця погані</text>
<text x="830.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Жовтень 2005: модель подання</text>
<rect x="600.0" y="110.0" width="180.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.8"/><text x="690.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Подання</tspan></text>
<rect x="870.0" y="110.0" width="200.0" height="80.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.8"/><text x="970.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Модель</tspan><tspan x="970.0" dy="19.5">подання</tspan></text>
<text x="825.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">рушій</text>
<line x1="785.0" y1="136.0" x2="865.0" y2="136.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="865.0" y1="168.0" x2="785.0" y2="168.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="600.0" y="214.0" width="470.0" height="58.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="835.0" y="247.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">рушій сам тримає обидва кінці рівними</tspan></text>
<rect x="600.0" y="286.0" width="470.0" height="58.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="835.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">коду синхронізації не пише ніхто — його немає</tspan></text>
<text x="830.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">той самий рисунок — інший власник шва</text>
</svg>