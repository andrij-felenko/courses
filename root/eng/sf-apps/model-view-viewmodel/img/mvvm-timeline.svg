<circle cx="312.0" cy="418.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="332.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">стаття Джоша Сміта в MSDN Magazine —</text>
<text x="332.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">назва «ViewModel» перемагає «презентаційну модель»</text>
<text x="294.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">5 липня 2010</text>
<circle cx="312.0" cy="480.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="332.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Knockout переносить ім'я і патерн у JavaScript</text>
<text x="294.0" y="547.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">лютий 2014</text>
<circle cx="312.0" cy="542.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="332.0" y="547.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Vue виходить із гаслом «JavaScript MVVM made simple»</text>
<text x="294.0" y="609.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">листопад 2017</text>
<circle cx="312.0" cy="604.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="332.0" y="609.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Android дає слово ViewModel зовсім іншій речі</text>
<text x="510.0" y="652.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Ідея старша за ім'я, ім'я старше за платформу, а платформа не пережила імені</text>
</svg>