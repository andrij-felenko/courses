<text x="332.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Cocoa Bindings у Mac OS X 10.3 —</text>
<text x="332.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">декларативне зв'язування працює на іншій платформі</text>
<text x="294.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">19 липня 2004</text>
<circle cx="312.0" cy="232.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="332.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Мартін Фаулер друкує «презентаційну модель» —</text>
<text x="332.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">синхронізацію з екраном пишуть руками</text>
<text x="294.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">8 жовтня 2005</text>
<circle cx="312.0" cy="294.0" r="8.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="332.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Джон Ґоссман у блозі називає Model/View/ViewModel</text>
<text x="294.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">21 листопада 2006</text>
<circle cx="312.0" cy="356.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="332.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">WPF виходить у складі .NET Framework 3.0 —</text>
