<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вісь часу: ApplicationModel, презентаційна модель, народження назви MVVM і її мандри</text>
<text x="510.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ім'я MVVM: що було до нього, коли воно з'явилося й куди розійшлося</text>
