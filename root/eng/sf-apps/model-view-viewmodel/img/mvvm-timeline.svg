<circle cx="312.0" cy="108.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="332.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">ParcPlace VisualWorks: клас ApplicationModel —</text>
<text x="332.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">модель екрана вже є, імені ще немає</text>
