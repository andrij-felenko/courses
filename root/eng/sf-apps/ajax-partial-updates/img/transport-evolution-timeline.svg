<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція мережевих фонових транспортів у вебклієнті</text>
<rect x="50.0" y="50.0" width="960.0" height="75.0" rx="8" fill="#f4f6f8" stroke="#8c9ba5" stroke-width="1.5"/><text x="80.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1995–1999: Приховані фрейми (Hidden &lt;iframe&gt; / Image Beacon)</text><text x="80.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Хак: форма відправлялася у прихований фрейм, скрипт парсив parent.window. Повільно й ламко.</text><line x1="530.0" y1="125.0" x2="530.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="50.0" y="140.0" width="960.0" height="75.0" rx="8" fill="#eef3f8" stroke="#2457d6" stroke-width="1.6"/><text x="80.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">1999–2005: XMLHttpRequest (XHR) та народження AJAX</text><text x="80.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Перший нативний асинхронний HTTP-транспорт. Callback-модель (onreadystatechange), важка буферизація.</text><line x1="530.0" y1="215.0" x2="530.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="50.0" y="230.0" width="960.0" height="75.0" rx="8" fill="#fdfbf7" stroke="#d97706" stroke-width="1.6"/><text x="80.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="start" font-weight="700">2009+: Server-Sent Events (EventSource / text/event-stream)</text><text x="80.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Односпрямований потік повідомлень від сервера до клієнта поверх звичайного HTTP. Авто-перепідключення.</text><line x1="530.0" y1="305.0" x2="530.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="50.0" y="320.0" width="960.0" height="75.0" rx="8" fill="#fbf4fd" stroke="#8e44ad" stroke-width="1.6"/><text x="80.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700">2011+: WebSocket (RFC 6455)</text><text x="80.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Повнодуплексний TCP-канал поверх єдиного з'єднання. Мінімальний оверхед кадрів для частих подій.</text><line x1="530.0" y1="395.0" x2="530.0" y2="410.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="50.0" y="410.0" width="960.0" height="75.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="80.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2015+: Fetch API, ReadableStream та AbortController</text><text x="80.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Promise-базований API, потокове читання байтів (bytestream), скасування запитів та стандартизований пайплайн.</text>
</svg>