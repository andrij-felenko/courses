<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійний запис і подвійне читання зі звірянням тримають інваріант</text>
<text x="450.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">поки живуть обидві форми: кожен запис оновлює дві, кожне читання їх звіряє</text>
<text x="240.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ПОДВІЙНИЙ ЗАПИС</text>
<rect x="183.0" y="99.3" width="114.0" height="45.3" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="118.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">застосунок пише</tspan><tspan x="240.0" dy="14.3">замовлення</tspan></text>
<rect x="120.5" y="227.9" width="59.1" height="44.1" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="246.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">стара:</tspan><tspan x="150.0" dy="13.7">total</tspan></text>
<rect x="290.9" y="227.9" width="98.1" height="44.1" rx="6" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="246.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">нова:</tspan><tspan x="340.0" dy="13.7">amount_minor</tspan></text>
<line x1="212.0" y1="146.0" x2="165.0" y2="226.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="268.0" y1="146.0" x2="330.0" y2="226.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="245.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">amount_minor = round(total · 100)</text>
<text x="245.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">один запис торкає обидві — не розходяться</text>
<line x1="455.0" y1="106.0" x2="455.0" y2="360.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="672.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПОДВІЙНЕ ЧИТАННЯ + ЗВІРЯННЯ</text>
<rect x="611.8" y="106.5" width="120.3" height="31.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="672.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="672.0" dy="0.0">застосунок читає</tspan></text>
<rect x="565.0" y="172.8" width="49.9" height="30.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="191.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">total</tspan></text>
<rect x="712.1" y="172.8" width="91.8" height="30.5" rx="6" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="758.0" y="191.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="758.0" dy="0.0">amount_minor</tspan></text>
<line x1="648.0" y1="140.0" x2="600.0" y2="172.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="700.0" y1="140.0" x2="752.0" y2="172.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="577.4" y="240.8" width="189.3" height="30.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="672.0" y="259.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="672.0" dy="0.0">minor == round(total·100)?</tspan></text>
<line x1="598.0" y1="204.0" x2="652.0" y2="242.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="756.0" y1="204.0" x2="700.0" y2="242.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="541.8" y="316.5" width="88.4" height="43.0" rx="6" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="586.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="586.0" dy="0.0">збіг →</tspan><tspan x="586.0" dy="13.0">віддати нову</tspan></text>
<rect x="735.0" y="316.5" width="94.1" height="43.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="782.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="782.0" dy="0.0">розбіжність →</tspan><tspan x="782.0" dy="13.0">тривога, стоп</tspan></text>
<line x1="650.0" y1="274.0" x2="600.0" y2="314.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="694.0" y1="274.0" x2="764.0" y2="314.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="450.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Звіряння робить із «сподіваюся, збігається» — «виміряно, що збігається»; саме воно дає право згортати</text>
</svg>