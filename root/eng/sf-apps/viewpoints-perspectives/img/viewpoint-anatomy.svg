<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="456" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія viewpoint'а: не картинка, а специфікація класу картинок</text>
<text x="450.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">той самий бланк для будь-якої системи — заповниш під свою, дістанеш view</text>
<rect x="30.0" y="82.0" width="830.0" height="42.0" rx="4" fill="#f4f6f8" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="82.0" width="210.0" height="42.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="135.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Визначення</tspan></text>
<text x="260.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">що саме цей зріз описує — і що свідомо лишає іншим зрізам</text>
<rect x="30.0" y="132.0" width="830.0" height="42.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="132.0" width="210.0" height="42.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="135.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Турботи (concerns)</tspan></text>
<text x="260.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">на які питання стейкхолдерів цей зріз відповідає</text>
<rect x="30.0" y="182.0" width="830.0" height="42.0" rx="4" fill="#f4f6f8" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="182.0" width="210.0" height="42.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="135.0" y="207.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Стейкхолдери</tspan></text>
<text x="260.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">кого з людей цей зріз обходить найбільше</text>
<rect x="30.0" y="232.0" width="830.0" height="42.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="232.0" width="210.0" height="42.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="135.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Моделі й нотація</tspan></text>
<text x="260.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">які діаграми/таблиці будувати (model kinds за ISO 42010)</text>
<rect x="30.0" y="282.0" width="830.0" height="42.0" rx="4" fill="#f4f6f8" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="282.0" width="210.0" height="42.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="135.0" y="307.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Дії побудови</tspan></text>
<text x="260.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">кроки, якими цю в'ю збирають, і поради з практики</text>
<rect x="30.0" y="332.0" width="830.0" height="42.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="332.0" width="210.0" height="42.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="135.0" y="357.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Проблеми й пастки</tspan></text>
<text x="260.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">типові помилки саме цього зрізу — і як їх обійти</text>
<rect x="132.2" y="399.0" width="635.5" height="30.0" rx="6" fill="#fff7ed" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="418.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">viewpoint = багаторазовий бланк · застосований до системи → view (заповнений бланк)</tspan></text>
</svg>