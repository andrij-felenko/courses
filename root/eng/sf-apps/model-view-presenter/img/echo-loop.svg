<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="462" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Луна: подання чує власний голос</text>
<rect x="50.0" y="93.0" width="300.0" height="74.0" rx="9" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.8"/><text x="200.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Презентер</text><text x="200.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">render() кладе «23» у поле</text>
<rect x="520.0" y="93.0" width="320.0" height="74.0" rx="9" fill="#eaf7ef" stroke="#1a1a1a" stroke-width="1.8"/><text x="680.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подання</text><text x="680.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">field.setText(&quot;23&quot;)</text>
<rect x="520.0" y="283.0" width="320.0" height="74.0" rx="9" fill="#f2f2f5" stroke="#1a1a1a" stroke-width="1.8"/><text x="680.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віджет</text><text x="680.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">піднімає «текст змінився»</text>
<rect x="50.0" y="283.0" width="300.0" height="74.0" rx="9" fill="#fff6e6" stroke="#1a1a1a" stroke-width="1.8"/><text x="200.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробник onTargetTyped</text><text x="200.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">просить модель змінитися</text>
<line x1="350.0" y1="130.0" x2="520.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">команда екрана</text>
<line x1="680.0" y1="167.0" x2="680.0" y2="283.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="662.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end"><tspan x="662.0" dy="0.0">віджет не розрізняє,</tspan><tspan x="662.0" dy="17.2">хто змінив текст</tspan></text>
<line x1="520.0" y1="320.0" x2="350.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">доповідає назовні</text>
<line x1="425.0" y1="308.0" x2="445.0" y2="332.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="445.0" y1="308.0" x2="425.0" y2="332.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="435.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">сторож pushing</text>
<line x1="200.0" y1="283.0" x2="200.0" y2="167.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="218.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">і все спочатку</text>
<text x="450.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Swing: setText() будить DocumentListener. WinForms: присвоєння Text піднімає TextChanged.</text>
<text x="450.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">У DOM присвоєння input.value подій не піднімає — і того самого кола там не виникає.</text>
</svg>