<text x="975.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">як назвав Мартін Фаулер</text>
<rect x="880.0" y="150.0" width="190.0" height="50.0" rx="9" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.8"/><text x="975.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Презентер</text>
<rect x="805.0" y="280.0" width="140.0" height="50.0" rx="9" fill="#eaf7ef" stroke="#1a1a1a" stroke-width="1.8"/><text x="875.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подання</text>
<rect x="1005.0" y="280.0" width="140.0" height="50.0" rx="9" fill="#fff6e6" stroke="#1a1a1a" stroke-width="1.8"/><text x="1075.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель</text>
<line x1="1020.0" y1="202.0" x2="1065.0" y2="277.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="930.0" y1="202.0" x2="885.0" y2="277.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="947.0" y1="305.0" x2="1003.0" y2="305.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
<line x1="966.0" y1="296.0" x2="984.0" y2="314.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="984.0" y1="296.0" x2="966.0" y2="314.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="975.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="975.0" dy="0.0">Подання не бачить моделі зовсім:</tspan><tspan x="975.0" dy="17.2">усе, що воно знає, кладе туди презентер.</tspan></text>
<text x="590.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">червоним — те, чим схема відрізняється; пунктир — сповіщення або складання</text>
</svg>