<text x="590.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Енді Бауер і Блер Мак-Ґлешен</text>
<rect x="495.0" y="150.0" width="190.0" height="50.0" rx="9" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.8"/><text x="590.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Презентер</text>
