<line x1="177.0" y1="305.0" x2="233.0" y2="305.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="205.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="205.0" dy="0.0">Презентер збирає застосунок і тримає логіку,</tspan><tspan x="205.0" dy="17.2">але подання малює те, що прочитало з моделі.</tspan></text>
