<line x1="545.0" y1="202.0" x2="500.0" y2="277.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="618.0" y1="305.0" x2="562.0" y2="305.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="590.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">Модель сповіщає подання (спостерігач),</tspan><tspan x="590.0" dy="17.2">а презентер уперше чіпає екран напряму.</tspan></text>
<rect x="790.0" y="52.0" width="370.0" height="390.0" rx="12" fill="#fbfbfd" stroke="#d9d9e3" stroke-width="1.2"/>
