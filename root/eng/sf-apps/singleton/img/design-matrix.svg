<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 478" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="478" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві незалежні осі: скільки екземплярів і як до них дотягуються</text>
<rect x="190.0" y="95.0" width="300.0" height="120.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Єдиний екземпляр,</tspan><tspan x="340.0" dy="16.9">переданий явно</tspan><tspan x="340.0" dy="16.9">(здоровий випадок)</tspan></text>
<rect x="505.0" y="95.0" width="300.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/><text x="655.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">СІНГЛТОН</tspan><tspan x="655.0" dy="16.9">«один» + доступ звідусіль</tspan><tspan x="655.0" dy="16.9">(патерн GoF)</tspan></text>
<rect x="190.0" y="230.0" width="300.0" height="120.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="340.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Звичайні обʼєкти</tspan><tspan x="340.0" dy="16.9">(буденне ООП)</tspan></text>
<rect x="505.0" y="230.0" width="300.0" height="120.0" rx="6" fill="#fff8e1" stroke="#d9a400" stroke-width="1.5"/><text x="655.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Глобальний реєстр,</tspan><tspan x="655.0" dy="16.9">розсіяний спільний стан</tspan></text>
<text x="105.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">КІЛЬКІСТЬ</text>
<text x="105.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ОДИН</text>
<text x="105.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">БАГАТО</text>
<text x="340.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">передають руками</text>
<text x="655.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">доступний глобально</text>
<text x="430.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ДОСЯЖНІСТЬ</text>
<text x="430.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Сінглтон — лише одна клітина; у рядку «один» ліворуч стоїть здоровіша заміна — єдиний обʼєкт, переданий руками.</text>
