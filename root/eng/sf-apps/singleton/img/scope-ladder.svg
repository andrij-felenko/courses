<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа єдиності: у яких рамках «один» справді один</text>
<rect x="150.0" y="66.0" width="690.0" height="60.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="495.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">потік (thread-local)</tspan><tspan x="495.0" dy="16.2">по одному екземпляру на КОЖЕН потік — «один» лише в межах потоку</tspan></text>
<rect x="150.0" y="142.0" width="690.0" height="60.0" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="495.0" y="168.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">завантажувач класів / бібліотека .so</tspan><tspan x="495.0" dy="16.2">сюди дістає static: рівно один на кожен loader — кілька loader-ів дають кілька «єдиних»</tspan></text>
<rect x="150.0" y="218.0" width="690.0" height="60.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="495.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">процес</tspan><tspan x="495.0" dy="16.2">звична мовчазна умова сінглтона: «один» — якщо в процесі один завантажувач</tspan></text>
<rect x="150.0" y="294.0" width="690.0" height="60.0" rx="6" fill="#fff8e1" stroke="#d9a400" stroke-width="1.5"/><text x="495.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">машина / хост — кілька процесів</tspan><tspan x="495.0" dy="16.2">кожен процес тримає свою копію: «один» уже не тримається</tspan></text>
<rect x="150.0" y="370.0" width="690.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="495.0" y="396.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">кластер — багато машин</tspan><tspan x="495.0" dy="16.2">спільної памʼяті немає зовсім → потрібна зовнішня координація (вибір лідера)</tspan></text>
<line x1="95.0" y1="72.0" x2="95.0" y2="424.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="95.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вужче</text>
<text x="95.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ширше</text>
<text x="450.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">static дає один екземпляр лише в межах одного завантажувача класів; ширші межі «один» не тримають.</text>
</svg>