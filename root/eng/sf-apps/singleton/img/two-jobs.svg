<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сінглтон поєднує дві незалежні речі в одному класі</text>
<rect x="294.2" y="62.8" width="131.6" height="54.5" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/><text x="360.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">class Config</tspan><tspan x="360.0" dy="19.5">(сінглтон)</tspan></text>
<rect x="99.6" y="198.2" width="160.8" height="83.7" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Відповідальність 1:</tspan><tspan x="180.0" dy="16.9">«існує лиш один»</tspan><tspan x="180.0" dy="16.9">(керує власним</tspan><tspan x="180.0" dy="16.9">життєвим циклом)</tspan></text>
<rect x="472.2" y="198.2" width="175.6" height="83.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Відповідальність 2:</tspan><tspan x="560.0" dy="16.9">«доступний звідусіль»</tspan><tspan x="560.0" dy="16.9">(глобальна точка</tspan><tspan x="560.0" dy="16.9">доступу)</tspan></text>
<line x1="320.0" y1="117.2" x2="180.0" y2="198.2" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="117.2" x2="560.0" y2="198.2" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Один патерн вирішує два різні питання — тому й тягне за собою два різні болі.</text>
</svg>