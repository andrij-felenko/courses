<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переупорядкування: адреса стала видимою раніше, ніж об'єкт готовий</text>
<text x="220.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як написано в коді</text>
<text x="600.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один із дозволених порядків</text>
<rect x="147.0" y="98.2" width="146.0" height="43.6" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. виділити пам'ять</tspan><tspan x="220.0" dy="15.6">під об'єкт</tspan></text>
<rect x="129.9" y="188.2" width="180.2" height="43.6" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="206.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">2. викликати конструктор</tspan><tspan x="220.0" dy="15.6">(заповнити поля)</tspan></text>
<rect x="140.2" y="278.2" width="159.6" height="43.6" rx="6" fill="#fff8e1" stroke="#d9a400" stroke-width="1.5"/><text x="220.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">3. записати посилання</tspan><tspan x="220.0" dy="15.6">helper = адреса</tspan></text>
<line x1="220.0" y1="160.0" x2="220.0" y2="170.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="220.0" y1="250.0" x2="220.0" y2="260.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="527.0" y="98.2" width="146.0" height="43.6" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">1. виділити пам'ять</tspan><tspan x="600.0" dy="15.6">під об'єкт</tspan></text>
<rect x="520.2" y="188.2" width="159.6" height="43.6" rx="6" fill="#fff8e1" stroke="#d9a400" stroke-width="1.5"/><text x="600.0" y="206.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">3. записати посилання</tspan><tspan x="600.0" dy="15.6">helper = адреса</tspan></text>
<rect x="509.9" y="278.2" width="180.2" height="43.6" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">2. викликати конструктор</tspan><tspan x="600.0" dy="15.6">(заповнити поля)</tspan></text>
<line x1="600.0" y1="160.0" x2="600.0" y2="170.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="250.0" x2="600.0" y2="260.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="775.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">◄ тут helper</text>
<text x="775.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">вже не null,</text>
<text x="775.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">а поля ще</text>
<text x="775.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">порожні</text>
<rect x="196.9" y="365.6" width="426.1" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="386.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Інший потік бачить helper != null → пропускає створення →</tspan><tspan x="410.0" dy="16.2">повертає напівготовий об'єкт із полями за замовчуванням</tspan></text>
<text x="410.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«Записати посилання» і «заповнити поля» — різні записи; ніщо не тримає їхній порядок.</text>
</svg>