<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях принципу: від keynote 1987 до SOLID</text>
<line x1="175.0" y1="78.0" x2="175.0" y2="520.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="175.0" cy="133.2" r="8.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
<text x="153.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1987 · 1988</text>
<rect x="215.0" y="82.2" width="575.0" height="102.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/>
<text x="231.0" y="106.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="231.0" dy="0.0">Барбара Лісков, keynote</tspan><tspan x="231.0" dy="16.0">«Data Abstraction and Hierarchy»</tspan><tspan x="231.0" dy="16.0">(OOPSLA 1987 → SIGPLAN Notices,</tspan><tspan x="231.0" dy="16.0">травень 1988). Перша, неформальна</tspan><tspan x="231.0" dy="16.0">властивість підстановки.</tspan></text>
<circle cx="175.0" cy="243.8" r="8.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<text x="153.0" y="248.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">1994</text>
<rect x="215.0" y="192.8" width="575.0" height="102.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/>
<text x="231.0" y="216.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="231.0" dy="0.0">Лісков і Жанет Вінг,</tspan><tspan x="231.0" dy="16.0">«A Behavioral Notion of Subtyping»</tspan><tspan x="231.0" dy="16.0">(ACM TOPLAS, листопад 1994).</tspan><tspan x="231.0" dy="16.0">Строга теорія: контракти,</tspan><tspan x="231.0" dy="16.0">інваріанти, обмеження історії.</tspan></text>
<circle cx="175.0" cy="354.2" r="8.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="153.0" y="359.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1996</text>
<rect x="215.0" y="303.2" width="575.0" height="102.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<text x="231.0" y="327.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="231.0" dy="0.0">Роберт Мартин, «The Liskov</tspan><tspan x="231.0" dy="16.0">Substitution Principle»</tspan><tspan x="231.0" dy="16.0">(C++ Report, березень 1996).</tspan><tspan x="231.0" dy="16.0">Тут уперше в обіг — назва «LSP»</tspan><tspan x="231.0" dy="16.0">як інженерне правило.</tspan></text>
<circle cx="175.0" cy="464.8" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="153.0" y="469.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">≈ 2004</text>
<rect x="215.0" y="421.8" width="575.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="231.0" y="445.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="231.0" dy="0.0">Майкл Фезерс складає п'ять</tspan><tspan x="231.0" dy="16.0">принципів Мартина в акронім</tspan><tspan x="231.0" dy="16.0">SOLID. «L» у ньому — саме LSP.</tspan><tspan x="231.0" dy="16.0">Так назва розходиться світом.</tspan></text>
</svg>