<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія інженерного документу проектування</text>
<text x="480.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія та каркас розділів Design Doc / RFC</text>
<rect x="30.0" y="45.0" width="260.0" height="110.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="160.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Контекст і проблема</text>
<text x="160.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Чому система змінюється зараз?</tspan><tspan x="160.0" dy="14.9">Які бізнес-драйвери та обмеження?</tspan><tspan x="160.0" dy="14.9">Числові метрики поточного стану.</tspan></text>
<rect x="350.0" y="45.0" width="260.0" height="110.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/>
<text x="480.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Цілі та не-цілі (Non-Goals)</text>
<text x="480.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Goals: що проект гарантовано зробить.</tspan><tspan x="480.0" dy="14.9">Non-Goals: що свідомо НЕ робиться,</tspan><tspan x="480.0" dy="14.9">захист від розмивання меж.</tspan></text>
<rect x="670.0" y="45.0" width="260.0" height="110.0" rx="6" fill="#fff9e6" stroke="#e0a800" stroke-width="2.0"/>
<text x="800.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e0a800" text-anchor="middle" font-weight="700">Пропонований дизайн</text>
<text x="800.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Архітектурна топологія, потоки даних,</tspan><tspan x="800.0" dy="14.9">контракти API, схеми моделей,</tspan><tspan x="800.0" dy="14.9">поведінка у разі збоїв.</tspan></text>
<rect x="30.0" y="195.0" width="260.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="160.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="700">Наскрізні вимоги</text>
<text x="160.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Безпека, авторизація, приватність,</tspan><tspan x="160.0" dy="14.9">спостережуваність (метрики/трейси),</tspan><tspan x="160.0" dy="14.9">ліміти ресурсів і деградація.</tspan></text>
<rect x="350.0" y="195.0" width="260.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="480.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Розглянуті альтернативи</text>
<text x="480.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Які інші варіанти були на столі?</tspan><tspan x="480.0" dy="14.9">Чому вони відкинуті?</tspan><tspan x="480.0" dy="14.9">Таблиця компромісів (trade-offs).</tspan></text>
<rect x="670.0" y="195.0" width="260.0" height="110.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="800.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">План запуску й міграції</text>
<text x="800.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Feature flags, dark launch, тіньовий рух,</tspan><tspan x="800.0" dy="14.9">міграція схеми даних (expand-contract),</tspan><tspan x="800.0" dy="14.9">план аварійного відкату.</tspan></text>
<line x1="50.0" y1="395.0" x2="910.0" y2="395.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="73.1" y="426.5" width="813.9" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="480.0" y="449.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Головний критерій повноти: кожен розділ відповідає на питання, яке на рев'ю обов'язково поставлять</tspan></text>
</svg>