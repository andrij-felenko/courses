<rect x="80.0" y="438.0" width="340.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="250.0" y="464.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">керувати доступом до об'єкта</tspan></text>
