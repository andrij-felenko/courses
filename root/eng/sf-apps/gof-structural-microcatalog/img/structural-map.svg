<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сім структурних патернів — сім відповідей на «як скласти»</text>
<circle cx="590.0" cy="58.0" r="7.0" fill="#eaf3ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="605.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">має свою статтю</text>
