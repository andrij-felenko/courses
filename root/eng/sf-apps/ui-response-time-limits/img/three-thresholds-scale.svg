<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логарифмічна шкала порогів сприйняття та вимоги до інтерфейсу</text>
<text x="540.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шкала часу реакції людини та архітектурні вимоги до інтерфейсу</text>
<line x1="90.0" y1="140.0" x2="990.0" y2="140.0" stroke="#333333" stroke-width="2.5"/>
<line x1="140.0" y1="125.0" x2="140.0" y2="155.0" stroke="#333333" stroke-width="2.0"/>
<text x="140.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">16.7 мс</text>
<text x="140.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Кадр (60 Гц)</text>
<line x1="370.0" y1="125.0" x2="370.0" y2="155.0" stroke="#333333" stroke-width="2.0"/>
<text x="370.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">100 мс (0.1 с)</text>
<text x="370.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Пряма маніпуляція</text>
<line x1="650.0" y1="125.0" x2="650.0" y2="155.0" stroke="#333333" stroke-width="2.0"/>
<text x="650.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1000 мс (1.0 с)</text>
<text x="650.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Потік думок</text>
<line x1="930.0" y1="125.0" x2="930.0" y2="155.0" stroke="#333333" stroke-width="2.0"/>
<text x="930.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">10 000 мс (10 с)</text>
<text x="930.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Межа уваги</text>
<rect x="60.0" y="190.0" width="180.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/>
<text x="150.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зона неперервного руху</text>
<text x="150.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(кінестетика)</text>
<line x1="75.0" y1="244.0" x2="225.0" y2="244.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="74.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Плавний скрол і перетягування</text>
<text x="74.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Бюджет коду на кадр: ≤10 мс</text>
<text x="74.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• При затримці &gt;16 мс — дрижання</text>
<rect x="260.0" y="190.0" width="240.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.2"/>
<text x="380.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зона причинності</text>
<text x="380.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(пряма дія)</text>
<line x1="275.0" y1="244.0" x2="485.0" y2="244.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="274.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Відчуття фізичної кнопки</text>
<text x="274.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Відгук сприймається миттєвим</text>
<text x="274.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Понад 100 мс: відчуття «комп'ютер думає»</text>
<rect x="520.0" y="190.0" width="260.0" height="70.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.2"/>
<text x="650.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зона збереження потоку</text>
<text x="650.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(робоча пам'ять)</text>
<line x1="535.0" y1="244.0" x2="765.0" y2="244.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="534.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Користувач помічає затримку</text>
<text x="534.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Контекст задачі не втрачається</text>
<text x="534.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Понад 1 с: потрібен індикатор завантаження</text>
<rect x="800.0" y="190.0" width="240.0" height="70.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.2"/>
<text x="920.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зона втрати фокусу</text>
<text x="920.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(перемикання уваги)</text>
<line x1="815.0" y1="244.0" x2="1025.0" y2="244.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="814.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Увага розсіюється на інші задачі</text>
<text x="814.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Штраф на відновлення контексту</text>
<text x="814.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вимагає детермінованого прогрес-бару</text>
</svg>