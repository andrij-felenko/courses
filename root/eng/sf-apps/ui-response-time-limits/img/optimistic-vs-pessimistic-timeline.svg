<rect x="830.0" y="378.0" width="190.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="925.0" y="399.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">Помилка: відкат + тост</tspan></text>
<text x="60.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">✓ Дотримано поріг &lt; 100 мс: відчуття миттєвої прямої маніпуляції; інтерфейс не блокується</text>
