<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія часових бюджетів: Response, Animation та Idle</text>
<text x="540.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджети часу за моделлю RAIL та анатомія кадрового слота</text>
<text x="60.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Бюджет реакції на клік / натискання (Response ≤ 100 мс)</text>
<rect x="60.0" y="95.0" width="960.0" height="52.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="60.0" y="95.0" width="480.0" height="52.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.0"/>
<text x="300.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Очікування черги подій (≤ 50 мс)</text>
<text x="300.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Попередня задача у циклі подій</text>
<rect x="540.0" y="95.0" width="480.0" height="52.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.0"/>
<text x="780.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробка вводу + підготовка кадру (≤ 50 мс)</text>
<text x="780.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Обробник події, оновлення DOM/дерева</text>
<text x="540.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Сумарно: 50 мс (черга) + 50 мс (код) = 100 мс → золотий поріг Long Task API (50 мс)</text>
<text x="60.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Бюджет кадру анімації (Animation: 16.67 мс при 60 Гц / 8.33 мс при 120 Гц)</text>
<rect x="60.0" y="240.0" width="960.0" height="56.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<rect x="60.0" y="240.0" width="460.7" height="56.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.0"/>
<text x="290.4" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скрипти застосунку (8.0 мс)</text>
<text x="290.4" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Обробка стану, VDOM diff</text>
<rect x="520.7" y="240.0" width="184.3" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.0"/>
<text x="612.8" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стилі та розкладка (3.2 мс)</text>
<text x="612.8" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Recalculate Style, Layout</text>
<rect x="705.0" y="240.0" width="161.2" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.0"/>
<text x="785.6" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Малювання шарів (2.8 мс)</text>
<text x="785.6" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Paint, Rasterization</text>
<rect x="866.2" y="240.0" width="153.8" height="56.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.0"/>
<text x="943.1" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Композиція GPU (2.7 мс)</text>
<text x="943.1" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">vsync обмін буферів</text>
<text x="540.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Для коду застосунку доступно лише ≈8–10 мс (при 60 Гц) або ≈3–4 мс (при 120 Гц)</text>
<text x="60.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Фонова робота квантами (Idle Blocks ≤ 50 мс)</text>
<rect x="60.0" y="385.0" width="220.0" height="48.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="170.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квант роботи #1 (≤50 мс)</text>
<text x="170.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">scheduler.yield()</text>
<rect x="305.0" y="385.0" width="220.0" height="48.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="415.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квант роботи #2 (≤50 мс)</text>
<text x="415.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">scheduler.yield()</text>
<rect x="550.0" y="385.0" width="220.0" height="48.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="660.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квант роботи #3 (≤50 мс)</text>
<text x="660.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">scheduler.yield()</text>
<rect x="795.0" y="385.0" width="220.0" height="48.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="905.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квант роботи #4 (≤50 мс)</text>
<text x="905.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">scheduler.yield()</text>
<text x="540.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Розбиття фонових обчислень на шматки ≤50 мс гарантує миттєву поступку потоку для обробки вводу</text>
</svg>