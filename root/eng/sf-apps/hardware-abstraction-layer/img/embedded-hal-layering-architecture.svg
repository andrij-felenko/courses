<line x1="900.0" y1="255.0" x2="900.0" y2="270.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="900.0" y1="365.0" x2="900.0" y2="380.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="900.0" y1="465.0" x2="900.0" y2="480.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
