<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багатошарова архітектура вбудованої системи: межі переносимості</text>
<text x="500.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розподіл обов'язків між додатком, драйверами компонентів, HAL, BSP та регістрами</text>
<rect x="60.0" y="85.0" width="880.0" height="75.0" rx="8" fill="#eef7f2" stroke="#27ae60" stroke-width="2.0"/>
<text x="80.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Прикладний рівень (Application / Business Logic)</text>
<text x="80.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Керування станами системи · Обробка бізнес-правил · Телеметрія · 100% переносимий код</text>
<rect x="60.0" y="175.0" width="880.0" height="80.0" rx="8" fill="#f0f5ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="80.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Драйвери зовнішніх компонентів (Device / Sensor Drivers)</text>
<text x="80.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Протоколи чипів: BME280 (I2C/SPI), W25Q Flash (SPI), дисплеї SSD1306 · Спираються ЛИШЕ на HAL</text>
<rect x="60.0" y="270.0" width="880.0" height="95.0" rx="8" fill="#fff8e8" stroke="#c0392b" stroke-width="2.5"/>
<text x="80.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Шар абстрагування апаратного забезпечення (HAL Contracts / Interfaces)</text>
<text x="80.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Єдині інтерфейси периферійних шин: GpioPin, I2cMaster, SpiMaster, UartPort, HardwareTimer</text>
<text x="80.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Не містить прив'язки до регістрів конкретного чипа; контракт перемикання та обміну байтами</text>
<rect x="60.0" y="380.0" width="880.0" height="85.0" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.0"/>
<text x="80.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700">Пакет підтримки плати (BSP - Board Support Package)</text>
<text x="80.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Конфігурація плати: тактування (Clock Tree), мапування пінів (Pinmux), живлення периферії</text>
<text x="80.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Поєднує конкретний MCU з розводкою друкованої плати: board_init(), led_on(), power_up()</text>
<rect x="60.0" y="480.0" width="880.0" height="85.0" rx="8" fill="#fdf2f2" stroke="#be123c" stroke-width="2.0"/>
<text x="80.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#be123c" text-anchor="start" font-weight="700">Низькорівневий шар / Регістри вендора (LL Drivers / CMSIS / ESP-IDF LL)</text>
<text x="80.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">STM32 LL / pico-sdk hardware_* / ESP-IDF hal / NXP fsl_*: прямий запис у регістри та бітмаски</text>
<text x="80.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">0% переносимості між виробниками; максимальна швидкість доступу до кремнію</text>
<rect x="60.0" y="580.0" width="880.0" height="75.0" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2.0"/>
<text x="80.0" y="606.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#374151" text-anchor="start" font-weight="700">Фізичний кремній та схемотехніка (Hardware Silicon &amp; External ICs)</text>
<text x="80.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Периферійні блоки MCU (GPIO, I2C, SPI контролери, DMA, NVIC) + Зовнішні датчики на шинах PCB</text>
