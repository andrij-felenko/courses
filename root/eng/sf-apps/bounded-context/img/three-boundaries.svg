<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контекст, команда, розгортання — три різні межі</text>
<text x="480.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Часто збігаються — і це зручно</text>
<rect x="100.0" y="90.0" width="300.0" height="130.0" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="250.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">розгортання (сервіс + база)</text>
<rect x="140.0" y="126.0" width="220.0" height="70.0" rx="12" fill="#eef7f0" stroke="#27ae60" stroke-width="2.2"/>
<text x="250.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">контекст (одна модель)</text>
<rect x="180.0" y="155.0" width="140.0" height="34.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="250.0" y="175.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">команда (люди)</tspan></text>
<text x="250.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">одна команда — один контекст — один сервіс</text>
<text x="480.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Але не зобов'язані — межі різні</text>
<rect x="60.0" y="352.0" width="300.0" height="150.0" rx="16" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="210.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">одна команда</text>
<rect x="80.0" y="392.0" width="120.0" height="90.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="140.0" y="433.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">контекст</tspan><tspan x="140.0" dy="15.6">Каталог</tspan></text>
<rect x="220.0" y="392.0" width="120.0" height="90.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="280.0" y="433.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">контекст</tspan><tspan x="280.0" dy="15.6">Промо</tspan></text>
<text x="210.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">межа команди ≠ межа контексту</text>
<rect x="550.0" y="352.0" width="300.0" height="150.0" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="700.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">один процес (моноліт)</text>
<rect x="570.0" y="392.0" width="120.0" height="90.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="630.0" y="433.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">контекст</tspan><tspan x="630.0" dy="15.6">Замовлення</tspan></text>
<rect x="710.0" y="392.0" width="120.0" height="90.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="770.0" y="433.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">контекст</tspan><tspan x="770.0" dy="15.6">Склад</tspan></text>
<text x="700.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">два контексти — одне розгортання</text>
</svg>