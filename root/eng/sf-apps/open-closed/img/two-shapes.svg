<text x="645.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Додати новий клас</text>
<rect x="532.0" y="96.0" width="200.0" height="46.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="632.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="632.0" dy="0.0">interface Shape</tspan><tspan x="632.0" dy="16.2">{ double area(); }</tspan></text>
