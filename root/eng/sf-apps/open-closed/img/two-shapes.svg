<text x="793.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">новий файл</text>
<circle cx="848.0" cy="200.0" r="11.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="848.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="645.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">старий код area() НЕ відкрито,</text>
<text x="645.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">не перекомпільовано, ризику нема</text>
