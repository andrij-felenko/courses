<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільця — це шлях під невизначеністю: доводь дешево, лише тоді став дорого</text>
<rect x="60.0" y="150.0" width="170.0" height="92.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.6"/>
<text x="145.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Assess</text>
<text x="145.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="145.0" dy="0.0">варте вивчення —</tspan><tspan x="145.0" dy="13.8">пробуємо на макеті,</tspan><tspan x="145.0" dy="13.8">без ставки на продукт</tspan></text>
<rect x="292.0" y="150.0" width="170.0" height="92.0" rx="6" fill="#e7ebef" stroke="#333333" stroke-width="1.6"/>
<text x="377.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Trial</text>
<text x="377.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="377.0" dy="0.0">готове до бою —</tspan><tspan x="377.0" dy="13.8">ставимо в один</tspan><tspan x="377.0" dy="13.8">реальний проєкт</tspan></text>
<rect x="524.0" y="150.0" width="170.0" height="92.0" rx="6" fill="#dfe4e9" stroke="#333333" stroke-width="1.6"/>
<text x="609.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Adopt</text>
<text x="609.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="609.0" dy="0.0">дефолт —</tspan><tspan x="609.0" dy="13.8">бери це без</tspan><tspan x="609.0" dy="13.8">зайвих питань</tspan></text>
<line x1="236.0" y1="196.0" x2="286.0" y2="196.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="261.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">докази</text>
<text x="261.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">ok</text>
<line x1="468.0" y1="196.0" x2="518.0" y2="196.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="493.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">докази</text>
<text x="493.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">ok</text>
<text x="60.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">докази накопичуються → зобов'язання росте</text>
<rect x="292.0" y="320.0" width="170.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="377.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">Hold</text>
<text x="377.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="377.0" dy="0.0">нового на цьому</tspan><tspan x="377.0" dy="13.8">не починаємо —</tspan><tspan x="377.0" dy="13.8">тихо згортаємо</tspan></text>
<line x1="145.0" y1="246.0" x2="304.0" y2="316.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="179.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">не склалося</text>
<line x1="609.0" y1="246.0" x2="450.0" y2="316.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="575.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">застаріло</text>
</svg>