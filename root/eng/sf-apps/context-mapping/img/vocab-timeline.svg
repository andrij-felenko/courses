<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="740" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки склалася мова карти контекстів: три корені однієї словникової системи</text>
<line x1="150.0" y1="90.0" x2="150.0" y2="660.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="150.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">час</text>
<circle cx="150.0" cy="155.0" r="9.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="124.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="end" font-weight="700">1968</text>
<circle cx="150.0" cy="360.0" r="9.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="124.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="end" font-weight="700">1997</text>
<circle cx="150.0" cy="570.0" r="9.0" fill="#0f766e" stroke="#0f766e" stroke-width="2.0"/>
<text x="124.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f766e" text-anchor="end" font-weight="700">2003</text>
<rect x="216.0" y="104.0" width="920.0" height="102.0" rx="12" fill="#eef3fe" stroke="#2457d6" stroke-width="2.0"/>
<line x1="159.0" y1="155.0" x2="216.0" y2="155.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="236.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Закон Конвея — межі системи повторюють межі команд</text>
<text x="1116.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">M. Conway, Datamation</text>
<text x="236.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">«Система переймає форму спілкування організації, що її будує.»</text>
<text x="236.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Корінь питання «звідки взялися самі кордони» на карті.</text>
<rect x="216.0" y="309.0" width="920.0" height="102.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<line x1="159.0" y1="360.0" x2="216.0" y2="360.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="236.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">«Велика грудка багна» — чесне ім'я для хаосу</text>
<text x="1116.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">B. Foote · J. Yoder, PLoP '97</text>
<text x="236.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Стихійно заросла система — де-факто найпоширеніша архітектура.</text>
<text x="236.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Термін передує Евансу; карта переймає його як законний елемент.</text>
<rect x="216.0" y="508.5" width="920.0" height="123.0" rx="12" fill="#e8f5f2" stroke="#0f766e" stroke-width="2.0"/>
<line x1="159.0" y1="570.0" x2="216.0" y2="570.0" stroke="#0f766e" stroke-width="1.8"/>
<text x="236.0" y="534.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f766e" text-anchor="start" font-weight="700">Карта контекстів і словник із восьми відносин</text>
<text x="1116.0" y="534.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">E. Evans, DDD · частина IV</text>
<text x="236.0" y="556.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">partnership · shared kernel · customer/supplier · conformist</text>
<text x="236.0" y="577.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">anticorruption layer · open host service · published language · separate ways</text>
<text x="236.0" y="598.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Не винахід одного — синтез спостережень спільноти патернів.</text>
<text x="216.0" y="700.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">Три різні корені — форма організації, чесність про хаос, іменований зв'язок — зійшлися в одну робочу мову.</text>
</svg>