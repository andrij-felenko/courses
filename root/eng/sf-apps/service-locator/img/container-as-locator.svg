<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контейнер у двох ролях</text>
<text x="600.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">той самий інструмент чесний на порозі й шкідливий у нутрі</text>
<rect x="50.0" y="78.0" width="1100.0" height="200.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.8"/>
<text x="72.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">КОРІНЬ — поріг програми</text>
<rect x="145.0" y="167.6" width="210.0" height="48.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="250.0" y="188.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">контейнер</tspan><tspan x="250.0" dy="16.2">(DI-контейнер)</tspan></text>
<rect x="760.0" y="167.6" width="250.0" height="48.8" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.9"/><text x="885.0" y="188.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">OrderService(gateway)</tspan><tspan x="885.0" dy="16.2">дістав саме шлюз</tspan></text>
<line x1="363.0" y1="192.0" x2="752.0" y2="192.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="557.5" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">збирає граф і подає готове</text>
<text x="557.5" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стрілка-впровадження</text>
<text x="885.0" y="238.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">✓ правильно</text>
<line x1="50.0" y1="306.0" x2="358.0" y2="306.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,5"/>
<line x1="842.0" y1="306.0" x2="1150.0" y2="306.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,5"/>
<rect x="381.7" y="290.0" width="436.6" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="600.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">контейнер торкається коду рівно в одній точці — у корені</tspan></text>
<rect x="50.0" y="336.0" width="1100.0" height="214.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="72.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">НУТРО — робочий код</text>
<rect x="205.0" y="420.4" width="300.0" height="63.2" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.7"/><text x="355.0" y="440.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">OrderService</tspan><tspan x="355.0" dy="15.6">ctor(container: Container)</tspan><tspan x="355.0" dy="15.6">resolve&lt;PaymentGateway&gt;()</tspan></text>
<rect x="745.0" y="435.8" width="170.0" height="32.5" rx="6" fill="#f3f4f6" stroke="#c0392b" stroke-width="1.6"/><text x="830.0" y="456.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">container</tspan></text>
<line x1="513.0" y1="445.0" x2="737.0" y2="445.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="625.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">смик resolve() посеред методу</text>
<text x="625.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">прийнято ВЕСЬ контейнер</text>
<text x="600.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">сигнатура каже «потрібен контейнер» = «потрібно все» → став локатором</text>
<text x="600.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">контейнер видно ЛИШЕ в корені; resolve() усередині коду — майже завжди помилка на рев'ю</text>
</svg>