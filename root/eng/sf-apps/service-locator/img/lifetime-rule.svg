<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило життя й полонена залежність</text>
<text x="600.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">служба залежить лише від рівного або довшого життя</text>
<rect x="250.0" y="106.0" width="830.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="60.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">сінглтон</text>
<text x="665.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">весь застосунок</text>
<rect x="250.0" y="150.0" width="420.0" height="32.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
<text x="60.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">scoped</text>
<text x="460.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">один запит</text>
<rect x="250.0" y="194.0" width="150.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="60.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">transient</text>
<text x="325.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">один виклик</text>
<text x="600.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">залежати можна лише праворуч — на рівне або довше життя</text>
<text x="600.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">scoped → scoped/сінглтон ✓    ·    transient → будь-що ✓    ·    сінглтон → лише сінглтон ✓</text>
<line x1="40.0" y1="306.0" x2="1160.0" y2="306.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="600.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЗАБОРОНЕНО: сінглтон тримає scoped (коротше життя)</text>
<text x="343.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">полонений — тримається аж до кінця віку сінглтона</text>
<line x1="343.0" y1="384.0" x2="1070.0" y2="384.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="250.0" y="396.0" width="830.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.6"/>
<text x="60.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">сінглтон</text>
<rect x="268.0" y="404.0" width="150.0" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="343.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">UnitOfWork</text>
<line x1="470.0" y1="392.0" x2="470.0" y2="448.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5,5"/>
<text x="470.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">кінець запиту</text>
<text x="470.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">тут scoped мав померти</text>
<text x="1072.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">транзакція протухла → витік</text>
<line x1="40.0" y1="512.0" x2="1160.0" y2="512.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="600.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Полонена залежність» (Mark Seemann): коротше життя не сміє переживати свою область</text>
<text x="600.0" y="564.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">довше життя тримає коротше прив'язаним — і воно застаряє разом з утриманим станом</text>
</svg>