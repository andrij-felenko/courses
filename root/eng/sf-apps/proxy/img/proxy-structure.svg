<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заступник стоїть на місці справжнього об'єкта</text>
<text x="560.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">клієнт працює через інтерфейс і не бачить, хто за ним</text>
<rect x="45.0" y="207.5" width="210.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="150.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Клієнт</tspan><tspan x="150.0" dy="16.2">тримає тип «Image»</tspan><tspan x="150.0" dy="16.2">викликає draw()</tspan></text>
<rect x="380.0" y="207.5" width="240.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.9"/><text x="500.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">ImageProxy</tspan><tspan x="500.0" dy="16.2">той самий інтерфейс</tspan><tspan x="500.0" dy="16.2">тримає лише шлях</tspan></text>
<line x1="255.0" y1="240.0" x2="378.0" y2="240.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="317.5" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">draw()</text>
<rect x="785.0" y="207.5" width="230.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="900.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">RealImage</tspan><tspan x="900.0" dy="16.2">читає ВЕСЬ файл</tspan><tspan x="900.0" dy="16.2">важкий у пам'яті</tspan></text>
<line x1="622.0" y1="240.0" x2="783.0" y2="240.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="702.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">створюється</text>
<text x="702.5" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">аж на перший виклик</text>
<text x="900.0" y="302.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">до першого дотику — порожньо</text>
<line x1="45.0" y1="394.0" x2="620.0" y2="394.0" stroke="#2457d6" stroke-width="1.4"/>
<text x="332.5" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">це все, що бачить клієнт</text>
</svg>