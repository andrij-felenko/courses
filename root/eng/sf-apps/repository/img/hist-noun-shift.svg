<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 712" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="712" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Іменник у центрі абстракції: 1984 → 2003</text>
<text x="206.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Коли й хто</text>
<text x="506.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Що назвали</text>
<text x="880.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Що стоїть у центрі абстракції</text>
<rect x="60.0" y="100.0" width="292.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="206.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">1984 · Джордж Коупленд,</tspan><tspan x="206.0" dy="16.9">Девід Маєр (GemStone)</tspan></text>
<rect x="382.0" y="100.0" width="248.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="506.0" y="137.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="506.0" dy="0.0">неузгодженість опорів</tspan><tspan x="506.0" dy="19.5">(impedance mismatch)</tspan></text>
<rect x="660.0" y="100.0" width="440.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="137.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">прірву не мостять — її скасовують:</tspan><tspan x="880.0" dy="18.2">об'єктна СКБД замість реляційної</tspan></text>
<rect x="60.0" y="200.0" width="292.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="206.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">1995–96 · Кайл Браун,</tspan><tspan x="206.0" dy="16.9">Брюс Вайтенек (Smalltalk)</tspan></text>
<rect x="382.0" y="200.0" width="248.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="506.0" y="247.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="506.0" dy="0.0">Crossing Chasms</tspan></text>
<rect x="660.0" y="200.0" width="440.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="237.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">рядок і таблиця:</tspan><tspan x="880.0" dy="18.2">як один об'єкт лягає в базу</tspan></text>
<rect x="60.0" y="300.0" width="292.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="206.0" y="338.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">2001 · Діпак Алур, Джон Крупі,</tspan><tspan x="206.0" dy="16.9">Ден Малкс (Sun Java Center)</tspan></text>
<rect x="382.0" y="300.0" width="248.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="506.0" y="347.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="506.0" dy="0.0">DAO</tspan></text>
<rect x="660.0" y="300.0" width="440.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="880.0" y="337.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">ДЖЕРЕЛО ДАНИХ</tspan><tspan x="880.0" dy="18.2">«абстрагувати доступ до джерела»</tspan></text>
<rect x="60.0" y="438.0" width="292.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="206.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">2002 · Едвард Гіатт, Роб Мі</tspan><tspan x="206.0" dy="16.9">(гостьовий запис у PoEAA)</tspan></text>
<rect x="382.0" y="438.0" width="248.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="506.0" y="485.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="506.0" dy="0.0">Repository</tspan></text>
<rect x="660.0" y="438.0" width="440.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.5"/><text x="880.0" y="475.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">КОЛЕКЦІЯ ДОМЕННИХ ОБ'ЄКТІВ</tspan><tspan x="880.0" dy="18.2">«інтерфейс на кшталт колекції»</tspan></text>
<rect x="60.0" y="538.0" width="292.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="206.0" y="576.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">2003 · Ерік Еванс</tspan><tspan x="206.0" dy="16.9">(Domain-Driven Design)</tspan></text>
<rect x="382.0" y="538.0" width="248.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="506.0" y="585.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="506.0" dy="0.0">REPOSITORY</tspan></text>
<rect x="660.0" y="538.0" width="440.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.5"/><text x="880.0" y="575.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">КОРІНЬ АГРЕГАТУ</tspan><tspan x="880.0" dy="18.2">«лише там, де потрібен прямий доступ»</tspan></text>
<rect x="262.2" y="393.0" width="655.6" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/><text x="590.0" y="415.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">тут іменник у центрі змінився: джерело даних → колекція доменних об'єктів</tspan></text>
<text x="590.0" y="668.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Форма абстракції майже не змінилася — інтерфейс, за яким сховані запити.</text>
<text x="590.0" y="690.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Змінилося те, ЩО вона обіцяє сховати: не драйвер бази, а саму наявність бази.</text>
</svg>