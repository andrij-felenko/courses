<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від SAAM до ATAM: не спалах, а три кроки дозрівання</text>
<line x1="60.0" y1="90.0" x2="820.0" y2="90.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="150.0" y1="83.0" x2="150.0" y2="97.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="150.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1994</text>
<text x="150.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">предок</text>
<line x1="430.0" y1="83.0" x2="430.0" y2="97.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="430.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1998</text>
<text x="430.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">перша публікація</text>
<line x1="720.0" y1="83.0" x2="720.0" y2="97.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="720.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2000</text>
<text x="720.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-style="italic">зрілий метод</text>
<rect x="60.0" y="167.6" width="180.0" height="84.8" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="2.0"/><text x="150.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">SAAM</tspan><tspan x="150.0" dy="15.6">сценарний аналіз</tspan><tspan x="150.0" dy="15.6">прицілений на ОДНУ</tspan><tspan x="150.0" dy="15.6">якість — змінюваність</tspan></text>
<rect x="335.0" y="167.6" width="190.0" height="84.8" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.2"/><text x="430.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">ATAM (1998)</tspan><tspan x="430.0" dy="15.6">спіраль, 6 кроків</tspan><tspan x="430.0" dy="15.6">ЧУТЛИВІ точки +</tspan><tspan x="430.0" dy="15.6">ТОЧКИ КОМПРОМІСУ</tspan></text>
<rect x="622.5" y="167.6" width="195.0" height="84.8" rx="6" fill="#fff9e6" stroke="#e0a800" stroke-width="2.2"/><text x="720.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">ATAM (2000)</tspan><tspan x="720.0" dy="15.6">9 кроків, 2 фази</tspan><tspan x="720.0" dy="15.6">+ дерево корисності</tspan><tspan x="720.0" dy="15.6">+ ризики / не-ризики</tspan></text>
<line x1="240.0" y1="210.0" x2="335.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="525.0" y1="210.0" x2="622.5" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ідея (сценарії, 1994) → перша публікація методу (1998) → зрілий метод (2000).</text>
<text x="430.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Дерева корисності й не-ризиків у версії 1998 ще НЕ було — їх додала версія 2000.</text>
</svg>