<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл тимчасового ідентифікатора (Temp-ID) та трансляція ключів</text>
<rect x="65.0" y="78.4" width="250.0" height="63.2" rx="6" fill="#f4f8fb" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1. Створення сутності</tspan><tspan x="190.0" dy="15.6">Клієнт генерує temp-id:</tspan><tspan x="190.0" dy="15.6">`temp_task_9a2f`</tspan></text><line x1="325.0" y1="110.0" x2="415.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="430.0" y="78.4" width="240.0" height="63.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="550.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">2. UI рендерить елемент</tspan><tspan x="550.0" dy="15.6">Дозволено дочірні дії:</tspan><tspan x="550.0" dy="15.6">`parent_id: temp_task_9a2f`</tspan></text><line x1="680.0" y1="110.0" x2="770.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="795.0" y="78.4" width="210.0" height="63.2" rx="6" fill="#fdfbf7" stroke="#d97706" stroke-width="1.5"/><text x="900.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">3. POST /api/tasks</tspan><tspan x="900.0" dy="15.6">Запит несе намір і</tspan><tspan x="900.0" dy="15.6">клієнтський temp-id</tspan></text><line x1="900.0" y1="155.0" x2="900.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="770.3" y="248.4" width="259.4" height="63.2" rx="6" fill="#eef3f8" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">4. Сервер призначає ID</tspan><tspan x="900.0" dy="15.6">HTTP 201 Created</tspan><tspan x="900.0" dy="15.6">`{ tempId: '...', serverId: 7812 }`</tspan></text><line x1="775.0" y1="280.0" x2="685.0" y2="280.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="260.0" y="248.4" width="380.0" height="63.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="450.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">5. Таблиця трансляції ID (Temp-to-Server Mapping)</tspan><tspan x="450.0" dy="15.6">`temp_task_9a2f`  ↦  `7812`</tspan><tspan x="450.0" dy="15.6">Підміна ключів у кеші, черзі залежних мутацій та URL</tspan></text><line x1="250.0" y1="280.0" x2="190.0" y2="280.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="190.0" y1="315.0" x2="190.0" y2="350.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="65.0" y="358.4" width="250.0" height="63.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="378.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">6. Повне узгодження</tspan><tspan x="190.0" dy="15.6">Сутність зафіксована;</tspan><tspan x="190.0" dy="15.6">тимчасовий ключ видалено</tspan></text><rect x="350.0" y="370.0" width="640.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#b8c2cc" stroke-width="1.2"/><text x="670.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Захист від розриву зв'язків: якщо дочірня мутація відправилась до отримання serverId,</text><text x="670.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">клієнтський диспетчер оновлює payload наступного запиту перед його виходом у мережу.</text>
</svg>