<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тришарова модель: канонічний стан, черга намірів та стан подання</text>
<rect x="50.0" y="70.0" width="960.0" height="100.0" rx="8" fill="#f4f8fb" stroke="#2457d6" stroke-width="1.8"/><text x="530.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Канонічний серверний стан (Canonical Server State — S_server)</text><text x="530.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Підтверджений бекендом стан сутностей: перевірені ID, збережені версії, дійсні права доступу</text><text x="530.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оновлюється ТІЛЬКИ відповідями сервера (GET / WS / ACK мутацій)</text><line x1="530.0" y1="175.0" x2="530.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="545.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">+</text><rect x="50.0" y="220.0" width="960.0" height="115.0" rx="8" fill="#fdfbf7" stroke="#d97706" stroke-width="1.8"/><text x="530.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">Черга локальних оптимістичних мутацій (Pending Mutation Queue — [Δ₁, Δ₂, ...])</text><rect x="110.0" y="276.0" width="200.0" height="32.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="210.0" y="296.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Δ₁: Like (temp-id: 101)</tspan></text><rect x="380.0" y="276.0" width="200.0" height="32.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="480.0" y="296.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Δ₂: Edit text (id: 42)</tspan></text><rect x="650.0" y="276.0" width="200.0" height="32.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="750.0" y="296.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Δ₃: Move card (id: 88)</tspan></text><line x1="530.0" y1="340.0" x2="530.0" y2="380.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><text x="545.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">reduce()</text><rect x="50.0" y="385.0" width="960.0" height="95.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Похідний стан подання (Derived View State — S_view)</text><text x="530.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">S_view = reduce(S_server, [Δ₁, Δ₂, ...]) — стан, який бачить рендерер UI просто зараз</text><text x="530.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Відкат збійної дії Δ₂ — це видалення її з черги та миттєвий перерахунок S_view без втрати Δ₁ і Δ₃</text>
</svg>