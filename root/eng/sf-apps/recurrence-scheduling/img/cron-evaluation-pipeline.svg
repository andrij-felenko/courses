<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр бітової фільтрації та обчислення CRON</text>
<rect x="45.2" y="76.6" width="229.6" height="66.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="160.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Вираз CRON</tspan><tspan x="160.0" dy="16.9">30 2 1,15 * 1-5</tspan><tspan x="160.0" dy="16.9">(хв год день міс день_тиж)</tspan></text>
<rect x="340.0" y="55.0" width="360.0" height="110.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="520.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Бітові маски (uint64_t):</tspan><tspan x="520.0" dy="15.6">• min_mask: біт 30 (0x40000000)</tspan><tspan x="520.0" dy="15.6">• hour_mask: біт 2 (0x00000004)</tspan><tspan x="520.0" dy="15.6">• dom_mask: біти 1, 15 (0x8002)</tspan><tspan x="520.0" dy="15.6">• mon_mask: біти 1..12 (0x1FFE)</tspan><tspan x="520.0" dy="15.6">• dow_mask: біти 1..5 (Пн-Пт, 0x3E)</tspan></text>
<line x1="274.8" y1="110.0" x2="340.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="307.4" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">парсинг</text>
<rect x="830.0" y="70.6" width="240.0" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="950.0" y="90.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="950.0" dy="0.0">Логіка дня:</tspan><tspan x="950.0" dy="15.6">DOM &amp; DOW не *</tspan><tspan x="950.0" dy="15.6">→ операція OR (POSIX)</tspan><tspan x="950.0" dy="15.6">(1-е АБО 15-е АБО Пн..Пт)</tspan></text>
