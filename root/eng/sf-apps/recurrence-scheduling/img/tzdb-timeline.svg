<text x="270.0" y="507.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">14 жовтня 2011</text>
<circle cx="300.0" cy="502.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
