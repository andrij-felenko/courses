<text x="550.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хроніка бази часових поясів</text>
<line x1="300.0" y1="84.0" x2="300.0" y2="824.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="270.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1986 і раніше</text>
<circle cx="300.0" cy="118.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
