<text x="270.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">6 жовтня 2011</text>
<circle cx="300.0" cy="406.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
