<rect x="350.0" y="485.5" width="700.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="700.0" y="506.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ICANN бере проєкт під опіку, адреса стає tz@iana.org</tspan></text>
<text x="270.0" y="603.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">лютий 2012</text>
<circle cx="300.0" cy="598.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<line x1="310.0" y1="598.0" x2="342.0" y2="598.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4 5"/>
<rect x="350.0" y="573.0" width="700.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="700.0" y="594.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Позов відкликано з обіцянкою не позиватися;</tspan><tspan x="700.0" dy="16.9">RFC 6557 закріплює порядок супроводу</tspan></text>
<text x="270.0" y="699.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">вересень 2021</text>
<circle cx="300.0" cy="694.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<line x1="310.0" y1="694.0" x2="342.0" y2="694.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4 5"/>
<rect x="350.0" y="669.0" width="700.0" height="49.9" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.8"/><text x="700.0" y="690.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Випуск 2021b зливає зони, чиї годинники</tspan><tspan x="700.0" dy="16.9">збігаються від 1970 року</tspan></text>
<text x="270.0" y="795.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">серпень 2022</text>
