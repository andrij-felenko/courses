<rect x="350.0" y="773.5" width="700.0" height="33.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="700.0" y="794.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Випуск 2022b: Europe/Kiev → Europe/Kyiv</tspan></text>
<text x="550.0" y="872.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">випуски виходять без розкладу — щойно черговий парламент змінить правило</text>
