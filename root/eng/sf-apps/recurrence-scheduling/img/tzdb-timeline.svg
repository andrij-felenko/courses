<rect x="350.0" y="93.0" width="700.0" height="49.9" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.8"/><text x="700.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Артур Девід Олсон збирає правила поясів;</tspan><tspan x="700.0" dy="16.9">обмін листами на машині elsie в NIH (США)</tspan></text>
<text x="270.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">від 1996</text>
