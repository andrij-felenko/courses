<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крайові випадки літнього часу: прогалина (gap) та дублювання (overlap)</text>
<rect x="40.0" y="80.0" width="1100.0" height="205.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="60.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">1. Весна: прогалина (03:00 → 04:00 у Києві) — часу 03:30 фізично немає на годиннику</text>
<line x1="80.0" y1="160.0" x2="270.0" y2="160.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="490.0" y1="160.0" x2="1100.0" y2="160.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="60.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">настінний час</text>
<circle cx="160.0" cy="160.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="160.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">02:00</text>
<rect x="270.0" y="140.0" width="220.0" height="40.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="362.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ПРОГАЛИНА (03:00–03:59)</text>
<text x="380.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ціль: 03:30 (не існує!)</text>
<circle cx="580.0" cy="160.0" r="5.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="580.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">04:00 EEST</text>
<circle cx="780.0" cy="160.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="780.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">05:00</text>
<line x1="380.0" y1="182.0" x2="570.0" y2="170.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="498.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">стратегія A: підтягнути до 04:00</text>
<line x1="380.0" y1="138.0" x2="480.0" y2="235.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="540.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">стратегія B: пропустити запуск доби</text>
<rect x="40.0" y="310.0" width="1100.0" height="215.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="60.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">2. Осінь: дублювання (04:00 → 03:00 у Києві) — час 03:30 настає ДВІЧІ в різний UTC</text>
<line x1="80.0" y1="405.0" x2="1100.0" y2="405.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="60.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">фізична вісь UTC</text>
<circle cx="300.0" cy="405.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="300.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">03:30 (fold=0)</text>
<text x="300.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UTC+3 (літній час)</text>
<text x="300.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">00:30 UTC</text>
<line x1="520.0" y1="360.0" x2="520.0" y2="490.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="520.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">переведення 04:00 → 03:00</text>
<circle cx="740.0" cy="405.0" r="7.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="740.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">03:30 (fold=1)</text>
<text x="740.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UTC+2 (стандартний)</text>
<text x="740.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">01:30 UTC (+60 хв пізніше)</text>
<text x="590.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Розв'язання неоднозначності: явний прапорець fold (0 — перший раз, 1 — повторний) + ключ ідемпотентності</text>
</svg>