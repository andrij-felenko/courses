<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід: чотири внески сходяться в одну назву</text>
<rect x="55.0" y="103.5" width="230.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">1963 · Sketchpad</tspan></text>
<rect x="55.0" y="160.4" width="230.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">машина вперше</tspan><tspan x="170.0" dy="15.6">чекає на людину</tspan><tspan x="170.0" dy="15.6">(цикл подій)</tspan></text>
<rect x="385.0" y="103.5" width="230.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">1979 · MVC (PARC)</tspan></text>
<rect x="385.0" y="160.4" width="230.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">модель оголошує</tspan><tspan x="500.0" dy="15.6">зміну — залежні</tspan><tspan x="500.0" dy="15.6">слухають</tspan></text>
<rect x="715.0" y="103.5" width="230.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="830.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">1994 · «Спостерігач»</tspan></text>
<rect x="715.0" y="160.4" width="230.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">механізм названо</tspan><tspan x="830.0" dy="15.6">як патерн</tspan><tspan x="830.0" dy="15.6">(GoF)</tspan></text>
<rect x="285.0" y="373.9" width="430.0" height="52.2" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="395.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">event-driven architecture</tspan><tspan x="500.0" dy="18.2">Рой Шульте · Gartner · ~2003</tspan></text>
<line x1="170.0" y1="223.6" x2="440.6" y2="370.9" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="500.0" y1="223.6" x2="500.0" y2="370.9" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="830.0" y1="223.6" x2="559.4" y2="370.9" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="25.5" y="368.4" width="205.0" height="63.2" rx="6" fill="#fdf3e0" stroke="#c0392b" stroke-width="1.5"/><text x="128.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="128.0" dy="0.0">доменні події</tspan><tspan x="128.0" dy="15.6">Фаулер 2005 · Еванс 2014</tspan><tspan x="128.0" dy="15.6">(зміст факту)</tspan></text>
<line x1="234.5" y1="400.0" x2="281.0" y2="400.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="500.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">річ старша за назву — механізм визрівав десятиліттями,</text>
<text x="500.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">ім'я «архітектура» дав аналітик, а не винахідник</text>
<text x="500.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">дата біля вузла — коли з'явилося ІМ'Я, а не РІЧ</text>
</svg>