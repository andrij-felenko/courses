<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1090" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="545.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа даних: три способи перетнути її й що при цьому робить потік інтерфейсу</text>
<rect x="35.0" y="70.0" width="320.0" height="320.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="195.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">копія</text>
<rect x="65.0" y="128.0" width="110.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">інтерфейс</tspan></text>
<rect x="215.0" y="128.0" width="110.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">фон</tspan></text>
<line x1="180.0" y1="148.0" x2="210.0" y2="148.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65.0" y="178.0" width="110.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">дані</tspan></text>
<rect x="215.0" y="178.0" width="110.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">копія даних</tspan></text>
<text x="195.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">час ∝ розміру даних</text>
<text x="195.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">дані впаковуються в повідомлення</tspan><tspan x="195.0" dy="15.6">й лягають у чергу другого потоку;</tspan><tspan x="195.0" dy="15.6">спільної пам'яті немає, тож немає</tspan><tspan x="195.0" dy="15.6">й гонок — але платиш за кожен байт</tspan></text>
<rect x="55.0" y="336.0" width="280.0" height="40.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="195.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">потік інтерфейсу не чекає</tspan></text>
<rect x="385.0" y="70.0" width="320.0" height="320.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="545.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">передача власності</text>
<rect x="415.0" y="128.0" width="110.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">інтерфейс</tspan></text>
<rect x="565.0" y="128.0" width="110.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">фон</tspan></text>
<line x1="530.0" y1="148.0" x2="560.0" y2="148.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="415.0" y="178.0" width="110.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">порожньо</tspan></text>
<rect x="565.0" y="178.0" width="110.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">дані</tspan></text>
<text x="545.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">час сталий, розмір не важить</text>
<text x="545.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">рухається лише покажчик;</tspan><tspan x="545.0" dy="15.6">відправник утрачає доступ,</tspan><tspan x="545.0" dy="15.6">тож у кожної одиниці даних</tspan><tspan x="545.0" dy="15.6">будь-коли рівно один власник</tspan></text>
<rect x="405.0" y="336.0" width="280.0" height="40.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">потік інтерфейсу не чекає</tspan></text>
<rect x="735.0" y="70.0" width="320.0" height="320.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="895.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">спільна пам'ять під замком</text>
<rect x="765.0" y="128.0" width="110.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">інтерфейс</tspan></text>
<rect x="915.0" y="128.0" width="110.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">фон</tspan></text>
<rect x="820.0" y="178.0" width="150.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="895.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">спільні дані</tspan></text>
<line x1="820.0" y1="168.0" x2="865.0" y2="178.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="970.0" y1="168.0" x2="925.0" y2="178.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="895.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">копіювання немає, є очікування</text>
<text x="895.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">доступ без копії, зате замок</tspan><tspan x="895.0" dy="15.6">повертає в систему саме те,</tspan><tspan x="895.0" dy="15.6">що ми виганяли, — право</tspan><tspan x="895.0" dy="15.6">потоку інтерфейсу стояти</tspan></text>
<rect x="755.0" y="336.0" width="280.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="895.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">потік інтерфейсу може стояти</tspan></text>
<text x="545.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">перші два різняться ціною, третій — природою: лише він повертає потоку інтерфейсу здатність чекати</text>
</svg>