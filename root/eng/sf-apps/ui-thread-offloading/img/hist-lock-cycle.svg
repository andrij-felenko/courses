<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зворотні виклики роблять порядок захоплення замків неможливим</text>
<rect x="70.0" y="150.0" width="300.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="195.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">код застосунку</tspan><tspan x="220.0" dy="18.2">власний замок моделі</tspan></text>
<rect x="710.0" y="150.0" width="300.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="195.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">код оболонки</tspan><tspan x="860.0" dy="18.2">замок дерева елементів</tspan></text>
<line x1="380.0" y1="132.0" x2="700.0" y2="132.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="540.0" dy="0.0">застосунок кличе оболонку</tspan><tspan x="540.0" dy="15.6">тримає замок моделі,</tspan><tspan x="540.0" dy="15.6">просить замок дерева</tspan></text>
<line x1="700.0" y1="288.0" x2="380.0" y2="288.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="540.0" dy="0.0">оболонка кличе застосунок</tspan><tspan x="540.0" dy="15.6">тримає замок дерева,</tspan><tspan x="540.0" dy="15.6">просить замок моделі</tspan></text>
<rect x="441.3" y="180.1" width="197.3" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="540.0" y="201.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">два порядки захоплення</tspan><tspan x="540.0" dy="16.9">= цикл очікування</tspan></text>
<text x="540.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Жоден бік не володіє обома замками, і кожен напрямок — цілком нормальний код.</text>
<text x="540.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Спільного порядку захоплення просто нема кому призначити.</text>
<text x="540.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ліки, що лишаються: замків не мати взагалі — дерево чіпає рівно один потік.</text>
</svg>