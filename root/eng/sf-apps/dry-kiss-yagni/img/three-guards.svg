<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три застави проти складності-пасиву</text>
<rect x="322.2" y="248.8" width="215.5" height="82.4" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="430.0" y="272.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">БАЛАНС КОДУ</text>
<text x="430.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">кожен зайвий рядок —</text>
<text x="430.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">пасив, борг на майбутнє</text>
<rect x="67.6" y="254.6" width="164.8" height="70.8" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="150.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">YAGNI</text>
<text x="150.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">не будуй заради</text>
<text x="150.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">уявного майбутнього</text>
<text x="150.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вісь часу</text>
<line x1="236.4" y1="290.0" x2="318.2" y2="290.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="430.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вісь кмітливості</text>
<rect x="329.1" y="63.0" width="201.8" height="53.9" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="430.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">KISS</text>
<text x="430.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">просте замість розумного</text>
<line x1="430.0" y1="121.0" x2="430.0" y2="244.8" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="700.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вісь знання</text>
<rect x="639.8" y="254.6" width="120.3" height="70.8" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="700.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">DRY</text>
<text x="700.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">одне знання —</text>
<text x="700.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">одне джерело</text>
<line x1="635.8" y1="290.0" x2="541.8" y2="290.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="700.0" y1="327.4" x2="700.0" y2="396.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,4"/>
<rect x="609.3" y="388.6" width="181.3" height="82.8" rx="8" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.8"/>
<text x="700.0" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">перетягнеш DRY —</text>
<text x="700.0" y="426.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ХИБНА АБСТРАКЦІЯ</text>
<text x="700.0" y="444.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">одна силою тримає</text>
<text x="700.0" y="461.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">два різні знання</text>
</svg>