<text x="166.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">За виміром: множення на обернене б'є в ПОДІЛ</text>
