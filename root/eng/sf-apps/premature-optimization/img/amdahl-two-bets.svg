<rect x="158.2" y="463.5" width="503.6" height="33.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.4"/><text x="410.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">S = 1 / ((1 − p) + p/s)   —   мале p ⇒ стеля притиснута до 1</tspan></text>
