<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знекровлений мішок у багату модель: п'ять кроків</text>
<rect x="34.0" y="480.0" width="196.0" height="104.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="56.0" cy="504.0" r="14.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="56.0" y="509.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="78.0" y="509.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Закрити поля</text>
<text x="132.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">публічні поля роблять</text>
<text x="132.0" y="557.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">приватними, сеттери — геть</text>
<line x1="224.0" y1="532.0" x2="256.0" y2="435.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="250.0" y="383.0" width="196.0" height="104.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="272.0" cy="407.0" r="14.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="272.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="294.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Внести інваріант</text>
<text x="348.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">правило зі стороннього</text>
<text x="348.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сервісу переносимо в об'єкт</text>
<line x1="440.0" y1="435.0" x2="472.0" y2="338.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="466.0" y="286.0" width="196.0" height="104.0" rx="10" fill="#f2faf5" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="488.0" cy="310.0" r="14.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="488.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="510.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Єдині двері</text>
<text x="564.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перехід стану — лише</text>
<text x="564.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">через метод-команду</text>
<line x1="656.0" y1="338.0" x2="688.0" y2="241.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="682.0" y="189.0" width="196.0" height="104.0" rx="10" fill="#f2faf5" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="704.0" cy="213.0" r="14.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="704.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="726.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Об'єкт-значення</text>
<text x="780.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">суму й гроші — у свій тип,</text>
<text x="780.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">що сам себе стереже</text>
<line x1="872.0" y1="241.0" x2="904.0" y2="144.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="898.0" y="92.0" width="196.0" height="104.0" rx="10" fill="#f2faf5" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="920.0" cy="116.0" r="14.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="920.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="942.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Корінь агрегату</text>
<text x="996.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">позиції — лише через корінь;</text>
<text x="996.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сума завжди сходиться</text>
<text x="60.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-style="italic">нижчі кроки прибирають діри;</text>
<text x="60.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-style="italic">вищі роблять некоректний стан недосяжним</text>
</svg>