<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 482" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1260" height="482" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стос HTTP-middleware: виконання онієном і два обриви</text>
<text x="630.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кожен шар робить «ДО», делегує глибше, тоді «ПІСЛЯ» — та Auth і Cache можуть обірвати ланцюг</text>
<line x1="60.0" y1="100.0" x2="1180.0" y2="100.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="60.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">запит → всередину: «ДО», тоді next()</text>
<rect x="60.0" y="125.0" width="150.0" height="130.0" rx="12" fill="#fbfcfd" stroke="#c0392b" stroke-width="1.8"/>
<text x="135.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Recover</text>
<text x="135.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">паніка → 500</text>
<rect x="220.0" y="125.0" width="150.0" height="130.0" rx="12" fill="#fbfcfd" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="295.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Logger</text>
<text x="295.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">метод, шлях</text>
<rect x="380.0" y="125.0" width="150.0" height="130.0" rx="12" fill="#fbfcfd" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="455.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Timer</text>
<text x="455.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">старт годинника</text>
<rect x="540.0" y="125.0" width="150.0" height="130.0" rx="12" fill="#fbfcfd" stroke="#c0392b" stroke-width="1.8"/>
<text x="615.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Auth</text>
<text x="615.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">право? ні → 401</text>
<rect x="700.0" y="125.0" width="150.0" height="130.0" rx="12" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.8"/>
<text x="775.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Gzip</text>
<text x="775.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стиснути тіло</text>
<rect x="860.0" y="125.0" width="150.0" height="130.0" rx="12" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.8"/>
<text x="935.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Cache</text>
<text x="935.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">влучив → віддай</text>
<rect x="1020.0" y="125.0" width="150.0" height="130.0" rx="12" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="1095.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діловий</text>
<text x="1095.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">обробник</text>
<line x1="1180.0" y1="285.0" x2="60.0" y2="285.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1180.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">відповідь ← назовні: «ПІСЛЯ»</text>
<line x1="615.0" y1="255.0" x2="615.0" y2="356.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="615.0" y1="356.0" x2="70.0" y2="356.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="80.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Auth: 401 — next() не викликано; Cache, Gzip, обробник запиту не бачать</text>
<line x1="935.0" y1="255.0" x2="935.0" y2="406.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="935.0" y1="406.0" x2="70.0" y2="406.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="80.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Cache: влучення — тіло з кешу; обробник (похід у базу) не виконується</text>
<text x="630.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">обрив = шар сам вертає відповідь і не кличе next(); хто зовні — той дістає шанс обірвати першим</text>
</svg>