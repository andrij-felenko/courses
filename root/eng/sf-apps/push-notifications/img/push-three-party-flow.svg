<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трикутник взаємодії: реєстрація токена та доставка push-повідомлення</text>
<rect x="60.0" y="30.0" width="210.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="48.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Клієнтський застосунок</tspan><tspan x="165.0" dy="15.6">(Користувацький процес)</tspan></text>
<rect x="320.0" y="30.0" width="210.0" height="44.0" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="425.0" y="48.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="425.0" dy="0.0">Демон ОС на пристрої</tspan><tspan x="425.0" dy="15.6">(apsd / GmsCore)</tspan></text>
<rect x="580.0" y="30.0" width="210.0" height="44.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="685.0" y="48.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Шлюз push-служби</tspan><tspan x="685.0" dy="15.6">(APNs / FCM / WebPush)</tspan></text>
<rect x="840.0" y="30.0" width="210.0" height="44.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="945.0" y="48.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="945.0" dy="0.0">Бекенд сервісу</tspan><tspan x="945.0" dy="15.6">(Application Server)</tspan></text>
<line x1="165.0" y1="74.0" x2="165.0" y2="570.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="425.0" y1="74.0" x2="425.0" y2="570.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="685.0" y1="74.0" x2="685.0" y2="570.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="945.0" y1="74.0" x2="945.0" y2="570.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="40.0" y="95.0" width="1000.0" height="200.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="55.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">ФАЗА 1. РЕЄСТРАЦІЯ ПРИСТРОЮ ТА ОБМІН ТОКЕНАМИ</text>
<line x1="165.0" y1="140.0" x2="425.0" y2="140.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="295.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. registerForRemoteNotifications()</text>
<line x1="425.0" y1="175.0" x2="685.0" y2="175.0" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="555.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4338ca" text-anchor="middle">2. Запит токена через системний TLS-канал</text>
<line x1="685.0" y1="210.0" x2="425.0" y2="210.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="555.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">3. Генерація унікального Device Token</text>
<line x1="425.0" y1="245.0" x2="165.0" y2="245.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="295.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">4. didRegisterForRemoteNotifications(token)</text>
<line x1="165.0" y1="280.0" x2="945.0" y2="280.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="555.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5. HTTPS POST /api/register-device (user_id, device_token)</text>
<rect x="40.0" y="315.0" width="1000.0" height="240.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="55.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">ФАЗА 2. ВІДПРАВКА СПОВІЩЕННЯ ТА ДОСТАВКА НА ПРИСТРІЙ</text>
<line x1="945.0" y1="370.0" x2="685.0" y2="370.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="815.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">6. HTTP/2 POST /3/device/{token} (JWT/OAuth2 + Payload)</text>
<line x1="685.0" y1="420.0" x2="425.0" y2="420.0" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="555.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">7. Доставка байтового кадру в постійний TLS-сокет пристрою</text>
<line x1="425.0" y1="470.0" x2="165.0" y2="470.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="295.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">8а. Фоновий пуш: пробудження процесу на ≤30 с</text>
<rect x="335.0" y="495.0" width="180.0" height="42.0" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/><text x="425.0" y="513.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="425.0" dy="0.0">8б. Візуальний пуш:</tspan><tspan x="425.0" dy="11.7">показ у Notification Center</tspan></text>
<text x="425.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle">(код застосунку навіть не запускається)</text>
</svg>