<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наскрізне шифрування WebPush (RFC 8291): шлюз без доступу до даних</text>
<rect x="40.0" y="60.0" width="300.0" height="460.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="294.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0"></tspan></text>
<rect x="55.0" y="75.0" width="270.0" height="38.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="90.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Сервер застосунку</tspan><tspan x="190.0" dy="16.9">(Відправник)</tspan></text>
<rect x="55.0" y="130.0" width="270.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Відкритий текст:</tspan><tspan x="190.0" dy="15.0">JSON { title, body, url }</tspan></text>
<line x1="190.0" y1="170.0" x2="190.0" y2="190.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55.0" y="190.0" width="270.0" height="65.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">ECDH на кривій P-256:</tspan><tspan x="190.0" dy="14.3">Спільний секрет з публічним</tspan><tspan x="190.0" dy="14.3">ключем клієнта (p256dh)</tspan></text>
<line x1="190.0" y1="255.0" x2="190.0" y2="275.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55.0" y="275.0" width="270.0" height="65.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="297.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">HKDF (auth secret + salt):</tspan><tspan x="190.0" dy="14.3">Виведення сесійного ключа</tspan><tspan x="190.0" dy="14.3">CEK (16 B) та Nonce (12 B)</tspan></text>
<line x1="190.0" y1="340.0" x2="190.0" y2="360.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55.0" y="360.0" width="270.0" height="65.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="190.0" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Шифрування AES-128-GCM:</tspan><tspan x="190.0" dy="11.7">Формування бінарного запису</tspan><tspan x="190.0" dy="11.7">[Salt || RS || IDLen || EphPub || Ciphertext]</tspan></text>
<line x1="190.0" y1="425.0" x2="190.0" y2="445.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55.0" y="445.0" width="270.0" height="55.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="462.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Запит RFC 8030:</tspan><tspan x="190.0" dy="14.3">HTTP POST + VAPID заголовок</tspan><tspan x="190.0" dy="14.3">(JWT, підписаний ES256)</tspan></text>
<line x1="340.0" y1="280.0" x2="410.0" y2="280.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="375.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Шифротекст</text>
<text x="375.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(AES-GCM)</text>
<rect x="410.0" y="60.0" width="260.0" height="460.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="294.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0"></tspan></text>
<rect x="425.0" y="75.0" width="230.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="90.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Шлюз WebPush (Недовірений)</tspan><tspan x="540.0" dy="14.3">(Google FCM / Mozilla Autopush)</tspan></text>
<rect x="425.0" y="150.0" width="230.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="190.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Перевірка VAPID JWT:</tspan><tspan x="540.0" dy="11.7">• Ідентифікація відправника</tspan><tspan x="540.0" dy="11.7">• Перевірка підпису відкритого ключа VAPID</tspan><tspan x="540.0" dy="11.7">• Валідація прав на Endpoint</tspan></text>
<rect x="425.0" y="290.0" width="230.0" height="120.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Шлюз бачить лише:</tspan><tspan x="540.0" dy="13.0">• URL кінцевої точки (endpoint)</tspan><tspan x="540.0" dy="13.0">• Зашифрований бінарний blob</tspan><tspan x="540.0" dy="13.0">• TTL та терміновість (Urgency)</tspan><tspan x="540.0" dy="13.0"></tspan><tspan x="540.0" dy="13.0">Вміст повідомлення шлюзу НЕВІДОМИЙ</tspan></text>
<rect x="425.0" y="440.0" width="230.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="459.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Трансляція в сокет браузера:</tspan><tspan x="540.0" dy="14.3">Передача шифротексту</tspan><tspan x="540.0" dy="14.3">без можливості розшифрувати</tspan></text>
<line x1="670.0" y1="280.0" x2="740.0" y2="280.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="705.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Шифротекст</text>
<text x="705.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(AES-GCM)</text>
<rect x="740.0" y="60.0" width="300.0" height="460.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="890.0" y="294.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0"></tspan></text>
<rect x="755.0" y="75.0" width="270.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="890.0" y="90.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Клієнтський браузер</tspan><tspan x="890.0" dy="16.9">(Service Worker)</tspan></text>
<rect x="755.0" y="130.0" width="270.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Отримання бінарного кадру:</tspan><tspan x="890.0" dy="14.3">Вилучення Salt та EphPub</tspan><tspan x="890.0" dy="14.3">із заголовка запису</tspan></text>
<line x1="890.0" y1="180.0" x2="890.0" y2="200.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="755.0" y="200.0" width="270.0" height="65.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="890.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">ECDH відновлення секрету:</tspan><tspan x="890.0" dy="14.3">Спільний секрет із приватного</tspan><tspan x="890.0" dy="14.3">ключа підписки та EphPub</tspan></text>
<line x1="890.0" y1="265.0" x2="890.0" y2="285.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="755.0" y="285.0" width="270.0" height="65.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="890.0" y="307.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">HKDF виведення ключів:</tspan><tspan x="890.0" dy="14.3">Обчислення ідентичного CEK</tspan><tspan x="890.0" dy="14.3">та Nonce з auth secret клієнта</tspan></text>
<line x1="890.0" y1="350.0" x2="890.0" y2="370.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="755.0" y="370.0" width="270.0" height="55.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="387.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Дешифрування AES-GCM:</tspan><tspan x="890.0" dy="14.3">Перевірка тегу автентичності</tspan><tspan x="890.0" dy="14.3">та відновлення відкритого тексту</tspan></text>
<line x1="890.0" y1="425.0" x2="890.0" y2="445.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="755.0" y="445.0" width="270.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="890.0" y="462.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Подія push у Service Worker:</tspan><tspan x="890.0" dy="14.3">event.data.json() →</tspan><tspan x="890.0" dy="14.3">registration.showNotification()</tspan></text>
</svg>