<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм зміни legacy за Фезерсом: порядок незламний</text>
<rect x="250.0" y="66.0" width="320.0" height="74.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="98.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">1. Знайти точку зміни</tspan><tspan x="410.0" dy="18.2">й точку відчуття</tspan></text>
<rect x="250.0" y="170.0" width="320.0" height="74.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="202.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">2. Прорізати шов —</tspan><tspan x="410.0" dy="18.2">розірвати приховані залежності</tspan></text>
<rect x="250.0" y="274.0" width="320.0" height="74.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="306.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">3. Накинути</tspan><tspan x="410.0" dy="18.2">характеризаційну сітку</tspan></text>
<rect x="250.0" y="378.0" width="320.0" height="74.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="410.0" y="410.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">4. І лише тоді —</tspan><tspan x="410.0" dy="18.2">міняти по-справжньому</tspan></text>
<line x1="410.0" y1="140.0" x2="410.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="410.0" y1="244.0" x2="410.0" y2="274.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="410.0" y1="348.0" x2="410.0" y2="378.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="20.0" y="173.0" width="200.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="195.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">поведінку тут</tspan><tspan x="120.0" dy="16.2">не міняємо —</tspan><tspan x="120.0" dy="16.2">ні на копійку</tspan></text>
<line x1="222.0" y1="207.0" x2="246.0" y2="207.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20.0" y="277.0" width="200.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="120.0" y="299.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">фіксуємо</tspan><tspan x="120.0" dy="16.2">фактичну поведінку,</tspan><tspan x="120.0" dy="16.2">не «правильну»</tspan></text>
<line x1="222.0" y1="311.0" x2="246.0" y2="311.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="594.0" y="385.0" width="210.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="699.0" y="411.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="699.0" dy="0.0">будь-яку регресію</tspan><tspan x="699.0" dy="16.2">видно в мить появи</tspan></text>
<line x1="592.0" y1="415.0" x2="574.0" y2="415.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="410.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Переставиш кроки — накидатимеш сітку на код, який щойно сам і зсунув.</text>
</svg>