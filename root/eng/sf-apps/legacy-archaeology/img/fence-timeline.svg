<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна думка, три форми: як «спершу зрозумій, тоді чіпай» дійшло до коду</text>
<line x1="60.0" y1="250.0" x2="720.0" y2="250.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="700.0" y1="250.0" x2="724.0" y2="250.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="722.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">час</text>
<rect x="75.0" y="70.0" width="190.0" height="54.0" rx="6" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.5"/><text x="170.0" y="92.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Честертон,</tspan><tspan x="170.0" dy="18.2">«The Thing»</tspan></text>
<rect x="75.0" y="138.0" width="190.0" height="74.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="170.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">розгорнутий діалог</tspan><tspan x="170.0" dy="15.6">реформаторів про паркан</tspan></text>
<line x1="170.0" y1="212.0" x2="170.0" y2="242.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="3,3"/>
<circle cx="170.0" cy="250.0" r="7.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="170.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1929</text>
<rect x="305.0" y="70.0" width="190.0" height="54.0" rx="6" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.5"/><text x="400.0" y="92.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Кеннеді,</tspan><tspan x="400.0" dy="18.2">щоденник</tspan></text>
<rect x="305.0" y="138.0" width="190.0" height="74.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="400.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">пружне гасло-парафраз:</tspan><tspan x="400.0" dy="15.6">«не знімай паркан…»</tspan></text>
<line x1="400.0" y1="212.0" x2="400.0" y2="242.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="3,3"/>
<circle cx="400.0" cy="250.0" r="7.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="400.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1945</text>
<rect x="535.0" y="70.0" width="190.0" height="54.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="92.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Фезерс,</tspan><tspan x="630.0" dy="18.2">legacy-код</tspan></text>
<rect x="535.0" y="138.0" width="190.0" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">техніка: характери-</tspan><tspan x="630.0" dy="15.6">заційний тест —</tspan><tspan x="630.0" dy="15.6">сітка на поведінку</tspan></text>
<line x1="630.0" y1="212.0" x2="630.0" y2="242.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3"/>
<circle cx="630.0" cy="250.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="630.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">2004</text>
<line x1="285.0" y1="250.0" x2="315.0" y2="250.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="515.0" y1="250.0" x2="545.0" y2="250.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">стиснули</text>
<text x="530.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">оснастили</text>
<text x="390.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Ідея — Честертонова; знамените гасло — парафраз Кеннеді; робочий інструмент дала інженерія.</text>
<text x="390.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">У кожному переході форма мінялась, а суть лишалась незмінною.</text>
</svg>