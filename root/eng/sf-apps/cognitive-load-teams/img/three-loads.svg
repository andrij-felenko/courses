<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три види когнітивного навантаження ділять одну стелю</text>
<text x="450.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стеля уваги команди — одна на всі три види навантаження</text>
<rect x="200.0" y="281.4" width="300.0" height="138.6" rx="0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="350.0" y="344.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Стороннє</text>
<text x="350.0" y="362.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle"><tspan x="350.0" dy="0.0">збірка, деплой,</tspan><tspan x="350.0" dy="12.6">незадокументовані примхи</tspan></text>
<rect x="200.0" y="156.0" width="300.0" height="125.4" rx="0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="350.0" y="212.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Внутрішнє</text>
<text x="350.0" y="230.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle"><tspan x="350.0" dy="0.0">сама складність</tspan><tspan x="350.0" dy="12.6">предметної області</tspan></text>
<rect x="200.0" y="90.0" width="300.0" height="66.0" rx="0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="350.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Корисне</text>
<text x="350.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle"><tspan x="350.0" dy="0.0">будувати добру</tspan><tspan x="350.0" dy="12.6">модель у голові</tspan></text>
<line x1="170.0" y1="90.0" x2="530.0" y2="90.0" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="540.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">СТЕЛЯ</text>
<line x1="600.0" y1="400.0" x2="600.0" y2="248.6" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="629.7" y="264.4" width="120.6" height="61.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="690.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">зріж стороннє —</tspan><tspan x="690.0" dy="15.6">звільниш місце</tspan><tspan x="690.0" dy="15.6">під корисне</tspan></text>
</svg>