<text x="1030.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">N — об'єктів  →</text>
<line x1="130.0" y1="500.0" x2="1030.0" y2="100.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7,6"/>
