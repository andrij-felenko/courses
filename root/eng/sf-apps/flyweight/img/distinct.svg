<text x="430.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">спільності майже нема (σ ≈ 1)</text>
<rect x="600.0" y="404.0" width="420.0" height="40.0" rx="6" fill="#eef9f1" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="428.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Zipf / важкий хвіст:  K ≈ c·N^β,  β&lt;1  (закон Гіпса)</tspan></text>
<text x="610.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">K росте повільно → σ = N/K величезне</text>
<circle cx="1030.0" cy="420.0" r="5.5" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="1020.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">N=10⁶ → K≈10³</text>
<text x="570.0" y="618.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Що важчий хвіст розподілу, то повільніше росте K — і то більше об'єктів припадає на один спільний вид.</text>
