<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">ефект відповідає одразу й подає нову дію — той самий хід подій двічі</text>
<rect x="40.0" y="90.0" width="460.0" height="380.0" rx="6" fill="#fbfbfd" stroke="#6b7280" stroke-width="1.4"/>
<text x="270.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">без черги: dispatch кличе dispatch</text>
<rect x="58.0" y="116.0" width="424.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="70.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">dispatch(«оновити курс»)</text>
<rect x="82.0" y="172.0" width="400.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="94.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">perform(ЗапитКурсу)</text>
<rect x="106.0" y="228.0" width="376.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="118.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">dispatch(«курс не приїхав»)</text>
<rect x="130.0" y="284.0" width="352.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="142.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">perform(Повторити)</text>
<rect x="154.0" y="340.0" width="328.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="166.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">dispatch(«оновити курс»)…</text>
<text x="270.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="270.0" dy="0.0">кожен оберт додає три кадри стека;</tspan><tspan x="270.0" dy="18.6">через кілька тисяч обертів — падіння,</tspan><tspan x="270.0" dy="18.6">а в трасуванні тисяча однакових рядків</tspan></text>
<rect x="520.0" y="90.0" width="460.0" height="380.0" rx="6" fill="#fbfbfd" stroke="#6b7280" stroke-width="1.4"/>
<text x="750.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">з чергою: dispatch лише стає в ряд</text>
<rect x="538.0" y="116.0" width="424.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="550.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">цикл: «оновити курс» → стан, кадр</text>
<rect x="538.0" y="172.0" width="424.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="550.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">ефект кладе «курс не приїхав» у чергу</text>
<rect x="538.0" y="228.0" width="424.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="550.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">цикл: «курс не приїхав» → стан, кадр</text>
<rect x="538.0" y="284.0" width="424.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="550.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">ефект кладе «оновити курс» у чергу</text>
<rect x="538.0" y="340.0" width="424.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="550.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">цикл: «оновити курс» → … і так далі</text>
<text x="750.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="750.0" dy="0.0">глибина стека стала;</tspan><tspan x="750.0" dy="18.6">цикл нікуди не подівся, але його видно</tspan><tspan x="750.0" dy="18.6">й можна обірвати лічильником дій</tspan></text>
</svg>