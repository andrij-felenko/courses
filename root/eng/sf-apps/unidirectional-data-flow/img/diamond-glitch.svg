<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="400.0" y="44.5" width="180.0" height="43.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/><text x="490.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">S — джерело</tspan></text>
<rect x="245.0" y="168.5" width="170.0" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">A = S + 1</tspan></text>
<rect x="565.0" y="168.5" width="170.0" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">B = S × 2</tspan></text>
<rect x="400.0" y="292.5" width="180.0" height="43.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="2.2"/><text x="490.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">C = B − A</tspan></text>
<line x1="440.0" y1="92.0" x2="370.0" y2="164.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="92.0" x2="610.0" y2="164.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="370.0" y1="216.0" x2="440.0" y2="288.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610.0" y1="216.0" x2="540.0" y2="288.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="378.0" width="430.0" height="190.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="60.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">перерахунок «як прийшло»</text>
<text x="60.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">S: 4 → 5</tspan><tspan x="60.0" dy="22.4">A = 6,  C = 8 − 6 = 2</tspan><tspan x="60.0" dy="22.4">B = 10, C = 10 − 6 = 4</tspan><tspan x="60.0" dy="22.4">мить, коли на екрані 2 — брехня</tspan></text>
<rect x="510.0" y="378.0" width="430.0" height="190.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="530.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">один прохід за порядком залежностей</text>
<text x="530.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="530.0" dy="0.0">S: 4 → 5</tspan><tspan x="530.0" dy="22.4">A = 6,  B = 10</tspan><tspan x="530.0" dy="22.4">C = 10 − 6 = 4  (один раз)</tspan><tspan x="530.0" dy="22.4">проміжної миті не існує</tspan></text>
</svg>