<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина зчеплюваності: від найслабшої до найтіснішої</text>
<line x1="136.0" y1="356.0" x2="740.0" y2="356.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="7,5"/>
<text x="440.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">нижче — видно з тексту коду · вище — лише під час виконання</text>
<rect x="160.0" y="610.0" width="560.0" height="50.0" rx="7" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="632.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">За іменем (name)</text>
<text x="176.0" y="650.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">домовитися про НАЗВУ — foo()</text>
<rect x="160.0" y="548.0" width="560.0" height="50.0" rx="7" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">За типом (type)</text>
<text x="176.0" y="588.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">домовитися про ТИП сутності</text>
<rect x="160.0" y="486.0" width="560.0" height="50.0" rx="7" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">За змістом (meaning)</text>
<text x="176.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">домовитися про ЗНАЧЕННЯ — status==3</text>
<rect x="160.0" y="424.0" width="560.0" height="50.0" rx="7" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">За позицією (position)</text>
<text x="176.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">домовитися про ПОРЯДОК аргументів</text>
<rect x="160.0" y="362.0" width="560.0" height="50.0" rx="7" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">За алгоритмом (algorithm)</text>
<text x="176.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">домовитися про однаковий АЛГОРИТМ</text>
<rect x="160.0" y="300.0" width="560.0" height="50.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="176.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">За виконанням (execution)</text>
<text x="176.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">важливий ПОРЯДОК виконання</text>
<rect x="160.0" y="238.0" width="560.0" height="50.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="176.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">За часом (timing)</text>
<text x="176.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">важливий ЧАС / одночасність</text>
<rect x="160.0" y="176.0" width="560.0" height="50.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="176.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">За значенням (value)</text>
<text x="176.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">значення мусять лишатися УЗГОДЖЕНИМИ</text>
<rect x="160.0" y="114.0" width="560.0" height="50.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="176.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">За ідентичністю (identity)</text>
<text x="176.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">той САМИЙ об'єкт (не рівний)</text>
<line x1="114.0" y1="654.0" x2="114.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="86.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">сильніше</text>
<text x="86.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тісніше</text>
<text x="440.0" y="694.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">найслабше — розірвати легко (перейменувати)</text>
<text x="440.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">найтісніше — розірвати найважче</text>
</svg>