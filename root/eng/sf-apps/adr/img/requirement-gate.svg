<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Вимога сидить критерієм — її можна викупити балами</text>
<text x="172.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">синхр. виклик</text>
<text x="255.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зчеплення ×3</text>
<rect x="180.0" y="120.0" width="150.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="255.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<text x="405.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">затримка ×2</text>
<rect x="330.0" y="120.0" width="150.0" height="54.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="405.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#27ae60" text-anchor="middle" font-weight="700">5</text>
<text x="555.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">експлуатація ×2</text>
<rect x="480.0" y="120.0" width="150.0" height="54.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="555.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#27ae60" text-anchor="middle" font-weight="700">5</text>
<text x="705.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стійкість ×3</text>
<rect x="630.0" y="120.0" width="150.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<text x="705.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#c0392b" text-anchor="middle" font-weight="700">2</text>
<text x="480.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">тут густо балів</text>
<text x="705.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">вимогу ПРОВАЛЕНО</text>
<text x="450.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">5·×2 + 5·×2 = 20 балів за швидкість і зручність…</text>
<text x="450.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">…купують провалену вимогу: разом 32, програш лише 8 — «майже переміг»</text>
<line x1="60.0" y1="285.0" x2="840.0" y2="285.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,5"/>
<text x="450.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Вимога стоїть ворітьми — викупити неможливо</text>
<rect x="278.8" y="365.5" width="342.4" height="33.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="450.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">оформлення живе, коли склад недоступний?</tspan></text>
<line x1="380.0" y1="398.0" x2="215.0" y2="444.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="450.0" y1="398.0" x2="450.0" y2="444.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="398.0" x2="685.0" y2="444.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НІ</text>
<text x="478.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК</text>
<text x="630.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="145.5" y="454.2" width="108.9" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="200.0" y="474.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">синхр. виклик</tspan><tspan x="200.0" dy="15.6">ЗНЯТО ВИМОГОЮ</tspan></text>
<rect x="402.4" y="454.2" width="95.2" height="47.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="450.0" y="474.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">черга подій</tspan><tspan x="450.0" dy="15.6">у суму</tspan></text>
<rect x="645.5" y="454.2" width="108.9" height="47.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="700.0" y="474.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">спільна табл.</tspan><tspan x="700.0" dy="15.6">у суму</tspan></text>
<text x="450.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">сума лише між тими, хто пройшов: 40 проти 25 → витримує 1.5 зарубки</text>
<text x="450.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">синхр. виклик не програв за балами — він вибув за вимогою</text>
</svg>