<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Статус робить запис живим у часі</text>
<rect x="85.6" y="111.5" width="128.8" height="37.0" rx="6" fill="#fff9e6" stroke="#e0a800" stroke-width="2.2"/><text x="150.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">запропоновано</tspan></text>
<text x="150.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">запрошення заперечити,
не наказ</text>
<line x1="214.4" y1="130.0" x2="390.0" y2="130.0" stroke="#e0a800" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="315.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">рев'ю</text>
<rect x="435.8" y="111.5" width="88.5" height="37.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.2"/><text x="480.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">ухвалено</tspan></text>
<line x1="234.4" y1="160.0" x2="710.0" y2="120.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="515.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">не переконало</text>
<rect x="751.7" y="111.5" width="96.5" height="37.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="2.2"/><text x="800.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">відхилено</tspan></text>
<text x="800.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лишається —
відхилене теж знання</text>
<line x1="480.0" y1="148.5" x2="440.0" y2="310.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="301.7" y="311.5" width="96.5" height="37.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.2"/><text x="350.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">застаріло</tspan></text>
<line x1="510.0" y1="158.5" x2="620.0" y2="305.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="660.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нове рішення
лягає поверх старого</text>
<rect x="639.5" y="311.5" width="161.0" height="37.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.2"/><text x="720.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">замінено ADR-00xx</tspan></text>
<text x="480.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">причина минулого рішення не стирається ніколи, навіть коли саме рішення вже змінили</text>
</svg>