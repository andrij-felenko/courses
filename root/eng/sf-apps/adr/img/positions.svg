<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Несуча цінність запису — не обраний варіант, а підписані програші</text>
<rect x="376.9" y="41.0" width="206.3" height="38.0" rx="6" fill="#eef2ff" stroke="#6b7280" stroke-width="1.8"/><text x="480.0" y="64.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">драйвери (сили в грі)</tspan></text>
<line x1="480.0" y1="79.0" x2="160.0" y2="150.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480.0" y1="79.0" x2="480.0" y2="150.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480.0" y1="79.0" x2="800.0" y2="150.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="150.0" width="220.0" height="46.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.2"/><text x="160.0" y="177.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">черга подій</tspan></text>
<rect x="67.9" y="236.2" width="184.2" height="47.6" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.6"/><text x="160.0" y="256.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">розчеплює служби,</tspan><tspan x="160.0" dy="15.6">переживає падіння складу</tspan></text>
<line x1="160.0" y1="196.0" x2="160.0" y2="236.2" stroke="#27ae60" stroke-width="1.5"/>
<text x="160.0" y="305.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ОБРАНО</text>
<rect x="370.0" y="150.0" width="220.0" height="46.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="2.2"/><text x="480.0" y="177.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">синхронний виклик</tspan></text>
<rect x="381.1" y="236.2" width="197.8" height="47.6" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.6"/><text x="480.0" y="256.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">жорстке зчеплення —</tspan><tspan x="480.0" dy="15.6">валить оформлення каскадом</tspan></text>
<line x1="480.0" y1="196.0" x2="480.0" y2="236.2" stroke="#2457d6" stroke-width="1.5"/>
<text x="480.0" y="305.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ВІДКИНУТО — причина підписана</text>
<rect x="690.0" y="150.0" width="220.0" height="46.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="2.2"/><text x="800.0" y="177.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">спільна таблиця</tspan></text>
<rect x="694.2" y="236.2" width="211.5" height="47.6" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.6"/><text x="800.0" y="256.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">приховане зчеплення схемою —</tspan><tspan x="800.0" dy="15.6">переоблік блокує читання</tspan></text>
<line x1="800.0" y1="196.0" x2="800.0" y2="236.2" stroke="#2457d6" stroke-width="1.5"/>
<text x="800.0" y="305.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ВІДКИНУТО — причина підписана</text>
<line x1="60.0" y1="350.0" x2="900.0" y2="350.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="256.8" y="391.5" width="446.4" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="480.0" y="414.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">через рік: наступний інженер пропонує «синхронний виклик»</tspan></text>
<text x="480.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">запис відповідає одразу — причиною програшу, а не переказом чиєїсь пам'яті</text>
</svg>