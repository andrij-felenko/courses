<text x="875.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="875.0" dy="0.0">стейкхолдер +</tspan><tspan x="875.0" dy="12.5">його «турбота»</tspan><tspan x="875.0" dy="12.5">= старт опису</tspan></text>
