<text x="375.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="375.0" dy="0.0">ширше за акціонера:</tspan><tspan x="375.0" dy="12.5">групи, без яких</tspan><tspan x="375.0" dy="12.5">фірми не стане</tspan></text>
