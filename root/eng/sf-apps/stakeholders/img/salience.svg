<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вагомість — місце в перетині трьох осей</text>
<text x="390.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">влада · легітимність · терміновість — і сім класів у їхніх перетинах</text>
<text x="390.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">латентні — одна ознака    ·    очікувальні — дві    ·    визначальний — усі три</text>
