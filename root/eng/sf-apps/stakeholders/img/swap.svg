<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">WSJF як оптимум: аргумент обміну сусідів</text>
<text x="410.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">переставити двох сусідів вигідно ⇔ першим іде більший wᵢ / pᵢ</text>
<line x1="410.0" y1="78.0" x2="410.0" y2="348.0" stroke="#c9cdd3" stroke-width="1.4" stroke-dasharray="4,5"/>
<text x="230.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">i перший → j чекає зайві pᵢ</text>
<rect x="155.0" y="220.0" width="150.0" height="80.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="230.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">wⱼ · pᵢ</text>
<text x="230.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">← pᵢ →</text>
<text x="138.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">wⱼ</text>
<text x="230.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ціна: j чекає, поки триває i</text>
<text x="590.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">j перший → i чекає зайві pⱼ</text>
<rect x="550.0" y="185.0" width="80.0" height="115.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.8"/>
<text x="590.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">wᵢ · pⱼ</text>
<text x="590.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">← pⱼ →</text>
<text x="520.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">wᵢ</text>
<text x="590.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ціна: i чекає, поки триває j</text>
<rect x="120.4" y="371.2" width="579.2" height="33.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Різниця порядків (i,j) − (j,i) = wⱼ·pᵢ − wᵢ·pⱼ   ⇒   i перший вигідно ⇔ wᵢ/pᵢ &gt; wⱼ/pⱼ</tspan></text>
</svg>