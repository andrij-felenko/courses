<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точка чутливості проти точки компромісу</text>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">де ставки двох стейкхолдерів сходяться на одному параметрі</text>
<line x1="410.0" y1="78.0" x2="410.0" y2="348.0" stroke="#c9cdd3" stroke-width="1.4" stroke-dasharray="4,5"/>
<text x="210.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точка чутливості</text>
<text x="210.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">чіпає ОДИН атрибут</text>
<rect x="137.7" y="142.2" width="144.5" height="31.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Розмір пулу потоків</tspan></text>
<line x1="210.0" y1="180.0" x2="210.0" y2="232.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="166.5" y="242.0" width="87.0" height="32.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Швидкодія</tspan></text>
<text x="210.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">крутнув трохи — затримка стрибнула</text>
<text x="600.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точка компромісу</text>
<text x="600.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">чіпає ДВА в різні боки</text>
<rect x="514.6" y="142.2" width="170.8" height="31.5" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Ширина реплікації даних</tspan></text>
<line x1="575.0" y1="182.0" x2="520.0" y2="232.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="625.0" y1="182.0" x2="690.0" y2="232.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="463.8" y="243.2" width="96.4" height="29.5" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="512.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="512.0" dy="0.0">Доступність</tspan></text>
<circle cx="512.0" cy="298.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="512.0" y="302.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<rect x="651.8" y="243.2" width="96.4" height="29.5" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Локальність</tspan></text>
<circle cx="700.0" cy="298.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="700.0" y="301.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="512.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">оператор радий</text>
<text x="700.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">аудитор проти</text>
<rect x="130.0" y="388.5" width="560.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="408.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">На точці компромісу бали не складають — її виносять на світло й домовляються явно</tspan></text>
</svg>