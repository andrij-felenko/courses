<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від турботи людини — до перевірної вимоги й до креслення</text>
<rect x="48.0" y="96.0" width="132.0" height="78.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.8"/>
<text x="114.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="114.0" dy="0.0">Стейкхолдер</tspan></text>
<text x="114.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">хто саме</text>
<line x1="183.0" y1="135.0" x2="203.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="206.0" y="96.0" width="132.0" height="78.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.8"/>
<text x="272.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="272.0" dy="0.0">Турбота</tspan></text>
<text x="272.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">що йому важить</text>
<line x1="341.0" y1="135.0" x2="361.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="364.0" y="96.0" width="132.0" height="78.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="430.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Якісний</tspan><tspan x="430.0" dy="16.9">атрибут</tspan></text>
<text x="430.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">яка властивість</text>
<line x1="499.0" y1="135.0" x2="519.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="522.0" y="96.0" width="132.0" height="78.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="588.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="588.0" dy="0.0">Сценарій</tspan></text>
<text x="588.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">стимул → міра</text>
<line x1="657.0" y1="135.0" x2="677.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="96.0" width="132.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="746.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="746.0" dy="0.0">Архіт. в'ю</tspan></text>
<text x="746.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">як показано</text>
<text x="430.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Тримати цей ланцюг цілим — і є щоденна робота архітектора</text>
</svg>