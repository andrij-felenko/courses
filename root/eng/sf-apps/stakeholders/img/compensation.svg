<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому зважена сума обманює: геометрія компенсації</text>
<text x="360.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">більший бал за вподобаннями «викуповує» будь-який недобір — та не поріг-закон</text>
<rect x="150.0" y="95.0" width="520.0" height="310.0" rx="0" fill="#fff" stroke="#333333" stroke-width="1.4"/>
<rect x="150.0" y="290.0" width="520.0" height="115.0" rx="0" fill="#fdecea" stroke="#f0c9c4" stroke-width="1.0"/>
<line x1="150.0" y1="290.0" x2="670.0" y2="290.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="288.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">поріг доступності — закон</text>
<text x="300.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">недійсна зона (порушено тверде обмеження)</text>
<line x1="450.0" y1="345.0" x2="580.0" y2="215.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="382.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">більша зважена сума</text>
<text x="78.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">доступність</text>
<text x="120.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">висока</text>
<text x="120.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">низька</text>
<text x="410.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">виграш за вподобаннями (дешевше, швидше)  →</text>
<circle cx="592.0" cy="356.0" r="9.0" fill="#fdf4f4" stroke="#c0392b" stroke-width="2.0"/>
<text x="592.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">A — найвища сума</text>
<text x="592.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">але нижче порога</text>
<circle cx="300.0" cy="173.0" r="9.0" fill="#eef7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="300.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">B — менша сума</text>
<text x="300.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">зате дійсний</text>
<rect x="118.0" y="456.5" width="484.0" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="475.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Спершу відсій недійсні порогом, і лише тоді максимізуй суму серед дійсних.</tspan></text>
</svg>