<text x="448.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">подає САМ шлюз</text>
<rect x="200.0" y="245.6" width="260.0" height="48.8" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="330.0" y="266.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">OrderService</tspan><tspan x="330.0" dy="16.2">ctor(PaymentGateway gateway)</tspan></text>
<text x="330.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">прийшла САМА залежність</text>
<text x="330.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">потребу видно в сигнатурі</text>
<text x="330.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">шлях закінчено</text>
<text x="910.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ЧЕРЕЗ ІНТЕРФЕЙС — тип 1 (Авалон)</text>
<rect x="790.0" y="129.8" width="240.0" height="32.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="910.0" y="150.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">контейнер</tspan></text>
