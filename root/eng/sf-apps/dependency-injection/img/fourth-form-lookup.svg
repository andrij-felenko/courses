<text x="910.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">останній крок компонент долає САМ</text>
<text x="910.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рядковим ключем, усередині свого методу</text>
<line x1="60.0" y1="518.0" x2="1180.0" y2="518.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="620.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Впорснули не залежність, а локатор — тому тип 1 і перейменували на «пошук»</text>
<text x="620.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">contextualized dependency lookup — не впровадження</text>
