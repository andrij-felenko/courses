<text x="1064.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">впорскує МЕНЕДЖЕР</text>
<rect x="780.0" y="258.2" width="260.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="910.0" y="278.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">OrderService implements Serviceable</tspan><tspan x="910.0" dy="15.6">service(ServiceManager manager)</tspan></text>
<line x1="910.0" y1="308.0" x2="910.0" y2="380.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1060.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">manager.lookup(&quot;gateway&quot;)</text>
