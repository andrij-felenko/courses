<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Батько не буває чесним, поки бреше дитина</text>
<text x="60.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">ЗГОРИ ВНИЗ — глухий кут</text>
<rect x="138.1" y="129.3" width="183.9" height="61.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="230.0" y="149.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">OrderService</tspan><tspan x="230.0" dy="15.0">ctor(gateway, clock, log)</tspan><tspan x="230.0" dy="15.0">✓ прийняв своє</tspan></text>
<rect x="554.3" y="129.3" width="131.4" height="61.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="620.0" y="149.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">ReceiptBuilder</tspan><tspan x="620.0" dy="15.0">ctor() — порожній</tspan><tspan x="620.0" dy="15.0">get(&quot;templates&quot;)</tspan></text>
<rect x="957.1" y="136.8" width="65.9" height="46.5" rx="6" fill="#f3f4f6" stroke="#c0392b" stroke-width="1.6"/><text x="990.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Locator</tspan><tspan x="990.0" dy="15.0">глобал</tspan></text>
<line x1="331.9" y1="160.0" x2="544.3" y2="160.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="438.1" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">створює всередині</text>
<line x1="695.7" y1="160.0" x2="947.1" y2="160.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="821.4" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">смикає</text>
<text x="600.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Батько вже приймає свої три залежності — але сам майструє дитину, а та смикає з глобала.</text>
<text x="600.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Справжній список залежностей батька досі неповний, і тест усе ще мусить готувати глобал.</text>
<line x1="60.0" y1="306.0" x2="1140.0" y2="306.0" stroke="#d0d5db" stroke-width="1.1"/>
<text x="60.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">ВІД ЛИСТЯ ВГОРУ — працює</text>
<rect x="167.6" y="397.3" width="124.9" height="61.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="230.0" y="417.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">① ReceiptBuilder</tspan><tspan x="230.0" dy="15.0">ctor(templates)</tspan><tspan x="230.0" dy="15.0">✓ чесний</tspan></text>
<rect x="554.3" y="397.3" width="131.4" height="61.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="620.0" y="417.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">② OrderService</tspan><tspan x="620.0" dy="15.0">ctor(…, receipts)</tspan><tspan x="620.0" dy="15.0">✓ повний список</tspan></text>
<rect x="907.9" y="404.8" width="164.2" height="46.5" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="990.0" y="424.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">③ композиційний корінь</tspan><tspan x="990.0" dy="15.0">тут усе й створюють</tspan></text>
<line x1="302.4" y1="428.0" x2="544.3" y2="428.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="423.4" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">потреба виринає вгору</text>
<line x1="695.7" y1="428.0" x2="897.9" y2="428.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="796.8" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">і далі — в корінь</text>
<text x="600.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Листок чесний → батько мусить його зібрати → його власна потреба стає видимою → піднімаємо до кореня.</text>
<text x="600.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">На кожному кроці клас, який чіпаєш, тримає ПОВНИЙ свій список — і жоден предок за нього не бреше.</text>
</svg>