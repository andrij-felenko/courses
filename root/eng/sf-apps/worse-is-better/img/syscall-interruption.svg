<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробка перерваного вводу-виводу: де живе складність</text>
<text x="50.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">1. Підхід MIT / ITS (автоматичний перезапуск PC-restart)</text>
<rect x="50.0" y="87.3" width="160.0" height="41.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">read() у ядро</tspan><tspan x="130.0" dy="14.3">Початок IO</tspan></text>
<line x1="213.0" y1="108.0" x2="247.0" y2="108.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="249.9" y="87.3" width="160.2" height="41.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Сигнал / переривання</tspan><tspan x="330.0" dy="14.3">Ядро зберігає PC і стан</tspan></text>
<line x1="413.1" y1="108.0" x2="447.0" y2="108.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450.0" y="87.3" width="160.0" height="41.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Обробник сигналу</tspan><tspan x="530.0" dy="14.3">Ядро відновлює виклик</tspan></text>
<line x1="613.0" y1="108.0" x2="647.0" y2="108.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="637.4" y="87.3" width="185.3" height="41.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Повернення даних</tspan><tspan x="730.0" dy="14.3">Застосунок не знає про збій</tspan></text>
<text x="420.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ціна: величезна складність ядра (стеки, реентрабельність, розмотування). Простір користувача чистий.</text>
<line x1="50.0" y1="245.0" x2="790.0" y2="245.0" stroke="#d0d7de" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="50.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">2. Підхід Нью-Джерсі / Unix (повернення помилки EINTR)</text>
<rect x="50.0" y="297.4" width="160.0" height="41.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="314.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">read() у ядро</tspan><tspan x="130.0" dy="14.3">Початок IO</tspan></text>
<line x1="213.0" y1="318.0" x2="247.0" y2="318.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250.0" y="297.4" width="160.0" height="41.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="314.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Сигнал / переривання</tspan><tspan x="330.0" dy="14.3">Ядро негайно скидає IO</tspan></text>
<line x1="413.0" y1="318.0" x2="447.0" y2="318.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450.0" y="297.4" width="160.0" height="41.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="314.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Повернення -1</tspan><tspan x="530.0" dy="14.3">errno = EINTR</tspan></text>
<line x1="613.0" y1="318.0" x2="647.0" y2="318.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="649.9" y="297.4" width="160.2" height="41.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="314.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Цикл retry у софті</tspan><tspan x="730.0" dy="14.3">Повторний виклик read()</tspan></text>
<text x="420.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ціна: ядро елементарне й легко портується. Кожен прикладний програміст зобов'язаний писати цикл повтору.</text>
</svg>