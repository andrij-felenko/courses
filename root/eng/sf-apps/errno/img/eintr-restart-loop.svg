<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробка переривання системного виклику сигналом (EINTR)</text>
<rect x="40.0" y="80.0" width="190.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="135.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">1. Блокуючий виклик</tspan><tspan x="135.0" dy="14.3">read(sock_fd, buf, sz)</tspan><tspan x="135.0" dy="14.3">Нитка засинає в ядрі</tspan><tspan x="135.0" dy="14.3">(TASK_INTERRUPTIBLE)</tspan></text>
<rect x="270.0" y="80.0" width="190.0" height="80.0" rx="6" fill="#fef6e7" stroke="#c0392b" stroke-width="1.4"/><text x="365.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">2. Прибуття сигналу</tspan><tspan x="365.0" dy="14.3">Сигнал SIGALRM / SIGINT</tspan><tspan x="365.0" dy="14.3">Ядро будить нитку,</tspan><tspan x="365.0" dy="14.3">виконує signal handler</tspan></text>
<rect x="500.0" y="80.0" width="190.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="595.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">3. Відповідь ядра</tspan><tspan x="595.0" dy="14.3">Якщо нема SA_RESTART:</tspan><tspan x="595.0" dy="14.3">read() повертає -1</tspan><tspan x="595.0" dy="14.3">errno виставляється в EINTR</tspan></text>
<rect x="470.0" y="240.0" width="250.0" height="100.0" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.4"/><text x="595.0" y="265.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">4. Перевірка результату в коді</tspan><tspan x="595.0" dy="14.3">if (res == -1 &amp;&amp; errno == EINTR)</tspan><tspan x="595.0" dy="14.3"></tspan><tspan x="595.0" dy="14.3">Це не збій пристрою чи мережі,</tspan><tspan x="595.0" dy="14.3">а переривання обчислень!</tspan></text>
<rect x="100.0" y="250.0" width="220.0" height="80.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="210.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Гілка А: Повторити виклик</tspan><tspan x="210.0" dy="14.3">continue в циклі while</tspan><tspan x="210.0" dy="14.3">Відновлення читання сокета</tspan><tspan x="210.0" dy="14.3">(дані не втрачено)</tspan></text>
<rect x="530.0" y="365.0" width="230.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="645.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Гілка Б: Інша помилка (EPIPE, EBADF)</tspan><tspan x="645.0" dy="12.3">Завершення збою, логування,</tspan><tspan x="645.0" dy="12.3">очищення ресурсів</tspan></text>
<line x1="230.0" y1="120.0" x2="270.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460.0" y1="120.0" x2="500.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="595.0" y1="160.0" x2="595.0" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="290.0" x2="320.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="395.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">errno == EINTR</text>
<line x1="210.0" y1="250.0" x2="210.0" y2="200.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="210.0" y1="200.0" x2="135.0" y2="200.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="135.0" y1="200.0" x2="135.0" y2="160.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="160.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">повтор</text>
<line x1="595.0" y1="340.0" x2="595.0" y2="365.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="660.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">errno != EINTR</text>
</svg>