<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево рішень: коли читати errno і як зберігати значення</text>
<rect x="330.0" y="60.0" width="220.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="440.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Виклик функції C / POSIX</tspan><tspan x="440.0" dy="14.3">(open, read, write, strtol...)</tspan></text>
<rect x="100.0" y="170.0" width="280.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="240.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Типовий системний виклик</tspan><tspan x="240.0" dy="14.3">res == -1 (або ptr == NULL)</tspan><tspan x="240.0" dy="14.3">Чіткий сигнал збою у return</tspan></text>
<rect x="500.0" y="170.0" width="280.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="640.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Функції повного діапазону (strtol)</tspan><tspan x="640.0" dy="14.3">Будь-яке число — валідний результат!</tspan><tspan x="640.0" dy="14.3">Немає унікального числа збою</tspan></text>
<rect x="80.0" y="290.0" width="320.0" height="130.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Правило 1: Читати errno ТІЛЬКИ при збої</tspan><tspan x="240.0" dy="13.7">1. Перевірити res == -1</tspan><tspan x="240.0" dy="13.7">2. Якщо res &gt;= 0 — errno НЕ ЧИТАТИ!</tspan><tspan x="240.0" dy="13.7">   (успіх не скидає старе errno)</tspan><tspan x="240.0" dy="13.7">3. Зберегти: int err = errno;</tspan><tspan x="240.0" dy="13.7">4. Тільки потім викликати close() / логер</tspan></text>
<rect x="480.0" y="290.0" width="320.0" height="130.0" rx="6" fill="#fef6e7" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Правило 2: Скидання errno = 0 ДО виклику</tspan><tspan x="640.0" dy="13.7">1. errno = 0; (обов'язково перед викликом!)</tspan><tspan x="640.0" dy="13.7">2. val = strtol(str, &amp;endptr, 10);</tspan><tspan x="640.0" dy="13.7">3. if (errno != 0) -&gt; обробити збій ERANGE</tspan><tspan x="640.0" dy="13.7">4. if (endptr == str) -&gt; не число (EINVAL)</tspan><tspan x="640.0" dy="13.7">5. Зберегти err = errno перед очищенням</tspan></text>
<line x1="390.0" y1="125.0" x2="240.0" y2="170.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="285.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">код повернення -1</text>
<line x1="490.0" y1="125.0" x2="640.0" y2="170.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="595.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">діапазон значень</text>
<line x1="240.0" y1="245.0" x2="240.0" y2="290.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="640.0" y1="245.0" x2="640.0" y2="290.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>