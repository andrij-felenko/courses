<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" width="1080" height="460">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333"/>
</marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="40.0" y="40.0" width="480.0" height="390.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="280.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Без блокування: Split-Brain руйнація</text><rect x="100.0" y="100.2" width="120.0" height="47.6" rx="6" fill="#ffeef0" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Процес A</tspan><tspan x="160.0" dy="15.6">(Вкладка 1)</tspan></text><rect x="340.0" y="100.2" width="120.0" height="47.6" rx="6" fill="#ffeef0" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Процес B</tspan><tspan x="400.0" dy="15.6">(Вкладка 2)</tspan></text><line x1="160.0" y1="159.0" x2="240.0" y2="214.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="400.0" y1="159.0" x2="320.0" y2="214.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="170.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">пише WAL #1</text><text x="390.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">пише WAL #2</text><rect x="110.0" y="212.4" width="340.0" height="63.2" rx="6" fill="#fff2f0" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Спільний файл журналу doc.wal</tspan><tspan x="280.0" dy="15.6">Перехресні записи в один дескриптор!</tspan><tspan x="280.0" dy="15.6">Позиції зсуву змішуються.</tspan></text><text x="280.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="280.0" dy="0.0">Невизначений порядок байтів (race condition).</tspan><tspan x="280.0" dy="15.6">Жоден процес не знає про правки іншого.</tspan><tspan x="280.0" dy="15.6">Відновлення після краху розпізнає файл як сміття.</tspan></text><rect x="560.0" y="40.0" width="480.0" height="390.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="800.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">З блокуванням (flock / Web Locks / SQLite)</text><rect x="601.6" y="100.2" width="156.8" height="47.6" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Процес A</tspan><tspan x="680.0" dy="15.6">(Власник блокування)</tspan></text><rect x="845.0" y="100.2" width="150.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="920.0" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">Процес B</tspan><tspan x="920.0" dy="15.6">(Другий екземпляр)</tspan></text><line x1="680.0" y1="159.0" x2="750.0" y2="214.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="920.0" y1="159.0" x2="860.0" y2="204.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/><text x="920.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">❌ LOCK_NB: BUSY</text><rect x="610.0" y="212.4" width="380.0" height="63.2" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Файл doc.lock (LOCK_EX) / Web Lock</tspan><tspan x="800.0" dy="15.6">Ексклюзивне право на запис у WAL.</tspan><tspan x="800.0" dy="15.6">Процес B переходить у режим «Лише читання».</tspan></text><text x="800.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="800.0" dy="0.0">Один активний записувач (Single Writer).</tspan><tspan x="800.0" dy="15.6">Другий процес попереджає користувача про блокування</tspan><tspan x="800.0" dy="15.6">або відкриває документ як копію для перегляду.</tspan></text>
</svg>