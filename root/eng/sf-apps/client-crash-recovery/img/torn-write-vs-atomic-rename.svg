<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333"/>
</marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30.0" y="40.0" width="490.0" height="410.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="275.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прямий запис у файл (небезпечно)</text><rect x="105.0" y="102.5" width="340.0" height="33.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Оригінальний файл: doc.dat (v1)</tspan></text><line x1="275.0" y1="144.0" x2="275.0" y2="189.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="285.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">open(..., 'w') + write()</text><rect x="105.0" y="202.5" width="340.0" height="33.0" rx="6" fill="#fff2f0" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Записано 40% нових байтів...</tspan></text><line x1="275.0" y1="244.0" x2="275.0" y2="289.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="285.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">⚡ КРАХ (SIGKILL / вимкнення живлення)</text><rect x="105.0" y="297.4" width="340.0" height="63.2" rx="6" fill="#ffeef0" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="317.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">Файл doc.dat пошкоджено!</tspan><tspan x="275.0" dy="15.6">Старі дані затерто, нові не до кінця.</tspan><tspan x="275.0" dy="15.6">Документ втрачено назавжди.</tspan></text><text x="275.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="275.0" dy="0.0">Немає ані попередньої версії (v1),</tspan><tspan x="275.0" dy="15.6">ані коректної нової (v2).</tspan><tspan x="275.0" dy="15.6">Torn Write залишає битий хвіст на диску.</tspan></text><rect x="560.0" y="40.0" width="490.0" height="410.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="805.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атомарна заміна (Atomic Rename)</text><rect x="590.0" y="90.2" width="430.0" height="47.6" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="110.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">1. write(doc.tmp)</tspan><tspan x="805.0" dy="15.6">Запис повної копії v2 у тимчасовий файл поруч</tspan></text><line x1="805.0" y1="138.0" x2="805.0" y2="156.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="590.0" y="156.2" width="430.0" height="47.6" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">2. fsync(doc.tmp)</tspan><tspan x="805.0" dy="15.6">Скидання буферів ОС на фізичний диск</tspan></text><line x1="805.0" y1="204.0" x2="805.0" y2="222.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="590.0" y="222.2" width="430.0" height="47.6" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="805.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">3. rename(doc.tmp, doc.dat)</tspan><tspan x="805.0" dy="15.6">Атомарна підміна inode в каталозі</tspan></text><line x1="805.0" y1="270.0" x2="805.0" y2="288.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="590.0" y="288.2" width="430.0" height="47.6" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">4. fsync(dir_fd)</tspan><tspan x="805.0" dy="15.6">Фіксація метаданих каталогу на диску</tspan></text><text x="805.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="805.0" dy="0.0">Крах на кроках 1-2: старий doc.dat лишається цілим.</tspan><tspan x="805.0" dy="15.6">Крах на кроці 3: атомарно існує або стара, або нова версія.</tspan></text>
</svg>