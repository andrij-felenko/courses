<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333"/>
</marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="540.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл: Базовий знімок (Snapshot) + Журнал операцій (WAL)</text><rect x="40.0" y="60.0" width="1000.0" height="190.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="540.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза 1: Накопичення операцій у Write-Ahead Log</text><rect x="60.0" y="140.2" width="140.0" height="47.6" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Знімок doc.snap</tspan><tspan x="130.0" dy="15.6">Стан на час T₀</tspan></text><rect x="263.6" y="134.2" width="132.9" height="59.6" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">WAL-запис #1</tspan><tspan x="330.0" dy="14.3">Op #1: Insert('A')</tspan><tspan x="330.0" dy="14.3">[CRC32: ok]</tspan></text><line x1="205.0" y1="164.0" x2="260.0" y2="164.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="408.6" y="134.2" width="132.9" height="59.6" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">WAL-запис #2</tspan><tspan x="475.0" dy="14.3">Op #2: Style(Bold)</tspan><tspan x="475.0" dy="14.3">[CRC32: ok]</tspan></text><line x1="400.0" y1="164.0" x2="407.0" y2="164.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="555.0" y="134.2" width="130.0" height="59.6" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">WAL-запис #3</tspan><tspan x="620.0" dy="14.3">Op #3: Delete(w1)</tspan><tspan x="620.0" dy="14.3">[CRC32: ok]</tspan></text><line x1="545.0" y1="164.0" x2="552.0" y2="164.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="700.0" y="134.2" width="130.0" height="59.6" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">WAL-запис #4</tspan><tspan x="765.0" dy="14.3">Op #4: Move(p2)</tspan><tspan x="765.0" dy="14.3">[CRC32: ok]</tspan></text><line x1="690.0" y1="164.0" x2="697.0" y2="164.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="885.0" y1="164.0" x2="940.0" y2="164.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="950.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">⚡ КРАХ</text><text x="950.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">(Op #5 обірвано)</text><text x="500.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Дисковий запис: кожен крок дописується послідовно (append-only) і захищається CRC32</text><rect x="40.0" y="270.0" width="1000.0" height="210.0" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.6"/><text x="540.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза 2: Відновлення (Replay) при наступному запуску</text><rect x="65.0" y="337.4" width="190.0" height="63.2" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="357.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Крок 1: Завантаження</tspan><tspan x="160.0" dy="15.6">Базовий стан doc.snap</tspan><tspan x="160.0" dy="15.6">(документ на T₀)</tspan></text><line x1="260.0" y1="369.0" x2="315.0" y2="369.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="316.4" y="337.4" width="307.3" height="63.2" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="357.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Крок 2: Програвання (Replay) WAL</tspan><tspan x="470.0" dy="15.6">Застосування Op #1, #2, #3, #4 послідовно.</tspan><tspan x="470.0" dy="15.6">Обрізаний Op #5 відкидається за CRC32.</tspan></text><line x1="615.0" y1="369.0" x2="670.0" y2="369.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="720.0" y="337.4" width="200.0" height="63.2" rx="6" fill="#f9f0ff" stroke="#8e44ad" stroke-width="1.5"/><text x="820.0" y="357.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Крок 3: Новий знімок</tspan><tspan x="820.0" dy="15.6">Атомарний запис doc.snap</tspan><tspan x="820.0" dy="15.6">Очищення (truncate) WAL</tspan></text><text x="500.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: 100% відновлення даних без втрати жодної підтвердженої правки</text>
</svg>