<text x="411.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="411.0" dy="0.0">один процес,</tspan><tspan x="411.0" dy="15.0">тверді межі модулів</tspan></text>
