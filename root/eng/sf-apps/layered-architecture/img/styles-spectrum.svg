<text x="927.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="927.0" dy="0.0">спілкування через</tspan><tspan x="927.0" dy="15.0">повідомлення-події</tspan></text>
