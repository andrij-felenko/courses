<rect x="256.0" y="239.3" width="248.0" height="41.3" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="380.0" dy="0.0">Плавне коригування частоти (NTP slew)</tspan><tspan x="380.0" dy="14.3">без стрибків і без повернення назад</tspan></text>
