<rect x="175.0" y="56.3" width="149.9" height="37.3" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="71.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="250.0" dy="0.0">NTP step</tspan><tspan x="250.0" dy="14.3">(стрибок назад −500мс)</tspan></text>
<rect x="425.0" y="96.3" width="149.9" height="37.3" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="500.0" dy="0.0">DST / settimeofday</tspan><tspan x="500.0" dy="14.3">(стрибок уперед +1год)</tspan></text>
<rect x="639.0" y="131.3" width="162.0" height="37.3" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="153.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Пастка: t2 − t1 &lt; 0</tspan><tspan x="720.0" dy="14.3">(від'ємна тривалість!)</tspan></text>
