<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1320" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама структура даних: у межах сесії — гарантія, на весь застосунок — кеш</text>
<rect x="40.0" y="66.0" width="590.0" height="500.0" rx="12" fill="#fbfefc" stroke="#27ae60" stroke-width="2.0"/>
<text x="335.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">МАПА В МЕЖАХ СЕСІЇ</text>
<rect x="90.0" y="124.0" width="200.0" height="116.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="190.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запит A</text>
<rect x="125.0" y="184.0" width="130.0" height="32.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="190.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">мапа A</tspan></text>
<rect x="380.0" y="124.0" width="200.0" height="116.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="480.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запит B</text>
<rect x="415.0" y="184.0" width="130.0" height="32.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.6"/><text x="480.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">мапа B</tspan></text>
<text x="335.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">мапи не перетинаються й не переживають запит</text>
<text x="72.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">·  живе рівно стільки, скільки одиниця роботи</text>
<text x="72.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">·  несвіжість ≤ тривалість одного запиту</text>
<text x="72.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">·  нічого не ділиться — замки не потрібні</text>
<text x="72.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">·  інвалідувати нічого: зникає разом із сесією</text>
<rect x="80.0" y="442.0" width="510.0" height="74.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.2"/><text x="335.0" y="474.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0.0">ГАРАНТІЯ ТОТОЖНОСТІ</tspan><tspan x="335.0" dy="18.2">умова правильності, а не оптимізація</tspan></text>
<rect x="690.0" y="66.0" width="590.0" height="500.0" rx="12" fill="#fffcfc" stroke="#c0392b" stroke-width="2.0"/>
<text x="985.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">МАПА НА ВЕСЬ ЗАСТОСУНОК</text>
<rect x="750.0" y="124.0" width="180.0" height="54.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="840.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запит A</text>
<rect x="1040.0" y="124.0" width="180.0" height="54.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="1130.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запит B</text>
<line x1="840.0" y1="178.0" x2="940.0" y2="222.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1130.0" y1="178.0" x2="1030.0" y2="222.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="870.0" y="232.5" width="230.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="985.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="985.0" dy="0.0">СПІЛЬНА МАПА</tspan></text>
<text x="985.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">одна на всіх — і назавжди</text>
<text x="722.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">·  друге джерело правди — несвіжість безмежна</text>
<text x="722.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">·  чужі напівзмінені об'єкти течуть між запитами</text>
<text x="722.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">·  кілька потоків одночасно — потрібні замки</text>
<text x="722.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">·  з'являється окрема задача інвалідації</text>
<rect x="730.0" y="460.0" width="510.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="985.0" y="492.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="985.0" dy="0.0">ЦЕ ВЖЕ КЕШ</tspan><tspan x="985.0" dy="18.2">з усією його ціною — і це вже інший патерн</tspan></text>
</svg>