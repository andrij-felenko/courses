<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 766" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="766" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли сесія дізнається про зміну — і чому від цього залежить сила посилання</text>
<text x="650.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">той самий код, дві механіки стеження за змінами</text>
<rect x="40.0" y="88.0" width="1220.0" height="296.0" rx="12" fill="#fcfcfd" stroke="#27ae60" stroke-width="1.8"/>
<text x="70.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">ПЕРЕХОПЛЕНЕ ПРИСВОЄННЯ — так це робить SQLAlchemy</text>
<text x="70.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">присвоєння перехоплює пастка: сесія дізнається про бруд у ту саму мить</text>
<rect x="479.5" y="166.8" width="241.0" height="46.5" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="600.0" y="186.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">тут дізнались — тут і втримали:</tspan><tspan x="600.0" dy="15.0">вікна небезпеки немає</tspan></text>
<rect x="240.0" y="224.0" width="360.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#6b7280" stroke-width="1.4"/><text x="420.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">чистий · у мапі слабко</tspan></text>
<rect x="600.0" y="224.0" width="380.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.4"/><text x="790.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">брудний · одиниця роботи тримає сильно</tspan></text>
<rect x="980.0" y="224.0" width="220.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#6b7280" stroke-width="1.4"/><text x="1090.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">чистий · знову слабко</tspan></text>
<line x1="110.0" y1="308.0" x2="1196.0" y2="308.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1212.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">час</text>
<line x1="240.0" y1="274.0" x2="240.0" y2="301.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,4"/>
<circle cx="240.0" cy="308.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="240.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">load(Order, 42)</text>
<text x="240.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">об'єкт у мапі</text>
<line x1="600.0" y1="274.0" x2="600.0" y2="301.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,4"/>
<circle cx="600.0" cy="308.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="600.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">order.status = 'paid'</text>
<text x="600.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">пастка спрацювала</text>
<line x1="980.0" y1="274.0" x2="980.0" y2="301.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,4"/>
<circle cx="980.0" cy="308.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="980.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">commit()</text>
<text x="980.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">списки чистять</text>
<rect x="40.0" y="420.0" width="1220.0" height="296.0" rx="12" fill="#fcfcfd" stroke="#c0392b" stroke-width="1.8"/>
<text x="70.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">ЗНІМОК-ЗВІРКА — так це робить Hibernate</text>
<text x="70.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">присвоєння ніхто не перехоплює: бруд знайдеться аж на flush, коли звірять зі знімком</text>
<rect x="687.3" y="498.8" width="205.4" height="46.5" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="790.0" y="518.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">вікно, у якому слабка мапа</tspan><tspan x="790.0" dy="15.0">втратила б зміни мовчки</tspan></text>
<rect x="240.0" y="556.0" width="360.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#6b7280" stroke-width="1.4"/><text x="420.0" y="585.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">чистий · знімок стану збережено</tspan></text>
<rect x="600.0" y="556.0" width="380.0" height="50.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.4"/><text x="790.0" y="585.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">брудний — і ніхто про це не знає</tspan></text>
<rect x="980.0" y="556.0" width="220.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#6b7280" stroke-width="1.4"/><text x="1090.0" y="585.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">звірка зі знімком → UPDATE</tspan></text>
<line x1="110.0" y1="640.0" x2="1196.0" y2="640.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1212.0" y="645.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">час</text>
<line x1="240.0" y1="606.0" x2="240.0" y2="633.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,4"/>
<circle cx="240.0" cy="640.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="240.0" y="668.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">load(Order, 42)</text>
<text x="240.0" y="686.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+ знімок стану</text>
<line x1="600.0" y1="606.0" x2="600.0" y2="633.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,4"/>
<circle cx="600.0" cy="640.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="600.0" y="668.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">order.status = 'paid'</text>
<text x="600.0" y="686.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тиша</text>
<line x1="980.0" y1="606.0" x2="980.0" y2="633.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,4"/>
<circle cx="980.0" cy="640.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="980.0" y="668.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">flush()</text>
<text x="980.0" y="686.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">аж тепер звірка</text>
<text x="650.0" y="744.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Втримати можна лише те, про що знаєш. Хто дізнається аж на flush — мусить тримати сильно все.</text>
</svg>