<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія аномалії Read-Your-Own-Writes через асинхронний реплікаційний лаг</text>
<rect x="55.0" y="55.0" width="170.0" height="34.0" rx="4" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.2"/>
<text x="140.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт / Браузер</text>
<line x1="140.0" y1="90.0" x2="140.0" y2="420.0" stroke="#bdc3c7" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="295.0" y="55.0" width="170.0" height="34.0" rx="4" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.2"/>
<text x="380.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрутизатор (Router)</text>
<line x1="380.0" y1="90.0" x2="380.0" y2="420.0" stroke="#bdc3c7" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="535.0" y="55.0" width="170.0" height="34.0" rx="4" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.2"/>
<text x="620.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Primary (Writer)</text>
<line x1="620.0" y1="90.0" x2="620.0" y2="420.0" stroke="#bdc3c7" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="755.0" y="55.0" width="170.0" height="34.0" rx="4" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.2"/>
<text x="840.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Replica (Reader)</text>
<line x1="840.0" y1="90.0" x2="840.0" y2="420.0" stroke="#bdc3c7" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="140.0" y1="120.0" x2="380.0" y2="120.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">1. POST /profile (avatar='new.png')</text>
<line x1="380.0" y1="145.0" x2="620.0" y2="145.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle">2. UPDATE users SET ...</text>
<rect x="610.0" y="165.0" width="20.0" height="30.0" rx="3" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/>
<text x="640.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="start" font-weight="700">COMMIT (WAL LSN: 5040)</text>
<line x1="620.0" y1="210.0" x2="380.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">3. OK (Commit Success)</text>
<line x1="380.0" y1="225.0" x2="140.0" y2="225.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">4. 200 OK (Redirect to /profile)</text>
<line x1="620.0" y1="185.0" x2="840.0" y2="360.0" stroke="#95a5a6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="760.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle" font-style="italic">Асинхронний WAL стрим (T_lag = 180 мс)</text>
<line x1="140.0" y1="270.0" x2="380.0" y2="270.0" stroke="#2980b9" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2980b9" text-anchor="middle" font-weight="700">5. GET /profile (Запит свіжого стану)</text>
<line x1="380.0" y1="295.0" x2="840.0" y2="295.0" stroke="#2980b9" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2980b9" text-anchor="middle">6. SELECT avatar FROM users WHERE id=10</text>
<rect x="830.0" y="315.0" width="20.0" height="25.0" rx="3" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="840.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">LSN: 5010 &lt; 5040 (Старий стан)</text>
<line x1="840.0" y1="365.0" x2="380.0" y2="365.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">7. avatar='old.png' (Застарілі дані)</text>
<line x1="380.0" y1="380.0" x2="140.0" y2="380.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">8. Користувач бачить старий аватар (Аномалія!)</text>
<rect x="830.0" y="400.0" width="20.0" height="15.0" rx="2" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="840.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">LSN = 5040 (Дані свіжі)</text>
<text x="480.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Асинхронний лаг реплікації породжує порушення причинної узгодженості: читання після запису повертає застарілий знімок</text>
</svg>