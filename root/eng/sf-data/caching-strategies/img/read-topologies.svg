<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Топології читання: оркестрація застосунком (Cache-Aside) проти наскрізного проксі (Read-Through)</text>
<line x1="500.0" y1="50.0" x2="500.0" y2="450.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="250.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Cache-Aside (кешування збоку)</text>
<text x="250.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Застосунок сам керує і кешем, і базою</text>
<rect x="170.0" y="110.0" width="160.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="137.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Застосунок</tspan></text>
<rect x="50.0" y="240.0" width="150.0" height="50.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="125.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Кеш (Redis / RAM)</tspan><tspan x="125.0" dy="13.0">1. перевірка / 3. запис</tspan></text>
<rect x="300.0" y="240.0" width="150.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="375.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">База даних (SQL)</tspan><tspan x="375.0" dy="14.3">2. читання на промах</tspan></text>
<line x1="210.0" y1="156.0" x2="140.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="140.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">1. get(key)</text>
<line x1="290.0" y1="156.0" x2="360.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="355.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. SELECT (промах)</text>
<line x1="250.0" y1="156.0" x2="175.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. set(key, val)</text>
<rect x="50.0" y="340.0" width="400.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="367.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Порядок читання:</tspan><tspan x="250.0" dy="14.3">1. Застосунок питає кеш: є → повертає значення (влучання).</tspan><tspan x="250.0" dy="14.3">2. Немає (промах) → застосунок іде в базу даних.</tspan><tspan x="250.0" dy="14.3">3. Застосунок сам записує результат у кеш із TTL.</tspan></text>
<text x="750.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Read-Through (наскрізне читання)</text>
<text x="750.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Кеш стоїть проксі між кодом і сховищем</text>
<rect x="670.0" y="110.0" width="160.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="750.0" y="137.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Застосунок</tspan></text>
<rect x="670.0" y="210.0" width="160.0" height="50.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="232.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Кеш (Проксі / Бібліотека)</tspan><tspan x="750.0" dy="11.7">Автозавантажувач</tspan></text>
<rect x="670.0" y="310.0" width="160.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">База даних (SQL)</tspan><tspan x="750.0" dy="15.6">Першоджерело</tspan></text>
<line x1="750.0" y1="156.0" x2="750.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="760.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">1. get(key)</text>
<line x1="750.0" y1="260.0" x2="750.0" y2="310.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="760.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. fetch on miss</text>
<rect x="550.0" y="380.0" width="400.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="750.0" y="398.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Порядок читання:</tspan><tspan x="750.0" dy="15.6">1. Застосунок завжди звертається лише до кешу.</tspan><tspan x="750.0" dy="15.6">2. На промах кеш сам прозоро вантажить дані з бази,</tspan><tspan x="750.0" dy="15.6">   зберігає в себе та віддає застосунку.</tspan></text>
</svg>