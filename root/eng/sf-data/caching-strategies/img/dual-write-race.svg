<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14.9 -10 1029.8 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-14.9" y="-10" width="1029.8" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка паралельних записів: чому інвалідація (delete) надійна, а пряме оновлення (set) веде до розсинхронізації</text>
<line x1="500.0" y1="50.0" x2="500.0" y2="430.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="250.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка: оновлення кешу при записі</text>
<text x="250.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Два паралельні клієнти 1 і 2</text>
<rect x="60.0" y="115.0" width="380.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="137.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">1. Клієнт 1 пише в БД: v = 1</tspan></text>
<rect x="60.0" y="160.0" width="380.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">2. Клієнт 2 пише в БД: v = 2</tspan></text>
<rect x="60.0" y="205.0" width="380.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="227.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">3. Клієнт 2 оновлює кеш: set(v = 2)</tspan></text>
<rect x="60.0" y="250.0" width="380.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="272.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">4. Клієнт 1 запізнився мережею: set(v = 1)</tspan></text>
<rect x="60.0" y="310.0" width="380.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Результат гонки:</tspan><tspan x="250.0" dy="15.6">• У базі даних лишилося: v = 2 (свіже)</tspan><tspan x="250.0" dy="15.6">• У кеші записалося: v = 1 (застаріле!)</tspan><tspan x="250.0" dy="15.6">✖ Кеш перманентно розсинхронізовано з базою!</tspan></text>
<text x="750.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Правильно: інвалідація (видалення)</text>
<text x="750.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Скидання ключа на будь-який запис</text>
<rect x="560.0" y="115.0" width="380.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="137.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">1. Клієнт 1 пише в БД: v = 1</tspan></text>
<rect x="560.0" y="160.0" width="380.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">2. Клієнт 2 пише в БД: v = 2</tspan></text>
<rect x="560.0" y="205.0" width="380.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="227.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">3. Клієнт 2 видаляє ключ: del(key)</tspan></text>
<rect x="560.0" y="250.0" width="380.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="272.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">4. Клієнт 1 видаляє ключ: del(key)</tspan></text>
<rect x="560.0" y="310.0" width="380.0" height="100.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Результат інвалідації:</tspan><tspan x="750.0" dy="15.6">• У базі даних: v = 2 (свіже)</tspan><tspan x="750.0" dy="15.6">• У кеші: ключа немає (промах)</tspan><tspan x="750.0" dy="15.6">✓ Наступне читання прочитає з БД свіже v = 2</tspan><tspan x="750.0" dy="15.6">   і прогріє кеш без будь-якої розсинхронізації!</tspan></text>
</svg>