<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Методи збору Data Lineage: компроміси та охоплення</text>
<rect x="35.0" y="75.0" width="250.0" height="310.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.0"/>
<rect x="71.9" y="89.0" width="176.2" height="32.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="160.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Статичний аналіз коду</tspan></text>
<text x="160.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Парсинг SQL AST, аналіз репозиторіїв</text>
<line x1="50.0" y1="160.0" x2="270.0" y2="160.0" stroke="#3b82f6" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="50.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Працює до виконання запиту (CI/CD)</text>
<text x="50.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Дешевий аналіз всього каталогу</text>
<text x="50.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Не бачить динамічного SQL і UDF</text>
<text x="50.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Не фіксує обсяг та збої виконання</text>
<rect x="305.0" y="75.0" width="250.0" height="310.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.0"/>
<rect x="338.2" y="89.0" width="183.7" height="32.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="430.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Рантайм-інструментація</tspan></text>
<text x="430.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Слухачі Spark, Trino, OpenLineage</text>
<line x1="320.0" y1="160.0" x2="540.0" y2="160.0" stroke="#16a34a" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="320.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Фіксує реальні фізичні плани виконання</text>
<text x="320.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Знає точні партиції, рядки та байти</text>
<text x="320.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Відстежує статус запуску та помилки</text>
<text x="320.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Потребує інтеграції в кожен рушій</text>
<rect x="575.0" y="75.0" width="250.0" height="310.0" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2.0"/>
<rect x="608.2" y="89.0" width="183.7" height="32.0" rx="6" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/><text x="700.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Аналіз логів і журналу</tspan></text>
<text x="700.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Скрапінг query_history у сховищах</text>
<line x1="590.0" y1="160.0" x2="810.0" y2="160.0" stroke="#ca8a04" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="590.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Не вимагає модифікації коду пайплайнів</text>
<text x="590.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Охоплює Ad-hoc запити аналітиків</text>
<text x="590.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Затримка обробки (polling логів)</text>
<text x="590.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Важко розібрати сесійні змінні</text>
</svg>