<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектур синтаксичного аналізу: DOM, SAX та StAX</text>
<rect x="30.0" y="45.0" width="270.0" height="60.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2"/><text x="165.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">DOM (Document Object Model)</tspan><tspan x="165.0" dy="16.9">Повне дерево у пам'яті</tspan></text>
<rect x="30.0" y="115.0" width="270.0" height="135.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="165.0" y="150.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Принцип роботи:</tspan><tspan x="165.0" dy="14.3">Парсер читає весь XML-потік</tspan><tspan x="165.0" dy="14.3">і будує повний граф вузлів у купі.</tspan><tspan x="165.0" dy="14.3">Кожен Node тримає вказівники:</tspan><tspan x="165.0" dy="14.3">parent, firstChild, nextSibling,</tspan><tspan x="165.0" dy="14.3">атрибути, карти просторів.</tspan></text>
<rect x="30.0" y="260.0" width="270.0" height="95.0" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.5"/><text x="165.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Витрати пам'яті:</tspan><tspan x="165.0" dy="14.3">Пам'ять: O(N) — у 5–10 разів більше</tspan><tspan x="165.0" dy="14.3">за розмір файлу на диску.</tspan><tspan x="165.0" dy="14.3">Наприклад: XML 100 МБ → 800 МБ RAM.</tspan></text>
<rect x="30.0" y="365.0" width="270.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="165.0" y="417.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Плюси та мінуси:</tspan><tspan x="165.0" dy="14.3">✓ Довільний доступ (Random Access)</tspan><tspan x="165.0" dy="14.3">✓ XPath, XSLT, модифікація дерева</tspan><tspan x="165.0" dy="14.3">✗ Вичерпання RAM на великих файлах</tspan></text>
<rect x="345.0" y="45.0" width="270.0" height="60.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.2"/><text x="480.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">SAX (Simple API for XML)</tspan><tspan x="480.0" dy="16.9">Потоковий push-парсер</tspan></text>
<rect x="345.0" y="115.0" width="270.0" height="135.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="480.0" y="150.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Принцип роботи:</tspan><tspan x="480.0" dy="14.3">Парсер сам крутить цикл читання</tspan><tspan x="480.0" dy="14.3">і 'штовхає' події в обробник:</tspan><tspan x="480.0" dy="14.3">• startElement(name, attrs)</tspan><tspan x="480.0" dy="14.3">• characters(chunk)</tspan><tspan x="480.0" dy="14.3">• endElement(name)</tspan></text>
<rect x="345.0" y="260.0" width="270.0" height="95.0" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.5"/><text x="480.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Витрати пам'яті:</tspan><tspan x="480.0" dy="14.3">Пам'ять: O(1) — фіксований</tspan><tspan x="480.0" dy="14.3">буфер розміром у кілька кілобайтів.</tspan><tspan x="480.0" dy="14.3">Обробляє потоки гігабайтного розміру.</tspan></text>
<rect x="345.0" y="365.0" width="270.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="480.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Плюси та мінуси:</tspan><tspan x="480.0" dy="13.0">✓ Мінімальне споживання RAM</tspan><tspan x="480.0" dy="13.0">✗ Зворотне керування (Inversion of Control)</tspan><tspan x="480.0" dy="13.0">✗ Складні машини станів (State Machine)</tspan></text>
<rect x="660.0" y="45.0" width="270.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="795.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">StAX / XmlReader</tspan><tspan x="795.0" dy="16.9">Потоковий pull-парсер</tspan></text>
<rect x="660.0" y="115.0" width="270.0" height="135.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="795.0" y="143.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Принцип роботи:</tspan><tspan x="795.0" dy="14.3">Застосунок сам крутить цикл</tspan><tspan x="795.0" dy="14.3">і 'витягує' наступний токен:</tspan><tspan x="795.0" dy="14.3">while (reader.hasNext()) {</tspan><tspan x="795.0" dy="14.3">  ev = reader.next();</tspan><tspan x="795.0" dy="14.3">  if (ev == START_ELEMENT) ...</tspan><tspan x="795.0" dy="14.3">}</tspan></text>
<rect x="660.0" y="260.0" width="270.0" height="95.0" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.5"/><text x="795.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">Витрати пам'яті:</tspan><tspan x="795.0" dy="14.3">Пам'ять: O(1) — фіксований</tspan><tspan x="795.0" dy="14.3">буфер курсора або події.</tspan><tspan x="795.0" dy="14.3">Керування потоком у руках клієнта.</tspan></text>
<rect x="660.0" y="365.0" width="270.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="795.0" y="417.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Плюси та мінуси:</tspan><tspan x="795.0" dy="14.3">✓ Прямий ітератор, чистота коду</tspan><tspan x="795.0" dy="14.3">✓ Можливість пропустити піддерево (skip)</tspan><tspan x="795.0" dy="14.3">✓ Інтеграція з генераторами/корутинами</tspan></text>
</svg>