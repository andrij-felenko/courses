<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектори атак на XML-парсери: XXE та експоненційна XML-бомба</text>
<rect x="30.0" y="45.0" width="435.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="247.5" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.5" dy="0.0">XXE: XML External Entity Injection</tspan><tspan x="247.5" dy="16.9">Зловмисне завантаження зовнішніх ресурсів через DTD</tspan></text>
<rect x="30.0" y="115.0" width="435.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.4"/><text x="247.5" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Payload (шкідливий XML з DTD SYSTEM сутністю):</tspan><tspan x="247.5" dy="15.0"></tspan><tspan x="247.5" dy="15.0">&lt;?xml version=&quot;1.0&quot;?&gt;</tspan><tspan x="247.5" dy="15.0">&lt;!DOCTYPE data [</tspan><tspan x="247.5" dy="15.0">  &lt;!ENTITY xxe SYSTEM &quot;file:///etc/passwd&quot;&gt;</tspan><tspan x="247.5" dy="15.0">]&gt;</tspan><tspan x="247.5" dy="15.0">&lt;data&gt;&amp;xxe;&lt;/data&gt;</tspan></text>
<line x1="247.0" y1="255.0" x2="247.0" y2="285.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="285.0" width="435.0" height="125.0" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.5"/><text x="247.5" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Наслідки XXE-атаки:</tspan><tspan x="247.5" dy="11.7">1. Читання довільних локальних файлів сервера (/etc/passwd, конфіги, ключі).</tspan><tspan x="247.5" dy="11.7">2. Server-Side Request Forgery (SSRF) — сканування внутрішньої мережі.</tspan><tspan x="247.5" dy="11.7">3. Blind XXE — викрадення даних через DNS/HTTP канали out-of-band.</tspan></text>
<rect x="495.0" y="45.0" width="435.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="712.5" y="71.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.5" dy="0.0">Billion Laughs Attack (XML Bomb)</tspan><tspan x="712.5" dy="15.6">Експоненційне вичерпання RAM через рекурсивні сутності</tspan></text>
<rect x="495.0" y="115.0" width="435.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.4"/><text x="712.5" y="153.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">Payload (експоненційне множення сутностей):</tspan><tspan x="712.5" dy="11.7"></tspan><tspan x="712.5" dy="11.7">&lt;!ENTITY lol &quot;lol&quot;&gt;</tspan><tspan x="712.5" dy="11.7">&lt;!ENTITY lol1 &quot;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&amp;lol;&quot;&gt;</tspan><tspan x="712.5" dy="11.7">&lt;!ENTITY lol2 &quot;&amp;lol1;&amp;lol1;&amp;lol1;&amp;lol1;&amp;lol1;&amp;lol1;&amp;lol1;&amp;lol1;&amp;lol1;&amp;lol1;&quot;&gt;</tspan><tspan x="712.5" dy="11.7">... &lt;!ENTITY lol9 &quot;&amp;lol8;&amp;lol8;...&quot;&gt;</tspan><tspan x="712.5" dy="11.7">&lt;data&gt;&amp;lol9;&lt;/data&gt;</tspan></text>
<line x1="712.0" y1="255.0" x2="712.0" y2="285.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="495.0" y="285.0" width="435.0" height="125.0" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.5"/><text x="712.5" y="322.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">Механізм переповнення пам'яті:</tspan><tspan x="712.5" dy="14.3">• lol1 = 10 · 3 байти = 30 байтів</tspan><tspan x="712.5" dy="14.3">• lol2 = 10 · 30 = 300 байтів ...</tspan><tspan x="712.5" dy="14.3">• lol9 = 10⁹ розширень ≈ 3 Гігабайти тексту в пам'яті!</tspan><tspan x="712.5" dy="14.3">Результат: Heap Exhaustion, падіння процесу через OOM Killer.</tspan></text>
<rect x="30.0" y="425.0" width="900.0" height="75.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="480.0" y="444.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Методи захисту та загартування парсерів:</tspan><tspan x="480.0" dy="15.0">• Повне вимкнення DTD: DISALLOW_DOCTYPE_DECL = true (XML_PARSE_NODTD)</tspan><tspan x="480.0" dy="15.0">• Блокування мережевих сутностей: XML_PARSE_NONET або порожній EntityResolver</tspan><tspan x="480.0" dy="15.0">• Ліміти розгортання сутностей: обмеження глибини рекурсії та ліміт на обсяг виділеної пам'яті</tspan></text>
</svg>