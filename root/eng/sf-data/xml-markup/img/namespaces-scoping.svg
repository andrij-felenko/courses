<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Область видимості просторів імен та розв'язання QName</text>
<rect x="30.0" y="45.0" width="890.0" height="445.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="50.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Область видимості кореня: xmlns=&quot;http://store.org/order&quot;  |  xmlns:inv=&quot;http://store.org/inv&quot;</text>
<rect x="50.0" y="90.0" width="390.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="245.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Елемент: &lt;order id=&quot;104&quot;&gt;</tspan><tspan x="245.0" dy="14.3">• Префікс: немає (Default Namespace)</tspan><tspan x="245.0" dy="14.3">• Expanded Name: {http://store.org/order, order}</tspan><tspan x="245.0" dy="14.3">• Атрибут id: {null, id}  (Default NS НЕ діє на атрибути!)</tspan></text>
<line x1="245.0" y1="160.0" x2="245.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="195.0" width="390.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Елемент: &lt;inv:item inv:sku=&quot;TR-88&quot;&gt;</tspan><tspan x="245.0" dy="14.3">• Префікс: 'inv' → URI 'http://store.org/inv'</tspan><tspan x="245.0" dy="14.3">• Expanded Name: {http://store.org/inv, item}</tspan><tspan x="245.0" dy="14.3">• Атрибут inv:sku: {http://store.org/inv, sku}</tspan></text>
<rect x="470.0" y="90.0" width="430.0" height="280.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="485.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Вкладена область: xmlns=&quot;http://www.w3.org/2000/svg&quot;</text>
<rect x="485.0" y="130.0" width="400.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Елемент: &lt;svg width=&quot;100&quot; height=&quot;100&quot;&gt;</tspan><tspan x="685.0" dy="14.3">• Default NS перекрито на SVG URI!</tspan><tspan x="685.0" dy="14.3">• Expanded Name: {http://www.w3.org/2000/svg, svg}</tspan><tspan x="685.0" dy="14.3">• Атрибути width/height: без простору {null, width}</tspan></text>
<line x1="685.0" y1="205.0" x2="685.0" y2="235.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="485.0" y="235.0" width="400.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Елемент: &lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;40&quot;/&gt;</tspan><tspan x="685.0" dy="14.3">• Успадковує вкладений дефолтний простір SVG</tspan><tspan x="685.0" dy="14.3">• Expanded Name: {http://www.w3.org/2000/svg, circle}</tspan></text>
<rect x="485.0" y="310.0" width="400.0" height="50.0" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.2"/><text x="685.0" y="331.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Префікс 'inv' все ще доступний з батьківського scope:</tspan><tspan x="685.0" dy="13.7">&lt;inv:metadata type=&quot;vector&quot;/&gt; → {http://store.org/inv, metadata}</tspan></text>
<line x1="440.0" y1="230.0" x2="470.0" y2="230.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="390.0" width="850.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="475.0" y="414.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Ключові правила розв'язання XML Namespaces:</tspan><tspan x="475.0" dy="15.0">1. QName = Prefix ':' LocalPart. Префікс є лише локальним псевдонімом для URI у документі.</tspan><tspan x="475.0" dy="15.0">2. Елементи без префікса потрапляють у поточний default namespace (xmlns=&quot;...&quot;).</tspan><tspan x="475.0" dy="15.0">3. Атрибути без префікса ЗАВЖДИ належать до порожнього простору {null, name}, незалежно від xmlns=&quot;...&quot;.</tspan></text>
</svg>