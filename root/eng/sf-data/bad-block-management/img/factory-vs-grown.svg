<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">два джерела бракованих блоків: фабрика та експлуатація</text>
<rect x="60.0" y="70.0" width="500.0" height="410.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/>
<text x="310.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">фабричні дефекти (Factory Bad Blocks)</text>
<text x="310.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">наявні одразу після виготовлення кремнієвого кристала</text>
<rect x="80.0" y="165.0" width="460.0" height="58.0" rx="4" fill="#fbe6e3" stroke="#c0392b" stroke-width="1.2"/>
<text x="96.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">мікротріщини та домішки</text>
<text x="96.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">дефекти літографії та кристалічної решітки кремнію</text>
<rect x="80.0" y="237.0" width="460.0" height="58.0" rx="4" fill="#fbe6e3" stroke="#c0392b" stroke-width="1.2"/>
<text x="96.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">закорочені доріжки</text>
<text x="96.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">замикання ліній бітів (Bitline) або слів (Wordline)</text>
<rect x="80.0" y="309.0" width="460.0" height="58.0" rx="4" fill="#fbe6e3" stroke="#c0392b" stroke-width="1.2"/>
<text x="96.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">витік тунельного оксиду</text>
<text x="96.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">нездатність утримувати заряд або очищатися до 0xFF</text>
<rect x="80.0" y="381.0" width="460.0" height="58.0" rx="4" fill="#fbe6e3" stroke="#c0392b" stroke-width="1.2"/>
<text x="96.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">маркування виробником</text>
<text x="96.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">байт != 0xFF записано в OOB сторінки 0 на заводі</text>
<rect x="620.0" y="70.0" width="500.0" height="410.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="870.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">нарощені дефекти (Grown Bad Blocks)</text>
<text x="870.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">виникають динамічно під час роботи накопичувача</text>
<rect x="640.0" y="165.0" width="460.0" height="58.0" rx="4" fill="#dfe8fc" stroke="#2457d6" stroke-width="1.2"/>
<text x="656.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">деградація діелектрика</text>
<text x="656.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">накопичення пасток заряду від тисяч циклів P/E</text>
<rect x="640.0" y="237.0" width="460.0" height="58.0" rx="4" fill="#dfe8fc" stroke="#2457d6" stroke-width="1.2"/>
<text x="656.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">збій стирання (Erase Fail)</text>
<text x="656.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">високовольтний імпульс не скидає поріг комірок</text>
<rect x="640.0" y="309.0" width="460.0" height="58.0" rx="4" fill="#dfe8fc" stroke="#2457d6" stroke-width="1.2"/>
<text x="656.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">збій запису (Program Fail)</text>
<text x="656.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">комірка не досягає цільового рівня напруги за таймаут</text>
<rect x="640.0" y="381.0" width="460.0" height="58.0" rx="4" fill="#dfe8fc" stroke="#2457d6" stroke-width="1.2"/>
<text x="656.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">невиправні біти (UECC)</text>
<text x="656.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">помилки перевищують коригувальну здатність ECC-коду</text>
</svg>