<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова діаграма аномалії Write Skew під Snapshot Isolation</text>
<text x="510.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Феномен аномалії Write Skew (Зсув запису) під Snapshot Isolation</text>
<text x="220.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Транзакція T1 (Аліса)</text>
<text x="220.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Хоче знятися з чергування</text>
<text x="800.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Транзакція T2 (Боб)</text>
<text x="800.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Хоче знятися з чергування</text>
<text x="510.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільний стан (Таблиця OnCall)</text>
<text x="510.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Інваріант: count(active) &gt;= 1</text>
<line x1="60.0" y1="105.0" x2="60.0" y2="460.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="45.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Час</text>
<rect x="379.7" y="104.3" width="260.5" height="41.3" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/><text x="510.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Стан Snapshot: Аліса=ON (1), Боб=ON (1)</tspan><tspan x="510.0" dy="14.3">Всього на чергуванні: 2 лікарі</tspan></text>
<rect x="105.4" y="167.2" width="229.2" height="55.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="220.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">t1: SELECT count(*) FROM OnCall</tspan><tspan x="220.0" dy="14.3">WHERE on_call = true;</tspan><tspan x="220.0" dy="14.3">→ Отримує: 2 (&gt;= 2, знятися можна)</tspan></text>
<rect x="685.4" y="167.2" width="229.2" height="55.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="800.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">t2: SELECT count(*) FROM OnCall</tspan><tspan x="800.0" dy="14.3">WHERE on_call = true;</tspan><tspan x="800.0" dy="14.3">→ Отримує: 2 (&gt;= 2, знятися можна)</tspan></text>
<rect x="89.7" y="272.2" width="260.5" height="55.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="220.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">t3: UPDATE OnCall SET on_call=false</tspan><tspan x="220.0" dy="14.3">WHERE name = 'Alice';</tspan><tspan x="220.0" dy="14.3">COMMIT (успіх, рядок Боба не зачеплено)</tspan></text>
<line x1="360.0" y1="300.0" x2="430.0" y2="300.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="663.5" y="347.2" width="273.1" height="55.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="800.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">t4: UPDATE OnCall SET on_call=false</tspan><tspan x="800.0" dy="14.3">WHERE name = 'Bob';</tspan><tspan x="800.0" dy="14.3">COMMIT (успіх, рядок Аліси не зачеплено!)</tspan></text>
<line x1="660.0" y1="375.0" x2="590.0" y2="375.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="152.2" y="427.4" width="715.6" height="45.3" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/><text x="510.0" y="446.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Кінцевий стан бази: Аліса = OFF (0), Боб = OFF (0) → count(active) = 0!</tspan><tspan x="510.0" dy="14.3">ІНВАРІАНТ ПОРУШЕНО: Жоден лікар не чергує. Обидві транзакції успішні через неперетинні множини запису.</tspan></text>
</svg>