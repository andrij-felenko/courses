<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сегментна архітектура та 64-бітні типізовані покажчики Cap'n Proto</text>
<rect x="30.0" y="40.0" width="920.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="490.0" y="61.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Cap'n Proto: вирівнювання за 64-бітними словами (Word = 8B). Покажчик кодує тип об'єкта,</tspan><tspan x="490.0" dy="15.6">розмір секції скалярів (Data Section) і розмір секції вкладених покажчиків (Pointer Section).</tspan></text>
<rect x="30.0" y="110.0" width="920.0" height="80.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="45.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Заголовок кадру повідомлення (Framing Header)</text>
<rect x="45.0" y="148.0" width="160.0" height="32.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<text x="125.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Кількість сегментів N</text>
<rect x="215.0" y="148.0" width="180.0" height="32.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<text x="305.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Розмір сегмента 0 (слова)</text>
<rect x="405.0" y="148.0" width="180.0" height="32.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<text x="495.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Розмір сегмента 1 (слова)</text>
<rect x="595.0" y="148.0" width="340.0" height="32.0" rx="3" fill="#fef9e7" stroke="#333333" stroke-width="1.1"/>
<text x="765.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Паддінг до вирівнювання 8 байтів</text>
<rect x="30.0" y="210.0" width="920.0" height="110.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="45.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Анатомія 64-бітного покажчика структури (Struct Pointer)</text>
<rect x="45.0" y="250.0" width="140.0" height="50.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<rect x="47.0" y="252.0" width="136.0" height="46.0" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="1.5"/><text x="115.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Тип: Struct</tspan><tspan x="115.0" dy="14.3">(біти 0..1 = 00)</tspan></text>
<rect x="195.0" y="250.0" width="260.0" height="50.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.3"/>
<rect x="197.0" y="252.0" width="256.0" height="46.0" rx="6" fill="#eef4ff" stroke="#eef4ff" stroke-width="1.5"/><text x="325.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">Зсув: +N слів</tspan><tspan x="325.0" dy="14.3">(біти 2..31 зі знаком)</tspan></text>
<rect x="465.0" y="250.0" width="220.0" height="50.0" rx="4" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.3"/>
<rect x="467.0" y="252.0" width="216.0" height="46.0" rx="6" fill="#eaf7ef" stroke="#eaf7ef" stroke-width="1.5"/><text x="575.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">Data Section Size</tspan><tspan x="575.0" dy="14.3">(біти 32..47: к-сть слів)</tspan></text>
<rect x="695.0" y="250.0" width="240.0" height="50.0" rx="4" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.3"/>
<rect x="697.0" y="252.0" width="236.0" height="46.0" rx="6" fill="#eaf7ef" stroke="#eaf7ef" stroke-width="1.5"/><text x="815.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Pointer Section Size</tspan><tspan x="815.0" dy="14.3">(біти 48..63: к-сть слів)</tspan></text>
<rect x="30.0" y="340.0" width="920.0" height="190.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="45.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Цільова структура в сегменті пам'яті</text>
<rect x="45.0" y="382.0" width="420.0" height="130.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="255.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Data Section (Секція чистих значень)</tspan><tspan x="255.0" dy="15.6"></tspan><tspan x="255.0" dy="15.6">· Слово 0: `int64_t timestamp` (8 байтів)</tspan><tspan x="255.0" dy="15.6">· Слово 1: `float32 x` (4B) + `float32 y` (4B)</tspan><tspan x="255.0" dy="15.6">Пряме читання за фіксованим зміщенням!</tspan></text>
<rect x="495.0" y="382.0" width="440.0" height="130.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/><text x="715.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Pointer Section (Секція покажчиків)</tspan><tspan x="715.0" dy="15.6"></tspan><tspan x="715.0" dy="15.6">· Покажчик 0: Список точок `List(Struct)`</tspan><tspan x="715.0" dy="15.6">· Покажчик 1: Текстовий рядок `Text (UTF-8)`</tspan><tspan x="715.0" dy="15.6">· Far Pointer: перехід в інший сегмент при IPC</tspan></text>
</svg>