<rect x="700.0" y="330.0" width="230.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="815.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Наступні поля</tspan><tspan x="815.0" dy="14.3">байти 0x44..0x7F (60 Б)</tspan><tspan x="815.0" dy="14.3">знаходяться в лінії 1</tspan></text>
