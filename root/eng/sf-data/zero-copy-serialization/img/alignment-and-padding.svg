<rect x="30.0" y="40.0" width="920.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="490.0" y="61.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Природне вирівнювання (Natural Alignment): n-байтний тип має починатися з адреси, кратної n.</tspan><tspan x="490.0" dy="15.6">Порушення веде до штрафів шини, розщеплення кеш-ліній (Split Cache Line) або апаратних виключень.</tspan></text>
