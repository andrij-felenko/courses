<text x="35.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Розщеплення кеш-лінії: невирівняне 64-бітне число сидить на межі двох ліній</text>
