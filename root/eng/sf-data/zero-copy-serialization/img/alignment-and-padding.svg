<text x="490.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Цільовий uint64 = [байти 60..63] + [байти 64..67] → 2 транзакції шини L1D Cache</text>
<rect x="30.0" y="490.0" width="920.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="490.0" y="519.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="490.0" dy="0.0">Наслідок: замість 1 такту процесор виконує 2 звернення до кешу, склеює байти в регістрах зсувами та масками, або зазнає зупинки конвеєра.</tspan></text>
