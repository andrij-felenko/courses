<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класична десеріалізація проти прямого доступу в буфері (Zero-Copy)</text>
<rect x="20.0" y="45.0" width="940.0" height="230.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="35.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Традиційна серіалізація (JSON, Protobuf, Thrift)</text>
<text x="35.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">перетворення байтів на дерево об'єктів у купі (Heap)</text>
<rect x="35.0" y="120.0" width="160.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Вхідний потік</tspan><tspan x="115.0" dy="15.6">байтів</tspan><tspan x="115.0" dy="15.6">(Socket / File)</tspan></text>
<rect x="235.0" y="120.0" width="175.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="322.5" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="322.5" dy="0.0">Парсер / Декодер</tspan><tspan x="322.5" dy="15.6">varint, рядки,</tspan><tspan x="322.5" dy="15.6">теги полів</tspan></text>
<rect x="450.0" y="120.0" width="195.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="547.5" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="547.5" dy="0.0">Алокації в купі</tspan><tspan x="547.5" dy="15.6">`malloc()` / `new`</tspan><tspan x="547.5" dy="15.6">дерево об'єктів</tspan></text>
<rect x="685.0" y="120.0" width="255.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="812.5" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="812.5" dy="0.0">Доступ до поля</tspan><tspan x="812.5" dy="15.6">блукання по покажчиках</tspan><tspan x="812.5" dy="15.6">(Pointer Chasing, Cache Miss)</tspan></text>
<line x1="195.0" y1="157.0" x2="235.0" y2="157.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="410.0" y1="157.0" x2="450.0" y2="157.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="645.0" y1="157.0" x2="685.0" y2="157.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="210.0" width="910.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="490.0" y="237.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="490.0" dy="0.0">Накладні витрати: розбір кожного байта O(N) · сотні дрібних алокацій пам'яті · навантаження на Garbage Collector · кеш-промахи процесора</tspan></text>
<rect x="20.0" y="295.0" width="940.0" height="240.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="35.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Формати без копіювання (Zero-Copy: FlatBuffers, Cap'n Proto, SBE)</text>
<text x="35.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">структура в буфері вже готова до читання процесором</text>
<rect x="35.0" y="370.0" width="190.0" height="75.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Неперервний буфер</tspan><tspan x="130.0" dy="15.6">в пам'яті</tspan><tspan x="130.0" dy="15.6">(RAM / mmap / Shm)</tspan></text>
<rect x="265.0" y="370.0" width="200.0" height="75.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="365.0" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">Вказівник на корінь</tspan><tspan x="365.0" dy="14.3">`root = (Table*)(buf + off)`</tspan><tspan x="365.0" dy="14.3">(нуль алокацій)</tspan></text>
<rect x="505.0" y="370.0" width="215.0" height="75.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="612.5" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="612.5" dy="0.0">Таблиця зсувів</tspan><tspan x="612.5" dy="15.6">зсув поля за O(1)</tspan><tspan x="612.5" dy="15.6">(Vtable / фіксований)</tspan></text>
<rect x="760.0" y="370.0" width="180.0" height="75.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Читання поля</tspan><tspan x="850.0" dy="15.6">проста інструкція CPU</tspan><tspan x="850.0" dy="15.6">`MOV reg, [ptr + off]`</tspan></text>
<line x1="225.0" y1="407.0" x2="265.0" y2="407.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="465.0" y1="407.0" x2="505.0" y2="407.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="407.0" x2="760.0" y2="407.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="462.0" width="910.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.2"/><text x="490.0" y="492.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="490.0" dy="0.0">Переваги: час десеріалізації 0 нс · нуль системних виділень пам'яті · читаються лише потрібні поля · локальність кешу L1/L2</tspan></text>
</svg>