<text x="665.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">4. Очищення стану</text>
<text x="665.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Скидання транзакції</tspan><tspan x="665.0" dy="14.2">ROLLBACK / DISCARD</tspan><tspan x="665.0" dy="14.2">~0.02–0.05 мс</tspan></text>
<line x1="752.0" y1="364.5" x2="760.0" y2="364.5" stroke="#15803d" stroke-width="1.4" marker-end="url(#arrow)"/>
