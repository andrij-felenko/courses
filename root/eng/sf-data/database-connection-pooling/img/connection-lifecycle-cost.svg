<rect x="334.0" y="72.0" width="142.0" height="115.0" rx="5" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
<text x="405.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">3. Аутентифікація БД</text>
<text x="405.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">SCRAM-SHA-256 / Пароль</tspan><tspan x="405.0" dy="13.5">Перевірка прав доступу</tspan><tspan x="405.0" dy="13.5">3.0–10.0 мс</tspan></text>
<line x1="477.0" y1="129.5" x2="483.0" y2="129.5" stroke="#991b1b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="484.0" y="72.0" width="142.0" height="115.0" rx="5" fill="#f87171" stroke="#991b1b" stroke-width="1.5"/>
<text x="555.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">4. Ініціалізація бекенду</text>
<text x="555.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">fork() процесу / потік</tspan><tspan x="555.0" dy="13.5">Виділення пам'яті сесії</tspan><tspan x="555.0" dy="13.5">5.0–20.0 мс</tspan></text>
