<text x="855.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">FIN → ACK → TIME_WAIT</tspan><tspan x="855.0" dy="13.5">Звільнення дескриптора</tspan><tspan x="855.0" dy="13.5">1.0–3.0 мс</tspan></text>
<text x="40.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start" font-style="italic">Підсумок без пулу: 95% часу і ресурсів процесора спалюється на встановлення зв'язку, а не на запит.</text>
<rect x="24.0" y="265.0" width="912.0" height="225.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="40.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="start" font-weight="700">З пулом з'єднань: повторне використання прогрітих сокетів (0.5–2.1 мс)</text>
<rect x="34.0" y="307.0" width="170.0" height="115.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="119.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">1. Оренда з пулу</text>
<text x="119.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="119.0" dy="0.0">Взяття з черги пам'яті</tspan><tspan x="119.0" dy="14.2">Атомарна операція CAS</tspan><tspan x="119.0" dy="14.2">~0.01–0.05 мс</tspan></text>
<line x1="206.0" y1="364.5" x2="214.0" y2="364.5" stroke="#15803d" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="216.0" y="307.0" width="170.0" height="115.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="301.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">2. Швидка валідація</text>
<text x="301.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="301.0" dy="0.0">Перевірка таймштампу</tspan><tspan x="301.0" dy="14.2">або ping по сокету</tspan><tspan x="301.0" dy="14.2">~0.01–0.05 мс</tspan></text>
<line x1="388.0" y1="364.5" x2="396.0" y2="364.5" stroke="#15803d" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="398.0" y="307.0" width="170.0" height="115.0" rx="5" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
<text x="483.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">3. Виконання запиту</text>
<text x="483.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="483.0" dy="0.0">SELECT / UPDATE даних</tspan><tspan x="483.0" dy="14.2">Корисна робота ядра БД</tspan><tspan x="483.0" dy="14.2">0.5–2.0 мс</tspan></text>
<line x1="570.0" y1="364.5" x2="578.0" y2="364.5" stroke="#15803d" stroke-width="1.4" marker-end="url(#arrow)"/>
