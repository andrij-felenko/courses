<text x="705.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">SELECT / UPDATE даних</tspan><tspan x="705.0" dy="13.5">Корисна робота ядра БД</tspan><tspan x="705.0" dy="13.5">0.5–2.0 мс</tspan></text>
