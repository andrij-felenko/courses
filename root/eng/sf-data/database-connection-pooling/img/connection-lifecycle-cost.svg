<text x="847.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">5. Повернення в пул</text>
<text x="847.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">Звільнення дескриптора</tspan><tspan x="847.0" dy="14.2">Сповіщення очікувача</tspan><tspan x="847.0" dy="14.2">~0.01–0.02 мс</tspan></text>
<text x="40.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="start" font-style="italic">Підсумок із пулом: нульові системні витрати ядра, захист СУБД від перевантаження та прискорення до 500 разів.</text>
