<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="500.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="24.0" y="30.0" width="912.0" height="215.0" rx="6" fill="#fff8f8" stroke="#fca5a5" stroke-width="1.4"/>
<text x="40.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="700">Без пулу: накладні витрати на новий запит (20–60 мс)</text>
<rect x="34.0" y="72.0" width="142.0" height="115.0" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="105.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700">1. TCP Handshake</text>
<text x="105.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">SYN → SYN-ACK → ACK</tspan><tspan x="105.0" dy="13.5">1 RTT у мережі</tspan><tspan x="105.0" dy="13.5">1.0–5.0 мс</tspan></text>
<line x1="177.0" y1="129.5" x2="183.0" y2="129.5" stroke="#991b1b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="184.0" y="72.0" width="142.0" height="115.0" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="255.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">2. TLS 1.3 Handshake</text>
<text x="255.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Ключі ECDH + Сертифікат</tspan><tspan x="255.0" dy="13.5">1–2 RTT + криптографія</tspan><tspan x="255.0" dy="13.5">5.0–15.0 мс</tspan></text>
