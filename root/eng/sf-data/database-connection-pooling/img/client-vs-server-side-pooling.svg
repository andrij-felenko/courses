<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="480.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="24.0" y="25.0" width="430.0" height="450.0" rx="6" fill="#fff8f8" stroke="#fca5a5" stroke-width="1.3"/>
<text x="239.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">1. Лише клієнтський пул (In-Process)</text>
<rect x="44.0" y="75.0" width="390.0" height="85.0" rx="5" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
<text x="239.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">100 подів застосунку (Kubernetes / Сервіси)</text>
<text x="239.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="239.0" dy="0.0">Кожен інстанс має власний локальний пул (наприклад, pool_size = 20)</tspan><tspan x="239.0" dy="13.0">Сумарна кількість підключень: 100 подів * 20 = 2000 TCP-сокетів!</tspan></text>
<line x1="239.0" y1="165.0" x2="239.0" y2="270.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="249.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">2000 постійних
з'єднань</text>
<rect x="44.0" y="275.0" width="390.0" height="180.0" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
<text x="239.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Сервер бази даних (PostgreSQL / MySQL)</text>
<text x="239.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="239.0" dy="0.0">• 2000 процесів postgres backend / потоків</tspan><tspan x="239.0" dy="13.5">• Гігабайти оперативної пам'яті на буфери сесій</tspan><tspan x="239.0" dy="13.5">• max_connections вичерпано → збої нових клієнтів</tspan><tspan x="239.0" dy="13.5">• 90% CPU на перемикання контексту ядра</tspan><tspan x="239.0" dy="13.5">• Висока затримка запитів і ризик падіння СУБД</tspan></text>
<rect x="506.0" y="25.0" width="430.0" height="450.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
<text x="721.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">2. Дворівневий пулінг із проксі (Server-Side)</text>
<rect x="526.0" y="75.0" width="390.0" height="85.0" rx="5" fill="#ffffff" stroke="#4ade80" stroke-width="1.2"/>
<text x="721.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">100 подів застосунку (Kubernetes / Сервіси)</text>
<text x="721.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="721.0" dy="0.0">Легковагі клієнтські з'єднання до проксі</tspan><tspan x="721.0" dy="13.0">Транзакційний режим пулінгу (Transaction Pooling)</tspan></text>
<line x1="721.0" y1="165.0" x2="721.0" y2="195.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="731.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="start">2000 легких клієнтів</text>
<rect x="526.0" y="200.0" width="390.0" height="95.0" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="721.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Проміжний проксі (PgBouncer / Odyssey / ProxySQL)</text>
<text x="721.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="721.0" dy="0.0">Мультиплексування: тисячі клієнтів використовують пул</tspan><tspan x="721.0" dy="13.0">з'єднання закріплюється лише на час транзакції (BEGIN..COMMIT)</tspan></text>
<line x1="721.0" y1="300.0" x2="721.0" y2="335.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="731.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="start" font-weight="700">50 фізичних сокетів до СУБД</text>
<rect x="526.0" y="340.0" width="390.0" height="115.0" rx="5" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
<text x="721.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Сервер бази даних (Оптимальний режим)</text>
<text x="721.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="721.0" dy="0.0">• Рівно 50 активних бекендів під кількість ядер CPU</tspan><tspan x="721.0" dy="13.5">• Максимальний кеш-хіт L1/L2/L3 процесора</tspan><tspan x="721.0" dy="13.5">• Нульові накладні витрати на перемикання контексту</tspan><tspan x="721.0" dy="13.5">• Стабільний p99 час виконання запитів</tspan></text>
</svg>