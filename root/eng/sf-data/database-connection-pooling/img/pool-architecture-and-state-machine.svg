<text x="244.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="244.0" dy="0.0">• Health Check: періодичний ping неактивних сокетів</tspan><tspan x="244.0" dy="14.0">• Max Lifetime Reaper: закриття застарілих з'єднань</tspan><tspan x="244.0" dy="14.0">• Connection Scaler: підтримання minIdle та масштабування</tspan></text>
