<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Засмічення кешу під час пакетного сканування</text>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія засмічення кешу (Cache Pollution / Thrashing)</text>
<rect x="40.0" y="60.0" width="220.0" height="110.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Нормальна робота</tspan><tspan x="150.0" dy="16.9"></tspan><tspan x="150.0" dy="16.9">Частка влучань: 95 %</tspan><tspan x="150.0" dy="16.9">Навантаження на БД: 5 %</tspan></text>
<rect x="280.0" y="60.0" width="460.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Кеш LRU заповнений гарячими ключами:</tspan><tspan x="510.0" dy="15.6">[ Профіль U1 ] [ Товар P42 ] [ Сесія S7 ] [ Баланс B3 ]</tspan><tspan x="510.0" dy="15.6">Користувачі отримують миттєві відповіді з RAM.</tspan></text>
<rect x="760.0" y="60.0" width="220.0" height="110.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="870.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Первинна БД:</tspan><tspan x="870.0" dy="15.6"></tspan><tspan x="870.0" dy="15.6">CPU: 12 %</tspan><tspan x="870.0" dy="15.6">IOPS: низький</tspan><tspan x="870.0" dy="15.6">Черги відсутні</tspan></text>
<rect x="40.0" y="195.0" width="220.0" height="110.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="150.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">2. Одноразовий скан</tspan><tspan x="150.0" dy="16.9"></tspan><tspan x="150.0" dy="16.9">Batch Export / ETL</tspan><tspan x="150.0" dy="16.9">10 000 унікальних ключів</tspan></text>
<rect x="280.0" y="195.0" width="460.0" height="110.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="510.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Потік холодних одноразових запитів:</tspan><tspan x="510.0" dy="15.6">K101 → K102 → K103 → ... → K9999</tspan><tspan x="510.0" dy="15.6">Кожен запис вибиває гарячий ключ із черги LRU!</tspan></text>
<rect x="760.0" y="195.0" width="220.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Проблема:</tspan><tspan x="870.0" dy="15.6"></tspan><tspan x="870.0" dy="15.6">Холодні ключі більше</tspan><tspan x="870.0" dy="15.6">ніколи не запитають,</tspan><tspan x="870.0" dy="15.6">але вони витіснили гарячі!</tspan></text>
<rect x="40.0" y="330.0" width="220.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="364.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">3. Колапс (Thrashing)</tspan><tspan x="150.0" dy="16.9"></tspan><tspan x="150.0" dy="16.9">Частка влучань: 3 %</tspan><tspan x="150.0" dy="16.9">Лавина промахів</tspan></text>
<rect x="280.0" y="330.0" width="460.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="373.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Кеш забитий мертвими ключами скану:</tspan><tspan x="510.0" dy="15.6">[ K9996 ] [ K9997 ] [ K9998 ] [ K9999 ]</tspan><tspan x="510.0" dy="15.6">Звернення до профілів та товарів ідуть у БД (Cache Stampede).</tspan></text>
<rect x="760.0" y="330.0" width="220.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Первинна БД:</tspan><tspan x="870.0" dy="15.6"></tspan><tspan x="870.0" dy="15.6">CPU: 100 % (Перевантаження)</tspan><tspan x="870.0" dy="15.6">IOPS: полиця дисків</tspan><tspan x="870.0" dy="15.6">Каскадні таймаути</tspan></text>
<text x="510.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Висновок: об'ємні скани, звіти та бекапи повинні читати БД в обхід кешу (Bypass / Direct I/O).</text>
</svg>