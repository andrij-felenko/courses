<rect x="740.0" y="362.0" width="220.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="393.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Кеш сповільнює систему</tspan></text>
<text x="500.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Формула: E[T] = h · T_cache + (1 − h) · (T_cache + T_origin). При h &lt; T_cache / T_origin кеш шкідливий.</text>
