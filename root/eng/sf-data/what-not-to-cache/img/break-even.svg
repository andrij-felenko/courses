<text x="500.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ефективна затримка запиту залежно від частки влучань (Hit Ratio)</text>
<text x="500.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">База даних (Origin): T_origin = 10.0 мс  ·  Кеш: T_cache = 1.0 мс</text>
