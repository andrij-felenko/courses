<rect x="40.0" y="335.0" width="405.0" height="70.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="242.5" y="360.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Властивість: читання O(log N) дуже швидке.</tspan><tspan x="242.5" dy="13.0">Недолік: кожен новий або змінений запис переписує цілу 4 KB сторінку</tspan><tspan x="242.5" dy="13.0">на диску -&gt; високий WAF та знос накопичувача.</tspan></text>
