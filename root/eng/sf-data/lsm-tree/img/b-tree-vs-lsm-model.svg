<rect x="515.0" y="335.0" width="405.0" height="70.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="717.5" y="359.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="717.5" dy="0.0">Властивість: записи накопичуються в RAM і скидаються на диск</tspan><tspan x="717.5" dy="14.3">єдиним послідовним потоком. Максимальна швидкість запису,</tspan><tspan x="717.5" dy="14.3">нуль випадкового перезапису.</tspan></text>
