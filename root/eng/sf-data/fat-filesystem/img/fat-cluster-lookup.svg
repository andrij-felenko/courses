<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="390.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покрокова трансляція зміщення у файлі у фізичний сектор носія (LBA)</text>
<text x="420.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Від логічного байта до секторів таблиці FAT та кінцевого сектора на диску</text>
<rect x="40.0" y="95.0" width="175.0" height="135.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="127.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">1. Логічне зміщення</text>
<line x1="40.0" y1="127.0" x2="215.0" y2="127.0" stroke="#ef4444" stroke-width="1.0"/>
<text x="127.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсув у файлі: 10 500 B</text>
<text x="127.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кластер = 4096 B</text>
<text x="127.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">Номер кроку = 10500 ÷ 4096</text>
<text x="127.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">= 2-й кластер файлу</text>
<line x1="215.0" y1="162.0" x2="240.0" y2="162.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="240.0" y="95.0" width="175.0" height="135.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="327.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">2. Прохід ланцюжка</text>
<line x1="240.0" y1="127.0" x2="415.0" y2="127.0" stroke="#3b82f6" stroke-width="1.0"/>
<text x="327.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">DirEntry: FirstClus = 8</text>
<text x="327.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">FAT[8] → 15 (крок 1)</text>
<text x="327.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">FAT[15] → 23 (крок 2)</text>
<text x="327.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Шуканий кластер = 23</text>
<line x1="415.0" y1="162.0" x2="440.0" y2="162.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="95.0" width="175.0" height="135.0" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="527.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">3. Читання самої FAT</text>
<line x1="440.0" y1="127.0" x2="615.0" y2="127.0" stroke="#f59e0b" stroke-width="1.0"/>
<text x="527.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зміщення = 23 · 4 = 92 B</text>
<text x="527.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Сектор FAT = Rsvd + (92÷512)</text>
<text x="527.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зміщення в секторі = 92</text>
<text x="527.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Кеш блоків FAT (L1)</text>
<line x1="615.0" y1="162.0" x2="640.0" y2="162.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="95.0" width="175.0" height="135.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="727.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">4. Фізичний сектор</text>
<line x1="640.0" y1="127.0" x2="815.0" y2="127.0" stroke="#22c55e" stroke-width="1.0"/>
<text x="727.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">LBA = FirstDataSector +</text>
<text x="727.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(23 - 2) · SecPerClus</text>
<text x="727.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">+ Зсув у кластері (4 B)</text>
<text x="727.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">LBA #2048 (read/write)</text>
<rect x="40.0" y="255.0" width="760.0" height="120.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формули обчислення адрес для драйвера файлової системи:</text>
<text x="60.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="start">• Сектор FAT для кластера N:   FAT_Sector = BPB_RsvdSecCnt + ((N · FAT_Entry_Size) ÷ BPB_BytsPerSec)</text>
<text x="60.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="start">• Зміщення запису в секторі:   FAT_Offset = (N · FAT_Entry_Size) % BPB_BytsPerSec</text>
<text x="60.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="start">• Перший сектор кластера N:    Cluster_LBA = FirstDataSector + ((N - 2) · BPB_SecPerClus)</text>
<text x="60.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="start">• Зсув сектора всередині купи: Sector_In_Cluster = (File_Offset % Cluster_Bytes) ÷ BPB_BytsPerSec</text>
</svg>