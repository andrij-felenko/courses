<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="390.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура тома файлової системи FAT на блочному носії</text>
<text x="420.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Поділ простору LBA на зарезервовану область, таблиці FAT, кореневий каталог та купу кластерів</text>
<text x="40.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">FAT12 / FAT16:</text>
<rect x="40.0" y="115.0" width="130.0" height="70.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="105.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Зарезервована</text>
<text x="105.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">Boot Sector / BPB</text>
<text x="105.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Сектор 0)</text>
<rect x="180.0" y="115.0" width="160.0" height="70.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="260.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">Таблиці FAT</text>
<text x="260.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">FAT1 (основна)</text>
<text x="260.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">FAT2 (резервна)</text>
<rect x="350.0" y="115.0" width="150.0" height="70.0" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="425.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">Кореневий каталог</text>
<text x="425.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle">Фіксований розмір</text>
<text x="425.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">512 записів (32 сектори)</text>
<rect x="510.0" y="115.0" width="290.0" height="70.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="655.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Область даних (Data Region)</text>
<text x="655.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Купа кластерів: Кластери #2, #3, #4, ... #N</text>
<text x="655.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Файли та вкладені підкаталоги</text>
<text x="40.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">FAT32:</text>
<rect x="40.0" y="240.0" width="170.0" height="80.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="125.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Зарезервована область</text>
<text x="125.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">Сектор 0: VBR + BPB</text>
<text x="125.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">Сектор 1: FSInfo</text>
<text x="125.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сектор 6: Backup VBR</text>
<rect x="220.0" y="240.0" width="190.0" height="80.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="315.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">Таблиці FAT (32-бітні)</text>
<text x="315.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">FAT1 (основна таблиця)</text>
<text x="315.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">FAT2 (резервна копія)</text>
<text x="315.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4 байти на кожен кластер</text>
<rect x="420.0" y="240.0" width="380.0" height="80.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="610.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Область даних (Data Region / Cluster Heap)</text>
<text x="610.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700">Кластер #2: Кореневий каталог (BPB_RootClus) — динамічний ланцюжок</text>
<text x="610.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Кластери #3, #4, ... #N: Звичайні файли та підкаталоги</text>
<text x="610.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кореневий каталог може нескінченно рости, як звичайний файл</text>
<text x="420.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключова відмінність FAT32: відсутність окремої фіксованої області для Root Directory.</text>
<text x="420.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кореневий каталог у FAT32 розміщується безпосередньо в купі даних як динамічний ланцюжок кластерів.</text>
</svg>