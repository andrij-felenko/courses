<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 616" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="616" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запис назад: у якому порядку і де межа підтвердження</text>
<text x="320.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">порядок операторів</text>
<text x="970.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">межа транзакції</text>
<rect x="40.0" y="90.0" width="560.0" height="88.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">1 · INSERT — батьки раніше за дітей</tspan><tspan x="320.0" dy="15.6">customers → orders → order_lines</tspan><tspan x="320.0" dy="15.6">згенерований ключ батька повертає RETURNING —</tspan><tspan x="320.0" dy="15.6">і його вписують дітям перед їхньою вставкою</tspan></text>
<rect x="40.0" y="196.0" width="560.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="220.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">2 · UPDATE — усередині одного рівня</tspan><tspan x="320.0" dy="15.6">порядок довільний</tspan></text>
<rect x="40.0" y="270.0" width="560.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="295.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">3 · DELETE — діти раніше за батьків</tspan><tspan x="320.0" dy="15.6">order_lines → orders → customers</tspan><tspan x="320.0" dy="15.6">інакше зовнішній ключ не дасть прибрати батька</tspan></text>
<rect x="40.0" y="366.0" width="560.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="320.0" y="391.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">набір, що просто йде рядками згори вниз,</tspan><tspan x="320.0" dy="15.6">розіб'ється об обмеження цілісності на пів дорозі:</tspan><tspan x="320.0" dy="15.6">порядок задає граф зв'язків, а не номер рядка</tspan></text>
<rect x="680.0" y="90.0" width="580.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="115.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">BEGIN</tspan></text>
<rect x="680.0" y="152.0" width="580.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="970.0" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">кожен оператор: виконати й спитати,</tspan><tspan x="970.0" dy="16.2">скільки рядків він змінив</tspan><tspan x="970.0" dy="16.2">1 → далі     0 → нас випередили</tspan></text>
<rect x="680.0" y="268.0" width="580.0" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="293.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">COMMIT</tspan></text>
<rect x="680.0" y="330.0" width="580.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="970.0" y="363.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">accept(): стани → незмінений,</tspan><tspan x="970.0" dy="16.2">початкові значення стерти, надгробки прибрати</tspan></text>
<line x1="970.0" y1="132.0" x2="970.0" y2="148.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="970.0" y1="248.0" x2="970.0" y2="264.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="970.0" y1="310.0" x2="970.0" y2="326.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="680.0" y="418.0" width="580.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="970.0" y="444.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">0 змінених рядків → ROLLBACK і конфлікт</tspan></text>
<line x1="672.0" y1="200.0" x2="672.0" y2="440.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="120.0" y="490.0" width="1060.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Поміняти місцями два останні кроки — і набір збреше сам собі:</tspan><tspan x="650.0" dy="16.2">після відкату стани вже «незмінений», початкові значення стерті,</tspan><tspan x="650.0" dy="16.2">правки користувача зникли без сліду, а в базі їх ніколи не було.</tspan><tspan x="650.0" dy="16.2">Приймати зміни можна ЛИШЕ після того, як COMMIT повернувся успіхом.</tspan></text>
</svg>