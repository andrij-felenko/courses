  <marker id="aViolet" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#6a3fa0"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як одна частинка перекидає біт (SEU) — і коли вона ще й «замикає» кристал (SEL)</text>
<text x="480.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">спільний початок один: заряджена частинка лишає в кремнії тонкий слід вільного заряду; далі — два дуже різні наслідки</text>
<rect x="60.0" y="92.0" width="300.0" height="250.0" rx="10" fill="#f4f7fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="210.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">СПІЛЬНИЙ ПОЧАТОК</text>
<text x="210.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">слід заряду в кремнії</text>
<rect x="84.0" y="242.0" width="252.0" height="70.0" rx="4" fill="#eef0f3" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="90.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">кремній (підкладка)</text>
<rect x="176.0" y="224.0" width="68.0" height="18.0" rx="3" fill="#dfe7f5" stroke="#1f47b5" stroke-width="1.4"/>
<text x="210.0" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">вузол комірки</text>
<line x1="100.0" y1="150.0" x2="236.0" y2="300.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<text x="96.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">частинка</text>
<text x="96.0" y="159.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">(іон / протон / вторинна</text>
<text x="96.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">від нейтрона)</text>
<text x="127.7" y="173.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<text x="130.4" y="183.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">−</text>
<text x="150.1" y="196.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<text x="140.0" y="208.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">−</text>
<text x="161.2" y="218.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<text x="159.2" y="225.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">−</text>
<text x="186.4" y="243.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<text x="179.1" y="247.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">−</text>
<text x="208.7" y="265.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<text x="205.4" y="270.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">−</text>
<text x="233.3" y="277.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<text x="210.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">трек = доріжка з пар «електрон–дірка»</text>
<text x="210.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#6a3fa0" text-anchor="middle" font-weight="bold" font-style="normal">скільки заряду на міліметр треку — це і є LET</text>
<line x1="364.0" y1="172.0" x2="430.0" y2="142.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<line x1="364.0" y1="272.0" x2="430.0" y2="322.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="372.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">малий</text>
<text x="372.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">великий</text>
<rect x="438.0" y="92.0" width="482.0" height="118.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
<text x="454.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">SEU — single event UPSET (м'яка помилка)</text>
<text x="454.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">зібраний заряд Q  &gt;  критичного заряду Qcrit  →  біт перекинувся</text>
<text x="478.0" y="182.0" font-family="Cascadia Mono, Consolas, monospace" font-size="22" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<line x1="496.0" y1="176.0" x2="542.0" y2="176.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="560.0" y="182.0" font-family="Cascadia Mono, Consolas, monospace" font-size="22" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="606.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">дані спотворені, але залізо ЦІЛЕ:</text>
<text x="606.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">перезапис комірки лікує (тому й «м'яка»)</text>
<rect x="438.0" y="232.0" width="482.0" height="132.0" rx="10" fill="#fff8ec" stroke="#caa24a" stroke-width="1.8"/>
<text x="454.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a6d1f" text-anchor="start" font-weight="bold" font-style="normal">SEL — single event LATCH-UP (засув)</text>
<text x="454.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">у CMOS «дрімає» паразитний тиристор (p-n-p-n); удар його ВВІМКНУВ —</text>
<text x="454.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">коротке коло живлення, струм тече, доки не зняти й знову подати живлення</text>
<rect x="448.0" y="320.0" width="28.0" height="24.0" rx="3" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="462.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">p</text>
<rect x="478.0" y="320.0" width="28.0" height="24.0" rx="3" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="492.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">n</text>
<rect x="508.0" y="320.0" width="28.0" height="24.0" rx="3" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="522.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">p</text>
<rect x="538.0" y="320.0" width="28.0" height="24.0" rx="3" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="552.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">n</text>
<text x="462.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">паразитний p-n-p-n</text>
<text x="688.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">загроза НЕ лише даним:</text>
<text x="688.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перегрів і вигоряння, якщо струм</text>
<text x="688.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">не обірвати — рятунок: скинути живлення</text>
<rect x="60.0" y="384.0" width="840.0" height="156.0" rx="10" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="480.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що з цього випливає для Розділу 3.9</text>
<rect x="80.0" y="418.0" width="56.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="108.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">SEU</text>
<text x="150.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перекинутий біт — це саме той «м'який» збій, проти якого працюють парність (§3.9.2), CRC (§3.9.4)</text>
<text x="150.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">і коди, що виправляють (§3.9.6–3.9.7): дані псуються, але кристал справний, тож надлишковість їх рятує.</text>
<rect x="80.0" y="474.0" width="56.0" height="30.0" rx="6" fill="#ffffff" stroke="#8a6d1f" stroke-width="1.6"/>
<text x="108.0" y="494.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a6d1f" text-anchor="middle" font-weight="bold" font-style="normal">SEL</text>
<text x="150.0" y="488.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">засув кодом не виправиш — це вже електрична аварія живлення; тут рятують схемні засоби</text>
<text x="150.0" y="504.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(захист по струму, скидання живлення), а не контрольні суми. Звідси межа: коди лікують дані, не залізо.</text>
</svg>
