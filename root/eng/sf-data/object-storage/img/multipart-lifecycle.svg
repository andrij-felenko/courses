<rect x="340.0" y="375.0" width="220.0" height="32.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="450.0" y="394.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Склеювання метаданих об'єкта</tspan></text>
<line x1="730.0" y1="425.0" x2="170.0" y2="425.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="700">8. 200 OK: &lt;CompleteMultipartUploadResult&gt;&lt;ETag&gt;&quot;composite_hash-2&quot;&lt;/ETag&gt;</text>
<rect x="200.0" y="440.0" width="500.0" height="24.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="450.0" y="455.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="450.0" dy="0.0">Правило життєвого циклу: AbortIncompleteMultipartUpload через 7 днів очищує кинуті частини</tspan></text>
</svg>