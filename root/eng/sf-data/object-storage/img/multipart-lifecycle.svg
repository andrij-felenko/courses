<text x="450.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">5. PUT /bucket/video.mp4?partNumber=2&amp;uploadId=abc123xyz (Чанк 2: 10 МБ, паралельно)</text>
<line x1="730.0" y1="310.0" x2="170.0" y2="310.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">6. 200 OK (ETag: &quot;hash_2&quot;)</text>
