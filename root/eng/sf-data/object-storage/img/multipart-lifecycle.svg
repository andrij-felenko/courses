<text x="450.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">4. 200 OK (ETag: &quot;hash_1&quot;)</text>
