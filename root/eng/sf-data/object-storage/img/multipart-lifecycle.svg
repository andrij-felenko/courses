<text x="730.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">S3 / Об'єктне сховище</text>
<line x1="170" y1="115" x2="170" y2="465" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="730" y1="115" x2="730" y2="465" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="170.0" y1="140.0" x2="730.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. POST /bucket/video.mp4?uploads (Ініціалізація завантаження)</text>
<line x1="730.0" y1="175.0" x2="170.0" y2="175.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">2. 200 OK: &lt;InitiateMultipartUploadResult&gt;&lt;UploadId&gt;abc123xyz&lt;/UploadId&gt;</text>
<line x1="170.0" y1="215.0" x2="730.0" y2="215.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">3. PUT /bucket/video.mp4?partNumber=1&amp;uploadId=abc123xyz (Чанк 1: 10 МБ)</text>
