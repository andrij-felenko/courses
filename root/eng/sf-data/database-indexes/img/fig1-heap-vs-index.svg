<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="450.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Шляхи вибірки даних: Послідовне сканування (Seq Scan) проти Індексного доступу</text>
<rect x="30.0" y="60.0" width="380.0" height="380.0" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="220.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Послідовне сканування (Seq Scan)</text>
<text x="220.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Зчитування кожної сторінки диска: O(N) операцій I/O</text>
<rect x="50.0" y="117.5" width="340.0" height="35.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="220.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Сторінка 0 (8 КБ)</tspan><tspan x="220.0" dy="13.0">[рядки 1..40] — перевірка умов</tspan></text>
<rect x="50.0" y="177.5" width="340.0" height="35.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="220.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Сторінка 1 (8 КБ)</tspan><tspan x="220.0" dy="13.0">[рядки 41..80] — перевірка умов</tspan></text>
<rect x="50.0" y="237.5" width="340.0" height="35.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="220.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Сторінка 2 (8 КБ)</tspan><tspan x="220.0" dy="13.0">[рядок 82 ЗБІГ! TID=(2,2)]</tspan></text>
<rect x="50.0" y="297.5" width="340.0" height="35.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="220.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Сторінка 3..N (8 КБ)</tspan><tspan x="220.0" dy="13.0">[продовження до кінця таблиці]</tspan></text>
<line x1="220.0" y1="155.0" x2="220.0" y2="175.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220.0" y1="215.0" x2="220.0" y2="235.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220.0" y1="275.0" x2="220.0" y2="295.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="377.5" width="340.0" height="35.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="220.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">100 ГБ таблиця = 12 500 000 сторінок</tspan><tspan x="220.0" dy="13.0">Час зчитування: десятки секунд чи хвилини</tspan></text>
<rect x="450.0" y="60.0" width="380.0" height="380.0" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="640.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Індексний пошук через B-дерево (Index Scan)</text>
<text x="640.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Логарифмічний спуск до TID: O(log N) операцій I/O</text>
<rect x="490.0" y="118.5" width="300.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="640.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Корінь індексу (Root Page)</tspan><tspan x="640.0" dy="13.0">Ключі: [100 | 500 | 1000]</tspan></text>
<rect x="490.0" y="193.5" width="300.0" height="33.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="640.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Листовий вузол (Leaf Page)</tspan><tspan x="640.0" dy="13.0">Ключ 82 ➔ Покажчик TID = (Блок 2, Зсув 2)</tspan></text>
<rect x="490.0" y="278.5" width="300.0" height="33.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="640.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Купа (Heap): Лише Блок 2 (8 КБ)</tspan><tspan x="640.0" dy="13.0">Пряме вилучення кортежу за зсувом 2</tspan></text>
<line x1="640.0" y1="155.0" x2="640.0" y2="190.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="640.0" y1="230.0" x2="640.0" y2="275.0" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="377.5" width="340.0" height="35.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="640.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">3 сторінки індексу + 1 сторінка купи = 4 зчитування</tspan><tspan x="640.0" dy="13.0">Час виконання: менше 1 мілісекунди</tspan></text>
</svg>