<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="480.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Внутрішня організація сторінки B+дерева (Slotted Page) та листовий ланцюг</text>
<rect x="30.0" y="60.0" width="800.0" height="190.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="430.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Фізична структура дискової сторінки індексу (8192 байти)</text>
<rect x="45.0" y="107.0" width="120.0" height="46.0" rx="6" fill="#334155" stroke="#1e293b" stroke-width="1.5"/><text x="105.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Заголовок</tspan><tspan x="105.0" dy="13.0">(PageHeader)</tspan><tspan x="105.0" dy="13.0">LSN, зсуви</tspan></text>
<rect x="175.0" y="107.0" width="130.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="240.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Масив покажчиків</tspan><tspan x="240.0" dy="13.0">(ItemId / LinePtr)</tspan><tspan x="240.0" dy="13.0">[Зсув 1] [2] [3]</tspan></text>
<rect x="315.0" y="107.0" width="130.0" height="46.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="380.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Вільне місце</tspan><tspan x="380.0" dy="13.0">(Free Space)</tspan><tspan x="380.0" dy="13.0">Росте до центру</tspan></text>
<rect x="460.0" y="107.0" width="160.0" height="46.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="540.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Тіло записів індексу</tspan><tspan x="540.0" dy="13.0">(IndexTuples: Ключ+TID)</tspan><tspan x="540.0" dy="13.0">[Кортеж 3] [2] [1]</tspan></text>
<rect x="635.0" y="107.0" width="170.0" height="46.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="720.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Спеціальна зона (Opaque)</tspan><tspan x="720.0" dy="13.0">High Key + RightLink</tspan><tspan x="720.0" dy="13.0">(Lehman-Yao B-link)</tspan></text>
<text x="430.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-style="italic">Напрямок заповнення: Покажчики зростають зліва направо ➔ ⯈ Вільне місце ⯇ 🠔 Записи ростуть справа наліво</text>
<text x="430.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e08a1e" text-anchor="middle" font-weight="700">High Key: Верхня межа значень на сторінці. RightLink: Швидкий перехід праворуч при паралельному розщепленні.</text>
<text x="430.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Двозв'язний список листових вузлів для діапазонного сканування (Range Scan)</text>
<rect x="55.0" y="319.5" width="190.0" height="61.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="150.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Листовий вузол A</tspan><tspan x="150.0" dy="13.0">Ключі: [10, 15, 22]</tspan><tspan x="150.0" dy="13.0">TID: [(1,1), (1,2), (2,1)]</tspan><tspan x="150.0" dy="13.0">High Key: 25</tspan></text>
<rect x="335.0" y="319.5" width="190.0" height="61.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="430.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Листовий вузол B</tspan><tspan x="430.0" dy="13.0">Ключі: [25, 31, 40]</tspan><tspan x="430.0" dy="13.0">TID: [(2,2), (3,1), (3,2)]</tspan><tspan x="430.0" dy="13.0">High Key: 45</tspan></text>
<rect x="615.0" y="319.5" width="190.0" height="61.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="710.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Листовий вузол C</tspan><tspan x="710.0" dy="13.0">Ключі: [45, 52, 60]</tspan><tspan x="710.0" dy="13.0">TID: [(4,1), (4,2), (5,1)]</tspan><tspan x="710.0" dy="13.0">High Key: ∞</tspan></text>
<line x1="250.0" y1="335.0" x2="325.0" y2="335.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="325.0" y1="365.0" x2="250.0" y2="365.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="535.0" y1="335.0" x2="605.0" y2="335.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="605.0" y1="365.0" x2="535.0" y2="365.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="45.8" y="429.0" width="768.4" height="22.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="430.0" y="443.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Запит 'WHERE id BETWEEN 15 AND 52': один спуск до вузла A ➔ лінійне читання праворуч до вузла C (без повернення до кореня)</tspan></text>
</svg>