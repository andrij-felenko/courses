<text x="270.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">згортання:</tspan><tspan x="270.0" dy="16.2">кінці вирішують ЩО</tspan></text>
<text x="650.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">відкладені перевірки:</tspan><tspan x="650.0" dy="16.2">кінці — КОЛИ цілість</tspan></text>
<text x="1030.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">атомарність:</tspan><tspan x="1030.0" dy="16.2">кінці — усе, що ВИДНО</tspan></text>
