<rect x="45.0" y="88.0" width="390.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">&quot;allOf&quot;: [</tspan><tspan x="240.0" dy="13.0">  { &quot;properties&quot;: { &quot;name&quot;: { &quot;type&quot;: &quot;string&quot; } },</tspan><tspan x="240.0" dy="13.0">    &quot;additionalProperties&quot;: false },</tspan><tspan x="240.0" dy="13.0">  { &quot;properties&quot;: { &quot;age&quot;: { &quot;type&quot;: &quot;integer&quot; } },</tspan><tspan x="240.0" dy="13.0">    &quot;additionalProperties&quot;: false }</tspan><tspan x="240.0" dy="13.0">]</tspan></text>
<rect x="45.0" y="180.0" width="390.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Дані: {&quot;name&quot;: &quot;Олена&quot;, &quot;age&quot;: 28}</tspan><tspan x="240.0" dy="13.0">• Гілка 1: поле &quot;name&quot; валідне, але &quot;age&quot; вважається зайвим!</tspan><tspan x="240.0" dy="13.0">• Помилка: additionalProperties: false відкидає &quot;age&quot;</tspan></text>
<rect x="45.0" y="240.0" width="390.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="240.0" dy="0.0">Причина ізоляції:</tspan><tspan x="240.0" dy="11.7">Кожна підсхема в allOf обчислюється повністю автономно.</tspan><tspan x="240.0" dy="11.7">Ключове слово additionalProperties бачить лише локальні</tspan><tspan x="240.0" dy="11.7">властивості своєї підсхеми і не знає про сусідні гілки.</tspan></text>
