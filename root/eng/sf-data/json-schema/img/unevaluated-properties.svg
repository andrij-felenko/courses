<text x="700.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Динамічні анотації: unevaluatedProperties (2020-12)</text>
<rect x="505.0" y="88.0" width="390.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">&quot;allOf&quot;: [</tspan><tspan x="700.0" dy="13.0">  { &quot;properties&quot;: { &quot;name&quot;: { &quot;type&quot;: &quot;string&quot; } } },</tspan><tspan x="700.0" dy="13.0">  { &quot;properties&quot;: { &quot;age&quot;: { &quot;type&quot;: &quot;integer&quot; } } }</tspan><tspan x="700.0" dy="13.0">],</tspan><tspan x="700.0" dy="13.0">&quot;unevaluatedProperties&quot;: false</tspan></text>
<rect x="505.0" y="180.0" width="390.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Дані: {&quot;name&quot;: &quot;Олена&quot;, &quot;age&quot;: 28}</tspan><tspan x="700.0" dy="13.0">• Гілка 1 анотує &quot;name&quot; як перевірене.</tspan><tspan x="700.0" dy="13.0">• Гілка 2 анотує &quot;age&quot; як перевірене.</tspan><tspan x="700.0" dy="13.0">• unevaluatedProperties перевіряє залишок: ∅ → УСПІХ!</tspan></text>
<rect x="505.0" y="240.0" width="390.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="700.0" dy="0.0">Механізм динамічних анотацій:</tspan><tspan x="700.0" dy="11.7">У Draft 2020-12 збирається список усіх властивостей,</tspan><tspan x="700.0" dy="11.7">оцінених будь-якими підсхемами (properties, allOf, if).</tspan><tspan x="700.0" dy="11.7">Залишок перевіряється через unevaluatedProperties.</tspan></text>
