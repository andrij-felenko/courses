<text x="70.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">2</text>
<text x="150.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Електроніка</text>
<text x="280.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="700">/1/2/</text>
<rect x="45.0" y="204.0" width="330.0" height="26.0" rx="3" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.0"/>
<text x="70.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">3</text>
<text x="150.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Одяг</text>
<text x="280.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">/1/3/</text>
<rect x="45.0" y="238.0" width="330.0" height="26.0" rx="3" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.0"/>
<text x="70.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">4</text>
<text x="150.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Телефони</text>
<text x="280.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">/1/2/4/</text>
<rect x="45.0" y="272.0" width="330.0" height="26.0" rx="3" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.0"/>
<text x="70.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">5</text>
<text x="150.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Ноутбуки</text>
<text x="280.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">/1/2/5/</text>
