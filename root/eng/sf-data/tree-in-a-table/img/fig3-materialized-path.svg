<text x="70.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">6</text>
<text x="150.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Взуття</text>
<text x="280.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">/1/3/6/</text>
<rect x="55.0" y="358.5" width="310.0" height="33.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="210.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Індекс B-Tree (text_pattern_ops) або GiST (ltree)</tspan><tspan x="210.0" dy="13.0">Пошук нащадків — префіксне сканування індексу</tspan></text>
<rect x="410.0" y="65.0" width="400.0" height="345.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="610.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">Швидкі запити та вартість оновлення</text>
<rect x="430.0" y="116.0" width="360.0" height="48.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="610.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">1. Вибірка всього піддерева Електроніки:</tspan><tspan x="610.0" dy="13.0">WHERE path LIKE '/1/2/%'</tspan><tspan x="610.0" dy="13.0">→ Миттєво вибирає вузли 2, 4, 5 без рекурсії</tspan></text>
<rect x="430.0" y="191.0" width="360.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="610.0" y="205.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">2. Отримання хлібних крихт (предків) для Ноутбуків:</tspan><tspan x="610.0" dy="13.0">Шлях = '/1/2/5/' → ID предків = {1, 2, 5}</tspan><tspan x="610.0" dy="13.0">WHERE id IN (1, 2, 5)  [Розбір рядка або ltree]</tspan></text>
<rect x="430.0" y="273.0" width="360.0" height="74.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="610.0" y="287.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">3. Переміщення піддерева (Електроніку переносимо в Одяг):</tspan><tspan x="610.0" dy="13.0">Старий префікс: '/1/2/'  →  Новий префікс: '/1/3/2/'</tspan><tspan x="610.0" dy="13.0">UPDATE categories SET path = '/1/3/2/' || SUBSTRING(path, 6)</tspan><tspan x="610.0" dy="13.0">WHERE path LIKE '/1/2/%';</tspan><tspan x="610.0" dy="13.0">→ Вимагає оновлення всіх k нащадків гілки (O(k))</tspan></text>
</svg>