<text x="640.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" font-weight="700">Критерій нащадка: P.lft &lt; C.lft AND C.rgt &lt; P.rgt</text>
<text x="640.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Розмір піддерева: (rgt - lft - 1) / 2</text>
<text x="640.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Листок: rgt - lft = 1</text>
<rect x="30.0" y="315.0" width="780.0" height="140.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="40.0" y="361.0" width="370.0" height="48.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="225.0" y="375.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Швидке читання піддерева (Індексний діапазон):</tspan><tspan x="225.0" dy="13.0">SELECT * FROM categories WHERE lft BETWEEN 2 AND 7;</tspan><tspan x="225.0" dy="13.0">→ Миттєвий B-Tree range scan, O(log N + k)</tspan></text>
<rect x="430.0" y="348.0" width="370.0" height="74.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="615.0" y="362.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Катастрофічний перезапис ключів при вставці:</tspan><tspan x="615.0" dy="13.0">Вставка вузла вимагає зсуву ВСІХ наступних ключів:</tspan><tspan x="615.0" dy="13.0">UPDATE categories SET rgt = rgt + 2 WHERE rgt &gt;= :ins_pt;</tspan><tspan x="615.0" dy="13.0">UPDATE categories SET lft = lft + 2 WHERE lft &gt; :ins_pt;</tspan><tspan x="615.0" dy="13.0">→ Блокування всієї таблиці в OLTP!</tspan></text>
