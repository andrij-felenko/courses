<text x="552.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Дебет (Debit)</text>
<text x="697.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Кредит (Credit)</text>
<text x="552.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">− Зменшення</text>
<text x="552.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Погашення зобов'язань /</text>
<text x="552.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">виплата капіталу)</text>
<text x="697.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+ Збільшення</text>
<text x="697.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Зростання зобов'язань /</text>
<text x="697.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">отримання доходу)</text>
<rect x="460.0" y="285.0" width="330.0" height="48.0" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="625.0" y="305.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Нормальний баланс: КРЕДИТОВИЙ</tspan><tspan x="625.0" dy="15.6">Баланс = Сума(Кредит) − Сума(Дебет)</tspan></text>
