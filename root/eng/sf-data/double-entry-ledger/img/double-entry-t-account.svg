<svg xmlns="http://www.w3.org/2000/svg" viewBox="-47.3 -10 934.7 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-47.3" y="-10" width="934.7" height="380" fill="#ffffff"/>
