<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура Т-рахунків та напрямки дебету й кредиту</text>
<rect x="-37.3" y="35.0" width="914.7" height="49.9" rx="6" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/><text x="420.0" y="56.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1c3d5a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Фундаментальне бухгалтерське рівняння:</tspan><tspan x="420.0" dy="16.9">Активи (Assets) + Витрати (Expenses) = Зобов'язання (Liabilities) + Власний капітал (Equity) + Доходи (Revenue)</tspan></text>
<rect x="30.0" y="105.0" width="370.0" height="240.0" rx="8" fill="#f6f9fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="215.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">Активні рахунки (Активи, Витрати)</text>
<line x1="70.0" y1="175.0" x2="360.0" y2="175.0" stroke="#333333" stroke-width="2.0"/>
<line x1="215.0" y1="175.0" x2="215.0" y2="275.0" stroke="#333333" stroke-width="2.0"/>
<text x="142.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Дебет (Debit)</text>
<text x="287.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Кредит (Credit)</text>
<text x="142.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+ Збільшення</text>
<text x="142.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Надходження активу /</text>
<text x="142.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">понесення витрат)</text>
<text x="287.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">− Зменшення</text>
<text x="287.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Вибуття активу /</text>
<text x="287.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зменшення витрат)</text>
<rect x="50.0" y="285.0" width="330.0" height="48.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="215.0" y="305.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Нормальний баланс: ДЕБЕТОВИЙ</tspan><tspan x="215.0" dy="15.6">Баланс = Сума(Дебет) − Сума(Кредит)</tspan></text>
<rect x="440.0" y="105.0" width="370.0" height="240.0" rx="8" fill="#fdfbf7" stroke="#e2d9cc" stroke-width="1.5"/>
<text x="625.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#854d0e" text-anchor="middle" font-weight="700">Пасивні рахунки (Зобов'язання, Капітал, Доходи)</text>
<line x1="480.0" y1="175.0" x2="770.0" y2="175.0" stroke="#333333" stroke-width="2.0"/>
