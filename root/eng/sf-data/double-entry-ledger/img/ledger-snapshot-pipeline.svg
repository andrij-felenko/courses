<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрахунок балансу рахунку через знімки та дельту незмінного журналу</text>
<rect x="24.2" y="42.8" width="211.5" height="94.4" rx="6" fill="#eef2f6" stroke="#78909c" stroke-width="1.5"/><text x="130.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Незмінний журнал проводок</tspan><tspan x="130.0" dy="15.6">(Append-Only Postings Log)</tspan><tspan x="130.0" dy="15.6">• Seq 1..1 000 000</tspan><tspan x="130.0" dy="15.6">• Immutable / Read-only</tspan><tspan x="130.0" dy="15.6">• Строгий порядок транзакцій</tspan></text>
<line x1="245.0" y1="90.0" x2="315.0" y2="90.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Періодично</text>
<rect x="309.6" y="50.6" width="220.9" height="78.8" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/><text x="420.0" y="70.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Знімок балансу (Snapshot)</tspan><tspan x="420.0" dy="15.6">Баланс на Seq 1 000 000:</tspan><tspan x="420.0" dy="15.6">50 000.00 UAH</tspan><tspan x="420.0" dy="15.6">(Зафіксована точка відліку)</tspan></text>
<rect x="310.8" y="195.6" width="218.4" height="78.8" rx="6" fill="#fff8e1" stroke="#ffd54f" stroke-width="1.5"/><text x="420.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#f57f17" text-anchor="middle"><tspan x="420.0" dy="0.0">Хвіст свіжих проводок (Delta)</tspan><tspan x="420.0" dy="15.6">Seq 1 000 001 .. 1 000 015</tspan><tspan x="420.0" dy="15.6">(+500.00, -120.00, +80.00...)</tspan><tspan x="420.0" dy="15.6">Всього 15 проводок у вибірці</tspan></text>
<line x1="130.0" y1="155.0" x2="130.0" y2="235.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="130.0" y1="235.0" x2="285.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="195.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">WHERE seq &gt; 1000000</text>
<line x1="535.0" y1="90.0" x2="620.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="555.0" y1="235.0" x2="620.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="618.2" y="112.8" width="183.7" height="94.4" rx="6" fill="#ede7f6" stroke="#b39ddb" stroke-width="1.5"/><text x="710.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4a148c" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Миттєвий запит балансу</tspan><tspan x="710.0" dy="15.6">O(k) замість O(N):</tspan><tspan x="710.0" dy="15.6">Баланс = Snapshot +</tspan><tspan x="710.0" dy="15.6">+ SUM(Delta Postings)</tspan><tspan x="710.0" dy="15.6">= 50 460.00 UAH</tspan></text>
</svg>