<rect x="104.7" y="91.2" width="204.7" height="47.6" rx="6" fill="#ffffff" stroke="#d9a7a7" stroke-width="1.5"/><text x="207.0" y="111.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="207.0" dy="0.0">1. Початковий стан:</tspan><tspan x="207.0" dy="15.6">accounts: balance = 500 грн</tspan></text>
<rect x="77.3" y="153.4" width="259.4" height="63.2" rx="6" fill="#ffffff" stroke="#d9a7a7" stroke-width="1.5"/><text x="207.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="207.0" dy="0.0">2. Мутація безпосередньо в комірці:</tspan><tspan x="207.0" dy="15.6">UPDATE accounts SET balance = 400</tspan><tspan x="207.0" dy="15.6">WHERE id = 42;</tspan></text>
<rect x="85.4" y="235.6" width="243.2" height="78.8" rx="6" fill="#fbe8e8" stroke="#c0392b" stroke-width="1.5"/><text x="207.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="207.0" dy="0.0">Фатальні наслідки:</tspan><tspan x="207.0" dy="15.6">• Історія та контекст втрачені</tspan><tspan x="207.0" dy="15.6">• Неможливо відновити аудит</tspan><tspan x="207.0" dy="15.6">• Ризик втрати коштів при збої</tspan></text>
