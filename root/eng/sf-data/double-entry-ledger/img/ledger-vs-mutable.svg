<rect x="465.2" y="83.4" width="293.6" height="63.2" rx="6" fill="#ffffff" stroke="#a3d9c9" stroke-width="1.5"/><text x="612.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">1. Незмінний журнал проводок (Journal):</tspan><tspan x="612.0" dy="15.6">Tx 101: Списання 100 грн з рахунку A</tspan><tspan x="612.0" dy="15.6">Tx 101: Зарахування 100 грн на рахунок B</tspan></text>
<rect x="485.7" y="153.4" width="252.6" height="63.2" rx="6" fill="#ffffff" stroke="#a3d9c9" stroke-width="1.5"/><text x="612.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">2. Інваріант нульової суми:</tspan><tspan x="612.0" dy="15.6">Debit (+100) + Credit (-100) = 0</tspan><tspan x="612.0" dy="15.6">Заборона модифікацій (INSERT ONLY)</tspan></text>
<rect x="453.2" y="235.6" width="317.6" height="78.8" rx="6" fill="#e8f6ef" stroke="#27ae60" stroke-width="1.5"/><text x="612.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="700"><tspan x="612.0" dy="0.0">Гарантії цілісності:</tspan><tspan x="612.0" dy="15.6">• Баланс = математична сума проводок</tspan><tspan x="612.0" dy="15.6">• Повний аудиторський слід у часі</tspan><tspan x="612.0" dy="15.6">• Відтворюваність стану на будь-яку мить</tspan></text>
