<text x="610.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Корисної роботи — 0.05 мс: спуск по B-дереву й читання рядка з кеша. Решта 96% — конверт.</text>
<text x="610.0" y="602.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Один похід коштує стільки ж, скільки ≈ 400 зайвих рядків у відповіді: платять за конверт, а не за лист.</text>
