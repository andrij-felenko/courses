<text x="136.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">README дослівно цитує означення Фаулера</text>
<rect x="632.0" y="356.0" width="430.0" height="88.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="650.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Тед Невард на TechEd (BOF):</text>
<text x="650.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">«ORM — це В'єтнам інформатики»</text>
<text x="650.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">того самого року, що й Rails 0.5.0</text>
