<text x="590.0" y="684.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2010</text>
<rect x="632.0" y="646.0" width="430.0" height="66.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="650.0" y="670.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">21 грудня · Doctrine 2</text>
