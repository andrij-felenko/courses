<text x="590.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2005</text>
<rect x="118.0" y="460.0" width="430.0" height="66.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="136.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">13 грудня · Rails 1.0</text>
<text x="136.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Jolt-нагорода · «Hacker of the Year»</text>
