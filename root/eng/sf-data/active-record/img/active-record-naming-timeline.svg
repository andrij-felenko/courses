<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="840" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ім'я приходить пізно — і відразу розколює світ надвоє</text>
<text x="100.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">ДО ІМЕНІ · практика є, назви немає — і сперечатися нема про що</text>
<rect x="100.0" y="84.0" width="980.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="124.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1984</text>
<text x="290.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Коупленд і Маєр, «Making Smalltalk a Database System» (SIGMOD)</text>
<text x="290.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">розрив між об'єктами й таблицями стає предметом дослідження</text>
<rect x="100.0" y="152.0" width="980.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="124.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1995</text>
<text x="290.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Браун і Вайтенек, «Crossing Chasms» на PLoP'95</text>
<text x="290.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">перша мова патернів про той самий розрив — територію нанесено на карту</text>
<rect x="100.0" y="224.0" width="980.0" height="64.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/>
<text x="124.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">5 листопада 2002</text>
<text x="290.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Мартін Фаулер, «Patterns of Enterprise Application Architecture»</text>
<text x="290.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">два імені народжуються поруч: Active Record і Data Mapper — і звичка стає вибором</text>
<line x1="590.0" y1="292.0" x2="590.0" y2="800.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="554.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">ЯК ІМ'Я СТАВАЛО ЗАМОВЧУВАННЯМ</text>
<text x="626.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">ЯК ІМ'Я СТАВАЛО МІШЕННЮ</text>
<rect x="554.0" y="386.0" width="72.0" height="28.0" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="590.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2004</text>
<rect x="118.0" y="356.0" width="430.0" height="88.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
