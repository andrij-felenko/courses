<text x="590.0" y="591.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2006</text>
<rect x="118.0" y="542.0" width="430.0" height="88.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="136.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">13 квітня · Doctrine для PHP</text>
<text x="136.0" y="588.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Rails-підхід переходить у чужу мову:</text>
<text x="136.0" y="610.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Active Record як очевидний вибір</text>
