<text x="345.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Row Group 0 [amount]: min=10.50, max=450.00</text>
<text x="345.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Row Group 1 [amount]: min=500.00, max=1200.00</text>
<text x="345.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Запит WHERE amount &gt; 490 повністю пропускає Row Group 0!</text>
<rect x="720.0" y="344.0" width="190.0" height="102.0" rx="3" fill="#ffffff" stroke="#b7950b" stroke-width="1.0"/>
<text x="815.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсуви та розміри</text>
<text x="730.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Офсети Row Groups</text>
<text x="730.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Footer Length (4B)</text>
<text x="730.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">• Magic 'PAR1' (4B)</text>
<text x="480.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Читач Parquet спочатку зчитує кінець файлу (Footer), аналізує Min/Max статистики й завантажує лише потрібні байти Chunks</text>
