<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="480.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Фундаментальні оператори Реляційної Алгебри Кодда</text>
<rect x="80.0" y="95.0" width="260.0" height="69.9" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="210.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Селекція σ_φ(R)</tspan><tspan x="210.0" dy="14.3"></tspan><tspan x="210.0" dy="14.3">Фільтрація рядків за умовою φ</tspan><tspan x="210.0" dy="14.3">(вибирає підмножину кортежів)</tspan></text>
<rect x="469.0" y="95.0" width="282.0" height="69.9" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="610.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Проекція π_A(R)</tspan><tspan x="610.0" dy="14.3"></tspan><tspan x="610.0" dy="14.3">Вибір колонки A та вилучення дублікатів</tspan><tspan x="610.0" dy="14.3">(зміна схеми відношення)</tspan></text>
<rect x="62.2" y="225.1" width="295.6" height="69.9" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="210.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Декартів добуток R × S</tspan><tspan x="210.0" dy="14.3"></tspan><tspan x="210.0" dy="14.3">Комбінування кожного кортежу R з кожним S</tspan><tspan x="210.0" dy="14.3">(розмір |R| · |S|)</tspan></text>
<rect x="479.2" y="225.1" width="261.5" height="69.9" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="610.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Природне з'єднання R ⋈ S</tspan><tspan x="610.0" dy="14.3"></tspan><tspan x="610.0" dy="14.3">Об'єднання за спільними атрибутами</tspan><tspan x="610.0" dy="14.3">(π_{R.A, S.B}(σ_{R.X = S.X}(R × S)))</tspan></text>
<rect x="80.0" y="355.1" width="260.0" height="69.9" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="210.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Об'єднання R ∪ S</tspan><tspan x="210.0" dy="14.3"></tspan><tspan x="210.0" dy="14.3">Множинне об'єднання кортежів</tspan><tspan x="210.0" dy="14.3">(вимагає однакові схеми R та S)</tspan></text>
<rect x="480.0" y="355.1" width="260.0" height="69.9" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="610.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Різниця R \ S</tspan><tspan x="610.0" dy="14.3"></tspan><tspan x="610.0" dy="14.3">Кортежі, що є в R, але відсутні в S</tspan><tspan x="610.0" dy="14.3">(вимагає сумісність за схемою)</tspan></text>
<text x="420.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Оператори замкнені: результат застосування оператора до відношень є новим відношенням.</text>
</svg>