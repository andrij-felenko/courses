<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ASCII: 128 кодів у 7 бітах — і вони впорядковані НЕ випадково</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">коди 0…127 (7 бітів, влазять у байт із запасом); цифри й букви йдуть поспіль — звідси прості трюки нижче</text>
<rect x="70.0" y="86.0" width="760.0" height="58.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="96.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">0…31</text>
<text x="96.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">керівні (control)</text>
<text x="300.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">не друкуються: перенос рядка LF=10, повернення CR=13, табуляція=9, кінець=0</text>
<rect x="70.0" y="152.0" width="760.0" height="58.0" rx="8" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="96.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">32…47…</text>
<text x="96.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">пробіл і пунктуація</text>
<text x="300.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пробіл=32, '!'=33, цифри-роздільники; розкидані символи</text>
<rect x="70.0" y="218.0" width="760.0" height="58.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="96.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">48…57</text>
<text x="96.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">цифри '0'…'9'</text>
<text x="300.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">'0'=48, '1'=49, … '9'=57 — десять поспіль, рівно за порядком</text>
<rect x="70.0" y="284.0" width="760.0" height="58.0" rx="8" fill="#eef4ff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="96.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">65…90</text>
<text x="96.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">великі 'A'…'Z'</text>
<text x="300.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">'A'=65, 'B'=66, … 'Z'=90 — двадцять шість поспіль, за абеткою</text>
<rect x="70.0" y="350.0" width="760.0" height="58.0" rx="8" fill="#fbf6ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="96.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">97…122</text>
<text x="96.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">малі 'a'…'z'</text>
<text x="300.0" y="385.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">'a'=97, … 'z'=122 — теж поспіль; рівно на 32 більше за великі</text>
<text x="450.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключ до трюків: 'a' − 'A' = 97 − 65 = 32 (рівно один біт, вага 32). Цифри й букви — суцільними блоками.</text>
<text x="450.0" y="464.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">7 бітів = 128 кодів; восьмий біт байта лишався «вільним» — і саме на нього потім зазіхнули всі мови світу.</text>
</svg>
