<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
<rect width="920" height="520" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому ASCII лишився сумісним і чому потік самосинхронний</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усі «нові» байти мають старший біт 1 → ніколи не зіткнуться зі 128 байтами ASCII</text>
<line x1="70.0" y1="110.0" x2="850.0" y2="110.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="70.0" y1="104.0" x2="70.0" y2="116.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="70.0" y="132.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0x00</text>
<line x1="460.0" y1="104.0" x2="460.0" y2="116.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="460.0" y="132.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0x80</text>
<line x1="655.0" y1="104.0" x2="655.0" y2="116.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="655.0" y="132.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0xC0</text>
<line x1="850.0" y1="104.0" x2="850.0" y2="116.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="850.0" y="132.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0xFF</text>
<rect x="70.0" y="64.0" width="390.0" height="34.0" rx="6" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.5"/>
<text x="265.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ASCII  0x00–0x7F</text>
<text x="265.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">біт 7 = 0</text>
<rect x="460.0" y="64.0" width="195.0" height="34.0" rx="6" fill="#fbeeee" stroke="#c0271e" stroke-width="1.5"/>
<text x="557.5" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">продовження</text>
<text x="557.5" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">0x80–0xBF · 10xxxxxx</text>
<rect x="655.0" y="64.0" width="195.0" height="34.0" rx="6" fill="#fdf6e9" stroke="#caa24a" stroke-width="1.5"/>
<text x="752.5" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">провідні 2/3/4-байт</text>
<text x="752.5" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">0xC0–0xFF · 110/1110/11110</text>
<text x="460.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключ: жоден байт ASCII (ліворуч) не з'являється всередині багатобайтового символу (праворуч).</text>
<rect x="60.0" y="220.0" width="400.0" height="250.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="260.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Старий код, що сканує байти</text>
<text x="260.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(шукає кому ',' = 0x2C, рве рядок на поля)</text>
<rect x="88.0" y="312.0" width="70.0" height="40.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.6"/>
<text x="123.0" y="337.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold">0xD1</text>
<text x="123.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ї[1]</text>
<rect x="176.0" y="312.0" width="70.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="211.0" y="337.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold">0x97</text>
<text x="211.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ї[2]</text>
<rect x="264.0" y="312.0" width="70.0" height="40.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="299.0" y="337.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold">0x2C</text>
<text x="299.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">','</text>
<rect x="352.0" y="312.0" width="70.0" height="40.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="387.0" y="337.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold">0x41</text>
<text x="387.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">'A'</text>
<text x="260.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Сканер шукає байт 0x2C і знаходить його —</text>
<text x="260.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">бо байти символу «ї» (≥ 0x80) на нього не схожі.</text>
<text x="260.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ розбивка за ASCII-роздільниками працює як є,</text>
<text x="260.0" y="462.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">навіть нічого не знаючи про UTF-8.</text>
<rect x="480.0" y="220.0" width="380.0" height="250.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="670.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ресинхронізація після збою</text>
<text x="670.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">загубили байт — знайдемо наступний старт</text>
<rect x="498.0" y="312.0" width="56.0" height="40.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="526.0" y="337.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold">0xXX</text>
<text x="526.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">втрачено</text>
<rect x="568.0" y="312.0" width="56.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="596.0" y="337.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold">0x97</text>
<text x="596.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10…</text>
<rect x="638.0" y="312.0" width="56.0" height="40.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.6"/>
<text x="666.0" y="337.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold">0xE2</text>
<text x="666.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">1110…</text>
<rect x="708.0" y="312.0" width="56.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="736.0" y="337.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold">0x82</text>
<text x="736.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10…</text>
<rect x="778.0" y="312.0" width="56.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="806.0" y="337.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold">0xAC</text>
<text x="806.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10…</text>
<line x1="596.0" y1="390.0" x2="666.0" y2="362.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<text x="670.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Декодер пропускає байти 10xxxxxx (продовження),</text>
<text x="670.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">доки не зустріне провідний (0xxx або 11xx) —</text>
<text x="670.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">і знову в синхроні. Втрата псує ОДИН символ,</text>
<text x="670.0" y="462.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">а не весь решту потоку.</text>
</svg>
