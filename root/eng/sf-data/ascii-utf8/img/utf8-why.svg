<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
<rect width="880" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому UTF-8 переміг усі інші кодування Unicode</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">є й UTF-16, UTF-32, та саме UTF-8 став стандартом вебу й систем — за чотири практичні чесноти</text>
<rect x="70.0" y="86.0" width="740.0" height="64.0" rx="9" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="96.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✔ Сумісність з ASCII</text>
<text x="96.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">старий ASCII-текст — це вже валідний UTF-8; гори коду й файлів працюють без змін</text>
<rect x="70.0" y="160.0" width="740.0" height="64.0" rx="9" fill="#eef4ff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="96.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">✔ Економність</text>
<text x="96.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">англійський/латинський текст і розмітка лишаються 1 байт/символ — без роздування вдвічі-вчетверо</text>
<rect x="70.0" y="234.0" width="740.0" height="64.0" rx="9" fill="#fbf6ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="96.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">✔ Без порядку байтів</text>
<text x="96.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">потік окремих байтів, а не 2-/4-байтових слів — тож НЕМАЄ проблеми endianness (§17.7)</text>
<rect x="70.0" y="308.0" width="740.0" height="64.0" rx="9" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="96.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✔ Самосинхронізація</text>
<text x="96.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">за будь-яким байтом видно його роль (10… = середина) — можна знайти межу символу й відновитися після збою</text>
<text x="440.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">UTF-8 (Кен Томпсон і Роб Пайк, 1992) поєднав сумісність зі старим світом і охоплення всіх мов — тому й переміг.</text>
</svg>
