<rect x="30.0" y="272.0" width="220.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="303.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">промах коштує</tspan></text>
<rect x="250.0" y="272.0" width="320.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="303.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">барабан: мілісекунди</tspan></text>
<rect x="570.0" y="272.0" width="340.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="303.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">мережа й база: мілісекунди</tspan></text>
<rect x="30.0" y="326.0" width="220.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="357.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">хто бачить звернення</tspan></text>
<rect x="250.0" y="326.0" width="320.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="357.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">ніхто — лише біт заліза</tspan></text>
<rect x="570.0" y="326.0" width="340.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="357.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">сам кеш — кожне влучання</tspan></text>
