<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="528" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама задача через шістдесят років: що змінилося насправді</text>
<rect x="30.0" y="62.0" width="220.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="90.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0"></tspan></text>
<rect x="250.0" y="62.0" width="320.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="90.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">сторінкування, 1960-ті</tspan></text>
<rect x="570.0" y="62.0" width="340.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="90.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">кеш у пам'яті, сьогодні</tspan></text>
<rect x="30.0" y="110.0" width="220.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">що витісняємо</tspan></text>
<rect x="250.0" y="110.0" width="320.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">сторінка — усі однакові,</tspan><tspan x="410.0" dy="16.9">512 слів</tspan></text>
<rect x="570.0" y="110.0" width="340.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">запис — від сотні байтів</tspan><tspan x="740.0" dy="16.9">до мегабайтів</tspan></text>
<rect x="30.0" y="164.0" width="220.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="195.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">скільки їх у пам'яті</tspan></text>
<rect x="250.0" y="164.0" width="320.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="195.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">32 кадри в осерді</tspan></text>
<rect x="570.0" y="164.0" width="340.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="195.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">до 10⁸ ключів на вузол</tspan></text>
<rect x="30.0" y="218.0" width="220.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="249.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">влучання коштує</tspan></text>
<rect x="250.0" y="218.0" width="320.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="249.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">осердя: мікросекунди</tspan></text>
