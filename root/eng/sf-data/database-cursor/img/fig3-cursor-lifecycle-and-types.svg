<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="440.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Життєвий цикл курсора, команди керування та режими зберігання</text>
<rect x="16.5" y="86.0" width="167.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="100.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">DECLARE</tspan><tspan x="100.0" dy="13.0">Оголошення запиту</tspan><tspan x="100.0" dy="13.0">Створення структури плану</tspan></text>
<rect x="205.0" y="86.0" width="150.0" height="48.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="280.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">OPEN</tspan><tspan x="280.0" dy="13.0">Створення знімка</tspan><tspan x="280.0" dy="13.0">Ініціалізація Portal</tspan></text>
<rect x="395.0" y="86.0" width="150.0" height="48.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="470.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">FETCH / MOVE</tspan><tspan x="470.0" dy="13.0">Ітеративне читання</tspan><tspan x="470.0" dy="13.0">Зсув позиції рядка</tspan></text>
<rect x="605.0" y="86.0" width="150.0" height="48.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="680.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">CLOSE / COMMIT</tspan><tspan x="680.0" dy="13.0">Звільнення дескриптора</tspan><tspan x="680.0" dy="13.0">Очищення пам'яті</tspan></text>
<line x1="180.0" y1="110.0" x2="200.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="360.0" y1="110.0" x2="390.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550.0" y1="110.0" x2="595.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="190.0" width="375.0" height="235.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="217.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Режими переміщення (Scrollability)</text>
<rect x="44.5" y="239.5" width="345.0" height="61.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="217.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="217.0" dy="0.0">NO SCROLL (Тільки вперед):</tspan><tspan x="217.0" dy="13.0">• Дозволяє чистий потоковий конвеєр</tspan><tspan x="217.0" dy="13.0">• Нульові накладні витрати на тимчасовий диск</tspan><tspan x="217.0" dy="13.0">• Підтримує лише FETCH NEXT</tspan></text>
<rect x="44.5" y="334.5" width="345.0" height="61.0" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/><text x="217.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="217.0" dy="0.0">SCROLL (Двонапрямлений рух):</tspan><tspan x="217.0" dy="13.0">• Дозволяє FETCH PRIOR / FIRST / ABSOLUTE</tspan><tspan x="217.0" dy="13.0">• Примусово матеріалізує результат у Tuplestore</tspan><tspan x="217.0" dy="13.0">• Додаткове навантаження на I/O та пам'ять</tspan></text>
<rect x="435.0" y="190.0" width="375.0" height="235.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="622.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Межі транзакцій (Holdability)</text>
<rect x="449.5" y="239.5" width="345.0" height="61.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="622.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="622.0" dy="0.0">WITHOUT HOLD (За замовчуванням):</tspan><tspan x="622.0" dy="13.0">• Курсор прив'язаний до транзакції</tspan><tspan x="622.0" dy="13.0">• Автоматично закривається при COMMIT/ROLLBACK</tspan><tspan x="622.0" dy="13.0">• Блокування рядків утримуються протягом транзакції</tspan></text>
<rect x="449.5" y="334.5" width="345.0" height="61.0" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="622.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="622.0" dy="0.0">WITH HOLD (Збереження після фіксації):</tspan><tspan x="622.0" dy="13.0">• Залишається відкритим після COMMIT</tspan><tspan x="622.0" dy="13.0">• Сервер повністю матеріалізує залишок у файл</tspan><tspan x="622.0" dy="13.0">• Блокування таблиць знімаються, читання зі знімка</tspan></text>
</svg>