<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="460.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Модель ітераторів Volcano: Інтеграція курсора з деревом плану виконання</text>
<rect x="50.0" y="72.2" width="220.0" height="55.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="160.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Клієнтська програма</tspan><tspan x="160.0" dy="14.3">FETCH 1 FROM cur</tspan><tspan x="160.0" dy="14.3">(Очікує 1 кортеж)</tspan></text>
<line x1="275.0" y1="100.0" x2="360.0" y2="100.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="318.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-style="italic">SQL FETCH</text>
<rect x="370.0" y="72.2" width="300.0" height="55.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="520.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Серверний портал (Cursor Portal)</tspan><tspan x="520.0" dy="14.3">Тримає вказівник на корінь дерева плану</tspan><tspan x="520.0" dy="14.3">Викликає root_plan-&gt;next()</tspan></text>
<line x1="520.0" y1="135.0" x2="520.0" y2="175.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="560.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle" font-weight="700">next()</text>
<rect x="380.0" y="186.9" width="280.0" height="36.1" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="520.0" y="201.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Вузол Limit / Projection</tspan><tspan x="520.0" dy="13.7">Вибирає необхідні стовпці та передає вгору</tspan></text>
<line x1="520.0" y1="235.0" x2="520.0" y2="275.0" stroke="#0d9488" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="560.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0d9488" text-anchor="middle" font-weight="700">next()</text>
<rect x="367.4" y="286.9" width="305.3" height="36.1" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="520.0" y="301.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Вузол Filter (Selection: amount &gt; 1000)</tspan><tspan x="520.0" dy="13.7">Викликає дочірній вузол, доки умова не стане TRUE</tspan></text>
<line x1="520.0" y1="335.0" x2="520.0" y2="375.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="560.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e08a1e" text-anchor="middle" font-weight="700">next()</text>
<rect x="355.4" y="386.9" width="329.2" height="36.1" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="520.0" y="401.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Вузол IndexScan (B-Tree Scan)</tspan><tspan x="520.0" dy="13.7">Читає сторінки індексу та видобуває кортеж із таблиці</tspan></text>
<rect x="50.0" y="238.0" width="220.0" height="104.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="160.0" y="254.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Властивості конвеєра:</tspan><tspan x="160.0" dy="13.0">1. open(): ініціалізація стану</tspan><tspan x="160.0" dy="13.0">2. next(): повертає рівно 1 рядок</tspan><tspan x="160.0" dy="13.0">3. close(): звільнення ресурсів</tspan><tspan x="160.0" dy="13.0"></tspan><tspan x="160.0" dy="13.0">Немає матеріалізації,</tspan><tspan x="160.0" dy="13.0">дані течуть «знизу-вгору».</tspan></text>
</svg>