<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="440.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Порівняння архітектур вибірки: Клієнтське буферизування проти Серверного курсора</text>
<rect x="30.0" y="60.0" width="375.0" height="370.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="217.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Клієнтське буферизування (Всі рядки одразу)</text>
<rect x="49.5" y="105.1" width="335.0" height="49.8" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="217.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="217.0" dy="0.0">Сервер СУБД</tspan><tspan x="217.0" dy="13.7">Виконує повний запит (50 млн рядків)</tspan><tspan x="217.0" dy="13.7">Вивантажує всі дані у TCP-сокет</tspan></text>
<line x1="217.0" y1="165.0" x2="217.0" y2="205.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="275.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-style="italic">TCP Stream (60 ГБ)</text>
<rect x="49.5" y="215.1" width="335.0" height="49.8" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="217.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="217.0" dy="0.0">Мережевий буфер і Драйвер</tspan><tspan x="217.0" dy="13.7">Клієнт накопичує всі 60 ГБ у RAM</tspan><tspan x="217.0" dy="13.7">Величезна затримка до 1-го рядка</tspan></text>
<line x1="217.0" y1="275.0" x2="217.0" y2="315.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="49.5" y="340.1" width="335.0" height="49.8" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="217.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="217.0" dy="0.0">Аварія пам'яті (OOM Crash)</tspan><tspan x="217.0" dy="13.7">RAM клієнта вичерпано (виділено 4 ГБ &lt; 60 ГБ)</tspan><tspan x="217.0" dy="13.7">Процес аварійно зупинено</tspan></text>
<rect x="435.0" y="60.0" width="375.0" height="370.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.2"/>
<text x="622.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Серверний потоковий курсор (Ітеративна вибірка)</text>
<rect x="454.5" y="105.1" width="335.0" height="49.8" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="622.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="622.0" dy="0.0">Сервер СУБД (Ітератор плану)</tspan><tspan x="622.0" dy="13.7">Зберігає активний стан виконання (Portal)</tspan><tspan x="622.0" dy="13.7">Генерує кортежі за запитом</tspan></text>
<line x1="622.0" y1="165.0" x2="622.0" y2="205.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-style="italic">FETCH 1000 (1.5 МБ)</text>
<rect x="454.5" y="215.1" width="335.0" height="49.8" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="622.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="622.0" dy="0.0">Клієнтський ітератор</tspan><tspan x="622.0" dy="13.7">Отримує пакет із 1000 рядків</tspan><tspan x="622.0" dy="13.7">Обробляє рядки у конвеєрі</tspan></text>
<line x1="622.0" y1="275.0" x2="622.0" y2="315.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="454.5" y="340.1" width="335.0" height="49.8" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="622.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="622.0" dy="0.0">Стабільне виконання O(1) RAM</tspan><tspan x="622.0" dy="13.7">Пам'ять клієнта обмежена розміром пакета</tspan><tspan x="622.0" dy="13.7">Мінімальний час до початку обробки</tspan></text>
</svg>