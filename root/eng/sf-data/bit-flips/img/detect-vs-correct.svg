<text x="450.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Уся хитрість — не в новому атомі, а в кількості перевірок: їхній спільний «відбиток» (синдром) і є номером хибного біта.</text>
<text x="450.0" y="468.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме так машина дізнається не лише ЩО помилка є, а й ДЕ вона, — а отже, може виправити її сама.</text>
