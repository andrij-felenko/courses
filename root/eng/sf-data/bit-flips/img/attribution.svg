<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Не «один геній», а три внески поряд — і питання, хто був перший</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">теорема Шеннона казала, що так МОЖНА; Геммінг і Голей показали, ЯК саме — майже водночас і незалежно</text>
<rect x="23.0" y="84.0" width="270.0" height="300.0" rx="12" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<circle cx="158.0" cy="124.0" r="12.0" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<path d="M140.0,154 Q158.0,134 176.0,154" fill="none" stroke="#1f47b5" stroke-width="2.4"/>
<text x="158.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Клод Шеннон</text>
<text x="158.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Claude Shannon</text>
<rect x="92.0" y="226.0" width="132.0" height="26.0" rx="13" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="158.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">ТЕОРІЯ</text>
<text x="39.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1948: довів, що надійна передача</text>
<text x="39.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">крізь шум МОЖЛИВА — але доведення</text>
<text x="39.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">неконструктивне: воно не дає</text>
<text x="39.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">самого коду. І саме він у тій</text>
<text x="39.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">статті описав код [7,4] та</text>
<text x="39.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">приписав його Геммінгу</text>
<rect x="315.0" y="84.0" width="270.0" height="300.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.2"/>
<circle cx="450.0" cy="124.0" r="12.0" fill="#ffffff" stroke="#c0271e" stroke-width="2.4"/>
<path d="M432.0,154 Q450.0,134 468.0,154" fill="none" stroke="#c0271e" stroke-width="2.4"/>
<text x="450.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Річард Геммінг</text>
<text x="450.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Richard Hamming</text>
<rect x="384.0" y="226.0" width="132.0" height="26.0" rx="13" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="450.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">КОНСТРУКЦІЯ</text>
<text x="331.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1947 — внутрішня записка, 1950 —</text>
<text x="331.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">велика стаття (друк відклали з</text>
<text x="331.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ПАТЕНТНИХ причин). Дав готовий</text>
<text x="331.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">код, що ВИПРАВЛЯЄ біт, відстань і</text>
<text x="331.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">метрику Геммінга</text>
<rect x="607.0" y="84.0" width="270.0" height="300.0" rx="12" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<circle cx="742.0" cy="124.0" r="12.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<path d="M724.0,154 Q742.0,134 760.0,154" fill="none" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="742.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Марсель Голей</text>
<text x="742.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Marcel J. E. Golay</text>
<rect x="676.0" y="226.0" width="132.0" height="26.0" rx="13" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="742.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">ПАРАЛЕЛЬНО</text>
<text x="623.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1949, «Notes on digital coding» у</text>
<text x="623.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Proc. IRE — на рік РАНІШЕ за</text>
<text x="623.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">статтю Геммінга. Узагальнив ідею</text>
<text x="623.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(коди Голея) — інша рука прийшла</text>
<text x="623.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">до того ж незалежно</text>
<text x="450.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Код носить ім'я Геммінга по праву — та поряд стоять і теорема Шеннона, що відкрила дорогу, і Голей, який надрукував спорідненy ідею раніше.</text>
<text x="450.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Звична картина в техніці: за одним іменем на коді — кілька різних людей і різних внесків, що зійшлися в той самий короткий проміжок часу.</text>
</svg>
