<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
<rect width="880" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки беруться перевернуті біти: чотири класи причин</text>
<text x="440.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у каналі (передача) і в комірці (зберігання) — фізика щоразу інша, наслідок один: 0↔1</text>
<circle cx="440.0" cy="300.0" r="56.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="440.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">0 → 1</text>
<text x="440.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1 → 0</text>
<text x="440.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перевернутий біт</text>
<rect x="25.0" y="102.0" width="250.0" height="96.0" rx="9" fill="#fff" stroke="#1f47b5" stroke-width="2.2"/>
<text x="150.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Тепловий шум</text>
<text x="37.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">теплове коливання носіїв; на межі рівнів (§3.1.3) «0» можна</text>
<text x="37.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">прочитати як «1». Зростає з температурою.</text>
<line x1="150.0" y1="150.0" x2="440.0" y2="300.0" stroke="#1f47b5" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aBlue)"/>
<rect x="465.0" y="102.0" width="250.0" height="96.0" rx="9" fill="#fff" stroke="#caa24a" stroke-width="2.2"/>
<text x="590.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Завади в каналі</text>
<text x="477.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">наведення, відбиття, перехресні</text>
<text x="477.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перешкоди на довгому дроті чи в радіо; кадр приходить спотвореним.</text>
<line x1="590.0" y1="150.0" x2="440.0" y2="300.0" stroke="#caa24a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aAmber)"/>
<rect x="25.0" y="382.0" width="250.0" height="96.0" rx="9" fill="#fff" stroke="#7a3da8" stroke-width="2.2"/>
<text x="150.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#7a3da8" text-anchor="middle" font-weight="bold" font-style="normal">Іонізуюча частинка</text>
<text x="37.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">космічний протон/нейтрон чи альфа</text>
<text x="37.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вибиває заряд із комірки — SEU (§3.9.1m). Рідко, але невідворотно.</text>
<line x1="150.0" y1="430.0" x2="440.0" y2="300.0" stroke="#7a3da8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aInk)"/>
<rect x="465.0" y="382.0" width="250.0" height="96.0" rx="9" fill="#fff" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="590.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Знос комірки</text>
<text x="477.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Flash/EEPROM мають скінченний ресурс</text>
<text x="477.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перезапису; заряд «тече» з часом — retention. Биті ламаються.</text>
<line x1="590.0" y1="430.0" x2="440.0" y2="300.0" stroke="#1f8a3b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aGreen)"/>
<line x1="265.0" y1="175.0" x2="396.0" y2="270.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/>
<line x1="615.0" y1="175.0" x2="484.0" y2="270.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/>
<line x1="265.0" y1="410.0" x2="396.0" y2="330.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/>
<line x1="615.0" y1="410.0" x2="484.0" y2="330.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/>
<text x="440.0" y="540.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Висновок: помилки неминучі — питання лише в їхній частоті. Тому потрібен не «ідеальний канал», а КОД, що їх ловить.</text>
</svg>
