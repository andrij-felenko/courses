<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як збій викрив сам себе: число, якого не може бути</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">машина не «впала» й не видала помилки — вона тихо віддала більше голосів, ніж узагалі існувало; зрадила збій АРИФМЕТИКА</text>
<rect x="70.0" y="92.0" width="360.0" height="252.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
<text x="250.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Що нарахувала машина (Схарбек)</text>
<text x="92.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Голоси за список (партію) загалом:</text>
<text x="408.0" y="152.0" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">≈ 4 000</text>
<text x="92.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">з них — за одну кандидатку:</text>
<text x="408.0" y="182.0" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">4 610</text>
<line x1="92.0" y1="200.0" x2="408.0" y2="200.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="250.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРСОНАЛЬНИХ голосів за одну особу —</text>
<text x="250.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">БІЛЬШЕ, ніж голосів за весь її список</text>
<text x="250.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">частина &gt; цілого</text>
<text x="250.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">це АРИФМЕТИЧНО неможливо</text>
<text x="250.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">→ отже, у даних помилка</text>
<line x1="436.0" y1="218.0" x2="502.0" y2="218.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="469.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">сигнал</text>
<text x="469.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">тривоги</text>
<rect x="472.0" y="92.0" width="358.0" height="252.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="651.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Що врятувало результат</text>
<circle cx="500.0" cy="142.0" r="11.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="500.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="520.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Закладена перевірка здорового глузду:</text>
<text x="520.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">«сума частин не може перевищувати ціле»</text>
<circle cx="500.0" cy="198.0" r="11.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="500.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="520.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Голоси збереглися й на МАГНІТНИХ КАРТКАХ</text>
<text x="520.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(паперово-магнітний слід кожного бюлетеня)</text>
<circle cx="500.0" cy="254.0" r="11.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="500.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="520.0" y="251.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Ручний перерахунок за картками:</text>
<text x="520.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">у всіх інших — без змін, у неї −4 096</text>
<text x="651.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">правильний підсумок відновлено</text>
<rect x="70.0" y="360.0" width="760.0" height="92.0" rx="10" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головний урок наперед: помилку зловила не «магія», а проста ПЕРЕВІРКА на несуперечність + збережена копія даних.</text>
<text x="450.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Якби результат лише «виглядав правдоподібно» (скажімо, +40, а не +4096), його могли б і не помітити.</text>
<text x="450.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме тому Розділ 3.9 не лише виявляє помилки парністю чи CRC, а вчить ще й закладати такі перевірки в систему.</text>
</svg>
