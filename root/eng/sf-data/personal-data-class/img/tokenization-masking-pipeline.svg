<text x="405.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Ротація перцю і солі (Pepper/Salt) кожні 90 днів для детермінованих токенів</text>
<text x="405.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Знищення ключів користувача (Crypto-Shredding) за запитом на видалення (GDPR Art. 17)</text>
<text x="405.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• RBAC/ABAC політики для розкриття демаскованих значень через Audit Trail</text>
