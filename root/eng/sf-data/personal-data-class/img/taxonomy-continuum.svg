<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 371.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="371.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="45.0" width="180.0" height="270.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="110.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Прямі ідентифікатори (PII)</text>
<line x1="28.0" y1="79.0" x2="192.0" y2="79.0" stroke="#c0392b" stroke-width="0.8"/>
<text x="32.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Номер паспорта / РНОКПП</text>
<text x="32.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Адреса ел. пошти</text>
<text x="32.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Номер банківської картки</text>
<text x="32.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• ПІБ, біометричний зліпок</text>
<text x="32.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Ризик: однозначна ідентифікація</text>
<text x="32.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Метод: токенізація, хешування</text>
<rect x="220.0" y="45.0" width="180.0" height="270.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/>
<text x="310.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a6700" text-anchor="middle" font-weight="700">Квазі-ідентифікатори (QI)</text>
<line x1="228.0" y1="79.0" x2="392.0" y2="79.0" stroke="#caa24a" stroke-width="0.8"/>
<text x="232.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Поштовий індекс (ZIP)</text>
<text x="232.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Дата народження, вік</text>
<text x="232.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Стать, посада, місто</text>
<text x="232.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Часова мітка транзакції</text>
<text x="232.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a6700" text-anchor="start" font-weight="700">Ризик: атака зведенням (Linkage)</text>
<text x="232.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a6700" text-anchor="start" font-weight="700">Метод: k-анонімність, узагальнення</text>
<rect x="420.0" y="45.0" width="180.0" height="270.0" rx="6" fill="#f5eefb" stroke="#7d3c98" stroke-width="1.5"/>
<text x="510.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#5b2c6f" text-anchor="middle" font-weight="700">Чутливі атрибути (Sensitive)</text>
<line x1="428.0" y1="79.0" x2="592.0" y2="79.0" stroke="#7d3c98" stroke-width="0.8"/>
<text x="432.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Медичний діагноз / рецепт</text>
<text x="432.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Рівень доходу / баланс</text>
<text x="432.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Політичні / релігійні погляди</text>
<text x="432.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Генетичні / судові дані</text>
<text x="432.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#5b2c6f" text-anchor="start" font-weight="700">Ризик: дискримінація, шкода</text>
<text x="432.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#5b2c6f" text-anchor="start" font-weight="700">Метод: l-різноманітність, шифрування</text>
<rect x="620.0" y="45.0" width="180.0" height="270.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="710.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Неідентифіковні дані</text>
<line x1="628.0" y1="79.0" x2="792.0" y2="79.0" stroke="#27ae60" stroke-width="0.8"/>
<text x="632.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Агреговані лічильники</text>
<text x="632.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Узагальнені діапазони</text>
<text x="632.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Системні логи без ID</text>
<text x="632.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Статистичні зведення</text>
<text x="632.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Ризик: мінімальний (без фону)</text>
<text x="632.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Метод: диференційна приватність</text>
<line x1="780.0" y1="335.0" x2="40.0" y2="335.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Зростання однозначності прямої ідентифікації особи</text>
</svg>