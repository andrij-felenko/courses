<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="780.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="410.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Порівняння архітектур захоплення змін (CDC Approaches)</text>
<rect x="30.0" y="70.0" width="245.0" height="250.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="30.0" y="70.0" width="245.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="152.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">1. Опитування (Polling)</text>
<rect x="40.0" y="110.0" width="225.0" height="195.0" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/><text x="152.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="152.5" dy="0.0">Механізм:</tspan><tspan x="152.5" dy="14.3">SELECT WHERE updated_at &gt; :ts</tspan><tspan x="152.5" dy="14.3"></tspan><tspan x="152.5" dy="14.3">Недоліки:</tspan><tspan x="152.5" dy="14.3">• Пропуск проміжних станів</tspan><tspan x="152.5" dy="14.3">• Не бачить Hard DELETE</tspan><tspan x="152.5" dy="14.3">• Навантаження на CPU/диск</tspan><tspan x="152.5" dy="14.3">• Аномалії довгих транзакцій</tspan><tspan x="152.5" dy="14.3"></tspan><tspan x="152.5" dy="14.3">Затримка: висока (секунди/хв)</tspan></text>
<rect x="288.0" y="70.0" width="245.0" height="250.0" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
<rect x="288.0" y="70.0" width="245.0" height="32.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="410.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">2. Тригери (DB Triggers)</text>
<rect x="298.0" y="110.0" width="225.0" height="195.0" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/><text x="410.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.5" dy="0.0">Механізм:</tspan><tspan x="410.5" dy="13.0">AFTER INSERT/UPDATE/DELETE</tspan><tspan x="410.5" dy="13.0">запис у тіньову таблицю аудиту</tspan><tspan x="410.5" dy="13.0"></tspan><tspan x="410.5" dy="13.0">Недоліки:</tspan><tspan x="410.5" dy="13.0">• Подвоєння записів (2x IOPS)</tspan><tspan x="410.5" dy="13.0">• Зростання латентності транзакцій</tspan><tspan x="410.5" dy="13.0">• Блокування рядків у таблиці</tspan><tspan x="410.5" dy="13.0">• Крихкість при міграціях DDL</tspan><tspan x="410.5" dy="13.0"></tspan><tspan x="410.5" dy="13.0">Затримка: середня</tspan></text>
<rect x="545.0" y="70.0" width="245.0" height="250.0" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2.0"/>
<rect x="545.0" y="70.0" width="245.0" height="32.0" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2.0"/>
<text x="667.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">3. Вичитування WAL / Binlog</text>
<rect x="555.0" y="110.0" width="225.0" height="195.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="667.5" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#064e3b" text-anchor="middle"><tspan x="667.5" dy="0.0">Механізм:</tspan><tspan x="667.5" dy="14.3">Асинхронне вичитування журналу</tspan><tspan x="667.5" dy="14.3">(PostgreSQL WAL / MySQL Binlog)</tspan><tspan x="667.5" dy="14.3"></tspan><tspan x="667.5" dy="14.3">Переваги:</tspan><tspan x="667.5" dy="14.3">• 0% впливу на час COMMIT</tspan><tspan x="667.5" dy="14.3">• 100% захоплення (DELETE, DDL)</tspan><tspan x="667.5" dy="14.3">• Суворий порядок за LSN/GTID</tspan><tspan x="667.5" dy="14.3">• Доступні всі проміжні стани</tspan><tspan x="667.5" dy="14.3"></tspan><tspan x="667.5" dy="14.3">Затримка: мінімальна (&lt;50 мс)</tspan></text>
</svg>