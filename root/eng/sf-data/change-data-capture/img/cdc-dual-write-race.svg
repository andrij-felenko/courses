<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="780.0" height="45.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="410.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Аномалії підходу «Подвійний запис» (Dual-Write Anti-Pattern)</text>
<rect x="30.0" y="75.0" width="365.0" height="265.0" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>
<rect x="30.0" y="75.0" width="365.0" height="34.0" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
<text x="212.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">1. Аварійне вікно (Втрата події)</text>
<rect x="45.0" y="120.0" width="335.0" height="42.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="212.5" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Застосунок: виконує COMMIT у БД</tspan><tspan x="212.5" dy="14.3">(Замовлення #101 збережено у PostgreSQL)</tspan></text>
<line x1="212.0" y1="163.0" x2="212.0" y2="182.0" stroke="#ef4444" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="45.0" y="183.0" width="335.0" height="45.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="212.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">⚡ КРАХ СЕРВЕРА АБО МЕРЕЖІ</text>
<text x="212.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">(виклик kafka.send() не відбувся)</text>
<line x1="212.0" y1="229.0" x2="212.0" y2="248.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="249.0" width="335.0" height="75.0" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="212.5" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#881337" text-anchor="middle" font-weight="700"><tspan x="212.5" dy="0.0">Наслідок: База даних має запис,</tspan><tspan x="212.5" dy="14.3">але Kafka, Redis та Elasticsearch</tspan><tspan x="212.5" dy="14.3">ніколи не отримають подію.</tspan><tspan x="212.5" dy="14.3">Дані безповоротно розійшлися.</tspan></text>
<rect x="425.0" y="75.0" width="365.0" height="265.0" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
<rect x="425.0" y="75.0" width="365.0" height="34.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text x="607.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">2. Перегони паралельних оновлень</text>
<rect x="440.0" y="120.0" width="335.0" height="42.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="607.5" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Потік А: UPDATE status = 'PAID' (12:00:01)</tspan><tspan x="607.5" dy="14.3">Потік Б: UPDATE status = 'CANCELLED' (12:00:02)</tspan></text>
<line x1="607.0" y1="163.0" x2="607.0" y2="182.0" stroke="#f59e0b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="183.0" width="335.0" height="45.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="607.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Мережева затримка: Подія Б випередила А</text>
<text x="607.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">(У Kafka: спершу CANCELLED, потім PAID)</text>
<line x1="607.0" y1="229.0" x2="607.0" y2="248.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="440.0" y="249.0" width="335.0" height="75.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="607.5" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700"><tspan x="607.5" dy="0.0">Наслідок у споживача:</tspan><tspan x="607.5" dy="14.3">БД має фінальний стан CANCELLED,</tspan><tspan x="607.5" dy="14.3">але кеш/пошук отримав останнім PAID.</tspan><tspan x="607.5" dy="14.3">Повна втрата консистентності!</tspan></text>
</svg>