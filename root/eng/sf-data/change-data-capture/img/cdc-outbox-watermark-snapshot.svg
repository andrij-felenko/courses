<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="780.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="410.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Патерн Transactional Outbox та інкрементні знімки (Watermarking)</text>
<rect x="30.0" y="75.0" width="365.0" height="255.0" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/>
<rect x="30.0" y="75.0" width="365.0" height="32.0" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
<text x="212.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#5b21b6" text-anchor="middle" font-weight="700">А. Патерн Transactional Outbox</text>
<rect x="45.0" y="118.0" width="335.0" height="75.0" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/><text x="212.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Єдина локальна ACID транзакція:</tspan><tspan x="212.5" dy="13.0">1. INSERT INTO orders (id, customer, total)</tspan><tspan x="212.5" dy="13.0">2. INSERT INTO outbox (aggregate_id, event_payload)</tspan><tspan x="212.5" dy="13.0"></tspan><tspan x="212.5" dy="13.0">COMMIT відбувається атомарно.</tspan></text>
<line x1="212.0" y1="194.0" x2="212.0" y2="215.0" stroke="#8b5cf6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="45.0" y="216.0" width="335.0" height="95.0" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/><text x="212.5" y="245.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700"><tspan x="212.5" dy="0.0">CDC вичитує лише таблицю outbox з WAL,</tspan><tspan x="212.5" dy="14.3">видобуває доменну подію (Domain Event)</tspan><tspan x="212.5" dy="14.3">і спрямовує в Kafka з ключем aggregate_id.</tspan><tspan x="212.5" dy="14.3">Жодного подвійного запису в коді!</tspan></text>
<rect x="425.0" y="75.0" width="365.0" height="255.0" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
<rect x="425.0" y="75.0" width="365.0" height="32.0" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
<text x="607.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">Б. Інкрементний знімок без блокувань (DBLog)</text>
<rect x="440.0" y="118.0" width="335.0" height="80.0" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/><text x="607.5" y="141.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">1. Сигнал Low Watermark у таблицю сигналів</tspan><tspan x="607.5" dy="13.7">2. SELECT * FROM table WHERE id BETWEEN p0 AND p1</tspan><tspan x="607.5" dy="13.7">3. Сигнал High Watermark у таблицю сигналів</tspan><tspan x="607.5" dy="13.7">(Ніяких LOCK TABLE! Застосунок вільно пише)</tspan></text>
<line x1="607.0" y1="199.0" x2="607.0" y2="220.0" stroke="#0284c7" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="221.0" width="335.0" height="90.0" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/><text x="607.5" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0c4a6e" text-anchor="middle" font-weight="700"><tspan x="607.5" dy="0.0">Узгодження в потоці CDC:</tspan><tspan x="607.5" dy="13.0">Події WAL між Low та High водяними знаками</tspan><tspan x="607.5" dy="13.0">мають пріоритет над даними з SELECT.</tspan><tspan x="607.5" dy="13.0">Знімок мільйонів рядків створюється без простою!</tspan></text>
</svg>