<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 869.5 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="869.5" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="410.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр витіснення й міграції блоків даних між ярусами</text>
<rect x="33.0" y="70.0" width="153.9" height="69.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="110.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">1. Запис у Hot (NVMe)</tspan><tspan x="110.0" dy="14.3">Новий чанк у пам'яті;</tspan><tspan x="110.0" dy="14.3">активне читання/запис;</tspan><tspan x="110.0" dy="14.3">S(t) = 1.0 (гарячий)</tspan></text>
<line x1="185.0" y1="105.0" x2="235.0" y2="105.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="239.9" y="70.0" width="160.2" height="69.9" rx="6" fill="#fff6e0" stroke="#d4a72c" stroke-width="1.3"/><text x="320.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">2. Охолодження й тригер</tspan><tspan x="320.0" dy="14.3">Згасання звернень S(t);</tspan><tspan x="320.0" dy="14.3">High Watermark &gt; 85%;</tspan><tspan x="320.0" dy="14.3">Вибір кандидата LRU</tspan></text>
<line x1="405.0" y1="105.0" x2="455.0" y2="105.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="444.2" y="70.0" width="191.6" height="69.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="540.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">3. Пакування й компресія</tspan><tspan x="540.0" dy="14.3">Консолідація дрібних рядків;</tspan><tspan x="540.0" dy="14.3">Колонковий Parquet / zstd;</tspan><tspan x="540.0" dy="14.3">Обчислення хешу BLAKE3</tspan></text>
<line x1="625.0" y1="105.0" x2="675.0" y2="105.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="649.2" y="74.5" width="171.6" height="61.0" rx="6" fill="#f0f4f8" stroke="#57606a" stroke-width="1.3"/><text x="735.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">4. Запис у Warm/Cold</tspan><tspan x="735.0" dy="13.0">Асинхронний PUT у S3;</tspan><tspan x="735.0" dy="13.0">Очікування 200 OK;</tspan><tspan x="735.0" dy="13.0">Верифікація контрольної суми</tspan></text>
<line x1="735.0" y1="160.0" x2="735.0" y2="220.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="620.5" y="244.5" width="229.0" height="61.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="735.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">5. Атомарний CAS метаданих</tspan><tspan x="735.0" dy="13.0">Підміна адреси блоку в каталозі;</tspan><tspan x="735.0" dy="13.0">Статус: MIGRATED;</tspan><tspan x="735.0" dy="13.0">Паралельні читачі бачать новий ярус</tspan></text>
<line x1="650.0" y1="275.0" x2="595.0" y2="275.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="355.4" y="240.1" width="229.2" height="69.9" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="470.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">6. Звільнення Hot блоку</tspan><tspan x="470.0" dy="14.3">Виклик blkdiscard / unmap на NVMe;</tspan><tspan x="470.0" dy="14.3">Зниження зайнятості нижче</tspan><tspan x="470.0" dy="14.3">Low Watermark (&lt; 70%)</tspan></text>
<line x1="345.0" y1="275.0" x2="290.0" y2="275.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="69.9" y="240.1" width="200.1" height="69.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="170.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">7. Сплив TTL / WORM Lock</tspan><tspan x="170.0" dy="14.3">Перевірка Legal Hold;</tspan><tspan x="170.0" dy="14.3">Остаточне видалення об'єкта</tspan><tspan x="170.0" dy="14.3">або крипто-шредінг ключа</tspan></text>
<rect x="30.0" y="350.0" width="780.0" height="55.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="420.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Гарантія безперервності читання: під час кроків 2–4 запити спрямовуються на Hot-ярус;</text>
<text x="420.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">після фіксації кроку 5 запити прозоро перенаправляються на Warm/Cold ярус через шлюз читання.</text>
</svg>