<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">три способи, якими прошивка робить дані невідновними</text>
<text x="250.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">крипто-стирання</text>
<rect x="60.0" y="116.0" width="380.0" height="62.0" rx="6" fill="#dfe8fc" stroke="#2457d6" stroke-width="2.0"/><text x="250.0" y="142.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">знищити ключ,</tspan><tspan x="250.0" dy="17.6">яким шифрується вся медіа</tspan></text>
<line x1="250.0" y1="182.0" x2="250.0" y2="218.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="222.0" width="380.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">біти на чипах лишаються</tspan><tspan x="250.0" dy="17.6">всі до одного —</tspan><tspan x="250.0" dy="17.6">але стають шумом</tspan></text>
<rect x="170.0" y="330.0" width="160.0" height="46.0" rx="6" fill="#dfe8fc" stroke="#2457d6" stroke-width="1.8"/><text x="250.0" y="358.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">секунди</tspan></text>
<rect x="60.0" y="400.0" width="380.0" height="84.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="250.0" y="429.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">уся ціна довіри —</tspan><tspan x="250.0" dy="16.9">у прошивці: чи ключ був один</tspan><tspan x="250.0" dy="16.9">і чи він справді зник</tspan></text>
<line x1="250.0" y1="490.0" x2="250.0" y2="542.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="670.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">блокове стирання</text>
<rect x="480.0" y="116.0" width="380.0" height="62.0" rx="6" fill="#dff0e6" stroke="#27ae60" stroke-width="2.0"/><text x="670.0" y="142.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">подати NAND-стирання</tspan><tspan x="670.0" dy="17.6">на кожен фізичний блок</tspan></text>
<line x1="670.0" y1="182.0" x2="670.0" y2="218.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="222.0" width="380.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">дістає і запас,</tspan><tspan x="670.0" dy="17.6">і недійсні сторінки —</tspan><tspan x="670.0" dy="17.6">прошивка знає їх усі</tspan></text>
<rect x="590.0" y="330.0" width="160.0" height="46.0" rx="6" fill="#dff0e6" stroke="#27ae60" stroke-width="1.8"/><text x="670.0" y="358.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">хвилини</tspan></text>
<rect x="480.0" y="400.0" width="380.0" height="84.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="670.0" y="429.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">виведені блоки —</tspan><tspan x="670.0" dy="16.9">на совісті прошивки:</tspan><tspan x="670.0" dy="16.9">ззовні не перевірити</tspan></text>
<line x1="670.0" y1="490.0" x2="670.0" y2="542.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1090.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">перезапис</text>
<rect x="900.0" y="116.0" width="380.0" height="62.0" rx="6" fill="#fbe6e3" stroke="#c0392b" stroke-width="2.0"/><text x="1090.0" y="142.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1090.0" dy="0.0">прошивка сама пише візерунок</tspan><tspan x="1090.0" dy="17.6">крізь усю медіа</tspan></text>
<line x1="1090.0" y1="182.0" x2="1090.0" y2="218.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="900.0" y="222.0" width="380.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="1090.0" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">єдиний спосіб,</tspan><tspan x="1090.0" dy="17.6">що має сенс</tspan><tspan x="1090.0" dy="17.6">на магнітному диску</tspan></text>
<rect x="1010.0" y="330.0" width="160.0" height="46.0" rx="6" fill="#fbe6e3" stroke="#c0392b" stroke-width="1.8"/><text x="1090.0" y="358.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1090.0" dy="0.0">години</tspan></text>
<rect x="900.0" y="400.0" width="380.0" height="84.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="1090.0" y="429.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">на флеші зношує ресурс,</tspan><tspan x="1090.0" dy="16.9">а до виведених блоків</tspan><tspan x="1090.0" dy="16.9">не дістає взагалі</tspan></text>
<line x1="1090.0" y1="490.0" x2="1090.0" y2="542.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="546.0" width="1220.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="670.0" y="570.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">жоден із трьох не є операцією над діапазоном блоків:</tspan><tspan x="670.0" dy="19.5">усі три — дії над носієм цілком</tspan></text>
</svg>