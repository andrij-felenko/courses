<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Stale-While-Revalidate усуває затримки оновлення та забезпечує деградацію</text>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова шкала Stale-While-Revalidate та дворівневого часу життя (Dual TTL)</text>
<rect x="40.0" y="75.0" width="300.0" height="160.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Фаза 1: Свіжі дані (Fresh)</tspan><tspan x="190.0" dy="15.6">[ t = 0 ... Soft TTL = 300 c ]</tspan><tspan x="190.0" dy="15.6"></tspan><tspan x="190.0" dy="15.6">• Читання з кешу: 0.5 мс</tspan><tspan x="190.0" dy="15.6">• Статус: FRESH_HIT</tspan><tspan x="190.0" dy="15.6">• Жодних фонових дій</tspan><tspan x="190.0" dy="15.6">• Клієнт отримує актуальні дані</tspan></text>
<rect x="360.0" y="75.0" width="300.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Фаза 2: Оновлення (SWR)</tspan><tspan x="510.0" dy="15.6">[ Soft TTL 300 c ... Hard TTL 3600 c ]</tspan><tspan x="510.0" dy="15.6"></tspan><tspan x="510.0" dy="15.6">• Читання з кешу: 0.5 мс (STALE_HIT)</tspan><tspan x="510.0" dy="15.6">• Клієнт НЕ чекає на базу даних!</tspan><tspan x="510.0" dy="15.6">• Фоновий потік оновлює кеш з БД</tspan><tspan x="510.0" dy="15.6">• Single-Flight захищає оновлення</tspan></text>
<rect x="680.0" y="75.0" width="300.0" height="160.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="830.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Фаза 3: Видалення (Hard Expired)</tspan><tspan x="830.0" dy="15.6">[ t &gt; Hard TTL = 3600 c ]</tspan><tspan x="830.0" dy="15.6"></tspan><tspan x="830.0" dy="15.6">• Ключ виселяється з кешу</tspan><tspan x="830.0" dy="15.6">• Статус: HARD_MISS</tspan><tspan x="830.0" dy="15.6">• Синхронне звернення до БД</tspan><tspan x="830.0" dy="15.6">• Або Stale Fallback при збої</tspan></text>
<rect x="40.0" y="260.0" width="940.0" height="195.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="337.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Поведінка під час деградації або відмови первинної бази даних (Stale-As-Fallback)</tspan><tspan x="510.0" dy="11.7"></tspan><tspan x="510.0" dy="11.7">• Звичайна система без SWR: База падає -&gt; Запити отримують таймаут 2.0 с -&gt; Пул з'єднань забивається -&gt; 500 Server Error для 100 % клієнтів.</tspan><tspan x="510.0" dy="11.7">• Система з Stale Fallback: База падає -&gt; Фоновий ревалідатор фіксує таймаут або 5xx -&gt; Кеш подовжує життя Stale-значення -&gt; Користувачі миттєво отримують дані з кешу (0.5 мс) із заголовком Warning: 110 Response is Stale.</tspan><tspan x="510.0" dy="11.7">• Результат: Повна стійкість (Graceful Degradation) користувацького інтерфейсу під час ремонтних робіт чи аварій СУБД.</tspan></text>
<text x="510.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">SWR поєднує миттєву швидкість RAM для клієнта із захистом бекенду від блокуючих очікувань.</text>
</svg>