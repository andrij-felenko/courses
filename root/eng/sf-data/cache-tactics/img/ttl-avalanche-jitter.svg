<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкид TTL запобігає лавинному перевантаженню бази даних</text>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синхронізоване застарівання TTL проти розкиду (TTL Jitter)</text>
<rect x="40.0" y="60.0" width="440.0" height="195.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="122.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">1. Без джиттеру: фіксований TTL = 3600 с</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6">• 100 000 ключів збережено о 00:00:00 (TTL = 1 год)</tspan><tspan x="260.0" dy="15.6">• Рівно о 01:00:00 всі 100 000 ключів зникають одночасно</tspan><tspan x="260.0" dy="15.6">• Частка влучань обвалюється з 99 % до 2 %</tspan><tspan x="260.0" dy="15.6">• Шторм промахів (Cache Avalanche) перевантажує БД</tspan></text>
<rect x="520.0" y="60.0" width="440.0" height="195.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="128.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Навантаження на первинну БД (Без джиттеру)</tspan><tspan x="740.0" dy="13.0"></tspan><tspan x="740.0" dy="13.0">RPS до БД:</tspan><tspan x="740.0" dy="13.0">  00:00 – 00:59  |== (200 RPS — фонові промахи)</tspan><tspan x="740.0" dy="13.0">  01:00:00       |============================== (65 000 RPS СПАЛАХ!)</tspan><tspan x="740.0" dy="13.0">  01:00:05       | Пул з'єднань СУБД вичерпано -&gt; Відмова сервісу</tspan></text>
<rect x="40.0" y="280.0" width="440.0" height="195.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="342.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">2. З розкидом: TTL = 3600 ± 600 с (Jitter ±15 %)</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6">• Кожен ключ отримує випадковий TTL від 3000 до 4200 с</tspan><tspan x="260.0" dy="15.6">• Вичерпання ключів розмазується у вікні 20 хвилин</tspan><tspan x="260.0" dy="15.6">• Частка влучань залишається стабільною (&gt; 96 %)</tspan><tspan x="260.0" dy="15.6">• Навантаження на БД зростає плавно й без піків</tspan></text>
<rect x="520.0" y="280.0" width="440.0" height="195.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="342.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Навантаження на первинну БД (З джиттером)</tspan><tspan x="740.0" dy="15.6"></tspan><tspan x="740.0" dy="15.6">RPS до БД:</tspan><tspan x="740.0" dy="15.6">  00:50 – 01:10  |====== (800–1200 RPS — плавне оновлення)</tspan><tspan x="740.0" dy="15.6">  01:00:00       |====== (1100 RPS — нормальна робота)</tspan><tspan x="740.0" dy="15.6">  Результат:     | Черги відсутні, база працює стабільно</tspan></text>
<text x="500.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Формула: TTL_actual = TTL_base · (1 + Uniform(-J, +J)), де J = 0.10..0.20</text>
</svg>