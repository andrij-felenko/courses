<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл зміни лідера: Switchover проти Failover</text><text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Контрольоване планове перемикання проти аварійного відновлення після краху</text><rect x="20.0" y="80.0" width="920.0" height="175.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="40.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="start" font-weight="700">Плановий Switchover (RPO = 0, планове обслуговування)</text><rect x="50.0" y="145.2" width="150.0" height="59.6" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="125.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">1. Сигнал Demote</tspan><tspan x="125.0" dy="14.3">Зупинка прийому</tspan><tspan x="125.0" dy="14.3">нових транзакцій</tspan></text><line x1="205.0" y1="175.0" x2="220.0" y2="175.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="225.0" y="145.2" width="150.0" height="59.6" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="300.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">2. Синхронізація</tspan><tspan x="300.0" dy="14.3">Очікування LSN:</tspan><tspan x="300.0" dy="14.3">Standby доганяє WAL</tspan></text><line x1="380.0" y1="175.0" x2="395.0" y2="175.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="400.0" y="145.2" width="150.0" height="59.6" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="475.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">3. Оновлення DCS</tspan><tspan x="475.0" dy="14.3">Зміна ключа лідера</tspan><tspan x="475.0" dy="14.3">в etcd на вузол 2</tspan></text><line x1="555.0" y1="175.0" x2="570.0" y2="175.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="575.0" y="145.2" width="150.0" height="59.6" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="650.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">4. Промоція</tspan><tspan x="650.0" dy="14.3">Standby стає Primary</tspan><tspan x="650.0" dy="14.3">(pg_ctl promote)</tspan></text><line x1="730.0" y1="175.0" x2="745.0" y2="175.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="750.0" y="145.2" width="150.0" height="59.6" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="825.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">5. Маршрутизація</tspan><tspan x="825.0" dy="14.3">HAProxy спрямовує</tspan><tspan x="825.0" dy="14.3">RW-трафік на вузол 2</tspan></text><text x="40.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="start" font-weight="700">Результат: Нульова втрата даних (RPO=0), пауза запису 300–800 мс, колишній лідер безпечно стає реплікою</text><rect x="20.0" y="280.0" width="920.0" height="185.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="40.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b91c1c" text-anchor="start" font-weight="700">Аварійний Failover (RPO &gt;= 0, раптовий крах лідера)</text><rect x="50.0" y="345.2" width="150.0" height="59.6" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="125.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">1. Крах Лідера</tspan><tspan x="125.0" dy="14.3">Вузол 1 гине або</tspan><tspan x="125.0" dy="14.3">ізолюється мережею</tspan></text><line x1="205.0" y1="375.0" x2="220.0" y2="375.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="225.0" y="345.2" width="150.0" height="59.6" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="300.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">2. Спливання лізи</tspan><tspan x="300.0" dy="14.3">DCS Lease TTL (10s)</tspan><tspan x="300.0" dy="14.3">вичерпується</tspan></text><line x1="380.0" y1="375.0" x2="395.0" y2="375.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="400.0" y="345.2" width="150.0" height="59.6" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="475.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">3. Вибори &amp; LSN</tspan><tspan x="475.0" dy="14.3">Репліки порівнюють</tspan><tspan x="475.0" dy="14.3">найновіший WAL LSN</tspan></text><line x1="555.0" y1="375.0" x2="570.0" y2="375.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="574.2" y="345.2" width="151.7" height="59.6" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="650.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">4. Огородження</tspan><tspan x="650.0" dy="14.3">STONITH / Watchdog</tspan><tspan x="650.0" dy="14.3">блокує старий вузол 1</tspan></text><line x1="730.0" y1="375.0" x2="745.0" y2="375.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="749.2" y="345.2" width="151.7" height="59.6" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="825.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">5. Промоція Репліки</tspan><tspan x="825.0" dy="14.3">Вузол 2 стає Primary,</tspan><tspan x="825.0" dy="14.3">HAProxy перемикає</tspan></text><text x="40.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="start" font-weight="700">Результат: Автоматичне відновлення доступності (RTO ~10–15 с), при асинхронній реплікації можливий RPO &gt; 0 (потрібен pg_rewind)</text>
</svg>