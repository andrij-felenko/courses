<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="320.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.0"/>
<rect x="30.0" y="25.0" width="820.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="50.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Рядок у JSON:</text>
<text x="155.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">&quot;\uD83D\uDE00&quot;</text>
<text x="300.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">→ символ емодзі 😀 (код U+1F600, поза межами 16-бітної BMP)</text>
<line x1="440.0" y1="68.0" x2="440.0" y2="92.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="95.0" width="380.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.3"/>
<text x="60.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Старший сурогат (High): \uD83D</text>
<text x="60.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Діапазон: 0xD800 .. 0xDBFF  (110110xx xxxxxxxx)</text>
<text x="60.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Зсув: 0xD83D − 0xD800 = 0x003D  (біти 10..19)</text>
<text x="60.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">10-бітне значення: 0000111101₂</text>
<rect x="460.0" y="95.0" width="380.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.3"/>
<text x="480.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Молодший сурогат (Low): \uDE00</text>
<text x="480.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Діапазон: 0xDC00 .. 0xDFFF  (110111xx xxxxxxxx)</text>
<text x="480.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Зсув: 0xDE00 − 0xDC00 = 0x0200  (біти 0..9)</text>
<text x="480.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">10-бітне значення: 1000000000₂</text>
<line x1="230.0" y1="186.0" x2="380.0" y2="218.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="650.0" y1="186.0" x2="500.0" y2="218.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="140.0" y="220.0" width="600.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/>
<text x="440.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формула відновлення кодової точки Unicode:</text>
<text x="440.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">CodePoint = 0x10000 + ((High − 0xD800) « 10) + (Low − 0xDC00) = 0x1F600</text>
<line x1="440.0" y1="273.0" x2="440.0" y2="290.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="180.0" y="292.0" width="520.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="440.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Фінальне кодування в UTF-8 (4 байти): 0xF0 0x9F 0x98 0x80</text>
</svg>