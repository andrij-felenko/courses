<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="340.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.0"/>
<rect x="25.0" y="25.0" width="400.0" height="310.0" rx="6" fill="#ffffff" stroke="#c8d1dc" stroke-width="1.2"/>
<text x="225.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атомарні типи (примітиви)</text>
<rect x="40.0" y="70.0" width="370.0" height="52.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="55.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">null</text>
<text x="125.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">null</text>
<text x="55.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Позначає відсутність значення (один літерал)</text>
<rect x="40.0" y="132.0" width="370.0" height="52.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="55.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">boolean</text>
<text x="125.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">true | false</text>
<text x="55.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Логічні значення у нижньому регістрі</text>
<rect x="40.0" y="194.0" width="370.0" height="52.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="55.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">number</text>
<text x="125.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">42, -3.14, 1.2e+5</text>
<text x="55.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Десяткові цілі та дійсні з експонентою</text>
<rect x="40.0" y="256.0" width="370.0" height="52.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="55.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">string</text>
<text x="125.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">&quot;рядок\n&quot;</text>
<text x="55.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Послідовність Unicode у подвійних лапках &quot;&quot;</text>
<rect x="445.0" y="25.0" width="410.0" height="310.0" rx="6" fill="#ffffff" stroke="#c8d1dc" stroke-width="1.2"/>
<text x="650.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контейнерні типи (рекурсивні)</text>
<rect x="460.0" y="70.0" width="380.0" height="115.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="475.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">object (словник / відображення)</text>
<text x="475.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">{ &quot;key1&quot;: value1, &quot;key2&quot;: value2 }</text>
<text x="475.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Ключі — завжди тільки рядки у подвійних лапках</text>
<text x="475.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Роздільник пари — двокрапка ':', між парами — кома ','</text>
<text x="475.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Порядок пар не є значущим за стандартом RFC 8259</text>
<rect x="460.0" y="195.0" width="380.0" height="95.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="475.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">array (впорядкований список)</text>
<text x="475.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">[ value1, value2, value3 ]</text>
<text x="475.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Елементи будь-яких типів (гетерогенні списки)</text>
<text x="475.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Порядок елементів суворо фіксований за індексом 0..N-1</text>
<text x="650.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Пробіли між токенами: SP (0x20), TAB (0x09), LF (0x0A), CR (0x0D)</text>
</svg>