<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="400.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Сигнальні значення (Sentinel) проти явного маркера NULL</text>
<rect x="30.0" y="60.0" width="370.0" height="330.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="215.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Підхід 1: Сигнальні значення (Sentinel)</text>
<rect x="50.0" y="102.2" width="330.0" height="55.6" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="215.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Поле Age: -1 або 999</tspan><tspan x="215.0" dy="14.3">Поле Salary: -9999.00</tspan><tspan x="215.0" dy="14.3">Поле Date: '9999-12-31'</tspan></text>
<rect x="50.0" y="196.3" width="330.0" height="67.4" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="215.0" y="213.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Катастрофічні наслідки для аналітики:</tspan><tspan x="215.0" dy="13.7">• AVG(Salary) враховує -9999 → спотворено</tspan><tspan x="215.0" dy="13.7">• WHERE Age &gt; 60 включає 999 → помилка</tspan><tspan x="215.0" dy="13.7">• Змішування домену даних із метаданими</tspan></text>
<rect x="50.0" y="317.5" width="330.0" height="35.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="215.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Залежність від довільних конвенцій,</tspan><tspan x="215.0" dy="13.0">руйнування агрегатів та діапазонних вибірок</tspan></text>
<rect x="440.0" y="60.0" width="370.0" height="330.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="625.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Підхід 2: Явний реляційний маркер NULL</text>
<rect x="460.0" y="102.2" width="330.0" height="55.6" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="625.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Значення відсутнє на рівні метаданих</tspan><tspan x="625.0" dy="14.3">Null Bitmap у заголовку кортежу: 1 біт на колонку</tspan><tspan x="625.0" dy="14.3">Корисне навантаження (payload) займає 0 байтів</tspan></text>
<rect x="460.0" y="196.3" width="330.0" height="67.4" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="625.0" y="213.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Математично коректна поведінка агрегатів:</tspan><tspan x="625.0" dy="13.7">• AVG(Salary) ігнорує NULL → чисте середнє</tspan><tspan x="625.0" dy="13.7">• Домен значень лишається непорушеним</tspan><tspan x="625.0" dy="13.7">• Введення тризначної логіки (3VL: T, F, U)</tspan></text>
<rect x="460.0" y="317.5" width="330.0" height="35.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="625.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Чистота типів даних та збереження</tspan><tspan x="625.0" dy="13.0">математичного змісту реляційного відношення</tspan></text>
</svg>