<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="440.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Решітка тризначної логіки Клини (3VL) та обчислення операторів</text>
<rect x="30.0" y="60.0" width="280.0" height="370.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="170.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Частковий порядок істинності</text>
<rect x="80.0" y="111.3" width="180.0" height="37.3" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="170.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">TRUE (1)</tspan><tspan x="170.0" dy="14.3">Найвищий ступінь</tspan></text>
<rect x="80.0" y="211.3" width="180.0" height="37.3" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="170.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">UNKNOWN (1/2)</tspan><tspan x="170.0" dy="14.3">Невизначений стан</tspan></text>
<rect x="80.0" y="311.4" width="180.0" height="37.3" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="170.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">FALSE (0)</tspan><tspan x="170.0" dy="14.3">Найнижчий ступінь</tspan></text>
<line x1="170.0" y1="205.0" x2="170.0" y2="155.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="170.0" y1="305.0" x2="170.0" y2="255.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="170.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">Впорядкування: FALSE &lt; UNKNOWN &lt; TRUE</text>
<rect x="330.0" y="60.0" width="480.0" height="370.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="570.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Алгебраїчні правила 3VL (Клини)</text>
<rect x="350.0" y="115.0" width="440.0" height="69.9" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="570.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Оператори мінімуму, максимуму та доповнення:</tspan><tspan x="570.0" dy="14.3">• A AND B = min(val(A), val(B))</tspan><tspan x="570.0" dy="14.3">• A OR B  = max(val(A), val(B))</tspan><tspan x="570.0" dy="14.3">• NOT A   = 1 - val(A)</tspan></text>
<rect x="350.0" y="219.4" width="440.0" height="81.1" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="570.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Ключові наслідки для SQL:</tspan><tspan x="570.0" dy="13.7">• UNKNOWN AND FALSE = FALSE  (бо min(1/2, 0) = 0)</tspan><tspan x="570.0" dy="13.7">• UNKNOWN OR TRUE   = TRUE   (бо max(1/2, 1) = 1)</tspan><tspan x="570.0" dy="13.7">• UNKNOWN AND TRUE  = UNKNOWN (бо min(1/2, 1) = 1/2)</tspan><tspan x="570.0" dy="13.7">• NOT UNKNOWN       = UNKNOWN (бо 1 - 1/2 = 1/2)</tspan></text>
<rect x="350.0" y="343.1" width="440.0" height="53.8" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="570.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Руйнування закону виключеного третього:</tspan><tspan x="570.0" dy="13.7">UNKNOWN OR NOT UNKNOWN = UNKNOWN (не TRUE!)</tspan><tspan x="570.0" dy="13.7">p OR NOT p не є тавтологією в SQL!</tspan></text>
</svg>