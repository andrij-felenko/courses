<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="400.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Пастка обробки UNKNOWN: фільтрація WHERE проти обмежень CHECK</text>
<rect x="30.0" y="60.0" width="370.0" height="330.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="215.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">WHERE / HAVING / ON: Фільтрація</text>
<rect x="43.0" y="111.9" width="344.0" height="36.1" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="215.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Правило: Accept ONLY TRUE</tspan><tspan x="215.0" dy="13.7">(Пропускати кортеж лише якщо результат строго TRUE)</tspan></text>
<rect x="50.0" y="187.5" width="330.0" height="65.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="215.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Оцінка для кортежу з Age = NULL:</tspan><tspan x="215.0" dy="13.0">• WHERE Age &gt; 18 → UNKNOWN → ВІДКИДАЄТЬСЯ</tspan><tspan x="215.0" dy="13.0">• WHERE NOT (Age &gt; 18) → UNKNOWN → ВІДКИДАЄТЬСЯ</tspan><tspan x="215.0" dy="13.0">• Кортеж не потрапляє у вибірку в ОБОХ випадках!</tspan></text>
<rect x="50.0" y="316.9" width="330.0" height="36.1" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="215.0" y="331.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Рядки з UNKNOWN тихо зникають</tspan><tspan x="215.0" dy="13.7">із результатів запиту</tspan></text>
<rect x="440.0" y="60.0" width="370.0" height="330.0" rx="8" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/>
<text x="625.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9a3412" text-anchor="middle" font-weight="700">CHECK Constraint: Цілісність</text>
<rect x="449.7" y="111.9" width="350.5" height="36.1" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/><text x="625.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Правило: Reject ONLY FALSE</tspan><tspan x="625.0" dy="13.7">(Відхиляти вставку лише якщо результат строго FALSE)</tspan></text>
<rect x="443.1" y="187.5" width="363.7" height="65.0" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/><text x="625.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Оцінка для вставки Salary = NULL:</tspan><tspan x="625.0" dy="13.0">• CHECK (Salary &gt; 0) → UNKNOWN → ДОЗВОЛЕНО!</tspan><tspan x="625.0" dy="13.0">• CHECK (Salary &gt; 0 AND Salary &lt; 1000) → UNKNOWN → ДОЗВОЛЕНО!</tspan><tspan x="625.0" dy="13.0">• Рядок успішно вставляється в таблицю!</tspan></text>
<rect x="460.0" y="316.9" width="330.0" height="36.1" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="625.0" y="331.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">CHECK без NOT NULL не захищає від NULL!</tspan><tspan x="625.0" dy="13.7">Критичне джерело порушення інваріантів</tspan></text>
</svg>