<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="420.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Покрокове розгортання та крах виразу NOT IN за наявності NULL</text>
<rect x="50.0" y="66.0" width="740.0" height="28.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="420.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Запит: SELECT * FROM items WHERE id NOT IN (10, 20, NULL);</tspan></text>
<rect x="50.0" y="139.3" width="740.0" height="41.3" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="420.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Крок 1: За стандартом SQL x NOT IN (a, b, c) розгортається в:</tspan><tspan x="420.0" dy="14.3">(id &lt;&gt; 10) AND (id &lt;&gt; 20) AND (id &lt;&gt; NULL)</tspan></text>
<rect x="50.0" y="215.1" width="740.0" height="69.9" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="420.0" y="232.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Крок 2: Оцінка порівнянь для довільного кортежу (нехай id = 5):</tspan><tspan x="420.0" dy="14.3">(5 &lt;&gt; 10) → TRUE</tspan><tspan x="420.0" dy="14.3">(5 &lt;&gt; 20) → TRUE</tspan><tspan x="420.0" dy="14.3">(5 &lt;&gt; NULL) → UNKNOWN</tspan></text>
<rect x="50.0" y="316.3" width="740.0" height="67.4" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="420.0" y="333.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Крок 3: Обчислення кінцевого предиката:</tspan><tspan x="420.0" dy="13.7">TRUE AND TRUE AND UNKNOWN = UNKNOWN</tspan><tspan x="420.0" dy="13.7">Оскільки WHERE вимагає строго TRUE — жоден рядок таблиці не повертається!</tspan><tspan x="420.0" dy="13.7">(Порожній результат для всієї вибірки, хоча 5 не дорівнює ні 10, ні 20)</tspan></text>
</svg>