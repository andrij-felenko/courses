<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="212.8" y="17.5" width="494.3" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Стиснення чисел з рухомою комою (Gorilla Float XOR)</tspan></text>
<rect x="70.0" y="78.2" width="780.0" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Попереднє vᵢ₋₁: 98.40000000000000  →  0x405899999999999A  (64 біти)</tspan><tspan x="460.0" dy="15.6">Поточне    vᵢ:   98.40000000000000  →  0x405899999999999A  (64 біти)</tspan></text>
<line x1="460.0" y1="130.0" x2="460.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">XOR = vᵢ ⊕ vᵢ₋₁</text>
<rect x="50.0" y="184.0" width="339.9" height="32.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Випадок 1: XOR == 0 (Значення не змінилось)</tspan></text>
<rect x="40.0" y="240.6" width="360.0" height="78.8" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="260.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Записується рівно один біт '0'.</tspan><tspan x="220.0" dy="15.6"></tspan><tspan x="220.0" dy="15.6">Ціна збереження точки: 1 БІТ</tspan><tspan x="220.0" dy="15.6">(96% стабільних метрик у моніторингу)</tspan></text>
<rect x="504.9" y="184.0" width="310.2" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Випадок 2: XOR ≠ 0 (Значення змінилось)</tspan></text>
<rect x="440.0" y="219.4" width="440.0" height="151.1" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="239.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Записується біт '1' + маска значущих бітів:</tspan><tspan x="660.0" dy="15.0"></tspan><tspan x="660.0" dy="15.0">• Якщо кількість провідних і кінцевих нулів</tspan><tspan x="660.0" dy="15.0">  вписується у попереднє вікно:</tspan><tspan x="660.0" dy="15.0">    біт '0' + лише значущі біти (довжина L)</tspan><tspan x="660.0" dy="15.0"></tspan><tspan x="660.0" dy="15.0">• Якщо межі вікна змінились:</tspan><tspan x="660.0" dy="15.0">    біт '1' + 5 біт (провідні нулі) +</tspan><tspan x="660.0" dy="15.0">    6 біт (довжина L) + L значущих бітів</tspan></text>
<rect x="23.8" y="388.8" width="872.5" height="32.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="409.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Результат: середній розмір пари (timestamp, float64) зменшується з 16 байтів (128 біт) до 1.37 байта (~11 біт)</tspan></text>
</svg>