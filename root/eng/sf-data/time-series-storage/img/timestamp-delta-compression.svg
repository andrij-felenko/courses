<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="198.9" y="17.5" width="522.2" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Стиснення часових міток: Схема Delta-of-Delta (Δ-of-Δ)</tspan></text>
<rect x="48.2" y="83.0" width="123.6" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">t₀ = 1718000000</tspan></text>
<rect x="268.2" y="83.0" width="123.6" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">t₁ = 1718000060</tspan></text>
<rect x="488.2" y="83.0" width="123.6" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">t₂ = 1718000120</tspan></text>
<rect x="708.2" y="83.0" width="123.6" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">t₃ = 1718000182</tspan></text>
<line x1="180.0" y1="95.0" x2="260.0" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Δ₀ = 60s</text>
<line x1="400.0" y1="95.0" x2="480.0" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Δ₁ = 60s</text>
<line x1="620.0" y1="95.0" x2="700.0" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="660.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Δ₂ = 62s</text>
<rect x="50.0" y="143.4" width="820.0" height="63.2" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Обчислення різниці між сусідніми інтервалами (DOD = Δᵢ − Δᵢ₋₁):</tspan><tspan x="460.0" dy="15.6">• DOD₁ = Δ₁ − Δ₀ = 60 − 60 = 0  (Ідеальний фіксований інтервал опитування)</tspan><tspan x="460.0" dy="15.6">• DOD₂ = Δ₂ − Δ₁ = 62 − 60 = +2  (Незначне тремтіння таймера / мережевий джитер)</tspan></text>
<rect x="280.7" y="228.5" width="358.5" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="249.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Змінна префіксна бітова розкладка для DOD:</tspan></text>
<rect x="50.0" y="281.9" width="820.0" height="106.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="301.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Значення DOD                Префікс        Біти значення            Загальна ціна</tspan><tspan x="460.0" dy="15.0">DOD = 0                     '0'            (немає)                  1 біт</tspan><tspan x="460.0" dy="15.0">DOD ∈ [-63, 64]             '10'           7 біт (двійковий код)    9 біт</tspan><tspan x="460.0" dy="15.0">DOD ∈ [-255, 256]           '110'          9 біт (двійковий код)    12 біт</tspan><tspan x="460.0" dy="15.0">DOD ∈ [-2047, 2048]         '1110'         12 біт (двійковий код)   16 біт</tspan><tspan x="460.0" dy="15.0">DOD &gt; 2048 або &lt; -2047      '1111'         32 біти (повне число)    36 біт</tspan></text>
</svg>