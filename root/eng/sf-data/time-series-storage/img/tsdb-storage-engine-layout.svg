<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="133.8" y="12.5" width="652.4" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="35.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Архітектура та життєвий цикл блоків TSDB (Prometheus / InfluxDB TSM)</tspan></text>
<rect x="6.6" y="64.0" width="406.9" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Оперативна пам'ять: Head Block (Активне вікно 0..2h)</tspan></text>
<rect x="30.0" y="128.4" width="360.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. Active Chunks (120 точок у буфері)</tspan><tspan x="210.0" dy="15.6">2. Head Index (Словник міток та Postings)</tspan><tspan x="210.0" dy="15.6">3. Append-only WAL на диску (захист від збоїв)</tspan></text>
<line x1="395.0" y1="160.0" x2="500.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Flush / Cut</text>
<text x="450.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кожні 2 год</text>
<rect x="516.3" y="64.0" width="347.4" height="32.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Незмінний блок на диску (2h Block Structure)</tspan></text>
<rect x="500.0" y="120.6" width="380.0" height="78.8" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="140.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">• meta.json   (ULID, minTime, maxTime, stats)</tspan><tspan x="690.0" dy="15.6">• chunks/     (mmap-сегменти, Gorilla-стиснення)</tspan><tspan x="690.0" dy="15.6">• index       (B-Tree / Postings, CRC32, Dictionary)</tspan><tspan x="690.0" dy="15.6">• tombstones  (бітові маски видалених інтервалів)</tspan></text>
<line x1="690.0" y1="225.0" x2="690.0" y2="275.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="765.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Фонове ущільнення (Compaction)</text>
<rect x="212.2" y="293.5" width="495.5" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Багаторівневе об'єднання блоків (Compaction &amp; Downsampling)</tspan></text>
<rect x="40.0" y="356.8" width="840.0" height="76.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">[Блок 0..2h] + [Блок 2..4h] + [Блок 4..6h] + [Блок 6..8h]</tspan><tspan x="460.0" dy="15.0">                                  ↓</tspan><tspan x="460.0" dy="15.0">Об'єднаний незмінний блок 8h / 24h: дедуплікація словника, утилізація tombstones,</tspan><tspan x="460.0" dy="15.0">перевпорядкування чанків для послідовного зчитування mmap з диску.</tspan></text>
</svg>