<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм автоматичного переписування запитів (Query Rewrite &amp; View Matching)</text>
<rect x="119.2" y="34.2" width="721.7" height="51.6" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="56.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Вхідний SQL-запит клієнта до базових таблиць:</tspan><tspan x="480.0" dy="15.6">SELECT category, SUM(total) FROM orders JOIN items ON ... WHERE date &gt;= '2026-01-01' GROUP BY category</tspan></text>
<line x1="480.0" y1="105.0" x2="480.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Аналіз оптимізатора (Query Optimizer)</text>
<rect x="200.0" y="165.0" width="560.0" height="110.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="205.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Перевірка покриття представленням (View Containment &amp; Matching):</tspan><tspan x="480.0" dy="11.7">1. Чи містить MV потрібні таблиці та з'єднання (orders ⋈ items)? → Так</tspan><tspan x="480.0" dy="11.7">2. Чи є необхідні стовпці (category, total) у схемі MV? → Так</tspan><tspan x="480.0" dy="11.7">3. Чи покриває предикат MV фільтр запиту (date &gt;= '2026-01-01')? → Так (або потрібен компенсаційний фільтр)</tspan></text>
<line x1="340.0" y1="275.0" x2="240.0" y2="330.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end">Збіг відсутній</text>
<rect x="80.0" y="330.0" width="320.0" height="100.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Стандартний план (Base Plan)</tspan><tspan x="240.0" dy="14.3">• Сканування orders (40M)</tspan><tspan x="240.0" dy="14.3">• Сканування items (180M)</tspan><tspan x="240.0" dy="14.3">• Hash Join + Group By на льоту</tspan><tspan x="240.0" dy="14.3">Вартість: Cost = 854 200</tspan></text>
<line x1="620.0" y1="275.0" x2="720.0" y2="330.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Збіг знайдено! (Rewrite)</text>
<rect x="560.0" y="330.0" width="340.0" height="100.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="730.0" y="357.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Переписаний план (Rewritten Plan)</tspan><tspan x="730.0" dy="13.0">• Запит замінюється на: SELECT * FROM mv_sales_by_cat</tspan><tspan x="730.0" dy="13.0">• Точковий індексний скан</tspan><tspan x="730.0" dy="13.0">• Нуль з'єднань на льоту</tspan><tspan x="730.0" dy="13.0">Вартість: Cost = 12.4 (прискорення ×68 000)</tspan></text>
</svg>