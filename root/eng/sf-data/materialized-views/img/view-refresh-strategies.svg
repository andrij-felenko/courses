<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стратегії оновлення матеріалізованих даних: компроміс свіжості та обчислювальних витрат</text>
<text x="160.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Повне оновлення (Full Refresh)</text>
<rect x="40.0" y="80.0" width="240.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Базові дані змінюються</tspan><tspan x="160.0" dy="15.6">(INSERT / UPDATE / DELETE)</tspan><tspan x="160.0" dy="15.6">Зміни накопичуються в базі</tspan></text>
<line x1="160.0" y1="180.0" x2="160.0" y2="230.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="160.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">TRUNCATE + Повний рекомп'ют</text>
<rect x="40.0" y="230.0" width="240.0" height="120.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Перерахунок усього запиту</tspan><tspan x="160.0" dy="13.0">• Тривале блокування або temp-таблиця</tspan><tspan x="160.0" dy="13.0">• Високе навантаження на I/O</tspan><tspan x="160.0" dy="13.0">• Періодичний запуск (cron)</tspan></text>
<rect x="40.0" y="370.0" width="240.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="160.0" y="396.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Затримка: висока (хвилини/години)</tspan><tspan x="160.0" dy="14.3">Ціна запису: 0 на транзакцію</tspan></text>
<text x="480.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Інкрементне оновлення (IVM)</text>
<rect x="360.0" y="80.0" width="240.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Транзакція мутації генерує дельту</tspan><tspan x="480.0" dy="14.3">ΔR = (вставлені / видалені рядки)</tspan><tspan x="480.0" dy="14.3">Фіксація змін у WAL / тригерах</tspan></text>
<line x1="480.0" y1="180.0" x2="480.0" y2="230.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Диференційні правила ΔV</text>
<rect x="360.0" y="230.0" width="240.0" height="120.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Точкове оновлення агрегатів</tspan><tspan x="480.0" dy="13.0">• Обробка лише рядків ΔR</tspan><tspan x="480.0" dy="13.0">• Лічильники кратності (__count)</tspan><tspan x="480.0" dy="13.0">• Синхронно або майже в реальному часі</tspan></text>
<rect x="360.0" y="370.0" width="240.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Затримка: мілісекунди</tspan><tspan x="480.0" dy="13.0">Ціна запису: додатковий I/O транзакції</tspan></text>
<text x="800.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Потокове злиття (ClickHouse / Flink)</text>
<rect x="680.0" y="80.0" width="240.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Потік подій / чанків даних</tspan><tspan x="800.0" dy="15.6">Вставка блоками (Batch Insert)</tspan><tspan x="800.0" dy="15.6">CDC / Kafka потік</tspan></text>
<line x1="800.0" y1="180.0" x2="800.0" y2="230.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="800.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Проміжні стани агрегатів</text>
<rect x="680.0" y="230.0" width="240.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Фонове злиття LSM-дерев</tspan><tspan x="800.0" dy="14.3">• SummingMergeTree / Aggregating</tspan><tspan x="800.0" dy="14.3">• Неблокувальне фонове згортання</tspan><tspan x="800.0" dy="14.3">• Остаточна узгодженість</tspan></text>
<rect x="680.0" y="370.0" width="240.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="800.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Затримка: субсекундна</tspan><tspan x="800.0" dy="13.0">Ціна запису: мінімальна (асинхронна)</tspan></text>
</svg>