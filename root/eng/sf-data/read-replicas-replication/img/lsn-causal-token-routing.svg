<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="40.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Сесійні гарантії через маркери журналу: маршрутизація на основі LSN / GTID</text>
<rect x="40.0" y="80.0" width="220.0" height="360.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="150.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт / Сесія</text>
<rect x="55.0" y="140.0" width="190.0" height="70.0" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="150.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">1. Мутація стану</tspan><tspan x="150.0" dy="14.2">POST /order/submit</tspan><tspan x="150.0" dy="14.2">Отримання LSN токена</tspan></text>
<rect x="55.0" y="230.0" width="190.0" height="60.0" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.0"/>
<text x="150.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Сесійний маркер:</tspan><tspan x="150.0" dy="14.2">Session_LSN = 0/16B3A40</tspan></text>
<rect x="55.0" y="310.0" width="190.0" height="110.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.0"/>
<text x="150.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="150.0" dy="0.0">2. Наступне читання</tspan><tspan x="150.0" dy="14.2">GET /order/status</tspan><tspan x="150.0" dy="14.2">Заголовок:</tspan><tspan x="150.0" dy="14.2">X-Required-LSN: 0/16B3A40</tspan></text>
<rect x="310.0" y="80.0" width="280.0" height="360.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="450.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">Lag-Aware Router / Proxy</text>
<rect x="325.0" y="140.0" width="250.0" height="80.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.0"/>
<text x="450.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Опитування стану реплік:</tspan><tspan x="450.0" dy="14.2">Репліка A: Applied LSN = 0/16B3800</tspan><tspan x="450.0" dy="14.2">Репліка B: Applied LSN = 0/16B3B20</tspan></text>
<rect x="325.0" y="240.0" width="250.0" height="180.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.0"/>
<text x="450.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Логіка маршрутизації читання:</text>
<text x="450.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">IF Replica.Applied_LSN ≥ Session_LSN:</tspan><tspan x="450.0" dy="14.2">  → Маршрутизувати на Репліку B (OK)</tspan><tspan x="450.0" dy="14.2">ELSE IF Replica відстає:</tspan><tspan x="450.0" dy="14.2">  → Зачекати replay до timeout</tspan><tspan x="450.0" dy="14.2">  → АБО перенаправити на Primary</tspan></text>
<rect x="640.0" y="80.0" width="280.0" height="100.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="780.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">Primary (Лідер)</text>
<text x="780.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Current LSN = 0/16B3C00</text>
<text x="780.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Завжди містить найсвіжіший стан</text>
<rect x="640.0" y="210.0" width="280.0" height="105.0" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
<text x="780.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Репліка A (Відстає)</text>
<text x="780.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Applied LSN = 0/16B3800 (&lt; 0/16B3A40)</text>
<text x="780.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">ВІДХИЛЕНО: спричинить stale read</text>
<rect x="640.0" y="335.0" width="280.0" height="105.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="780.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Репліка B (Свіжа)</text>
<text x="780.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Applied LSN = 0/16B3B20 (≥ 0/16B3A40)</text>
<text x="780.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">ДОЗВОЛЕНО: дані гарантовано актуальні</text>
<line x1="260.0" y1="365.0" x2="310.0" y2="365.0" stroke="#1e40af" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="575.0" y1="385.0" x2="640.0" y2="385.0" stroke="#15803d" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="605.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">SELECT</text>
