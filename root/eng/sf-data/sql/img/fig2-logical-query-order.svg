<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="480.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Логічний порядок виконання секцій SQL (Dataflow Lifecycle)</text>
<rect x="40.0" y="55.0" width="760.0" height="36.0" rx="5" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.3"/>
<text x="150.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">1. FROM &amp; JOIN / ON</text>
<text x="480.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Формування робочого відношення, з'єднання таблиць за предикатами</text>
<line x1="420.0" y1="91.0" x2="420.0" y2="99.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="100.0" width="760.0" height="36.0" rx="5" fill="#e6fffa" stroke="#0d9488" stroke-width="1.3"/>
<text x="150.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">2. WHERE</text>
<text x="480.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Фільтрація кортежів базових таблиць до будь-якої агрегації</text>
<line x1="420.0" y1="136.0" x2="420.0" y2="144.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="145.0" width="760.0" height="36.0" rx="5" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.3"/>
<text x="150.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">3. GROUP BY</text>
<text x="480.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Розбиття множини кортежів на неперетинні групи за ключами</text>
<line x1="420.0" y1="181.0" x2="420.0" y2="189.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="190.0" width="760.0" height="36.0" rx="5" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.3"/>
<text x="150.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">4. HAVING</text>
<text x="480.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Фільтрація згрупованих кортежів за результатами агрегатних функцій</text>
<line x1="420.0" y1="226.0" x2="420.0" y2="234.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="235.0" width="760.0" height="36.0" rx="5" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.3"/>
<text x="150.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">5. WINDOW (OVER)</text>
<text x="480.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Обчислення віконних функцій над партиціями без згортання рядків</text>
<line x1="420.0" y1="271.0" x2="420.0" y2="279.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="280.0" width="760.0" height="36.0" rx="5" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.3"/>
<text x="150.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">6. SELECT</text>
<text x="480.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Проекція атрибутів, обчислення виразів і призначення псевдонімів</text>
<line x1="420.0" y1="316.0" x2="420.0" y2="324.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="325.0" width="760.0" height="36.0" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="150.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">7. DISTINCT</text>
<text x="480.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Вилучення дублікатів кортежів з результуючої множини</text>
<line x1="420.0" y1="361.0" x2="420.0" y2="369.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="370.0" width="760.0" height="36.0" rx="5" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.3"/>
<text x="150.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">8. UNION / INTERSECT</text>
<text x="480.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Множинні операції над сумісними за схемою результуючими наборами</text>
<line x1="420.0" y1="406.0" x2="420.0" y2="414.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="415.0" width="760.0" height="36.0" rx="5" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.3"/>
<text x="150.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">9. ORDER BY</text>
<text x="480.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Сортування остаточної результуючої множини за виразами або псевдонімами</text>
<text x="420.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Псевдоніми з SELECT не доступні у WHERE чи GROUP BY, бо обчислюються пізніше.</text>
</svg>