<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="500.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Операції з'єднання: Логічна семантика та фізичні алгоритми</text>
<text x="420.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">Логічні різновиди JOIN (Множинна семантика)</text>
<rect x="45.0" y="91.9" width="170.0" height="46.2" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="130.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">INNER JOIN</tspan><tspan x="130.0" dy="12.3">Лише кортежі зі збігом</tspan><tspan x="130.0" dy="12.3">ключа в обох таблицях</tspan></text>
<rect x="235.0" y="91.9" width="170.0" height="46.2" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="320.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">LEFT JOIN</tspan><tspan x="320.0" dy="12.3">Усі кортежі зліва;</tspan><tspan x="320.0" dy="12.3">справа NULL при незбігу</tspan></text>
<rect x="425.0" y="91.9" width="170.0" height="46.2" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="510.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">FULL JOIN</tspan><tspan x="510.0" dy="12.3">Усі кортежі з обох сторін;</tspan><tspan x="510.0" dy="12.3">NULL для відсутніх пар</tspan></text>
<rect x="611.5" y="91.9" width="176.9" height="46.2" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="700.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">SEMI / ANTI JOIN</tspan><tspan x="700.0" dy="12.3">Перевірка існування (EXISTS)</tspan><tspan x="700.0" dy="12.3">або відсутності (NOT EXISTS)</tspan></text>
<line x1="40.0" y1="175.0" x2="800.0" y2="175.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="420.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">Фізичні алгоритми виконання JOIN у рушії СУБД</text>
<rect x="30.0" y="270.7" width="240.0" height="118.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="150.0" y="286.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Nested Loop Join (NLJ)</tspan><tspan x="150.0" dy="11.7"></tspan><tspan x="150.0" dy="11.7">Складність: O(M · N) без індексу</tspan><tspan x="150.0" dy="11.7">З індексом: O(M · log N)</tspan><tspan x="150.0" dy="11.7"></tspan><tspan x="150.0" dy="11.7">Зовнішній цикл сканує R,</tspan><tspan x="150.0" dy="11.7">внутрішній шукає збіги в S.</tspan><tspan x="150.0" dy="11.7">Оптимальний для малих таблиць</tspan><tspan x="150.0" dy="11.7">або за наявності B-Tree індексу.</tspan></text>
<rect x="300.0" y="270.7" width="240.0" height="118.6" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="420.0" y="286.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Hash Join (HJ)</tspan><tspan x="420.0" dy="11.7"></tspan><tspan x="420.0" dy="11.7">Складність: O(M + N)</tspan><tspan x="420.0" dy="11.7">Пам'ять: O(min(M, N))</tspan><tspan x="420.0" dy="11.7"></tspan><tspan x="420.0" dy="11.7">Фаза Build: будує хеш-таблицю</tspan><tspan x="420.0" dy="11.7">в оперативній пам'яті для R.</tspan><tspan x="420.0" dy="11.7">Фаза Probe: сканує S і шукає</tspan><tspan x="420.0" dy="11.7">відповідні хеш-кошики.</tspan></text>
<rect x="570.0" y="270.7" width="240.0" height="118.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="690.0" y="286.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Sort-Merge Join (SMJ)</tspan><tspan x="690.0" dy="11.7"></tspan><tspan x="690.0" dy="11.7">Складність: O(M log M + N log N)</tspan><tspan x="690.0" dy="11.7">Без сортування: O(M + N)</tspan><tspan x="690.0" dy="11.7"></tspan><tspan x="690.0" dy="11.7">Обидва набори сортуються за</tspan><tspan x="690.0" dy="11.7">ключем, далі йде злиття.</tspan><tspan x="690.0" dy="11.7">Найкращий для кластерних</tspan><tspan x="690.0" dy="11.7">індексів або великих обсягів.</tspan></text>
<text x="420.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">Оптимізатор обирає алгоритм на основі статистики кардинальності таблиць та наявності індексів.</text>
</svg>