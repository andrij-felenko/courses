<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 900.01 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="900.01" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="420.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Трансформація кардинальності: GROUP BY проти віконних функцій (OVER)</text>
<rect x="40.0" y="60.0" width="360.0" height="340.0" rx="8" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.3"/>
<text x="220.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="700">Агрегація: GROUP BY (Згортання рядків)</text>
<rect x="60.0" y="105.0" width="320.0" height="80.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="220.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">Вхідна таблиця (6 рядків)</text>
<text x="220.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">dept=IT (val: 100, 200, 300)
dept=HR (val: 150, 250, 350)</text>
<line x1="220.0" y1="195.0" x2="220.0" y2="230.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="220.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e08a1e" text-anchor="middle" font-weight="700">GROUP BY dept, SUM(val)</text>
<rect x="60.0" y="240.0" width="320.0" height="70.0" rx="4" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/>
<text x="220.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle" font-weight="700">Результат: 2 рядки (Кардинальність N → K)</text>
<text x="220.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">IT  | sum = 600
HR  | sum = 750</text>
<text x="220.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Втрата деталізації окремих кортежів.
Доступні лише ключі групування та агрегати.</text>
<rect x="440.0" y="60.0" width="360.0" height="340.0" rx="8" fill="#e6fffa" stroke="#0d9488" stroke-width="1.3"/>
<text x="620.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">Віконна функція: OVER (Збереження рядків)</text>
<rect x="460.0" y="105.0" width="320.0" height="80.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="620.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">Вхідна таблиця (6 рядків)</text>
<text x="620.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">dept=IT (val: 100, 200, 300)
dept=HR (val: 150, 250, 350)</text>
<line x1="620.0" y1="195.0" x2="620.0" y2="230.0" stroke="#0d9488" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="620.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0d9488" text-anchor="middle" font-weight="700">SUM(val) OVER (PARTITION BY dept)</text>
<rect x="460.0" y="240.0" width="320.0" height="95.0" rx="4" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
<text x="620.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="700">Результат: 6 рядків (Кардинальність N → N)</text>
<text x="620.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="middle" font-weight="700">IT | 100 | sum_dept = 600
IT | 200 | sum_dept = 600
IT | 300 | sum_dept = 600
HR | 150 | sum_dept = 750 ...</text>
<text x="620.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Повна деталізація кожного початкового рядка
плюс обчислене значення по вікну (партиції).</text>
</svg>