<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структурна ізоляція: чому AST унеможливлює SQL-ін'єкцію</text>
<rect x="35.0" y="55.0" width="435.0" height="435.0" rx="8" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.8"/>
<rect x="35.0" y="55.0" width="435.0" height="55.0" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="252.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Конкатенація рядків (Синтаксична вразливість)</text>
<text x="252.5" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">&quot;WHERE name = '&quot; + input + &quot;'&quot;</text>
<text x="55.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Вхідний рядок: admin' OR '1'='1</text>
<rect x="190.0" y="160.0" width="125.0" height="36.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="252.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">WHERE Clause</text>
<rect x="190.0" y="225.0" width="125.0" height="36.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<text x="252.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">OR (BinaryOp)</text>
<line x1="252.0" y1="196.0" x2="252.0" y2="225.0" stroke="#c0392b" stroke-width="1.8"/>
<rect x="75.0" y="290.0" width="150.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="150.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">name = 'admin'</text>
<rect x="280.0" y="290.0" width="150.0" height="42.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/>
<text x="355.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">'1' = '1' (Завжди TRUE)</text>
<line x1="230.0" y1="261.0" x2="150.0" y2="290.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="275.0" y1="261.0" x2="355.0" y2="290.0" stroke="#c0392b" stroke-width="1.8"/>
<rect x="50.0" y="360.0" width="405.0" height="110.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="252.5" y="412.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">Синтаксичний аналізатор парсить лапки та оператор OR як граматичні елементи SQL.</tspan><tspan x="252.5" dy="11.7">Структура дерева AST мутує, перетворюючи предикат на тотожно істинний вираз.</tspan></text>
<rect x="510.0" y="55.0" width="435.0" height="435.0" rx="8" fill="#eef9f1" stroke="#27ae60" stroke-width="1.8"/>
<rect x="510.0" y="55.0" width="435.0" height="55.0" rx="8" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="727.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Підготовлений вираз (AST Ізоляція)</text>
<text x="727.5" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">WHERE name = $1  (Параметр зв'язується окремо)</text>
<text x="530.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Значення параметра $1: admin' OR '1'='1</text>
<rect x="665.0" y="160.0" width="125.0" height="36.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="727.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">WHERE Clause</text>
<rect x="665.0" y="225.0" width="125.0" height="36.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="727.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">= (EqualOp)</text>
<line x1="727.0" y1="196.0" x2="727.0" y2="225.0" stroke="#27ae60" stroke-width="1.8"/>
<rect x="550.0" y="290.0" width="150.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="625.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ColumnRef (name)</text>
<rect x="755.0" y="290.0" width="150.0" height="42.0" rx="4" fill="#e8f8f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="830.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ParamSlot ($1)</text>
<text x="830.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">типізоване значення</text>
<line x1="705.0" y1="261.0" x2="625.0" y2="290.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="750.0" y1="261.0" x2="830.0" y2="290.0" stroke="#27ae60" stroke-width="1.8"/>
<rect x="525.0" y="360.0" width="405.0" height="110.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="727.5" y="412.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="727.5" dy="0.0">Дерево AST фіксується на етапі PREPARE. Слот $1 приймає сирий рядок цілком як значення.</tspan><tspan x="727.5" dy="11.7">Символи лапок та ключове слово OR інтерпретуються як звичайний текст, не змінюючи логіку виразу.</tspan></text>
</svg>