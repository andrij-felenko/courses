<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три підходи до опису двійкових даних</text>
<rect x="30.0" y="60.0" width="285.0" height="390.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<rect x="30.0" y="60.0" width="285.0" height="40.0" rx="8" fill="#eaf2f8" stroke="#333333" stroke-width="1.5"/>
<text x="172.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1b4f72" text-anchor="middle" font-weight="700">1. Безсхемні / Теговані</text>
<text x="172.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">JSON, BSON, CBOR, MessagePack</text>
<rect x="45.0" y="140.0" width="255.0" height="95.0" rx="6" fill="#f4f6f7" stroke="#bdc3c7" stroke-width="1.5"/><text x="172.5" y="171.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="172.5" dy="0.0">Кожен запис повторює ключі й теги типів:</tspan><tspan x="172.5" dy="13.0">{&quot;id&quot;: 1, &quot;temp&quot;: 21.5}</tspan><tspan x="172.5" dy="13.0">{&quot;id&quot;: 2, &quot;temp&quot;: 22.1}</tspan><tspan x="172.5" dy="13.0">{&quot;id&quot;: 3, &quot;temp&quot;: 20.8}</tspan></text>
<rect x="45.0" y="250.0" width="255.0" height="80.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="172.5" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="172.5" dy="0.0">+ Повна гнучкість запису</tspan><tspan x="172.5" dy="15.6">+ Довільна динамічна структура</tspan><tspan x="172.5" dy="15.6">+ Не потрібна попередня схема</tspan></text>
<rect x="45.0" y="345.0" width="255.0" height="90.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="172.5" y="378.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="172.5" dy="0.0">− 50–80% розміру — повтори імен</tspan><tspan x="172.5" dy="15.6">− Повільний розбір типів рядків</tspan><tspan x="172.5" dy="15.6">− Немає суворого контракту</tspan></text>
<rect x="350.0" y="60.0" width="285.0" height="390.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<rect x="350.0" y="60.0" width="285.0" height="40.0" rx="8" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/>
<text x="492.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7d6608" text-anchor="middle" font-weight="700">2. Зовнішня схема</text>
<text x="492.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Protocol Buffers, FlatBuffers</text>
<rect x="365.0" y="140.0" width="255.0" height="95.0" rx="6" fill="#fcf3cf" stroke="#f1c40f" stroke-width="1.5"/><text x="492.5" y="169.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="492.5" dy="0.0">Схема окремо у файлі schema.proto;</tspan><tspan x="492.5" dy="14.3">у двійковому файлі лише номери полів:</tspan><tspan x="492.5" dy="14.3">[0x08, 0x01, 0x15, 0x00, ...]</tspan><tspan x="492.5" dy="14.3">Без .proto байти непрочитні</tspan></text>
<rect x="365.0" y="250.0" width="255.0" height="80.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="492.5" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="492.5" dy="0.0">+ Мінімальний оверхед у мережі</tspan><tspan x="492.5" dy="15.6">+ Швидка серіалізація</tspan><tspan x="492.5" dy="15.6">+ Сувора статична типізація</tspan></text>
<rect x="365.0" y="345.0" width="255.0" height="90.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="492.5" y="380.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="492.5" dy="0.0">− Файл мертвий без точної версії .proto</tspan><tspan x="492.5" dy="13.0">− Крихке довгострокове архівування</tspan><tspan x="492.5" dy="13.0">− Важко читати стороннім інструментам</tspan></text>
<rect x="670.0" y="60.0" width="285.0" height="390.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<rect x="670.0" y="60.0" width="285.0" height="40.0" rx="8" fill="#eafaf1" stroke="#333333" stroke-width="1.5"/>
<text x="812.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e8449" text-anchor="middle" font-weight="700">3. Самоописові (вбудована)</text>
<text x="812.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Apache Avro, Apache Parquet, HDF5</text>
<rect x="685.0" y="140.0" width="255.0" height="95.0" rx="6" fill="#d5f5e3" stroke="#58d68d" stroke-width="1.5"/><text x="812.5" y="169.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="812.5" dy="0.0">Схема записана 1 раз у файлі;</tspan><tspan x="812.5" dy="14.3">дані лежать компактно без імен полів:</tspan><tspan x="812.5" dy="14.3">[Header/Footer: Schema JSON/Thrift]</tspan><tspan x="812.5" dy="14.3">[Data: щільні двійкові масиви/колонки]</tspan></text>
<rect x="685.0" y="250.0" width="255.0" height="80.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="812.5" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="812.5" dy="0.0">+ Файл повністю автономний</tspan><tspan x="812.5" dy="14.3">+ Дані компактні (без оверхеду ключів)</tspan><tspan x="812.5" dy="14.3">+ Автоматична еволюція схеми</tspan></text>
<rect x="685.0" y="345.0" width="255.0" height="90.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="812.5" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="812.5" dy="0.0">− Невеликий фіксований оверхед схеми</tspan><tspan x="812.5" dy="14.3">− Складніший формат контейнера</tspan><tspan x="812.5" dy="14.3">− Потрібен рушій зіставлення схем</tspan></text>
</svg>