<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура контейнера Apache Avro (Object Container File)</text>
<text x="60.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Заголовок файлу (Header):</text>
<rect x="30.0" y="65.0" width="110.0" height="60.0" rx="6" fill="#d4e6f1" stroke="#2980b9" stroke-width="1.5"/><text x="85.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="85.0" dy="0.0">Magic Bytes</tspan><tspan x="85.0" dy="15.6">4 байти:</tspan><tspan x="85.0" dy="15.6">'Obj' + 0x01</tspan></text>
<rect x="150.0" y="65.0" width="520.0" height="60.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Карта метаданих (Metadata Map: avro.schema + avro.codec)</tspan><tspan x="410.0" dy="14.3">JSON-схема типу: {&quot;type&quot;:&quot;record&quot;,&quot;name&quot;:&quot;User&quot;,&quot;fields&quot;:[...]}</tspan></text>
<rect x="680.0" y="65.0" width="230.0" height="60.0" rx="6" fill="#fdebd0" stroke="#d35400" stroke-width="1.5"/><text x="795.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">Синхромаркер (Sync Marker)</tspan><tspan x="795.0" dy="14.3">16 випадкових байтів</tspan><tspan x="795.0" dy="14.3">(унікальний для файлу)</tspan></text>
<line x1="795.0" y1="125.0" x2="795.0" y2="170.0" stroke="#d35400" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="60.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Блоки даних (Data Blocks):</text>
<rect x="30.0" y="195.0" width="420.0" height="140.0" rx="6" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="240.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блок даних #1</text>
<rect x="45.0" y="230.0" width="100.0" height="45.0" rx="6" fill="#eaeded" stroke="#333333" stroke-width="1.5"/><text x="95.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">Кількість рядків</tspan><tspan x="95.0" dy="11.7">(varint)</tspan></text>
<rect x="155.0" y="230.0" width="110.0" height="45.0" rx="6" fill="#eaeded" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Розмір байтів</tspan><tspan x="210.0" dy="14.3">(varint)</tspan></text>
<rect x="275.0" y="230.0" width="160.0" height="45.0" rx="6" fill="#fdebd0" stroke="#d35400" stroke-width="1.5"/><text x="355.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">16-байтний маркер</tspan><tspan x="355.0" dy="14.3">(той самий Sync)</tspan></text>
<rect x="45.0" y="280.0" width="390.0" height="40.0" rx="6" fill="#e8f8f5" stroke="#2ecc71" stroke-width="1.5"/><text x="240.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Стиснені двійкові записи (Snappy / Deflate / Zstd)</tspan><tspan x="240.0" dy="13.0">Послідовність чистих двійкових значень згідно зі схемою</tspan></text>
<rect x="490.0" y="195.0" width="420.0" height="140.0" rx="6" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="700.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блок даних #2 ... N</text>
<rect x="505.0" y="230.0" width="100.0" height="45.0" rx="6" fill="#eaeded" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Кількість рядків</tspan><tspan x="555.0" dy="11.7">(varint)</tspan></text>
<rect x="615.0" y="230.0" width="110.0" height="45.0" rx="6" fill="#eaeded" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Розмір байтів</tspan><tspan x="670.0" dy="14.3">(varint)</tspan></text>
<rect x="735.0" y="230.0" width="160.0" height="45.0" rx="6" fill="#fdebd0" stroke="#d35400" stroke-width="1.5"/><text x="815.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">16-байтний маркер</tspan><tspan x="815.0" dy="14.3">(той самий Sync)</tspan></text>
<rect x="505.0" y="280.0" width="390.0" height="40.0" rx="6" fill="#e8f8f5" stroke="#2ecc71" stroke-width="1.5"/><text x="700.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Стиснені двійкові записи наступної пачки</tspan><tspan x="700.0" dy="13.0">Дозапис у хвіст без перезапису заголовка</tspan></text>
<rect x="30.0" y="355.0" width="880.0" height="55.0" rx="6" fill="#f4f6f7" stroke="#bdc3c7" stroke-width="1.5"/><text x="470.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Потоковий запис: схема пишеться на початку один раз; блоки дописуються в кінець без оновлення зміщень.</tspan><tspan x="470.0" dy="14.3">Синхромаркер дозволяє паралельним процесам MapReduce знаходити межі блоків у довільному місці файлу.</tspan></text>
</svg>