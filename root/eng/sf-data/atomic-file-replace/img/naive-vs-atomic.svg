<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="720.0" height="150.0" rx="6" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.2"/>
<text x="40.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Прямий запис на місці (in-place truncate &amp; write) — небезпечно</text>
<rect x="56.8" y="67.2" width="166.5" height="55.6" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="140.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">1. open(..., O_TRUNC)</tspan><tspan x="140.0" dy="14.3">Розмір стає 0 байтів;</tspan><tspan x="140.0" dy="14.3">старі дані стерто з кешу</tspan></text>
<line x1="220.0" y1="95.0" x2="260.0" y2="95.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="264.9" y="67.2" width="160.2" height="55.6" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/><text x="345.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">2. write(buf, 4096)</tspan><tspan x="345.0" dy="14.3">Записано першу частину;</tspan><tspan x="345.0" dy="14.3">дані лише в RAM</tspan></text>
<line x1="430.0" y1="95.0" x2="470.0" y2="95.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="501.8" y="67.2" width="186.5" height="55.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">3. ЗБІЙ ЖИВЛЕННЯ!</tspan><tspan x="595.0" dy="14.3">Файл порожній (0 байтів)</tspan><tspan x="595.0" dy="14.3">або містить уривок сміття</tspan></text>
<rect x="20.0" y="185.0" width="720.0" height="155.0" rx="6" fill="#f6fcf7" stroke="#c3e6cb" stroke-width="1.2"/>
<text x="40.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Атомарна заміна через тимчасовий файл (write-fsync-rename) — надійно</text>
<rect x="51.8" y="242.2" width="166.5" height="55.6" rx="6" fill="#ffffff" stroke="#c3e6cb" stroke-width="1.2"/><text x="135.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">1. Запис у .tmp-файл</tspan><tspan x="135.0" dy="14.3">Оригінал недоторканий;</tspan><tspan x="135.0" dy="14.3">читачі бачать старе ціле</tspan></text>
<line x1="215.0" y1="270.0" x2="255.0" y2="270.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="256.8" y="242.2" width="166.5" height="55.6" rx="6" fill="#ffffff" stroke="#c3e6cb" stroke-width="1.2"/><text x="340.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">2. fsync() тимчасового</tspan><tspan x="340.0" dy="14.3">Усі нові байти й інод</tspan><tspan x="340.0" dy="14.3">скинуто на фізичний диск</tspan></text>
<line x1="425.0" y1="270.0" x2="465.0" y2="270.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="498.3" y="242.2" width="193.3" height="55.6" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="595.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">3. rename() + fsync(dir)</tspan><tspan x="595.0" dy="14.3">Миттєва підміна покажчика;</tspan><tspan x="595.0" dy="14.3">стан завжди 100% цілий</tspan></text>
</svg>