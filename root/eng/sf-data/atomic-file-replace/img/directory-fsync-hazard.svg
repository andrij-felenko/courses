<rect x="89.8" y="84.3" width="210.4" height="41.3" rx="6" fill="#ffffff" stroke="#4a69bd" stroke-width="1.2"/><text x="195.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="195.0" dy="0.0">Каталог оновлено:</tspan><tspan x="195.0" dy="14.3">config.json → Інод #402 (новий)</tspan></text>
