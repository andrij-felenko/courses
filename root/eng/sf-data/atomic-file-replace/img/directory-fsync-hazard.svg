<text x="380.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Без fsync(dir_fd) файлова система після збою відкочує каталог до старого інода</text>
