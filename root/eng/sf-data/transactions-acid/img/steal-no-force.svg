<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця стратегій керування сторінками буферного пулу</text>
<text x="500.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця взаємодії пам'яті та диска: вибір між швидкістю та складністю відновлення</text>
<text x="370.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">FORCE (примусове скидання даних)</text>
<text x="370.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Commit записує всі змінені сторінки на диск</text>
<text x="740.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">NO-FORCE (відкладене скидання даних)</text>
<text x="740.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Commit записує лише журнал WAL; сторінки лишаються в RAM</text>
<rect x="44.0" y="165.1" width="131.9" height="69.9" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="182.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">NO-STEAL</tspan><tspan x="110.0" dy="14.3">Брудні блоки</tspan><tspan x="110.0" dy="14.3">незавершених змін</tspan><tspan x="110.0" dy="14.3">не йдуть на диск</tspan></text>
<rect x="40.6" y="345.1" width="138.8" height="69.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="362.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">STEAL</tspan><tspan x="110.0" dy="14.3">Буферний пул</tspan><tspan x="110.0" dy="14.3">може скинути блок</tspan><tspan x="110.0" dy="14.3">для звільнення RAM</tspan></text>
<line x1="210.0" y1="115.0" x2="960.0" y2="115.0" stroke="#333333" stroke-width="1.5"/>
<line x1="210.0" y1="290.0" x2="960.0" y2="290.0" stroke="#333333" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="210.0" y1="490.0" x2="960.0" y2="490.0" stroke="#333333" stroke-width="1.5"/>
<line x1="210.0" y1="115.0" x2="210.0" y2="490.0" stroke="#333333" stroke-width="1.5"/>
<line x1="560.0" y1="60.0" x2="560.0" y2="490.0" stroke="#333333" stroke-width="1.5"/>
<line x1="960.0" y1="115.0" x2="960.0" y2="490.0" stroke="#333333" stroke-width="1.5"/>
<rect x="224.5" y="155.9" width="321.0" height="88.2" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/><text x="385.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Журнал відновлення НЕ потрібен</tspan><tspan x="385.0" dy="14.3">• UNDO не треба: на диску нема брудних даних</tspan><tspan x="385.0" dy="14.3">• REDO не треба: всі дані записані до завершення</tspan><tspan x="385.0" dy="14.3">Ціна: повільний випадковий I/O на кожен Commit,</tspan><tspan x="385.0" dy="14.3">розмір транзакцій обмежений обсягом RAM</tspan></text>
<rect x="577.6" y="163.1" width="364.8" height="73.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="760.0" y="182.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Потрібен журнал REDO (повтор дій)</tspan><tspan x="760.0" dy="14.3">• UNDO не треба: брудні сторінки не потрапляють на диск</tspan><tspan x="760.0" dy="14.3">• REDO потрібен: відновлює втрачені з RAM сторінки</tspan><tspan x="760.0" dy="14.3">Ціна: обсяг транзакції обмежений доступною RAM</tspan></text>
<rect x="218.2" y="353.1" width="333.5" height="73.9" rx="6" fill="#fef2f2" stroke="#2457d6" stroke-width="1.2"/><text x="385.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Потрібен журнал UNDO (скасування дій)</tspan><tspan x="385.0" dy="14.3">• UNDO потрібен: відкочує скинуті на диск сторінки</tspan><tspan x="385.0" dy="14.3">• REDO не треба: всі сторінки скинуто на Commit</tspan><tspan x="385.0" dy="14.3">Ціна: катастрофічне падіння швидкості на Commit</tspan></text>
<rect x="543.4" y="351.1" width="433.2" height="77.9" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="2.0"/><text x="760.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">СТАНДАРТ СУБД (STEAL + NO-FORCE)</tspan><tspan x="760.0" dy="14.3">Потрібні обидва журнали: UNDO + REDO (WAL / ARIES)</tspan><tspan x="760.0" dy="14.3">• Максимальна швидкість: Commit пише лише лог у кінець файлу</tspan><tspan x="760.0" dy="14.3">• Буферний пул повністю автономно керує сторінками в RAM</tspan></text>
</svg>