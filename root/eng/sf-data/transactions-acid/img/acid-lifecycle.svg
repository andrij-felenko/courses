<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діаграма станів виконання транзакції</text>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл транзакції: переходи між станами виконання та відновлення</text>
<rect x="71.0" y="108.6" width="157.9" height="82.8" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">ACTIVE</tspan><tspan x="150.0" dy="15.6">(Активна)</tspan><tspan x="150.0" dy="15.6">Виконання операцій</tspan><tspan x="150.0" dy="15.6">читання і запису</tspan></text>
<rect x="371.3" y="108.6" width="217.4" height="82.8" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/><text x="480.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">PARTIALLY COMMITTED</tspan><tspan x="480.0" dy="15.6">(Частково зафіксована)</tspan><tspan x="480.0" dy="15.6">Остання операція виконана,</tspan><tspan x="480.0" dy="15.6">йде fsync() логу на диск</tspan></text>
<rect x="697.6" y="108.6" width="224.9" height="82.8" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="2.0"/><text x="810.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">COMMITTED</tspan><tspan x="810.0" dy="15.6">(Зафіксована)</tspan><tspan x="810.0" dy="15.6">Зміни гарантовано на диску,</tspan><tspan x="810.0" dy="15.6">клієнт отримує успіх</tspan></text>
<rect x="210.0" y="266.4" width="210.0" height="67.2" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/><text x="315.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">FAILED (Збійна)</tspan><tspan x="315.0" dy="15.6">Помилка інваріанта, збій,</tspan><tspan x="315.0" dy="15.6">дедлок або явний ROLLBACK</tspan></text>
<rect x="575.0" y="266.4" width="210.0" height="67.2" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.8"/><text x="680.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">ABORTED (Відкочена)</tspan><tspan x="680.0" dy="15.6">Журнал UNDO застосовано,</tspan><tspan x="680.0" dy="15.6">стан повернуто до початку</tspan></text>
<line x1="240.0" y1="150.0" x2="360.0" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Останній запит</text>
<line x1="600.0" y1="150.0" x2="700.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">fsync() успішний</text>
<line x1="180.0" y1="205.0" x2="260.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="190.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Помилка / abort</text>
<line x1="440.0" y1="205.0" x2="360.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Збій I/O логу</text>
<line x1="415.0" y1="300.0" x2="580.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="495.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Застосування UNDO</text>
</svg>