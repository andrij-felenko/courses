<text x="500.0" y="683.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1993 бер.</text>
<rect x="60.0" y="720.0" width="340.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="741.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">CompactFlash: ATA-контролер</tspan><tspan x="230.0" dy="15.6">прямо на картці</tspan></text>
