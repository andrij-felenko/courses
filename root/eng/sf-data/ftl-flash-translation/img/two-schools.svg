<rect x="600.0" y="786.0" width="350.0" height="50.0" rx="6" fill="#e8f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="807.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Патент US 5,404,485 видано</tspan><tspan x="775.0" dy="15.6">(збіг 2013 року)</tspan></text>
