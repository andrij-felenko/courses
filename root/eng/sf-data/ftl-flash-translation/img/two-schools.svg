<rect x="600.0" y="852.0" width="350.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="873.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">FTL — у стандарті PC Card 5.04.</tspan><tspan x="775.0" dy="15.6">Назву «Flash Translation Layer» дав комітет</tspan></text>
