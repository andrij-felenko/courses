<rect x="60.0" y="324.0" width="340.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="345.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Перший комерційний знімний</tspan><tspan x="230.0" dy="15.6">ATA-флеш-диск, 20 МБ</tspan></text>
<line x1="404.0" y1="349.0" x2="456.0" y2="349.0" stroke="#2457d6" stroke-width="1.4"/>
<text x="500.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1991</text>
<rect x="60.0" y="390.0" width="890.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="505.0" y="411.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">1991 жовт. — Sprite LFS, Розенблюм і Оустергаут (SOSP): журнал + індекс + чистильник.</tspan><tspan x="505.0" dy="15.6">Той самий кістяк, інша причина: не фізика флешу, а їзда голівки диска.</tspan></text>
<rect x="600.0" y="456.0" width="350.0" height="50.0" rx="6" fill="#e8f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="477.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">У M-Systems приходить Амір Бан:</tspan><tspan x="775.0" dy="15.6">задачу переставлено з файлів на сектори</tspan></text>
<line x1="596.0" y1="481.0" x2="544.0" y2="481.0" stroke="#27ae60" stroke-width="1.4"/>
<text x="500.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">~1992</text>
