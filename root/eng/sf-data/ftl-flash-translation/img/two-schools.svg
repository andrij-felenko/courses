<rect x="60.0" y="588.0" width="340.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="609.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">PC Card ATA — у стандарті PCMCIA 2.01</tspan><tspan x="230.0" dy="15.6">(дорога SanDisk увійшла першою)</tspan></text>
