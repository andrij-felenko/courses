<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 1020" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="1020" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві школи однієї задачі: як зробити флеш схожим на диск</text>
<rect x="60.0" y="52.0" width="340.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Кремнієва школа — SanDisk</tspan><tspan x="230.0" dy="16.9">«контролер на картці»</tspan></text>
<rect x="600.0" y="52.0" width="350.0" height="46.0" rx="6" fill="#e8f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Системна школа — M-Systems</tspan><tspan x="775.0" dy="16.9">«розум у драйвері»</tspan></text>
<line x1="500.0" y1="110.0" x2="500.0" y2="382.0" stroke="#d8dee4" stroke-width="2.0"/>
<line x1="500.0" y1="448.0" x2="500.0" y2="902.0" stroke="#d8dee4" stroke-width="2.0"/>
<rect x="60.0" y="126.0" width="340.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="147.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Засновано SanDisk (SunDisk):</tspan><tspan x="230.0" dy="15.6">Гарарі, Мегротра, Юань</tspan></text>
<line x1="404.0" y1="151.0" x2="456.0" y2="151.0" stroke="#2457d6" stroke-width="1.4"/>
<text x="500.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1988</text>
<rect x="60.0" y="192.0" width="340.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="213.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Пріоритет US 5,297,148 (Гарарі й ін.):</tspan><tspan x="230.0" dy="15.6">контролер + флеш = «твердотілий диск»</tspan></text>
<line x1="404.0" y1="217.0" x2="456.0" y2="217.0" stroke="#2457d6" stroke-width="1.4"/>
