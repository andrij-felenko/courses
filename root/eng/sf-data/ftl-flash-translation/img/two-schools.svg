<text x="500.0" y="617.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1992 лист.</text>
<rect x="600.0" y="654.0" width="350.0" height="50.0" rx="6" fill="#e8f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="675.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Заявка US 5,404,485 «Flash file system»,</tspan><tspan x="775.0" dy="15.6">єдиний винахідник — Амір Бан</tspan></text>
