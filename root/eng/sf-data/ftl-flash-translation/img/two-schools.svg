<rect x="60.0" y="926.0" width="890.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="505.0" y="945.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Червоне — рішення комітету PCMCIA: обидві школи ввійшли в ОДИН стандарт,</tspan><tspan x="505.0" dy="15.6">різними дверима й у різні роки.</tspan></text>
