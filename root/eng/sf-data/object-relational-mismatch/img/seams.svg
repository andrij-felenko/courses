<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1245 675" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1245" height="675" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="150.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">шов</text>
<text x="535.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Об'єкти (пам'ять)</text>
<text x="990.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реляція (таблиці)</text>
<rect x="45.0" y="132.5" width="210.0" height="35.0" rx="6" fill="#f4f7fc" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Гранулярність</tspan></text>
<rect x="320.0" y="123.0" width="430.0" height="53.9" rx="6" fill="#eaf3ff" stroke="#2457d6" stroke-width="1.8"/><text x="535.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">багато дрібних типів:</tspan><tspan x="535.0" dy="16.9">Money, Address, PersonName</tspan></text>
<rect x="775.0" y="123.0" width="430.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">колонки одного рядка,</tspan><tspan x="990.0" dy="16.9">типу «гроші» немає</tspan></text>
<rect x="45.0" y="240.5" width="210.0" height="35.0" rx="6" fill="#f4f7fc" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="262.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Підтипи</tspan></text>
<rect x="320.0" y="231.1" width="430.0" height="53.9" rx="6" fill="#eaf3ff" stroke="#2457d6" stroke-width="1.8"/><text x="535.0" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">ієрархія + поліморфізм:</tspan><tspan x="535.0" dy="16.9">Payment ← CardPayment</tspan></text>
<rect x="775.0" y="231.1" width="430.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">таблиці не успадковуються:</tspan><tspan x="990.0" dy="16.9">одна широка / JOIN / UNION</tspan></text>
<rect x="45.0" y="348.5" width="210.0" height="35.0" rx="6" fill="#f4f7fc" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="370.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Тотожність</tspan></text>
<rect x="320.0" y="339.1" width="430.0" height="53.9" rx="6" fill="#eaf3ff" stroke="#2457d6" stroke-width="1.8"/><text x="535.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">посилання ≠ рівність значень:</tspan><tspan x="535.0" dy="16.9">(a===b)  vs  a.equals(b)</tspan></text>
<rect x="775.0" y="339.1" width="430.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">лише первинний ключ:</tspan><tspan x="990.0" dy="16.9">id = 7 — і по всьому</tspan></text>
<rect x="45.0" y="456.5" width="210.0" height="35.0" rx="6" fill="#f4f7fc" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="478.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Зв'язки</tspan></text>
<rect x="320.0" y="447.1" width="430.0" height="53.9" rx="6" fill="#eaf3ff" stroke="#2457d6" stroke-width="1.8"/><text x="535.0" y="470.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">посилання й колекції,</tspan><tspan x="535.0" dy="16.9">«багато-до-багатьох» задарма</tspan></text>
<rect x="775.0" y="447.1" width="430.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="470.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">зовнішній ключ + таблиця-місток,</tspan><tspan x="990.0" dy="16.9">напрямок часто протилежний</tspan></text>
<rect x="45.0" y="564.5" width="210.0" height="35.0" rx="6" fill="#f4f7fc" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="586.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Навігація</tspan></text>
<rect x="320.0" y="555.0" width="430.0" height="53.9" rx="6" fill="#eaf3ff" stroke="#2457d6" stroke-width="1.8"/><text x="535.0" y="578.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">обхід крапкою:</tspan><tspan x="535.0" dy="16.9">order.customer.address</tspan></text>
<rect x="775.0" y="555.0" width="430.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="578.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">запит або JOIN на кожен крок,</tspan><tspan x="990.0" dy="16.9">N+1, якщо буквально</tspan></text>
<text x="622.0" y="648.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">той самий факт — дві форми; на кожному рядку об'єктна властивість не має прямого відповідника в таблицях</text>
</svg>