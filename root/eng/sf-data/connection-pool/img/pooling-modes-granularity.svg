<text x="40.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Session Pooling (Сесійний режим)</text>
<text x="40.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">З'єднання закріплене за клієнтом на весь життєвий цикл сесії (від connect до disconnect)</text>
<text x="150.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">Клієнт A:</text>
<rect x="160.0" y="143.0" width="730.0" height="32.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="525.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="700">Серверне з'єднання зайняте 100% часу (включно з простоями клієнта між запитами)</text>
<rect x="25.0" y="210.0" width="910.0" height="130.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="40.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="700">2. Transaction Pooling (Транзакційний режим)</text>
<text x="40.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="start">Серверне з'єднання видається ТІЛЬКИ на час від BEGIN до COMMIT/ROLLBACK</text>
<text x="150.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="end" font-weight="700">Серверний сокет:</text>
