<text x="40.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="start" font-weight="700">Результат: 1 серверне з'єднання обслуговує десятки активних клієнтів без втрати ізоляції</text>
<rect x="25.0" y="355.0" width="910.0" height="110.0" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<text x="40.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="start" font-weight="700">3. Statement Pooling (Операторний режим)</text>
<text x="40.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a3412" text-anchor="start">З'єднання виділяється на 1 SQL-запит (автокоміт). Багатооператорні BEGIN...COMMIT заборонені!</text>
