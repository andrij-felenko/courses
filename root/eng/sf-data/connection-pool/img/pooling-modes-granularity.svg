<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими пулінгу: гранулярність захоплення серверного з'єднання в часі</text>
<line x1="80.0" y1="65.0" x2="900.0" y2="65.0" stroke="#94a3b8" stroke-width="1.5"/>
