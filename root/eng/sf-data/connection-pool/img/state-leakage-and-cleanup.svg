<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витік сесійного стану при транзакційному мультиплексуванні та бар'єр очищення</text>
<rect x="30.0" y="60.0" width="270.0" height="390.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<text x="165.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Клієнт 1 (Транзакція 1)</text>
<rect x="45.0" y="110.0" width="240.0" height="32.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.0"/>
<text x="55.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="start">BEGIN;</text>
<rect x="45.0" y="152.0" width="240.0" height="32.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.0"/>
<text x="55.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="start">SET timezone = 'America/New_York';</text>
<rect x="45.0" y="194.0" width="240.0" height="32.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.0"/>
<text x="55.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="start">SET work_mem = '128MB';</text>
<rect x="45.0" y="236.0" width="240.0" height="32.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.0"/>
<text x="55.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="start">CREATE TEMP TABLE tmp_cache (...);</text>
<rect x="45.0" y="278.0" width="240.0" height="32.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.0"/>
<text x="55.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="start">PREPARE stmt_find AS SELECT ...;</text>
<rect x="45.0" y="320.0" width="240.0" height="32.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.0"/>
<text x="55.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="start">LISTEN order_events;</text>
<rect x="45.0" y="362.0" width="240.0" height="32.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.0"/>
<text x="55.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="start">COMMIT;</text>
<text x="165.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">З'єднання повертається в пул</text>
<rect x="320.0" y="60.0" width="320.0" height="390.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
<text x="480.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">Шов очищення стану (Sanitization)</text>
<rect x="335.0" y="110.0" width="290.0" height="85.0" rx="5" fill="#fee2e2" stroke="#f87171" stroke-width="1.1"/>
<text x="480.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Без очищення (НЕБЕЗПЕЧНО!):</text>
<text x="480.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">• Чужий часовий пояс і змінні оточення</text>
<text x="480.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">• Завищений work_mem виснажує RAM</text>
<text x="480.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">• Тимчасові таблиці видимі іншому клієнту</text>
<rect x="335.0" y="210.0" width="290.0" height="220.0" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
<text x="480.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Команди бар'єру скидання стану:</text>
<rect x="345.0" y="245.0" width="270.0" height="32.0" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1.0"/>
<text x="480.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">DISCARD ALL  (PostgreSQL)</text>
<rect x="345.0" y="285.0" width="270.0" height="32.0" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1.0"/>
<text x="480.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700">DISCARD PLANS, TEMP, SEQUENCES</text>
<rect x="345.0" y="325.0" width="270.0" height="32.0" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1.0"/>
<text x="480.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700">RESET ALL; UNLISTEN *;</text>
<text x="480.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">server_reset_query виконується</text>
<text x="480.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle">перед передачею сокета клієнту 2</text>
<text x="480.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-style="italic">Гарантує ізоляцію середовища</text>
<rect x="660.0" y="60.0" width="270.0" height="390.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="795.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт 2 (Транзакція 2)</text>
<rect x="675.0" y="110.0" width="240.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="685.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Отримує сокет із пулу</text>
<rect x="675.0" y="152.0" width="240.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="685.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Стан: повністю очищений</text>
<rect x="675.0" y="194.0" width="240.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="685.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Timezone: за замовчуванням</text>
<rect x="675.0" y="236.0" width="240.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="685.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">work_mem: 4MB (дефолт)</text>
<rect x="675.0" y="278.0" width="240.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="685.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Temp tables: відсутні</text>
<rect x="675.0" y="320.0" width="240.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="685.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">BEGIN;</text>
<rect x="675.0" y="362.0" width="240.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="685.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Виконує чистий запит;</text>
<text x="795.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Ізольоване середовище</text>
<line x1="302.0" y1="250.0" x2="318.0" y2="250.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="642.0" y1="250.0" x2="658.0" y2="250.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>