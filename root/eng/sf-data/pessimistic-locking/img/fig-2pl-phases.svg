<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двофазне блокування (2PL та Strict 2PL): фази захоплення та звільнення замків</text>
