<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння обробки черги з FOR UPDATE та SKIP LOCKED</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конкурентна обробка черги завдань: блокування FOR UPDATE проти SKIP LOCKED</text>
<rect x="40.0" y="60.0" width="460.0" height="390.0" rx="8" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="270.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Стандартний SELECT ... FOR UPDATE</text>
<rect x="111.0" y="112.5" width="318.1" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Таблиця черги завдань:</tspan><tspan x="270.0" dy="13.0">[Завдання #1 (status=new)]  ──►  Заблоковано Worker 1</tspan><tspan x="270.0" dy="13.0">[Завдання #2 (status=new)]  ──►  Вільне</tspan><tspan x="270.0" dy="13.0">[Завдання #3 (status=new)]  ──►  Вільне</tspan></text>
<rect x="98.4" y="221.0" width="103.2" height="48.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Worker 1</tspan><tspan x="150.0" dy="13.0">Обробляє #1</tspan><tspan x="150.0" dy="13.0">(Утримує X-lock)</tspan></text>
<rect x="324.1" y="221.0" width="131.7" height="48.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="390.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Worker 2</tspan><tspan x="390.0" dy="13.0">SELECT ... FOR UPDATE</tspan><tspan x="390.0" dy="13.0">LIMIT 1</tspan></text>
<line x1="320.0" y1="245.0" x2="225.0" y2="245.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="270.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">БЛОКУВАННЯ!</text>
<rect x="85.3" y="327.5" width="369.4" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="270.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">КАТАСТРОФІЧНИЙ РЕЗУЛЬТАТ:</tspan><tspan x="270.0" dy="13.0">Worker 2 зупиняється і чекає на завершення Worker 1,</tspan><tspan x="270.0" dy="13.0">хоча завдання #2 та #3 абсолютно вільні!</tspan><tspan x="270.0" dy="13.0">Черга перетворюється на строго однопотокове вузьке горло.</tspan></text>
<rect x="540.0" y="60.0" width="460.0" height="390.0" rx="8" fill="none" stroke="#27ae60" stroke-width="1.5"/>
<text x="770.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Оптимізований FOR UPDATE SKIP LOCKED</text>
<rect x="611.0" y="112.5" width="318.1" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Таблиця черги завдань:</tspan><tspan x="770.0" dy="13.0">[Завдання #1 (status=new)]  ──►  Заблоковано Worker 1</tspan><tspan x="770.0" dy="13.0">[Завдання #2 (status=new)]  ──►  Заблоковано Worker 2</tspan><tspan x="770.0" dy="13.0">[Завдання #3 (status=new)]  ──►  Заблоковано Worker 3</tspan></text>
<rect x="595.5" y="221.0" width="69.0" height="48.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Worker 1</tspan><tspan x="630.0" dy="13.0">Захопив #1</tspan><tspan x="630.0" dy="13.0">(Працює)</tspan></text>
<rect x="726.8" y="221.0" width="86.4" height="48.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Worker 2</tspan><tspan x="770.0" dy="13.0">Пропустив #1</tspan><tspan x="770.0" dy="13.0">Захопив #2!</tspan></text>
<rect x="854.4" y="221.0" width="111.2" height="48.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="910.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">Worker 3</tspan><tspan x="910.0" dy="13.0">Пропустив #1, #2</tspan><tspan x="910.0" dy="13.0">Захопив #3!</tspan></text>
<line x1="630.0" y1="190.0" x2="630.0" y2="215.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="770.0" y1="190.0" x2="770.0" y2="215.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="910.0" y1="190.0" x2="910.0" y2="215.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="594.6" y="327.5" width="350.8" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="770.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">ІДЕАЛЬНИЙ ПАРАЛЕЛЬНИЙ ПОТІК:</tspan><tspan x="770.0" dy="13.0">Кожен воркер миттєво бере наступний вільний рядок,</tspan><tspan x="770.0" dy="13.0">ігноруючи зайняті транзакціями записи.</tspan><tspan x="770.0" dy="13.0">Нульовий час очікування замків (Zero Lock Contention)!</tspan></text>
<rect x="114.1" y="479.0" width="811.8" height="22.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="520.0" y="493.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Ключове правило: SKIP LOCKED перетворює звичайну таблицю реляційної СУБД на високопродуктивну чергу повідомлень (Message Broker).</tspan></text>
</svg>