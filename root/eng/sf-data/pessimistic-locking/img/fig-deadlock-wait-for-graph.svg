<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія взаємного блокування та граф очікування</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія взаємного блокування (Deadlock) та граф очікування (Wait-For Graph)</text>
<rect x="40.0" y="60.0" width="460.0" height="430.0" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
<text x="270.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність подій у часі (Timeline)</text>
<rect x="118.3" y="124.0" width="303.4" height="22.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="270.0" y="138.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">t1: Транзакція T1 бере X-lock на Рядок A (id=1)</tspan></text>
<rect x="118.3" y="184.0" width="303.4" height="22.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="270.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">t2: Транзакція T2 бере X-lock на Рядок B (id=2)</tspan></text>
<rect x="112.1" y="244.0" width="315.8" height="22.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/><text x="270.0" y="258.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">t3: T1 запитує X-lock на Рядок B ──► ЧЕКАЄ НА T2!</tspan></text>
<rect x="112.1" y="304.0" width="315.8" height="22.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/><text x="270.0" y="318.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">t4: T2 запитує X-lock на Рядок A ──► ЧЕКАЄ НА T1!</tspan></text>
<rect x="118.3" y="367.5" width="303.4" height="35.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="270.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">t5: DEADLOCK: T1 чекає на T2, а T2 чекає на T1.</tspan><tspan x="270.0" dy="13.0">Жодна транзакція не може рухатись вперед!</tspan></text>
<line x1="270.0" y1="155.0" x2="270.0" y2="175.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="270.0" y1="215.0" x2="270.0" y2="235.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="270.0" y1="275.0" x2="270.0" y2="295.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="270.0" y1="335.0" x2="270.0" y2="360.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520.0" y="60.0" width="480.0" height="430.0" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
<text x="760.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф очікування транзакцій (Wait-For Graph)</text>
<rect x="555.2" y="180.2" width="149.6" height="59.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/><text x="630.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Транзакція T1</tspan><tspan x="630.0" dy="14.3">• Утримує: Рядок A</tspan><tspan x="630.0" dy="14.3">• Чекає на: Рядок B</tspan></text>
<rect x="815.2" y="180.2" width="149.6" height="59.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/><text x="890.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Транзакція T2</tspan><tspan x="890.0" dy="14.3">• Утримує: Рядок B</tspan><tspan x="890.0" dy="14.3">• Чекає на: Рядок A</tspan></text>
<line x1="710.0" y1="185.0" x2="810.0" y2="185.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="760.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Чекає (Lock B)</text>
<line x1="810.0" y1="235.0" x2="710.0" y2="235.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="760.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Чекає (Lock A)</text>
<rect x="550.5" y="314.0" width="419.0" height="52.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="760.0" y="330.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">Детектор взаємних блокувань (Deadlock Detector):</tspan><tspan x="760.0" dy="13.0">Фоновий процес СУБД сканує граф WFG кожні deadlock_timeout (1 с).</tspan><tspan x="760.0" dy="13.0">Виявлено цикл (Cycle in Directed Graph): T1 ──► T2 ──► T1</tspan></text>
<rect x="522.6" y="409.0" width="474.8" height="52.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="425.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">РІШЕННЯ: Вибір жертви (Victim Selection)</tspan><tspan x="760.0" dy="13.0">СУБД примусово перериває T2 з помилкою SQLSTATE 40P01 (deadlock_detected),</tspan><tspan x="760.0" dy="13.0">виконує ROLLBACK і дозволяє T1 успішно завершити транзакцію!</tspan></text>
</svg>