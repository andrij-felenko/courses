<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія 128-бітного UUID: поля, версія і варіант</text>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">128-бітний UUID (RFC 4122 / RFC 9562): 16 байтів у записі 8-4-4-4-12</text>
<rect x="40.0" y="52.0" width="760.0" height="48.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="72.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">f81d4fae - 7dec - 11d0 - a765 - 00a0c91e6bf6</tspan><tspan x="420.0" dy="15.6">8 hex-знаків    4 hex     4 hex     4 hex         12 hex-знаків</tspan></text>
<rect x="40.0" y="120.0" width="170.0" height="75.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="125.0" y="139.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">time_low</tspan><tspan x="125.0" dy="14.3"></tspan><tspan x="125.0" dy="14.3">4 байти (32 біти)</tspan><tspan x="125.0" dy="14.3">байти 0..3</tspan></text>
<rect x="210.0" y="120.0" width="120.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/><text x="270.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">time_mid</tspan><tspan x="270.0" dy="13.0"></tspan><tspan x="270.0" dy="13.0">2 байти (16 бітів)</tspan><tspan x="270.0" dy="13.0">байти 4..5</tspan></text>
<rect x="330.0" y="120.0" width="160.0" height="75.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="410.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">time_hi_and_ver</tspan><tspan x="410.0" dy="13.0"></tspan><tspan x="410.0" dy="13.0">2 байти (16 бітів)</tspan><tspan x="410.0" dy="13.0">4-біт версія + 12 бітів</tspan></text>
<rect x="490.0" y="120.0" width="150.0" height="75.0" rx="6" fill="#fdeeea" stroke="#c0392b" stroke-width="1.6"/><text x="565.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">clk_seq</tspan><tspan x="565.0" dy="11.7"></tspan><tspan x="565.0" dy="11.7">2 байти (16 бітів)</tspan><tspan x="565.0" dy="11.7">2-3 біти варіант + посл.</tspan></text>
<rect x="640.0" y="120.0" width="160.0" height="75.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="720.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">node / entropy</tspan><tspan x="720.0" dy="11.7"></tspan><tspan x="720.0" dy="11.7">6 байтів (48 бітів)</tspan><tspan x="720.0" dy="11.7">MAC-адреса або 48 випадкових бітів</tspan></text>
<rect x="40.0" y="215.0" width="370.0" height="95.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="225.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Поле версії (Version): старші 4 біти байта 6</tspan><tspan x="225.0" dy="14.3">• 0001 (1) = time + MAC   • 0100 (4) = CSPRNG</tspan><tspan x="225.0" dy="14.3">• 0101 (5) = SHA-1 назва  • 0111 (7) = Unix ms + rand</tspan></text>
<rect x="430.0" y="215.0" width="370.0" height="95.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="615.0" y="244.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Поле варіанта (Variant): старші 2-3 біти байта 8</tspan><tspan x="615.0" dy="14.3">• 10x (RFC 4122 / RFC 9562 / Leach-Salz)</tspan><tspan x="615.0" dy="14.3">• 0xx (Apollo NCS)  • 110 (Microsoft COM GUID)</tspan><tspan x="615.0" dy="14.3">• 111 (Зарезервовано для майбутніх стандартів)</tspan></text>
<text x="420.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">128 бітів = 16 байтів = 32 шістнадцяткові цифри + 4 дефіси</text>
</svg>