<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок байтів у пам'яті: RFC 4122 Big-Endian vs Windows GUID struct Little-Endian</text>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікт порядку байтів: мережевий RFC 4122 vs Microsoft GUID</text>
<rect x="40.0" y="52.0" width="760.0" height="46.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/><text x="420.0" y="71.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Канонічний текстовий рядок:  00112233-4455-6677-8899-aabbccddeeff</tspan><tspan x="420.0" dy="15.6">Усі 16 байтів за стандартом IETF/RFC записуються в Big-Endian (Network Byte Order)</tspan></text>
<rect x="40.0" y="115.0" width="365.0" height="175.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="222.5" y="156.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="222.5" dy="0.0">RFC 4122 / RFC 9562 (Big-Endian)</tspan><tspan x="222.5" dy="14.3"></tspan><tspan x="222.5" dy="14.3">Байтовий масив у пам'яті (16 байтів):</tspan><tspan x="222.5" dy="14.3">[00 11 22 33] [44 55] [66 77] [88 99 aa bb cc dd ee ff]</tspan><tspan x="222.5" dy="14.3"></tspan><tspan x="222.5" dy="14.3">• Усі поля зберігаються старшим байтом уперед.</tspan><tspan x="222.5" dy="14.3">• Порядок байтів у пам'яті повністю збігається</tspan><tspan x="222.5" dy="14.3">  із порядком символів у hex-рядку.</tspan></text>
<rect x="435.0" y="115.0" width="365.0" height="175.0" rx="6" fill="#fdeeea" stroke="#c0392b" stroke-width="1.8"/><text x="617.5" y="160.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="617.5" dy="0.0">Microsoft GUID struct (Little-Endian на x86/ARM)</tspan><tspan x="617.5" dy="13.0"></tspan><tspan x="617.5" dy="13.0">struct { u32 Data1; u16 Data2; u16 Data3; u8 Data4[8]; }</tspan><tspan x="617.5" dy="13.0">[33 22 11 00] [55 44] [77 66] [88 99 aa bb cc dd ee ff]</tspan><tspan x="617.5" dy="13.0"></tspan><tspan x="617.5" dy="13.0">• Data1, Data2, Data3 перевертаються в пам'яті!</tspan><tspan x="617.5" dy="13.0">• Прямий memcpy() дає фальшивий інший UUID:</tspan><tspan x="617.5" dy="13.0">  33221100-5544-7766-8899-aabbccddeeff</tspan></text>
<text x="420.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Збереження struct GUID через memcpy() у мережу чи SQLite BLOB спотворює перші 8 байтів</text>
</svg>