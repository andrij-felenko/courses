<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">B-Tree індекси: деградація через випадковий UUIDv4 проти монотонного UUIDv7</text>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вплив ідентифікатора на B-дерево індексу: UUIDv4 проти UUIDv7</text>
<rect x="40.0" y="55.0" width="365.0" height="235.0" rx="6" fill="#fdeeea" stroke="#c0392b" stroke-width="1.8"/><text x="222.5" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="222.5" dy="0.0">UUIDv4 (Випадковий ключ)</tspan><tspan x="222.5" dy="13.0"></tspan><tspan x="222.5" dy="13.0">1. Ключі потрапляють у випадкові листки дерева.</tspan><tspan x="222.5" dy="13.0">2. Заповнений листок розщеплюється навпіл (Page Split).</tspan><tspan x="222.5" dy="13.0">3. Коефіцієнт заповнення сторінок падає до ~50%.</tspan><tspan x="222.5" dy="13.0">4. Кеш Buffer Pool вимивається хаотичними сторінками.</tspan><tspan x="222.5" dy="13.0">5. Високий Write Amplification (запис 8-16 КБ на ключ).</tspan><tspan x="222.5" dy="13.0">6. Продуктивність вставки падає в рази при зростанні БД.</tspan></text>
<rect x="435.0" y="55.0" width="365.0" height="235.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/><text x="617.5" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="617.5" dy="0.0">UUIDv7 (Часово впорядкований ключ)</tspan><tspan x="617.5" dy="13.0"></tspan><tspan x="617.5" dy="13.0">1. Нові ключі монотонно додаються в крайній правий листок.</tspan><tspan x="617.5" dy="13.0">2. Сторінки заповнюються послідовно без розщеплень.</tspan><tspan x="617.5" dy="13.0">3. Коефіцієнт заповнення індексу досягає 90-98%.</tspan><tspan x="617.5" dy="13.0">4. Гаряча сторінка лишається в L1/L2/RAM кеші.</tspan><tspan x="617.5" dy="13.0">5. Мінімальний Write Amplification та послідовний I/O.</tspan><tspan x="617.5" dy="13.0">6. Швидкість вставки стабільна навіть на мільярдах рядків.</tspan></text>
<text x="420.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">UUIDv7 зберігає унікальність без реєстру і водночас захищає індекси баз даних від фрагментації</text>
</svg>