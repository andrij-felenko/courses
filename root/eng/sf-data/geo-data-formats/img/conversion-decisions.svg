<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="604" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шість місць, де перетворювач мусить вирішувати сам</text>
<rect x="24.0" y="52.0" width="250.0" height="42.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.9"/><text x="149.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="149.0" dy="0.0">що дає GPX</tspan></text>
<rect x="282.0" y="52.0" width="250.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="407.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="407.0" dy="0.0">чого вимагає GeoJSON</tspan></text>
<rect x="540.0" y="52.0" width="420.0" height="42.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.9"/><text x="750.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">рішення перетворювача</tspan></text>
<rect x="24.0" y="106.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="149.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="149.0" dy="0.0">&lt;ele&gt; без бази відліку</tspan></text>
<rect x="282.0" y="106.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="407.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="407.0" dy="0.0">третє число — над</tspan><tspan x="407.0" dy="15.6">еліпсоїдом WGS-84</tspan></text>
<rect x="540.0" y="106.0" width="420.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="750.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">є &lt;geoidheight&gt; → пишемо h = ele + N;</tspan><tspan x="750.0" dy="15.6">немає → координата лишається двовимірною</tspan></text>
<rect x="24.0" y="184.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="149.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="149.0" dy="0.0">точка без &lt;time&gt;</tspan></text>
<rect x="282.0" y="184.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="407.0" y="215.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="407.0" dy="0.0">масив часів має збігатися</tspan><tspan x="407.0" dy="15.6">довжиною з масивом точок</tspan></text>
<rect x="540.0" y="184.0" width="420.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="750.0" y="215.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">у масив іде null, а не пропуск —</tspan><tspan x="750.0" dy="15.6">інакше зсунуться всі наступні</tspan></text>
<rect x="24.0" y="262.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="149.0" y="293.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="149.0" dy="0.0">&lt;trkseg&gt; з нуля</tspan><tspan x="149.0" dy="15.6">або однієї точки</tspan></text>
<rect x="282.0" y="262.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="407.0" y="293.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="407.0" dy="0.0">LineString — щонайменше</tspan><tspan x="407.0" dy="15.6">дві позиції</tspan></text>
<rect x="540.0" y="262.0" width="420.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="750.0" y="293.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">сегмент викидаємо, а лічильник</tspan><tspan x="750.0" dy="15.6">викинутих кладемо в properties</tspan></text>
<rect x="24.0" y="340.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="149.0" y="371.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="149.0" dy="0.0">GPX 1.0 і GPX 1.1 —</tspan><tspan x="149.0" dy="15.6">різні простори імен</tspan></text>
<rect x="282.0" y="340.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="407.0" y="371.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="407.0" dy="0.0">формату байдуже,</tspan><tspan x="407.0" dy="15.6">як улаштований XML</tspan></text>
<rect x="540.0" y="340.0" width="420.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="750.0" y="371.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">звіряємо локальне ім'я тега,</tspan><tspan x="750.0" dy="15.6">простір імен свідомо ігноруємо</tspan></text>
<rect x="24.0" y="418.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="149.0" y="449.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="149.0" dy="0.0">&lt;extensions&gt; — чужі теги</tspan><tspan x="149.0" dy="15.6">з довільними іменами</tspan></text>
<rect x="282.0" y="418.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="407.0" y="449.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="407.0" dy="0.0">нічого; вони просто</tspan><tspan x="407.0" dy="15.6">не мають куди подітися</tspan></text>
<rect x="540.0" y="418.0" width="420.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="750.0" y="449.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">усередині extensions не бачимо нічого,</tspan><tspan x="750.0" dy="15.6">щоб чужий &lt;time&gt; не став нашим</tspan></text>
<rect x="24.0" y="496.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="149.0" y="535.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="149.0" dy="0.0">трек без &lt;name&gt;</tspan></text>
<rect x="282.0" y="496.0" width="250.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="407.0" y="527.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="407.0" dy="0.0">properties — довільний</tspan><tspan x="407.0" dy="15.6">об'єкт, назва не обов'язкова</tspan></text>
<rect x="540.0" y="496.0" width="420.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="750.0" y="527.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">пишемо &quot;name&quot;: null,</tspan><tspan x="750.0" dy="15.6">а не вигадуємо назву з імені файлу</tspan></text>
<text x="500.0" y="600.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Кожне рішення в правій колонці — домисел. Тому кожне лишає слід у properties.</text>
</svg>