<text x="480.0" y="784.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Кожен формат виріс із власної незручності — і зберіг її сліди в структурі.</text>
