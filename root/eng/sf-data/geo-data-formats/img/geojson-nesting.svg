<rect x="40.0" y="238.0" width="380.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="230.0" y="264.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Geometry</tspan><tspan x="230.0" dy="16.9">type + coordinates</tspan></text>
<rect x="40.0" y="322.0" width="380.0" height="60.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="230.0" y="348.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Position</tspan><tspan x="230.0" dy="16.9">[ довгота, широта, (висота) ]</tspan></text>
<line x1="230.0" y1="130.0" x2="230.0" y2="152.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="214.0" x2="230.0" y2="236.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="298.0" x2="230.0" y2="320.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="230.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кожен рівень — окремий об'єкт JSON</text>
<text x="715.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">глибина дужок у coordinates</text>
<rect x="500.0" y="78.0" width="430.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="514.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Point</text>
<text x="916.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">[ x, y ]</text>
<rect x="500.0" y="130.0" width="430.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="514.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">LineString, MultiPoint</text>
<text x="916.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">[ [ x, y ], … ]</text>
<rect x="500.0" y="182.0" width="430.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="514.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Polygon, MultiLineString</text>
<text x="916.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">[ [ [ x, y ], … ], … ]</text>
<rect x="500.0" y="234.0" width="430.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="514.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">MultiPolygon</text>
<text x="916.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">[ [ [ [ x, y ], … ] ] ]</text>
<text x="715.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="715.0" dy="0.0">GeometryCollection тримає не coordinates,</tspan><tspan x="715.0" dy="15.6">а масив geometries</tspan></text>
<rect x="30.0" y="424.0" width="900.0" height="62.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="480.0" y="458.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Кільця полігона: перше — зовнішнє, проти годинникової; наступні — дірки, за годинниковою. Перша й остання позиція кільця збігаються.</tspan></text>
</svg>