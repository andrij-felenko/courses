<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потоковий перетворювач: де саме витрачається пам'ять</text>
<rect x="24.0" y="58.0" width="200.0" height="84.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.9"/><text x="124.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="124.0" dy="0.0">GPX на диску</tspan><tspan x="124.0" dy="16.9">200 МБ</tspan><tspan x="124.0" dy="16.9">1.5 млн точок</tspan></text>
<rect x="262.0" y="58.0" width="186.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.9"/><text x="355.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">буфер читання</tspan><tspan x="355.0" dy="16.9">64 КіБ</tspan><tspan x="355.0" dy="16.9">сталий</tspan></text>
<rect x="496.0" y="58.0" width="214.0" height="84.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.9"/><text x="603.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="603.0" dy="0.0">expat</tspan><tspan x="603.0" dy="16.9">події start · text · end</tspan><tspan x="603.0" dy="16.9">дерева НЕ будує</tspan></text>
<rect x="758.0" y="58.0" width="218.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="867.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="867.0" dy="0.0">stdout</tspan><tspan x="867.0" dy="16.9">GeoJSON тече вперед</tspan><tspan x="867.0" dy="16.9">і не переписується</tspan></text>
<line x1="224.0" y1="100.0" x2="258.0" y2="100.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="448.0" y1="100.0" x2="492.0" y2="100.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="710.0" y1="100.0" x2="754.0" y2="100.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24.0" y="182.0" width="460.0" height="206.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="254.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">стала пам'ять розбору</text>
<text x="46.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">· поточна точка trkpt — близько 180 Б</text>
<text x="46.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">· одна відкладена точка — стільки ж</text>
<text x="46.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">· назва треку — до 512 Б</text>
<text x="46.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">· текст поточного вузла — 128 Б</text>
<text x="46.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">· глибини trk · trkseg · trkpt — три числа</text>
<text x="46.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">разом близько кілобайта — від розміру файлу не залежить</text>
<rect x="516.0" y="182.0" width="460.0" height="206.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="746.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">єдине, що росте</text>
<text x="538.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">· буфер часів для properties</text>
<text x="538.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">· «2026-04-18T07:12:03Z», — 23 Б на точку</text>
<text x="538.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">· 1.5 млн точок — приблизно 35 МБ</text>
<text x="538.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">· скидається на кінці кожного &lt;trk&gt;</text>
<text x="538.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">· прапорець --no-times прибирає й це</text>
<text x="538.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час живе в properties — сусіді geometry, а не в ній</text>
<rect x="24.0" y="424.0" width="460.0" height="116.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="254.0" y="462.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="254.0" dy="0.0">ДЕРЕВО В ПАМ'ЯТІ</tspan><tspan x="254.0" dy="15.6"></tspan><tspan x="254.0" dy="15.6">кожен вузол — окрема структура з покажчиками;</tspan><tspan x="254.0" dy="15.6">пікова пам'ять у кілька разів більша за файл</tspan></text>
<rect x="516.0" y="424.0" width="460.0" height="116.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="746.0" y="462.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="746.0" dy="0.0">ПОТІК ПОДІЙ</tspan><tspan x="746.0" dy="15.6"></tspan><tspan x="746.0" dy="15.6">стала пам'ять плюс 23 Б на точку;</tspan><tspan x="746.0" dy="15.6">вхід читається рівно раз, вихід пишеться рівно раз</tspan></text>
<text x="500.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Файл, більший за пам'ять, не проблема, поки нічого не треба тримати цілим.</text>
</svg>