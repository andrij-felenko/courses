<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура 12-байтового запису атрибута SMART та шкала нормалізації</text>
<rect x="80.0" y="70.0" width="1100.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="104.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">12 байтів запису атрибута в таблиці ATA: [ID: 1B] [Flags: 2B] [Value: 1B] [Worst: 1B] [RAW Value: 6B] [Reserved: 1B]</tspan></text>
<rect x="80.0" y="150.0" width="260.0" height="200.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">RAW Value (6 байтів)</tspan><tspan x="210.0" dy="13.0"></tspan><tspan x="210.0" dy="13.0">Фізичний лічильник мікропрограми:</tspan><tspan x="210.0" dy="13.0">кількість перепризначених секторів,</tspan><tspan x="210.0" dy="13.0">години роботи, температура або помилки.</tspan><tspan x="210.0" dy="13.0">Формат визначає виробник.</tspan></text>
<rect x="360.0" y="150.0" width="260.0" height="200.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Normalized Value (1 байт)</tspan><tspan x="490.0" dy="13.0"></tspan><tspan x="490.0" dy="13.0">Нормалізоване здоров'я (100 або 200):</tspan><tspan x="490.0" dy="13.0">падає від 100/200 до 0 у міру деградації.</tspan><tspan x="490.0" dy="13.0">100 = ідеально, 1 = передсмертний стан.</tspan><tspan x="490.0" dy="13.0">Обчислюється прошивкою.</tspan></text>
<rect x="640.0" y="150.0" width="260.0" height="200.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Worst Value (1 байт)</tspan><tspan x="770.0" dy="13.0"></tspan><tspan x="770.0" dy="13.0">Найгірше зафіксоване значення:</tspan><tspan x="770.0" dy="13.0">найнижчий бал Normalization за всю історію</tspan><tspan x="770.0" dy="13.0">роботи диска. Допомагає виявити</tspan><tspan x="770.0" dy="13.0">минулі пікові перегріви чи збої.</tspan></text>
<rect x="920.0" y="150.0" width="260.0" height="200.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1050.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Threshold (1 байт)</tspan><tspan x="1050.0" dy="13.0"></tspan><tspan x="1050.0" dy="13.0">Критичний поріг відмови:</tspan><tspan x="1050.0" dy="13.0">задається виробником на заводі.</tspan><tspan x="1050.0" dy="13.0">Якщо Value &lt;= Threshold, диск формує</tspan><tspan x="1050.0" dy="13.0">вирок «SMART Trip» (гарантійна заміна).</tspan></text>
<rect x="80.0" y="390.0" width="1100.0" height="270.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="630.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Співвідношення шкали нормалізації та порогу спрацьовування</text>
<rect x="140.0" y="460.0" width="980.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<rect x="140.0" y="460.0" width="300.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="140.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">0 (Повна відмова)</text>
<text x="440.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Threshold (наприклад, 36)</text>
<text x="800.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Normalized Value = 100 (Поточний робочий стан)</text>
<text x="1120.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">200/100 (Завод)</text>
<line x1="440.0" y1="445.0" x2="440.0" y2="515.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,4"/>
<rect x="140.0" y="570.0" width="420.0" height="70.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="592.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">КРИТИЧНА ЗОНА (Pre-fail trip):</tspan><tspan x="350.0" dy="16.9">Value &lt;= Threshold → Відмова неминуча</tspan><tspan x="350.0" dy="16.9">Термінова заміна накопичувача</tspan></text>
<rect x="600.0" y="570.0" width="520.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="592.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">БЕЗПЕЧНА ЗОНА:</tspan><tspan x="860.0" dy="16.9">Value &gt; Threshold → Накопичувач у межах допуску</tspan><tspan x="860.0" dy="16.9">(навіть якщо RAW лічильник містить одиничні збої)</tspan></text>
</svg>