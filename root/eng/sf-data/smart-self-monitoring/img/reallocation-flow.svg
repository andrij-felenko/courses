<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 750" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="750" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл дефектного сектора: перехід між Current Pending та Reallocated</text>
<rect x="430.0" y="70.0" width="400.0" height="70.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="92.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">1. Збій читання сектора (Read Error):</tspan><tspan x="630.0" dy="16.9">ECC / LDPC не може відновити блок даних.</tspan><tspan x="630.0" dy="16.9">Диск повертає системі помилку I/O.</tspan></text>
<line x1="630.0" y1="142.0" x2="630.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380.0" y="190.0" width="500.0" height="80.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="217.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">2. Сектор позначається як нестабільний:</tspan><tspan x="630.0" dy="16.9">Інкремент атрибута C5 (Current Pending Sector Count).</tspan><tspan x="630.0" dy="16.9">Сектор чекає перезапису для перевірки поверхні.</tspan></text>
<line x1="630.0" y1="272.0" x2="630.0" y2="316.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380.0" y="320.0" width="500.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="346.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">3. Хост або утиліта виконує запис у цей LBA:</tspan><tspan x="630.0" dy="16.9">Контролер перевіряє фізичну магнітну ділянку.</tspan></text>
<line x1="460.0" y1="382.0" x2="300.0" y2="436.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="800.0" y1="382.0" x2="960.0" y2="436.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="440.0" width="480.0" height="100.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="469.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Варіант А: Запис успішний (soft error / cosmic ray)</tspan><tspan x="320.0" dy="16.9">• Фізична поверхня виявилася неушкодженою</tspan><tspan x="320.0" dy="16.9">• Декремент C5 (Current Pending Sector -1)</tspan><tspan x="320.0" dy="16.9">• Сектор повертається до звичайного обігу</tspan></text>
<rect x="700.0" y="440.0" width="480.0" height="100.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="470.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">Варіант Б: Фізичний дефект пластини (hard error)</tspan><tspan x="940.0" dy="15.6">• LBA вилучається з активної адресації</tspan><tspan x="940.0" dy="15.6">• Адреса відображається на резервну доріжку (Spare Sector)</tspan><tspan x="940.0" dy="15.6">• Декремент C5 (-1) та інкремент 05 (Reallocated Sector +1)</tspan></text>
<line x1="320.0" y1="542.0" x2="320.0" y2="596.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="940.0" y1="542.0" x2="940.0" y2="596.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="600.0" width="1100.0" height="90.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="632.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Фонове сканування без участі хоста (Offline Data Collection):</tspan><tspan x="630.0" dy="16.9">Якщо нечитабельний сектор виявлено під час внутрішньої фонової перевірки диска,</tspan><tspan x="630.0" dy="16.9">він також збільшує лічильник C6 (Offline Uncorrectable Sector Count).</tspan></text>
</svg>