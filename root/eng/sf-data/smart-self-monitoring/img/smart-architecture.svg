<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях команд опитування SMART від утиліт до накопичувачів</text>
<rect x="80.0" y="70.0" width="1100.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Простір користувача: smartctl / smartd / Prometheus node_exporter</tspan><tspan x="630.0" dy="18.2">(Формування запиту на діагностику або читання журналів здоров'я)</tspan></text>
<line x1="340.0" y1="142.0" x2="340.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="920.0" y1="142.0" x2="920.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="190.0" width="520.0" height="76.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">SATA / SAS: Блоковий вузол /dev/sda або /dev/sg0</tspan><tspan x="340.0" dy="18.2">ioctl(fd, SG_IO, &amp;sg_io_hdr)</tspan></text>
<line x1="340.0" y1="268.0" x2="340.0" y2="312.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="314.0" width="520.0" height="84.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="343.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Драйвер libata / SCSI: Трансляція SAT (INCITS 431)</tspan><tspan x="340.0" dy="16.9">Обгортання ATA PASS-THROUGH (16) 0x85</tspan><tspan x="340.0" dy="16.9">Команда 0xB0 (SMART) + Subcommand 0xD0 (Read Data)</tspan></text>
<line x1="340.0" y1="400.0" x2="340.0" y2="444.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="446.0" width="520.0" height="76.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="479.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Контролер SATA (AHCI / SAS HBA)</tspan><tspan x="340.0" dy="18.2">Передача пакета FIS / Taskfile до диска</tspan></text>
<rect x="660.0" y="190.0" width="520.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">NVMe: Символьний або блоковий вузол /dev/nvme0</tspan><tspan x="920.0" dy="18.2">ioctl(fd, NVME_IOCTL_ADMIN_CMD, &amp;admin_cmd)</tspan></text>
<line x1="920.0" y1="268.0" x2="920.0" y2="312.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="314.0" width="520.0" height="84.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="343.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">Драйвер ядра nvme: Admin Submission Queue (ASQ)</tspan><tspan x="920.0" dy="16.9">Opcode 0x02 (Get Log Page)</tspan><tspan x="920.0" dy="16.9">Log ID 0x02 (SMART / Health Information, 512 байтів)</tspan></text>
<line x1="920.0" y1="400.0" x2="920.0" y2="444.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="446.0" width="520.0" height="76.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="479.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">Шина PCIe: Прямий DMA-запис контролером у буфер процесу</tspan><tspan x="920.0" dy="18.2">Генерація Admin Completion Queue (ACQ)</tspan></text>
<line x1="340.0" y1="524.0" x2="460.0" y2="580.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="920.0" y1="524.0" x2="800.0" y2="580.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="582.0" width="1100.0" height="140.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="622.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Вбудована мікропрограма накопичувача (Firmware)</tspan><tspan x="630.0" dy="16.9">• Опитування термодавачів, лічильників циклів P/E та помилок ECC/LDPC</tspan><tspan x="630.0" dy="16.9">• Керування пулом резервних секторів (Reallocated Sectors) та зносом комірок (Wear Leveling)</tspan><tspan x="630.0" dy="16.9">• Ведення 512-байтових сторінок телеметрії (ATA Attributes Table / NVMe Health Log)</tspan><tspan x="630.0" dy="16.9">• Виконання фонових тестів самодіагностики (Short / Extended / Offline Data Collection)</tspan></text>
</svg>