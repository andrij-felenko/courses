<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 935 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="935" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фази безпростойного розщеплення шарду (Online Shard Splitting Pipeline)</text>
<rect x="30.0" y="70.0" width="200.0" height="260.0" rx="8" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="130.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f8c8d" text-anchor="middle" font-weight="700">Фаза 1: Снапшот + CDC</text>
<text x="40.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="40.0" dy="0.0">1. Фіксація точки у WAL/Binlog</tspan><tspan x="40.0" dy="14.9">2. Фоновий бекфіл (Bulk Copy)</tspan><tspan x="40.0" dy="14.9">3. Усі нові записи продовжують</tspan><tspan x="40.0" dy="14.9">   іти на старий шард S_old</tspan><tspan x="40.0" dy="14.9">4. CDC-потік починає буферизацію</tspan></text>
<rect x="265.0" y="70.0" width="200.0" height="260.0" rx="8" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="365.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Фаза 2: CDC Доганяння</text>
<text x="275.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="275.0" dy="0.0">1. Стрімінг змін із WAL/Binlog</tspan><tspan x="275.0" dy="14.9">2. Паралельне накочення на нові</tspan><tspan x="275.0" dy="14.9">   шарди S_new1 та S_new2</tspan><tspan x="275.0" dy="14.9">3. Лаг реплікації скорочується</tspan><tspan x="275.0" dy="14.9">   з хвилин до &lt; 50 мілісекунд</tspan></text>
<rect x="500.0" y="70.0" width="200.0" height="260.0" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
<text x="600.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f39c12" text-anchor="middle" font-weight="700">Фаза 3: Тіньова верифікація</text>
<text x="510.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="510.0" dy="0.0">1. Порівняння хеш-сум рядків</tspan><tspan x="510.0" dy="14.9">2. Тіньове дублювання читань</tspan><tspan x="510.0" dy="14.9">3. Перевірка цілісності даних</tspan><tspan x="510.0" dy="14.9">4. Підтвердження готовності</tspan><tspan x="510.0" dy="14.9">   нових індексів та буферів</tspan></text>
<rect x="715.0" y="70.0" width="200.0" height="260.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="815.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 4: Атомний Cutover</text>
<text x="725.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="725.0" dy="0.0">1. Захоплення лізи мапи (&lt;5ms)</tspan><tspan x="725.0" dy="14.9">2. Оновлення версії топології</tspan><tspan x="725.0" dy="14.9">3. Роутери перемикають трафік</tspan><tspan x="725.0" dy="14.9">4. S_old переходить у Read-Only</tspan><tspan x="725.0" dy="14.9">5. Повне виведення S_old з дії</tspan></text>
<line x1="232.0" y1="200.0" x2="262.0" y2="200.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="467.0" y1="200.0" x2="497.0" y2="200.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="702.0" y1="200.0" x2="712.0" y2="200.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="460.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Атомне перемикання версії топології в каталозі гарантує нульовий час простою (Zero-Downtime) під час розщеплення</text>
</svg>