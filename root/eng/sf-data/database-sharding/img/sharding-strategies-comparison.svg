<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 940 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="940" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняльний аналіз стратегій розподілу даних між шардами</text>
<rect x="25.0" y="75.0" width="210.0" height="335.0" rx="8" fill="#fefde8" stroke="#d4ac0d" stroke-width="1.5"/>
<text x="130.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d4ac0d" text-anchor="middle" font-weight="700">1. Діапазонний (Range-Based)</text>
<text x="35.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="35.0" dy="0.0">Ключ: ID [1..100k], [100k..200k]</tspan><tspan x="35.0" dy="15.4">• Ідеально для range-сканувань</tspan><tspan x="35.0" dy="15.4">• Немає scatter-gather для відрізків</tspan><tspan x="35.0" dy="15.4">✖ Перекіс: монотонні ключі</tspan><tspan x="35.0" dy="15.4">  б'ють в останній шард (Hotspot)</tspan><tspan x="35.0" dy="15.4">✖ Складний автоспліт меж</tspan></text>
<rect x="255.0" y="75.0" width="210.0" height="335.0" rx="8" fill="#fdeeed" stroke="#c0392b" stroke-width="1.5"/>
<text x="360.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Хеш / Модуло (Hash / Modulo)</text>
<text x="265.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="265.0" dy="0.0">Ключ: hash(ID) mod N</tspan><tspan x="265.0" dy="15.4">• Рівномірне розсіювання даних</tspan><tspan x="265.0" dy="15.4">• Відсутність точок перегріву</tspan><tspan x="265.0" dy="15.4">✖ Зміна N (N → N+1) переміщує</tspan><tspan x="265.0" dy="15.4">  (N-1)/N ключів (шторм міграції)</tspan><tspan x="265.0" dy="15.4">✖ Range-запити йдуть на всі шарди</tspan></text>
<rect x="485.0" y="75.0" width="210.0" height="335.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="590.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Консистентне кільце (Ring)</text>
<text x="495.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="495.0" dy="0.0">Ключ: Ring [0..2³²-1] + Vnodes</tspan><tspan x="495.0" dy="15.4">• При додаванні шарду мігрує</tspan><tspan x="495.0" dy="15.4">  лише 1/N ключів від сусідів</tspan><tspan x="495.0" dy="15.4">• Vnodes згладжують дисперсію</tspan><tspan x="495.0" dy="15.4">✖ Потребує алгоритму lookup</tspan><tspan x="495.0" dy="15.4">✖ Range-запити фрагментовані</tspan></text>
<rect x="710.0" y="75.0" width="210.0" height="335.0" rx="8" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
<text x="815.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2980b9" text-anchor="middle" font-weight="700">4. Каталог / Lookup-таблиця</text>
<text x="720.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="720.0" dy="0.0">Ключ → Shard_ID (Directory)</tspan><tspan x="720.0" dy="15.4">• Абсолютна гнучкість мапінгу</tspan><tspan x="720.0" dy="15.4">• Миттєве ізолювання VIP-клієнта</tspan><tspan x="720.0" dy="15.4">• Легке динамічне дроблення</tspan><tspan x="720.0" dy="15.4">✖ Каталог — критична точка</tspan><tspan x="720.0" dy="15.4">✖ Накладні витрати на кешування</tspan></text>
<text x="460.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Вибір стратегії є компромісом між рівномірністю розсіювання записів та ціною range-запитів і ребалансування</text>
</svg>