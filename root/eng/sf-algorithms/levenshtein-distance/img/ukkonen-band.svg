<text x="620.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a73e8" text-anchor="middle" font-weight="700">1 000 000 клітинок -&gt; 5 000 клітинок (прискорення ×200)</text>
