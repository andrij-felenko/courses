<text x="490.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Асиметричне обчислення відстані (ADC):</text>
<rect x="470.5" y="322.0" width="419.0" height="56.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="340.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Попередньо рахуємо таблицю: DistTable[m][k] = ||q_m - Centroid_m,k||²</tspan><tspan x="680.0" dy="13.0">Для кожного вектора бази: Dist(q, x) = ∑ DistTable[m][x_code[m]]</tspan><tspan x="680.0" dy="13.0">Замість 768 множень float32 — рівно 8 читань із таблиці та 8 доданків!</tspan></text>
<rect x="515.0" y="422.5" width="330.0" height="43.0" rx="6" fill="#e8effb" stroke="#2457d6" stroke-width="1.5"/><text x="680.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Швидкість: мільйони векторів/с на 1 ядрі CPU</tspan><tspan x="680.0" dy="13.0">завдяки векторним інструкціям SIMD (AVX2/AVX-512).</tspan></text>
