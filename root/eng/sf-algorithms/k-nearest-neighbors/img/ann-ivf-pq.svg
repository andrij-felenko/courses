<text x="490.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Вектор 768 float32 (3072 байти) ділиться на M=8 підпросторів:</text>
