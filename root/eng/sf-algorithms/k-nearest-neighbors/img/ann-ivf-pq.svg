<text x="695.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Кожен v_m квантується у k*=256 центроїдів (1 байт)</text>
<text x="490.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Стиснений код у пам'яті: 8 байтів (стиснення 384×!):</text>
