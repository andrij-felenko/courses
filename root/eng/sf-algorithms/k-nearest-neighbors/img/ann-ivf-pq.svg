<rect x="50.5" y="422.5" width="379.1" height="43.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Знаходимо nprobe=2 найближчі центроїди (C₂, C₄).</tspan><tspan x="240.0" dy="13.0">Скануємо лише їхні інвертовані списки (відсікаємо 60–95% бази).</tspan></text>
