<text x="380.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">Точка a1 лежить поруч</tspan><tspan x="380.0" dy="13.0">із точкою b1 (зсув -3..+3)</tspan><tspan x="380.0" dy="13.0">Найчастіший випадок у тексті</tspan></text>
<text x="380.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">V(0)='1', VR(1)='011'...</text>
<text x="380.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсув: a0 := a1</text>
