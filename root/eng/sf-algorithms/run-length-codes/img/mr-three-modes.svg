<text x="620.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="620.0" dy="0.0">Новий елемент рядка,</tspan><tspan x="620.0" dy="13.0">вертикальна кореляція</tspan><tspan x="620.0" dy="13.0">відсутня або завелика</tspan></text>
<text x="620.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Код: 001 + MH(a0a1) + MH(a1a2)</text>
