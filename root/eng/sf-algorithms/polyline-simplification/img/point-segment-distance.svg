<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="80.0" y1="220.0" x2="250.0" y2="220.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="550.0" y1="220.0" x2="720.0" y2="220.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="250.0" y1="220.0" x2="550.0" y2="220.0" stroke="#1a1a1a" stroke-width="3.0"/>
<circle cx="250.0" cy="220.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.5"/>
<circle cx="550.0" cy="220.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.5"/>
<text x="250.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A (t = 0)</text>
<text x="550.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B (t = 1)</text>
<line x1="290.0" y1="208.0" x2="510.0" y2="208.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">Вектор v = B − A</text>
<circle cx="160.0" cy="90.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="0.5"/>
<text x="160.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">P₁ (t &lt; 0)</text>
<line x1="160.0" y1="90.0" x2="250.0" y2="220.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="3,3"/>
<text x="135.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">dist = |P₁ − A|</text>
<line x1="160.0" y1="90.0" x2="160.0" y2="220.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="2,2"/>
<circle cx="160.0" cy="220.0" r="3.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="160.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">H₁ (поза AB)</text>
<circle cx="400.0" cy="70.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.5"/>
<text x="400.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">P₂ (0 ≤ t ≤ 1)</text>
<line x1="400.0" y1="70.0" x2="400.0" y2="220.0" stroke="#c0392b" stroke-width="2.2"/>
<rect x="390.0" y="210.0" width="10.0" height="10.0" rx="0" fill="none" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="400.0" cy="220.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.5"/>
<text x="414.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">dist = |P₂ − H₂| (ортогональ)</text>
<text x="400.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">H₂ = A + t·v</text>
<circle cx="640.0" cy="100.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="0.5"/>
<text x="640.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">P₃ (t &gt; 1)</text>
<line x1="640.0" y1="100.0" x2="550.0" y2="220.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="3,3"/>
<text x="665.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">dist = |P₃ − B|</text>
<line x1="640.0" y1="100.0" x2="640.0" y2="220.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="2,2"/>
<circle cx="640.0" cy="220.0" r="3.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="640.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">H₃ (поза AB)</text>
<rect x="39.7" y="313.2" width="720.5" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Формула параметра проекції: t = ((P − A) · (B − A)) / |B − A|²</tspan><tspan x="400.0" dy="15.6">Якщо t &lt; 0: найближча точка A;  якщо t &gt; 1: найближча точка B;  якщо 0 ≤ t ≤ 1: основа перпендикуляра H</tspan></text>
</svg>