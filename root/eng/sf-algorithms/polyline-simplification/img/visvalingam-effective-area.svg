<rect x="26.1" y="310.4" width="747.9" height="59.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Ефективна площа трикутника: A(Pᵢ) = ½ |(Pᵢ₋₁ − Pᵢ₊₁) × (Pᵢ − Pᵢ₊₁)|</tspan><tspan x="400.0" dy="15.6">Пріоритетна черга послідовно видаляє вершину з найменшою площею трикутника (P₂), з'єднуючи сусідів P₁ і P₃.</tspan><tspan x="400.0" dy="15.6">Це згладжує дрібний шум без утворення гострих неприродних зламів.</tspan></text>
