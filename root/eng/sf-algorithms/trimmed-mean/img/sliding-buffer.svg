<rect x="485.9" y="114.5" width="258.3" height="131.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Покрокове оновлення O(W):</tspan><tspan x="615.0" dy="14.3">1. Знайти позицію старого відліку</tspan><tspan x="615.0" dy="14.3">   у відсортованому списку (бінпошук);</tspan><tspan x="615.0" dy="14.3">2. Вилучити його зсувом масиву;</tspan><tspan x="615.0" dy="14.3">3. Вставити новий відлік на належне</tspan><tspan x="615.0" dy="14.3">   місце зі збереженням сортування;</tspan><tspan x="615.0" dy="14.3">4. Додати елементи в межах [k, W-k-1]</tspan><tspan x="615.0" dy="14.3">   та поділити на (W - 2k).</tspan></text>
