<text x="505.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">• h=1 (Батьки листків, 25%):</text>
<text x="725.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">≤ 1 спуск</text>
<text x="505.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">• h=2 (Корінь, 1 вузол):</text>
<text x="725.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">≤ 2 спуски</text>
<line x1="505.0" y1="172.0" x2="730.0" y2="172.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="617.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Сумарно: S = N ∑ (h / 2ʰ) ≤ 2N</text>
<text x="617.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Складність побудови: O(N)</text>
<text x="380.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм Флойда починає з індексу i = ⌊N/2⌋ − 1 і рухається до 0 (Bottom-Up).</text>
<text x="380.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Маса вузлів зосереджена внизу, тому переважна більшість виконує 0 або 1 спуск!</text>
