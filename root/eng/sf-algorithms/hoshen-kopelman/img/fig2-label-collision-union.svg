<rect x="0.0" y="0.0" width="840.0" height="410.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="420.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вирішення колізії міток: замикання кластера та операція Union</text><text x="190.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0284c7" text-anchor="middle" font-weight="700">Топологічне замикання (U-контур)</text><rect x="80.0" y="95.0" width="44.0" height="44.0" rx="4" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.2"/><text x="102.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text><rect x="124.0" y="95.0" width="44.0" height="44.0" rx="4" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.2"/><text x="146.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text><rect x="168.0" y="95.0" width="44.0" height="44.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="190.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="212.0" y="95.0" width="44.0" height="44.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/><text x="234.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text><rect x="256.0" y="95.0" width="44.0" height="44.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/><text x="278.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text><rect x="80.0" y="139.0" width="44.0" height="44.0" rx="4" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.2"/><text