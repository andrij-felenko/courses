t-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">X</text><rect x="212.0" y="183.0" width="44.0" height="44.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/><text x="234.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text><rect x="256.0" y="183.0" width="44.0" height="44.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/><text x="278.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text><rect x="70.0" y="245.0" width="240.0" height="140.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="190.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Міст у точці X (i, j):</text><text x="190.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Top = 0, Left = 1 (корінь 1)</text><text x="190.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Right = 2 (корінь 2)</text><text x="190.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="700">Різні мітки об'єднуються:</text><text x="190.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">union(1, 2) без повернення назад!</text><line x1="340.0" y1="200.0" x2="410.0" y2="200.0" stroke="#64748b" stroke-width="3.0" marker-end="url(#arrow)"/><text x="375.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">Злиття</text><text x="620.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0284c7" text-anchor="middle" font-weight="700">Масив еквівалентностей та розмірів labels[]</text><text x="450.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">До обробки сайту X:</text><rect x="450.0" y="120.0" width="68.0" height="26.0" rx="6" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="484.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мітка (k)</text><rect x="450.0" y="146.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="484.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">labels[k]</text><rect x="518.0" y="120.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="552.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1</text><rect x="518.0" y="146.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="552.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="700">-5</text><rect x="586.0" y="120.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="620.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2</text><rect x="586.0" y="146.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="620.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="700">-4</text><rect x="654.0" y="120.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3</text><rect x="654.0" y="146.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1</text><rect x="722.0" y="120.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="756.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">4</text><rect x="722.0" y="146.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="756.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">2</text><text x="450.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Корінь 1: розмір = |-5| = 5    |    Корінь 2: розмір = |-4| = 4</text><text x="450.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Після union(1, 2) і додавання сайту X:</text><rect x="450.0" y="250.0" width="68.0" height="26.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="484.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мітка (k)</text><rect x="450.0" y="276.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="484.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">labels[k]</text><rect x="518.0" y="250.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="552.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1</text><rect x="518.0" y="276.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/><text x="552.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">-10</text><rect x="586.0" y="250.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="620.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2</text><rect x="586.0" y="276.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/><text x="620.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1</text><rect x="654.0" y="250.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3</text><rect x="654.0" y="276.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1</text><rect x="722.0" y="250.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="756.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">4</text><rect x="722.0" y="276.0" width="68.0" height="26.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="756.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">2</text><text x="450.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">1. Сума розмірів: labels[1] = (-5) + (-4) - 1 = -10 (новий розмір 10)</text><text x="450.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="start" font-weight="700">2. Перепризначення батька: labels[2] = 1 (корінь 2 підпорядковано кореню 1)</text><text x="450.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">3. Стиснення шляхів (Path Compression) робить наступні find(4) = O(1)</text>
