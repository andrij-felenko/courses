"#ffffff" stroke="#e2e8f0" stroke-width="0.8"/><rect x="265.0" y="278.0" width="38.0" height="38.0" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/><rect x="303.0" y="278.0" width="38.0" height="38.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/><text x="322.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">S</text><rect x="75.0" y="316.0" width="38.0" height="38.0" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0"/><text x="94.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle">6</text><rect x="113.0" y="316.0" width="38.0" height="38.0" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0"/><text x="132.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle">6</text><rect x="151.0" y="316.0" width="38.0" height="38.0" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/><rect x="189.0" y="316.0" width="38.0" height="38.0" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0"/><text x="208.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle">7</text><rect x="227.0" y="316.0" width="38.0" height="38.0" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0"/><text x="246.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle">7</text><rect x="265.0" y="316.0" width="38.0" height="38.0" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/><rect x="303.0" y="316.0" width="38.0" height="38.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/><text x="322.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">S</text><line x1="50.0" y1="95.0" x2="50.0" y2="345.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="43.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">Протікання (Top ↔ Bottom)</text><text x="600.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові статистичні характеристики</text><rect x="400.0" y="95.0" width="400.0" height="85.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/><circle cx="416.0" cy="115.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Розподіл за розмірами n_s(p)</text><text x="430.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Число кластерів розміру s на один вузол ґратки.</text><text x="430.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">При p = p_c спадає за степеневим законом: n_s ∝ s^(-τ)</text><text x="430.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">де для 2D систем критичний індекс τ = 187/91 ≈ 2.05.</text><rect x="400.0" y="193.0" width="400.0" height="85.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/><circle cx="416.0" cy="213.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Радіус гірації R_s (просторова протяжність)</text><text x="430.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Середньоквадратична відстань між сайтами всередині кластера:</text><text x="430.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">R_s² = (1 / 2s²) ∑ |r_i - r_j|² ∝ s^(1/d_f)</text><text x="430.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">де d_f = 91/48 ≈ 1.896 — фрактальна розмірність кластера.</text><rect x="400.0" y="291.0" width="400.0" height="85.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.5"/><circle cx="416.0" cy="311.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Критерій перколації (Spanning Condition)</text><text x="430.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Кластер вважається протікаючим, якщо він одночасно містить</text><text x="430.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">сайти на протилежних границях системи (x=0 та x=L-1),</text><text x="430.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">забезпечуючи макроскопічну провідність середовища.</text>
</svg>