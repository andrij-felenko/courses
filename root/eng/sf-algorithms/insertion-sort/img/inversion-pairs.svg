<text x="307.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">I = 0 (без (4,3))</text>
<rect x="520.0" y="65.0" width="320.0" height="240.0" rx="6" fill="#f8f9fa" stroke="#cfd8dc" stroke-width="1.5"/><text x="680.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Фундаментальна теорема про інверсії:</tspan><tspan x="680.0" dy="11.7"></tspan><tspan x="680.0" dy="11.7">• Інверсія — це пара (i, j), де i &lt; j, але A[i] &gt; A[j].</tspan><tspan x="680.0" dy="11.7"></tspan><tspan x="680.0" dy="11.7">• Кожен елементарний зсув суміжних елементів</tspan><tspan x="680.0" dy="11.7">  зменшує число інверсій I рівно на 1.</tspan><tspan x="680.0" dy="11.7"></tspan><tspan x="680.0" dy="11.7">• Загальна кількість зсувів = точна кількість інверсій I.</tspan><tspan x="680.0" dy="11.7"></tspan><tspan x="680.0" dy="11.7">• Час роботи: T(N) = O(N + I).</tspan><tspan x="680.0" dy="11.7"></tspan><tspan x="680.0" dy="11.7">• Якщо масив k-майже відсортований (I ≤ k·N),</tspan><tspan x="680.0" dy="11.7">  алгоритм працює за O(k·N) = O(N).</tspan></text>
</svg>