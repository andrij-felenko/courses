<rect x="140.0" y="276.0" width="38.0" height="34.0" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/><text x="159.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<rect x="178.0" y="276.0" width="38.0" height="34.0" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/><text x="197.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
