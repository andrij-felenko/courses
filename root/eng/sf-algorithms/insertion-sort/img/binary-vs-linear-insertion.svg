<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння лінійного та двійкового сортування вставками</text>
<rect x="50.0" y="60.0" width="350.0" height="260.0" rx="6" fill="#fcfcfc" stroke="#b0bec5" stroke-width="1.5"/>
<text x="225.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінійні вставки (Linear Insertion)</text>
<line x1="70.0" y1="102.0" x2="380.0" y2="102.0" stroke="#cfd8dc" stroke-width="1.0"/>
<rect x="65.0" y="115.0" width="320.0" height="185.0" rx="6" fill="#ffffff" stroke="#eceff1" stroke-width="1.5"/><text x="225.0" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Пошук позиції суміщений зі зсувом:</tspan><tspan x="225.0" dy="14.3"></tspan><tspan x="225.0" dy="14.3">• Рухаємося справа наліво: A[j] &gt; key.</tspan><tspan x="225.0" dy="14.3">• Кожне порівняння супроводжується зсувом.</tspan><tspan x="225.0" dy="14.3"></tspan><tspan x="225.0" dy="14.3">Складність:</tspan><tspan x="225.0" dy="14.3">• Порівняння: O(N²) у середньому / найгіршому.</tspan><tspan x="225.0" dy="14.3">• Порівняння в найкращому: O(N) (1 на крок!).</tspan><tspan x="225.0" dy="14.3">• Зсуви пам'яті: O(N²).</tspan><tspan x="225.0" dy="14.3"></tspan><tspan x="225.0" dy="14.3">Ідеально: для майже впорядкованих даних.</tspan></text>
<rect x="440.0" y="60.0" width="350.0" height="260.0" rx="6" fill="#fcfcfc" stroke="#b0bec5" stroke-width="1.5"/>
<text x="615.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійкові вставки (Binary Insertion)</text>
<line x1="460.0" y1="102.0" x2="770.0" y2="102.0" stroke="#cfd8dc" stroke-width="1.0"/>
<rect x="455.0" y="115.0" width="320.0" height="185.0" rx="6" fill="#ffffff" stroke="#eceff1" stroke-width="1.5"/><text x="615.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Пошук позиції відокремлений від зсуву:</tspan><tspan x="615.0" dy="11.7"></tspan><tspan x="615.0" dy="11.7">• Позиція шукається бінарним пошуком у A[0..i-1].</tspan><tspan x="615.0" dy="11.7">• Після знаходження — блоковий зсув (memmove).</tspan><tspan x="615.0" dy="11.7"></tspan><tspan x="615.0" dy="11.7">Складність:</tspan><tspan x="615.0" dy="11.7">• Порівняння: O(N log N) завжди (навіть у найгіршому!).</tspan><tspan x="615.0" dy="11.7">• Порівняння в найкращому: O(N log N) (не адаптивне!).</tspan><tspan x="615.0" dy="11.7">• Зсуви пам'яті: O(N²).</tspan><tspan x="615.0" dy="11.7"></tspan><tspan x="615.0" dy="11.7">Ідеально: коли операція порівняння дорога (рядки, об'єкти).</tspan></text>
</svg>