<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 900 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="900" height="410" fill="#ffffff"/>
