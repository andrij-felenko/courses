<rect x="0.0" y="0.0" width="880.0" height="390.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метод заміни (Exchange Argument) для доведення оптимальності</text>
<text x="100.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Жадібний розв'язок G:</text>
