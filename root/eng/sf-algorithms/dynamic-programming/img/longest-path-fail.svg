<text x="64.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Справжній найдовший  q → t  =  q-r-s-t  (3 ребра) — його половини q-r-s (2) і s-t (1) НЕ найдовші. Оптимум цілого зібрано з НЕоптимальних частин: підструктура не діє.</text>
