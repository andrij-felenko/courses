<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="430.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таблиця підзадач: dp[a] — найменше монет на суму a  (монети 1, 3, 4)</text>
<rect x="183.0" y="250.0" width="66.0" height="66.0" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="216.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">a = 0</text>
<text x="216.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<rect x="261.0" y="250.0" width="66.0" height="66.0" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.6"/>
<text x="294.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">a = 1</text>
<text x="294.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#555a63" text-anchor="middle" font-weight="700">1</text>
<rect x="339.0" y="250.0" width="66.0" height="66.0" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.6"/>
<text x="372.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">a = 2</text>
<text x="372.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#555a63" text-anchor="middle" font-weight="700">2</text>
<rect x="417.0" y="250.0" width="66.0" height="66.0" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="450.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">a = 3</text>
<text x="450.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<rect x="495.0" y="250.0" width="66.0" height="66.0" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.6"/>
<text x="528.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">a = 4</text>
<text x="528.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#555a63" text-anchor="middle" font-weight="700">1</text>
<rect x="573.0" y="250.0" width="66.0" height="66.0" rx="8" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.6"/>
<text x="606.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">a = 5</text>
<text x="606.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#555a63" text-anchor="middle" font-weight="700">2</text>
<rect x="651.0" y="250.0" width="66.0" height="66.0" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="684.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">a = 6</text>
<text x="684.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<path d="M 606.0 250.0 Q 645.0 206.0 684.0 250.0" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="645.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">монета 1</text>
<text x="645.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">dp[5]=2</text>
<path d="M 372.0 250.0 Q 528.0 100.0 684.0 250.0" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="528.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">монета 4</text>
<text x="528.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">dp[2]=2</text>
<path d="M 450.0 250.0 Q 567.0 154.0 684.0 250.0" fill="none" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="567.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">монета 3  ✓</text>
<text x="567.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">dp[3]=1</text>
<text x="450.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">dp[6] = 1 + min( dp[5], dp[3], dp[2] ) = 1 + 1 = 2   — найдешевше через dp[3], монетою 3</text>
<text x="183.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">відновлення:</text>
<text x="450.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">6  →  3  →  0</text>
<text x="717.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">монети  {3, 3}</text>
<text x="450.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Клітин лише сім — кожну підзадачу пораховано рівно раз.</text>
</svg>