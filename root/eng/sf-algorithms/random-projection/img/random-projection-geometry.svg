<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 900 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="900" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збереження попарних відстаней при випадковому проєктуванні</text>
<rect x="0.0" y="0.0" width="880.0" height="420.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="40.0" y="50.0" width="360.0" height="320.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="220.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Початковий простір Rᵈ (d = 1000+)</text>
<line x1="130.0" y1="180.0" x2="300.0" y2="160.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="130.0" y1="180.0" x2="220.0" y2="300.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="4 3"/>
<line x1="300.0" y1="160.0" x2="220.0" y2="300.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4 3"/>
<circle cx="130.0" cy="180.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.6"/>
<circle cx="300.0" cy="160.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.6"/>
<circle cx="220.0" cy="300.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.6"/>
<text x="116.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">u</text>
<text x="314.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">v</text>
<text x="220.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">w</text>
<text x="215.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">||u - v|| = L</text>
<line x1="420.0" y1="210.0" x2="495.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="460.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">f(x) = R·x / √k</text>
<text x="460.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Випадкова</text>
<text x="460.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">матриця R</text>
<rect x="520.0" y="50.0" width="360.0" height="320.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="700.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проєктований простір Rᵏ (k ≈ 100)</text>
<line x1="605.0" y1="185.0" x2="785.0" y2="155.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="605.0" y1="185.0" x2="695.0" y2="295.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="4 3"/>
<line x1="785.0" y1="155.0" x2="695.0" y2="295.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4 3"/>
<circle cx="605.0" cy="185.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.6"/>
<circle cx="785.0" cy="155.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.6"/>
<circle cx="695.0" cy="295.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.6"/>
<text x="589.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">f(u)</text>
<text x="803.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">f(v)</text>
<text x="695.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">f(w)</text>
<text x="695.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">||f(u) - f(v)|| ≈ L ± εL</text>
<text x="440.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Всі попарні відстані зберігаються з відносною похибкою не більше ε</text>
</svg>