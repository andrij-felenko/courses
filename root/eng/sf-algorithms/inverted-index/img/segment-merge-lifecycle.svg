<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сегментна архітектура оновлень: буфер у пам'яті, незмінні сегменти та Merge</text>
<rect x="20.0" y="55.0" width="270.0" height="310.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="155.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Буферизація в RAM</text>
<text x="155.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Нові документи та видалення</text>
<rect x="40.0" y="120.0" width="230.0" height="50.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="155.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">In-Memory Index Buffer</text>
<text x="155.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Накопичення (RAM)</text>
<rect x="40.0" y="190.0" width="230.0" height="50.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.2"/>
<text x="155.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Pending Deletes</text>
<text x="155.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Бітова маска видалень</text>
<line x1="155.0" y1="250.0" x2="155.0" y2="285.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="155.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Flush / Commit</text>
<rect x="35.0" y="290.0" width="240.0" height="65.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="155.0" y="312.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="155.0" dy="0.0">Скидання буфера на диск</tspan><tspan x="155.0" dy="13.7">кожні 1–30 с або при 512 MB</tspan><tspan x="155.0" dy="13.7">у вигляді нового сегмента.</tspan></text>
<line x1="295.0" y1="145.0" x2="335.0" y2="145.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="340.0" y="55.0" width="275.0" height="310.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="477.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Незмінні сегменти (Disk)</text>
<text x="477.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Immutable Segment Files</text>
<rect x="360.0" y="120.0" width="235.0" height="42.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="477.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сегмент _0 (10k docs)</text>
<rect x="360.0" y="175.0" width="235.0" height="42.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="477.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сегмент _1 (15k docs)</text>
<rect x="360.0" y="230.0" width="235.0" height="42.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="477.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сегмент _2 (8k docs)</text>
<rect x="360.0" y="285.0" width="235.0" height="42.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.2"/>
<text x="477.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сегмент _3 (новий)</text>
<line x1="620.0" y1="200.0" x2="660.0" y2="200.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="640.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Merge</text>
<rect x="665.0" y="55.0" width="275.0" height="310.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="802.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">3. Фоновий Segment Merge</text>
<text x="802.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Каскадне об'єднання файлів</text>
<rect x="685.0" y="120.0" width="235.0" height="120.0" rx="6" fill="#f3e8ff" stroke="#8e44ad" stroke-width="1.5"/>
<text x="802.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">Об'єднаний Сегмент _merged</text>
<text x="802.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">33k активних документів</text>
<text x="802.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">• Видалені DocID фізично стерті</text>
<text x="802.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">• Постинги впорядковані</text>
<rect x="685.0" y="255.0" width="235.0" height="95.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="802.5" y="293.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="802.5" dy="0.0">Старі сегменти _0, _1, _2 видаляються з файлової системи.</tspan><tspan x="802.5" dy="11.7">Кількість відкритих дескрипторів файлів зменшується,</tspan><tspan x="802.5" dy="11.7">швидкість пошуку відновлюється.</tspan></text>
<rect x="20.0" y="380.0" width="920.0" height="100.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="480.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Паралельне виконання пошукового запиту (Read Path):</text>
<rect x="40.0" y="415.0" width="880.0" height="55.0" rx="6" fill="#f0fdf4" stroke="none" stroke-width="1.5"/><text x="480.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Запит шукає одночасно по всіх активних незмінних сегментах без блокування запису.</tspan><tspan x="480.0" dy="14.3">Результати фільтруються за локальними бітовими масками видалення (.del) та зливаються в єдиний Top-K скор.</tspan></text>
</svg>