<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">RANSAC: вгадай по дрібці — хай решта проголосує — лиши найкраще</text>
