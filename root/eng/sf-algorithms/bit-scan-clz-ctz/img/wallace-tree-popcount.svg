<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне дерево Воллеса для Popcount</text>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне компресорне дерево Воллеса для інструкції POPCNT</text>
<rect x="60.0" y="65.0" width="720.0" height="36.0" rx="4" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="420.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Вхідний регістр: 64 одиничні біти однакової ваги (вага 2⁰ = 1)</text>
<rect x="140.0" y="130.0" width="560.0" height="48.0" rx="6" fill="#fdf6e7" stroke="#d97706" stroke-width="1.4"/>
<text x="420.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Рівень 1: Двадцять один повний суматор 3:2 (CSA Compressors)</text>
<text x="420.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">64 входи (21 × 3 + 1) → 21 біт суми (вага 1) + 21 біт переносу (вага 2) + 1 = 43 біти</text>
<line x1="420.0" y1="101.0" x2="420.0" y2="130.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="190.0" y="205.0" width="460.0" height="44.0" rx="6" fill="#fdf6e7" stroke="#d97706" stroke-width="1.4"/>
<text x="420.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Рівень 2: Чотирнадцять суматорів 3:2 (43 → 29 бітів)</text>
<text x="420.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Розподіл бітів за вагами 2⁰, 2¹, 2² без розповсюдження переносу</text>
<line x1="420.0" y1="178.0" x2="420.0" y2="205.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="240.0" y="275.0" width="360.0" height="44.0" rx="6" fill="#fdf6e7" stroke="#d97706" stroke-width="1.4"/>
<text x="420.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Рівні 3–5: Подальша компресія (29 → 20 → 14 → 9 бітів)</text>
<text x="420.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Зведення до двох фінальних 7-бітних векторів (Сума S та Перенос C)</text>
<line x1="420.0" y1="249.0" x2="420.0" y2="275.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="260.0" y="345.0" width="320.0" height="50.0" rx="6" fill="#f2faf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="420.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фінальний 7-бітний суматор (CLA Adder)</text>
<text x="420.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Результат: число 0..64 (7 бітів у цільовому регістрі)</text>
<line x1="420.0" y1="319.0" x2="420.0" y2="345.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="420.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Компресори 3:2 додають розряди паралельно на кожному ярусі без затримки ripple carry.</tspan><tspan x="420.0" dy="16.8">У сучасних ядрах (x86 Golden Cove, Zen 4, Apple M-серія) блок POPCNT має латентність 1 такт і темп 1 такт.</tspan></text>
</svg>