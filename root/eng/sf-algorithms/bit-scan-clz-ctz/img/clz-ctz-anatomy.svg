<text x="674.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">CTZ = 4 нулі</text>
<line x1="222.5" y1="168.0" x2="222.5" y2="142.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="222.5" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Старша 1 (MSB, біт 12)</text>
<rect x="40.0" y="210.0" width="360.0" height="105.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.4"/>
<text x="220.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">CLZ та двійковий логарифм</text>
<text x="56.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Старший біт: MSB = (W - 1) - CLZ(x)</text>
<text x="56.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Цілий логарифм: ⌊log₂(x)⌋ = 15 - 3 = 12</text>
<text x="56.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Застосування: класи пам'яті, стелі 2ⁿ</text>
<rect x="440.0" y="210.0" width="360.0" height="105.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.4"/>
<text x="620.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">CTZ та ізоляція бітів</text>
<text x="456.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Ізоляція молодшого біта: x &amp; (-x) = 1 &lt;&lt; 4</text>
<text x="456.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Скидання молодшого біта: x &amp; (x - 1)</text>
<text x="456.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Застосування: черги задач, бітборди</text>
<rect x="40.0" y="335.0" width="760.0" height="75.0" rx="6" fill="#fdfbf7" stroke="#c0392b" stroke-width="1.4"/>
<text x="420.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Population Count (Popcount / Вага Геммінга)</text>
<text x="60.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Підрахунок усіх встановлених бітів: popcount(x) = 5 (сума ваг усіх розрядів дорівнює 5)</text>
<text x="60.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Відмінність від CLZ/CTZ: сканує все слово, а не лише зупиняється на першій одиниці</text>
<text x="420.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">CLZ рахує нулі від старшого краю (MSB), CTZ — від молодшого (LSB).</tspan><tspan x="420.0" dy="16.8">Апаратні інструкції виконують кожну з цих дій за константний час O(1) за 1 такт процесора.</tspan></text>
</svg>