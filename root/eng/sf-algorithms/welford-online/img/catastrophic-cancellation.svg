<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Втрата точності в наївній формулі та числовий захист Велфорда</text>
<rect x="40.0" y="50.0" width="800.0" height="155.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<text x="440.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Наївне однопрохідне обчислення: віднімання гігантських сум</text>
<rect x="70.0" y="100.0" width="320.0" height="50.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="230.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сума квадратів: S2 = ∑ x_i²</text>
<text x="230.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">≈ 10 000 000 000 000 000.12</text>
<text x="410.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<rect x="430.0" y="100.0" width="320.0" height="50.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="590.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квадрат суми: S1² / n</text>
<text x="590.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">≈ 10 000 000 000 000 000.00</text>
<text x="440.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Різниця двох чисел порядку 10¹⁶ знищує молодші біти мантиси → дисперсія стає від'ємною або нульовою</text>
<rect x="40.0" y="230.0" width="800.0" height="160.0" rx="6" fill="#f4faf6" stroke="#27ae60" stroke-width="1.8"/>
<text x="440.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Стійкий підхід Велфорда: накопичення локальних відхилень δ</text>
<rect x="70.0" y="280.0" width="210.0" height="52.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="175.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відхилення δ</text>
<text x="175.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">δ = x_k − μ_{k−1}</text>
<line x1="285.0" y1="306.0" x2="335.0" y2="306.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340.0" y="280.0" width="210.0" height="52.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="445.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсув середнього μ_k</text>
<text x="445.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">μ_k = μ_{k−1} + δ / k</text>
<line x1="555.0" y1="306.0" x2="605.0" y2="306.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="610.0" y="280.0" width="200.0" height="52.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="710.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Накопичення M2</text>
<text x="710.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">M2_k = M2_{k−1} + δ·(x_k − μ_k)</text>
<text x="440.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Числа залишаються масштабу розсіювання (δ ≈ σ) — мантиса зберігає всі 53 біти точності</text>
</svg>