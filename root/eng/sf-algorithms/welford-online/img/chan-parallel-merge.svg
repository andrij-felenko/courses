<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Деревоподібна паралельна редукція статистик за формулами Чена</text>
<rect x="80.0" y="60.0" width="120.0" height="55.0" rx="5" fill="#f0f4f8" stroke="#333333" stroke-width="1.4"/>
<text x="140.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блок A</text>
<text x="140.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n_A, μ_A, M2_A</text>
<rect x="280.0" y="60.0" width="120.0" height="55.0" rx="5" fill="#f0f4f8" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блок B</text>
<text x="340.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n_B, μ_B, M2_B</text>
<rect x="480.0" y="60.0" width="120.0" height="55.0" rx="5" fill="#f0f4f8" stroke="#333333" stroke-width="1.4"/>
<text x="540.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блок C</text>
<text x="540.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n_C, μ_C, M2_C</text>
<rect x="680.0" y="60.0" width="120.0" height="55.0" rx="5" fill="#f0f4f8" stroke="#333333" stroke-width="1.4"/>
<text x="740.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блок D</text>
<text x="740.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n_D, μ_D, M2_D</text>
<line x1="140.0" y1="115.0" x2="210.0" y2="175.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340.0" y1="115.0" x2="270.0" y2="175.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540.0" y1="115.0" x2="610.0" y2="175.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="740.0" y1="115.0" x2="670.0" y2="175.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180.0" y="180.0" width="200.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="280.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Злиття AB</text>
<text x="280.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">n_AB = n_A + n_B</text>
<text x="280.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">M2_AB = M2_A + M2_B + Δ²·(n_A·n_B / n_AB)</text>
<rect x="580.0" y="180.0" width="200.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="680.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Злиття CD</text>
<text x="680.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">n_CD = n_C + n_D</text>
<text x="680.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">M2_CD = M2_C + M2_D + Δ²·(n_C·n_D / n_CD)</text>
<line x1="280.0" y1="248.0" x2="400.0" y2="305.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="248.0" x2="480.0" y2="305.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="305.0" width="220.0" height="75.0" rx="6" fill="#f4faf6" stroke="#27ae60" stroke-width="2.0"/>
<text x="440.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Підсумкова статистика ABCD</text>
<text x="440.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дисперсія: s² = M2_total / (N − 1)</text>
<text x="440.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Складність об'єднання: O(log P) паралельних кроків</text>
</svg>