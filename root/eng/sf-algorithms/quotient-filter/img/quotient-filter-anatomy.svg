<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія квошієнтного фільтра: розщеплення хешу та структура слота</text>
<rect x="85.7" y="62.0" width="88.5" height="45.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Ключ x</tspan><tspan x="130.0" dy="16.9">&quot;user_42&quot;</tspan></text>
<line x1="205.0" y1="85.0" x2="275.0" y2="85.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">hash(x)</text>
<rect x="280.0" y="60.0" width="380.0" height="50.0" rx="4" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/>
<text x="470.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Повний 64-бітний хеш h(x) (розмір p = q + r бітів)</text>
<rect x="290.0" y="83.0" width="170.0" height="22.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="375.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">q бітів: частка (quotient)</text>
<rect x="470.0" y="83.0" width="180.0" height="22.0" rx="3" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.2"/>
<text x="560.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">r бітів: залишок (remainder)</text>
<line x1="375.0" y1="110.0" x2="375.0" y2="160.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560.0" y1="110.0" x2="560.0" y2="240.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255.1" y="156.4" width="239.7" height="57.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="375.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">Канонічний індекс слота:</tspan><tspan x="375.0" dy="15.6">canonical_slot = f_q = h(x) &gt;&gt; r</tspan><tspan x="375.0" dy="15.6">(адресація 2^q комірок у таблиці)</tspan></text>
<text x="470.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будова окремого слота таблиці (розмір: r + 3 біти)</text>
<rect x="100.0" y="290.0" width="740.0" height="100.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="115.0" y="305.0" width="140.0" height="70.0" rx="4" fill="#fff2e8" stroke="#fa541c" stroke-width="1.2"/>
<text x="185.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#fa541c" text-anchor="middle" font-weight="700">is_occupied</text>
<text x="185.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 біт: чи є елементи</text>
<text x="185.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">з канонічним f_q = i</text>
<rect x="265.0" y="305.0" width="140.0" height="70.0" rx="4" fill="#f9f0ff" stroke="#722ed1" stroke-width="1.2"/>
<text x="335.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#722ed1" text-anchor="middle" font-weight="700">is_continuation</text>
<text x="335.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 біт: чи продовжує</text>
<text x="335.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">поточну серію (run)</text>
<rect x="415.0" y="305.0" width="140.0" height="70.0" rx="4" fill="#e6f7ff" stroke="#1890ff" stroke-width="1.2"/>
<text x="485.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1890ff" text-anchor="middle" font-weight="700">is_shifted</text>
<text x="485.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 біт: чи зміщено</text>
<text x="485.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">елемент від f_q</text>
<rect x="580.0" y="305.0" width="235.0" height="70.0" rx="4" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="697.5" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">remainder (залишок f_r)</text>
<text x="697.5" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">r бітів корисного навантаження</text>
<text x="697.5" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зберігає залишок хешу</text>
<rect x="163.0" y="428.0" width="613.9" height="24.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Завдяки частці f_q адреса не зберігається явно: номер комірки відновлює старші біти хешу</tspan></text>
</svg>