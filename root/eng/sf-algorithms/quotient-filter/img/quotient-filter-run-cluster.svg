<text x="462.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як декодуються набіги (Runs) у кластері [1..4]:</text>
<text x="90.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Набіг f_q = 1: починається у слоті [1] (C=0, S=0) і продовжується у слоті [2] (C=1, S=1). Містить 2 елементи: {0x2A, 0x5F}.</text>
<text x="90.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Набіг f_q = 2: починається у слоті [3] (C=0, S=1), зміщений вправо. Містить 1 елемент: {0x12}. Оскільки O[2]=1, набіг існує.</text>
<text x="90.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Слот [3] не має своїх канонічних елементів (O[3]=0), але зберігає зміщений елемент чужого набігу.</text>
<text x="90.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Набіг f_q = 4: починається у слоті [4] (C=0, S=1), зміщений через заповненість попередніх слотів. Містить {0x8B}.</text>
