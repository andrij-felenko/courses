<rect x="20.0" y="20.0" width="390.0" height="280.0" rx="8" fill="#fff5f5" stroke="#d9534f" stroke-width="1.5"/><text x="215.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d9534f" text-anchor="middle" font-weight="700">Рекурсивний бектрекінг (PCRE / Python re)</text><text x="215.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Шаблон (a+)+b, текст 'aaaaX'</text><circle cx="215.0" cy="105.0" r="12.0" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/><text x="215.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">1</text><circle cx="145.0" cy="155.0" r="12.0" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/><circle cx="285.0" cy="155.0" r="12.0" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/><line x1="206.0" y1="113.0" x2="154.0" y2="147.0" stroke="#d9534f" stroke-width="1.2"/><line x1="224.0" y1="113.0" x2="276.0" y2="147.0" stroke="#d9534f" stroke-width="1.2"/><circle cx="110.0" cy="205.0" r="10.0" fill="#ffffff" stroke="#d9534f" stroke-width="1.2"/><circle cx="180.0" cy="205.0" r="10.0" fill="#ffffff" stroke="#d9534f" stroke-width="1.2"/><circle cx="250.0" cy="205.0" r="10.0" fill="#ffffff" stroke="#d9534f" stroke-width="1.2"/><circle cx="320.0" cy="205.0" r="10.0" fill="#ffffff" stroke="#d9534f" stroke-width="1.2"/><line x1="138.0" y1="163.0" x2="117.0" y2="197.0" stroke="#d9534f" stroke-width="1.0"/><line x1="152.0" y1="163.0" x2="173.0" y2="197.0" stroke="#d9534f" stroke-width="1.0"/><line x1="278.0" y1="163.0" x2="257.0" y2="197.0" stroke="#d9534f" stroke-width="1.0"/><line x1="292.0" y1="163.0" x2="313.0" y2="197.0" stroke="#d9534f" stroke-width="1.0"/><text x="215.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d9534f" text-anchor="middle" font-weight="700">Експоненціальний вибух шляхів: O(2ⁿ)</text><text x="215.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">Провал на тупиках, виснаження стеку</text><rect x="430.0" y="20.0" width="390.0" height="280.0" rx="8" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Симуляція Томпсона (RE2 / Rust regex)</text><text x="625.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Множина активних станів Sₜ</text><rect x="455.0" y="96.0" width="340.0" height="32.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="470.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700">Символ 'a'₁:</text><text x="620.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">S₀ = {s₀, s₁, s₂}</text><rect x="455.0" y="138.0" width="340.0" height="32.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="470.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700">Символ 'a'₂:</text><text x="620.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">S₁ = {s₁, s₂, s₃}</text><rect x="455.0" y="180.0" width="340.0" height="32.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="470.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700">Символ 'a'₃:</text><text x="620.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">S₂ = {s₁, s₂, s₃}</text><rect x="455.0" y="222.0" width="340.0" height="32.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="470.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" font-weight="700">Символ 'X':</text><text x="620.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">S₃ = ∅ (Провал без бектрекінгу)</text><text x="625.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Гарантований лінійний час: O(M · N)</text>
