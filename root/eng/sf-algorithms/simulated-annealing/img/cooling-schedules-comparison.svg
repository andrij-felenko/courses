<rect x="503.3" y="80.2" width="243.4" height="249.5" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="625.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Стратегії охолодження:</tspan><tspan x="625.0" dy="14.3"></tspan><tspan x="625.0" dy="14.3">● Логарифмічний (Джеман):</tspan><tspan x="625.0" dy="14.3">  T = T₀ / ln(1 + k)</tspan><tspan x="625.0" dy="14.3">  Теоретична збіжність,</tspan><tspan x="625.0" dy="14.3">  надто повільний на практиці</tspan><tspan x="625.0" dy="14.3"></tspan><tspan x="625.0" dy="14.3">● Геометричний (експоненційний):</tspan><tspan x="625.0" dy="14.3">  T_{k+1} = α · T_k (α ≈ 0.85–0.99)</tspan><tspan x="625.0" dy="14.3">  Золотий стандарт практики</tspan><tspan x="625.0" dy="14.3"></tspan><tspan x="625.0" dy="14.3">● Лінійний розклад:</tspan><tspan x="625.0" dy="14.3">  T_{k+1} = T_k − β</tspan><tspan x="625.0" dy="14.3"></tspan><tspan x="625.0" dy="14.3">● Адаптивний з повторним нагрівом:</tspan><tspan x="625.0" dy="14.3">  Уповільнення при флуктуаціях</tspan></text>
</svg>