<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метод бінарного підйому: стрибки за степенями двійки</text>
<text x="430.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Таблиця up[u][k] зберігає 2^k-го предка вершини u, дозволяючи знайти LCA за O(log N)</text>
<circle cx="180.0" cy="330.0" r="20.0" fill="#fdecea" stroke="#2457d6" stroke-width="1.8"/>
<text x="180.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">0</text>
<text x="145.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">u (глибина 13)</text>
<circle cx="180.0" cy="270.0" r="20.0" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.8"/>
<text x="180.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1</text>
<text x="145.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">up[u][0] (+1)</text>
<circle cx="180.0" cy="210.0" r="20.0" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.8"/>
<text x="180.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2</text>
<text x="145.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">up[u][1] (+2)</text>
<circle cx="180.0" cy="150.0" r="20.0" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.8"/>
<text x="180.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3</text>
<text x="145.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">up[u][2] (+4)</text>
<circle cx="180.0" cy="90.0" r="20.0" fill="#f3e8ff" stroke="#c0392b" stroke-width="1.8"/>
<text x="180.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">4</text>
<text x="145.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">up[u][3] (+8)</text>
<path d="M 200.0 330.0 C 215.0 330.0, 215.0 270.0, 200.0 270.0" fill="none" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="223.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">2⁰ = 1 крок</text>
<path d="M 200.0 330.0 C 270.0 330.0, 270.0 210.0, 200.0 210.0" fill="none" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="278.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">2¹ = 2 кроки</text>
<path d="M 200.0 330.0 C 325.0 330.0, 325.0 150.0, 200.0 150.0" fill="none" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="333.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">2² = 4 кроки</text>
<path d="M 200.0 330.0 C 380.0 330.0, 380.0 90.0, 200.0 90.0" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="388.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">2³ = 8 кроків</text>
<rect x="480.0" y="90.0" width="350.0" height="260.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="655.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рекурентна формула таблиці:</text>
<text x="655.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">up[u][k] = up[ up[u][k−1] ][ k−1 ]</text>
<text x="500.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Алгоритм пошуку LCA(u, v):</text>
<text x="500.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">1. Вирівнювання глибин: якщо depth(u) &gt; depth(v),</text>
<text x="515.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">піднімаємо u на різницю Δd за двійковими бітами.</text>
<text x="500.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">2. Одночасний підйом: для k = ⌊log N⌋ .. 0,</text>
<text x="515.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">якщо up[u][k] ≠ up[v][k], робимо u = up[u][k], v = up[v][k].</text>
<text x="500.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">3. Результат: LCA(u, v) = up[u][0].</text>
</svg>