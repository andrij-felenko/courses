<rect x="582.0" y="118.2" width="256.0" height="163.7" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="710.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Оптимальні величини:</tspan><tspan x="710.0" dy="14.3">• Максимальне паросполучення |M|:</tspan><tspan x="710.0" dy="14.3">  M = {(u₁, v₁), (u₂, v₂), (u₃, v₃)}</tspan><tspan x="710.0" dy="14.3">  ν(G) = 3 (жирні зелені ребра)</tspan><tspan x="710.0" dy="14.3"></tspan><tspan x="710.0" dy="14.3">• Мінімальне вершинне покриття C:</tspan><tspan x="710.0" dy="14.3">  C = {u₁, u₂, v₃} (фіолетовий ореол)</tspan><tspan x="710.0" dy="14.3">  τ(G) = 3 (покриває всі ребра)</tspan><tspan x="710.0" dy="14.3"></tspan><tspan x="710.0" dy="14.3">• Рівність Кеніга: ν(G) = τ(G) = 3</tspan></text>
