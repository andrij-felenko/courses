<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="40.0" width="810.0" height="315.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Узагальнення алгоритму (Місра — Гріс) для k = 3 (поріг &gt; N/3, 2 слоти)</text>
<text x="190.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поточні слоти кандидатів (k - 1 = 2):</text>
<rect x="65.0" y="138.2" width="250.0" height="43.6" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="190.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Слот 1: Кандидат C₁ = 'Alpha'</tspan><tspan x="190.0" dy="15.6">Лічильник count₁ = 4</tspan></text>
<rect x="65.0" y="218.2" width="250.0" height="43.6" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="190.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Слот 2: Кандидат C₂ = 'Beta'</tspan><tspan x="190.0" dy="15.6">Лічильник count₂ = 2</tspan></text>
<line x1="350.0" y1="95.0" x2="350.0" y2="330.0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Надходить новий елемент x:</text>
<rect x="385.0" y="136.3" width="390.0" height="37.3" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="580.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Випадок 1: x ∈ {C₁, C₂}</tspan><tspan x="580.0" dy="14.3">Збільшити відповідний count_i++</tspan></text>
<rect x="385.0" y="196.3" width="390.0" height="37.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="580.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Випадок 2: Є вільний слот</tspan><tspan x="580.0" dy="14.3">Записати x у вільний слот з count = 1</tspan></text>
<rect x="385.0" y="259.2" width="390.0" height="51.6" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="580.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Випадок 3: x ∉ {C₁, C₂} і всі зайняті</tspan><tspan x="580.0" dy="14.3">Зменшити ВСІ лічильники: count₁--, count₂--</tspan><tspan x="580.0" dy="14.3">(групове знищення трійки різних значень)</tspan></text>
