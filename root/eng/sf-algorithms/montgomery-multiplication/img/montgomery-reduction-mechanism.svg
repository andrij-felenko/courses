<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="340.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм REDC: обнулення молодших розрядів та точне ділення на R</text>
<text x="125.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="end" font-weight="700">Добуток T = Ā · B̄:</text>
<rect x="140.0" y="80.0" width="280.0" height="36.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
<text x="280.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Молодша частина T mod R</text>
<rect x="430.0" y="80.0" width="280.0" height="36.0" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="570.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="700">Старша частина ⌊T / R⌋</text>
<text x="125.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="end" font-weight="700">+  m · N :</text>
<rect x="140.0" y="128.0" width="280.0" height="36.0" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="280.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">m · N mod R = (-T) mod R</text>
<rect x="430.0" y="128.0" width="280.0" height="36.0" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="570.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle">Старші лімби m · N</text>
<line x1="140.0" y1="174.0" x2="710.0" y2="174.0" stroke="#334155" stroke-width="2.0"/>
<text x="125.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="end" font-weight="700">Сума T + m · N :</text>
<rect x="140.0" y="184.0" width="280.0" height="36.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="280.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">0000...0000  (k нульових лімбів)</text>
<rect x="430.0" y="184.0" width="280.0" height="36.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="570.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Ненульова частина U · R</text>
<line x1="570.0" y1="220.0" x2="570.0" y2="252.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="590.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700">Зсув праворуч на k слів (÷ R)</text>
<text x="125.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="end" font-weight="700">Результат U :</text>
<rect x="430.0" y="259.0" width="280.0" height="36.0" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="570.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700">U = (T + m · N) / R &lt; 2N</text>
<rect x="140.0" y="307.0" width="570.0" height="30.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="425.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Фінальна корекція: якщо U ≥ N, повернути U - N; інакше повернути U (рівно 1 віднімання)</text>
</svg>