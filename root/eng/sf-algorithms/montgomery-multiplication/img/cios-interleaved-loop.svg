<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="350.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура CIOS: чергування множення та редукції в єдиному циклі</text>
<rect x="40.0" y="68.0" width="760.0" height="275.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
<rect x="40.0" y="68.0" width="760.0" height="30.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0"/>
<text x="60.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="start" font-weight="700">Зовнішній цикл: для кожного лімба A[i] (від i = 0 до k-1)</text>
<rect x="65.0" y="113.0" width="335.0" height="105.0" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
<text x="232.5" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">1. Накопичення: T = T + A[i] · B</text>
<line x1="80.0" y1="145.0" x2="385.0" y2="145.0" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="80.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start">Внутрішній цикл j від 0 до k-1:</text>
<text x="80.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start" font-weight="700">(C, S) = T[j] + A[i] · B[j] + C</text>
<text x="80.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start">T[j] = S;  T[k] = C</text>
<line x1="400.0" y1="165.0" x2="435.0" y2="165.0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="435.0" y="113.0" width="340.0" height="105.0" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.0"/>
<text x="605.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">2. Коефіцієнт редукції m</text>
<line x1="450.0" y1="145.0" x2="760.0" y2="145.0" stroke="#fde68a" stroke-width="1.0"/>
<text x="605.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">m = (T[0] · n0') mod 2⁶⁴</text>
<text x="605.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">Потребує лише 1 множення машинних слів!</text>
<line x1="605.0" y1="218.0" x2="605.0" y2="236.0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="65.0" y="236.0" width="710.0" height="92.0" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
<text x="420.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">3. Редукція поточного розряду: T = (T + m · N) / 2⁶⁴</text>
<line x1="80.0" y1="266.0" x2="760.0" y2="266.0" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="85.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">Додавання m · N: (C, S) = T[j] + m · N[j] + C;</text>
<text x="85.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="start" font-weight="700">Миттєвий зсув: T[j-1] = S;  T[0] стає 0 і відкидається на кожній ітерації i</text>
<text x="755.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="end" font-weight="700">Пам'ять: лише k + 2 лімби в регістрах L1!</text>
</svg>