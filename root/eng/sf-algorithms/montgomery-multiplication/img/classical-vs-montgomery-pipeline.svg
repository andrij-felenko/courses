<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="330.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння конвеєрів: класичне ділення та простір Монтгомері</text>
<rect x="35.0" y="70.0" width="365.0" height="255.0" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
<rect x="35.0" y="70.0" width="365.0" height="32.0" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.0"/>
<text x="217.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Класичний підхід: довге ділення</text>
<rect x="55.0" y="115.0" width="325.0" height="38.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="217.5" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Операнди A, B ∈ [0, N-1]</text>
<text x="217.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">k лімбів (звичайний вигляд)</text>
<line x1="217.5" y1="153.0" x2="217.5" y2="163.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55.0" y="165.0" width="325.0" height="38.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="217.5" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Повне множення: T = A · B</text>
<text x="217.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">2k лімбів (наприклад, 4096 біт)</text>
<line x1="217.5" y1="203.0" x2="217.5" y2="213.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55.0" y="215.0" width="325.0" height="38.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.0"/>
<text x="217.5" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Довге ділення: T mod N</text>
<text x="217.5" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Оцінка q̂, нормалізація, віднімання</text>
<line x1="217.5" y1="253.0" x2="217.5" y2="263.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55.0" y="265.0" width="325.0" height="38.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="217.5" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Результат C = (A · B) mod N</text>
<text x="217.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Складність ділення O(k²), гілкування</text>
<rect x="440.0" y="70.0" width="365.0" height="255.0" rx="6" fill="#ffffff" stroke="#4ade80" stroke-width="1.2"/>
<rect x="440.0" y="70.0" width="365.0" height="32.0" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.0"/>
<text x="622.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Простір Монтгомері: редукція REDC</text>
<rect x="460.0" y="115.0" width="325.0" height="38.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="622.5" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Вхід у простір: Ā = A·R mod N</text>
<text x="622.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Один раз перед циклом множень</text>
<line x1="622.5" y1="153.0" x2="622.5" y2="163.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460.0" y="165.0" width="325.0" height="38.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="622.5" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Множення: T = Ā · B̄</text>
<text x="622.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Звичайне множення поліномів/лімбів</text>
<line x1="622.5" y1="203.0" x2="622.5" y2="213.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460.0" y="215.0" width="325.0" height="38.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.0"/>
<text x="622.5" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Редукція REDC: (T + m·N) / R</text>
<text x="622.5" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Обнулення молодших біт + зсув праворуч</text>
<line x1="622.5" y1="253.0" x2="622.5" y2="263.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460.0" y="265.0" width="325.0" height="38.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="622.5" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Вихід із простору: C = REDC(C̄)</text>
<text x="622.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Один раз наприкінці піднесення до степеня</text>
</svg>