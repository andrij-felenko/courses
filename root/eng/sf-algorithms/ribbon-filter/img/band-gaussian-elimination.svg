<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм інкрементного стрічкового виключення Гаусса (Band Elimination)</text>
<rect x="40.0" y="60.0" width="230.0" height="260.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="155.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Нове рівняння k_x</text>
<line x1="50.0" y1="96.0" x2="260.0" y2="96.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="155.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Обчислення старту p та маски:</text>
<rect x="60.0" y="135.0" width="190.0" height="32.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="155.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">p = 12, mask = 1101001...</text>
<text x="155.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Старший біт стоїть</text>
<text x="155.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">у позиції col = 12</text>
<rect x="60.0" y="230.0" width="190.0" height="68.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.0"/>
<text x="155.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Перевірка слота 12:</text>
<text x="155.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Чи є вже опорний рядок</text>
<text x="155.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(pivot) у pivot[12]?</text>
<line x1="275.0" y1="190.0" x2="300.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="305.0" y="60.0" width="240.0" height="260.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="425.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">2. Колізія опорних рядків</text>
<line x1="315.0" y1="96.0" x2="535.0" y2="96.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="425.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Слот 12 вже зайнятий!</text>
<text x="425.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Виконуємо побітове XOR:</text>
<rect x="320.0" y="152.0" width="210.0" height="72.0" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.0"/>
<text x="425.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">mask = mask ⊕ pivot[12].mask</text>
<text x="425.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">target = target ⊕ pivot[12].tgt</text>
<text x="425.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Операція за 1 такт CPU (64-біт)</text>
<text x="425.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Старший 12-й біт зникає (стає 0)</text>
<text x="425.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Наступний біт '1' на позиції col=15</text>
<text x="425.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Переходимо до слота 15...</text>
<line x1="550.0" y1="190.0" x2="575.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="60.0" width="220.0" height="260.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="690.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Фіксація у порожній слот</text>
<line x1="590.0" y1="96.0" x2="790.0" y2="96.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="690.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Слот 15 вільний!</text>
<rect x="595.0" y="140.0" width="190.0" height="52.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="690.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">pivot[15] = {mask, target}</text>
<text x="690.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Рядок успішно закріплено</text>
<text x="690.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Після обробки всіх N ключів:</text>
<text x="690.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Матриця стає верхньотрикутною</text>
<rect x="595.0" y="255.0" width="190.0" height="48.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="690.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зворотна підстановка</text>
<text x="690.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">обчислює B[i] від M-1 до 0</text>
<rect x="40.0" y="345.0" width="760.0" height="85.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.2"/>
<text x="420.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому складність строго O(N): ширина стрічки обмежена w бітами (w = 32 або 64)</text>
<text x="420.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожен рядок може зазнати не більше w операцій XOR перед потраплянням у вільний слот</text>
<text x="420.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Загальна кількість бітових операцій для побудови всього фільтра становить ≤ N · w</text>
</svg>