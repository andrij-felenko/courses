<text x="725.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">f(k₀) [r біт]</text>
<text x="725.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">⋮ (N рядків)</text>
<text x="725.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">f(k_{N-1})</text>
<rect x="40.0" y="400.0" width="760.0" height="56.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.2"/>
<text x="420.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розв'язання системи: визначення значень B[0..M-1], що задовольняють ⊕_{j=0}^{w-1} (c_i[j] · B[p_i + j]) = f(k_i)</text>
<text x="420.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Стрічкова форма дозволяє знайти B за лінійний час O(N · w) замість O(N³) кубічного Гаусса</text>
</svg>