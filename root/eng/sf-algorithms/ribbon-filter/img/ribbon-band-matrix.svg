<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стрічкова структура системи лінійних рівнянь A · B = f над GF(2)</text>
<rect x="40.0" y="56.0" width="760.0" height="48.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="420.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Кожен ключ k_i генерує ненульові коефіцієнти лише у вузькому вікні ширини w бітів (стрічці)</text>
<text x="420.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Поза вікном [p_i, p_i + w - 1] усі коефіцієнти вектора рядка дорівнюють строго 0</text>
<rect x="90.0" y="130.0" width="400.0" height="240.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="290.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця коефіцієнтів A (N × M над GF(2))</text>
<text x="110.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стовпець 0</text>
<text x="460.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стовпець M-1</text>
