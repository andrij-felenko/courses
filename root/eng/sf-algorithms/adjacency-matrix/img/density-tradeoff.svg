<rect x="90.0" y="412.0" width="700.0" height="45.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="430.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Для розріджених графів (ρ &lt; 10%) список суміжності значно економніший за пам'яттю.</tspan><tspan x="440.0" dy="15.6">Для щільних графів (ρ &gt; 20%) матриця суміжності виграє за рахунок відсутності оверхеду вказівників.</tspan></text>
