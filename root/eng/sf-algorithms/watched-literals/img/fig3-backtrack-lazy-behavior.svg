<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Поведінка при скасуванні присвоєнь (Backtrack): Традиційні лічильники vs 2WL</text>
<rect x="30.0" y="60.0" width="390.0" height="330.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="225.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">Традиційні лічильники (DPLL / SATO)</text>
<rect x="83.3" y="123.8" width="283.3" height="102.5" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="225.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">• При кожному скасуванні xᵢ := UNASSIGNED:</tspan><tspan x="225.0" dy="14.3">  Обов'язкове інкрементування лічильників</tspan><tspan x="225.0" dy="14.3">  у всіх диз'юнктах, де присутній xᵢ.</tspan><tspan x="225.0" dy="14.3">• Складність повернення: O(|C| · k)</tspan><tspan x="225.0" dy="14.3">• Масові записи в пам'ять (Un-trail stack)</tspan><tspan x="225.0" dy="14.3">• Промивання L1/L2 кешу при бектрекінгу</tspan></text>
<rect x="99.1" y="307.4" width="251.9" height="45.3" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="225.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">ВИТРАТИ ПАМ'ЯТІ: O(Всього змінних)</tspan><tspan x="225.0" dy="14.3">Висока затримка шини RAM</tspan></text>
<rect x="460.0" y="60.0" width="390.0" height="330.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="655.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">Техніка 2WL (Chaff / MiniSAT / CaDiCaL)</text>
<rect x="510.2" y="116.6" width="289.6" height="116.8" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="655.0" y="135.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">• При скасуванні xᵢ := UNASSIGNED:</tspan><tspan x="655.0" dy="14.3">  НУЛЬ операцій із диз'юнктами!</tspan><tspan x="655.0" dy="14.3">  Покажчики w₁, w₂ залишаються на місцях.</tspan><tspan x="655.0" dy="14.3">• Інваріант 2WL гарантовано ЗБЕРІГАЄТЬСЯ:</tspan><tspan x="655.0" dy="14.3">  якщо wᵢ ∉ {FALSE} до скасування,</tspan><tspan x="655.0" dy="14.3">  то після скасування поготів wᵢ ∉ {FALSE}.</tspan><tspan x="655.0" dy="14.3">• Складність повернення: O(1)</tspan></text>
<rect x="522.2" y="307.4" width="265.5" height="45.3" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="655.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">ВИТРАТИ ПАМ'ЯТІ ПРИ БЕКТРЕКУ: 0 БАЙТ</tspan><tspan x="655.0" dy="14.3">Збереження стану кешу</tspan></text>
</svg>