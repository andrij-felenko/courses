<text x="692.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Рекурсивна перевірка 4 зовнішніх ребер:</text>
