<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="420.0" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.0"/>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричний зміст косинусної відстані та кута між векторами</text>
<rect x="30.0" y="50.0" width="370.0" height="330.0" rx="6" fill="#fafafa" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="215.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектори u та v і кут θ</text>
<line x1="70.0" y1="320.0" x2="360.0" y2="320.0" stroke="#b0b0b0" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="90.0" y1="340.0" x2="90.0" y2="100.0" stroke="#b0b0b0" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="365.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">X</text>
<text x="80.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Y</text>
<text x="78.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">O</text>
<path d="M 240 320 A 150 150 0 0 0 90 170" fill="none" stroke="#d5d5d5" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="205.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">R = 1 (Одинична сфера)</text>
<line x1="90.0" y1="320.0" x2="287.3" y2="248.2" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="299.3" y="243.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">u (довжина ||u||)</text>
<line x1="90.0" y1="320.0" x2="161.8" y2="165.9" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="156.8" y="153.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">v (довжина ||v||)</text>
<path d="M 146.4 299.5 A 60 60 0 0 0 115.4 265.6" fill="none" stroke="#d97706" stroke-width="2"/>
<text x="149.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">θ</text>
<line x1="161.8" y1="165.9" x2="203.0" y2="278.9" stroke="#888888" stroke-width="1.2" stroke-dasharray="3,3"/>
<circle cx="203.0" cy="278.9" r="3.0" fill="#888888" stroke="none" stroke-width="1.5"/>
<text x="208.0" y="296.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Проєкція: ||v||·cos(θ)</text>
<rect x="430.0" y="50.0" width="380.0" height="330.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Проєкція на одиничну гіперсферу</text>
<circle cx="620.0" cy="235.0" r="110.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="620.0" y1="235.0" x2="770.4" y2="180.3" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="620.0" y1="235.0" x2="683.4" y2="99.1" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="620.0" y1="235.0" x2="723.4" y2="197.4" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="620.0" y1="235.0" x2="666.5" y2="135.3" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="723.4" cy="197.4" r="4.0" fill="#27ae60" stroke="none" stroke-width="1.5"/>
<circle cx="666.5" cy="135.3" r="4.0" fill="#c0392b" stroke="none" stroke-width="1.5"/>
<text x="747.4" y="201.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ū = u / ||u||</text>
<text x="656.5" y="116.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">v̄ = v / ||v||</text>
<line x1="723.4" y1="197.4" x2="666.5" y2="135.3" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="2,2"/>
<text x="716.9" y="161.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">d_E² = 2(1 - cos θ)</text>
<rect x="450.0" y="300.0" width="340.0" height="65.0" rx="4" fill="#ffffff" stroke="#c8e6c9" stroke-width="1.0"/>
<text x="620.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">cos(θ) = (u · v) / (||u|| · ||v||)</text>
<text x="620.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">d_cos(u, v) = 1 - cos(θ) ∈ [0, 2]</text>
<text x="420.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Скалярний добуток задає проєкцію вектора, а нормалізація зводить косинусну відстань до скалярного добутку на одиничній сфері.</text>
</svg>