<rect x="60.0" y="280.0" width="210.0" height="32.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="165.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">dot = hsum(acc_dot)</text>
<rect x="290.0" y="280.0" width="220.0" height="32.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="400.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">norm_u = sqrt(hsum(acc_sq_u))</text>
<rect x="530.0" y="280.0" width="250.0" height="32.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.0"/>
<text x="655.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">d_cos = 1.0 - dot / (norm_u * norm_v)</text>
