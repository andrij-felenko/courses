<text x="420.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паралельне сумування у 3-х SIMD-акумуляторах (vfmadd231ps):</text>
<rect x="60.0" y="180.0" width="230.0" height="32.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="175.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">acc_dot += u[i:i+7] * v[i:i+7]</text>
<rect x="305.0" y="180.0" width="230.0" height="32.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="420.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">acc_sq_u += u[i:i+7] * u[i:i+7]</text>
<rect x="550.0" y="180.0" width="230.0" height="32.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.0"/>
<text x="665.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">acc_sq_v += v[i:i+7] * v[i:i+7]</text>
<line x1="420.0" y1="120.0" x2="420.0" y2="148.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
