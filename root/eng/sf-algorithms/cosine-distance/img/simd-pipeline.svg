<text x="420.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Обчислення скалярного добутку та двох норм виконується в один прохід по пам'яті через 8-елементні векторні регістри.</text>
