<rect x="-15.2" y="201.2" width="430.4" height="47.6" rx="6" fill="#fff5f5" stroke="#dc2626" stroke-width="1.5"/><text x="200.0" y="221.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Якщо під час обходу з вершини V веде ребро у GRAY-вершину —</tspan><tspan x="200.0" dy="15.6">знайдено ЗВОРОТНЕ РЕБРО (Back Edge). Це сигналізує про ЦИКЛ!</tspan></text>
