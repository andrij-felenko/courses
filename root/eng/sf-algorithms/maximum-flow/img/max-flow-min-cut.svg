<rect x="40.0" y="395.0" width="860.0" height="55.0" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="470.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пропускна спроможність розрізу c(S, T) = 7 + 3 + 8 = 18. Сумарний потік |f| = 18.</text>
<text x="470.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Усі прямі дуги S→T вичерпані (c_f = 0), усі зворотні T→S порожні (f = 0) ⇒ потік максимальний.</text>
