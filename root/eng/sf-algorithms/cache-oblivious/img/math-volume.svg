<rect x="470.0" y="132.0" width="384.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="662.0" y="166.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="662.0" dy="0.0">Червоний брусок — √M × √M × √M:</tspan><tspan x="662.0" dy="15.0">рівно стільки, скільки влазить у кеш M.</tspan><tspan x="662.0" dy="15.0"></tspan><tspan x="662.0" dy="15.0">робота в бруску:   (√M)³ = M·√M</tspan><tspan x="662.0" dy="15.0">його дані:         3 грані по M = 3M</tspan><tspan x="662.0" dy="15.0">принести їх:       3M / B блоків</tspan><tspan x="662.0" dy="15.0"></tspan><tspan x="662.0" dy="15.0">на 1 блок роботи:  M·√M ÷ (3M/B) = B·√M / 3</tspan><tspan x="662.0" dy="15.0"></tspan><tspan x="662.0" dy="15.0">усього роботи N³ →</tspan><tspan x="662.0" dy="15.0">блоків ≈ N³ ÷ (B·√M / 3) = Θ(N³ / (B·√M))</tspan></text>
