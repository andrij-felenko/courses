<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 646" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="646" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто що зробив у народженні кеш-незалежності — і яке твердження не підтверджене</text>
<text x="460.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто що саме зробив: «винайшов» розчеплено на дії</text>
<rect x="70.0" y="60.0" width="780.0" height="68.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<circle cx="98.0" cy="94.0" r="15.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="98.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1</text>
<text x="128.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">ФОРМА</text>
<text x="128.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Петер ван Емде Боас · 1975</text>
<text x="128.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">рекурсивний поділ на √-шматки — заради ЧАСУ O(log log n), не заради кеша</text>
<line x1="98.0" y1="128.0" x2="98.0" y2="140.0" stroke="#c7ccd2" stroke-width="1.4"/>
<rect x="70.0" y="140.0" width="780.0" height="68.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="98.0" cy="174.0" r="15.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="98.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<text x="128.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">СПОСТЕРЕЖЕННЯ</text>
<text x="128.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">група MIT · 1994</text>
<text x="128.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">рекурсія кеш-оптимальна без підбору; розмову започаткував Боббі Блумофе</text>
<line x1="98.0" y1="208.0" x2="98.0" y2="220.0" stroke="#c7ccd2" stroke-width="1.4"/>
<rect x="70.0" y="220.0" width="780.0" height="68.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="98.0" cy="254.0" r="15.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="98.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">3</text>
<text x="128.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">НАЗВА ПОНЯТТЯ</text>
<text x="128.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">група MIT · 1997</text>
<text x="128.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">«cache-oblivious»; хто саме вимовив її першим — джерела не кажуть</text>
<line x1="98.0" y1="288.0" x2="98.0" y2="300.0" stroke="#c7ccd2" stroke-width="1.4"/>
<rect x="70.0" y="300.0" width="780.0" height="68.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="98.0" cy="334.0" r="15.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="98.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">4</text>
<text x="128.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">МОДЕЛЬ · ДОВЕДЕННЯ · РОЗКЛАДКА</text>
<text x="128.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Гаральд Прокоп · 1999</text>
<text x="128.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">ideal-cache, оптимальність, сама розкладка; керівник праці — Чарлз Лейзерсон</text>
<line x1="98.0" y1="368.0" x2="98.0" y2="380.0" stroke="#c7ccd2" stroke-width="1.4"/>
<rect x="70.0" y="380.0" width="780.0" height="68.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="98.0" cy="414.0" r="15.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="98.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">5</text>
<text x="128.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">НАЗВА РОЗКЛАДКИ</text>
<text x="128.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Бендер, Демейн, Фарах-Колтон · 2000</text>
<text x="128.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">«van Emde Boas layout» — за схожістю форми, з обмовкою просто в зносці</text>
<rect x="70.0" y="474.0" width="780.0" height="128.0" rx="6" fill="#fff8f0" stroke="#c0392b" stroke-width="2.0"/>
<text x="86.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">А що кажуть довідники:</text>
<text x="86.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">«Ідею (і назву) замислив Чарлз Лейзерсон ще 1996 р.» — з посиланням на працю Прокопа.</text>
<text x="86.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Але в самій праці цього немає. Вона каже: 1994 — помітили, 1997 — ухвалили термін,</text>
<text x="86.0" y="564.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">і скрізь «наша група», а не одна людина. Журнальна версія 2012 р., підписана й самим</text>
<text x="86.0" y="582.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Лейзерсоном, повторює ті самі 1994 і 1997. Статус: НЕ ПІДТВЕРДЖЕНО ПЕРШОДЖЕРЕЛОМ.</text>
</svg>