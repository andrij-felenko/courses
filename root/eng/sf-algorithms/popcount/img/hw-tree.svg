<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Те саме дерево, тільки в кремнії</text>
<rect x="60.0" y="62.0" width="720.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="88.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">64 біти на вході — 64 лічильники по 1 біту</tspan></text>
<rect x="95.0" y="120.0" width="650.0" height="44.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">32 суматори 1+1 → 32 числа по 2 біти</tspan></text>
<rect x="130.0" y="178.0" width="580.0" height="44.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="204.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">16 суматорів 2+2 → 16 чисел по 3 біти</tspan></text>
<rect x="165.0" y="236.0" width="510.0" height="44.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="262.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">8 суматорів 3+3 → 8 чисел по 4 біти</tspan></text>
<rect x="200.0" y="294.0" width="440.0" height="44.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">4 суматори 4+4 → 4 числа по 5 бітів</tspan></text>
<rect x="235.0" y="352.0" width="370.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="378.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">2 суматори 5+5 → 2 числа по 6 бітів</tspan></text>
<rect x="270.0" y="410.0" width="300.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="436.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1 суматор 6+6 → 7 бітів: 0…64</tspan></text>
<text x="420.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Глибина — шість тонких рівнів вентилів, а не 63 додавання поспіль:</tspan><tspan x="420.0" dy="19.5">увесь підрахунок укладається в одну команду завдовжки в один-два такти.</tspan></text>
</svg>