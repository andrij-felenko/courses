<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один акумулятор проти чотирьох</text>
<text x="36.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Один акумулятор: кожне додавання чекає на попереднє</text>
<rect x="40.0" y="74.0" width="130.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="105.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="105.0" dy="0.0">n += pc(w0)</tspan></text>
<line x1="170.0" y1="97.0" x2="204.0" y2="97.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="208.0" y="74.0" width="130.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="273.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="273.0" dy="0.0">n += pc(w1)</tspan></text>
<line x1="338.0" y1="97.0" x2="372.0" y2="97.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="376.0" y="74.0" width="130.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="441.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="441.0" dy="0.0">n += pc(w2)</tspan></text>
<line x1="506.0" y1="97.0" x2="540.0" y2="97.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="544.0" y="74.0" width="130.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="609.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="609.0" dy="0.0">n += pc(w3)</tspan></text>
<line x1="674.0" y1="97.0" x2="708.0" y2="97.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="786.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">…</text>
<text x="440.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Кожна стрілка — справжня залежність за даними: наступне додавання</tspan><tspan x="440.0" dy="19.5">не може початися, доки не готове попереднє значення n.</tspan></text>
<line x1="36.0" y1="210.0" x2="844.0" y2="210.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="36.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Чотири акумулятори: чотири незалежні ланцюги</text>
<rect x="40.0" y="260.0" width="168.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="124.0" y="280.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="124.0" dy="0.0">n0 += pc(w[i+0])</tspan></text>
<line x1="212.0" y1="276.0" x2="244.0" y2="276.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="248.0" y="260.0" width="178.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="337.0" y="280.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="337.0" dy="0.0">n0 += pc(w[i+4])</tspan></text>
<text x="446.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">…</text>
<rect x="40.0" y="298.0" width="168.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="124.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="124.0" dy="0.0">n1 += pc(w[i+1])</tspan></text>
<line x1="212.0" y1="314.0" x2="244.0" y2="314.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="248.0" y="298.0" width="178.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="337.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="337.0" dy="0.0">n1 += pc(w[i+5])</tspan></text>
<text x="446.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">…</text>
<rect x="40.0" y="336.0" width="168.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="124.0" y="356.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="124.0" dy="0.0">n2 += pc(w[i+2])</tspan></text>
<line x1="212.0" y1="352.0" x2="244.0" y2="352.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="248.0" y="336.0" width="178.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="337.0" y="356.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="337.0" dy="0.0">n2 += pc(w[i+6])</tspan></text>
<text x="446.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">…</text>
<rect x="40.0" y="374.0" width="168.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="124.0" y="394.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="124.0" dy="0.0">n3 += pc(w[i+3])</tspan></text>
<line x1="212.0" y1="390.0" x2="244.0" y2="390.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="248.0" y="374.0" width="178.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="337.0" y="394.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="337.0" dy="0.0">n3 += pc(w[i+7])</tspan></text>
<text x="446.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">…</text>
<line x1="500.0" y1="260.0" x2="500.0" y2="406.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="676.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="676.0" dy="0.0">Жоден ланцюг не чекає</tspan><tspan x="676.0" dy="19.5">на сусідній — ядро веде</tspan><tspan x="676.0" dy="19.5">всі чотири водночас.</tspan></text>
<rect x="40.0" y="420.0" width="800.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="444.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Наприкінці — одне додавання на весь масив: n = n0 + n1 + n2 + n3</tspan></text>
</svg>