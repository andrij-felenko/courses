<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 566" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="566" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що прощає відкладена маска, а що ні</text>
<text x="490.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Вміст маска прощає: непарні поля вона однаково гасить</text>
<rect x="48.0" y="76.0" width="136.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="116.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="116.0" dy="0.0">s₅ = d₅ + d₆</tspan></text>
<text x="116.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у кошик</text>
<rect x="196.0" y="76.0" width="136.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="264.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="264.0" dy="0.0">s₄ = d₄ + d₅</tspan></text>
<text x="264.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">лишаємо</text>
<rect x="344.0" y="76.0" width="136.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="412.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="412.0" dy="0.0">s₃ = d₃ + d₄</tspan></text>
<text x="412.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у кошик</text>
<rect x="492.0" y="76.0" width="136.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">s₂ = d₂ + d₃</tspan></text>
<text x="560.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">лишаємо</text>
<rect x="640.0" y="76.0" width="136.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="708.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="708.0" dy="0.0">s₁ = d₁ + d₂</tspan></text>
<text x="708.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у кошик</text>
<rect x="788.0" y="76.0" width="136.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="856.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="856.0" dy="0.0">s₀ = d₀ + d₁</tspan></text>
<text x="856.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">лишаємо</text>
<text x="490.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у непарному полі сходяться поля з двох різних пар — число, якого ніхто не просив</text>
<text x="490.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Переповнення не прощається: воно псує результат двома різними шляхами</text>
<rect x="112.0" y="250.0" width="132.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="178.0" y="283.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle"><tspan x="178.0" dy="0.0">s₃</tspan></text>
<rect x="256.0" y="250.0" width="132.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="322.0" y="283.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="322.0" dy="0.0">s₂ ≥ 2ᶠ</tspan></text>
<text x="250.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="250.0" dy="0.0">парне поле переповнилось —</tspan><tspan x="250.0" dy="19.5">лишиться s₂ mod 2ᶠ, а не сума</tspan></text>
<rect x="592.0" y="250.0" width="132.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="658.0" y="283.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="658.0" dy="0.0">s₄</tspan></text>
<rect x="736.0" y="250.0" width="132.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="802.0" y="283.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="802.0" dy="0.0">s₃ ≥ 2ᶠ</tspan></text>
<line x1="758.0" y1="234.0" x2="702.0" y2="234.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="730.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">перенос +1</text>
<text x="730.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="730.0" dy="0.0">непарне переповнилось —</tspan><tspan x="730.0" dy="19.5">зайва одиниця йде в сусіда ліворуч</tspan></text>
<rect x="150.0" y="382.0" width="680.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="413.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">жодне поле не сміє переповнитись:   dᵢ + dᵢ₊₁ ≤ 2ᶠ − 1   ⟸   2f ≤ 2ᶠ − 1</tspan></text>
<rect x="118.0" y="454.0" width="174.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="476.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">f = 1</tspan><tspan x="205.0" dy="18.2">2 ≤ 1  ✗</tspan></text>
<rect x="308.0" y="454.0" width="174.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="395.0" y="476.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">f = 2</tspan><tspan x="395.0" dy="18.2">4 ≤ 3  ✗</tspan></text>
<rect x="498.0" y="454.0" width="174.0" height="54.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="585.0" y="476.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">f = 4</tspan><tspan x="585.0" dy="18.2">8 ≤ 15  ✓</tspan></text>
<rect x="688.0" y="454.0" width="174.0" height="54.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="476.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">f = 8</tspan><tspan x="775.0" dy="18.2">16 ≤ 255  ✓</tspan></text>
<text x="490.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">У канонічному кроці ту саму суму 2f міряють проти цілого блоку 2^(2f) — там вона вміщається завжди.</text>
</svg>