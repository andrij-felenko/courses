<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подання множини у вигляді масиву слів uint64_t</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожен біт кодує присутність числа: біт id = 1 якщо id ∈ S, інакше 0</text>
<rect x="30.0" y="74.0" width="335.0" height="120.0" rx="6" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.8"/><text x="197.5" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="197.5" dy="0.0">Слово data[0]  (біти 0 … 63)</tspan><tspan x="197.5" dy="15.6"></tspan><tspan x="197.5" dy="15.6">Біт 2 = 1 (число 2 ∈ S)</tspan><tspan x="197.5" dy="15.6">Біт 5 = 1 (число 5 ∈ S)</tspan><tspan x="197.5" dy="15.6">Біт 63 = 1 (число 63 ∈ S)</tspan></text>
<rect x="395.0" y="74.0" width="335.0" height="120.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/><text x="562.5" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="562.5" dy="0.0">Слово data[1]  (біти 64 … 127)</tspan><tspan x="562.5" dy="15.6"></tspan><tspan x="562.5" dy="15.6">Біт 0 (id 64) = 1 (число 64 ∈ S)</tspan><tspan x="562.5" dy="15.6">Біт 1 (id 65) = 1 (число 65 ∈ S)</tspan><tspan x="562.5" dy="15.6">Біт 63 (id 127) = 1 (число 127 ∈ S)</tspan></text>
<rect x="30.0" y="210.0" width="700.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="380.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Формула адресації довільного елемента i:</tspan><tspan x="380.0" dy="15.6"></tspan><tspan x="380.0" dy="15.6">Індекс слова у масиві:    word_idx = i &gt;&gt; 6        (еквівалент i / 64)</tspan><tspan x="380.0" dy="15.6">Зсув біта всередині слова:  bit_offset = i &amp; 63        (еквівалент i % 64)</tspan><tspan x="380.0" dy="15.6">Бітова маска розряду:      mask = 1ULL &lt;&lt; bit_offset</tspan><tspan x="380.0" dy="15.6">Перевірка: (data[word_idx] &amp; mask) != 0   |   Встановлення: data[word_idx] |= mask</tspan></text>
<text x="380.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Компактність: 1 біт на можливий елемент замість 8 байтів покажчика у вузлах дерев</text>
</svg>