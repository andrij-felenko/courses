<rect x="584.2" y="108.4" width="211.5" height="63.2" rx="6" fill="#e6f7ec" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Комірка цілком у вікні:</tspan><tspan x="690.0" dy="15.6">усе піддерево — у відповідь,</tspan><tspan x="690.0" dy="15.6">разом це рівно k точок.</tspan></text>
