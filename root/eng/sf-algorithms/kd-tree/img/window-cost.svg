<rect x="213.2" y="459.0" width="553.5" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="479.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Межа вікна лежить на чотирьох прямих; кожна ріже щонайбільше 3·√N − 2 комірок.</tspan></text>
