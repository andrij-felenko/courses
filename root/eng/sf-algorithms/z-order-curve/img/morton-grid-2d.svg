<rect x="436.6" y="135.9" width="286.8" height="168.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">1. Беремо біти координат x та y:</tspan><tspan x="580.0" dy="16.9">   x = x₁ x₀,  y = y₁ y₀</tspan><tspan x="580.0" dy="16.9"></tspan><tspan x="580.0" dy="16.9">2. Переплітаємо біти (y під парні,</tspan><tspan x="580.0" dy="16.9">   x під непарні позиції):</tspan><tspan x="580.0" dy="16.9">   z = y₁ x₁ y₀ x₀</tspan><tspan x="580.0" dy="16.9"></tspan><tspan x="580.0" dy="16.9">3. Порядок Z фрактально повторюється</tspan><tspan x="580.0" dy="16.9">   у кожному квадранті 2×2.</tspan></text>
