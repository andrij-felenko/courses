<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="890.0" height="410.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="460.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динаміка алгоритму Форчуна: обробка подій у черзі Q</text>
<rect x="30.0" y="70.0" width="415.0" height="345.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="237.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">1. Сайт-подія (Site Event)</text>
<line x1="45.0" y1="260.0" x2="430.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="370.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">L (досягла p₂)</text>
<path d="M 60 170 Q 140 250 220 258 Q 300 250 380 170" fill="none" stroke="#059669" stroke-width="2.5"/>
<text x="100.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">дуга α(p₁)</text>
<circle cx="140.0" cy="160.0" r="6.0" fill="#0284c7" stroke="#ffffff" stroke-width="2.0"/>
<text x="140.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">p₁</text>
<circle cx="240.0" cy="260.0" r="6.5" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<text x="256.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">p₂ (новий)</text>
<line x1="240.0" y1="230.0" x2="240.0" y2="254.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="237.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Новий сайт розщеплює наявну дугу:</text>
<text x="237.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Послідовність дуг:  α(p₁) → α(p₁) · α(p₂) · α(p₁)</text>
<text x="237.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">З'являються дві нові точки зламу</text>
<rect x="475.0" y="70.0" width="415.0" height="345.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="682.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#166534" text-anchor="middle" font-weight="700">2. Коло-подія (Circle Event)</text>
<circle cx="680" cy="225" r="138" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 3"/>
<line x1="490.0" y1="363.0" x2="875.0" y2="363.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="810.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">L (y = y_v + R)</text>
<circle cx="560.0" cy="160.0" r="6.0" fill="#0284c7" stroke="#ffffff" stroke-width="2.0"/>
<text x="560.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">p₁</text>
<circle cx="680.0" cy="180.0" r="6.0" fill="#0284c7" stroke="#ffffff" stroke-width="2.0"/>
<text x="680.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">p₂</text>
<circle cx="800.0" cy="150.0" r="6.0" fill="#0284c7" stroke="#ffffff" stroke-width="2.0"/>
<text x="800.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">p₃</text>
<circle cx="680.0" cy="225.0" r="5.5" fill="#ffffff" stroke="#dc2626" stroke-width="2.2"/>
<text x="698.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">v (вершина)</text>
<line x1="680.0" y1="363.0" x2="680.0" y2="235.0" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="682.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Середня дуга α(p₂) стискається в нуль:</text>
<text x="682.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Фіксується вершина v = circumcenter(p₁, p₂, p₃)</text>
<text x="682.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Дуга α(p₂) видаляється, сусіди p₁ та p₃ змикаються</text>
</svg>