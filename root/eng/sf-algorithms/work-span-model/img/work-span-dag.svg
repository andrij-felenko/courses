<text x="390.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">v₈</text>
<text x="390.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">w=1</text>
<circle cx="280.0" cy="495.0" r="24.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="280.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">v₉</text>
<text x="280.0" y="507.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">w=1</text>
<rect x="20.0" y="430.0" width="180.0" height="115.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="110.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типи зв'язків</text>
<line x1="35.0" y1="468.0" x2="65.0" y2="468.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="75.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Критичний шлях</text>
<line x1="35.0" y1="490.0" x2="65.0" y2="490.0" stroke="#8e44ad" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="75.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Spawn (розгалуження)</text>
<line x1="35.0" y1="512.0" x2="65.0" y2="512.0" stroke="#16a085" stroke-width="1.8" stroke-dasharray="3 3"/>
<text x="75.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Sync / Join (синхронізація)</text>
<line x1="35.0" y1="532.0" x2="65.0" y2="532.0" stroke="#333333" stroke-width="1.6"/>
<text x="75.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Послідовне продовження</text>
<rect x="540.0" y="55.0" width="400.0" height="485.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="740.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метрики графа виконання</text>
<line x1="555.0" y1="97.0" x2="925.0" y2="97.0" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="555.0" y="115.0" width="370.0" height="85.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="565.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">1. Загальна робота  T₁  (Work)</text>
<text x="565.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Час виконання всієї програми на 1 процесорі.</text>
<text x="565.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Сума ваг усіх 9 вузлів DAG:</text>
<text x="565.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">T₁ = 1 + 3 + 2 + 4 + 1 + 2 + 3 + 1 + 1 = 18 тактів</text>
<rect x="555.0" y="215.0" width="370.0" height="95.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
<text x="565.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">2. Глибина / Критичний шлях  T_∞  (Span)</text>
<text x="565.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Час на системі з нескінченною кількістю ядер (P → ∞).</text>
<text x="565.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Найдовший спрямований шлях: v₁ → v₂ → v₄ → v₇ → v₉</text>
<text x="565.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">T_∞ = 1 + 3 + 4 + 3 + 1 = 12 тактів</text>
<rect x="555.0" y="325.0" width="370.0" height="105.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="565.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">3. Граничний паралелізм  P_max = T₁ / T_∞</text>
<text x="565.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Середня кількість роботи на один крок глибини:</text>
<text x="565.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">P_max = 18 / 12 = 1.5</text>
<text x="565.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Висновок: додавання більше ніж 2 ядер не прискорить цей</text>
<text x="565.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">граф, оскільки виконання обмежене критичним шляхом.</text>
<rect x="555.0" y="445.0" width="370.0" height="50.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="740.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фундаментальна межа часу:  T_P ≥ max(T₁/P, T_∞)</text>
<text x="740.0" y="483.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Неможливо виконати швидше ніж T_∞ за будь-якого P.</text>
</svg>