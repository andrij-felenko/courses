<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритмічна пастка: наївне злиття проти паралельного</text>
<rect x="30.0" y="55.0" width="435.0" height="445.0" rx="8" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5"/>
<text x="247.5" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">А. Наївний паралельний Merge Sort</text>
<text x="247.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Паралельний spawn підмасивів + послідовне злиття</text>
<circle cx="247.5" cy="140.0" r="18.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="247.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Sort(N)</text>
<line x1="235.5" y1="154.0" x2="148.8" y2="195.0" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="259.5" y1="154.0" x2="346.2" y2="195.0" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="138.8" cy="210.0" r="16.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="138.8" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">N/2</text>
<circle cx="356.2" cy="210.0" r="16.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="356.2" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">N/2</text>
<text x="247.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">. . .</text>
<text x="247.5" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">[ 2^k паралельних підмасивів розміру O(1) ]</text>
<line x1="138.8" y1="280.0" x2="227.5" y2="315.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="356.2" y1="280.0" x2="267.5" y2="315.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="75.0" y="315.0" width="345.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<text x="247.5" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ПОСЛІДОВНЕ ЗЛИТТЯ: Merge(N)</text>
<text x="247.5" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вага вузла = O(N) тактів на 1 ядрі!</text>
<rect x="50.0" y="385.0" width="395.0" height="100.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="60.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Робота T₁:</text>
<text x="160.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">O(N log N)  [оптимальна]</text>
<text x="60.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Глибина T_∞:</text>
<text x="160.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">O(N)  [вузьке місце нагорі]</text>
<text x="60.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Паралелізм:</text>
<text x="160.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">T₁ / T_∞ = O(log N)</text>
<text x="60.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Для N = 1 000 000: паралелізм лише ≈ 20× на будь-яких ядрах!</text>
<rect x="495.0" y="55.0" width="435.0" height="445.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="712.5" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Б. Повноцінний паралельний Merge Sort</text>
<text x="712.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Паралельний поділ + паралельне бінарне злиття</text>
<circle cx="712.5" cy="140.0" r="18.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="712.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Sort(N)</text>
<line x1="700.5" y1="154.0" x2="613.8" y2="195.0" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="724.5" y1="154.0" x2="811.2" y2="195.0" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="603.8" cy="210.0" r="16.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="603.8" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">N/2</text>
<circle cx="821.2" cy="210.0" r="16.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="821.2" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">N/2</text>
<text x="712.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">. . .</text>
<text x="712.5" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">[ Паралельне злиття через бінарний поділ медіани ]</text>
<rect x="540.0" y="295.0" width="345.0" height="70.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="2.0"/>
<text x="712.5" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПАРАЛЕЛЬНЕ ЗЛИТТЯ: ParallelMerge</text>
<text x="712.5" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Деревоподібна декомпозиція глибиною O(log² N)</text>
<text x="712.5" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кожен крок виконується паралельно багатьма ядрами</text>
<rect x="515.0" y="385.0" width="395.0" height="100.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="525.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Робота T₁:</text>
<text x="625.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">O(N log N)  [робочо-ефективна]</text>
<text x="525.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Глибина T_∞:</text>
<text x="625.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">O(log³ N) або O(log² N)</text>
<text x="525.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Паралелізм:</text>
<text x="625.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">T₁ / T_∞ = O(N / log² N)</text>
<text x="525.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Для N = 1 000 000: паралелізм зростає до ≈ 2500× !</text>
</svg>