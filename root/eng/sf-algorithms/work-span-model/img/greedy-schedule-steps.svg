<text x="723.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">T_P ≤ ⌊(T₁ - T_∞) / P⌋ + T_∞</text>
<text x="723.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">T_P &lt; T₁ / P + T_∞</text>
<text x="723.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Шедулер у межах 2× від оптимуму!</text>
