<text x="105.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Виконують рівно P вузлів. Кількість таких кроків k_full ≤ ⌊(T₁ - T_∞) / P⌋.</text>
<text x="105.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">У нашому прикладі: 4 повні кроки × 3 ядра = 12 виконаних одиниць роботи.</text>
<text x="90.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ea580c" text-anchor="start" font-weight="700">2. Неповні кроки (готових вузлів &lt; P):</text>
<text x="105.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Оскільки жадібний шедулер бере ВСІ готові вузли, критичний шлях зменшується на ≥ 1.</text>
<rect x="590.0" y="367.0" width="265.0" height="90.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
