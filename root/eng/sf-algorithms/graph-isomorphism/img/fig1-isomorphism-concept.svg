<rect x="649.0" y="119.5" width="252.0" height="131.1" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="775.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Таблиця бієкції π:</tspan><tspan x="775.0" dy="14.3">1 ↦ c | 2 ↦ a | 3 ↦ f</tspan><tspan x="775.0" dy="14.3">4 ↦ b | 5 ↦ e | 6 ↦ d</tspan><tspan x="775.0" dy="14.3"></tspan><tspan x="775.0" dy="14.3">Алгебраїчний критерій:</tspan><tspan x="775.0" dy="14.3">P · A(G₁) · Pᵀ = A(G₂)</tspan><tspan x="775.0" dy="14.3">де P — матриця перестановки.</tspan><tspan x="775.0" dy="14.3">(u, v) ∈ E(G₁) ⇔ (π(u), π(v)) ∈ E(G₂)</tspan></text>
<text x="440.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-style="italic">Ізоморфізм зберігає зв'язність і структурні властивості, незважаючи на зміну міток чи геометрії.</text>
