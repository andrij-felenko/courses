<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр генерації атак через Magic Bitboards (Ідеальне хешування за O(1))</text>
<rect x="30.0" y="65.0" width="150.0" height="72.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="105.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Повна зайнятість</text>
<text x="105.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Occupancy (64 біти)</text>
<line x1="180.0" y1="101.0" x2="222.0" y2="101.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="201.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">&amp;</text>
<rect x="222.0" y="65.0" width="150.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="297.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. Маска променів</text>
<text x="297.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">Relevant Mask (k біт)</text>
<text x="297.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Blockers = Occ &amp; Mask</text>
<line x1="372.0" y1="101.0" x2="414.0" y2="101.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="393.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">×</text>
<rect x="414.0" y="65.0" width="150.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="489.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. Магічне число</text>
<text x="489.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Magic 64-bit const</text>
<text x="489.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розносить біти в MSB</text>
<line x1="564.0" y1="101.0" x2="606.0" y2="101.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">&gt;&gt;</text>
<rect x="606.0" y="65.0" width="150.0" height="72.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="681.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">4. Зсув (64 - b)</text>
<text x="681.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Індекс у таблиці</text>
<text x="681.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Діапазон 0 .. 2ᵇ - 1</text>
<line x1="756.0" y1="101.0" x2="798.0" y2="101.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="798.0" y="65.0" width="150.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="873.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">5. Готова маска</text>
<text x="873.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">AttackTable[idx]</text>
<rect x="30.0" y="175.0" width="440.0" height="230.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="250.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математична суть хешування:</text>
<text x="45.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Для клітинки є k релевантних бітів-блокерів (k ≤ 12)</text>
<text x="45.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Кількість конфігурацій перешкод дорівнює 2ᵏ (64..4096)</text>
<text x="45.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• 64-бітне множення розносить активні біти k у верхні b розрядів</text>
<text x="45.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Зсув &gt;&gt; (64 - b) виділяє b старших бітів як ідеальний хеш</text>
<text x="45.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">• Без колізій: кожна конфігурація перешкод має свій індекс!</text>
<text x="45.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Часова складність: O(1) за 3 операції АЛП (AND, MUL, SHR)</text>
<rect x="510.0" y="175.0" width="440.0" height="230.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="730.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Апаратний еквівалент: BMI2 PEXT (x86 Haswell+)</text>
<text x="525.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Інструкція _pext_u64 витягує всі біти за маскою за 1 такт:</text>
<text x="525.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="start" font-weight="700">uint64_t idx = _pext_u64(occ, mask);</text>
<text x="525.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">uint64_t att = attack_table[base_offset + idx];</text>
<text x="525.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Усуває потребу пошуку магічних констант під час розробки</text>
<text x="525.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Розмір таблиці атак скорочується до мінімально можливого</text>
<text x="525.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">• Латентність виклику: рівно 1 машинний такт без зсувів!</text>
</svg>