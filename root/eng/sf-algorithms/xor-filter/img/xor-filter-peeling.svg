<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоетапна побудова Xor-фільтра: Лущення гіперграфа та Зворотна підстановка</text>
<rect x="40.0" y="56.0" width="380.0" height="390.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="230.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Етап 1: Лущення 3-гіперграфа (Peeling)</text>
<line x1="50.0" y1="92.0" x2="410.0" y2="92.0" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="55.0" y="106.0" width="350.0" height="70.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="65.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">1. Підрахунок степенів комірок</text>
<text x="65.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Кожен ключ k додає ребро (h₀(k), h₁(k), h₂(k))</text>
<text x="65.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Зберігаємо HCount[c] та HXor[c] (XOR ключів)</text>
<rect x="55.0" y="188.0" width="350.0" height="70.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="65.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Черга комірок степеня 1</text>
<text x="65.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Знаходимо всі слоти c, де HCount[c] == 1</text>
<text x="65.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">У таких слотах єдиний ключ k = HXor[c]</text>
<rect x="55.0" y="270.0" width="350.0" height="80.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="65.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">3. Видалення ребра та запис у стек</text>
<text x="65.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Кладемо пару (k, c) у стек LIFO</text>
<text x="65.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Зменшуємо лічильники для двох інших слотів k</text>
<text x="65.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Нові слоти зі степенем 1 додаємо в чергу</text>
<rect x="55.0" y="362.0" width="350.0" height="70.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="65.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Успіх лущення: Усі N ключів у стеку!</text>
<text x="65.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Якщо черга спорожніла раніше (є 2-ядро) —</text>
<text x="65.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">змінюємо seed хешування і повторюємо (O(N))</text>
<rect x="445.0" y="120.0" width="70.0" height="240.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="480.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Стек LIFO</text>
<text x="480.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">(k_N, c_N)</text>
<text x="480.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(k_N-1, c_N-1)</text>
<text x="480.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">⋮ (N пар)</text>
<text x="480.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(k₂, c₂)</text>
<text x="480.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">(k₁, c₁)</text>
<line x1="405.0" y1="310.0" x2="445.0" y2="180.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">push</text>
<rect x="540.0" y="56.0" width="300.0" height="390.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="690.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Етап 2: Зворотна підстановка</text>
<line x1="550.0" y1="92.0" x2="830.0" y2="92.0" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="555.0" y="106.0" width="270.0" height="85.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="565.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Витягування зі стеку (pop)</text>
<text x="565.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Зчитуємо пару (k, c) у зворотному</text>
<text x="565.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">порядку до моменту лущення.</text>
<text x="565.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Слот c був ізольованим для k!</text>
<rect x="555.0" y="203.0" width="270.0" height="110.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="565.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">2. Присвоєння значення B[c]</text>
<text x="565.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Знаходимо дві інші позиції k:</text>
<text x="565.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">c_a та c_b (вони вже мають фінал)</text>
<text x="565.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">B[c] = f(k) ⊕ B[c_a] ⊕ B[c_b]</text>
<text x="565.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Рівняння для k точно виконано!</text>
<rect x="555.0" y="325.0" width="270.0" height="95.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="565.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">3. Готовий фільтр</text>
<text x="565.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Порожні (незадіяні) слоти B</text>
<text x="565.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">заповнюються нулями.</text>
<text x="565.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Фільтр стає незмінним (immutable)</text>
<line x1="515.0" y1="180.0" x2="555.0" y2="146.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="520.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">pop</text>
<rect x="40.0" y="458.0" width="800.0" height="50.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.2"/>
<text x="440.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова складність побудови: O(N) у середньому завдяки фактору розширення M = 1.23 · N</text>
<text x="440.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">При c = 1.23 ймовірність успішного лущення з першої спроби перевищує 80%, а з 3 спроб — понад 99%</text>
</svg>