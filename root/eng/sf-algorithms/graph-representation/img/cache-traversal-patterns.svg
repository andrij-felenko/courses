<text x="750.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">100% корисних даних у кеші</text>
<rect x="627.0" y="255.0" width="246.0" height="160.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="750.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Усі сусіди лежать впритул</tspan><tspan x="750.0" dy="13.7">один до одного в масиві.</tspan><tspan x="750.0" dy="13.7">64-байтна лінія L1 кешу читає</tspan><tspan x="750.0" dy="13.7">одразу 16 сусідів (uint32_t).</tspan><tspan x="750.0" dy="13.7">Максимальна пропускна</tspan><tspan x="750.0" dy="13.7">здатність SIMD та Prefetcher.</tspan></text>
