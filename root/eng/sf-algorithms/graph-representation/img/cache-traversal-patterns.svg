<rect x="47.0" y="255.0" width="246.0" height="160.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="170.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Вузли виділені у випадкових</tspan><tspan x="170.0" dy="13.7">адресах динамічної купи.</tspan><tspan x="170.0" dy="13.7">Кожен перехід за вказівником</tspan><tspan x="170.0" dy="13.7">next спричиняє промах кешу.</tspan><tspan x="170.0" dy="13.7">Процесор простоює сотні</tspan><tspan x="170.0" dy="13.7">тактів під час читання RAM.</tspan></text>
