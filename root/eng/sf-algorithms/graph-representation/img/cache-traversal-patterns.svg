<text x="460.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">99% нулів = зайві зчитування</text>
<rect x="337.0" y="255.0" width="246.0" height="160.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="460.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Пам'ять читається послідовно</tspan><tspan x="460.0" dy="13.7">(добре для Prefetcher).</tspan><tspan x="460.0" dy="13.7">Але у розрідженому графі</tspan><tspan x="460.0" dy="13.7">99.9% комірок — нулі.</tspan><tspan x="460.0" dy="13.7">Кеш забивається непотрібними</tspan><tspan x="460.0" dy="13.7">даними (Cache Pollution).</tspan></text>
