<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розклад внутрішньої довжини шляху за коренем</text>
<line x1="410.0" y1="104.0" x2="300.0" y2="150.0" stroke="#c8ccd2" stroke-width="2.0"/>
<line x1="410.0" y1="104.0" x2="520.0" y2="150.0" stroke="#c8ccd2" stroke-width="2.0"/>
<polygon points="300.0,150.0 150.0,320.0 395.0,320.0" fill="#eef6ff" stroke="#9db8de" stroke-width="1.6"/>
<polygon points="520.0,150.0 445.0,320.0 690.0,320.0" fill="#eef6ff" stroke="#9db8de" stroke-width="1.6"/>
<text x="282.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">ліве піддерево</tspan><tspan x="282.0" dy="18.2">i − 1 менших ключів</tspan><tspan x="282.0" dy="18.2">(теж випадковий BST)</tspan></text>
<text x="552.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="552.0" dy="0.0">праве піддерево</tspan><tspan x="552.0" dy="18.2">n − i більших ключів</tspan><tspan x="552.0" dy="18.2">(теж випадковий BST)</tspan></text>
<circle cx="410.0" cy="104.0" r="24.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.6"/>
<text x="410.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">i</text>
<text x="410.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">корінь = ключ рангу i</text>
<text x="410.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(перший вставлений; ранг i рівноймовірний, 1/n)</text>
<rect x="189.7" y="342.0" width="440.6" height="40.0" rx="6" fill="#f4f8ff" stroke="#9db8de" stroke-width="1.5"/><text x="410.0" y="367.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">I(n)  =  (n − 1)  +  I(i − 1)  +  I(n − i)</tspan></text>
<text x="410.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">+(n − 1): кожен із n − 1 не-кореневих вузлів на одне ребро глибший через корінь</text>
</svg>