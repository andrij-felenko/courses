<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язок прямої задачі (Primal LP) та двоїстої (Dual LP) у Set Cover</text>
<rect x="30.0" y="52.0" width="360.0" height="280.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="210.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Пряма задача (Primal LP Relaxation)</text>
<text x="210.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Змінні підмножин: x_S ∈ [0, 1]</text>
<rect x="45.0" y="112.0" width="330.0" height="48.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="210.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Цільова функція: min ∑ w(S) · x_S</text>
<text x="210.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(мінімізація дробової вартості вибору)</text>
<rect x="45.0" y="172.0" width="330.0" height="58.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="210.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обмеження покриття для кожного e ∈ U:</text>
<text x="210.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">∑_{S : e ∈ S} x_S ≥ 1</text>
<rect x="45.0" y="242.0" width="330.0" height="75.0" rx="4" fill="#dbeafe" stroke="#2457d6" stroke-width="1.0"/>
<text x="210.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Частотне округлення (f-approximation):</text>
<text x="210.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Якщо e належить ≤ f множинам, то</text>
<text x="210.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">обираємо S, якщо x*_S ≥ 1/f → гарантія f·OPT</text>
<rect x="430.0" y="52.0" width="360.0" height="280.0" rx="6" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="610.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">Двоїста задача (Dual LP Packing)</text>
<text x="610.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Змінні бюджету елементів: y_e ≥ 0</text>
<rect x="445.0" y="112.0" width="330.0" height="48.0" rx="4" fill="#ffffff" stroke="#7e22ce" stroke-width="1.0"/>
<text x="610.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700">Цільова функція: max ∑ y_e</text>
<text x="610.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(максимізація сумарного внеску елементів)</text>
<rect x="445.0" y="172.0" width="330.0" height="58.0" rx="4" fill="#ffffff" stroke="#7e22ce" stroke-width="1.0"/>
<text x="610.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджетне обмеження для кожної S ∈ S:</text>
<text x="610.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700">∑_{e ∈ S} y_e ≤ w(S)</text>
<rect x="445.0" y="242.0" width="330.0" height="75.0" rx="4" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.0"/>
<text x="610.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">Прямо-двоїстий алгоритм (Primal-Dual):</text>
<text x="610.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Підвищуємо y_e для непокритих елементів,</text>
<text x="610.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle" font-weight="700">поки ∑ y_e = w(S) (насичення) → беремо S</text>
<line x1="396.0" y1="132.0" x2="424.0" y2="132.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">Dual ≤ Primal</text>
</svg>