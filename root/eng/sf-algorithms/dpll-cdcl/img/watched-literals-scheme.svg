<rect x="405.5" y="108.4" width="108.9" height="63.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Літерал 3</tspan><tspan x="460.0" dy="15.6">x₄</tspan><tspan x="460.0" dy="15.6">[Невизначено]</tspan></text>
