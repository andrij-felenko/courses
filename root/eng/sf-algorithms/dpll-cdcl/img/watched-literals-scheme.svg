<rect x="162.1" y="108.4" width="115.8" height="63.2" rx="6" fill="#fde8e8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Літерал 1</tspan><tspan x="220.0" dy="15.6">x₂</tspan><tspan x="220.0" dy="15.6">[Хибно (x₂=0)]</tspan></text>
