<text x="330.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Структура диз'юнкта C = (x₁ ∨ x₂ ∨ ¬x₃ ∨ x₄) та динаміка вказівників w₁, w₂</text>
