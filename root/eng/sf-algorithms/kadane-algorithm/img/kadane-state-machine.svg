<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логіка прийняття рішень на кожному кроці i</text>
<rect x="25.1" y="141.4" width="249.7" height="67.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Попередній стан:</tspan><tspan x="150.0" dy="15.6">S[i-1] (накопичена сума</tspan><tspan x="150.0" dy="15.6">підмасиву, що завершується в i-1)</tspan></text>
<rect x="340.0" y="150.0" width="100.0" height="50.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/>
<text x="390.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Елемент A[i]</text>
<text x="390.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(поточне число)</text>
<line x1="260.0" y1="175.0" x2="335.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="445.0" y1="160.0" x2="545.0" y2="115.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="495.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">S[i-1] &gt; 0</text>
<line x1="445.0" y1="190.0" x2="545.0" y2="235.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="495.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">S[i-1] ≤ 0</text>
<rect x="555.0" y="83.4" width="240.0" height="63.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Продовжити поточний підмасив:</tspan><tspan x="675.0" dy="15.6">S[i] = S[i-1] + A[i]</tspan><tspan x="675.0" dy="15.6">(попередній префікс є вигідним)</tspan></text>
<rect x="541.9" y="203.4" width="266.2" height="63.2" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/><text x="675.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Почати новий підмасив з A[i]:</tspan><tspan x="675.0" dy="15.6">S[i] = A[i]</tspan><tspan x="675.0" dy="15.6">(попередній тягар лише зменшує суму)</tspan></text>
<rect x="150.0" y="305.0" width="520.0" height="36.0" rx="4" fill="#f4f6f7" stroke="#333333" stroke-width="1.0"/>
<text x="410.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Глобальне оновлення: max_so_far = max(max_so_far, S[i])</text>
</svg>