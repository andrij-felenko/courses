<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема 0-1: збереження порядку при монотонному відображенні f(x)</text>
<text x="120.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Дійсні значення X:</text>
<rect x="320.0" y="62.0" width="70.0" height="36.0" rx="5" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/>
<text x="355.0" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">7.2</text>
<rect x="430.0" y="62.0" width="70.0" height="36.0" rx="5" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/>
<text x="465.0" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">3.1</text>
<rect x="540.0" y="62.0" width="70.0" height="36.0" rx="5" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/>
<text x="575.0" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">9.5</text>
<rect x="650.0" y="62.0" width="70.0" height="36.0" rx="5" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/>
<text x="685.0" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1.4</text>
<line x1="420.0" y1="112.0" x2="420.0" y2="148.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="435.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">f(x) = 1 при x ≥ 5.0,  0 при x &lt; 5.0</text>
<text x="120.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Бінарні значення B = f(X):</text>
<rect x="320.0" y="167.0" width="70.0" height="36.0" rx="5" fill="#fdecea" stroke="#333333" stroke-width="1.5"/>
<text x="355.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<rect x="430.0" y="167.0" width="70.0" height="36.0" rx="5" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="465.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">0</text>
<rect x="540.0" y="167.0" width="70.0" height="36.0" rx="5" fill="#fdecea" stroke="#333333" stroke-width="1.5"/>
<text x="575.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<rect x="650.0" y="167.0" width="70.0" height="36.0" rx="5" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="685.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">0</text>
<rect x="100.0" y="235.0" width="640.0" height="140.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Основна властивість монотонної неспадної функції f:</text>
<text x="420.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">f( min(a, b) )  =  min( f(a), f(b) )</text>
<text x="420.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">f( max(a, b) )  =  max( f(a), f(b) )</text>
<text x="420.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Якщо мережа сортує всі 2ⁿ бінарних векторів → вона сортує будь-які дійсні числа!</text></svg>
