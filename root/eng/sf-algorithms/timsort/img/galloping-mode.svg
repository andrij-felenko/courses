<text x="522.5" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">B[3] = 23</text>
<text x="522.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">23 &lt; 45</text>
<text x="522.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">продовжуємо</text>
<rect x="630.0" y="170.0" width="175.0" height="100.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="717.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">k=3 (зсув 7)</text>
<text x="717.5" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">B[7] = 52</text>
<text x="717.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">52 &gt; 45</text>
<text x="717.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">СТОП! Межу знайдено</text>
<rect x="40.0" y="290.0" width="780.0" height="115.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="55.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Фаза 2: Двійковий пошук у локалізованому діапазоні [індекс 3 .. індекс 7]</text>
<text x="55.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Замість лінійного сканування всіх елементів двійковий пошук виконує лише ⌈log₂(5)⌉ = 3 порівняння.</text>
<text x="55.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Точний індекс знайдено: B[6] = 41 &lt; 45 &lt; B[7] = 52. Всі 7 елементів B[0..6] копіюються за 1 виклик memmove.</text>
<text x="55.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Економія: 4 порівняння на стрибках + 3 порівняння у бінарному пошуку = 7 порівнянь замість лінійного перебору.</text>
