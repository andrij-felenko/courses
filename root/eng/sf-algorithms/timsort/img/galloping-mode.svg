<text x="40.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Фаза 1: Експоненційні стрибки зі зсувом 2^k - 1</text>
<rect x="45.0" y="170.0" width="175.0" height="100.0" rx="5" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
