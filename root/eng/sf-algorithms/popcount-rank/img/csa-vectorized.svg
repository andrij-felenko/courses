<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 510">
<rect x="15.0" y="15.0" width="810.0" height="480.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторизований підрахунок: компресори Carry-Save Adder (3:2 CSA)</text>
<text x="420.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Алгоритм Харлі-Сіла згортає 3 вектори у суму та перенос без горизонтального розповсюдження бітів</text>
<rect x="60.0" y="100.0" width="200.0" height="45.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="160.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Векторне слово A (64/256/512b)</text>
<rect x="320.0" y="100.0" width="200.0" height="45.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="420.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Векторне слово B (64/256/512b)</text>
<rect x="580.0" y="100.0" width="200.0" height="45.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="680.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Векторне слово C (64/256/512b)</text>
<rect x="180.0" y="185.0" width="480.0" height="110.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.0"/>
<text x="420.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Повний тривходовий двійковий суматор (3:2 CSA)</text>
<text x="420.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Сума (Sum): s = A ⊕ B ⊕ C (побітове XOR)</text>
<text x="420.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Перенос (Carry): c = (A ∧ B) ∨ (B ∧ C) ∨ (C ∧ A) [з вагою 2]</text>
<rect x="140.0" y="335.0" width="240.0" height="55.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="260.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#854d0e" text-anchor="middle" font-weight="700">Вихідний біт суми (вага 1)</text>
<text x="260.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Накопичується у лічильнику Onés</text>
<rect x="460.0" y="335.0" width="240.0" height="55.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="580.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#854d0e" text-anchor="middle" font-weight="700">Вихідний біт переносу (вага 2)</text>
<text x="580.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Передається на наступний каскад CSA</text>
<rect x="40.0" y="425.0" width="760.0" height="55.0" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.2"/>
<text x="420.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#581c87" text-anchor="middle" font-weight="700">Дерево компресорів 7:3 і 15:4 дозволяє згортати 16 слів пам'яті лише за кілька SIMD-інструкцій</text>
<text x="420.0" y="469.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Пропускна здатність: понад 15-20 ГБ/с підрахунку одиниць на одне ядро CPU</text>
</svg>