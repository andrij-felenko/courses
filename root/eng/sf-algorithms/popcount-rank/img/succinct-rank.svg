<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500">
<rect x="15.0" y="15.0" width="810.0" height="470.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівнева лаконічна структура rank1(i) через popcount</text>
<text x="420.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Суперблоки фіксують абсолютний ранг, блоки — відносний, залишок — апаратний popcount</text>
<rect x="40.0" y="100.0" width="760.0" height="75.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="60.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="start" font-weight="700">Рівень 1: Суперблок (512 або 2048 бітів)</text>
<text x="60.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Зберігає абсолютну кількість одиниць від початку бітового масиву: S[k] = rank1(k · L₁)</text>
<rect x="580.0" y="115.0" width="200.0" height="45.0" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="680.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">S[k] = 1420 одиниць</text>
<rect x="40.0" y="195.0" width="760.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="60.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="start" font-weight="700">Рівень 2: Базові блоки (64-бітні слова всередині суперблока)</text>
<text x="60.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Зберігає відносне зміщення рангу всередині суперблока (упаковані 9-бітні лічильники)</text>
<rect x="60.0" y="253.0" width="82.0" height="28.0" rx="3" fill="#ffffff" stroke="#22c55e" stroke-width="1.0"/>
<text x="101.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">B[0]: +0</text>
<rect x="150.0" y="253.0" width="82.0" height="28.0" rx="3" fill="#ffffff" stroke="#22c55e" stroke-width="1.0"/>
<text x="191.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">B[1]: +4</text>
<rect x="240.0" y="253.0" width="82.0" height="28.0" rx="3" fill="#ffffff" stroke="#22c55e" stroke-width="1.0"/>
<text x="281.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">B[2]: +8</text>
<rect x="330.0" y="253.0" width="82.0" height="28.0" rx="3" fill="#ffffff" stroke="#22c55e" stroke-width="1.0"/>
<text x="371.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">B[3]: +12</text>
<rect x="420.0" y="253.0" width="82.0" height="28.0" rx="3" fill="#ffffff" stroke="#22c55e" stroke-width="1.0"/>
<text x="461.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">B[4]: +16</text>
<rect x="510.0" y="253.0" width="82.0" height="28.0" rx="3" fill="#ffffff" stroke="#22c55e" stroke-width="1.0"/>
<text x="551.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">B[5]: +20</text>
<rect x="600.0" y="253.0" width="82.0" height="28.0" rx="3" fill="#ffffff" stroke="#22c55e" stroke-width="1.0"/>
<text x="641.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">B[6]: +24</text>
<rect x="690.0" y="253.0" width="82.0" height="28.0" rx="3" fill="#ffffff" stroke="#22c55e" stroke-width="1.0"/>
<text x="731.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">B[7]: +28</text>
<rect x="40.0" y="310.0" width="760.0" height="110.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="60.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#854d0e" text-anchor="start" font-weight="700">Рівень 3: Цільове 64-бітне слово W та бітова маска залишку</text>
<text x="60.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Маска виділяє розряди, менші за (i mod 64): mask = (1ULL &lt;&lt; (i mod 64)) - 1</text>
<text x="60.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Апаратна інструкція обчислює одиниці в залишку: popcount(W &amp; mask)</text>
<rect x="540.0" y="345.0" width="240.0" height="50.0" rx="4" fill="#ffffff" stroke="#eab308" stroke-width="1.2"/>
<text x="660.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#854d0e" text-anchor="middle" font-weight="700">popcount(W &amp; mask) = 5</text>
<rect x="40.0" y="435.0" width="760.0" height="36.0" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.0"/>
<text x="420.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підсумок: rank1(i) = Superblock[i/L₁] + BlockOffset[i/64] + popcount(W &amp; mask)</text>
</svg>