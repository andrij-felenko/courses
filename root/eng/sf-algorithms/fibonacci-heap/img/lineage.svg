<text x="210.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійкова купа</text>
<text x="210.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Дж. Вільямс (J. Williams)</text>
<text x="210.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">heapsort · CACM</text>
<line x1="210.0" y1="216.0" x2="210.0" y2="239.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="3,3"/>
<circle cx="210.0" cy="250.0" r="10.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.4"/>
<rect x="375.0" y="100.0" width="250.0" height="116.0" rx="8" fill="#eef3fe" stroke="#2457d6" stroke-width="1.6"/>
<text x="500.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">1978</text>
<text x="500.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Біноміальна купа</text>
<text x="500.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Жан Вюймен (J. Vuillemin)</text>
<text x="500.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">CACM 21(4)</text>
<line x1="500.0" y1="216.0" x2="500.0" y2="239.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="3,3"/>
<circle cx="500.0" cy="250.0" r="10.0" fill="#eef3fe" stroke="#2457d6" stroke-width="2.4"/>
<rect x="675.0" y="100.0" width="250.0" height="116.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="800.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">1984</text>
<text x="800.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фібоначчієва купа</text>
<text x="800.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Фредман і Тарджан</text>
<text x="800.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">FOCS · JACM 1987</text>
<line x1="800.0" y1="216.0" x2="800.0" y2="239.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3,3"/>
<circle cx="800.0" cy="250.0" r="10.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<rect x="90.0" y="300.0" width="820.0" height="176.0" rx="10" fill="#f0fbf3" stroke="#27ae60" stroke-width="1.6"/>
<line x1="500.0" y1="261.0" x2="500.0" y2="300.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="3,3"/>
<line x1="800.0" y1="261.0" x2="800.0" y2="300.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="500.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна кафедра, один рік</text>
<text x="500.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Жан Вюймен, Майкл Фредман і Роберт Тарджан здобули докторат у Стенфорді 1972 року</tspan><tspan x="500.0" dy="19.6">(наукові керівники — Зогар Манна, Дональд Кнут і Роберт Флойд відповідно).</tspan><tspan x="500.0" dy="19.6">Біноміальна й фібоначчієва купи виросли з тієї самої школи.</tspan></text>
<text x="500.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Мета — зменшити ключ за O(1); наслідок — Дейкстра і Прим за O(E + V·log V).</text>
</svg>