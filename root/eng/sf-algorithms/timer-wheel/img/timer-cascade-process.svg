<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кроки алгоритму каскадування таймерів при зміщенні покажчика колеса</text>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процес каскадування таймерів (Cascade Process)</text>
<rect x="54.0" y="87.3" width="252.0" height="45.3" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">1. TV1 робить оберт (255 → 0)</tspan><tspan x="180.0" dy="14.3">Поточний tick підходить до TV2[index]</tspan></text>
<line x1="180.0" y1="150.0" x2="180.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="82.2" y="210.2" width="195.6" height="59.6" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="180.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">2. Витягування всього списку</tspan><tspan x="180.0" dy="14.3">таймерів із TV2[index]</tspan><tspan x="180.0" dy="14.3">(слот TV2 очищається)</tspan></text>
<line x1="310.0" y1="240.0" x2="420.0" y2="240.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="425.2" y="210.2" width="289.6" height="59.6" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="570.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">3. Для кожного таймера обчислюється</tspan><tspan x="570.0" dy="14.3">залишок часу Δ = expire - current_tick.</tspan><tspan x="570.0" dy="14.3">Таймер переноситься у відповідний слот TV1!</tspan></text>
<line x1="570.0" y1="180.0" x2="570.0" y2="140.0" stroke="#f39c12" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="475.4" y="70.2" width="189.3" height="59.6" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="570.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">4. Точне O(1) виконання:</tspan><tspan x="570.0" dy="14.3">Таймер гарантовано спрацює</tspan><tspan x="570.0" dy="14.3">під час точного тіку в TV1!</tspan></text>
<rect x="80.0" y="310.0" width="680.0" height="80.0" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.2"/>
<text x="420.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключова перевага каскадування:</text>
<text x="420.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Замість того щоб перевіряти кожен таймер на кожному тіку ($O(N)$),</tspan><tspan x="420.0" dy="14.3">таймер перебуває «в списку очікування» вищого колеса і переноситься в TV1</tspan><tspan x="420.0" dy="14.3">лише тоді, коли до його спрацьовування лишається менше ніж 256 тіків!</tspan></text>
</svg>