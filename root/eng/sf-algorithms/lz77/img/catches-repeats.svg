<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три погляди на надлишок: символ, серія, візерунок</text>
<rect x="20.0" y="70.0" width="224.0" height="168.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="132.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ентропійний код</text>
<line x1="38.0" y1="110.0" x2="226.0" y2="110.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="132.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="132.0" dy="0.0">частим символам —</tspan><tspan x="132.0" dy="14.3">коротші коди.</tspan><tspan x="132.0" dy="14.3">бачить лише</tspan><tspan x="132.0" dy="14.3">частоту ОДНОГО</tspan><tspan x="132.0" dy="14.3">символу</tspan></text>
<rect x="268.0" y="70.0" width="224.0" height="168.0" rx="6" fill="#fdf6e3" stroke="#d98a00" stroke-width="1.8"/>
<text x="380.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="700">RLE</text>
<line x1="286.0" y1="110.0" x2="474.0" y2="110.0" stroke="#d98a00" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="380.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">згортає серію</tspan><tspan x="380.0" dy="14.3">ОДНАКОВИХ</tspan><tspan x="380.0" dy="14.3">поспіль.</tspan><tspan x="380.0" dy="14.3">не бачить</tspan><tspan x="380.0" dy="14.3">розділених повторів</tspan></text>
<rect x="516.0" y="70.0" width="224.0" height="168.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="628.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">LZ77</text>
<line x1="534.0" y1="110.0" x2="722.0" y2="110.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="628.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="628.0" dy="0.0">посилається на</tspan><tspan x="628.0" dy="14.3">цілий ВІЗЕРУНОК,</tspan><tspan x="628.0" dy="14.3">що вже траплявся.</tspan><tspan x="628.0" dy="14.3">ловить повтори,</tspan><tspan x="628.0" dy="14.3">невидимі іншим</tspan></text>
<text x="380.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">«the…the…the» — нуль однакових поспіль, та візерунок повторюється: здобич саме LZ77</text>
</svg>