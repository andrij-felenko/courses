<text x="35.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Для кожного з N елементів викликається RandInt(1, i). Понад 99.9% перевірок закінчуються відкиданням.</text>
