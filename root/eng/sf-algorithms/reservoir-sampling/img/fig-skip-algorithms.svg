<text x="35.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Algorithm L (Vitter): O(k · log(N/k)) викликів генератора через довжину стрибка S</text>
<text x="35.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Обчислюється випадкова кількість елементів S для пропуску: S = ⌊ln(U) / ln(1 - W)⌋. Елементи всередині інтервалу ігноруються.</text>
