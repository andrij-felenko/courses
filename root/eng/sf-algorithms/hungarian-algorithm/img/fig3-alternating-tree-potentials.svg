<rect x="26.4" y="366.2" width="827.1" height="47.6" rx="6" fill="#fffbeb" stroke="#e08a1e" stroke-width="1.5"/><text x="440.0" y="386.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Коригування потенціалів на величину Δ: u[i] += Δ для i ∈ S, v[j] -= Δ для j ∈ T.</tspan><tspan x="440.0" dy="15.6">Для j ∉ T залишок slack зменшується: slack[j] -= Δ. При slack[j]=0 з'являється нове нульове ребро без рестарту пошуку.</tspan></text>
