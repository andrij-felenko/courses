<rect x="500.0" y="125.0" width="380.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Увага: видалення head вимагає переписати саму змінну head.</tspan><tspan x="690.0" dy="13.7">Видалення з середини вимагає перевірки prev != NULL.</tspan><tspan x="690.0" dy="13.7">Код містить безліч гілок if/else.</tspan></text>
