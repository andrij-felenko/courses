<rect x="430.0" y="70.0" width="220.0" height="180.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="540.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">2. Цикл стиснення блоків</tspan><tspan x="540.0" dy="11.7"></tspan><tspan x="540.0" dy="11.7">• Читання 64-біт (SWAR/SIMD)</tspan><tspan x="540.0" dy="11.7">• k = Read64(ptr)</tspan><tspan x="540.0" dy="11.7">• k *= Prime1</tspan><tspan x="540.0" dy="11.7">• k = ROTL(k, r1)</tspan><tspan x="540.0" dy="11.7">• k *= Prime2</tspan><tspan x="540.0" dy="11.7">• state ^= k; state = ROTL(state, r2)</tspan></text>
<line x1="390.0" y1="150.0" x2="430.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="275.0" width="220.0" height="100.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="540.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">3. Обробка хвоста та length</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">• Решта 1..7 байтів</tspan><tspan x="540.0" dy="15.6">• state ^= TailBytes</tspan><tspan x="540.0" dy="15.6">• state ^= total_len</tspan></text>
