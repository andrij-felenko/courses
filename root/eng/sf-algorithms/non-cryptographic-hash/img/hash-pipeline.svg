<rect x="220.0" y="90.0" width="170.0" height="120.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">1. Ініціалізація стану</tspan><tspan x="305.0" dy="15.6"></tspan><tspan x="305.0" dy="15.6">h1 = Seed ^ C1</tspan><tspan x="305.0" dy="15.6">h2 = Seed ^ C2</tspan><tspan x="305.0" dy="15.6">(ILP акумулятори)</tspan></text>
