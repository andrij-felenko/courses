<text x="460.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр обробки некриптографічної хеш-функції (MurmurHash / xxHash)</text>
<rect x="40.0" y="75.0" width="140.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Вхідний блок</tspan><tspan x="110.0" dy="16.9">(ключ + len)</tspan></text>
