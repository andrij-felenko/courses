<line x1="542.0" y1="171.0" x2="542.0" y2="199.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="578.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Вертикальний крок (y + 1):</text>
<text x="578.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Вставка з B (вартість +1 правка)</text>
<line x1="520.0" y1="221.0" x2="562.0" y2="243.0" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="578.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Діагональний крок — Змія (Snake):</text>
<text x="578.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Збіг символів A[x]==B[y] (вартість 0)</text>
<rect x="515.0" y="281.0" width="305.0" height="150.0" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.0"/>
<text x="667.5" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Діагональний інваріант k = x − y</text>
<text x="525.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start">• Крок D пересуває координати на нові k.</text>
<text x="525.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start">• Зсув k-1 → k: рух вправо (видалення).</text>
<text x="525.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start">• Зсув k+1 → k: рух вниз (вставка).</text>
<text x="525.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start">• Парність k завжди збігається з парністю D.</text>
<text x="525.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start">• Складність: O((N + M) · D) замість O(N · M).</text>
</svg>