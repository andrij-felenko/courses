<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10.61 -10 1034.11 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10.61" y="-10" width="1034.11" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="520.0" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.0"/>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм Гіршберґа: розділяй і володарюй у матриці DP</text>
<rect x="70.0" y="75.0" width="380.0" height="380.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="70.0" y1="265.0" x2="450.0" y2="265.0" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="38.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">A[1 .. N/2]</text>
<text x="38.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">A[N/2+1 .. N]</text>
<text x="50.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">i = N/2</text>
<text x="165.0" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">B[1 .. j*]</text>
<text x="355.0" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">B[j*+1 .. M]</text>
<line x1="252.0" y1="75.0" x2="252.0" y2="455.0" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="252.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">Оптимальний розріз j*</text>
<rect x="70.0" y="75.0" width="182.0" height="190.0" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="161.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Підзадача 1 (Top-Left)</text>
<text x="161.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">Рекурсивний виклик</text>
<rect x="252.0" y="265.0" width="198.0" height="190.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="351.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Підзадача 2 (Bottom-Right)</text>
<text x="351.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">Рекурсивний виклик</text>
<line x1="100.0" y1="100.0" x2="237.0" y2="255.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="160.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">Прямий DP вектор</text>
<text x="160.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1d4ed8" text-anchor="middle">Lfwd[N/2, j]</text>
<line x1="420.0" y1="430.0" x2="267.0" y2="275.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Зворотний DP вектор</text>
<text x="360.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">Lbwd[N/2, j]</text>
<circle cx="252.0" cy="265.0" r="7.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.0"/>
<text x="260.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">(N/2, j*)</text>
<circle cx="70.0" cy="75.0" r="5.0" fill="#1e293b" stroke="none" stroke-width="1.5"/>
<text x="82.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">(0, 0)</text>
<circle cx="450.0" cy="455.0" r="5.0" fill="#1e293b" stroke="none" stroke-width="1.5"/>
<text x="438.0" y="447.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">(N, M)</text>
<rect x="490.0" y="75.0" width="345.0" height="410.0" rx="6" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.0"/>
<text x="662.5" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому пам'ять стає лінійною O(N + M)</text>
<text x="505.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">1. Поділ рядків навпіл:</text>
<text x="505.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Фіксуємо середину першої послідовності i = N / 2.</text>
<text x="505.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">2. Прямий прохід DP (Score Lfwd):</text>
<text x="505.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Обчислюємо DP від (0,0) до рядка N/2 за 2 векторні рядки (O(M) пам'яті).</text>
<text x="505.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">3. Зворотний прохід (Score Lbwd):</text>
<text x="505.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Обчислюємо DP від (N,M) назад до рядка N/2 також за 2 рядки пам'яті.</text>
<text x="505.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">4. Пошук точки перетину j*:</text>
<text x="505.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Знаходимо індекс j, де Lfwd[j] + Lbwd[j] є максимальним. Ця точка гарантовано належить оптимальному вирівнюванню.</text>
<text x="505.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">5. Рекурсивне розбиття:</text>
<text x="505.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Залишаються лише прямокутники Top-Left та Bottom-Right (сумарна площа = 1/2 від початкової).</text>
<rect x="505.0" y="395.0" width="315.0" height="75.0" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="662.5" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Сумарна складність Гіршберґа</text>
<text x="662.5" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="middle">Час: NM · (1 + 1/2 + 1/4 + ...) = 2 · N · M = O(N · M)</text>
<text x="662.5" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">Пам'ять: 2 · (M + 1) комірки = O(N + M)</text>
</svg>