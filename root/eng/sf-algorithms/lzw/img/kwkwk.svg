<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка KwKwK: декодер на крок позаду — і як її обійти</text>
<rect x="103.0" y="79.3" width="184.0" height="61.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="195.0" y="99.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">кодувальник видає код 4</tspan><tspan x="195.0" dy="15.0">і В ТУ Ж МИТЬ додає</tspan><tspan x="195.0" dy="15.0">4 = ABA</tspan></text>
<rect x="463.7" y="79.3" width="162.6" height="61.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="545.0" y="99.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">декодер читає код 4,</tspan><tspan x="545.0" dy="15.0">а в його таблиці</tspan><tspan x="545.0" dy="15.0">коду 4 ЩЕ НЕМА</tspan></text>
<line x1="305.0" y1="110.0" x2="425.0" y2="110.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="370.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">крок позаду</text>
<rect x="96.2" y="194.2" width="547.6" height="31.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="370.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">виверт: невідомий рядок = попередній (AB) + його ж перший символ (A) = ABA</tspan></text>
<text x="370.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">трапляється рівно тоді, коли рядок iде підряд сам за собою (взірець cScSc)</text>
