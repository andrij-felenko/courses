<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому cScSc — єдиний випадок, коли коду ще немає</text>
<rect x="282.3" y="47.3" width="155.5" height="61.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="360.0" y="67.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">декодер завжди має</tspan><tspan x="360.0" dy="15.0">усі коди, КРІМ</tspan><tspan x="360.0" dy="15.0">наступного-вільного</tspan></text>
<line x1="360.0" y1="110.7" x2="360.0" y2="134.7" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="268.0" y="144.7" width="184.0" height="61.4" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.7"/><text x="360.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">отже єдиний бракливий</tspan><tspan x="360.0" dy="15.0">код = той, що його</tspan><tspan x="360.0" dy="15.0">кодувальник щойно завів</tspan></text>
<line x1="360.0" y1="208.1" x2="360.0" y2="232.1" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="268.0" y="242.1" width="184.0" height="61.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="360.0" y="261.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">а так буває лише коли</tspan><tspan x="360.0" dy="15.0">рядок iде підряд сам за</tspan><tspan x="360.0" dy="15.0">собою (взірець cScSc)</tspan></text>
<line x1="360.0" y1="305.5" x2="360.0" y2="329.5" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="260.9" y="339.5" width="198.2" height="61.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="360.0" y="359.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">тоді бракливий рядок =</tspan><tspan x="360.0" dy="15.0">prev + перший символ prev</tspan><tspan x="360.0" dy="15.0">— завжди, без винятків</tspan></text>
</svg>