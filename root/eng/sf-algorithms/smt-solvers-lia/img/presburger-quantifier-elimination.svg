<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="720.0" height="380.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="370.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Елімінація кванторів у теорії Пресбургера (Алгоритм Купера)</text>
<text x="370.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Зведення ∃x. F(x) до скінченної диз'юнкції безкванторних формул за періодичністю конгруенцій</text>
<rect x="30.0" y="82.3" width="680.0" height="45.3" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="370.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Початкова кванторна формула: ∃x. ( ∧ᵢ (aᵢ ≤ x)  ∧  ∧ⱼ (x ≤ bⱼ)  ∧  ∧ₖ (dₖ | (x + cₖ)) )</tspan><tspan x="370.0" dy="14.3">↓ Еквівалентне розгортання через найменше спільне кратне δ = НСК(d₁, ..., dₘ)</tspan></text>
<line x1="50.0" y1="230.0" x2="690.0" y2="230.0" stroke="#333333" stroke-width="2.0"/>
<line x1="680.0" y1="230.0" x2="700.0" y2="230.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="705.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">x</text>
<circle cx="160.0" cy="230.0" r="6.0" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
<text x="160.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">Нижня межа aᵢ</text>
<line x1="160.0" y1="224.0" x2="160.0" y2="250.0" stroke="#ef4444" stroke-width="1.5"/>
<rect x="160.0" y="195.0" width="260.0" height="70.0" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="290.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Інтервал тестових точок: aᵢ + j, де j ∈ {1, 2, ..., δ}</text>
<circle cx="203.3" cy="230.0" r="4.0" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
<text x="203.3" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">aᵢ+1</text>
<circle cx="246.7" cy="230.0" r="4.0" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
<text x="246.7" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">aᵢ+2</text>
<circle cx="290.0" cy="230.0" r="4.0" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
<text x="290.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">aᵢ+3</text>
<circle cx="333.3" cy="230.0" r="4.0" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
<text x="333.3" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">aᵢ+4</text>
<circle cx="376.7" cy="230.0" r="4.0" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
<text x="376.7" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">aᵢ+5</text>
<circle cx="420.0" cy="230.0" r="6.0" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
<text x="413.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">aᵢ+δ</text>
<circle cx="600.0" cy="230.0" r="6.0" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="600.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">Верхня межа bⱼ</text>
<line x1="600.0" y1="224.0" x2="600.0" y2="250.0" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="30.0" y="306.2" width="680.0" height="47.6" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="370.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Результат елімінації: F_elim ≡ ∨ᵢ ∨ⱼ₌₁^δ F(aᵢ + j)  ∨  F_{-∞}</tspan><tspan x="370.0" dy="15.6">(Формула стає безкванторною з предикатами конгруенцій d | term)</tspan></text>
<text x="370.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Оскільки конгруенції dₖ | (x + cₖ) повторюються з періодом δ, достатньо перевірити перші δ цілих значень вище кожної нижньої межі</text>
</svg>