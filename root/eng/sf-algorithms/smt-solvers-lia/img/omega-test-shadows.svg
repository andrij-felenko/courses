<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-20" y="-10" width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="700.0" height="370.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="360.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Омега-тест Вільяма П'ю: Проекції та тіні обмежень</text>
<text x="360.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Елімінація цілочисельних змінних через дійсну, темну та сіру тіні</text>
<rect x="80.0" y="95.0" width="560.0" height="65.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="100.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="start" font-weight="700">Дійсна тінь (Real Shadow)</text>
<text x="100.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="start">Неперервна проекція Фур'є-Моцкіна. Якщо тут немає дійсного розв'язку → формула UNSAT</text>
<rect x="160.0" y="175.0" width="400.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="180.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="start" font-weight="700">Темна тінь (Dark Shadow)</text>
<text x="180.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="start">Звужена проекція: кожна ціла точка гарантовано має цілий прообраз → SAT</text>
<rect x="80.0" y="255.0" width="75.0" height="60.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="117.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Сіра тінь</text>
<text x="117.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Перебір</text>
<rect x="565.0" y="255.0" width="75.0" height="60.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="602.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Сіра тінь</text>
<text x="602.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Перебір</text>
<rect x="165.0" y="255.0" width="390.0" height="60.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="360.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Область гарантованої цілочисельності (Dark Shadow)</text>
<text x="360.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розв'язок знайдено безпосередньо без перебору гілок</text>
<line x1="80.0" y1="335.0" x2="640.0" y2="335.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Вісь спроектованих змінних z = Σ cᵢ xᵢ</text>
<text x="360.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Омега-тест працює точно: темна тінь дає швидкий SAT, відсутність дійсної — UNSAT, а сіра тінь вимагає вичерпного тестування скінченного набору точок</text>
</svg>