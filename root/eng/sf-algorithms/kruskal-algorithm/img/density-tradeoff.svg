<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 960 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="960" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="460.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння алгоритмів кістякових дерев залежно від щільності графа</text>
<line x1="90.0" y1="390.0" x2="645.0" y2="390.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="90.0" y1="390.0" x2="90.0" y2="65.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="355.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Щільність графа: відношення кількості ребер |E| до |V|  -&gt;</text>
<text transform="translate(35.0,235.0) rotate(-90)" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Час виконання T(V, E)  -&gt;</text>
<line x1="90.0" y1="390.0" x2="90.0" y2="396.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="90.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">E = V (дерево)</text>
<line x1="264.9" y1="390.0" x2="264.9" y2="396.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="264.9" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">E = 4V (розріджений)</text>
<line x1="264.9" y1="390.0" x2="264.9" y2="80.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="439.8" y1="390.0" x2="439.8" y2="396.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="439.8" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">E = V^1.5 (середній)</text>
<line x1="439.8" y1="390.0" x2="439.8" y2="80.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="620.0" y1="390.0" x2="620.0" y2="396.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="620.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">E = V^2 / 2 (повний)</text>
<line x1="620.0" y1="390.0" x2="620.0" y2="80.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="84.0" y1="390.0" x2="90.0" y2="390.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="78.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="end">O(V)</text>
<line x1="84.0" y1="287.7" x2="90.0" y2="287.7" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="78.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="end">O(V log V)</text>
<line x1="84.0" y1="185.4" x2="90.0" y2="185.4" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="78.0" y="189.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="end">O(E log V)</text>
<line x1="84.0" y1="95.5" x2="90.0" y2="95.5" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="78.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="end">O(V^2 log V)</text>
