<rect x="645.0" y="75.0" width="280.0" height="315.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="785.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Рекомендації вибору</text>
<line x1="660.0" y1="130.0" x2="690.0" y2="130.0" stroke="#2563eb" stroke-width="2.8"/>
<text x="697.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="start" font-weight="700">Краскал: O(E log V)</text>
<text x="697.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle"><tspan x="697.0" dy="0.0">Найкращий для розріджених</tspan><tspan x="697.0" dy="13.0">графів (E &lt;= V log V), простий у кеші.</tspan></text>
<line x1="660.0" y1="200.0" x2="690.0" y2="200.0" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="5 3"/>
<text x="697.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">Прим (двійкова купа): O(E log V)</text>
<text x="697.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle"><tspan x="697.0" dy="0.0">Зручний при списковому</tspan><tspan x="697.0" dy="13.0">представленні та динамічному графі.</tspan></text>
<line x1="660.0" y1="270.0" x2="690.0" y2="270.0" stroke="#10b981" stroke-width="2.6"/>
<text x="697.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">Прим (матриця): O(V^2)</text>
<text x="697.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle"><tspan x="697.0" dy="0.0">Неперевершений на надщільних</tspan><tspan x="697.0" dy="13.0">графах (E ≈ V^2), без сортування.</tspan></text>
<rect x="692.2" y="336.9" width="185.6" height="36.1" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="785.0" y="351.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Краскал виграє всюди, де граф</tspan><tspan x="785.0" dy="13.7">не є екстремально щільним.</tspan></text>
