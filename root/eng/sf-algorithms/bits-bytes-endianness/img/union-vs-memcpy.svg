<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дістати байти float: union проти memcpy</text>
<rect x="330.0" y="78.0" width="300.0" height="46.0" rx="8" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="480.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">float f = 1.0f</text>
<text x="480.0" y="117.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6b7280" text-anchor="middle">біти IEEE-754: 0x3F800000</text>
<rect x="60.0" y="150.0" width="400.0" height="300.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/>
<text x="260.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">union — спільна пам'ять</text>
<text x="82.0" y="206.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">union { float f;</text>
<text x="82.0" y="227.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">        uint8_t b[4]; } u;</text>
<text x="82.0" y="248.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">u.f = 1.0f;</text>
<text x="82.0" y="269.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1a1a1a" text-anchor="start">u.b[0] … u.b[3]  // читаємо байти</text>
<rect x="130.0" y="300.0" width="60.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="160.0" y="322.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">3F</text>
<rect x="195.0" y="300.0" width="60.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="225.0" y="322.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">80</text>
<rect x="260.0" y="300.0" width="60.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="290.0" y="322.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">00</text>
<rect x="325.0" y="300.0" width="60.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="355.0" y="322.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">00</text>
<text x="260.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ті самі 4 байти</text>
<text x="260.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">f і b[] — два «вікна» в одну комірку</text>
<rect x="80.0" y="378.0" width="360.0" height="56.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="260.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">У C — поширена практика й зазвичай працює.</text>
<text x="260.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">У C++ читати НЕ той член union — формально UB.</text>
<rect x="500.0" y="150.0" width="400.0" height="300.0" rx="12" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.9"/>
<text x="700.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">memcpy — байтова копія</text>
<text x="522.0" y="210.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">uint8_t b[4];</text>
<text x="522.0" y="234.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">memcpy(b, &amp;f, 4);  // байт-у-байт</text>
<text x="522.0" y="258.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#27ae60" text-anchor="start">// b[] тепер копія байтів f</text>
<rect x="560.0" y="290.0" width="120.0" height="34.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="620.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">f (float)</text>
<text x="620.0" y="312.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">3F 80 00 00</text>
<line x1="685.0" y1="307.0" x2="730.0" y2="307.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="712.0" y1="307.0" x2="730.0" y2="307.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="710.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">копія</text>
<rect x="740.0" y="290.0" width="120.0" height="34.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="800.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">b[4] (uint8_t)</text>
<text x="800.0" y="312.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#27ae60" text-anchor="middle">3F 80 00 00</text>
<rect x="520.0" y="378.0" width="360.0" height="56.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="700.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Визначено і в C, і в C++. Компілятор згортає</text>
<text x="700.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">memcpy сталого розміру в той самий код — без накладних.</text>
<rect x="60.0" y="490.0" width="840.0" height="56.0" rx="10" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/>
<text x="480.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільна засторога: байти float переносні між машинами ЛИШЕ якщо обидві — IEEE-754 і однакової ендіанності.</text>
<text x="480.0" y="531.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Перетинаєш мережу — домовся про формат: 4 байти IEEE-754 у фіксованому (зазвичай мережевому) порядку.</text>
</svg>