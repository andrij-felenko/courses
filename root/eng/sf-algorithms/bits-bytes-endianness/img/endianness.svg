<rect x="60.0" y="414.0" width="780.0" height="78.0" rx="10" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="450.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий колір — той самий байт: у big-endian 0x12 лежить за адресою 0x00, у little-endian — за 0x03.</text>
<text x="450.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">LITTLE-ENDIAN: x86, ARM (звичайно), ESP32, RISC-V.   BIG-ENDIAN: мережа (network byte order), Motorola 68k, PowerPC.</text>
<text x="450.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Мнемоніка: little-endian кладе «малий кінець» (молодший байт) за найменшою адресою.</text>
