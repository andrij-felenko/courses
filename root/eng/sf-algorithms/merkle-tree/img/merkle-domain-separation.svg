<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від атак другого прообразу (Domain Separation)</text>
<text x="190.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Без префіксів (ВРАЗЛИВО)</text>
<rect x="20.0" y="75.0" width="340.0" height="225.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<rect x="60.9" y="84.5" width="258.3" height="31.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="190.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Внутрішній вузол: N₁₂ = Hash(L₁ || L₂)</tspan></text>
<rect x="57.2" y="144.5" width="265.5" height="31.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Підроблений листок: Data* = L₁ || L₂</tspan></text>
<rect x="64.1" y="204.5" width="251.9" height="31.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Hash(Data*) = Hash(L₁ || L₂) = N₁₂</tspan></text>
<text x="190.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">⚠ Внутрішній вузол прийнято за листок!</text>
<text x="570.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">З префіксами 0x00 та 0x01 (БЕЗПЕЧНО)</text>
<rect x="400.0" y="75.0" width="340.0" height="225.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<rect x="450.3" y="84.5" width="239.4" height="31.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="570.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Вузол: N₁₂ = Hash(0x01 || L₁ || L₂)</tspan></text>
<rect x="484.8" y="144.5" width="170.5" height="31.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="570.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Спроба: Data* = L₁ || L₂</tspan></text>
<rect x="410.0" y="204.5" width="320.1" height="31.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Hash(0x00 || Data*) ≠ Hash(0x01 || L₁ || L₂)</tspan></text>
<text x="570.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">✓ Розділення доменів блокує підробку</text>
</svg>