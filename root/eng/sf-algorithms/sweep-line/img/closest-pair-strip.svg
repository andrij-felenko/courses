<text x="710.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому перевірок не більше 6?</text>
<text x="710.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">1. Будь-які дві точки лівіше L вже</tspan><tspan x="710.0" dy="14.9">   перевірені, тому відстань між</tspan><tspan x="710.0" dy="14.9">   будь-якою парою точок ≥ d.</tspan><tspan x="710.0" dy="14.9"></tspan><tspan x="710.0" dy="14.9">2. У прямокутник d × 2d неможливо</tspan><tspan x="710.0" dy="14.9">   помістити більше 6 точок із</tspan><tspan x="710.0" dy="14.9">   попарною відстанню ≥ d.</tspan><tspan x="710.0" dy="14.9"></tspan><tspan x="710.0" dy="14.9">3. Пошук у дереві статусу T за діапазоном</tspan><tspan x="710.0" dy="14.9">   [y_i − d, y_i + d] займає O(log N),</tspan><tspan x="710.0" dy="14.9">   а попарних перевірок — O(1)!</tspan></text>
