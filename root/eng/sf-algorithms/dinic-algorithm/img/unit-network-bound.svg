<text x="790.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивості мережі</text>
<text x="695.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Кожна вершина v ∈ L∪R</text>
<text x="695.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   має deg_in=1 або deg_out=1.</text>
<text x="695.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Шляхи в залишковій</text>
<text x="695.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   мережі вершинно-неперетинні.</text>
<text x="695.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Після √V фаз довжина</text>
<text x="695.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   шляхів &gt; √V.</text>
<text x="695.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Залишковий потік містить</text>
<text x="695.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   ≤ V / √V = √V шляхів.</text>
<text x="695.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">5. Загалом ≤ 2√V фаз.</text>
<rect x="40.0" y="380.0" width="860.0" height="55.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Для одиничних мереж кожна фаза виконується за O(E), а кількість фаз обмежена 2√V.</tspan><tspan x="470.0" dy="15.0">Це дає точний час O(E · √V) — алгоритм Гопкрофта — Карпа є окремим випадком алгоритму Дініца.</tspan></text>
