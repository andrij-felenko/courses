<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="910.0" height="430.0" rx="8" fill="#fcfdfe" stroke="#d0d7de" stroke-width="1.5"/>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Монотонність відстаней: руйнування найкоротших шляхів та зростання d(s, t)</text>
<rect x="40.0" y="70.0" width="410.0" height="310.0" rx="6" fill="#f6f8fa" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="245.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза k: відстань d_k(s, t) = 3</text>
<line x1="96.0" y1="200.0" x2="164.0" y2="200.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="130.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">потік</text>
<line x1="196.0" y1="200.0" x2="274.0" y2="200.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="235.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">насичується!</text>
<line x1="306.0" y1="200.0" x2="374.0" y2="200.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="340.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">потік</text>
<circle cx="80.0" cy="200.0" r="16.0" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="80.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">s</text>
<circle cx="180.0" cy="200.0" r="16.0" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="180.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">u</text>
<circle cx="290.0" cy="200.0" r="16.0" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="290.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">v</text>
<circle cx="390.0" cy="200.0" r="16.0" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="390.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">t</text>
<rect x="55.0" y="270.0" width="380.0" height="95.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="245.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Усі шляхи довжини 3 містять хоча б одне насичене ребро.</tspan><tspan x="245.0" dy="13.0">Пряме ребро u→v вилучається з залишкової мережі.</tspan><tspan x="245.0" dy="13.0">З'являється лише зворотне ребро v→u, яке веде назад (d=2→1).</tspan></text>
<rect x="490.0" y="70.0" width="410.0" height="310.0" rx="6" fill="#f6f8fa" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="695.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза k+1: відстань d_{k+1}(s, t) ≥ 4</text>
<line x1="544.0" y1="230.0" x2="610.0" y2="170.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="636.0" y1="160.0" x2="694.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="720.0" y1="170.0" x2="790.0" y2="230.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="816.0" y1="240.0" x2="844.0" y2="240.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="634.0" y1="174.0" x2="786.0" y2="226.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="710.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">u→v насичено</text>
<circle cx="530.0" cy="240.0" r="15.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="530.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">s</text>
<circle cx="620.0" cy="160.0" r="15.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="620.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">u</text>
<circle cx="710.0" cy="160.0" r="15.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="710.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">w</text>
<circle cx="800.0" cy="240.0" r="15.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="800.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">v</text>
<circle cx="860.0" cy="240.0" r="15.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="860.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">t</text>
<rect x="505.0" y="270.0" width="380.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="695.0" y="307.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Новий найкоротший шлях змушений робити обхід (s→u→w→v→t).</tspan><tspan x="695.0" dy="14.3">Його довжина суворо більша: d_{k+1} ≥ d_k + 1.</tspan><tspan x="695.0" dy="14.3">Кількість фаз не може перевищувати |V| - 1.</tspan></text>
<rect x="40.0" y="395.0" width="860.0" height="45.0" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="470.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лема монотонності гарантує: максимум |V| - 1 фаз до досягнення максимального потоку.</text>
</svg>