<rect x="29.4" y="196.4" width="701.2" height="67.2" rx="6" fill="#f4f6f8" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Строге правило: для будь-якої пари вершин u та v їхні часові інтервали [d[u], f[u]] та [d[v], f[v]]</tspan><tspan x="380.0" dy="15.6">або повністю вкладені один в одного (u — предок v у дереві DFS), або зовсім не перетинаються.</tspan><tspan x="380.0" dy="15.6">Частковий перетин вигляду d[u] &lt; d[v] &lt; f[u] &lt; f[v] МАТЕМАТИЧНО НЕМОЖЛИВИЙ.</tspan></text>
