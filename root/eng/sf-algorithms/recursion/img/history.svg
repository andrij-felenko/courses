<text x="364.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">примітивна рекурсія</text>
<line x1="464.0" y1="126.0" x2="490.0" y2="126.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
