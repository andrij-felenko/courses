<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1234 384" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1234" height="384" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="617.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві лінії — логіки й машини — сходяться на стеку викликів</text>
<text x="477.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Математична лінія — ЩО таке рекурсія (самопосилання в логіці)</text>
<text x="477.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Програмна лінія — ЯК її виконати (самовиклик у машині)</text>
<rect x="40.0" y="86.0" width="196.0" height="80.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="138.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1888 · Дедекінд</text>
<text x="138.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">означення рекурсією</text>
