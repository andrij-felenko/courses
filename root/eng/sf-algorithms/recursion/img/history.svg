<text x="590.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">функція поза нею</text>
<line x1="690.0" y1="126.0" x2="716.0" y2="126.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
