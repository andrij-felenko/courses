<text x="1074.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1074.0" dy="0.0">стек стає рантайм-</tspan><tspan x="1074.0" dy="16.1">механізмом, що</tspan><tspan x="1074.0" dy="16.1">тримає виклики</tspan></text>
