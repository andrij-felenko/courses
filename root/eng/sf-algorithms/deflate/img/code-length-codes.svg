<rect x="125.0" y="64.0" width="470.0" height="32.0" rx="6" fill="#f3c6bf" stroke="#c0392b" stroke-width="1.7"/><text x="360.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">довжини кодів обох абеток:  3 3 3 0 0 0 0 0 5 5 …</tspan></text>
