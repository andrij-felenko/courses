<text x="360.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дерево описує себе: довжини дерев стискає ще одне маленьке дерево</text>
