<rect x="80.0" y="179.0" width="560.0" height="32.0" rx="6" fill="#cfe0f5" stroke="#2457d6" stroke-width="1.7"/><text x="360.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">алфавіт 0…18:  0…15 = довжина · 16 = повтор · 17,18 = серія нулів</tspan></text>
<line x1="360.0" y1="213.0" x2="360.0" y2="251.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
