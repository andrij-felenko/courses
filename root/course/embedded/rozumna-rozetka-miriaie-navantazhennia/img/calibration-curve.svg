<svg xmlns="http://www.w3.org/2000/svg" viewBox="-65 -10 885 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-65" y="-10" width="885" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Методика двоточкового калібрування енергомонітора</text>
<line x1="90.0" y1="280.0" x2="470.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="90.0" y1="280.0" x2="90.0" y2="60.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="460.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-style="italic">Еталонне значення (В, А, Вт)</text>
<text x="80.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">Показники АЦП / Регістрів</text>
<line x1="90.0" y1="260.0" x2="450.0" y2="100.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="440.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Сира крива (похибка ±5%)</text>
<line x1="90.0" y1="280.0" x2="450.0" y2="80.0" stroke="#27ae60" stroke-width="2.2"/>
<text x="440.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Калібрована характеристика</text>
<circle cx="90.0" cy="260.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="135.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Точка 1 (Offset)</text>
<circle cx="360.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="370.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Точка 2 (Еталон 1000 Вт)</text>
<rect x="465.0" y="87.0" width="320.0" height="186.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="625.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">ЕТАПИ КАЛІБРУВАННЯ РОЗЕТКИ:</tspan><tspan x="625.0" dy="13.0"></tspan><tspan x="625.0" dy="13.0">1. Калібрування зміщення (Offset):</tspan><tspan x="625.0" dy="13.0">   • Без навантаження (I = 0 А)</tspan><tspan x="625.0" dy="13.0">   • Відтинання шумової «полиці» АЦП</tspan><tspan x="625.0" dy="13.0"></tspan><tspan x="625.0" dy="13.0">2. Калібрування масштабу (Gain):</tspan><tspan x="625.0" dy="13.0">   • Підключення еталонного нагрівача (1000 Вт)</tspan><tspan x="625.0" dy="13.0">   • Розрахунок коефіцієнтів K_v, K_i, K_p</tspan><tspan x="625.0" dy="13.0"></tspan><tspan x="625.0" dy="13.0">3. Фазове калібрування (Phase Lag):</tspan><tspan x="625.0" dy="13.0">   • Індуктивне навантаження (PF = 0.5)</tspan><tspan x="625.0" dy="13.0">   • Компенсація зсуву фази в регістрі DSP</tspan></text>
</svg>