<line x1="407.0" y1="315.0" x2="407.0" y2="340.0" stroke="#333333" stroke-width="1.2"/>
<line x1="320.0" y1="340.0" x2="425.0" y2="340.0" stroke="#333333" stroke-width="1.5"/>
<line x1="355.0" y1="345.0" x2="390.0" y2="345.0" stroke="#333333" stroke-width="1.5"/>
<line x1="365.0" y1="350.0" x2="380.0" y2="350.0" stroke="#333333" stroke-width="1.5"/>
<rect x="550.0" y="40.0" width="330.0" height="165.0" rx="8" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.8"/>
<text x="715.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Розрахунок ємностей навантаження</text>
<text x="715.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">C_L = (C1 · C2) / (C1 + C2) + C_stray</text>
<text x="715.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">При C1 = C2 = C:</text>
<text x="715.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">C = 2 · (C_L − C_stray)</text>
<text x="715.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">C_stray PCB ≈ 2–5 пФ (паразитна ємність)</text>
<text x="715.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Для C_L = 12 пФ, Cs = 4 пФ → C = 16 пФ</text>
<rect x="550.0" y="225.0" width="330.0" height="165.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="715.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Альтернатива: тактування MCO (Nucleo)</text>
<text x="715.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зневаджувач ST-Link генерує 8 МГц</text>
<text x="715.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">і подає його на вивід OSC_IN цільового МК.</text>
<text x="715.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вивід OSC_OUT лишається вільним (NC).</text>
<text x="715.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Економія вартості: мінус один кварц.</text>
<text x="715.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Мінус: без USB-відладчика такт зникає.</text>
</svg>