<line x1="175.0" y1="152.0" x2="175.0" y2="210.0" stroke="#333333" stroke-width="1.2"/>
<circle cx="255.0" cy="180.0" r="5.0" fill="#d97706" stroke="#1a1a1a" stroke-width="1.0"/>
