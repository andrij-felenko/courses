<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адаптивний бітрейт — це замкнений контур керування</text>
<rect x="70.0" y="151.9" width="230.0" height="44.1" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/><text x="185.0" y="170.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="185.0" dy="0.0">стискає кадри</tspan><tspan x="185.0" dy="13.7">під цільовий бітрейт</tspan></text>
<text x="185.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЕНКОДЕР  (джерело)</text>
<rect x="70.0" y="311.9" width="230.0" height="44.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="185.0" y="330.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="185.0" dy="0.0">правило: крок угору /</tspan><tspan x="185.0" dy="13.7">вниз із гістерезисом</tspan></text>
<text x="185.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">КОНТРОЛЕР бітрейту</text>
<rect x="660.0" y="151.9" width="230.0" height="44.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="775.0" y="170.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="775.0" dy="0.0">губить пакети, додає</tspan><tspan x="775.0" dy="13.7">джитер, вужчає на ходу</tspan></text>
<text x="775.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">КАНАЛ (радіо, мережа)</text>
<rect x="660.0" y="311.9" width="230.0" height="44.1" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.8"/><text x="775.0" y="330.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="775.0" dy="0.0">лічить втрати й джитер</tspan><tspan x="775.0" dy="13.7">за номерами RTP</tspan></text>
<text x="775.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПРИЙМАЧ  (плеєр)</text>
<line x1="303.0" y1="162.0" x2="657.0" y2="162.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="480.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">потік відео (RTP по UDP) →</text>
<line x1="775.0" y1="206.0" x2="775.0" y2="258.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="789.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start"><tspan x="789.0" dy="0.0">пакети</tspan><tspan x="789.0" dy="13.0">доходять</tspan><tspan x="789.0" dy="13.0">(чи ні)</tspan></text>
<line x1="657.0" y1="322.0" x2="303.0" y2="322.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="480.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">← звіт про якість (втрати %, джитер) — раз на ~1 с, як RTCP RR</text>
<line x1="185.0" y1="258.0" x2="185.0" y2="206.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="171.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end"><tspan x="171.0" dy="0.0">нова</tspan><tspan x="171.0" dy="13.0">цільова</tspan><tspan x="171.0" dy="13.0">швидкість</tspan></text>
<text x="480.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">коло замкнене: канал псується → приймач скаржиться → контролер гасить бітрейт → потік пролазить вужчим каналом</text>
</svg>