<rect x="325.4" y="88.0" width="189.3" height="73.9" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/><text x="420.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">P-канальний польовик</tspan><tspan x="420.0" dy="14.3">+ Падіння &lt; 10…30 мВ</tspan><tspan x="420.0" dy="14.3">+ ККД &gt; 99.8%</tspan><tspan x="420.0" dy="14.3">+ Затвор притиснутий до GND</tspan></text>
