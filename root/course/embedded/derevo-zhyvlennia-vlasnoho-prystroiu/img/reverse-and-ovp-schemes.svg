<rect x="588.0" y="88.0" width="208.1" height="73.9" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.0"/><text x="692.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="692.0" dy="0.0">Супресор + OVP-контролер</tspan><tspan x="692.0" dy="14.3">+ Зрізання наносекундних піків</tspan><tspan x="692.0" dy="14.3">+ Миттєве відсікання &gt; 5.8 В</tspan><tspan x="692.0" dy="14.3">+ Захист від згоряння плати</tspan></text>
