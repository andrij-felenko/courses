<rect x="66.6" y="88.0" width="176.8" height="73.9" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="155.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Простий послідовний діод</tspan><tspan x="155.0" dy="14.3">+ Дешево, 1 компонент</tspan><tspan x="155.0" dy="14.3">− Падіння Vf = 0.35…0.6 В</tspan><tspan x="155.0" dy="14.3">− Тепловтрати P = I × Vf</tspan></text>
