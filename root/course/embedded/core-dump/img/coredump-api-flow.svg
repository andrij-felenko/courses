<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Життєвий цикл дампа пам'яті: від винятку до аналізу</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Перехоплення збою ядра, фіксація контексту у Flash та видобування через API</text>

  <rect x="40" y="90" width="190" height="270" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="135" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">1. Аварія (Crash)</text>
  <rect x="55" y="140" width="160" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="135" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Розіменування NULL</text>
  <text x="135" y="185" text-anchor="middle" font-size="12" fill="#6b7280">або збій у задачі</text>
  <rect x="55" y="215" width="160" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="135" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">HardFault / Panic</text>
  <text x="135" y="260" text-anchor="middle" font-size="12" fill="#6b7280">Зупинка планувальника</text>
  <text x="135" y="310" text-anchor="middle" font-size="12" fill="#1a1a1a">Передача виклику</text>
  <text x="135" y="330" text-anchor="middle" font-size="12" fill="#6b7280">в обробник аварії</text>

  <line x1="230" y1="225" x2="262" y2="225" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="270" y="90" width="190" height="270" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="365" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">2. Знімок контексту</text>
  <rect x="285" y="140" width="160" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Регістри процесора</text>
  <text x="365" y="185" text-anchor="middle" font-size="12" fill="#6b7280">PC, SP, LR, R0-R15</text>
  <rect x="285" y="215" width="160" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Стек викликів</text>
  <text x="365" y="260" text-anchor="middle" font-size="12" fill="#6b7280">TCB + фрейми стека</text>
  <text x="365" y="310" text-anchor="middle" font-size="12" fill="#1a1a1a">Підрахунок CRC32</text>
  <text x="365" y="330" text-anchor="middle" font-size="12" fill="#6b7280">та заголовка дампа</text>

  <line x1="460" y1="225" x2="492" y2="225" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="500" y="90" width="190" height="270" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="595" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">3. Запис у Flash</text>
  <rect x="515" y="140" width="160" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="595" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Розділ coredump</text>
  <text x="595" y="185" text-anchor="middle" font-size="12" fill="#6b7280">Атомарний сирий запис</text>
  <rect x="515" y="215" width="160" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="595" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Перезапуск</text>
  <text x="595" y="260" text-anchor="middle" font-size="12" fill="#6b7280">Безпечний ребут МК</text>
  <text x="595" y="310" text-anchor="middle" font-size="12" fill="#1a1a1a">Збережено у Flash</text>
  <text x="595" y="330" text-anchor="middle" font-size="12" fill="#6b7280">Свіже завантаження</text>

  <line x1="690" y1="225" x2="722" y2="225" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="730" y="90" width="190" height="270" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="825" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">4. Видобування API</text>
  <rect x="745" y="140" width="160" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="825" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">image_get()</text>
  <text x="825" y="185" text-anchor="middle" font-size="12" fill="#6b7280">Звірка контрольної суми</text>
  <rect x="745" y="215" width="160" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="825" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">summary_t</text>
  <text x="825" y="260" text-anchor="middle" font-size="12" fill="#6b7280">Адреса збою та backtrace</text>
  <text x="825" y="310" text-anchor="middle" font-size="12" fill="#1a1a1a">Телеметрія або GDB</text>
  <text x="825" y="330" text-anchor="middle" font-size="12" fill="#6b7280">Локалізація помилки</text>

  <rect x="40" y="385" width="880" height="48" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="480" y="415" text-anchor="middle" font-size="13" fill="#1a1a1a">Аварійний знімок записується напряму у Flash без планувальника ОС і зчитується штатно після рестарту</text>
</svg>
