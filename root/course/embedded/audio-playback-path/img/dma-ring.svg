<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільце DMA-буферів: потік без розривів</text>
<rect x="188.0" y="62.0" width="124.0" height="60.0" rx="6" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/><text x="250.0" y="81.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">шматок 1</tspan><tspan x="250.0" dy="14.3">грає</tspan><tspan x="250.0" dy="14.3">(DMA→шина)</tspan></text>
<rect x="306.0" y="180.0" width="124.0" height="60.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="368.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="368.0" dy="0.0">шматок 2</tspan><tspan x="368.0" dy="14.3">наповнює</tspan><tspan x="368.0" dy="14.3">(ядро)</tspan></text>
<rect x="188.0" y="298.0" width="124.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="324.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">шматок 3</tspan><tspan x="250.0" dy="14.3">готовий</tspan></text>
<rect x="70.0" y="180.0" width="124.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="132.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="132.0" dy="0.0">шматок 4</tspan><tspan x="132.0" dy="14.3">готовий</tspan></text>
<path d="M 402.0 202.0 A 152 152 0 0 1 258.0 362.0" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">DMA просувається по колу</text>
<text x="250.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">по колу,</text>
<text x="250.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">без кінця</text>
<rect x="500.0" y="90.0" width="250.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Поки ГРАЄ шматок 1,</tspan><tspan x="625.0" dy="14.3">ядро НАПОВНЮЄ шматок 2.</tspan><tspan x="625.0" dy="14.3">Встигло за T_шматка → потік цілий.</tspan></text>
<rect x="500.0" y="172.0" width="250.0" height="62.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="625.0" y="192.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Переривання на стику:</tspan><tspan x="625.0" dy="14.3">«шматок віддано» → долий.</tspan><tspan x="625.0" dy="14.3">Більше шматків = більший запас.</tspan></text>
<rect x="500.0" y="254.0" width="250.0" height="78.0" rx="6" fill="#fdecf0" stroke="#c0392b" stroke-width="1.5"/><text x="625.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Ядро спізнилось?</tspan><tspan x="625.0" dy="14.3">Шматок спорожнів → апаратура</tspan><tspan x="625.0" dy="14.3">повторює старе / дає тишу →</tspan><tspan x="625.0" dy="14.3">розрив на хвилі = КЛАЦ.</tspan></text>
</svg>