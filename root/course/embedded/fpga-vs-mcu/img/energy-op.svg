<text x="188.8" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">МК різко нижче</text>
<text x="571.6" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-style="italic">постійне важке навантаження:</text>
<text x="571.6" y="132.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-style="italic">на ват логіки FPGA ефективна</text>
<rect x="40.0" y="394.0" width="680.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="380.0" y="422.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Крива FPGA стартує високо через струм спокою тканини; крива МК майже від нуля. Для «прокинувся-зробив-заснув» (малий duty) МК виграє з великим запасом.</tspan></text>
</svg>