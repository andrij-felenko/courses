<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="446" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де виграє мікроконтролер, а де FPGA</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">не «що краще», а «що пасує задачі» — у кожного є своя вотчина</text>
<rect x="24.0" y="64.0" width="196.0" height="28.0" rx="6" fill="#eef0f4" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="36.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">критерій</text>
<rect x="226.0" y="64.0" width="256.0" height="28.0" rx="6" fill="#eef0f4" stroke="#2457d6" stroke-width="1.3"/>
<text x="354.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">мікроконтролер</text>
<rect x="488.0" y="64.0" width="248.0" height="28.0" rx="6" fill="#eef0f4" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="612.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="700">FPGA</text>
<rect x="24.0" y="96.0" width="196.0" height="50.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
<rect x="24.0" y="96.0" width="196.0" height="50.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="122.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="122.0" dy="0.0">Справжня паралельність</tspan></text>
<rect x="226.0" y="96.0" width="256.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="354.0" y="124.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="354.0" dy="0.0">ні (одне ядро по черзі)</tspan></text>
<rect x="488.0" y="96.0" width="248.0" height="50.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.1"/><text x="612.0" y="124.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="612.0" dy="0.0">так (схема на канал)</tspan></text>
<rect x="24.0" y="146.0" width="196.0" height="50.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
<rect x="24.0" y="146.0" width="196.0" height="50.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="122.0" y="174.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="122.0" dy="0.0">Затримка реакції</tspan></text>
<rect x="226.0" y="146.0" width="256.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="354.0" y="174.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="354.0" dy="0.0">такти + джитер</tspan></text>
<rect x="488.0" y="146.0" width="248.0" height="50.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.1"/><text x="612.0" y="174.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="612.0" dy="0.0">наносекунди, стало</tspan></text>
<rect x="24.0" y="196.0" width="196.0" height="50.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
<rect x="24.0" y="196.0" width="196.0" height="50.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="122.0" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="122.0" dy="0.0">Складна послідовна логіка</tspan></text>
<rect x="226.0" y="196.0" width="256.0" height="50.0" rx="6" fill="#eef7ee" stroke="#2457d6" stroke-width="1.1"/><text x="354.0" y="224.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="354.0" dy="0.0">легко (код, бібліотеки)</tspan></text>
<rect x="488.0" y="196.0" width="248.0" height="50.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.1"/><text x="612.0" y="224.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">громіздко й дорого</tspan></text>
<rect x="24.0" y="246.0" width="196.0" height="50.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
<rect x="24.0" y="246.0" width="196.0" height="50.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="122.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="122.0" dy="0.0">Поріг входу</tspan></text>
<rect x="226.0" y="246.0" width="256.0" height="50.0" rx="6" fill="#eef7ee" stroke="#2457d6" stroke-width="1.1"/><text x="354.0" y="274.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="354.0" dy="0.0">низький, години</tspan></text>
<rect x="488.0" y="246.0" width="248.0" height="50.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.1"/><text x="612.0" y="274.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">крутий, тижні</tspan></text>
<rect x="24.0" y="296.0" width="196.0" height="50.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
<rect x="24.0" y="296.0" width="196.0" height="50.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="122.0" y="324.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="122.0" dy="0.0">Ціна простої задачі</tspan></text>
<rect x="226.0" y="296.0" width="256.0" height="50.0" rx="6" fill="#eef7ee" stroke="#2457d6" stroke-width="1.1"/><text x="354.0" y="324.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="354.0" dy="0.0">копійки, один чип</tspan></text>
<rect x="488.0" y="296.0" width="248.0" height="50.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.1"/><text x="612.0" y="324.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">дорожче + обв'язка</tspan></text>
<rect x="24.0" y="346.0" width="196.0" height="50.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
<rect x="24.0" y="346.0" width="196.0" height="50.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="122.0" y="374.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="122.0" dy="0.0">Енергія на ват логіки</tspan></text>
<rect x="226.0" y="346.0" width="256.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="354.0" y="374.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="354.0" dy="0.0">залежить від режиму</tspan></text>
<rect x="488.0" y="346.0" width="248.0" height="50.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.1"/><text x="612.0" y="374.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="612.0" dy="0.0">часто ефективніша</tspan></text>
<text x="380.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зелена клітинка — сторона, що тут явно сильніша.</text>
<text x="380.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Жодна колонка не виграє скрізь — вибір диктує конкретна задача.</text>
</svg>