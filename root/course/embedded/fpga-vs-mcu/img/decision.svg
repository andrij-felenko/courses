<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево рішень: МК, FPGA чи обидва разом</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кілька запитань, що зазвичай вирішують справу — не догма, а здоровий глузд</text>
<rect x="220.0" y="70.0" width="320.0" height="48.0" rx="6" fill="#eef0f4" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="380.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Жорстка паралельність</tspan><tspan x="380.0" dy="14.3">або реакція за наносекунди?</tspan></text>
<line x1="250.0" y1="118.0" x2="175.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="225.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ні</text>
<rect x="45.0" y="150.0" width="260.0" height="48.0" rx="6" fill="#eef0f4" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="175.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">потік даних уміщується</tspan><tspan x="175.0" dy="14.3">в одне ядро по тактах?</tspan></text>
<line x1="175.0" y1="198.0" x2="175.0" y2="244.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="191.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="700">так</text>
<rect x="65.0" y="244.0" width="220.0" height="48.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="175.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">МІКРОКОНТРОЛЕР</text>
<text x="175.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">дешево, швидко в розробці</text>
<line x1="510.0" y1="118.0" x2="585.0" y2="150.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="535.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">так</text>
<rect x="455.0" y="150.0" width="270.0" height="48.0" rx="6" fill="#eef0f4" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="590.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">багато складної послідовної</tspan><tspan x="590.0" dy="14.3">логіки / меню / мережі теж?</tspan></text>
<line x1="590.0" y1="198.0" x2="590.0" y2="244.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="606.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">так</text>
<rect x="470.0" y="244.0" width="240.0" height="48.0" rx="6" fill="#fdf1ec" stroke="#c0392b" stroke-width="1.8"/>
<text x="590.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">FPGA + ядро всередині</text>
<text x="590.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">softcore поряд зі схемою</text>
<line x1="470.0" y1="174.0" x2="360.0" y2="244.0" stroke="#1f8a3b" stroke-width="1.7" stroke-dasharray="4 3"/>
<line x1="415.0" y1="209.0" x2="360.0" y2="244.0" stroke="#1f8a3b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="430.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="700">ні</text>
<rect x="255.0" y="330.0" width="210.0" height="48.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="360.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">чиста FPGA</text>
<text x="360.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">паралельність і таймінг у залізі</text>
<line x1="360.0" y1="292.0" x2="360.0" y2="330.0" stroke="#1f8a3b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="398.0" width="680.0" height="60.0" rx="6" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/><text x="380.0" y="431.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">У дереві немає переможця за замовчуванням: кожна гілка веде до інструмента під конкретні вимоги задачі.</tspan></text>
</svg>