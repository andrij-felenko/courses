<text x="380.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Середнє ліворуч від дедлайну — та реальні зриви живуть у ХВОСТІ, який середнє не бачить.</text>
<text x="380.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Жорсткий реальний час вимірюється найгіршим випадком і формою хвоста, а не середнім.</text>
