<rect x="479.2" y="207.6" width="204.6" height="46.0" rx="6" fill="#fdf1ee" stroke="#c0392b" stroke-width="1.4"/><text x="581.5" y="227.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="581.5" dy="0.0">хвіст за дедлайном =</tspan><tspan x="581.5" dy="13.0">ймовірність зриву</tspan></text>
