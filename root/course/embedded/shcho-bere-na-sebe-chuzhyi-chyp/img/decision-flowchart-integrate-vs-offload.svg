<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інженерний алгоритм вибору між супутнім чипом та монолітним мікроконтролером</text>
<rect x="60.0" y="50.0" width="230.0" height="75.0" rx="6" fill="#edf4fc" stroke="#2457d6" stroke-width="1.3"/>
<text x="175.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Чи є жорсткий дедлайн?</text>
<text x="175.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">FOC ШІМ &lt; 10 мкс, точний аудіо DSP,</text>
<text x="175.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">кулонометрія без пропусків</text>
<line x1="290.0" y1="87.0" x2="380.0" y2="87.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="335.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">НІ</text>
<line x1="175.0" y1="125.0" x2="175.0" y2="185.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="380.0" y="50.0" width="230.0" height="75.0" rx="6" fill="#edf4fc" stroke="#2457d6" stroke-width="1.3"/>
<text x="495.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Завантаження CPU &gt; 30%?</text>
<text x="495.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Криптографія, сканування тачу,</text>
<text x="495.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">важка цифрова фільтрація</text>
<line x1="610.0" y1="87.0" x2="700.0" y2="87.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="655.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">НІ</text>
<line x1="495.0" y1="125.0" x2="495.0" y2="185.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="510.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="700.0" y="50.0" width="230.0" height="75.0" rx="6" fill="#edf4fc" stroke="#2457d6" stroke-width="1.3"/>
<text x="815.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">3. Автономний сон / Безпека?</text>
<text x="815.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Струм &lt; 15 мкА у сні або апаратне</text>
<text x="815.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">зберігання ключів без витоку</text>
<line x1="815.0" y1="125.0" x2="815.0" y2="185.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="830.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК</text>
<line x1="815.0" y1="50.0" x2="815.0" y2="38.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="815.0" y1="38.0" x2="935.0" y2="38.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="935.0" y1="38.0" x2="935.0" y2="340.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="935.0" y1="340.0" x2="730.0" y2="340.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="870.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">НІ на всі три</text>
<rect x="140.0" y="185.0" width="710.0" height="80.0" rx="6" fill="#fdfbf0" stroke="#b26a00" stroke-width="1.3"/>
<text x="495.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b26a00" text-anchor="middle" font-weight="700">Економічна та виробнича перевірка (BOM Cost &amp; Supply Chain Check)</text>
<text x="495.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Чи виправдовує додавання чипу ($0.5–$2.5) зниження вимог до Host MCU та спрощення прошивки?</text>
<text x="495.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Чи є альтернативні постачальники (Second Source), або ризик вендор-локу прийнятний?</text>
<line x1="320.0" y1="265.0" x2="320.0" y2="310.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="342.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК (Вигідно)</text>
<line x1="670.0" y1="265.0" x2="670.0" y2="310.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="692.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">НІ (Задорого)</text>
<rect x="60.0" y="310.0" width="420.0" height="115.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.5"/>
<text x="270.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">РІШЕННЯ: Спеціалізований чип (Offload)</text>
<text x="270.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Ставимо TMC2209 / ATECC608 / BQ27441 / FT6236</text>
<text x="270.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Host MCU залишається дешевим (Cortex-M0+/M3, мала пам'ять)</text>
<text x="270.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Гарантована надійність, нуль джиттеру, мінімальний струм сну</text>
<rect x="510.0" y="310.0" width="420.0" height="115.0" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="720.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">РІШЕННЯ: Інтеграція в MCU (Monolithic)</text>
<text x="720.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Беремо потужніший MCU (Cortex-M4/M7, FPU, більше Flash/RAM)</text>
<text x="720.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Менше компонентів на платі, простіше трасування, менший BOM</text>
<text x="720.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Програмна реалізація алгоритмів з ретельним RTOS-профілюванням</text>
<rect x="20.0" y="437.0" width="920.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="455.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Супутній чип обирають не заради зручності, а коли фізика задачі (час, безпека, автономність) робить програмну реалізацію в одному ядрі ненадійною.</tspan></text>
</svg>