<rect x="35.0" y="310.5" width="420.0" height="69.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">• Висока тактова частота ядра → споживання до 80 мА</tspan><tspan x="245.0" dy="13.0">• Жорсткий Real-Time ламається при накладанні подій</tspan><tspan x="245.0" dy="13.0">• Flash/RAM забиті кодом криптографії, DSP та жестів</tspan><tspan x="245.0" dy="13.0">• Неможливість спати: ядро мусить постійно опитувати піни</tspan></text>
