<text x="245.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Cortex-M4 @ 168 МГц · Навантаження 94%</text>
