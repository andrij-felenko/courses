<rect x="505.0" y="310.5" width="420.0" height="69.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="715.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">• Низька частота ядра → споживання в рази менше (Host &lt; 3 мА)</tspan><tspan x="715.0" dy="13.0">• Нуль джиттеру: FOC та обробка дотиків працюють апаратно</tspan><tspan x="715.0" dy="13.0">• Економія Flash/RAM: прошивка без важких математичних бібліотек</tspan><tspan x="715.0" dy="13.0">• Глибокий сон: Host спить, супутні чипи будять його лінією INT</tspan></text>
<rect x="20.0" y="437.0" width="920.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="455.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Делегування перетворює перевантажений моноліт на надійну систему: апаратні чипи знімають жорсткий Real-Time, зберігаючи енергію та стабільність.</tspan></text>
