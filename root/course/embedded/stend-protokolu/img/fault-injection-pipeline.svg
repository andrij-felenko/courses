<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр ін'єкції несправностей каналу зв'язку</text>
<text x="440.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">поетапна трансформація чистого пакетного потоку у завадостійкий стрес-тест</text>
<rect x="30.0" y="100.0" width="120.0" height="80.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<text x="90.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхідний пакет</text>
<text x="90.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">[Hdr | Payload | CRC]</text>
<text x="90.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Валідний кадр</text>
<line x1="150.0" y1="140.0" x2="185.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="160.0" y="85.0" width="200.0" height="130.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="260.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Модель втрат (Loss)</text>
<text x="260.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Gilbert-Elliott Markov Chain</text>
<rect x="175.0" y="135.0" width="75.0" height="40.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.2"/>
<text x="212.5" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Good (G)</text>
<text x="212.5" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">P(drop)=0%</text>
<rect x="270.0" y="135.0" width="75.0" height="40.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="307.5" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Bad (B)</text>
<text x="307.5" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">P(drop)=80%</text>
<text x="260.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Імітація пачок завад (Burst loss)</text>
<line x1="360.0" y1="140.0" x2="395.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="377.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Pass</text>
<line x1="260.0" y1="215.0" x2="260.0" y2="245.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="260.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Drop (втрачено в каналі)</text>
<rect x="400.0" y="85.0" width="210.0" height="130.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="505.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">2. Мутація байтів (Corruption)</text>
<text x="415.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Переворот біта (Bitflip 1..3 біти)</text>
<text x="415.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• Псування байта довжини Len</text>
<text x="415.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Невалідна контрольна сума CRC</text>
<text x="415.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Обрізання кадру на половині</text>
<text x="415.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Дописування сміття (Garbage)</text>
<line x1="610.0" y1="140.0" x2="645.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="650.0" y="85.0" width="200.0" height="130.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="750.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">3. Джитер і черги (Timing)</text>
<text x="665.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Затримка: Base ± Jitter</text>
<text x="665.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Гаусовий розподіл затримок</text>
<text x="665.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">• Черга перестановки:</text>
<text x="675.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">Packet 2 прибуває раніше 1</text>
<text x="665.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Залп після паузи (Burst release)</text>
<line x1="750.0" y1="215.0" x2="750.0" y2="255.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="580.0" y="275.0" width="270.0" height="75.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="715.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідний потік до парсера DUT</text>
<text x="715.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Реалістичний брудний фізичний канал</text>
<text x="715.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">✔ Перевірка надійності автоматів станів</text>
<rect x="30.0" y="275.0" width="520.0" height="140.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="50.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Порівняння моделей втрат каналу зв'язку:</text>
<text x="50.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Бернуллі (Uniform Random): кожний пакет втрачається незалежно з ймовірністю p.</text>
<text x="50.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">  Не враховує реальну фізику: в реальності завади (мотори, реле) діють пачками.</text>
<text x="50.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Гілберт-Елліотт (2-state Markov): стан Good переходить у Bad за матрицею переходів.</text>
<text x="50.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  Ідеально моделює пропадання зв'язку під мостами, затухання в тунелях та EMI-пачки.</text>
<text x="50.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Детерміновані сценарії: цільове вибивання кожного N-го ACK для тестування ARQ.</text>
</svg>