<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура випробувального стенду протоколу (Protocol Testbed)</text>
<text x="440.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ізольоване середовище: оркестратор тестів, віртуальний проксі-канал та тестований пристрій</text>
<rect x="40.0" y="80.0" width="240.0" height="390.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="40.0" y="80.0" width="240.0" height="36.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="160.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оркестратор тестів (Python/Pytest)</text>
<rect x="55.0" y="130.0" width="210.0" height="48.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="160.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генератор сценаріїв</text>
<text x="160.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">виклики, відповіді, таймаути</text>
<rect x="55.0" y="190.0" width="210.0" height="48.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="160.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керування конфігурацією</text>
<text x="160.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">параметри завад, сіди рандому</text>
<rect x="55.0" y="250.0" width="210.0" height="48.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="160.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Емулятор бекенду / вузлів</text>
<text x="160.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1..1000 віртуальних клієнтів</text>
<rect x="55.0" y="310.0" width="210.0" height="48.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="160.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Валідатор інваріантів</text>
<text x="160.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">контроль станів автоматів</text>
<rect x="55.0" y="370.0" width="210.0" height="80.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="160.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збір метрик та журналів</text>
<text x="160.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Дампи трафіку (.pcap)</text>
<text x="160.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Затримки p50 / p95 / p99</text>
<text x="160.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• Звіти збоїв (Crash dump)</text>
<rect x="315.0" y="80.0" width="250.0" height="390.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<rect x="315.0" y="80.0" width="250.0" height="36.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="440.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Проксі-ін'єктор завад (Proxy)</text>
<rect x="330.0" y="130.0" width="220.0" height="65.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="440.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Модуль втрат (Packet Drop)</text>
<text x="440.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Бернуллі (випадкові втрати p)</text>
<text x="440.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Модель Гілберта-Елліотта (пачки)</text>
<rect x="330.0" y="205.0" width="220.0" height="65.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="440.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Спотворення бітів (Bitflip)</text>
<text x="440.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Інверсія бітів у тілі / CRC</text>
<text x="440.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Псування байтів довжини</text>
<rect x="330.0" y="280.0" width="220.0" height="65.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="440.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Джитер та затримки (Delay)</text>
<text x="440.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Гаусовий джитер (±N мс)</text>
<text x="440.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Перестановка пакетів (Reorder)</text>
<rect x="330.0" y="355.0" width="220.0" height="95.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="440.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Аномалії фреймінгу (Framing)</text>
<text x="440.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Обрізання кадру на середині</text>
<text x="440.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Злиття двох кадрів (Stream fusion)</text>
<text x="440.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Сміттєві байти між кадрами</text>
<rect x="595.0" y="80.0" width="245.0" height="390.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<rect x="595.0" y="80.0" width="245.0" height="36.0" rx="8" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="717.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Тестований пристрій (DUT)</text>
<rect x="610.0" y="130.0" width="215.0" height="140.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="717.5" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Варіант А: Host-Native Build</text>
<text x="717.5" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Прошивка скомпільована під x86/ARM</text>
<text x="717.5" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Обмін через сокет / Pipe / PTY</text>
<text x="717.5" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• AddressSanitizer (ASan)</text>
<text x="717.5" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• UndefinedBehaviorSanitizer</text>
<text x="717.5" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Швидкість: &gt;10 000 кадрів/с</text>
<rect x="610.0" y="285.0" width="215.0" height="165.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="717.5" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Варіант Б: Hardware-in-the-Loop</text>
<text x="717.5" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Реальна плата мікроконтролера</text>
<text x="717.5" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• UART / CAN / RS-485 міст до ПК</text>
<text x="717.5" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Контроль живлення (Relay/Power)</text>
<text x="717.5" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Перевірка реальних таймерів/DMA</text>
<text x="717.5" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• Виявлення HardFault / WDT скидів</text>
<text x="717.5" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Швидкість: 50–500 кадрів/с</text>
<line x1="280.0" y1="170.0" x2="315.0" y2="170.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="297.5" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Tx кадри</text>
<line x1="315.0" y1="290.0" x2="280.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="297.5" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Rx кадри</text>
<line x1="565.0" y1="170.0" x2="595.0" y2="170.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="580.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Спотворений трафік</text>
<line x1="595.0" y1="290.0" x2="565.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="580.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Відповіді DUT</text>
<line x1="40.0" y1="485.0" x2="840.0" y2="485.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="440.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стенд розділяє тестування на швидкий нативний рівень (санітайзери пам'яті) та HIL-рівень (реальне залізо й таймінги).</text>
</svg>