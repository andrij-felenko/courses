<text x="125.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">seed_02.bin (Telemetry)</text>
<rect x="55.0" y="245.0" width="140.0" height="32.0" rx="4" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.0"/>
<text x="125.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">seed_03.bin (ConfigSet)</text>
<line x1="210.0" y1="200.0" x2="245.0" y2="200.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="250.0" y="100.0" width="180.0" height="200.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="340.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Двигун мутацій</text>
<text x="340.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Mutator Engine)</text>
<text x="265.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Випадковий Bitflip</text>
<text x="265.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вставка цікавих цілих:</text>
<text x="275.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="start" font-weight="700">0, -1, 255, 0x7FFF, 0xFFFF</text>
<text x="265.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Склеювання пакетів (Splice)</text>
