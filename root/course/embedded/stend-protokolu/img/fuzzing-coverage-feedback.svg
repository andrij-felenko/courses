<text x="700.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Аварія!</text>
<rect x="720.0" y="120.0" width="135.0" height="160.0" rx="8" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/>
<text x="787.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Звіт про падіння</text>
<text x="787.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">(Crash Artifacts)</text>
<text x="730.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Heap overflow</text>
<text x="730.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Stack buffer oob</text>
<text x="730.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Infinite loop</text>
<text x="730.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Null ptr deref</text>
<text x="730.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">crash-minimized.raw</text>
<rect x="40.0" y="410.0" width="800.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="440.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Швидкість фазингу в пам'яті досягає 50 000 – 200 000 ітерацій/с на одне ядро CPU,</text>
<text x="440.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">що дозволяє за лічені хвилини протестувати мільйони аномальних комбінацій пакетів.</text>
