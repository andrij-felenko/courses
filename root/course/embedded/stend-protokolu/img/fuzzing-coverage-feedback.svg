<text x="125.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Корпус тестів</text>
<text x="125.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Seed Corpus)</text>
<rect x="55.0" y="165.0" width="140.0" height="32.0" rx="4" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.0"/>
<text x="125.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">seed_01.bin (Heartbeat)</text>
