<text x="305.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">✔ Нове покриття гілок коду (New Edge Covered) -&gt; Зберегти у корпус</text>
