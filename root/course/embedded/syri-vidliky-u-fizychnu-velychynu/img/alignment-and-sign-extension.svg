<text x="40.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="start">Або апаратно в один такт: ( (int16_t)(raw &lt;&lt; 4) ) &gt;&gt; 4  чи інструкцією ARM SBFX</text>
