<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вимоги iOS та Android до параметрів BLE</text>
<rect x="20.0" y="20.0" width="900.0" height="400.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вимоги мобільних ОС до параметрів з'єднання BLE (iOS проти Android)</text>
<rect x="40.0" y="75.0" width="415.0" height="325.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="40.0" y="75.0" width="415.0" height="38.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="247.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Apple iOS (Accessory Design Guidelines)</text>
<text x="55.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. connIntervalMin ≥ 15 мс (для HID ≥ 11.25 мс)</text>
<text x="55.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. connIntervalMax ≥ connIntervalMin + 15 мс</text>
<text x="55.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. connIntervalMax є кратним 15 мс (15, 30, 45, 60...)</text>
<text x="55.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4. Slave Latency ≤ 30 пропущених подій</text>
<text x="55.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">5. Supervision Timeout ≤ 6000 мс (6.0 секунд)</text>
<text x="55.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">6. connIntervalMax · (1 + Slave Latency) ≤ 2000 мс</text>
<text x="55.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">7. Timeout ≥ connIntervalMax · (1 + Slave Latency) · 3</text>
<text x="55.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Порушення хоч одного правила → відхилення L2CAP</text>
<rect x="485.0" y="75.0" width="415.0" height="325.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<rect x="485.0" y="75.0" width="415.0" height="38.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="692.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Google Android (BluetoothGatt Priority)</text>
<text x="500.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівні requestConnectionPriority():</text>
<rect x="500.0" y="150.0" width="385.0" height="50.0" rx="4" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="510.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">HIGH (Висока швидкість)</text>
<text x="510.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Interval: 11.25–15 мс | Latency: 0</text>
<text x="510.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">Для передачі файлів та OTA DFU</text>
<rect x="500.0" y="206.0" width="385.0" height="50.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="510.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">BALANCED (Збалансований)</text>
<text x="510.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Interval: 30–50 мс | Latency: 0</text>
<text x="510.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">Типовий режим після підключення</text>
<rect x="500.0" y="262.0" width="385.0" height="50.0" rx="4" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="510.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">LOW_POWER (Енергоощадний)</text>
<text x="510.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Interval: 100–125 мс | Latency: 2</text>
<text x="510.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">Для рідкісного опитування датчиків</text>
<text x="500.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">⚠️ Фрагментація вендорів:</text>
<text x="500.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Samsung, Xiaomi та Huawei можуть накладати власні</text>
<text x="500.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">обмеження енергозбереження та затримувати L2CAP оновлення.</text>
</svg>