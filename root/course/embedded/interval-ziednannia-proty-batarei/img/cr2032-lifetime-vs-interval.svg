<text x="505.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ΔV_cap = Q_event / C_bulk = 20 мкКл / 47 мкФ ≈ 0.42 В (Безпечно)</text>
<rect x="495.0" y="235.0" width="390.0" height="85.0" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
<text x="505.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Фактори скорочення ємності CR2032:</text>
<text x="505.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Саморозряд: ~1.0–1.5% на рік (еквівалентно ~0.4 мкА постійно)</text>
<text x="505.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Зростання ESR при розряді: від 15 Ом (нова) до 200–300+ Ом (стара)</text>
<text x="505.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Падіння ємності за низьких температур (0 °C втрачає до 40% заряду)</text>
<rect x="207.7" y="357.4" width="524.7" height="45.3" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Головне правило: високий Slave Latency (10–25) дає 3–5 років роботи,</tspan><tspan x="470.0" dy="14.3">зберігаючи миттєвий відгук (&lt;50 мс) при надсиланні даних з боку периферії.</tspan></text>
