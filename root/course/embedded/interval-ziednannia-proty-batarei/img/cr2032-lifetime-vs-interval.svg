<text x="505.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ΔV = I_peak · R_int = 15 мА · 100 Ом = 1.5 В → Brownout Reset!</text>
<rect x="495.0" y="175.0" width="390.0" height="50.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
