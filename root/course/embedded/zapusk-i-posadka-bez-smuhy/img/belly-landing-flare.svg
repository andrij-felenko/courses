<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="280.0" width="760.0" height="40.0" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<line x1="40.0" y1="280.0" x2="800.0" y2="280.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="420.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Поверхня ґрунту / трава (тертя по днищу фюзеляжу)</text>
<path d="M 60 70 L 380 230 Q 480 270 560 276 L 760 278" fill="none" stroke="#2457d6" stroke-width="3" stroke-dasharray="6,3"/>
<circle cx="160.0" cy="120.0" r="6.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
<line x1="140.0" y1="110.0" x2="180.0" y2="130.0" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="160.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Глісада (Approach)</text>
<text x="160.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кут γ = 3°-5°, V = 1.3·V_stall</text>
<circle cx="450.0" cy="255.0" r="6.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<line x1="430.0" y1="260.0" x2="470.0" y2="250.0" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="450.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Вирівнювання (Flare, h = 1.0-1.5 м)</text>
<text x="450.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тангаж pitch = +5°...+8°</text>
<text x="450.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Гасіння V_z до &lt; 0.4 м/с</text>
<line x1="370.0" y1="180.0" x2="420.0" y2="230.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="330.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вимкнення тяги + Гальмо ESC</text>
<circle cx="560.0" cy="276.0" r="6.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<text x="560.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Дотик (Touchdown)</text>
<text x="560.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Лопаті складені вздовж корпусу</text>
<line x1="580.0" y1="270.0" x2="740.0" y2="270.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="660.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Ковзання на лижі (L_slide ≈ 5-15 м)</text>
<line x1="480.0" y1="280.0" x2="480.0" y2="230.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="495.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">h_flare</text>
</svg>