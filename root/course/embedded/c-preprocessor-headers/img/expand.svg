<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як препроцесор розгортає виклик макроса</text>
<rect x="130.0" y="66.0" width="560.0" height="66.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/>
<text x="146.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1. беремо виклик</text>
<text x="146.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">F(G(2))</text>
<line x1="410.0" y1="132.0" x2="410.0" y2="152.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="152.0" width="560.0" height="66.0" rx="8" fill="#f3edfb" stroke="#8a5cc7" stroke-width="1.6"/>
<text x="146.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5cc7" text-anchor="start" font-weight="700">2. АРГУМЕНТ розгортаємо перший</text>
<text x="146.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">G(2) → 20 + 2</text>
<line x1="410.0" y1="218.0" x2="410.0" y2="238.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="238.0" width="560.0" height="66.0" rx="8" fill="#f3edfb" stroke="#8a5cc7" stroke-width="1.6"/>
<text x="146.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5cc7" text-anchor="start" font-weight="700">3. підставляємо в тіло F</text>
<text x="146.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">F(x)=((x)+1) → ((20 + 2)+1)</text>
<line x1="410.0" y1="304.0" x2="410.0" y2="324.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="324.0" width="560.0" height="66.0" rx="8" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="146.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">4. пересканюємо результат</text>
<text x="146.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">жодного макроса → ((20 + 2)+1)</text>
<rect x="653.0" y="137.0" width="150.0" height="126.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="728.0" y="155.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="728.0" dy="0.0">«синя фарба»:</tspan><tspan x="728.0" dy="13.7">поки ім'я F</tspan><tspan x="728.0" dy="13.7">розгортається,</tspan><tspan x="728.0" dy="13.7">повторне F</tspan><tspan x="728.0" dy="13.7">усередині —</tspan><tspan x="728.0" dy="13.7">не чіпається</tspan><tspan x="728.0" dy="13.7">(нема нескінченної</tspan><tspan x="728.0" dy="13.7">рекурсії)</tspan></text>
</svg>