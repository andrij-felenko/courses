<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три епохи гербера — той самий синтаксис, дедалі більше сенсу</text>
<line x1="60.0" y1="78.0" x2="740.0" y2="78.0" stroke="#c9cfd6" stroke-width="2.0"/>
<circle cx="150.0" cy="78.0" r="5.0" fill="#4a6fa5" stroke="none" stroke-width="0.0"/>
<circle cx="400.0" cy="78.0" r="5.0" fill="#4a6fa5" stroke="none" stroke-width="0.0"/>
<circle cx="650.0" cy="78.0" r="5.0" fill="#4a6fa5" stroke="none" stroke-width="0.0"/>
<text x="150.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a6fa5" text-anchor="middle" font-style="italic">RS-274-D · 1980</text>
<rect x="45.0" y="100.0" width="210.0" height="96.0" rx="7" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="150.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Standard Gerber</text>
<text x="150.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">малюнок шару</text>
<text x="150.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">+ ОКРЕМА таблиця</text>
<text x="150.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">  діафрагм</text>
<text x="150.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">форми в окремому файлі —</text>
<text x="150.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">легко переплутати → брак</text>
<text x="400.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a6fa5" text-anchor="middle" font-style="italic">RS-274X · 1998</text>
<rect x="295.0" y="100.0" width="210.0" height="96.0" rx="7" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="400.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Extended Gerber</text>
<text x="400.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">малюнок шару</text>
<text x="400.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">+ опис форм</text>
<text x="400.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">  УСЕРЕДИНІ файла</text>
<text x="400.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">один самодостатній файл —</text>
<text x="400.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">таблиця не губиться</text>
<text x="650.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a6fa5" text-anchor="middle" font-style="italic">2014</text>
<rect x="545.0" y="100.0" width="210.0" height="96.0" rx="7" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="650.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Gerber X2</text>
<text x="650.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">усе з RS-274X</text>
<text x="650.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">+ атрибути шарів</text>
<text x="650.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">+ дані нетлісту</text>
<text x="650.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">не лише геометрія, а й СЕНС:</text>
<text x="650.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">що за шар, що з чим з'єднати</text>
</svg>