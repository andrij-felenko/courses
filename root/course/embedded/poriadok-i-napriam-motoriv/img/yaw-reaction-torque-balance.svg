<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика балансу реактивних моментів по осі курсу (Yaw)</text>
<rect x="25.0" y="35.0" width="260.0" height="310.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Висіння: Баланс реакцій</text><line x1="110.0" y1="105.0" x2="200.0" y2="175.0" stroke="#94a3b8" stroke-width="3.0"/><line x1="110.0" y1="175.0" x2="200.0" y2="105.0" stroke="#94a3b8" stroke-width="3.0"/><circle cx="155.0" cy="140.0" r="10.0" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Σ M_yaw = 0 (Нерухомий)</text><circle cx="110.0" cy="105.0" r="15.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="110.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">CCW</text><circle cx="200.0" cy="105.0" r="15.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="200.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">CW</text><circle cx="110.0" cy="175.0" r="15.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="110.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">CW</text><circle cx="200.0" cy="175.0" r="15.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="200.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">CCW</text><line x1="40.0" y1="225.0" x2="270.0" y2="225.0" stroke="#cbd5e1" stroke-width="1.0"/><circle cx="45.0" cy="232.0" r="2.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="53.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2 мотори CCW дають момент +M_yaw</text><circle cx="45.0" cy="255.0" r="2.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/><text x="53.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2 мотори CW дають момент −M_yaw</text><circle cx="45.0" cy="278.0" r="2.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/><text x="53.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Сума ΣM = 0 → курс стабільний</text><rect x="300.0" y="35.0" width="260.0" height="310.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Розворот: Зміна балансу</text><line x1="385.0" y1="105.0" x2="475.0" y2="175.0" stroke="#94a3b8" stroke-width="3.0"/><line x1="385.0" y1="175.0" x2="475.0" y2="105.0" stroke="#94a3b8" stroke-width="3.0"/><circle cx="430.0" cy="140.0" r="10.0" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/><line x1="415.0" y1="118.0" x2="445.0" y2="118.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><text x="430.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Обертання за годинниковою ↷</text><circle cx="385.0" cy="105.0" r="19.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="385.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">CCW ↑</text><circle cx="475.0" cy="105.0" r="11.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="475.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">CW ↓</text><circle cx="385.0" cy="175.0" r="11.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="385.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">CW ↓</text><circle cx="475.0" cy="175.0" r="19.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="475.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">CCW ↑</text><line x1="315.0" y1="225.0" x2="545.0" y2="225.0" stroke="#cbd5e1" stroke-width="1.0"/><circle cx="320.0" cy="232.0" r="2.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="328.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Пара CCW прискорюється (ω + Δ)</text><circle cx="320.0" cy="255.0" r="2.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/><text x="328.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Пара CW сповільнюється (ω − Δ)</text><circle cx="320.0" cy="278.0" r="2.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/><text x="328.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Нескомпенсований момент повертає дрон</text><rect x="575.0" y="35.0" width="260.0" height="310.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Помилка: Реверс одного мотора</text><line x1="660.0" y1="105.0" x2="750.0" y2="175.0" stroke="#94a3b8" stroke-width="3.0"/><line x1="660.0" y1="175.0" x2="750.0" y2="105.0" stroke="#94a3b8" stroke-width="3.0"/><circle cx="705.0" cy="140.0" r="10.0" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/><line x1="687.0" y1="120.0" x2="723.0" y2="120.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="705.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Некерована дзиґа!</text><circle cx="660.0" cy="105.0" r="15.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="660.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">CCW</text><circle cx="750.0" cy="105.0" r="15.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="750.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">CCW!</text><circle cx="660.0" cy="175.0" r="15.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="660.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">CW</text><circle cx="750.0" cy="175.0" r="15.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="750.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">CCW</text><line x1="590.0" y1="225.0" x2="820.0" y2="225.0" stroke="#cbd5e1" stroke-width="1.0"/><circle cx="595.0" cy="232.0" r="2.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="603.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3 мотори в один бік, 1 у протилежний</text><circle cx="595.0" cy="255.0" r="2.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="603.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Постійний паразитний обертовий момент</text><circle cx="595.0" cy="278.0" r="2.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="603.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Шалена розкрутка («Spin of Death»)</text>
</svg>