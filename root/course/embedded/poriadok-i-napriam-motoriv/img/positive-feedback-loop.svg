<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Негативний зворотний зв'язок проти небезпечної петлі позитивного зв'язку</text>
<rect x="25.0" y="30.0" width="810.0" height="160.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="40.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">1. Негативний зворотний зв'язок (Правильний мікшер): Самостабілізація</text><rect x="40.0" y="80.0" width="120.0" height="50.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="100.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збурення</text><text x="100.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">+ω (крен вправо)</text><line x1="160.0" y1="105.0" x2="195.0" y2="105.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="195.0" y="80.0" width="130.0" height="50.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гіроскоп + PID</text><text x="260.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Помилка e = 0 − ω</text><line x1="325.0" y1="105.0" x2="360.0" y2="105.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="360.0" y="80.0" width="150.0" height="50.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="435.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Мікшер (знак −)</text><text x="435.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Тяга M_прав ↑, M_лів ↓</text><line x1="510.0" y1="105.0" x2="545.0" y2="105.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="545.0" y="80.0" width="135.0" height="50.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="612.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Момент рами</text><text x="612.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">τ_віднов = −K·ω</text><line x1="680.0" y1="105.0" x2="715.0" y2="105.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="715.0" y="80.0" width="105.0" height="50.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="767.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Результат</text><text x="767.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">e(t) → 0</text><text x="430.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">PID створює протидіючий момент: крен вправо компенсується підняттям правого боку. Апарат вирівнюється.</text><rect x="25.0" y="205.0" width="810.0" height="165.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="40.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2. Позитивний зворотний зв'язок (Переплутано мотори / інвертовано мікшер): Лавиноподібний переворот</text><rect x="40.0" y="255.0" width="120.0" height="50.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="100.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікро-збурення</text><text x="100.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">+ω (вітер / люфт)</text><line x1="160.0" y1="280.0" x2="195.0" y2="280.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="195.0" y="255.0" width="130.0" height="50.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гіроскоп + PID</text><text x="260.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Команда: «підняти»</text><line x1="325.0" y1="280.0" x2="360.0" y2="280.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="360.0" y="255.0" width="150.0" height="50.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="435.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Помилковий мікшер</text><text x="435.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Тяга M_лів ↑ (НЕ ТОЙ!)</text><line x1="510.0" y1="280.0" x2="545.0" y2="280.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="545.0" y="255.0" width="135.0" height="50.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="612.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Момент рами</text><text x="612.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">τ_руйн = +K·ω (розгін!)</text><line x1="680.0" y1="280.0" x2="715.0" y2="280.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="715.0" y="255.0" width="105.0" height="50.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="767.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідок</text><text x="767.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Фліп за 100 мс</text><text x="430.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Замість гальмування PID розкручує помилковий мотор: помилка росте експоненційно e(t) = e₀·exp(λt) до 100% насичення.</text>
</svg>