<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підсилення Калмана: повзунок довіри, що рухається сам</text>
<line x1="90.0" y1="150.0" x2="630.0" y2="150.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="90.0" cy="150.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<circle cx="630.0" cy="150.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="316.8" cy="150.0" r="12.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="316.8" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">K</text>
<text x="316.8" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">фільтр рахує сам</text>
<text x="90.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">K = 0</text>
<text x="630.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">K = 1</text>
<rect x="30.0" y="190.0" width="300.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="213.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">K → 0: ВІРИМО ПЕРЕДБАЧЕННЮ.</tspan><tspan x="180.0" dy="15.6">Вимір шумний АБО модель</tspan><tspan x="180.0" dy="15.6">впевнена → майже не</tspan><tspan x="180.0" dy="15.6">рухаємо оцінку.</tspan></text>
<rect x="390.0" y="190.0" width="300.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="213.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">K → 1: ВІРИМО ВИМІРУ.</tspan><tspan x="540.0" dy="15.6">Вимір точний АБО модель</tspan><tspan x="540.0" dy="15.6">розпливлась → стрибаємо</tspan><tspan x="540.0" dy="15.6">до показу давача.</tspan></text>
<text x="360.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">K = непевність передбачення / (непевність передбачення + шум виміру)</text>
</svg>