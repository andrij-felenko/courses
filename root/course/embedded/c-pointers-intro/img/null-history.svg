<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Помилка на мільярд: від рішення 1965 року до класу аварій</text>
<rect x="50.0" y="53.6" width="300.0" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">1965 · ALGOL W</tspan><tspan x="200.0" dy="16.2">нуль вписано в ТИП посилання</tspan></text>
<line x1="200.0" y1="100.0" x2="200.0" y2="128.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="126.8" width="320.0" height="46.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="200.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">тип більше не розрізняє</tspan><tspan x="200.0" dy="15.0">«веде на об'єкт»  vs  «порожньо»</tspan></text>
<line x1="200.0" y1="172.0" x2="200.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">три властивості, що роблять помилку підступною:</text>
<rect x="26.0" y="227.3" width="104.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="78.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="78.0" dy="0.0">невидима</tspan><tspan x="78.0" dy="14.3">в ТИПІ</tspan></text>
<rect x="148.0" y="227.3" width="104.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">рознесена</tspan><tspan x="200.0" dy="14.3">в ЧАСІ</tspan></text>
<rect x="270.0" y="227.3" width="104.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="322.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="322.0" dy="0.0">слухняно</tspan><tspan x="322.0" dy="14.3">виконувана</tspan></text>
<line x1="200.0" y1="274.0" x2="200.0" y2="302.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="301.6" width="300.0" height="48.8" rx="6" fill="#f9d7d2" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="322.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">КЛАС АВАРІЙ:</tspan><tspan x="200.0" dy="16.2">розіменування нуля</tspan></text>
<line x1="200.0" y1="348.0" x2="200.0" y2="374.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="40.0" y="378.5" width="320.0" height="31.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="200.0" y="397.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">C успадкував саму ідею (не винайшов)</tspan></text>
<line x1="430.0" y1="62.0" x2="430.0" y2="420.0" stroke="#dcdcdc" stroke-width="1.6" stroke-dasharray="6 6"/>
<text x="628.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Лік у новіших мовах</text>
<rect x="483.0" y="97.6" width="290.0" height="48.8" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="628.0" y="118.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="628.0" dy="0.0">ТИП-ОПЦІЯ</tspan><tspan x="628.0" dy="16.2">Option · Optional · Maybe</tspan></text>
<line x1="628.0" y1="144.0" x2="628.0" y2="172.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="478.0" y="174.8" width="300.0" height="46.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="628.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="628.0" dy="0.0">знову РОЗДІЛЯЄ два типи:</tspan><tspan x="628.0" dy="15.0">Some(значення)   vs   None</tspan></text>
<line x1="628.0" y1="220.0" x2="628.0" y2="248.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="478.0" y="252.8" width="300.0" height="46.5" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="628.0" y="272.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="628.0" dy="0.0">компілятор ПРИМУШУЄ</tspan><tspan x="628.0" dy="15.0">розібрати випадок «нема»</tspan></text>
<line x1="628.0" y1="298.0" x2="628.0" y2="326.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="483.0" y="328.2" width="290.0" height="47.6" rx="6" fill="#d7efdf" stroke="#27ae60" stroke-width="1.5"/><text x="628.0" y="348.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="628.0" dy="0.0">клас аварій зникає</tspan><tspan x="628.0" dy="15.6">ще до запуску</tspan></text>
<text x="628.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">саме та безпека, якої Гоар прагнув 1965-го</text>
</svg>