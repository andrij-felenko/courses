<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова діаграма сигналів цифрового керування модемом</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Послідовність увімкнення (PWRKEY), готовність (STATUS), перехід у сон (DTR) та пробудження (RI)</text>
<text x="115.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">VBAT</text>
<text x="590.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Живлення 3.8 В</text>
<line x1="130.0" y1="105.0" x2="810.0" y2="105.0" stroke="#f0f0f0" stroke-width="1.0"/>
<polyline points="130.0,78.0 830.0,78.0" fill="none" stroke="#2457d6" stroke-width="2.2"/>
<text x="115.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">PWRKEY</text>
<text x="590.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Імпульс увімкнення (0.5–1.0 с, Open-Drain)</text>
<line x1="130.0" y1="165.0" x2="810.0" y2="165.0" stroke="#f0f0f0" stroke-width="1.0"/>
<polyline points="130.0,138.0 190.0,138.0 190.0,162.0 310.0,162.0 310.0,138.0 830.0,138.0" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<text x="115.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">STATUS</text>
<text x="590.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Готовність ядра (HIGH = модуль активний)</text>
<line x1="130.0" y1="225.0" x2="810.0" y2="225.0" stroke="#f0f0f0" stroke-width="1.0"/>
<polyline points="130.0,222.0 450.0,222.0 450.0,198.0 830.0,198.0" fill="none" stroke="#27ae60" stroke-width="2.2"/>
<text x="115.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">DTR</text>
<text x="590.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Сон (HIGH = Sleep Mode, LOW = Active)</text>
<line x1="130.0" y1="285.0" x2="810.0" y2="285.0" stroke="#f0f0f0" stroke-width="1.0"/>
<polyline points="130.0,282.0 550.0,282.0 550.0,258.0 710.0,258.0 710.0,282.0 830.0,282.0" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="115.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">RI</text>
<text x="590.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Ring Indicator (переривання пробудження МК)</text>
