<line x1="310.0" y1="125.0" x2="310.0" y2="175.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="250.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">t_pwrkey ≈ 1.0 с</text>
<line x1="310.0" y1="185.0" x2="310.0" y2="235.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<line x1="450.0" y1="185.0" x2="450.0" y2="235.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="380.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">t_boot ≈ 2–5 с</text>
<text x="630.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">eDRX / PSM (струм &lt; 1 мА)</text>
<line x1="750.0" y1="305.0" x2="750.0" y2="355.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<line x1="790.0" y1="305.0" x2="790.0" y2="355.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="770.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">120 мс</text>
