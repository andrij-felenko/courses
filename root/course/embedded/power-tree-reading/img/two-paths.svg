<text x="50.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Те саме листя (3.3 В, 100 мА) — але шлях Б тягне від джерела на ~68 % більше струму:</text>
