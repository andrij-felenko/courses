<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 920 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="920" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="560.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<rect x="50.0" y="15.0" width="220.0" height="36.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="160.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">Смартфон (GATT Client)</text>
<rect x="630.0" y="15.0" width="220.0" height="36.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="740.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Пристрій (GATT Server)</text>
<line x1="160.0" y1="55.0" x2="160.0" y2="530.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="740.0" y1="55.0" x2="740.0" y2="530.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="230.0" y="65.0" width="440.0" height="24.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="450.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">1. Читання та Запис із квитанцією (ATT Request / Response)</text>
<line x1="160.0" y1="105.0" x2="735.0" y2="105.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">ATT_READ_REQ [Handle: 0x0013]</text>
<line x1="740.0" y1="135.0" x2="165.0" y2="135.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">ATT_READ_RSP [Value: 0x18, 0x0D, ...]</text>
<text x="450.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Затримка: мінімум 1-2 інтервали з'єднання на кожне опитування)</text>
<rect x="230.0" y="170.0" width="440.0" height="24.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="450.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">2. Швидкий потік команд (ATT Write Without Response / Command)</text>
<line x1="160.0" y1="210.0" x2="735.0" y2="210.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">ATT_WRITE_CMD [Handle: 0x0017, Value: CMD_START]</text>
<line x1="160.0" y1="235.0" x2="735.0" y2="235.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">ATT_WRITE_CMD [Handle: 0x0017, Value: CMD_PARAM]</text>
<text x="450.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Немає квитанції ATT; повтори виконує канальний рівень Link Layer при помилці CRC)</text>
<rect x="230.0" y="275.0" width="440.0" height="24.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="450.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">3. Асинхронне сповіщення сервера (ATT Handle Value Notification)</text>
<line x1="160.0" y1="315.0" x2="735.0" y2="315.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="450.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">ATT_WRITE_REQ [CCCD Handle: 0x0014, Value: 0x0001 (Підписка)]</text>
<line x1="740.0" y1="335.0" x2="165.0" y2="335.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="450.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">ATT_WRITE_RSP [CCCD налаштовано]</text>
<line x1="740.0" y1="365.0" x2="165.0" y2="365.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">ATT_HANDLE_VALUE_NTF [Handle: 0x0013, Data Pack 1]</text>
<line x1="740.0" y1="390.0" x2="165.0" y2="390.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">ATT_HANDLE_VALUE_NTF [Handle: 0x0013, Data Pack 2]</text>
<text x="450.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Максимальна пропускна здатність: кілька пакетів за один інтервал з'єднання)</text>
<rect x="230.0" y="430.0" width="440.0" height="24.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="450.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">4. Критичне сповіщення з квитанцією (ATT Handle Value Indication)</text>
<line x1="740.0" y1="470.0" x2="165.0" y2="470.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">ATT_HANDLE_VALUE_IND [Handle: 0x0013, Alarm / Event]</text>
<line x1="160.0" y1="500.0" x2="735.0" y2="500.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">ATT_HANDLE_VALUE_CFM (Підтвердження отримання клієнтом)</text>
<text x="450.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Сервер блокує наступні індикації, доки не отримає підтвердження CFM)</text>
</svg>