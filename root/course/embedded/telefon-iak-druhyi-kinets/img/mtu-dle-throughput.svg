<text x="225.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9f1239" text-anchor="middle">ATT MTU = 23 байти  |  Link Layer PDU = 27 байтів</text>
