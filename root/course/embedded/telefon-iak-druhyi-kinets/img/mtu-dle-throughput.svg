<text x="615.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle">2 байти</text>
<rect x="660.0" y="130.0" width="155.0" height="45.0" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="737.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Корисні дані (Payload)</text>
<text x="737.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">244 байти в одному пакеті!</text>
