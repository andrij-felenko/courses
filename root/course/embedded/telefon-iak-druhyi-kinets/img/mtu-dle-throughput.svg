<text x="357.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">CRC</text>
<text x="357.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3B</text>
<text x="225.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#be123c" text-anchor="middle" font-weight="700">Накладні витрати заголовків: 13 байтів на 20 байтів даних!</text>
<rect x="50.0" y="330.0" width="350.0" height="155.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="225.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Результат для потоку даних:</text>
<text x="225.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">• Максимальна швидкість: ~2–5 КБ/с</text>
<text x="225.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">• Передача 1 КБ: 51 окремий ATT-пакет</text>
<text x="225.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">• Радіоефір (Air Time): великий, батарея сідає</text>
<text x="225.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">• Фрагментація L2CAP на рівні стека</text>
<text x="225.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">• Фізичний рівень: 1M PHY (1 Мбіт/с)</text>
<rect x="460.0" y="20.0" width="390.0" height="480.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
<text x="655.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Оптимізований режим (Bluetooth 4.2 / 5.0+)</text>
<text x="655.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">ATT MTU = 247–512 B  |  DLE = 251 B  |  2M PHY</text>
