<text x="520.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2B</text>
<rect x="550.0" y="242.0" width="55.0" height="42.0" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.0"/>
<text x="577.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle">L2CAP</text>
<text x="577.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4B</text>
<rect x="610.0" y="242.0" width="160.0" height="42.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.0"/>
<text x="690.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">ATT (247B = 3B Hdr + 244B Data)</text>
<rect x="775.0" y="242.0" width="45.0" height="42.0" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.0"/>
<text x="797.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">CRC</text>
<text x="797.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3B</text>
<text x="655.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Накладні витрати: лише 13 байтів на 244 байти даних (~95% ККД)</text>
<rect x="480.0" y="330.0" width="350.0" height="155.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="655.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700">Результат для потоку даних:</text>
<text x="655.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">• Максимальна швидкість: ~60–140 КБ/с</text>
<text x="655.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">• Передача 1 КБ: лише 5 пакетів замість 51</text>
<text x="655.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">• Радіоефір скорочено в 10 разів -&gt; економія струму</text>
<text x="655.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">• Нульова фрагментація на канальному рівні</text>
<text x="655.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">• Фізичний рівень 2M PHY: удвічі коротший біт</text>
