<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 900 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="900" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="880.0" height="520.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<rect x="20.0" y="20.0" width="840.0" height="480.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2.0"/>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">GATT Профіль: Телеметрія та керування пристроєм</text>
<text x="440.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Логічне об'єднання служб, характеристик і дескрипторів у таблиці атрибутів ATT</text>
<rect x="40.0" y="95.0" width="490.0" height="385.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="285.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">Служба телеметрії (Vendor Service: 128-bit UUID)</text>
<text x="285.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">UUID: 00000001-f1e2-4d3c-b5a6-9876543210ab  |  Handle: 0x0010</text>
<rect x="55.0" y="158.0" width="460.0" height="175.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="285.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Характеристика 1: Дані давачів (Telemetry Value)</text>
<text x="285.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UUID: 00000002-... | Handle: 0x0012 | Властивості: Read, Notify</text>
<rect x="70.0" y="212.0" width="430.0" height="42.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.0"/>
<text x="285.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Значення (Value Attribute): [Температура (2B), Напруга (2B), Лічильник (4B)]</text>
<text x="285.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Handle: 0x0013  |  Permissions: Read Only  |  Розмір: 8 байтів</text>
<rect x="70.0" y="262.0" width="430.0" height="60.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="285.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Дескриптор конфігурації клієнта (CCCD, UUID: 0x2902)</text>
<text x="285.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Handle: 0x0014 | Біт 0 (0x0001): Notify | Біт 1 (0x0002): Indicate</text>
<text x="285.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-style="italic">Стан підписки: 0x0000 (Вимкнено) або 0x0001 (Телефон підписався)</text>
<rect x="55.0" y="345.0" width="460.0" height="120.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="285.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Характеристика 2: Команди (Control Command)</text>
<text x="285.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UUID: 00000003-... | Handle: 0x0016 | Властивості: Write, Write Without Response</text>
<rect x="70.0" y="400.0" width="430.0" height="52.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
<text x="285.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Значення (Command Payload): [Код команди (1B), Параметр (4B)]</text>
<text x="285.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Handle: 0x0017  |  Permissions: Write With Authentication  |  Розмір: 1..64B</text>
<rect x="550.0" y="95.0" width="310.0" height="385.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
<text x="705.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Служба батареї (SIG Standard)</text>
<text x="705.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">UUID: 0x180F  |  Handle: 0x0020</text>
<rect x="565.0" y="158.0" width="280.0" height="200.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
<text x="705.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Характеристика: Рівень батареї</text>
<text x="705.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UUID: 0x2A19 | Read, Notify</text>
<rect x="575.0" y="212.0" width="260.0" height="42.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.0"/>
<text x="705.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700">Значення: Рівень у % (0..100)</text>
<text x="705.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Handle: 0x0022 | 1 байт uint8</text>
<rect x="575.0" y="262.0" width="260.0" height="84.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="705.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">CCCD (UUID: 0x2902)</text>
<text x="705.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Handle: 0x0023 | 2 байти</text>
<text x="705.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Дозволяє телефону отримувати</text>
<text x="705.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">сповіщення про розряд</text>
<rect x="565.0" y="372.0" width="280.0" height="93.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="705.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Таблиця атрибутів ATT:</text>
<text x="705.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Кожен елемент має Handle,</text>
<text x="705.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">UUID, Permissions та Value.</text>
<text x="705.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Клієнт звертається за Handle.</text>
</svg>