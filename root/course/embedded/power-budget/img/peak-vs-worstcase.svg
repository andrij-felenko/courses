<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три різні суми однієї системи — і для чого кожна</text>
<rect x="166.4" y="213.8" width="67.2" height="86.2" rx="3" fill="#eef0f2" stroke="#6b7280" stroke-width="1.8"/>
<text x="200.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">900 мВт</text>
<text x="200.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Типове</tspan><tspan x="200.0" dy="13.0">(звичний режим)</tspan></text>
<text x="200.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">те, що бачиш на столі</tspan><tspan x="200.0" dy="11.7">щодня</tspan></text>
<rect x="326.4" y="117.9" width="67.2" height="182.1" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="360.0" y="107.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1900 мВт</text>
<text x="360.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Найгірше одночасне</tspan><tspan x="360.0" dy="13.0">(сайзинг джерела)</tspan></text>
<text x="360.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="360.0" dy="0.0">усі піки збіглися:</tspan><tspan x="360.0" dy="11.7">за цим сайзимо джерело</tspan></text>
<rect x="486.4" y="286.6" width="67.2" height="13.4" rx="3" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="520.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">140 мВт</text>
<text x="520.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Середнє за цикл</tspan><tspan x="520.0" dy="13.0">(життя батареї)</tspan></text>
<text x="520.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="520.0" dy="0.0">розмазано по часу:</tspan><tspan x="520.0" dy="11.7">за цим рахуємо автономність</tspan></text>
<line x1="110.0" y1="300.0" x2="610.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="360.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">джерело сайзимо за найгіршим одночасним; батарею — за середнім; типове не годиться ні там, ні там</text>
</svg>