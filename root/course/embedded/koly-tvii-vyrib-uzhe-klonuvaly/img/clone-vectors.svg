<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шляхи копіювання заліза та перенесення захисту на рівень екосистеми</text>
<rect x="20.0" y="20.0" width="340.0" height="290.0" rx="8" fill="#fff5f5" stroke="#e0b4b4" stroke-width="1.2"/>
<rect x="400.0" y="20.0" width="340.0" height="290.0" rx="8" fill="#f0f9f4" stroke="#a3d9b8" stroke-width="1.2"/>
<text x="190.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Вразливий рівень: голе залізо</text>
<text x="570.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Стійкий рівень: екосистема і криптографія</text>
<rect x="35.0" y="72.0" width="310.0" height="56.0" rx="6" fill="#ffffff" stroke="#d99b9b" stroke-width="1.0"/><text x="190.0" y="90.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1. Витік з фабрики (Gerber / BOM)</tspan><tspan x="190.0" dy="13.0">Фабрика виготовляє «третю зміну»</tspan><tspan x="190.0" dy="13.0">за вашою оригінальною топологією</tspan></text>
<rect x="35.0" y="147.0" width="310.0" height="56.0" rx="6" fill="#ffffff" stroke="#d99b9b" stroke-width="1.0"/><text x="190.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">2. Реверс друкованої плати</tspan><tspan x="190.0" dy="13.0">Пошарове шліфування, рентген,</tspan><tspan x="190.0" dy="13.0">відтворення схеми й трасування</tspan></text>
<rect x="35.0" y="222.0" width="310.0" height="56.0" rx="6" fill="#ffffff" stroke="#d99b9b" stroke-width="1.0"/><text x="190.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">3. Зчитування Flash / пам'яті</tspan><tspan x="190.0" dy="13.0">Дамп незахищеного мікроконтролера</tspan><tspan x="190.0" dy="13.0">і пряме заливання коду в клон</tspan></text>
<rect x="415.0" y="72.0" width="310.0" height="56.0" rx="6" fill="#ffffff" stroke="#8cd1a4" stroke-width="1.0"/><text x="570.0" y="90.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">1. Апаратний корінь (Secure Element)</tspan><tspan x="570.0" dy="13.0">Унікальні приватні ключі на екземпляр,</tspan><tspan x="570.0" dy="13.0">фізично недоступні для зчитування</tspan></text>
<rect x="415.0" y="147.0" width="310.0" height="56.0" rx="6" fill="#ffffff" stroke="#8cd1a4" stroke-width="1.0"/><text x="570.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">2. Віддалена атестація у хмарі</tspan><tspan x="570.0" dy="13.0">Бекенд перевіряє криптопідпис сесії,</tspan><tspan x="570.0" dy="13.0">миттєво відсікаючи дублікати ключів</tspan></text>
<rect x="415.0" y="222.0" width="310.0" height="56.0" rx="6" fill="#ffffff" stroke="#8cd1a4" stroke-width="1.0"/><text x="570.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">3. Регулярні сервіси та оновлення</tspan><tspan x="570.0" dy="13.0">Хмарні функції, аналітика, OTA,</tspan><tspan x="570.0" dy="13.0">гарантія, сервіс і технічна підтримка</tspan></text>
<line x1="362.0" y1="165.0" x2="396.0" y2="165.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>