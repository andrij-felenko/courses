<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця стратегій реакції на появу клонованого пристрою</text>
<rect x="30.0" y="30.0" width="335.0" height="125.0" rx="6" fill="#fffbf0" stroke="#e0c285" stroke-width="1.2"/>
<text x="197.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Гонка озброєнь у залізі (помилка)</text>
<text x="197.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Постійні дрібні зміни плати без криптографії.</text>
<text x="197.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Клонери повторюють ревізію за 2–4 тижні.</text>
<text x="197.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">Витрати R&amp;D не окупаються.</text>
<rect x="395.0" y="30.0" width="335.0" height="125.0" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="562.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Системний підхід (стратегія успіху)</text>
<text x="562.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Апаратні ключі + хмарна атестація сесій.</text>
<text x="562.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Юридичні блокування на маркетплейсах.</text>
<text x="562.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Цінність у софті, сервісах та спільноті.</text>
<rect x="30.0" y="170.0" width="335.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#b0bec5" stroke-width="1.2"/>
<text x="197.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Пасивне ігнорування (ризик)</text>
<text x="197.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Відсутність моніторингу та захисту бренду.</text>
<text x="197.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Клони витісняють оригінал низькою ціною.</text>
<text x="197.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">Втрата репутації через ненадійні підробки.</text>
<rect x="395.0" y="170.0" width="335.0" height="125.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="562.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Деструктивні контрзаходи / Bricking (табу)</text>
<text x="562.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Навмисне спалення чіпів чи стирання EEPROM.</text>
<text x="562.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Ураження кінцевих користувачів (false positives).</text>
<text x="562.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Репутаційна катастрофа та судові ризики.</text>
</svg>