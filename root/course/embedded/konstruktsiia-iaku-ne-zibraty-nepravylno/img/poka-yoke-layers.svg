<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ешелонований апаратний захист від людських помилок</text>
<rect x="30.0" y="55.0" width="780.0" height="96.0" rx="8" fill="#eaf5ea" stroke="#27ae60" stroke-width="2.0"/>
<text x="50.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень 1: Механічна неможливість помилки</text>
<text x="50.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Ключовані роз'єми, асиметричні корпуси, напрямні штифти, несумісні форм-фактори</text>
<text x="50.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">→ Помилкове з'єднання фізично заблоковано до появи електричного контакту</text>
<rect x="30.0" y="163.0" width="780.0" height="96.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="50.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень 2: Електрична стійкість схемотехніки</text>
<text x="50.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">P-MOSFET / ідеальні діоди на вході живлення, струмообмежувальні резистори, TVS-діоди</text>
<text x="50.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">→ Якщо кабель приєднано силою — схема витримує переполюсовку та 24 В на лініях даних</text>
<rect x="30.0" y="271.0" width="780.0" height="96.0" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2.0"/>
<text x="50.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень 3: Однозначний візуальний зворотний зв'язок</text>
<text x="50.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Маркування Pin 1 поза межами корпусу, підписи сигналів на платі, колірне кодування джгутів</text>
<text x="50.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">→ Монтажник і оператор бачать розпіновку та полярність без звернення до креслень</text>
<rect x="30.0" y="379.0" width="780.0" height="96.0" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="2.0"/>
<text x="50.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень 4: Програмне самотестування та ізоляція</text>
<text x="50.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Безпечне зондування ліній малим струмом, перевірка сигнатур, автоперемикання або Fault-стан</text>
<text x="50.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">→ Прошивка виявляє переплутані канали (TX/RX, SDA/SCL) і блокує роботу силових кіл</text>
</svg>