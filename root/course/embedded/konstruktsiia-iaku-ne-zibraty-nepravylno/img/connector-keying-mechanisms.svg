<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механічні бар'єри: ключування, поляризація та асиметрія</text>
<rect x="30.0" y="55.0" width="270.0" height="355.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="165.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поляризовані роз'єми</text>
<rect x="100.0" y="103.0" width="130.0" height="75.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<circle cx="120.0" cy="140.0" r="4.0" fill="#f39c12" stroke="#333333" stroke-width="1.0"/>
<circle cx="150.0" cy="140.0" r="4.0" fill="#f39c12" stroke="#333333" stroke-width="1.0"/>
<circle cx="180.0" cy="140.0" r="4.0" fill="#f39c12" stroke="#333333" stroke-width="1.0"/>
<circle cx="210.0" cy="140.0" r="4.0" fill="#f39c12" stroke="#333333" stroke-width="1.0"/>
<rect x="135.0" y="91.0" width="60.0" height="10.0" rx="2" fill="#bdc3c7" stroke="#333333" stroke-width="1.5"/>
<text x="165.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Molex Micro-Fit / JST GH</text>
<text x="165.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Асиметричні напрямні ребра</text>
<text x="165.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Защіпка (latch) від вібрацій</text>
<text x="165.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Неможливо вставити з поворотом</text>
<text x="165.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Захист контактів від торкання</text>
<rect x="45.0" y="320.0" width="240.0" height="75.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="165.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат:</text>
<text x="165.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Фізична заборона зсуву чи перевороту</text>
<text x="165.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">навіть при монтажі наосліп</text>
<rect x="315.0" y="55.0" width="270.0" height="355.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="450.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Різні калібри та гнізда</text>
<rect x="350.0" y="103.0" width="85.0" height="55.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="392.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">24 В Сила</text>
<text x="392.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2-pin / 3.81 мм</text>
<rect x="465.0" y="103.0" width="85.0" height="55.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="508.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">3.3 В Давачі</text>
<text x="508.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4-pin / 1.25 мм</text>
<text x="450.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Несумісні лінії — різні роз'єми</text>
<text x="450.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Різний крок виводів (pitch)</text>
<text x="450.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Різна кількість контактів (pin count)</text>
<text x="450.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Заборона однакових роз'ємів для</text>
<text x="450.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">  силових 24 В і чутливих 3.3 В ліній</text>
<rect x="330.0" y="320.0" width="240.0" height="75.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="450.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат:</text>
<text x="450.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Силовий кабель 24 В неможливо</text>
<text x="450.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">встромити в гніздо інтерфейсів</text>
<rect x="600.0" y="55.0" width="270.0" height="355.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="735.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрія плати та отворів</text>
<rect x="650.0" y="100.0" width="170.0" height="75.0" rx="4" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/>
<circle cx="670.0" cy="115.0" r="5.0" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<circle cx="800.0" cy="115.0" r="5.0" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<circle cx="670.0" cy="160.0" r="5.0" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<circle cx="775.0" cy="150.0" r="5.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="775.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">зсув отвору</text>
<text x="735.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричний захист монтажу</text>
<text x="735.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Зсув координат одного монтажного отвору</text>
<text x="735.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Напрямні штифти різного діаметра</text>
<text x="735.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Скошений кут (chamfer) плати</text>
<text x="735.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Неможливо встановити догори дном</text>
<rect x="615.0" y="320.0" width="240.0" height="75.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="735.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат:</text>
<text x="735.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Плата фізично не сідає на стійки при</text>
<text x="735.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">помилковій орієнтації монтажника</text>
</svg>