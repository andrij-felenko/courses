<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід трьох літер: від IBM 704 до вашого ARM</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">слово переходило з покоління в покоління на самій сумісності — бо потреба не зникала</text>
<rect x="40.0" y="150.0" width="200.0" height="96.0" rx="10" fill="#eef2f7" stroke="#333333" stroke-width="2.0"/>
<text x="140.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">UA-SAP</text>
<text x="140.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">псевдооперація BSS</tspan><tspan x="140.0" dy="13.7">IBM 704 · сер. 1950-х</tspan><tspan x="140.0" dy="13.7">Натт, Реймшоу та ін.</tspan></text>
<rect x="270.0" y="150.0" width="200.0" height="96.0" rx="10" fill="#eef2f7" stroke="#333333" stroke-width="2.0"/>
<text x="370.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">FAP / MAP</text>
<text x="370.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">асемблери IBM</tspan><tspan x="370.0" dy="13.7">для 709 та 7090/7094</tspan><tspan x="370.0" dy="13.7">назву взяли як є</tspan></text>
<rect x="500.0" y="150.0" width="200.0" height="96.0" rx="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="600.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Unix / C</text>
<text x="600.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">секція .bss</tspan><tspan x="600.0" dy="13.7">неініціалізовані</tspan><tspan x="600.0" dy="13.7">статичні дані</tspan></text>
<rect x="730.0" y="150.0" width="200.0" height="96.0" rx="10" fill="#f3e8fb" stroke="#7b3fa0" stroke-width="2.0"/>
<text x="830.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7b3fa0" text-anchor="middle" font-weight="700">GCC сьогодні</text>
<text x="830.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">стовпчик bss</tspan><tspan x="830.0" dy="13.7">у звіті size</tspan><tspan x="830.0" dy="13.7">на ARM-МК</tspan></text>
<line x1="240.0" y1="198.0" x2="270.0" y2="198.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="470.0" y1="198.0" x2="500.0" y2="198.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="700.0" y1="198.0" x2="730.0" y2="198.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="282.0" width="860.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="300.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">На кожному стрибку інженери НЕ вигадували нову назву — успадковували готову, бо вже мали під неї код і звичку.</tspan><tspan x="470.0" dy="14.3">А називана річ — «зарезервувати пам'ять без початкових значень» — є в КОЖНІЙ машині, від лампового велетня до МК.</tspan></text>
</svg>