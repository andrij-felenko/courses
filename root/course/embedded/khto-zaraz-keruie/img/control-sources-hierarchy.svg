<rect x="740.0" y="110.0" width="190.0" height="224.0" rx="8" fill="#eafaef" stroke="#27ae60" stroke-width="1.7"/><text x="835.0" y="182.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="835.0" dy="0.0">БЕЗУДАРНИЙ</tspan><tspan x="835.0" dy="15.0">ФІЛЬТР ТА SLEW-RATE</tspan><tspan x="835.0" dy="15.0"></tspan><tspan x="835.0" dy="15.0">• Захоплення стану</tspan><tspan x="835.0" dy="15.0">• Обмеження темпу du/dt</tspan><tspan x="835.0" dy="15.0">• Зшивання інтегратора</tspan><tspan x="835.0" dy="15.0">• Захист від ударів</tspan></text>
<line x1="835.0" y1="334.0" x2="835.0" y2="390.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrG)" stroke-linecap="round"/>
<rect x="690.0" y="390.0" width="260.0" height="60.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.7"/><text x="820.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">ВНУТРІШНІЙ РЕГУЛЯТОР ТА ПРИВОДИ</tspan><tspan x="820.0" dy="14.3">каскадні ПІД-контури → мікшер моторів</tspan></text>
<text x="490.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Селектор не пропускає команди «напряму»: кожне джерело проходить перевірку життєздатності та фільтр безударного перемикання.</text>
