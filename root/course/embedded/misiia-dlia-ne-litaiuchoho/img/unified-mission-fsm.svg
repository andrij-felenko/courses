<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Уніфікований місійний рушій: черга завдань, автомати переходів та аварійний захист</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Уніфікований місійний рушій для наземних, водних та стаціонарних систем</text>
<text x="480.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">єдиний автомат послідовності команд із різними алгоритмами досягнення цілі</text>
<rect x="40.0" y="110.0" width="160.0" height="68.0" rx="8" fill="#f4f4f5" stroke="#1a1a1a" stroke-width="1.6"/><text x="120.0" y="134.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">IDLE</tspan><tspan x="120.0" dy="14.3">Очікування місії,</tspan><tspan x="120.0" dy="14.3">перевірка Arming</tspan></text>
<rect x="240.0" y="110.0" width="160.0" height="68.0" rx="8" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/><text x="320.0" y="134.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">RUNNING_NAV</tspan><tspan x="320.0" dy="14.3">Рух до точки B</tspan><tspan x="320.0" dy="14.3">Pure Pursuit / L1</tspan></text>
<rect x="440.0" y="110.0" width="160.0" height="68.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/><text x="520.0" y="134.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">STATION_KEEP</tspan><tspan x="520.0" dy="14.3">Утримання точки /</tspan><tspan x="520.0" dy="14.3">Віртуальний якір</tspan></text>
<rect x="640.0" y="110.0" width="160.0" height="68.0" rx="8" fill="#fffbf0" stroke="#d98a00" stroke-width="1.6"/><text x="720.0" y="134.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">ACTION_EXEC</tspan><tspan x="720.0" dy="14.3">Виконання дії:</tspan><tspan x="720.0" dy="14.3">полив / зйомка / маніп.</tspan></text>
<rect x="800.0" y="240.0" width="130.0" height="68.0" rx="8" fill="#dcfce7" stroke="#27ae60" stroke-width="1.6"/><text x="865.0" y="264.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="865.0" dy="0.0">COMPLETED</tspan><tspan x="865.0" dy="14.3">Місію виконано,</tspan><tspan x="865.0" dy="14.3">парковка</tspan></text>
<line x1="200.0" y1="144.0" x2="238.0" y2="144.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="220.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Старт</text>
<line x1="400.0" y1="144.0" x2="438.0" y2="144.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrG)" stroke-linecap="round"/>
<text x="420.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">dist &lt; R</text>
<line x1="600.0" y1="144.0" x2="638.0" y2="144.0" stroke="#d98a00" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="620.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d98a00" text-anchor="middle">Стабілізовано</text>
<path d="M 720 178 L 720 213 L 320 213 L 320 180" fill="none" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)"/>
<text x="520.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Дію завершено → наступний пункт місії (item_idx++)</text>
<line x1="720.0" y1="178.0" x2="800.0" y2="274.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrG)" stroke-linecap="round"/>
<text x="780.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Всі пункти пройдено</text>
<rect x="140.0" y="280.0" width="520.0" height="150.0" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<text x="400.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">КОНТУР АВАРІЙНОЇ ДЕГРАДАЦІЇ (FAILSAFE ENGINE)</text>
<text x="160.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Втрата GNSS / зв'язку</text>
<text x="380.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→ Зупинка моторів (активне гальмо) або дрейф з маяком</text>
<text x="160.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Крен / тангаж &gt; ліміту (25°)</text>
<text x="380.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→ Запобігання перекиданню ровера на косогорі</text>
<text x="160.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Струмове перевантаження</text>
<text x="380.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→ Виявлення заклинювання редуктора чи намотування водоростей</text>
<text x="160.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Низький заряд батареї</text>
<text x="380.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→ Спрощений рух додому по пройденому треку (Backtrack)</text>
<line x1="320.0" y1="223.0" x2="320.0" y2="278.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrR)" stroke-linecap="round"/>
<text x="348.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Критична аварія</text>
<text x="480.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Уніфікований контролер відділяє логіку черги місії від специфіки руху конкретної платформи (ровер, човен, стаціонарний вузол).</text>
