<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат стаціонарної місії: цикл сну, перевірки умов та аварійні блокування</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="470.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат місії стаціонарного пристрою: сон, події та безпека</text>
<text x="470.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">енергоощадний цикл сонячного трекера, поливальної системи та промивки фільтрів</text>
<rect x="40.0" y="160.0" width="180.0" height="80.0" rx="8" fill="#f4f4f5" stroke="#1a1a1a" stroke-width="1.6"/><text x="130.0" y="190.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">ГЛИБОКИЙ СОН</tspan><tspan x="130.0" dy="14.3">(DEEP SLEEP)</tspan><tspan x="130.0" dy="14.3">I &lt; 15 мкА, периферія вимк</tspan></text>
<rect x="260.0" y="160.0" width="180.0" height="80.0" rx="8" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/><text x="350.0" y="190.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">ОПИТУВАННЯ ДАВАЧІВ</tspan><tspan x="350.0" dy="14.3">(WAKE &amp; SAMPLE)</tspan><tspan x="350.0" dy="14.3">RTC, вологість, тиск, кут</tspan></text>
<rect x="490.0" y="160.0" width="180.0" height="80.0" rx="8" fill="#eafaef" stroke="#27ae60" stroke-width="1.6"/><text x="580.0" y="190.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">ВИКОНАННЯ ДІЇ</tspan><tspan x="580.0" dy="14.3">(ACTUATE)</tspan><tspan x="580.0" dy="14.3">помпа, клапан, сервопривід</tspan></text>
<rect x="720.0" y="160.0" width="180.0" height="80.0" rx="8" fill="#fff5e6" stroke="#d98a00" stroke-width="1.6"/><text x="810.0" y="190.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">КОНТРОЛЬ БЕЗПЕКИ</tspan><tspan x="810.0" dy="14.3">(VERIFY &amp; SAFE)</tspan><tspan x="810.0" dy="14.3">струм мотора, прорив труби</tspan></text>
<line x1="220.0" y1="190.0" x2="260.0" y2="190.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="240.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">RTC таймер</text>
<line x1="440.0" y1="190.0" x2="490.0" y2="190.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrG)" stroke-linecap="round"/>
<text x="465.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Поріг досягнуто</text>
<line x1="670.0" y1="190.0" x2="720.0" y2="190.0" stroke="#d98a00" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="695.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d98a00" text-anchor="middle">Дія завершена</text>
<path d="M 810 240 L 810 285 L 130 285 L 130 242" fill="none" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)"/>
<text x="470.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Нормальне завершення циклу → встановити наступний RTC будильник і заснути</text>
<path d="M 350 160 L 350 125 L 130 125 L 130 158" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrB)"/>
<text x="240.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Полив/трекінг не потрібен (поріг не перевищено)</text>
<rect x="260.0" y="330.0" width="420.0" height="95.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="470.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">АВАРІЙНЕ БЛОКУВАННЯ (EMERGENCY LOCK)</text>
<text x="276.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Струм помпи &gt; I_max (заклинило вал) → вимкнути реле</text>
<text x="276.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Тиск не зростає (сухий хід або прорив) → перекрити магістраль</text>
<text x="276.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Штормовий вітер &gt; 20 м/с → флюгування сонячної панелі</text>
<line x1="750.0" y1="240.0" x2="650.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrR)" stroke-linecap="round"/>
<text x="720.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Аварія давача / струму</text>
<text x="470.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Стаціонарний місійний контролер працює в імпульсному режимі з жорстким контролем безпеки та енергоспоживання.</text>
</svg>