<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінематичні відмінності платформ: 3D дрон, ровер Аккермана та човен</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Голономний літальний апарат проти неголономних наземних та водних платформ</text>
<text x="480.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">різниця в ступенях вільності, бічному ковзанні та обмеженнях радіуса розвороту</text>
<rect x="30.0" y="76.0" width="280.0" height="360.0" rx="10" fill="#f8fafc" stroke="#2457d6" stroke-width="1.6"/>
<text x="170.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">КОПТЕР (3D/2D)</text>
<text x="170.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Голономний рух у площині</text>
<circle cx="170.0" cy="226.0" r="24.0" fill="#eef2ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="170.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ДРОН</text>
<line x1="170.0" y1="200.0" x2="170.0" y2="156.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<line x1="170.0" y1="252.0" x2="170.0" y2="296.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<line x1="144.0" y1="226.0" x2="100.0" y2="226.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<line x1="196.0" y1="226.0" x2="240.0" y2="226.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="170.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">+Vx (вперед)</text>
<text x="246.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">+Vy (лаг)</text>
<text x="170.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">−Vx (назад)</text>
<text x="94.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="end">−Vy (лаг)</text>
<text x="44.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Може зависнути на місці (V = 0)</text>
<text x="44.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Рух у будь-який бік без розвороту</text>
<text x="44.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Висота Z — вільний вимір</text>
<text x="44.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Немає радіуса розвороту (R = 0)</text>
<rect x="340.0" y="76.0" width="280.0" height="360.0" rx="10" fill="#fdfbf7" stroke="#d98a00" stroke-width="1.6"/>
<text x="480.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="700">РОВЕР АККЕРМАНА (2D)</text>
<text x="480.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Неголономне кермування</text>
<rect x="460.0" y="186.0" width="40.0" height="75.0" rx="5" fill="#fff7e6" stroke="#d98a00" stroke-width="1.8"/>
<rect x="454.0" y="241.0" width="8.0" height="20.0" rx="2" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="498.0" y="241.0" width="8.0" height="20.0" rx="2" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="454" y="191" width="8" height="20" rx="2" fill="#1a1a1a" stroke="#1a1a1a" transform="rotate(25 458 201)"/>
<rect x="498" y="191" width="8" height="20" rx="2" fill="#1a1a1a" stroke="#1a1a1a" transform="rotate(25 502 201)"/>
<line x1="480.0" y1="184.0" x2="480.0" y2="146.0" stroke="#d98a00" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="480.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d98a00" text-anchor="middle">Vx (тільки поздовжнє)</text>
<line x1="505.0" y1="226.0" x2="545.0" y2="226.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="550.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">Vy = 0 (заборонено)</text>
<path d="M 480 186 A 45 45 0 0 1 525 231" fill="none" stroke="#6b7280" stroke-dasharray="4,3" stroke-width="1.6"/>
<text x="532.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">R_min</text>
<text x="354.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Бокове ковзання відсутнє (Vy = 0)</text>
<text x="354.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Мінімальний радіус R_min = L/tan(δ)</text>
<text x="354.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Не може крутитися на місці</text>
<text x="354.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Потрібен триточковий розворот</text>
<rect x="650.0" y="76.0" width="280.0" height="360.0" rx="10" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/>
<text x="790.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ВОДНИЙ ЧОВЕН / USV</text>
<text x="790.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Гідродинаміка й кермо</text>
<path d="M 790 178 Q 812 216 810 256 L 770 256 L 770 256 Q 768 216 790 178 Z" fill="#dcfce7" stroke="#27ae60" stroke-width="1.8"/>
<rect x="786.0" y="258.0" width="8.0" height="12.0" rx="1" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="790" y1="270" x2="802" y2="286" stroke="#c0392b" stroke-width="3.0"/>
<text x="808.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">кермо</text>
<line x1="715.0" y1="216.0" x2="758.0" y2="216.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="712.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">течія / дрейф</text>
<line x1="790.0" y1="174.0" x2="790.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrG)" stroke-linecap="round"/>
<text x="790.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Тяга гвинта</text>
<text x="664.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Кермо діє лише на ходу (V &gt; 0)</text>
<text x="664.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Знесення течією та вітром (кут дрейфу β)</text>
<text x="664.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Величезна інерція та відсутність гальм</text>
<text x="664.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Не може зависнути без тяги гвинтів</text>
<text x="480.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Наземні та водні місії визначаються неголономною кінематикою: траєкторію не можна планувати як прямі відрізки без урахування розвороту й дрейфу.</text>
</svg>