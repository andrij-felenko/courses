<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр підготовки, обмеження та безпечної передачі уставки орієнтації й тяги</text>
<rect x="30.0" y="60.0" width="160.0" height="140.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="110.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Бажане прискорення</text>
<text x="110.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">a_des = [ax, ay, az]</text>
<text x="110.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">з контуру позиції (NED)</text>
<rect x="225.0" y="60.0" width="170.0" height="140.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="310.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Вектор тяги й нахил</text>
<text x="310.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">f_des = a_des − g</text>
<text x="310.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Кут tilt = acos(fz / ||f||)</text>
<rect x="430.0" y="60.0" width="175.0" height="140.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="517.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">3. Захисні бар'єри</text>
<text x="517.5" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Tilt Limit: tilt ≤ 35°</text>
<text x="517.5" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Slew Rate: dω/dt ≤ max</text>
<text x="517.5" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Anti-windup зворотний зв'язок</text>
<rect x="640.0" y="60.0" width="150.0" height="140.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="715.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">4. Цільовий пакет</text>
<text x="715.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">q_target (кватерніон)</text>
<text x="715.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">T_sp (нормалізована тяга)</text>
<text x="715.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ω_ff (кутова швидкість)</text>
<line x1="190.0" y1="130.0" x2="225.0" y2="130.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="395.0" y1="130.0" x2="430.0" y2="130.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="605.0" y1="130.0" x2="640.0" y2="130.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="225.0" width="760.0" height="105.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="50.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">БЕЗБЛОКУВАЛЬНИЙ ТРАНСПОРТ ТА СТОРОЖ ЗАСТАРІВАННЯ (WATCHDOG)</text>
<rect x="50.0" y="265.0" width="220.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Guidance Thread (20–50 Гц)</tspan><tspan x="160.0" dy="13.0">Запис у Seqlock / Double Buffer</tspan></text>
<rect x="300.0" y="265.0" width="220.0" height="50.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="410.0" y="287.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Setpoint Watchdog</tspan><tspan x="410.0" dy="11.7">Перевірка dt = t_now − t_sp &lt; 100 мс</tspan></text>
<rect x="550.0" y="265.0" width="220.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Control Thread (500–1000 Гц)</tspan><tspan x="660.0" dy="13.0">Читання уставки / Fallback режим</tspan></text>
<line x1="270.0" y1="290.0" x2="300.0" y2="290.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520.0" y1="290.0" x2="550.0" y2="290.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>