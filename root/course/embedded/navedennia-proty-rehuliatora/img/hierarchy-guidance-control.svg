<text x="625.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">q_target (орієнтація) + T_sp (тяга) + ω_ff (випередження)</text>
