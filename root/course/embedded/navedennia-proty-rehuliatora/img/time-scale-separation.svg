<circle cx="707.0" cy="260.0" r="4.0" fill="#c0392b" stroke="#333333" stroke-width="1.2"/>
<text x="707.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">30 Гц (Швидкість)</text>
<rect x="180.0" y="300.0" width="460.0" height="48.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="410.0" y="320.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Розподіл за шкалою часу (Time-Scale Separation):</tspan><tspan x="410.0" dy="14.3">Запас частот ≥ 5× ... 10× виключає динамічне зчеплення і резонанс</tspan></text>
<rect x="50.0" y="360.0" width="720.0" height="34.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Внутрішній контур (Rate) реагує в 10–20 разів швидше за зовнішній (Position),</tspan><tspan x="410.0" dy="13.0">забезпечуючи стабільну платформу для повільного наведення.</tspan></text>
