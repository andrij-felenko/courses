<circle cx="312.0" cy="260.0" r="4.0" fill="#0284c7" stroke="#333333" stroke-width="1.2"/>
<text x="312.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle" font-weight="700">2 Гц (Позиція)</text>
<line x1="512.0" y1="254.0" x2="512.0" y2="266.0" stroke="#ea580c" stroke-width="2.0"/>
<circle cx="512.0" cy="260.0" r="4.0" fill="#ea580c" stroke="#333333" stroke-width="1.2"/>
<text x="512.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="700">6 Гц (Орієнтація)</text>
