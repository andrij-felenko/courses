<text x="115.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Смуга: 0.2–1 Гц</text>
<text x="115.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Контур: 10–20 Гц</text>
<text x="115.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">τ ≈ 2–5 с</text>
<rect x="225.0" y="60.0" width="175.0" height="125.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
<text x="312.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle" font-weight="700">2. Позиція і швидкість</text>
<text x="312.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Смуга: 1–3 Гц</text>
<text x="312.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Контур: 30–50 Гц</text>
<text x="312.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle" font-weight="700">τ ≈ 0.5–1 с</text>
<rect x="425.0" y="60.0" width="175.0" height="125.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="512.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="700">3. Орієнтація (Attitude)</text>
<text x="512.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Смуга: 4–8 Гц</text>
<text x="512.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Контур: 100–250 Гц</text>
<text x="512.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="700">τ ≈ 120–150 мс</text>
<rect x="625.0" y="60.0" width="165.0" height="125.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/>
<text x="707.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">4. Кутова швидкість</text>
<text x="707.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Смуга: 20–40 Гц</text>
<text x="707.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Контур: 500–1000 Гц</text>
<text x="707.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">τ ≈ 15–25 мс</text>
