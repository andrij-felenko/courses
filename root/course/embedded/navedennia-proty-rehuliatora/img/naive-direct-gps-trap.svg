<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка безпосереднього замикання GPS на мотори проти каскадної архітектури</text>
<rect x="30.0" y="45.0" width="740.0" height="175.0" rx="8" fill="#fff1f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="50.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">❌ НАЇВНИЙ ПІДХІД: ПРЯМЕ КЕРУВАННЯ МОТОРАМИ ВІД GPS (КАТАСТРОФА)</text>
<rect x="50.0" y="90.0" width="150.0" height="55.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="125.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Помилка GPS</tspan><tspan x="125.0" dy="11.7">Δx = x_ref − x_gps</tspan><tspan x="125.0" dy="11.7">(Затримка 200 мс, шум 2м)</tspan></text>
<rect x="240.0" y="90.0" width="160.0" height="55.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Єдиний PID-регулятор</tspan><tspan x="320.0" dy="11.7">Диференціювання шуму D-ланкою</tspan></text>
<rect x="440.0" y="90.0" width="140.0" height="55.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Мотори дрона</tspan><tspan x="510.0" dy="13.0">ШІМ команди прямо</tspan><tspan x="510.0" dy="13.0">на ESC</tspan></text>
<rect x="615.0" y="80.0" width="140.0" height="75.0" rx="6" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5"/><text x="685.0" y="103.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">НАСЛІДОК:</tspan><tspan x="685.0" dy="11.7">Фазовий зсув &gt; 180°</tspan><tspan x="685.0" dy="11.7">Втрата стійкості</tspan><tspan x="685.0" dy="11.7">Миттєве сальто й краш</tspan></text>
<line x1="200.0" y1="117.0" x2="240.0" y2="117.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400.0" y1="117.0" x2="440.0" y2="117.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580.0" y1="117.0" x2="615.0" y2="117.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="50.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Чому ламається: 1) Затримка GPS 200 мс з'їдає весь запас фази на 2 Гц;  2) Невідомий нахил тіла (Body vs World);</text>
<text x="50.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3) D-ланка множить шум вимірів на тисячі; 4) Поворот по курсу обертає напрямок моторів без відома регулятора.</text>
<rect x="30.0" y="240.0" width="740.0" height="180.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="50.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">✔ ПРАВИЛЬНА ІЄРАРХІЯ: КАСКАДНЕ РОЗДІЛЕННЯ (СТІЙКИЙ ПОЛІТ)</text>
<rect x="50.0" y="285.0" width="160.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Повільний GPS (10 Гц)</tspan><tspan x="130.0" dy="13.0">Фільтрація в EKF</tspan><tspan x="130.0" dy="13.0">Визначення вектора a_des</tspan></text>
<rect x="250.0" y="285.0" width="160.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Генератор уставки</tspan><tspan x="330.0" dy="13.0">Нахил tilt = f(a_des)</tspan><tspan x="330.0" dy="13.0">Обмеження кута ≤ 35°</tspan></text>
<rect x="450.0" y="285.0" width="160.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="303.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Швидкий PID орієнтації (1 кГц)</tspan><tspan x="530.0" dy="11.7">Зворотний зв'язок з IMU</tspan><tspan x="530.0" dy="11.7">Демпфування за 2 мс</tspan></text>
<rect x="645.0" y="285.0" width="110.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Мотори</tspan><tspan x="700.0" dy="13.0">Плавне й стійке</tspan><tspan x="700.0" dy="13.0">відпрацювання</tspan></text>
<line x1="210.0" y1="312.0" x2="250.0" y2="312.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410.0" y1="312.0" x2="450.0" y2="312.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="610.0" y1="312.0" x2="645.0" y2="312.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="50.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Результат: Швидкий контур на гіроскопі ізолює апарат від миттєвих збурень і поривів вітру.</text>
<text x="50.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Повільний контур навігації оперує лише плавними нахилами цілого апарата. Запас фази &gt; 60°.</text>
</svg>