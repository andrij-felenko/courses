<text x="470.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Найгаласливіший куток (котушка + ключі + щільні конденсатори) — це вузол перемикання; його тримають компактним</text>
