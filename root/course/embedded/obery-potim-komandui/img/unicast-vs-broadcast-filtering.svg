<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр фільтрації пакетів у радіомережі на борту апарата</text>
<rect x="20.0" y="60.0" width="160.0" height="310.0" rx="6" fill="#f0f4f8" stroke="#2457d6" stroke-width="1.6"/>
<text x="100.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Радіоефір / Mesh</text>
<rect x="30.0" y="110.0" width="140.0" height="100.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="100.0" y="137.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">Вхідний пакет:</tspan><tspan x="100.0" dy="13.0">• Target ID</tspan><tspan x="100.0" dy="13.0">• Command Code</tspan><tspan x="100.0" dy="13.0">• SBO Token</tspan><tspan x="100.0" dy="13.0">• Seq &amp; CRC</tspan></text>
<rect x="30.0" y="225.0" width="140.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="100.0" y="271.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">Типи адресації:</tspan><tspan x="100.0" dy="13.0">1. Unicast (0x02)</tspan><tspan x="100.0" dy="13.0">2. Broadcast (0xFF)</tspan><tspan x="100.0" dy="13.0">3. Group (0x80)</tspan></text>
<rect x="220.0" y="60.0" width="175.0" height="310.0" rx="6" fill="#fdf8e8" stroke="#d98324" stroke-width="1.6"/>
<text x="307.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d98324" text-anchor="middle" font-weight="700">Рівень 1: Адреса</text>
<rect x="230.0" y="110.0" width="155.0" height="110.0" rx="6" fill="#ffffff" stroke="#d98324" stroke-width="1.0"/><text x="307.5" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">Перевірка Target ID:</tspan><tspan x="307.5" dy="11.7"></tspan><tspan x="307.5" dy="11.7">Target == MY_ID (0x02)?</tspan><tspan x="307.5" dy="11.7">──► ПРОПУСТИТИ</tspan><tspan x="307.5" dy="11.7"></tspan><tspan x="307.5" dy="11.7">Target == 0xFF (Broadcast)?</tspan><tspan x="307.5" dy="11.7">──► ПЕРЕВІРКА КРИТИЧНОСТІ</tspan></text>
<rect x="230.0" y="235.0" width="155.0" height="115.0" rx="6" fill="#feebe8" stroke="#c0392b" stroke-width="1.4"/><text x="307.5" y="272.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">Фільтр Broadcast:</tspan><tspan x="307.5" dy="11.7">Критична дія (Arm/Cut/Reboot)</tspan><tspan x="307.5" dy="11.7">на адресу 0xFF:</tspan><tspan x="307.5" dy="11.7">──► ВІДХИЛИТИ!</tspan><tspan x="307.5" dy="11.7">(Security Drop)</tspan></text>
<rect x="435.0" y="60.0" width="185.0" height="310.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="527.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Рівень 2: SBO Gate</text>
<rect x="445.0" y="110.0" width="165.0" height="120.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="527.5" y="149.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="527.5" dy="0.0">Перевірка селектора:</tspan><tspan x="527.5" dy="11.7">1. Чи борт у стані ARMED?</tspan><tspan x="527.5" dy="11.7">2. Чи дійсний SBO Token?</tspan><tspan x="527.5" dy="11.7">3. Чи не сплив тайм-аут T_arm?</tspan><tspan x="527.5" dy="11.7">4. Чи збігається тип дії?</tspan></text>
<rect x="445.0" y="245.0" width="165.0" height="105.0" rx="6" fill="#feebe8" stroke="#c0392b" stroke-width="1.4"/><text x="527.5" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="527.5" dy="0.0">Невідповідність:</tspan><tspan x="527.5" dy="13.0">• Не обрано (Unarmed)</tspan><tspan x="527.5" dy="13.0">• Токен застарів</tspan><tspan x="527.5" dy="13.0">──► ВІДХИЛИТИ</tspan><tspan x="527.5" dy="13.0">(NACK: ERR_SBO_EXPIRED)</tspan></text>
<rect x="660.0" y="60.0" width="160.0" height="310.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="740.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виконання</text>
<rect x="670.0" y="110.0" width="140.0" height="110.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.4"/><text x="740.0" y="144.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Безпечна дія:</tspan><tspan x="740.0" dy="11.7">• Силовий розрив</tspan><tspan x="740.0" dy="11.7">• Зупинка моторів</tspan><tspan x="740.0" dy="11.7">• Зміна польотного режиму</tspan><tspan x="740.0" dy="11.7">• Скидання селектора</tspan></text>
<rect x="670.0" y="235.0" width="140.0" height="115.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.0"/><text x="740.0" y="272.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Звіт статусу:</tspan><tspan x="740.0" dy="11.7">Формування телеметрії:</tspan><tspan x="740.0" dy="11.7">• Action ACK</tspan><tspan x="740.0" dy="11.7">• New State</tspan><tspan x="740.0" dy="11.7">• Execution Timestamp</tspan></text>
<line x1="180.0" y1="165.0" x2="220.0" y2="165.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="395.0" y1="165.0" x2="435.0" y2="165.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="165.0" x2="660.0" y2="165.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>