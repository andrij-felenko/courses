<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розсинхронізація фокусу: пряме виконання проти двоетапного SBO</text>
<rect x="20.0" y="50.0" width="385.0" height="360.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="212.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Пряма дія (Direct-Operate) — вразливий пульт</text>
<rect x="35.0" y="95.0" width="355.0" height="60.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="212.5" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Оператор дивиться на екран:</tspan><tspan x="212.5" dy="14.3">«Дрон #03 сів на майданчик, вимикаю гвинти»</tspan></text>
<rect x="35.0" y="165.0" width="355.0" height="65.0" rx="6" fill="#feebe8" stroke="#c0392b" stroke-width="1.4"/><text x="212.5" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Прихований стан UI (Stale Focus):</tspan><tspan x="212.5" dy="13.0">Фокус пульта залишився на Дроні #01 (у повітрі на 40 м)!</tspan><tspan x="212.5" dy="13.0">Кнопка на пульті: [ ВИМКНУТИ МОТОРИ ]</tspan></text>
<line x1="212.0" y1="240.0" x2="212.0" y2="275.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="212.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Один клік без підтвердження цілі</text>
<rect x="35.0" y="285.0" width="355.0" height="110.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="212.5" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Катастрофічний наслідок:</tspan><tspan x="212.5" dy="14.3">1. Пакет летить на активний ID (Дрон #01)</tspan><tspan x="212.5" dy="14.3">2. Дрон #01 миттєво глушить двигуни в повітрі та падає</tspan><tspan x="212.5" dy="14.3">3. Дрон #03 на землі продовжує обертати гвинти</tspan><tspan x="212.5" dy="14.3">Повна втрата апарата через когнітивну пастку!</tspan></text>
<rect x="435.0" y="50.0" width="385.0" height="360.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="627.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Select-Before-Operate (SBO) — безпечний контроль</text>
<rect x="450.0" y="95.0" width="355.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="627.5" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">Крок 1: Явний вибір (Select Target)</tspan><tspan x="627.5" dy="14.3">Оператор тисне на картку Дрона #03.</tspan><tspan x="627.5" dy="14.3">Пульт відправляє SELECT(ID: 03) та блокує контекст.</tspan></text>
<rect x="450.0" y="165.0" width="355.0" height="65.0" rx="6" fill="#e1f5e6" stroke="#27ae60" stroke-width="1.4"/><text x="627.5" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">Крок 2: Візуальне блокування та зворотний зв'язок</tspan><tspan x="627.5" dy="14.3">Кнопка дії перейменовується: [ ВИМКНУТИ (ДРОН #03) ]</tspan><tspan x="627.5" dy="14.3">Запускається таймер вікна дії (наприклад, 6.0 с).</tspan></text>
<line x1="627.0" y1="240.0" x2="627.0" y2="275.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="627.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Крок 3: Виконання в межах вікна (Operate)</text>
<rect x="450.0" y="285.0" width="355.0" height="110.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="627.5" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">Гарантія безпеки:</tspan><tspan x="627.5" dy="14.3">1. Команда валідується з токеном вибору та ID: 03</tspan><tspan x="627.5" dy="14.3">2. Дрон #03 зупиняє двигуни на землі</tspan><tspan x="627.5" dy="14.3">3. Дрон #01 у повітрі ігнорує чужу команду</tspan><tspan x="627.5" dy="14.3">4. Після дії селектор повертається в IDLE.</tspan></text>
</svg>