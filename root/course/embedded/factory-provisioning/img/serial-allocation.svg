<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Серійник — спільний лічильник: як його не роздвоїти й не втратити</text>
<text x="220.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НАЇВНО: інкремент ПІСЛЯ запису</text>
<rect x="40.0" y="80.0" width="360.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="220.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">1. взяти лічильник N = 42</tspan></text>
<rect x="40.0" y="144.0" width="360.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="220.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">2. зашити 42 в плату…</tspan></text>
<rect x="40.0" y="208.0" width="360.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="220.0" y="227.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">✗ ЖИВЛЕННЯ СТАНЦІЇ МОРГНУЛО</tspan><tspan x="220.0" dy="14.3">до кроку «інкремент»</tspan></text>
<rect x="40.0" y="278.0" width="360.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="301.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">3. інкремент N так і не стався</tspan></text>
<rect x="40.0" y="340.0" width="360.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="220.0" y="362.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">НАСЛІДОК: наступна плата теж дістане 42 →</tspan><tspan x="220.0" dy="13.7">ДВА вироби з одним серійником у полі</tspan></text>
<line x1="220.0" y1="120.0" x2="220.0" y2="144.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220.0" y1="184.0" x2="220.0" y2="208.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220.0" y1="254.0" x2="220.0" y2="278.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="620.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПРАВИЛЬНО: резервуй ДО, підтверджуй ПІСЛЯ</text>
<rect x="440.0" y="80.0" width="360.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">1. атомарно ЗАРЕЗЕРВУВАТИ N=42</tspan><tspan x="620.0" dy="14.3">   (запис у БД: 42 = «видано, в роботі»)</tspan></text>
<rect x="440.0" y="144.0" width="360.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="620.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">2. зашити 42, прочитати назад, самотест</tspan></text>
<rect x="440.0" y="208.0" width="360.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.7"/><text x="620.0" y="227.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">✓ усе зійшлося → ПІДТВЕРДИТИ 42</tspan><tspan x="620.0" dy="14.3">(у БД: 42 = «народжено», дата, партія)</tspan></text>
<rect x="440.0" y="274.0" width="360.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="620.0" y="297.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="620.0" dy="0.0">збій до підтвердження? 42 лишиться «в роботі» —</tspan><tspan x="620.0" dy="13.0">його НЕ віддадуть іншій платі (пропуск краще,</tspan><tspan x="620.0" dy="13.0">ніж дублікат). Лічильник монотонний, дублів нема.</tspan></text>
<line x1="620.0" y1="124.0" x2="620.0" y2="144.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="620.0" y1="188.0" x2="620.0" y2="208.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>