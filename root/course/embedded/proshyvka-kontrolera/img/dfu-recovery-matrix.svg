<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 986.7 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="986.7" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця завантаження та відновлення польотного контролера</text>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця завантаження, відновлення та відкату (Rollback)</text>
<rect x="340.0" y="63.5" width="280.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Подача живлення / Reset (NRST)</tspan></text>
<line x1="400.0" y1="102.0" x2="220.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="102.0" x2="740.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="142.3" width="300.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Апаратна перевірка:</tspan><tspan x="220.0" dy="14.3">Кнопка Boot0 натиснута (Boot0 = VDD)?</tspan></text>
<line x1="220.0" y1="195.0" x2="220.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="246.1" width="320.0" height="57.8" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Фабричний ROM DFU Завантажувач</tspan><tspan x="220.0" dy="13.7">(0x1FFF0000 — USB DFU / UART1)</tspan><tspan x="220.0" dy="13.7">Гарантований захист від перетворення на «цеглину»</tspan></text>
<rect x="576.5" y="142.3" width="326.9" height="45.3" rx="6" fill="#edf2fc" stroke="#2457d6" stroke-width="1.5"/><text x="740.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Програмна перевірка:</tspan><tspan x="740.0" dy="14.3">Прапорець у RTC Backup / 1200 baud USB touch?</tspan></text>
<line x1="620.0" y1="195.0" x2="480.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="820.0" y1="195.0" x2="820.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="252.9" width="260.0" height="44.1" rx="6" fill="#f0f5ff" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="271.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Stage 2 DFU Bootloader</tspan><tspan x="480.0" dy="13.7">(Очікування прошивки по USB/MAVLink)</tspan></text>
<rect x="673.3" y="252.9" width="293.4" height="44.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="271.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Перевірка цілісності слота:</tspan><tspan x="820.0" dy="13.7">Валідація CRC32/SHA256 та лічильника збоїв</tspan></text>
<line x1="820.0" y1="308.0" x2="820.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="366.1" width="280.0" height="57.8" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Запуск основної прошивки (App)</tspan><tspan x="820.0" dy="13.7">Якщо збій запуску &gt; 3 разів → A/B Rollback</tspan><tspan x="820.0" dy="13.7">на попередній робочий банк Flash</tspan></text>
<line x1="680.0" y1="285.0" x2="610.0" y2="285.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="645.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Пошкоджено</text>
<text x="480.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Багаторівнева система захисту унеможливлює незворотну втрату працездатності контролера.</text>
</svg>