<text x="227.5" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">Забезпечує правильний хронологічний порядок</text>
<text x="227.5" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">Фізично точні графіки, тренди, похідні, FFT</text>
