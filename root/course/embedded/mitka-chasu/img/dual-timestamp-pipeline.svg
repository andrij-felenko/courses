<text x="607.5" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">Швидкий запис пачками (Append-only LSM)</text>
<text x="607.5" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">Аудит доставки, метрики затримок мережі (SLA)</text>
<line x1="227.0" y1="360.0" x2="227.0" y2="395.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="607.0" y1="360.0" x2="607.0" y2="395.0" stroke="#7e22ce" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="400.0" width="345.0" height="60.0" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.3"/>
<text x="227.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle" font-weight="700">Аналітика та моніторинг процесів</text>
<text x="227.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Кореляція сигналів, виявлення аварій, звітність</text>
<rect x="435.0" y="400.0" width="345.0" height="60.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.3"/>
<text x="607.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="700">Мережева діагностика та безпека</text>
<text x="607.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Виявлення втрат зв'язку, джитер, атаки повтору</text>
