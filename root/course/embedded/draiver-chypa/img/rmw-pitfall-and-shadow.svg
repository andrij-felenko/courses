<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="880.0" height="440.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="460.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастки прямого Read-Modify-Write (RMW) проти безпечного керування</text>
<rect x="45.0" y="75.0" width="400.0" height="365.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="245.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний прямий RMW (Помилка)</text>
<rect x="60.0" y="120.0" width="370.0" height="85.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="75.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">1. Регістри зі скиданням по читанню (COR)</text>
<text x="75.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Зчитування STATUS_REG заради 1 біта</text>
<text x="75.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">безповоротно очищає прапорці переривань!</text>
<rect x="60.0" y="220.0" width="370.0" height="85.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="75.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">2. Регістри лише для запису (Write-Only)</text>
<text x="75.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Читання повертає 0x00 або 0xFF.</text>
<text x="75.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">RMW перезаписує сусідні біти сміттям!</text>
<rect x="60.0" y="320.0" width="370.0" height="100.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="75.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">3. Зарезервовані біти (Reserved Bits)</text>
<text x="75.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Помилкове перезаписування бітів заводського</text>
<text x="75.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">підстроювання або бітів Must-Be-Zero (MBZ)</text>
<text x="75.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">призводить до декалібрування чи зависання.</text>
<rect x="475.0" y="75.0" width="400.0" height="365.0" rx="8" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="675.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечні патерни оновлення</text>
<rect x="490.0" y="120.0" width="370.0" height="85.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="505.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">1. Тіньовий стан у пам'яті ОЗП (Shadow State)</text>
<text x="505.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Зберігання копії регістрів у struct Device_t.</text>
<text x="505.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="start" font-weight="700">Запис: dev-&gt;shadow = (shadow &amp; ~M) | V;</text>
<rect x="490.0" y="220.0" width="370.0" height="85.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="505.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">2. Явні бітові маски та зсуви (Mask &amp; Shift)</text>
<text x="505.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Ізоляція полів без зачіпання інших бітів:</text>
<text x="505.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="start" font-weight="700">#define REG_CTRL_ODR_MASK  (0x0F &lt;&lt; 4)</text>
<rect x="490.0" y="320.0" width="370.0" height="100.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="505.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">3. Атомарне блокування (BDU)</text>
<text x="505.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Активація Block Data Update для захисту</text>
<text x="505.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">від розриву даних між читаннями MSB і LSB</text>
<text x="505.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">під час внутрішнього оновлення АЦП.</text>
</svg>