<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому між кроками — пауза</text>
<line x1="60.0" y1="120.0" x2="700.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="680.0" y1="120.0" x2="702.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">час</text>
<line x1="150.0" y1="80.0" x2="150.0" y2="130.0" stroke="#b9770e" stroke-width="2.0"/>
<text x="150.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">SLPOUT надіслано</text>
<rect x="150.0" y="102.0" width="300.0" height="16.0" rx="6" fill="#fff3e0" stroke="#b9770e" stroke-width="1.4"/>
<text x="300.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle">насос заряду піднімає напругу матриці ~120 мс</text>
<line x1="450.0" y1="80.0" x2="450.0" y2="130.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="450.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">матриця готова</text>
<line x1="250.0" y1="180.0" x2="250.0" y2="132.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">команда РАНО</text>
<text x="250.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">загубиться — біла пляма</text>
<line x1="540.0" y1="180.0" x2="540.0" y2="132.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">команда ВЧАСНО</text>
<text x="540.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">після паузи — спрацює</text>
<text x="380.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">контролер приймає байт одразу, але живлення матриці наростає поступово</text>
<text x="380.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">datasheet дає мінімальні паузи — поважай їх, інакше виходиш на несформоване залізо</text>
</svg>