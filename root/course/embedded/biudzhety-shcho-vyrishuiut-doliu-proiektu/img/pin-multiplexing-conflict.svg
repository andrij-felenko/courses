<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікти альтернативних функцій виводів</text>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікти альтернативних функцій виводів (GPIO Multiplexing)</text>
<text x="130.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Зовнішній інтерфейс</text>
<text x="410.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Вивід МК та альтернативна функція</text>
<text x="720.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Апаратний конфлікт та наслідок</text>
<rect x="67.2" y="91.5" width="125.6" height="37.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="130.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Програматор SWD</tspan><tspan x="130.0" dy="13.0">(ST-Link / J-Link)</tspan></text>
<rect x="336.9" y="90.5" width="146.2" height="39.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="410.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">PA13 / PA14</tspan><tspan x="410.0" dy="13.0">SWDIO / SWCLK (Debug)</tspan></text>
<line x1="197.8" y1="110.0" x2="331.9" y2="110.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="628.4" y="92.7" width="183.3" height="34.7" rx="6" fill="#fdfefe" stroke="#c0392b" stroke-width="1.4"/><text x="720.0" y="107.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Якщо зайняти під LED або кнопку —</tspan><tspan x="720.0" dy="11.7">блокується SWD-прошивка на стенді</tspan></text>
<line x1="488.1" y1="110.0" x2="623.4" y2="110.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="73.4" y="171.5" width="113.2" height="37.0" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.6"/><text x="130.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">TFT-дисплей SPI</tspan><tspan x="130.0" dy="13.0">+ Драйвер мотора</tspan></text>
<rect x="312.1" y="170.5" width="195.8" height="39.0" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.8"/><text x="410.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">PA5</tspan><tspan x="410.0" dy="13.0">SPI1_SCK / TIM2_CH1 / ADC_IN5</tspan></text>
<line x1="191.6" y1="190.0" x2="307.1" y2="190.0" stroke="#e67e22" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="620.7" y="172.7" width="198.7" height="34.7" rx="6" fill="#fdfefe" stroke="#e67e22" stroke-width="1.4"/><text x="720.0" y="187.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">ШІМ-канал мотора апаратно вимикає</tspan><tspan x="720.0" dy="11.7">швидкісний апаратний SPI для дисплея</tspan></text>
<line x1="512.9" y1="190.0" x2="615.7" y2="190.0" stroke="#e67e22" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.3" y="251.5" width="119.4" height="37.0" rx="6" fill="#f4ecf8" stroke="#8a5fb0" stroke-width="1.6"/><text x="130.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Шина сенсорів I2C</tspan><tspan x="130.0" dy="13.0">(IMU, Барометр)</tspan></text>
<rect x="318.3" y="250.5" width="183.4" height="39.0" rx="6" fill="#ffffff" stroke="#8a5fb0" stroke-width="1.8"/><text x="410.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">PB6 / PB7</tspan><tspan x="410.0" dy="13.0">I2C1_SCL_SDA / USART1_TX_RX</tspan></text>
<line x1="194.7" y1="270.0" x2="313.3" y2="270.0" stroke="#8a5fb0" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="613.0" y="252.7" width="214.1" height="34.7" rx="6" fill="#fdfefe" stroke="#8a5fb0" stroke-width="1.4"/><text x="720.0" y="267.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Підключення I2C блокує апаратний UART,</tspan><tspan x="720.0" dy="11.7">необхідний для налагоджувальної консолі</tspan></text>
<line x1="506.7" y1="270.0" x2="608.0" y2="270.0" stroke="#8a5fb0" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="64.1" y="331.5" width="131.8" height="37.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="130.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Дільник вибору Boot</tspan><tspan x="130.0" dy="13.0">+ Лінія скидання</tspan></text>
<rect x="312.1" y="330.5" width="195.8" height="39.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="410.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">BOOT0 / NRST</tspan><tspan x="410.0" dy="13.0">Strapping Pins / System Reset</tspan></text>
<line x1="200.9" y1="350.0" x2="307.1" y2="350.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="607.8" y="332.6" width="224.3" height="34.7" rx="6" fill="#fdfefe" stroke="#2457d6" stroke-width="1.4"/><text x="720.0" y="347.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Недоторканні виводи: резистивні підтяжки</tspan><tspan x="720.0" dy="11.7">визначають старт ядра при подачі живлення</tspan></text>
<line x1="512.9" y1="350.0" x2="602.8" y2="350.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="440.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Виділення виводів під SWD, Boot та критичні шини фіксується до трасування ліній схеми</text>
</svg>