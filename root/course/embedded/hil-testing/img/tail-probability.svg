<text x="412.5" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">N = 240 000 тактів, p = 0.001  →  240 зривів за політ — попри «прекрасне середнє».</text>
<text x="412.5" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Тому метрика лінка — 99.9-й процентиль (обмежує p), а не середнє.</text>
