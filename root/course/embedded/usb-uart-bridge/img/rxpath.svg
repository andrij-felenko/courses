<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прийом без втрат: швидкий ISR, повільний розбір — через кільцевий буфер</text>
<rect x="24.0" y="96.0" width="118.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="83.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="83.0" dy="0.0">лінія UART</tspan><tspan x="83.0" dy="13.7">байти пачкою</tspan><tspan x="83.0" dy="13.7">після пакування</tspan></text>
<rect x="180.0" y="96.0" width="150.0" height="70.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="255.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ISR прийому</text>
<text x="255.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">забрав байт →</tspan><tspan x="255.0" dy="13.0">поклав у буфер</tspan></text>
<circle cx="440.0" cy="131.0" r="52.0" fill="#f0fbf3" stroke="#27ae60" stroke-width="2.0"/>
<text x="440.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">кільцевий</text>
<text x="440.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">буфер</text>
<text x="440.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">head→ ←tail</text>
<line x1="440.0" y1="79.0" x2="462.0" y2="86.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="462.0" y1="176.0" x2="440.0" y2="183.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="96.0" width="196.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="658.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">стейт-машина кадру</text>
<text x="658.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="658.0" dy="0.0">бере байт, коли є</tspan><tspan x="658.0" dy="13.0">час; складає кадр</tspan></text>
<line x1="142.0" y1="131.0" x2="178.0" y2="131.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="332.0" y1="131.0" x2="386.0" y2="131.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="494.0" y1="131.0" x2="558.0" y2="131.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.6" y="196.3" width="498.8" height="71.4" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="390.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">ISR мусить бути коротким: забрати байт і покласти в буфер — більше нічого.</tspan><tspan x="390.0" dy="13.7">Кільцевий буфер розв'язує швидкий прийом і повільний розбір: байти не губляться,</tspan><tspan x="390.0" dy="13.7">поки головний цикл зайнятий. Саме ця розв'язка рятує від нерівного, пачкового</tspan><tspan x="390.0" dy="13.7">припливу байтів, який лишає по собі USB-міст.</tspan></text>
</svg>