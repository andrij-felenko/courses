<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стейт-машина кадру [SYNC][LEN][дані…][CRC] — по одному байту</text>
<rect x="60.0" y="96.0" width="130.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/>
<text x="125.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">чекати SYNC</text>
<text x="125.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">відкидати, доки</tspan><tspan x="125.0" dy="10.3">не 0xAA</tspan></text>
<line x1="190.0" y1="125.0" x2="240.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240.0" y="96.0" width="130.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="305.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">читати LEN</text>
<text x="305.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">узяти довжину,</tspan><tspan x="305.0" dy="10.3">перевірити стелю</tspan></text>
<line x1="370.0" y1="125.0" x2="430.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="96.0" width="130.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="495.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">збирати дані</text>
<text x="495.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">n байтів за</tspan><tspan x="495.0" dy="10.3">лічильником</tspan></text>
<line x1="560.0" y1="125.0" x2="620.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="96.0" width="130.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="685.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">читати CRC</text>
<text x="685.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">звірити —</tspan><tspan x="685.0" dy="10.3">кадр готовий</tspan></text>
<text x="215.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">0xAA</text>
<text x="400.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">len ≤ MAX</text>
<text x="590.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">усі дані</text>
<line x1="685.0" y1="154.0" x2="685.0" y2="180.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="685.0" y1="180.0" x2="125.0" y2="180.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="125.0" y1="180.0" x2="125.0" y2="154.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="390.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">кадр оброблено (чи відкинуто) → знову чекати SYNC</text>
<line x1="305.0" y1="96.0" x2="305.0" y2="66.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4,3"/>
<line x1="305.0" y1="66.0" x2="125.0" y2="66.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4,3"/>
<line x1="125.0" y1="66.0" x2="125.0" y2="96.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="180.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">LEN завелика → скид</text>
<rect x="113.7" y="217.1" width="552.7" height="57.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="390.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Стан і лічильники живуть МІЖ викликами, тож кадр збирається по байту, не блокуючи МК.</tspan><tspan x="390.0" dy="13.7">Кожен прийнятий байт зсуває автомат на один крок; межі задає поле довжини, а не пауза.</tspan><tspan x="390.0" dy="13.7">Хибна довжина чи провал CRC не валять зв'язок — автомат вертається чекати наступний SYNC.</tspan></text>
</svg>