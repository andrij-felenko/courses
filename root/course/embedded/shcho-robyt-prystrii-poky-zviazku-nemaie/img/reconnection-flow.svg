<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність безпечного повернення в режим віддаленого керування</text>
<text x="430.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">порядок безпечного відновлення після появи зв'язку</text>
<rect x="40.0" y="70.0" width="780.0" height="76.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<rect x="55.0" y="84.0" width="80.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="95.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">КРОК 1</text>
<text x="150.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Автентифікація та Handshake</text>
<text x="150.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• перевірка актуальності сесії</text>
<text x="150.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• захист від replay-атак (скидання старих команд)</text>
<text x="150.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• обмін статусом «я був в офлайні N секунд»</text>
<line x1="430.0" y1="146.0" x2="430.0" y2="158.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="160.0" width="780.0" height="76.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<rect x="55.0" y="174.0" width="80.0" height="48.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.2"/>
<text x="95.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700">КРОК 2</text>
<text x="150.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="start" font-weight="700">Підтягування часу RTC (Time Slew)</text>
<text x="150.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• плавне усунення часового дрейфу</text>
<text x="150.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• ЗАБОРОНА різкого стрибка назад (монотонність!)</text>
<text x="150.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• збереження коректного порядку логів</text>
<line x1="430.0" y1="236.0" x2="430.0" y2="248.0" stroke="#caa24a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="250.0" width="780.0" height="76.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<rect x="55.0" y="264.0" width="80.0" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="95.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">КРОК 3</text>
<text x="150.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Плавний перехід (Smooth Takeover)</text>
<text x="150.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• звірка поточної фізичної позиції з новою уставкою</text>
<text x="150.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• плавне наростання швидкості (Ramp-up)</text>
<text x="150.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• виключення ударних механічних ривків</text>
<line x1="430.0" y1="326.0" x2="430.0" y2="338.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="340.0" width="780.0" height="76.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<rect x="55.0" y="354.0" width="80.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="95.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">КРОК 4</text>
<text x="150.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="start" font-weight="700">Фоновий злив логів (Rate-limited)</text>
<text x="150.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• вивантаження збереженого Flash-буфера</text>
<text x="150.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• низький пріоритет (обмеження смуги 10–20%)</text>
<text x="150.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• не заважає свіжому потоку керування</text>
</svg>