<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22.75 -10 882.75 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-22.75" y="-10" width="882.75" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура таймера мертвої руки (Dead-Man Watchdog)</text>
<text x="430.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">апаратний і програмний захист: таймер мертвої руки (Dead-Man)</text>
<rect x="30.0" y="75.0" width="180.0" height="200.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="120.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">РАДІО / КАНАЛ</text>
<text x="120.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">пакети керування</text>
<text x="120.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">кожні 50 мс:
• валідна уставка
• номер кадру
• підпис / CRC</text>
<rect x="45.0" y="220.0" width="150.0" height="36.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="120.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Heartbeat / Ping</text>
<rect x="260.0" y="60.0" width="310.0" height="230.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="415.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">МІКРОКОНТРОЛЕР</text>
<rect x="280.0" y="106.0" width="270.0" height="70.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="415.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">Софтовий Dead-Man Timer (200 мс)</text>
<text x="415.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">скидається кожним ВАЛІДНИМ пакетом;</text>
<text x="415.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8a6d1a" text-anchor="middle" font-weight="700">при таймауті: обнуляє ШІМ у регістрах</text>
<rect x="280.0" y="190.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="415.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратний Interlock / Monostable</text>
<text x="415.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">таймер вимагає пульсації (toggle pin);</text>
<text x="415.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">якщо CPU завис у HIGH чи LOW —</text>
<text x="415.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">апаратна лінія ENABLE падає в 0</text>
<rect x="620.0" y="75.0" width="210.0" height="200.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="725.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">СИЛОВИЙ ДРАЙВЕР</text>
<text x="725.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">мотори, нагрівачі, клапани</text>
<rect x="635.0" y="140.0" width="180.0" height="42.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="725.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Вхід ENABLE (Gate Kill)</text>
<text x="725.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 = апаратний стоп</text>
<rect x="635.0" y="196.0" width="180.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="725.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхід PWM / Power</text>
<text x="725.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">керування шпаруватістю</text>
<line x1="210.0" y1="140.0" x2="280.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="550.0" y1="140.0" x2="635.0" y2="217.0" stroke="#caa24a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="550.0" y1="230.0" x2="635.0" y2="161.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="30.0" y="310.0" width="800.0" height="85.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="430.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">чому системного WDT недостатньо для безпеки:</text>
<text x="430.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. Системний WDT стежить лише за зависанням CPU (цикл крутиться — WDT задоволений).</text>
<text x="430.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">2. Dead-Man Timer стежить за надходженням свіжих команд (немає команд — повне знеструмлення).</text>
</svg>