<text x="45.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• sbom-firmware.cdx.json / spdx.json — машинночитний паспорт компонентів (хеші, ліцензії, версії, CPE/PURL).</text>
<text x="45.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• THIRD_PARTY_NOTICES.txt — повний зведений текст ліцензій (MIT, BSD, Apache-2.0) для інструкції або веб-сервера.</text>
<text x="45.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• flash_license_table.bin — вбудована таблиця атрибуції у службовій секції Flash для виводу через CLI-консоль.</text>
<text x="420.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Конвеєр автоматично ламає збірку в CI, якщо розробник підключив несумісну копілефтну бібліотеку</text>
