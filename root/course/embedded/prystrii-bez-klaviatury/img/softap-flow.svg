<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Провізіонування через SoftAP: підняття тимчасової мережі та HTTP API</text>
<rect x="51.5" y="54.4" width="197.0" height="91.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">1. Старт SoftAP на МК</tspan><tspan x="150.0" dy="15.0">• SSID: «Device-Setup-XXXX»</tspan><tspan x="150.0" dy="15.0">• IP: 192.168.4.1</tspan><tspan x="150.0" dy="15.0">• DHCP + DNS Captive Portal</tspan><tspan x="150.0" dy="15.0">• Локальний HTTP-сервер</tspan></text>
<rect x="301.8" y="54.4" width="236.3" height="91.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">2. Перемикання телефона</tspan><tspan x="420.0" dy="15.0">• Від'єднується від домашньої AP</tspan><tspan x="420.0" dy="15.0">• Під'єднується до «Device-Setup»</tspan><tspan x="420.0" dy="15.0">• Отримує IP 192.168.4.2 від МК</tspan><tspan x="420.0" dy="15.0">• Відкриває веб-форму або REST</tspan></text>
<rect x="575.1" y="54.4" width="229.8" height="91.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">3. Відправка конфігурації</tspan><tspan x="690.0" dy="15.0">• HTTP POST /api/wifi-config</tspan><tspan x="690.0" dy="15.0">• JSON: {ssid:..., password:...}</tspan><tspan x="690.0" dy="15.0">• МК тестує з'єднання як станція</tspan><tspan x="690.0" dy="15.0">• Збереження в NVS флеш</tspan></text>
<line x1="260.0" y1="100.0" x2="305.0" y2="100.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="535.0" y1="100.0" x2="575.0" y2="100.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="50.0" y1="205.0" x2="790.0" y2="205.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="420.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Вразливості та системні пастки методу SoftAP</text>
<rect x="99.7" y="265.9" width="220.6" height="88.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Втрата мобільного інтернету</tspan><tspan x="210.0" dy="14.3">Android/iOS бачать «No Internet»</tspan><tspan x="210.0" dy="14.3">і примусово перемикають запити</tspan><tspan x="210.0" dy="14.3">на стільникову мережу 4G/LTE,</tspan><tspan x="210.0" dy="14.3">скидаючи підключення до МК</tspan></text>
<rect x="357.7" y="265.9" width="264.5" height="88.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Відкритий радіоефір</tspan><tspan x="490.0" dy="14.3">Якщо SoftAP без пароля, весь</tspan><tspan x="490.0" dy="14.3">трафік HTTP POST іде відкритим текстом.</tspan><tspan x="490.0" dy="14.3">Сусідній сніфер 802.11 перехоплює</tspan><tspan x="490.0" dy="14.3">домашній пароль WPA2 роутера</tspan></text>
<rect x="635.4" y="265.9" width="189.3" height="88.2" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/><text x="730.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Пам'ять і ресурси МК</tspan><tspan x="730.0" dy="14.3">Потрібно одночасно тримати</tspan><tspan x="730.0" dy="14.3">Wi-Fi AP стек, DHCP-сервер,</tspan><tspan x="730.0" dy="14.3">DNS-спуфер і парсер HTTP,</tspan><tspan x="730.0" dy="14.3">що забирає до 40 КБ RAM</tspan></text>
</svg>