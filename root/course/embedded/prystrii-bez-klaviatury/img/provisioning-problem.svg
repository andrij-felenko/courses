<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дилема «пристрою з коробки»: передача облікових даних Wi-Fi без клавіатури</text>
<rect x="25.1" y="90.8" width="249.7" height="98.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Смартфон користувача</tspan><tspan x="150.0" dy="15.6">• Має екран і клавіатуру</tspan><tspan x="150.0" dy="15.6">• Підключений до домашньої мережі</tspan><tspan x="150.0" dy="15.6">• Знає SSID: «Home-Net»</tspan><tspan x="150.0" dy="15.6">• Знає пароль WPA2/WPA3</tspan></text>
<rect x="552.0" y="90.8" width="236.0" height="98.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Безклавіатурний IoT-вузол</tspan><tspan x="670.0" dy="15.6">• Немає дисплея і клавіатури</tspan><tspan x="670.0" dy="15.6">• Чистий NVS-флеш з заводу</tspan><tspan x="670.0" dy="15.6">• Є лише антена 2.4 ГГц і МК</tspan><tspan x="670.0" dy="15.6">• Не знає імені й пароля мережі</tspan></text>
<rect x="262.3" y="239.3" width="295.3" height="61.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="259.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Домашня точка доступу (Wi-Fi AP)</tspan><tspan x="410.0" dy="15.0">Вимагає 4-стороннє рукостискання WPA2/WPA3</tspan><tspan x="410.0" dy="15.0">і правильний пароль для надання доступу</tspan></text>
<line x1="275.0" y1="140.0" x2="525.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6,4"/>
<rect x="279.1" y="112.2" width="241.7" height="55.6" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/><text x="400.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Як передати SSID + пароль?</tspan><tspan x="400.0" dy="14.3">— Ефір відкритий для прослуховування</tspan><tspan x="400.0" dy="14.3">— Немає спільного секрету</tspan></text>
<line x1="220.0" y1="210.0" x2="310.0" y2="250.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Вже в мережі</text>
<line x1="590.0" y1="210.0" x2="510.0" y2="250.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="575.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Не може під'єднатися</text>
</svg>