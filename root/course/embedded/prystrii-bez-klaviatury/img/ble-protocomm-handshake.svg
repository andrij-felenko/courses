<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">BLE-провізіонування: захищений сеанс Curve25519 + AES-GCM через GATT</text>
<line x1="180.0" y1="70.0" x2="180.0" y2="410.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="660.0" y1="70.0" x2="660.0" y2="410.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="90.2" y="44.0" width="179.7" height="28.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="62.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Смартфон (GATT Client)</tspan></text>
<rect x="555.3" y="44.0" width="209.4" height="28.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="62.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">IoT-пристрій (GATT Server)</tspan></text>
<line x1="660.0" y1="100.0" x2="180.0" y2="100.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="420.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1. BLE Advertisement («PROV_DEVICE_1234») + GATT Connect</text>
<line x1="180.0" y1="155.0" x2="660.0" y2="155.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="420.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Endpoint «prov-session»: Client Public Key (Curve25519)</text>
<line x1="660.0" y1="210.0" x2="180.0" y2="210.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="420.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Device Public Key + Device Random Nonce (Salt)</text>
<rect x="211.4" y="232.2" width="417.3" height="55.6" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/><text x="420.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Обчислення спільного секрету:</tspan><tspan x="420.0" dy="14.3">Shared Key = ECDH(Curve25519) + Proof of Possession (QR-код PIN)</tspan><tspan x="420.0" dy="14.3">Виведення сесійного ключа AES-256-GCM через HKDF-SHA256</tspan></text>
<line x1="180.0" y1="320.0" x2="660.0" y2="320.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="420.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">4. Endpoint «prov-scan»: Запит списку мереж (Encrypted)</text>
<line x1="660.0" y1="355.0" x2="180.0" y2="355.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="420.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">5. Список знайдених AP + рівні RSSI (Encrypted Protobuf)</text>
<line x1="180.0" y1="400.0" x2="660.0" y2="400.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">6. Endpoint «prov-config»: Зашифровані SSID + Passphrase (AES-GCM)</text>
</svg>