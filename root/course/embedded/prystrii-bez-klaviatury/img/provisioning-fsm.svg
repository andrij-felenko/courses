<rect x="141.5" y="209.3" width="197.0" height="61.4" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/><text x="240.0" y="229.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">STATE_PROVISIONING_ACTIVE</tspan><tspan x="240.0" dy="15.0">Запуск BLE / SoftAP реклами</tspan><tspan x="240.0" dy="15.0">Очікування облікових даних</tspan></text>
<rect x="491.7" y="209.3" width="216.6" height="61.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="229.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">STATE_VALIDATING_STATION</tspan><tspan x="600.0" dy="15.0">Тестове підключення до AP:</tspan><tspan x="600.0" dy="15.0">4-way handshake + DHCP IP test</tspan></text>
<rect x="285.5" y="359.3" width="269.1" height="61.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="379.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">STATE_PROV_FAILED (Fallback)</tspan><tspan x="420.0" dy="15.0">Повідомлення клієнту: «AUTH_FAIL»</tspan><tspan x="420.0" dy="15.0">Відкат до попереднього стану / Таймаут</tspan></text>
