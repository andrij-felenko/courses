<text x="450.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратна кнопка: Factory Reset (утримування 5 с) → Очищення NVS → Примусовий PROV</text>
