<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">SmartConfig і WPS: чому приховані канали та PIN-коди пішли в минуле</text>
<rect x="20.0" y="55.0" width="385.0" height="325.0" rx="6" fill="#fdfefe" stroke="#6b7280" stroke-width="1.2"/>
<text x="212.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">SmartConfig (ESP-Touch / SimpleLink)</text>
<rect x="78.3" y="108.1" width="267.4" height="53.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="212.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Смартфон транслює UDP Broadcast</tspan><tspan x="212.0" dy="13.7">Корисні дані всередині пакетів зашифровані</tspan><tspan x="212.0" dy="13.7">домашнім роутером (WPA2), але...</tspan></text>
<rect x="60.4" y="186.3" width="303.3" height="67.4" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/><text x="212.0" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Прихований канал: довжина кадру 802.11</tspan><tspan x="212.0" dy="13.7">МК у режимі Promiscuous Mode сніфить ефір:</tspan><tspan x="212.0" dy="13.7">Довжина пакета = Символ пароля</tspan><tspan x="212.0" dy="13.7">Пакет 1: 128 байт ('W'), Пакет 2: 145 байт ('i')</tspan></text>
<rect x="90.3" y="286.3" width="243.4" height="67.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="303.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Чому вмирає:</tspan><tspan x="212.0" dy="13.7">• 5 ГГц смартфон не бачить 2.4 ГГц чип</tspan><tspan x="212.0" dy="13.7">• AP Client Isolation блокує broadcast</tspan><tspan x="212.0" dy="13.7">• Сторонній трафік ламає послідовність</tspan></text>
<rect x="435.0" y="55.0" width="385.0" height="325.0" rx="6" fill="#fdfefe" stroke="#6b7280" stroke-width="1.2"/>
<text x="627.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">WPS (Wi-Fi Protected Setup PIN)</text>
<rect x="499.3" y="108.1" width="255.4" height="53.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="627.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">8-значний PIN на роутері</tspan><tspan x="627.0" dy="13.7">Протокол фатально розбиває перевірку PIN</tspan><tspan x="627.0" dy="13.7">на дві окремі незалежні частини:</tspan></text>
<rect x="466.4" y="186.3" width="321.2" height="67.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="627.0" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">Вразливість 10 000 + 1 000 спроб:</tspan><tspan x="627.0" dy="13.7">• Перші 4 цифри: 10^4 = 10 000 варіантів</tspan><tspan x="627.0" dy="13.7">• Наступні 3 цифри (+1 CRC): 10^3 = 1 000 варіантів</tspan><tspan x="627.0" dy="13.7">Разом: 11 000 спроб замість 100 000 000!</tspan></text>
<rect x="484.3" y="286.3" width="285.3" height="67.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="627.0" y="303.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">Атака Pixie Dust (2014):</tspan><tspan x="627.0" dy="13.7">Через слабкий генератор випадкових чисел PRNG</tspan><tspan x="627.0" dy="13.7">у чипах роутерів PIN обчислюється офлайн</tspan><tspan x="627.0" dy="13.7">менш ніж за 1 секунду! WPS вимкнено скрізь</tspan></text>
</svg>