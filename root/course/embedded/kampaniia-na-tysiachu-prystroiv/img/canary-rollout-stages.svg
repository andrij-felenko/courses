<text x="480.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">• Перевищення порогу помилок (SLO) на будь-якій фазі негайно зупиняє розгортання для решти парку.</tspan><tspan x="480.0" dy="13.5">• Пристрої з поточної когорти повертаються на стабільний Bank A через апаратний Watchdog або команду бекенду.</tspan><tspan x="480.0" dy="13.5">• Парк переходить у безпечний заморожений стан: аналіз телеметрії збоїв без ризику заблокувати всі 1000 вузлів.</tspan></text>
