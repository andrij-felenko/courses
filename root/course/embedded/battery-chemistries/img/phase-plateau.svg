<rect x="30.0" y="340.0" width="760.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="410.0" y="358.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Напруга за Нернстом залежить від складу фази: плавна зміна → похила крива; стала (рух межі) → пласке плато.</tspan></text>
