<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Енергетичні втрати й струми в суб-250г: 1S-2S проти 4S (при P = 120 Вт)</text>
<rect x="50.0" y="54.0" width="370.0" height="340.0" rx="6" fill="#fff8f8" stroke="#c0392b" stroke-width="1.8"/>
<text x="235.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ТОПОЛОГІЯ 1S / 2S (НИЗЬКА НАПРУГА)</text>
<rect x="66.0" y="96.0" width="338.0" height="54.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="80.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Напруга живлення V_bat:</text>
<text x="390.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">3.7 В – 7.4 В</text>
<text x="80.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Струм при 120 Вт (висіння/маневр):</text>
<text x="390.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">16.2 А – 32.4 А</text>
<rect x="66.0" y="160.0" width="338.0" height="130.0" rx="4" fill="#fdeeee" stroke="#c0392b" stroke-width="1.2"/>
<text x="235.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ОМІЧНІ ВТРАТИ (I² · R):</text>
<text x="76.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Падіння на роз'ємі BT2.0/XT30 (15 мОм):</text>
<text x="394.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">ΔV ≈ 0.48 В</text>
<text x="76.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Теплові втрати на ключах ESC (R_ds=5мОм):</text>
<text x="394.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">P_loss ≈ 5.25 Вт</text>
<text x="76.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Просадка шини живлення 5V BEC:</text>
<text x="394.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">Критична (ризик brownout)</text>
<text x="76.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Потрібний дріт AWG18 (важкий джгут)</text>
<rect x="66.0" y="302.0" width="338.0" height="74.0" rx="4" fill="#ffffff" stroke="#e0a04a" stroke-width="1.2"/>
<text x="235.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b06f1e" text-anchor="middle" font-weight="700">НАСЛІДОК ДЛЯ ПРОЄКТУВАННЯ:</text>
<text x="235.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Вимагає моторів &gt; 10000 KV для 1S,</text>
<text x="235.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">товстих силових доріжок і низького ESR.</text>
<rect x="460.0" y="54.0" width="370.0" height="340.0" rx="6" fill="#f8fdf9" stroke="#059669" stroke-width="1.8"/>
<text x="645.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">ТОПОЛОГІЯ 4S (ВИСОКА НАПРУГА)</text>
<rect x="476.0" y="96.0" width="338.0" height="54.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="490.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Напруга живлення V_bat:</text>
<text x="800.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">14.8 В – 16.8 В</text>
<text x="490.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Струм при 120 Вт (висіння/маневр):</text>
<text x="800.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#059669" text-anchor="end" font-weight="700">7.1 А – 8.1 А</text>
<rect x="476.0" y="160.0" width="338.0" height="130.0" rx="4" fill="#e8f8f0" stroke="#059669" stroke-width="1.2"/>
<text x="645.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">ОМІЧНІ ВТРАТИ (I² · R):</text>
<text x="486.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Падіння на роз'ємі XT30 (15 мОм):</text>
<text x="804.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="end" font-weight="700">ΔV ≈ 0.12 В (у 4 рази менше)</text>
<text x="486.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Теплові втрати на ключах ESC (R_ds=5мОм):</text>
<text x="804.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="end" font-weight="700">P_loss ≈ 0.33 Вт (у 16 разів менше)</text>
<text x="486.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Просадка шини живлення 5V BEC:</text>
<text x="804.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="end" font-weight="700">Мінімальна (стабільні 5 В)</text>
<text x="486.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Достатній тонкий дріт AWG22 (економія 6 г)</text>
<rect x="476.0" y="302.0" width="338.0" height="74.0" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
<text x="645.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">НАСЛІДОК ДЛЯ ПРОЄКТУВАННЯ:</text>
<text x="645.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Мотори 2750–3800 KV, вищий ККД силового тракту,</text>
<text x="645.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">стабільне керування на всьому розряді.</text>
</svg>