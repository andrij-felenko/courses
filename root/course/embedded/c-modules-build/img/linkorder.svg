<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Статична бібліотека: порядок аргументів вирішує все</text>
<text x="410.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f8a6d" text-anchor="middle" font-weight="700">ПРАВИЛЬНО:  gcc  main.o  libsensor.a</text>
<rect x="60.0" y="88.9" width="180.0" height="38.1" rx="6" fill="#f3edfb" stroke="#8a5cc7" stroke-width="1.5"/><text x="150.0" y="104.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a5cc7" text-anchor="middle"><tspan x="150.0" dy="0.0">main.o</tspan><tspan x="150.0" dy="13.7">потребує sensor_read</tspan></text>
<rect x="395.0" y="88.9" width="190.0" height="38.1" rx="6" fill="#e9f7f2" stroke="#0f8a6d" stroke-width="1.5"/><text x="490.0" y="104.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f8a6d" text-anchor="middle"><tspan x="490.0" dy="0.0">libsensor.a</tspan><tspan x="490.0" dy="13.7">(архів .o-модулів)</tspan></text>
<line x1="245.0" y1="108.0" x2="388.0" y2="108.0" stroke="#0f8a6d" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="685.0" y="96.8" width="90.0" height="22.5" rx="6" fill="#e9f7f2" stroke="#0f8a6d" stroke-width="1.5"/><text x="730.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f8a6d" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">✓ знайдено</tspan></text>
<line x1="590.0" y1="108.0" x2="678.0" y2="108.0" stroke="#0f8a6d" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f8a6d" text-anchor="middle" font-style="italic">дірка ще відкрита → тягнемо з архіву потрібний модуль</text>
<line x1="60.0" y1="188.0" x2="760.0" y2="188.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="410.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НЕПРАВИЛЬНО:  gcc  libsensor.a  main.o</text>
<rect x="60.0" y="248.9" width="180.0" height="38.1" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="150.0" y="264.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="150.0" dy="0.0">libsensor.a</tspan><tspan x="150.0" dy="13.7">дірок ЩЕ нема</tspan></text>
<rect x="385.0" y="248.9" width="210.0" height="38.1" rx="6" fill="#f3edfb" stroke="#8a5cc7" stroke-width="1.5"/><text x="490.0" y="264.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a5cc7" text-anchor="middle"><tspan x="490.0" dy="0.0">main.o</tspan><tspan x="490.0" dy="13.7">аж тепер просить sensor_read</tspan></text>
<line x1="245.0" y1="268.0" x2="378.0" y2="268.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="670.0" y="249.9" width="120.0" height="36.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="264.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">✗ undefined</tspan><tspan x="730.0" dy="13.7">reference</tspan></text>
<line x1="600.0" y1="268.0" x2="668.0" y2="268.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">бібліотеку вже минули — коли по неї дійшла потреба, брати вже нема звідки</text>
<text x="410.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">лінкер іде списком ЗЛІВА НАПРАВО і бере з .a лише те, що на цю мить бракує</text>
</svg>