<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три шари збірки: опис → команди → інструменти</text>
<rect x="180.0" y="36.2" width="360.0" height="47.6" rx="6" fill="#e9f7f2" stroke="#0f8a6d" stroke-width="1.5"/><text x="360.0" y="56.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f8a6d" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">CMakeLists.txt  →  CMake</tspan><tspan x="360.0" dy="15.6">описуємо проєкт, а не команди</tspan></text>
<text x="360.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">«збери програму app з main.c, led.c, uart.c»</text>
<rect x="180.0" y="131.2" width="360.0" height="47.6" rx="6" fill="#f3edfb" stroke="#8a5cc7" stroke-width="1.5"/><text x="360.0" y="151.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5cc7" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Make / Ninja</tspan><tspan x="360.0" dy="15.6">конкретні команди збірки + залежності</tspan></text>
<line x1="360.0" y1="118.0" x2="360.0" y2="132.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180.0" y="226.2" width="360.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">компілятор  +  лінкувальник</tspan><tspan x="360.0" dy="15.6">gcc … -c   ·   gcc … -o app</tspan></text>
<line x1="360.0" y1="178.0" x2="360.0" y2="227.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="628.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">переносимо</text>
<text x="628.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">робить діло</text>
