<text x="530.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Результат: лавиноподібне закорочування VDD на GND</text>
<text x="530.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Струм зростає до сотень мА / амперів -&gt; термічне вигоряння</text>
