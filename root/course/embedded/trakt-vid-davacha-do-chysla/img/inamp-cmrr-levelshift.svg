<text x="410.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Синфазна напруга 2.5 В повністю віднімається, а різниця ±10 мВ підсилюється і центрується в діапазоні АЦП 0..3.3 В.</text>
