<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ергономіка однорукого хвату (Thumb Zone) та розміри польових кнопок</text>
<rect x="40.0" y="50.0" width="420.0" height="420.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="250.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Карта зон екрана при хваті однією рукою</text>
<rect x="80.0" y="95.0" width="340.0" height="355.0" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="2.0"/>
<rect x="95.0" y="110.0" width="310.0" height="325.0" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.0"/>
<rect x="100.0" y="115.0" width="300.0" height="100.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
<text x="250.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Заборонена зона (Hard-to-Reach Zone)</text>
<text x="250.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Статична телеметрія, статус-бар, системні індикатори.</text>
<text x="250.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Ніяких інтерактивних або критичних кнопок!</text>
<rect x="100.0" y="222.0" width="300.0" height="88.0" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
<text x="250.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">Зона розтягування (Stretch Zone)</text>
<text x="250.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="middle">Вторинні налаштування, перемикання вкладок, списки.</text>
<text x="250.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="middle">Потребує невеликого напруження кисті.</text>
<rect x="100.0" y="318.0" width="300.0" height="110.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="250.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700">Природна зона (Natural Thumb Zone)</text>
<text x="250.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Головні органи: Arm/Disarm, зміна режиму, спуск, скидання.</text>
<text x="250.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700">Швидкий доступ без зміни хвату і без ризику впустити пристрій.</text>
<text x="250.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">Критичні дії — тільки з утриманням (Hold-to-Confirm)!</text>
<rect x="490.0" y="50.0" width="450.0" height="420.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="715.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Розміри активних зон та захисні інтервали</text>
<rect x="515.0" y="105.0" width="400.0" height="145.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="715.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Офісний / Мобільний стандарт (7–8 мм)</text>
<rect x="540.0" y="145.0" width="80.0" height="50.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="580.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">7 мм</text>
<rect x="630.0" y="145.0" width="80.0" height="50.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="670.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">7 мм</text>
<circle cx="625.0" cy="170.0" r="24.0" fill="none" stroke="#dc2626" stroke-width="2.0"/>
<text x="800.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Пляма рукавиці (18–20 мм)</text>
<text x="800.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Перекриває 2 кнопки разом!</text>
<text x="715.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Результат: випадкове вмикання сусідніх функцій при тремтінні.</text>
<rect x="515.0" y="265.0" width="400.0" height="190.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="715.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Польовий тактильний стандарт (14–16 мм + зазор)</text>
<rect x="540.0" y="310.0" width="140.0" height="65.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="610.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Кнопка 15 мм</text>
<text x="610.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">(90×65 px)</text>
<rect x="685.0" y="325.0" width="30.0" height="35.0" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.0"/>
<text x="700.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="700">4 мм</text>
<rect x="720.0" y="310.0" width="140.0" height="65.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="790.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Кнопка 15 мм</text>
<text x="790.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">(90×65 px)</text>
<text x="715.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Мертва зона 3–5 мм запобігає одночасному спрацьовуванню.</text>
<text x="715.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">Закон Фіттса: збільшення площі компенсує тремор 2–5 Гц.</text>
<text x="715.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Чіткі контрастні рамки та колірна зміна при натисканні.</text>
</svg>