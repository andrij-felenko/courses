<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптичне склеювання (Optical Bonding) проти повітряного проміжку (Air Gap)</text>
<rect x="30.0" y="50.0" width="445.0" height="410.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="252.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Повітряний проміжок (Air Gap)</text>
<text x="252.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Сумарне відбиття сонця: 12–15 % (екран вимивається)</text>
<rect x="50.0" y="115.0" width="405.0" height="40.0" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
<text x="252.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Захисне скло (Cover Glass, n = 1.52)</text>
<rect x="50.0" y="165.0" width="405.0" height="50.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="252.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Повітряний проміжок (Air Gap, n = 1.00)</text>
<text x="252.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Стрибок n: 1.52 → 1.00 → 1.50 (відбиття Френеля на обох межах)</text>
<rect x="50.0" y="225.0" width="405.0" height="35.0" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/>
<text x="252.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Поляризатор + сенсорна сітка (n = 1.50)</text>
<rect x="50.0" y="270.0" width="405.0" height="45.0" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
<text x="252.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Рідкокристалічна матриця (TFT Cell, n = 1.52)</text>
<rect x="50.0" y="325.0" width="405.0" height="35.0" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
<text x="252.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">Підсвічування дисплея (350–500 nit)</text>
<rect x="50.0" y="375.0" width="405.0" height="70.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="252.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Результат під сонцем 100 000 lx:</text>
<text x="252.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Відбитий блік ~4000 nit перекриває корисні 400 nit.</text>
<text x="252.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="700">Контраст CR ≈ 1.1:1 — суцільне біле дзеркало.</text>
<rect x="505.0" y="50.0" width="445.0" height="410.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="727.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Оптичне склеювання (Optical Bonding)</text>
<text x="727.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Сумарне відбиття сонця: &lt;0.5–1 % (чисте зображення)</text>
<rect x="525.0" y="115.0" width="405.0" height="40.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="727.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Скло з покриттям AR + AG (n = 1.52)</text>
<text x="727.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">Антивідблиск + матове мікротравлення</text>
<rect x="525.0" y="165.0" width="405.0" height="50.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="727.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Оптичний клей LOCA / OCA (n = 1.51)</text>
<text x="727.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Ідеальне узгодження n: немає меж розділу зі стрибком коефіцієнта</text>
<rect x="525.0" y="225.0" width="405.0" height="35.0" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/>
<text x="727.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Поляризатор + сенсорна сітка (n = 1.50)</text>
<rect x="525.0" y="270.0" width="405.0" height="45.0" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
<text x="727.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Рідкокристалічна матриця (TFT Cell, n = 1.52)</text>
<rect x="525.0" y="325.0" width="405.0" height="35.0" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
<text x="727.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">Підсвічування High-Brightness (&gt;1000–1500 nit)</text>
<rect x="525.0" y="375.0" width="405.0" height="70.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.2"/>
<text x="727.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат під сонцем 100 000 lx:</text>
<text x="727.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Паразитний блік &lt;250 nit, корисний сигнал 1200 nit.</text>
<text x="727.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">Контраст CR &gt; 6:1 — телеметрію видно бездоганно.</text>
</svg>