<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="40.0" width="780.0" height="80.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="40.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень 3: Декларативна черга цілей (Goal Queue Engine, 1–5 Гц)</text>
<text x="40.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Черга кроків місії: Waypoint(X,Y) → WaitTrigger → InspectArea. Контроль таймаутів і критеріїв.</text>
<rect x="20.0" y="145.0" width="780.0" height="100.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="40.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="start" font-weight="700">Рівень 2: Диспетчер подій та Ієрархічний автомат (Event Dispatcher + HSM, 20–50 Гц)</text>
<text x="40.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Обробка черги подій (Run-to-Completion), перевірка guard-умов, перемикання режимів.</text>
<text x="40.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Передає цільові уставки на нижній контур; приймає події датчиків і завершення дій.</text>
<rect x="20.0" y="270.0" width="780.0" height="75.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="40.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Рівень 1: Швидкі контури стабілізації та оцінки (100–1000 Гц)</text>
<text x="40.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ПІД-регулятори моторів, орієнтація за IMU, фільтрація давачів, апаратний захист.</text>
<rect x="20.0" y="365.0" width="780.0" height="50.0" rx="8" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="40.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b21a8" text-anchor="start" font-weight="700">Рівень 0: Апаратні переривання (ISR) та DMA — драйвери шин SPI, I2C, UART, таймери ШІМ</text>
<line x1="240.0" y1="120.0" x2="240.0" y2="143.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">активація цілі</text>
<line x1="580.0" y1="145.0" x2="580.0" y2="122.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="590.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">ціль досягнуто / збій</text>
<line x1="240.0" y1="247.0" x2="240.0" y2="268.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">уставки (v, ω, pitch)</text>
<line x1="580.0" y1="270.0" x2="580.0" y2="247.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="590.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">події оцінки</text>
<line x1="410.0" y1="365.0" x2="410.0" y2="347.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">сирі відліки давачів</text>
</svg>