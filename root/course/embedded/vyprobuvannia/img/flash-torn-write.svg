<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка Flash під час раптового обриву живлення: прямий запис проти журналу</text>
<rect x="25.0" y="20.0" width="350.0" height="390.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="200.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний прямий запис у сектор</text>
<rect x="78.0" y="76.3" width="244.0" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="200.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">1. Стерти сектор Flash (4 КБ)</tspan><tspan x="200.0" dy="14.3">[усі байти = 0xFF, триває ~40-200 мс]</tspan></text>
<rect x="87.4" y="151.3" width="225.2" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="200.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">2. Програмування сторінки...</tspan><tspan x="200.0" dy="14.3">[тунелювання електронів у комірки]</tspan></text>
<rect x="45.0" y="220.0" width="310.0" height="80.0" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="2.0"/>
<text x="200.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">⚡ ОБРИВ ЖИВЛЕННЯ (V_DD &lt; 2.7 В)</text>
<text x="200.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Неповний заряд у плаваючих затворах</text>
<text x="200.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">Метастабільний біт · Torn Write · Битий сектор</text>
<rect x="74.9" y="341.4" width="250.3" height="37.3" rx="6" fill="#fce4ec" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Наслідок: втрата старих і нових даних,</tspan><tspan x="200.0" dy="14.3">файлова система не монтується (panic)</tspan></text>
<rect x="395.0" y="20.0" width="345.0" height="390.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="560.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Атомарний журнал (WAL) + CRC32</text>
<rect x="469.4" y="76.3" width="181.3" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Сектор A (Активний стан)</tspan><tspan x="560.0" dy="14.3">[валідний стан N, CRC32 OK]</tspan></text>
<rect x="431.7" y="151.3" width="256.5" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="560.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Запис нового запису в кінець логу</tspan><tspan x="560.0" dy="14.3">[Header | Payload | CRC32 | CommitFlag]</tspan></text>
<rect x="410.0" y="220.0" width="315.0" height="80.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.0"/>
<text x="560.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">⚡ ОБРИВ ЖИВЛЕННЯ ПІД ЧАС ЗАПИСУ</text>
<text x="560.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Хвіст не має валідного CRC32 або CommitFlag</text>
<text x="560.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Відновлення відкидає лише неповний хвіст</text>
<rect x="425.5" y="341.4" width="269.1" height="37.3" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Наслідок: гарантований відкат до стану N,</tspan><tspan x="560.0" dy="14.3">нуль битих секторів, безпечний старт</tspan></text>
</svg>