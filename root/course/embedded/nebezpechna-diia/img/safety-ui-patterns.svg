<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння інтерфейсних патернів критичних операцій</text>
<rect x="20.0" y="60.0" width="195.0" height="390.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="117.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Модальне OK / Cancel</text>
<rect x="62.5" y="96.0" width="110.0" height="22.0" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="117.5" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">НЕБЕЗПЕЧНО</text>
<text x="117.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="117.5" dy="0.0">Класичне діалогове вікно.</tspan><tspan x="117.5" dy="14.2">Викликає звикання (habituation)</tspan><tspan x="117.5" dy="14.2">та автоматичний рефлекс кліку.</tspan></text>
<line x1="30.0" y1="190.0" x2="205.0" y2="190.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3 3"/>
<rect x="35.0" y="205.0" width="165.0" height="80.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="117.5" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Disarm Motors?</text>
<rect x="45.0" y="245.0" width="60.0" height="26.0" rx="3" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="75.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">OK</text>
<rect x="115.0" y="245.0" width="65.0" height="26.0" rx="3" fill="#e0e0e0" stroke="#ccc" stroke-width="1.5"/>
<text x="147.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Cancel</text>
<line x1="127.5" y1="295.0" x2="75.0" y2="273.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="117.5" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Автоматичний клік!</text>
<text x="34.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Дія:</text>
<text x="34.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Клік на «Disarm»</text>
<text x="34.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Бар'єр:</text>
<text x="34.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Вікно: «Підтвердити?»</text>
<text x="34.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Помилка:</text>
<text x="34.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">М'язова пам'ять тисне OK</text>
<text x="34.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Результат:</text>
<text x="34.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Аварія при стресі</text>
<rect x="230.0" y="60.0" width="195.0" height="390.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="327.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Дві дії (Arm-then-Fire)</text>
<rect x="272.5" y="96.0" width="110.0" height="22.0" rx="4" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="327.5" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">НАДІЙНО</text>
<text x="327.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="327.5" dy="0.0">Розділення у просторі й часі:</tspan><tspan x="327.5" dy="14.2">тумблер зведення (Arm) +</tspan><tspan x="327.5" dy="14.2">окрема кнопка спуску (Fire).</tspan></text>
<line x1="240.0" y1="190.0" x2="415.0" y2="190.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3 3"/>
<rect x="245.0" y="205.0" width="165.0" height="80.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<rect x="255.0" y="217.0" width="65.0" height="26.0" rx="3" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="287.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">1. ARM [On]</text>
<line x1="323.0" y1="230.0" x2="333.0" y2="255.0" stroke="#27ae60" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="335.0" y="247.0" width="60.0" height="26.0" rx="3" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="365.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">2. FIRE</text>
<text x="327.5" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Вікно зведення: 5.0 с</text>
<text x="244.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 1:</text>
<text x="244.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Підйом ковпачка / тумблер</text>
<text x="244.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 2:</text>
<text x="244.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Таймер зведення (5..10 с)</text>
<text x="244.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 3:</text>
<text x="244.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Натискання кнопки спуску</text>
<text x="244.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Скидання:</text>
<text x="244.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Авто-скид при бездіяльності</text>
<rect x="440.0" y="60.0" width="195.0" height="390.0" rx="8" fill="#f5f8ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="537.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Затискання (Hold 3s)</text>
<rect x="482.5" y="96.0" width="110.0" height="22.0" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="537.5" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">ДЛЯ ЕКРАНІВ</text>
<text x="537.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="537.5" dy="0.0">Неперервне утримання 3 с.</tspan><tspan x="537.5" dy="14.2">Круговий прогрес, цокання.</tspan><tspan x="537.5" dy="14.2">Відпускання — миттєвий скид.</tspan></text>
<line x1="450.0" y1="190.0" x2="625.0" y2="190.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3 3"/>
<rect x="455.0" y="205.0" width="165.0" height="80.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<circle cx="537.5" cy="243.0" r="26.0" fill="#eef3fc" stroke="#d0dbee" stroke-width="3.0"/>
<circle cx="537.5" cy="243.0" r="26.0" fill="none" stroke="#2457d6" stroke-width="3.5"/>
<text x="537.5" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2.1 s</text>
<text x="537.5" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Утримуйте 3.0 с...</text>
<text x="454.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Дія:</text>
<text x="454.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Натиснути й утримувати</text>
<text x="454.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Зворотний зв'язок:</text>
<text x="454.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Анімація заповнення кола</text>
<text x="454.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Скидання:</text>
<text x="454.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Відрив пальця = abort</text>
<text x="454.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Результат:</text>
<text x="454.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Випадковий дотик виключено</text>
<rect x="650.0" y="60.0" width="195.0" height="390.0" rx="8" fill="#fffbf5" stroke="#d35400" stroke-width="1.5"/>
<text x="747.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Свайп (Slide-to-Confirm)</text>
<rect x="692.5" y="96.0" width="110.0" height="22.0" rx="4" fill="#d35400" stroke="#d35400" stroke-width="1.0"/>
<text x="747.5" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">ДЛЯ ТАЧПАДІВ</text>
<text x="747.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="747.5" dy="0.0">Проведення повзунка по треку</tspan><tspan x="747.5" dy="14.2">на 70% ширини екрана.</tspan><tspan x="747.5" dy="14.2">Захист від фантомних крапель.</tspan></text>
<line x1="660.0" y1="190.0" x2="835.0" y2="190.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3 3"/>
<rect x="665.0" y="205.0" width="165.0" height="80.0" rx="4" fill="#ffffff" stroke="#d35400" stroke-width="1.2"/>
<rect x="675.0" y="231.0" width="145.0" height="30.0" rx="15" fill="#fbeee6" stroke="#e59866" stroke-width="1.2"/>
<circle cx="692.0" cy="246.0" r="12.0" fill="#d35400" stroke="#d35400" stroke-width="1.5"/>
<line x1="710.0" y1="246.0" x2="780.0" y2="246.0" stroke="#d35400" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="760.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d35400" text-anchor="middle" font-weight="700">Slide &gt;&gt;</text>
<text x="747.5" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Свайп до кінця треку</text>
<text x="664.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Траєкторія:</text>
<text x="664.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Тягнути слайдер управо</text>
<text x="664.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Геометрія:</text>
<text x="664.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Довгий шлях (≥ 200 px)</text>
<text x="664.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Фізика:</text>
<text x="664.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Повернення пружиною назад</text>
<text x="664.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Результат:</text>
<text x="664.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Краплі/вібрація не зсунуть</text>
</svg>