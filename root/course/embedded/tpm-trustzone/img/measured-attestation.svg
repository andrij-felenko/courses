<rect x="50.0" y="250.0" width="700.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="400.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Кожна стадія міряє наступну (хеш → розширення PCR) ПЕРШ ніж дати їй владу. Перевіряч шле одноразове число (nonce) — пристрій повертає знімок PCR, підписаний ключем зсередини. Підпис доводить «це справді ця залізяка», nonce — «відповідь свіжа, не запис старої».</tspan></text>
