<text x="60.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">4 замори → 1 старт; фікс поділено на 4 (амортизація)</text>
<text x="60.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">заряд на корисний замір  =  Q_фікс / N  +  q_замір</text>
<text x="60.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">N ↑  →  частка старту на замір падає як 1/N  →  дно = сам q_замір</text>
<rect x="15.9" y="384.8" width="738.2" height="30.5" rx="6" fill="#fdf0ef" stroke="#c0392b" stroke-width="1.5"/><text x="385.0" y="403.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Батчинг не прибирає дорогий старт — він ділить його на N замірів; платня — свіжість (заміри лежать до спільної передачі)</tspan></text>
