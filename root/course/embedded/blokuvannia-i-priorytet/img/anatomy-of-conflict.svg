<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія конфлікту правил та арбітраж</text>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія конфлікту правил: конкуренція за спільний актуатор (Actuator Contention)</text>
<rect x="30.0" y="65.0" width="230.0" height="140.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="145.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Правило 1: Якість повітря</text>
<text x="145.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Давач: CO2 = 1450 ppm (&gt; 1000)</text>
<rect x="45.0" y="125.0" width="200.0" height="65.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="145.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ЦІЛЬОВА КОМАНДА:</text>
<text x="145.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Відкрити заслінку на 100%</text>
<text x="145.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Пріоритет: Комфорт / Автоматика)</text>
<rect x="30.0" y="235.0" width="230.0" height="140.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="145.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Правило 2: Захист калорифера</text>
<text x="145.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Давач: T_води = +3 °C (&lt; +5 °C)</text>
<rect x="45.0" y="295.0" width="200.0" height="65.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="145.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ЦІЛЬОВА КОМАНДА:</text>
<text x="145.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Закрити заслінку на 0%</text>
<text x="145.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Пріоритет: Захист обладнання)</text>
<rect x="310.0" y="110.0" width="240.0" height="210.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="430.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a6d1a" text-anchor="middle" font-weight="700">ПРІОРИТЕТНИЙ АРБІТР</text>
<text x="430.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Actuator Arbiter / Resolver</text>
<rect x="325.0" y="170.0" width="210.0" height="75.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.0"/>
<text x="430.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оцінка правил та обмежень:</text>
<text x="430.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Protection (L1) &gt; Comfort (L3)</text>
<text x="430.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Селектор найгіршого випадку: Min()</text>
<rect x="325.0" y="255.0" width="210.0" height="50.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="430.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Результуюча уставка:</text>
<text x="430.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПОЗИЦІЯ ЗАСЛІНКИ = 0% (Закрито)</text>
<line x1="264.0" y1="135.0" x2="306.0" y2="180.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="285.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Req: 100%</text>
<line x1="264.0" y1="305.0" x2="306.0" y2="260.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="285.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Req: 0%</text>
<rect x="600.0" y="110.0" width="230.0" height="210.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="715.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ФІЗИЧНИЙ АКТУАТОР</text>
<text x="715.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сервопривід заслінки (0…10 В)</text>
<rect x="615.0" y="172.0" width="200.0" height="60.0" rx="5" fill="#fbecec" stroke="#c0392b" stroke-width="1.0"/>
<text x="715.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">БЕЗ АРБІТРАЖУ:</text>
<text x="715.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Брязкіт реле / розрив калорифера</text>
<text x="715.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Хаотичне смикання приводу</text>
<rect x="615.0" y="242.0" width="200.0" height="65.0" rx="5" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<text x="715.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">З ПРІОРИТЕТНИМ АРБІТРОМ:</text>
<text x="715.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Захист перемагає комфорт</text>
<text x="715.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Труби цілі, подано аварійне сповіщення</text>
<line x1="554.0" y1="215.0" x2="596.0" y2="215.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="575.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Out: 0 V</text>
<rect x="30.0" y="395.0" width="800.0" height="30.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Актуатор не може одночасно виконувати дві протилежні команди. Арбітраж гарантує єдиний детермінований вихід.</text>
