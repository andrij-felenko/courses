<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємні блокування: апаратні та програмні</text>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємні блокування (Mutual Exclusion Interlocks): апаратний та програмний захист</text>
<rect x="30.0" y="55.0" width="385.0" height="330.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="222.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Апаратне блокування (Hardware Interlock)</text>
<text x="222.5" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Фізична неможливість наскрізного замикання (Shoot-Through)</text>
<rect x="45.0" y="113.0" width="355.0" height="80.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="222.5" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Електричне перехресне блокування контактів:</text>
<text x="55.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Котушка KM1 (Вперед) живиться через NC контакт KM2</text>
<text x="55.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Котушка KM2 (Назад) живиться через NC контакт KM1</text>
<text x="55.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• При спрацьовуванні KM1 ланцюг KM2 фізично розірвано</text>
<rect x="45.0" y="203.0" width="355.0" height="80.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="222.5" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Апаратний Dead-Time у драйверах MOSFET/IGBT:</text>
<text x="55.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Драйвер (IR2104 / UCC27211) має вхід Interlock Logic</text>
<text x="55.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Апаратна затримка t_dead (100…500 нс) між плечима</text>
<text x="55.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Блокує наскрізний струм при розрядці затворів</text>
<rect x="45.0" y="293.0" width="355.0" height="75.0" rx="5" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<text x="222.5" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Головна властивість апаратного захисту:</text>
<text x="222.5" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Працює навіть при повному зависанні процесора,</text>
<text x="222.5" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">пробитті прошивки чи помилках конфігурації GPIO.</text>
<rect x="445.0" y="55.0" width="385.0" height="330.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="637.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="700">Програмне блокування (Software Interlock FSM)</text>
<text x="637.5" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Контроль послідовності та часових пауз у мікроконтролері</text>
<rect x="460.0" y="113.0" width="355.0" height="80.0" rx="5" fill="#ffffff" stroke="#caa24a" stroke-width="1.0"/>
<text x="637.5" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">Скінченний автомат реверсу з паузою (Dead-Time):</text>
<text x="470.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">FORWARD → STOP_WAIT (150 мс) → REVERSE</text>
<text x="470.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• Заборона прямого переходу FORWARD ↔ REVERSE</text>
<text x="470.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Гасіння ЕРС самоіндукції та повної зупинки вала</text>
<rect x="460.0" y="203.0" width="355.0" height="80.0" rx="5" fill="#ffffff" stroke="#caa24a" stroke-width="1.0"/>
<text x="637.5" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">Програмні захисні перевірки (Sanity Guards):</text>
<text x="470.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• if (cmd_fwd &amp;&amp; cmd_rev) { force_safe_stop(); }</text>
<text x="470.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Контроль таймауту оренди (Lease TTL Timeout)</text>
<text x="470.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Валідація стану давачів кінцевих положень</text>
<rect x="460.0" y="293.0" width="355.0" height="75.0" rx="5" fill="#fbecec" stroke="#c0392b" stroke-width="1.0"/>
<text x="637.5" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Уразливість суто програмного захисту:</text>
<text x="637.5" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Збій вказівника пам'яті, зависання в перериванні або</text>
<text x="637.5" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">дефект драйвера GPIO вимикає програмні перевірки!</text>
<rect x="30.0" y="395.0" width="800.0" height="30.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило надійності: програмне блокування організує плавні процеси, апаратне — рятує залізо від фізичного вибуху.</text>
</svg>