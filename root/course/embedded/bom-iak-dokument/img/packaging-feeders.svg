<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фабричне пакування компонентів для монтажу Pick &amp; Place</text>
<rect x="30.0" y="65.0" width="250.0" height="250.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="155.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Tape &amp; Reel (Стрічка в котушці)</text>
<line x1="40.0" y1="101.0" x2="270.0" y2="101.0" stroke="#16a34a" stroke-width="1.0"/>
<text x="42.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Стандарт промислового монтажу (SMT)</text>
<text x="42.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Має лідер (30-50 см порожньої стрічки)</text>
<text x="42.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Автоматична безперервна подача у фідер</text>
<text x="42.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Відсутній ризик перевертання деталей</text>
<rect x="50.0" y="271.0" width="210.0" height="28.0" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
<text x="155.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700">ІДЕАЛЬНО ДЛЯ СЕРІЇ</text>
<rect x="306.0" y="65.0" width="250.0" height="250.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="431.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Cut Tape (Обрізок стрічки)</text>
<line x1="316.0" y1="101.0" x2="546.0" y2="101.0" stroke="#dc2626" stroke-width="1.0"/>
<text x="318.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Немає лідера для заправки у фідер</text>
<text x="318.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Перші 5-15 деталей втрачаються (scrap)</text>
<text x="318.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Потребує наклеювання лідера вручну</text>
<text x="318.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Ризик заклинювання живильника</text>
<rect x="326.0" y="271.0" width="210.0" height="28.0" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
<text x="431.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-weight="700">ПРОБЛЕМА ДЛЯ АВТОМАТА</text>
<rect x="582.0" y="65.0" width="250.0" height="250.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="707.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Tray / Tube (Піддон / Пенал)</text>
<line x1="592.0" y1="101.0" x2="822.0" y2="101.0" stroke="#d97706" stroke-width="1.0"/>
<text x="594.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Використовується для QFP, BGA, роз'ємів</text>
<text x="594.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Потребує спеціального фідер-трею</text>
<text x="594.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Менша швидкість захоплення соплом</text>
<text x="594.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Чутливі до вібрації під час подачі</text>
<rect x="602.0" y="271.0" width="210.0" height="28.0" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="707.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">ДЛЯ ВЕЛИКИХ ІС ТА THT</text>
</svg>