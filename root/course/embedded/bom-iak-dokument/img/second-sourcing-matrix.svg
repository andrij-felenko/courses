<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця заміни компонентів (Second Sourcing &amp; AVL)</text>
<rect x="30.0" y="60.0" width="385.0" height="290.0" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="30.0" y="60.0" width="385.0" height="36.0" rx="8" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.0"/>
<text x="222.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Пасивні компоненти (Резистори / Конденсатори)</text>
<text x="45.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="start" font-weight="700">Резистори 1% 0603:</text>
<text x="50.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Будь-який постачальник з AVL (Yageo, Vishay, Panasonic)</text>
<text x="50.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Критерії: Footprint = 0603, P ≥ 100mW, Tol ≤ 1%, TCR ≤ 100ppm</text>
<text x="45.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="start" font-weight="700">Керамічні конденсатори MLCC:</text>
<text x="50.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• ТІЛЬКИ з однаковим діелектриком (X7R ≥ X5R &gt; Y5V заборонено)</text>
<text x="50.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Робоча напруга: V_rated ≥ V_original (запас на DC-bias)</text>
<text x="50.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Не змінювати 0603 на 0402 без перевірки падіння ємності!</text>
<text x="45.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="start" font-weight="700">Індуктивності / Дроселі:</text>
<text x="50.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Обов'язкова звірка струму насичення I_sat та опору DCR</text>
<rect x="445.0" y="60.0" width="385.0" height="290.0" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/>
<rect x="445.0" y="60.0" width="385.0" height="36.0" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="1.0"/>
<text x="637.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Активні мікросхеми (ІС / МК / Драйвери)</text>
<text x="460.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start" font-weight="700">Рівень 1: Drop-in Pin-to-Pin:</text>
<text x="465.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Повний електричний і програмний клон</text>
<text x="465.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Приклад: лінійні стабілізатори 1117-3.3, пам'ять W25Q128</text>
<text x="460.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start" font-weight="700">Рівень 2: Pin-compatible (інша обв'язка):</text>
<text x="465.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Однаковий корпус і цоколівка, але інша V_ref чи f_sw</text>
<text x="465.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Вимагає зміни номіналів резисторів зворотного зв'язку</text>
<text x="460.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start" font-weight="700">Рівень 3: Сумісний функціонал, інший футпрінт:</text>
<text x="465.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Вимагає комбінованого посадкового місця на PCB (Dual Footprint)</text>
<text x="465.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Приклад: SOIC-8 поверх WSON-8 для Flash-пам'яті</text>
<text x="460.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start" font-weight="700">Рівень 4: Архітектурна заміна (інший чіп):</text>
<text x="465.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Вимагає перерозведення плати (Rev B) та модифікації прошивки</text>
</svg>