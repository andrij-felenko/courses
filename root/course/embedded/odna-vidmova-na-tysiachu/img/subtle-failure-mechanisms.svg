<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична природа дефектів «однієї відмови на тисячу»</text>
<rect x="30.0" y="55.0" width="265.0" height="360.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="162.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">А. DC-Bias та п'єзоефект MLCC</text>
<line x1="40.0" y1="91.0" x2="285.0" y2="91.0" stroke="#2563eb" stroke-width="1.0"/>
<text x="42.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">Зміна постачальника пасивів (AVL)</text>
<line x1="45.0" y1="127.0" x2="280.0" y2="127.0" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="42.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Номінал: 10 мкФ 0805 X7R</text>
<text x="42.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Постачальник A: 6.5 мкФ при 3.3 В</text>
<text x="42.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Постачальник B: 1.8 мкФ при 3.3 В</text>
<text x="42.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">  (просідання ємності на 82%!)</text>
<line x1="45.0" y1="211.0" x2="280.0" y2="211.0" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="42.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">Наслідок у полі:</text>
<text x="42.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">Провал напруги живлення DC-DC</text>
<text x="42.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">під час стрибка струму радіомодуля,</text>
<text x="42.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">непередбачуваний Brown-out Reset (BOR).</text>
<rect x="310.0" y="55.0" width="265.0" height="360.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="442.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Б. MSL та мікротріщини (Popcorning)</text>
<line x1="320.0" y1="91.0" x2="565.0" y2="91.0" stroke="#d97706" stroke-width="1.0"/>
<text x="322.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">Вологість корпусу перед Reflow</text>
<line x1="325.0" y1="127.0" x2="560.0" y2="127.0" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="322.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Корпус QFN/BGA увібрав вологу</text>
<text x="322.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">  (перевищено Floor Life &gt; 168 год)</text>
<text x="322.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• При 245°C волога вибухає парою,</text>
<text x="322.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">  виникає внутрішнє розшарування</text>
<line x1="325.0" y1="211.0" x2="560.0" y2="211.0" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="322.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">Наслідок у полі:</text>
<text x="322.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">Плата проходить заводський ICT,</text>
<text x="322.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">але через 100 термоциклів зима/літо</text>
<text x="322.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">відривається розварений контакт кристала.</text>
<rect x="585.0" y="55.0" width="265.0" height="360.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="717.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">В. Дендрити та залишки флюсу (ECM)</text>
<line x1="595.0" y1="91.0" x2="840.0" y2="91.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="597.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">Недогрітий No-Clean флюс + волога</text>
<line x1="600.0" y1="127.0" x2="835.0" y2="127.0" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="597.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Неповна активація флюсу в печі</text>
<text x="597.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Залишки кислотних іонних сполук</text>
<text x="597.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Постійна напруга (DC-bias) на шині</text>
<text x="597.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Електрохімічна міграція іонів міді</text>
<line x1="600.0" y1="211.0" x2="835.0" y2="211.0" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="597.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">Наслідок у полі:</text>
<text x="597.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">Ростуть струмопровідні мікронитки,</text>
<text x="597.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">опір ізоляції падає зі 100 МОм до</text>
<text x="597.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">50 кОм: фантомні натискання й витік струму.</text>
</svg>