<text x="45.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Логи напруг живлення, опорних джерел VREF, споживання струму</text>
