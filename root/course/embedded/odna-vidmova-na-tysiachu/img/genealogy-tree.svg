<text x="440.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Польовий відсів (RMA Return): симптом збою + серійний номер</text>
<text x="440.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle">За серійним номером розгортається повний стек історії виготовлення для кореляційного аналізу</text>
