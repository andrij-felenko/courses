<text x="460.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">  параметрів в єдиний цифровий профіль виробу (Digital Passport)</text>
<line x1="440.0" y1="396.0" x2="440.0" y2="416.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
