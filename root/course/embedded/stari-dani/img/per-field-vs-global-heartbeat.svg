<text x="55.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">UART завис: старі координати!</text>
<rect x="45.0" y="242.0" width="220.0" height="56.0" rx="5" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.2"/>
<text x="55.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Барометр / Висотомір</text>
<text x="55.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">SPI шина: OK (50 Гц)</text>
<rect x="45.0" y="308.0" width="220.0" height="56.0" rx="5" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.2"/>
<text x="55.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Серцебиття (Heartbeat)</text>
<text x="55.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Цикл FreeRTOS: OK (1 Гц)</text>
