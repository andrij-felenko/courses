<text x="540.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#9ca3af" text-anchor="end" font-weight="700">120.4 м</text>
<text x="340.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="start">ШВИДКІСТЬ:</text>
<text x="540.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#9ca3af" text-anchor="end" font-weight="700">22.1 м/с</text>
<text x="340.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="start">БАТАРЕЯ:</text>
<text x="540.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#9ca3af" text-anchor="end" font-weight="700">86 %</text>
