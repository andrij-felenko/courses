<text x="180.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b5e20" text-anchor="middle"><tspan x="180.0" dy="0.0">Гарантовані всі параметри:</tspan><tspan x="180.0" dy="13.2">• Швидкість і таймінги</tspan><tspan x="180.0" dy="13.2">• Рівні напруг V_OH/V_OL</tspan><tspan x="180.0" dy="13.2">• Струм споживання</tspan></text>
