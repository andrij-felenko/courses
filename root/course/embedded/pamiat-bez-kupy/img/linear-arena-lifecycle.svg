<line x1="600.0" y1="303.0" x2="600.0" y2="321.0" stroke="#b45309" stroke-width="2.0"/>
<text x="600.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">upper_offset</text>
<rect x="79.2" y="372.4" width="681.5" height="45.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Головний інваріант: Нуль індивідуальних викликів free() -&gt; Нуль витоків пам'яті (Memory Leaks).</tspan><tspan x="420.0" dy="14.3">Повна локальність кешу даних L1, детермінований час O(1) і відсутність метаданих на кожен об'єкт.</tspan></text>
