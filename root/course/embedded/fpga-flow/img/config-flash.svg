<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Летка SRAM-тканина бере бітстрім із зовнішньої флеші</text>
<rect x="70.0" y="110.0" width="150.0" height="84.0" rx="6" fill="#fdf6e3" stroke="#b9770e" stroke-width="2.0"/>
<text x="145.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700">флеш-пам'ять</text>
<text x="145.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">нелетка,</tspan><tspan x="145.0" dy="13.0">тримає бітстрім</tspan></text>
<line x1="220.0" y1="152.0" x2="310.0" y2="152.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="265.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">при старті</text>
<text x="265.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">configuration</text>
<rect x="310.0" y="102.0" width="200.0" height="100.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="410.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">FPGA на SRAM</text>
<text x="410.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">летка: без живлення</tspan><tspan x="410.0" dy="13.0">схема зникає →</tspan><tspan x="410.0" dy="13.0">стартує порожньою</tspan></text>
<text x="350.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">при кожному ввімкненні чип завантажує себе з флеші за частки секунди</text>
