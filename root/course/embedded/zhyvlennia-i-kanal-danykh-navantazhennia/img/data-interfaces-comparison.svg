<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="280.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="36.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">UART та RS-422</tspan><tspan x="160.0" dy="15.6">Низька швидкість, довгі лінії</tspan></text>
<rect x="320.0" y="20.0" width="300.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="36.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">USB 2.0 проти USB 3.0</tspan><tspan x="470.0" dy="15.6">Пастка інтерференції з GNSS L1</tspan></text>
<rect x="640.0" y="20.0" width="280.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="36.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Single-Pair Ethernet (100BASE-T1)</tspan><tspan x="780.0" dy="15.6">Високошвидкісний відеопотік</tspan></text>
<rect x="20.0" y="75.0" width="280.0" height="365.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="35.0" y="90.0" width="250.0" height="80.0" rx="6" fill="#fbf2ef" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Single-Ended UART (3.3V):</tspan><tspan x="160.0" dy="14.3">• Довжина: &lt; 20–30 см</tspan><tspan x="160.0" dy="14.3">• Чутливий до шуму dV/dt</tspan><tspan x="160.0" dy="14.3">• Для внутрішньоплатних зв'язків</tspan></text>
<rect x="35.0" y="185.0" width="250.0" height="110.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="208.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Диференційний RS-422 / RS-485:</tspan><tspan x="160.0" dy="14.3">• Довжина: до 50–100 метрів</tspan><tspan x="160.0" dy="14.3">• Лінії TX+/TX-, RX+/RX- (вита пара)</tspan><tspan x="160.0" dy="14.3">• Швидкість: 1–10 Мбод</tspan><tspan x="160.0" dy="14.3">• Придушення синфазної завади</tspan><tspan x="160.0" dy="14.3">• Для виносних антен і підвісів</tspan></text>
<rect x="35.0" y="310.0" width="250.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Застосування в дронах:</tspan><tspan x="160.0" dy="14.3">• Передача команд MAVLink v2</tspan><tspan x="160.0" dy="14.3">• Керування сервопідвісом</tspan><tspan x="160.0" dy="14.3">• Отримання телеметрії сенсорів</tspan><tspan x="160.0" dy="14.3">• Захист від перешкод моторів</tspan></text>
<rect x="320.0" y="75.0" width="300.0" height="365.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<rect x="335.0" y="90.0" width="270.0" height="75.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="109.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">USB 2.0 High-Speed (480 Мбіт/с):</tspan><tspan x="470.0" dy="14.3">• Диференційний імпеданс: 90 Ом</tspan><tspan x="470.0" dy="14.3">• Спектр сигналу зосереджений &lt; 500 МГц</tspan><tspan x="470.0" dy="14.3">• Безпечний для GPS-приймачів</tspan></text>
<rect x="335.0" y="175.0" width="270.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="200.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">USB 3.0 SuperSpeed (5 Гбіт/с):</tspan><tspan x="470.0" dy="14.3">• Spread Spectrum Clocking (SSC)</tspan><tspan x="470.0" dy="14.3">• Широкосмуговий шум у смузі 1.2–1.6 ГГц</tspan><tspan x="470.0" dy="14.3">• Рівень випромінювання: -110..-120 dBm</tspan><tspan x="470.0" dy="14.3">• Чутливість GPS L1: -160 dBm</tspan><tspan x="470.0" dy="14.3">• Результат: Втрата 3D GPS-фіксації!</tspan></text>
<rect x="335.0" y="300.0" width="270.0" height="120.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="339.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Методи ліквідації EMI:</tspan><tspan x="470.0" dy="11.7">• Подвійний екран кабелю (STP, 360° GND)</tspan><tspan x="470.0" dy="11.7">• Віддалення USB-кабелю від антени GPS &gt; 15 см</tspan><tspan x="470.0" dy="11.7">• Феритові фільтри на обох кінцях</tspan><tspan x="470.0" dy="11.7">• Металеві екрануючі кожухи портів</tspan></text>
<rect x="640.0" y="75.0" width="280.0" height="365.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<rect x="655.0" y="90.0" width="250.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Автомобільний Ethernet (100BASE-T1):</tspan><tspan x="780.0" dy="13.0">• BroadR-Reach / IEEE 802.3bw</tspan><tspan x="780.0" dy="13.0">• 100 Мбіт/с по 1 витій парі (2 дроти)</tspan><tspan x="780.0" dy="13.0">• Вага проводки в 4 рази менша за RJ-45</tspan><tspan x="780.0" dy="13.0">• Повнодуплексна ехокомпенсація</tspan></text>
<rect x="655.0" y="195.0" width="250.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="217.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Стандартний Ethernet (1000BASE-T):</tspan><tspan x="780.0" dy="14.3">• 1 Гбіт/с для важких потоків даних</tspan><tspan x="780.0" dy="14.3">• Промислові роз'єми JST-GH / Molex</tspan><tspan x="780.0" dy="14.3">• Трансформаторна розв'язка 1.5 кВ</tspan><tspan x="780.0" dy="14.3">• Передача Raw point clouds LiDAR</tspan></text>
<rect x="655.0" y="300.0" width="250.0" height="120.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="335.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Застосування:</tspan><tspan x="780.0" dy="14.3">• Стримінг 4K H.264/H.265 RTSP відео</tspan><tspan x="780.0" dy="14.3">• Передача даних 3D LiDAR на Jetson</tspan><tspan x="780.0" dy="14.3">• Машинний зір та SLAM-навігація</tspan><tspan x="780.0" dy="14.3">• Нульовий вплив на радіоканали</tspan></text>
</svg>