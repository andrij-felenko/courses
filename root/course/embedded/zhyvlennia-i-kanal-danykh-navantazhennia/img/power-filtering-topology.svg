<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="260.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="36.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Силова шина батареї (4S–12S)</tspan><tspan x="150.0" dy="16.9">Комутаційний шум ESC</tspan></text>
<rect x="310.0" y="20.0" width="320.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="36.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Каскад захисту та фільтрації</tspan><tspan x="470.0" dy="16.9">TVS + Демпфований π-фільтр + CMC</tspan></text>
<rect x="660.0" y="20.0" width="260.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="36.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Стабілізація та навантаження</tspan><tspan x="790.0" dy="16.9">Dedicated BEC + LDO + Сенсор</tspan></text>
<rect x="20.0" y="80.0" width="260.0" height="360.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<rect x="24.7" y="86.2" width="250.6" height="47.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">LiPo Батарея 14.8–50.4 В</tspan><tspan x="150.0" dy="15.6">(Низький внутрішній опір R_int)</tspan></text>
<rect x="35.0" y="160.0" width="230.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="182.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Комутація MOSFET ESC:</tspan><tspan x="150.0" dy="14.3">• dI/dt &gt; 100 А/мкс при 24–48 кГц</tspan><tspan x="150.0" dy="14.3">• Індуктивні голки: ΔV = L·(dI/dt)</tspan><tspan x="150.0" dy="14.3">• Амплітуда сплесків до 60–80 В</tspan></text>
<rect x="35.0" y="260.0" width="230.0" height="80.0" rx="6" fill="#fbf2ef" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Паразитна індуктивність джгутів:</tspan><tspan x="150.0" dy="14.3">• L_wire ≈ 1 нГн/мм (~200 нГн)</tspan><tspan x="150.0" dy="14.3">• Спільний імпеданс шини</tspan><tspan x="150.0" dy="14.3">• Зворотна ЕРС моторів</tspan></text>
<rect x="41.1" y="357.4" width="217.8" height="45.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Пульсації на шині: 1–3 В p-p</tspan><tspan x="150.0" dy="14.3">Високочастотний дзвін &gt;10 МГц</tspan></text>
<line x1="280.0" y1="220.0" x2="310.0" y2="220.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="310.0" y="80.0" width="320.0" height="360.0" rx="6" fill="#f6f9fe" stroke="#2457d6" stroke-width="1.5"/>
<rect x="325.0" y="100.0" width="290.0" height="65.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">1. Захист від перенапруги (TVS):</tspan><tspan x="470.0" dy="14.3">• Діод SMBJ33A / SMAJ40CA</tspan><tspan x="470.0" dy="14.3">• Зрізання гострих викидів &gt; 33–40 В</tspan></text>
<rect x="325.0" y="180.0" width="290.0" height="85.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="197.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Демпфований LC π-фільтр:</tspan><tspan x="470.0" dy="14.3">• C_in: 2×10 мкФ X7R (кераміка)</tspan><tspan x="470.0" dy="14.3">• L_choke: 10–22 мкГн (низький DCR)</tspan><tspan x="470.0" dy="14.3">• R_damp + C_damp (гасіння резонансу)</tspan><tspan x="470.0" dy="14.3">• f_c = 1 / (2π√(LC)) ≈ 2–5 кГц</tspan></text>
<rect x="325.0" y="280.0" width="290.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="299.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">3. Синфазний дросель (CMC):</tspan><tspan x="470.0" dy="14.3">• Придушення синфазних завад</tspan><tspan x="470.0" dy="14.3">• Захист вимірювальних трактів</tspan><tspan x="470.0" dy="14.3">• C_bulk: Полімер 220 мкФ Low-ESR</tspan></text>
<rect x="364.5" y="372.4" width="211.0" height="45.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Придушення шуму ESC: &gt; 45 дБ</tspan><tspan x="470.0" dy="14.3">Амплітуда залишку: &lt; 20 мВ</tspan></text>
<line x1="630.0" y1="220.0" x2="660.0" y2="220.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="660.0" y="80.0" width="260.0" height="360.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<rect x="675.0" y="100.0" width="230.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="117.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Dedicated Buck BEC (12V / 5A):</tspan><tspan x="790.0" dy="14.3">• Синхронне випрямлення</tspan><tspan x="790.0" dy="14.3">• Живлення моторів підвісу</tspan><tspan x="790.0" dy="14.3">• ККД &gt; 92%, високий запас</tspan></text>
<rect x="675.0" y="185.0" width="230.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Ultra-Low-Noise LDO (5V / 3.3V):</tspan><tspan x="790.0" dy="14.3">• PSRR &gt; 65 дБ на 100 кГц</tspan><tspan x="790.0" dy="14.3">• Живлення матриці камери й АЦП</tspan><tspan x="790.0" dy="14.3">• Залишковий шум &lt; 5 мкВ RMS</tspan></text>
<rect x="675.0" y="270.0" width="230.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="290.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Корисне навантаження:</tspan><tspan x="790.0" dy="14.3">• Камера 4K / Тепловізор</tspan><tspan x="790.0" dy="14.3">• 3-осьовий підвіс (Gimbal)</tspan><tspan x="790.0" dy="14.3">• LiDAR / Бортовий комп'ютер</tspan><tspan x="790.0" dy="14.3">• Чисте зображення без смуг</tspan></text>
<rect x="687.9" y="372.4" width="204.1" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Чиста шина: Ripple &lt; 3 мВ</tspan><tspan x="790.0" dy="14.3">Відсутність артефактів смуг</tspan></text>
</svg>