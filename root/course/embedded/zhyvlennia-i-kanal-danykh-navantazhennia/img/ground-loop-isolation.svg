<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="435.0" height="400.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<rect x="37.6" y="28.5" width="398.8" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="237.0" y="49.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="237.0" dy="0.0">Неізольована схема: Земляна петля (Ground Loop)</tspan></text>
<rect x="35.0" y="75.0" width="180.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="125.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">Батарея &amp; ESC</tspan><tspan x="125.0" dy="14.3">Струм мотора:</tspan><tspan x="125.0" dy="14.3">I_ESC = 40–100 А</tspan></text>
<rect x="260.0" y="75.0" width="180.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Польотний контролер (FC)</tspan><tspan x="350.0" dy="14.3">Сигнал UART 3.3V LVCMOS</tspan><tspan x="350.0" dy="14.3">V_IL(max) = 0.8 В</tspan></text>
<rect x="35.0" y="175.0" width="180.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="125.0" y="195.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Опір силової землі:</tspan><tspan x="125.0" dy="11.7">R_gnd = 10–15 мОм</tspan><tspan x="125.0" dy="11.7">Падіння напруги:</tspan><tspan x="125.0" dy="11.7">ΔV = I_ESC · R_gnd = 0.6–1.2 В</tspan></text>
<rect x="260.0" y="175.0" width="180.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="350.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Камера / Сенсор</tspan><tspan x="350.0" dy="13.0">Земля зміщена на +ΔV</tspan><tspan x="350.0" dy="13.0">Помилки розпізнавання бітів</tspan><tspan x="350.0" dy="13.0">Зрив синхронізації UART</tspan></text>
<line x1="125.0" y1="135.0" x2="125.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="350.0" y1="135.0" x2="350.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="215.0" y1="210.0" x2="260.0" y2="210.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,3"/>
<line x1="260.0" y1="105.0" x2="215.0" y2="105.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="237.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Зрівнювальний струм через екран</text>
<rect x="35.0" y="275.0" width="405.0" height="125.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="237.5" y="317.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="237.5" dy="0.0">Наслідки для апарата:</tspan><tspan x="237.5" dy="11.7">• Силовий струм мотора затікає в сигнальний екран UART/USB</tspan><tspan x="237.5" dy="11.7">• Зсув опорного рівня землі сенсора перевищує поріг логічного нуля (0.8 В)</tspan><tspan x="237.5" dy="11.7">• Поява шумів на АЦП, збої передачі MAVLink, нагрів сигнальних проводів</tspan><tspan x="237.5" dy="11.7">• Небезпека вигорання вхідних каскадів мікроконтролера</tspan></text>
<rect x="485.0" y="20.0" width="435.0" height="400.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<rect x="502.6" y="28.5" width="398.8" height="33.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="702.0" y="49.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="702.0" dy="0.0">Гальванічна розв'язка: Повний захист від петель</tspan></text>
<rect x="500.0" y="75.0" width="180.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Силова земля дрона (GND)</tspan><tspan x="590.0" dy="14.3">Польотний контролер</tspan><tspan x="590.0" dy="14.3">Шумні кола ESC &amp; Motor</tspan></text>
<rect x="725.0" y="75.0" width="180.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Ізольована земля (GND_ISO)</tspan><tspan x="815.0" dy="13.0">Камера, Підвіс, Радіоканал</tspan><tspan x="815.0" dy="13.0">Чутливі аналогові сенсори</tspan></text>
<line x1="692.0" y1="145.0" x2="692.0" y2="270.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6,4"/>
<text x="692.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Ізоляційний бар'єр 1.5–3 кВ</text>
<rect x="500.0" y="160.0" width="175.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="587.5" y="175.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="587.5" dy="0.0">Ізольований DC-DC:</tspan><tspan x="587.5" dy="13.0">Трансформаторна розв'язка</tspan><tspan x="587.5" dy="13.0">(Flyback / Push-Pull)</tspan></text>
<line x1="675.0" y1="185.0" x2="725.0" y2="185.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="500.0" y="220.0" width="175.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="587.5" y="236.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="587.5" dy="0.0">Цифровий ізолятор:</tspan><tspan x="587.5" dy="11.7">TI ISO7741 / ADuM1400</tspan><tspan x="587.5" dy="11.7">Ємнісна / Магнітна розв'язка</tspan></text>
<line x1="675.0" y1="245.0" x2="725.0" y2="245.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="500.0" y="285.0" width="405.0" height="115.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="702.5" y="322.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="702.5" dy="0.0">Переваги архітектури:</tspan><tspan x="702.5" dy="11.7">• Повна відсутність провідного шляху для силового струму ESC</tspan><tspan x="702.5" dy="11.7">• Висока стійкість до синфазних перешкод: CMTI &gt; 100 кВ/мкс</tspan><tspan x="702.5" dy="11.7">• Затримка поширення сигналів &lt; 11 нс, швидкість до 150 Мбіт/с</tspan><tspan x="702.5" dy="11.7">• Безпечне підключення сервісного USB та відсутність зсуву потенціалів</tspan></text>
</svg>