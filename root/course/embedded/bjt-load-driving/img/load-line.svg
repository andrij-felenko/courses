<rect x="110.0" y="420.0" width="560.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="390.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Ключ ЖИВЕ у двох кінцях лінії: насичення (ліворуч, холодно) або відсічка (праворуч, холодно).</tspan><tspan x="390.0" dy="13.0">Провал посередині — активний режим: і Vce, і Ic великі → добуток великий → грійка.</tspan></text>
