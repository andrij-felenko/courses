<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурний розподіл: модуль SoM та плата-носій</text>
<text x="470.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Фізичний та програмний поділ між обчислювальним модулем (SoM) і платою-носієм</text>
<rect x="40.0" y="80.0" width="360.0" height="390.0" rx="8" fill="#fdf6f5" stroke="#c0392b" stroke-width="2.0"/>
<text x="220.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Обчислювальний модуль (SoM / CM4)</text>
<text x="220.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Високощільна плата: 6–10 шарів HDI</text>
<rect x="60.0" y="145.0" width="150.0" height="60.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">MPU / SoC</tspan><tspan x="135.0" dy="15.6">Cortex-A / 64-bit</tspan></text>
<rect x="230.0" y="145.0" width="150.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">LPDDR4 RAM</tspan><tspan x="305.0" dy="15.6">1–8 ГБ, 32-bit bus</tspan></text>
<rect x="60.0" y="220.0" width="150.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">eMMC / Flash</tspan><tspan x="135.0" dy="15.6">8–64 ГБ пам'ять</tspan></text>
<rect x="230.0" y="220.0" width="150.0" height="60.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">PMIC живлення</tspan><tspan x="305.0" dy="11.7">0.8В, 1.1В, 1.8В, 3.3В</tspan></text>
<rect x="60.0" y="295.0" width="320.0" height="75.0" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.0"/>
<text x="220.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Критична трасування швидкісних шин</tspan><tspan x="220.0" dy="13.5">Вирівнювання довжин DDR4 (±0.1 мм)</tspan><tspan x="220.0" dy="13.5">Послідовність живлення (Power Sequencing)</tspan></text>
<rect x="60.0" y="385.0" width="320.0" height="65.0" rx="6" fill="#fbebe8" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="414.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Опис у Linux: soc.dtsi + som.dtsi</tspan><tspan x="220.0" dy="14.3">(ядро, контролери шин, пам'ять eMMC, PMIC)</tspan></text>
<rect x="540.0" y="80.0" width="360.0" height="390.0" rx="8" fill="#f2f7f4" stroke="#27ae60" stroke-width="2.0"/>
<text x="720.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Плата-носій (Carrier Board)</text>
<text x="720.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Цільова плата: 2–4 шари, 6/6 mil</text>
<rect x="560.0" y="145.0" width="150.0" height="60.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="635.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">Живлення 9–36 В</tspan><tspan x="635.0" dy="13.0">DC-DC Buck → 5В/3.3В</tspan></text>
<rect x="730.0" y="145.0" width="150.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Ethernet MagJack</tspan><tspan x="805.0" dy="15.6">+ RS-485 / CAN PHY</tspan></text>
<rect x="560.0" y="220.0" width="150.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">I2C RTC + EEPROM</tspan><tspan x="635.0" dy="14.3">Датчики температури</tspan></text>
<rect x="730.0" y="220.0" width="150.0" height="60.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Роз'єми I/O</tspan><tspan x="805.0" dy="14.3">USB, клемники, реле</tspan></text>
<rect x="560.0" y="295.0" width="320.0" height="75.0" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.0"/>
<text x="720.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Низька вартість виготовлення плати</tspan><tspan x="720.0" dy="13.5">Змінні формфактори під корпус приладу</tspan><tspan x="720.0" dy="13.5">Захист інтерфейсів (TVS, ізоляція)</tspan></text>
<rect x="560.0" y="385.0" width="320.0" height="65.0" rx="6" fill="#e5f2ea" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="414.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Опис у Linux: carrier-board.dts</tspan><tspan x="720.0" dy="13.0">(ввімкнення I2C/SPI, пінмукс, адреси датчиків)</tspan></text>
<line x1="400.0" y1="230.0" x2="420.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="270.0" x2="520.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="420.0" y="215.0" width="100.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">B2B роз'єм</tspan><tspan x="470.0" dy="13.0">100–260 pin</tspan><tspan x="470.0" dy="13.0">Hirose / M.2</tspan></text>
</svg>