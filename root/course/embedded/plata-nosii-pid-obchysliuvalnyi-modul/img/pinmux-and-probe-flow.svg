<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрутизація властивостей DTS: пінмукс і зв'язування драйвера</text>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Механізм зв'язування: вузол DTS → налаштування pinctrl → виклик probe() драйвера</text>
<rect x="60.0" y="70.0" width="720.0" height="110.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="240.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол пристрою у файлі carrier-board.dts</text>
<rect x="80.0" y="102.0" width="680.0" height="66.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="420.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">&amp;i2c1 { status = &quot;okay&quot;; pinctrl-0 = &lt;&amp;i2c1_pins&gt;;</tspan><tspan x="420.0" dy="14.9">  temp_sensor: sensor@48 { compatible = &quot;ti,tmp102&quot;; reg = &lt;0x48&gt;; };</tspan><tspan x="420.0" dy="14.9">};</tspan></text>
<line x1="210.0" y1="180.0" x2="210.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">pinctrl phandle</text>
<line x1="580.0" y1="180.0" x2="580.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="595.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">compatible + reg</text>
<rect x="60.0" y="230.0" width="340.0" height="200.0" rx="6" fill="#fef8f6" stroke="#c0392b" stroke-width="1.5"/>
<text x="230.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Підсистема pinctrl / pinmux</text>
<rect x="80.0" y="272.0" width="300.0" height="48.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">1. Читання групи пінів</tspan><tspan x="230.0" dy="13.0">GPIO2 (SDA), GPIO3 (SCL)</tspan></text>
<rect x="80.0" y="328.0" width="300.0" height="48.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">2. Запис у регістри SoC</tspan><tspan x="230.0" dy="13.0">ALT0 (I2C функція) + Pull-up</tspan></text>
<rect x="80.0" y="384.0" width="300.0" height="36.0" rx="6" fill="#fbebe8" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="405.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Фізичні виводи B2B підключені до шини</tspan></text>
<rect x="440.0" y="230.0" width="340.0" height="200.0" rx="6" fill="#f2f7f4" stroke="#27ae60" stroke-width="1.5"/>
<text x="610.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Підсистема I2C та Driver Core</text>
<rect x="460.0" y="272.0" width="300.0" height="48.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">1. Створення клієнта I2C</tspan><tspan x="610.0" dy="13.0">Адреса 0x48 на шині /dev/i2c-1</tspan></text>
<rect x="460.0" y="328.0" width="300.0" height="48.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">2. Зіставлення of_match_table</tspan><tspan x="610.0" dy="13.0">Рядок &quot;ti,tmp102&quot; знаходить tmp102.c</tspan></text>
<rect x="460.0" y="384.0" width="300.0" height="36.0" rx="6" fill="#e5f2ea" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="405.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Виклик probe() → поява /sys/class/hwmon/</tspan></text>
</svg>