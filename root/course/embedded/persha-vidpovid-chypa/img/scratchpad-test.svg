<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тест Scratchpad: перевірка повнодуплексного обміну</text>
<text x="410.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">чому WHO_AM_I доводить лише читання, а тестовий запис підтверджує обидва напрямки</text>
