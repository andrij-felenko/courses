<text x="410.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тест інверсним патерном 0xAA (0b10101010) гарантує відсутність залипання кожного окремого біта!</text>
