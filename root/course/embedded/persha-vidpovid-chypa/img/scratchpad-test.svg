<rect x="310.0" y="172.0" width="200.0" height="36.0" rx="4" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.2"/>
<text x="410.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Запис MOSI: 0x55</text>
