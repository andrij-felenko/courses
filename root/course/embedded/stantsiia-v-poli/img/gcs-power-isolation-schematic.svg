<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Енергопостачання, гальванічна розв'язка та захист від завад польової GCS</text>
<rect x="25.0" y="55.0" width="210.0" height="375.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="130.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Силове живлення</text>
<rect x="35.0" y="95.0" width="190.0" height="60.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="130.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">LiFePO4 Батарея 4S/8S</tspan><tspan x="130.0" dy="12.3">(12.8V / 25.6V 60–100Ah)</tspan><tspan x="130.0" dy="12.3">Робота від -20°C до +60°C</tspan></text>
<rect x="35.0" y="165.0" width="190.0" height="50.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="130.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">BMS з захистом</tspan><tspan x="130.0" dy="12.3">(Струм розряду до 50A,</tspan><tspan x="130.0" dy="12.3">балансування комірок)</tspan></text>
<rect x="35.0" y="225.0" width="190.0" height="55.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="243.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Плавкий запобіжник</tspan><tspan x="130.0" dy="12.3">(Fuse 30A) +</tspan><tspan x="130.0" dy="12.3">Захист переполюсовки</tspan></text>
<rect x="35.0" y="290.0" width="190.0" height="60.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="130.0" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Вхід резервного ДВЗ</tspan><tspan x="130.0" dy="11.7">або автогенератора</tspan><tspan x="130.0" dy="11.7">(Шунт + TVS діод 1500W)</tspan></text>
<rect x="35.0" y="360.0" width="190.0" height="55.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="130.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Штир заземлення №1</tspan><tspan x="130.0" dy="11.7">(Заземлення мінуса батареї</tspan><tspan x="130.0" dy="11.7">в одній зірковій точці)</tspan></text>
<line x1="235.0" y1="125.0" x2="275.0" y2="125.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="275.0" y="55.0" width="380.0" height="375.0" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
<text x="465.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">Блок ізоляції та розподілу (GCS Power Hub)</text>
<rect x="290.0" y="95.0" width="350.0" height="72.0" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
<text x="300.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0369a1" text-anchor="start" font-weight="700">Канал А: Ноутбук / Планшет (19V / 12V Type-C PD)</text>
<text x="300.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">DC-DC Synchronous Buck-Boost (90W, ККД 96%)</text>
<text x="300.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">Фільтр синфазних завад (Common Mode Choke) на виході</text>
<rect x="290.0" y="175.0" width="350.0" height="72.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="300.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="start" font-weight="700">Канал Б: Щогла та Радіомодуль (48V PoE Injector)</text>
<text x="300.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Гальванічно ізольований DC-DC 12V -&gt; 48V (1500V Isolation)</text>
<text x="300.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Розриває земляну петлю між щоглою та укриттям!</text>
<rect x="290.0" y="255.0" width="350.0" height="75.0" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1.2"/>
<text x="300.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a16207" text-anchor="start" font-weight="700">Канал В: Сигнальні інтерфейси (RS-232 / RS-485 / USB)</text>
<text x="300.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Цифрові ізолятори (ADuM1401 / ISO7741 / Оптопари)</text>
<text x="300.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">TVS-діодні збірки на лініях даних (Захист від ESD до 15 kV)</text>
<rect x="290.0" y="340.0" width="350.0" height="75.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="465.0" y="368.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">Мережевий бар'єр Ethernet:</tspan><tspan x="465.0" dy="12.3">Трансформаторна розв'язка 100/1000Base-T (1500 Vrms)</tspan><tspan x="465.0" dy="12.3">+ Газорозрядники GDT на екранованій крученій парі STP</tspan></text>
<line x1="655.0" y1="130.0" x2="695.0" y2="130.0" stroke="#0369a1" stroke-width="2.0" marker-end="url(#arrow)"/>
