<rect x="695.0" y="55.0" width="260.0" height="375.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="825.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Польові споживачі</text>
<rect x="705.0" y="95.0" width="240.0" height="65.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/><text x="825.0" y="112.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Робоче місце оператора</tspan><tspan x="825.0" dy="12.3">Ноутбук / Планшет</tspan><tspan x="825.0" dy="12.3">(Чисте живлення без наведень</tspan><tspan x="825.0" dy="12.3">від генераторів)</tspan></text>
<rect x="705.0" y="175.0" width="240.0" height="70.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="825.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Виносний блок щогли</tspan><tspan x="825.0" dy="12.3">(Masthead Box / Радіомодуль)</tspan><tspan x="825.0" dy="12.3">Живлення 48V PoE по STP кабелю</tspan><tspan x="825.0" dy="12.3">без падіння напруги</tspan></text>
<rect x="705.0" y="260.0" width="240.0" height="75.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="825.0" y="282.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Антенний трекер</tspan><tspan x="825.0" dy="12.3">Сервоприводи Pan/Tilt</tspan><tspan x="825.0" dy="12.3">(Окремий ізольований DC-DC</tspan><tspan x="825.0" dy="12.3">для відсікання імпульсних завад)</tspan></text>
<rect x="705.0" y="345.0" width="240.0" height="70.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="825.0" y="371.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Штир заземлення №2</tspan><tspan x="825.0" dy="11.7">(Заземлення щогли на місці монтажу;</tspan><tspan x="825.0" dy="11.7">завдяки розв'язці немає струмів у петлі)</tspan></text>
