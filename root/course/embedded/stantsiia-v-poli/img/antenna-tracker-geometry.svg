<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторна геометрія наведення антенного трекера</text>
<rect x="30.0" y="60.0" width="470.0" height="375.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="265.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Просторова схема наведення</text>
<line x1="50.0" y1="360.0" x2="470.0" y2="360.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="460.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Горизонт</text>
<line x1="90.0" y1="360.0" x2="420.0" y2="360.0" stroke="#2563eb" stroke-width="2.0"/>
<line x1="420.0" y1="360.0" x2="420.0" y2="160.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="90.0" y1="360.0" x2="420.0" y2="160.0" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="90.0" cy="360.0" r="7.0" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.0"/>
<text x="90.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">Трекер (GCS)</text>
<text x="90.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(lat₁, lon₁, alt₁)</text>
<circle cx="420.0" cy="160.0" r="7.0" fill="#c0392b" stroke="#b91c1c" stroke-width="2.0"/>
<text x="420.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Борт (UAV)</text>
<text x="420.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(lat₂, lon₂, alt₂)</text>
<text x="250.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">Горизонтальна відстань (d_ground)</text>
<text x="430.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Різниця висот (Δh)</text>
<text x="220.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700">Прямий промінь (d_slant)</text>
<path d="M 140 360 A 50 50 0 0 0 134 326" fill="none" stroke="#d97706" stroke-width="2"/>
<text x="155.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="700">Кут місця (El)</text>
<rect x="520.0" y="60.0" width="390.0" height="375.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="715.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математичний апарат розрахунку</text>
<rect x="535.0" y="105.0" width="360.0" height="95.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="550.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="start" font-weight="700">1. Розрахунок Азимуту (Bearing / Az):</text>
<text x="550.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">y = sin(Δlon) · cos(lat₂)</text>
<text x="550.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">x = cos(lat₁) · sin(lat₂) - sin(lat₁) · cos(lat₂) · cos(Δlon)</text>
<text x="550.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="start" font-weight="700">Az = atan2(y, x)  [0° .. 360° від True North]</text>
<rect x="535.0" y="210.0" width="360.0" height="95.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
<text x="550.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="start" font-weight="700">2. Розрахунок Елевації (Elevation / El):</text>
<text x="550.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">d_ground = R_землі · c  (ортодромічна дуга)</text>
<text x="550.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Δh_eff = alt₂ - alt₁ - (d_ground² / 2R_землі)</text>
<text x="550.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start" font-weight="700">El = atan2(Δh_eff, d_ground)  [0° .. 90°]</text>
<rect x="535.0" y="315.0" width="360.0" height="105.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="550.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start" font-weight="700">3. Коригування та фільтрація:</text>
<text x="550.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Компенсація власного курсу трекера: Az_cmd = Az - Yaw_base</text>
<text x="550.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Deadband зона: не рухати при зміні кута &lt; 1.5° (антитільпання)</text>
<text x="550.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Обмеження кутової швидкості: Slew-rate limiter (макс. 45°/с)</text>
<text x="550.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Failsafe: утримання напрямку при втраті пакетів &gt; 3.0 с</text>
</svg>