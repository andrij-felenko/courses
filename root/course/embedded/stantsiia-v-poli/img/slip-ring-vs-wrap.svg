<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема скручування кабелів (Cable Wrap) та розв'язання через Slip Ring</text>
<rect x="30.0" y="55.0" width="420.0" height="325.0" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
<text x="240.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Звичайна серво / прямий кабель (Безперервність порушена)</text>
<rect x="45.0" y="100.0" width="390.0" height="60.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="240.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Апарат перетинає лінію 0°/360° (Північ / Задній сектор):</tspan><tspan x="240.0" dy="13.0">Сервопривід доходить до механічного упору 360°</tspan><tspan x="240.0" dy="13.0">і змушений робити зворотний поворот (Unwrap) на -360°</tspan></text>
<rect x="45.0" y="170.0" width="390.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">НАСЛІДОК ДЛЯ ЗВ'ЯЗКУ:</tspan><tspan x="240.0" dy="12.3">• Час розвороту антени: 2.5–4.5 секунди</tspan><tspan x="240.0" dy="12.3">• Повна втрата вузького радіопроменя під час маневру</tspan><tspan x="240.0" dy="12.3">• Зрив відеопотоку та буферів MAVLink у критичний момент</tspan><tspan x="240.0" dy="12.3">• Ризик перетирання та урвища сигнальних жил</tspan></text>
<rect x="45.0" y="255.0" width="390.0" height="110.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="240.0" y="294.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Симптом відмови:</tspan><tspan x="240.0" dy="12.3">Втрата телеметрії щоразу, коли борт робить коло довкола станції</tspan><tspan x="240.0" dy="12.3">або виходить на глісаду посадки над точкою старту.</tspan><tspan x="240.0" dy="12.3">Кабелі дубіють на морозі і зламують роз'єми SMA/Ethernet.</tspan></text>
<rect x="490.0" y="55.0" width="420.0" height="325.0" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="700.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Система з ковзним кільцем (Slip Ring / Rotary Joint)</text>
<rect x="505.0" y="100.0" width="390.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="700.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Нескінченне обертання 360° по осі панорами (Yaw):</tspan><tspan x="700.0" dy="13.0">Статор з'єднаний з нерухомою щоглою,</tspan><tspan x="700.0" dy="13.0">ротор обертається разом з антенною платформою</tspan></text>
<rect x="505.0" y="170.0" width="390.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ПЕРЕВАГИ ДЛЯ ОПЕРАЦІЙНОЇ НАДІЙНОСТІ:</tspan><tspan x="700.0" dy="12.3">• Найкоротший шлях наведення: поворот на мінімальний кут Δθ</tspan><tspan x="700.0" dy="12.3">• Нульова затримка: промінь безперервно утримує ціль</tspan><tspan x="700.0" dy="12.3">• Відсутність механічного натягу та втоми кабелю</tspan><tspan x="700.0" dy="12.3">• Золото-золоті ковзні контакти для Ethernet 100M / RS-485</tspan></text>
<rect x="505.0" y="255.0" width="390.0" height="110.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="700.0" y="295.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Інженерне правило:</tspan><tspan x="700.0" dy="11.7">ВЧ радіомодуль монтується НА роторі поруч з антеною,</tspan><tspan x="700.0" dy="11.7">а через Slip Ring спускаються виключно цифрові шини (Ethernet / RS-485)</tspan><tspan x="700.0" dy="11.7">та живлення DC 12–24V. Це усуває втрати в ВЧ переході.</tspan></text>
</svg>