<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
<rect width="940" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Буфер: посередник між «кволим» джерелом і АЦП</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">операційний підсилювач-повторювач: джерелу показує високий опір, а АЦП — низький</text>
<text x="95.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">високоомне</text>
<text x="95.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">джерело</text>
<circle cx="95.0" cy="185.0" r="18.0" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="95.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">V</text>
<line x1="113.0" y1="185.0" x2="210.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="165.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">майже без струму</text>
<polyline points="210.0,150.0 210.0,220.0 290.0,185.0 210.0,150.0" fill="#eef6ef" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="238.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<text x="252.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ОП</text>
<line x1="290.0" y1="185.0" x2="330.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="330.0" y1="185.0" x2="330.0" y2="240.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="330.0" y1="240.0" x2="225.0" y2="240.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="225.0" y1="240.0" x2="225.0" y2="205.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="300.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">повний зворотний зв'язок (підсилення = 1)</text>
<line x1="330.0" y1="185.0" x2="420.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="375.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">міцний вихід</text>
<rect x="420.0" y="160.0" width="110.0" height="50.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="475.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">АЦП</text>
<rect x="580.0" y="120.0" width="320.0" height="150.0" rx="12" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="740.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Повторювач:</text>
<text x="600.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• вхід — майже нескінченний опір</text>
<text x="615.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(джерело не вантажиться)</text>
<text x="600.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• вихід — малий опір</text>
<text x="615.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(швидко заряджає Cтрим АЦП)</text>
</svg>
