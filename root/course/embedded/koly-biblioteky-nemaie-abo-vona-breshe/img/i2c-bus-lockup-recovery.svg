<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="420.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зависання шини I2C (SDA Lockup) та алгоритм відновлення 9 тактами</text>
<rect x="30.0" y="55.0" width="780.0" height="130.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Причина: Скидання MCU під час читання байта</text>
<text x="50.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. MCU зчитує 8 біт даних від веденого сенсора (Slave).</text>
<text x="50.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Сенсор передає біт '0' і притискає лінію SDA до землі (LOW).</text>
<text x="50.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. У цю мить стається Reset / Watchdog MCU. Тактування SCL припиняється.</text>
<text x="50.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">4. Сенсор лишається чекати наступного такту SCL і вічно тримає SDA=0 (шина заблокована!).</text>
<line x1="420.0" y1="185.0" x2="420.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="210.0" width="780.0" height="190.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="220.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2. Алгоритм апаратного розблокування (Bus Clear)</text>
<text x="50.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Крок 1: Відключити периферію I2C, перевести піни SCL і SDA в режим GPIO Open-Drain.</text>
<text x="50.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Крок 2: Згенерувати до 9 тактових імпульсів на SCL (частота 50-100 кГц).</text>
<text x="50.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Крок 3: Після кожного такту перевіряти стан SDA: щойно SDA відпущено (HIGH) — вихід із циклу.</text>
<text x="50.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Крок 4: Сформувати коректну умову STOP (SCL=HIGH, потім SDA перехід LOW → HIGH).</text>
<text x="50.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Крок 5: Повторно увімкнути та налаштувати апаратний блок I2C мікроконтролера.</text>
<rect x="50.0" y="365.0" width="740.0" height="26.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.0"/>
<text x="420.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: сенсор допередає байт, бачить NACK/STOP і звільняє шину без зняття живлення</text>
</svg>