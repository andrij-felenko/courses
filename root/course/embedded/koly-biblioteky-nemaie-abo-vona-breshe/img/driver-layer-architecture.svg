<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="380.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="40.0" y="20.0" width="500.0" height="55.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="290.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Рівень застосунку (Application Layer)</text>
<text x="290.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Отримує готові фізичні значення (SI: Па, °C, м/с²) без деталей регістрів</text>
<line x1="290.0" y1="75.0" x2="290.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="95.0" width="500.0" height="85.0" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="290.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логіка чипа та автомат станів (Sensor Driver Core)</text>
<text x="290.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Карта регістрів, бітові маски, послідовність ініціалізації</text>
<text x="290.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Неблокуючий FSM, калібрувальні формули, перевірка CRC-8</text>
<line x1="290.0" y1="180.0" x2="290.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="200.0" width="500.0" height="65.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="290.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Транспортний інтерфейс (Bus Interface)</text>
<text x="290.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Контракт I/O: read_reg(dev, reg, buf, len), write_reg(dev, reg, buf, len)</text>
<line x1="165.0" y1="265.0" x2="165.0" y2="290.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="415.0" y1="265.0" x2="415.0" y2="290.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="290.0" width="240.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="160.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Реальне залізо (Target MCU)</text>
<text x="160.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">I2C/SPI HAL, DMA, переривання,</text>
<text x="160.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">апаратні регістри мікроконтролера</text>
<rect x="300.0" y="290.0" width="240.0" height="70.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="420.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Тестове середовище (Host Mock)</text>
<text x="420.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Програмний емулятор шини, ін'єкція</text>
<text x="420.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">помилок шини та збійних відліків</text>
<rect x="560.0" y="20.0" width="250.0" height="340.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="685.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому саме так:</text>
<text x="575.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Нуль залежностей</text>
<text x="575.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Чистий C/C++ без CMSIS чи Arduino</text>
<line x1="575.0" y1="123.0" x2="795.0" y2="123.0" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="575.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Тести на ПК за 1 мс</text>
<text x="575.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Unit-тести всієї математики на хості</text>
<line x1="575.0" y1="188.0" x2="795.0" y2="188.0" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="575.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Легка заміна шини</text>
<text x="575.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Перехід з I2C на SPI без зміни коду</text>
<line x1="575.0" y1="253.0" x2="795.0" y2="253.0" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="575.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Чіткі межі помилок</text>
<text x="575.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Розмежування апаратних і софтових збоїв</text>
<line x1="575.0" y1="318.0" x2="795.0" y2="318.0" stroke="#e5e7eb" stroke-width="1.0"/>
</svg>