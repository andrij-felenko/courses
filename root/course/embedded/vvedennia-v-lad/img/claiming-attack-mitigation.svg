<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія загрози: чому ідентифікатор без доказу володіння веде до захоплення</text>
<rect x="20.0" y="50.0" width="385.0" height="360.0" rx="8" fill="#fdf7f7" stroke="#c0392b" stroke-width="1.8"/>
<text x="212.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ВРАЗЛИВО: Відкрита прив'язка</text>
<text x="212.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Пристрій кричить серійник у відкритий ефір</text>
<rect x="101.6" y="128.5" width="220.9" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="212.0" dy="0.0">1 · Пристрій підняв відкриту точку:</tspan><tspan x="212.0" dy="13.0">«Datchyk-84B2» (UID відкрито в ефірі)</tspan></text>
<rect x="98.7" y="192.0" width="226.6" height="46.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="205.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="212.0" dy="0.0">2 · Зловмисник поруч перехоплює UID</tspan><tspan x="212.0" dy="13.0">і першим шле запит Claiming у Хмару:</tspan><tspan x="212.0" dy="13.0">«Цей серійник мій, ось мій Account_ID»</tspan></text>
<rect x="78.8" y="267.0" width="266.5" height="46.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="212.0" dy="0.0">3 · Хмара прив'язує датчик до чужого акаунта!</tspan><tspan x="212.0" dy="13.0">Справжній власник отримує помилку:</tspan><tspan x="212.0" dy="13.0">«Пристрій уже зареєстровано»</tspan></text>
<rect x="79.9" y="348.5" width="264.2" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="212.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="212.0" dy="0.0">Результат: крадіжка пристрою зловмисником</tspan><tspan x="212.0" dy="13.0">і блокування доступу для покупця</tspan></text>
<rect x="435.0" y="50.0" width="385.0" height="360.0" rx="8" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.8"/>
<text x="627.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ЗАХИЩЕНО: Автентифікація PoP + Челендж</text>
<text x="627.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Фізичний секрет + криптографічний доказ</text>
<rect x="499.5" y="122.0" width="255.1" height="46.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="627.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="627.0" dy="0.0">1 · Власник сканує QR на корпусі:</tspan><tspan x="627.0" dy="13.0">UID + Одноразовий PIN (Proof of Possession)</tspan><tspan x="627.0" dy="13.0">Ефіром летить лише PAKE-рукостискання</tspan></text>
<rect x="499.5" y="192.0" width="255.1" height="46.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="627.0" y="205.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="627.0" dy="0.0">2 · Смартфон шле в Хмару одноразовий Nonce;</tspan><tspan x="627.0" dy="13.0">Хмара видає тимчасовий Claiming-квиток,</tspan><tspan x="627.0" dy="13.0">прив'язаний до токена авторизації власника</tspan></text>
<rect x="493.8" y="267.0" width="266.5" height="46.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="627.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="627.0" dy="0.0">3 · Пристрій підписує Nonce приватним IDevID;</tspan><tspan x="627.0" dy="13.0">Хмара звіряє підпис із заводським Factory CA</tspan><tspan x="627.0" dy="13.0">і передає робочий сертифікат LDevID</tspan></text>
<rect x="482.5" y="348.5" width="289.0" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="627.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="627.0" dy="0.0">Результат: криптографічна гарантія власності,</tspan><tspan x="627.0" dy="13.0">стійкість до прослуховування та підміни</tspan></text>
</svg>