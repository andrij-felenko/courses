<rect x="42.0" y="120.0" width="356.0" height="117.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="220.0" y="160.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">• Привід під напругою (SOS)</tspan><tspan x="220.0" dy="14.3">• Робот нерухомий у робочій зоні</tspan><tspan x="220.0" dy="14.3">• Людина завантажує / знімає деталь</tspan><tspan x="220.0" dy="14.3">• Вихід людини відновлює рух без рестарту</tspan></text>
