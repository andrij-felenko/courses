<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири колаборативні режими безпеки за ISO 10218-1/2 та ISO/TS 15066</text>
