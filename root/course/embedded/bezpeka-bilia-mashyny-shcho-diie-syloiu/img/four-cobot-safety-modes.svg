<line x1="45.0" y1="319.0" x2="395.0" y2="319.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="42.0" y="325.0" width="356.0" height="117.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="220.0" y="365.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">• Лазерні сканери / 3D-камери безпеки</tspan><tspan x="220.0" dy="14.3">• Безперервний розрахунок дистанції S(t)</tspan><tspan x="220.0" dy="14.3">• Наближення людини -&gt; плавне сповільнення</tspan><tspan x="220.0" dy="14.3">• Перетин межі зупинки -&gt; плавний Stop</tspan></text>
