<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоканальна архітектура безпеки (Safety Watchdog &amp; Collision Observer)</text>
<rect x="25.0" y="60.0" width="180.0" height="390.0" rx="6" fill="#f0f4f8" stroke="#2457d6" stroke-width="1.6"/><text x="115.0" y="176.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Сенсорний рівень</tspan><tspan x="115.0" dy="11.7">(Двоканальний вхід)</tspan><tspan x="115.0" dy="11.7"></tspan><tspan x="115.0" dy="11.7">[ Канал A ]</tspan><tspan x="115.0" dy="11.7">• Абсолютний енкодер осей</tspan><tspan x="115.0" dy="11.7">• Датчики фазного струму I_u, I_v</tspan><tspan x="115.0" dy="11.7">• 6-осьовий F/T датчик фланця</tspan><tspan x="115.0" dy="11.7"></tspan><tspan x="115.0" dy="11.7">[ Канал B ]</tspan><tspan x="115.0" dy="11.7">• Інкрементний енкодер / sin-cos</tspan><tspan x="115.0" dy="11.7">• Незалежні шунти струму</tspan><tspan x="115.0" dy="11.7"></tspan><tspan x="115.0" dy="11.7">[ Зовнішні сенсори ]</tspan><tspan x="115.0" dy="11.7">• Safety LiDAR (OSSD1 / OSSD2)</tspan><tspan x="115.0" dy="11.7">• Кнопка E-Stop (2xNC)</tspan></text>
<rect x="235.0" y="60.0" width="260.0" height="185.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="365.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">Основне ядро керування (MCU 1)</tspan><tspan x="365.0" dy="13.0">(Trajectory &amp; Momentum Observer)</tspan><tspan x="365.0" dy="13.0"></tspan><tspan x="365.0" dy="13.0">• Планувальник траєкторії q_cmd(t)</tspan><tspan x="365.0" dy="13.0">• Модель динаміки: M(q), C(q,q̇), g(q)</tspan><tspan x="365.0" dy="13.0">• Спостерігач імпульсу r(t) -&gt; τ_ext</tspan><tspan x="365.0" dy="13.0">• Детекція перевищення сили F_ext &gt; F_max</tspan></text>
<rect x="235.0" y="265.0" width="260.0" height="185.0" rx="6" fill="#fdf9e8" stroke="#d98324" stroke-width="1.6"/><text x="365.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">Безпековий співпроцесор (MCU 2)</tspan><tspan x="365.0" dy="13.0">(Safety Watchdog &amp; Geofencing)</tspan><tspan x="365.0" dy="13.0"></tspan><tspan x="365.0" dy="13.0">• Незалежний розрахунок прямої кінематики</tspan><tspan x="365.0" dy="13.0">• Декартовий геофенсинг (3D Safety Zones)</tspan><tspan x="365.0" dy="13.0">• Контроль швидкості ланок SLS (v &lt; v_max)</tspan><tspan x="365.0" dy="13.0">• Крос-контроль узгодженості (Cross-Check)</tspan></text>
<line x1="340.0" y1="245.0" x2="340.0" y2="265.0" stroke="#d98324" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="390.0" y1="265.0" x2="390.0" y2="245.0" stroke="#d98324" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300.0" y="240.0" width="130.0" height="30.0" rx="6" fill="#ffffff" stroke="#d98324" stroke-width="1.0"/>
<text x="365.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d98324" text-anchor="middle" font-weight="700">Крос-обмін (SPI)</text>
<rect x="525.0" y="60.0" width="290.0" height="390.0" rx="6" fill="#feebe8" stroke="#c0392b" stroke-width="1.8"/><text x="670.0" y="144.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Виконавчий силовий вузол</tspan><tspan x="670.0" dy="14.3">(Dual STO &amp; Gate Drives)</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">[ Канал керування STO 1 ]</tspan><tspan x="670.0" dy="14.3">• Оптоізолятор драйвера верхнього плеча</tspan><tspan x="670.0" dy="14.3">• Заборона тактування IGBT / GaN</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">[ Канал керування STO 2 ]</tspan><tspan x="670.0" dy="14.3">• Оптоізолятор драйвера нижнього плеча</tspan><tspan x="670.0" dy="14.3">• Апаратне блокування ENABLE</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">[ Безпекове реле гальма (SBC) ]</tspan><tspan x="670.0" dy="14.3">• Розрив живлення котушок гальм осей</tspan><tspan x="670.0" dy="14.3">• Примусове затискання при аварії</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">─────► Знеструмлення серводвигунів</tspan><tspan x="670.0" dy="14.3">─────► Активація фрикційних гальм</tspan></text>
