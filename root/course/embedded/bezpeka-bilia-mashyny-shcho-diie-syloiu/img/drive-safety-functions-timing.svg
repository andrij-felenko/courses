<line x1="722.0" y1="405.0" x2="787.0" y2="405.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="677.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Гальмування</text>
