<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння функцій безпечного руху: STO, SS1 та SS2 (IEC 61800-5-2)</text>
<rect x="32.0" y="60.0" width="245.0" height="220.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="154.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Safe Torque Off (STO)</text>
<text x="154.5" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Миттєве зняття моменту</text>
<line x1="44.0" y1="116.0" x2="265.0" y2="116.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="42.0" y="124.0" width="225.0" height="146.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="154.5" y="176.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="154.5" dy="0.0">• Апаратний розрив PWM затворів</tspan><tspan x="154.5" dy="11.7">• Привід знеструмлений миттєво</tspan><tspan x="154.5" dy="11.7">• Ротор рухається за інерцією (coasting)</tspan><tspan x="154.5" dy="11.7">• На вертикальних осях ланка ПАДАЄ!</tspan><tspan x="154.5" dy="11.7">• Категорія зупинки 0 (IEC 60204-1)</tspan></text>
<rect x="297.0" y="60.0" width="245.0" height="220.0" rx="6" fill="#fef9e7" stroke="#d98324" stroke-width="1.8"/>
<text x="419.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d98324" text-anchor="middle" font-weight="700">Safe Stop 1 (SS1)</text>
<text x="419.5" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Контрольоване гальмування + STO</text>
<line x1="309.0" y1="116.0" x2="530.0" y2="116.0" stroke="#d98324" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="307.0" y="124.0" width="225.0" height="146.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="419.5" y="176.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="419.5" dy="0.0">• Активне гальмування двигуном (рампа)</tspan><tspan x="419.5" dy="11.7">• Контроль швидкості під час зупинки</tspan><tspan x="419.5" dy="11.7">• Після v=0 або таймауту -&gt; перехід у STO</tspan><tspan x="419.5" dy="11.7">• Вмикання механічного гальма (SBC)</tspan><tspan x="419.5" dy="11.7">• Категорія зупинки 1 (IEC 60204-1)</tspan></text>
<rect x="562.0" y="60.0" width="245.0" height="220.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="684.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Safe Stop 2 / SOS</text>
<text x="684.5" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Зупинка з утриманням позиції</text>
<line x1="574.0" y1="116.0" x2="795.0" y2="116.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="572.0" y="124.0" width="225.0" height="146.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="684.5" y="176.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="684.5" dy="0.0">• Активне гальмування за рампою</tspan><tspan x="684.5" dy="11.7">• Двигун залишається під струмом (SOS)</tspan><tspan x="684.5" dy="11.7">• Замкнений контур тримає позицію x=const</tspan><tspan x="684.5" dy="11.7">• Дозволяє миттєвий рестарт руху</tspan><tspan x="684.5" dy="11.7">• Категорія зупинки 2 (IEC 60204-1)</tspan></text>
