<line x1="317.0" y1="345.0" x2="367.0" y2="345.0" stroke="#d98324" stroke-width="2.0"/>
<line x1="367.0" y1="345.0" x2="467.0" y2="405.0" stroke="#d98324" stroke-width="2.5"/>
