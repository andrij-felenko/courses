<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Допуск у ppm розсуває несні: канал треба ширший</text>
<text x="120.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Ідеал:</text>
<text x="120.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">обидва точно на f₀</text>
<line x1="150.0" y1="110.0" x2="690.0" y2="110.0" stroke="#6b7280" stroke-width="1.1"/>
<line x1="380.0" y1="114.0" x2="380.0" y2="80.0" stroke="#27ae60" stroke-width="2.4"/>
<polygon points="375.0,80.0 385.0,80.0 380.0,70.0" fill="#27ae60"/>
<text x="380.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">f₀ передавача = f₀ приймача</text>
<text x="120.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Реальність:</text>
<text x="120.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">кожен зі своїм ppm</text>
<line x1="150.0" y1="240.0" x2="690.0" y2="240.0" stroke="#6b7280" stroke-width="1.1"/>
<line x1="450.0" y1="244.0" x2="450.0" y2="210.0" stroke="#c0392b" stroke-width="2.4"/>
<polygon points="445.0,210.0 455.0,210.0 450.0,200.0" fill="#c0392b"/>
<text x="450.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">передавач +Δ</text>
<line x1="310.0" y1="244.0" x2="310.0" y2="210.0" stroke="#2457d6" stroke-width="2.4"/>
<polygon points="305.0,210.0 315.0,210.0 310.0,200.0" fill="#2457d6"/>
<text x="310.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">приймач −Δ</text>
<line x1="380.0" y1="244.0" x2="380.0" y2="226.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="380.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">f₀ (номінал)</text>
<line x1="310.0" y1="176.0" x2="450.0" y2="176.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="380.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">розходження до 2·Δf</text>
<rect x="110.0" y="280.0" width="540.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="305.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Δf = f₀ · ppm·10⁻⁶ на кожен бік.  2.4 ГГц × 40 ppm = 96 кГц зсуву на радіо;</tspan><tspan x="380.0" dy="12.3">два вільні радіо можуть розійтися вдвічі — ≈ 192 кГц. Цю «дірку» треба вмістити в канал.</tspan></text>
</svg>