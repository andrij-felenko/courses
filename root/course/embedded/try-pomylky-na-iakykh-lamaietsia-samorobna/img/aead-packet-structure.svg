<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпечний кадр AEAD: структура та порядок обробки</text>
<rect x="40.0" y="55.0" width="780.0" height="85.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="430.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура захищеного криптографічного пакета в ефірі</text>
<rect x="55.0" y="90.0" width="220.0" height="38.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="165.0" y="105.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Заголовок + Nonce / Seq</tspan><tspan x="165.0" dy="14.3">(Відкриті, автентифіковані AAD)</tspan></text>
<rect x="285.0" y="90.0" width="300.0" height="38.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="435.0" y="105.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Шифротекст (Ciphertext)</tspan><tspan x="435.0" dy="14.3">(Зашифровані корисні дані)</tspan></text>
<rect x="595.0" y="90.0" width="210.0" height="38.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="105.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Автентифікаційний тег (Tag)</tspan><tspan x="700.0" dy="14.3">(16 байтів Poly1305 / GHASH)</tspan></text>
<rect x="40.0" y="160.0" width="780.0" height="295.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="430.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок безпечної обробки на стороні приймача</text>
<rect x="60.0" y="210.0" width="200.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">1. Перевірка Nonce / Seq</tspan><tspan x="160.0" dy="14.3">Nonce &gt; Last_Valid_Nonce</tspan><tspan x="160.0" dy="14.3">(Захист від повтору)</tspan></text>
<line x1="260.0" y1="240.0" x2="290.0" y2="240.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="290.0" y="210.0" width="240.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">2. Обчислення тегу MAC</tspan><tspan x="410.0" dy="14.3"> над (AAD + Ciphertext)</tspan><tspan x="410.0" dy="14.3">на ключі автентифікації</tspan></text>
<line x1="530.0" y1="240.0" x2="560.0" y2="240.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="560.0" y="210.0" width="240.0" height="60.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="680.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">3. Константне порівняння</tspan><tspan x="680.0" dy="14.3">Tag_calc == Tag_packet</tspan><tspan x="680.0" dy="14.3">(Без раннього виходу!)</tspan></text>
<line x1="680.0" y1="270.0" x2="680.0" y2="310.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460.0" y="320.0" width="340.0" height="60.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">4а. Тег дійсний:</tspan><tspan x="630.0" dy="14.3">Розшифрувати Ciphertext та</tspan><tspan x="630.0" dy="14.3">передати корисне навантаження в логіку</tspan></text>
<line x1="600.0" y1="270.0" x2="300.0" y2="320.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="80.0" y="320.0" width="340.0" height="60.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">4б. Тег не зійшовся:</tspan><tspan x="250.0" dy="14.3">НЕГАЙНО ВІДХИЛИТИ кадр!</tspan><tspan x="250.0" dy="14.3">Не розшифровувати, не виконувати</tspan></text>
<rect x="60.0" y="400.0" width="740.0" height="40.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="430.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Золоте правило: жоден байт шифротексту не розшифровується до успішної перевірки автентичності!</text>
</svg>