<rect x="405.0" y="290.0" width="150.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Байт [15]</tspan><tspan x="480.0" dy="14.3">diff |= a[15] ^ b[15]</tspan></text>
<line x1="555.0" y1="315.0" x2="590.0" y2="315.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="290.0" width="210.0" height="50.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">return (diff == 0)</tspan><tspan x="695.0" dy="14.3">Завжди 16 ітерацій</tspan></text>
<text x="420.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Час виконання T_const суворо однаковий незалежно від кількості збігів і значень байтів</text>
<text x="420.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Жодної кореляції між часом відгуку пристрою та правильністю вгаданих байтів</text>
