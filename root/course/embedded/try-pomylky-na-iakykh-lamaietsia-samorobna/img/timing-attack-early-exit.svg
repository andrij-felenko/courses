<rect x="615.0" y="95.0" width="185.0" height="55.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="707.5" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="707.5" dy="0.0">Час = T₀ + 3·Δt</tspan><tspan x="707.5" dy="14.3">Витік довжини префікса!</tspan></text>
<text x="420.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-style="italic">Нападник перебирає 256 варіантів на кожен байт і знаходить 16 байтів за 4096 спроб замість 2¹²⁸</text>
