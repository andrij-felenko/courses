<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Катастрофа повторного використання Nonce у потоковому шифрі</text>
<rect x="30.0" y="55.0" width="360.0" height="140.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="210.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повідомлення 1 (Передача №1)</text>
<rect x="45.0" y="95.0" width="150.0" height="40.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="120.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Відкритий текст P₁</tspan></text>
<rect x="225.0" y="95.0" width="150.0" height="40.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="300.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Гамма S(K, Nonce)</tspan></text>
<text x="202.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">⊕</text>
<line x1="210.0" y1="140.0" x2="210.0" y2="160.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="110.0" y="162.0" width="200.0" height="26.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Шифротекст C₁ = P₁ ⊕ S</tspan></text>
<rect x="430.0" y="55.0" width="360.0" height="140.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="610.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Повідомлення 2 (Той самий Nonce!)</text>
<rect x="445.0" y="95.0" width="150.0" height="40.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="520.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Відкритий текст P₂</tspan></text>
<rect x="625.0" y="95.0" width="150.0" height="40.0" rx="6" fill="#fef3c7" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Гамма S(K, Nonce)</tspan></text>
<text x="602.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">⊕</text>
<line x1="610.0" y1="140.0" x2="610.0" y2="160.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="162.0" width="200.0" height="26.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="610.0" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Шифротекст C₂ = P₂ ⊕ S</tspan></text>
<line x1="210.0" y1="195.0" x2="340.0" y2="230.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="610.0" y1="195.0" x2="480.0" y2="230.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="140.0" y="230.0" width="540.0" height="75.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="410.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">Знищення ключової гами через побітове додавання</text>
<text x="410.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">C₁ ⊕ C₂ = (P₁ ⊕ S) ⊕ (P₂ ⊕ S) = P₁ ⊕ P₂</text>
<line x1="410.0" y1="305.0" x2="410.0" y2="335.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="335.0" width="700.0" height="75.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="410.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Повне розкриття даних без знання секретного ключа K:</text>
<text x="410.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Якщо відомий P₁ (наприклад, заголовок кадру), тоді P₂ = (C₁ ⊕ C₂) ⊕ P₁</text>
</svg>