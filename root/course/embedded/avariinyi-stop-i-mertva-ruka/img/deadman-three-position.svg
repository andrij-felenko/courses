<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">3-позиційна кнопка мертвої руки: кінематика та безпечні стани</text>
<rect x="40.0" y="65.0" width="230.0" height="170.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="2.0"/>
<text x="155.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Позиція 1: Відпущено</text>
<rect x="55.0" y="120.0" width="200.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="142.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">OFF (Небезпечний стан)</tspan></text>
<rect x="55.0" y="170.0" width="200.0" height="50.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="155.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Рука знята або оператор знепритомнів</tspan></text>
<rect x="295.0" y="65.0" width="230.0" height="170.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="410.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Позиція 2: Середня (Робота)</text>
<rect x="310.0" y="120.0" width="200.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="142.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">ENABLE (Дозвіл руху)</tspan></text>
<rect x="310.0" y="170.0" width="200.0" height="50.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="410.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Свідоме легке утримання пружини</tspan></text>
<rect x="550.0" y="65.0" width="230.0" height="170.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="665.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Позиція 3: Панічне стискання</text>
<rect x="565.0" y="120.0" width="200.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="665.0" y="142.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">OFF (Аварійний стоп)</tspan></text>
<rect x="565.0" y="170.0" width="200.0" height="50.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="665.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Судома, переляк, падіння на пульт</tspan></text>
<line x1="250.0" y1="265.0" x2="315.0" y2="265.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="282.5" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Натискання</text>
<line x1="505.0" y1="265.0" x2="570.0" y2="265.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="537.5" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Стискання</text>
<rect x="40.0" y="305.0" width="740.0" height="55.0" rx="6" fill="#fff9db" stroke="#d98324" stroke-width="1.6"/><text x="410.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Ключова вимога IEC 60947-5-8: При відпусканні з Позиції 3 контакти НЕ замикаються</tspan><tspan x="410.0" dy="14.3">в Позиції 2! Система лишається вимкненою, доки кнопку не відпустять повністю в Позицію 1.</tspan></text>
</svg>