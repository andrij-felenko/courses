<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Примусово керовані контакти (Forcibly Guided): неможливість подвійної брехні</text>
<rect x="30.0" y="60.0" width="350.0" height="300.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
<text x="205.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Звичайне реле (Небезпечно)</text>
<rect x="45.0" y="105.0" width="320.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="205.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Контакти з'єднані гнучкими пружинами.</tspan><tspan x="205.0" dy="13.0">Якщо силовий NO контакт приварився (зварився дугою),</tspan><tspan x="205.0" dy="13.0">пружина NC контакту все одно замикає NC коло!</tspan></text>
<rect x="45.0" y="200.0" width="320.0" height="140.0" rx="6" fill="#feebe8" stroke="#c0392b" stroke-width="1.4"/><text x="205.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Наслідок відмови:</tspan><tspan x="205.0" dy="14.3">• Силовий двигун K1 увімкнений (NO зварений!)</tspan><tspan x="205.0" dy="14.3">• Моніторинг EDM бачить NC замкненим</tspan><tspan x="205.0" dy="14.3">• Контролер вважає, що контактор вимкнено!</tspan><tspan x="205.0" dy="14.3">• Небезпечний прихований дефект (λ_DU).</tspan></text>
<rect x="420.0" y="60.0" width="350.0" height="300.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="595.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Реле безпеки (EN 50205 / Type A)</text>
<rect x="435.0" y="105.0" width="320.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="595.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Жорсткий механічний шток ( гребінка ).</tspan><tspan x="595.0" dy="14.3">Рухомі контакти NO та NC механічно заблоковані:</tspan><tspan x="595.0" dy="14.3">вони НЕ можуть бути замкнені одночасно!</tspan></text>
<rect x="435.0" y="200.0" width="320.0" height="140.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.4"/><text x="595.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Поведінка при зварюванні:</tspan><tspan x="595.0" dy="11.7">• Силовий NO контакт зварився у замкненому стані</tspan><tspan x="595.0" dy="11.7">• Шток блокує NC контакт у розімкненому стані (зазор ≥ 0.5 мм)</tspan><tspan x="595.0" dy="11.7">• Коло EDM розірване -&gt; Контролер блокує пуск!</tspan><tspan x="595.0" dy="11.7">• 100% діагностичне покриття дефекту.</tspan></text>
