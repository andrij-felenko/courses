<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоканальний ланцюг аварійного стопу з імпульсним тестом і EDM</text>
<rect x="20.0" y="60.0" width="170.0" height="340.0" rx="6" fill="#f0f4f8" stroke="#2457d6" stroke-width="1.8"/><text x="105.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">Контролер безпеки</tspan><tspan x="105.0" dy="14.3">(Safety Controller)</tspan><tspan x="105.0" dy="14.3"></tspan><tspan x="105.0" dy="14.3">[T1] Тест Канал 1</tspan><tspan x="105.0" dy="14.3"></tspan><tspan x="105.0" dy="14.3">[T2] Тест Канал 2</tspan><tspan x="105.0" dy="14.3"></tspan><tspan x="105.0" dy="14.3">[IN1] Вхід К1</tspan><tspan x="105.0" dy="14.3"></tspan><tspan x="105.0" dy="14.3">[IN2] Вхід К2</tspan><tspan x="105.0" dy="14.3"></tspan><tspan x="105.0" dy="14.3">[EDM] Зворотний зв'язок</tspan><tspan x="105.0" dy="14.3"></tspan><tspan x="105.0" dy="14.3">[OUT] Керування K1/K2</tspan></text>
<rect x="240.0" y="60.0" width="200.0" height="160.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/><text x="340.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Кнопка E-Stop (ISO 13850)</tspan><tspan x="340.0" dy="15.6">Примусове розмикання (→)</tspan><tspan x="340.0" dy="15.6"></tspan><tspan x="340.0" dy="15.6">NC Контакт 1 (Ch 1)</tspan><tspan x="340.0" dy="15.6"></tspan><tspan x="340.0" dy="15.6">NC Контакт 2 (Ch 2)</tspan></text>
<rect x="240.0" y="250.0" width="200.0" height="150.0" rx="6" fill="#fef9e7" stroke="#d98324" stroke-width="1.6"/><text x="340.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Ланцюг зворотного зв'язку</tspan><tspan x="340.0" dy="14.3">(EDM Loop)</tspan><tspan x="340.0" dy="14.3"></tspan><tspan x="340.0" dy="14.3">NC контакт контактора K1</tspan><tspan x="340.0" dy="14.3">послідовно з</tspan><tspan x="340.0" dy="14.3">NC контактом контактора K2</tspan></text>
<rect x="500.0" y="60.0" width="290.0" height="340.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="645.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Силовий комутаційний вузол</tspan><tspan x="645.0" dy="15.6">(Power Isolation &amp; STO)</tspan><tspan x="645.0" dy="15.6"></tspan><tspan x="645.0" dy="15.6">+24V / 3~ 400V Живлення двигунів</tspan><tspan x="645.0" dy="15.6"></tspan><tspan x="645.0" dy="15.6">[ K1 ] Силовий контактор 1 (NO)</tspan><tspan x="645.0" dy="15.6">       (Примусово керовані контакти)</tspan><tspan x="645.0" dy="15.6"></tspan><tspan x="645.0" dy="15.6">[ K2 ] Силовий контактор 2 (NO)</tspan><tspan x="645.0" dy="15.6">       (Дубльований розрив)</tspan><tspan x="645.0" dy="15.6"></tspan><tspan x="645.0" dy="15.6">──────► До сервоприводів (STO)</tspan><tspan x="645.0" dy="15.6">──────► До силових котушок двигунів</tspan></text>
