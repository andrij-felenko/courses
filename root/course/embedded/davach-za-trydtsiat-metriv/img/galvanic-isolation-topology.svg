<rect x="35.0" y="318.0" width="870.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="340.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Гальванічна розв'язка розриває земляні петлі та витримує перекіс потенціалів між будівлями (ΔV_GND до кількох кіловольт),</tspan><tspan x="470.0" dy="15.0">захищаючи мікроконтролер від вигорання портів та фатальних синфазних перенапруг.</tspan></text>
