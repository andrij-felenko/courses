<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири обов'язкові опори холодного архіву вбудованого виробу</text>
<rect x="40.0" y="25.0" width="880.0" height="60.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="480.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ЦІЛЬ: Гарантована збірка біт-у-біт і сертифікований випуск патча через 10–15 років</text>
<text x="480.0" y="71.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Незмінність артефактів, середовища, ключів та апаратної документації без доступу до інтернету</text>
<line x1="142.5" y1="110.0" x2="142.5" y2="85.0" stroke="#2457d6" stroke-width="1.8"/>
<rect x="40.0" y="110.0" width="205.0" height="270.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<rect x="40.0" y="110.0" width="205.0" height="36.0" rx="8" fill="#2457d6" stroke="#2457d6" stroke-width="1.8"/>
<rect x="40.0" y="130.0" width="205.0" height="16.0" rx="0" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="142.5" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1. Джерела й код</text>
<text x="52.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Повний Git-репозиторій</text>
<text x="52.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Усі сабмодулі та SDK</text>
<text x="52.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Заморожені залежності</text>
<text x="52.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Скрипти збірки й тести</text>
<text x="52.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Точні SHA-1 / SHA-256</text>
<line x1="142.5" y1="380.0" x2="142.5" y2="410.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="367.5" y1="110.0" x2="367.5" y2="85.0" stroke="#c07a2e" stroke-width="1.8"/>
<rect x="265.0" y="110.0" width="205.0" height="270.0" rx="8" fill="#fdf0e6" stroke="#c07a2e" stroke-width="1.8"/>
<rect x="265.0" y="110.0" width="205.0" height="36.0" rx="8" fill="#c07a2e" stroke="#c07a2e" stroke-width="1.8"/>
<rect x="265.0" y="130.0" width="205.0" height="16.0" rx="0" fill="#c07a2e" stroke="#c07a2e" stroke-width="0.0"/>
<text x="367.5" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2. Тулчейн і VM</text>
<text x="277.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Образ VM / контейнера</text>
<text x="277.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Компілятор і компонувальник</text>
<text x="277.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Бібліотеки (libc, RTOS)</text>
<text x="277.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Ліцензії та емулятори</text>
<text x="277.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зафіксована версія ОС</text>
<line x1="367.5" y1="380.0" x2="367.5" y2="410.0" stroke="#c07a2e" stroke-width="1.8"/>
<line x1="592.5" y1="110.0" x2="592.5" y2="85.0" stroke="#c0392b" stroke-width="1.8"/>
<rect x="490.0" y="110.0" width="205.0" height="270.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<rect x="490.0" y="110.0" width="205.0" height="36.0" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="1.8"/>
<rect x="490.0" y="130.0" width="205.0" height="16.0" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="592.5" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3. Ключі й секрети</text>
<text x="502.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Кореневі ключі підпису</text>
<text x="502.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Сертифікати Secure Boot</text>
<text x="502.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Схеми депонування</text>
<text x="502.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Розділення часток (Shamir)</text>
<text x="502.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Протокол церемонії ключів</text>
<line x1="592.5" y1="380.0" x2="592.5" y2="410.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="817.5" y1="110.0" x2="817.5" y2="85.0" stroke="#7d3c98" stroke-width="1.8"/>
<rect x="715.0" y="110.0" width="205.0" height="270.0" rx="8" fill="#f3eefb" stroke="#7d3c98" stroke-width="1.8"/>
<rect x="715.0" y="110.0" width="205.0" height="36.0" rx="8" fill="#7d3c98" stroke="#7d3c98" stroke-width="1.8"/>
<rect x="715.0" y="130.0" width="205.0" height="16.0" rx="0" fill="#7d3c98" stroke="#7d3c98" stroke-width="0.0"/>
<text x="817.5" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4. Залізо й документи</text>
<text x="727.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Схеми, Gerber, BOM</text>
<text x="727.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Даташити й errata чіпів</text>
<text x="727.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Креслення тест-джигів</text>
<text x="727.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Прошивальні інструкції</text>
<text x="727.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Протоколи сертифікації</text>
<line x1="817.5" y1="380.0" x2="817.5" y2="410.0" stroke="#7d3c98" stroke-width="1.8"/>
<rect x="40.0" y="410.0" width="880.0" height="70.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="480.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ФУНДАМЕНТ: Фізичне довготривале збереження за правилом 3-2-1</text>
<text x="480.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Оптичні M-DISC + Стрічки LTO + Холодні WORM-сховища у географічно рознесених сейфах</text>
