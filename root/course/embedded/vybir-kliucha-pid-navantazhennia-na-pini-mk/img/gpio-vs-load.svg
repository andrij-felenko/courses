<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікт рівнів: вихідний каскад GPIO проти силового навантаження</text>
<rect x="30.0" y="60.0" width="360.0" height="330.0" rx="8" fill="#fdfefe" stroke="#8e44ad" stroke-width="2.0"/>
<text x="210.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">Вихідний каскад GPIO МК (Push-Pull)</text>
<line x1="70.0" y1="120.0" x2="210.0" y2="120.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="140.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">VDD = 3.3 В</text>
<rect x="180.0" y="140.0" width="60.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="210.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">P-MOS</text>
<text x="210.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">R ≈ 30 Ω</text>
<line x1="210.0" y1="120.0" x2="210.0" y2="140.0" stroke="#333333" stroke-width="1.5"/>
<line x1="210.0" y1="185.0" x2="210.0" y2="230.0" stroke="#333333" stroke-width="1.5"/>
<rect x="180.0" y="230.0" width="60.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="210.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">N-MOS</text>
<text x="210.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">R ≈ 30 Ω</text>
<line x1="210.0" y1="275.0" x2="210.0" y2="310.0" stroke="#333333" stroke-width="1.5"/>
<line x1="160.0" y1="310.0" x2="260.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="210.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">GND (0 В)</text>
<circle cx="290.0" cy="210.0" r="6.0" fill="#8e44ad" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="210.0" y1="210.0" x2="290.0" y2="210.0" stroke="#8e44ad" stroke-width="2.5"/>
<text x="290.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Пін GPIO</text>
<rect x="50.0" y="340.0" width="320.0" height="40.0" rx="4" fill="#fbf0f0" stroke="#c0392b" stroke-width="1.0"/>
<text x="210.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Макс. струм піна: 8–20 мА</text>
<text x="210.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Сумарно по кристалу: ≤ 100–150 мА</text>
<rect x="430.0" y="60.0" width="360.0" height="330.0" rx="8" fill="#fdf6f0" stroke="#d35400" stroke-width="2.0"/>
<text x="610.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Спроба прямого підключення (АВАРІЯ)</text>
<line x1="460.0" y1="120.0" x2="610.0" y2="120.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="535.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">V_LOAD = +12 В / +24 В</text>
<rect x="570.0" y="140.0" width="80.0" height="60.0" rx="6" fill="#fff2e6" stroke="#d35400" stroke-width="1.8"/>
<text x="610.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мотор / Реле</text>
<text x="610.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I = 0.5..3 А</text>
<line x1="610.0" y1="120.0" x2="610.0" y2="140.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="610.0" y1="200.0" x2="610.0" y2="250.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="610.0" y1="250.0" x2="300.0" y2="250.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 3"/>
<rect x="450.0" y="260.0" width="320.0" height="115.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
<text x="610.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Чому кристал миттєво згорає:</text>
<text x="610.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Струм 2 А через пін -&gt; виділення тепла &gt; 10 Вт</text>
<text x="610.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2. Напруга 12 В пробиває захисні діоди GPIO</text>
<text x="610.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3. Зворотна ЕРС котушки (100–500 В) спалює ядро</text>
<text x="610.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">4. Просідання VDD викликає Brown-out Reset</text>
</svg>