<text x="368.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">data[3]</text>
<rect x="417.0" y="110.0" width="78.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/>
