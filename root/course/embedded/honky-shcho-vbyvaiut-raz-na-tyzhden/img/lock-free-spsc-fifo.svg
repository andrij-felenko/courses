<text x="456.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">data[4]</text>
<rect x="505.0" y="110.0" width="78.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/>
<text x="544.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Slot 5</text>
<text x="544.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">data[5]</text>
<rect x="593.0" y="110.0" width="78.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/>
<text x="632.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Slot 6</text>
<text x="632.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">data[6]</text>
<rect x="681.0" y="110.0" width="78.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/>
<text x="720.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Slot 7</text>
<text x="720.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">data[7]</text>
<line x1="104.0" y1="210.0" x2="104.0" y2="175.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="104.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">tail = 0 (Consumer)</text>
<line x1="368.0" y1="210.0" x2="368.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="368.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">head = 3 (Producer)</text>
<text x="236.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">3 елементи готові до вичитування</text>
<rect x="20.0" y="240.0" width="375.0" height="175.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="207.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">Виробник / Producer (тільки ISR або потік TX)</text>
<text x="35.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Зчитує tail (relaxed): перевірка на заповнення.</text>
<text x="35.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Записує дані в buffer[head &amp; MASK].</text>
<text x="35.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">3. Бар'єр пам'яті (DMB / memory_order_release).</text>
<text x="35.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Оновлює head = head + 1 (ТІЛЬКИ Producer пише head!).</text>
<text x="35.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">✓ Без критичних секцій: Consumer ніколи не пише head!</text>
<text x="35.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">✓ Дані гарантовано у пам'яті ДО оновлення індексу head.</text>
<rect x="425.0" y="240.0" width="375.0" height="175.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="612.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Споживач / Consumer (тільки головний цикл / RTOS)</text>
<text x="440.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">1. Зчитує head з memory_order_acquire.</text>
<text x="440.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Якщо head == tail: буфер порожній (вихід).</text>
<text x="440.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Зчитує дані з buffer[tail &amp; MASK].</text>
<text x="440.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">4. Бар'єр пам'яті (DMB / memory_order_release).</text>
<text x="440.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">5. Оновлює tail = tail + 1 (ТІЛЬКИ Consumer пише tail!).</text>
<text x="440.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">✓ Безпека: читач ніколи не пережене записувача.</text>
</svg>