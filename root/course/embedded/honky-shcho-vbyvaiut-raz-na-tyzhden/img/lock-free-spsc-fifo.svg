<rect x="20.0" y="15.0" width="780.0" height="42.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="410.0" y="41.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура безблокувального SPSC FIFO буфера (Single-Producer Single-Consumer)</text>
<rect x="20.0" y="68.0" width="780.0" height="160.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="410.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий буфер розміру N = 8 (Маска: index &amp; 0x07)</text>
<rect x="65.0" y="110.0" width="78.0" height="60.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="104.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Slot 0</text>
