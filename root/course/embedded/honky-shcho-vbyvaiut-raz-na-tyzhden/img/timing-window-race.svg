<text x="255.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій Б: Фатальне влучання у вікно (Race Hazard)</text>
<text x="255.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ймовірність: 0.0003% (~1 на 330 000 викликів RMW)</text>
<text x="255.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. ISR витісняє потік між LDR та STR, модифікує count у ОЗП.</text>
<text x="255.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2. Потік прокидається і записує застаріле r0 -&gt; запис ISR ВТРАЧЕНО!</text>
<text x="255.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Результат: крах раз на 7 діб безперервної роботи в полі.</text>
