<text x="775.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="end">r1 = 0x00000002</text>
<rect x="440.0" y="267.0" width="345.0" height="38.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="450.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Результат у потоці</text>
<text x="590.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">time64 = (r1&lt;&lt;32) | r0</text>
<text x="775.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-weight="700">0x00000002_FFFFFFFF</text>
<rect x="440.0" y="311.0" width="345.0" height="38.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="450.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Стрибок у часі</text>
<text x="590.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Фантомний стрибок у майбутнє</text>
<text x="775.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-weight="700">+4294.97 с (~71.6 хв)!</text>
<text x="612.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідок: Таймаут таймера миттєво спрацьовує або зависає!</text>
