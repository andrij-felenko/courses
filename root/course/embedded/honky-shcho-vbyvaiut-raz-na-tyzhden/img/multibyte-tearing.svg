<text x="207.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідок: Лічильник стрибнув з 65535 у 0 замість 65536!</text>
