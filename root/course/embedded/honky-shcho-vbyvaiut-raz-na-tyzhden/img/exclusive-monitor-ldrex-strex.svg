<svg xmlns="http://www.w3.org/2000/svg" viewBox="-23.16 -10 853.16 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-23.16" y="-10" width="853.16" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="420.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="20.0" y="15.0" width="780.0" height="42.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="410.0" y="41.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний монітор ексклюзивного доступу (ARM Cortex-M3/M4/M7/M33)</text>
<rect x="20.0" y="68.0" width="380.0" height="335.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="210.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів Exclusive Monitor</text>
<rect x="50.0" y="130.0" width="320.0" height="65.0" rx="8" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/>
<text x="210.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">СТАН: OPEN ACCESS (Вільний)</text>
<text x="210.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ексклюзивну мітку скинуто. Запис STREX заборонено.</text>
<rect x="50.0" y="270.0" width="320.0" height="65.0" rx="8" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="210.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">СТАН: EXCLUSIVE ACCESS (Захоплений)</text>
<text x="210.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Адресу позначено. STREX дозволено виконати запис.</text>
<line x1="75.0" y1="195.0" x2="75.0" y2="265.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="70.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">LDREX r0, [r1]</text>
<line x1="335.0" y1="270.0" x2="335.0" y2="200.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" font-weight="700">STREX -&gt; OK (r2=0)</text>
<line x1="185.0" y1="270.0" x2="185.0" y2="200.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="192.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">ISR/CLREX скидає</text>
<text x="210.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Якщо монітор у стані OPEN: STREX повертає 1 (помилка),</text>
<text x="210.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">а запис у комірку пам'яті фізично БЛОКУЄТЬСЯ апаратно.</text>
<rect x="420.0" y="68.0" width="380.0" height="335.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="610.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна петля повтору (Lock-Free Retry Loop)</text>
<rect x="435.0" y="120.0" width="350.0" height="42.0" rx="4" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.2"/>
<text x="445.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. LDREX r0, [r1]</text>
<text x="445.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Завантажити значення та встановити Exclusive tag</text>
<rect x="435.0" y="168.0" width="350.0" height="42.0" rx="4" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.2"/>
<text x="445.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. ADDS r0, r0, #1</text>
<text x="445.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Модифікувати значення локально в регістрі r0</text>
<rect x="435.0" y="216.0" width="350.0" height="42.0" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
<text x="445.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="start" font-weight="700">3. STREX r2, r0, [r1]</text>
<text x="445.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Спроба атомарного збереження (r2 = результат)</text>
<rect x="435.0" y="264.0" width="350.0" height="42.0" rx="4" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.2"/>
<text x="445.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">4. CMP r2, #0</text>
<text x="445.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Перевірка: чи був запис успішним? (r2 == 0)</text>
<rect x="435.0" y="312.0" width="350.0" height="42.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="445.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">5. BNE retry_loop</text>
<text x="445.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Якщо r2 != 0: повторити спробу спочатку!</text>
<text x="610.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Без вимкнення переривань! Жодного збільшення latency!</text>
</svg>