<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний ремапінг: трансляція адреси 0x00000000 при скиданні</text>
<rect x="40.0" y="70.0" width="180.0" height="290.0" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.8"/>
