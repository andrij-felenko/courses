<line x1="490.0" y1="260.0" x2="560.0" y2="325.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="36.3" y="384.5" width="747.3" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="403.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Адреса 0x00000000 є апаратним аліасом. Ядро завжди читає вектори з нуля, а фізичне джерело обирає конфігурація BOOT.</tspan></text>
