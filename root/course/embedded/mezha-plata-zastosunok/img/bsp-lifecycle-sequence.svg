<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="520.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність життєвого циклу плати під керуванням BSP</text>
<rect x="60.0" y="55.0" width="720.0" height="62.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="80.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1. Reset / Early Init</text>
<rect x="340.0" y="63.0" width="250.0" height="24.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="465.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">board_early_init()</text>
<text x="80.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Налаштування тактування (PLL, HSE 24MHz), вимкнення невикористаної периферії</text>
<line x1="420.0" y1="117.0" x2="420.0" y2="130.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="130.0" width="720.0" height="62.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="80.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">2. Конфігурація платформи</text>
<rect x="340.0" y="138.0" width="250.0" height="24.0" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="1.0"/>
<text x="465.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">board_init()</text>
<text x="80.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Ініціалізація GPIO за замовчуванням, шин I2C/SPI, перевірка ліній живлення</text>
<line x1="420.0" y1="192.0" x2="420.0" y2="205.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="205.0" width="720.0" height="62.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="80.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">3. Подача живлення на периферію</text>
<rect x="340.0" y="213.0" width="250.0" height="24.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="465.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">board_power_sensors(true)</text>
<text x="80.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Увімкнення P-MOSFET ключа, затримка 15 мс для заряду фільтрувальних конденсаторів</text>
<line x1="420.0" y1="267.0" x2="420.0" y2="280.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="280.0" width="720.0" height="62.0" rx="6" fill="#e8f4fd" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="80.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">4. Робочий цикл застосунку</text>
<rect x="340.0" y="288.0" width="250.0" height="24.0" rx="3" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.0"/>
<text x="465.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d6fa5" text-anchor="middle" font-weight="700">board_get_battery_mv() / board_led_set()</text>
<text x="80.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Регулярний огляд сенсорів, передача телеметрії, індикація робочого стану</text>
<line x1="420.0" y1="342.0" x2="420.0" y2="355.0" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="355.0" width="720.0" height="62.0" rx="6" fill="#f3e8fd" stroke="#7e22ce" stroke-width="1.5"/>
<text x="80.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="start" font-weight="700">5. Підготовка до глибокого сну</text>
<rect x="340.0" y="363.0" width="250.0" height="24.0" rx="3" fill="#ffffff" stroke="#7e22ce" stroke-width="1.0"/>
<text x="465.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle" font-weight="700">board_power_sensors(false)</text>
<text x="80.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вимкнення живлення давачів, переведення ліній I2C (SCL/SDA) в Hi-Z для усунення витоків</text>
<line x1="420.0" y1="417.0" x2="420.0" y2="430.0" stroke="#7e22ce" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="430.0" width="720.0" height="62.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="80.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="700">6. Вхід у режим мікрострумів</text>
<rect x="340.0" y="438.0" width="250.0" height="24.0" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.0"/>
<text x="465.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">board_enter_low_power()</text>
<text x="80.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Зупинка швидкісних генераторів, перехід MCU в Stop/DeepSleep, струм &lt; 15 мкА</text>
</svg>