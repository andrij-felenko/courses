<text x="520.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Керування живленням</text>
<text x="520.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">P-MOSFET ключ (PE3)</text>
<text x="520.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Час стабілізації 15 мс</text>
<rect x="620.0" y="375.0" width="160.0" height="85.0" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/>
<text x="700.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a16207" text-anchor="middle" font-weight="700">Аналогові кола</text>
<text x="700.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">АЦП1 Канал 5, дільник</text>
<text x="700.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">R1=100кОм, R2=200кОм</text>
