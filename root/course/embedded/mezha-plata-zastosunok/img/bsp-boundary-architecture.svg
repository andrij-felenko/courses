<text x="340.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">I2C1 (0x68 Gyro, 0x76 BME)</text>
<text x="340.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">SPI2 (DMA Rx/Tx буфери)</text>
