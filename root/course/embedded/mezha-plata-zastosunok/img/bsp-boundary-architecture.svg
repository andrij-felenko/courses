<text x="420.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Канонічні фізичні величини (мВ, °C), логічні стани, перевірка інваріантів</text>
