<text x="420.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Кінцеві автомати (FSM), математичні алгоритми, протоколи, керування телеметрією</text>
<text x="420.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f4c81" text-anchor="middle" font-weight="700">Нічого не знає про піни, порти, регістри, адреси I2C та полярність транзисторів</text>
