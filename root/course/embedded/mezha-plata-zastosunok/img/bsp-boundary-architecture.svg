<text x="160.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">GPIO / Піни</text>
<text x="160.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">PB12 (LED), PA4 (CS)</text>
<text x="160.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Полярність Active-Low</text>
<rect x="260.0" y="375.0" width="160.0" height="85.0" rx="5" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.2"/>
