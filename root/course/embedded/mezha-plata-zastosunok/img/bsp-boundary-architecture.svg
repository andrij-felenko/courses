<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="500.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурна межа «Застосунок ↔ BSP ↔ Апаратна плата»</text>
<rect x="60.0" y="55.0" width="720.0" height="95.0" rx="8" fill="#e8f4fd" stroke="#1d6fa5" stroke-width="1.8"/>
