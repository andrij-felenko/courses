<text x="420.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">Контракт інтерфейсу BSP (Board Support Package API)</text>
