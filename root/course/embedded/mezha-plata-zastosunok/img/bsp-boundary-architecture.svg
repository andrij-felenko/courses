<rect x="225.0" y="235.0" width="150.0" height="32.0" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="300.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">board_led_set()</text>
