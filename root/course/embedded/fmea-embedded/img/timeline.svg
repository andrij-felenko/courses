<text x="165.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ВІЙСЬКОВІ</text>
<rect x="300.0" y="108.0" width="250.0" height="250.0" rx="10" fill="#e9eefb" stroke="#2457d6" stroke-width="1.4"/>
<text x="425.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">КОСМОС (NASA)</text>
<rect x="560.0" y="108.0" width="280.0" height="250.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="700.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700">АВТОЗАВОДИ</text>
<circle cx="110.0" cy="92.0" r="5.5" fill="#27ae60" stroke="#ffffff" stroke-width="1.6"/>
<text x="110.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1949</text>
<circle cx="360.0" cy="92.0" r="5.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.6"/>
<text x="360.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1966</text>
<circle cx="470.0" cy="92.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.6"/>
<text x="470.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1967</text>
<circle cx="650.0" cy="92.0" r="5.5" fill="#caa24a" stroke="#ffffff" stroke-width="1.6"/>
<text x="650.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700">1970-ті</text>
<circle cx="770.0" cy="92.0" r="5.5" fill="#caa24a" stroke="#ffffff" stroke-width="1.6"/>
<text x="770.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700">1993</text>
<rect x="52.0" y="138.0" width="226.0" height="84.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="165.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">MIL-P-1629</text>
<text x="165.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">військова процедура;</text>
<text x="165.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">FME·C·A — з КРИТИЧНІСТЮ</text>
<text x="165.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">вже в самій назві</text>
<rect x="312.0" y="138.0" width="226.0" height="84.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.5"/>
<text x="425.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">FMECA «Аполлон» 1966</text>
<text x="425.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">NASA не винайшла —</text>
<text x="425.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">відточила суворість для</text>
<text x="425.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">пілотованого космосу</text>
<rect x="312.0" y="232.0" width="226.0" height="84.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/>
<text x="425.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">пожежа 1967</text>
<text x="425.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Ґріссом·Вайт·Чаффі;</text>
<text x="425.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">надійність стала</text>
<text x="425.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">наріжним каменем</text>
<rect x="572.0" y="138.0" width="256.0" height="84.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="1.5"/>
<text x="700.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">Ford після Pinto, 1970-ті</text>
<text x="700.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">метод іде в масове</text>
<text x="700.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">виробництво; слідом —</text>
<text x="700.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">уся автоіндустрія</text>
<rect x="572.0" y="232.0" width="256.0" height="84.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="1.5"/>
<text x="700.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">AIAG 1993</text>
<text x="700.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">числа S·O·D і</text>
<text x="700.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">RPN = S·O·D як</text>
<text x="700.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">головний показник</text>
<rect x="40.0" y="374.0" width="470.0" height="62.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="275.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">1974: MIL-P-1629 → MIL-STD-1629</text>
<text x="275.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">старе військове коріння зникло з-під імені, а космос був на слуху →</text>
<text x="275.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">звідси живучий МІФ: «FMEA винайшла NASA» (насправді — ні)</text>
<rect x="528.0" y="374.0" width="312.0" height="62.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="684.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2019: AIAG-VDA → Action Priority</text>
<text x="684.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">RPN прибрано; тяжкість важать ПЕРШОЮ —</text>
<text x="684.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">критичність 1949-го повернулася на трон</text>
</svg>