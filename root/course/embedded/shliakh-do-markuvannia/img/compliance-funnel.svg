<rect x="542.0" y="60.0" width="152.0" height="100.0" rx="6" fill="#fef8f0" stroke="#d97706" stroke-width="1.5"/>
<text x="618.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Технічний файл</text>
<text x="618.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="618.0" dy="0.0">Формування досьє (TCF)</tspan><tspan x="618.0" dy="13.5">BOM, схеми, аналіз ризиків</tspan><tspan x="618.0" dy="13.5">Декларація відповідності (DoC)</tspan></text>
