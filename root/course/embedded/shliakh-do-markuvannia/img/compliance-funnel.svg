<rect x="20.0" y="60.0" width="152.0" height="100.0" rx="6" fill="#f4f8fa" stroke="#2457d6" stroke-width="1.5"/>
<text x="96.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Стіл розробника</text>
<text x="96.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="96.0" dy="0.0">Передвипробування (Pre-compliance)</tspan><tspan x="96.0" dy="13.5">Зонди H/E-поля, LISN, спектр</tspan><tspan x="96.0" dy="13.5">Виявлення викидів до камери</tspan></text>
