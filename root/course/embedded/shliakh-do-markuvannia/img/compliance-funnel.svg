<text x="792.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="792.0" dy="0.0">Нанесення CE, FCC ID, UKCA</tspan><tspan x="792.0" dy="13.5">Шильдик, інструкція, коробка</tspan><tspan x="792.0" dy="13.5">Право легального продажу</tspan></text>
<rect x="20.0" y="190.0" width="840.0" height="50.0" rx="6" fill="#fdf2f2" stroke="#e0b4b4" stroke-width="1.2"/>
