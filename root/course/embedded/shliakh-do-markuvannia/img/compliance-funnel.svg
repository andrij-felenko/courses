<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 270" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="270" fill="#ffffff"/>
