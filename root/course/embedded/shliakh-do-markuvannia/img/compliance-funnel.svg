<text x="444.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="444.0" dy="0.0">Виміри в безлунній камері</tspan><tspan x="444.0" dy="13.5">Емісія, імунітет, ESD, радіо</tspan><tspan x="444.0" dy="13.5">Офіційні протоколи (Test Reports)</tspan></text>
