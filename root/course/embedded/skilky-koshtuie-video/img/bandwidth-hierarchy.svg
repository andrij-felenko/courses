<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480">
<rect width="880" height="480" fill="#ffffff"/>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трафік відеотракту 1080p @ 30 fps: пікселі, шина DDR та радіоканал</text>
<rect x="30.0" y="60.0" width="200.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="130.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сенсор CMOS (Bayer)</text>
<text x="130.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1920×1080 @ 30 fps</text>
<text x="130.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">10-bit RAW = 78 МБ/с</text>
<text x="130.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(622 Мбіт/с по MIPI CSI-2)</text>
<line x1="230.0" y1="110.0" x2="310.0" y2="110.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="270.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">MIPI CSI</text>
<rect x="310.0" y="60.0" width="220.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний ISP</text>
<text x="420.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Демозаїка + Гама + 3DNR</text>
<text x="420.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Вихід YUV420: 93 МБ/с</text>
<text x="420.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(подвійна буферизація DMA)</text>
<rect x="150.0" y="210.0" width="580.0" height="110.0" rx="8" fill="#edf2f7" stroke="#333333" stroke-width="2.0"/>
<text x="440.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Системна шина DRAM (AXI Bus / LPDDR3/4)</text>
<text x="440.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Сумарний трафік пам'яті: ~465–620 МБ/с (3.7–5.0 Гбіт/с)</text>
<text x="440.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• ISP DMA Write: 93 МБ/с   • VPU Input Read: 93 МБ/с</text>
<text x="440.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Референсні кадри DPB (Read/Write): 186–340 МБ/с   • Bitstream Write: 1 МБ/с</text>
<line x1="420.0" y1="160.0" x2="420.0" y2="210.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="445.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Запис YUV</text>
<line x1="630.0" y1="210.0" x2="630.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="655.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Зчитування YUV</text>
<rect x="570.0" y="60.0" width="220.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="680.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний кодек VPU</text>
<text x="680.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">H.264 / H.265 (AVC/HEVC)</text>
<text x="680.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Стиснення: 50×–150×</text>
<text x="680.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вихідний потік: 2–6 Мбіт/с</text>
<line x1="680.0" y1="320.0" x2="680.0" y2="370.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="705.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Бітстрім</text>
<rect x="200.0" y="370.0" width="480.0" height="85.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="440.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фінальний вихід: Мережа (Wi-Fi / LTE) або Flash SD</text>
<text x="440.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Бітрейт потоку: ~4 Мбіт/с (0.5 МБ/с) проти 78 МБ/с сирого Bayer</text>
<text x="440.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Множник внутрішнього трафіку шини: майже 1000× відносно радіоефіру!</text>
</svg>