<text x="440.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Середня потужність системи: ~2.5–3.5 Вт • Висока вартість серверів і трафіку</text>
