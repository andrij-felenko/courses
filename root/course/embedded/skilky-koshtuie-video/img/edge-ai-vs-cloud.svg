<text x="730.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Пакет JSON 250 Б + кадр</text>
<text x="730.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Батарея 10 А·год: 30–90 ДНІВ</text>
<text x="440.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Середня потужність системи: ~45–80 мВт • Радіоефір увімкнений &lt; 0.5 % часу</text>
