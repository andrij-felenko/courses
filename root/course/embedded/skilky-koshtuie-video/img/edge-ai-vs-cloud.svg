<text x="60.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">1. Постійний стрім у хмару (Cloud Streaming Camera)</text>
