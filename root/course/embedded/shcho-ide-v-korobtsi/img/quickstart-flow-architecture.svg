<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура 5-хвилинного сценарію швидкого старту (Quick Start Flow)</text>
<rect x="25.0" y="65.0" width="154.0" height="240.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="25.0" y="65.0" width="154.0" height="32.0" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.0"/>
<text x="102.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">1. Звірка комплекту</text>
<text x="35.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Візуальна перевірка</text>
<text x="35.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Наявність антени</text>
<text x="35.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Звірка клемника</text>
<text x="35.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Маркери S/N у щит</text>
<line x1="181.0" y1="185.0" x2="195.0" y2="185.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="197.0" y="65.0" width="154.0" height="240.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<rect x="197.0" y="65.0" width="154.0" height="32.0" rx="6" fill="#d97706" stroke="#d97706" stroke-width="1.0"/>
<text x="274.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">2. Монтаж і дроти</text>
<text x="207.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Антена ДО струму!</text>
<text x="207.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Полярність (Vin/GND)</text>
<text x="207.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Заземлити контакт</text>
<text x="207.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Монтаж на DIN-рейку</text>
<line x1="353.0" y1="185.0" x2="367.0" y2="185.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="369.0" y="65.0" width="154.0" height="240.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="369.0" y="65.0" width="154.0" height="32.0" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.0"/>
<text x="446.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">3. Подача струму</text>
<text x="379.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Діод POWER (зелений)</text>
<text x="379.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Тест STATUS (миготіння)</text>
<text x="379.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Завантаження: &lt;10 с</text>
<text x="379.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Червоний = поламка</text>
<line x1="525.0" y1="185.0" x2="539.0" y2="185.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="541.0" y="65.0" width="154.0" height="240.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<rect x="541.0" y="65.0" width="154.0" height="32.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="618.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">4. Перший контакт</text>
<text x="551.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Точка Captive Portal</text>
<text x="551.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• BLE-пошук у додатку</text>
<text x="551.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Дефолт: 192.168.1.1</text>
<text x="551.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Зміна пароля доступу</text>
<line x1="697.0" y1="185.0" x2="711.0" y2="185.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="713.0" y="65.0" width="154.0" height="240.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<rect x="713.0" y="65.0" width="154.0" height="32.0" rx="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.0"/>
<text x="790.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">5. Хмара / Робота</text>
<text x="723.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Сканування QR-коду</text>
<text x="723.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Реєстрація у брокері</text>
<text x="723.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Телеметрія (Ping)</text>
<text x="723.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Повна веб-довідка</text>
<rect x="25.0" y="325.0" width="830.0" height="75.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="45.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="700">Головний принцип Quick Start Guide: мінімізація часу до «першого подиху» пристрою (Time to First Blink)</text>
<text x="45.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Жодних складних таблиць конфігурацій регістрів у друкованому буклеті — лише критичний шлях увімкнення та техніка безпеки.</text>
<text x="45.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Усі глибокі протоколи, REST/MQTT API, схеми оновлення та виправлення несправностей — за динамічним QR-посиланням на живу веб-базу.</text>
</svg>