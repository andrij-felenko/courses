<text x="770.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діагностичне розрізнення</text>
<rect x="630.0" y="108.8" width="280.0" height="102.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ДЕCИНХРОНІЗАЦІЯ ESC:</tspan><tspan x="770.0" dy="14.3">• eRPM миттєво падає до 0</tspan><tspan x="770.0" dy="14.3">• Струм мотора спадає або шумить</tspan><tspan x="770.0" dy="14.3">• D-терм б'є в стелю</tspan><tspan x="770.0" dy="14.3">• Мотор 100%, тяги немає</tspan><tspan x="770.0" dy="14.3">Причина: тривале розмагнічування (demag)</tspan></text>
<rect x="630.0" y="253.8" width="280.0" height="102.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ВІДРИВ ЛОПАТІ ГВИНТА:</tspan><tspan x="770.0" dy="14.3">• eRPM підскакує в 1.5–2 рази</tspan><tspan x="770.0" dy="14.3">  (знято навантаження з вала)</tspan><tspan x="770.0" dy="14.3">• Струм падає до холостого</tspan><tspan x="770.0" dy="14.3">• Колосальна вібрація на 1x RPM</tspan><tspan x="770.0" dy="14.3">Причина: механічне руйнування</tspan></text>
<rect x="630.0" y="385.1" width="280.0" height="69.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="770.0" y="402.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Лікування десинхрону в BLHeli / AM32:</tspan><tspan x="770.0" dy="14.3">• Підняти Demag Compensation (Low → High)</tspan><tspan x="770.0" dy="14.3">• Збільшити Motor Timing (15° → 22.5°)</tspan><tspan x="770.0" dy="14.3">• Знизити різкість D-term або rampup power</tspan></text>
