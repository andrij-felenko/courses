<text x="150.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Справжня вібрація рами</text>
<text x="350.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Кліпований сигнал АЦП</text>
<line x1="80.0" y1="212.0" x2="460.0" y2="212.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="275.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Зміщене середнє (DC Offset != 0)</text>
<rect x="60.0" y="313.1" width="420.0" height="73.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="270.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Через несиметричне зрізання верхівок виникає</tspan><tspan x="270.0" dy="14.3">«детекторний ефект» (випрямлення шуму):</tspan><tspan x="270.0" dy="14.3">фільтр бачить постійне хибне прискорення вбік,</tspan><tspan x="270.0" dy="14.3">якого фізично не існує</tspan></text>
<text x="730.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наслідки для польотного стека</text>
<rect x="550.0" y="118.0" width="360.0" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">1. ЗРИВ ОЦІНКИ ГОРИЗОНТУ:</tspan><tspan x="730.0" dy="14.3">EKF зливає хибний DC-offset акселерометра,</tspan><tspan x="730.0" dy="14.3">вважаючи його вектором сили тяжіння.</tspan><tspan x="730.0" dy="14.3">Оцінка нахилу завалюється на 20°–50°</tspan></text>
<rect x="550.0" y="233.1" width="360.0" height="73.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="730.0" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">2. НЕКЕРАВАНЕ ВТЕЧА ВБІК:</tspan><tspan x="730.0" dy="14.3">Контролер горизонту намагається «вирівняти»</tspan><tspan x="730.0" dy="14.3">дрон за хибним вектором і сам розганяє його</tspan><tspan x="730.0" dy="14.3">на максимальній швидкості в землю/перешкоду</tspan></text>
<rect x="550.0" y="348.1" width="360.0" height="73.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="367.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">3. ДІАГНОСТИКА В DATAFLASH:</tspan><tspan x="730.0" dy="14.3">Дивись поля VIBE.Clip0, Clip1, Clip2.</tspan><tspan x="730.0" dy="14.3">Норма: 0 кліпів за політ.</tspan><tspan x="730.0" dy="14.3">Більше 50–100 кліпів — критична вібрація</tspan></text>
</svg>