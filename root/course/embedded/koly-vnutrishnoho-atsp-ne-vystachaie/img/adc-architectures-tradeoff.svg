<text x="217.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Sigma-Delta (ΣΔ) АЦП</text>
<text x="217.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">16–24 біти, 10 SPS–250 kSPS</text>
<text x="217.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Тензомості та ваги (ADS1232)</text>
<text x="217.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Термопари, RTD PT100 (ADS1220)</text>
<text x="217.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• ЕКГ / Біопотенціали (ADS1298)</text>
<text x="217.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Прецизійні вольтметри (AD7124)</text>
<text x="217.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Формування шуму (Noise Shaping)</text>
<text x="217.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Цифрова фільтрація (Sinc3/4)</text>
<text x="217.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Гранична точність для</text>
<text x="217.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">повільних фізичних процесів</text>
<text x="217.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Шум квантування витіснено у ВЧ</text>
<rect x="350.0" y="60.0" width="245.0" height="185.0" rx="8" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="472.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Зовнішній SAR АЦП</text>
<text x="472.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">14–18 бітів, 100 kSPS–10 MSPS</text>
<text x="472.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Фазовий облік U/I (AD7606)</text>
<text x="472.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Керування двигунами (FOC)</text>
<text x="472.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Віброаналіз і БПФ (LTC2387)</text>
<text x="472.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Одночасне семплювання (Simultaneous)</text>
<text x="472.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Нульова затримка (Zero Latency)</text>
<rect x="350.0" y="255.0" width="245.0" height="95.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="472.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вбудований АЦП МК (SAR)</text>
<text x="472.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">12 біт номінал (ENOB 9–10 біт)</text>
<text x="472.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0.5–2 MSPS (послідовний MUX)</text>
<text x="472.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Контроль батареї, прості потенціометри</text>
<rect x="610.0" y="155.0" width="235.0" height="195.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="727.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Pipeline / Flash АЦП</text>
<text x="727.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">8–14 бітів, 10 MSPS–1 GSPS+</text>
<text x="727.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Програмне радіо (SDR)</text>
<text x="727.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Цифрові осцилографи</text>
<text x="727.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Радари, LiDAR та оптика</text>
<text x="727.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Екстремальна смуга частот</text>
<text x="727.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Паралельна конвеєризація</text>
<rect x="-14.6" y="409.5" width="929.1" height="31.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="450.0" y="428.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Вибір архітектури диктується фізикою задачі: ΣΔ дає граничну роздільну здатність для повільних процесів, а SAR — швидкість та точний тайминг фаз.</tspan></text>
