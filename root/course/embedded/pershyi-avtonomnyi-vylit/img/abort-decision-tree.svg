<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця рішень: дії при виникненні аномалії в автономному польоті</text>
<rect x="280.0" y="50.0" width="280.0" height="50.0" rx="6" fill="#edf4fc" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="71.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">ВИЯВЛЕННЯ АНОМАЛІЇ</tspan><tspan x="420.0" dy="14.3">(Телеметрія GCS / Візуально пілотом)</tspan></text>
<rect x="30.0" y="150.0" width="220.0" height="60.0" rx="6" fill="#fdeeed" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">КРИТИЧНА ЗАГРОЗА</tspan><tspan x="140.0" dy="13.0">• Некерований рух на людей</tspan><tspan x="140.0" dy="13.0">• Пожежа / руйнування в повітрі</tspan></text>
<line x1="320.0" y1="100.0" x2="170.0" y2="150.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="260.0" width="220.0" height="75.0" rx="6" fill="#c0392b" stroke="#900" stroke-width="1.5"/><text x="140.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">АВАРІЙНЕ ЗНЕСТРУМЛЕННЯ</tspan><tspan x="140.0" dy="14.3">(KILL SWITCH / FTS)</tspan><tspan x="140.0" dy="14.3">• Миттєве вимкнення моторів</tspan><tspan x="140.0" dy="14.3">• Падіння на місці / парашут</tspan></text>
<line x1="140.0" y1="210.0" x2="140.0" y2="260.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="140.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Пріоритет: безпека людей
Планер приноситься в жертву</text>
<rect x="300.0" y="150.0" width="240.0" height="60.0" rx="6" fill="#fff9e6" stroke="#d48806" stroke-width="1.5"/><text x="420.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">АНОМАЛІЯ ТРАЄКТОРІЇ</tspan><tspan x="420.0" dy="14.3">• Crosstrack &gt; 15 м, дрейф EKF</tspan><tspan x="420.0" dy="14.3">• Розгойдування (хитавиця PID)</tspan></text>
<line x1="420.0" y1="100.0" x2="420.0" y2="150.0" stroke="#d48806" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="300.0" y="260.0" width="240.0" height="75.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">РУЧНЕ ПЕРЕХОПЛЕННЯ</tspan><tspan x="420.0" dy="14.3">(MANUAL TAKEOVER)</tspan><tspan x="420.0" dy="14.3">• Тумблер в STABILIZE / POSHOLD</tspan><tspan x="420.0" dy="14.3">• Пілот вирівнює апарат вручну</tspan></text>
<line x1="420.0" y1="210.0" x2="420.0" y2="260.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Посадка в аварійній зоні
або повернення на базу</text>
<rect x="590.0" y="150.0" width="220.0" height="60.0" rx="6" fill="#eef8f2" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">ВТРАТА ЗВ'ЯЗКУ / ЖИВЛЕННЯ</tspan><tspan x="700.0" dy="14.3">• Обрив RC або GCS лінка</tspan><tspan x="700.0" dy="14.3">• Поріг розряду Battery Warn</tspan></text>
<line x1="520.0" y1="100.0" x2="670.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="590.0" y="260.0" width="220.0" height="75.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">АВТОМАТИЧНИЙ FAILSAFE</tspan><tspan x="700.0" dy="14.3">(RTL / AUTO LAND)</tspan><tspan x="700.0" dy="14.3">• Набір безпечної висоти</tspan><tspan x="700.0" dy="14.3">• Автоматичний політ додому</tspan></text>
