<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трикутник ролей на льотному полігоні</text>
<rect x="40.0" y="65.0" width="260.0" height="130.0" rx="6" fill="#edf4fc" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">ОПЕРАТОР НАЗЕМНОЇ СТАНЦІЇ (GCS)</tspan><tspan x="170.0" dy="13.0">• Моніторинг телеметрії (HDOP, EKF, струм)</tspan><tspan x="170.0" dy="13.0">• Контроль виконання пунктів місії</tspan><tspan x="170.0" dy="13.0">• Фіксація відхилень від плану</tspan><tspan x="170.0" dy="13.0">• Голосовий зв'язок: інформування пілота</tspan></text>
<rect x="520.0" y="65.0" width="260.0" height="130.0" rx="6" fill="#fdeeed" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">СТРАХУВАЛЬНИЙ ПІЛОТ (SAFETY PILOT)</tspan><tspan x="650.0" dy="13.0">• Пульт RC в руках, палець на тумблері</tspan><tspan x="650.0" dy="13.0">• Постійний візуальний контакт з БПЛА</tspan><tspan x="650.0" dy="13.0">• Абсолютне право вето на автономію</tspan><tspan x="650.0" dy="13.0">• Негайне ручне перехоплення (Manual/Kill)</tspan></text>
<rect x="270.0" y="240.0" width="280.0" height="100.0" rx="6" fill="#eef8f2" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">СПОСТЕРІГАЧ ПРОСТОРУ (SPOTTER)</tspan><tspan x="410.0" dy="14.3">• Огляд 360°: цивільні, інші БПЛА, птахи</tspan><tspan x="410.0" dy="14.3">• Контроль зони посадки та вітру</tspan><tspan x="410.0" dy="14.3">• Голосова команда: «УВАГА!» / «СТОП!»</tspan></text>
