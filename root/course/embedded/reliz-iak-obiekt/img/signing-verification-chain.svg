<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг довіри: підписання в релізному конвеєрі та перевірка на чипі</text>
<rect x="24.0" y="46.0" width="390.0" height="416.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="219.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. ЗБІРКА Й ПІДПИСАННЯ (Сервер / HSM)</text>
<rect x="44.0" y="94.0" width="350.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="60.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Корисний код:</text>
<text x="150.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">firmware.bin (компіляція)</text>
<text x="60.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Розмір: 240 КБ, вектори за адресою 0x08020000</text>
<line x1="219.0" y1="140.0" x2="219.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="44.0" y="158.0" width="350.0" height="46.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.2"/>
<text x="60.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">Обчислення гешу:</text>
<text x="175.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">SHA-256(firmware.bin)</text>
<text x="60.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Отримуємо 32-байтний відбиток коду</text>
<line x1="219.0" y1="204.0" x2="219.0" y2="220.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="44.0" y="222.0" width="350.0" height="54.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="60.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">Генерація маніфесту:</text>
<text x="195.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Header (поля 0x00..0x3F)</text>
<text x="60.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Записуємо HW ID, SemVer, Security Version, SHA-256</text>
<line x1="219.0" y1="276.0" x2="219.0" y2="292.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="44.0" y="294.0" width="350.0" height="60.0" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
<text x="60.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6c3483" text-anchor="start">Накладання підпису:</text>
<text x="190.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6c3483" text-anchor="start" font-weight="700">HSM / Release Private Key</text>
<text x="60.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Ed25519 Sign(Header_Data, PrivKey) -&gt; 64 B</text>
<text x="60.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">Приватний ключ захищено в HSM</text>
<line x1="219.0" y1="354.0" x2="219.0" y2="370.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="44.0" y="372.0" width="350.0" height="76.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.2"/>
<text x="60.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="start">Зшивання капсули:</text>
<text x="180.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Release Bundle (.fwpkg)</text>
<text x="60.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">[Header 128B (вкл. підпис)] + [firmware.bin]</text>
<text x="60.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Постачається на OTA сервер або утиліту програмування</text>
<rect x="446.0" y="46.0" width="390.0" height="416.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="641.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. ПЕРЕВІРКА НА ЗАЛІЗІ (Bootloader)</text>
<rect x="466.0" y="94.0" width="350.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="482.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Крок 1. Перевірка заліза:</text>
<text x="635.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">HW ID &amp; PCB Rev</text>
<text x="482.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">Чи сумісний реліз із цією платою? (Ні -&gt; Відхилити)</text>
<line x1="641.0" y1="146.0" x2="641.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="466.0" y="162.0" width="350.0" height="52.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.2"/>
<text x="482.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Крок 2. Захист від відкату:</text>
<text x="645.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Anti-rollback Check</text>
<text x="482.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Header.SecVer &gt;= Device.SecVer (eFuse/OTP лічильник)</text>
<line x1="641.0" y1="214.0" x2="641.0" y2="228.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="466.0" y="230.0" width="350.0" height="54.0" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.2"/>
<text x="482.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6c3483" text-anchor="start">Крок 3. Перевірка підпису:</text>
<text x="645.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6c3483" text-anchor="start" font-weight="700">Ed25519 Verify</text>
<text x="482.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Публічний ключ зашитий у ROM/eFuse чипа</text>
<line x1="641.0" y1="284.0" x2="641.0" y2="298.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="466.0" y="300.0" width="350.0" height="54.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.2"/>
<text x="482.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">Крок 4. Цілісність коду:</text>
<text x="630.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">SHA-256(Payload)</text>
<text x="482.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Обчислений геш == Header.payload_sha256</text>
<line x1="641.0" y1="354.0" x2="641.0" y2="368.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="466.0" y="370.0" width="350.0" height="78.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="482.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">Крок 5. Активація образу:</text>
<text x="635.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Flash &amp; Boot Jump</text>
<text x="482.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Оновлення eFuse лічильника -&gt; Запис у Flash -&gt;</text>
<text x="482.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Скидання MSP/PC і передача керування новій прошивці</text>
</svg>