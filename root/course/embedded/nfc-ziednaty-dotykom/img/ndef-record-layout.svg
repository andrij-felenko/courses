<rect x="55.0" y="394.0" width="395.0" height="18.0" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.0"/>
<text x="105.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0369a1" text-anchor="start" font-weight="700">Payload Len</text>
<text x="300.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0x12 (18 байтів корисного навантаження)</text>
<rect x="55.0" y="417.0" width="395.0" height="18.0" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.0"/>
