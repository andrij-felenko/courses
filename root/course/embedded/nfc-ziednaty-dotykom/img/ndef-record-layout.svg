<rect x="55.0" y="440.0" width="395.0" height="22.0" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.0"/>
<text x="105.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0369a1" text-anchor="start" font-weight="700">Payload</text>
