<text x="730.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">Type Name Format</text>
<text x="730.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">0x01: Well-Known (URI/Text)</tspan><tspan x="730.0" dy="12.3">0x02: MIME | 0x04: External</tspan></text>
