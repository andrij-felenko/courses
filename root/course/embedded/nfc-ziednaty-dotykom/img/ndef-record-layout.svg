<text x="520.5" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">ID Length</text>
<text x="520.5" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="520.5" dy="0.0">1 = присутнє поле</tspan><tspan x="520.5" dy="12.3">ID Length та ID</tspan></text>
<rect x="575.0" y="175.0" width="310.0" height="96.0" rx="4" fill="#fef3c7" stroke="#333333" stroke-width="1.2"/>
