<rect x="495.0" y="305.0" width="425.0" height="175.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="707.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">Приклад: BLE OOB (TNF=0x02, MIME)</text>
<rect x="510.0" y="348.0" width="395.0" height="18.0" rx="3" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.0"/>
<text x="560.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6d28d9" text-anchor="start" font-weight="700">Header</text>
<text x="755.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0xD2 (MB=1, ME=1, SR=1, TNF=2)</text>
<rect x="510.0" y="371.0" width="395.0" height="18.0" rx="3" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.0"/>
