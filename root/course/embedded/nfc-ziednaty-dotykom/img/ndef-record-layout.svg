<rect x="510.0" y="394.0" width="395.0" height="18.0" rx="3" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.0"/>
<text x="560.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6d28d9" text-anchor="start" font-weight="700">Payload Len</text>
<text x="755.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0x24 (36 байтів OOB даних)</text>
<rect x="510.0" y="417.0" width="395.0" height="18.0" rx="3" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.0"/>
<text x="560.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6d28d9" text-anchor="start" font-weight="700">Type</text>
<text x="755.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">'application/vnd.bluetooth.ep.oob'</text>
<rect x="510.0" y="440.0" width="395.0" height="22.0" rx="3" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.0"/>
<text x="560.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6d28d9" text-anchor="start" font-weight="700">Payload</text>
<text x="755.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">MAC (6B) + LE Role (1B) + TK (16B) + Name</text>
