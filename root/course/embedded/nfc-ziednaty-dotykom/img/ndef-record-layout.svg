<text x="204.5" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="204.5" dy="0.0">1 = останній запис</tspan><tspan x="204.5" dy="12.3">повідомлення</tspan></text>
