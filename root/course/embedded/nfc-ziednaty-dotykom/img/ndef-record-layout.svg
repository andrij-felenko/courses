<text x="413.5" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">Short Record</text>
<text x="413.5" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="413.5" dy="0.0">1 = довжина 1 байт</tspan><tspan x="413.5" dy="12.3">0 = довжина 4 байти</tspan></text>
