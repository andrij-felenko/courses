<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричний інваріант: проєкція фізичного розміру на площину сенсора</text>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричний інваріант: проєкція фізичного розміру на площину сенсора</text>
<rect x="25.0" y="55.0" width="490.0" height="285.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="270.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель проєкції перспективи (Pinhole Model)</text>
<circle cx="70.0" cy="190.0" r="6.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
<text x="70.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Оптичний центр</text>
<line x1="140.0" y1="120.0" x2="140.0" y2="260.0" stroke="#333333" stroke-width="2.0"/>
<text x="140.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Сенсор камери</text>
<line x1="70.0" y1="190.0" x2="140.0" y2="190.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="105.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">f_px</text>
<line x1="140.0" y1="160.0" x2="140.0" y2="220.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="165.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">h_px</text>
<line x1="70.0" y1="190.0" x2="440.0" y2="100.0" stroke="#2457d6" stroke-width="1.5"/>
<line x1="70.0" y1="190.0" x2="440.0" y2="280.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="435.0" y="100.0" width="12.0" height="180.0" rx="2" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="460.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">H_real (наприклад, 1.8 м)</text>
<line x1="70.0" y1="300.0" x2="440.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="70.0" y1="295.0" x2="70.0" y2="305.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="440.0" y1="295.0" x2="440.0" y2="305.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="255.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична дистанція: Z (метри)</text>
<rect x="535.0" y="55.0" width="300.0" height="285.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="685.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерій фізичної валідності</text>
<rect x="550.0" y="102.0" width="270.0" height="55.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="685.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формула інваріанта:</text>
<text x="685.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">h_px = (f_px · H_real) / Z</text>
<rect x="550.0" y="167.0" width="270.0" height="75.0" rx="5" fill="#fbecec" stroke="#c0392b" stroke-width="1.4"/>
<text x="560.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Приклад аномалії:</text>
<text x="560.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Клас: «Людина» (H = 1.8 м)</text>
<text x="560.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Дальність: Z = 3.0 м</text>
<text x="560.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• Очікувано: h ≈ 360 px | Детектор: 6 px!</text>
<rect x="550.0" y="252.0" width="270.0" height="75.0" rx="5" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="560.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Дія верифікатора:</text>
<text x="560.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Помилка масштабу &gt; 5000% →</text>
<text x="560.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">МИТТЄВЕ ВІДКИДАННЯ ГІПОТЕЗИ</text>
<text x="560.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">як геометричного абсурду</text>
<text x="430.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закони оптики встановлюють жорстку залежність між піксельним розміром і фізичною дистанцією</text>
</svg>