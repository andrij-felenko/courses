<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінематичний строб: перевірка фізичної допустимості переміщення між кадрами</text>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінематичний строб: перевірка фізичної допустимості переміщення між кадрами</text>
<rect x="25.0" y="55.0" width="470.0" height="285.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="260.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еліпсоїд допустимого переміщення (Validation Gate)</text>
<circle cx="140.0" cy="190.0" r="14.0" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="140.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">t-1</text>
<text x="140.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Позиція P(t-1)</text>
<line x1="140.0" y1="190.0" x2="260.0" y2="160.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">v · Δt</text>
<circle cx="260.0" cy="160.0" r="9.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="260.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Очікувана P_pred(t)</text>
<ellipse cx="260.0" cy="160.0" rx="75.0" ry="50.0" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="260.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Строб валідації (d_M ≤ γ)</text>
<circle cx="285.0" cy="170.0" r="8.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="319.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Детекція А (OK)</text>
<circle cx="405.0" cy="95.0" r="8.0" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="420.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Детекція Б (Аномалія)</text>
<line x1="140.0" y1="190.0" x2="405.0" y2="95.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="325.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">a &gt; 800 м/с²!</text>
<rect x="515.0" y="55.0" width="320.0" height="285.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="675.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінематичні інваріанти</text>
<rect x="530.0" y="100.0" width="290.0" height="68.0" rx="5" fill="#e9eefb" stroke="#2457d6" stroke-width="1.2"/>
<text x="540.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Обмеження швидкості:</text>
<text x="540.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• |ΔP / Δt| ≤ v_max (класова межа)</text>
<text x="540.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Захист від надшвидкісних стрибків</text>
<rect x="530.0" y="176.0" width="290.0" height="68.0" rx="5" fill="#fff6e0" stroke="#8a6d1a" stroke-width="1.2"/>
<text x="540.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="start" font-weight="700">Обмеження прискорення:</text>
<text x="540.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• |Δv / Δt| ≤ a_max (інерція маси)</text>
<text x="540.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Поява з нізвідки дає a = ∞</text>
<rect x="530.0" y="252.0" width="290.0" height="68.0" rx="5" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="540.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Дистанція Махаланобіса:</text>
<text x="540.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• d_M² = (z - ẑ)ᵀ · S⁻¹ · (z - ẑ) ≤ γ</text>
<text x="540.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Відсікає перескоки між цілями</text>
<text x="430.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тверді тіла мають масу: будь-яке виявлення з нефізичним прискоренням є оптичним артефактом</text>
</svg>