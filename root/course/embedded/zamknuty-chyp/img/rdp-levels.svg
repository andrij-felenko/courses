<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівні апаратного захисту RDP: стани та переходи</text>
<rect x="40.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="150.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">RDP Рівень 0</text>
<text x="150.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0xAA (відкрито)</text>
<line x1="55.0" y1="128.0" x2="245.0" y2="128.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="150.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• SWD/JTAG повністю відкритий</text>
<text x="150.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Читання/запис Flash і RAM</text>
<text x="150.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Режим розробки та налагодження</text>
<text x="150.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Вільний доступ через DAP</text>
<rect x="310.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="420.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">RDP Рівень 1</text>
<text x="420.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">будь-яке значення, крім 0xAA/0xCC</text>
<line x1="325.0" y1="128.0" x2="515.0" y2="128.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="420.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Дебагер відрізано від Flash/RAM</text>
<text x="420.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Код у Flash працює штатно</text>
<text x="420.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Звернення з DAP → Bus Error</text>
<text x="420.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Можливий відкат у Рівень 0</text>
<rect x="580.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#fff7f5" stroke="#c0392b" stroke-width="2.0"/>
<text x="690.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">RDP Рівень 2</text>
<text x="690.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">0xCC (замок назавжди)</text>
<line x1="595.0" y1="128.0" x2="785.0" y2="128.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="690.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• SWD/JTAG вимкнено фізично</text>
<text x="690.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Завантаження з RAM заборонено</text>
<text x="690.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Option Bytes заблоковано</text>
<text x="690.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Незворотний апаратний лок</text>
<line x1="264.0" y1="110.0" x2="306.0" y2="110.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="285.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">запис OB</text>
<line x1="306.0" y1="180.0" x2="264.0" y2="180.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="285.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">відкат 1→0</text>
<text x="285.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Mass Erase
Flash + RAM</text>
<line x1="534.0" y1="110.0" x2="576.0" y2="110.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="555.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">запис 0xCC</text>
<line x1="576.0" y1="180.0" x2="534.0" y2="180.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 4"/>
<text x="555.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">відкат неможливий</text>
<text x="555.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">DAP відрізано</text>
<rect x="40.0" y="245.0" width="760.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="276.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Механіка RDP захищає від звичайного зчитування через дебагер.</tspan><tspan x="420.0" dy="15.6">При зниженні захисту з Рівня 1 до Рівня 0 апаратура стирає весь Flash до нуля.</tspan><tspan x="420.0" dy="15.6">Рівень 2 замикає кристал незворотно: порт налагодження фізично відключається від внутрішньої шини.</tspan></text>
</svg>