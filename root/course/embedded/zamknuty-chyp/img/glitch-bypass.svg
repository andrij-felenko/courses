<rect x="505.0" y="96.0" width="280.0" height="48.0" rx="6" fill="#fff7f5" stroke="#c0392b" stroke-width="1.4"/><text x="645.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">1. Зчитування Option Bytes:</tspan><tspan x="645.0" dy="13.7">транзистори не встигають закритися</tspan></text>
<rect x="505.0" y="152.0" width="280.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="645.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">2. Інструкція перевірки (CMP / BNE)</tspan><tspan x="645.0" dy="13.7">виконується як NOP або дає 0xAA;</tspan><tspan x="645.0" dy="13.7">шину DAP не заблоковано!</tspan></text>
<rect x="40.0" y="240.0" width="760.0" height="105.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="281.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Як працює збій: короткочасний провал напруги під час читання Option Bytes порушує логічні рівні.</tspan><tspan x="420.0" dy="15.0">Процесор пропускає умовний перехід блокування або зчитує байт захисту як 0xAA (Рівень 0).</tspan><tspan x="420.0" dy="15.0">Результат: програматор/дебагер отримує повний доступ до Flash без запуску апаратного стирання пам'яті.</tspan></text>
