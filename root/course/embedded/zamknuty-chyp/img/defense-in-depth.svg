<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ешелонований захист (Defense in Depth) для закритого чипа</text>
<rect x="40.0" y="60.0" width="240.0" height="205.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="160.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. Фізичний рівень</text>
<line x1="50.0" y1="94.0" x2="270.0" y2="94.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="52.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Супервізор живлення (BOD)</text>
<text x="52.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Фільтри низьких частот на NRST</text>
<text x="52.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Блокувальні конденсатори</text>
<text x="52.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Заливка плати компаундом</text>
<rect x="300.0" y="60.0" width="240.0" height="205.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="420.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Апаратний та крипто-рівень</text>
<line x1="310.0" y1="94.0" x2="530.0" y2="94.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="312.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• RDP Рівень 2 (апаратний лок)</text>
<text x="312.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Secure Boot: підпис RSA/ECDSA</text>
<text x="312.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Encrypted Flash / XIP шифрування</text>
<text x="312.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ключі в OTP eFuse без читання</text>
<rect x="560.0" y="60.0" width="240.0" height="205.0" rx="6" fill="#fff7f5" stroke="#c0392b" stroke-width="2.0"/>
<text x="680.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. Програмний рівень</text>
<line x1="570.0" y1="94.0" x2="790.0" y2="94.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="572.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Комплементарна перевірка прапорців</text>
<text x="572.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Рандомізація затримок (джиттер)</text>
<text x="572.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Контроль потоку виконання (CFI)</text>
<text x="572.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Занулення RAM при розкритті</text>
<rect x="40.0" y="280.0" width="760.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Жоден окремий механізм не дає 100% захисту. Безпека досягається поєднанням шарів:</tspan><tspan x="420.0" dy="15.0">схемотехніка стримує фізичні глітчі, апаратний RDP2 і Secure Boot закривають шини,</tspan><tspan x="420.0" dy="15.0">а шифрування та подвійні перевірки роблять прочитані дампи марними.</tspan></text>
</svg>