<text x="317.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Шумова стіна на сотні МГц</text>
<rect x="236.0" y="95.0" width="162.0" height="145.0" rx="4" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.0"/>
<line x1="244.0" y1="226.0" x2="390.0" y2="226.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="248.0" y1="232.0" x2="248.0" y2="105.0" stroke="#6b7280" stroke-width="1.0"/>
