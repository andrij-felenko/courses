<text x="96.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Завада</text>
<rect x="89.0" y="195.0" width="14" height="20" fill="#d4efdf" stroke="#27ae60" stroke-width="1.2"/>
<text x="117.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Частота f</text>
<rect x="32.0" y="255.0" width="170.0" height="135.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="117.0" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="117.0" dy="0.0">Концентрація потужності</tspan><tspan x="117.0" dy="11.7">в смузі каналу (100–500 кГц).</tspan><tspan x="117.0" dy="11.7">Гігантське J/S, випалює</tspan><tspan x="117.0" dy="11.7">один фіксований лінк.</tspan></text>
<rect x="224.0" y="25.0" width="186.0" height="380.0" rx="8" fill="#fef5e7" stroke="#d35400" stroke-width="1.8"/>
