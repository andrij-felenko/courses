<rect x="661.0" y="130.0" width="16" height="75" fill="#e8daef" stroke="#8e44ad" stroke-width="1.8"/>
<rect x="694.0" y="130.0" width="16" height="75" fill="#e8daef" stroke="#8e44ad" stroke-width="1.8"/>
<rect x="727.0" y="130.0" width="16" height="75" fill="#e8daef" stroke="#8e44ad" stroke-width="1.8"/>
<text x="717.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">Імпульси P_peak</text>
<text x="717.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Час t (сплески)</text>
<rect x="632.0" y="255.0" width="170.0" height="135.0" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/><text x="717.0" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="717.0" dy="0.0">Потужні спалахи мікросекундної</tspan><tspan x="717.0" dy="11.7">тривалості. Насичує LNA,</tspan><tspan x="717.0" dy="11.7">викликає переповнення АЦП</tspan><tspan x="717.0" dy="11.7">і масові збої CRC.</tspan></text>
</svg>