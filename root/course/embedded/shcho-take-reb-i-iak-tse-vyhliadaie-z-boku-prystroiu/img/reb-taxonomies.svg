<text x="317.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Шумовий рівень</text>
<rect x="281.0" y="163.0" width="18" height="28" fill="#d4efdf" stroke="#27ae60" stroke-width="1.2"/>
<text x="317.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Широка смуга ΔF</text>
<rect x="232.0" y="255.0" width="170.0" height="135.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/><text x="317.0" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="317.0" dy="0.0">Розмиття енергії по смузі</tspan><tspan x="317.0" dy="11.7">(100–500 МГц). Піднімає шум,</tspan><tspan x="317.0" dy="11.7">знижує SNR на всіх каналах,</tspan><tspan x="317.0" dy="11.7">засліплює сусідні приймачі.</tspan></text>
<rect x="424.0" y="25.0" width="186.0" height="380.0" rx="8" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.8"/>
<rect x="432.0" y="35.0" width="170.0" height="28.0" rx="6" fill="#d4e6f1" stroke="#2457d6" stroke-width="1.5"/><text x="517.0" y="52.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="517.0" dy="0.0">Ковзне (Sweep / Chirp)</tspan></text>
<text x="517.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Швидкий біг по частоті</text>
<rect x="436.0" y="95.0" width="162.0" height="145.0" rx="4" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.0"/>
<line x1="444.0" y1="226.0" x2="590.0" y2="226.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="448.0" y1="232.0" x2="448.0" y2="105.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="456.0" y1="215.0" x2="578.0" y2="120.0" stroke="#2457d6" stroke-width="2.5"/>
<line x1="570.0" y1="130.0" x2="578.0" y2="120.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="466.0" y1="220.0" x2="588.0" y2="125.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="517.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">f(t) = f₀ + k·t</text>
<text x="517.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Час t → Частота</text>
<rect x="432.0" y="255.0" width="170.0" height="135.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/><text x="517.0" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="517.0" dy="0.0">Генератор циклічно сканує</tspan><tspan x="517.0" dy="11.7">діапазон за мікросекунди.</tspan><tspan x="517.0" dy="11.7">Рве пакети, збиває трекінг</tspan><tspan x="517.0" dy="11.7">кореляторів і частотні петлі.</tspan></text>
<rect x="624.0" y="25.0" width="186.0" height="380.0" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.8"/>
<rect x="632.0" y="35.0" width="170.0" height="28.0" rx="6" fill="#e8daef" stroke="#8e44ad" stroke-width="1.5"/><text x="717.0" y="53.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700"><tspan x="717.0" dy="0.0">Імпульсне (Pulse)</tspan></text>
<text x="717.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Короткі удари кіловатами</text>
<rect x="636.0" y="95.0" width="162.0" height="145.0" rx="4" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.0"/>
