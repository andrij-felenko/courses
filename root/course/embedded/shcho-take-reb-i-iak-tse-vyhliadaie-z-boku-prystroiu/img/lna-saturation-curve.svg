<text x="70.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">P_sat</text>
<rect x="525.0" y="35.0" width="270.0" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="72.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Лінійна зона:</tspan><tspan x="660.0" dy="14.3">P_out = P_in + G₀</tspan><tspan x="660.0" dy="14.3">Підсилювач зберігає</tspan><tspan x="660.0" dy="14.3">форму сигналу та SNR.</tspan></text>
<rect x="525.0" y="160.0" width="270.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="192.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Точка компресії 1 дБ:</tspan><tspan x="660.0" dy="14.3">Коефіцієнт підсилення</tspan><tspan x="660.0" dy="14.3">падає на 1 дБ (G = G₀ - 1).</tspan><tspan x="660.0" dy="14.3">Початок жорсткої</tspan><tspan x="660.0" dy="14.3">нелінійності транзисторів.</tspan></text>
<rect x="525.0" y="290.0" width="270.0" height="115.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/><text x="672.0" y="322.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="672.0" dy="0.0">Насичення (P_sat) і блокування:</tspan><tspan x="672.0" dy="14.3">LNA не реагує на корисний</tspan><tspan x="672.0" dy="14.3">сигнал. Зниження підсилення</tspan><tspan x="672.0" dy="14.3">(gain compression) засліплює</tspan><tspan x="672.0" dy="14.3">весь радіотракт.</tspan></text>
</svg>