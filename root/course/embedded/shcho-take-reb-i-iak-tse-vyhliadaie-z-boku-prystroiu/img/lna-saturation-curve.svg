<path d="M 100.5,346.0 L 203.0,276.0 L 285.0,220.0 L 346.5,183.6 L 387.5,166.8 L 440.8,158.4 L 481.8,157.0" fill="none" stroke="#c0392b" stroke-width="2.8"/>
