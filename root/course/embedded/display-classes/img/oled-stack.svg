<text x="390.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Світло народжується прямо в пікселі — але органіка поступово старіє (вигоряння).</text>
