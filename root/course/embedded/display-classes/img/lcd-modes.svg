<line x1="425.0" y1="196.0" x2="425.0" y2="260.0" stroke="#1a1a1a" stroke-width="4.6"/>
<line x1="459.0" y1="196.0" x2="459.0" y2="260.0" stroke="#1a1a1a" stroke-width="4.6"/>
<text x="420.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">U = 0 → сторч</text>
<text x="420.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→ чорний</text>
<text x="420.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">глибокий</text>
<text x="420.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">найкращий чорний із LCD;</text>
<text x="420.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">кут кращий за TN, гірший IPS</text>
<rect x="564.0" y="78.0" width="246.0" height="288.0" rx="8" fill="none" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="687.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">IPS — in-plane switching</text>
<text x="687.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">лежать; крутяться В ПЛОЩИНІ скла</text>
<rect x="594.0" y="150.0" width="186.0" height="8.0" rx="2" fill="#a9c8dd" stroke="#5d7e93" stroke-width="1.2"/>
<rect x="594.0" y="300.0" width="186.0" height="8.0" rx="2" fill="#a9c8dd" stroke="#5d7e93" stroke-width="1.2"/>
