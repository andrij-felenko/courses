<text x="153.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дешево, швидко, вузький кут:</text>
<text x="153.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">колір «пливе» під нахилом</text>
<rect x="297.0" y="78.0" width="246.0" height="288.0" rx="8" fill="none" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="420.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">VA — vertical alignment</text>
<text x="420.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">стоять сторч, лягають від поля</text>
<rect x="327.0" y="150.0" width="186.0" height="8.0" rx="2" fill="#a9c8dd" stroke="#5d7e93" stroke-width="1.2"/>
<rect x="327.0" y="300.0" width="186.0" height="8.0" rx="2" fill="#a9c8dd" stroke="#5d7e93" stroke-width="1.2"/>
