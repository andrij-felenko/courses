<circle cx="690.0" cy="300.0" r="6.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="690.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="687.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end">широкий кут, стабільний колір;</text>
<text x="687.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">дорожче, чорний гірший за VA</text>
<text x="420.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Молекули крутяться механічно й повільно (мілісекунди), і тим повільніше, чим холодніше:</text>
<text x="420.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">звідси «шлейф» за рухом і чутливість LCD до морозу — на відміну від електронного OLED.</text>
<text x="420.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Одна фізика заслінки — три різні компроміси лише від того, як розставити ті самі молекули.</text>
