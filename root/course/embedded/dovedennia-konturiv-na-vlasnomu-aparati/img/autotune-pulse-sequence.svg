<text x="470.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Автопілот генерує серію каліброваних імпульсів (Step Doublets) і визначає межі стійкості</text>
