<text x="213.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Оцінка затримки та тяги</text>
<text x="206.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Визначає транспортне запізнення τ контуру</text>
<text x="213.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">і максимальне прискорення α_max (dω/dt).</text>
<rect x="357" y="357" width="246" height="80" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="480.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Пошук граничного підсилення</text>
<text x="480.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Підвищує P та D до виникнення фіксованого перерегулювання (Overshoot ~10–15%).</text>
<text x="480.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">го перерегулювання (Overshoot ~10–15%).</text>
<rect x="624" y="357" width="246" height="80" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.5"/>
<text x="747.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Запас стійкості (Safety Margin)</text>
<text x="747.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Знижує знайдені критичні коефіцієнти на 30–40% для гарантії стійкості при просіданні АКБ.</text>
<text x="747.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0% для гарантії стійкості при просіданні АКБ.</text>
