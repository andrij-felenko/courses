<text x="245.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наслідок: гарячі мотори (&gt; 80°C), тремтіння, просідання АКБ</text>
