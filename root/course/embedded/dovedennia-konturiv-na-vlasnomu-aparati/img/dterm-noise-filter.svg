<text x="110.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сирий гіроскоп</text>
<text x="110.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">IMU SPI (8 кГц)</text>
<line x1="43.0" y1="158.0" x2="177.0" y2="158.0" stroke="#1a1a1a" stroke-width="1" stroke-opacity="0.3"/>
<text x="110.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Сигнал руху (0–30 Гц) +</text>
