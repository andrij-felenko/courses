<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві незалежні лінії захисту: одна страхує іншу</text>
<rect x="60.0" y="110.0" width="90.0" height="110.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="2.0"/>
<text x="105.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">комірки</tspan><tspan x="105.0" dy="15.6">стеку</tspan></text>
<rect x="230.0" y="80.0" width="200.0" height="70.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="2.0"/>
<text x="330.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">1-ша лінія:</tspan><tspan x="330.0" dy="15.0">розумний монітор + МК</tspan></text>
<text x="330.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">точні пороги, балансування, лог</text>
<rect x="230.0" y="210.0" width="200.0" height="70.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2.0"/>
<text x="330.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">2-га лінія:</tspan><tspan x="330.0" dy="15.0">незалежний вторинний захист</tspan></text>
<text x="330.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">грубі «жорсткі» пороги, власне живлення</text>
<line x1="150.0" y1="140.0" x2="230.0" y2="115.0" stroke="#caa24a" stroke-width="1.6"/>
<line x1="150.0" y1="180.0" x2="230.0" y2="245.0" stroke="#caa24a" stroke-width="1.6"/>
<circle cx="500.0" cy="180.0" r="26.0" fill="#fff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="500.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">АБО</text>
<line x1="430.0" y1="115.0" x2="476.0" y2="170.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="430.0" y1="245.0" x2="476.0" y2="190.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="502.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">будь-яка вимикає</text>
<rect x="600.0" y="140.0" width="130.0" height="80.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="665.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">ключ розриву</tspan><tspan x="665.0" dy="15.6">(MOSFET /</tspan></text>
<text x="665.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">контактор)</text>
<line x1="526.0" y1="180.0" x2="600.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="320.0" width="660.0" height="28.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="390.0" y="337.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Якщо МК зависне чи монітор збреше, груба 2-га лінія однаково розірве коло — відмова однієї не лишає батарею без нагляду.</tspan></text>
</svg>