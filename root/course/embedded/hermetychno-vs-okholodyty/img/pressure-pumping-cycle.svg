<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 967.6 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="967.6" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термодинамічний цикл насосного ефекту та проникнення вологи при охолодженні</text>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термодинамічний цикл «насосного ефекту» в закритому корпусі</text>
<rect x="40.0" y="55.0" width="410.0" height="365.0" rx="8" fill="#fffaf0" stroke="#d35400" stroke-width="2.0"/>
<text x="245.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">ФАЗА 1: Нагрівання (20 °C → 70 °C)</text>
<text x="245.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Робота електроніки + сонячна радіація</text>
<rect x="115.0" y="140.0" width="260.0" height="110.0" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="2.0"/>
<rect x="205.0" y="180.0" width="80.0" height="30.0" rx="3" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="245.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Нагрівач 10 Вт</text>
<line x1="345.0" y1="155.0" x2="390.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="395.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Вихід повітря</text>
<text x="245.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">P_внутр = 118 кПа (+17 кПа надлишку)</text>
<text x="245.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle">F_розпирання ≈ 520 Н на кришку 0.03 м²</text>
<text x="245.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Повітря розширюється за законом Гей-Люссака</text>
<text x="245.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2. Надлишковий тиск вигинає стінки та кришку</text>
<text x="245.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3. Ущільнювач частково розвантажується</text>
<text x="245.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">4. ~15% гарячого сухого повітря стравлюється</text>
<text x="245.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">   назовні крізь мікропори та нещільності</text>
<line x1="460.0" y1="237.5" x2="480.0" y2="237.5" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="470.0" y="225.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Дощ / холод</text>
<rect x="490.0" y="55.0" width="410.0" height="365.0" rx="8" fill="#f0f7ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="695.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ФАЗА 2: Охолодження (70 °C → 15 °C)</text>
<text x="695.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Злива, вітер, вимкнення приладу</text>
<rect x="565.0" y="140.0" width="260.0" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="655.0" y="180.0" width="80.0" height="30.0" rx="3" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
<text x="695.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Охолодження</text>
<line x1="840.0" y1="145.0" x2="800.0" y2="155.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="845.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Засмоктування води!</text>
<text x="695.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">P_внутр = 85 кПа (-16 кПа вакууму)</text>
<text x="695.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Зовнішній тиск втискає воду всередину</text>
<text x="695.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Залишкове повітря різко стискається</text>
<text x="695.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">2. Створюється вакуумне розрідження ΔP ≈ -16 кПа</text>
<text x="695.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3. Прокладка працює як зворотний клапан</text>
<text x="695.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">4. Вода з мокрої поверхні всмоктується на плату</text>
<text x="695.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">   → Конденсат, корозія та коротке замикання</text>
</svg>