<text x="695.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Прямий потік: h ≈ 50–150 Вт/(м²·К)</text>
