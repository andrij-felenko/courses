<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф виконання багатоетапного сценарію: прямий хід, бар'єри та відкат</text>
<rect x="20.0" y="20.0" width="1040.0" height="600.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="540.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф виконання багатоетапного сценарію: прямий хід, бар'єри та відкат</text>
<text x="540.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожен крок верифікує передумови/постумови та реєструє компенсатор у стеку</text>
<rect x="60.2" y="113.1" width="139.7" height="53.8" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="130.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">ВХІДНА КОМАНДА</tspan><tspan x="130.0" dy="13.7">«Старт промивки»</tspan><tspan x="130.0" dy="13.7">(Оператор / Мережа)</tspan></text>
<line x1="215.0" y1="140.0" x2="255.0" y2="140.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="277.8" y="101.0" width="214.4" height="78.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/><text x="385.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="385.0" dy="0.0">КРОК 1: ВІДКРИТТЯ КЛАПАНА V1</tspan><tspan x="385.0" dy="13.0">Передумова: Тиск P == 0 бар</tspan><tspan x="385.0" dy="13.0">Дія: Подати сигнал GPIO_HIGH(V1)</tspan><tspan x="385.0" dy="13.0">Постумова: Кінцевик V1_OPEN == 1</tspan><tspan x="385.0" dy="13.0">Витримка: 500 мс стабілізації</tspan></text>
<line x1="515.0" y1="140.0" x2="565.0" y2="140.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="540.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">OK</text>
<rect x="578.5" y="101.0" width="233.0" height="78.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/><text x="695.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">КРОК 2: ЗАПУСК ПОМПИ P1</tspan><tspan x="695.0" dy="13.0">Передумова: V1_OPEN == 1</tspan><tspan x="695.0" dy="13.0">Дія: Запуск ШІМ PWM(P1, 80%)</tspan><tspan x="695.0" dy="13.0">Постумова: Датчик потоку Q &gt; 5 л/хв</tspan><tspan x="695.0" dy="13.0">Таймаут: 3000 мс на розгін</tspan></text>
<line x1="825.0" y1="140.0" x2="875.0" y2="140.0" stroke="#16a34a" stroke-width="1.5"/>
