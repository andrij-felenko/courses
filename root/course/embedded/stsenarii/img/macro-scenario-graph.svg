<rect x="368.3" y="484.0" width="183.4" height="52.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.4"/><text x="460.0" y="500.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">2. Зупинити помпу P1</tspan><tspan x="460.0" dy="13.0">PWM(P1, 0%), блокування ШІМ</tspan><tspan x="460.0" dy="13.0">Контроль струму споживання</tspan></text>
<line x1="570.0" y1="510.0" x2="620.0" y2="510.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
