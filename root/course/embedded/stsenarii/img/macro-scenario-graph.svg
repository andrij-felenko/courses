<rect x="92.1" y="484.0" width="195.8" height="52.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.4"/><text x="190.0" y="500.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">1. Закрити V2 (якщо відкрито)</tspan><tspan x="190.0" dy="13.0">Зняття сигналу з клапана</tspan><tspan x="190.0" dy="13.0">Таймаут 1000 мс</tspan></text>
