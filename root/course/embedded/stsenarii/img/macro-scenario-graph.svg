<text x="885.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">OK</text>
<rect x="594.0" y="236.0" width="202.0" height="78.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/><text x="695.0" y="252.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">КРОК 3: НАБІР ТИСКУ МАГІСТРАЛІ</tspan><tspan x="695.0" dy="13.0">Передумова: Помпа P1 працює</tspan><tspan x="695.0" dy="13.0">Дія: Плавне прикриття байпаса</tspan><tspan x="695.0" dy="13.0">Постумова: Тиск P &gt;= 3.5 бар</tspan><tspan x="695.0" dy="13.0">Таймаут: 4000 мс нагнітання</tspan></text>
<line x1="565.0" y1="275.0" x2="515.0" y2="275.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="540.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">OK</text>
<rect x="262.3" y="236.0" width="245.4" height="78.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/><text x="397.0" y="252.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="397.0" dy="0.0">КРОК 4: ГОЛОВНИЙ КЛАПАН V2</tspan><tspan x="397.0" dy="13.0">Передумова: Тиск у межах 3.5..5.0 бар</tspan><tspan x="397.0" dy="13.0">Дія: Відкрити магістраль GPIO(V2, 1)</tspan><tspan x="397.0" dy="13.0">Постумова: Сенсор V2_OPEN == 1</tspan><tspan x="397.0" dy="13.0">Таймаут: 1000 мс на відкриття</tspan></text>
<line x1="255.0" y1="275.0" x2="215.0" y2="275.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">OK</text>
<rect x="47.1" y="241.3" width="165.7" height="67.4" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2.0"/><text x="130.0" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">УСПІШНИЙ ФІНІШ</tspan><tspan x="130.0" dy="13.7">Стан: РОБОЧИЙ РЕЖИМ</tspan><tspan x="130.0" dy="13.7">Система готова до циклу</tspan><tspan x="130.0" dy="13.7">Стек відкату очищено</tspan></text>
