<rect x="558.0" y="322.0" width="184.0" height="72.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.4"/><text x="650.0" y="348.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">присвоєння, передача</tspan><tspan x="650.0" dy="13.0">у функцію; enum;</tspan><tspan x="650.0" dy="13.0">поля тверде за типом</tspan></text>
<text x="440.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Книга K&amp;R (1978) описала майбутнє структур; мова догнала опис лише після виходу книги.</text>
