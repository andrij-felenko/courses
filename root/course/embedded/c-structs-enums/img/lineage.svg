<rect x="308.0" y="322.0" width="184.0" height="72.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/><text x="400.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">додано union,</tspan><tspan x="400.0" dy="13.0">typedef, unsigned</tspan></text>
