<text x="440.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">кожна ланка коштувала можливостей: типи були в CPL, їх викинули заради простоти — і Рітчі вернув їх у C</text>
