<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тракт генерації радіосигналу GNSS та каскад захисту</text>
<rect x="27.9" y="103.0" width="164.2" height="73.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="110.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">ПК / Генератор</tspan><tspan x="110.0" dy="14.3">Траєкторія руху</tspan><tspan x="110.0" dy="14.3">Ефемериди супутників</tspan><tspan x="110.0" dy="14.3">Доплер + псевдовідстані</tspan></text>
<text x="110.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1. СЦЕНАРІЙ</text>
<rect x="191.6" y="103.0" width="176.8" height="73.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="273.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="273.0" dy="0.0">SDR (ПЛІС + ЦАП)</tspan><tspan x="273.0" dy="14.3">Синтез L1/L2/E1</tspan><tspan x="273.0" dy="14.3">I/Q потоки 2.6 Мвиб/с</tspan><tspan x="273.0" dy="14.3">Вихідна потужність: 0 дБм</tspan></text>
<text x="280.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. СИНТЕЗ RF</text>
<rect x="381.0" y="103.0" width="157.9" height="73.9" rx="6" fill="#fef9e7" stroke="#c0392b" stroke-width="2.0"/><text x="460.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Каскад атенюаторів</tspan><tspan x="460.0" dy="14.3">Постійний: −60 дБ</tspan><tspan x="460.0" dy="14.3">Керований: 0..31.5 дБ</tspan><tspan x="460.0" dy="14.3">Рівень: −130..−160 дБм</tspan></text>
<text x="460.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. ПОСЛАБЛЕННЯ</text>
<rect x="556.6" y="103.0" width="176.8" height="73.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="652.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="652.0" dy="0.0">Екран-бокс (Faraday)</tspan><tspan x="652.0" dy="14.3">DUT: GNSS-модуль</tspan><tspan x="652.0" dy="14.3">Чутливий МШУ (LNA)</tspan><tspan x="652.0" dy="14.3">Ізоляція від ефіру &gt;80 дБ</tspan></text>
<text x="645.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">4. ЗАХИЩЕНИЙ DUT</text>
<line x1="185.0" y1="140.0" x2="205.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="355.0" y1="140.0" x2="380.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="540.0" y1="140.0" x2="565.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="368.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">RF 0 дБм</text>
<text x="553.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">RF −130 дБм</text>
<line x1="40.0" y1="240.0" x2="720.0" y2="240.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="380.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Чому не можна з'єднувати SDR напряму: сигнал 0 дБм (1 мВт) миттєво спалить вхідний LNA приймача,</text>
<text x="380.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">розрахований на нанопіковати (−130 дБм = 0.1 пВт). Каскад атенюаторів зрізає 13 порядків потужності.</text>
<text x="380.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Екранована скриня унеможливлює витік штучного сигналу назовні (захист від нелегального супутникового спуфінгу).</text>
</svg>