<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура апаратної інжекції цифрових шин давачів</text>
<rect x="35.9" y="108.6" width="188.2" height="82.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="130.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Хост-симулятор</tspan><tspan x="130.0" dy="15.6">(ПК / Real-Time ОС)</tspan><tspan x="130.0" dy="15.6">Модель фізики середовища</tspan><tspan x="130.0" dy="15.6">Оновлення стану: 1 кГц</tspan></text>
<text x="130.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">СИМУЛЯТОР</text>
<rect x="258.6" y="108.6" width="242.9" height="82.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="380.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Емулятор шин (FPGA / МК)</tspan><tspan x="380.0" dy="15.6">Двопортова пам'ять регістрів</tspan><tspan x="380.0" dy="15.6">Апаратний I2C / SPI Target</tspan><tspan x="380.0" dy="15.6">Інжекція збоїв (біт-фліпи, NACK)</tspan></text>
<text x="380.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">МІСТ ІНЖЕКЦІЇ СИГНАЛІВ</text>
<rect x="535.9" y="108.6" width="188.2" height="82.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="630.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Випробувана плата (DUT)</tspan><tspan x="630.0" dy="15.6">Справжній мікроконтролер</tspan><tspan x="630.0" dy="15.6">Штатний драйвер давача</tspan><tspan x="630.0" dy="15.6">Швидкість SPI: 10 МГц</tspan></text>
<text x="630.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">РЕАЛЬНЕ ЗАЛІЗО (DUT)</text>
<line x1="225.0" y1="135.0" x2="275.0" y2="135.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="275.0" y1="165.0" x2="225.0" y2="165.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Ethernet / USB</text>
<text x="250.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Статус / Тріґери</text>
<line x1="485.0" y1="135.0" x2="535.0" y2="135.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="535.0" y1="165.0" x2="485.0" y2="165.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="510.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">SCK / MOSI / CS</text>
<text x="510.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">MISO / SDA / IRQ</text>
<line x1="40.0" y1="245.0" x2="720.0" y2="245.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="380.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критична вимога: емулятор зобов'язаний виставити перший біт MISO за десятки наносекунд</text>
<text x="380.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">після спаду CS та першого фронту SCK. Звичайний МК у перериванні не встигає — потрібна FPGA або DMA.</text>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Штатна прошивка DUT не підозрює про підміну: електричні рівні, таймінги та регістри ідентичні датчику.</text>
</svg>