<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імітація радіоефіру та динамічного затухання сигналу</text>
<rect x="34.8" y="113.0" width="170.5" height="73.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="120.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Бортовий трансивер</tspan><tspan x="120.0" dy="14.3">Потужність: +20 дБм</tspan><tspan x="120.0" dy="14.3">Діапазон: 868 / 2400 МГц</tspan><tspan x="120.0" dy="14.3">Телеметрія / Керування</tspan></text>
<text x="120.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">DUT (ТРАНСИВЕР АПАРАТА)</text>
<rect x="261.4" y="111.0" width="237.2" height="77.9" rx="6" fill="#fef9e7" stroke="#c0392b" stroke-width="2.0"/><text x="380.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Керований RF-емулятор каналу</tspan><tspan x="380.0" dy="14.3">Програмований атенюатор (0..95 дБ)</tspan><tspan x="380.0" dy="14.3">Генератор релеївського завмирання</tspan><tspan x="380.0" dy="14.3">Інжектор шуму та завад (AWGN)</tspan></text>
<text x="380.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">МАТРИЦЯ ЗАТУХАННЯ ТА ЗАВАД</text>
<rect x="548.5" y="113.0" width="183.0" height="73.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="640.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Наземний модем / Пульт</tspan><tspan x="640.0" dy="14.3">Чутливість: −115 дБм</tspan><tspan x="640.0" dy="14.3">Вимірювання RSSI та SNR</tspan><tspan x="640.0" dy="14.3">Оцінка втрат пакетів (PER)</tspan></text>
<text x="640.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">НАЗЕМНА СТАНЦІЯ (GCS)</text>
<line x1="210.0" y1="138.0" x2="255.0" y2="138.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="255.0" y1="162.0" x2="210.0" y2="162.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="232.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Коаксіал RF</text>
<line x1="505.0" y1="138.0" x2="550.0" y2="138.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550.0" y1="162.0" x2="505.0" y2="162.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="528.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Коаксіал RF</text>
<line x1="40.0" y1="245.0" x2="720.0" y2="245.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="380.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель зв'язку: втрати на відстані (формула Фрііса) + орієнтація антени (провали діаграми) + завмирання</text>
<text x="380.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Замість прогулянок у полі на 5 км стенд змінює атенюацію від 40 дБ (100 м) до 95 дБ (край зв'язку) за мілісекунди.</text>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Перевірка переходу на аварійний протокол, зміна потужності передавача та адаптація бітрейту під завадами.</text>
</svg>