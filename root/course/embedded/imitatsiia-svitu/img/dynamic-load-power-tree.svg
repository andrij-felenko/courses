<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Симуляція батареї з внутрішнім опором та динамічне навантаження</text>
<rect x="26.0" y="118.0" width="208.1" height="73.9" rx="6" fill="#fef9e7" stroke="#c0392b" stroke-width="2.0"/><text x="130.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Симулятор батареї</tspan><tspan x="130.0" dy="14.3">Джерело ЕРС E(SoC)</tspan><tspan x="130.0" dy="14.3">+ Програмний опір R_int</tspan><tspan x="130.0" dy="14.3">Просідання при стрибках струму</tspan></text>
<text x="130.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. ДЖЕРЕЛО ЖИВЛЕННЯ</text>
<rect x="280.2" y="116.0" width="199.6" height="77.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="380.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Плата пристрою (DUT)</tspan><tspan x="380.0" dy="14.3">DC-DC перетворювач (Buck)</tspan><tspan x="380.0" dy="14.3">LDO для мікроконтролера</tspan><tspan x="380.0" dy="14.3">BMS та датчик струму (Shunt)</tspan></text>
<text x="380.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. ПЛАТА ТА ЖИВИЛЬНЕ ДЕРЕВО</text>
<rect x="529.1" y="118.0" width="201.8" height="73.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="630.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Електронне навантаження</tspan><tspan x="630.0" dy="14.3">Режими: CC / CV / CR / CP</tspan><tspan x="630.0" dy="14.3">Імітація моторів: 0 -&gt; 25 А</tspan><tspan x="630.0" dy="14.3">Швидкість наростання: 5 А/мкс</tspan></text>
<text x="630.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. ДИНАМІЧНИЙ СПОЖИВАЧ</text>
<line x1="220.0" y1="142.0" x2="275.0" y2="142.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="275.0" y1="168.0" x2="220.0" y2="168.0" stroke="#333333" stroke-width="2.0"/>
<text x="248.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">V_bat (з просіданням)</text>
<text x="248.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">GND (Силовий)</text>
<line x1="485.0" y1="142.0" x2="540.0" y2="142.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="540.0" y1="168.0" x2="485.0" y2="168.0" stroke="#333333" stroke-width="2.0"/>
<text x="512.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Силові шини (ESC)</text>
<text x="512.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">GND (Силовий)</text>
<line x1="40.0" y1="255.0" x2="720.0" y2="255.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="380.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика ефекту: стрибок струму навантаження I_нав викликає миттєве падіння напруги на внутрішньому опорі:</text>
<text x="380.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">V_вих = E_акб − I_нав · R_внутр. Якщо напруга просяде нижче порогу LDO, МК перезавантажиться (Brownout reset).</text>
<text x="380.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Лабораторний блок без моделі R_int маскує цю вразливість, а електронне навантаження знаходить її до першого вильоту.</text>
</svg>