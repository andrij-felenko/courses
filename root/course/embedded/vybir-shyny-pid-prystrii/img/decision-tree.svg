<rect x="146.5" y="112.5" width="167.0" height="35.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="230.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Дистанція &gt; 1–2 м або</tspan><tspan x="230.0" dy="13.0">потрібна завадостійкість?</tspan></text>
<line x1="470.0" y1="60.0" x2="230.0" y2="105.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
