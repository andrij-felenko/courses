<line x1="230.0" y1="160.0" x2="130.0" y2="215.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="165.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="540.3" y="112.5" width="179.4" height="35.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="630.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Робота в межах однієї плати</tspan><tspan x="630.0" dy="13.0">Який характер даних і темп?</tspan></text>
<line x1="470.0" y1="60.0" x2="630.0" y2="105.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="410.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="700">НІ</text>
<rect x="333.1" y="240.5" width="93.7" height="19.0" rx="6" fill="#fafafa" stroke="#0d9488" stroke-width="1.2"/><text x="380.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Аудіопотік PCM?</tspan></text>
<line x1="630.0" y1="160.0" x2="380.0" y2="225.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="318.2" y="353.6" width="123.6" height="32.7" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><text x="380.0" y="367.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">I2S (DMA)</tspan><tspan x="380.0" dy="11.7">(ЦАП, АЦП, мікрофон)</tspan></text>
<line x1="380.0" y1="275.0" x2="380.0" y2="335.0" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrow)"/>
