<line x1="700.0" y1="275.0" x2="700.0" y2="335.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="791.4" y="234.7" width="127.2" height="30.7" rx="6" fill="#fafafa" stroke="#2563eb" stroke-width="1.2"/><text x="855.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="855.0" dy="0.0">Повільні давачі, RTC,</tspan><tspan x="855.0" dy="11.7">мало вільних пінів?</tspan></text>
<line x1="630.0" y1="160.0" x2="855.0" y2="225.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="782.0" y="353.6" width="145.9" height="32.7" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="855.0" y="367.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="855.0" dy="0.0">I2C (Open-Drain)</tspan><tspan x="855.0" dy="11.7">(100–400 кбіт/с, 2 піни)</tspan></text>
<line x1="855.0" y1="275.0" x2="855.0" y2="335.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="202.6" y="468.0" width="534.8" height="24.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="470.0" y="483.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Готовий автономний модуль (GPS, BLE, стільниковий модем, консоль) → UART (з RTS/CTS)</tspan></text>
