<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка: пам'ять — молодший байт першим, дріт — старший</text>
<text x="380.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">колір червоний = 0xF800 (R=31, G=0, B=0)</text>
<rect x="300.0" y="78.0" width="160.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="380.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">0xF800</text>
<text x="380.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">одне 16-бітне число</text>
<text x="90.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">у RAM мікроконтролера (little-endian):</text>
<rect x="130.0" y="160.0" width="190.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.8"/>
<text x="185.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#5b6b7a" text-anchor="middle" font-weight="700">0x00</text>
<text x="260.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">addr N</text>
<text x="260.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">молодший байт</text>
<rect x="340.0" y="160.0" width="190.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/>
<text x="395.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">0xF8</text>
<text x="470.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">addr N+1</text>
<text x="470.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">старший байт</text>
<line x1="340.0" y1="212.0" x2="340.0" y2="252.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-style="italic">вилив байти «як лежать»</text>
<text x="90.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">по SPI контролер чекає старший байт ПЕРШИМ:</text>
<rect x="130.0" y="264.0" width="190.0" height="40.0" rx="6" fill="#fff3e0" stroke="#b9770e" stroke-width="1.8"/>
<text x="185.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#5b6b7a" text-anchor="middle" font-weight="700">0x00</text>
<text x="260.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1-й на дроті</text>
<rect x="340.0" y="264.0" width="190.0" height="40.0" rx="6" fill="#fff3e0" stroke="#b9770e" stroke-width="1.8"/>
<text x="395.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">0xF8</text>
<text x="470.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2-й на дроті</text>
<text x="380.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">контролер зібрав 0x00F8 = темно-синій → «червоне стало синім»: не панель, а неперевернутий байт</text>
</svg>