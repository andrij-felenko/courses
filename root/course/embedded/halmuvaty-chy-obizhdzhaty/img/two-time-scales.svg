<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два часові масштаби рішень: планувальник і реактивний шар</text>
<rect x="40.0" y="46.0" width="680.0" height="110.0" rx="6" fill="#f4f7fb" stroke="#2457d6" stroke-width="1.6"/>
<text x="56.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">ПОВІЛЬНИЙ ШАР (ПЛАНУВАЛЬНИК ТРАЄКТОРІЇ) — 1–10 Гц (T = 100–1000 мс)</text>
<text x="56.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вхід: карта зайнятості (OctoMap / Costmap 2.5D), глобальна місія, цільові вейпойнти</text>
<text x="56.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Алгоритми: A*, D* Lite, RRT*, TEB / MPC оптимізація сплайнів з урахуванням динаміки</text>
<text x="56.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Мета: глобальна оптимальність, енергоефективність, гладкість кривини траєкторії</text>
<line x1="240.0" y1="156.0" x2="240.0" y2="182.0" stroke="#2457d6" stroke-width="2.2"/><path d="M 240.0 190.0 L 236.0 182.0 L 244.0 182.0 Z" fill="#2457d6"/>
<text x="310.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">v_plan (плановий намір)</text>
<line x1="520.0" y1="190.0" x2="520.0" y2="164.0" stroke="#6b7280" stroke-width="1.6"/><path d="M 520.0 156.0 L 524.0 164.0 L 516.0 164.0 Z" fill="#6b7280"/>
<text x="595.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">стан / карта перешкод</text>
<rect x="40.0" y="196.0" width="680.0" height="56.0" rx="6" fill="#fdfbf7" stroke="#d97706" stroke-width="1.8"/>
<text x="380.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">АРБІТР БЕЗПЕКИ ТА БЕЗУДАРНИЙ ЗМІШУВАЧ ШВИДКОСТЕЙ</text>
<text x="380.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Вибір зони: Спостереження (план) → Застереження (змішування) → Екстрений стоп (Override)</text>
<line x1="240.0" y1="310.0" x2="240.0" y2="266.0" stroke="#c0392b" stroke-width="2.2"/><path d="M 240.0 258.0 L 244.0 266.0 L 236.0 266.0 Z" fill="#c0392b"/>
<text x="310.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">v_react (вектор ухиляння)</text>
<line x1="520.0" y1="252.0" x2="520.0" y2="368.0" stroke="#27ae60" stroke-width="2.4"/><path d="M 520.0 376.0 L 516.0 368.0 L 524.0 368.0 Z" fill="#27ae60"/>
<text x="595.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">v_cmd (фінальна уставка)</text>
<rect x="40.0" y="310.0" width="380.0" height="106.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.6"/>
<text x="54.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">ШВИДКИЙ РЕАКТИВНИЙ ШАР — 50–200 Гц</text>
<text x="54.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вхід: сирі промені ToF / лідара / сонара</text>
<text x="54.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Алгоритми: TTC, VFH+, потенційні сили</text>
<text x="54.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Мета: негайне збереження цілісності тіла</text>
<rect x="450.0" y="310.0" width="270.0" height="106.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/>
<text x="482.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ВИКОНАВЧІ ПРИВОДИ — 200–400 Гц</text>
<text x="464.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Контури струму, швидкості, кута</text>
<text x="464.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• ESC мотори, кермові сервоприводи</text>
<text x="464.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Обмеження прискорення та джерку</text>
</svg>