<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три вкладені зони безпеки та динамічний арбітраж</text>
<circle cx="190.0" cy="185.0" r="155.0" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/>
<circle cx="190.0" cy="185.0" r="95.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<circle cx="190.0" cy="185.0" r="42.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="190.0" cy="185.0" r="12.0" fill="#2457d6" stroke="#1e40af" stroke-width="2.0"/>
<line x1="190.0" y1="185.0" x2="206.0" y2="185.0" stroke="#ffffff" stroke-width="2.0"/><path d="M 214.0 185.0 L 206.0 189.0 L 206.0 181.0 Z" fill="#ffffff"/>
<text x="168.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">робот</text>
<line x1="190.0" y1="185.0" x2="345.0" y2="185.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="315.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">R_obs</text>
<text x="258.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">R_warn</text>
<text x="215.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">R_stop</text>
<rect x="380.0" y="48.0" width="345.0" height="80.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="392.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">1. ЗОНА СПОСТЕРЕЖЕННЯ (d &gt; R_warn)</text>
<text x="392.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Режим: вільне слідування глобальному плану</text>
<text x="392.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Дія: перешкоди йдуть у карту; перепланування на ходу</text>
<text x="392.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Керування: v_cmd = v_plan</text>
<rect x="380.0" y="140.0" width="345.0" height="98.0" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
<text x="392.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">2. ЗОНА ЗАСТЕРЕЖЕННЯ (R_stop &lt; d ≤ R_warn)</text>
<text x="392.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Режим: плавне безударне змішування швидкостей</text>
<text x="392.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Вага: α(d) = (R_warn - d) / (R_warn - R_stop)</text>
<text x="392.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="start" font-weight="700">• Керування: v_cmd = (1-α)·v_plan + α·v_react</text>
<text x="392.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Обмеження: v_max(d) = √(2·a_max·(d - R_stop))</text>
<rect x="380.0" y="250.0" width="345.0" height="80.0" rx="5" fill="#fee2e2" stroke="#c0392b" stroke-width="1.4"/>
<text x="392.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">3. ЗОНА ЕКСТРЕНОГО СТОПУ (d ≤ R_stop)</text>
<text x="392.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Режим: повний перехоплення керування (Safety Override)</text>
<text x="392.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Дія: анулювання плану, гальмування з темпом a_max</text>
<text x="392.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Керування: v_cmd = 0 (E-Stop Active)</text>
</svg>