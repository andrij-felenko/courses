<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="390.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія прихованого споживання девборди в режимі «глибокого сну»</text>
<text x="420.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Голий чип МК спить на 10 мкА, але плата споживає 15–25 мА через службову обв'язку</text>
<rect x="30.0" y="110.0" width="100.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="80.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Живлення
USB 5 В</text>
<line x1="130.0" y1="145.0" x2="185.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="185.0" y="105.0" width="130.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="250.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">LDO 3.3 В
(AMS1117)</text>
<text x="250.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I_q ≈ 5–10 мА!</text>
<line x1="315.0" y1="145.0" x2="365.0" y2="145.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="365.0" y1="145.0" x2="365.0" y2="305.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="400.0" y="105.0" width="145.0" height="80.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="472.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Чип МК (ESP32/STM32)</text>
<text x="472.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Deep Sleep: 5–15 мкА</text>
<text x="472.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(реальне споживання ядра)</text>
<line x1="365.0" y1="145.0" x2="400.0" y2="145.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400.0" y="195.0" width="145.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="472.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Світлодіод живлення</text>
<text x="472.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I_led ≈ 1.5–3.0 мА</text>
<line x1="365.0" y1="225.0" x2="400.0" y2="225.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400.0" y="265.0" width="145.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="472.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">USB-UART міст</text>
<text x="472.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">CP2102 / CH340</text>
<text x="472.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Витік: 8–15 мА</text>
<line x1="365.0" y1="302.0" x2="400.0" y2="302.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="545.0" y1="302.0" x2="575.0" y2="302.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="575.0" y1="302.0" x2="575.0" y2="145.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="575.0" y1="145.0" x2="545.0" y2="145.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Паразитний витік
крізь RX/TX діоди</text>
<rect x="670.0" y="105.0" width="140.0" height="235.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="740.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підсумок уві сні</text>
<line x1="680.0" y1="142.0" x2="800.0" y2="142.0" stroke="#333333" stroke-width="0.8"/>
<text x="740.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Девборда:</text>
<text x="740.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">15–25 мА</text>
<text x="740.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2000 мАг: ~4 дні</text>
<line x1="685.0" y1="208.0" x2="795.0" y2="208.0" stroke="#e0e0e0" stroke-width="0.8"/>
<text x="740.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Власна плата:</text>
<text x="740.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">10–25 мкА</text>
<text x="740.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">2000 мАг: &gt;5 років</text>
<rect x="678.0" y="280.0" width="124.0" height="45.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.0"/>
<text x="740.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Різниця автономії:</text>
<text x="740.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">у 1000 разів!</text>
<rect x="30.0" y="365.0" width="780.0" height="30.0" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.0"/>
<text x="420.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Висновок: тестувати енергоспоживання автономного пристрою на девборді «як є» неможливо.</text>
</svg>