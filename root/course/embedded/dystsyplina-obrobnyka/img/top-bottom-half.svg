<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурний шаблон «Верхня та нижня половина» (Top-Half / Bottom-Half)</text>
