<rect x="103.3" y="97.9" width="213.5" height="34.1" rx="6" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/><text x="210.0" y="111.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. Апаратне переривання периферії</tspan><tspan x="210.0" dy="13.7">(UART RXNE, Timer Update, ADC EOC)</tspan></text>
<rect x="91.3" y="162.9" width="237.4" height="34.1" rx="6" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/><text x="210.0" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">2. Вичитування регістру даних</tspan><tspan x="210.0" dy="13.7">(DR / RDR) та квитування прапорця (SR)</tspan></text>
<rect x="97.3" y="232.9" width="225.5" height="34.1" rx="6" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/><text x="210.0" y="246.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">3. Запис у Lock-Free кільцевий буфер</tspan><tspan x="210.0" dy="13.7">або атомарний прапорець події</tspan></text>
<rect x="94.3" y="307.9" width="231.3" height="34.1" rx="6" fill="#feebc8" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="321.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">4. Розблокування Bottom-Half таска</tspan><tspan x="210.0" dy="13.7">(vTaskNotifyGiveFromISR / Flag)</tspan></text>
