<rect x="517.3" y="167.9" width="225.5" height="34.1" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="181.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Пробудження та вичитування байтів</tspan><tspan x="630.0" dy="13.7">із кільцевого буфера (без блокувань)</tspan></text>
<rect x="517.3" y="229.3" width="225.5" height="61.4" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="243.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Важка бізнес-логіка та операції:</tspan><tspan x="630.0" dy="13.7">• Перевірка CRC та парсинг протоколу</tspan><tspan x="630.0" dy="13.7">• Запис у Flash / EEPROM</tspan><tspan x="630.0" dy="13.7">• Форматований вивід (printf/лог)</tspan></text>
<rect x="501.3" y="329.8" width="257.4" height="20.5" rx="6" fill="#c3dafe" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="343.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Перехід у режим очікування нової події</tspan></text>
