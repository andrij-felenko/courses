<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм пастки Write Buffer Delay та повторного входу в ISR</text>
<rect x="25.0" y="60.0" width="215.0" height="290.0" rx="8" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.5"/>
<text x="132.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро Cortex-M</text>
<rect x="52.9" y="113.5" width="158.2" height="33.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="132.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="132.0" dy="0.0">1. STR (скинути прапорець)</tspan><tspan x="132.0" dy="13.0">TIMx-&gt;SR = ~TIM_SR_UIF</tspan></text>
<rect x="58.8" y="183.5" width="146.4" height="33.0" rx="6" fill="#fed7d7" stroke="#c0392b" stroke-width="1.5"/><text x="132.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="132.0" dy="0.0">2. BX LR (вихід з ISR)</tspan><tspan x="132.0" dy="13.0">Ядро повертає контекст</tspan></text>
<rect x="37.1" y="258.5" width="189.8" height="33.0" rx="6" fill="#fed7d7" stroke="#c0392b" stroke-width="1.5"/><text x="132.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="132.0" dy="0.0">3. NVIC бачить активну лінію!</tspan><tspan x="132.0" dy="13.0">Ядро ЗНОВУ входить в ISR!</tspan></text>
<rect x="270.0" y="60.0" width="250.0" height="290.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5"/>
<text x="395.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7b341e" text-anchor="middle" font-weight="700">Буфер запису (Bus Matrix)</text>
<rect x="294.9" y="121.0" width="200.1" height="48.0" rx="6" fill="#ffffff" stroke="#dd6b20" stroke-width="1.5"/><text x="395.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">Операція скидання прапорця</tspan><tspan x="395.0" dy="13.0">зависла в конвеєрі запису шини</tspan><tspan x="395.0" dy="13.0">(затримка шин APB/AHB: 2-4 такти)</tspan></text>
<rect x="296.0" y="231.0" width="198.0" height="48.0" rx="6" fill="#c6f6d5" stroke="#27ae60" stroke-width="1.5"/><text x="395.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">Ліки: DSB або читання регістра</tspan><tspan x="395.0" dy="13.0">(dummy = TIMx-&gt;SR)</tspan><tspan x="395.0" dy="13.0">змушує шину завершити запис</tspan></text>
<rect x="550.0" y="60.0" width="265.0" height="290.0" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
<text x="682.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Периферія (Таймер / UART)</text>
<rect x="593.4" y="121.0" width="177.3" height="48.0" rx="6" fill="#fed7d7" stroke="#c0392b" stroke-width="1.5"/><text x="682.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="682.0" dy="0.0">Регістр статусу (SR):</tspan><tspan x="682.0" dy="13.0">Прапорець UIF ще НЕ скинутий!</tspan><tspan x="682.0" dy="13.0">(запис іде повільною шиною)</tspan></text>
<rect x="589.2" y="237.5" width="185.6" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="682.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="682.0" dy="0.0">Лінія переривання до NVIC:</tspan><tspan x="682.0" dy="13.0">Залишається активною (HIGH)!</tspan></text>
<line x1="240.0" y1="130.0" x2="270.0" y2="130.0" stroke="#dd6b20" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520.0" y1="145.0" x2="550.0" y2="145.0" stroke="#dd6b20" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550.0" y1="260.0" x2="240.0" y2="275.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>