<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Run-to-Completion диспетчеризація подій через статичну кільцеву чергу</text>
<text x="120.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерела подій (Producer)</text>
<rect x="40.0" y="60.0" width="160.0" height="34.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.3"/><text x="120.0" y="80.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">UART ISR (байтові кадри)</tspan></text>
<line x1="200.0" y1="77.0" x2="245.0" y2="145.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="40.0" y="105.0" width="160.0" height="34.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.3"/><text x="120.0" y="125.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">GPIO ISR (кнопка / датчик)</tspan></text>
<line x1="200.0" y1="122.0" x2="245.0" y2="145.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="40.0" y="150.0" width="160.0" height="34.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.3"/><text x="120.0" y="170.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Timer ISR (системний тік)</tspan></text>
<line x1="200.0" y1="167.0" x2="245.0" y2="145.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="40.0" y="195.0" width="160.0" height="34.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.3"/><text x="120.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Background Task (фонові дані)</tspan></text>
<line x1="200.0" y1="212.0" x2="245.0" y2="145.0" stroke="#27ae60" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="250.0" y="45.0" width="230.0" height="200.0" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="1.5"/>
<text x="365.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Статична черга подій (FIFO)</text>
<rect x="265.0" y="85.0" width="200.0" height="24.0" rx="6" fill="#e2e8f0" stroke="#718096" stroke-width="1.0"/><text x="365.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">evt_0 (WAKE)</tspan></text>
<rect x="265.0" y="113.0" width="200.0" height="24.0" rx="6" fill="#e2e8f0" stroke="#718096" stroke-width="1.0"/><text x="365.0" y="128.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">evt_1 (RX_DATA)</tspan></text>
<rect x="265.0" y="141.0" width="200.0" height="24.0" rx="6" fill="#e2e8f0" stroke="#718096" stroke-width="1.0"/><text x="365.0" y="156.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">evt_2 (TIMEOUT)</tspan></text>
<rect x="265.0" y="169.0" width="200.0" height="24.0" rx="6" fill="#ffffff" stroke="#718096" stroke-width="1.0"/><text x="365.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">...</tspan></text>
<rect x="265.0" y="197.0" width="200.0" height="24.0" rx="6" fill="#ffffff" stroke="#718096" stroke-width="1.0"/><text x="365.0" y="212.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">evt_N-1 (порожньо)</tspan></text>
<text x="365.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">head: 0x03  |  tail: 0x00  (RAM: BSS)</text>
<line x1="480.0" y1="145.0" x2="525.0" y2="145.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="502.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">pop()</text>
<rect x="530.0" y="45.0" width="190.0" height="200.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="625.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">RTC Диспетчер (Consumer)</text>
<rect x="545.0" y="85.0" width="160.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="625.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">1. Вилучення події</tspan><tspan x="625.0" dy="12.3">e = queue_pop();</tspan></text>
<rect x="545.0" y="135.0" width="160.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="151.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">2. Повна обробка (RTC)</tspan><tspan x="625.0" dy="11.7">hsm_dispatch(&amp;fsm, &amp;e);</tspan><tspan x="625.0" dy="11.7">(Дії виходу/переходу/входу)</tspan></text>
<rect x="545.0" y="195.0" width="160.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="625.0" y="212.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">3. Фіксація нового стану</tspan><tspan x="625.0" dy="12.3">fsm.state = target_state;</tspan></text>
<rect x="40.0" y="265.0" width="680.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="380.0" y="285.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Семантика Run-to-Completion (RTC):</tspan><tspan x="380.0" dy="13.7">• Кожна подія обробляється атомарно до повного переходу в новий стабільний стан.</tspan><tspan x="380.0" dy="13.7">• Нові події з переривань безпечно накопичуються в черзі й не порушують поточний крок.</tspan><tspan x="380.0" dy="13.7">• Нуль динамічної пам'яті (malloc), нуль гонок пам'яті, строгий детермінізм.</tspan></text>
<text x="380.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Архітектура Run-to-Completion: асинхронні переривання наповнюють кільцеву чергу, диспетчер обробляє квантами</text>
</svg>