<line x1="158.0" y1="286.0" x2="722.0" y2="306.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="186.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">кадр №0</text>
<line x1="722.0" y1="310.0" x2="440.0" y2="320.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="5,4"/>
<text x="446.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="694.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">ACK №0</text>
<text x="136.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-style="italic">⏱ таймаут</text>
<line x1="158.0" y1="358.0" x2="722.0" y2="378.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="186.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">кадр №0 (повтор)</text>
<text x="722.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">номер той самий → ДУБЛІКАТ,</text>
<text x="722.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">приймач відкидає, шле ACK №0</text>
<text x="440.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Три цеглинки: підтвердження (ACK), таймер на повтор і номер кадру, що відрізняє свіже від дубліката.</text>
