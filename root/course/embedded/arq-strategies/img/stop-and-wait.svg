<line x1="722.0" y1="126.0" x2="158.0" y2="146.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="694.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">ACK №0</text>
