<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому чекати по одному — марнотратство: наповнити «трубу» вікном</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">за час одного оберту (RTT) у дорогу влазить багато кадрів — Stop-and-Wait шле лише один</text>
<text x="66.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Stop-and-Wait — один кадр за RTT</text>
