<text x="430.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Скільки кадрів влазить у трубу = добуток смуги на затримку (швидкість × RTT); саме він задає розмір вікна.</text>
