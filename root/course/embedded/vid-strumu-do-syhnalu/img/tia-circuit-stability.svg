<rect x="42.0" y="295.0" width="326.0" height="108.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="328.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Фізика роботи TIA:</tspan><tspan x="205.0" dy="11.7">• Віртуальна земля тримає напругу на діоді = 0 В</tspan><tspan x="205.0" dy="11.7">• Немає перезаряду ємності діода C_in сигналом</tspan><tspan x="205.0" dy="11.7">• C_f компенсує фазовий зсув і запобігає автогенерації:</tspan><tspan x="205.0" dy="11.7">  C_f = √( C_in / (2π · R_f · GBW) )</tspan></text>
