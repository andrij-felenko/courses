<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зони електромагнітного поля антени та взаємодія з оточенням</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">реактивна зона накопичує енергію; будь-який діелектрик чи провідник у ній змінює власну ємність та індуктивність антени</text>
<circle cx="340" cy="260" r="180" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
<circle cx="340" cy="260" r="120" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="4,4"/>
<circle cx="340.0" cy="260.0" r="65.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<rect x="325.0" y="235.0" width="30.0" height="50.0" rx="3" fill="#fff" stroke="#b9770e" stroke-width="2.5"/>
<path d="M 332,278 v -10 h 16 v -8 h -16 v -8 h 16" fill="none" stroke="#b9770e" stroke-width="2.2"/>
<text x="340.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">Антена</text>
<text x="340.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Реактивна ближня зона</text>
<text x="340.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">r &lt; λ / 2π (≈ 20 мм на 2.4 ГГц)</text>
<text x="340.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Зона випромінювання (Френеля)</text>
<text x="340.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Дальня зона випромінювання (Фраунгофера: r &gt;&gt; λ)</text>
<rect x="385.0" y="160.0" width="18.0" height="200.0" rx="2" fill="#faebd7" stroke="#d35400" stroke-width="2.0"/>
<text x="394.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Стінка ABS</text>
<text x="394.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle">εr ≈ 3.0</text>
<rect x="250.0" y="308.0" width="110.0" height="45.0" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2.0"/>
<text x="305.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">LiPo Батарея</text>
<text x="305.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(метал / екран)</text>
<rect x="409.0" y="190.0" width="35.0" height="140.0" rx="8" fill="#f3e8ff" stroke="#8e44ad" stroke-width="2.0"/>
<text x="426.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">Палець / Рука</text>
<text x="426.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8e44ad" text-anchor="middle">εr ≈ 80, σ ≈ 1.5 См/м</text>
<rect x="580.0" y="80.0" width="330.0" height="360.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="745.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що відбувається в реактивній зоні:</text>
<text x="596.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Пластик корпусу (εr = 2.5–3.5):</text>
<text x="596.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Концентрує електричне поле E.</text>
<text x="596.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Збільшує еквівалентну ємність C_ant.</text>
<text x="596.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="start" font-weight="700">Наслідок: зсув резонансу вниз на 50–200 МГц.</text>
<text x="596.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">Метал / Батарея / Дисплей:</text>
<text x="596.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Гранична умова: E_тангенційне = 0.</text>
<text x="596.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Закорочує лінії E, спотворює діаграму.</text>
<text x="596.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Наслідок: глуха тіньова зона до -25 дБ.</text>
<text x="596.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Тіло / Рука оператора (εr ≈ 80):</text>
<text x="596.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Висока ємність + провідність тканин.</text>
<text x="596.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="start">Поглинає до 85% енергії у вигляді тепла.</text>
<text x="596.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="start" font-weight="700">Наслідок: катастрофічне падіння ККД антени.</text>
</svg>