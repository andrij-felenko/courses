<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія «третьої зміни»: як виникає неврахований клон</text>
<rect x="30.0" y="60.0" width="190.0" height="330.0" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="125.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЗАМОВНИК (OEM)</text>
<text x="125.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Власник розробки</text>
<rect x="42.0" y="130.0" width="166.0" height="76.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/>
<text x="125.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Пакет виробництва:</text>
<text x="125.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Gerber + BOM + прес-форми</text>
<text x="125.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Бінарник прошивки (.bin)</text>
<rect x="42.0" y="220.0" width="166.0" height="54.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="125.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Замовлення партії:</text>
<text x="125.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">10 000 шт. (оплачено)</text>
<line x1="220.0" y1="168.0" x2="258.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="220.0" y1="247.0" x2="258.0" y2="247.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="260.0" y="60.0" width="310.0" height="330.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="415.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">КОНТРАКТНИЙ ЗАВОД (EMS)</text>
<text x="415.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Лінії SMT, монтаж, тест-джиг</text>
<rect x="272.0" y="124.0" width="286.0" height="106.0" rx="6" fill="#eaf4ec" stroke="#27ae60" stroke-width="1.4"/>
<text x="284.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Зміни 1 і 2 (08:00 – 24:00)</text>
<text x="284.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Офіційне складання за контрактом</text>
<text x="284.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Оригінальний BOM, штатний ВТК</text>
<text x="284.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Випуск: 10 000 авторизованих плат</text>
<rect x="272.0" y="244.0" width="286.0" height="126.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="284.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">«Третя зміна» (00:00 – 08:00)</text>
<text x="284.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ті самі лінії SMT і прес-форми корпусу</text>
<text x="284.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Той самий бінарник прошивки (.bin)</text>
<text x="284.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зайві компоненти або дешеві аналоги</text>
<text x="284.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Випуск: +5 000 неврахованих копій</text>
<line x1="570.0" y1="177.0" x2="608.0" y2="177.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="570.0" y1="307.0" x2="608.0" y2="307.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="60.0" width="200.0" height="330.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="710.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">РИНОК ТА СЕРВІС</text>
<rect x="620.0" y="124.0" width="180.0" height="106.0" rx="6" fill="#f0faf2" stroke="#27ae60" stroke-width="1.3"/>
<text x="710.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Офіційний склад:</text>
<text x="710.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">10 000 виробів</text>
<text x="710.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Повна ціна з R&amp;D</text>
<text x="710.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Офіційна гарантія</text>
<rect x="620.0" y="244.0" width="180.0" height="126.0" rx="6" fill="#fff2f2" stroke="#c0392b" stroke-width="1.4"/>
<text x="710.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Сірий ринок / Клони:</text>
<text x="710.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">5 000 примарних копій</text>
<text x="710.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Демпінг ціни на 40–50%</text>
<text x="710.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Збитки, фейковий сервіс</text>
<text x="710.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">і навантаження на хмару</text>
</svg>