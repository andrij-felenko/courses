<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 854 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="854" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця діагностичного виключення гіпотез між залізом і кодом</text>
<rect x="30.0" y="40.0" width="180.0" height="36.0" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.0"/>
<text x="120.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Симптом збою</text>
<rect x="218.0" y="40.0" width="200.0" height="36.0" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.0"/>
<text x="318.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Тест 1: Залізо (HW)</text>
<rect x="426.0" y="40.0" width="200.0" height="36.0" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.0"/>
<text x="526.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Тест 2: Софт (SW)</text>
<rect x="634.0" y="40.0" width="200.0" height="36.0" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.0"/>
<text x="734.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Діагноз / Локалізація</text>
<rect x="30.0" y="84.0" width="180.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="120.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шина I2C зависає наглухо</text>
<rect x="218.0" y="84.0" width="200.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="318.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Осцилограф: чи є 3.3 В на</text>
<text x="318.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">підтяжці? Розрив R0</text>
<text x="318.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">ділить шину навпіл.</text>
<rect x="426.0" y="84.0" width="200.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="526.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">GPIO Reset toggle (9</text>
<text x="526.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">тактів SCL); перевірка</text>
<text x="526.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">таймауту в драйвері.</text>
<rect x="634.0" y="84.0" width="200.0" height="75.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="734.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Якщо лінія 0 В без чипів</text>
<text x="734.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">— коротке на платі; якщо</text>
<text x="734.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">після команди — завис чип.</text>
<rect x="30.0" y="167.0" width="180.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="120.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">HardFault раз на кілька</text>
<text x="120.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">годин</text>
<rect x="218.0" y="167.0" width="200.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="318.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Моніторинг VCC</text>
<text x="318.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">осцилографом: чи є</text>
<text x="318.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">просадка від передавача?</text>
<rect x="426.0" y="167.0" width="200.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="526.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">MPU/Stack Canary:</text>
<text x="526.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">перевірка переповнення</text>
<text x="526.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">стеку та битого вказівника.</text>
<rect x="634.0" y="167.0" width="200.0" height="75.0" rx="4" fill="#fff3e0" stroke="#b9770e" stroke-width="1.2"/>
<text x="734.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Просадка живлення =</text>
<text x="734.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">апаратний BOR; битий</text>
<text x="734.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">вказівник = гонка в RTOS.</text>
<rect x="30.0" y="250.0" width="180.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="120.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Биті дані в кадрах</text>
<text x="120.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">SPI/UART</text>
<rect x="218.0" y="250.0" width="200.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="318.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Перевірка форми фронтів</text>
<text x="318.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">(дзвін, затягнутий</text>
<text x="318.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">rise-time через ємність).</text>
<rect x="426.0" y="250.0" width="200.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="526.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Перевірка гонок буфера</text>
<text x="526.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">DMA та пріоритетів ISR у</text>
<text x="526.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">NVIC.</text>
<rect x="634.0" y="250.0" width="200.0" height="75.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="734.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дзвін = відсутній</text>
<text x="734.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">резистор узгодження; зсув</text>
<text x="734.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">байтів = гонка в коді.</text>
<text x="420.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Розчеплення гіпотез: один тест виключає або апаратну частину, або програмний стек</text>
</svg>