<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обмін повідомленнями PTP та апаратна фіксація часових міток</text>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол точного часу IEEE 1588 PTP: апаратні мітки t1, t2, t3, t4</text>
<rect x="59.6" y="46.2" width="220.9" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="170.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">PTP Master</tspan><tspan x="170.0" dy="15.6">(Еталон часу / Grandmaster)</tspan></text>
<rect x="558.2" y="46.2" width="183.7" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="650.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">PTP Slave</tspan><tspan x="650.0" dy="15.6">(Кінцевий вузол / MCU)</tspan></text>
<line x1="170.0" y1="115.0" x2="170.0" y2="405.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="650.0" y1="115.0" x2="650.0" y2="405.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="170.0" y1="150.0" x2="650.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="410.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Повідомлення Sync</text>
<rect x="60.9" y="135.0" width="88.2" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="105.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">t1 (PHY TX)</tspan></text>
<rect x="670.9" y="195.0" width="88.2" height="30.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="715.0" y="213.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">t2 (PHY RX)</tspan></text>
<line x1="170.0" y1="230.0" x2="650.0" y2="260.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="410.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">2. Follow_Up (передає точне значення t1)</text>
<line x1="650.0" y1="290.0" x2="170.0" y2="350.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="410.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Повідомлення Delay_Req</text>
<rect x="670.9" y="275.0" width="88.2" height="30.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="715.0" y="293.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">t3 (PHY TX)</tspan></text>
<rect x="60.9" y="335.0" width="88.2" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="105.0" y="353.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">t4 (PHY RX)</tspan></text>
<line x1="170.0" y1="370.0" x2="650.0" y2="400.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="410.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">4. Delay_Resp (передає точне значення t4)</text>
<rect x="60.0" y="420.0" width="700.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#b0bec5" stroke-width="1.5"/>
<text x="410.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрахунок затримки каналу та зсуву годинника на боці Slave:</text>
<text x="240.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Затримка: Delay = ((t4 − t1) − (t3 − t2)) ÷ 2</text>
<text x="580.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Зсув часу: Offset = ((t2 − t1) − (t4 − t3)) ÷ 2</text>
<text x="410.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Апаратні мітки на рівні PHY виключають джитер стека ОС і черг RTOS (&lt; 100 нс похибки)</text>
</svg>