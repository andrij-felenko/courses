<line x1="640.0" y1="122.0" x2="680.0" y2="80.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="680.0" y1="80.0" x2="790.0" y2="80.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="220.0" y1="115.0" x2="790.0" y2="115.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="780.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-weight="700">Поріг BOD (2.7V)</text>
<text x="205.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="end" font-weight="700">Струм I_supply
(Шунт / Power Profiler)</text>
<line x1="220.0" y1="210.0" x2="445.0" y2="210.0" stroke="#e67e22" stroke-width="2.0"/>
<line x1="445.0" y1="210.0" x2="460.0" y2="165.0" stroke="#e67e22" stroke-width="2.2"/>
