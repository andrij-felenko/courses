<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -10 902.8 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-48" y="-10" width="902.8" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крос-доменне зіставлення аналогових сигналів живлення та логів прошивки</text>
<text x="420.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крос-доменна кореляція: апаратний строб-пін як міст між осцилографом і логами</text>
<text x="205.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">Напруга VDD (3.3V)
(Аналоговий осцилограф)</text>
