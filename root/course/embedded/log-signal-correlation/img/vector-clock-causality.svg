<text x="75.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Причинний зв'язок (a → e): V(a)=[1,0,0] ≤ V(e)=[1,2,2] (для всіх k: V_a[k] ≤ V_e[k] і є хоч одне &lt;) ⇒ а передувало е</text>
<text x="75.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Конкурентні події (a || c): V(a)=[1,0,0] та V(c)=[0,0,1] — жоден вектор не менший за інший ⇒ події незалежні</text>
