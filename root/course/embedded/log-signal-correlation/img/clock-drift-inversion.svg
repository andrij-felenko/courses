<text x="75.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">[00:00:00.025] ВУЗОЛ Б: Отримано сигнал аварії від Вузла А (ПОМИЛКА СУПЕРВІЗОРА?)</text>
<text x="75.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">[00:00:00.080] ВУЗОЛ А: Спрацював апаратний захист за струмом (ПРИЧИНА)</text>
<text x="75.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">Висновок непідготовленого інженера: «Супервізор почав панікувати на 55 мс раніше, ніж виник надструм!»</text>
