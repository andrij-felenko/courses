<rect x="53.0" y="289.2" width="244.0" height="51.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">1. Тіньове стеження (Tracking)</tspan><tspan x="175.0" dy="14.3">Інтегратор PID підганяється під u_ml:</tspan><tspan x="175.0" dy="14.3">I(t) = u_ml − (Kp·e + Kd·ė)</tspan></text>
<rect x="324.9" y="289.2" width="250.3" height="51.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">2. Динамічне злиття (Cross-Fading)</tspan><tspan x="450.0" dy="14.3">u(t) = (1 − α(t))·u_hold + α(t)·u_rule</tspan><tspan x="450.0" dy="14.3">α(t) плавно зростає 0 → 1 за T_trans</tspan></text>
<rect x="605.0" y="289.2" width="240.0" height="51.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">3. Обмеження темпу (Slew Rate)</tspan><tspan x="725.0" dy="14.3">|du/dt| ≤ R_max</tspan><tspan x="725.0" dy="14.3">Унеможливлює кидки струму привода</tspan></text>
