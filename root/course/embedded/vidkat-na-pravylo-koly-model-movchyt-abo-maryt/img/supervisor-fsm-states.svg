<rect x="27.5" y="138.8" width="205.0" height="102.5" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="130.0" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">STATE_NOMINAL_ML</tspan><tspan x="130.0" dy="14.3"></tspan><tspan x="130.0" dy="14.3">• Повне керування моделлю</tspan><tspan x="130.0" dy="14.3">• Валідний латентний простір</tspan><tspan x="130.0" dy="14.3">• Deadline &amp; ентропія в нормі</tspan><tspan x="130.0" dy="14.3">• Тіньовий PID стежить за u</tspan></text>
<rect x="302.5" y="33.8" width="215.0" height="102.5" rx="6" fill="#fefde8" stroke="#f39c12" stroke-width="1.8"/><text x="410.0" y="53.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">STATE_DEGRADED_HOLD</tspan><tspan x="410.0" dy="14.3"></tspan><tspan x="410.0" dy="14.3">• 1–2 пропущені кадри</tspan><tspan x="410.0" dy="14.3">• Сплеск ентропії / завада</tspan><tspan x="410.0" dy="14.3">• Екстраполяція траєкторії</tspan><tspan x="410.0" dy="14.3">• Slew-rate обмеження кутів</tspan></text>
<rect x="576.5" y="138.8" width="226.9" height="102.5" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="2.0"/><text x="690.0" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">STATE_RULE_FALLBACK</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">• Відкат на детерміноване правило</tspan><tspan x="690.0" dy="14.3">• Утримання курсу за IMU/GNSS</tspan><tspan x="690.0" dy="14.3">• Безударний вхід (Bumpless)</tspan><tspan x="690.0" dy="14.3">• Модель ізольована в тінь</tspan></text>
<rect x="293.4" y="258.8" width="233.2" height="102.5" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="2.0"/><text x="410.0" y="278.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">STATE_EMERGENCY_SAFE</tspan><tspan x="410.0" dy="14.3"></tspan><tspan x="410.0" dy="14.3">• Відмова сенсорів / таймаут &gt; 1 с</tspan><tspan x="410.0" dy="14.3">• Аварійне зависання / посадка</tspan><tspan x="410.0" dy="14.3">• Примусове глушіння тяги</tspan><tspan x="410.0" dy="14.3">• Фіксація відмови в NVS</tspan></text>
