<text x="578.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Анод + Сепаратор + Катод</text>
<text x="566.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2980b9" text-anchor="start" font-weight="700">Площа контакту велика (~150 см²)</text>
<text x="450.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Питома енергія: ~400–450 Вт·год/кг (−30%)</text>
<text x="450.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Саморозряд: 2–3% на рік (5–10 років)</text>
<text x="450.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Неперервний струм: 500–1000 мА</text>
<text x="450.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Максимальний імпульс: 2000–3000 мА (до 3 А)</text>
<text x="450.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Схильність до пасивації: низька</text>
