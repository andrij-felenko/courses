<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кулонівське поле радіальне: працює лише рух по r</text>
<circle cx="120.0" cy="330.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="120.0" y="335.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="120.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">заряд</text>
<line x1="144.4" y1="321.1" x2="354.9" y2="244.5" stroke="#a9d9bd" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="139.9" y1="313.3" x2="311.5" y2="169.3" stroke="#a9d9bd" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="133.0" y1="307.5" x2="245.0" y2="113.5" stroke="#a9d9bd" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="124.5" y1="304.4" x2="163.4" y2="83.8" stroke="#a9d9bd" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="330.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">лінії E</text>
<line x1="312.8" y1="100.2" x2="397.1" y2="170.9" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="5 3"/>
<line x1="242.1" y1="184.5" x2="312.8" y2="100.2" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="242.1" y1="184.5" x2="397.1" y2="170.9" stroke="#1a1a1a" stroke-width="2.8" marker-end="url(#arrow)"/>
<circle cx="242.1" cy="184.5" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="403.1" y="186.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">dl</text>
<text x="273.5" y="134.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">dr</text>
<text x="342.8" y="130.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">⊥ E → внесок 0</text>
<rect x="440.0" y="120.0" width="262.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="571.0" y="152.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="571.0" dy="0.0">E · dl = E · (dr + коловий)</tspan><tspan x="571.0" dy="15.6">коловий крок ⊥ E → внесок 0</tspan><tspan x="571.0" dy="15.6">лишається  E·dr = E(r)·dr</tspan><tspan x="571.0" dy="15.6"></tspan><tspan x="571.0" dy="15.6">робота = ∫ E(r) dr</tspan><tspan x="571.0" dy="15.6">залежить ЛИШЕ від r-кінців —</tspan><tspan x="571.0" dy="15.6">хоч як петляй шлях між ними</tspan></text>
</svg>