<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія довіри: від холодного кореня до заводської прошивки</text>
<rect x="40.0" y="64.0" width="760.0" height="100.0" rx="8" fill="#fffaf5" stroke="#c0392b" stroke-width="2.0"/>
<text x="58.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">КОРЕНЕВИЙ КЛЮЧ ВИРОБУ (ROOT CA / ROOT OF TRUST)</text>
<text x="58.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Термін життя: 10–25 років (на весь життєвий цикл лінійки виробів)</text>
<text x="58.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зберігання: офлайн у холодному банківському сейфі, розділений на частки</text>
<text x="58.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">• Призначення: підписує ЛИШЕ проміжні сертифікати випуску раз на 1–2 роки</text>
<line x1="420.0" y1="166.0" x2="420.0" y2="202.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Підпис сертифіката випуску під час церемонії</text>
<rect x="40.0" y="204.0" width="760.0" height="94.0" rx="8" fill="#f4f8fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="58.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">ПРОМІЖНИЙ КЛЮЧ ПІДПИСУ РЕЛІЗІВ (INTERMEDIATE / RELEASE SIGNING KEY)</text>
<text x="58.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Термін життя: 1–2 роки (регулярна ротація без зміни кремнієвого кореня)</text>
<text x="58.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зберігання: мережевий HSM сервера релізів або складального цеху</text>
<text x="58.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Призначення: підписує образи прошивок, маніфести та оновлення OTA</text>
<line x1="420.0" y1="300.0" x2="420.0" y2="334.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="520.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Підпис образу прошивки (.bin + signature)</text>
<rect x="40.0" y="336.0" width="760.0" height="68.0" rx="8" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="58.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">МІКРОКОНТРОЛЕР У ПОЛІ (SECURE BOOT eFUSE / ROM)</text>
<text x="58.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">У кремній (eFuse) прошито лише SHA-256 хеш ВІДКРИТОГО кореневого ключа; завантажувач перевіряє весь ланцюг</text>
</svg>