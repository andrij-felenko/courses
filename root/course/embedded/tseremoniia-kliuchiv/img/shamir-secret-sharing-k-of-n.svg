<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл секрету Шаміра: схема порогу (3 з 5)</text>
<rect x="40.0" y="150.0" width="180.0" height="80.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="2.0"/>
<text x="130.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">КОРЕНЕВИЙ СЕКРЕТ S</text>
<text x="130.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">P(0) = S</text>
<text x="130.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вільний член полінома</text>
<rect x="260.0" y="140.0" width="240.0" height="100.0" rx="6" fill="#fdfbf7" stroke="#d4a373" stroke-width="1.6"/>
<text x="380.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8c5820" text-anchor="middle" font-weight="700">Поліном степеня k − 1 = 2</text>
<text x="380.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">P(x) = S + a₁·x + a₂·x²  (mod p)</text>
<text x="380.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">a₁, a₂ — випадкові коефіцієнти</text>
<line x1="222.0" y1="190.0" x2="256.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="540.0" y="54.0" width="240.0" height="52.0" rx="5" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.4"/>
<text x="552.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Частка 1: (1, P(1))</text>
<text x="552.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Банківський сейф А</text>
<line x1="502.0" y1="190.0" x2="536.0" y2="80.0" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="540.0" y="116.0" width="240.0" height="52.0" rx="5" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.4"/>
<text x="552.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Частка 2: (2, P(2))</text>
<text x="552.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Технічний директор (CTO)</text>
<line x1="502.0" y1="190.0" x2="536.0" y2="142.0" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="540.0" y="178.0" width="240.0" height="52.0" rx="5" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.4"/>
<text x="552.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Частка 3: (3, P(3))</text>
<text x="552.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Керівник безпеки (CISO)</text>
<line x1="502.0" y1="190.0" x2="536.0" y2="204.0" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="540.0" y="240.0" width="240.0" height="52.0" rx="5" fill="#f8fafc" stroke="#6b7280" stroke-width="1.4"/>
<text x="552.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Частка 4: (4, P(4))</text>
<text x="552.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Банківський сейф Б</text>
<line x1="502.0" y1="190.0" x2="536.0" y2="266.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="540.0" y="302.0" width="240.0" height="52.0" rx="5" fill="#f8fafc" stroke="#6b7280" stroke-width="1.4"/>
<text x="552.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Частка 5: (5, P(5))</text>
<text x="552.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Зовнішній аудитор</text>
<line x1="502.0" y1="190.0" x2="536.0" y2="328.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40.0" y="276.0" width="460.0" height="76.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="270.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Властивість порогу безпеки:</text>
<text x="270.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Будь-які 3 частки однозначно відновлюють параболу і секрет S = P(0)</text>
<text x="270.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">• Будь-які 2 частки дають рівно нуль інформації про значення S</text>
</svg>