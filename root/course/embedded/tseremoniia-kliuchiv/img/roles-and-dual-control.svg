<text x="674.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Auditor / Independent Witnesses</text>
<line x1="570.0" y1="120.0" x2="778.0" y2="120.0" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="674.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Звіряють контрольні суми на екрані, пе</text>
<text x="674.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ревіряють цілісність пломб, підписують п</text>
<text x="674.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ротокол</text>
