<text x="410.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило двох осіб (Two-Person Rule / Split Knowledge)</text>
<text x="410.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Жодна людина самостійно не здатна згенерувати, експортувати або відновити кореневий ключ</text>
<text x="410.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Будь-яка дія над секретом вимагає фізичної присутності та кворуму k із n учасників</text>
