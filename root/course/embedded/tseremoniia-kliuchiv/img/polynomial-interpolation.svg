<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрична інтуїція схеми Шаміра: парабола крізь 3 точки</text>
<rect x="80.0" y="70.0" width="340.0" height="260.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<line x1="100.0" y1="310.0" x2="410.0" y2="310.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="402.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">x</text>
<line x1="110.0" y1="320.0" x2="110.0" y2="85.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="96.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">y</text>
<circle cx="110.0" cy="220.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="124.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">S = P(0)</text>
<path d="M 110 220 Q 220 310, 390 110" fill="none" stroke="#27ae60" stroke-width="2.4"/>
<circle cx="190.0" cy="262.0" r="4.5" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="190.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">(1, y1)</text>
<line x1="190.0" y1="262.0" x2="190.0" y2="310.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="3,3"/>
<circle cx="280.0" cy="232.0" r="4.5" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="280.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">(2, y2)</text>
<line x1="280.0" y1="232.0" x2="280.0" y2="310.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="3,3"/>
<circle cx="360.0" cy="152.0" r="4.5" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="360.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">(3, y3)</text>
<line x1="360.0" y1="152.0" x2="360.0" y2="310.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="450.0" y="70.0" width="290.0" height="260.0" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="595.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому k точок необхідні й достатні</text>
<text x="466.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ступінь полінома d = k − 1 = 2</text>
<text x="466.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Для однозначного відновлення</text>
<text x="466.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">параболи необхідно рівно 3 точки.</text>
<text x="466.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Маючи 3 точки: інтерполяційний</text>
<text x="466.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">поліном Лагранжа дає точний S.</text>
<text x="466.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Маючи лише 2 точки: крізь них</text>
<text x="466.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">проходить нескінченна кількість</text>
<text x="466.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">парабол із БУДЬ-ЯКИМ значенням S.</text>
<text x="466.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Інформаційна ентропія = 0 біт.</text>
</svg>