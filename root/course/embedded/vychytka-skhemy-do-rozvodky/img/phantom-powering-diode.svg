<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм паразитного живлення (Phantom Powering) через захисні діоди</text>
<rect x="40.0" y="70.0" width="160.0" height="190.0" rx="5" fill="#eaf2f8" stroke="#333333" stroke-width="1.5"/>
<text x="120.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Активний пристрій</text>
<text x="120.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">(VDD_EXT = 3.3 В)</text>
<text x="120.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Вихідний пін TX/GPIO
рівень ЛОГ. 1 (+3.3 В)</text>
<line x1="200.0" y1="180.0" x2="370.0" y2="180.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="260.0" y1="180.0" x2="290.0" y2="180.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="285.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">I_leak (струм витоку)</text>
<rect x="370.0" y="55.0" width="350.0" height="220.0" rx="5" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="545.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Знеструмлений МК (VDD_MCU вимкнено)</text>
<circle cx="370.0" cy="180.0" r="4.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<text x="395.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">RX / GPIO</text>
<line x1="460.0" y1="110.0" x2="680.0" y2="110.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4 2"/>
<text x="620.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Внутрішня шина VDD</text>
<text x="620.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">U_vdd ≈ 3.3 В − 0.6 В = 2.7 В!</text>
<line x1="460.0" y1="250.0" x2="680.0" y2="250.0" stroke="#333333" stroke-width="2.0"/>
<text x="620.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Шина GND (0 В)</text>
<line x1="460.0" y1="180.0" x2="460.0" y2="140.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="460.0" y1="160.0" x2="460.0" y2="135.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<polygon points="452,140 468,140 460,126" fill="#c0392b" stroke="#333333" stroke-width="1.2"/>
<line x1="452.0" y1="126.0" x2="468.0" y2="126.0" stroke="#333333" stroke-width="1.5"/>
<line x1="460.0" y1="126.0" x2="460.0" y2="110.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="505.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">ESD діод
(відкритий)</text>
<line x1="460.0" y1="180.0" x2="460.0" y2="205.0" stroke="#333333" stroke-width="1.5"/>
<polygon points="452,220 468,220 460,205" fill="#fff" stroke="#333333" stroke-width="1.2"/>
<line x1="452.0" y1="205.0" x2="468.0" y2="205.0" stroke="#333333" stroke-width="1.5"/>
<line x1="460.0" y1="220.0" x2="460.0" y2="250.0" stroke="#333333" stroke-width="1.5"/>
<text x="505.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ESD діод
(закритий)</text>
<line x1="560.0" y1="110.0" x2="560.0" y2="165.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="545.0" y1="165.0" x2="575.0" y2="165.0" stroke="#333333" stroke-width="2.0"/>
<line x1="545.0" y1="173.0" x2="575.0" y2="173.0" stroke="#333333" stroke-width="2.0"/>
<line x1="560.0" y1="173.0" x2="560.0" y2="250.0" stroke="#333333" stroke-width="1.5"/>
<text x="595.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">C_decoupling
(заряджається)</text>
<rect x="40.0" y="285.0" width="680.0" height="45.0" rx="4" fill="#fdedec" stroke="#c0392b" stroke-width="1.2"/>
<text x="380.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">НАСЛІДКИ: 1) МК починає хаотично стартувати на заниженій напрузі 2.7 В (нестабільний Brown-out).</text>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">2) Перегрів або пробій ESD-діода струмом усього ядра. 3) Ризик тригерного ефекту (Latch-up).</text>
</svg>