<rect x="575.0" y="165.0" width="250.0" height="175.0" rx="6" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.5"/><text x="700.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">СМЕРТЕЛЬНА ПЛУТАНИНА:</tspan><tspan x="700.0" dy="13.0">На танталових SMD-конденсаторах смужка</tspan><tspan x="700.0" dy="13.0">позначає ПОЗИТИВНИЙ вивід (+).</tspan><tspan x="700.0" dy="13.0">На алюмінієвих SMD/DIP — НЕГАТИВНИЙ (−).</tspan><tspan x="700.0" dy="13.0"></tspan><tspan x="700.0" dy="13.0">Запаяний навпаки тантал вибухає або</tspan><tspan x="700.0" dy="13.0">йде в коротке замикання з вогнем</tspan><tspan x="700.0" dy="13.0">у перші ж секунди подачі живлення.</tspan></text>
