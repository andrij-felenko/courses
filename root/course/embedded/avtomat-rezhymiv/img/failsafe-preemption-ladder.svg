<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сходинка пріоритетів і витіснення аварійних режимів польотного автомата</text>
<rect x="20.0" y="20.0" width="920.0" height="480.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="480.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія пріоритетів та арбітраж польотного автомата</text>
<text x="480.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Вищий рівень миттєво витісняє нижчий; повернення керування вимагає явного квитування</text>
<rect x="45.0" y="110.0" width="50.0" height="362.0" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
<line x1="70.0" y1="450.0" x2="70.0" y2="130.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="70.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">MIN</text>
<text x="70.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">MAX</text>
<rect x="110.0" y="110.0" width="810.0" height="62.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
<text x="130.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">РІВЕНЬ 5: АВАРІЙНИЙ ВІДСТРІЛ (HARDWARE KILL / TERMINATE)</text>
<text x="130.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Знеструмлення моторів, закриття ШІМ, розкриття парашута. Абсолютний пріоритет над усім софтом.</text>
<rect x="110.0" y="185.0" width="810.0" height="62.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.8"/>
<text x="130.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="start" font-weight="700">РІВЕНЬ 4: КРИТИЧНИЙ FAILSAFE (CRITICAL BATTERY / EKF COLLAPSE)</text>
<text x="130.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Примусовий Land або аварійна посадка. Негайно перехоплює керування, блокує місію та GCS.</text>
<rect x="110.0" y="260.0" width="810.0" height="62.0" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.8"/>
<text x="130.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a16207" text-anchor="start" font-weight="700">РІВЕНЬ 3: НАВІГАЦІЙНИЙ FAILSAFE (RC LOSS / GCS TIMEOUT / GEOFENCE)</text>
<text x="130.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Активація RTL або автоповернення по треку. Автономне повернення в зону безпеки.</text>
<rect x="110.0" y="335.0" width="810.0" height="62.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="130.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">РІВЕНЬ 2: РУЧНЕ ПЕРЕХОПЛЕННЯ ОПЕРАТОРА (MANUAL OVERRIDE / STICK FLICK)</text>
<text x="130.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Рух стіків пілота в Stabilize/Manual негайно скасовує Auto/Guided (Pilot Priority Interlock).</text>
<rect x="110.0" y="410.0" width="810.0" height="62.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.8"/>
<text x="130.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">РІВЕНЬ 1: ШТАТНІ ЗАПИТИ ОПЕРАТОРА ТА GCS (POSHOLD / AUTO / GUIDED)</text>
<text x="130.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Зміна режиму перемикачем або командою MAVLink. Виконується лише за виконання всіх охоронців.</text>
</svg>