<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність верифікації охоронців та захисту від заборонених стрибків</text>
<rect x="20.0" y="20.0" width="920.0" height="520.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="480.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм перевірки умов-охоронців та захисту від заборонених стрибків</text>
<rect x="73.9" y="93.1" width="172.2" height="53.8" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="160.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1. ЗАПИТ ЗМІНИ РЕЖИМУ</tspan><tspan x="160.0" dy="13.7">RC перемикач або MAVLink</tspan><tspan x="160.0" dy="13.7">(SET_MODE / DO_SET_MODE)</tspan></text>
<line x1="260.0" y1="120.0" x2="330.0" y2="120.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="339.4" y="93.1" width="211.3" height="53.8" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="445.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">2. ЧИ АКТИВНИЙ FAILSAFE?</tspan><tspan x="445.0" dy="13.7">Якщо активна критична аварія —</tspan><tspan x="445.0" dy="13.7">запит оператора відкидається</tspan></text>
<line x1="445.0" y1="160.0" x2="445.0" y2="230.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">ТАК (Блокування)</text>
<rect x="349.1" y="241.0" width="191.8" height="48.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="445.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">ВІДХИЛЕННЯ (DENIED)</tspan><tspan x="445.0" dy="13.0">Збереження поточного Failsafe</tspan><tspan x="445.0" dy="13.0">Відправка STATUSTEXT у GCS</tspan></text>
<line x1="560.0" y1="120.0" x2="630.0" y2="120.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="595.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="700">НІ</text>
<rect x="653.1" y="93.1" width="243.8" height="53.8" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="775.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">3. ПЕРЕВІРКА ОХОРОНЦІВ</tspan><tspan x="775.0" dy="13.7">GNSS Fix, HDOP &lt; 1.5, EKF валідний,</tspan><tspan x="775.0" dy="13.7">Місія завантажена, Home закріплено</tspan></text>
<line x1="775.0" y1="165.0" x2="775.0" y2="230.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="780.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">НІ (Помилка передумов)</text>
<rect x="703.9" y="241.0" width="142.2" height="48.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="775.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">ВІДХИЛЕННЯ ЗАПИТУ</tspan><tspan x="775.0" dy="13.0">Код MAV_RESULT_DENIED</tspan><tspan x="775.0" dy="13.0">Попередження пілоту</tspan></text>
<line x1="775.0" y1="305.0" x2="775.0" y2="370.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="780.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="start" font-weight="700">ТАК (Охоронці OK)</text>
<rect x="620.5" y="393.1" width="308.9" height="53.8" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="775.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">4. АНТИСТРИБКОВИЙ ЗАХИСТ</tspan><tspan x="775.0" dy="13.7">Якщо перехід з Land/PosHold -&gt; Manual:</tspan><tspan x="775.0" dy="13.7">чи нейтралізовано стік газу (Throttle Match)?</tspan></text>
<line x1="645.0" y1="420.0" x2="545.0" y2="420.0" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="595.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ca8a04" text-anchor="middle" font-weight="700">НЕ В ЗОНІ</text>
<rect x="296.2" y="396.0" width="247.6" height="48.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="420.0" y="410.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">ОЧІКУВАННЯ НЕЙТРАЛІЗАЦІЇ</tspan><tspan x="420.0" dy="13.0">Режим не змінюється доки оператор</tspan><tspan x="420.0" dy="13.0">не зведе стік газу з поточним дроселем</tspan></text>
<line x1="775.0" y1="470.0" x2="775.0" y2="500.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="775.0" y1="500.0" x2="200.0" y2="500.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200.0" y1="500.0" x2="200.0" y2="460.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="78.1" y="393.1" width="243.8" height="53.8" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2.0"/><text x="200.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">5. АТОМАРНЕ ПЕРЕМИКАННЯ</tspan><tspan x="200.0" dy="13.7">Ініціалізація нових контролерів,</tspan><tspan x="200.0" dy="13.7">скидання інтеграторів PID без ривка</tspan></text>
</svg>