<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сценарій апаратного блокування відлагоджувача SWD</text>
<text x="210.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Штатний режим: SWD активний</text>
<rect x="30.0" y="55.0" width="140.0" height="50.0" rx="6" fill="#f0f4f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="100.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Програматор</tspan><tspan x="100.0" dy="14.3">ST-Link / J-Link</tspan></text>
<rect x="250.0" y="55.0" width="140.0" height="50.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">Cortex-M Ядро</tspan><tspan x="320.0" dy="14.3">(Debug Port)</tspan></text>
<line x1="170.0" y1="70.0" x2="250.0" y2="70.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="210.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">SWDIO (PA13)</text>
<line x1="170.0" y1="90.0" x2="250.0" y2="90.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="210.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">SWCLK (PA14)</text>
<rect x="30.0" y="130.0" width="360.0" height="70.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="155.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. Прошивка стартує після скидання (Reset).</tspan><tspan x="210.0" dy="13.0">2. Виконується код за замовчуванням.</tspan><tspan x="210.0" dy="13.0">3. Налагоджувач вільно читає та прошиває пам'ять.</tspan></text>
<line x1="420.0" y1="25.0" x2="420.0" y2="220.0" stroke="#dcdcdc" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="630.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Конфлікт: захоплення під GPIO</text>
<rect x="440.0" y="55.0" width="130.0" height="50.0" rx="6" fill="#f4f4f4" stroke="#6b7280" stroke-width="1.5"/><text x="505.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="505.0" dy="0.0">Програматор</tspan><tspan x="505.0" dy="14.3">ST-Link</tspan></text>
<rect x="670.0" y="55.0" width="140.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Силове реле / LED</tspan><tspan x="740.0" dy="14.3">(GPIO Output)</tspan></text>
<line x1="570.0" y1="70.0" x2="615.0" y2="70.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="615.0" y1="62.0" x2="629.0" y2="78.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="629.0" y1="62.0" x2="615.0" y2="78.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="630.0" y1="70.0" x2="670.0" y2="70.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="622.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">PA13 перемкнуто на вихід!</text>
<rect x="440.0" y="130.0" width="370.0" height="85.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="625.0" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="625.0" dy="0.0">1. Користувач призначив PA13/PA14 під звичайний GPIO.</tspan><tspan x="625.0" dy="11.7">2. Через 50 мкс після старту SWD-інтерфейс вимикається.</tspan><tspan x="625.0" dy="11.7">3. Програматор видає 'Cannot connect to target'.</tspan><tspan x="625.0" dy="11.7">4. Потрібно Connect Under Reset або вхід у Bootloader через BOOT0.</tspan></text>
<rect x="60.0" y="240.0" width="720.0" height="65.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="420.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">ПРАВИЛО БЕЗПЕКИ РОЗПІНОВКИ:</tspan><tspan x="420.0" dy="13.7">Не призначайте лінії налагодження (SWDIO/SWCLK) під загальні GPIO,</tspan><tspan x="420.0" dy="13.7">якщо на платі немає виведеної апаратної лінії скидання (NRST) або піна BOOT0.</tspan></text>
<text x="420.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перепризначення виводів SWD блокує зв'язок із чипом одразу після виконання перших інструкцій.</text>
</svg>