<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вплив швидкості перемикання GPIO (Slew Rate) на шум та електромагнітні завади</text>
<text x="210.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Низька швидкість (Low Speed / Slew Rate Limit)</text>
<rect x="40.0" y="50.0" width="340.0" height="255.0" rx="6" fill="#fafdfa" stroke="#27ae60" stroke-width="1.5"/>
<text x="80.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Форма сигналу (Осцилограф):</text>
<line x1="70.0" y1="160.0" x2="110.0" y2="160.0" stroke="#27ae60" stroke-width="2.5"/><line x1="110.0" y1="160.0" x2="140.0" y2="100.0" stroke="#27ae60" stroke-width="2.5"/><line x1="140.0" y1="100.0" x2="200.0" y2="100.0" stroke="#27ae60" stroke-width="2.5"/><line x1="200.0" y1="100.0" x2="230.0" y2="160.0" stroke="#27ae60" stroke-width="2.5"/><line x1="230.0" y1="160.0" x2="280.0" y2="160.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="125.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">tr ≈ 30 нс</text>
<text x="180.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Чистий сигнал без викидів</text>
<rect x="55.0" y="195.0" width="310.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="227.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">• Струм перезаряджання ємності траси малий.</tspan><tspan x="210.0" dy="12.3">• Практично відсутній високочастотний спектр EMI.</tspan><tspan x="210.0" dy="12.3">• Відсутній дзвін (ringing) та Ground Bounce.</tspan><tspan x="210.0" dy="12.3">• Ідеально для LED, кнопок, I2C (100–400 кГц), UART.</tspan></text>
<text x="630.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Максимальна швидкість (Very High Speed)</text>
<rect x="460.0" y="50.0" width="340.0" height="255.0" rx="6" fill="#fdfafa" stroke="#c0392b" stroke-width="1.5"/>
<text x="500.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Форма сигналу (Осцилограф):</text>
<line x1="490.0" y1="160.0" x2="520.0" y2="160.0" stroke="#c0392b" stroke-width="2.5"/><line x1="520.0" y1="160.0" x2="524.0" y2="80.0" stroke="#c0392b" stroke-width="2.5"/><line x1="524.0" y1="80.0" x2="532.0" y2="115.0" stroke="#c0392b" stroke-width="2.5"/><line x1="532.0" y1="115.0" x2="540.0" y2="92.0" stroke="#c0392b" stroke-width="2.5"/><line x1="540.0" y1="92.0" x2="548.0" y2="104.0" stroke="#c0392b" stroke-width="2.5"/><line x1="548.0" y1="104.0" x2="600.0" y2="100.0" stroke="#c0392b" stroke-width="2.5"/><line x1="600.0" y1="100.0" x2="604.0" y2="180.0" stroke="#c0392b" stroke-width="2.5"/><line x1="604.0" y1="180.0" x2="612.0" y2="145.0" stroke="#c0392b" stroke-width="2.5"/><line x1="612.0" y1="145.0" x2="620.0" y2="168.0" stroke="#c0392b" stroke-width="2.5"/><line x1="620.0" y1="168.0" x2="660.0" y2="160.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="540.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">tr &lt; 2 нс (Дзвін!)</text>
<text x="585.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">Викиди вище VDD та нижче GND</text>
<rect x="475.0" y="195.0" width="310.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="630.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">• Величезний піковий струм перемикання транзисторів.</tspan><tspan x="630.0" dy="11.7">• Потужні гармоніки до сотень МГц (радіозавади EMI).</tspan><tspan x="630.0" dy="11.7">• Перехресні наводки (crosstalk) на сусідні аналогові траси.</tspan><tspan x="630.0" dy="11.7">• Потрібно ЛИШЕ для SPI &gt; 20 МГц, SDIO, паралельних шин.</tspan></text>
<text x="420.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило налаштування OSPEEDR: ставте найменшу швидкість, при якій інтерфейс працює надійно.</text>
</svg>