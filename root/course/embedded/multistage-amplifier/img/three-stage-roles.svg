<rect x="315.0" y="95.0" width="190.0" height="120.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="410.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскад підсилення</text><rect x="323.0" y="133.0" width="174.0" height="72.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="410.0" y="158.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="410.0" dy="0.0">велике підсилення</tspan><tspan x="410.0" dy="14.3">напруги A</tspan><tspan x="410.0" dy="14.3">(головна ланка)</tspan></text>
<rect x="590.0" y="95.0" width="190.0" height="120.0" rx="8" fill="#eef7ef" stroke="#27ae60" stroke-width="1.8"/><text x="685.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідний буфер</text><rect x="598.0" y="133.0" width="174.0" height="72.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="685.0" y="158.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="685.0" dy="0.0">низький Rout</tspan><tspan x="685.0" dy="14.3">живить навантаження</tspan><tspan x="685.0" dy="14.3">підсилення ×1</tspan></text>
