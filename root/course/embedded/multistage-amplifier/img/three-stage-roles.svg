<rect x="40.0" y="245.0" width="740.0" height="40.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="269.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Підсилення живе лише в середній ланці; крайні ланки узгоджують опори, щоб стики не з'їдали сигнал.</tspan></text>
