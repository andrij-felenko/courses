<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура пакета LoRa та розрахунок часу передачі преамбули й корисних даних</text>
<text x="450.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура фізичного пакета LoRa та розподіл часу в ефірі (Time-on-Air)</text>
<rect x="30.0" y="70.0" width="280.0" height="150.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="170.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ПРЕАМБУЛА (Preamble)</text>
<text x="170.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Синхронізація AGC, AFC, Symbol Timing</text>
<rect x="45.0" y="130.0" width="115.0" height="70.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="102.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">N_preamble</text>
<text x="102.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Up-chirps (тип. 8)</text>
<rect x="165.0" y="130.0" width="70.0" height="70.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="200.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Sync</text>
<text x="200.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 симв.</text>
<rect x="240.0" y="130.0" width="60.0" height="70.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="270.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SFD</text>
<text x="270.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2.25</text>
<rect x="325.0" y="70.0" width="155.0" height="150.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="402.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">ЗАГОЛОВОК</text>
<text x="402.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Explicit / Implicit (H)</text>
<rect x="340.0" y="130.0" width="125.0" height="70.0" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
<text x="402.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Довжина PL</text>
<text x="402.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Coding Rate (CR)</text>
<text x="402.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Header CRC</text>
<rect x="495.0" y="70.0" width="255.0" height="150.0" rx="6" fill="#f0fdf4" stroke="#c0392b" stroke-width="1.8"/>
<text x="622.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">КОРИСНІ ДАНІ (Payload)</text>
<text x="622.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">PL = 1 .. 255 байтів (Hamming FEC)</text>
<rect x="510.0" y="130.0" width="225.0" height="70.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="622.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">N_payload символів</text>
<text x="622.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Враховує CR, LDRO (DE), SF</text>
<rect x="765.0" y="70.0" width="110.0" height="150.0" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
<text x="820.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#db2777" text-anchor="middle" font-weight="700">CRC</text>
<text x="820.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">16 біт</text>
<rect x="775.0" y="130.0" width="90.0" height="70.0" rx="4" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.2"/>
<text x="820.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Payload CRC</text>
<text x="820.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Опція (CRC=1)</text>
<rect x="30.4" y="259.5" width="279.2" height="31.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">T_preamble = (N_preamble + 4.25) · T_s</tspan></text>
<rect x="519.9" y="259.5" width="204.1" height="31.0" rx="6" fill="#f0fdf4" stroke="#c0392b" stroke-width="1.5"/><text x="622.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="622.0" dy="0.0">T_payload = N_payload · T_s</tspan></text>
<rect x="146.7" y="319.5" width="606.5" height="31.0" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="338.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Time-on-Air (ToA) = T_preamble + T_payload = (N_pream_total + N_payload) · (2^SF / BW)</tspan></text>
</svg>