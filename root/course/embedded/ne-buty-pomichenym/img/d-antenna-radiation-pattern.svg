<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420">
<rect x="0.0" y="0.0" width="820.0" height="420.0" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Просторова фільтрація: всеспрямований диполь проти спрямованої антени</text>
<text x="200.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">А. Всеспрямована антена (диполь)</text>
<circle cx="200" cy="200" r="80" fill="#fde8e8" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="200.0" cy="200.0" r="4.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="200.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Випромінювання на 360° (G ≈ 2.1 dBi)</text>
<text x="200.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Помітність для РЕР однакова в усіх напрямках</text>
<text x="200.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпечний сектор загрози: 360° (повне коло)</text>
<line x1="400.0" y1="60.0" x2="400.0" y2="390.0" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="590.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Б. Спрямована антена (Patch / Yagi)</text>
<path d="M 590 200 C 640 155, 730 175, 740 200 C 730 225, 640 245, 590 200 Z" fill="#e8f8f0" stroke="#27ae60" stroke-width="2.0"/>
<path d="M 590 200 C 600 160, 580 155, 585 165 C 590 175, 590 190, 590 200 Z" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<path d="M 590 200 C 600 240, 580 245, 585 235 C 590 225, 590 210, 590 200 Z" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<path d="M 590 200 C 570 185, 560 190, 558 200 C 560 210, 570 215, 590 200 Z" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="590.0" cy="200.0" r="4.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="690.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Головний промінь (G_main = +14 dBi)</text>
<text x="690.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кут променя θ_3dB ≈ 30°</text>
<text x="505.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Бокові пелюстки (SLR ≤ -15 дБ)</text>
<text x="485.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Задня пелюстка (F/B ≥ 25 дБ)</text>
<text x="590.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Поза головним променем дальність РЕР падає в 4–10 разів</text>
<text x="590.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сектор загрози звужено з 360° до ~30° (у 12 разів)</text>
</svg>