<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічний розрахунок RTO: адаптація до затримок і фільтр Карна</text>
<text x="490.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">згладжування середнього RTT, облік джитеру та запобігання хибним замірам при повторах</text>
<rect x="40.0" y="75.0" width="430.0" height="355.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="255.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм Якобсона (Цілочисельний)</text>
<text x="60.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">1. Похибка виміру (Error):</text>
<text x="75.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Err = SampleRTT − SRTT</text>
<text x="60.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">2. Згладжений RTT (α = 1/8):</text>
<text x="75.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">SRTT += Err &gt;&gt; 3</text>
<text x="60.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">3. Варіація затримки (β = 1/4):</text>
<text x="75.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">|Err| = abs(Err)</text>
<text x="75.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">RTTVAR += (|Err| − RTTVAR) &gt;&gt; 2</text>
<text x="60.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">4. Підсумковий таймаут безпеки:</text>
<text x="75.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">RTO = SRTT + 4 · RTTVAR</text>
<text x="60.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">5. Обмеження діапазону:</text>
<text x="75.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">RTO = clamp(RTO, MIN_RTO, MAX_RTO)</text>
<text x="255.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Зсуви &gt;&gt;3 і &gt;&gt;2 виключають ділення на МК без FPU</text>
<rect x="490.0" y="75.0" width="450.0" height="355.0" rx="8" fill="#fffefb" stroke="#c0392b" stroke-width="1.5"/>
<text x="715.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Алгоритм Карна: неоднозначність повтору</text>
<text x="510.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Проблема неоднозначності ACK:</text>
<text x="520.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Коли кадр передано двічі (через таймаут), а потім приходить ACK, невідомо: це ACK на першу чи на другу спробу?</text>
<text x="510.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Хибний замір RTT:</text>
<text x="520.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Якщо на 1-шу → RTT вийде штучно завищеним.</text>
<text x="520.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Якщо на 2-гу → RTT вийде штучно заниженим.</text>
<text x="510.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Правило Карна №1 (Фільтрація):</text>
<text x="520.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">НЕ оновлювати SRTT та RTTVAR для кадрів, які зазнали хоча б однієї ретрансмісії.</text>
<text x="510.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Правило Карна №2 (Backoff):</text>
<text x="520.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">При кожному повторі подвоювати таймаут: RTO = min(2 · RTO, MAX_RTO) до першого успішного пакету без повторів.</text>
</svg>