<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Колізія номерів: чому розмір вікна обмежений модулем лічильника</text>
<text x="480.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">приклад для 2-бітного лічильника (модуль M=4, номери 0..3) за втрати всіх квитанцій</text>
<rect x="40.0" y="70.0" width="880.0" height="180.0" rx="8" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<text x="60.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Go-Back-N: помилка вибору W = M = 4 замість дозволеного W ≤ M − 1 = 3</text>
<text x="60.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. TX надсилає вікно кадрів: [0, 1, 2, 3]</text>
<text x="60.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. RX успішно приймає 0, 1, 2, 3 і зсуває очікуване вікно на нове коло: очікує наступний кадр [0]</text>
<text x="60.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">3. УСІ квитанції ACK 0..3 губляться на зворотному шляху через заваду</text>
<text x="60.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4. TX не отримує жодного ACK, таймер спливає, TX повторює СТАРИЙ кадр 0</text>
<text x="60.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">❌ КАТАСТРОФА: RX очікує новий кадр 0, отримує старий дублікат 0 і приймає його за нові дані!</text>
<text x="60.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">✔ Правило GBN: W ≤ 2^k − 1. Для 2 бітів W_max = 3. Тоді повтор 0 лежить за межами очікуваного вікна.</text>
<rect x="40.0" y="270.0" width="880.0" height="180.0" rx="8" fill="#f9fbfd" stroke="#2457d6" stroke-width="1.5"/>
<text x="60.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Selective Repeat: вимога симетрії W_send = W_recv ≤ M / 2 = 2^(k−1)</text>
<text x="60.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. При M=4 оберемо помилкове вікно W = 3 &gt; M/2. TX надсилає кадри 0, 1, 2.</text>
<text x="60.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. RX успішно приймає 0, 1, 2, віддає програмі й зсуває своє вікно прийому на [3, 0, 1].</text>
<text x="60.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">3. ACK 0 загубився в каналі. TX за таймаутом надсилає ПОВТОР старого кадру 0.</text>
<text x="60.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">4. Нове вікно RX [3, 0, 1] містить номер 0! RX сприймає старий кадр 0 як майбутній кадр 0 другого кола.</text>
<text x="60.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">❌ КАТАСТРОФА: змішування попереднього і наступного циклів через перекриття вікон.</text>
<text x="60.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">✔ Правило SR: W_send + W_recv ≤ 2^k. При однакових вікнах W_max = 2^(k−1) = 2 (для k=2).</text>
</svg>