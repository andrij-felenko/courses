<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченні автомати (FSM) передавача і приймача ARQ</text>
<text x="510.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">обробка відправки, квитанцій, таймаутів, дублікатів та переходу станів</text>
<rect x="30.0" y="70.0" width="465.0" height="400.0" rx="8" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="262.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">FSM Передавача (TX)</text>
<rect x="70.0" y="130.0" width="150.0" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="145.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">TX_IDLE</text>
<rect x="280.0" y="130.0" width="180.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="370.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">TX_WAIT_ACK</text>
<rect x="280.0" y="270.0" width="180.0" height="48.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="370.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">TX_RETRANSMIT</text>
<rect x="70.0" y="270.0" width="150.0" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<text x="145.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">TX_FAILED</text>
<line x1="220.0" y1="146.0" x2="280.0" y2="146.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">send()</text>
<line x1="280.0" y1="162.0" x2="220.0" y2="162.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">ACK ok</text>
<line x1="370.0" y1="178.0" x2="370.0" y2="270.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="378.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">RTO / NACK</text>
<line x1="350.0" y1="270.0" x2="350.0" y2="178.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="342.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="end">повтор кадру</text>
<line x1="280.0" y1="294.0" x2="220.0" y2="294.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">ліміт спроб</text>
<line x1="145.0" y1="270.0" x2="145.0" y2="178.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="138.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">скидання помилки</text>
<text x="262.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керування таймером:</text>
<text x="262.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• При відправці: запуск таймера RTO, лічильник спроб = 0</text>
<text x="262.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• При валідному ACK: зупинка таймера, зсув вікна</text>
<text x="262.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• При таймауті: лічильник++, RTO *= 2 (backoff), перепосилання</text>
<rect x="525.0" y="70.0" width="465.0" height="400.0" rx="8" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="757.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">FSM Приймача (RX)</text>
<rect x="660.0" y="130.0" width="195.0" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="757.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">RX_WAIT_FRAME</text>
<rect x="550.0" y="250.0" width="180.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="640.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">RX_PROCESS</text>
<rect x="780.0" y="250.0" width="185.0" height="48.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="872.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">RX_DUPLICATE</text>
<line x1="710.0" y1="178.0" x2="640.0" y2="250.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="695.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Seq == Exp (CRC ok)</text>
<line x1="610.0" y1="250.0" x2="670.0" y2="178.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="end">віддати в App, ACK</text>
<line x1="790.0" y1="178.0" x2="860.0" y2="250.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="805.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-weight="700">Seq &lt; Exp (Дублікат)</text>
<line x1="890.0" y1="250.0" x2="830.0" y2="178.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="900.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">скинути дані, ACK ще раз</text>
<text x="757.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логіка надійності при втраті ACK:</text>
<text x="757.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1. Кадр прийшов, але ACK загубився → TX шле повтор.</text>
<text x="757.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2. RX бачить старий Seq → НЕ віддає в App вдруге (захист).</text>
<text x="757.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3. RX ПОВТОРНО надсилає ACK → TX нарешті виходить із зависання.</text>
</svg>