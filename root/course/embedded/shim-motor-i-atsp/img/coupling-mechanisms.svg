<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шляхи проникнення ШІМ-завад у вимірювальний тракт</text>
<rect x="20.0" y="60.0" width="245.0" height="375.0" rx="8" fill="#fff8f7" stroke="#c0392b" stroke-width="1.8"/>
<rect x="30.0" y="72.0" width="225.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="142.5" y="88.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="142.5" dy="0.0">1. Спільний імпеданс</tspan><tspan x="142.5" dy="18.2">(Кондуктивний)</tspan></text>
<rect x="45.0" y="130.0" width="70.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="80.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_BAT</text>
<rect x="165.0" y="130.0" width="80.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="205.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">H-міст</text>
<text x="205.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">+ Мотор</text>
<rect x="165.0" y="215.0" width="80.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="193.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Давач</text>
<text x="205.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">+ АЦП</text>
<line x1="115.0" y1="140.0" x2="165.0" y2="140.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="80.0" y1="165.0" x2="80.0" y2="300.0" stroke="#333333" stroke-width="1.5"/>
<line x1="80.0" y1="300.0" x2="205.0" y2="300.0" stroke="#333333" stroke-width="2.0"/>
<line x1="205.0" y1="180.0" x2="205.0" y2="300.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="205.0" y1="265.0" x2="205.0" y2="300.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="110.0" y="290.0" width="65.0" height="20.0" rx="6" fill="#fff275" stroke="#333333" stroke-width="1.2"/>
<text x="142.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">R_gnd, L_gnd</text>
<line x1="190.0" y1="295.0" x2="100.0" y2="295.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="145.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I_мотора (di/dt)</text>
<rect x="30.0" y="330.0" width="225.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="142.5" y="342.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="142.5" dy="0.0">Спільна доріжка землі:</tspan><tspan x="142.5" dy="15.6">V_шум = I·R + L·(di/dt)</tspan><tspan x="142.5" dy="15.6"></tspan><tspan x="142.5" dy="15.6">Стрибок струму на L_gnd</tspan><tspan x="142.5" dy="15.6">зміщує опорний рівень АЦП</tspan><tspan x="142.5" dy="15.6">на сотні мілівольтів.</tspan></text>
<rect x="290.0" y="60.0" width="245.0" height="375.0" rx="8" fill="#fdfefe" stroke="#2457d6" stroke-width="1.8"/>
<rect x="300.0" y="72.0" width="225.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="412.5" y="88.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="412.5" dy="0.0">2. Ємнісний зв'язок</tspan><tspan x="412.5" dy="18.2">(Наводка dV/dt)</tspan></text>
<rect x="315.0" y="135.0" width="195.0" height="36.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="412.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Силова фаза (ШІМ: 0 → 24 В)</text>
<line x1="412.0" y1="171.0" x2="412.0" y2="205.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="390.0" y1="205.0" x2="434.0" y2="205.0" stroke="#333333" stroke-width="2.0"/>
<line x1="390.0" y1="213.0" x2="434.0" y2="213.0" stroke="#333333" stroke-width="2.0"/>
<text x="465.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">C_пар (1–5 пФ)</text>
<line x1="412.0" y1="213.0" x2="412.0" y2="245.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="315.0" y="245.0" width="195.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="412.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Аналогова доріжка (R_вх &gt; 10 кОм)</text>
<line x1="400.0" y1="175.0" x2="400.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="355.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I_disp</text>
<rect x="300.0" y="330.0" width="225.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="412.5" y="342.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="412.5" dy="0.0">Струм через паразитну ємність:</tspan><tspan x="412.5" dy="15.6">I_disp = C_пар · (dV/dt)</tspan><tspan x="412.5" dy="15.6"></tspan><tspan x="412.5" dy="15.6">На високому опорі R_вх</tspan><tspan x="412.5" dy="15.6">струм породжує сплески</tspan><tspan x="412.5" dy="15.6">напруги до десятків вольт.</tspan></text>
<rect x="560.0" y="60.0" width="245.0" height="375.0" rx="8" fill="#f9fbf9" stroke="#27ae60" stroke-width="1.8"/>
<rect x="570.0" y="72.0" width="225.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="682.5" y="88.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="682.5" dy="0.0">3. Індуктивний зв'язок</tspan><tspan x="682.5" dy="18.2">(Магнітне поле петлі)</tspan></text>
<rect x="585.0" y="130.0" width="195.0" height="60.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="682.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Силова петля мотора</text>
<text x="682.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Велика площа A₁ · Струм di/dt</text>
<line x1="600.0" y1="180.0" x2="760.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="640.0" cy="220.0" r="14.0" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<text x="640.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">B(t)</text>
<circle cx="725.0" cy="220.0" r="14.0" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<text x="725.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">B(t)</text>
<text x="682.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Взаємна індукція M</text>
<rect x="585.0" y="250.0" width="195.0" height="55.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="682.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Контур сигналу давача</text>
<text x="682.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">Петля площею A₂ до АЦП</text>
<rect x="570.0" y="330.0" width="225.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="682.5" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Наведена ЕРС у контурі:</tspan><tspan x="682.5" dy="14.3">V_ind = -M · (di/dt)</tspan><tspan x="682.5" dy="14.3"></tspan><tspan x="682.5" dy="14.3">Змінний магнітний потік</tspan><tspan x="682.5" dy="14.3">від силових провідників наводить</tspan><tspan x="682.5" dy="14.3">ЕРС прямо в сигнальну петлю.</tspan></text>
</svg>