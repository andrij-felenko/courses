<rect x="440.0" y="320.0" width="340.0" height="105.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="347.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Чистий результат:</tspan><tspan x="610.0" dy="14.3">1. Силовий поворотний струм PGND замикається</tspan><tspan x="610.0" dy="14.3">   на конденсатор живлення, не заходячи в AGND.</tspan><tspan x="610.0" dy="14.3">2. Аналогова земля AGND під'єднана в одній точці.</tspan><tspan x="610.0" dy="14.3">3. Диференційні лінії Кельвіна усувають падіння.</tspan></text>
