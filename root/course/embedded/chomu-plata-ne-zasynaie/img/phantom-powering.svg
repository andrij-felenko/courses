<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паразитне живлення вимкненої периферії через ESD-діоди</text>
<rect x="10.0" y="10.0" width="760.0" height="380.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="390.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паразитне живлення (Phantom Powering) через ESD-діод датчика</text>
<rect x="30.0" y="60.0" width="210.0" height="220.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="135.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікроконтролер</text>
<text x="135.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Живлення VDD = 3.3 В (ON)</text>
<rect x="45.0" y="125.0" width="180.0" height="135.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="135.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка конфігурації:</text>
<text x="135.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">GPIO TX / MOSI / SDA</text>
<text x="135.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">залишено в стані HIGH</text>
<rect x="55.0" y="200.0" width="160.0" height="28.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="135.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">V_pin = 3.3 В</text>
<text x="135.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">активний пуш-пул вихід</text>
<circle cx="240.0" cy="214.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="240.0" y1="214.0" x2="490.0" y2="214.0" stroke="#c0392b" stroke-width="2.5"/>
<path d="M360.0 214.0 L345.0 209.0 L345.0 219.0 Z" fill="#c0392b" stroke="#c0392b"/>
<text x="350.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Паразитний струм: 0.5–4 мА</text>
<text x="350.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">Сигнальна лінія живить мікросхему</text>
<rect x="490.0" y="60.0" width="260.0" height="220.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="620.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Датчик / Периферія</text>
<rect x="505.0" y="98.0" width="230.0" height="28.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="620.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Силове живлення: 0 В (ВИМКНЕНО)</text>
<line x1="520.0" y1="155.0" x2="720.0" y2="155.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="645.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Внутрішня шина VDD ~ 2.7 В!</text>
<circle cx="490.0" cy="214.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="490.0" y1="214.0" x2="535.0" y2="214.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="535.0" y1="214.0" x2="535.0" y2="169.0" stroke="#c0392b" stroke-width="2.0"/>
<path d="M535.0 155.0 L527.0 169.0 L543.0 169.0 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<line x1="525.0" y1="155.0" x2="545.0" y2="155.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="553.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">ESD-діод</text>
<text x="553.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">VF ~ 0.6 В (ON)</text>
<rect x="630.0" y="170.0" width="95.0" height="75.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="677.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логіка датчика</text>
<text x="677.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Brownout стан</text>
<text x="677.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Споживає струм!</text>
<line x1="677.0" y1="155.0" x2="677.0" y2="170.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="677.0" y1="245.0" x2="677.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="662.0" y1="260.0" x2="692.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="667.0" y1="264.0" x2="687.0" y2="264.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="672.0" y1="268.0" x2="682.0" y2="268.0" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="30.0" y="295.0" width="720.0" height="85.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="390.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Правильне рішення: повна ізоляція цифрових ліній перед вимкненням живлення</text>
<text x="390.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Перевести GPIO МК у стан LOW (0 В) або Hi-Z / Analog перед відкриттям силового ключа</text>
<text x="390.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2. Для двонапрямних шин (I2C) використовувати Level Shifter з ізоляцією при знеструмленні (Ioff)</text>
<text x="390.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: V_pin = 0 В → ESD-діод закритий → паразитний струм дорівнює 0 мкА</text>
</svg>