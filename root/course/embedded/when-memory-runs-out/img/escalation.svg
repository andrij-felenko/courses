<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли SRAM закінчується: від симптому до зовнішнього чипа</text>
<rect x="82.5" y="177.3" width="95.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="130.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">СИМПТОМ:</tspan><tspan x="130.0" dy="14.3">бракує SRAM</tspan></text>
<text x="130.0" y="238.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="130.0" dy="0.0">переповнення стека,</tspan><tspan x="130.0" dy="11.7">фрагментація купи,</tspan><tspan x="130.0" dy="11.7">краш</tspan></text>
<rect x="328.9" y="127.3" width="122.3" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="390.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">ВИДАВИТИ наявну</tspan><tspan x="390.0" dy="14.3">(перша лінія)</tspan></text>
<text x="390.0" y="188.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="390.0" dy="0.0">статичні буфери,</tspan><tspan x="390.0" dy="11.7">пули, обробка</tspan><tspan x="390.0" dy="11.7">потоком</tspan></text>
<rect x="588.9" y="77.3" width="122.3" height="45.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="650.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">ВИНЕСТИ назовні</tspan><tspan x="650.0" dy="14.3">(останній крок)</tspan></text>
<text x="650.0" y="138.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="650.0" dy="0.0">робоче → PSRAM,</tspan><tspan x="650.0" dy="11.7">сховище → Flash</tspan></text>
<line x1="181.5" y1="200.0" x2="324.9" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="455.1" y1="150.0" x2="584.9" y2="100.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">зовнішня пам'ять — не перший крок, а останній: спершу видави все з наявної SRAM</text>
</svg>