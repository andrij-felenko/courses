<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 371.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="371.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому прапорці скидають через W1C, а не Read-Modify-Write</text>
<rect x="40.0" y="48.0" width="325.0" height="270.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="202.5" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпека: Read-Modify-Write (RMW)</text>
<rect x="52.0" y="94.0" width="301.0" height="38.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.1"/>
<text x="60.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">1. Читання регістра:</text>
<text x="60.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ISR = 0b00000011 (активні біти 0 і 1)</text>
<rect x="52.0" y="138.0" width="301.0" height="38.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="60.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">2. Подія під час обробки:</text>
<text x="60.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Апаратний блок встановлює біт 2!</text>
<rect x="52.0" y="182.0" width="301.0" height="38.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.1"/>
<text x="60.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">3. Модифікація в ЦП:</text>
<text x="60.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Маска скидає біт 0: val &amp;= ~(1 &lt;&lt; 0)</text>
<rect x="52.0" y="226.0" width="301.0" height="38.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.1"/>
<text x="60.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">4. Запис старого стану:</text>
<text x="60.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ЦП записує 0b00000010 назад у регістр</text>
<rect x="52.0" y="270.0" width="301.0" height="38.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="60.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">КАТАСТРОФА:</text>
<text x="60.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Біт 2 випадково СТЕРТО! Подію втрачено назавжди</text>
<rect x="395.0" y="48.0" width="325.0" height="270.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="557.5" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Атомарний порятунок: W1C (Write 1 to Clear)</text>
<rect x="407.0" y="94.0" width="301.0" height="38.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.1"/>
<text x="415.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">1. Читання регістра:</text>
<text x="415.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ISR = 0b00000011 (бачимо подію 0)</text>
<rect x="407.0" y="138.0" width="301.0" height="38.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="415.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">2. Подія під час обробки:</text>
<text x="415.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Апаратний блок встановлює біт 2!</text>
<rect x="407.0" y="182.0" width="301.0" height="38.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.1"/>
<text x="415.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">3. Прямий запис маски:</text>
<text x="415.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ЦП пише 1 ТІЛЬКИ в біт 0: ICR = (1 &lt;&lt; 0)</text>
<rect x="407.0" y="226.0" width="301.0" height="38.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.1"/>
<text x="415.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">4. Апаратне скидання:</text>
<text x="415.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Кремній очищає лише біт 0. Біт 2 НЕ зачіпається</text>
<rect x="407.0" y="270.0" width="301.0" height="38.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="415.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">РЕЗУЛЬТАТ:</text>
<text x="415.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Біт 2 цілий! Переривання надійно спрацює знову</text>
<text x="380.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">W1C дозволяє безпечно скидати прапорці стану в перериваннях без блокування ядра та без гонок</text>
</svg>