<rect x="40.0" y="236.0" width="680.0" height="78.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="54.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Критичні типи доступу до бітів у Reference Manual:</text>
<text x="54.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• R/W (Read/Write) — читання поточного значення, запис конфігурації</text>
<text x="54.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">• RO (Read Only) — апаратний прапорець стану, запис із ЦП ігнорується або генерує помилку</text>
<text x="54.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• W1C (Write 1 to Clear) — запис «1» очищає прапорець; запис «0» НЕ впливає на біт (захист від збою)</text>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Зсув адреси (Offset) визначає розташування у пам'яті, а тип доступу (R/W vs W1C) — поведінку шини при записі</text>
