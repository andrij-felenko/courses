<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 401.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="401.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири стовпи інженерної документації мікроконтролера</text>
<rect x="40.0" y="50.0" width="325.0" height="145.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="54.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Datasheet (DS)</text>
<text x="54.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Паспорт чипа від виробника кристала</text>
<text x="54.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Фізичні корпуси та розпіновка (Pinout)</text>
<text x="54.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Граничні напруги й струми (Absolute Max)</text>
<text x="54.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Споживання живлення у режимах сну/роботи</text>
<text x="54.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Часові діаграми шин (Setup/Hold timing)</text>
<line x1="50.0" y1="170.0" x2="355.0" y2="170.0" stroke="#2457d6" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="54.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700" font-style="italic">Питання: чи витримає схема і як розпаяти?</text>
<rect x="395.0" y="50.0" width="325.0" height="145.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="409.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Reference Manual (RM / TRM)</text>
<text x="409.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Технічний довідник периферії МК</text>
<text x="409.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Блок-схеми та тактування кожного блоку</text>
<text x="409.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Карта регістрів пам'яті (Base + Offset)</text>
<text x="409.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Призначення бітових полів (R/W, RO, W1C)</text>
<text x="409.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Покроковий алгоритм ініціалізації периферії</text>
<line x1="405.0" y1="170.0" x2="710.0" y2="170.0" stroke="#27ae60" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="409.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700" font-style="italic">Питання: як запрограмувати кожен блок?</text>
<rect x="40.0" y="210.0" width="325.0" height="145.0" rx="8" fill="#f3e9f3" stroke="#7d5ba6" stroke-width="1.6"/>
<text x="54.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d5ba6" text-anchor="start" font-weight="700">Programming Manual (PM / Core)</text>
<text x="54.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Архітектурний опис ядра процесора</text>
<text x="54.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Архітектура системи команд (ARM / RISC-V)</text>
<text x="54.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Контролер переривань (NVIC / CLIC / PLIC)</text>
<text x="54.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Системний таймер SysTick та блок MPU</text>
<text x="54.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Регістри ядра (R0-R15, PSR, PRIMASK)</text>
<line x1="50.0" y1="330.0" x2="355.0" y2="330.0" stroke="#7d5ba6" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="54.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d5ba6" text-anchor="start" font-weight="700" font-style="italic">Питання: як керувати ядром та винятками?</text>
<rect x="395.0" y="210.0" width="325.0" height="145.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="409.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Errata Sheet (ES)</text>
<text x="409.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Бюлетень відомих апаратних вад кремнію</text>
<text x="409.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Апаратні баги конкретних ревізій кристала</text>
<text x="409.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Граничні умови, де периферія збоїть</text>
<text x="409.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Опис програмних обходів (Workarounds)</text>
<text x="409.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Недокументовані обмеження функціоналу</text>
<line x1="405.0" y1="330.0" x2="710.0" y2="330.0" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="409.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">Питання: чому зависає залізо і як це обійти?</text>
<text x="380.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Помилка у виборі документа коштує днів налагодження: жоден документ не замінює інші три</text>
</svg>