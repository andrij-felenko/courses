<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профіль живлення: стабільний USB проти батареї та DC-DC</text>
<rect x="40.0" y="50.0" width="230.0" height="240.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="155.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. Девборда: USB + LDO</text>
<rect x="55.0" y="95.0" width="200.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="155.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Вхід 5.0V від USB</tspan><tspan x="155.0" dy="13.0">→ LDO 3.3V (до 800 мА)</tspan></text>
<rect x="55.0" y="150.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="155.0" y="164.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">• Чиста напруга без пульсацій</tspan><tspan x="155.0" dy="12.3">• Величезний запас струму</tspan><tspan x="155.0" dy="12.3">• Власний струм 20-50 мА</tspan><tspan x="155.0" dy="12.3">  (не критичний для столу)</tspan></text>
<text x="155.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Комфортно для коду,</text>
<text x="155.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ховає проблеми живлення</text>
<rect x="295.0" y="50.0" width="230.0" height="240.0" rx="8" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
<text x="410.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">2. АКБ: Li-Po (3.0...4.2V)</text>
<rect x="310.0" y="95.0" width="200.0" height="45.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.2"/><text x="410.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">LDO з малим падінням (LDO)</tspan><tspan x="410.0" dy="13.0">або Buck-Boost 3.3V</tspan></text>
<rect x="310.0" y="150.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="410.0" y="164.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">• Просідання при сплесках RF</tspan><tspan x="410.0" dy="12.3">• Вимога Deep Sleep &lt; 20 мкА</tspan><tspan x="410.0" dy="12.3">• Висячі ніжки їдять міліампери</tspan><tspan x="410.0" dy="12.3">• Ризик Brown-Out Reset</tspan></text>
<text x="410.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">Вимагає керування сном</text>
<text x="410.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">і паркування виводів</text>
<rect x="550.0" y="50.0" width="230.0" height="240.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="665.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. Промислові: 24V DC-DC</text>
<rect x="565.0" y="95.0" width="200.0" height="45.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="665.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Імпульсний Step-Down</tspan><tspan x="665.0" dy="13.0">(Step-Down Buck 24V→3.3V)</tspan></text>
<rect x="565.0" y="150.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="665.0" y="165.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">• Пульсації 50-100 мВ (шум АЦП)</tspan><tspan x="665.0" dy="11.7">• Кидки напруги при гарячій пайці</tspan><tspan x="665.0" dy="11.7">• Дзвін індуктивності</tspan><tspan x="665.0" dy="11.7">• Розділення силової й аналог. землі</tspan></text>
<text x="665.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Вимагає фільтрації LC</text>
<text x="665.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">та захисних TVS-діодів</text>
</svg>