<rect x="595.0" y="190.0" width="170.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="680.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Апаратне скидання</tspan><tspan x="680.0" dy="13.0">(NRST з RC-ланцюжком)</tspan></text>
