<text x="140.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(ST-Link V3 / J-Link)</text>
<rect x="55.0" y="120.0" width="170.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="140.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Двонапрямні транслятори</tspan><tspan x="140.0" dy="13.0">рівнів (Level Shifter)</tspan></text>
<rect x="55.0" y="190.0" width="170.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="140.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Генератор SWD такту</tspan><tspan x="140.0" dy="13.0">та логіка скидання</tspan></text>
<text x="140.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Живиться від хоста (5V USB)</text>
