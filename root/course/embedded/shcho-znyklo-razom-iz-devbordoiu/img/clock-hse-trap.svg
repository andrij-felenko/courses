<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка тактування: де зависає SystemClock_Config()</text>
<rect x="40.0" y="45.0" width="350.0" height="255.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="215.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Код із девборди (Небезпечний)</text>
<rect x="55.0" y="90.0" width="320.0" height="38.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="215.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">1. RCC-&gt;CR |= RCC_CR_HSEON;</tspan><tspan x="215.0" dy="13.0">(Увімкнути зовнішній кварц 8 МГц)</tspan></text>
<rect x="55.0" y="138.0" width="320.0" height="45.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="215.0" y="157.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">2. while (!(RCC-&gt;CR &amp; RCC_CR_HSERDY))</tspan><tspan x="215.0" dy="13.0">   { /* нескінченне очікування */ }</tspan></text>
<rect x="55.0" y="195.0" width="320.0" height="85.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="215.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Аварія на власній платі:</tspan><tspan x="215.0" dy="12.3">• Кварц не розпаяно (економія BOM)</tspan><tspan x="215.0" dy="12.3">• Невідповідні конденсатори C_L</tspan><tspan x="215.0" dy="12.3">• Мікротріщина в пайці / флюс</tspan><tspan x="215.0" dy="12.3">→ МК НАЗАВЖДИ ЗАВИСАЄ В ЦИКЛІ!</tspan></text>
<rect x="430.0" y="45.0" width="350.0" height="255.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="605.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Надійний код (Production-Ready)</text>
<rect x="445.0" y="90.0" width="320.0" height="38.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="605.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">1. Увімкнути HSE + запустити таймер</tspan></text>
<rect x="445.0" y="138.0" width="320.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="605.0" y="157.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">2. while (!HSERDY &amp;&amp; --timeout &gt; 0)</tspan><tspan x="605.0" dy="13.0">   { /* обмежене очікування */ }</tspan></text>
<rect x="445.0" y="195.0" width="320.0" height="85.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="605.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Безпечна поведінка:</tspan><tspan x="605.0" dy="12.3">• Якщо HSE готовий → перехід на PLL (HSE)</tspan><tspan x="605.0" dy="12.3">• Якщо таймаут вичерпано →</tspan><tspan x="605.0" dy="12.3">  Fallback на внутрішній RC-генератор (HSI)</tspan><tspan x="605.0" dy="12.3">  + запис прапорця аварії в EEPROM/лог</tspan></text>
</svg>