<line x1="470.0" y1="210.0" x2="780.0" y2="210.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="625.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">PUBLISH node/state 'online'</text>
