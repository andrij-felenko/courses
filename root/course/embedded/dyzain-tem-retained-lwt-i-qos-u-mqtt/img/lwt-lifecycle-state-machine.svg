<text x="315.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c07a2e" text-anchor="middle">CONNECT (Will: topic=state, msg='offline', Retain=1, QoS=1)</text>
