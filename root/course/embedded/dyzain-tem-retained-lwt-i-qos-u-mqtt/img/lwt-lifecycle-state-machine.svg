<text x="315.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">CONNACK (З'єднання прийнято, LWT зареєстровано)</text>
