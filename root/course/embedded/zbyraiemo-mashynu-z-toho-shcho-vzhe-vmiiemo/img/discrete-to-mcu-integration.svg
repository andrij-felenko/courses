<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція: від дискретної шини на друкованій платі до інтегрованого мікроконтролера</text>
<rect x="30.0" y="55.0" width="395.0" height="345.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.8"/>
<text x="227.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ДИСКРЕТНА СИСТЕМА (ПЛАТА 1970-80-х)</text>
<rect x="50.0" y="105.0" width="100.0" height="80.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="100.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">CPU Чіп</text>
<text x="100.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Z80 / 6502)</text>
<rect x="180.0" y="105.0" width="100.0" height="80.0" rx="6" fill="#fffbeb" stroke="#b8860b" stroke-width="1.4"/>
<text x="230.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">ROM Чіп</text>
<text x="230.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ПЗП 27C64</text>
<rect x="310.0" y="105.0" width="95.0" height="80.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="357.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">RAM Чіп</text>
<text x="357.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ОЗП 62256</text>
<rect x="110.0" y="230.0" width="110.0" height="70.0" rx="6" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="165.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дешифратор</text>
<text x="165.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">74HC138</text>
<rect x="250.0" y="230.0" width="120.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="310.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">GPIO Порт</text>
<text x="310.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">74HC574 Latch</text>
<line x1="50.0" y1="205.0" x2="395.0" y2="205.0" stroke="#b8860b" stroke-width="3.0"/>
<text x="227.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle" font-weight="700">Паралельні доріжки друкованої плати (16+8+4 = 28 провідників)</text>
<rect x="45.0" y="315.0" width="365.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.0"/>
<text x="227.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Недоліки дискретної архітектури:</text>
<text x="227.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Паразитна ємність доріжок (15–30 пФ на лінію) -&gt; межа 10–20 МГц</text>
<text x="227.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Десятки виводів корпусів, висока вартість і габарити плати</text>
<text x="227.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Високе енергоспоживання через перезарядку ємностей шин</text>
<rect x="455.0" y="55.0" width="395.0" height="345.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="652.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ОДНОКРИСТАЛЬНИЙ МК (STM32, ESP32, AVR)</text>
<rect x="480.0" y="105.0" width="345.0" height="195.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="652.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ЄДИНИЙ КРЕМНІЄВИЙ КРИСТАЛ (SILICON DIE)</text>
<rect x="495.0" y="140.0" width="95.0" height="55.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="542.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">CPU Core</text>
<text x="542.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Cortex-M / RISC-V</text>
<rect x="605.0" y="140.0" width="100.0" height="55.0" rx="6" fill="#fffbeb" stroke="#b8860b" stroke-width="1.2"/>
<text x="655.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle" font-weight="700">Flash Memory</text>
<text x="655.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">64–512 КБ</text>
<rect x="720.0" y="140.0" width="90.0" height="55.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="765.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">SRAM</text>
<text x="765.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">16–128 КБ</text>
<rect x="495.0" y="205.0" width="315.0" height="22.0" rx="2" fill="#fef3c7" stroke="#b8860b" stroke-width="1.2"/>
<text x="652.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle" font-weight="700">Внутрішня матриця шин (AHB / APB Bus Matrix)</text>
<rect x="495.0" y="235.0" width="70.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="530.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">GPIO</text>
<text x="530.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Порти A, B</text>
<rect x="575.0" y="235.0" width="70.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="610.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Timers</text>
<text x="610.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ШІМ, Capture</text>
<rect x="655.0" y="235.0" width="75.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="692.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">UART/SPI</text>
<text x="692.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">I2C, CAN</text>
<rect x="740.0" y="235.0" width="70.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="775.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">ADC/DAC</text>
<text x="775.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">12 біт</text>
<rect x="470.0" y="315.0" width="365.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="652.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Переваги інтегрованого кристала:</text>
<text x="652.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Ємність внутрішніх з'єднань &lt; 10–50 фФ (у 1000 разів менше)</text>
<text x="652.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Тактові частоти 48–480 МГц при мізерному струмі споживання</text>
<text x="652.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Компактний корпус (QFN/BGA), мінімум зовнішніх провідників</text>
</svg>