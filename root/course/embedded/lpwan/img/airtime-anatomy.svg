<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 822 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="822" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="406.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">З чого складається час пакета в ефірі (time on air)</text>
<text x="50.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">один пакет LoRa у часі →</text>
<rect x="50.0" y="110.0" width="234.5" height="50.0" rx="6" fill="#e6ecfb" stroke="#2457d6" stroke-width="1.8"/>
<text x="167.2" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">преамбула</text>
<text x="167.2" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(n + 4.25) символів</text>
<rect x="284.5" y="110.0" width="435.5" height="50.0" rx="6" fill="#e4f4ea" stroke="#27ae60" stroke-width="1.8"/>
<text x="502.2" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">заголовок + дані + CRC</text>
<text x="502.2" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">payloadSymbNb символів</text>
<line x1="694.0" y1="110.0" x2="694.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="2 3"/>
<line x1="728.0" y1="200.0" x2="707.0" y2="166.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="650.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">1 символ = Tsym = 2^SF / BW</text>
<rect x="50.0" y="220.0" width="670.0" height="40.0" rx="6" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.5"/><text x="385.0" y="244.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="385.0" dy="0.0">час у ефірі  =  Tпреамбули + Tданих  =  (n + 4.25)·Tsym  +  payloadSymbNb·Tsym</tspan></text>
<rect x="50.0" y="272.0" width="670.0" height="56.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="385.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Tsym подвоюється з кожним кроком SF (2^SF у чисельнику):</tspan><tspan x="385.0" dy="14.3">SF7 → 1.024 мс,  SF12 → 32.768 мс на символ.</tspan><tspan x="385.0" dy="14.3">Той самий пакет на SF12 висить у ефірі у ~28 разів довше, ніж на SF7.</tspan></text>
</svg>