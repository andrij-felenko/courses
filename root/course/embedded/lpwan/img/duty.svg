<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон 1%: ефір майже завжди мусить мовчати</text>
<text x="60.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">1 година ефіру одного вузла (смуга EU868, дозволено 1%)</text>
<rect x="60.0" y="130.0" width="640.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<rect x="60.0" y="130.0" width="6.4" height="46.0" rx="6" fill="#fbe7e4" stroke="#c0392b" stroke-width="1.8"/>
<line x1="63.0" y1="126.0" x2="63.0" y2="100.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="120.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">можна говорити (1%)</text>
<text x="380.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">решта 99% — обов'язкова мовчанка</text>
<rect x="60.0" y="210.0" width="640.0" height="70.0" rx="6" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.5"/><text x="380.0" y="234.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">1% від години = 36 секунд ефіру на годину.</tspan><tspan x="380.0" dy="15.0">Один пакет SF12 висить у ефірі ~1.5 с → ~24 пакети за годину — стеля.</tspan><tspan x="380.0" dy="15.0">Тому LPWAN-вузол шле кілька байтів зрідка: покази раз на 10–60 хв, не потік.</tspan></text>
<rect x="60.0" y="292.0" width="640.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="313.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">duty cycle — не порада, а закон: передавач САМ мусить лічити свій час у ефірі й замовкати</tspan></text>
</svg>