<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому квадратура потребує незалежності</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Квадратура — це Піфагор; вона діє, лише поки внески перпендикулярні (незалежні)</text>
<text x="150.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">незалежні (r=0)</text>
<line x1="95.0" y1="250.0" x2="165.0" y2="250.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="165.0" y1="250.0" x2="165.0" y2="200.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="95.0" y1="250.0" x2="165.0" y2="200.0" stroke="#27ae60" stroke-width="3.0"/>
<rect x="157.0" y="242.0" width="8.0" height="8.0" rx="0" fill="none" stroke="#6b7280" stroke-width="1.0"/>
<text x="150.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">квадратура: √(a²+b²)</text>
<text x="390.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">однаковий бік (r=+1)</text>
<line x1="335.0" y1="250.0" x2="405.0" y2="250.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="405.0" y1="250.0" x2="455.0" y2="250.0" stroke="#7a93e8" stroke-width="2.4"/>
<line x1="335.0" y1="266.0" x2="455.0" y2="266.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="390.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">просто сума: a+b</text>
<text x="630.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">протилежні (r=−1)</text>
<line x1="575.0" y1="250.0" x2="645.0" y2="250.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="645.0" y1="250.0" x2="595.0" y2="250.0" stroke="#7a93e8" stroke-width="2.4"/>
<line x1="575.0" y1="266.0" x2="595.0" y2="266.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="630.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">гасяться: |a−b|</text>
<text x="380.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">у бюджеті далекоміра внески незалежні → лівий випадок; спільна причина зсунула б до середнього чи правого</text>
</svg>