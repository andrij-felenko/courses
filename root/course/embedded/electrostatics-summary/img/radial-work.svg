<text x="359.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">E</text>
<line x1="310.9" y1="245.0" x2="395.1" y2="174.3" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 395.1 174.3 A 320.0 320.0 0 0 0 319.6 108.6" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<line x1="328.9" y1="114.7" x2="319.6" y2="108.6" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<circle cx="310.9" cy="245.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="294.9" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<circle cx="395.1" cy="174.3" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="409.1" y="168.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<circle cx="319.6" cy="108.6" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="333.6" y="104.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<text x="383.0" y="209.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">радіальний крок</text>
<text x="383.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">робота = qE·Δr ≠ 0</text>
<text x="375.1" y="125.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">поперечний крок (по дузі)</text>
<text x="375.1" y="143.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">E ⊥ шлях → робота = 0</text>
<rect x="430.0" y="300.0" width="320.0" height="132.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="336.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Будь-який крок розкладається на два:</tspan><tspan x="590.0" dy="16.9">• уздовж r — поле штовхає, робота є;</tspan><tspan x="590.0" dy="16.9">• упоперек (по колу) — E ⊥ шлях, нуль.</tspan><tspan x="590.0" dy="16.9">Тож уся робота залежить лише від того,</tspan><tspan x="590.0" dy="16.9">як змінився r — а не від звивин шляху.</tspan></text>
