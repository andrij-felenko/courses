<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Робота = радіальна частина; упоперек поля — нуль</text>
<circle cx="150.0" cy="380.0" r="12.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="150.0" y="385.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="128.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">Q</text>
<path d="M 358.0 350.8 A 210.0 210.0 0 0 0 221.8 182.7" fill="none" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="5 4"/>
<path d="M 466.9 335.5 A 320.0 320.0 0 0 0 259.4 79.3" fill="none" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="5 4"/>
<text x="366.0" y="354.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">V = V₁</text>
<text x="474.9" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">V = V₂</text>
