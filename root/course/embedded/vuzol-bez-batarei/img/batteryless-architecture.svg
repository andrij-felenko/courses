<rect x="87.1" y="357.4" width="665.8" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Повний розрив кіл: під час тривалого заряду накопичувача навантаження фізично відрізане силовим ключем;</tspan><tspan x="420.0" dy="14.3">після досягнення V_high ключ вмикається, навантаження виконує швидкий імпульс і знеструмлюється.</tspan></text>
