<rect x="30.0" y="70.0" width="150.0" height="240.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.8"/><text x="105.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">ДЖЕРЕЛО ЕНЕРГІЇ</tspan><tspan x="105.0" dy="15.0"></tspan><tspan x="105.0" dy="15.0">• Сонячна панель</tspan><tspan x="105.0" dy="15.0">• TEG (Зеєбек)</tspan><tspan x="105.0" dy="15.0">• П'єзогенератор</tspan><tspan x="105.0" dy="15.0">• RF-збирач</tspan><tspan x="105.0" dy="15.0"></tspan><tspan x="105.0" dy="15.0">P_in: 5–100 мкВт</tspan></text>
