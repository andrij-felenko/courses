<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Падіння напруги на джгуті та перекіс потенціалів землі (Ground Shift)</text>
<rect x="29.3" y="156.2" width="201.3" height="87.7" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/><text x="130.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">ГОЛОВНА ПЛАТА / MCU</tspan><tspan x="130.0" dy="16.9">Джерело живлення 3.3 В</tspan><tspan x="130.0" dy="16.9">V_GND = 0.00 В</tspan><tspan x="130.0" dy="16.9">Вхід Rx (V_IL &lt; 0.8 В)</tspan></text>
<rect x="605.3" y="156.2" width="209.4" height="87.7" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/><text x="710.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">ВІДДАЛЕНИЙ ВУЗОЛ</tspan><tspan x="710.0" dy="16.9">Мотор / Давач / MCU</tspan><tspan x="710.0" dy="16.9">V_GND_local = +0.55 В</tspan><tspan x="710.0" dy="16.9">Вихід Tx (V_OL = 0.2 В)</tspan></text>
<line x1="230.0" y1="100.0" x2="600.0" y2="100.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="380.0" y1="100.0" x2="450.0" y2="100.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="415.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+3.3 В шина (струм навантаження I_load = 2.0 А)</text>
<text x="415.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Падіння на плюсовому проводі: ΔV_pos = I · R_pos = 0.55 В</text>
<line x1="600.0" y1="200.0" x2="230.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="5 3"/>
<line x1="450.0" y1="200.0" x2="380.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="415.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Сигнальна лінія (UART Tx → Rx, слабкострумова)</text>
<line x1="600.0" y1="300.0" x2="230.0" y2="300.0" stroke="#2457d6" stroke-width="2.5"/>
<line x1="450.0" y1="300.0" x2="380.0" y2="300.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="415.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Спільна земля GND (зворотний струм I_load = 2.0 А)</text>
<text x="415.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Падіння на земляному проводі: ΔV_gnd = I · R_gnd = 0.55 В</text>
<rect x="390.0" y="292.0" width="50.0" height="16.0" rx="2" fill="#e2e8f0" stroke="#2457d6" stroke-width="1.5"/>
<text x="415.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">R_gnd = 0.275 Ом</text>
<rect x="105.6" y="358.4" width="628.8" height="63.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="378.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle"><tspan x="420.0" dy="0.0">КРИТИЧНИЙ ЗБІЙ: Сигнал нуля Tx віддаленого вузла приходить на головний MCU з рівнем:</tspan><tspan x="420.0" dy="15.6">V_in = V_OL + V_GND_local = 0.20 В + 0.55 В = 0.75 В (майже на межі порога V_IL = 0.8 В)!</tspan><tspan x="420.0" dy="15.6">Будь-яка додаткова завада сприймається мікроконтролером як хибна одиниця.</tspan></text>
</svg>