<rect x="36.3" y="256.9" width="367.4" height="106.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Низькі частоти та аналогові сигнали (DC…100 кГц)</tspan><tspan x="220.0" dy="15.0"></tspan><tspan x="220.0" dy="15.0">• Заземлення екрана ТІЛЬКИ З ОДНОГО БОКУ</tspan><tspan x="220.0" dy="15.0">• Розриває земляну петлю струмів 50 Гц / вирівнювання</tspan><tspan x="220.0" dy="15.0">• Другий кінець ізолюється термозбіжкою</tspan><tspan x="220.0" dy="15.0">• Захищає від паразитної ємнісної наводки E-поля</tspan></text>
<rect x="429.7" y="256.9" width="380.5" height="106.2" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Високі частоти, CAN, Ethernet, RF (понад 1 МГц)</tspan><tspan x="620.0" dy="15.0"></tspan><tspan x="620.0" dy="15.0">• Заземлення екрана З ОБОХ БОКІВ на металеве шасі</tspan><tspan x="620.0" dy="15.0">• Суцільний 360° контакт роз'єму (без свинячих хвостів)</tspan><tspan x="620.0" dy="15.0">• Забезпечує шлях повернення ВЧ струмів зміщення</tspan><tspan x="620.0" dy="15.0">• Пастка Pigtail (хвіст 5 см) = антена на 50 МГц!</tspan></text>
