<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 904.6 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="904.6" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правила обтиску контактів, захист від перетирання та розвантаження</text>
<text x="420.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">АНАТОМІЯ ОБТИСКУ (CRIMP) ТА РОЗВАНТАЖЕННЯ ВІД НАТЯГУ</text>
<text x="210.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Правильний двозонний B-обтиск клеми</text>
<rect x="50.0" y="100.0" width="110.0" height="50.0" rx="4" fill="#cbd5e1" stroke="#333333" stroke-width="1.8"/>
<text x="105.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоляція дроту</text>
<rect x="160.0" y="110.0" width="90.0" height="30.0" rx="2" fill="#fdba74" stroke="#ea580c" stroke-width="1.5"/>
<text x="198.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a3412" text-anchor="middle" font-weight="700">Мідні жили</text>
<rect x="130.0" y="85.0" width="45.0" height="80.0" rx="4" fill="none" stroke="#2457d6" stroke-width="2.5"/>
<text x="152.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Обтиск ізоляції
(механічна опора)</text>
<rect x="215.0" y="95.0" width="50.0" height="60.0" rx="4" fill="none" stroke="#27ae60" stroke-width="2.5"/>
<text x="240.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Обтиск міді (B-Crimp)
(газощільний контакт)</text>
<rect x="290.0" y="112.0" width="80.0" height="26.0" rx="2" fill="#94a3b8" stroke="#333333" stroke-width="1.8"/>
<text x="330.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контакт</text>
<rect x="23.0" y="264.4" width="374.0" height="91.3" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle"><tspan x="210.0" dy="0.0">ПАСТКА ПАЯННЯ ПРОВОДІВ У РОЗ'ЄМ:</tspan><tspan x="210.0" dy="15.0"></tspan><tspan x="210.0" dy="15.0">Припій затікає під ізоляцію (капілярний ефект).</tspan><tspan x="210.0" dy="15.0">Гнучкий багатожильний дріт стає крихким монолітом.</tspan><tspan x="210.0" dy="15.0">При вібрації жилки ламаються на межі затікання припою!</tspan></text>
<text x="630.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Шари захисту джгута та розвантаження</text>
<rect x="439.7" y="129.4" width="380.5" height="121.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="149.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">БАГАТОШАРОВИЙ ЗАХИСТ ВІД ПЕРЕТИРАННЯ:</tspan><tspan x="630.0" dy="15.0"></tspan><tspan x="630.0" dy="15.0">1. Внутрішній пучок: виті пари дротів (PTFE/силікон)</tspan><tspan x="630.0" dy="15.0">2. Екран: мідне луджене обплетення (покриття 85–95%)</tspan><tspan x="630.0" dy="15.0">3. Рукав: плетена поліефірна «зміїна шкіра» (PET)</tspan><tspan x="630.0" dy="15.0">4. Розгалуження: клейова термозбіжка (Dual-Wall)</tspan><tspan x="630.0" dy="15.0">5. Зовнішня броня в небезпечних зонах: гофрована трубка</tspan></text>
<rect x="375.5" y="290.9" width="509.1" height="88.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">ПРАВИЛО РОЗВАНТАЖЕННЯ ВІД НАТЯГУ (STRAIN RELIEF):</tspan><tspan x="630.0" dy="14.3"></tspan><tspan x="630.0" dy="14.3">• Перша точка кріплення (P-clip/стяжка): ≤ 50–100 мм від плати</tspan><tspan x="630.0" dy="14.3">• Обов'язкова сервісна петля (Service Loop) для компенсації рухів</tspan><tspan x="630.0" dy="14.3">• Мінімальний радіус вигину: R_bend ≥ 6 · D (статичний), ≥ 12 · D (динамічний)</tspan></text>
</svg>