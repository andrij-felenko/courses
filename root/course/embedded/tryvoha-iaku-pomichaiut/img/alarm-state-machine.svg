<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1124.54 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1124.54" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів тривоги за ISA-18.2: квітування, заглушення та ескалація</text>
<rect x="65.0" y="117.5" width="190.0" height="85.1" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="160.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">NORMAL</tspan><tspan x="160.0" dy="13.7">(Норма / Очікування)</tspan><tspan x="160.0" dy="13.7">Параметри в межах норми.</tspan><tspan x="160.0" dy="13.7">Індикатор: ВИМКНЕНО</tspan><tspan x="160.0" dy="13.7">Звук: ТИША</tspan></text>
<rect x="420.0" y="117.5" width="220.0" height="85.1" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/><text x="530.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">ACTIVE UNACKNOWLEDGED</tspan><tspan x="530.0" dy="13.7">(Активна незаквітована)</tspan><tspan x="530.0" dy="13.7">Параметр &gt; Порогу.</tspan><tspan x="530.0" dy="13.7">Індикатор: МИГОТІННЯ (2-4 Гц)</tspan><tspan x="530.0" dy="13.7">Звук: АКТИВНИЙ СИРЕНА</tspan></text>
<rect x="795.0" y="117.5" width="210.0" height="85.1" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/><text x="900.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">ACTIVE ACKNOWLEDGED</tspan><tspan x="900.0" dy="13.7">(Активна заквітована)</tspan><tspan x="900.0" dy="13.7">Оператор натиснув ACK.</tspan><tspan x="900.0" dy="13.7">Індикатор: СУЦІЛЬНЕ СВІТЛО</tspan><tspan x="900.0" dy="13.7">Звук: ТИША (Заглушено)</tspan></text>
<rect x="406.1" y="347.4" width="247.8" height="85.1" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="530.0" y="366.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">CLEARED UNACKNOWLEDGED</tspan><tspan x="530.0" dy="13.7">(Минула незаквітована)</tspan><tspan x="530.0" dy="13.7">Параметр повернувся в норму до ACK.</tspan><tspan x="530.0" dy="13.7">Індикатор: ПОВІЛЬНЕ МИГОТІННЯ</tspan><tspan x="530.0" dy="13.7">Звук: ТИША (або м'який тон)</tspan></text>
<rect x="782.6" y="347.4" width="234.8" height="85.1" rx="6" fill="#fed7d7" stroke="#9b2c2c" stroke-width="1.5"/><text x="900.0" y="366.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">ESCALATED / SHELVED</tspan><tspan x="900.0" dy="13.7">(Ескальована / Автозахист)</tspan><tspan x="900.0" dy="13.7">Таймаут T_esc сплив без усунення.</tspan><tspan x="900.0" dy="13.7">Пріоритет підвищено!</tspan><tspan x="900.0" dy="13.7">Звук: ПОВТОРНА СИРЕНА / FAILSAFE</tspan></text>
<line x1="255.0" y1="160.0" x2="420.0" y2="160.0" stroke="#e53e3e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="345.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e53e3e" text-anchor="middle" font-weight="700">Параметр &gt; Порогу (після Debounce)</text>
<line x1="640.0" y1="160.0" x2="795.0" y2="160.0" stroke="#dd6b20" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="715.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dd6b20" text-anchor="middle" font-weight="700">Команда: ACK (Квітувати)</text>
<line x1="900.0" y1="117.5" x2="900.0" y2="75.0" stroke="#38a169" stroke-width="1.8"/>
<line x1="900.0" y1="75.0" x2="160.0" y2="75.0" stroke="#38a169" stroke-width="1.8"/>
<line x1="160.0" y1="75.0" x2="160.0" y2="117.5" stroke="#38a169" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#22543d" text-anchor="middle" font-weight="700">Параметр повернувся в норму (U &lt; Порогу - Hysteresis) =&gt; Повне очищення</text>
<line x1="500.0" y1="202.6" x2="500.0" y2="347.4" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle" font-weight="700">Нормалізація
без ACK</text>
<line x1="406.1" y1="390.0" x2="160.0" y2="212.6" stroke="#38a169" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#22543d" text-anchor="middle" font-weight="700">Команда ACK на минулій тривозі =&gt; Очищення</text>
<line x1="900.0" y1="202.6" x2="900.0" y2="347.4" stroke="#9b2c2c" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="915.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9b2c2c" text-anchor="start" font-weight="700">Таймаут T_esc сплив
(причина не зникла)</text>
<line x1="860.0" y1="347.4" x2="860.0" y2="202.6" stroke="#dd6b20" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="175.6" y="492.4" width="708.8" height="45.3" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="530.0" y="511.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Ключова відмінність: Silence (заглушення) тимчасово вимикає звук, але залишає таймер ескалації T_esc;</tspan><tspan x="530.0" dy="14.3">Acknowledge (квітування) підтверджує, що оператор прийняв відповідальність за локалізацію аварії.</tspan></text>
</svg>