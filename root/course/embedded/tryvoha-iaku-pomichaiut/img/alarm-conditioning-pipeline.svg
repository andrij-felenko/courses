<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр обробки та кондиціонування сигналів аварійної сигналізації</text>
<rect x="35.0" y="94.0" width="175.0" height="82.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="122.5" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="122.5" dy="0.0">1. Сире вимірювання</tspan><tspan x="122.5" dy="13.0">та фільтрація</tspan><tspan x="122.5" dy="13.0">АЦП / Цифровий датчик</tspan><tspan x="122.5" dy="13.0">(Шум, викиди, перешкоди)</tspan><tspan x="122.5" dy="13.0">Фільтр LPF / Медіана</tspan></text>
<line x1="210.0" y1="135.0" x2="245.0" y2="135.0" stroke="#2b6cb0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="245.0" y="94.0" width="175.0" height="82.0" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/><text x="332.5" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="332.5" dy="0.0">2. Гістерезис</tspan><tspan x="332.5" dy="13.0">та Дебаунс</tspan><tspan x="332.5" dy="13.0">Поріг Th ± Δ_hyst</tspan><tspan x="332.5" dy="13.0">Таймери On-delay (200 мс)</tspan><tspan x="332.5" dy="13.0">та Off-delay (500 мс)</tspan></text>
<line x1="420.0" y1="135.0" x2="455.0" y2="135.0" stroke="#2b6cb0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="451.9" y="94.0" width="181.2" height="82.0" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/><text x="542.5" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="542.5" dy="0.0">3. Фільтр деренчання</tspan><tspan x="542.5" dy="13.0">(Chattering Filter)</tspan><tspan x="542.5" dy="13.0">Детектор Flapping:</tspan><tspan x="542.5" dy="13.0">&gt; 3 спрацьовувань за 60 с</tspan><tspan x="542.5" dy="13.0">=&gt; Тимчасовий лок з міткою</tspan></text>
<line x1="630.0" y1="135.0" x2="665.0" y2="135.0" stroke="#2b6cb0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="665.0" y="94.0" width="175.0" height="82.0" rx="6" fill="#e6fffa" stroke="#319795" stroke-width="1.5"/><text x="752.5" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="752.5" dy="0.0">4. Стан-залежне</tspan><tspan x="752.5" dy="13.0">маскування (Mode)</tspan><tspan x="752.5" dy="13.0">Матриця станів апарата:</tspan><tspan x="752.5" dy="13.0">Двигун OFF =&gt; Тиск маски</tspan><tspan x="752.5" dy="13.0">На землі =&gt; GPS глибина</tspan></text>
<line x1="840.0" y1="135.0" x2="875.0" y2="135.0" stroke="#2b6cb0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="875.0" y="94.0" width="175.0" height="82.0" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="962.5" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="962.5" dy="0.0">5. Придушення</tspan><tspan x="962.5" dy="13.0">першопричини (Tree)</tspan><tspan x="962.5" dy="13.0">Parent/Child граф відмов:</tspan><tspan x="962.5" dy="13.0">Шина 5V OFF =&gt; Маскувати</tspan><tspan x="962.5" dy="13.0">IMU, Baro, Mag, GPS</tspan></text>
<rect x="190.0" y="273.1" width="680.0" height="73.9" rx="6" fill="#edf2f7" stroke="#1a202c" stroke-width="1.5"/><text x="530.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Диспетчер тривог (Prioritized Alarm Engine)</tspan><tspan x="530.0" dy="14.3">• Черга пріоритетів: Critical (1) &gt; Warning (2) &gt; Advisory (3)</tspan><tspan x="530.0" dy="14.3">• Оновлення стану: Перевірка таймерів мовчання та ескалації T_esc</tspan><tspan x="530.0" dy="14.3">• Детерміноване виконання без динамічного виділення пам'яті (Zero Heap)</tspan></text>
<line x1="962.5" y1="180.0" x2="962.5" y2="310.0" stroke="#2b6cb0" stroke-width="2.0"/>
<line x1="962.5" y1="310.0" x2="870.0" y2="310.0" stroke="#2b6cb0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="55.0" y="410.5" width="290.0" height="69.0" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/><text x="200.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">АУДІО-СИСТЕМА (Buzzer/TTS)</tspan><tspan x="200.0" dy="13.0">Critical: 3 кГц (4 Гц)</tspan><tspan x="200.0" dy="13.0">Warning: 1.5 кГц (1 Гц)</tspan><tspan x="200.0" dy="13.0">Advisory: Тиша/Гонг</tspan></text>
<line x1="200.0" y1="346.9" x2="200.0" y2="410.0" stroke="#e53e3e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="385.0" y="410.5" width="290.0" height="69.0" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/><text x="530.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">ВІЗУАЛЬНИЙ HMI (Дисплей)</tspan><tspan x="530.0" dy="13.0">Critical: Червоний баннер + модаль</tspan><tspan x="530.0" dy="13.0">Warning: Жовтий статус-рядок</tspan><tspan x="530.0" dy="13.0">Advisory: Журнал повідомлень</tspan></text>
<line x1="530.0" y1="346.9" x2="530.0" y2="410.0" stroke="#dd6b20" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="715.0" y="410.5" width="290.0" height="69.0" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="860.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">АВТОМАТИЧНИЙ ЗАХИСТ (Failsafe)</tspan><tspan x="860.0" dy="13.0">Ескалація критичної тривоги:</tspan><tspan x="860.0" dy="13.0">Автоповернення (RTL), парашут,</tspan><tspan x="860.0" dy="13.0">безпечне знеструмлення приводів</tspan></text>
<line x1="860.0" y1="346.9" x2="860.0" y2="410.0" stroke="#38a169" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="165.4" y="514.5" width="729.3" height="31.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="530.0" y="533.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Повний фільтраційний конвеєр захищає людину від хибних спрацьовувань, деренчання та вторинних симптомів.</tspan></text>
</svg>