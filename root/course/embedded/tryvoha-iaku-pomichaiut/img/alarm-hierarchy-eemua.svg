<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія та розподіл пріоритетів тривог за EEMUA 191 / ANSI/ISA-18.2</text>
<rect x="160.0" y="85.2" width="180.0" height="59.6" rx="6" fill="#fed7d7" stroke="#e53e3e" stroke-width="2.0"/><text x="250.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">CRITICAL / EMERGENCY</tspan><tspan x="250.0" dy="14.3">~5% (до 5 шт)</tspan><tspan x="250.0" dy="14.3">Дія &lt; 10–30 с</tspan></text>
<rect x="110.0" y="195.2" width="280.0" height="59.6" rx="6" fill="#feebc8" stroke="#dd6b20" stroke-width="2.0"/><text x="250.0" y="214.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">WARNING / HIGH</tspan><tspan x="250.0" dy="14.3">~15% (15–20 шт)</tspan><tspan x="250.0" dy="14.3">Дія 1–5 хв</tspan></text>
<rect x="60.0" y="325.2" width="380.0" height="59.6" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="2.0"/><text x="250.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">ADVISORY / LOW / INFO</tspan><tspan x="250.0" dy="14.3">~80% (основний масив сповіщень)</tspan><tspan x="250.0" dy="14.3">Дія не критична (&gt; 10 хв)</tspan></text>
<line x1="250.0" y1="150.0" x2="250.0" y2="185.0" stroke="#e53e3e" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="250.0" y1="265.0" x2="250.0" y2="310.0" stroke="#dd6b20" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="75.0" width="535.0" height="100.0" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/>
<rect x="490.0" y="75.0" width="8.0" height="100.0" rx="2" fill="#e53e3e" stroke="none" stroke-width="1.5"/>
<text x="510.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9b2c2c" text-anchor="start" font-weight="700">КРИТИЧНИЙ (Critical / Emergency): Час дії &lt; 10–30 с</text>
<text x="510.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2d3748" text-anchor="start">• Наслідок: Негайна загроза втрати апарата, зіткнення чи травмування</text>
<text x="510.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2d3748" text-anchor="start">• Візуал: Червоний, миготіння 3–4 Гц, спливаюче модальне вікно</text>
<text x="510.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2d3748" text-anchor="start">• Аудіо: Високочастотний переривчастий тон 3 кГц (4 Гц) + вібрація пульта</text>
<rect x="490.0" y="190.0" width="535.0" height="100.0" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
<rect x="490.0" y="190.0" width="8.0" height="100.0" rx="2" fill="#dd6b20" stroke="none" stroke-width="1.5"/>
<text x="510.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c05621" text-anchor="start" font-weight="700">ПОПЕРЕДЖЕННЯ (Warning / High): Час дії 1–5 хв</text>
<text x="510.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2d3748" text-anchor="start">• Наслідок: Деградація резерву, перегрів, дефіцит заряду батареї</text>
<text x="510.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2d3748" text-anchor="start">• Візуал: Жовтий / помаранчевий, миготіння 1 Гц, банер у статус-барі</text>
<text x="510.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2d3748" text-anchor="start">• Аудіо: Двотоновий сигнал 1.5 кГц (1 Гц), повтор кожні 15–30 с</text>
<rect x="490.0" y="305.0" width="535.0" height="100.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
<rect x="490.0" y="305.0" width="8.0" height="100.0" rx="2" fill="#4a5568" stroke="none" stroke-width="1.5"/>
<text x="510.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2d3748" text-anchor="start" font-weight="700">ІНФОРМАЦІЙНИЙ (Advisory / Low): Час дії не критичний (&gt; 10 хв)</text>
<text x="510.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2d3748" text-anchor="start">• Наслідок: Перемикання режимів, завершення місії, планові події</text>
<text x="510.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2d3748" text-anchor="start">• Візуал: Синій / сірий / бірюзовий, статична іконка, запис у журнал</text>
<text x="510.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2d3748" text-anchor="start">• Аудіо: Без звуку або одиничний м'який гонг при появі</text>
<rect x="30.0" y="450.2" width="1000.0" height="59.6" rx="6" fill="#eef2f7" stroke="#2b6cb0" stroke-width="1.5"/><text x="530.0" y="469.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Нормативи частоти появи тривог за EEMUA 191:</tspan><tspan x="530.0" dy="14.3">• У сталому режимі: ≤ 1 тривога за 10 хв (≤ 0.1 тривоги/хв)</tspan><tspan x="530.0" dy="14.3">• Під час аварійного збурення: ≤ 10 тривог за перші 10 хв процесу</tspan></text>
</svg>