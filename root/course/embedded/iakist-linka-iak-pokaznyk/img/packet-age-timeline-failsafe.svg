<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вік даних і східчастий failsafe</text>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вік даних (Packet Age) та східчасті пороги аварійного захисту (Failsafe)</text>
<rect x="60.0" y="110.0" width="80.0" height="50.0" rx="0" fill="#d5e8d4" stroke="#27ae60" stroke-width="1.5"/>
<text x="100.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Норма</text>
<rect x="140.0" y="110.0" width="120.0" height="50.0" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="200.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45f06" text-anchor="middle" font-weight="700">Hold Last</text>
<rect x="260.0" y="110.0" width="240.0" height="50.0" rx="0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="380.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45f06" text-anchor="middle" font-weight="700">Stage 1: Горизонт / Warning</text>
<rect x="500.0" y="110.0" width="320.0" height="50.0" rx="0" fill="#f8cecc" stroke="#c0392b" stroke-width="1.5"/>
<text x="660.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Stage 2: Аварійний RTL / Посадка</text>
<line x1="60.0" y1="160.0" x2="60.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="60.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">0 мс</text>
<line x1="140.0" y1="160.0" x2="140.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="140.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">50 мс</text>
<line x1="260.0" y1="160.0" x2="260.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="260.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">200 мс</text>
<line x1="500.0" y1="160.0" x2="500.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="500.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1000 мс (1 с)</text>
<line x1="820.0" y1="160.0" x2="820.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2.5 с+</text>
<rect x="60.0" y="210.0" width="175.0" height="135.0" rx="6" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.2"/>
<text x="147.5" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">0 – 50 мс</text>
<text x="147.5" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="147.5" dy="0.0">• Пакети надходять</tspan><tspan x="147.5" dy="12.8">• Вік скидається в 0</tspan><tspan x="147.5" dy="12.8">• Пряме керування</tspan><tspan x="147.5" dy="12.8">без затримок</tspan></text>
<rect x="255.0" y="210.0" width="175.0" height="135.0" rx="6" fill="#fffdf5" stroke="#d6b656" stroke-width="1.2"/>
<text x="342.5" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45f06" text-anchor="middle" font-weight="700">50 – 200 мс</text>
<text x="342.5" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="342.5" dy="0.0">• Втрата 2–10 пакетів</tspan><tspan x="342.5" dy="12.8">• Утримання останніх</tspan><tspan x="342.5" dy="12.8">положень стіків</tspan><tspan x="342.5" dy="12.8">• Пілот відчуває легку</tspan><tspan x="342.5" dy="12.8">ватність керма</tspan></text>
<rect x="450.0" y="210.0" width="175.0" height="135.0" rx="6" fill="#fffaf5" stroke="#d79b00" stroke-width="1.2"/>
<text x="537.5" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45f06" text-anchor="middle" font-weight="700">200 – 1000 мс</text>
<text x="537.5" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="537.5" dy="0.0">• Зумер / OSD тривога</tspan><tspan x="537.5" dy="12.8">• Автостабілізація:</tspan><tspan x="537.5" dy="12.8">скидання крену/тангажу</tspan><tspan x="537.5" dy="12.8">• Газ у позицію зависання</tspan><tspan x="537.5" dy="12.8">• Чекання лінка</tspan></text>
<rect x="645.0" y="210.0" width="175.0" height="135.0" rx="6" fill="#fdf6f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="732.5" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">понад 1.0 – 1.5 с</text>
<text x="732.5" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="732.5" dy="0.0">• Лінк визнано втраченим</tspan><tspan x="732.5" dy="12.8">• Автономний RTL:</tspan><tspan x="732.5" dy="12.8">набір висоти та політ</tspan><tspan x="732.5" dy="12.8">до точки зльоту</tspan><tspan x="732.5" dy="12.8">• Або аварійна посадка</tspan></text>
</svg>