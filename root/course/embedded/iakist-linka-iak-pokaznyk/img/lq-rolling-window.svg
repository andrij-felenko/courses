<text x="65.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Структура в оперативній пам'яті MCU (Бітова маска вікна на N = 100 пакетів)</text>
<rect x="65.0" y="202.0" width="430.0" height="42.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="280.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">uint32_t window[4]  →  100 біт (1 = OK, 0 = Lost)</text>
<rect x="515.0" y="202.0" width="280.0" height="82.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="655.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">LQ = (Прийнято / 100) × 100%</text>
<text x="655.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">LQ = (93 / 100) × 100% = 93%</text>
<text x="655.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Швидкий popcount() за 1 такт</text>
<text x="65.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Кожен новий пакет витісняє найстаріший біт: вікно постійно ковзає в часі</text>
<text x="65.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• 1 втрачений пакет дає LQ 99%; пачка з 10 втрат знижує LQ до 90% без розриву лінка</text>
<text x="65.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Приймач знає про пропущений пакет за таймером чергового слота, навіть якщо пакет не прийшов взагалі</text>
