<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічна адаптація потужності та швидкості</text>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двовимірна динамічна адаптація радіолінка (Power + Packet Rate)</text>
<rect x="50.0" y="65.0" width="360.0" height="305.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="230.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Важіль 1: Динамічна потужність (Dynamic Power)</text>
<rect x="65.0" y="111.0" width="330.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="75.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">25 мВт (14 дБм)</text>
<text x="75.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Близька дистанція, холодна електроніка, економія батареї</text>
<text x="385.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">▼</text>
<rect x="65.0" y="169.0" width="330.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="75.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">100 мВт (20 дБм)</text>
<text x="75.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Початкова деградація SNR (&lt; +10 дБ)</text>
<text x="385.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">▼</text>
<rect x="65.0" y="227.0" width="330.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="75.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">250 мВт (24 дБм)</text>
<text x="75.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Посилення завади / вихід за зону прямої видимості</text>
<text x="385.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">▼</text>
<rect x="65.0" y="285.0" width="330.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="75.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">1000 мВт (30 дБм / 1 Вт)</text>
<text x="75.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Критичне падіння SNR (&lt; +2 дБ), максимальна потужність</text>
<rect x="470.0" y="65.0" width="360.0" height="305.0" rx="8" fill="#fdfbf7" stroke="#b45f06" stroke-width="1.5"/>
<text x="650.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45f06" text-anchor="middle" font-weight="700">Важіль 2: Динамічна швидкість (Dynamic Rate)</text>
<rect x="485.0" y="111.0" width="330.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="495.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45f06" text-anchor="start" font-weight="700">500 Гц (LoRa SF5 / BW500)</text>
<text x="495.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Затримка 2 мс, чутливість -105 дБм (для динамічного FPV)</text>
<text x="805.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45f06" text-anchor="middle">▼</text>
<rect x="485.0" y="169.0" width="330.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="495.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45f06" text-anchor="start" font-weight="700">250 Гц (LoRa SF6 / BW500)</text>
<text x="495.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Затримка 4 мс, чутливість -108 дБм</text>
<text x="805.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45f06" text-anchor="middle">▼</text>
<rect x="485.0" y="227.0" width="330.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="495.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45f06" text-anchor="start" font-weight="700">100 Гц (LoRa SF7 / BW500)</text>
<text x="495.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Затримка 10 мс, чутливість -112 дБм</text>
<text x="805.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45f06" text-anchor="middle">▼</text>
<rect x="485.0" y="285.0" width="330.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="495.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45f06" text-anchor="start" font-weight="700">50 Гц (LoRa SF8 / BW250)</text>
<text x="495.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Затримка 20 мс, чутливість -117 дБм (далекий зв'язок)</text>
<line x1="410.0" y1="217.5" x2="470.0" y2="217.5" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="205.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потужність в стелі 1 Вт,</text>
<text x="440.0" y="237.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">а SNR падає → знижуємо Rate</text>
</svg>