<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="460.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура енергонезалежного дампа інциденту (Incident Snapshot Frame)</text>
<rect x="30.0" y="65.0" width="780.0" height="42.0" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<rect x="36.0" y="71.0" width="110.0" height="30.0" rx="3" fill="#ffffff" stroke="#b91c1c" stroke-width="1.0"/>
<text x="91.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">0x00..0x03</text>
<text x="160.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Magic Header (0xDEADBEEF)</text>
<text x="390.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Сигнатура валідності кадру та версія формату протоколу</text>
<rect x="30.0" y="115.0" width="780.0" height="42.0" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="36.0" y="121.0" width="110.0" height="30.0" rx="3" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="91.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">0x04..0x0B</text>
<text x="160.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">RTC Epoch &amp; Boot Counter</text>
<text x="390.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Мітка часу збою (Unix timestamp) та номер циклу завантаження</text>
<rect x="30.0" y="165.0" width="780.0" height="42.0" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<rect x="36.0" y="171.0" width="110.0" height="30.0" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="1.0"/>
<text x="91.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">0x0C..0x0F</text>
<text x="160.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Reset Flags (RCC_CSR)</text>
<text x="390.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Апаратна причина: IWDG, WWDG, Brown-Out (BOR), Soft Reset, PIN</text>
<rect x="30.0" y="215.0" width="780.0" height="42.0" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="36.0" y="221.0" width="110.0" height="30.0" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="91.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">0x10..0x1F</text>
<text x="160.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">CPU Crash Context</text>
<text x="390.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Регістри HardFault: PC (адреса збою), LR, CFSR, HFSR, MMFAR, BFAR</text>
<rect x="30.0" y="265.0" width="780.0" height="42.0" rx="5" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<rect x="36.0" y="271.0" width="110.0" height="30.0" rx="3" fill="#ffffff" stroke="#047857" stroke-width="1.0"/>
<text x="91.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="middle" font-weight="700">0x20..0x2F</text>
<text x="160.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">RTOS &amp; Task State</text>
<text x="390.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Ідентифікатор активного потоку, залишок стека (Stack Watermark)</text>
<rect x="30.0" y="315.0" width="780.0" height="42.0" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<rect x="36.0" y="321.0" width="110.0" height="30.0" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="1.0"/>
<text x="91.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="700">0x30..0x3F</text>
<text x="160.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Hardware &amp; Bus Counters</text>
<text x="390.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Лічильники I2C NACK, SPI таймаутів, UART Frame Errors, Flash CRC</text>
<rect x="30.0" y="365.0" width="780.0" height="42.0" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<rect x="36.0" y="371.0" width="110.0" height="30.0" rx="3" fill="#ffffff" stroke="#c2410c" stroke-width="1.0"/>
<text x="91.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="700">0x40..0x4B</text>
<text x="160.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Environmental Metrics</text>
<text x="390.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Напруга живлення VDD (мВ), температура кристала (°C), RSSI (дБм)</text>
<rect x="30.0" y="415.0" width="780.0" height="42.0" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<rect x="36.0" y="421.0" width="110.0" height="30.0" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.0"/>
<text x="91.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">0x4C..0x4F</text>
<text x="160.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Frame CRC32 Checksum</text>
<text x="390.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Контрольна сума захисту цілісності даних при аварійному вимкненні</text>
</svg>