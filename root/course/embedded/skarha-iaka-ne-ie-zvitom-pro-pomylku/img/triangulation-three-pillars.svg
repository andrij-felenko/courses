<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="500.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріангуляція апаратного інциденту: три вектори фактів</text>
<rect x="35.0" y="70.0" width="240.0" height="240.0" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.0"/>
<rect x="35.0" y="70.0" width="240.0" height="36.0" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="155.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">1. Бортовий Blackbox і логи</text>
<text x="47.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Прапори перезапуску (RCC_CSR)</text>
<text x="47.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Регістри CPU: PC, LR, CFSR</text>
<text x="47.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Водяні знаки стеків потоків RTOS</text>
<text x="47.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Лічильники I2C/SPI таймаутів</text>
<text x="47.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Кільцевий буфер подій перед збоєм</text>
<rect x="565.0" y="70.0" width="240.0" height="240.0" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2.0"/>
<rect x="565.0" y="70.0" width="240.0" height="36.0" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/>
<text x="685.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#047857" text-anchor="middle" font-weight="700">2. Ревізія заліза та BOM</text>
<text x="577.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ревізія друкованої плати (PCB rev)</text>
<text x="577.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Партія та датакод компонентів</text>
<text x="577.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Альтернативний вендор LDO / Flash</text>
<text x="577.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Номінали підтягуючих резисторів</text>
<text x="577.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Відомі кремнієві Errata процесора</text>
<rect x="300.0" y="325.0" width="240.0" height="170.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2.0"/>
<rect x="300.0" y="325.0" width="240.0" height="36.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="420.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">3. Телеметрія середовища</text>
<text x="312.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Гістограма просідань напруги батареї</text>
<text x="312.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Профіль температури кристала й плати</text>
<text x="312.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Рівень шуму RSSI та якість радіозв'язку</text>
<text x="312.0" y="469.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Історія циклів сну / пробудження</text>
<rect x="300.0" y="110.0" width="240.0" height="160.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="420.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">ВСТАНОВЛЕНИЙ ІНЖЕНЕРНИЙ ФАКТ</text>
<line x1="320.0" y1="154.0" x2="520.0" y2="154.0" stroke="#7c3aed" stroke-width="1.2"/>
<text x="420.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точний стан апарата під час збою:</text>
<text x="420.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">V_bat=3.12V, T=+63°C, PCB rev B</text>
<text x="420.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">I2C SDA зависла через 10k pullup</text>
<text x="420.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="700">Повна відтворюваність на стенді</text>
<line x1="275.0" y1="160.0" x2="295.0" y2="160.0" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="565.0" y1="160.0" x2="545.0" y2="160.0" stroke="#047857" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="420.0" y1="320.0" x2="420.0" y2="275.0" stroke="#b45309" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>