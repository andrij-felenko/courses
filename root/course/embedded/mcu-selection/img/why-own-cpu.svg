<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому Acorn вирішила зробити власний процесор</text>
<rect x="60.0" y="55.0" width="220.0" height="240.0" rx="10" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="170.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Глухий кут</text>
<rect x="125.4" y="87.3" width="89.2" height="39.3" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.0"/>
<text x="170.0" y="103.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">6502 (8-біт)</tspan><tspan x="170.0" dy="14.3">BBC Micro</tspan></text>
<text x="170.0" y="140.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">→ стеля продуктивності</text>
<rect x="119.1" y="152.7" width="101.8" height="39.3" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.0"/>
<text x="170.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Motorola 68000</tspan><tspan x="170.0" dy="14.3">16-біт CISC</tspan></text>
<text x="170.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">✗ повільна реакція</text>
<rect x="119.1" y="218.0" width="101.8" height="39.3" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.0"/>
<text x="170.0" y="234.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">National 32016</tspan><tspan x="170.0" dy="14.3">16-біт CISC</tspan></text>
<text x="170.0" y="271.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">✗ висока латентність</text>
<line x1="284.0" y1="175.0" x2="316.0" y2="175.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="55.0" width="220.0" height="240.0" rx="10" fill="#fffbea" stroke="#d97706" stroke-width="2.0"/>
<text x="430.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Поворот</text>
<text x="430.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Візит у Western</tspan><tspan x="430.0" dy="14.1">Design Center,</tspan><tspan x="430.0" dy="14.1">Фенікс (1983)</tspan><tspan x="430.0" dy="14.1"></tspan><tspan x="430.0" dy="14.1">Очікували:</tspan><tspan x="430.0" dy="14.1">корпорацію-гіганта</tspan><tspan x="430.0" dy="14.1"></tspan><tspan x="430.0" dy="14.1">Побачили:</tspan><tspan x="430.0" dy="14.1">кімнату + жменю</tspan><tspan x="430.0" dy="14.1">інженерів зі</tspan><tspan x="430.0" dy="14.1">студентами</tspan><tspan x="430.0" dy="14.1"></tspan><tspan x="430.0" dy="14.1">→ «якщо ВОНИ</tspan><tspan x="430.0" dy="14.1">можуть — і ми»</tspan></text>
<line x1="544.0" y1="175.0" x2="576.0" y2="175.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="580.0" y="55.0" width="220.0" height="240.0" rx="10" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="690.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Рішення</text>
<text x="690.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Спроєктувати</tspan><tspan x="690.0" dy="14.1">ВЛАСНЕ RISC-ядро</tspan><tspan x="690.0" dy="14.1"></tspan><tspan x="690.0" dy="14.1">Ключові ролі:</tspan><tspan x="690.0" dy="14.1">Sophie Wilson</tspan><tspan x="690.0" dy="14.1">→ система команд</tspan><tspan x="690.0" dy="14.1">(ISA)</tspan><tspan x="690.0" dy="14.1"></tspan><tspan x="690.0" dy="14.1">Steve Furber</tspan><tspan x="690.0" dy="14.1">→ мікроархітек-</tspan><tspan x="690.0" dy="14.1">тура й логіка</tspan><tspan x="690.0" dy="14.1"></tspan><tspan x="690.0" dy="14.1">Команда Acorn</tspan><tspan x="690.0" dy="14.1">→ кремній і тести</tspan></text>
<text x="410.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Технічний тупик + знятий психологічний бар'єр = народження ARM</text>
</svg>