<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="390.0" height="340.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінематика маніпулятора та реакція</text><rect x="125.0" y="105.0" width="180.0" height="30.0" rx="4" fill="#e5e7eb" stroke="#333333" stroke-width="2.0"/><text x="215.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Корпус апарата (m_frame)</text><circle cx="215.0" cy="135.0" r="8.0" fill="#9ca3af" stroke="#333333" stroke-width="1.5"/><line x1="215.0" y1="135.0" x2="272.4" y2="216.9" stroke="#333333" stroke-width="4.0"/><circle cx="272.4" cy="216.9" r="22.0" fill="#fde68a" stroke="#d97706" stroke-width="2.0"/><text x="272.4" y="220.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">m_p</text><line x1="250.0" y1="185.0" x2="270.0" y2="175.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><text x="290.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">+α_arm</text><line x1="185.0" y1="90.0" x2="155.0" y2="90.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="170.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">M_react = −I_arm · α_arm</text><text x="215.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічні збурення при русі:</text><text x="215.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Реактивний крутний момент: M_react = −I_p · α_p</text><text x="215.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Коріолісові сили: F_cor = 2 · m_p · (ω_body × v_rel)</text><text x="215.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">• Зсув миттєвого центру мас: r_cg(t)</text><rect x="430.0" y="20.0" width="390.0" height="340.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Деформація тензора інерції I(t)</text><rect x="460.0" y="75.0" width="330.0" height="110.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="485.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">I(t) =</text><text x="565.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">I_xx(t)   −I_xy(t)   −I_xz(t)</text><text x="565.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">−I_yx(t)   I_yy(t)   −I_yz(t)</text><text x="565.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">−I_zx(t)   −I_zy(t)   I_zz(t)</text><rect x="450.0" y="205.0" width="350.0" height="65.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/><text x="625.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Поява недіагональних членів (I_xy, I_xz ≠ 0)</text><text x="625.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Обертання по крену генерує паразитний тангаж і рискання</text><text x="625.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(динамічне перехресне зв'язування каналів)</text><rect x="450.0" y="280.0" width="350.0" height="65.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.0"/><text x="625.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Зміна власної частоти контуру керування</text><text x="625.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">При висуванні руки I_yy зростає в 2–3 рази →</text><text x="625.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">PID-регулятор втрачає жорсткість (перерегулювання)</text>
</svg>