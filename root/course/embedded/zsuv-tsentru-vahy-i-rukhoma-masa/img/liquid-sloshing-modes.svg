<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="255.0" height="350.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/><text x="147.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Вільна поверхня</text><text x="147.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Бак без перегородок)</text><rect x="55.0" y="85.0" width="185.0" height="150.0" rx="8" fill="#f1f5f9" stroke="#333333" stroke-width="2.0"/><path d="M 55 185 Q 147 140 240 115 L 240 235 L 55 235 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/><circle cx="185.0" cy="180.0" r="6.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/><text x="185.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">CG_fluid</text><line x1="85.0" y1="200.0" x2="195.0" y2="130.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><text x="140.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Перетікання</text><text x="147.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Хвиля відстає за фазою</text><text x="147.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Фазовий зсув: Δφ ≈ 90°–180°</text><text x="147.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Резонансна частота:</text><text x="147.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ω_s = √( (g/R) · tanh(h/R) )</text><text x="147.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ризик: розгойдування (PIO)</text><rect x="290.0" y="20.0" width="260.0" height="350.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Маятниковий еквівалент</text><text x="420.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Модель для симуляції)</text><rect x="325.0" y="85.0" width="190.0" height="150.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><circle cx="420.0" cy="185.0" r="14.0" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">m₀</text><text x="420.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Нерухома маса</text><circle cx="420.0" cy="95.0" r="5.0" fill="#333333" stroke="#ffffff" stroke-width="1.0"/><text x="435.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Шарнір h_p</text><line x1="420.0" y1="95.0" x2="470.0" y2="160.0" stroke="#c0392b" stroke-width="2.0"/><line x1="400.0" y1="125.0" x2="450.0" y2="160.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2 2"/><text x="365.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">c_slosh</text><circle cx="470.0" cy="160.0" r="14.0" fill="#fca5a5" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">m₁</text><text x="492.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">L_p</text><text x="420.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Параметри еквівалента:</text><text x="420.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• m₁: коливна частка рідини</text><text x="420.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• m₀: жорстко зв'язана частка</text><text x="420.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• L_p: довжина еквівалента</text><text x="420.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">• c_slosh: гідродинамічне тертя</text><rect x="565.0" y="20.0" width="255.0" height="350.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/><text x="692.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Бак із хвилерізами</text><text x="692.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">(Гасіння коливань)</text><rect x="600.0" y="85.0" width="185.0" height="150.0" rx="8" fill="#f1f5f9" stroke="#333333" stroke-width="2.0"/><rect x="600.0" y="150.0" width="185.0" height="85.0" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.0"/><line x1="660.0" y1="95.0" x2="660.0" y2="235.0" stroke="#333333" stroke-width="3.0"/><line x1="725.0" y1="95.0" x2="725.0" y2="235.0" stroke="#333333" stroke-width="3.0"/><circle cx="660.0" cy="165.0" r="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><circle cx="725.0" cy="165.0" r="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><circle cx="660.0" cy="190.0" r="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><circle cx="725.0" cy="190.0" r="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><circle cx="660.0" cy="215.0" r="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><circle cx="725.0" cy="215.0" r="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="692.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перегородки</text><text x="692.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат захисту:</text><text x="692.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Зсув частоти у ВЧ-зону (&gt;10 Гц)</text><text x="692.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Дроблення макрохвилі на вихори</text><text x="692.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Демпфування зростає у 5–8 разів</text><text x="692.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">• Стійкість польоту збережено</text>
</svg>