<rect x="345.0" y="140.0" width="150.0" height="30.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.3"/><text x="420.0" y="158.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">nonce №7</tspan></text>
<rect x="345.0" y="176.0" width="150.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="420.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">дані (plaintext)</tspan></text>
