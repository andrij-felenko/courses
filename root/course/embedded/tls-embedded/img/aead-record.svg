<rect x="70.0" y="140.0" width="200.0" height="32.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="170.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">nonce запису №7 (унікальний)</tspan></text>
