<rect x="566.0" y="176.0" width="200.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="666.0" y="195.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="666.0" dy="0.0">тег цілісності (16 Б)</tspan><tspan x="666.0" dy="12.3">підправив — не сходиться</tspan></text>
<rect x="50.0" y="296.0" width="700.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="400.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Лічильник seq зростає на кожен запис і НІКОЛИ не повторюється в межах ключа —</tspan><tspan x="400.0" dy="13.7">тому nonce унікальний без жодного зайвого байта в дроті (на відміну від TLS 1.2).</tspan><tspan x="400.0" dy="13.7">seq входить і в тег через AAD: викинули чи переставили запис — тег не збігся, запис відкинуто.</tspan><tspan x="400.0" dy="13.7">Один ключ, один IV на з'єднання; уся унікальність — з лічильника.</tspan></text>
</svg>