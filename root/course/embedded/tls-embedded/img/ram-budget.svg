<rect x="50.0" y="333.0" width="700.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="400.0" y="350.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Два буфери запису домінують. Домовились про запис 4 КБ замість 16 КБ —</tspan><tspan x="400.0" dy="13.7">і найбільший з'їдач падає вчетверо. На чипі з 300 КБ це різниця між «влізло» і «ні».</tspan></text>
