<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приватний ключ не виходить: підписує сам захищений елемент</text>
<rect x="40.0" y="70.0" width="300.0" height="200.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.6"/><text x="190.0" y="173.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0"></tspan></text>
<text x="190.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">прошивка (mbedTLS)</text>
<rect x="60.0" y="110.0" width="260.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">TLS-рукостискання</tspan><tspan x="190.0" dy="13.7">дійшло до CertificateVerify</tspan></text>
<rect x="60.0" y="170.0" width="260.0" height="40.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="186.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">PK-контекст</tspan><tspan x="190.0" dy="13.7">(лише ОБГОРТКА на ручку ключа)</tspan></text>
<rect x="440.0" y="70.0" width="300.0" height="200.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/><text x="590.0" y="173.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0"></tspan></text>
<text x="590.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">захищений елемент</text>
<rect x="460.0" y="114.0" width="260.0" height="44.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.6"/><text x="590.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">приватний ключ</tspan><tspan x="590.0" dy="13.0">народжений і замкнений тут</tspan><tspan x="590.0" dy="13.0">(назовні шляху немає)</tspan></text>
<rect x="460.0" y="180.0" width="260.0" height="40.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">робить операцію підпису</tspan><tspan x="590.0" dy="13.0">всередині, ключем зі свого нутра</tspan></text>
<line x1="344.0" y1="188.0" x2="436.0" y2="188.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="390.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">«підпиши оце»</text>
<line x1="436.0" y1="220.0" x2="344.0" y2="220.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="390.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">лише підпис</text>
<rect x="40.0" y="286.0" width="700.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="390.0" y="301.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Дамп Flash ключа не містить: він у елементі. Прошивка бачить лише результат підпису, не сам ключ.</tspan></text>
</svg>