<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три порції шуму — три різні шляхи підсилення</text>
<rect x="190.0" y="120.0" width="120.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="250.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">каскад 1</text><text x="250.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">× G₁</text>
<rect x="410.0" y="120.0" width="120.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="470.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">каскад 2</text><text x="470.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">× G₂</text>
<line x1="70.0" y1="150.0" x2="190.0" y2="150.0" stroke="#333333" stroke-width="2.0"/>
<line x1="310.0" y1="150.0" x2="410.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="150.0" x2="660.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="70.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">вхід</text>
<text x="658.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">вихід</text>
<circle cx="150.0" cy="94.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="150.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="150.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">N₀ + N₁</text>
<line x1="150.0" y1="103.0" x2="150.0" y2="141.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="150.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">входять на самому</text>
<text x="150.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">початку → × G₁·G₂</text>
<circle cx="370.0" cy="94.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="370.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="370.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">N₂</text>
<line x1="370.0" y1="103.0" x2="370.0" y2="141.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="370.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">втручається пізніше</text>
<text x="370.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">→ лише × G₂</text>
<rect x="76.9" y="279.0" width="566.2" height="42.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">на спільний вхід:  N₁ + N₂ / G₁     →     F = F₁ + (F₂−1) / G₁</tspan></text>
