<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловий ланцюг розсіювання потужності силового компонента</text>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловий ланцюг: розсіювання тепла від кристала в довкілля</text>
<rect x="47.3" y="76.5" width="305.4" height="37.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="200.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Кристал мікросхеми (Junction)  T_j</tspan><tspan x="200.0" dy="13.0">Генерація тепла P_loss = (V_in − V_out) · I_out</tspan></text>
<rect x="70.0" y="137.5" width="260.0" height="35.0" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.6"/><text x="200.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Теплове падло корпусу (Exposed Pad)  T_c</tspan><tspan x="200.0" dy="13.0">Тепловий опір θ_JC</tspan></text>
<line x1="200.0" y1="118.0" x2="200.0" y2="132.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="32.8" y="197.5" width="334.4" height="35.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="200.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Верхній мідний полігон друкованої плати (Top Copper)</tspan><tspan x="200.0" dy="13.0">Пайка припоєм до термопаду (опір θ_CS)</tspan></text>
<line x1="200.0" y1="178.0" x2="200.0" y2="192.0" stroke="#e67e22" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="45.8" y="267.5" width="308.4" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Масив теплових перехідних отворів (Thermal Vias 3×3)</tspan><tspan x="200.0" dy="13.0">Текстоліт FR4 (товщина 1.6 мм, крок віасів 1.0 мм)</tspan></text>
<line x1="200.0" y1="238.0" x2="200.0" y2="262.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="39.0" y="337.5" width="322.0" height="35.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="200.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Нижній суцільний мідний шар заземлення (GND Plane)</tspan><tspan x="200.0" dy="13.0">Розсіювання тепла в повітря конвекцією (опір θ_SA)</tspan></text>
<line x1="200.0" y1="308.0" x2="200.0" y2="332.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="57.6" y="403.5" width="284.8" height="23.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="200.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Навколишнє середовище (Ambient air)  T_a</tspan></text>
<line x1="200.0" y1="378.0" x2="200.0" y2="395.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="600.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еквівалентна теплова схема (аналог закону Ома)</text>
<rect x="454.5" y="104.0" width="291.0" height="22.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="118.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Джерело тепла P_loss = (V_in − V_out) · I_out</tspan></text>
<line x1="600.0" y1="135.0" x2="600.0" y2="153.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="519.6" y="157.5" width="160.8" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="600.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">θ_JC (перехід − корпус)</tspan><tspan x="600.0" dy="13.0">внутрішній опір кристала</tspan></text>
<line x1="600.0" y1="197.0" x2="600.0" y2="223.0" stroke="#e67e22" stroke-width="2.0"/>
<rect x="522.7" y="227.5" width="154.6" height="35.0" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.6"/><text x="600.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">θ_CS (корпус − полігон)</tspan><tspan x="600.0" dy="13.0">термопаста / пайка</tspan></text>
<line x1="600.0" y1="267.0" x2="600.0" y2="293.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="516.5" y="297.5" width="167.0" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="600.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">θ_SA (полігон − повітря)</tspan><tspan x="600.0" dy="13.0">площа міді + сітка віасів</tspan></text>
<line x1="600.0" y1="337.0" x2="600.0" y2="370.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="505.3" y="373.5" width="189.3" height="23.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="388.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">T_a (температура довкілля)</tspan></text>
</svg>