<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 838.6 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="838.6" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура розподілу живлення багатокомпонентної плати</text>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двокаскадна архітектура живлення змішаної плати</text>
<rect x="20.6" y="192.2" width="138.8" height="55.6" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.8"/><text x="90.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Джерело</tspan><tspan x="90.0" dy="14.3">Li-Ion (3.0–4.2 В)</tspan><tspan x="90.0" dy="14.3">або USB (5.0 В)</tspan></text>
<rect x="149.6" y="195.0" width="150.8" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Вхідний захист</tspan><tspan x="225.0" dy="13.0">• Ключ від переполюсовки</tspan><tspan x="225.0" dy="13.0">• eFuse / Inrush limiter</tspan></text>
<line x1="145.0" y1="220.0" x2="165.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="278.9" y="184.1" width="202.1" height="71.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="380.0" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Синхронний Buck DC-DC</tspan><tspan x="380.0" dy="14.3">• ККД ≈ 92%</tspan><tspan x="380.0" dy="14.3">• Вихід: шина 3.6 В / 1.5 А</tspan><tspan x="380.0" dy="14.3">(проміжна шина)</tspan></text>
<line x1="288.0" y1="220.0" x2="305.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="465.0" cy="220.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<line x1="455.0" y1="220.0" x2="465.0" y2="220.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="465.0" y1="220.0" x2="465.0" y2="120.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="465.0" y1="120.0" x2="520.0" y2="120.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="545.5" y="80.0" width="228.9" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="660.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Цифровий домен (Шина 3.3 В):</tspan><tspan x="660.0" dy="13.0">• Мікроконтролер (ядро + периферія)</tspan><tspan x="660.0" dy="13.0">• Радіотрансивер (Wi-Fi / BLE / LoRa)</tspan><tspan x="660.0" dy="13.0">• Зовнішня пам'ять SPI Flash / FRAM</tspan><tspan x="660.0" dy="13.0">• Світлодіоди та дисплей</tspan></text>
<line x1="465.0" y1="220.0" x2="465.0" y2="340.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="465.0" y1="340.0" x2="510.0" y2="340.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="453.5" y="307.5" width="233.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="570.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Вторинний LDO (High PSRR)</tspan><tspan x="570.0" dy="13.0">• Вхід: 3.6 В → Вихід: 3.3 В</tspan><tspan x="570.0" dy="13.0">• Падіння ΔV = 0.3 В (малий нагрів)</tspan><tspan x="570.0" dy="13.0">• Придушення шуму &gt; 60 дБ</tspan></text>
<line x1="645.0" y1="340.0" x2="680.0" y2="340.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="671.5" y="307.5" width="147.1" height="65.0" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.8"/><text x="745.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Аналоговий тракт:</tspan><tspan x="745.0" dy="13.0">• 16-бітний АЦП</tspan><tspan x="745.0" dy="13.0">• Прецизійна опора Vref</tspan><tspan x="745.0" dy="13.0">• Підсилювачі сенсорів</tspan></text>
<text x="410.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Buck бере на себе високий струм і ККД, а вторинний LDO очищає живлення аналогових кіл від комутаційного шуму</text>
</svg>