<text x="145.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Системний шар</text>
<text x="145.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Чистий C++ / C API)</text>
<line x1="55.0" y1="134.0" x2="235.0" y2="134.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="145.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">class ISensor {</tspan><tspan x="145.0" dy="14.3">  virtual Result&lt;Reading&gt;</tspan><tspan x="145.0" dy="14.3">    read() = 0;</tspan><tspan x="145.0" dy="14.3">};</tspan><tspan x="145.0" dy="14.3"></tspan><tspan x="145.0" dy="14.3">Бізнес-логіка проєкту</tspan><tspan x="145.0" dy="14.3">НЕ знає про структури</tspan><tspan x="145.0" dy="14.3">Bosch, ST чи TI!</tspan></text>
<rect x="290.0" y="70.0" width="260.0" height="320.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="420.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Клас-Адаптер (Adapter)</text>
<text x="420.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ізоляція та трансляція викликів</text>
<line x1="305.0" y1="134.0" x2="535.0" y2="134.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="420.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">• Зберігає struct bme280_dev</tspan><tspan x="420.0" dy="14.7">• Володіє захистом шини (Mutex)</tspan><tspan x="420.0" dy="14.7">• Статичні колбеки c_read / c_write</tspan><tspan x="420.0" dy="14.7">• Передає this у dev.intf_ptr</tspan><tspan x="420.0" dy="14.7">• Транслює помилки BME_* у Result</tspan><tspan x="420.0" dy="14.7">• Неблокуючий сон у dev.delay_us</tspan><tspan x="420.0" dy="14.7">• Автоматичне вимкнення в RAII</tspan></text>
<rect x="590.0" y="70.0" width="210.0" height="320.0" rx="8" fill="#fff7ed" stroke="#c0392b" stroke-width="1.8"/>
<text x="695.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Вендорський SDK</text>
<text x="695.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Чужий C-код)</text>
<line x1="605.0" y1="134.0" x2="785.0" y2="134.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="695.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">bme280.c / bme280.h</tspan><tspan x="695.0" dy="14.3"></tspan><tspan x="695.0" dy="14.3">• Читання регістрів</tspan><tspan x="695.0" dy="14.3">• Розрахунок формул</tspan><tspan x="695.0" dy="14.3">• Специфічні структури</tspan><tspan x="695.0" dy="14.3">• Коди BME280_E_*</tspan><tspan x="695.0" dy="14.3"></tspan><tspan x="695.0" dy="14.3">Компілюється ізольовано</tspan></text>
