<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири головні підводні камені вендорського коду у вбудованих системах</text>
<rect x="45.0" y="60.0" width="360.0" height="160.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="225.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Динамічна пам'ять (malloc / free)</text>
<line x1="60.0" y1="98.0" x2="390.0" y2="98.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="65.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Непередбачуваний час виділення</text>
<text x="65.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ризик фрагментації heap у тривалому часі</text>
<text x="65.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Збій у mission-critical / MISRA-C системах</text>
<text x="65.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">→ Лікування: статичні дескриптори</text>
<rect x="435.0" y="60.0" width="360.0" height="160.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="615.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Блокуючий busy-wait у затримках</text>
<line x1="450.0" y1="98.0" x2="780.0" y2="98.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="455.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• delay_ms(100) палить мільйони тактів CPU</text>
<text x="455.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Голодування інших потоків у RTOS</text>
<text x="455.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зрив жорстких часових дедлайнів</text>
<text x="455.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">→ Лікування: неблокуючий сон або переривання</text>
<rect x="45.0" y="250.0" width="360.0" height="160.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="225.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Глобальний стан і static буфери</text>
<line x1="60.0" y1="288.0" x2="390.0" y2="288.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="65.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Змінні static всередині функцій драйвера</text>
<text x="65.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Повна втрата реентрантності (reentrancy)</text>
<text x="65.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Неможливо підключити два однакових чипи</text>
<text x="65.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">→ Лікування: контекстний вказівник intf_ptr</text>
<rect x="435.0" y="250.0" width="360.0" height="160.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="615.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Витрати стеку та відсутність меж</text>
<line x1="450.0" y1="288.0" x2="780.0" y2="288.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="455.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Локальні буфери на 512–2048 байтів на стеку</text>
<text x="455.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Миттєвий Stack Overflow у потоці RTOS</text>
<text x="455.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Відсутність перевірок на NULL та межі</text>
<text x="455.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">→ Лікування: адаптер-валідатор і зовнішні буфери</text>
</svg>