<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель багатопотокової безпеки: м'ютекси та неблокуючі затримки в RTOS</text>
<rect x="91.9" y="46.2" width="176.2" height="47.6" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Задача А (Telemetry)</tspan><tspan x="180.0" dy="15.6">Пріоритет: Нормальний</tspan></text>
<rect x="564.4" y="46.2" width="191.1" height="47.6" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Задача Б (Control Loop)</tspan><tspan x="660.0" dy="15.6">Пріоритет: Високий</tspan></text>
