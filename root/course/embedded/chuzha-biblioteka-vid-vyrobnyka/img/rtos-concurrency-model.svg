<rect x="156.3" y="279.1" width="227.5" height="49.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="270.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Затримка &lt; 100 мкс:</tspan><tspan x="270.0" dy="13.7">Апаратний таймер / DWT spin-wait</tspan><tspan x="270.0" dy="13.7">(без оверхеду перемикання контексту)</tspan></text>
<rect x="465.2" y="279.1" width="209.5" height="49.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="570.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Затримка ≥ 1 мс:</tspan><tspan x="570.0" dy="13.7">vTaskDelay() / k_msleep()</tspan><tspan x="570.0" dy="13.7">(віддача процесора іншим задачам)</tspan></text>
