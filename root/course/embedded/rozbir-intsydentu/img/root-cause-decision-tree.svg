<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево діагностичних рішень: розпізнавання відмов за сигнатурами в логах</text>
<rect x="253.0" y="43.8" width="454.0" height="32.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="480.0" y="64.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">СИМПТОМ: втрата керування, зрив орієнтації або зіткнення</tspan></text>
<rect x="35.0" y="145.0" width="285.0" height="36.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.6"/>
<text x="177.5" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. ВІДМОВА ЗАЛІЗА (Hardware)</text>
<line x1="480.0" y1="80.0" x2="177.5" y2="141.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="35.0" y="195.0" width="285.0" height="76.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="45.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Асиметрія моторів</text>
<text x="45.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="45.0" dy="0.0">Один мотор = 100%, протилежний = 0%,</tspan><tspan x="45.0" dy="11.9">а кутова швидкість наростає</tspan><tspan x="45.0" dy="11.9">→ Відмова мотора / ESC / гвинта</tspan></text>
<rect x="35.0" y="281.0" width="285.0" height="76.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="45.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Зависання давача</text>
<text x="45.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="45.0" dy="0.0">Acc/Gyr = const або тайм-аут I2C,</tspan><tspan x="45.0" dy="11.9">нулі в ULog, помилки шини</tspan><tspan x="45.0" dy="11.9">→ Апаратний відвал сенсора</tspan></text>
<rect x="35.0" y="367.0" width="285.0" height="76.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="45.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Провал живлення</text>
<text x="45.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="45.0" dy="0.0">Напруга падає нижче порогу відсічки</tspan><tspan x="45.0" dy="11.9">під час різкого набору газу</tspan><tspan x="45.0" dy="11.9">→ Просадка батареї / Brownout</tspan></text>
<rect x="348.0" y="145.0" width="285.0" height="36.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.6"/>
<text x="490.5" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. ЗБІЙ ОЦІНКИ СТАНУ (EKF)</text>
<line x1="480.0" y1="80.0" x2="490.5" y2="141.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="348.0" y="195.0" width="285.0" height="76.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="358.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Магнітна завада</text>
<text x="358.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="358.0" dy="0.0">Mag innovation стрибає зі струмом,</tspan><tspan x="358.0" dy="11.9">курс Yaw розходиться</tspan><tspan x="358.0" dy="11.9">→ Наведення від силових кабелів</tspan></text>
<rect x="348.0" y="281.0" width="285.0" height="76.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="358.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Зрив GNSS / Супутників</text>
<text x="358.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="358.0" dy="0.0">Стрибок HDOP, різке зростання</tspan><tspan x="358.0" dy="11.9">velocity innovation в EKF</tspan><tspan x="358.0" dy="11.9">→ Глушіння / супутниковий мультипас</tspan></text>
<rect x="348.0" y="367.0" width="285.0" height="76.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="358.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Вібраційний шум</text>
<text x="358.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="358.0" dy="0.0">Кліпінг акселерометра &gt; 0,</tspan><tspan x="358.0" dy="11.9">розмах вібрацій &gt; 30 м/с²</tspan><tspan x="358.0" dy="11.9">→ Відрив демпфера / резонанс</tspan></text>
<rect x="661.0" y="145.0" width="285.0" height="36.0" rx="6" fill="#f4f6f7" stroke="#333333" stroke-width="1.6"/>
<text x="803.5" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. АЛГОРИТМІЧНИЙ ЗБІЙ (Logic)</text>
<line x1="480.0" y1="80.0" x2="803.5" y2="141.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="661.0" y="195.0" width="285.0" height="76.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="671.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="start" font-weight="700">Зациклення місії</text>
<text x="671.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="671.0" dy="0.0">Апарат кружляє навколо точки,</tspan><tspan x="671.0" dy="11.9">радіус досягнення &lt; зносу вітром</tspan><tspan x="671.0" dy="11.9">→ Помилка планування місії</tspan></text>
<rect x="661.0" y="281.0" width="285.0" height="76.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="671.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="start" font-weight="700">Насичення інтегратора</text>
<text x="671.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="671.0" dy="0.0">Integrator windup на обмеженні кута,</tspan><tspan x="671.0" dy="11.9">повільне скидання накопиченої сили</tspan><tspan x="671.0" dy="11.9">→ Перерегулювання та удар</tspan></text>
<rect x="661.0" y="367.0" width="285.0" height="76.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="671.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="start" font-weight="700">Голодування потоків SBC</text>
<text x="671.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="671.0" dy="0.0">Сплеск затримки /cmd_vel &gt; 500 мс,</tspan><tspan x="671.0" dy="11.9">CPU 100%, OOM killer вбив процес</tspan><tspan x="671.0" dy="11.9">→ Зрив offboard-контуру</tspan></text>
<text x="480.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Діагностика полягає у звірці бажаного з дійсним: чи віддав регулятор команду, і чи був фізичний відгук</text>
</svg>