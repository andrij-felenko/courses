<text x="70.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Сумує найгірші відхилення: Δk/k ≈ (1-k)·(δ1 + δ2)</text>
