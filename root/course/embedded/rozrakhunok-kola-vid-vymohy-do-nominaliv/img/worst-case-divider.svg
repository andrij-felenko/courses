<text x="70.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• δ_rss = √((δ_tol)² + (δ_temp)² + (δ_age)²)</text>
<text x="70.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">• Дає реалістичну оцінку для серійного виробництва</text>
