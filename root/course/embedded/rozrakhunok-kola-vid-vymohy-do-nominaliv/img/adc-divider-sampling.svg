<text x="425.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Без C_ext: tau = (66.7 кОм + 2 кОм) * 10 пФ = 687 нс.</text>
<text x="425.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">   Для 12-біт точності треба 9 * tau ≈ 6.2 мкс (АЦП занижує).</text>
<text x="425.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. З C_ext: заряд перетікає з C_ext (100 нФ) у C_sh (10 пФ).</text>
<text x="425.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">   Просідання напруги: 10 пФ / 100 нФ = 0.01% (&lt; 0.5 LSB).</text>
