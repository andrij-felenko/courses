<text x="50.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Висновок: лінійна шкала дає або дірки внизу, або тонни зайвих деталей угорі.</text>
