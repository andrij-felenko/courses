<text x="448.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Сталий відносний крок між усіма сусідами: ~ +21.15%</text>
<text x="448.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• З допуском ±10% сусідні смуги надійно стикаються</text>
<text x="448.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Будь-який розрахунковий опір відхиляється не більше ніж на ±10%</text>
<text x="448.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Висновок: мінімальна кількість стандартних номіналів накриває весь діапазон.</text>
