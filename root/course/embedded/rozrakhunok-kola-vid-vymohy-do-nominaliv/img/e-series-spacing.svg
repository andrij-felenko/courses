<text x="50.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Між 10 і 20 Ом: крок становить +100% (величезна діра)</text>
