<text x="250.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">R_in &gt; 10¹⁰ Ом (pH/фотодіод)</text>
