<rect x="628.4" y="154.3" width="223.2" height="91.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="174.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Різниця потенціалів:</tspan><tspan x="740.0" dy="15.0">ΔV = V_in − V_guard ≈ 0 В</tspan><tspan x="740.0" dy="15.0"></tspan><tspan x="740.0" dy="15.0">Струм витоку на вхід:</tspan><tspan x="740.0" dy="15.0">I_leak = ΔV / R_поверхні = 0 А!</tspan></text>
<rect x="125.7" y="366.8" width="688.6" height="46.5" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="386.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Охоронне кільце знаходиться під тим самим потенціалом, що й вимірювальна лінія. Немає різниці напруг —</tspan><tspan x="470.0" dy="15.0">немає струму витоку крізь вологу, флюс та мікротріщини текстоліту у вхідний підсилювач.</tspan></text>
