<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл зворотного струму: залежність шляху від частоти</text>
<rect x="30.0" y="45.0" width="400.0" height="310.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="230.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Низька частота (DC та f &lt; 1 кГц)</text>
<text x="230.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Струм тече шляхом найменшого опору R</text>
<circle cx="75.0" cy="150.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="75.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Джерело</text>
<circle cx="375.0" cy="230.0" r="6.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="375.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Навантаження</text>
<line x1="75.0" y1="150.0" x2="205.0" y2="150.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="205.0" y1="150.0" x2="205.0" y2="230.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="205.0" y1="230.0" x2="369.0" y2="230.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="140.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Сигнал (I_sig)</text>
<line x1="375.0" y1="230.0" x2="75.0" y2="150.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="5 4"/>
<line x1="195.0" y1="182.0" x2="81.0" y2="152.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="252.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Зворотний струм (шлях min R)</text>
<text x="245.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розтікається по всій площині</text>
<rect x="88.3" y="287.4" width="283.3" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Опір R домінує над індуктивністю ωL.</tspan><tspan x="230.0" dy="14.3">Струм обирає найкоротшу геометричну пряму.</tspan></text>
<rect x="470.0" y="45.0" width="400.0" height="310.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="670.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Висока частота (f &gt; 100 кГц)</text>
<text x="670.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Струм тече шляхом найменшої індуктивності L</text>
<circle cx="515.0" cy="150.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="515.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Джерело</text>
<circle cx="815.0" cy="230.0" r="6.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="815.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Навантаження</text>
<line x1="515.0" y1="150.0" x2="645.0" y2="150.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="645.0" y1="150.0" x2="645.0" y2="230.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="645.0" y1="230.0" x2="809.0" y2="230.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="580.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Сигнал (I_sig)</text>
<line x1="815.0" y1="230.0" x2="645.0" y2="230.0" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="4 3"/>
<line x1="645.0" y1="230.0" x2="645.0" y2="150.0" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="4 3"/>
<line x1="645.0" y1="150.0" x2="521.0" y2="150.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="730.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Зворотний струм (min L)</text>
<text x="575.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Струм іде строго під трасою</text>
<rect x="522.1" y="287.4" width="295.9" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Індуктивність ωL &gt;&gt; R. Контур прагне</tspan><tspan x="670.0" dy="14.3">мінімізувати площу петлі зворотного зв'язку.</tspan></text>
<rect x="105.7" y="366.8" width="688.6" height="46.5" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="386.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">На високих частотах (фронти перемикання цифри) зворотний струм локалізований безпосередньо під трасою.</tspan><tspan x="450.0" dy="15.0">Якщо не вести цифрову трасу над аналоговою зоною, цифровий зворотний струм туди ніколи не затече.</tspan></text>
</svg>