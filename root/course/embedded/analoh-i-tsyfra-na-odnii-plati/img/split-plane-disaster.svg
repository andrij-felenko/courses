<rect x="79.5" y="356.8" width="741.0" height="46.5" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="376.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Шпарина в землі блокує зворотний струм високої частоти. Замість короткого шляху струм робить гігантську петлю,</tspan><tspan x="450.0" dy="15.0">створюючи паразитну індуктивність, електромагнітне випромінювання та отруюючи обидва домени.</tspan></text>
