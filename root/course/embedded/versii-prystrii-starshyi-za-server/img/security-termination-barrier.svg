<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура адаптера сумісності: ізоляція легасі-периметра від сучасного ядра</text>
<rect x="30.0" y="55.0" width="185.0" height="340.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="122.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Старий парк v1.0</text>
<text x="122.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Лічильники 2012–2015 рр.</text>
<rect x="49.3" y="122.9" width="145.4" height="44.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="122.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="122.0" dy="0.0">Промисловий лічильник</tspan><tspan x="122.0" dy="12.3">• Raw TCP / Бінарний кадр</tspan><tspan x="122.0" dy="12.3">• Статичний ключ PSK</tspan></text>
<rect x="60.1" y="207.9" width="123.7" height="44.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="122.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="122.0" dy="0.0">Газовий датчик RTU</tspan><tspan x="122.0" dy="12.3">• TLS 1.0 / Старий CA</tspan><tspan x="122.0" dy="12.3">• Застарілі шифри RSA</tspan></text>
<rect x="49.3" y="292.9" width="145.4" height="44.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="122.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="122.0" dy="0.0">Автономний трекер</tspan><tspan x="122.0" dy="12.3">• HTTP 1.0 GET телеметрія</tspan><tspan x="122.0" dy="12.3">• 1 вихід на зв'язок/добу</tspan></text>
<rect x="245.0" y="55.0" width="350.0" height="340.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="420.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Адаптер сумісності (Legacy Proxy)</text>
<text x="420.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ізольований периметр прийому трафіку</text>
<rect x="266.1" y="119.1" width="307.8" height="31.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="132.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1. Термінація безпеки</tspan><tspan x="420.0" dy="12.3">Термінація застарілого TLS 1.0/1.1 / перевірка PSK HMAC</tspan></text>
<rect x="266.1" y="179.1" width="307.8" height="31.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="192.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">2. Розбір і валідація кадрів</tspan><tspan x="420.0" dy="12.3">Перевірка CRC16/32, вилучення полів бінарного протоколу</tspan></text>
<rect x="244.4" y="239.1" width="351.1" height="31.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="252.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">3. Збагачення та нормалізація</tspan><tspan x="420.0" dy="12.3">Перерахунок імпульсів у СІ, вирівнювання часу, каталог приладів</tspan></text>
<rect x="301.3" y="299.1" width="237.4" height="31.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="312.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">4. Генератор зворотних команд</tspan><tspan x="420.0" dy="12.3">Трансляція наказів v5 → бінарний формат v1</tspan></text>
<rect x="625.0" y="55.0" width="185.0" height="340.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="717.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сучасне ядро v5.0</text>
<text x="717.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Хмарні мікросервіси</text>
<rect x="644.3" y="122.9" width="145.4" height="44.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="717.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="717.0" dy="0.0">Шина подій</tspan><tspan x="717.0" dy="12.3">• Kafka / NATS / RabbitMQ</tspan><tspan x="717.0" dy="12.3">• Канонічні CloudEvents</tspan></text>
<rect x="644.3" y="207.9" width="145.4" height="44.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="717.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="717.0" dy="0.0">Сховище Time-Series</tspan><tspan x="717.0" dy="12.3">• Нормалізовані дані в СІ</tspan><tspan x="717.0" dy="12.3">• UTC мікросекунди</tspan></text>
<rect x="649.7" y="292.9" width="134.5" height="44.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="717.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="717.0" dy="0.0">Бізнес-логіка v5.0</tspan><tspan x="717.0" dy="12.3">• Білінг, аномалії</tspan><tspan x="717.0" dy="12.3">• Не знає про біти v1.0</tspan></text>
