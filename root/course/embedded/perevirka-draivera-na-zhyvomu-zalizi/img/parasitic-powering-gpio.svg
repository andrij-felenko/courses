<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паразитичне фантомне живлення через ESD діоди</text>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паразитичне фантомне живлення вимкненого чипа через захисні ESD-діоди GPIO</text>
<rect x="40.0" y="65.0" width="240.0" height="375.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="160.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікроконтролер (MCU)</text>
<text x="160.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Живлення VDD_MCU = 3.3 В</text>
<rect x="55.0" y="135.0" width="210.0" height="125.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="160.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідний буфер GPIO</text>
<text x="160.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Стан: Високий рівень (HIGH)</text>
<text x="160.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Шини: SCL, SDA, CS, MOSI</text>
<text x="160.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">U_out ≈ 3.3 В</text>
<rect x="55.0" y="275.0" width="210.0" height="150.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="160.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Типова помилка прошивки:</text>
<text x="65.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• Зняли VDD із сенсора ключем,</text>
<text x="65.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">  але залишили піни МК у HIGH</text>
<text x="65.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• Не вимкнули підтяжки Pull-up</text>
<text x="65.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• Не перевели піни в Analog In</text>
<rect x="320.0" y="65.0" width="300.0" height="375.0" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.8"/>
<text x="470.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еквівалентна схема входу чипа</text>
<text x="470.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Шлях струму через верхній діод ESD</text>
<line x1="280.0" y1="195.0" x2="360.0" y2="195.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="315.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">I_leak ≈ 0.5–2 мА</text>
<circle cx="360.0" cy="195.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="360.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Пін сенсора (SDA/SCL)</text>
<line x1="360.0" y1="195.0" x2="470.0" y2="195.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="470.0" y1="195.0" x2="470.0" y2="230.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="455.0" y="230.0" width="30.0" height="25.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="470.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">ESD ▲</text>
<line x1="470.0" y1="255.0" x2="470.0" y2="290.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="340.0" y="290.0" width="260.0" height="48.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="470.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Внутрішня шина VDD_INT сенсора</text>
<text x="470.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">U_sens = 3.3 В − 0.6 В (V_diode) ≈ 2.7 В</text>
<rect x="340.0" y="350.0" width="260.0" height="75.0" rx="4" fill="#ffffff" stroke="#e67e22" stroke-width="1.2"/>
<text x="470.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наслідок для енергобюджету:</text>
<text x="470.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Батарея висаджується в 100 разів швидше</text>
<text x="470.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">через напівпровідний стан логіки</text>
<rect x="660.0" y="65.0" width="240.0" height="375.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="780.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сенсор (Вимкнений VDD)</text>
<text x="780.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Зовнішній пін VDD = 0.0 В</text>
<rect x="675.0" y="135.0" width="210.0" height="140.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="780.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Аномальний режим чипа:</text>
<text x="685.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• Чип не спить і не працює</text>
<text x="685.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• Напруга 2.7 В тримає цифрову</text>
<text x="685.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">  частину в напівскинутому стані</text>
<text x="685.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• Регістри скидаються хаотично</text>
<text x="685.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• При поверненні VDD = 3.3 В</text>
<text x="685.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">  сенсор не відповідає на шині</text>
<rect x="675.0" y="285.0" width="210.0" height="140.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="780.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Правильне рішення в коді:</text>
<text x="685.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">1. Перед сном: піни → Analog In</text>
<text x="685.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">2. Вимкнення Pull-up резисторів</text>
<text x="685.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">3. Відключення ліній CS/CLK</text>
<text x="685.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">4. Справжній струм сну &lt; 1 мкА</text>
<text x="470.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Залишення високого логічного рівня на лініях зв'язку живить чіп через ESD-діоди в обхід вимкненої шини VDD</text>
</svg>