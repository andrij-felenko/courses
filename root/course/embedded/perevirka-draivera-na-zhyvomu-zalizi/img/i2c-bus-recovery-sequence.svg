<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм відновлення шини I2C при зависанні</text>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна послідовність відновлення шини I2C при зависанні веденого (Bus Lockup)</text>
<rect x="40.0" y="65.0" width="260.0" height="385.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="170.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Стан Bus Lockup</text>
<text x="170.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ведений утримує лінію SDA = 0</text>
<line x1="55.0" y1="150.0" x2="285.0" y2="150.0" stroke="#333333" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="75.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="left">SCL (Master)</text>
<line x1="55.0" y1="160.0" x2="285.0" y2="160.0" stroke="#333333" stroke-width="1.8"/>
<line x1="55.0" y1="210.0" x2="285.0" y2="210.0" stroke="#333333" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="75.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="left">SDA (Slave)</text>
<line x1="55.0" y1="230.0" x2="285.0" y2="230.0" stroke="#c0392b" stroke-width="2.2"/>
<rect x="55.0" y="255.0" width="230.0" height="180.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="170.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Причина зависання:</text>
<text x="65.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• Збій живлення під час читання</text>
<text x="65.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• МК перезавантажився посеред байта</text>
<text x="65.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• Ведений очікує ще такти SCL</text>
<text x="65.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• Апаратний I2C контролер МК</text>
<text x="65.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">  блокується, бо шина зайнята</text>
<text x="65.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">• Нескінченний цикл while(!Ready)</text>
<rect x="340.0" y="65.0" width="260.0" height="385.0" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.8"/>
<text x="470.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle" font-weight="700">2. Процедура 9 тактів SCL</text>
<text x="470.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перемикання SCL у режим GPIO OD</text>
<text x="355.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="left">SCL (GPIO Output)</text>
