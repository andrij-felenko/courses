<text x="355.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="left">SDA (Sensor)</text>
<line x1="355.0" y1="230.0" x2="485.0" y2="230.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="485.0" y1="230.0" x2="500.0" y2="215.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="500.0" y1="215.0" x2="585.0" y2="215.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="540.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">SDA звільнено!</text>
<rect x="355.0" y="255.0" width="230.0" height="180.0" rx="4" fill="#ffffff" stroke="#e67e22" stroke-width="1.2"/>
<text x="470.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм прочищення:</text>
<text x="365.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">1. Деініціалізація периферії I2C</text>
<text x="365.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">2. SCL/SDA переходять у GPIO OD</text>
<text x="365.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">3. Генерація до 9 тактів SCL (100 кГц)</text>
<text x="365.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">4. Опитування SDA після кожного такту</text>
<text x="365.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">5. Формування STOP: SDA 0 → 1 при SCL=1</text>
<text x="365.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">6. Повернення пінів у режим I2C</text>
<rect x="640.0" y="65.0" width="260.0" height="385.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="770.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Відновлення стану</text>
<text x="770.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Переініціалізація регістрів сенсора</text>
<rect x="655.0" y="140.0" width="230.0" height="295.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="770.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дії драйвера після розблокування:</text>
<text x="665.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">1. Читання Device ID / WHO_AM_I</text>
<text x="665.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">2. Порівняння з еталонним сигнатурним</text>
<text x="665.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">   значенням (наприклад, 0x68 / 0x42)</text>
<text x="665.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">3. Програмне скидання чипа (Soft Reset)</text>
<text x="665.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">4. Завантаження конфігурації:</text>
<text x="665.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">   - Діапазони вимірювання (Full Scale)</text>
<text x="665.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">   - Частота вибірок (ODR / BW)</text>
<text x="665.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">   - Пороги FIFO та переривання</text>
<text x="665.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">5. Очищення буферів драйвера</text>
<text x="665.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="left">6. Повернення статусу ERR_RECOVERED</text>
<line x1="300.0" y1="250.0" x2="340.0" y2="250.0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="250.0" x2="640.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Апаратна генерація 9 тактів SCL виводить внутрішній автомат веденого чипа зі стану очікування біта даних</text>
</svg>