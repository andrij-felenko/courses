<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стенд верифікації та ін'єкції збоїв</text>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний стенд верифікації та ін'єкції апаратних збоїв (Fault Injection)</text>
<rect x="40.0" y="60.0" width="240.0" height="370.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="160.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Головний мікроконтролер (MCU)</text>
<text x="160.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Випробуваний драйвер + Тест-раннер</text>
<rect x="55.0" y="135.0" width="210.0" height="42.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/>
<text x="160.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драйвер чипа (FSM &amp; State)</text>
<rect x="55.0" y="190.0" width="210.0" height="42.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/>
<text x="160.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модуль Fault Recovery (Таймаути)</text>
<rect x="55.0" y="245.0" width="210.0" height="42.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/>
<text x="160.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керування комутатором збоїв (GPIO)</text>
<rect x="55.0" y="300.0" width="210.0" height="42.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/>
<text x="160.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробник переривання (ISR FIFO)</text>
<rect x="55.0" y="355.0" width="210.0" height="42.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/>
<text x="160.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Консоль результатів (UART / RTT)</text>
<rect x="340.0" y="60.0" width="260.0" height="370.0" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.8"/>
<text x="470.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комутатор апаратних збоїв</text>
<text x="470.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Аналогові ключі та MOSFET-глітчери</text>
<rect x="355.0" y="135.0" width="230.0" height="54.0" rx="4" fill="#ffffff" stroke="#e67e22" stroke-width="1.3"/>
<text x="470.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розмикач шини (SDA / SCL / MISO)</text>
<text x="470.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Імітація обриву та лінійного шуму</text>
<rect x="355.0" y="210.0" width="230.0" height="54.0" rx="4" fill="#ffffff" stroke="#e67e22" stroke-width="1.3"/>
<text x="470.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Глітчер живлення VDD (MOSFET Low-Side)</text>
<text x="470.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Імпульсне знеструмлення (1–50 мс)</text>
<rect x="355.0" y="285.0" width="230.0" height="54.0" rx="4" fill="#ffffff" stroke="#e67e22" stroke-width="1.3"/>
<text x="470.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Примусова підтяжка до GND (Bus Lockup)</text>
<text x="470.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Імітація зависання веденого чіпа</text>
<rect x="355.0" y="355.0" width="230.0" height="54.0" rx="4" fill="#ffffff" stroke="#e67e22" stroke-width="1.3"/>
<text x="470.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блокатор лінії переривання (INT/DRDY)</text>
<text x="470.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Імітація втрати події та переповнення</text>
<rect x="660.0" y="60.0" width="240.0" height="205.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="780.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Випробуваний чип (DUT Sensor)</text>
<text x="780.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">IMU / Барометр / АЦП на платі</text>
<rect x="675.0" y="125.0" width="210.0" height="32.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="780.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Регістровий банк &amp; State Machine</text>
<rect x="675.0" y="165.0" width="210.0" height="32.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="780.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне FIFO вибірок (32–512 B)</text>
<rect x="675.0" y="205.0" width="210.0" height="32.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="780.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аналоговий тракт (MEMS / ADC)</text>
<rect x="660.0" y="280.0" width="240.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="780.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профайлер струму (Power Profiler)</text>
<text x="780.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Шунт + Прецизійний підсилювач</text>
<rect x="675.0" y="342.0" width="210.0" height="72.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="780.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Динамічний замір: 10 нА – 50 мА</text>
<text x="780.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Аудит струмів сну та Wake-up time</text>
<text x="780.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Контроль споживання аналогового тракту</text>
<line x1="280.0" y1="155.0" x2="340.0" y2="155.0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="265.0" x2="340.0" y2="265.0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="155.0" x2="660.0" y2="155.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="235.0" x2="660.0" y2="235.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="780.0" y1="280.0" x2="780.0" y2="265.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Автоматизована ін'єкція збоїв верифікує відновлення драйвера без перезавантаження мікроконтролера</text>
</svg>