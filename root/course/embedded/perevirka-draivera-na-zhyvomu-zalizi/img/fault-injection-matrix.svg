<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця верифікації та стрес-випробувань драйвера</text>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця верифікації та граничних випробувань драйвера (Stress Test Matrix)</text>
<text x="130.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Категорія випробування</text>
<text x="380.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Механізм апаратного впливу (Fault Injection)</text>
<text x="730.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Критерій успішного проходження тесту</text>
<rect x="73.9" y="81.9" width="112.1" height="46.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="130.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">1. Фізичний обрив</tspan><tspan x="130.0" dy="12.3">ліній шини</tspan><tspan x="130.0" dy="12.3">(SDA/SCL/MISO)</tspan></text>
<rect x="257.6" y="87.7" width="244.8" height="34.7" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="380.0" y="102.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Комутація сигнальних провідників під час</tspan><tspan x="380.0" dy="11.7">активного DMA/IT обміну (Open-Circuit Glitch)</tspan></text>
<line x1="191.1" y1="105.0" x2="252.6" y2="105.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="599.9" y="87.7" width="260.2" height="34.7" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="730.0" y="102.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Драйвер повертає ERR_TIMEOUT за ≤ 5 мс,</tspan><tspan x="730.0" dy="11.7">не зависає у while(), периферія готова до обміну</tspan></text>
<line x1="507.4" y1="105.0" x2="594.9" y2="105.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="73.9" y="166.9" width="112.1" height="46.2" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.6"/><text x="130.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">2. Короткочасний</tspan><tspan x="130.0" dy="12.3">Brownout живлення</tspan><tspan x="130.0" dy="12.3">(1–50 мс)</tspan></text>
<rect x="260.1" y="172.7" width="239.7" height="34.7" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.6"/><text x="380.0" y="187.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Імпульсне зняття живлення VDD сенсора ключем</tspan><tspan x="380.0" dy="11.7">під час зняття вибірок або калібрування</tspan></text>
<line x1="191.1" y1="190.0" x2="255.1" y2="190.0" stroke="#e67e22" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="602.4" y="172.7" width="255.1" height="34.7" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.6"/><text x="730.0" y="187.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Драйвер фіксує невалідний Device ID, скидає чіп</tspan><tspan x="730.0" dy="11.7">та відновлює конфігурацію без рестарту МК</tspan></text>
<line x1="504.9" y1="190.0" x2="597.4" y2="190.0" stroke="#e67e22" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="65.1" y="251.9" width="129.8" height="46.2" rx="6" fill="#f4ecf8" stroke="#8a5fb0" stroke-width="1.6"/><text x="130.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">3. Переповнення FIFO</tspan><tspan x="130.0" dy="12.3">та залипання INT</tspan><tspan x="130.0" dy="12.3">(Buffer Overrun)</tspan></text>
<rect x="255.0" y="257.6" width="250.0" height="34.7" rx="6" fill="#ffffff" stroke="#8a5fb0" stroke-width="1.6"/><text x="380.0" y="272.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Блокування виклику обробника ISR на 500 мс</tspan><tspan x="380.0" dy="11.7">при безперервному потоці вибірок (500–2000 Гц)</tspan></text>
<line x1="199.9" y1="275.0" x2="250.0" y2="275.0" stroke="#8a5fb0" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="612.7" y="257.6" width="234.6" height="34.7" rx="6" fill="#ffffff" stroke="#8a5fb0" stroke-width="1.6"/><text x="730.0" y="272.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Драйвер детектує прапорець OVERRUN, вичитує</tspan><tspan x="730.0" dy="11.7">FIFO до нуля, скидає засувку INT (DRDY = 0)</tspan></text>
<line x1="510.0" y1="275.0" x2="607.7" y2="275.0" stroke="#8a5fb0" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="71.0" y="336.9" width="118.0" height="46.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="130.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">4. Аудит глибокого</tspan><tspan x="130.0" dy="12.3">сну та струмів</tspan><tspan x="130.0" dy="12.3">(Power Audit)</tspan></text>
<rect x="270.4" y="342.6" width="219.2" height="34.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="380.0" y="357.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Замір споживання в режимах Sleep/Standby</tspan><tspan x="380.0" dy="11.7">та перевірка витоків через цифрові піни</tspan></text>
<line x1="194.0" y1="360.0" x2="265.4" y2="360.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="589.6" y="342.6" width="280.8" height="34.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="730.0" y="357.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Струм вузла відповідає даташиту (I_sleep ≤ 1.5 мкА),</tspan><tspan x="730.0" dy="11.7">час виходу на робочий режим ≤ t_settling</tspan></text>
<line x1="494.6" y1="360.0" x2="584.6" y2="360.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="470.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Повний цикл випробувань гарантує стабільність прошивки при будь-яких фізичних аномаліях плати</text>
</svg>