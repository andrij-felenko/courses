<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ешелонований захист портів і ліній живлення (EMC / ESD)</text>
<rect x="40.0" y="55.0" width="200.0" height="240.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="140.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Зовнішній порт</text>
<rect x="55.0" y="95.0" width="170.0" height="185.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="140.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Джерела завад:</tspan><tspan x="140.0" dy="13.0">• ESD (IEC 61000-4-2):</tspan><tspan x="140.0" dy="13.0">  до ±15 кВ статики</tspan><tspan x="140.0" dy="13.0">• Surge (IEC 61000-4-5):</tspan><tspan x="140.0" dy="13.0">  до 2 кВ комутацій</tspan><tspan x="140.0" dy="13.0">• Переполюсовка</tspan><tspan x="140.0" dy="13.0">  (людський фактор)</tspan><tspan x="140.0" dy="13.0">• Наведені шуми радіо</tspan></text>
<line x1="240.0" y1="175.0" x2="285.0" y2="175.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="290.0" y="55.0" width="260.0" height="240.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="420.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ca8a04" text-anchor="middle" font-weight="700">Рубіж захисту (Board Entry)</text>
<rect x="305.0" y="95.0" width="230.0" height="185.0" rx="6" fill="#ffffff" stroke="#ca8a04" stroke-width="1.0"/><text x="420.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Компоненти захисту:</tspan><tspan x="420.0" dy="12.3">1. Самоперезапускний PTC запобіжник</tspan><tspan x="420.0" dy="12.3">2. MOV варистор / GDT розрядник</tspan><tspan x="420.0" dy="12.3">3. Швидкі TVS-діоди (наносекунди)</tspan><tspan x="420.0" dy="12.3">4. P-MOSFET від зворотної полярності</tspan><tspan x="420.0" dy="12.3">5. Дросель синфазних завад (CMC)</tspan><tspan x="420.0" dy="12.3">6. Гальванорозв'язка (ISO77xx)</tspan></text>
<line x1="550.0" y1="175.0" x2="595.0" y2="175.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="600.0" y="55.0" width="200.0" height="240.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="700.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Чутливе ядро</text>
<rect x="615.0" y="95.0" width="170.0" height="185.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="700.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Захищена електроніка:</tspan><tspan x="700.0" dy="13.0">• Стабілізатор (LDO/Buck)</tspan><tspan x="700.0" dy="13.0">• Мікроконтролер (MCU)</tspan><tspan x="700.0" dy="13.0">• Чутливі АЦП і сенсори</tspan><tspan x="700.0" dy="13.0">• Flash-пам'ять</tspan><tspan x="700.0" dy="13.0">• Радіотрансивер</tspan><tspan x="700.0" dy="13.0"></tspan><tspan x="700.0" dy="13.0">Рівень завад: &lt; 10 мВ</tspan></text>
<rect x="40.0" y="310.0" width="760.0" height="50.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="331.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Принцип локалізації: жорсткі енергетичні завади гасяться на самому краю плати біля роз'єму,</tspan><tspan x="420.0" dy="13.7">не маючи змоги проникнути в загальні полігони землі (GND) та внутрішні сигнальні траси.</tspan></text>
</svg>