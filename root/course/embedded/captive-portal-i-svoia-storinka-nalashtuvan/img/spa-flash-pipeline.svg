<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр підготовки та роздачі SPA-ресурсів з Flash-пам'яті</text>
<rect x="45.0" y="100.0" width="190.0" height="220.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/>
<rect x="55.0" y="112.0" width="170.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1. Єдиний SPA-файл</tspan></text>
<text x="140.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">index.html (~18 КБ)</tspan><tspan x="140.0" dy="14.9"></tspan><tspan x="140.0" dy="14.9">• Ванільний HTML5</tspan><tspan x="140.0" dy="14.9">• Вбудований CSS</tspan><tspan x="140.0" dy="14.9">• Вбудований JS</tspan><tspan x="140.0" dy="14.9">• Жодних CDN / npm</tspan><tspan x="140.0" dy="14.9">• fetch() до /api/*</tspan></text>
<rect x="275.0" y="100.0" width="190.0" height="220.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<rect x="285.0" y="112.0" width="170.0" height="32.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="370.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">2. GZIP-стиснення</tspan></text>
<text x="370.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">index.html.gz (~4 КБ)</tspan><tspan x="370.0" dy="14.9"></tspan><tspan x="370.0" dy="14.9">• Рівень: gzip -9</tspan><tspan x="370.0" dy="14.9">• Стиснення: ~78%</tspan><tspan x="370.0" dy="14.9">• Усунення дублів</tspan><tspan x="370.0" dy="14.9">  у тексті та тегах</tspan><tspan x="370.0" dy="14.9">• Робота на ПК розробника</tspan></text>
<rect x="505.0" y="100.0" width="190.0" height="220.0" rx="8" fill="#fdf0e6" stroke="#c07a2e" stroke-width="1.8"/>
<rect x="515.0" y="112.0" width="170.0" height="32.0" rx="6" fill="#ffffff" stroke="#c07a2e" stroke-width="1.5"/><text x="600.0" y="131.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">3. Розміщення у Flash</tspan></text>
<text x="600.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">const uint8_t index_html_gz[]</tspan><tspan x="600.0" dy="14.9"></tspan><tspan x="600.0" dy="14.9">• Секція: .rodata</tspan><tspan x="600.0" dy="14.9">• Зберігається у Flash</tspan><tspan x="600.0" dy="14.9">• Споживання RAM: 0 байт</tspan><tspan x="600.0" dy="14.9">• Вбудовано в прошивку</tspan><tspan x="600.0" dy="14.9">• Довжина: index_html_gz_len</tspan></text>
<rect x="735.0" y="100.0" width="190.0" height="220.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<rect x="745.0" y="112.0" width="170.0" height="32.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">4. Zero-Copy віддача</tspan></text>
<text x="830.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">HTTP Response</tspan><tspan x="830.0" dy="14.9"></tspan><tspan x="830.0" dy="14.9">• 200 OK</tspan><tspan x="830.0" dy="14.9">• Type: text/html</tspan><tspan x="830.0" dy="14.9">• Encoding: gzip</tspan><tspan x="830.0" dy="14.9">• Пряма передача з Flash</tspan><tspan x="830.0" dy="14.9">  у TCP буфер LWIP</tspan><tspan x="830.0" dy="14.9">• Швидкість: &lt; 10 мс</tspan></text>
<line x1="238.0" y1="210.0" x2="272.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="468.0" y1="210.0" x2="502.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="698.0" y1="210.0" x2="732.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="255.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">gzip -9</text>
<text x="485.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c07a2e" text-anchor="middle" font-weight="700">bin2c</text>
<text x="715.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">send()</text>
<rect x="45.0" y="345.0" width="880.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="485.0" y="373.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="485.0" dy="0.0">Результат: повноцінний сучасний адаптивний веб-інтерфейс займає лише 4 КБ Flash-пам'яті і не навантажує оперативну пам'ять мікроконтролера розпакуванням</tspan></text>
</svg>