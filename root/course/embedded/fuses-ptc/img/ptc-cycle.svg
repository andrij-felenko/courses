<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380">
<rect width="780" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="390.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Цикл PTC: спрацював — тримає — зняли живлення — сам скинувся</text>
<text x="390.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">на відміну від запобіжника, PTC не міняють: охолов — і знову проводить</text>
<line x1="80.0" y1="250.0" x2="700.0" y2="250.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="80.0" y1="250.0" x2="80.0" y2="110.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="700.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">час</text>
<text x="74.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">струм</text>
<polyline points="90.0,210.0 210.0,210.0 230.0,100.0 255.0,100.0 280.0,232.0 440.0,232.0 460.0,250.0 550.0,250.0 570.0,210.0 690.0,210.0" fill="none" stroke="#c0271e" stroke-width="2.6"/>
<text x="150.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">норма</text>
<text x="242.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">коротке: кидок</text>
<text x="360.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c98a00" text-anchor="middle" font-weight="bold" font-style="normal">спрацював: лише цівка («тримає»)</text>
<text x="505.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">зняли живлення</text>
<text x="640.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">охолов → знову проводить</text>
<rect x="60.0" y="338.0" width="660.0" height="28.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="390.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поки тримає, PTC сам себе гріє цівкою струму (засувка); знімеш напругу — він остигне й відновиться.</text>
</svg>
