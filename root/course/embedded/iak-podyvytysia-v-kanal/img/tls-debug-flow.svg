<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фази рукостискання TLS та локалізація помилок сертифікатів і пам'яті</text>
<rect x="50.0" y="65.0" width="410.0" height="78.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="65.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1. ClientHello</text>
<text x="65.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="65.0" dy="0.0">Пристрій -&gt; Сервер</tspan><tspan x="65.0" dy="13.0">Шифронабори, версія TLS, SNI</tspan></text>
<line x1="464.0" y1="104.0" x2="496.0" y2="104.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="65.0" width="410.0" height="78.0" rx="6" fill="#fee2e2" stroke="#333333" stroke-width="1.4"/>
<text x="515.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Діагностика Wireshark:</text>
<text x="515.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="515.0" dy="0.0">Alert: Handshake Failure</tspan><tspan x="515.0" dy="13.0">(Немає спільного шифронабору)</tspan></text>
<rect x="50.0" y="160.0" width="410.0" height="78.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="65.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2. ServerHello &amp; Cert</text>
<text x="65.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="65.0" dy="0.0">Сервер -&gt; Пристрій</tspan><tspan x="65.0" dy="13.0">Сертифікат X.509, ланцюг CA</tspan></text>
<line x1="464.0" y1="199.0" x2="496.0" y2="199.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="160.0" width="410.0" height="78.0" rx="6" fill="#fee2e2" stroke="#333333" stroke-width="1.4"/>
<text x="515.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Діагностика Wireshark:</text>
<text x="515.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="515.0" dy="0.0">Alert: Bad Certificate / Expired</tspan><tspan x="515.0" dy="13.0">(Зсув годинника або відсутній CA)</tspan></text>
<rect x="50.0" y="255.0" width="410.0" height="78.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="65.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Key Exchange</text>
<text x="65.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="65.0" dy="0.0">Обмін ключами ECDHE / RSA</tspan><tspan x="65.0" dy="13.0">Генерація Pre-Master Secret</tspan></text>
<line x1="464.0" y1="294.0" x2="496.0" y2="294.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="255.0" width="410.0" height="78.0" rx="6" fill="#fef3c7" stroke="#333333" stroke-width="1.4"/>
<text x="515.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Діагностика Wireshark:</text>
<text x="515.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="515.0" dy="0.0">Out of Memory / Timeout</tspan><tspan x="515.0" dy="13.0">(Брак RAM під криптоконтекст)</tspan></text>
<rect x="50.0" y="350.0" width="410.0" height="78.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="65.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Encrypted Channel</text>
<text x="65.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="65.0" dy="0.0">Завершення рукостискання</tspan><tspan x="65.0" dy="13.0">Зашифрований потік додатку</tspan></text>
<line x1="464.0" y1="389.0" x2="496.0" y2="389.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="350.0" width="410.0" height="78.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.4"/>
<text x="515.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Діагностика Wireshark:</text>
<text x="515.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="515.0" dy="0.0">Розшифрування через SSLKEYLOGFILE</tspan><tspan x="515.0" dy="13.0">(Аналіз незахищених даних у Wireshark)</tspan></text>
</svg>