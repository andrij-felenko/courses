<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430.7" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія тихої відмови: розрив між життям вузла та валідністю даних</text>
<rect x="30.0" y="60.0" width="240.0" height="310.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="150.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чутливий елемент і АЦП</text>
<rect x="39.7" y="110.2" width="220.6" height="59.6" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="150.0" dy="0.0">Зависання ядра АЦП / шини</tspan><tspan x="150.0" dy="14.3">I2C-регістр віддає старе 23.4 °C</tspan><tspan x="150.0" dy="14.3">(Stuck Value)</tspan></text>
<rect x="55.4" y="200.2" width="189.3" height="59.6" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="150.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle"><tspan x="150.0" dy="0.0">Деградація мембрани / хімії</tspan><tspan x="150.0" dy="14.3">Зсув нульової точки (+8 °C)</tspan><tspan x="150.0" dy="14.3">(Sensor Drift / Aging)</tspan></text>
<rect x="58.5" y="290.2" width="183.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="150.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Залипання контакту</tspan><tspan x="150.0" dy="14.3">Геркон / кінцевик замкнено</tspan><tspan x="150.0" dy="14.3">(Dry Contact Stuck)</tspan></text>
<rect x="310.0" y="60.0" width="260.0" height="310.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="440.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікроконтролер (MCU / RTOS)</text>
<rect x="348.5" y="105.2" width="183.0" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="440.0" dy="0.0">RTOS-планувальник працює</tspan><tspan x="440.0" dy="14.3">Watchdog справно годується</tspan><tspan x="440.0" dy="14.3">(Liveness Check: PASS)</tspan></text>
<rect x="335.9" y="195.2" width="208.1" height="59.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="440.0" y="214.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Зчитування буфера шини:</tspan><tspan x="440.0" dy="14.3">Отримує 0x00EB (23.4 °C)</tspan><tspan x="440.0" dy="14.3">Помилки зв'язку I2C нема (ACK)</tspan></text>
<rect x="317.1" y="285.2" width="245.7" height="59.6" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/><text x="440.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2980b9" text-anchor="middle"><tspan x="440.0" dy="0.0">Формування телеметрії:</tspan><tspan x="440.0" dy="14.3">MQTT: {&quot;temp&quot;: 23.4, &quot;status&quot;: &quot;OK&quot;}</tspan><tspan x="440.0" dy="14.3">Wi-Fi / LTE пакет відправлено</tspan></text>
<rect x="610.0" y="60.0" width="240.0" height="310.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="730.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер і диспетчер</text>
<rect x="641.6" y="110.2" width="176.8" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="730.0" dy="0.0">HTTP 200 / MQTT Broker OK</tspan><tspan x="730.0" dy="14.3">Статус вузла: ЗЕЛЕНИЙ</tspan><tspan x="730.0" dy="14.3">«Пристрій на зв'язку»</tspan></text>
<rect x="638.5" y="200.2" width="183.0" height="59.6" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="730.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle"><tspan x="730.0" dy="0.0">Ілюзія норми:</tspan><tspan x="730.0" dy="14.3">Значення 23.4 °C стабільне</tspan><tspan x="730.0" dy="14.3">Алерти мовчать</tspan></text>
<rect x="617.7" y="290.2" width="224.6" height="59.6" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">РЕАЛЬНІСТЬ:</tspan><tspan x="730.0" dy="14.3">Об'єкт перегрівається (&gt;85 °C)</tspan><tspan x="730.0" dy="14.3">Аварія розвивається тихо</tspan></text>
<line x1="270.0" y1="140.0" x2="310.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="270.0" y1="230.0" x2="310.0" y2="230.0" stroke="#d35400" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="225.0" x2="610.0" y2="225.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="315.0" x2="610.0" y2="315.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="37.9" y="379.2" width="804.3" height="31.5" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Тиха відмова: інфраструктура зв'язку та ОС функціонують бездоганно, але семантичний зміст вимірювання втрачено</tspan></text>
</svg>