<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікт нерозділених повноважень: прямий доступ без арбітражу</text>
<rect x="20.0" y="50.0" width="240.0" height="370.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="140.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Польова мережа (Broadcast UDP)</text>
<rect x="35.0" y="95.0" width="210.0" height="85.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="140.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Пульт #1: Пілот (GCS ID: 255)</text>
<text x="140.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Шле: MANUAL_CONTROL (50 Гц)</text>
<text x="140.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тангаж: -15° (пікірування)</text>
<text x="140.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Газ: 80% (набір швидкості)</text>
<rect x="35.0" y="195.0" width="210.0" height="85.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="140.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Пульт #2: Оператор камери (ID: 254)</text>
<text x="140.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Шле: SET_POSITION_TARGET (10 Гц)</text>
<text x="140.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Захоплення цілі: доворот направо</text>
<text x="140.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тангаж: +5° (компенсація кута)</text>
<rect x="35.0" y="295.0" width="210.0" height="110.0" rx="6" fill="#ffffff" stroke="#d98324" stroke-width="1.5"/>
<text x="140.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d98324" text-anchor="middle" font-weight="700">Пульт #3: Командир (ID: 253)</text>
<text x="140.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Шле: COMMAND_LONG (RTL)</text>
<text x="140.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Аварійний сигнал: повернення</text>
<text x="140.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Режим: автопілот AUTO/RTL</text>
<text x="140.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зміна висоти: +50 м</text>
<line x1="245.0" y1="137.0" x2="330.0" y2="210.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="245.0" y1="237.0" x2="330.0" y2="225.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="245.0" y1="350.0" x2="330.0" y2="240.0" stroke="#d98324" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="335.0" y="185.0" width="140.0" height="80.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="405.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Колізія команд</text>
<text x="405.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Мішанина пакетів</text>
<text x="405.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">в одному радіомодемі</text>
<line x1="475.0" y1="225.0" x2="535.0" y2="225.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="540.0" y="50.0" width="280.0" height="370.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.8"/>
<text x="680.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Бортовий контролер (FCU)</text>
<rect x="555.0" y="95.0" width="250.0" height="85.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="680.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Хаос керування:</tspan><tspan x="680.0" dy="11.7">Автопілот перемикається між ручним</tspan><tspan x="680.0" dy="11.7">режимом (Пілот) та автоматичним (Командир)</tspan><tspan x="680.0" dy="11.7">десятки разів на секунду!</tspan></text>
<rect x="555.0" y="190.0" width="250.0" height="105.0" rx="6" fill="#feebe8" stroke="#c0392b" stroke-width="1.4"/><text x="680.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Фізичні наслідки:</tspan><tspan x="680.0" dy="13.0">• Шалене тремтіння сервоприводів (50 Гц)</tspan><tspan x="680.0" dy="13.0">• Стрибки струму двигунів до 120 А</tspan><tspan x="680.0" dy="13.0">• Зрив повітряного потоку на елеронах</tspan><tspan x="680.0" dy="13.0">• Втрата підйомної сили та зрив у штопор</tspan></text>
<rect x="555.0" y="305.0" width="250.0" height="100.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.0"/><text x="680.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Висновок:</tspan><tspan x="680.0" dy="13.0">Один фізичний борт не може одночасно</tspan><tspan x="680.0" dy="13.0">підкорятися трьом незалежним пультам.</tspan><tspan x="680.0" dy="13.0">Потрібен жорсткий бортовий арбітраж!</tspan></text>
</svg>