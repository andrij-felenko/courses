<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія авторитету та аварійне перехоплення (Commander Override)</text>
<rect x="20.0" y="50.0" width="260.0" height="350.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="150.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія рівнів доступу</text>
<rect x="35.0" y="95.0" width="230.0" height="75.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="150.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Рівень 3: Командир місії</text>
<text x="150.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пріоритет: MAXIMUM (255)</text>
<text x="150.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Право: Безумовне перехоплення</text>
<rect x="35.0" y="180.0" width="230.0" height="75.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="150.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Рівень 2: Пілот апарата</text>
<text x="150.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пріоритет: HIGH (128)</text>
<text x="150.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Право: Навігація, ручні стіки</text>
<rect x="35.0" y="265.0" width="230.0" height="75.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.8"/>
<text x="150.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Рівень 1: Оператор / Сенсори</text>
<text x="150.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пріоритет: NORMAL (64)</text>
<text x="150.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Право: Камера, підвіс, телеметрія</text>
<text x="150.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Нижчий рівень НЕ може перебити вищий</text>
<line x1="280.0" y1="132.0" x2="340.0" y2="170.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="280.0" y1="217.0" x2="340.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="302.0" x2="340.0" y2="250.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="345.0" y="50.0" width="475.0" height="350.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="582.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бортовий автомат арбітражу перехоплення</text>
<rect x="360.0" y="95.0" width="445.0" height="80.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.2"/><text x="582.5" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="582.5" dy="0.0">Сценарій 1: Штатна робота (Пілот керує)</tspan><tspan x="582.5" dy="13.0">• Пілот (ID: 255) тримає токен польоту</tspan><tspan x="582.5" dy="13.0">• Пульт шле Heartbeat кожні 200 мс</tspan><tspan x="582.5" dy="13.0">• Командир і Сенсор працюють у своїх дозволених межах</tspan></text>
<rect x="360.0" y="185.0" width="445.0" height="95.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="582.5" y="211.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="582.5" dy="0.0">Сценарій 2: Аварійне перехоплення (Commander Override)</tspan><tspan x="582.5" dy="12.3">• Командир бачить перешкоду / неадекватні дії пілота</tspan><tspan x="582.5" dy="12.3">• Тисне [ ПЕРЕХОПИТИ КЕРУВАННЯ ] з підписом MAVLink v2</tspan><tspan x="582.5" dy="12.3">• Борт миттєво анулює токен Пілота (REVOKE) та скидає автопілот у LOITER/BRAKE</tspan><tspan x="582.5" dy="12.3">• Токен польоту передається Командиру без очікування згоди Пілота!</tspan></text>
<rect x="360.0" y="290.0" width="445.0" height="95.0" rx="6" fill="#fdf7e7" stroke="#d98324" stroke-width="1.2"/><text x="582.5" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="582.5" dy="0.0">Сценарій 3: Втрата зв'язку з пілотом (Pilot Link Loss)</tspan><tspan x="582.5" dy="12.3">• Якщо T_heartbeat(Pilot) &gt; 1500 мс:</tspan><tspan x="582.5" dy="12.3">  1. Борт блокує виконання старих стіків (Stale Control Lock)</tspan><tspan x="582.5" dy="12.3">  2. Активується таймер аварійного очікування (3.0 с)</tspan><tspan x="582.5" dy="12.3">  3. Якщо з'являється резервний пульт → дозволено швидке захоплення токена</tspan></text>
</svg>