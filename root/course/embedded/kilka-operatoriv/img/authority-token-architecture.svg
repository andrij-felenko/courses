<line x1="270.0" y1="355.0" x2="340.0" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="345.0" y="55.0" width="230.0" height="360.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="460.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бортовий арбітр токенів</text>
<text x="460.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Onboard Authority Arbiter)</text>
<rect x="360.0" y="115.0" width="200.0" height="75.0" rx="6" fill="#fdf7e7" stroke="#d98324" stroke-width="1.2"/><text x="460.0" y="136.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Таблиця активних токенів:</tspan><tspan x="460.0" dy="13.0">• Pilot Token: GCS #255 (OK)</tspan><tspan x="460.0" dy="13.0">• Payload Token: GCS #254 (OK)</tspan><tspan x="460.0" dy="13.0">• Commander Lock: Неактивний</tspan></text>
<rect x="360.0" y="200.0" width="200.0" height="95.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.0"/><text x="460.0" y="221.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Фільтр вхідних пакетів:</tspan><tspan x="460.0" dy="11.7">1. Перевірка Source ID</tspan><tspan x="460.0" dy="11.7">2. Звірка з правами токена</tspan><tspan x="460.0" dy="11.7">3. Перевірка тахометра пінгу</tspan><tspan x="460.0" dy="11.7">4. Відхилення несанкціонованих</tspan><tspan x="460.0" dy="11.7">команд (DROP &amp; NACK)</tspan></text>
<rect x="360.0" y="305.0" width="200.0" height="95.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.2"/><text x="460.0" y="332.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Таймери втрати зв'язку:</tspan><tspan x="460.0" dy="11.7">• T_heartbeat(Pilot) = 1000 мс</tspan><tspan x="460.0" dy="11.7">• Якщо прострочено → Failsafe</tspan><tspan x="460.0" dy="11.7">• Можливість перехоплення</tspan><tspan x="460.0" dy="11.7">іншою станцією</tspan></text>
