<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура токена авторитету: розділення каналів керування</text>
<rect x="20.0" y="60.0" width="250.0" height="110.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="145.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. Канал пілотування (Flight Plane)</text>
<text x="145.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ексклюзивний токен: AUTH_PILOT</text>
<text x="145.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Штанга стіків, ручне кермо, тангаж/крен</text>
<text x="145.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Володар: Пульт #1 (Пілот, ID: 255)</text>
<text x="145.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Частота: 50 Гц (жорсткий реалтайм)</text>
<rect x="20.0" y="180.0" width="250.0" height="110.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.8"/>
<text x="145.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Канал навантаження (Payload Plane)</text>
<text x="145.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ексклюзивний токен: AUTH_PAYLOAD</text>
<text x="145.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Керування камерою, лазером, скиданням</text>
<text x="145.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Володар: Пульт #2 (Оператор, ID: 254)</text>
<text x="145.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Не впливає на траєкторію польоту!</text>
<rect x="20.0" y="300.0" width="250.0" height="115.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="145.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Канал нагляду (Monitor Plane)</text>
<text x="145.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Режим: Тільки читання (Read-Only)</text>
<text x="145.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Телеметрія, мапа, статус місії</text>
<text x="145.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Пульт #3 (Командир) + інші GCS</text>
<text x="145.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Право: Аварійне перехоплення (Override)</text>
