<line x1="575.0" y1="320.0" x2="635.0" y2="320.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="640.0" y="65.0" width="180.0" height="95.0" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="730.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Польотний контролер</text>
<text x="730.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Мікшер моторів, рулі</text>
<text x="730.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Приймає ЛИШЕ від Пульта #1</text>
<text x="730.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Навігаційні вектори</text>
<rect x="640.0" y="175.0" width="180.0" height="95.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="730.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Підвіс і камера</text>
<text x="730.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сервоприводи стабілізатора</text>
<text x="730.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Приймає ЛИШЕ від Пульта #2</text>
<text x="730.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Оптичний зум, сенсори</text>
<rect x="640.0" y="285.0" width="180.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="730.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транслятор телеметрії</text>
<text x="730.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Шле стан усім станціям</text>
<text x="730.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Broadcast для моніторингу</text>
<text x="730.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1–10 Гц телеметрія</text>
