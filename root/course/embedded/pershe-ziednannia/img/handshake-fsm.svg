<text x="470.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="470.0" dy="0.0">• Немає HEARTBEAT &gt; 3.5 с → перехід у LINK_LOST, скидання готовності оператора</tspan><tspan x="470.0" dy="13.5">• Втрата окремих пакетів параметрів/місії → виявлення дірок у бітовій масці та дозапит за індексом</tspan><tspan x="470.0" dy="13.5">• Перевищення ліміту повторів (5 спроб) → сповіщення про помилку ініціалізації без блокування UI</tspan></text>
