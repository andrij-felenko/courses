<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діаграма послідовностей обміну, таймаути та матриця помилок</text>
<text x="500.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Штатний сценарій, відновлення після помилки CRC, реакція на таймаут та ієрархія кодів помилок</text>
<rect x="25.0" y="75.0" width="540.0" height="420.0" rx="8" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="295.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">UML Діаграма послідовності обміну (Sequence)</text>
<rect x="60.0" y="115.0" width="100.0" height="28.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="110.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Host (Клієнт)</text>
<line x1="110.0" y1="143.0" x2="110.0" y2="475.0" stroke="#7f8c8d" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="395.0" y="115.0" width="110.0" height="28.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="450.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">MCU (Пристрій)</text>
<line x1="450.0" y1="143.0" x2="450.0" y2="475.0" stroke="#7f8c8d" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="295.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">1. Успішний запит (Happy Path)</text>
<line x1="110.0" y1="175.0" x2="450.0" y2="175.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">REQ [Seq=1, CMD_SET_CONFIG]</text>
<line x1="450.0" y1="200.0" x2="110.0" y2="200.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">RESP [Seq=1, STATUS_OK, Data]</text>
<text x="295.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">2. Помилка CRC у каналі зв'язку</text>
<line x1="110.0" y1="245.0" x2="450.0" y2="245.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">REQ [Seq=2, CMD_CALIBRATE] (Спотворений CRC)</text>
<line x1="450.0" y1="275.0" x2="110.0" y2="275.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">NACK [Seq=2, ERR_INVALID_CRC]</text>
<line x1="110.0" y1="305.0" x2="450.0" y2="305.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">RETRY 1 [Seq=3, CMD_CALIBRATE]</text>
<line x1="450.0" y1="325.0" x2="110.0" y2="325.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">RESP [Seq=3, STATUS_OK]</text>
<text x="295.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-style="italic">3. Таймаут відповіді (MCU зайнятий / втрата кадру)</text>
<line x1="110.0" y1="370.0" x2="450.0" y2="370.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">REQ [Seq=4, CMD_FLASH_ERASE]</text>
<line x1="95.0" y1="370.0" x2="95.0" y2="420.0" stroke="#d35400" stroke-width="1.5"/>
<line x1="90.0" y1="370.0" x2="100.0" y2="370.0" stroke="#d35400" stroke-width="1.5"/>
<line x1="90.0" y1="420.0" x2="100.0" y2="420.0" stroke="#d35400" stroke-width="1.5"/>
<text x="85.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d35400" text-anchor="end" font-style="italic">T_resp_max = 50 ms</text>
<line x1="110.0" y1="430.0" x2="450.0" y2="430.0" stroke="#d35400" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d35400" text-anchor="middle">RETRY 1 [Seq=4, Backoff=100ms]</text>
<line x1="450.0" y1="455.0" x2="110.0" y2="455.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">RESP [Seq=4, STATUS_OK]</text>
<rect x="585.0" y="75.0" width="390.0" height="420.0" rx="8" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="780.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця кодів результату (Status Matrix)</text>
<rect x="595.0" y="118.0" width="370.0" height="62.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="603.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">0x00..0x0F: Успіх та системні статуси</text>
<text x="607.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x00 STATUS_OK</text>
<text x="750.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Операція виконана успішно</text>
<text x="607.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x01 STATUS_ACCEPTED</text>
<text x="750.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Прийнято до виконання (асинхронно)</text>
<rect x="595.0" y="188.0" width="370.0" height="81.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="603.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">0x10..0x2F: Транспортні помилки каналу</text>
<text x="607.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x10 ERR_INVALID_CRC</text>
<text x="750.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Помилка контрольної суми CRC</text>
<text x="607.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x11 ERR_FRAME_FORMAT</text>
<text x="750.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Порушено межі кадру (SOF/EOF/Len)</text>
<text x="607.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x12 ERR_TIMEOUT</text>
<text x="750.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Таймаут відповіді апаратного вузла</text>
<rect x="595.0" y="277.0" width="370.0" height="81.0" rx="5" fill="#fff3cd" stroke="#d35400" stroke-width="1.2"/>
<text x="603.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="start" font-weight="700">0x30..0x4F: Синтаксичні та семантичні помилки</text>
<text x="607.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x30 ERR_UNKNOWN_MSG_ID</text>
<text x="750.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Невідомий тип повідомлення</text>
<text x="607.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x31 ERR_INVALID_PAYLOAD_LEN</text>
<text x="750.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Невідповідна довжина Payload</text>
<text x="607.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x32 ERR_PARAM_OUT_OF_RANGE</text>
<text x="750.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Значення параметра поза межами</text>
<rect x="595.0" y="366.0" width="370.0" height="81.0" rx="5" fill="#f3e8fd" stroke="#7d3c98" stroke-width="1.2"/>
<text x="603.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7d3c98" text-anchor="start" font-weight="700">0x50..0x6F: Стан пристрою та апаратні помилки</text>
<text x="607.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x50 ERR_DEVICE_BUSY</text>
<text x="750.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Ресурс зайнятий (Flash, I2C DMA)</text>
<text x="607.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x51 ERR_HARDWARE_FAULT</text>
<text x="750.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Апаратний збій давача або реле</text>
<text x="607.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">0x52 ERR_UNAUTHORIZED</text>
<text x="750.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">— Заборонено поточним рівнем доступу</text>
</svg>