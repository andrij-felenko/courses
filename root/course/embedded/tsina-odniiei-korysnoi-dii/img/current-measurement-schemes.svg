<rect x="55.2" y="197.5" width="329.5" height="65.0" rx="6" fill="#fdf0ef" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Пастка Burden Voltage:</tspan><tspan x="220.0" dy="13.0">• При сні (1 мкА): V_drop = 10 мкВ (шум осцилографа!)</tspan><tspan x="220.0" dy="13.0">• При TX (100 мА): V_drop = 1.0 В!</tspan><tspan x="220.0" dy="13.0">  Напруга MCU падає з 3.3 В до 2.3 В → Brown-Out Reset!</tspan></text>
