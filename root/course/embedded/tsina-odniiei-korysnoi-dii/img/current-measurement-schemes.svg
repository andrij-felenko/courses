<rect x="-238.9" y="404.5" width="1317.9" height="31.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="423.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Звичайний шунт не здатен одночасно охопити струм глибокого сну (мкА) та імпульс передавача (сотні мА). Для чесного аудиту використовують спеціалізовані цифрові вимірювачі потужності (PPK2, Joulescope, Otii).</tspan></text>
