<rect x="465.0" y="55.0" width="385.0" height="42.0" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
<text x="657.5" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Сервісний посібник (Service Guide)</text>
