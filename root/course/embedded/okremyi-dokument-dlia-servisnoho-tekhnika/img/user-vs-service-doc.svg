<text x="222.5" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Посібник користувача (User Manual)</text>
<circle cx="48.0" cy="123.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="60.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Цільова аудиторія:</text>
<text x="60.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Кінцевий оператор, власник виробу</text>
