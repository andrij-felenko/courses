<text x="495.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Модель пристрою:</text>
<text x="495.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">«Біла скринька» — повна схема, шини й вузли</text>
<circle cx="483.0" cy="205.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="495.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Дозволені дії:</text>
<text x="495.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Розбирання, заміна модулів (FRU), перепайка</text>
<circle cx="483.0" cy="246.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="495.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Межа втручання:</text>
<text x="495.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Прямий доступ до друкованої плати й компонентів</text>
<circle cx="483.0" cy="287.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="495.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Діагностика:</text>
<text x="495.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Контрольні точки (TP), CLI, коди DTC, Fault Trees</text>
<circle cx="483.0" cy="328.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="495.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Безпека техніка:</text>
<text x="495.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Розряд конденсаторів, правила LOTO, ESD-захист</text>
