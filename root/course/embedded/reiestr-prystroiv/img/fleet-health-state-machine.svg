<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів доступності та виявлення аномальних вузлів</text>
<text x="410.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розрізнення штатного сну, обриву каналу (Silent) та лавинного перепідключення (Flapping)</text>
<rect x="40.0" y="85.0" width="175.0" height="70.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="127.5" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">PROVISIONED</text>
<text x="127.5" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Створено запис у базі</text>
<rect x="320.0" y="85.0" width="175.0" height="70.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="407.5" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ONLINE / HEALTHY</text>
<text x="407.5" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Heartbeat &lt; T_ping, RSSI &gt; -95</text>
<line x1="215.0" y1="120.0" x2="320.0" y2="120.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="267.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Перший TLS / MQTT</text>
<rect x="600.0" y="85.0" width="175.0" height="70.0" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.4"/>
<text x="687.5" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a16207" text-anchor="middle" font-weight="700">DEGRADED</text>
<text x="687.5" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Втрати пакетів &gt; 15%, Batt &lt; 15%</text>
<line x1="495.0" y1="120.0" x2="600.0" y2="120.0" stroke="#ca8a04" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="547.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ca8a04" text-anchor="middle">RSSI / Batt drop</text>
<rect x="320.0" y="240.0" width="175.0" height="70.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="407.5" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">SILENT / OFFLINE</text>
<text x="407.5" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Heartbeat &gt; 3*T_ping / LWT</text>
<line x1="407.5" y1="155.0" x2="407.5" y2="240.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="417.5" y="197.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Таймаут тиші</text>
<line x1="350.0" y1="240.0" x2="350.0" y2="155.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="292.0" y="197.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end">Повторний зв'язок</text>
<rect x="40.0" y="240.0" width="175.0" height="70.0" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
<text x="127.5" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9333ea" text-anchor="middle" font-weight="700">FLAPPING (Карантин)</text>
<text x="127.5" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">&gt; 10 з'єднань / хв (шторм)</text>
<line x1="320.0" y1="145.0" x2="215.0" y2="260.0" stroke="#9333ea" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="247.5" y="183.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9333ea" text-anchor="middle">Часті реконекти</text>
<rect x="600.0" y="240.0" width="175.0" height="70.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
<text x="687.5" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">DECOMMISSIONED</text>
<text x="687.5" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сертифікат відкликано (CRL)</text>
<line x1="495.0" y1="275.0" x2="600.0" y2="275.0" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="547.5" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Списання / Заміна</text>
<rect x="40.0" y="360.0" width="740.0" height="80.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="55.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Діагностичні правила реєстру здоров'я:</text>
<text x="55.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">1. Шлейф тиші (Silent): вузол не шле LWT і не відповідає &gt; 3 інтервалів -&gt; фіксація обриву без блокування черги.</text>
<text x="55.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">2. Деренчання (Flapping): вузол спамить Connect/Disconnect -&gt; примусовий backoff та ізоляція сесії в шлюзі.</text>
<text x="55.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">3. Індекс здоров'я: інтегральна формула FHI = f(Uptime, PacketLoss, RssiStability, ErrorRate).</text>
</svg>