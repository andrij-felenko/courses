<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 402" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="402" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гібрид: переривання ловить, опитування прапорця обробляє</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">миттєвість — від переривання, простота обробки — від опитування</text>
<rect x="60.0" y="126.2" width="120.0" height="47.6" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="120.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">подія</tspan><tspan x="120.0" dy="15.6">(вмить)</tspan></text>
<rect x="290.0" y="125.0" width="180.0" height="49.9" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">ISR:</tspan><tspan x="380.0" dy="16.9">flag = true</tspan></text>
<line x1="180.0" y1="150.0" x2="290.0" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ловить</text>
<rect x="290.0" y="234.0" width="180.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="380.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">volatile flag</tspan></text>
<line x1="380.0" y1="174.9" x2="380.0" y2="234.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="396.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">ставить</text>
<rect x="600.0" y="218.4" width="200.0" height="63.2" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">loop():</tspan><tspan x="700.0" dy="15.6">бачить flag →</tspan><tspan x="700.0" dy="15.6">робить роботу</tspan></text>
<line x1="470.0" y1="250.0" x2="600.0" y2="250.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">опитує</text>
<rect x="60.0" y="320.0" width="780.0" height="48.0" rx="10" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/>
<text x="450.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прапорець РОЗВ'ЯЗУЄ в часі «коли впіймано» і «коли оброблено»:</text>
<text x="450.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">реакція лишається миттєвою, а складна обробка — вільною від обмежень ISR.</text>
</svg>