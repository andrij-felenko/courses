<text x="470.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Надійно (з полем на джитер): T ≤ (тривалість події) / 2 — «Найквіст для подій».</text>
