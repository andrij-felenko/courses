<text x="252.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="252.0" dy="0.0">дотягти</tspan><tspan x="252.0" dy="15.0">інструкцію</tspan></text>
<text x="252.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0–кілька</text>
<line x1="319.7" y1="178.0" x2="329.7" y2="178.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="330.7" y="150.0" width="133.3" height="56.0" rx="8" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/>
<text x="397.3" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="397.3" dy="0.0">запис</tspan><tspan x="397.3" dy="15.0">контексту</tspan></text>
<text x="397.3" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">8 слів</text>
<line x1="465.0" y1="178.0" x2="475.0" y2="178.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="476.0" y="150.0" width="133.3" height="56.0" rx="8" fill="#fbfcff" stroke="#2457d6" stroke-width="1.6"/>
<text x="542.7" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="542.7" dy="0.0">вибірка</tspan><tspan x="542.7" dy="15.0">вектора</tspan></text>
<text x="542.7" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">з таблиці</text>
<line x1="610.3" y1="178.0" x2="620.3" y2="178.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="621.3" y="150.0" width="133.3" height="56.0" rx="8" fill="#fbfcff" stroke="#8a5a00" stroke-width="1.6"/>
<text x="688.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle" font-weight="700"><tspan x="688.0" dy="0.0">пролог</tspan><tspan x="688.0" dy="15.0">компілятора</tspan></text>
<text x="688.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">регістри</text>
<line x1="755.7" y1="178.0" x2="765.7" y2="178.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="766.7" y="150.0" width="133.3" height="56.0" rx="8" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/>
<text x="833.3" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="833.3" dy="0.0">ПЕРШИЙ рядок</tspan><tspan x="833.3" dy="15.0">ISR</tspan></text>
<text x="833.3" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">почалося</text>
<rect x="40.0" y="258.0" width="860.0" height="66.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="470.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхід у переривання (без очікувань пам'яті):</text>
<text x="470.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">AVR ≈ 4 такти · Cortex-M0 = 16 · M0+ = 15 · M3/M4 = 12 · тейл-чейн M3/M4 = 6</text>
<text x="470.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Cortex-M — фіксоване число тактів (детерміновано); на AVR довша інструкція дотягується до кінця.</text>
</svg>