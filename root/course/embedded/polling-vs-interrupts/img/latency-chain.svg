<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг латентності: від фронту на ніжці до першого рядка ISR</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«12 тактів» ARM — лише ядро; повна затримка складається з ланок</text>
<text x="40.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">фронт на ніжці</text>
<text x="900.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">час →</text>
<rect x="40.0" y="150.0" width="133.3" height="56.0" rx="8" fill="#fbfcff" stroke="#8a5a00" stroke-width="1.6"/>
<text x="106.7" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle" font-weight="700"><tspan x="106.7" dy="0.0">детекція</tspan><tspan x="106.7" dy="15.0">+ синхро</tspan></text>
<text x="106.7" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1–2 такти</text>
