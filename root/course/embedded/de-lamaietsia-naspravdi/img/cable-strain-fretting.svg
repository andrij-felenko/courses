<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="480.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка кабельних вводів: концентрація напружень та фретінг-корозія</text>
<rect x="22.0" y="60.0" width="390.0" height="415.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="22.0" y="60.0" width="390.0" height="32.0" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="217.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Втома мідних жил та розвантаження натягу (Strain Relief)</text>
<rect x="37.0" y="105.0" width="360.0" height="160.0" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="47.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">НЕПРАВИЛЬНО: Жорсткий вигин без демпфера</text>
<text x="47.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Кабель вільно згинається об гострий отвір корпусу / край плати</text>
<text x="47.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Радіус вигину R &lt; 2·D (критична концентрація напружень)</text>
<text x="47.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Знакозмінний вигин створює наклеп міді (робота дислокацій)</text>
<text x="47.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="700">• Результат: злам жили за 10 000–50 000 циклів просто біля пайки</text>
<text x="47.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Немає фіксації зовнішньої оболонки -&gt; натяг рве паяні піни</text>
<text x="47.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вібрація джгута передається безпосередньо на роз'єм</text>
<rect x="37.0" y="280.0" width="360.0" height="175.0" rx="6" fill="#f0fdf4" stroke="#047857" stroke-width="1.2"/>
<text x="47.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">ПРАВИЛЬНО: Багаторівневий Strain Relief</text>
<text x="47.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Еластична конічна гільза (Grommet/Boot) обмежує радіус R &gt; 6·D</text>
<text x="47.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Механічний цанговий кабельний ввід (Cable Gland IP67/68)</text>
<text x="47.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зовнішня оболонка затиснута хомутом до шасі корпусу</text>
<text x="47.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вільна сервісна петля (Service Loop) перед платою знімає натяг</text>
<text x="47.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="start" font-weight="700">• Багатожильний дріт підвищеної гнучкості (Class 5/6, силікон)</text>
<text x="47.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ресурс вигину зростає у 50–100 разів (&gt; 1 000 000 циклів)</text>
<rect x="428.0" y="60.0" width="390.0" height="415.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="428.0" y="60.0" width="390.0" height="32.0" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="623.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Контактна фретінг-корозія (Fretting Corrosion)</text>
<rect x="443.0" y="105.0" width="360.0" height="75.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="453.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">Етап 1: Мікровібрація (1–100 мкм)</text>
<text x="453.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Вібрація або циклічне нагрівання викликають</text>
<text x="453.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">мікропереміщення штиря відносно гнізда роз'єму.</text>
<rect x="443.0" y="190.0" width="360.0" height="75.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="453.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">Етап 2: Стирання та окиснення</text>
<text x="453.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Тертя зриває м'який пасивний шар олова (Sn).</text>
<text x="453.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Оголений метал миттєво окиснюється киснем у SnO2.</text>
<rect x="443.0" y="275.0" width="360.0" height="75.0" rx="6" fill="#fffbeb" stroke="#b91c1c" stroke-width="1.2"/>
<text x="453.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">Етап 3: Накопичення оксидного порошку</text>
<text x="453.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">SnO2 — твердий абразивний діелектрик. Накопичується</text>
<text x="453.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">в зоні контакту, розклинюючи контактні пружини.</text>
<rect x="443.0" y="360.0" width="360.0" height="75.0" rx="6" fill="#fffbeb" stroke="#b91c1c" stroke-width="1.2"/>
<text x="453.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">Етап 4: Плаваючий контакт (Contact Bounce)</text>
<text x="453.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Опір зростає з 10 мОм до &gt; 100 Ом і стрибає.</text>
<text x="453.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Прошивка ловить фантомні падіння шин I2C/SPI або скидання.</text>
</svg>