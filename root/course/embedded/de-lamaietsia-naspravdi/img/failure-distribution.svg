<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 923 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="923" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="460.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл причин польових відмов електроніки (Interconnect &amp; Hardware Failures)</text>
<rect x="25.0" y="65.0" width="190.0" height="280.0" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
<rect x="25.0" y="65.0" width="190.0" height="46.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="120.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#b91c1c" text-anchor="middle" font-weight="700">40%</text>
<text x="120.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Роз'єми, кабелі, джгути</text>
<text x="33.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Втома міді у точці вигину (без Strain Relief)</text>
<text x="33.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Фретінг-корозія контактів (мікровібрації)</text>
<text x="33.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Перетирання ізоляції об гострі крайки корпусу</text>
<text x="33.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Виривання контактних гнізд і паяних пінів</text>
<rect x="225.0" y="65.0" width="190.0" height="280.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<rect x="225.0" y="65.0" width="190.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="320.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#d97706" text-anchor="middle" font-weight="700">30%</text>
<text x="320.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паяні з'єднання та плата</text>
<text x="233.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Термічна втома безсвинцевого припою SAC305</text>
<text x="233.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Тріщини кераміки MLCC (Flex Cracking при вигині)</text>
<text x="233.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Злам пайки важких дроселів та електролітів</text>
<text x="233.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Розтріскування перехідних отворів (Vias Z-axis)</text>
<rect x="425.0" y="65.0" width="190.0" height="280.0" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
<rect x="425.0" y="65.0" width="190.0" height="46.0" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<text x="520.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#6d28d9" text-anchor="middle" font-weight="700">15%</text>
<text x="520.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гвинти, стійки, механіка</text>
<text x="433.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Саморозкручування різьби від поперечної вібрації</text>
<text x="433.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Руйнування пластикових бонок при перетяжці</text>
<text x="433.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Втрата зусилля затиску (просідання шайб Гровера)</text>
<text x="433.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Втомне руйнування кронштейнів та розгерметизація</text>
<rect x="625.0" y="65.0" width="190.0" height="280.0" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="625.0" y="65.0" width="190.0" height="46.0" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="720.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1d4ed8" text-anchor="middle" font-weight="700">15%</text>
<text x="720.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кремній та активні чипи</text>
<text x="633.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Електростатичний розряд (ESD по відкритих лініях)</text>
<text x="633.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Електричне перенапруження (EOS) та пробій затвора</text>
<text x="633.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Перегрів кристала (Thermal Runaway / сухий термоінтерфейс)</text>
<text x="633.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Деградація затворів (NBTI/HCI) після років роботи</text>
<rect x="25.0" y="360.0" width="790.0" height="95.0" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<rect x="25.0" y="360.0" width="790.0" height="26.0" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="420.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Ключовий інженерний висновок: 85% відмов лежать за межами мікроконтролера</text>
<text x="40.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Кремній практично не має рухомих частин і відмовляє рідко, якщо дотримано напруги та температури.</text>
<text x="40.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Головні вороги надійності — механічні напруження, знакозмінний вигин, терморозширення (CTE) та вібраційне послаблення.</text>
<text x="40.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Надійність приладу в полі визначається якістю кабельного вводу, геометрією плати біля гвинтів та фіксацією різьби.</text>
</svg>