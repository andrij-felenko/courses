<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="500.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вібраційна стійкість кріплень: тест Юнкера та ефективні фіксатори різьби</text>
<rect x="22.0" y="60.0" width="390.0" height="435.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="22.0" y="60.0" width="390.0" height="32.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="217.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">1. Механізм саморозкручування (Тест Юнкера)</text>
<rect x="37.0" y="105.0" width="360.0" height="115.0" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="47.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">Поперечна вібрація обнуляє тертя</text>
<text x="47.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• При осьовому навантаженні тертя в різьбі утримує гвинт.</text>
<text x="47.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Але поперечний зсув (Transverse slip) викликає мікроковзання</text>
<text x="47.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  витків по похилій площині різьби.</text>
<text x="47.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Коефіцієнт тертя миттєво падає до нуля: гвинт обертається назад.</text>
<rect x="37.0" y="230.0" width="360.0" height="115.0" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="47.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">Міф про пружинну шайбу Гровера (Split Washer)</text>
<text x="47.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Шайба Гровера сплющується при 5–10% номінального моменту.</text>
<text x="47.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• При динамічному навантаженні вона працює як плоска пружина</text>
<text x="47.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  з нульовим запасом ходу, а гострі крайки зрізають метал опорної поверхні.</text>
<text x="47.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• За стандартом DIN 127 визнана застарілою і неефективною.</text>
<rect x="37.0" y="355.0" width="360.0" height="115.0" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="47.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">Наслідки ослаблення попереднього натягу</text>
<text x="47.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Втрата притиску плати до радіатора -&gt; перегрів силових ключів.</text>
<text x="47.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Ударні вібрації плати об корпус -&gt; зрізання доріжок і пайки.</text>
<text x="47.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Випадання гвинта всередину корпусу -&gt; металеве КЗ по живленню.</text>
<rect x="428.0" y="60.0" width="390.0" height="435.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="428.0" y="60.0" width="390.0" height="32.0" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="623.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#047857" text-anchor="middle" font-weight="700">2. Надійні інженерні методи фіксації різьби</text>
<rect x="443.0" y="105.0" width="360.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#047857" stroke-width="1.2"/>
<text x="453.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">Анаеробні фіксатори різьби (Threadlocker Loctite 243/270)</text>
<text x="453.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Рідкий мономер заповнює 100% зазору між витками різьби.</text>
<text x="453.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Полімеризується без кисню при контакті з іонами металу.</text>
<text x="453.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Створює суцільний термореактивний пластиковий замок.</text>
<text x="453.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Запобігає саморозкручуванню та герметизує різьбу від корозії.</text>
<rect x="443.0" y="230.0" width="360.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#047857" stroke-width="1.2"/>
<text x="453.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">Клинові шайби Nord-Lock</text>
<text x="453.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Пара шайб із кутом клина α, більшим за кут підйому різьби β.</text>
<text x="453.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Будь-яка спроба розкручування призводить до клинового ефекту</text>
<text x="453.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  і ЗБІЛЬШЕННЯ зусилля затиску (Wedge-locking principle).</text>
<rect x="443.0" y="355.0" width="360.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#047857" stroke-width="1.2"/>
<text x="453.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">Самоконтрасні гайки (Nyloc) та тарілчасті шайби</text>
<text x="453.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Нейлонове кільце створює постійний радіальний натяг на витках.</text>
<text x="453.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Тарілчасті пружини Бельвіля (Belleville Washers) компенсують</text>
<text x="453.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  теплове розширення та температурне просідання матеріалів.</text>
</svg>