<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 973.5 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="973.5" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат пробного запуску та відкату (Trial Boot FSM)</text>
<text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Як система автоматично відновлюється, якщо нова прошивка містить логічний збій або зависає</text>
<rect x="60.0" y="135.0" width="220.0" height="70.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">СТАН: CONFIRMED</tspan><tspan x="170.0" dy="14.3">(Слот A стабільний)</tspan><tspan x="170.0" dy="14.3">Штатна робота пристрою</tspan></text>
<line x1="280.0" y1="170.0" x2="410.0" y2="170.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="345.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">OTA Запис у Слот B</text>
<text x="345.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Хеш і підпис OK</text>
<rect x="410.0" y="135.0" width="240.0" height="70.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="530.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">СТАН: TRIAL</tspan><tspan x="530.0" dy="14.3">(Слот B у пробному режимі)</tspan><tspan x="530.0" dy="14.3">Лічильник спроб = 1 з 3</tspan></text>
<line x1="650.0" y1="170.0" x2="770.0" y2="170.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="710.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Самотест OK</text>
<text x="710.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">firmware_mark_valid()</text>
<rect x="770.0" y="135.0" width="150.0" height="70.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="845.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">НОВИЙ СТАН:</tspan><tspan x="845.0" dy="14.3">CONFIRMED</tspan><tspan x="845.0" dy="14.3">(Слот B активний)</tspan></text>
<line x1="530.0" y1="205.0" x2="530.0" y2="285.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="530.0" y1="285.0" x2="530.0" y2="305.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Креш / Зависання / Watchdog ⚡</text>
<text x="540.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">Інкремент лічильника спроб (спроба 2, 3...)</text>
<rect x="390.0" y="305.0" width="280.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">СТАН: FAILED (ВІДКАТ)</tspan><tspan x="530.0" dy="14.3">Вичерпано ліміт спроб (&gt; 3)</tspan><tspan x="530.0" dy="14.3">Слот B блокується</tspan></text>
<line x1="390.0" y1="337.0" x2="170.0" y2="337.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="170.0" y1="337.0" x2="170.0" y2="205.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="280.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Автоматичний відкат у Слот A</text>
<text x="280.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Завантаження стабільної версії</text>
<rect x="6.6" y="424.2" width="946.9" height="31.5" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/><text x="480.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Якщо нова версія зависає в HardFault, Watchdog перезавантажує мікроконтролер, а завантажувач повертає попередній перевірений слот.</tspan></text>
</svg>