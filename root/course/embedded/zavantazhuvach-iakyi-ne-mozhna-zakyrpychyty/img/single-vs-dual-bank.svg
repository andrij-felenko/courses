<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Однобанківське оновлення проти Dual-Bank A/B</text>
<text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Чому перезапис на місці неминуче створює вікно фатальної вразливості до збою</text>
<rect x="40.0" y="89.0" width="260.0" height="24.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">ОДНОБАНКІВСЬКА СХЕМА (In-Place)</tspan></text>
<line x1="50.0" y1="137.0" x2="910.0" y2="137.0" stroke="#d0d5dd" stroke-width="1.2"/>
<rect x="50.0" y="115.0" width="170.0" height="44.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="135.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">1. Робоча v1.0</tspan><tspan x="135.0" dy="13.0">(виконується в Flash)</tspan></text>
<line x1="225.0" y1="137.0" x2="265.0" y2="137.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="270.0" y="115.0" width="180.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">2. Стирання Flash</tspan><tspan x="360.0" dy="13.0">(0xFF у векторах/коді)</tspan></text>
<line x1="455.0" y1="137.0" x2="495.0" y2="137.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500.0" y="115.0" width="180.0" height="44.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="590.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">3. Запис нової v2.0</tspan><tspan x="590.0" dy="13.0">(обрив на 42%...) ⚡</tspan></text>
<line x1="685.0" y1="137.0" x2="725.0" y2="137.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="730.0" y="115.0" width="180.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="820.0" y="127.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">💀 «ЦЕГЛИНА»</tspan><tspan x="820.0" dy="11.7">Вектори знищені, чіп мертвий</tspan></text>
<text x="480.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Збій живлення або лінка посеред запису знищує стару прошивку до того, як записано нову</text>
<rect x="40.0" y="244.0" width="260.0" height="24.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="260.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">АРХІТЕКТУРА DUAL-BANK (A / B)</tspan></text>
<line x1="50.0" y1="292.0" x2="910.0" y2="292.0" stroke="#d0d5dd" stroke-width="1.2"/>
<rect x="50.0" y="270.0" width="210.0" height="44.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="155.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Слот A (v1.0, Активний)</tspan><tspan x="155.0" dy="13.0">Працює, керує залізом</tspan></text>
<line x1="265.0" y1="292.0" x2="305.0" y2="292.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="310.0" y="270.0" width="220.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Слот B (v2.0, Пасивний)</tspan><tspan x="420.0" dy="13.0">Фоновий прийом байтів OTA</tspan></text>
<line x1="535.0" y1="292.0" x2="575.0" y2="292.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="580.0" y="270.0" width="150.0" height="44.0" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/><text x="655.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#5b21b6" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Валідація образу</tspan><tspan x="655.0" dy="13.0">(SHA-256 + ECDSA)</tspan></text>
<line x1="735.0" y1="292.0" x2="775.0" y2="292.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="780.0" y="270.0" width="130.0" height="44.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="845.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">Атомарний своп</tspan><tspan x="845.0" dy="13.0">Слот B стає Active</tspan></text>
<text x="480.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Обрив на будь-якому етапі залишає Слот A неушкодженим; пристрій продовжує штатно працювати</text>
<rect x="35.1" y="429.2" width="889.9" height="31.5" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="480.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">В однобанківській схемі є фатальний момент напівстертої пам'яті. У Dual-Bank робочий код ніколи не перезаписується наживо.</tspan></text>
</svg>