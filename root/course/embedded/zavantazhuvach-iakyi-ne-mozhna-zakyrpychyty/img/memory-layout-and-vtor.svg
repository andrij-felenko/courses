<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл Flash-пам'яті та перемикання векторів VTOR</text>
<text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ізоляція завантажувача, захист метаданих та передача керування між слотами</text>
<rect x="70.0" y="75.0" width="360.0" height="54.0" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/><text x="250.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#5b21b6" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Завантажувач (Bootloader)</tspan><tspan x="250.0" dy="13.0">(64 KB, апаратний захист від запису (WRP))</tspan></text>
<text x="60.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-weight="700">0x08000000</text>
<rect x="70.0" y="135.0" width="360.0" height="48.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="250.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Сектор метаданих (Boot Metadata)</tspan><tspan x="250.0" dy="13.0">(16 KB, подвійний запис із CRC32 та версією)</tspan></text>
<text x="60.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-weight="700">0x08010000</text>
<rect x="70.0" y="189.0" width="360.0" height="76.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Слот A (Firmware Image A)</tspan><tspan x="250.0" dy="13.0">(480 KB: Header + Vector Table + Code)</tspan></text>
<text x="60.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-weight="700">0x08014000</text>
<rect x="70.0" y="271.0" width="360.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Слот B (Firmware Image B)</tspan><tspan x="250.0" dy="13.0">(480 KB: Header + Vector Table + Code)</tspan></text>
<text x="60.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-weight="700">0x0808C000</text>
<rect x="70.0" y="353.0" width="360.0" height="44.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="250.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">NVS / Дані застосунку</tspan><tspan x="250.0" dy="13.0">(Пресет калібрувань, лог помилок)</tspan></text>
<text x="60.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-weight="700">0x08104000</text>
<rect x="490.0" y="75.0" width="420.0" height="38.0" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/><text x="700.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Регістр SCB-&gt;VTOR (Vector Table Offset)</tspan></text>
<line x1="430.0" y1="225.0" x2="470.0" y2="225.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4 3"/>
<line x1="470.0" y1="225.0" x2="470.0" y2="94.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4 3"/>
<line x1="470.0" y1="94.0" x2="490.0" y2="94.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="445.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Активний Слот A (0x08014000)</text>
<rect x="490.0" y="126.0" width="420.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="149.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">1. Перевірка цілісності: Хеш SHA-256 + підпис Ed25519 валідні</tspan></text>
<rect x="490.0" y="174.0" width="420.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="197.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">2. Очищення периферії: Вимкнення всіх переривань (NVIC), скидання SysTick</tspan></text>
<rect x="490.0" y="222.0" width="420.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="245.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">3. Перенесення векторів: SCB-&gt;VTOR = Target_Slot_Base + 0x200 (Offset)</tspan></text>
<rect x="490.0" y="270.0" width="420.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="293.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">4. Встановлення стека: __set_MSP(*(uint32_t*)Target_Slot_Base)</tspan></text>
<rect x="490.0" y="318.0" width="420.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="341.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">5. Стрибок у прошивку: Reset_Handler() за адресою *(uint32_t*)(Base + 4)</tspan></text>
<rect x="20.8" y="459.2" width="918.4" height="31.5" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="479.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Завантажувач ізольований у захищеному секторі. Передача керування вимагає повного скидання переривань і перевстановлення VTOR.</tspan></text>
</svg>