<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві комірки поряд: чому BJT «хапає» струм, а MOSFET ділить порівну</text>
<text x="200.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">БІПОЛЯРНИЙ — розбіжність</text>
<rect x="88.0" y="120.0" width="84.0" height="60.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="130.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">гарячіша</text><text x="130.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тепліша</text>
<rect x="228.0" y="120.0" width="84.0" height="60.0" rx="8" fill="#eef1f5" stroke="#c0392b" stroke-width="2.0"/><text x="270.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">холодна</text><text x="270.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">холодна</text>
<rect x="50.0" y="210.0" width="300.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="237.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">тепліша  →  Vbe падає (−2 мВ/°C)  →  бере БІЛЬШЕ струму  →  ще гарячіша  →  ↺</tspan><tspan x="200.0" dy="11.7">струм «стікається» в одну комірку — теплова втеча, вторинний пробій</tspan></text>
<text x="200.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">лік: емітерні баластні резистори</text>
<text x="580.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ПОЛЬОВИЙ — самобаланс</text>
<rect x="468.0" y="120.0" width="84.0" height="60.0" rx="8" fill="#fdecea" stroke="#2457d6" stroke-width="2.0"/><text x="510.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">тепліша</text><text x="510.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тепліша</text>
<rect x="608.0" y="120.0" width="84.0" height="60.0" rx="8" fill="#eef1f5" stroke="#2457d6" stroke-width="2.0"/><text x="650.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">холодна</text><text x="650.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">холодна</text>
<rect x="430.0" y="210.0" width="300.0" height="60.0" rx="6" fill="#eaf3ec" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="237.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">тепліша  →  Rds(on) РОСТЕ (+тк)  →  бере МЕНШЕ струму  →  холоне  →  рівновага</tspan><tspan x="580.0" dy="11.7">струм сам перетікає в холоднішу — можна паралелити без баласту</tspan></text>
<text x="580.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">лік не потрібен (у ключовому режимі)</text>
<rect x="70.0" y="330.0" width="640.0" height="44.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/><text x="390.0" y="355.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Обережно: у ЛІНІЙНОМУ режимі (мала Vgs, велика Vds) MOSFET має інший, від'ємний тк порога — і теж може «хапати» струм. Самобаланс — саме про КЛЮЧОВИЙ режим.</tspan></text>
</svg>