<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Топологія автоматизованого тестового стенда з інжекцією завад</text>
<rect x="30.0" y="60.0" width="240.0" height="360.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">ТЕСТОВИЙ ОРКЕСТРАТОР</tspan><tspan x="150.0" dy="14.3">(CI / Batch Runner)</tspan><tspan x="150.0" dy="14.3"></tspan><tspan x="150.0" dy="14.3">• Виконання тест-сьютів</tspan><tspan x="150.0" dy="14.3">• Генератор сценаріїв польоту</tspan><tspan x="150.0" dy="14.3">• Контролер таймаутів (Deadlines)</tspan><tspan x="150.0" dy="14.3">• Збір логів та артефактів</tspan><tspan x="150.0" dy="14.3">• Асерти інваріантів стану</tspan></text>
<rect x="330.0" y="60.0" width="240.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">ПРОКСІ ЗАНЕСЕННЯ ЗАВАД</tspan><tspan x="450.0" dy="14.3">(Fault Injection Proxy)</tspan><tspan x="450.0" dy="14.3"></tspan><tspan x="450.0" dy="14.3">• Штучна втрата пакетів (0..100%)</tspan><tspan x="450.0" dy="14.3">• Джитер та буфер затримки</tspan><tspan x="450.0" dy="14.3">• Псування CRC та бітові помилки</tspan><tspan x="450.0" dy="14.3">• Симуляція обриву лінка</tspan></text>
<rect x="630.0" y="60.0" width="240.0" height="360.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">ЦІЛЬОВА СИСТЕМА</tspan><tspan x="750.0" dy="14.3">(SITL / HIL Target)</tspan><tspan x="750.0" dy="14.3"></tspan><tspan x="750.0" dy="14.3">• Стек автопілота (PX4 / ArduPilot)</tspan><tspan x="750.0" dy="14.3">• Фізичний рушій або плата</tspan><tspan x="750.0" dy="14.3">• Моделювання давачів (IMU/GPS)</tspan><tspan x="750.0" dy="14.3">• Логіка Failsafe та режимів</tspan><tspan x="750.0" dy="14.3">• MAVLink потік телеметрії</tspan></text>
<rect x="330.0" y="260.0" width="240.0" height="160.0" rx="6" fill="#fdf3e7" stroke="#d35400" stroke-width="1.5"/><text x="450.0" y="297.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">АНАЛІЗАТОР ТРАЄКТОРІЙ</tspan><tspan x="450.0" dy="15.6">(Golden Run Comparator)</tspan><tspan x="450.0" dy="15.6"></tspan><tspan x="450.0" dy="15.6">• Запис стану S(t) на 100 Гц</tspan><tspan x="450.0" dy="15.6">• Динамічне вирівнювання DTW</tspan><tspan x="450.0" dy="15.6">• Перевірка коридорів допусків</tspan><tspan x="450.0" dy="15.6">• Розрахунок RMSE та овершуту</tspan></text>
<line x1="270.0" y1="110.0" x2="330.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Команди</text>
<line x1="570.0" y1="110.0" x2="630.0" y2="110.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Завади</text>
<line x1="630.0" y1="340.0" x2="570.0" y2="340.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Телеметрія</text>
<line x1="330.0" y1="340.0" x2="270.0" y2="340.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle">Вердикт</text>
</svg>