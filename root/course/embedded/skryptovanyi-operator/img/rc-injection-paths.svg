<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шляхи емуляції та інжекції команд оператора</text>
<rect x="30.0" y="60.0" width="220.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Скрипт високого рівня</tspan><tspan x="140.0" dy="14.3">(Python / C++)</tspan><tspan x="140.0" dy="14.3">Нормалізовані осі (-1000..+1000)</tspan></text>
<rect x="30.0" y="180.0" width="220.0" height="95.0" rx="6" fill="#fdf3e7" stroke="#d35400" stroke-width="1.5"/><text x="140.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Скрипт низького рівня</tspan><tspan x="140.0" dy="13.0">(Пакетний генератор)</tspan><tspan x="140.0" dy="13.0">Сирі мікросекунди (1000..2000 мкс)</tspan></text>
<rect x="30.0" y="300.0" width="220.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Апаратний генератор</tspan><tspan x="140.0" dy="15.6">(Тестовий МК: RP2040 / STM32)</tspan><tspan x="140.0" dy="15.6">Фізичний сигнал SBUS / PPM</tspan></text>
<rect x="310.0" y="60.0" width="220.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">MANUAL_CONTROL (msg #69)</tspan><tspan x="420.0" dy="15.6">Телеметрійний лінк (UDP/UART)</tspan><tspan x="420.0" dy="15.6">Емуляція USB HID джойстика</tspan></text>
<rect x="310.0" y="180.0" width="220.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">RC_CHANNELS_OVERRIDE (msg #70)</tspan><tspan x="420.0" dy="13.0">Прямий запис у канали 1..18</tspan><tspan x="420.0" dy="13.0">Таймаут скидання RC_OVERRIDE_TIME</tspan></text>
<rect x="310.0" y="300.0" width="220.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Апаратний UART RC-вхід</tspan><tspan x="420.0" dy="15.6">Інвертований SBUS 100 kbaud</tspan><tspan x="420.0" dy="15.6">DMA-буфер апаратного порту</tspan></text>
<rect x="590.0" y="60.0" width="260.0" height="95.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Контур експоненти та мертвих зон</tspan><tspan x="720.0" dy="13.0">(Stick Expo, Deadzones, Deflection Limits)</tspan><tspan x="720.0" dy="13.0">Визначення бажаних кутів/швидкості</tspan></text>
