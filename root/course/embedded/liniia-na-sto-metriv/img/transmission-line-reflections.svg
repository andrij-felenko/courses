<rect x="141.7" y="351.8" width="616.5" height="46.5" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="371.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Термінатори 120 Ом ставляться строго на ДВОХ крайніх фізичних кінцях шини.</tspan><tspan x="450.0" dy="15.0">Вони перетворюють довгу лінію на нескінченну для біжучої хвилі, повністю усуваючи відбиття.</tspan></text>
