<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Придушення синфазного шуму диференціальним приймачем RS-485</text>
<rect x="30.0" y="50.0" width="200.0" height="260.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="130.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драйвер RS-485</text>
<circle cx="190.0" cy="130.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="110.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вихід A (прямий)</text>
<circle cx="190.0" cy="230.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="110.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Вихід B (інверсний)</text>
<rect x="670.0" y="50.0" width="200.0" height="260.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="770.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приймач RS-485</text>
<circle cx="710.0" cy="130.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="790.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вхід A</text>
<circle cx="710.0" cy="230.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="790.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Вхід B</text>
<rect x="740.0" y="150.0" width="110.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="795.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Компаратор</text>
<text x="795.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V_out = V_A - V_B</text>
<line x1="190.0" y1="130.0" x2="350.0" y2="130.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="350.0" y1="130.0" x2="420.0" y2="230.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="420.0" y1="230.0" x2="490.0" y2="230.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="490.0" y1="230.0" x2="560.0" y2="130.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="560.0" y1="130.0" x2="705.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="270.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Провідник A (+2.5 В)</text>
<line x1="190.0" y1="230.0" x2="350.0" y2="230.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="350.0" y1="230.0" x2="420.0" y2="130.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="420.0" y1="130.0" x2="490.0" y2="130.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="490.0" y1="130.0" x2="560.0" y2="230.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="560.0" y1="230.0" x2="705.0" y2="230.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="270.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Провідник B (-2.5 В)</text>
<rect x="340.0" y="20.0" width="220.0" height="50.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="450.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Електромагнітна завада (ЕМІ)</text>
<text x="450.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Частотник, реле, контактор</text>
<line x1="410.0" y1="75.0" x2="410.0" y2="115.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490.0" y1="75.0" x2="490.0" y2="115.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+ V_шум однаково на обидва дроти</text>
<rect x="197.5" y="316.8" width="505.1" height="76.4" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Напруга на вході A: V_A + V_шум</tspan><tspan x="450.0" dy="15.0">Напруга на вході B: V_B + V_шум</tspan><tspan x="450.0" dy="15.0">Різниця в компараторі: (V_A + V_шум) - (V_B + V_шум) = V_A - V_B = +5 В</tspan><tspan x="450.0" dy="15.0">Синфазний шум повністю анулюється завдяки геометричній симетрії витої пари</tspan></text>
</svg>