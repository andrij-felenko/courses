<rect x="30.0" y="180.0" width="780.0" height="165.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="420.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як динамічний ключ реагує на критичні відмови системи</text>
<rect x="45.0" y="220.0" width="750.0" height="32.0" rx="5" fill="#fbecec" stroke="#c0392b" stroke-width="1.2"/>
<text x="60.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Процесор завис у «1» або «0»:</text>
<text x="310.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Постійний рівень не проходить через C1. Напруга на помпі падає до 0 В за 2 мс → Сила знеструмлюється!</text>
<rect x="45.0" y="258.0" width="750.0" height="32.0" rx="5" fill="#fbecec" stroke="#c0392b" stroke-width="1.2"/>
<text x="60.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Спрацював Reset / Bootloader:</text>
<text x="310.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Генерація частоти припиняється. Силовий ключ миттєво розмикається апаратно.</text>
<rect x="45.0" y="296.0" width="750.0" height="32.0" rx="5" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="60.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Пробій виводу GPIO на 3.3 В:</text>
<text x="310.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">DC-напруга блокується конденсатором C1. Захист спрацьовує на 100%.</text>
<text x="420.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічний ключ вимагає активного підтвердження працездатності: тиша або статика означає вимкнення</text>
