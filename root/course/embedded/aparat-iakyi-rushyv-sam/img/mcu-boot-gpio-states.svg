<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова діаграма станів GPIO під час увімкнення та скидання</text>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова діаграма станів GPIO під час увімкнення та скидання</text>
<rect x="30.0" y="60.0" width="180.0" height="220.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="120.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ФАЗА 1: POR / Brown-out</text>
<text x="120.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">0…10 мс</text>
<line x1="40.0" y1="114.0" x2="200.0" y2="114.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="120.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Живлення нестабільне,</text>
<text x="120.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ядро знеструмлене.</text>
<text x="120.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">GPIO: High-Z</text>
<rect x="220.0" y="60.0" width="190.0" height="220.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="315.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ФАЗА 2: Reset (NRST)</text>
<text x="315.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">10…50 мс</text>
<line x1="230.0" y1="114.0" x2="400.0" y2="114.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="315.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сигнал скидання в 0,</text>
<text x="315.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">периферія скинута.</text>
<text x="315.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">GPIO: High-Z / Floating</text>
<rect x="420.0" y="60.0" width="200.0" height="220.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="520.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700">ФАЗА 3: Bootloader / DFU</text>
<text x="520.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">50 мс…15 с</text>
<line x1="430.0" y1="114.0" x2="610.0" y2="114.0" stroke="#caa24a" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="520.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Завантажувач у ROM,</text>
<text x="520.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">користувацький код мовчить.</text>
<text x="520.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">GPIO: High-Z або Weak Pull</text>
<rect x="630.0" y="60.0" width="180.0" height="220.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="720.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ФАЗА 4: User Code</text>
<text x="720.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Після init</text>
<line x1="640.0" y1="114.0" x2="800.0" y2="114.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="720.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">gpio_init() налаштовано,</text>
<text x="720.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">вихід активний.</text>
<text x="720.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">GPIO: Push-Pull 0/1</text>
<rect x="30.0" y="290.0" width="580.0" height="42.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="320.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ВІКНО СМЕРТЕЛЬНОЇ НЕБЕЗПЕКИ: GPIO НЕ КЕРУЄТЬСЯ ПРОШИВКОЮ (High-Z)</text>
<rect x="630.0" y="290.0" width="180.0" height="42.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="720.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Керований стан</text>
<text x="420.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усі фази до закінчення gpio_init() потребують виключно апаратного утримання надійною підтяжкою</text>
</svg>