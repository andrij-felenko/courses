<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика плаваючого затвора та мимовільне відкриття MOSFET</text>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика плаваючого затвора: як стан High-Z вмикає MOSFET</text>
<rect x="30.0" y="65.0" width="220.0" height="275.0" rx="10" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="140.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Мікроконтролер (MCU)</text>
<text x="140.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Стан Reset / Bootloader</text>
<rect x="50.0" y="140.0" width="180.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="140.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">GPIO каскад</text>
<text x="140.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Верхній ключ: ВИМКНЕНО</text>
<text x="140.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Нижній ключ: ВИМКНЕНО</text>
<text x="140.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Вихідний опір &gt; 10 МОм</text>
<rect x="50.0" y="265.0" width="180.0" height="58.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="140.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700">Вивід у стані High-Z</text>
<text x="140.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Пін висить у повітрі</text>
<rect x="280.0" y="65.0" width="260.0" height="275.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="410.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a6d1a" text-anchor="middle" font-weight="700">Затворна ємність (C_iss)</text>
<text x="410.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Ізольований діелектрик SiO2</text>
<rect x="295.0" y="140.0" width="230.0" height="80.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.2"/>
<text x="410.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паразитні джерела струму:</text>
<text x="410.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Струми витоку плати (I_leak)</text>
<text x="410.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• Ємність Міллера (C_gd · dV/dt)</text>
<rect x="295.0" y="235.0" width="230.0" height="88.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.4"/>
<text x="410.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Напруга зростає: V_gs &gt; V_th</text>
<text x="410.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Заряд не має куди стікати</text>
<text x="410.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">V_gs досягає 1.5…2.5 В</text>
<rect x="570.0" y="65.0" width="240.0" height="275.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="690.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Силовий каскад</text>
<text x="690.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Мотор / Соленоїд / Привід</text>
<rect x="585.0" y="140.0" width="210.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="690.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стан MOSFET:</text>
<text x="690.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">САМОВІЛЬНЕ ВІДКРИТТЯ</text>
<text x="690.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Перехід у лінійний режим</text>
<rect x="585.0" y="235.0" width="210.0" height="88.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="690.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">АВАРІЙНИЙ НАСЛІДОК:</text>
<text x="690.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">• Раптовий ривок мотора</text>
<text x="690.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Перегрів та пробій кристала</text>
<line x1="254.0" y1="293.0" x2="276.0" y2="293.0" stroke="#8a6d1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="544.0" y1="293.0" x2="566.0" y2="293.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="30.0" y="350.0" width="780.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="420.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Без фізичного резистора на землю затвор є конденсатором, що заряджається шумом і вмикає привід</text>
</svg>