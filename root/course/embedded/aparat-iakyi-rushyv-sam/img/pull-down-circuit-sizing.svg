<text x="165.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">R_pd фіксує затвор на GND</text>
<rect x="320.0" y="60.0" width="490.0" height="265.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="565.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння номіналів резистора підтяжки R_pd</text>
<rect x="335.0" y="105.0" width="460.0" height="60.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.4"/>
<text x="350.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">100 кОм (Завеликий)</text>
<text x="350.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Повільний розряд (τ &gt; 200 мкс), подільник із внутрішнім pull-up (40 кОм) дає 2.3 В — транзистор ВІДКРИВАЄТЬСЯ!</text>
<rect x="335.0" y="175.0" width="460.0" height="60.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.4"/>
<text x="350.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">100 Ом (Замалий)</text>
<text x="350.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Надмірне навантаження GPIO: I = 33 мА. Вивід МК перегрівається, напруга логічної «1» просідає.</text>
<rect x="335.0" y="245.0" width="460.0" height="60.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="350.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">4.7…10 кОм (ОПТИМУМ)</text>
<text x="350.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Струм GPIO лише 0.3…0.7 мА, швидкий розряд (τ &lt; 10 мкс), надійне придушення наведень Міллера (dV/dt).</text>
<text x="420.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Номінал 4.7…10 кОм гарантує напругу на затворі нижче 0.4 В при будь-яких внутрішніх підтяжках МК</text>
