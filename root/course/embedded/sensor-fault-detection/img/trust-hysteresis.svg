<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Довіра з гістерезисом: впасти легко, піднятися важко</text>
<rect x="70.0" y="60.0" width="680.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="110.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">TRUST — числу вірю</text>
<rect x="70.0" y="224.0" width="680.0" height="52.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="110.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">FAULT — давач відкинуто</text>
<line x1="250.0" y1="112.0" x2="250.0" y2="224.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="34.0" y="126.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0.0"/><text x="134.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="134.0" dy="0.0">bad ≥ TRIP</tspan><tspan x="134.0" dy="13.7">(мало поганих поспіль)</tspan><tspan x="134.0" dy="13.7">підозра підтвердилась</tspan></text>
<line x1="590.0" y1="224.0" x2="590.0" y2="112.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="606.0" y="126.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0.0"/><text x="706.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="706.0" dy="0.0">good ≥ HEAL</tspan><tspan x="706.0" dy="13.7">(БАГАТО добрих поспіль)</tspan><tspan x="706.0" dy="13.7">довіру повертаємо нехотя</tspan></text>
<line x1="70.0" y1="312.0" x2="750.0" y2="312.0" stroke="#e6e6ea" stroke-width="1.2"/>
<text x="410.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">TRIP мале, HEAL велике (HEAL ≫ TRIP) — щоб давач на межі справності не миготів</text>
<text x="410.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">симетричні пороги дали б «блимання» на самій межі; різні — стабільне рішення</text>
</svg>