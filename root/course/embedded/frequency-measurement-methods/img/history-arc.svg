<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві віхи HP: чому реципрокний рахунок чекав 22 роки</text>
<line x1="70.0" y1="96.0" x2="720.0" y2="96.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="100.0" y1="90.0" x2="100.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="100.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1952</text>
<line x1="700.0" y1="90.0" x2="700.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="700.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1974</text>
<text x="720.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">час →</text>
<rect x="70.7" y="144.0" width="198.6" height="32.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">HP 524A · прямий рахунок</tspan></text>
<text x="170.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">масштабовані швидкі імпульси</text>
<text x="170.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">→ повільний накопичувач</text>
<text x="170.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вибірна часова база</text>
<text x="170.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">радіостанція за ~1 с</text>
<text x="170.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">(а було ~10 хв)</text>
<text x="170.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">АЛЕ на низькій частоті</text>
<text x="170.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">подій замало → число грубшає</text>
<rect x="498.2" y="144.0" width="183.7" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">HP 5345A · реципрокний</tspan></text>
<text x="590.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">міряє ПЕРІОД і обертає його</text>
<text x="590.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">50 мкГц … 500 МГц</text>
<text x="590.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">9 розрядів на всьому діапазоні</text>
<text x="590.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1 Гц за 1 с — навіть унизу</text>
<text x="590.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">(низькі частоти РОЗВ'ЯЗАНО)</text>
<line x1="250.0" y1="160.0" x2="508.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="223.4" y="102.5" width="313.3" height="31.0" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="380.0" y="121.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a5c00" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">22 роки: як НЕ втратити роздільність унизу?</tspan></text>
<rect x="120.0" y="364.0" width="520.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="390.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">та сама рівність f = 1/T — спершу прочитана «рахуй події», згодом «міряй період і обертай»</tspan></text>
