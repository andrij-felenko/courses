<rect x="616.1" y="269.5" width="127.7" height="31.0" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="680.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="680.0" dy="0.0">Неперервно у циклі</tspan><tspan x="680.0" dy="13.0">(Атомарний NVS запис)</tspan></text>
