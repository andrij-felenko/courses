<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл калібрувальних коефіцієнтів у пристрої</text>
<rect x="20.0" y="50.0" width="240.0" height="270.0" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="140.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0"></tspan></text>
<rect x="29.2" y="58.5" width="221.5" height="33.0" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="140.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1. Заводський стенд (EOL)</tspan></text>
<text x="140.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">• Еталонна термокамера / гирі</tspan><tspan x="140.0" dy="16.5">• Вимірювання Gain і Offset₀</tspan><tspan x="140.0" dy="16.5">• Підгонка полінома термокомпенсації</tspan><tspan x="140.0" dy="16.5">• Запис у OTP / захищену Flash</tspan><tspan x="140.0" dy="16.5">• Незмінна метрологічна база</tspan></text>
<rect x="290.0" y="50.0" width="240.0" height="270.0" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="410.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0"></tspan></text>
<rect x="303.3" y="58.5" width="213.4" height="33.0" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="410.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#065f46" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">2. Старт пристрою (Boot)</tspan></text>
<text x="410.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">• Тарування нуля (Zero Tare)</tspan><tspan x="410.0" dy="16.5">• Зняття механічних напружень</tspan><tspan x="410.0" dy="16.5">• Вимірювання температури T_boot</tspan><tspan x="410.0" dy="16.5">• Перевірка цілісності CRC32</tspan><tspan x="410.0" dy="16.5">• Завантаження в робоче ОЗП</tspan></text>
<rect x="560.0" y="50.0" width="240.0" height="270.0" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="680.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0"></tspan></text>
<rect x="561.2" y="58.5" width="237.6" height="33.0" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="680.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">3. Польовий режим (Runtime)</tspan></text>
<text x="680.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">• Компенсація дрейфу від T(t)</tspan><tspan x="680.0" dy="16.5">• Фоновий трекінг нуля (Auto-Zero)</tspan><tspan x="680.0" dy="16.5">• Відстеження старіння елементів</tspan><tspan x="680.0" dy="16.5">• Атомарне оновлення A/B слотів</tspan><tspan x="680.0" dy="16.5">• Резервування при brownout</tspan></text>
