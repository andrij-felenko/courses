<rect x="87.2" y="68.5" width="245.7" height="33.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="210.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">СЛОТ A (Сектор / Сторінка 0)</tspan></text>
<text x="210.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">magic: 0x43414C42 ('CALB')  [OK]</tspan><tspan x="210.0" dy="14.7">schema_version: 1            [OK]</tspan><tspan x="210.0" dy="14.7">sequence_id: 104            [ЧИННА ЕПОХА]</tspan><tspan x="210.0" dy="14.7">payload: {offset, gain, ...} [ВАЛІДНО]</tspan><tspan x="210.0" dy="14.7">crc32: 0x8F3A12C5           [ЗБІГАЄТЬСЯ]</tspan></text>
<rect x="101.1" y="214.5" width="217.8" height="31.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="210.0" y="233.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">СТАТУС: АКТИВНИЙ РОБОЧИЙ СЛОТ</tspan></text>
<rect x="440.0" y="60.0" width="340.0" height="200.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2.0"/><text x="610.0" y="164.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0"></tspan></text>
<rect x="487.2" y="68.5" width="245.7" height="33.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="610.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">СЛОТ B (Сектор / Сторінка 1)</tspan></text>
<text x="610.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">magic: 0x43414C42 ('CALB')  [OK]</tspan><tspan x="610.0" dy="14.7">schema_version: 1            [OK]</tspan><tspan x="610.0" dy="14.7">sequence_id: 105            [НОВИЙ ЗАПИС]</tspan><tspan x="610.0" dy="14.7">payload: {0x12, 0xFF, 0x00...} [ОБРИВ ПРИ BROWNOUT]</tspan><tspan x="610.0" dy="14.7">crc32: 0x00000000           [НЕ ЗБІГАЄТЬСЯ!]</tspan></text>
<rect x="497.7" y="214.5" width="224.6" height="31.0" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="610.0" y="233.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">СТАТУС: ПОШКОДЖЕНО (ВІДХИЛЕНО)</tspan></text>
<line x1="385.0" y1="140.0" x2="435.0" y2="140.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="365.8" y="101.1" width="88.5" height="27.8" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="410.0" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Збій живлення</tspan><tspan x="410.0" dy="12.3">під час запису</tspan></text>
<rect x="40.0" y="280.0" width="740.0" height="85.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="410.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0"></tspan></text>
<text x="410.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle"><tspan x="410.0" dy="0.0">1. Нове калібрування завжди пишеться у неактивний слот з інкрементом sequence_id.</tspan><tspan x="410.0" dy="14.7">2. CRC32 записується останнім байтом після повного запису та перевірки даних.</tspan><tspan x="410.0" dy="14.7">3. При старті читаються обидва слоти: якщо слот B має битий CRC, система прозоро обирає слот A.</tspan><tspan x="410.0" dy="14.7">4. Дані не втрачаються навіть при раптовому вимиканні живлення в середині операції!</tspan></text>
</svg>