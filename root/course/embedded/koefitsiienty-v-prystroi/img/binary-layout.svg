<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бінарне розміщення полів калібрувального блоку</text>
<rect x="142.1" y="43.5" width="535.8" height="33.0" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/><text x="410.0" y="64.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Структура калібрувального блоку (64 байти, вирівнювання 4 байти)</tspan></text>
<rect x="40.0" y="95.0" width="230.0" height="190.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="155.0" y="194.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0"></tspan></text>
<text x="155.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Заголовок (Header: 16 B)</text>
<text x="155.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">0x00: magic [4B] (0x43414C42)</tspan><tspan x="155.0" dy="15.2">0x04: schema_version [2B]</tspan><tspan x="155.0" dy="15.2">0x06: flags [2B] (Valid, Fact, Cal)</tspan><tspan x="155.0" dy="15.2">0x08: sequence_id [4B] (Епоха A/B)</tspan><tspan x="155.0" dy="15.2">0x0C: timestamp / station [4B]</tspan></text>
<rect x="285.0" y="95.0" width="330.0" height="190.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="450.0" y="194.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0"></tspan></text>
<text x="450.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Корисні коефіцієнти (Payload: 44 B)</text>
<text x="450.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">0x10..0x18: offset_x, y, z [3 × float 4B]</tspan><tspan x="450.0" dy="15.2">0x1C..0x24: gain_x, y, z [3 × float 4B]</tspan><tspan x="450.0" dy="15.2">0x28..0x30: poly_t0, t1, t2 [3 × float 4B]</tspan><tspan x="450.0" dy="15.2">0x34: temp_ref [float 4B]</tspan><tspan x="450.0" dy="15.2">0x38: serial_id [uint32 4B]</tspan><tspan x="450.0" dy="15.2">0x3C: reserved_pad [4B] (Zero-filled)</tspan></text>
<rect x="630.0" y="95.0" width="150.0" height="190.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="705.0" y="194.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0"></tspan></text>
<text x="705.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">Підвал (4 B)</text>
<text x="705.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">0x3C..0x3F:</tspan><tspan x="705.0" dy="15.2">crc32 [4B]</tspan><tspan x="705.0" dy="15.2">IEEE 802.3</tspan><tspan x="705.0" dy="15.2">over 0x00..0x3B</tspan></text>
<rect x="40.0" y="300.0" width="740.0" height="55.0" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.0"/><text x="410.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0"></tspan></text>
<text x="410.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle"><tspan x="410.0" dy="0.0">• magic 0x43414C42 ('CALB') відсікає стерту Flash (0xFF) та чисту SRAM (0x00)</tspan><tspan x="410.0" dy="14.2">• schema_version захищає від несумісних структур при OTA-оновленні прошивки</tspan><tspan x="410.0" dy="14.2">• CRC32 покриває всі попередні 60 байтів, унеможливлюючи роботу з битими даними</tspan></text>
</svg>