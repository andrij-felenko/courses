<rect x="66.8" y="70.2" width="86.4" height="19.5" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="110.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">OTP / eFuse</tspan></text>
<text x="110.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">• Розміщення: кристал MCU</tspan><tspan x="110.0" dy="14.5">• Ресурс: 1 запис (незворотно)</tspan><tspan x="110.0" dy="14.5">• Час запису: одиниці мс</tspan><tspan x="110.0" dy="14.5">• Захист: апаратний замок</tspan><tspan x="110.0" dy="14.5">• Призначення: заводська</tspan><tspan x="110.0" dy="14.5">  метрологічна база (Root)</tspan></text>
<rect x="220.0" y="55.0" width="180.0" height="285.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="310.0" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0"></tspan></text>
<rect x="231.1" y="70.2" width="157.7" height="19.5" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="310.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">Внутрішня Flash (NVS)</tspan></text>
<text x="310.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">• Розміщення: сектор Flash</tspan><tspan x="310.0" dy="14.5">• Ресурс: 10k–100k циклів</tspan><tspan x="310.0" dy="14.5">• Стирається секторами (1–128 КБ)</tspan><tspan x="310.0" dy="14.5">• Flash Stall блокує шину</tspan><tspan x="310.0" dy="14.5">• Призначення: конфігурація</tspan><tspan x="310.0" dy="14.5">  з A/B подвійним буфером</tspan></text>
<rect x="420.0" y="55.0" width="180.0" height="285.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="510.0" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0"></tspan></text>
<rect x="452.5" y="70.2" width="115.0" height="19.5" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="510.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Зовнішня EEPROM</tspan></text>
<text x="510.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">• Шина: I2C або SPI</tspan><tspan x="510.0" dy="14.5">• Ресурс: ~1 000 000 циклів</tspan><tspan x="510.0" dy="14.5">• Посторінковий запис (3–5 мс)</tspan><tspan x="510.0" dy="14.5">• Апаратний пін WP (Write Protect)</tspan><tspan x="510.0" dy="14.5">• Призначення: надійне польове</tspan><tspan x="510.0" dy="14.5">  зберігання з захистом WP</tspan></text>
<rect x="620.0" y="55.0" width="180.0" height="285.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="710.0" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0"></tspan></text>
<rect x="627.6" y="70.2" width="164.9" height="19.5" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/><text x="710.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Сегнетоелектрична FRAM</tspan></text>
<text x="710.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">• Шина: I2C або SPI</tspan><tspan x="710.0" dy="14.5">• Ресурс: 10¹⁴ циклів (без меж)</tspan><tspan x="710.0" dy="14.5">• Миттєвий запис на швидкості шини</tspan><tspan x="710.0" dy="14.5">• Без затримок і без стирання</tspan><tspan x="710.0" dy="14.5">• Призначення: часте польове</tspan><tspan x="710.0" dy="14.5">  тарування та аварійний стан</tspan></text>
