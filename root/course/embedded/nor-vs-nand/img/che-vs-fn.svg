<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два механізми запису — і чому саме вони розводять NOR та NAND</text>
<rect x="34.0" y="66.0" width="410.0" height="300.0" rx="12" fill="#eef0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="239.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">NOR: запис гарячими електронами (CHE)</text>
<rect x="70.0" y="250.0" width="70.0" height="30.0" rx="4" fill="#dfe6fb" stroke="#2457d6" stroke-width="1.6"/>
<text x="105.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">витік</text>
<rect x="140.0" y="250.0" width="200.0" height="30.0" rx="0" fill="#f4f7f4" stroke="#6b7280" stroke-width="1.4"/>
<text x="240.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">канал (сильний струм)</text>
<rect x="340.0" y="250.0" width="70.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="375.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">стік</text>
<rect x="150.0" y="176.0" width="180.0" height="26.0" rx="5" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="240.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6a18" text-anchor="middle" font-weight="700">плаваючий затвор</text>
<text x="240.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">керівний затвор (висока напруга)</text>
<line x1="150.0" y1="160.0" x2="330.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="300.0" y1="250.0" x2="300.0" y2="202.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="300.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">▲</text>
<text x="360.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">гарячий e⁻</text>
<text x="240.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">розігнати e⁻ в каналі → закинути на затвор</text>
<text x="240.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">коштує великого струму (десятки мкА на клітину)</text>
<rect x="456.0" y="66.0" width="410.0" height="300.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="661.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">NAND: запис і стирання тунелюванням (FN)</text>
<rect x="560.0" y="250.0" width="200.0" height="30.0" rx="0" fill="#f4f7f4" stroke="#6b7280" stroke-width="1.4"/>
<text x="660.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">канал (майже без струму)</text>
<rect x="570.0" y="176.0" width="180.0" height="26.0" rx="5" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="660.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6a18" text-anchor="middle" font-weight="700">плаваючий затвор</text>
<text x="660.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">керівний затвор (дуже висока напруга)</text>
<line x1="570.0" y1="160.0" x2="750.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="660.0" y1="250.0" x2="660.0" y2="202.0" stroke="#27ae60" stroke-width="2.4" stroke-dasharray="3,3"/>
<text x="660.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">▲</text>
<text x="770.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">e⁻ тунелює</text>
<text x="660.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">сильне поле «продавлює» e⁻ крізь тонкий ізолятор</text>
<text x="660.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">струм крихітний → клітину можна зшити в низку</text>
<rect x="60.0" y="388.0" width="780.0" height="76.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">FN-тунелювання ефективніше за гарячі електрони приблизно в 100 000 – 1 000 000 разів за струмом.</text>
<text x="450.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">тому NAND живить хоч тисячі клітин у ланцюгу тим самим мізерним струмом — звідси її щільність.</text>
<text x="450.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">NOR же мусить гнати струм крізь кожну клітину поодинці — багато проводів, менша щільність, але прямий доступ.</text>
<rect x="60.0" y="478.0" width="780.0" height="52.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="450.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">корінь усього: спосіб ЗАКИНУТИ заряд визначає, чи можна ставити клітини в щільну низку.</text>
<text x="450.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">звідси вже випливають і топологія, і доступ, і ціна за біт, і хто для коду, а хто для даних.</text>
</svg>