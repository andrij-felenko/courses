<text x="640.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">послідовно</text>
<text x="610.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">щоб дотягтись до однієї — струм іде крізь сусідів</text>
<text x="610.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">→ читати можна лише цілою сторінкою, не байтом</text>
<rect x="60.0" y="392.0" width="780.0" height="70.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="210.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">властивість</text>
<text x="500.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">NOR (наш W25Q)</text>
<text x="740.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">NAND</text>
<text x="72.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Випадкове читання байта</text>
<text x="500.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">так — будь-де</text>
<text x="740.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">ні — лише сторінками</text>
<text x="72.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Щільність / ціна за байт</text>
<text x="500.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">нижча, дорожча</text>
<text x="740.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">вища, дешевша</text>
<text x="72.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Де доречна</text>
<text x="500.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">код, малі прошивки</text>
<text x="740.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">масові дані: SD, eMMC, SSD</text>
<line x1="370.0" y1="400.0" x2="370.0" y2="456.0" stroke="#e4e4e4" stroke-width="1.0"/>
<line x1="635.0" y1="400.0" x2="635.0" y2="456.0" stroke="#e4e4e4" stroke-width="1.0"/>
<rect x="60.0" y="476.0" width="780.0" height="50.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="450.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">W25Q-клас — це NOR: її козир — читати будь-який байт, тож код виконують прямо з неї (XIP).</text>
<text x="450.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">платня — менший об'єм; коли байтів дуже багато, беруть NAND і миряться з посторінковим доступом.</text>
