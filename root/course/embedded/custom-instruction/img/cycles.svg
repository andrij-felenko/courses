<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 978 408" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="978" height="408" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="484.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підрахунок одиничних бітів 32-розрядного слова</text>
<text x="484.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">порядок тактів на одну операцію — менше краще</text>
<text x="236.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">Софтова петля по бітах</text>
<rect x="250.0" y="92.0" width="460.0" height="38.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.9"/>
<text x="722.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">≈ 32 ітерації × кілька тактів → десятки тактів</text>
<text x="236.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">Софт, трюк-таблиця</text>
<rect x="250.0" y="162.0" width="156.4" height="38.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.9"/>
<text x="418.4" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">кілька звернень до RAM + зсуви → одиниці-десятки</text>
<text x="236.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="end" font-weight="700">Кастомна popcount</text>
<rect x="250.0" y="232.0" width="23.0" height="38.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.9"/>
<text x="285.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1 такт: усе порахувала схема в тракті ядра</text>
<line x1="250.0" y1="304.0" x2="710.0" y2="304.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3"/>
<line x1="250.0" y1="304.0" x2="710.0" y2="304.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="250.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">-&gt; більше тактів</text>
<rect x="40.0" y="338.0" width="888.0" height="44.0" rx="6" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/><text x="484.0" y="363.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="484.0" dy="0.0">Виграш у рази дає не «швидший код», а перенос самої петлі в залізо: те, що ядро робило бітами поспіль, схема рахує за один прохід.</tspan></text>
</svg>