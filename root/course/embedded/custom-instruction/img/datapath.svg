<rect x="40.0" y="376.0" width="700.0" height="44.0" rx="6" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/><text x="390.0" y="401.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Ключове: ваш блок сидить ПОРЯД з ALU всередині того самого ядра й користується тими самими регістрами. Ні шини, ні DMA — лише ще один шлях обчислення.</tspan></text>
