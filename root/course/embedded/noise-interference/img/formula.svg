<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
<rect width="960" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fae"/></marker>
</defs>
<text x="480.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Формула Найквіста: чотири множники — і жодного «номера деталі»</text>
<text x="480.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тепловий шум залежить лише від температури, опору й смуги — не від матеріалу чи бренду резистора</text>
<text x="480.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Vшум(rms)  =  √( 4 · k · T · R · B )</text>
<line x1="395.0" y1="134.0" x2="395.0" y2="201.0" stroke="#7a3fae" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<rect x="299.0" y="201.0" width="192.0" height="56.0" rx="8" fill="#ffffff" stroke="#7a3fae" stroke-width="1.6"/>
<text x="395.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7a3fae" text-anchor="middle" font-weight="bold" font-style="normal">k — стала Больцмана</text>
<text x="395.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">міст до температури; 1.38×10⁻²³</text>
<line x1="452.0" y1="134.0" x2="452.0" y2="281.0" stroke="#c0271e" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<rect x="356.0" y="281.0" width="192.0" height="56.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="452.0" y="301.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">T — абсолютна t°, K</text>
<text x="452.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">гарячіше → гучніше; вимкнути не можна</text>
<line x1="510.0" y1="134.0" x2="510.0" y2="201.0" stroke="#e08030" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<rect x="414.0" y="201.0" width="192.0" height="56.0" rx="8" fill="#ffffff" stroke="#e08030" stroke-width="1.6"/>
<text x="510.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">R — опір, Ω</text>
<text x="510.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">більший R → більший шум напруги</text>
<line x1="566.0" y1="134.0" x2="566.0" y2="281.0" stroke="#1f8a3b" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<rect x="470.0" y="281.0" width="192.0" height="56.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="566.0" y="301.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">B — смуга, Гц</text>
<text x="566.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ширша смуга → більше шуму</text>
<rect x="120.0" y="350.0" width="720.0" height="56.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="480.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шум росте як √(T·R·B): щоб удвічі тихіше — учетверо вужча смуга, або вчетверо менший опір, або вчетверо холодніше.</text>
<text x="480.0" y="393.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Це фундаментальна межа: вона не залежить від того, чий резистор і з чого зроблений.</text>
</svg>
