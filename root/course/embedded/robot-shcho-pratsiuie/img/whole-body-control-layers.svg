<line x1="410.0" y1="163.0" x2="410.0" y2="185.0" stroke="#059669" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="700">x_d, F_d, n</text>
