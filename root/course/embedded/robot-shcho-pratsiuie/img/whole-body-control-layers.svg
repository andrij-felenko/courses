<text x="60.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">РІВЕНЬ 2: КООРДИНАЦІЯ ВСІЄЇ СИСТЕМИ (50–100 Гц, Whole-Body Coordination)</text>
<rect x="60.0" y="220.0" width="215.0" height="76.0" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/><text x="167.5" y="240.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">Кінематична надлишковість</tspan><tspan x="167.5" dy="14.3">Спільний якобіан J_wb(q)</tspan><tspan x="167.5" dy="14.3">База (SE(3)) + Рука (q_1..q_n)</tspan><tspan x="167.5" dy="14.3">Розмірність q &gt; 6</tspan></text>
<rect x="295.0" y="220.0" width="230.0" height="76.0" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/><text x="410.0" y="240.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Проекція в нуль-простір N(J)</tspan><tspan x="410.0" dy="14.3">Головна задача: інструмент у x_d</tspan><tspan x="410.0" dy="14.3">Вторинна: стійкість бази,</tspan><tspan x="410.0" dy="14.3">віддалення від упорів суглобів</tspan></text>
<rect x="545.0" y="220.0" width="215.0" height="76.0" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/><text x="652.5" y="240.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="652.5" dy="0.0">Узгодження динаміки</tspan><tspan x="652.5" dy="14.3">Повільна масивна база (10 Гц)</tspan><tspan x="652.5" dy="14.3">+</tspan><tspan x="652.5" dy="14.3">Швидка легка рука (500 Гц)</tspan></text>
<line x1="410.0" y1="309.0" x2="410.0" y2="331.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
