<text x="60.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="700">РІВЕНЬ 1: СПРИЙНЯТТЯ ТА СЕМАНТИКА (10–30 Гц, Асинхронний / Soft RT)</text>
<rect x="60.0" y="94.0" width="215.0" height="56.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/><text x="167.5" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">RGB-D камери та лідари</tspan><tspan x="167.5" dy="13.0">Хмара точок робочої зони</tspan><tspan x="167.5" dy="13.0">Точність: міліметри (ToF / Stereo)</tspan></text>
