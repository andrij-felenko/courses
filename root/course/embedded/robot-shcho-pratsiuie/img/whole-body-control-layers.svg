<rect x="40.0" y="334.0" width="740.0" height="148.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="60.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">РІВЕНЬ 3: СИЛОВИЙ КОНТУР РЕАЛЬНОГО ЧАСУ (500–1000 Гц, Hard Real-Time)</text>
<rect x="60.0" y="366.0" width="170.0" height="104.0" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="145.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">6-DOF F/T сенсор</tspan><tspan x="145.0" dy="13.0">Вимірювання F_ext, tau_ext</tspan><tspan x="145.0" dy="13.0">Фільтрація брязкоту</tspan><tspan x="145.0" dy="13.0">Затримка &lt; 1 мс</tspan></text>
<rect x="245.0" y="366.0" width="235.0" height="104.0" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="362.5" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="362.5" dy="0.0">Адмітансний / Імпедансний регулятор</tspan><tspan x="362.5" dy="13.0">M_d e'' + D_d e' + K_d e = -F_ext</tspan><tspan x="362.5" dy="13.0">Обчислення віртуальної піддатливості</tspan><tspan x="362.5" dy="13.0">Корекція траєкторії Delta_x</tspan></text>
<rect x="495.0" y="366.0" width="140.0" height="104.0" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="565.0" y="403.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">FOC драйвери моторів</tspan><tspan x="565.0" dy="11.7">Контур моменту / струму</tspan><tspan x="565.0" dy="11.7">Шина CAN FD / EtherCAT</tspan><tspan x="565.0" dy="11.7">Пряма реакція на зріз</tspan></text>
<rect x="645.0" y="366.0" width="120.0" height="104.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="705.0" y="403.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle"><tspan x="705.0" dy="0.0">Захист Failsafe</tspan><tspan x="705.0" dy="11.7">Обмеження F_max</tspan><tspan x="705.0" dy="11.7">Аварійне втягування</tspan><tspan x="705.0" dy="11.7">(Retract)</tspan></text>
