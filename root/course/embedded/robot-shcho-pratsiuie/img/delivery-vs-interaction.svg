<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="360.0" height="44.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="210.0" y="38.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">ДРОН-ВІЗНИК (ПАСИВНИЙ ТРАНСПОРТ)</tspan><tspan x="210.0" dy="16.9">Вільний простір, відкритий ланцюг</tspan></text>
<rect x="430.0" y="20.0" width="360.0" height="44.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="610.0" y="38.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">РОБОТ-РОБІТНИК (СИЛОВА ВЗАЄМОДІЯ)</tspan><tspan x="610.0" dy="16.9">Контакт із середовищем, замкнений ланцюг</tspan></text>
<rect x="30.0" y="75.0" width="360.0" height="385.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="45.0" y="90.0" width="330.0" height="58.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="210.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Вантаж = пасивна маса m_p</tspan><tspan x="210.0" dy="15.6">Зсуває центр мас (ЦМ) і тензор інерції I</tspan><tspan x="210.0" dy="15.6">Жодних зовнішніх кінематичних в'язей</tspan></text>
<rect x="45.0" y="160.0" width="330.0" height="68.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="210.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Контур керування: Позиційний ПІД (SE(3))</tspan><tspan x="210.0" dy="15.6">Помилка: e(t) = x_d(t) - x(t)</tspan><tspan x="210.0" dy="15.6">Ціль: звести e(t) до 0 будь-якою тягою</tspan></text>
<rect x="45.0" y="240.0" width="330.0" height="60.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="210.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Зовнішня сила = невідоме збурення F_dist</tspan><tspan x="210.0" dy="15.6">Вітер чи інерція вантажу придушуються</tspan><tspan x="210.0" dy="15.6">інтегральною ланкою регулятора</tspan></text>
<rect x="45.0" y="312.0" width="330.0" height="70.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="335.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle"><tspan x="210.0" dy="0.0">Наслідок аварійного контакту зі стіною:</tspan><tspan x="210.0" dy="15.6">Позиційний ПІД нарощує інтегратор,</tspan><tspan x="210.0" dy="15.6">мотори виходять на 100% тяги -&gt; удар/зрив</tspan></text>
<rect x="45.0" y="394.0" width="330.0" height="52.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="210.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Сенсорний фокус: Глобальна навігація</tspan><tspan x="210.0" dy="14.3">GNSS, барометр, оглядовий лідар (SLAM)</tspan></text>
<rect x="430.0" y="75.0" width="360.0" height="385.0" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
<rect x="445.0" y="90.0" width="330.0" height="58.0" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="610.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Довкілля = пружна або жорстка опора</tspan><tspan x="610.0" dy="15.6">Замикання кінематичного ланцюга</tspan><tspan x="610.0" dy="15.6">Сила реакції зв'язку: F_ext = K_env · delta_x</tspan></text>
<rect x="445.0" y="160.0" width="330.0" height="68.0" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="610.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Контур: Гібридний / Імпедансний</tspan><tspan x="610.0" dy="15.6">M_d · e'' + D_d · e' + K_d · e = -F_ext</tspan><tspan x="610.0" dy="15.6">Ціль: баланс між положенням і силою</tspan></text>
<rect x="445.0" y="240.0" width="330.0" height="60.0" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="610.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Зовнішня сила = цільова керована змінна</tspan><tspan x="610.0" dy="15.6">Сила притискання інструмента до поверхні</tspan><tspan x="610.0" dy="15.6">задається і вимірюється в реальному часі</tspan></text>
<rect x="445.0" y="312.0" width="330.0" height="70.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle"><tspan x="610.0" dy="0.0">Реакція на контакт зі стіною:</tspan><tspan x="610.0" dy="14.3">Імпеданс віддає інструмент назад (Compliance),</tspan><tspan x="610.0" dy="14.3">тяга скидається, сила стабілізується на нормі</tspan></text>
<rect x="445.0" y="394.0" width="330.0" height="52.0" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="610.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Сенсорний фокус: Локальний контакт</tspan><tspan x="610.0" dy="14.3">6-DOF F/T сенсор на зап'ястку, RGB-D нормалі</tspan></text>
</svg>