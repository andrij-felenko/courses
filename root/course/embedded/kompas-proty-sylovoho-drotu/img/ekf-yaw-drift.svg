<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг деградації EKF: від струмової завади до спірального зриву навігації</text>
<rect x="29.7" y="53.2" width="120.6" height="53.6" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="90.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">1. Додавання газу</tspan><tspan x="90.0" dy="14.3">Струм I зростає</tspan><tspan x="90.0" dy="14.3">від 15 А до 120 А</tspan></text>
<rect x="240.3" y="53.2" width="139.4" height="53.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">2. Паразитне поле</tspan><tspan x="310.0" dy="14.3">ΔB ~ k · I спотворює</tspan><tspan x="310.0" dy="14.3">вектор магнітометра</tspan></text>
<rect x="454.0" y="53.2" width="151.9" height="53.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">3. Хибний курс компаса</tspan><tspan x="530.0" dy="14.3">Поворот вектора B</tspan><tspan x="530.0" dy="14.3">на кут Δψ = 25°...50°</tspan></text>
<rect x="660.9" y="53.2" width="158.2" height="53.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="740.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">4. Нев'язка в EKF</tspan><tspan x="740.0" dy="14.3">Innovation y = z − h(x)</tspan><tspan x="740.0" dy="14.3">зміщує оцінку курсу ψ̂</tspan></text>
<line x1="155.0" y1="80.0" x2="240.0" y2="80.0" stroke="#ea580c" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="380.0" y1="80.0" x2="455.0" y2="80.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="605.0" y1="80.0" x2="670.0" y2="80.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="740.0" y1="115.0" x2="740.0" y2="205.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="664.0" y="213.2" width="151.9" height="53.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="740.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">5. Реакція автопілота</tspan><tspan x="740.0" dy="14.3">Контролер докручує</tspan><tspan x="740.0" dy="14.3">мотори для виправлення</tspan></text>
<rect x="450.9" y="213.2" width="158.2" height="53.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">6. Фізичний розворот</tspan><tspan x="530.0" dy="14.3">Ніс дрона відхиляється</tspan><tspan x="530.0" dy="14.3">від реальної траєкторії</tspan></text>
<rect x="240.3" y="213.2" width="139.4" height="53.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">7. Конфлікт з GPS</tspan><tspan x="310.0" dy="14.3">Вектор швидкості GPS</tspan><tspan x="310.0" dy="14.3">суперечить курсу ψ̂</tspan></text>
<rect x="11.4" y="213.2" width="157.2" height="53.6" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1.5"/><text x="90.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">8. Спіраль Flyaway</tspan><tspan x="90.0" dy="14.3">EKF скидає курс або</tspan><tspan x="90.0" dy="14.3">входить у «унітазинг»</tspan></text>
