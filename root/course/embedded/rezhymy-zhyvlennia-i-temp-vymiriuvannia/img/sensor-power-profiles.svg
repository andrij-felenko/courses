<rect x="50.0" y="255.0" width="300.0" height="145.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="295.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Аналоговий тракт і АЦП увімкнені постійно.</tspan><tspan x="200.0" dy="14.3"></tspan><tspan x="200.0" dy="14.3">• Струм I_avg ≈ 2.5 мА</tspan><tspan x="200.0" dy="14.3">• Батарея CR2032 (220 мА·год) сідає за:</tspan><tspan x="200.0" dy="14.3">   220 / 2.5 = 88 годин (менше 4 діб!)</tspan><tspan x="200.0" dy="14.3">• Швидке оновлення, але марнування заряду</tspan></text>
