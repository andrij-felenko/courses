<rect x="410.0" y="255.0" width="300.0" height="145.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="301.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Давач спить 99.5% часу й прокидається на 5 мс.</tspan><tspan x="560.0" dy="11.7"></tspan><tspan x="560.0" dy="11.7">• I_avg = (2.5 мА × 5 мс + 0.5 мкА × 995 мс) / 1000 мс</tspan><tspan x="560.0" dy="11.7">• I_avg ≈ 12.5 мкА + 0.5 мкА = 13.0 мкА</tspan><tspan x="560.0" dy="11.7">• Ресурс CR2032: 220 мА·год / 13 мкА ≈ 1.9 року!</tspan><tspan x="560.0" dy="11.7">• Економія заряду: у 192 рази</tspan></text>
