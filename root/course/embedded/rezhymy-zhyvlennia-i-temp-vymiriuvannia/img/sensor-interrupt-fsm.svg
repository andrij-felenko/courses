<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подійно-орієнтоване пробудження: ланцюг обробки від сну до реакції</text>
<rect x="20.0" y="20.0" width="720.0" height="380.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="40.0" y="60.0" width="200.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="83.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1. СПОКІЙ</tspan><tspan x="140.0" dy="11.7">(Ultra Low Power)</tspan><tspan x="140.0" dy="11.7"></tspan><tspan x="140.0" dy="11.7">• МК: Deep Sleep (1 мкА)</tspan><tspan x="140.0" dy="11.7">• Давач: Low-Power ODR (10 Гц)</tspan><tspan x="140.0" dy="11.7">• Струм давача: ~3 мкА</tspan></text>
<line x1="240.0" y1="110.0" x2="280.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="260.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">подія</text>
<rect x="280.0" y="60.0" width="210.0" height="100.0" rx="6" fill="#fff7e6" stroke="#b7791f" stroke-width="1.5"/><text x="385.0" y="78.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle" font-weight="700"><tspan x="385.0" dy="0.0">2. АПАРАТНИЙ ДЕТЕКТОР</tspan><tspan x="385.0" dy="14.3">(Внутрішня логіка чипа)</tspan><tspan x="385.0" dy="14.3"></tspan><tspan x="385.0" dy="14.3">• Перевірка: |Δa| &gt; Поріг</tspan><tspan x="385.0" dy="14.3">• Тривалість &gt; N відліків</tspan><tspan x="385.0" dy="14.3">• МК все ще спить!</tspan></text>
<line x1="490.0" y1="110.0" x2="530.0" y2="110.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="510.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">INT pin</text>
<rect x="530.0" y="60.0" width="190.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="625.0" y="70.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">3. ПРОБУДЖЕННЯ МК</tspan><tspan x="625.0" dy="14.3">(Active Processing)</tspan><tspan x="625.0" dy="14.3"></tspan><tspan x="625.0" dy="14.3">• Сигнал на EXTI піні</tspan><tspan x="625.0" dy="14.3">• МК прокидається</tspan><tspan x="625.0" dy="14.3">• Зчитує джерело події</tspan><tspan x="625.0" dy="14.3">• Запускає радіо/алгоритм</tspan></text>
<line x1="625.0" y1="160.0" x2="625.0" y2="210.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="625.0" y1="210.0" x2="140.0" y2="210.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="140.0" y1="210.0" x2="140.0" y2="160.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Читання регістру статусу (Clear Latch) → Повернення у сон</text>
<rect x="40.0" y="235.0" width="680.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="283.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">ПОРІВНЯННЯ ТИПІВ ПЕРЕРИВАНЬ ДАВАЧІВ:</tspan><tspan x="380.0" dy="11.7"></tspan><tspan x="380.0" dy="11.7">• Data Ready (DRDY): Спрацьовує на КОЖЕН новий відлік АЦП. Застосування: потокова обробка, фільтрація, БПФ.</tspan><tspan x="380.0" dy="11.7">• Watermark / FIFO Full: Спрацьовує при накопиченні N відліків. Застосування: пакетна енергоефективна передача.</tspan><tspan x="380.0" dy="11.7">• Threshold / Any-Motion: Спрацьовує ЛИШЕ при перевищенні порогу прискорення/температури/тиску. МК спить днями, доки об'єкт не зрушить з місця.</tspan><tspan x="380.0" dy="11.7">• Free-Fall / Significant Motion: Спеціалізовані апаратні конфігурації для реєстрації падіння або кроків.</tspan></text>
</svg>