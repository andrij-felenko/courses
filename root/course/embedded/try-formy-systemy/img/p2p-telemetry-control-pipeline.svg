<rect x="75.4" y="122.3" width="129.1" height="35.3" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="140.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Джойстики керування</tspan><tspan x="140.0" dy="14.3">(50 Гц, RT-потік)</tspan></text>
<rect x="84.8" y="187.3" width="110.3" height="35.3" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="140.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Екран телеметрії</tspan><tspan x="140.0" dy="14.3">(MAVLink парсер)</tspan></text>
<rect x="69.2" y="252.3" width="141.7" height="35.3" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="140.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Відеодекодер H.264</tspan><tspan x="140.0" dy="14.3">(FPV дисплей / шолом)</tspan></text>
<rect x="52.4" y="338.5" width="175.3" height="33.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="140.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Пріоритетний мультиплексор</tspan><tspan x="140.0" dy="13.0">(QoS: Команди &gt; Дані &gt; Відео)</tspan></text>
<rect x="280.0" y="55.0" width="380.0" height="365.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="470.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">Прямий радіолінк (868/915 МГц / 2.4/5.8 ГГц)</text>
<line x1="240.0" y1="140.0" x2="700.0" y2="140.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="470.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Канал 1: Команди RC (Затримка &lt;15 мс, Loss-Tolerant)</text>
<line x1="700.0" y1="205.0" x2="240.0" y2="205.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Канал 2: Телеметрія борту (10–20 Гц, Heartbeat)</text>
