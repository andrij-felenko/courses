<text x="470.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle" font-weight="700">Канал 3: Цифрове відео (1–5 Мбіт/с, UDP стрим)</text>
<rect x="310.0" y="310.0" width="320.0" height="95.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Захист у ворожому ефірі (РЕБ / Завади):</text>
<text x="320.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start"><tspan x="320.0" dy="0.0">• FHSS: стрибки по 50–100 каналах за секунду</tspan><tspan x="320.0" dy="11.7">• FEC: випереджальне виправлення помилок (Reed-Solomon)</tspan><tspan x="320.0" dy="11.7">• Адаптивний бітрейт при падінні SNR</tspan></text>
<rect x="675.0" y="55.0" width="250.0" height="365.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="682.1" y="69.0" width="235.8" height="32.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="800.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Борт апарата (Автопілот / МК)</tspan></text>
<rect x="726.0" y="122.3" width="147.9" height="35.3" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="800.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Контролер польоту</tspan><tspan x="800.0" dy="14.3">(Мікшер моторів / PID)</tspan></text>
<rect x="735.4" y="187.3" width="129.1" height="35.3" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="800.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Сенсори та GNSS</tspan><tspan x="800.0" dy="14.3">(Генератор MAVLink)</tspan></text>
<rect x="744.8" y="252.3" width="110.3" height="35.3" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="800.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Камера + Енкодер</tspan><tspan x="800.0" dy="14.3">(RTP транслятор)</tspan></text>
<rect x="686.5" y="338.5" width="227.0" height="33.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="800.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Таймер Fail-Safe Watchdog</tspan><tspan x="800.0" dy="13.0">(Втрата лінка &gt; 1.5 с → Повернення)</tspan></text>
