<text x="95.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start"><tspan x="95.0" dy="0.0">Енергетичний підсумок: 1 передача на годину витрачає ~0.15 мА·год енергії.</tspan><tspan x="95.0" dy="15.4">Батарея Li-SOCl2 ємністю 8500 мА·год забезпечує: 8500 / (0.15 + 0.0025·24·30.5) ≈ 5.5 років автономної роботи.</tspan><tspan x="95.0" dy="15.4">Якщо модем не може знайти мережу і шукає вежу 2 хвилини — батарея виснажується у 20 разів швидше!</tspan></text>
