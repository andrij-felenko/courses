<rect x="68.5" y="90.2" width="183.0" height="39.6" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/><text x="160.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Локальний хаб / Шлюз</tspan><tspan x="160.0" dy="15.6">(Home Assistant / Matter)</tspan></text>
<rect x="39.8" y="167.3" width="110.3" height="35.3" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="95.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">Давач руху</tspan><tspan x="95.0" dy="14.3">(CR2032, Zigbee)</tspan></text>
<rect x="176.1" y="167.3" width="97.8" height="35.3" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="225.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Реле світла</tspan><tspan x="225.0" dy="14.3">(230V, Thread)</tspan></text>
