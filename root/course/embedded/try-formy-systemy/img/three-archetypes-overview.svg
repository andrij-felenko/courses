<text x="40.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start"><tspan x="40.0" dy="0.0">Характеристики:</tspan><tspan x="40.0" dy="15.4">• Масштаб: 10–100 вузлів / приміщення</tspan><tspan x="40.0" dy="15.4">• Живлення: Мережа 230 В + батарейки</tspan><tspan x="40.0" dy="15.4">• Затримка: &lt;50–100 мс (людський фактор)</tspan><tspan x="40.0" dy="15.4">• Топологія: Чарунка (Mesh) / Зірка</tspan><tspan x="40.0" dy="15.4">• Автономія: Повна робота без Інтернету</tspan><tspan x="40.0" dy="15.4">• Протоколи: Zigbee, Thread, Matter, Wi-Fi</tspan></text>
<rect x="320.0" y="20.0" width="280.0" height="440.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="347.7" y="32.5" width="224.6" height="35.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="460.0" y="55.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">2. Парк трекерів (WAN)</tspan></text>
<rect x="375.3" y="90.2" width="169.3" height="39.6" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="460.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Хмарний сервер / Брокер</tspan><tspan x="460.0" dy="15.6">(MQTT / CoAP / HTTPS)</tspan></text>
<rect x="330.4" y="167.3" width="129.1" height="35.3" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="395.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">Трекер #1 (Сон 99%)</tspan><tspan x="395.0" dy="14.3">NB-IoT / LTE-M</tspan></text>
<rect x="460.4" y="167.3" width="129.1" height="35.3" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="525.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">Трекер #N (Сон 99%)</tspan><tspan x="525.0" dy="14.3">LoRaWAN / GNSS</tspan></text>
