<text x="762.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">Телеметрія + Відео</text>
<rect x="630.0" y="240.0" width="260.0" height="205.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="640.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start"><tspan x="640.0" dy="0.0">Характеристики:</tspan><tspan x="640.0" dy="15.4">• Масштаб: Точно 2 вузли (двоточковий лінк)</tspan><tspan x="640.0" dy="15.4">• Живлення: Бортовий LiPo / акумулятор</tspan><tspan x="640.0" dy="15.4">• Затримка: Жорсткий реал-тайм (&lt;10–30 мс)</tspan><tspan x="640.0" dy="15.4">• Топологія: Прямий P2P без інфраструктури</tspan><tspan x="640.0" dy="15.4">• Безпека: Стійкість до РЕБ, FHSS, Fail-safe</tspan><tspan x="640.0" dy="15.4">• Протоколи: MAVLink, CRSF, ESP-NOW, RTP</tspan></text>
</svg>