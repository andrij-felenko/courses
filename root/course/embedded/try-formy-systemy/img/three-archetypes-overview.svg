<line x1="525.0" y1="160.0" x2="485.0" y2="130.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="330.0" y="240.0" width="260.0" height="205.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="340.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start"><tspan x="340.0" dy="0.0">Характеристики:</tspan><tspan x="340.0" dy="15.4">• Масштаб: 1 000 – 1 000 000+ вузлів</tspan><tspan x="340.0" dy="15.4">• Живлення: Li-SOCl2 батарея (3–10 років)</tspan><tspan x="340.0" dy="15.4">• Трафік: 99% Uplink (асиметричний)</tspan><tspan x="340.0" dy="15.4">• Топологія: Зірка через вежі оператора</tspan><tspan x="340.0" dy="15.4">• Буфер: Flash-пам'ять на випадок офлайну</tspan><tspan x="340.0" dy="15.4">• Протоколи: NB-IoT, LoRaWAN, CoAP, UDP</tspan></text>
<rect x="620.0" y="20.0" width="280.0" height="440.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="633.8" y="32.5" width="252.5" height="35.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="760.0" y="55.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">3. Апарат і станція (P2P)</tspan></text>
<rect x="661.4" y="110.2" width="87.2" height="39.6" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="705.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Пульт / GCS</tspan><tspan x="705.0" dy="15.6">(Станція)</tspan></text>
<rect x="764.5" y="110.2" width="100.9" height="39.6" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="815.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Апарат / БПЛА</tspan><tspan x="815.0" dy="15.6">(Борт)</tspan></text>
