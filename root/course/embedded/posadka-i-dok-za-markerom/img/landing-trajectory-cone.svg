<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="35.0" width="860.0" height="445.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="270.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профіль зниження та конус безпеки (Landing Cone)</text>
<polygon points="120,110 420,110 300,410 240,410" fill="#22c55e" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="270.0" y1="90.0" x2="270.0" y2="420.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="270.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Маркер (Z=0, X=0, Y=0)</text>
<rect x="225.0" y="410.0" width="90.0" height="10.0" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.0"/>
<rect x="245.0" y="412.0" width="50.0" height="6.0" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.0"/>
<path d="M 160,110 Q 230,160 250,220 T 268,340 L 270,410" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="160.0" cy="110.0" r="7.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<text x="125.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">h = 15 м</text>
<line x1="160.0" y1="110.0" x2="200.0" y2="125.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="250.0" cy="220.0" r="7.0" fill="#0284c7" stroke="#ffffff" stroke-width="2.0"/>
<text x="195.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="700">h = 6 м</text>
<circle cx="268.0" cy="340.0" r="6.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<text x="215.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">h = 1.5 м</text>
<line x1="270.0" y1="160.0" x2="395.0" y2="160.0" stroke="#16a34a" stroke-width="1.0"/>
<text x="335.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">r_max(h)</text>
<rect x="480.0" y="95.0" width="380.0" height="75.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="495.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="start" font-weight="700">Фаза 1: Захоплення (10–20 м)</text>
<text x="495.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Детектування великого маркера. Гасіння початкового</text>
<text x="495.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">дрейфу GNSS. Вхід у зону безпечного конуса.</text>
<rect x="480.0" y="183.0" width="380.0" height="75.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="495.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0284c7" text-anchor="start" font-weight="700">Фаза 2: Підхід та утримання (3–10 м)</text>
<text x="495.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Горизонтальне центрування над маркером.</text>
<text x="495.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Швидкість зниження vz = k·h. Компенсація вітру (I-term).</text>
<rect x="480.0" y="271.0" width="380.0" height="75.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="495.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="start" font-weight="700">Фаза 3: Прецизійне зниження (0.3–3 м)</text>
<text x="495.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Перемикання на вкладений маркер. Зниження vz до 0.2 м/с.</text>
<text x="495.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Точність утримання осі &lt; 3 см.</text>
<rect x="480.0" y="359.0" width="380.0" height="75.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="495.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="start" font-weight="700">Фаза 4: Док і фіксація (0–0.3 м)</text>
<text x="495.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Вимкнення оптики за 5 см. Механічне центрування конусами.</text>
<text x="495.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Замикання силових контактів, підтвердження заряду.</text>
</svg>