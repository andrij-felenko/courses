<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850.25 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850.25" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три ешелони надійності та захисту автономної системи</text>
<rect x="35.0" y="80.0" width="245.0" height="240.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<rect x="43.0" y="90.0" width="229.0" height="32.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="157.5" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="157.5" dy="0.0">АПАРАТНИЙ ЗАХИСТ (Hardware)</tspan></text>
<rect x="43.0" y="136.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="45.0" y="138.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="157.5" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="157.5" dy="0.0">Brown-out Reset (BOR): блок запису Flash при просіданні U</tspan></text>
<rect x="43.0" y="181.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="45.0" y="183.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="157.5" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="157.5" dy="0.0">Independent Watchdog (IWDG): апаратне скидання при зависанні</tspan></text>
<rect x="43.0" y="226.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="45.0" y="228.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="157.5" y="248.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="157.5" dy="0.0">TVS-діоди й ESD-фільтри на лініях сенсорів</tspan></text>
<rect x="43.0" y="271.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="45.0" y="273.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="157.5" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="157.5" dy="0.0">Вимикання живлення сенсорів через P-MOSFET ключ</tspan></text>
<rect x="305.0" y="80.0" width="245.0" height="240.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="313.0" y="90.0" width="229.0" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="427.5" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="427.5" dy="0.0">ПРОШИВКА ТА КРАЙ (Firmware &amp; Edge)</tspan></text>
<rect x="313.0" y="136.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="315.0" y="138.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="427.5" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="427.5" dy="0.0">Автомат станів (FSM) без блокувальних очікувань</tspan></text>
<rect x="313.0" y="181.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="315.0" y="183.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="427.5" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="427.5" dy="0.0">Кільцевий буфер у Flash (Store-and-Forward на 30 днів)</tspan></text>
<rect x="313.0" y="226.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="315.0" y="228.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="427.5" y="248.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="427.5" dy="0.0">Fail-Safe стан: збереження безпечних дефолтів при аварії</tspan></text>
<rect x="313.0" y="271.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="315.0" y="273.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="427.5" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="427.5" dy="0.0">Захист від шторму перезапусків (Boot loop backoff)</tspan></text>
<rect x="575.0" y="80.0" width="245.0" height="240.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<rect x="583.0" y="90.0" width="229.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="697.5" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="697.5" dy="0.0">МЕРЕЖА Й СЕРВЕР (Protocol &amp; Cloud)</tspan></text>
<rect x="583.0" y="136.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="585.0" y="138.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="697.5" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Ідемпотентність: унікальні UUID та порядкові номери пакетів</tspan></text>
<rect x="583.0" y="181.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="585.0" y="183.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="697.5" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Експоненційний відступ (Exponential Backoff) із джитером</tspan></text>
<rect x="583.0" y="226.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="585.0" y="228.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="697.5" y="248.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Last Will and Testament (LWT) для виявлення мертвого вузла</tspan></text>
<rect x="583.0" y="271.0" width="229.0" height="38.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="585.0" y="273.0" width="225.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="697.5" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Дедуплікація на рівні сервісу обробки (Service Layer)</tspan></text>
<rect x="35.0" y="335.0" width="785.0" height="32.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="420.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип ізоляції: збій на вищому рівні ніколи не повинен призводити до втрати даних на нижчому</text>
</svg>