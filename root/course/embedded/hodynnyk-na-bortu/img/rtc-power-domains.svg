<text x="300.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">VDD</text>
<line x1="380.0" y1="280.0" x2="380.0" y2="235.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="380.0" cy="298.0" r="14.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="380.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">BAT</text>
<text x="380.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">CR2032 / Іоністор</text>
<line x1="440.0" y1="175.0" x2="480.0" y2="175.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="460.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">V_RTC</text>
