<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Корекція часу: миттєвий крок проти плавного підтягування (Slew)</text>
<rect x="40.0" y="60.0" width="320.0" height="220.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.6"/>
<text x="200.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">МИTTЄВИЙ КРОК (STEP)</text>
<line x1="70.0" y1="220.0" x2="330.0" y2="220.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="70.0" y1="220.0" x2="70.0" y2="110.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="70.0" y1="200.0" x2="180.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="180.0" y1="150.0" x2="180.0" y2="180.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,3"/>
<line x1="180.0" y1="150.0" x2="180.0" y2="178.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="180.0" y1="180.0" x2="320.0" y2="130.0" stroke="#c0392b" stroke-width="2.2"/>
<text x="200.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Стрибок стрілок назад на Δt = -2 с</text>
<text x="200.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Розрив неперервності, гонитви, дублі логів</text>
<rect x="400.0" y="60.0" width="320.0" height="220.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/>
<text x="560.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПЛАВНЕ ПІДТЯГУВАННЯ (SLEW)</text>
<line x1="430.0" y1="220.0" x2="690.0" y2="220.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="430.0" y1="220.0" x2="430.0" y2="110.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="430.0" y1="200.0" x2="680.0" y2="120.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="680.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Еталон</text>
<path d="M 430 185 Q 540 160 670 123" fill="none" stroke="#27ae60" stroke-width="2.5"/>
<text x="560.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Зміна темпу ходу на ±500 ppm (±0.05%)</text>
<text x="560.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Час завжди монотонний, нуль стрибків</text>
<text x="380.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Slew поступово вибирає похибку фази за рахунок мікрозміни частоти генератора</text>
