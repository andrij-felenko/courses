<line x1="280.0" y1="265.0" x2="460.0" y2="265.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="370.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Δt = +6.0 с (гарантовано строго &gt; 0)</text>
<text x="380.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Стрибок настінного часу ламає таймери й дельти; монотонний час завжди неперервний</text>
