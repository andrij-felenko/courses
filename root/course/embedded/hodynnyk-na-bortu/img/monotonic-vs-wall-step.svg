<text x="370.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Δt = t_end - t_start = -4 с (&lt; 0 !)</text>
<text x="60.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Монотонний годинник (CLOCK_MONOTONIC / steady_clock)</text>
<line x1="60.0" y1="250.0" x2="680.0" y2="250.0" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="100.0" y1="245.0" x2="600.0" y2="175.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="280.0" y1="250.0" x2="280.0" y2="222.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="460.0" y1="250.0" x2="460.0" y2="195.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="2,2"/>
