<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди течуть власні міліватти блока на холостому ходу</text>
<text x="220.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">СТАРА архітектура: тече постійно</text>
<rect x="60.0" y="90.0" width="320.0" height="54.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="72.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Пусковий + розрядний резистор</text>
<text x="72.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">висить під 230 В, гріє завжди</text>
<rect x="60.0" y="152.0" width="320.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="72.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Живлення контролера</text>
<text x="72.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">схема керування споживає завжди</text>
<rect x="60.0" y="214.0" width="320.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="72.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Снабер</text>
<text x="72.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">гасить викид на кожному такті ключа</text>
<rect x="60.0" y="276.0" width="320.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="72.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Оптрон зворотного зв'язку</text>
<text x="72.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">світлодіод світить постійно</text>
<rect x="60.0" y="338.0" width="320.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="72.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Струм крізь Y-конденсатор</text>
<text x="72.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">тихо стікає на землю</text>
<line x1="396.0" y1="90.0" x2="396.0" y2="392.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="404.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">разом</text>
<text x="404.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">≈ 0.5 Вт</text>
<line x1="462.0" y1="220.0" x2="516.0" y2="220.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="490.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">burst-</text>
<text x="490.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">режим</text>
<text x="640.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">НОВА: burst + HV-пуск</text>
<rect x="540.0" y="90.0" width="200.0" height="56.0" rx="6" fill="#eefaf2" stroke="#27ae60" stroke-width="1.8"/>
<rect x="544.0" y="94.0" width="192.0" height="24.0" rx="6" fill="#eefaf2" stroke="none" stroke-width="0.0"/><text x="640.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Ключ мовчить між пачками</tspan></text>
<rect x="544.0" y="120.0" width="192.0" height="22.0" rx="6" fill="#eefaf2" stroke="none" stroke-width="0.0"/><text x="640.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="640.0" dy="0.0">снабер не гріє, контролер спить</tspan></text>
<rect x="540.0" y="156.0" width="200.0" height="56.0" rx="6" fill="#eefaf2" stroke="#27ae60" stroke-width="1.8"/>
<rect x="544.0" y="160.0" width="192.0" height="24.0" rx="6" fill="#eefaf2" stroke="none" stroke-width="0.0"/><text x="640.0" y="175.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">HV-пуск вимикається зовсім</tspan></text>
<rect x="544.0" y="186.0" width="192.0" height="22.0" rx="6" fill="#eefaf2" stroke="none" stroke-width="0.0"/><text x="640.0" y="200.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="640.0" dy="0.0">пусковий резистор не тече</tspan></text>
<rect x="540.0" y="222.0" width="200.0" height="56.0" rx="6" fill="#eefaf2" stroke="#27ae60" stroke-width="1.8"/>
<rect x="544.0" y="226.0" width="192.0" height="24.0" rx="6" fill="#eefaf2" stroke="none" stroke-width="0.0"/><text x="640.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Розряд X-cap — активний</tspan></text>
<rect x="544.0" y="252.0" width="192.0" height="22.0" rx="6" fill="#eefaf2" stroke="none" stroke-width="0.0"/><text x="640.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="640.0" dy="0.0">лише коли зникла мережа</tspan></text>
<rect x="540.0" y="288.0" width="200.0" height="56.0" rx="6" fill="#eefaf2" stroke="#27ae60" stroke-width="1.8"/>
<rect x="544.0" y="292.0" width="192.0" height="24.0" rx="6" fill="#eefaf2" stroke="none" stroke-width="0.0"/><text x="640.0" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Струмочки течуть частку часу</tspan></text>
<rect x="544.0" y="318.0" width="192.0" height="22.0" rx="6" fill="#eefaf2" stroke="none" stroke-width="0.0"/><text x="640.0" y="332.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="640.0" dy="0.0">середня потужність падає в рази</tspan></text>
<text x="640.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">разом ≈ десятки мВт</text>
</svg>