# Підсистеми вмикаються поіменно: усе, чого тут немає, у прошивку не потрапляє.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y

# C++ у Zephyr — це два прапорці. Винятки й RTTI лишаємо вимкненими:
# std::expected їх не потребує, а розмір образу від них помітно росте.
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30

CONFIG_MAIN_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=1024
