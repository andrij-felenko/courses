<text x="400.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">Наклад RTOS: кожен таск заморожує свій worst-case запас RAM, блокуючи пам'ять для інших</text>
