<text x="420.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Атомарні ACID-транзакції: одночасне оновлення Device Shadow, запис аудиту та черга вихідних команд без розподілених саг</text>
