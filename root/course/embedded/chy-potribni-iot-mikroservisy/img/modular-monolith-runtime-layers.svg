<text x="420.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Спільний адресний простір, нульове копіювання, міжпотоковий Lock-free Ring Buffer</text>
