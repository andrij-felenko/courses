<text x="670.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Поріг зчитування V_read</text>
<rect x="485.0" y="345.0" width="385.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="677.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наслідки маргінального заряду на кристалі:</text>
<text x="677.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. Зчитування повертає випадкові 0 або 1 залежно від T° та шуму</text>
<text x="677.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">2. Вбудований апаратний ECC фіксує невиправну помилку (UECC)</text>
<text x="677.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">3. Напівстертий блок блокує майбутні операції запису без Erase</text>
<text x="677.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">4. Пристрій перезапускається з пошкодженими метаданими</text>
<rect x="-61.7" y="469.8" width="1043.4" height="30.5" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="460.0" y="488.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Обрив живлення в процесі програмування Flash залишає комірки з неповним зарядом: порогова напруга потрапляє в зону невизначеності, перетворюючи сектор на випадкове сміття.</tspan></text>
