<text x="627.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">NAV</text>
<text x="765.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Канал блоковано логікою</text>
<text x="765.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(вузли чекають самі)</text>
<text x="520.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Потужність передавача: 1 мВт – 20 мВт (чіп MCU)</text>
<text x="520.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Робочий цикл (Duty Cycle): &lt; 0.1% (мікросекунди)</text>
<text x="520.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Смуга: 1 вузький канал протоколу</text>
<text x="520.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Помітність: маскується під штатний трафік</text>
<text x="520.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Енергія на 1 хв глушіння: ~0.005 – 0.05 Дж</text>
<rect x="223.1" y="416.2" width="493.7" height="27.5" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Енергетичний виграш атаки: у 1 000 – 100 000 разів менше споживання</tspan></text>
