<text x="247.5" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Шум РЕБ (P_jam &gt;&gt; P_sig)</text>
