<text x="75.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Потужність передавача: 10 Вт – 1000 Вт</text>
<text x="75.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Робочий цикл (Duty Cycle): 100% (безперервно)</text>
<text x="75.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Смуга: десятки / сотні МГц (розпорошення)</text>
<text x="75.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Помітність: миттєво пеленгується в ефірі</text>
<text x="75.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Енергія на 1 хв глушіння: ~6 000 – 60 000 Дж</text>
