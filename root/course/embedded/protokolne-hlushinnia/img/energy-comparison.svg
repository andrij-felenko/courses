<text x="692.5" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Протокольне глушіння (Smart / Protocol)</text>
<text x="692.5" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ціль: кінцевий автомат протоколу (MAC)</text>
