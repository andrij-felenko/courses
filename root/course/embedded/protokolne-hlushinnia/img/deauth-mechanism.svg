<line x1="450.0" y1="325.0" x2="220.0" y2="325.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="335.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Spoofed Deauth (без валідного AES-CMAC / BIP)</text>
<rect x="44.8" y="344.1" width="310.4" height="31.9" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="357.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Перевірка AES-CMAC (BIP / IGTK) -&gt; ПОМИЛКА!</tspan><tspan x="200.0" dy="12.3">Кадр підроблено -&gt; Ігнорування -&gt; Зв'язок збережено</tspan></text>
<line x1="200.0" y1="385.0" x2="200.0" y2="405.0" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="220.0" y1="405.0" x2="720.0" y2="405.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">SA Query Request / Response (захищена перевірка стану лінка)</text>
</svg>