<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">розрив надійності: лабораторний стіл проти реального поля</text>
<rect x="40.0" y="60.0" width="370.0" height="310.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="225.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ЛАБОРАТОРНИЙ СТІЛ (ШТУЧНИЙ КОКОН)</text>
<rect x="54.0" y="116.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="64.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Живлення:</text>
<text x="155.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">стабілізоване ДЖ, нульовий опір, чиста шина</text>
<rect x="54.0" y="158.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="64.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Температура:</text>
<text x="155.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">термостатовані +22 °C, відсутність градієнтів</text>
<rect x="54.0" y="200.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="64.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Вологість:</text>
<text x="155.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">сухе приміщення (40% RH), без конденсату</text>
<rect x="54.0" y="242.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="64.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Механіка:</text>
<text x="155.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">нерухомий стіл, нуль вібрацій та ударів</text>
<rect x="54.0" y="284.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="64.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Земля й лінія:</text>
<text x="155.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">короткі дроти (L ≈ 0), немає спільних струмів</text>
<rect x="54.0" y="326.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/>
<text x="64.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Результат:</text>
<text x="155.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">прототип працює «бездоганно», ризики сховані</text>
<rect x="450.0" y="60.0" width="370.0" height="310.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="635.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">РЕАЛЬНЕ ПОЛЕ (АГРЕСИВНЕ СЕРЕДОВИЩЕ)</text>
<rect x="464.0" y="116.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="474.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Брудна лінія:</text>
<text x="570.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">індуктивні викиди L·di/dt, просадки від моторів</text>
<rect x="464.0" y="158.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="474.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Клімат:</text>
<text x="570.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">перепади −40 °C..+85 °C, замерзання електролітів</text>
<rect x="464.0" y="200.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="474.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Точка роси:</text>
<text x="570.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">конденсація, солі, електрохімічні дендрити</text>
<rect x="464.0" y="242.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="474.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Вібрації:</text>
<text x="570.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">гармоніки 100–1000 Гц, втомні тріщини BGA</text>
<rect x="464.0" y="284.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="474.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Брудна земля:</text>
<text x="570.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Ground Bounce, зсув логічних порогів інтерфейсів</text>
<rect x="464.0" y="326.0" width="342.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="474.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Результат:</text>
<text x="570.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">миттєві brownout-скидання, корозія, відвал пайки</text>
<rect x="40.0" y="382.0" width="780.0" height="36.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/>
<text x="430.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">відмова в полі — це не «раптовий баг прошивки», а зіткнення схеми з неврахованою фізикою середовища</text>
</svg>