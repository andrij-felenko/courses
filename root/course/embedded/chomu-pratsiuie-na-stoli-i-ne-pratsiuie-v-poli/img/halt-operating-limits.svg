<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">методологія HALT: межі специфікації, роботи та руйнування</text>
<rect x="40.0" y="60.0" width="240.0" height="84.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="160.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">СПЕЦИФІКАЦІЯ (SPEC)</text>
<text x="160.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">−40 °C ... +85 °C / Vnom ± 5%</text>
<text x="160.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Гарантований виробником</text>
<text x="160.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">діапазон стабільної роботи.</text>
<rect x="310.0" y="60.0" width="240.0" height="84.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="430.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">РОБОЧІ МЕЖІ (LOL / UOL)</text>
<text x="430.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">−55 °C ... +110 °C</text>
<text x="430.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зворотний функціональний збій;</text>
<text x="430.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">відновлення після зняття стресу.</text>
<rect x="580.0" y="60.0" width="240.0" height="84.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="700.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">МЕЖІ РУЙНУВАННЯ (LDL / UDL)</text>
<text x="700.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">−70 °C ... +135 °C</text>
<text x="700.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Незворотне фізичне пошкодження:</text>
<text x="700.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">пробій кристала, відрив пайки.</text>
<line x1="40.0" y1="205.0" x2="820.0" y2="205.0" stroke="#333333" stroke-width="2.4"/>
<line x1="790.0" y1="205.0" x2="825.0" y2="205.0" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="825.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">Стрес (+T, Вібрація, Напруга)</text>
<rect x="100.0" y="189.0" width="660.0" height="32.0" rx="4" fill="#f0f3f6" stroke="#6b7280" stroke-width="1.2"/>
<rect x="200.0" y="189.0" width="460.0" height="32.0" rx="4" fill="#e5edec" stroke="#caa24a" stroke-width="1.4"/>
<rect x="300.0" y="189.0" width="260.0" height="32.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<circle cx="100.0" cy="205.0" r="5.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.6"/>
<line x1="100.0" y1="181.0" x2="100.0" y2="229.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="100.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">LDL</text>
<text x="100.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">−70 °C</text>
<circle cx="200.0" cy="205.0" r="5.0" fill="#caa24a" stroke="#ffffff" stroke-width="1.6"/>
<line x1="200.0" y1="181.0" x2="200.0" y2="229.0" stroke="#caa24a" stroke-width="1.5"/>
<text x="200.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">LOL</text>
<text x="200.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">−55 °C</text>
<circle cx="300.0" cy="205.0" r="5.0" fill="#27ae60" stroke="#ffffff" stroke-width="1.6"/>
<line x1="300.0" y1="181.0" x2="300.0" y2="229.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="300.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Spec Low</text>
<text x="300.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">−40 °C</text>
<circle cx="560.0" cy="205.0" r="5.0" fill="#27ae60" stroke="#ffffff" stroke-width="1.6"/>
<line x1="560.0" y1="181.0" x2="560.0" y2="229.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="560.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Spec High</text>
<text x="560.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">+85 °C</text>
<circle cx="660.0" cy="205.0" r="5.0" fill="#caa24a" stroke="#ffffff" stroke-width="1.6"/>
<line x1="660.0" y1="181.0" x2="660.0" y2="229.0" stroke="#caa24a" stroke-width="1.5"/>
<text x="660.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">UOL</text>
<text x="660.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">+110 °C</text>
<circle cx="760.0" cy="205.0" r="5.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.6"/>
<line x1="760.0" y1="181.0" x2="760.0" y2="229.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="760.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">UDL</text>
<text x="760.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">+135 °C</text>
<rect x="40.0" y="290.0" width="780.0" height="116.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="430.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціль HALT — виявити приховані слабкі місця конструкції та розширити робочий діапазон (Design Margin).</text>
<text x="430.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Чим більша відстань між Spec High (+85 °C) та UOL (+110 °C), тим надійніший пристрій у полі при накладанні завад.</text>
<text x="430.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">HASS (скринінг партії) застосовує короткий стрес (між Spec та LOL/UOL) для швидкого відсіювання браку пайки.</text>
<text x="430.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">HALT ламає прототип заради вдосконалення схеми; HASS перевіряє серію без витрати ресурсу компонентів.</text>
</svg>