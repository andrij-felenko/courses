<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">електрохімічна міграція: як волога та напруга вирощують коротке замикання</text>
<rect x="32.0" y="64.0" width="186.0" height="172.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="125.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">1. КОНДЕНСАЦІЯ ТА СОЛІ</text>
<text x="125.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Перепад температур спричиняє</text>
<text x="125.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">точку роси (Dew Point).</text>
<text x="125.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Плівка вологи розчиняє залишки</text>
<text x="125.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">флюсу та атмосферні солі.</text>
<rect x="238.0" y="64.0" width="186.0" height="172.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="331.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8a6d1a" text-anchor="middle" font-weight="700">2. АНОДНЕ РОЗЧИНЕННЯ</text>
<text x="331.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Під різницею потенціалів U &gt; 0</text>
<text x="331.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">метал анода іонізується:</text>
<text x="331.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Cu → Cu²⁺ + 2e⁻ (або Ag/Sn).</text>
<text x="331.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Іони переходять у розчин.</text>
<rect x="444.0" y="64.0" width="186.0" height="172.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="537.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">3. КАТОДНЕ ВІДНОВЛЕННЯ</text>
<text x="537.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Катіони металу мігрують до</text>
<text x="537.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">катода й відновлюються:</text>
<text x="537.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Cu²⁺ + 2e⁻ → Cu⁰.</text>
<text x="537.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Виростає голчастий дендрит.</text>
<rect x="650.0" y="64.0" width="186.0" height="172.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="743.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle" font-weight="700">4. МІКРОШУНТ / ПРОБІЙ</text>
<text x="743.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Дендрит дотикається анода.</text>
<text x="743.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Виникає паразитний струм,</text>
<text x="743.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">витік на вході АЦП або повне</text>
<text x="743.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">коротке замикання живлення.</text>
<line x1="222.0" y1="150.0" x2="234.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="428.0" y1="150.0" x2="440.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="634.0" y1="150.0" x2="646.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="32.0" y="252.0" width="796.0" height="168.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="430.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікроструктура зазору 0.5 мм між пінами QFN під плівкою конденсату</text>
<rect x="80.0" y="300.0" width="120.0" height="70.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="140.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700">АНОД (+Vcc)</text>
<text x="140.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Cu → Cu²⁺ + 2e⁻</text>
<rect x="660.0" y="300.0" width="120.0" height="70.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="720.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">КАТОД (GND)</text>
<text x="720.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Cu²⁺ + 2e⁻ → Cu⁰</text>
<rect x="204.0" y="314.0" width="452.0" height="42.0" rx="4" fill="#e2edf8" stroke="#2457d6" stroke-width="1.2"/>
<text x="430.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">водна плівка конденсату + іони електроліту (Cl⁻, SO₄²⁻, залишки флюсу)</text>
<line x1="660.0" y1="336.0" x2="580.0" y2="330.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="580.0" y1="330.0" x2="520.0" y2="342.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="520.0" y1="342.0" x2="430.0" y2="332.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="430.0" y1="332.0" x2="320.0" y2="338.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="320.0" y1="338.0" x2="204.0" y2="334.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="430.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">← ріст металевих кристалів (дендритів) назустріч аноду ←</text>
<text x="430.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">захист: безвідмивний флюс, очищення в УЗ-ванні та лакування (Conformal Coating)</text>
</svg>