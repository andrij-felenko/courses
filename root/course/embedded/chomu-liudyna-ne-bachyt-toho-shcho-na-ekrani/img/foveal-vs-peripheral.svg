<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 540.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="540.5" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія зорового поля людини та дискретна природа саккад</text>
<rect x="35.0" y="60.0" width="470.0" height="430.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="270.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">А. ЗОНИ ЗОРОВОГО СПРИЙНЯТТЯ НА ЕКРАНІ</text>
<rect x="70.0" y="128.0" width="400.0" height="24.0" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="270.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Площина операторського монітора</text>
<circle cx="270.0" cy="260.0" r="14.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="270.0" cy="260.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="270.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Око спостерігача (d ≈ 60 см)</text>
<line x1="270.0" y1="246.0" x2="85.0" y2="152.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="270.0" y1="246.0" x2="455.0" y2="152.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
