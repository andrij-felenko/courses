<line x1="270.0" y1="246.0" x2="340.0" y2="152.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4,2"/>
<line x1="270.0" y1="246.0" x2="248.0" y2="152.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="270.0" y1="246.0" x2="292.0" y2="152.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="248.0" y="130.0" width="44.0" height="20.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="270.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2°</text>
<rect x="50.0" y="304.1" width="440.0" height="41.9" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Фовеальний зір (1°–2° поля зору, діаметр ≈ 2 см на моніторі):</tspan><tspan x="270.0" dy="12.3">100% гострота, щільні колбочки. ЄДИНА зона для читання цифр і тексту.</tspan></text>
<rect x="50.0" y="375.2" width="440.0" height="29.5" rx="6" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="393.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Парафовеа (2°–5°): розпізнавання контурів слів та грубих піктограм.</tspan></text>
<rect x="50.0" y="429.1" width="440.0" height="41.9" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="270.0" y="447.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Периферичний зір (&gt; 10°): низька гострота, відсутність розрізнення тексту.</tspan><tspan x="270.0" dy="12.3">Палички реагують ВИКЛЮЧНО на швидкий рух, спалах та мерехтіння.</tspan></text>
<rect x="535.0" y="60.0" width="470.0" height="430.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="770.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Б. ЧАСОВИЙ ЦИКЛ: ФІКСАЦІЇ ТА САККАДИЧНА СЛІПОТА</text>
<line x1="565.0" y1="135.0" x2="975.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="965.0" y1="135.0" x2="985.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="983.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Час t</text>
<rect x="570.0" y="155.0" width="145.0" height="75.0" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="642.5" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Фіксація 1 (Прилад)</text>
<text x="642.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">T_fix ≈ 200–350 мс</text>
<text x="642.5" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Зчитування даних</text>
<rect x="725.0" y="155.0" width="70.0" height="75.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="760.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Саккада</text>
<text x="760.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">30–80 мс</text>
<text x="760.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">СЛІПОТА!</text>
<rect x="805.0" y="155.0" width="145.0" height="75.0" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="877.5" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Фіксація 2 (Карта)</text>
<text x="877.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">T_fix ≈ 200–350 мс</text>
<text x="877.5" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Розпізнавання образу</text>
<line x1="760.0" y1="240.0" x2="760.0" y2="265.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="306.7" width="440.0" height="66.6" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="324.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Саккадичне придушення (Saccadic Suppression):</tspan><tspan x="770.0" dy="12.3">Під час швидкого руху очного яблука (до 900°/с) мозок</tspan><tspan x="770.0" dy="12.3">повністю блокує зоровий потік, щоб уникнути розмиття.</tspan><tspan x="770.0" dy="12.3">До 10–15% часу сканування екрана людина функціонально сліпа.</tspan></text>
<rect x="550.0" y="422.9" width="440.0" height="54.2" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="770.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Інженерний наслідок:</tspan><tspan x="770.0" dy="12.3">Статичний червоний напис на периферії НЕ приверне погляд,</tspan><tspan x="770.0" dy="12.3">бо палички не бачать кольору й дрібних деталей без спалаху/руху.</tspan></text>
<rect x="114.4" y="489.5" width="811.1" height="31.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="508.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Людський зір — це вузький промінь високої чіткості (2°), що перестрибує по екрану дискретними стрибками (саккадами).</tspan></text>
</svg>