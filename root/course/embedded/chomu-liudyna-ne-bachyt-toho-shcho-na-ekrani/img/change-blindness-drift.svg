<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сліпота до змін: чому мозок помічає стрибок і пропускає плавний витік</text>
<rect x="40.0" y="65.0" width="440.0" height="350.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="260.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">А. СТРИБКОПОДІБНА ЗМІНА (РІЗКИЙ КРАХ)</text>
<line x1="85.0" y1="205.0" x2="445.0" y2="205.0" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="85.0" y1="235.0" x2="85.0" y2="135.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="77.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Тиск P</text>
<text x="445.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Час t</text>
<line x1="85.0" y1="150.0" x2="229.0" y2="150.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="229.0" y1="150.0" x2="247.0" y2="200.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="247.0" y1="200.0" x2="445.0" y2="200.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="236.2" y1="195.0" x2="236.2" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="236.2" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Висока похідна dP/dt!</text>
<rect x="60.0" y="286.7" width="400.0" height="66.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="304.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Висока просторово-часова похідна (dI/dt &gt;&gt; threshold):</tspan><tspan x="260.0" dy="12.3">• Збуджує магноцелюлярний тракт зорової системи;</tspan><tspan x="260.0" dy="12.3">• Викликає мимовільне захоплення уваги (Bottom-Up Capture);</tspan><tspan x="260.0" dy="12.3">• Погляд рефлекторно переводиться саккадою за 150–200 мс.</tspan></text>
<rect x="520.0" y="65.0" width="440.0" height="350.0" rx="8" fill="#fffbfb" stroke="#c0392b" stroke-width="1.5"/>
<text x="740.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Б. ПЛАВНИЙ ДРЕЙФ (CHANGE BLINDNESS)</text>
<line x1="565.0" y1="205.0" x2="925.0" y2="205.0" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="565.0" y1="235.0" x2="565.0" y2="135.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="557.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Тиск P</text>
<text x="925.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Час t (хвилини)</text>
<line x1="565.0" y1="150.0" x2="925.0" y2="200.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="745.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Похідна dP/dt ≈ 0 (нижче порогу)</text>
<rect x="540.0" y="286.7" width="400.0" height="66.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="304.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Швидкість зміни нижча за оптичний поріг руху:</tspan><tspan x="740.0" dy="12.3">• Оптичний потік відсутній — рецептори сітківки мовчать;</tspan><tspan x="740.0" dy="12.3">• Виявлення можливе ЛИШЕ через свідомий аудит (Top-Down Search);</tspan><tspan x="740.0" dy="12.3">• Оператор помічає аварію лише при повному знеструмленні/клині.</tspan></text>
<rect x="111.5" y="434.5" width="777.0" height="31.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="453.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Захист від Change Blindness у софті: розрахунок похідних (Rate of Change) та підсвічування небезпечного тренду.</tspan></text>
</svg>