<text x="270.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">(Супутники: 4)</text>
<text x="270.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ТОЧКА КОГНІТИВНОГО «ЗАЛИПАННЯ»</text>
<text x="270.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">Оператор 40 секунд намагається розібратися з якістю GPS</text>
