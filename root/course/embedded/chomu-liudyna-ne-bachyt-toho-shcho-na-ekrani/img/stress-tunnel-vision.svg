<rect x="530.0" y="65.0" width="430.0" height="350.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="745.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">МЕХАНІЗМ COGNITIVE TUNNELING</text>
<rect x="550.0" y="109.1" width="390.0" height="41.9" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="745.0" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">1. Раптова відмова або критичний збій на борту</tspan><tspan x="745.0" dy="12.3">Викид адреналіну/кортизолу, різке зростання ЧСС (&gt;140 уд/хв).</tspan></text>
<line x1="745.0" y1="152.0" x2="745.0" y2="175.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="550.0" y="167.9" width="390.0" height="54.2" rx="6" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.5"/><text x="745.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">2. Перевантаження робочої пам'яті (Working Memory)</tspan><tspan x="745.0" dy="12.3">Префронтальна кора відсікає 95% вхідних стимулів як «шум»,</tspan><tspan x="745.0" dy="12.3">звужуючи увагу до одного єдиного параметра.</tspan></text>
<line x1="745.0" y1="220.0" x2="745.0" y2="243.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="550.0" y="237.9" width="390.0" height="54.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="745.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">3. Неуважна сліпота та глухота (Inattentional Blindness)</tspan><tspan x="745.0" dy="12.3">Очі фізично ковзають по червоних банерах і вуха чують зумер,</tspan><tspan x="745.0" dy="12.3">але мозок НЕ інтерпретує сигнал: свідомість замкнена на GPS.</tspan></text>
<rect x="101.3" y="459.5" width="797.5" height="31.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="478.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">У стані стресу людина втрачає здатність до оглядового сканування: другорядне завдання поглинає 100% ресурсу уваги.</tspan></text>
</svg>