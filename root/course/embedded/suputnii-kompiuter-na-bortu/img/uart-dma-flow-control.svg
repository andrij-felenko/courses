<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="30.0" width="280.0" height="360.0" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
<text x="160.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">ПОЛЬОТНИЙ КОНТРОЛЕР</text>
<text x="160.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">USART1 (з апаратним DMA)</text>
<rect x="35.0" y="105.0" width="250.0" height="50.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
<text x="160.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий буфер TX DMA</text>
<text x="160.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Пряма вичитка з SRAM без навантаження CPU</text>
<rect x="35.0" y="175.0" width="250.0" height="50.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
<text x="160.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий буфер RX DMA</text>
<text x="160.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Прийом пакетів по IDLE-перериванню</text>
<rect x="35.0" y="245.0" width="250.0" height="65.0" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
<text x="160.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">Логіка Flow Control (Апаратно)</text>
<text x="160.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">CTS перевіряється перед кожним байтом</text>
<text x="160.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">RTS піднімається при заповненні FIFO</text>
<text x="160.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">Рівні напруг: 3.3V CMOS</text>
<text x="160.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Швидкість: 921 600 … 3 000 000 бод</text>
<rect x="520.0" y="30.0" width="280.0" height="360.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="660.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">СУПУТНІЙ КОМП'ЮТЕР (Linux)</text>
<text x="660.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">/dev/ttyAMA0 (termios + CRTSCTS)</text>
<rect x="535.0" y="105.0" width="250.0" height="50.0" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
