<rect x="365.0" y="278.0" width="90.0" height="22.0" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.0"/>
<text x="410.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="middle" font-weight="700">GND (Спільна)</text>
