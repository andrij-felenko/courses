<text x="660.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Користувацький процес (Bridge)</text>
<text x="660.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">C++ / Python розбір MAVLink v2</text>
<rect x="535.0" y="245.0" width="250.0" height="65.0" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
<text x="660.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Захист від CPU Jitter</text>
<text x="660.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Якщо процес заблокований CFS/Swap,</text>
<text x="660.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">SoC виставляє RTS=HIGH (призупиняє FC)</text>
<text x="660.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Рівні напруг: 3.3V LVTTL</text>
<text x="660.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вимкнено софтовий XON/XOFF</text>
