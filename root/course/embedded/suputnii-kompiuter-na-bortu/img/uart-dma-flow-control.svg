<rect x="365.0" y="145.0" width="90.0" height="22.0" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.0"/>
<text x="410.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="700">RX ← TX (Уставки)</text>
