<text x="420.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">ЗОЛОТЕ ПРАВИЛО БЕЗПЕКИ АВІОНІКИ: «COMPANION IS UNTRUSTED»</text>
<text x="420.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Польотний контролер ставиться до Linux як до джерела зовнішніх порад, а не до життєво необхідного вузла.</text>
<text x="420.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-style="italic">Будь-яке зависання, Kernel Panic чи перевантаження Linux не призводить до втрати стійкості та падіння дрона.</text>
