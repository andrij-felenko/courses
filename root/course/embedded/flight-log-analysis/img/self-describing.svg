<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Лог сам собі словник: креслення йде попереду даних</text>
<rect x="70.0" y="110.0" width="360.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="145.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">FMT  ATT</tspan><tspan x="250.0" dy="16.9">поля: TimeUS, Roll, Pitch, Yaw</tspan><tspan x="250.0" dy="16.9">типи:  Q      f     f     f</tspan></text>
<text x="250.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">КРЕСЛЕННЯ (один раз)</text>
<line x1="430.0" y1="158.0" x2="510.0" y2="158.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">за ним</text>
<rect x="510.0" y="110.0" width="360.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">ATT  17240  -1.2  0.7  38.4</tspan></text>
<rect x="510.0" y="150.0" width="360.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">ATT  17265  -1.2  0.7  38.4</tspan></text>
<rect x="510.0" y="190.0" width="360.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">ATT  17290  -1.2  0.7  38.4</tspan></text>
<text x="690.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ДАНІ (потік, тисячі рядків)</text>
<line x1="70.0" y1="250.0" x2="870.0" y2="250.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="211.8" y="274.2" width="516.5" height="51.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="470.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Прочитав FMT ATT — знаєш, що кожен рядок ATT це час, крен, тангаж, курс.</tspan><tspan x="470.0" dy="15.6">Тому програма розбирає незнайомий лог сама, не питаючи, які там поля.</tspan></text>
<text x="470.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Telemetry .tlog натомість — це потік MAVLink-повідомлень; його «словник» — спільний опис протоколу.</text>
</svg>