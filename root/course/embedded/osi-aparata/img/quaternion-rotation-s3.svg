<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="380.0" height="350.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="210.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема Ейлера та Кватерніон</text>
<circle cx="210.0" cy="165.0" r="80.0" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<ellipse cx="210.0" cy="165.0" rx="80.0" ry="25.0" fill="none" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="210.0" y1="165.0" x2="270.0" y2="100.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="280.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Одинична вісь u = [ux, uy, uz]</text>
<ellipse cx="235.0" cy="137.0" rx="28.0" ry="14.0" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<line x1="255.0" y1="142.0" x2="258.0" y2="135.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="268.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Кут θ</text>
<line x1="210.0" y1="165.0" x2="150.0" y2="185.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="140.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">Вектор v</text>
<line x1="210.0" y1="165.0" x2="185.0" y2="235.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="185.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Повернутий v'</text>
<rect x="35.0" y="275.0" width="350.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="210.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Одиничний кватерніон орієнтації:</text>
<text x="210.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">q = [cos(θ/2),  u · sin(θ/2)]</text>
<text x="210.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Умова норми: ||q||² = w² + x² + y² + z² = 1</text>
<rect x="420.0" y="20.0" width="480.0" height="350.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="660.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння способів представлення орієнтації</text>
<rect x="435.0" y="75.0" width="450.0" height="30.0" rx="4" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
<text x="500.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивість</text>
<text x="600.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кути Ейлера</text>
<text x="710.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця DCM (3×3)</text>
<text x="830.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кватерніон (4D)</text>
<line x1="435.0" y1="138.0" x2="885.0" y2="138.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="445.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Пам'ять (floats)</text>
<text x="600.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3</text>
<text x="710.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">9</text>
<text x="830.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">4 (ідеально)</text>
<line x1="435.0" y1="173.0" x2="885.0" y2="173.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="445.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Сингулярності</text>
<text x="600.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Є (Gimbal Lock)</text>
<text x="710.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Немає</text>
<text x="830.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Немає (гладке S³)</text>
<line x1="435.0" y1="208.0" x2="885.0" y2="208.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="445.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Поворот вектора</text>
<text x="600.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Через DCM</text>
<text x="710.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">9 множень</text>
<text x="830.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">15 множень (швидко)</text>
<line x1="435.0" y1="243.0" x2="885.0" y2="243.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="438.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Кінематика (інтеграл)</text>
<text x="600.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">sin/cos (повільно)</text>
<text x="710.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">R_dot = R · [ω×]</text>
<text x="830.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">q_dot = 0.5·q ⊗ ω</text>
<line x1="435.0" y1="278.0" x2="885.0" y2="278.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="445.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Ренормалізація</text>
<text x="600.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">wrap [-π, π]</text>
<text x="710.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Грам-Шмідт (важко)</text>
<text x="830.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">q / ||q|| (дуже легко)</text>
<rect x="435.0" y="305.0" width="450.0" height="50.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="660.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Висновок: Кватерніони — безальтернативний обчислювальний</text>
<text x="660.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">рушій оцінки орієнтації для мікроконтролерів (IMU/AHRS).</text>
</svg>