<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 936.8 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="936.8" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="430.0" height="350.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="235.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Нормальний стан: Pitch = 0° (3 ступені вільності)</text>
<ellipse cx="235.0" cy="180.0" rx="120.0" ry="95.0" fill="none" stroke="#c0392b" stroke-width="3.0"/>
<line x1="235.0" y1="65.0" x2="235.0" y2="295.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="235.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Вісь Рискання (Yaw, Z)</text>
<ellipse cx="235.0" cy="180.0" rx="95.0" ry="75.0" fill="none" stroke="#27ae60" stroke-width="3.0"/>
<line x1="125.0" y1="180.0" x2="345.0" y2="180.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="348.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Вісь Тангажу (Pitch, Y)</text>
<ellipse cx="235.0" cy="180.0" rx="70.0" ry="50.0" fill="none" stroke="#2457d6" stroke-width="3.0"/>
<line x1="175.0" y1="135.0" x2="295.0" y2="225.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="300.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Вісь Крену (Roll, X)</text>
<text x="235.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усі 3 осі взаємно ортогональні.</text>
<text x="235.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Обертання навколо будь-якої осі є незалежним.</text>
<rect x="470.0" y="20.0" width="430.0" height="350.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="685.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Gimbal Lock: Pitch = +90° (Втрата 1 ступеня)</text>
<ellipse cx="685.0" cy="180.0" rx="120.0" ry="95.0" fill="none" stroke="#c0392b" stroke-width="3.0"/>
<line x1="685.0" y1="65.0" x2="685.0" y2="295.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<ellipse cx="685.0" cy="180.0" rx="95.0" ry="25.0" fill="none" stroke="#27ae60" stroke-width="3.0"/>
<line x1="575.0" y1="180.0" x2="795.0" y2="180.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="798.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Pitch повернуто на 90°</text>
<ellipse cx="685.0" cy="180.0" rx="70.0" ry="95.0" fill="none" stroke="#2457d6" stroke-width="3.0"/>
<line x1="685.0" y1="75.0" x2="685.0" y2="285.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="510.0" y="90.0" width="350.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="685.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вісь Крену (Roll) лягла на вісь Рискання (Yaw)!</text>
<text x="685.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Неможливо розрізнити крен і курс: (ψ − φ) = const</text>
<text x="685.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Математична сингулярність: ділення на cos(90°) = 0</text>
<text x="685.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кінематичні похідні кутів Ейлера прямують до нескінченності!</text>
</svg>