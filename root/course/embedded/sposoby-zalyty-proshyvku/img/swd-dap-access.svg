<text x="687.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Регістри CR/SR + NOR Flash</text>
<line x1="550.0" y1="307.0" x2="585.0" y2="307.0" stroke="#d35400" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="102.8" y="377.4" width="634.5" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="396.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">DAP працює незалежно від процесорного ядра: зонд через AHB-AP може читати й писати SRAM,</tspan><tspan x="420.0" dy="14.3">керувати контролером Flash і завантажувати швидкісний RAM-стаб, навіть коли ядро спить чи зависло.</tspan></text>
