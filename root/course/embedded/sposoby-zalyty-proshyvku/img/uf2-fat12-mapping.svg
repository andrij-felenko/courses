<text x="165.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Звірка Magic чисел та</text>
<text x="165.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">відповідності FamilyID</text>
<line x1="275.0" y1="347.0" x2="305.0" y2="347.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
