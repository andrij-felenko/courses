<text x="675.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Фінал і перезапуск</text>
<text x="675.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Отримано BlockNo = NumBlocks;</text>
<text x="675.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">виклик NVIC_SystemReset()</text>
<rect x="102.8" y="417.4" width="634.5" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="436.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Завантажувачу не потрібно парсити складну файлову систему: кожен 512-байтний сектор UF2</tspan><tspan x="420.0" dy="14.3">самодостатній і несе в собі точну адресу Flash, перетворюючи drag-and-drop на посторінковий запис.</tspan></text>
