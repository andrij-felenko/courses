<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол роботи заводського ROM-завантажувача через UART</text>
<rect x="90.0" y="55.0" width="140.0" height="36.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="160.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Хост (stm32flash)</text>
<rect x="610.0" y="55.0" width="140.0" height="36.0" rx="4" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/>
<text x="680.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">МК (ROM Bootloader)</text>
<line x1="160.0" y1="91.0" x2="160.0" y2="435.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="680.0" y1="91.0" x2="680.0" y2="435.0" stroke="#d35400" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="170.0" y1="120.0" x2="670.0" y2="120.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">BOOT0 = 1 + Імпульс NRST</text>
<text x="420.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Активація системної пам'яті (ROM) при скиданні</text>
<line x1="170.0" y1="165.0" x2="670.0" y2="165.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Байт 0x7F (Синхронізація)</text>
<text x="420.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Автокалібрування швидкості UART за тривалістю біта</text>
<line x1="670.0" y1="195.0" x2="170.0" y2="195.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">0x79 (ACK)</text>
<text x="420.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Завантажувач зафіксував Baud Rate і готовий</text>
<line x1="170.0" y1="240.0" x2="670.0" y2="240.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Команда 0x44 + 0xBB (Extended Erase)</text>
<text x="420.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Запит на стирання Flash пам'яті перед записом</text>
<line x1="670.0" y1="270.0" x2="170.0" y2="270.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">0x79 (ACK) → Масове або посторінкове стирання</text>
<text x="420.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Контролер Flash очищує сектори у стан 0xFF</text>
<line x1="170.0" y1="315.0" x2="670.0" y2="315.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Команда 0x31 + 0xCE (Write Memory) + Адреса + XOR</text>
<text x="420.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Передача цільової адреси Flash (напр. 0x08000000)</text>
<line x1="670.0" y1="345.0" x2="170.0" y2="345.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">0x79 (ACK) — адреса коректна</text>
<text x="420.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Завантажувач очікує блок даних</text>
<line x1="170.0" y1="385.0" x2="670.0" y2="385.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Кількість N (256 байт) + Данні образу + Контрольна сума</text>
<text x="420.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Посторінкова передача двійкового образу прошивки</text>
<line x1="670.0" y1="415.0" x2="170.0" y2="415.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">0x79 (ACK) — сектор успішно прошито</text>
<text x="420.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Запис завершено; перехід до наступного блоку або Go 0x21</text>
<rect x="105.9" y="457.4" width="628.2" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="476.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Протокол UART ROM гарантує надійність: кожен байт команди дублюється інверсним (C XOR ~C = 0xFF),</tspan><tspan x="420.0" dy="14.3">а швидкість визначається за першим стартовим бітом без потреби у високоточному кварці.</tspan></text>
</svg>