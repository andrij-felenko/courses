<text x="638.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">DIY, освіта, Drag</text>
<rect x="96.5" y="407.4" width="647.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Кожен спосіб відповідає різним вимогам: прямий апаратний контроль, незнищенний заводський порятунок,</tspan><tspan x="420.0" dy="14.3">оновлення без програматора за стандартом USB або користувацьке перетягування файлу без софту.</tspan></text>
