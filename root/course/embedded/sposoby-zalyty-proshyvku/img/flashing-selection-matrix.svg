<rect x="98.8" y="407.9" width="642.4" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="426.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Універсального способу не існує: SWD незамінний на столі розробника й тестовому джизі,</tspan><tspan x="420.0" dy="13.7">ROM UART рятує при повній аварії, DFU оновлює серійний виріб, а UF2 усуває бар'єр входу для користувача.</tspan></text>
