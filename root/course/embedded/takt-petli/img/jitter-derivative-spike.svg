<text x="75.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Диференціатор: D[k] = Kd · (e[k] − e[k−1]) / dt_ном. При затримці виклику реальна зміна Δe зростає, даючи хибний сплеск сили.</text>
<text x="75.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Інтегратор: I[k] = I[k−1] + Ki · e[k] · dt_ном. Недооцінка або переоцінка реального часу призводить до низькочастотного дрейфу.</text>
