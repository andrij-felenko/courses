<text x="262.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Швидкість Vx</text>
<text x="130.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Хитання ω_y</text>
<path d="M 170 58 A 20 20 0 0 1 170 92" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<line x1="172.0" y1="90.0" x2="170.0" y2="94.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="467.3" y="97.4" width="235.5" height="235.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="585.0" y="116.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Математика оптичного потоку</tspan><tspan x="585.0" dy="13.7">───────────────────────────</tspan><tspan x="585.0" dy="13.7">1. Зсув пікселів у кадрі (Δu):</tspan><tspan x="585.0" dy="13.7">   Δu = (Vx/h)·f·Δt + ω_y·f·Δt</tspan><tspan x="585.0" dy="13.7">   де f — фокусна відстань сенсора,</tspan><tspan x="585.0" dy="13.7">   h — поточна висота від ToF.</tspan><tspan x="585.0" dy="13.7"></tspan><tspan x="585.0" dy="13.7">2. Деротація (віднімання обертання):</tspan><tspan x="585.0" dy="13.7">   Δu_чистий = Δu - ω_y · f · Δt</tspan><tspan x="585.0" dy="13.7"></tspan><tspan x="585.0" dy="13.7">3. Відновлена лінійна швидкість:</tspan><tspan x="585.0" dy="13.7">   Vx = (Δu_чистий / f) · (h / Δt)</tspan><tspan x="585.0" dy="13.7"></tspan><tspan x="585.0" dy="13.7">Висновок: знаючи висоту h та</tspan><tspan x="585.0" dy="13.7">кутову швидкість ω_y, потік дає</tspan><tspan x="585.0" dy="13.7">чесну лінійну швидкість апарата.</tspan></text>
</svg>