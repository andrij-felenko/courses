<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Керування потужністю: шпаруватість = середня потужність</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">повна потужність частку часу → середня потужність = шпаруватість × повна (ЛІНІЙНО)</text>
<line x1="110.0" y1="260.0" x2="470.0" y2="260.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="110.0" y1="260.0" x2="110.0" y2="100.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="102.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">сер. потужн.</text>
<text x="470.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">шпаруватість</text>
<line x1="110.0" y1="260.0" x2="450.0" y2="110.0" stroke="#1f8a3b" stroke-width="2.6" stroke-linecap="round"/>
<text x="360.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">лінійно!</text>
<text x="250.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">0% → 0 потужн.;  50% → половина;  100% → повна</text>
<rect x="520.0" y="100.0" width="390.0" height="160.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="715.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому це добре</text>
<text x="538.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• потужність лінійна зі шпаруватістю</text>
<text x="538.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• майже без втрат (ключ, не резистор)</text>
<text x="538.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• для НИЗЬКОВОЛЬТНОГО: транзистор + ШІМ</text>
<text x="538.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• для МЕРЕЖІ ~220 В: твердотільне реле</text>
<text x="538.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(повільна ШІМ цілими півперіодами)</text>
<text x="480.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Нагрівач, лампа, ТЕН — усе плавно й ощадно, бо транзистор повністю відкритий чи закритий.</text>
</svg>
