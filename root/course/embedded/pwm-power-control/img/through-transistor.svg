<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Універсальний патерн: усе сильніше за LED — через ключ</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ніжка ШІМ керує затвором, транзистор комутує великий струм навантаження (§22.6)</text>
<rect x="70.0" y="150.0" width="120.0" height="50.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="130.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ніжка ШІМ</text>
<text x="130.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(мА — крихта)</text>
<line x1="190.0" y1="175.0" x2="270.0" y2="175.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="230.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a6a14" text-anchor="middle" font-weight="normal" font-style="normal">затвор</text>
<rect x="270.0" y="145.0" width="110.0" height="70.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="325.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">транзистор-ключ</text>
<line x1="325.0" y1="145.0" x2="325.0" y2="110.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="280.0" y="70.0" width="90.0" height="40.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="325.0" y="95.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">навантаження</text>
<line x1="325.0" y1="70.0" x2="325.0" y2="50.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="240.0" y1="50.0" x2="420.0" y2="50.0" stroke="#c0271e" stroke-width="2.2" stroke-linecap="round"/>
