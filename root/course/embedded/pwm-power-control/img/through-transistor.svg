<line x1="400.0" y1="90.0" x2="400.0" y2="50.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="390,86 410,86 400,70" fill="#e9eefb" stroke="#1b1b1b" stroke-width="1.6"/>
<line x1="390.0" y1="70.0" x2="410.0" y2="70.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="325.0" y1="90.0" x2="400.0" y2="90.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="420.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">флайбек (для індуктивних)</text>
<line x1="325.0" y1="215.0" x2="325.0" y2="245.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="130.0" y1="245.0" x2="420.0" y2="245.0" stroke="#1f47b5" stroke-width="2.2" stroke-linecap="round"/>
<text x="130.0" y="265.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">GND (спільна!)</text>
<line x1="130.0" y1="200.0" x2="130.0" y2="245.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="560.0" y="150.0" width="350.0" height="130.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="735.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один патерн на все:</text>
<text x="578.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• світлодіодна стрічка, мотор,</text>
<text x="590.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">нагрівач, помпа, соленоїд…</text>
<text x="578.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• індуктивне → флайбек-діод</text>
<text x="578.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• спільна земля обов'язкова</text>
<text x="480.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ШІМ лише «натискає кнопку» на затворі — усю силу тягне транзистор. Це й уся схема.</text>
</svg>
