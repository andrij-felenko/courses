<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія та каскад гарантованого знешкодження (Zeroization Cascade)</text>
<line x1="50.0" y1="75.0" x2="910.0" y2="75.0" stroke="#475569" stroke-width="3.0"/>
<line x1="890.0" y1="75.0" x2="940.0" y2="75.0" stroke="#475569" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="915.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">Час (t)</text>
<circle cx="70.0" cy="75.0" r="8.0" fill="#c0392b" stroke="#991b1b" stroke-width="2.0"/>
<text x="70.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">t = 0</text>
<rect x="20.0" y="95.0" width="130.0" height="60.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="85.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="85.0" dy="0.0">Спрацювання</tspan><tspan x="85.0" dy="11.7">сенсора тампера</tspan><tspan x="85.0" dy="11.7">(Mesh / Pin / Light)</tspan></text>
<circle cx="230.0" cy="75.0" r="8.0" fill="#c0392b" stroke="#991b1b" stroke-width="2.0"/>
<text x="230.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">t &lt; 100 нс</text>
<rect x="165.0" y="95.0" width="175.0" height="140.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="252.5" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">Рівень 1: Апаратний Wipe</tspan><tspan x="252.5" dy="14.3">- Скидання Backup SRAM</tspan><tspan x="252.5" dy="14.3">- Розмикання ключа VBAT</tspan><tspan x="252.5" dy="14.3">- Майстер-ключ знищено!</tspan><tspan x="252.5" dy="14.3"></tspan><tspan x="252.5" dy="14.3">Криптографічне стирання:</tspan><tspan x="252.5" dy="14.3">увесь Flash миттєво стає</tspan><tspan x="252.5" dy="14.3">нерозшифровним сміттям.</tspan></text>
<circle cx="440.0" cy="75.0" r="8.0" fill="#2457d6" stroke="#1e40af" stroke-width="2.0"/>
<text x="440.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">t ≈ 50 мкс</text>
<rect x="360.0" y="95.0" width="175.0" height="140.0" rx="6" fill="#e0e7ff" stroke="#2457d6" stroke-width="1.5"/><text x="447.5" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="447.5" dy="0.0">Рівень 2: Затирання RAM</tspan><tspan x="447.5" dy="13.0">- NMI / Tamper ISR</tspan><tspan x="447.5" dy="13.0">- explicit_bzero() стеків</tspan><tspan x="447.5" dy="13.0">- Очищення буферів mbedTLS</tspan><tspan x="447.5" dy="13.0">- Скидання регістрів R0-R12</tspan><tspan x="447.5" dy="13.0"></tspan><tspan x="447.5" dy="13.0">Захист від оптимізацій</tspan><tspan x="447.5" dy="13.0">компілятора (Dead Store).</tspan></text>
<circle cx="650.0" cy="75.0" r="8.0" fill="#27ae60" stroke="#166534" stroke-width="2.0"/>
<text x="650.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">t ≈ 50 мс</text>
<rect x="565.0" y="95.0" width="185.0" height="140.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="657.5" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="657.5" dy="0.0">Рівень 3: Затирання Flash</tspan><tspan x="657.5" dy="14.3">- Chip Erase (0xC7 / 0x60)</tspan><tspan x="657.5" dy="14.3">- Перезапис секторів 0x00</tspan><tspan x="657.5" dy="14.3">- Знищення таблиць файлів</tspan><tspan x="657.5" dy="14.3">- Скидання журналу NVS</tspan><tspan x="657.5" dy="14.3"></tspan><tspan x="657.5" dy="14.3">Фізичне перезаряджання</tspan><tspan x="657.5" dy="14.3">плаваючих затворів NOR.</tspan></text>
<circle cx="855.0" cy="75.0" r="8.0" fill="#475569" stroke="#0f172a" stroke-width="2.0"/>
<text x="855.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">t ≈ 200 мс</text>
<rect x="770.0" y="95.0" width="180.0" height="140.0" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="860.0" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Рівень 4: Спалювання eFuse</tspan><tspan x="860.0" dy="11.7">- Спалювання бітів JTAG/SWD</tspan><tspan x="860.0" dy="11.7">- Постійне блокування наладки</tspan><tspan x="860.0" dy="11.7">- Security Level 3 / Permanent</tspan><tspan x="860.0" dy="11.7"></tspan><tspan x="860.0" dy="11.7">Чип назавжди ізольовано:</tspan><tspan x="860.0" dy="11.7">навіть на заводі його не можна</tspan><tspan x="860.0" dy="11.7">перепрошити чи прочитати.</tspan></text>
<rect x="40.0" y="260.0" width="900.0" height="235.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип ешелонованого знищення секретів (Crypto-Shredding First)</text>
<rect x="60.0" y="305.0" width="410.0" height="170.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="265.0" y="343.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Чому знищення ключа за 100 нс вирішує все:</tspan><tspan x="265.0" dy="14.3"></tspan><tspan x="265.0" dy="14.3">Якщо нападник встигне висмикнути живлення</tspan><tspan x="265.0" dy="14.3">через 5 мс після розкриття корпусу, Flash</tspan><tspan x="265.0" dy="14.3">не встигне затертися. Але якщо Flash було</tspan><tspan x="265.0" dy="14.3">зашифровано, а ключ із Backup SRAM зник</tspan><tspan x="265.0" dy="14.3">за 100 нс — збережений дамп пам'яті лишається</tspan><tspan x="265.0" dy="14.3">математично нерозшифровним білим шумом.</tspan></text>
<rect x="500.0" y="305.0" width="420.0" height="170.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="710.0" y="343.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Чому обов'язкові наступні рівні:</tspan><tspan x="710.0" dy="14.3"></tspan><tspan x="710.0" dy="14.3">Якщо частина Flash лишалася відкритою</tspan><tspan x="710.0" dy="14.3">(відкритий завантажувач або конфігурація Wi-Fi),</tspan><tspan x="710.0" dy="14.3">подальші кроки (RAM Scrubbing, Sector Erase,</tspan><tspan x="710.0" dy="14.3">eFuse Blow) гарантовано затирають відкриті</tspan><tspan x="710.0" dy="14.3">байти та назавжди блокують апаратні інтерфейси</tspan><tspan x="710.0" dy="14.3">чипа від зворотного інжинірингу.</tspan></text>
</svg>