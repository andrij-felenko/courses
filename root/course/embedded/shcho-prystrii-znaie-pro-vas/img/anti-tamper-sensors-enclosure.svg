<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратні сенсори анти-темпер моніторингу в захищеному корпусі</text>
<rect x="30.0" y="50.0" width="920.0" height="400.0" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="120.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">Герметичний корпус виробу</text>
<rect x="50.0" y="95.0" width="270.0" height="160.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<rect x="60.0" y="105.0" width="250.0" height="30.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">1. Активна струмопровідна сітка</tspan></text>
<rect x="60.0" y="145.0" width="250.0" height="95.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="185.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Звивиста мікродоріжка на кришці</tspan><tspan x="185.0" dy="14.3">Контроль опору містом Уїтстона</tspan><tspan x="185.0" dy="14.3">Свердління / розрізання:</tspan><tspan x="185.0" dy="14.3">→ Обірвання або закорочення</tspan><tspan x="185.0" dy="14.3">→ Миттєва апаратна тривога</tspan></text>
<rect x="355.0" y="95.0" width="270.0" height="160.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="365.0" y="105.0" width="250.0" height="30.0" rx="6" fill="#e0e7ff" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">2. Кінцевики розкриття кришки</tspan></text>
<rect x="365.0" y="145.0" width="250.0" height="95.0" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="490.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Позолочені мікроперемикачі</tspan><tspan x="490.0" dy="14.3">Підпружинені ребрами кришки</tspan><tspan x="490.0" dy="14.3">Струмова петля із підтяжкою</tspan><tspan x="490.0" dy="14.3">Зняття кришки / відкручування:</tspan><tspan x="490.0" dy="14.3">→ Розмикання контактів за 50 мкс</tspan></text>
<rect x="660.0" y="95.0" width="270.0" height="160.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<rect x="670.0" y="105.0" width="250.0" height="30.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="795.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">3. Оптичний сенсор у порожнині</tspan></text>
<rect x="670.0" y="145.0" width="250.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="795.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Фотодіод / фототранзистор на PCB</tspan><tspan x="795.0" dy="14.3">Повна темрява у закритому боксі</tspan><tspan x="795.0" dy="14.3">Струм витоку: &lt; 100 пА</tspan><tspan x="795.0" dy="14.3">Поява світла (розкриття / щілина):</tspan><tspan x="795.0" dy="14.3">→ Фотострум підриває компаратор</tspan></text>
<rect x="180.0" y="290.0" width="620.0" height="140.0" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2.0"/>
<rect x="200.0" y="305.0" width="580.0" height="34.0" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="490.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Апаратний захищений домен МК (STM32 TAMP / ESP32 RTC Power Domain)</tspan></text>
<rect x="200.0" y="348.0" width="280.0" height="68.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="340.0" y="364.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Резервне живлення (VBAT):</tspan><tspan x="340.0" dy="14.3">Літієва таблетка або іоністор.</tspan><tspan x="340.0" dy="14.3">Стеження за сенсорами 24/7</tspan><tspan x="340.0" dy="14.3">при струмі менше 1 мкА.</tspan></text>
<rect x="500.0" y="348.0" width="280.0" height="68.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="364.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Регістри ключів (Backup SRAM):</tspan><tspan x="640.0" dy="14.3">Апаратне самоочищення за 1 такт.</tspan><tspan x="640.0" dy="14.3">При тривозі живлення вимикається,</tspan><tspan x="640.0" dy="14.3">ключ розсіюється назавжди.</tspan></text>
<line x1="185.0" y1="257.0" x2="280.0" y2="288.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="490.0" y1="257.0" x2="490.0" y2="288.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="795.0" y1="257.0" x2="700.0" y2="288.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>