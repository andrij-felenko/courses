<text x="490.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичний сектор NOR Flash (4 КБ) під керуванням Log-Structured NVS / LittleFS</text>
