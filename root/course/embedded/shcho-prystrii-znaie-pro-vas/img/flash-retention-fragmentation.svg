<rect x="670.0" y="150.0" width="245.0" height="75.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="792.5" y="173.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="792.5" dy="0.0">Пряме читання SPI Flash (ROM Reader)</tspan><tspan x="792.5" dy="11.7">Зчитано з комірок плаваючого затвора:</tspan><tspan x="792.5" dy="11.7">→ Старий пароль: &quot;AlphaPass2026&quot;</tspan><tspan x="792.5" dy="11.7">→ Повний JWT: &quot;eyJhbGciOi...&quot;</tspan></text>
<rect x="670.0" y="235.0" width="245.0" height="65.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="792.5" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="792.5" dy="0.0">Координати бази та історія треків:</tspan><tspan x="792.5" dy="14.3">→ gps_home = &quot;50.4501, 30.5234&quot;</tspan><tspan x="792.5" dy="14.3">→ Логи маршруту за всі сесії</tspan></text>
<rect x="670.0" y="310.0" width="245.0" height="65.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="792.5" y="332.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="792.5" dy="0.0">Новий дійсний пароль:</tspan><tspan x="792.5" dy="14.3">→ wifi_pass = &quot;NewSecureKey99&quot;</tspan><tspan x="792.5" dy="14.3">Нападник має всю історію змін!</tspan></text>
<rect x="670.0" y="385.0" width="245.0" height="75.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="792.5" y="404.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c2d12" text-anchor="middle"><tspan x="792.5" dy="0.0">Підсумок:</tspan><tspan x="792.5" dy="14.3">«Видалення» у файловій системі</tspan><tspan x="792.5" dy="14.3">лише змінило біти заголовка,</tspan><tspan x="792.5" dy="14.3">тіло секрету лишилося в кремнії!</tspan></text>
