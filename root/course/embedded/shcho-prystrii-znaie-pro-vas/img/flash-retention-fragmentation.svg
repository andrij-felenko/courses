<rect x="55.0" y="105.0" width="255.0" height="32.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="182.5" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="182.5" dy="0.0">Крок 1: Початковий стан</tspan></text>
<rect x="60.0" y="150.0" width="245.0" height="65.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="182.5" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="182.5" dy="0.0">Сторінка 0 [Свіжий запис]</tspan><tspan x="182.5" dy="14.3">Статус: ВАЛІДНИЙ (0xFE)</tspan><tspan x="182.5" dy="14.3">wifi_pass = &quot;AlphaPass2026&quot;</tspan></text>
<rect x="60.0" y="225.0" width="245.0" height="65.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="182.5" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="182.5" dy="0.0">Сторінка 1 [Свіжий запис]</tspan><tspan x="182.5" dy="14.3">Статус: ВАЛІДНИЙ (0xFE)</tspan><tspan x="182.5" dy="14.3">cloud_jwt = &quot;eyJhbGciOi...&quot;</tspan></text>
<rect x="60.0" y="300.0" width="245.0" height="65.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="182.5" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="182.5" dy="0.0">Сторінка 2 [Свіжий запис]</tspan><tspan x="182.5" dy="14.3">Статус: ВАЛІДНИЙ (0xFE)</tspan><tspan x="182.5" dy="14.3">gps_home = &quot;50.4501, 30.5234&quot;</tspan></text>
<rect x="60.0" y="375.0" width="245.0" height="85.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="182.5" y="399.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="182.5" dy="0.0">Сторінки 3..15 [Чисті]</tspan><tspan x="182.5" dy="14.3">Статус: ВІЛЬНО (0xFF)</tspan><tspan x="182.5" dy="14.3">Фізичний стан: усі біти 1</tspan><tspan x="182.5" dy="14.3">Готові до запису 1 → 0</tspan></text>
<rect x="350.0" y="95.0" width="275.0" height="385.0" rx="6" fill="#f4f6f8" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="360.0" y="105.0" width="255.0" height="32.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="487.5" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="487.5" dy="0.0">Крок 2: Зміна пароля та «видалення»</tspan></text>
<rect x="365.0" y="150.0" width="245.0" height="65.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="487.5" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Сторінка 0 [Стара версія]</tspan><tspan x="487.5" dy="14.3">Статус: ЗАСТАРІЛИЙ (0xFC)</tspan><tspan x="487.5" dy="14.3">wifi_pass = &quot;AlphaPass2026&quot;</tspan></text>
<rect x="365.0" y="225.0" width="245.0" height="65.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="487.5" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Сторінка 1 [«Видалений» токен]</tspan><tspan x="487.5" dy="14.3">Статус: ВИДАЛЕНО (0xF8)</tspan><tspan x="487.5" dy="14.3">cloud_jwt = &quot;eyJhbGciOi...&quot;</tspan></text>
<rect x="365.0" y="300.0" width="245.0" height="65.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="487.5" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Сторінка 2 [Незмінний]</tspan><tspan x="487.5" dy="14.3">Статус: ВАЛІДНИЙ (0xFE)</tspan><tspan x="487.5" dy="14.3">gps_home = &quot;50.4501, 30.5234&quot;</tspan></text>
<rect x="365.0" y="375.0" width="245.0" height="85.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="487.5" y="399.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Сторінка 3 [Нова версія]</tspan><tspan x="487.5" dy="14.3">Статус: ВАЛІДНИЙ (0xFE)</tspan><tspan x="487.5" dy="14.3">wifi_pass = &quot;NewSecureKey99&quot;</tspan><tspan x="487.5" dy="14.3">Записано у наступні комірки</tspan></text>
