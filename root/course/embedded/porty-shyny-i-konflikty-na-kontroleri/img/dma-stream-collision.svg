<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка апаратного конфлікту DMA (STM32F4/F7) проти маршрутизатора DMAMUX (H7)</text>
<rect x="25.0" y="55.0" width="435.0" height="475.0" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
<text x="242.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e11d48" text-anchor="middle" font-weight="700">STM32F4 / F7: Фіксована таблиця каналів</text>
<text x="242.5" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Жорсткий мультиплексор: 1 активний Channel на 1 Stream</text>
<rect x="40.0" y="120.0" width="185.0" height="48.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<text x="132.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle" font-weight="700">SPI1_RX (IMU Гіроскоп)</text>
<text x="132.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Channel 3 (постійний потік)</text>
<rect x="40.0" y="185.0" width="185.0" height="48.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="132.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">TIM1_UP (DShot Мотори)</text>
<text x="132.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Channel 6 (висока частота)</text>
<rect x="40.0" y="250.0" width="185.0" height="48.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
<text x="132.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9333ea" text-anchor="middle" font-weight="700">USART6_RX (RC-лінк)</text>
<text x="132.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Channel 5 (пакети керування)</text>
<rect x="260.0" y="150.0" width="185.0" height="120.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="352.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">DMA2 Stream 5</text>
<text x="352.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Селектор каналів 0..7</text>
<text x="352.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">КОНФЛІКТ:</text>
<text x="352.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">SPI1_TX (Ch 3) vs</text>
<text x="352.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">TIM1_UP (Ch 6)</text>
<line x1="225.0" y1="144.0" x2="260.0" y2="180.0" stroke="#0284c7" stroke-width="1.5"/>
<line x1="225.0" y1="209.0" x2="260.0" y2="200.0" stroke="#16a34a" stroke-width="1.5"/>
<line x1="225.0" y1="274.0" x2="260.0" y2="220.0" stroke="#9333ea" stroke-width="1.5"/>
<rect x="40.0" y="325.0" width="405.0" height="185.0" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
<text x="50.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e11d48" text-anchor="start" font-weight="700">Наслідки конфлікту на F4 / F7:</text>
<text x="50.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Один із пристроїв вимикає DMA і переходить на IRQ</text>
<text x="50.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Перевантаження CPU перериваннями на високій частоті</text>
<text x="50.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Джитер зчитування гіроскопа (падіння з 8 кГц до 2 кГц)</text>
<text x="50.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Пропуски кадрів DShot — десинхронізація мотора</text>
<text x="50.0" y="473.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">5. Апаратний збій вимагає ручного перепризначення ресурсів</text>
<rect x="480.0" y="55.0" width="435.0" height="475.0" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="697.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">STM32H7: Маршрутизатор DMAMUX</text>
<text x="697.5" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Повна матриця перехресних з'єднань (Crossbar Switch)</text>
<rect x="495.0" y="120.0" width="140.0" height="42.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<text x="565.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle" font-weight="700">SPI1..SPI6</text>
<rect x="495.0" y="175.0" width="140.0" height="42.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="565.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">TIM1..TIM17</text>
<rect x="495.0" y="230.0" width="140.0" height="42.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
<text x="565.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9333ea" text-anchor="middle" font-weight="700">USART1..UART8</text>
<rect x="655.0" y="120.0" width="95.0" height="152.0" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<text x="702.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">DMAMUX</text>
<text x="702.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Crossbar</text>
<text x="702.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Matrix</text>
<rect x="770.0" y="120.0" width="130.0" height="42.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="835.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">DMA1 Stream 0</text>
<rect x="770.0" y="175.0" width="130.0" height="42.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="835.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">DMA1 Stream 1</text>
<rect x="770.0" y="230.0" width="130.0" height="42.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="835.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">DMA2 Stream 0</text>
<line x1="635.0" y1="141.0" x2="655.0" y2="141.0" stroke="#0284c7" stroke-width="1.5"/>
<line x1="635.0" y1="196.0" x2="655.0" y2="196.0" stroke="#16a34a" stroke-width="1.5"/>
