<line x1="750.0" y1="141.0" x2="770.0" y2="141.0" stroke="#16a34a" stroke-width="1.5"/>
<line x1="750.0" y1="196.0" x2="770.0" y2="196.0" stroke="#16a34a" stroke-width="1.5"/>
<line x1="750.0" y1="251.0" x2="770.0" y2="251.0" stroke="#16a34a" stroke-width="1.5"/>
<rect x="495.0" y="325.0" width="405.0" height="185.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="505.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">Переваги маршрутизації DMAMUX на H7:</text>
<text x="505.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Довільне з'єднання: будь-який периферійний тригер</text>
<text x="505.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Відсутність апаратних колізій Stream/Channel</text>
<text x="505.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Одночасна робота SPI IMU, DShot, OSD, Telemetry</text>
<text x="505.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Потрібен лише контроль когерентності D-Cache</text>
<text x="505.0" y="473.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">5. Висока пропускна здатність шини AXI без затримок</text>
</svg>