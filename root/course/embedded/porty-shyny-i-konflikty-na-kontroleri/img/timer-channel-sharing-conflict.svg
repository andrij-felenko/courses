<text x="75.0" y="489.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-style="italic">Змішування DShot з WS2812B або звичайним серво-PWM (50 Гц) на одному таймері апаратно неможливе.</text>
