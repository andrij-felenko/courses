<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловідведення від AI-процесора: тепловий ланцюг та обдув радіатора</text>
<rect x="40.0" y="60.0" width="420.0" height="300.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/><text x="250.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловий ланцюг: від кристала до повітря</text><rect x="90.0" y="115.0" width="320.0" height="42.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/><text x="250.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">AI SoC / Джерело тепла (15–30 Вт, T_j max = 105°C)</text><text x="250.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">Кремнієвий кристал (R_θjc ≈ 0.8 °C/Вт)</text><rect x="90.0" y="165.0" width="320.0" height="24.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="250.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">Термопрокладка / TIM (k = 6.0 Вт/(м·К), R_θcs ≈ 0.4 °C/Вт)</text><rect x="90.0" y="197.0" width="320.0" height="35.0" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/><text x="250.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">Підошва радіатора (Al 6061, товщина 4.0 мм)</text><rect x="100.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><rect x="128.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><rect x="156.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><rect x="184.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><rect x="212.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><rect x="240.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><rect x="268.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><rect x="296.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><rect x="324.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><rect x="352.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><rect x="380.0" y="235.0" width="14.0" height="45.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/><text x="250.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Поздовжні аеродинамічні ребра (h = 15 мм, крок 4 мм)</text><line x1="250.0" y1="312.0" x2="250.0" y2="342.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="250.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Тепловий потік Q = P_diss = 25 Вт</text><rect x="480.0" y="60.0" width="320.0" height="300.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/><text x="640.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими охолодження в польоті</text><rect x="500.0" y="115.0" width="280.0" height="95.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="640.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режим висіння (Hover / Downwash)</text><text x="640.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Швидкість потоку v ≈ 5–10 м/с</text><text x="640.0" y="173.0" 