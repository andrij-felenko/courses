ч навантаження</text><line x1="470.0" y1="230.0" x2="770.0" y2="230.0" stroke="#e2e8f0" stroke-width="1.0"/><text x="620.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1. JST-GH: позитивний механічний замок від випадання</text><text x="620.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2. Радіус вигину кабелю R_bend ≥ 5 · D_кабелю</text><text x="620.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3. Віброізоляційна петля (service loop) перед роз'ємом</text><text x="620.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Механічне розвантаження захищає паяні контакти від втоми</text>
