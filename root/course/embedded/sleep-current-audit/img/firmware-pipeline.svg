<rect x="143.2" y="301.4" width="183.7" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="235.0" y="320.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">self-test:</tspan><tspan x="235.0" dy="14.3">ділення навпіл по гілках</tspan></text>
