<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація навантажень для виводу МК: безпечна зона vs смертельні помилки</text>
<rect x="40.0" y="50.0" width="350.0" height="360.0" rx="8" fill="#f6fcf8" stroke="#27ae60" stroke-width="2.0"/>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ДОЗВОЛЕНО НАПРЯМУ (безпечно)</text>
<rect x="60.0" y="108.5" width="310.0" height="33.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="215.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">1. Індикаторні LED (з резистором R ≥ 220 Ом)</tspan><tspan x="215.0" dy="13.0">   Струм I ≤ 3…5 мА</tspan></text>
<rect x="60.0" y="149.5" width="310.0" height="33.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="215.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">2. Цифрові логічні входи (CMOS-входи)</tspan><tspan x="215.0" dy="13.0">   Вхідний опір &gt; 10 МОм, струм витоку &lt; 1 мкА</tspan></text>
<rect x="60.0" y="190.5" width="310.0" height="33.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="215.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">3. Високоомні сенсори та дільники напруги</tspan><tspan x="215.0" dy="13.0">   R_div ≥ 10…100 кОм</tspan></text>
<rect x="60.0" y="231.5" width="310.0" height="33.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="215.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">4. Резистори підтяжки (Pull-Up / Pull-Down)</tspan><tspan x="215.0" dy="13.0">   Типові номінали: 2.2 кОм … 47 кОм</tspan></text>
<rect x="60.0" y="272.5" width="310.0" height="33.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="215.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">5. Малопотужні оптопари (I_F ≤ 3…5 мА)</tspan><tspan x="215.0" dy="13.0">   Тільки з розрахунковим резистором</tspan></text>
<rect x="430.0" y="50.0" width="350.0" height="360.0" rx="8" fill="#fdf7f7" stroke="#c0392b" stroke-width="2.0"/>
<text x="605.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">СУВОРО ЗАБОРОНЕНО НАПРЯМУ</text>
<rect x="450.0" y="108.5" width="310.0" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="605.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">1. Індуктивності (реле, мотори, соленоїди)</tspan><tspan x="605.0" dy="13.0">   Кидок самоіндукції U = −L·di/dt &gt; 50…200 В!</tspan></text>
<rect x="450.0" y="149.5" width="310.0" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="605.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">2. Світлодіодні стрічки та потужні LED</tspan><tspan x="605.0" dy="13.0">   Струми від 50 мА до десятків ампер</tspan></text>
<rect x="450.0" y="190.5" width="310.0" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="605.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">3. Ємності &gt; 50 пФ без резистора</tspan><tspan x="605.0" dy="13.0">   Піковий струм i = C·dv/dt &gt; 100…300 мА!</tspan></text>
<rect x="450.0" y="231.5" width="310.0" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="605.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">4. Бази біполярних транзисторів напряму</tspan><tspan x="605.0" dy="13.0">   Прямий PN-перехід замикає пін на 0.7 В</tspan></text>
<rect x="450.0" y="272.5" width="310.0" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="605.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">5. Сигнали з напругою &gt; VDD + 0.3 В (не-FT)</tspan><tspan x="605.0" dy="13.0">   Струм інжекції випалює ESD-діод і чіп</tspan></text>
</svg>