<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="850.0" height="410.0" rx="10" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="440.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл тепла при монтажі QFN / Thermal Pad: без підігріву vs з підігрівом</text>
<rect x="35.0" y="65.0" width="390.0" height="345.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
<text x="230.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Без нижнього підігріву (лише фен)</text>
<rect x="55.0" y="110.0" width="350.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="230.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Фен згори: T_air = 380–420 °C</tspan><tspan x="230.0" dy="13.0">Локальний перегрів корпусу мікросхеми</tspan></text>
<rect x="75.0" y="175.0" width="310.0" height="30.0" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/>
<text x="230.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="700">Холодна багатошарова плата (T_pcb = 25 °C)</text>
<rect x="55.0" y="220.0" width="350.0" height="175.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.0"/><text x="230.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Фізика процесу та дефекти:</tspan><tspan x="230.0" dy="13.0">• Мідні полігони та земляні перехідні отвори (vias)</tspan><tspan x="230.0" dy="13.0">  миттєво відводять тепло у площину плати</tspan><tspan x="230.0" dy="13.0">• Центральний майданчик (Thermal Pad) не прогрівається</tspan><tspan x="230.0" dy="13.0">• Колосальний локальний градієнт ΔT &gt; 350 °C</tspan><tspan x="230.0" dy="13.0">• Наслідки:</tspan><tspan x="230.0" dy="13.0">  - Короблення склотекстоліту FR-4</tspan><tspan x="230.0" dy="13.0">  - Розшарування структури плати (delamination)</tspan><tspan x="230.0" dy="13.0">  - Вигорання флюсу ще до розплавлення припою</tspan></text>
<rect x="455.0" y="65.0" width="390.0" height="345.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
<text x="650.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">З нижнім підігрівом (Preheater / Hot Plate)</text>
<rect x="475.0" y="110.0" width="350.0" height="50.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/><text x="650.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Фен згори: T_air = 230–250 °C</tspan><tspan x="650.0" dy="13.0">Делікатний локальний догрів зони оплавлення</tspan></text>
<rect x="495.0" y="175.0" width="310.0" height="30.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.2"/>
<text x="650.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Плата рівномірно прогріта знизу: T_pcb = 120–140 °C</text>
<rect x="475.0" y="220.0" width="350.0" height="175.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/><text x="650.0" y="265.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Фізика процесу та результат:</tspan><tspan x="650.0" dy="13.0">• Полігони плати вже насичені теплом і не крадуть енергію</tspan><tspan x="650.0" dy="13.0">• Фену треба додати лише ΔT = 80–100 °C для оплавлення</tspan><tspan x="650.0" dy="13.0">• Одночасне розплавлення припою на ніжках і Thermal Pad</tspan><tspan x="650.0" dy="13.0">• Переваги:</tspan><tspan x="650.0" dy="13.0">  - Швидке якісне самоцентрування мікросхеми</tspan><tspan x="650.0" dy="13.0">  - Збереження цілісності маски й текстоліту</tspan><tspan x="650.0" dy="13.0">  - Активний флюс без термічного розкладання</tspan></text>
</svg>