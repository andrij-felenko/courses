<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="850.0" height="410.0" rx="10" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="440.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловий тракт: пасивне жало (Hakko 900M) vs картридж (T12 / JBC)</text>
<rect x="35.0" y="65.0" width="390.0" height="345.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
<text x="230.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Пасивне жало (роздільна гільза)</text>
<rect x="55.0" y="110.0" width="115.0" height="34.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="112.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Нагрівач + сенсор</text>
<rect x="180.0" y="110.0" width="80.0" height="34.0" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.0"/>
<text x="220.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="700">Зазор R_th</text>
<rect x="270.0" y="110.0" width="135.0" height="34.0" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/>
<text x="337.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="700">Знімне мідне жало</text>
<line x1="170.0" y1="127.0" x2="180.0" y2="127.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="260.0" y1="127.0" x2="270.0" y2="127.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55.0" y="155.0" width="350.0" height="110.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.0"/><text x="230.0" y="186.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Тепловий бар'єр конструкції:</tspan><tspan x="230.0" dy="13.7">• Термопара всередині керамічного стрижня</tspan><tspan x="230.0" dy="13.7">• Сенсор «не бачить» падіння T° на кінчику</tspan><tspan x="230.0" dy="13.7">• Повітряний прошарок додає термічний опір</tspan><tspan x="230.0" dy="13.7">• Час реакції на відбір тепла: 5–15 секунд</tspan></text>
<rect x="55.0" y="275.0" width="350.0" height="120.0" rx="6" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/><text x="230.0" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Наслідки на платі з полігонами:</tspan><tspan x="230.0" dy="13.7">• Температурна яма (droop): просідання на 40–70 °C</tspan><tspan x="230.0" dy="13.7">• Монтажник вимушено піднімає T° до 380–420 °C</tspan><tspan x="230.0" dy="13.7">• Підсумок: швидке вигорання флюсу, окиснення,</tspan><tspan x="230.0" dy="13.7">  перегрів клею та відшарування доріжок</tspan></text>
<rect x="455.0" y="65.0" width="390.0" height="345.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
<text x="650.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Інтегрований картридж (T12 / JBC C245)</text>
<rect x="475.0" y="110.0" width="350.0" height="34.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="650.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Монолітний блок: нагрівач + термопара + робочий кінчик</text>
<rect x="475.0" y="155.0" width="350.0" height="110.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/><text x="650.0" y="186.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Пряма передача енергії:</tspan><tspan x="650.0" dy="13.7">• Термопара вмонтована безпосередньо у вістря</tspan><tspan x="650.0" dy="13.7">• Відсутній повітряний прошарок (нульовий зазор)</tspan><tspan x="650.0" dy="13.7">• Мікроконтролер станції опитує термопару сотні</tspan><tspan x="650.0" dy="13.7">  разів на секунду; відгук &lt; 20 мілісекунд</tspan></text>
<rect x="475.0" y="275.0" width="350.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/><text x="650.0" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Поведінка на масивних полігонах:</tspan><tspan x="650.0" dy="13.7">• Миттєва подача імпульсу потужності до 130–150 Вт</tspan><tspan x="650.0" dy="13.7">• Стабільна температура: просідання не більше 10–15 °C</tspan><tspan x="650.0" dy="13.7">• Паяння відбувається за комфортних 290–320 °C</tspan><tspan x="650.0" dy="13.7">• Відсутній тепловий стрес для компонентів і плати</tspan></text>
</svg>