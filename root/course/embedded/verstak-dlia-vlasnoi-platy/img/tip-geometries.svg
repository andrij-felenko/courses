<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="890.0" height="450.0" rx="10" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="460.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профілі паяльних жал: фізика теплопередачі та призначення</text>
<rect x="30.0" y="65.0" width="205.0" height="385.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="132.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Мікрохвиля (GW/BCM)</text>
<text x="132.5" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зріз із лункою</text>
<circle cx="132.5" cy="140.0" r="20.0" fill="#dbeafe" stroke="#2457d6" stroke-width="1.3"/>
<circle cx="132.5" cy="140.0" r="9.0" fill="#93c5fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="132.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Лунка</text>
<rect x="40.0" y="172.0" width="185.0" height="265.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.0"/><text x="132.5" y="223.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">Застосування:</tspan><tspan x="132.5" dy="13.0">Drag soldering для корпусів</tspan><tspan x="132.5" dy="13.0">QFP, SOIC, TSSOP.</tspan><tspan x="132.5" dy="13.0"></tspan><tspan x="132.5" dy="13.0">Фізичний принцип:</tspan><tspan x="132.5" dy="13.0">Увігнута лунка утримує</tspan><tspan x="132.5" dy="13.0">запас рідкого припою силою</tspan><tspan x="132.5" dy="13.0">поверхневого натягу.</tspan><tspan x="132.5" dy="13.0"></tspan><tspan x="132.5" dy="13.0">При веденні жала вздовж ряду</tspan><tspan x="132.5" dy="13.0">виводів припій змочує мідні</tspan><tspan x="132.5" dy="13.0">майданчики, а надлишок сам</tspan><tspan x="132.5" dy="13.0">втягується назад у лунку</tspan><tspan x="132.5" dy="13.0">без утворення перемичок.</tspan></text>
<rect x="250.0" y="65.0" width="205.0" height="385.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="352.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Клин (Chisel D)</text>
<text x="352.5" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Викрутка 1.6–3.2 мм</text>
<rect x="328.5" y="126.0" width="48.0" height="28.0" rx="3" fill="#dcfce7" stroke="#27ae60" stroke-width="1.3"/>
<text x="352.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Площина</text>
<rect x="260.0" y="172.0" width="185.0" height="265.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/><text x="352.5" y="223.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="352.5" dy="0.0">Застосування:</tspan><tspan x="352.5" dy="13.0">Масивні полігони землі (GND),</tspan><tspan x="352.5" dy="13.0">силові роз'єми, дроселі.</tspan><tspan x="352.5" dy="13.0"></tspan><tspan x="352.5" dy="13.0">Фізичний принцип:</tspan><tspan x="352.5" dy="13.0">Широкий плаский торець дає</tspan><tspan x="352.5" dy="13.0">максимальну площу контакту</tspan><tspan x="352.5" dy="13.0">з металом плати.</tspan><tspan x="352.5" dy="13.0"></tspan><tspan x="352.5" dy="13.0">Забезпечує колосальний</tspan><tspan x="352.5" dy="13.0">тепловий потік, необхідний</tspan><tspan x="352.5" dy="13.0">для прогріву 4–6 шарів міді</tspan><tspan x="352.5" dy="13.0">без підняття температури</tspan><tspan x="352.5" dy="13.0">станції до небезпечних меж.</tspan></text>
<rect x="470.0" y="65.0" width="205.0" height="385.0" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
<text x="572.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="700">Копитце (Bevel C)</text>
<text x="572.5" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зріз під кутом 45°</text>
<rect x="552.5" y="126.0" width="40.0" height="28.0" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
<text x="572.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="700">Фаска 45°</text>
<rect x="480.0" y="172.0" width="185.0" height="265.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.0"/><text x="572.5" y="223.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="572.5" dy="0.0">Застосування:</tspan><tspan x="572.5" dy="13.0">SMD пасиви 0603/0805, діоди,</tspan><tspan x="572.5" dy="13.0">транзистори SOT-23.</tspan><tspan x="572.5" dy="13.0"></tspan><tspan x="572.5" dy="13.0">Фізичний принцип:</tspan><tspan x="572.5" dy="13.0">Універсальна комбінована</tspan><tspan x="572.5" dy="13.0">геометрія.</tspan><tspan x="572.5" dy="13.0"></tspan><tspan x="572.5" dy="13.0">Плаский еліптичний зріз</tspan><tspan x="572.5" dy="13.0">утворює тепловий місток</tspan><tspan x="572.5" dy="13.0">через краплю припою,</tspan><tspan x="572.5" dy="13.0">а тонкий край дозволяє</tspan><tspan x="572.5" dy="13.0">позиціонувати деталі та</tspan><tspan x="572.5" dy="13.0">акуратно формувати галтель.</tspan></text>
<rect x="690.0" y="65.0" width="205.0" height="385.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
<text x="792.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Голка (Conical I)</text>
<text x="792.5" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Гострий конус (пастка)</text>
<circle cx="792.5" cy="140.0" r="7.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.3"/>
<text x="792.5" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Точка</text>
<rect x="700.0" y="172.0" width="185.0" height="265.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.0"/><text x="792.5" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="792.5" dy="0.0">Типова помилка:</tspan><tspan x="792.5" dy="13.0">Уявна точність для дрібного</tspan><tspan x="792.5" dy="13.0">монтажу 0402 / 0201.</tspan><tspan x="792.5" dy="13.0"></tspan><tspan x="792.5" dy="13.0">Чому це не працює:</tspan><tspan x="792.5" dy="13.0">Точковий контакт має мізерну</tspan><tspan x="792.5" dy="13.0">площу теплопередачі.</tspan><tspan x="792.5" dy="13.0"></tspan><tspan x="792.5" dy="13.0">Тонкий стрижень має високий</tspan><tspan x="792.5" dy="13.0">внутрішній опір: тепло не</tspan><tspan x="792.5" dy="13.0">встигає доходити до кінчика.</tspan><tspan x="792.5" dy="13.0">Монтажник гріє задовго,</tspan><tspan x="792.5" dy="13.0">руйнуючи плату перегрівом.</tspan></text>
</svg>