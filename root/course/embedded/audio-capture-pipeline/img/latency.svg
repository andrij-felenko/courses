<rect x="293.3" y="187.0" width="179.3" height="26.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.1"/>
<rect x="476.7" y="187.0" width="179.3" height="26.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.1"/>
<text x="201.7" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">1024</text>
<text x="385.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">ядро дихає вільніше, зате затримка більша (64 мс)</text>
<text x="360.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">час одного блоку:  T = N / f_s   (N — відліків, f_s — частота)</text>
<text x="360.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">для f_s = 16 кГц:  256 → 16 мс,  1024 → 64 мс</text>
