<text x="430.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">більший k → нижчий зріз,</text>
<text x="430.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">повільніше усталення (τ ≈ 2^k / f_s)</text>
<text x="430.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">k=10, f_s=16 кГц → f_c ≈ 2.5 Гц</text>
