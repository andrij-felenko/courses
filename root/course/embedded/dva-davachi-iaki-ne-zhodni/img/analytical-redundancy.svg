<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крос-валідація двох розбіжних давачів за допомогою динамічної моделі двигуна</text>
<rect x="20.0" y="20.0" width="780.0" height="380.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="410.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розв'язання паритету через фізичну модель (Аналітична надлишковість)</text>
<rect x="50.0" y="89.3" width="200.0" height="41.3" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Давач 1: Потенціометр</tspan><tspan x="150.0" dy="14.3">Кут на валу: θ₁ = 45.0°</tspan></text>
<rect x="48.0" y="179.3" width="204.1" height="41.3" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Давач 2: Оптичний енкодер</tspan><tspan x="150.0" dy="14.3">Кут на валу: θ₂ = 68.5° (збій)</tspan></text>
<rect x="315.0" y="127.2" width="190.0" height="55.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="410.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Детектор розбіжності</tspan><tspan x="410.0" dy="14.3">|θ₁ - θ₂| = 23.5° &gt; 3.0°</tspan><tspan x="410.0" dy="14.3">СТАН: РОЗСИНХРОНІЗАЦІЯ</tspan></text>
<line x1="260.0" y1="110.0" x2="310.0" y2="140.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="260.0" y1="200.0" x2="310.0" y2="170.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="292.2" width="200.0" height="55.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Фізичні входи двигуна:</tspan><tspan x="150.0" dy="14.3">• Напруга ШІМ U(t)</tspan><tspan x="150.0" dy="14.3">• Інтеграл струму I(t)</tspan></text>
<rect x="300.0" y="292.2" width="220.0" height="55.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Динамічна модель сервоприводу</tspan><tspan x="410.0" dy="14.3">dω/dt = (k_m · I - T_load) / J</tspan><tspan x="410.0" dy="14.3">θ_model = ∫ ω dt = 46.2°</tspan></text>
<line x1="260.0" y1="320.0" x2="295.0" y2="320.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540.3" y="199.3" width="259.4" height="71.4" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="218.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Модельний арбітр (Валідатор):</tspan><tspan x="670.0" dy="13.7">|θ₁ - θ_model| = 1.2°  → [ПРАВДОПОДІБНО]</tspan><tspan x="670.0" dy="13.7">|θ₂ - θ_model| = 22.3° → [ВІДХИЛЕНО]</tspan><tspan x="670.0" dy="13.7">Ізольовано енкодер; обрано θ₁ = 45.0°</tspan></text>
<line x1="510.0" y1="155.0" x2="550.0" y2="210.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="525.0" y1="320.0" x2="550.0" y2="260.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>