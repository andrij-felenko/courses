<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 875 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="875" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#333333" text-anchor="middle" font-weight="700">Анатомія кадру в черзі Flash та відновлення після Power-Cut</text>
<rect x="45.0" y="60.0" width="85.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="87.5" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="87.5" dy="0.0">Magic (2B)</tspan><tspan x="87.5" dy="14.3">0xAA55</tspan></text>
<rect x="138.0" y="60.0" width="115.0" height="60.0" rx="6" fill="#e0e7ff" stroke="#333333" stroke-width="1.5"/><text x="195.5" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.5" dy="0.0">SeqNum (4B)</tspan><tspan x="195.5" dy="14.3">0x00018A4F</tspan></text>
<rect x="261.0" y="60.0" width="130.0" height="60.0" rx="6" fill="#ede9fe" stroke="#333333" stroke-width="1.5"/><text x="326.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="326.0" dy="0.0">Timestamp (8B)</tspan><tspan x="326.0" dy="14.3">Unix Epoch ms</tspan></text>
<rect x="399.0" y="60.0" width="115.0" height="60.0" rx="6" fill="#fce7f3" stroke="#333333" stroke-width="1.5"/><text x="456.5" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.5" dy="0.0">Len &amp; Typ (3B)</tspan><tspan x="456.5" dy="14.3">Len=64, Typ=2</tspan></text>
<rect x="522.0" y="60.0" width="195.0" height="60.0" rx="6" fill="#fef3c7" stroke="#333333" stroke-width="1.5"/><text x="619.5" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="619.5" dy="0.0">Payload (N байтів)</tspan><tspan x="619.5" dy="14.3">Корисне навантаження</tspan></text>
<rect x="725.0" y="60.0" width="130.0" height="60.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">CRC-32 (4B)</tspan><tspan x="790.0" dy="14.3">Контрольна сума</tspan></text>
<rect x="45.0" y="150.0" width="770.0" height="80.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Сценарій знеструмлення (Brownout під час запису другого кадру):</tspan><tspan x="430.0" dy="15.6">Кадр №1: [Magic ✓] [Seq=101 ✓] [Payload ✓] [CRC32 ✓] → Запис валідний, підтверджено</tspan><tspan x="430.0" dy="15.6">Кадр №2: [Magic ✓] [Seq=102] [Payload ... ЗНЕСТРУМЛЕННЯ! ... 0xFF 0xFF 0xFF] → CRC32 НЕ зійшовся!</tspan></text>
<rect x="45.0" y="250.0" width="770.0" height="85.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="273.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Алгоритм відновлення при завантаженні (Boot Recovery Scan):</tspan><tspan x="430.0" dy="15.6">1. Читаємо активний сектор від початку, крок за кроком перевіряючи Magic та CRC-32 кожного кадру.</tspan><tspan x="430.0" dy="15.6">2. Знайшовши перший битий CRC або чисті 0xFF — фіксуємо Head рівно на кінці останнього валідного Кадру №1.</tspan><tspan x="430.0" dy="15.6">3. Жодного пошкодженого сміття не потрапляє в мережевий стек!</tspan></text>
</svg>