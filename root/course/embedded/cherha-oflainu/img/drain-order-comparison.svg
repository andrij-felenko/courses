<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="25.0" width="800.0" height="40.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="49.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Стратегія 1: Чистий FIFO (вивантаження від старого до нового)</tspan></text>
<rect x="50.0" y="75.0" width="210.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Зв'язок повернувся!</tspan><tspan x="155.0" dy="14.3">Канал зайнятий...</tspan></text>
<rect x="280.0" y="75.0" width="260.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Вивантаження 50 МБ історії</tspan><tspan x="410.0" dy="14.3">(запис 3-годинної давнини)</tspan></text>
<rect x="560.0" y="75.0" width="250.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="685.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Поточний стан апарата:</tspan><tspan x="685.0" dy="14.3">ЗАБЛОКОВАНО в черзі!</tspan></text>
<line x1="260.0" y1="100.0" x2="280.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="100.0" x2="560.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Недолік: оператор не бачить, де дрон летить ЗАРАЗ, поки не прокачається вся історія!</text>
<rect x="30.0" y="180.0" width="800.0" height="40.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="204.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Стратегія 2: Двоколійне вивантаження (Two-Track Flush)</tspan></text>
<rect x="50.0" y="230.0" width="220.0" height="80.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Колія 1 (Realtime Fast-Path)</tspan><tspan x="160.0" dy="14.3">• Свіжа телеметрія</tspan><tspan x="160.0" dy="14.3">• Координати тут-і-зараз</tspan><tspan x="160.0" dy="14.3">• Пріоритет: 80% смуги</tspan></text>
<rect x="300.0" y="230.0" width="220.0" height="80.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Колія 2 (Background Backfill)</tspan><tspan x="410.0" dy="14.3">• Історія з Flash (FIFO)</tspan><tspan x="410.0" dy="14.3">• Пакетне квитування ACK</tspan><tspan x="410.0" dy="14.3">• Пріоритет: 20% смуги</tspan></text>
<rect x="550.0" y="230.0" width="260.0" height="80.0" rx="6" fill="#fafafa" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Сервер / Наземна станція</tspan><tspan x="680.0" dy="14.3">• Миттєвий контроль апарата</tspan><tspan x="680.0" dy="14.3">• Поступове заповнення</tspan><tspan x="680.0" dy="14.3">історичного графіка без затримок</tspan></text>
<line x1="270.0" y1="270.0" x2="300.0" y2="270.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="520.0" y1="270.0" x2="550.0" y2="270.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: нульова затримка для свіжого керування + гарантована доставка історії</text>
</svg>