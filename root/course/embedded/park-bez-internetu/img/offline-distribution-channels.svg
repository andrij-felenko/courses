<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три канали доставки оновлень в ізольованому від інтернету парку</text>
<rect x="25.0" y="55.0" width="270.0" height="350.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Фізичний носій (Sneakernet)</text><rect x="45.0" y="100.0" width="230.0" height="52.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="160.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">USB-накопичувач / SD-карта</tspan><tspan x="160.0" dy="14.3">Апаратний крипто-токен</tspan></text><rect x="45.0" y="162.0" width="230.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="160.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Механіка доставки:</tspan><tspan x="160.0" dy="13.7">Технік обходить кожен пристрій,</tspan><tspan x="160.0" dy="13.7">вставляє носій, Bootloader</tspan><tspan x="160.0" dy="13.7">перевіряє підпис і шиє Flash</tspan></text><rect x="45.0" y="247.0" width="230.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="160.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Зворотний канал (аудит):</tspan><tspan x="160.0" dy="13.7">Запис підписаної квитанції</tspan><tspan x="160.0" dy="13.7">та чорної скриньки на той</tspan><tspan x="160.0" dy="13.7">самий носій для звіту в HQ</tspan></text><rect x="45.0" y="332.0" width="230.0" height="58.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="160.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Застосування: критичні SCADA,</tspan><tspan x="160.0" dy="13.0">підстанції, суворий Air-Gap</tspan><tspan x="160.0" dy="13.0">із нульовим радіовипромінюванням</tspan></text>
<rect x="315.0" y="55.0" width="270.0" height="350.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Сервісний шлюз (Gateway)</text><rect x="335.0" y="100.0" width="230.0" height="52.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="450.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Планшет техніка / Оптична голівка</tspan><tspan x="450.0" dy="14.3">BLE / Wi-Fi AP / RS-485 шина</tspan></text><rect x="335.0" y="162.0" width="230.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="450.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Механіка доставки:</tspan><tspan x="450.0" dy="13.7">Точкове бездротове або оптичне</tspan><tspan x="450.0" dy="13.7">підключення до герметичного вузла,</tspan><tspan x="450.0" dy="13.7">потоковий трансфер чанками</tspan></text><rect x="335.0" y="247.0" width="230.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="450.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Зворотний канал (аудит):</tspan><tspan x="450.0" dy="13.7">Вивантаження діагностичного логу</tspan><tspan x="450.0" dy="13.7">через сесійний протокол,</tspan><tspan x="450.0" dy="13.7">валідація життєвих показників</tspan></text><rect x="335.0" y="332.0" width="230.0" height="58.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/><text x="450.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Застосування: лічильники газу/води,</tspan><tspan x="450.0" dy="13.0">шафи автоматики, об'єкти</tspan><tspan x="450.0" dy="13.0">без розбирання корпусу</tspan></text>
<rect x="605.0" y="55.0" width="270.0" height="350.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Mesh-ретрансляція (Gossip)</text><rect x="625.0" y="100.0" width="230.0" height="52.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="740.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Однорангова RF-мережа</tspan><tspan x="740.0" dy="14.3">Sub-1GHz / Thread / BLE Mesh</tspan></text><rect x="625.0" y="162.0" width="230.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="740.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Механіка доставки:</tspan><tspan x="740.0" dy="13.7">Оновлення одного вузла-насіння,</tspan><tspan x="740.0" dy="13.7">епідемічне поширення чанків</tspan><tspan x="740.0" dy="13.7">між сусідами за бітовими масками</tspan></text><rect x="625.0" y="247.0" width="230.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="740.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Зворотний канал (аудит):</tspan><tspan x="740.0" dy="13.7">Хвильове повернення квитанцій</tspan><tspan x="740.0" dy="13.7">до шлюзу або насіннєвого вузла</tspan><tspan x="740.0" dy="13.7">разом із вектором версій</tspan></text><rect x="625.0" y="332.0" width="230.0" height="58.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.0"/><text x="740.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Застосування: вуличне освітлення,</tspan><tspan x="740.0" dy="13.0">сільськогосподарські датчики,</tspan><tspan x="740.0" dy="13.0">важкодоступні сенсорні мережі</tspan></text>
</svg>