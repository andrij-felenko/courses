<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів польового сервісного шлюзу (BLE / Оптичний канал / RS-485)</text>
<rect x="30.0" y="70.0" width="180.0" height="110.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. DISCOVERY / AUTH</text><line x1="40.0" y1="105.0" x2="200.0" y2="105.0" stroke="#333333" stroke-width="1.0"/><text x="120.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="120.0" dy="0.0">Виявлення пристрою,</tspan><tspan x="120.0" dy="12.3">Challenge-Response</tspan><tspan x="120.0" dy="12.3">взаємна автентифікація</tspan><tspan x="120.0" dy="12.3">та узгодження сесії</tspan></text>
<rect x="250.0" y="70.0" width="180.0" height="110.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. MANIFEST NEGOTIATE</text><line x1="260.0" y1="105.0" x2="420.0" y2="105.0" stroke="#2457d6" stroke-width="1.0"/><text x="340.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="340.0" dy="0.0">Передача версії, розміру,</tspan><tspan x="340.0" dy="12.3">розміру чанка (256B..4KB),</tspan><tspan x="340.0" dy="12.3">перевірка заряду батареї</tspan><tspan x="340.0" dy="12.3">та готовності Flash B</tspan></text>
<rect x="470.0" y="70.0" width="180.0" height="110.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. CHUNK STREAMING</text><line x1="480.0" y1="105.0" x2="640.0" y2="105.0" stroke="#c0392b" stroke-width="1.0"/><text x="560.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">Потокове надсилання</tspan><tspan x="560.0" dy="12.3">ковзним вікном (Window),</tspan><tspan x="560.0" dy="12.3">CRC32 на кожен чанк,</tspan><tspan x="560.0" dy="12.3">довідправка втрачених</tspan></text>
<rect x="690.0" y="70.0" width="180.0" height="110.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">4. VERIFY &amp; COMMIT</text><line x1="700.0" y1="105.0" x2="860.0" y2="105.0" stroke="#27ae60" stroke-width="1.0"/><text x="780.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="780.0" dy="0.0">Повна SHA-256 звірка,</tspan><tspan x="780.0" dy="12.3">підпис образу Ed25519,</tspan><tspan x="780.0" dy="12.3">активація прапорця пробного</tspan><tspan x="780.0" dy="12.3">старту в NVS</tspan></text>
<line x1="210.0" y1="125.0" x2="250.0" y2="125.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430.0" y1="125.0" x2="470.0" y2="125.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="650.0" y1="125.0" x2="690.0" y2="125.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470.0" y="240.0" width="400.0" height="150.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">5. POST-BOOT VALIDATION &amp; AUDIT EXTRACTION</text><line x1="485.0" y1="280.0" x2="855.0" y2="280.0" stroke="#27ae60" stroke-width="1.0"/><text x="670.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">• Перезавантаження MCU у нову версію під наглядом апаратного Watchdog</tspan><tspan x="670.0" dy="13.0">• Самотестування периферії: датчики, живлення, криптомодуль</tspan><tspan x="670.0" dy="13.0">• Успіх: фіксація слота як основного, скидання таймера відкату</tspan><tspan x="670.0" dy="13.0">• Генерація підписаної квитанції та передача діагностики на шлюз техніка</tspan></text>
<rect x="30.0" y="240.0" width="380.0" height="150.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ОБРОБКА ОБРИВУ ЗВ'ЯЗКУ ТА ВІДКАТУ</text><line x1="45.0" y1="280.0" x2="395.0" y2="280.0" stroke="#c0392b" stroke-width="1.0"/><text x="220.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">• Обрив шлюзу під час передачі: контролер зберігає бітову маску,</tspan><tspan x="220.0" dy="13.0">  при повторному підключенні докачуються лише відсутні чанки (Resumable)</tspan><tspan x="220.0" dy="13.0">• Збій після прошивки: Watchdog не отримує підтвердження і через 30 с</tspan><tspan x="220.0" dy="13.0">  Bootloader автоматично повертає завантаження зі слота A</tspan></text>
<line x1="780.0" y1="180.0" x2="780.0" y2="240.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560.0" y1="180.0" x2="380.0" y2="240.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>