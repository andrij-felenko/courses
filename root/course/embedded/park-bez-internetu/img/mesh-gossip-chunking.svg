<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка Gossip-протоколу: бітові маски, антиентропія та дерево Меркла</text>
<rect x="25.0" y="55.0" width="260.0" height="350.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="155.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розбиття прошивки на чанки</text>
<rect x="45.0" y="100.0" width="220.0" height="50.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="155.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Образ прошивки v2.0 (256 КБ)</tspan><tspan x="155.0" dy="13.0">1024 чанки по 256 байтів</tspan></text>
<rect x="45.0" y="160.0" width="220.0" height="110.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="155.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Бітова маска володіння:</tspan><tspan x="155.0" dy="13.0">uint8_t bitmask[128];</tspan><tspan x="155.0" dy="13.0">1 біт = 1 наявний чанк</tspan><tspan x="155.0" dy="13.0"></tspan><tspan x="155.0" dy="13.0">Приклад: [1 1 1 0 1 0 0 1 ...]</tspan><tspan x="155.0" dy="13.0">Вузол миттєво знає, чого бракує</tspan></text>
<rect x="45.0" y="280.0" width="220.0" height="110.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="155.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Дерево хешів Меркла:</tspan><tspan x="155.0" dy="12.3">Корінь підписано Ed25519;</tspan><tspan x="155.0" dy="12.3">кожен чанк містить хеш-доказ.</tspan><tspan x="155.0" dy="12.3">Отруєний чанк відкидається</tspan><tspan x="155.0" dy="12.3">негайно, без чекання всього файлу!</tspan></text>
<rect x="310.0" y="55.0" width="565.0" height="350.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="592.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Епідемічне поширення (Anti-Entropy Exchange) між вузлами</text>
<rect x="330.0" y="110.0" width="160.0" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол 0 (Seed / Шлюз)</text><line x1="340.0" y1="142.0" x2="480.0" y2="142.0" stroke="#27ae60" stroke-width="1.0"/><text x="410.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Отримав від техніка</tspan><tspan x="410.0" dy="12.3">Маска: 100% (11111111)</tspan><tspan x="410.0" dy="12.3">Статус: ГОТОВИЙ</tspan></text>
<rect x="540.0" y="110.0" width="150.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="615.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Вузол 1 (Hop 1)</text><line x1="550.0" y1="142.0" x2="680.0" y2="142.0" stroke="#2457d6" stroke-width="1.0"/><text x="615.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Завантажує від Вузла 0</tspan><tspan x="615.0" dy="12.3">Маска: 65% (11110011)</tspan><tspan x="615.0" dy="12.3">Запитує чанки #4, #5</tspan></text>
<rect x="720.0" y="260.0" width="140.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вузол 3 (Hop 3)</text><line x1="730.0" y1="292.0" x2="850.0" y2="292.0" stroke="#c0392b" stroke-width="1.0"/><text x="790.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Спить 95% часу</tspan><tspan x="790.0" dy="12.3">Маска: 10% (10000000)</tspan><tspan x="790.0" dy="12.3">Синхронізація у вікні</tspan></text>
<rect x="540.0" y="260.0" width="150.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол 2 (Hop 2)</text><line x1="550.0" y1="292.0" x2="680.0" y2="292.0" stroke="#333333" stroke-width="1.0"/><text x="615.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Завантажує від Вузла 1</tspan><tspan x="615.0" dy="12.3">Маска: 30% (11000000)</tspan><tspan x="615.0" dy="12.3">Ділиться чанком #1 з #3</tspan></text>
<line x1="490.0" y1="155.0" x2="540.0" y2="155.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="615.0" y1="220.0" x2="615.0" y2="260.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="690.0" y1="315.0" x2="720.0" y2="315.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="330.0" y="260.0" width="180.0" height="110.0" rx="4" fill="#fdfefe" stroke="#333333" stroke-width="1.0"/>
<text x="420.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="420.0" dy="0.0">Алгоритм Trickle (RFC 6206):</tspan><tspan x="420.0" dy="11.7">При консенсусі таймер</tspan><tspan x="420.0" dy="11.7">експоненційно росте (тиша),</tspan><tspan x="420.0" dy="11.7">новий чанк скидає таймер</tspan><tspan x="420.0" dy="11.7">до мінімуму (швидкий сплеск)</tspan></text>
</svg>