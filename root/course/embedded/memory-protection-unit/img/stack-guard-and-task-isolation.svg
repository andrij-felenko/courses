<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="510.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="30.0" y="40.0" width="280.0" height="460.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="170.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Глобальна системна карта</text>
<rect x="45.0" y="85.0" width="250.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="170.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Регіон 0: Flash (Код та константи)</tspan><tspan x="170.0" dy="14.3">0x08000000 - 0x08080000 (512 КБ)</tspan><tspan x="170.0" dy="14.3">Privileged RO / Unprivileged RO</tspan><tspan x="170.0" dy="14.3">Виконання дозволено (XN = 0)</tspan></text>
<rect x="45.0" y="160.0" width="250.0" height="65.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="170.0" y="176.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Регіон 1: Ядро RTOS та ОС Дані</tspan><tspan x="170.0" dy="13.0">0x20000000 - 0x20004000 (16 КБ)</tspan><tspan x="170.0" dy="13.0">Privileged RW / Unprivileged No Access</tspan><tspan x="170.0" dy="13.0">Виконання заборонено (XN = 1)</tspan></text>
<rect x="45.0" y="235.0" width="250.0" height="65.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="170.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Регіон 2: Периферійний простір MMIO</tspan><tspan x="170.0" dy="13.0">0x40000000 - 0x5FFFFFFF (512 МБ)</tspan><tspan x="170.0" dy="13.0">Privileged RW / Unprivileged No Access</tspan><tspan x="170.0" dy="13.0">Тип: Device Memory, XN = 1</tspan></text>
<rect x="45.0" y="310.0" width="250.0" height="65.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="170.0" y="324.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Регіон 3: Захист нульового покажчика</tspan><tspan x="170.0" dy="14.3">0x00000000 - 0x0000001F (32 байти)</tspan><tspan x="170.0" dy="14.3">No Access (Всі рівні)</tspan><tspan x="170.0" dy="14.3">Миттєвий перехоплювач NULL Pointer</tspan></text>
<rect x="45.0" y="385.0" width="250.0" height="100.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="417.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Регіон 4: Системний стек ядра MSP</tspan><tspan x="170.0" dy="14.3">0x2001F000 - 0x20020000 (4 КБ)</tspan><tspan x="170.0" dy="14.3">Захисна смуга MSP Guard Band</tspan><tspan x="170.0" dy="14.3">0x2001EFE0 (32 байти No Access)</tspan></text>
<rect x="340.0" y="40.0" width="290.0" height="460.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="485.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">Задача 1 (Критичний контур)</text>
<rect x="355.0" y="85.0" width="260.0" height="60.0" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/><text x="485.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">Регіон 5: Приватні дані Задачі 1</tspan><tspan x="485.0" dy="14.3">0x20004000 - 0x20005000 (4 КБ)</tspan><tspan x="485.0" dy="14.3">Unprivileged RW, XN = 1</tspan></text>
<rect x="355.0" y="155.0" width="260.0" height="110.0" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/><text x="485.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">Регіон 6: Стек Задачі 1 (PSP)</tspan><tspan x="485.0" dy="14.3">0x20005040 - 0x20006000 (~4 КБ)</tspan><tspan x="485.0" dy="14.3">Unprivileged RW, XN = 1</tspan><tspan x="485.0" dy="14.3">Стек росте вниз (&lt;- SP)</tspan><tspan x="485.0" dy="14.3">Нормальна робоча зона</tspan></text>
<rect x="355.0" y="275.0" width="260.0" height="65.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="485.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">Регіон 7: Захисна смуга стека 1</tspan><tspan x="485.0" dy="14.3">0x20005000 - 0x2000503F (64 байти)</tspan><tspan x="485.0" dy="14.3">No Access (Unprivileged / Privileged)</tspan><tspan x="485.0" dy="14.3">Виявлення переповнення стека</tspan></text>
<rect x="355.0" y="350.0" width="260.0" height="135.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="485.0" y="385.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">Ізоляція від інших задач:</tspan><tspan x="485.0" dy="14.3">- Доступ до Задачі 2: ЗАБОРОНЕНО</tspan><tspan x="485.0" dy="14.3">- Доступ до регістрів NVIC: ЗАБОРОНЕНО</tspan><tspan x="485.0" dy="14.3">- Доступ до пам'яті ядра: ЗАБОРОНЕНО</tspan><tspan x="485.0" dy="14.3">Будь-яка несанкціонована спроба</tspan><tspan x="485.0" dy="14.3">генерує виняток MemManage!</tspan></text>
<rect x="660.0" y="40.0" width="290.0" height="460.0" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="805.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#581c87" text-anchor="middle" font-weight="700">Задача 2 (Мережевий стек)</text>
<rect x="675.0" y="85.0" width="260.0" height="60.0" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/><text x="805.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Регіон 5: Приватні дані Задачі 2</tspan><tspan x="805.0" dy="14.3">0x20006000 - 0x20008000 (8 КБ)</tspan><tspan x="805.0" dy="14.3">Unprivileged RW, XN = 1</tspan></text>
<rect x="675.0" y="155.0" width="260.0" height="110.0" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/><text x="805.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Регіон 6: Стек Задачі 2 (PSP)</tspan><tspan x="805.0" dy="14.3">0x20008040 - 0x20009000 (~4 КБ)</tspan><tspan x="805.0" dy="14.3">Unprivileged RW, XN = 1</tspan><tspan x="805.0" dy="14.3">Стек росте вниз (&lt;- SP)</tspan><tspan x="805.0" dy="14.3">Нормальна робоча зона</tspan></text>
<rect x="675.0" y="275.0" width="260.0" height="65.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="805.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Регіон 7: Захисна смуга стека 2</tspan><tspan x="805.0" dy="14.3">0x20008000 - 0x2000803F (64 байти)</tspan><tspan x="805.0" dy="14.3">No Access (Unprivileged / Privileged)</tspan><tspan x="805.0" dy="14.3">Виявлення переповнення стека</tspan></text>
<rect x="675.0" y="350.0" width="260.0" height="135.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="805.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Динамічне перемикання (PendSV):</tspan><tspan x="805.0" dy="13.0">Під час перемикання контексту</tspan><tspan x="805.0" dy="13.0">ядро RTOS перезаписує Регіони 5, 6, 7</tspan><tspan x="805.0" dy="13.0">значеннями нової задачі за 30-40 тактів</tspan><tspan x="805.0" dy="13.0">із бар'єрами __DSB() та __ISB().</tspan></text>
<line x1="630.0" y1="200.0" x2="660.0" y2="200.0" stroke="#9333ea" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="660.0" y1="220.0" x2="630.0" y2="220.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
