<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="500.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="30.0" y="40.0" width="200.0" height="70.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="130.0" y="57.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">1. Порушення захисту MPU</tspan><tspan x="130.0" dy="14.3">- Запис у чужий регіон</tspan><tspan x="130.0" dy="14.3">- Переповнення стека (Guard)</tspan><tspan x="130.0" dy="14.3">- Вибірка з зони XN</tspan></text>
<line x1="130.0" y1="110.0" x2="130.0" y2="140.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="140.0" width="200.0" height="100.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="130.0" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">2. Апаратний стек-фрейм</tspan><tspan x="130.0" dy="14.3">Ядро зберігає на PSP/MSP:</tspan><tspan x="130.0" dy="14.3">- R0, R1, R2, R3</tspan><tspan x="130.0" dy="14.3">- R12, LR (R14)</tspan><tspan x="130.0" dy="14.3">- PC (Адреса збою!)</tspan><tspan x="130.0" dy="14.3">- xPSR</tspan></text>
<line x1="130.0" y1="240.0" x2="130.0" y2="270.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="270.0" width="200.0" height="90.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="130.0" y="290.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">3. Вхід у виняток</tspan><tspan x="130.0" dy="14.3">MemManage_Handler()</tspan><tspan x="130.0" dy="14.3">Визначення активного стека:</tspan><tspan x="130.0" dy="14.3">Тест біта 2 у EXC_RETURN</tspan><tspan x="130.0" dy="14.3">(PSP чи MSP)</tspan></text>
<line x1="130.0" y1="360.0" x2="130.0" y2="390.0" stroke="#ca8a04" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="390.0" width="200.0" height="100.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="130.0" y="415.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">4. Зчитування SCB-&gt;CFSR</tspan><tspan x="130.0" dy="14.3">Аналіз бітів MMFSR:</tspan><tspan x="130.0" dy="14.3">- DACCVIOL / IACCVIOL</tspan><tspan x="130.0" dy="14.3">- MSTKERR / MUNSTKERR</tspan><tspan x="130.0" dy="14.3">- MLSPERR / MMARVALID</tspan></text>
<rect x="260.0" y="40.0" width="420.0" height="450.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="470.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Анатомія та аналіз регістрів винятку</text>
<rect x="280.0" y="90.0" width="380.0" height="75.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="470.0" y="109.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Регістр статусу MMFSR (SCB-&gt;CFSR[7:0]):</tspan><tspan x="470.0" dy="14.3">[0] IACCVIOL - Помилка вибірки інструкції (XN / NoExec)</tspan><tspan x="470.0" dy="14.3">[1] DACCVIOL - Помилка читання або запису даних (RW)</tspan><tspan x="470.0" dy="14.3">[3] MUNSTKERR - Збій розгортання стека при виході</tspan></text>
<rect x="280.0" y="175.0" width="380.0" height="75.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="470.0" y="194.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Регістр статусу MMFSR (Продовження):</tspan><tspan x="470.0" dy="14.3">[4] MSTKERR - Збій збереження стек-фрейму при вході</tspan><tspan x="470.0" dy="14.3">[5] MLSPERR - Збій збереження регістрів FPU (Lazy)</tspan><tspan x="470.0" dy="14.3">[7] MMARVALID - Адреса в MMFAR дійсна (1 = так, 0 = ні)</tspan></text>
<rect x="280.0" y="260.0" width="380.0" height="85.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="470.0" y="277.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Регістр адреси збою SCB-&gt;MMFAR:</tspan><tspan x="470.0" dy="14.3">Містить точну 32-бітну адресу пам'яті,</tspan><tspan x="470.0" dy="14.3">звернення до якої викликало порушення.</tspan><tspan x="470.0" dy="14.3">(Дійсний тільки якщо MMARVALID == 1).</tspan><tspan x="470.0" dy="14.3">Якщо DACCVIOL=1 та MMARVALID=1 -&gt; бачимо битий покажчик!</tspan></text>
<rect x="280.0" y="355.0" width="380.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="470.0" y="383.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Відновлення винного коду через Stack Frame:</tspan><tspan x="470.0" dy="14.3">Вказівник стека SP -&gt; StackFrame[6] = PC</tspan><tspan x="470.0" dy="14.3">Значення PC вказує на точну інструкцію (LDR / STR),</tspan><tspan x="470.0" dy="14.3">що спричинила збій.</tspan><tspan x="470.0" dy="14.3">Утиліта arm-none-eabi-addr2line перетворює</tspan><tspan x="470.0" dy="14.3">PC у точний файл і рядок вихідного коду C/C++.</tspan></text>
<rect x="710.0" y="40.0" width="240.0" height="450.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="830.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Реакція системи (Recovery)</text>
<rect x="725.0" y="90.0" width="210.0" height="80.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="830.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Сценарій А: Ізоляція задачі</tspan><tspan x="830.0" dy="11.7">- Збій стався у Unprivileged Thread</tspan><tspan x="830.0" dy="11.7">- Завершення винної задачі</tspan><tspan x="830.0" dy="11.7">- Звільнення ресурсів</tspan><tspan x="830.0" dy="11.7">- Сповіщення супервізора</tspan></text>
<rect x="725.0" y="180.0" width="210.0" height="80.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="830.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Сценарій Б: Перезапуск задачі</tspan><tspan x="830.0" dy="14.3">- Очищення стека задачі</tspan><tspan x="830.0" dy="14.3">- Скидання черг та м'ютексів</tspan><tspan x="830.0" dy="14.3">- Повторна ініціалізація</tspan><tspan x="830.0" dy="14.3">- Робота системи триває!</tspan></text>
<rect x="725.0" y="270.0" width="210.0" height="100.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="830.0" y="299.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Сценарій В: Паніка ядра</tspan><tspan x="830.0" dy="11.7">- Збій у Privileged Handler або MSP</tspan><tspan x="830.0" dy="11.7">- Запис Core Dump у EEPROM/Flash</tspan><tspan x="830.0" dy="11.7">- Переведення виходів у безпечний стан</tspan><tspan x="830.0" dy="11.7">- Кероване апаратне перезавантаження</tspan></text>
<rect x="725.0" y="380.0" width="210.0" height="95.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="830.0" y="413.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Очищення прапорців:</tspan><tspan x="830.0" dy="11.7">SCB-&gt;CFSR = SCB_CFSR_MEMFAULTSR_Msk;</tspan><tspan x="830.0" dy="11.7">(Запис 1 у біти помилок очищає їх</tspan><tspan x="830.0" dy="11.7">перед поверненням або рестартом)</tspan></text>
<line x1="230.0" y1="440.0" x2="260.0" y2="440.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="680.0" y1="130.0" x2="710.0" y2="130.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="680.0" y1="220.0" x2="710.0" y2="220.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="680.0" y1="310.0" x2="710.0" y2="310.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>