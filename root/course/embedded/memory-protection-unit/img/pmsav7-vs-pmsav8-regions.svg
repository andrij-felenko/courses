<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 992.75 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="992.75" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="500.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="25.0" y="35.0" width="455.0" height="455.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="252.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Архітектура PMSAv7 (ARMv7-M)</text>
<text x="252.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Cortex-M3 / M4 / M7</text>
<rect x="45.0" y="105.0" width="415.0" height="65.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="252.5" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">Розмір регіону: Ступінь двійки 2^N</tspan><tspan x="252.5" dy="14.3">Мінімум 32 байти, максимум 4 Гігабайти</tspan><tspan x="252.5" dy="14.3">(32B, 64B, 128B, 256B ... 512KB, 1MB, 4GB)</tspan></text>
<rect x="45.0" y="180.0" width="415.0" height="65.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="252.5" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">Суворе вирівнювання адреси:</tspan><tspan x="252.5" dy="14.3">Базова адреса мусить бути кратною розміру!</tspan><tspan x="252.5" dy="14.3">Приклад: регіон 64 КБ має починатися з 0x...0000</tspan></text>
<rect x="45.0" y="255.0" width="415.0" height="75.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="252.5" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">Субрегіони (Subregion Disable - SRD):</tspan><tspan x="252.5" dy="14.3">8 рівних частин (розмір / 8) для регіонів &gt;= 256 байт.</tspan><tspan x="252.5" dy="14.3">Маска 8 біт у MPU_RASR дозволяє вимикати окремі 1/8 частини.</tspan></text>
<rect x="45.0" y="340.0" width="415.0" height="65.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="252.5" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">Пріоритет перекриття (Overlap Priority):</tspan><tspan x="252.5" dy="14.3">При збігу кількох регіонів перемагає регіон</tspan><tspan x="252.5" dy="14.3">із найвищим числовим номером (регіон 7 &gt; регіон 0).</tspan></text>
<rect x="45.0" y="415.0" width="415.0" height="60.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="252.5" y="441.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">Регістри: MPU_RBAR (База + індекс) та</tspan><tspan x="252.5" dy="14.3">MPU_RASR (Розмір, SRD, права AP, атрибути TEX/C/B, XN)</tspan></text>
<rect x="500.0" y="35.0" width="455.0" height="455.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="727.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#14532d" text-anchor="middle" font-weight="700">Архітектура PMSAv8 (ARMv8-M)</text>
<text x="727.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">Cortex-M23 / M33 / M55 / M85</text>
<rect x="520.0" y="105.0" width="415.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="727.5" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="727.5" dy="0.0">Довільний розмір із кроком 32 байти:</tspan><tspan x="727.5" dy="14.3">Немає обмеження степенем двійки!</tspan><tspan x="727.5" dy="14.3">Будь-який блок пам'яті захищається точно за розміром.</tspan></text>
<rect x="520.0" y="180.0" width="415.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="727.5" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="727.5" dy="0.0">Гнучке вирівнювання (32-byte Alignment):</tspan><tspan x="727.5" dy="14.3">База (Base) та Ліміт (Limit) вирівнюються на 32 байти.</tspan><tspan x="727.5" dy="14.3">Розмір = (LimitAddress - BaseAddress) + 32 байти.</tspan></text>
<rect x="520.0" y="255.0" width="415.0" height="75.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="727.5" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="727.5" dy="0.0">Відсутність субрегіонів (No SRD):</tspan><tspan x="727.5" dy="14.3">Немає потреби у фрагментації та масці SRD,</tspan><tspan x="727.5" dy="14.3">оскільки межі задаються точно через Base та Limit.</tspan></text>
<rect x="520.0" y="340.0" width="415.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="727.5" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="727.5" dy="0.0">Заборона конфліктного перекриття:</tspan><tspan x="727.5" dy="14.3">Перекриття з різними атрибутами заборонено.</tspan><tspan x="727.5" dy="14.3">Спрощена й надійна апаратна перевірка без колізій.</tspan></text>
<rect x="520.0" y="415.0" width="415.0" height="60.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="727.5" y="448.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="727.5" dy="0.0">Регістри: MPU_RBAR (Base, AP, XN, SH) та MPU_RLAR (Limit, Enable, AttrIndx) + MPU_MAIR0/1 (Непрямі атрибути).</tspan></text>
</svg>