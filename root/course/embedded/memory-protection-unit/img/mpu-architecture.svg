<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="500.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="30.0" y="40.0" width="240.0" height="440.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="150.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Процесорне ядро Cortex-M</text>
<rect x="45.0" y="90.0" width="210.0" height="55.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="113.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Конвеєр виконання</tspan><tspan x="150.0" dy="15.6">(Instruction Pipeline)</tspan></text>
<rect x="45.0" y="155.0" width="210.0" height="55.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="178.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Регістри режиму доступу</tspan><tspan x="150.0" dy="15.6">(CONTROL.nPRIV, IPSR)</tspan></text>
<rect x="45.0" y="220.0" width="210.0" height="55.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="243.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Блок вибірки інструкцій</tspan><tspan x="150.0" dy="15.6">(Instruction Fetch Unit)</tspan></text>
<rect x="45.0" y="285.0" width="210.0" height="55.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Блок завантаження / запису</tspan><tspan x="150.0" dy="15.6">(Load / Store Unit - LSU)</tspan></text>
<rect x="45.0" y="360.0" width="210.0" height="100.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="150.0" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Векторний контролер</tspan><tspan x="150.0" dy="15.6">переривань NVIC / SCB</tspan><tspan x="150.0" dy="15.6">(Обробка винятків)</tspan></text>
<rect x="320.0" y="40.0" width="340.0" height="440.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="490.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle" font-weight="700">Блок захисту пам'яті (MPU)</text>
<rect x="340.0" y="90.0" width="300.0" height="45.0" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/><text x="490.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Керування MPU (MPU_CTRL, MPU_TYPE)</tspan><tspan x="490.0" dy="14.3">ENABLE / HFNMIENA / PRIVDEFENA</tspan></text>
<rect x="340.0" y="145.0" width="300.0" height="120.0" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/><text x="490.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Банк компараторів регіонів (0..N)</tspan><tspan x="490.0" dy="14.3">- Порівняння базової адреси та ліміту</tspan><tspan x="490.0" dy="14.3">- Оцінка прав доступу (AP: Priv / Unpriv)</tspan><tspan x="490.0" dy="14.3">- Перевірка виконання коду (XN)</tspan><tspan x="490.0" dy="14.3">- Пріоритет перекриття номерів</tspan></text>
<rect x="340.0" y="275.0" width="300.0" height="65.0" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/><text x="490.0" y="297.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Генератор атрибутів пам'яті</tspan><tspan x="490.0" dy="14.3">(Normal / Device, Кешованість,</tspan><tspan x="490.0" dy="14.3">Впорядкування операцій)</tspan></text>
<rect x="340.0" y="360.0" width="300.0" height="100.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="490.0" y="392.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Логіка фіксації порушень</tspan><tspan x="490.0" dy="14.3">- Формування винятку MemManage</tspan><tspan x="490.0" dy="14.3">- Запис бітів помилки в SCB-&gt;CFSR</tspan><tspan x="490.0" dy="14.3">- Фіксація адреси в SCB-&gt;MMFAR</tspan></text>
<rect x="710.0" y="40.0" width="240.0" height="440.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="830.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Шинна матриця та адреси</text>
<rect x="725.0" y="90.0" width="210.0" height="45.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="830.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Системна шина AHB / AXI</tspan><tspan x="830.0" dy="14.3">(Транзакція без затримок)</tspan></text>
<rect x="725.0" y="150.0" width="210.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="830.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Flash-пам'ять (Код / Конст)</tspan><tspan x="830.0" dy="13.0">0x08000000 (Priv RO / Unpriv RO)</tspan></text>
<rect x="725.0" y="220.0" width="210.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="830.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">SRAM (Стек, Купа, Дані)</tspan><tspan x="830.0" dy="14.3">0x20000000 (RW / Ізоляція)</tspan></text>
<rect x="725.0" y="290.0" width="210.0" height="60.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="830.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Периферія MMIO</tspan><tspan x="830.0" dy="14.3">0x40000000 (Device / XN)</tspan></text>
<rect x="725.0" y="360.0" width="210.0" height="100.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="830.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Системні регістри ядра PPB</tspan><tspan x="830.0" dy="14.3">0xE0000000 (NVIC, SCB, MPU)</tspan><tspan x="830.0" dy="14.3">Тільки Privileged доступ</tspan></text>
