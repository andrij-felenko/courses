<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія захисту криптографічних ключів у мікроконтролерних системах</text>
<rect x="30.0" y="70.0" width="265.0" height="355.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="2.0"/>
<rect x="62.7" y="74.2" width="198.6" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="162.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="162.0" dy="0.0">Рівень 0: Відкрита Flash</tspan><tspan x="162.0" dy="15.6">(Без захисту)</tspan></text>
<rect x="45.0" y="140.0" width="235.0" height="130.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="162.5" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Стан:</tspan><tspan x="162.5" dy="13.0">• Ключ зашитий у прошивку:</tspan><tspan x="162.5" dy="13.0">  const uint8_t key[] = {...}</tspan><tspan x="162.5" dy="13.0">• Порт SWD/JTAG відкритий.</tspan><tspan x="162.5" dy="13.0"></tspan><tspan x="162.5" dy="13.0">Атака:</tspan><tspan x="162.5" dy="13.0">Зчитування дампу через OpenOCD</tspan><tspan x="162.5" dy="13.0">/ J-Link за 3 секунди.</tspan></text>
<rect x="45.0" y="285.0" width="235.0" height="125.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="162.5" y="329.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="162.5" dy="0.0">Стійкість:</tspan><tspan x="162.5" dy="14.3">Нульова.</tspan><tspan x="162.5" dy="14.3">Будь-хто з $5 програматором</tspan><tspan x="162.5" dy="14.3">викрадає ключ повністю.</tspan></text>
<rect x="325.0" y="70.0" width="265.0" height="355.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/>
<rect x="354.0" y="74.2" width="206.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="457.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="457.0" dy="0.0">Рівень 1/2: Flash RDP</tspan><tspan x="457.0" dy="15.6">(STM32 RDP / ESP32 eFuse)</tspan></text>
<rect x="340.0" y="140.0" width="235.0" height="130.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="457.5" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="457.5" dy="0.0">Механізм:</tspan><tspan x="457.5" dy="13.0">• RDP 1: Заборона читання SWD,</tspan><tspan x="457.5" dy="13.0">  скид у Level 0 стирає Flash.</tspan><tspan x="457.5" dy="13.0">• RDP 2: Фізичне випалювання</tspan><tspan x="457.5" dy="13.0">  порту JTAG (назавжди).</tspan><tspan x="457.5" dy="13.0">• ESP32: Flash Encryption.</tspan></text>
<rect x="340.0" y="285.0" width="235.0" height="125.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="457.5" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="457.5" dy="0.0">Стійкість:</tspan><tspan x="457.5" dy="13.0">Захист від логічного аналізу.</tspan><tspan x="457.5" dy="13.0">Але RDP 1 вразливий до</tspan><tspan x="457.5" dy="13.0">глічінгу живлення (glitching)</tspan><tspan x="457.5" dy="13.0">та атак побічними каналами.</tspan></text>
<rect x="620.0" y="70.0" width="270.0" height="355.0" rx="8" fill="#f4faf5" stroke="#27ae60" stroke-width="2.0"/>
<rect x="648.3" y="74.2" width="213.4" height="47.6" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">Рівень 3: Secure Element</tspan><tspan x="755.0" dy="15.6">(ATECC608A / OPTIGA Trust)</tspan></text>
<rect x="635.0" y="140.0" width="240.0" height="130.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Механізм:</tspan><tspan x="755.0" dy="13.0">• Окремий захищений крипточип.</tspan><tspan x="755.0" dy="13.0">• Ключ НІКОЛИ не виходить на I2C.</tspan><tspan x="755.0" dy="13.0">• Апаратна сітка від decapping.</tspan><tspan x="755.0" dy="13.0">• Захист від DPA / DEMA.</tspan><tspan x="755.0" dy="13.0">• Виконує крипто всередині.</tspan></text>
<rect x="635.0" y="285.0" width="240.0" height="125.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="329.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">Стійкість:</tspan><tspan x="755.0" dy="14.3">Максимальна апаратна стійкість</tspan><tspan x="755.0" dy="14.3">проти фізичних лабораторій,</tspan><tspan x="755.0" dy="14.3">зондів та мікроскопів.</tspan></text>
</svg>