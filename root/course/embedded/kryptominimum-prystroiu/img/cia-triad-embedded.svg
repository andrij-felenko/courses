<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріада безпеки (CIA Triad) у вбудованих пристроях</text>
<rect x="40.0" y="70.0" width="250.0" height="310.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/>
<rect x="86.5" y="75.0" width="157.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Конфіденційність</tspan><tspan x="165.0" dy="16.9">(Confidentiality)</tspan></text>
<rect x="55.0" y="145.0" width="220.0" height="70.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="165.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від підглядання</text>
<text x="165.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Шифрування: AES-GCM / CTR</text>
<rect x="55.0" y="230.0" width="220.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/><text x="165.0" y="265.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Загроза:</tspan><tspan x="165.0" dy="14.3">пасивне перехоплення</tspan><tspan x="165.0" dy="14.3">(SDR, логічний аналізатор</tspan><tspan x="165.0" dy="14.3">на шині UART / SPI / RF).</tspan><tspan x="165.0" dy="14.3"></tspan><tspan x="165.0" dy="14.3">Без неї: дані читає будь-хто.</tspan></text>
<rect x="315.0" y="70.0" width="250.0" height="310.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.8"/>
<rect x="385.7" y="75.0" width="108.7" height="49.9" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Цілісність</tspan><tspan x="440.0" dy="16.9">(Integrity)</tspan></text>
<rect x="330.0" y="145.0" width="220.0" height="70.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="440.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від спотворень</text>
<text x="440.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Геш / MAC: SHA-256, Tag</text>
<rect x="330.0" y="230.0" width="220.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/><text x="440.0" y="265.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Загроза:</tspan><tspan x="440.0" dy="14.3">спотворення бітів завадою</tspan><tspan x="440.0" dy="14.3">або ін'єкція байтів у пакет.</tspan><tspan x="440.0" dy="14.3"></tspan><tspan x="440.0" dy="14.3">Увага: CRC ловить шум,</tspan><tspan x="440.0" dy="14.3">але безсила проти ворога!</tspan></text>
<rect x="590.0" y="70.0" width="250.0" height="310.0" rx="8" fill="#f8fafc" stroke="#c0392b" stroke-width="1.8"/>
<rect x="648.6" y="75.0" width="132.8" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="715.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Автентичність</tspan><tspan x="715.0" dy="16.9">(Authenticity)</tspan></text>
<rect x="605.0" y="145.0" width="220.0" height="70.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="715.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підтвердження джерела</text>
<text x="715.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Секретний MAC: HMAC / GMAC</text>
<rect x="605.0" y="230.0" width="220.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/><text x="715.0" y="265.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Загроза:</tspan><tspan x="715.0" dy="14.3">підробка відправника,</tspan><tspan x="715.0" dy="14.3">атака повтором (replay).</tspan><tspan x="715.0" dy="14.3"></tspan><tspan x="715.0" dy="14.3">Головне в IoT:</tspan><tspan x="715.0" dy="14.3">чужий пакет не виконається.</tspan></text>
</svg>