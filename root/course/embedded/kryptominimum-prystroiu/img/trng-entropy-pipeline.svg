<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тракт апаратного генератора справжніх випадкових чисел (TRNG)</text>
<rect x="30.0" y="80.0" width="180.0" height="240.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="45.2" y="82.3" width="149.6" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="120.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Фізичне джерело</tspan><tspan x="120.0" dy="14.3">шуму (Noise Source)</tspan></text>
<rect x="40.0" y="150.0" width="160.0" height="155.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="120.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">• Тепловий шум p-n</tspan><tspan x="120.0" dy="13.0">  переходу (Zener)</tspan><tspan x="120.0" dy="13.0">• Фазовий джитер</tspan><tspan x="120.0" dy="13.0">  кільцевих генераторів</tspan><tspan x="120.0" dy="13.0">  (Ring Oscillators)</tspan><tspan x="120.0" dy="13.0">• Шум внутрішнього АЦП</tspan><tspan x="120.0" dy="13.0">• Метастабільність SRAM</tspan></text>
<line x1="210.0" y1="200.0" x2="260.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="235.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">сирий бітпотік</text>
<rect x="260.0" y="80.0" width="190.0" height="240.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="297.3" y="82.3" width="115.5" height="45.3" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="355.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">Дерандомізатор</tspan><tspan x="355.0" dy="14.3">(Von Neumann)</tspan></text>
<rect x="270.0" y="150.0" width="170.0" height="155.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="355.0" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">Усунення зміщення (Bias):</tspan><tspan x="355.0" dy="13.0">• 00 → відкинути</tspan><tspan x="355.0" dy="13.0">• 11 → відкинути</tspan><tspan x="355.0" dy="13.0">• 01 → вихід 0</tspan><tspan x="355.0" dy="13.0">• 10 → вихід 1</tspan><tspan x="355.0" dy="13.0"></tspan><tspan x="355.0" dy="13.0">Результат:</tspan><tspan x="355.0" dy="13.0">суворе 50/50 без перекосу</tspan></text>
<line x1="450.0" y1="200.0" x2="500.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="475.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чисті біти</text>
<rect x="500.0" y="80.0" width="180.0" height="240.0" rx="8" fill="#ffffff" stroke="#c07a2e" stroke-width="1.8"/>
<rect x="508.4" y="82.3" width="163.2" height="45.3" rx="6" fill="#fdf0e6" stroke="#c07a2e" stroke-width="1.5"/><text x="590.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a5a1e" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Тести якості на льоту</tspan><tspan x="590.0" dy="14.3">(NIST SP 800-90B)</tspan></text>
<rect x="510.0" y="150.0" width="160.0" height="155.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="189.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Health Monitoring:</tspan><tspan x="590.0" dy="11.7">• Repetition Count Test</tspan><tspan x="590.0" dy="11.7">  (захист від зависання)</tspan><tspan x="590.0" dy="11.7">• Adaptive Proportion</tspan><tspan x="590.0" dy="11.7">  (контроль ентропії)</tspan><tspan x="590.0" dy="11.7"></tspan><tspan x="590.0" dy="11.7">Збій → генератор</tspan><tspan x="590.0" dy="11.7">блокує вихід і б'є тривогу</tspan></text>
<line x1="680.0" y1="200.0" x2="730.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="705.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ентропія</text>
<rect x="730.0" y="80.0" width="180.0" height="240.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<rect x="752.0" y="82.3" width="135.9" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="820.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">CSPRNG / DRBG</tspan><tspan x="820.0" dy="14.3">(CTR-DRBG / HMAC)</tspan></text>
<rect x="740.0" y="150.0" width="160.0" height="155.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Криптостійкий генератор:</tspan><tspan x="820.0" dy="13.0">• Періодичний reseed</tspan><tspan x="820.0" dy="13.0">• Швидкість: МБ/с</tspan><tspan x="820.0" dy="13.0">• Безпечні Nonce,</tspan><tspan x="820.0" dy="13.0">  сеансові ключі,</tspan><tspan x="820.0" dy="13.0">  сіль та IV</tspan></text>
<rect x="140.0" y="345.0" width="660.0" height="50.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="470.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Категорично заборонено: використовувати libc rand() / lrand48() у криптографії!</text>
<text x="470.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Лінійні генератори (LCG) передбачувані вже після перехоплення 2–3 послідовних чисел.</text>
</svg>