<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими симетричного шифрування AES: від вразливого ECB до AEAD</text>
<rect x="30.0" y="60.0" width="270.0" height="390.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="2.0"/>
<rect x="43.4" y="64.2" width="243.2" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="84.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">ECB Mode (Electronic Codebook)</tspan><tspan x="165.0" dy="15.6">ЗАБОРОНЕНО</tspan></text>
<rect x="45.0" y="125.0" width="240.0" height="48.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Блок 1: [AAAA] → AES(K) → [0x8F9C]</tspan><tspan x="165.0" dy="13.0">Блок 2: [AAAA] → AES(K) → [0x8F9C]</tspan></text>
<rect x="45.0" y="185.0" width="240.0" height="120.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="165.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Чому небезпечно:</tspan><tspan x="165.0" dy="13.0">• Однаковий відкритий блок</tspan><tspan x="165.0" dy="13.0">  дає однаковий шифротекст.</tspan><tspan x="165.0" dy="13.0">• Витікає структура даних (Tux).</tspan><tspan x="165.0" dy="13.0">• Вразливий до заміни блоків</tspan><tspan x="165.0" dy="13.0">  та підміни полів без ключа.</tspan></text>
<rect x="45.0" y="318.0" width="240.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="357.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Вирок:</tspan><tspan x="165.0" dy="14.3">Категорично заборонено</tspan><tspan x="165.0" dy="14.3">для будь-яких пакетів</tspan><tspan x="165.0" dy="14.3">та збереження в пам'яті.</tspan></text>
<rect x="335.0" y="60.0" width="270.0" height="390.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/>
<rect x="396.8" y="64.2" width="146.5" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="84.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">CBC / CTR Mode</tspan><tspan x="470.0" dy="15.6">Тільки шифрування</tspan></text>
<rect x="350.0" y="125.0" width="240.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">CTR: Keystream = AES(K, Nonce||Ctr)</tspan><tspan x="470.0" dy="13.0">Ciphertext = Plaintext ⊕ Keystream</tspan></text>
<rect x="350.0" y="185.0" width="240.0" height="120.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Особливості та пастки:</tspan><tspan x="470.0" dy="13.0">• CTR: потоковий, швидкий,</tspan><tspan x="470.0" dy="13.0">  без падінгу, паралельний.</tspan><tspan x="470.0" dy="13.0">• Смертельна пастка CTR:</tspan><tspan x="470.0" dy="13.0">  повтор Nonce нищить захист!</tspan><tspan x="470.0" dy="13.0">• Немає перевірки цілісності.</tspan></text>
<rect x="350.0" y="318.0" width="240.0" height="115.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="357.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Вирок:</tspan><tspan x="470.0" dy="14.3">Захищає від підглядання,</tspan><tspan x="470.0" dy="14.3">але НЕ захищає від підміни</tspan><tspan x="470.0" dy="14.3">байтів ворогом (Bit-flipping).</tspan></text>
<rect x="640.0" y="60.0" width="270.0" height="390.0" rx="8" fill="#f4faf5" stroke="#27ae60" stroke-width="2.0"/>
<rect x="686.9" y="64.2" width="176.2" height="47.6" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="84.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">GCM / CCM (AEAD Mode)</tspan><tspan x="775.0" dy="15.6">Золотий стандарт</tspan></text>
<rect x="655.0" y="125.0" width="240.0" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Шифрування: AES-CTR</tspan><tspan x="775.0" dy="13.0">Автентифікація: GHASH(C, AAD) → Tag</tspan></text>
<rect x="655.0" y="185.0" width="240.0" height="120.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Переваги AEAD:</tspan><tspan x="775.0" dy="13.0">• Одночасне шифрування даних</tspan><tspan x="775.0" dy="13.0">  і автентифікація заголовків (AAD).</tspan><tspan x="775.0" dy="13.0">• 16-байтний тег автентичності.</tspan><tspan x="775.0" dy="13.0">• Підроблений пакет відкидається</tspan><tspan x="775.0" dy="13.0">  ДО розшифрування.</tspan></text>
<rect x="655.0" y="318.0" width="240.0" height="115.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="357.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Вирок:</tspan><tspan x="775.0" dy="14.3">Єдино правильний вибір</tspan><tspan x="775.0" dy="14.3">для радіоканалів, мережі</tspan><tspan x="775.0" dy="14.3">та оновлення прошивки.</tspan></text>
</svg>