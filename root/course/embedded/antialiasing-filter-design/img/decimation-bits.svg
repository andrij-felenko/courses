<rect x="96.0" y="374.0" width="620.0" height="84.0" rx="6" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="406.0" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="406.0" dy="0.0">Сигнал у сусідніх відліках додається ЛІНІЙНО (×M), а некорельований шум — лише КОРЕНЕМ (×√M),</tspan><tspan x="406.0" dy="14.3">тож SNR росте як √M = +10·log₁₀M дБ. Один біт = 6.02 дБ, тому Δбіт = log₄ M: рівні сходинки.</tspan><tspan x="406.0" dy="14.3">Засторога: працює, лише поки у вході є некорельований шум рівня ≥ молодшого біта (зазвичай є).</tspan></text>
