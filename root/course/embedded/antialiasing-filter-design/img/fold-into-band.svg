<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="770" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="385.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чого боїмося: хвіст за fs/2 складається назад у смугу</text>
<rect x="80.0" y="84.0" width="136.4" height="216.0" fill="#27ae60" opacity="0.12"/>
<rect x="216.4" y="84.0" width="173.6" height="216.0" fill="#f4d35e" opacity="0.28"/>
<rect x="390.0" y="84.0" width="310.0" height="216.0" fill="#eef1f4" opacity="0.7"/>
<line x1="80.0" y1="78.0" x2="80.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="80.0" y1="300.0" x2="700.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="700.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">частота →</text>
<line x1="390.0" y1="76.0" x2="390.0" y2="304.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="390.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">fs/2 (дзеркало)</text>
<line x1="216.4" y1="82.0" x2="216.4" y2="300.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="216.4" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">fp</text>
<text x="148.2" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">захищена</text>
<text x="303.2" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a7d0a" text-anchor="middle">байдужа зона</text>
<line x1="501.6" y1="300.0" x2="501.6" y2="124.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="501.6" cy="124.0" r="4.0" fill="#6b7280" stroke="#ffffff" stroke-width="1.5"/>
<text x="501.6" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">залишок ВЧ-шуму</text>
<path d="M 501.6 134.0 Q 390.0 96.0 278.4 162.0" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<line x1="638.0" y1="300.0" x2="638.0" y2="154.0" stroke="#6b7280" stroke-width="3.0"/>
<text x="638.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ще вищий шум</text>
<path d="M 638.0 164.0 Q 420.0 88.0 142.0 140.0" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="142.0" y1="300.0" x2="142.0" y2="140.0" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="142.0" cy="140.0" r="4.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="142.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">аліас у смузі!</text>
<rect x="80.0" y="338.0" width="620.0" height="96.0" rx="6" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="390.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Усе, що фільтр не дотиснув вище fs/2, дзеркалиться вниз. Шум, що падає в БАЙДУЖУ зону (fp..fs/2),</tspan><tspan x="390.0" dy="13.0">не страшний — там корисного немає, його однаково виріже наступний цифровий фільтр. А от шум, що</tspan><tspan x="390.0" dy="13.0">склався в ЗАХИЩЕНУ смугу [0..fp], — катастрофа: він невідрізнянний від сигналу назавжди.</tspan><tspan x="390.0" dy="13.0">Тому АА-фільтр має забезпечити потрібне придушення САМЕ на fs/2 і вище — не нижче.</tspan></text>
</svg>