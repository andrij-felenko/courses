<rect x="95.0" y="372.0" width="580.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="385.0" y="391.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Полігон більшає → опір розтікання повільно росте (як ln b), а віддача з площі швидко падає.</tspan><tspan x="385.0" dy="13.0">Їхня сума спершу круто спадає, тоді виположується: з якогось радіуса дальня мідь холодна,</tspan><tspan x="385.0" dy="13.0">тож кожен наступний сантиметр майже не зменшує повний опір. (1 oz, природна конвекція.)</tspan></text>
