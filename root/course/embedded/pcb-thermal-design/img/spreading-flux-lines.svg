<text x="380.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">густі ізотерми</text>
<text x="380.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">крутий ΔT</text>
<text x="576.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">рідкі ізотерми:</text>
<text x="576.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">далеко майже немає</text>
<text x="576.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">перепаду</text>
<text x="180.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">увесь опір —</text>
<text x="180.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">у звуженні</text>
<rect x="70.0" y="356.0" width="620.0" height="96.0" rx="6" fill="#fff8ef" stroke="#c8731f" stroke-width="1.5"/><text x="380.0" y="387.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Тепло втискається з малого джерела в широку мідь — лінії потоку згущуються тільки коло нього.</tspan><tspan x="380.0" dy="13.7">Майже весь перепад ΔT накопичується в цьому тонкому шарі звуження; далі мідь холодна й нічого не</tspan><tspan x="380.0" dy="13.7">додає. Це й є опір розтікання. Електричний двійник той самий: струм із плямки в товщу металу</tspan><tspan x="380.0" dy="13.7">дає опір R = ρ/(4a) — теплова версія: R = 1/(4·k·a).</tspan></text>
</svg>