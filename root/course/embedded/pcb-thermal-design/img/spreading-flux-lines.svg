<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опір розтікання: лінії потоку тиснуться біля джерела</text>
<rect x="70.0" y="90.0" width="620.0" height="250.0" rx="4" fill="#f6e3cf" stroke="#c8731f" stroke-width="2.0"/>
<text x="682.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c8731f" text-anchor="end">широка мідь (k)</text>
<rect x="346.0" y="64.0" width="68.0" height="26.0" rx="3" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="380.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">джерело 2a</text>
<path d="M 352.0 90.0 C 352.0 160.0 149.4 240.0 149.4 334.0" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<path d="M 364.0 90.0 C 364.0 160.0 248.2 240.0 248.2 334.0" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<path d="M 376.0 90.0 C 376.0 160.0 347.1 240.0 347.1 334.0" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<path d="M 388.0 90.0 C 388.0 160.0 445.9 240.0 445.9 334.0" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<path d="M 400.0 90.0 C 400.0 160.0 544.7 240.0 544.7 334.0" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<path d="M 334.0 94.0 A 46.0 35.9 0 0 0 426.0 94.0" fill="none" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4,4" opacity="1.00"/>
<path d="M 306.0 94.0 A 74.0 57.7 0 0 0 454.0 94.0" fill="none" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4,4" opacity="0.80"/>
<path d="M 262.0 94.0 A 118.0 92.0 0 0 0 498.0 94.0" fill="none" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4,4" opacity="0.60"/>
