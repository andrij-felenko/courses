<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="800.0" height="450.0" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2.0"/>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Скінченний автомат термоконтролера (Thermal FSM)</text>
<rect x="45.0" y="175.0" width="125.0" height="80.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.0"/>
<text x="107.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">NORMAL</text>
<text x="107.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">100% потужність</text>
<text x="107.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle">Всі системи штатно</text>
<rect x="205.0" y="175.0" width="125.0" height="80.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.0"/>
<text x="267.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a16207" text-anchor="middle" font-weight="700">WARMING</text>
<text x="267.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle">Кулер / охолодження</text>
<text x="267.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#713f12" text-anchor="middle">Телеметрія 50 мс</text>
<rect x="365.0" y="160.0" width="145.0" height="110.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.0"/>
<text x="437.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">THROTTLED</text>
<rect x="375.0" y="200.0" width="125.0" height="60.0" rx="4" fill="#ffffff" stroke="#fdba74" stroke-width="1.0"/>
<text x="437.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle" font-weight="700">ПІ-контур:</text>
<text x="437.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7c2d12" text-anchor="middle">CPU DVFS / ШІМ</text>
<text x="437.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c2410c" text-anchor="middle" font-weight="700">K_throttle: 25..95%</text>
<rect x="545.0" y="175.0" width="125.0" height="80.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.0"/>
<text x="607.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">CRITICAL</text>
<text x="607.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Limp Mode</text>
<text x="607.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">Payload вимкнено</text>
<rect x="695.0" y="175.0" width="110.0" height="80.0" rx="8" fill="#450a0a" stroke="#991b1b" stroke-width="2.0"/>
<text x="750.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">SHUTDOWN</text>
<text x="750.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#fecaca" text-anchor="middle">EEPROM дамп</text>
<text x="750.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">eFuse OFF / Latch</text>
<line x1="170.0" y1="200.0" x2="205.0" y2="200.0" stroke="#ca8a04" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="187.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#a16207" text-anchor="middle" font-weight="700">T &gt; T_w</text>
<line x1="330.0" y1="200.0" x2="365.0" y2="200.0" stroke="#ea580c" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="347.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c2410c" text-anchor="middle" font-weight="700">T &gt; T_t</text>
<line x1="510.0" y1="200.0" x2="545.0" y2="200.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="527.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-weight="700">T &gt; T_c</text>
<line x1="670.0" y1="200.0" x2="695.0" y2="200.0" stroke="#7f1d1d" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="682.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle" font-weight="700">T &gt; T_s</text>
<line x1="570.0" y1="255.0" x2="480.0" y2="270.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a3412" text-anchor="middle">T &lt; T_c − ΔT  &amp;&amp;  t &gt;= t_dwell</text>
<line x1="390.0" y1="270.0" x2="300.0" y2="255.0" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle">T &lt; T_t − ΔT  &amp;&amp;  t &gt;= t_dwell</text>
<line x1="230.0" y1="255.0" x2="140.0" y2="255.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="180.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">T &lt; T_w − ΔT  &amp;&amp;  t &gt;= t_dwell</text>
<rect x="180.0" y="85.0" width="480.0" height="45.0" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="420.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">Захист від теплового удару (Thermal Shock Rate-of-Rise)</text>
<text x="420.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Якщо dT/dt &gt; 5 °C/с  →  Миттєвий перехід у CRITICAL або SHUTDOWN</text>
<line x1="420.0" y1="130.0" x2="607.0" y2="175.0" stroke="#b91c1c" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="45.0" y="365.0" width="760.0" height="85.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="425.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Параметри переходів автомата:</text>
<text x="425.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• T_w = 55 °C, T_t = 70 °C, T_c = 85 °C, T_s = 95 °C | Гістерезис ΔT = 5..8 °C</text>
<text x="425.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• t_dwell ≥ 5.0 с (таймер очікування для розсіювання теплової маси перед підвищенням потужності)</text>
</svg>