<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="800.0" height="420.0" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2.0"/>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Багаторівневий каскад термозахисту та діапазони регулювання</text>
<rect x="40.0" y="75.0" width="760.0" height="58.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<rect x="50.0" y="83.0" width="110.0" height="42.0" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="105.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">0–55 °C</text>
<text x="180.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="700">ШТАТНИЙ РЕЖИМ (NORMAL)</text>
<text x="180.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">100% продуктивність. Частота CPU макс, радіо 20 dBm, повний струм двигунів.</text>
<rect x="40.0" y="145.0" width="760.0" height="58.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
<rect x="50.0" y="153.0" width="110.0" height="42.0" rx="4" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
<text x="105.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">55–70 °C</text>
<text x="180.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a16207" text-anchor="start" font-weight="700">ПОПЕРЕДЖЕННЯ (WARMING)</text>
<text x="180.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">Вмикання охолодження / кулера. Підготовка буферів, прискорення телеметрії.</text>
<rect x="40.0" y="215.0" width="760.0" height="58.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<rect x="50.0" y="223.0" width="110.0" height="42.0" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
<text x="105.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">70–85 °C</text>
<text x="180.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="start" font-weight="700">АКТИВНИЙ ТРОТЛІНГ (THROTTLED)</text>
<text x="180.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">ПІ-регулювання: CPU DVFS (100%→25%), обмеження струму ШІМ, радіо 14 dBm.</text>
<rect x="40.0" y="285.0" width="760.0" height="58.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<rect x="50.0" y="293.0" width="110.0" height="42.0" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
<text x="105.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">85–95 °C</text>
<text x="180.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">КРИТИЧНИЙ РЕЖИМ (CRITICAL)</text>
<text x="180.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">Limp mode: скидання корисного навантаження, вимкнення підсвітки, мінімум такту.</text>
<rect x="40.0" y="355.0" width="760.0" height="58.0" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1.8"/>
<rect x="50.0" y="363.0" width="110.0" height="42.0" rx="4" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
<text x="105.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">&gt; 95 °C</text>
<text x="180.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700">АВАРІЙНЕ ВИМКНЕННЯ (SHUTDOWN)</text>
<text x="180.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="start">Збереження логу в EEPROM → розмикання eFuse / силове відсікання живлення.</text>
</svg>