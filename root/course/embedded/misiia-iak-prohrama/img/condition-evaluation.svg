<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="arrInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неблокуючий конвеєр оцінювання умов у польотному циклі автопілота</text>
<rect x="40.0" y="65.0" width="250.0" height="110.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="165.0" y="96.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">ТЕЛЕМЕТРІЯ ТА ДАВАЧІ</tspan><tspan x="165.0" dy="14.3">• GNSS: дистанція до точки</tspan><tspan x="165.0" dy="14.3">• Компас/IMU: кут рискання</tspan><tspan x="165.0" dy="14.3">• Таймер: dt від старту умови</tspan><tspan x="165.0" dy="14.3">• Батарея: напруга, струм, SoC</tspan></text>
<rect x="350.0" y="65.0" width="260.0" height="110.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.6"/><text x="480.0" y="96.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">ГЕЙТ ОЦІНКИ УМОВИ</tspan><tspan x="480.0" dy="14.3">CONDITION_DELAY: dt &amp;gt;= T</tspan><tspan x="480.0" dy="14.3">CONDITION_DISTANCE: dist &amp;lt;= D</tspan><tspan x="480.0" dy="14.3">CONDITION_YAW: |yaw - target| &amp;lt; eps</tspan><tspan x="480.0" dy="14.3">BATTERY_GUARD: soc &amp;gt;= limit</tspan></text>
<rect x="670.0" y="65.0" width="250.0" height="110.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/><text x="795.0" y="96.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">ДИСПЕТЧЕР ВИКОНАННЯ</tspan><tspan x="795.0" dy="14.3">• Умова TRUE: advance_pc()</tspan><tspan x="795.0" dy="14.3">• Умова FALSE: hold_state()</tspan><tspan x="795.0" dy="14.3">• Аварія: jump_emergency()</tspan><tspan x="795.0" dy="14.3">НЕ блокує навігаційний контур!</tspan></text>
<line x1="292.0" y1="120.0" x2="348.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrInk)" stroke-linecap="round"/>
<text x="320.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">виміри</text>
<line x1="612.0" y1="120.0" x2="668.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrInk)" stroke-linecap="round"/>
<text x="640.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">статус</text>
<rect x="40.0" y="205.0" width="880.0" height="240.0" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="480.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка всередині кванту часу 20 мс (50 Гц Main Loop)</text>
<rect x="60.0" y="255.0" width="195.0" height="160.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="157.5" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="157.5" dy="0.0">Такт t = 0 мс</tspan><tspan x="157.5" dy="13.7">NAV_WAYPOINT активний</tspan><tspan x="157.5" dy="13.7">Команда: CONDITION_DIST 50m</tspan><tspan x="157.5" dy="13.7">dist = 180m &amp;gt; 50m</tspan><tspan x="157.5" dy="13.7">-&gt; Результат: FALSE (вихід)</tspan></text>
<line x1="257.0" y1="335.0" x2="278.0" y2="335.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrInk)" stroke-linecap="round"/>
<rect x="280.0" y="255.0" width="195.0" height="160.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="377.5" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="377.5" dy="0.0">Такт t = 20 мс ... 1.2 с</tspan><tspan x="377.5" dy="13.7">Контур стабілізації працює</tspan><tspan x="377.5" dy="13.7">Мотори коригують крен/тангаж</tspan><tspan x="377.5" dy="13.7">dist = 120m -&gt; 80m -&gt; 52m</tspan><tspan x="377.5" dy="13.7">-&gt; Результат: FALSE (вихід)</tspan></text>
<line x1="477.0" y1="335.0" x2="498.0" y2="335.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrInk)" stroke-linecap="round"/>
<rect x="500.0" y="255.0" width="195.0" height="160.0" rx="8" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.6"/><text x="597.5" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="597.5" dy="0.0">Такт t = 1.24 с</tspan><tspan x="597.5" dy="13.7">dist = 48m &amp;lt;= 50m</tspan><tspan x="597.5" dy="13.7">Умову CONDITION_DIST виконано!</tspan><tspan x="597.5" dy="13.7">-&gt; Результат: TRUE</tspan><tspan x="597.5" dy="13.7">Запуск: DO_SET_SERVO 1900</tspan></text>
<line x1="697.0" y1="335.0" x2="718.0" y2="335.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrInk)" stroke-linecap="round"/>
<rect x="720.0" y="255.0" width="195.0" height="160.0" rx="8" fill="#f0f9ff" stroke="#2457d6" stroke-width="1.6"/><text x="817.5" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="817.5" dy="0.0">Такт t = 1.26 с</tspan><tspan x="817.5" dy="13.7">Сервопривід відкрито</tspan><tspan x="817.5" dy="13.7">Вказівник: seq := seq + 1</tspan><tspan x="817.5" dy="13.7">Перехід до наступного пункту</tspan><tspan x="817.5" dy="13.7">Політ триває без затримок</tspan></text>
