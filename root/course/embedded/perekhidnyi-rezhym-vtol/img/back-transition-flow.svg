<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зворотний перехід (Back-Transition) та затримка розкрутки роторів</text>
<rect x="50.0" y="60.0" width="170.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="135.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">1. Гальмування</tspan><tspan x="135.0" dy="14.3">(V = 22 → 14 м/с)</tspan><tspan x="135.0" dy="14.3">Тяга штовхача = 0,</tspan><tspan x="135.0" dy="14.3">фларе тангажу θ +5°</tspan></text>
<rect x="230.0" y="60.0" width="175.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#f39c12" stroke-width="1.8"/><text x="317.5" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="317.5" dy="0.0">2. Pre-spooling роторів</tspan><tspan x="317.5" dy="13.0">(V = 14 → 12 м/с)</tspan><tspan x="317.5" dy="13.0">Розкрутка моторів до idle,</tspan><tspan x="317.5" dy="13.0">компенсація лагу ESC</tspan></text>
<rect x="415.0" y="60.0" width="175.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/><text x="502.5" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="502.5" dy="0.0">3. Зрив потоку з крила</tspan><tspan x="502.5" dy="14.3">(V &lt; V_stall, 10 м/с)</tspan><tspan x="502.5" dy="14.3">L стрімко падає до 0,</tspan><tspan x="502.5" dy="14.3">ротори видають 100% T_v</tspan></text>
<rect x="600.0" y="60.0" width="170.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/><text x="685.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">4. Чисте висіння</tspan><tspan x="685.0" dy="14.3">(V &lt; 3 м/с)</tspan><tspan x="685.0" dy="14.3">Повний перехід у MC,</tspan><tspan x="685.0" dy="14.3">позиціонування GPS</tspan></text>
