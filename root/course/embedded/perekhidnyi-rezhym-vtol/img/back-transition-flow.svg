<text x="540.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Холодний старт роторів (затримка 500 мс)</text>
<rect x="400.0" y="290.0" width="110.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="455.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">Лаг ESC/мотора:</tspan><tspan x="455.0" dy="13.0">дефіцит тяги</tspan></text>
<rect x="50.0" y="425.0" width="720.0" height="40.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="410.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило зворотного переходу: підйомні ротори запускаються на холостий хід ДО входу в режим звалювання крила</text>
