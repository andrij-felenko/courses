<polyline points="90.0,380.0 260.0,380.0 280.0,340.0 380.0,340.0 410.0,240.0 720.0,240.0" fill="none" stroke="#27ae60" stroke-width="2.5"/>
<text x="540.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Штатний підхват з Pre-spool (H = const)</text>
