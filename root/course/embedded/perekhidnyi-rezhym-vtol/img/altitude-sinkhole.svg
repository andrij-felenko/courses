<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Небезпечна зона «провалу висоти» (Altitude Sink Hole)</text>
<line x1="70.0" y1="80.0" x2="70.0" y2="410.0" stroke="#333333" stroke-width="1.5"/>
<line x1="70.0" y1="410.0" x2="770.0" y2="410.0" stroke="#333333" stroke-width="1.5"/>
<text x="70.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Висота H (м)</text>
<text x="770.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Дистанція розгону X (м)</text>
<line x1="65.0" y1="140.0" x2="770.0" y2="140.0" stroke="#8c959f" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="60.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">50 м</text>
<text x="60.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">35 м</text>
<text x="60.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">0 м</text>
<line x1="70.0" y1="140.0" x2="760.0" y2="140.0" stroke="#27ae60" stroke-width="3.0"/>
<circle cx="70.0" cy="140.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<circle cx="480.0" cy="140.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<circle cx="760.0" cy="140.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Штатний перехід (L + T_v = m·g)</text>
<polyline points="70.0,140.0 280.0,140.0 330.0,155.0 400.0,220.0 470.0,290.0 540.0,310.0 620.0,295.0 720.0,240.0 760.0,220.0" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="6,3"/>
<circle cx="280.0" cy="140.0" r="6.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<line x1="280.0" y1="95.0" x2="280.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="200.0" y="55.0" width="160.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="70.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Передчасне вимкнення</tspan><tspan x="280.0" dy="14.3">роторів (V = 10 м/с)</tspan></text>
<line x1="470.0" y1="145.0" x2="470.0" y2="285.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="480.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Провал висоти ΔH = 15 м</text>
<text x="480.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">L(10 м/с) = 0.59 m·g</text>
<text x="480.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">Дефіцит сили = 0.41 m·g</text>
<circle cx="400.0" cy="220.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="400.0" y1="220.0" x2="400.0" y2="175.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="408.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">L_wing (недостатня)</text>
<line x1="400.0" y1="220.0" x2="400.0" y2="275.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="426.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" font-weight="700">m·g (вага апарата)</text>
<rect x="100.0" y="320.0" width="320.0" height="80.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="260.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому виникає Altitude Sink Hole:</text>
<text x="260.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1. L ∝ V²: при 10 м/с замість 13 м/с крило несе лише 59% ваги</text>
<text x="260.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2. Прискорення вниз a_z = -g · (1 - L/(m·g)) ≈ -4.0 м/с²</text>
<text x="260.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3. За 1.5 с розгону апарат втрачає &gt; 10 метрів висоти</text>
<rect x="550.0" y="340.0" width="210.0" height="60.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="655.0" y="359.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Аварійний підхват (Failsafe):</tspan><tspan x="655.0" dy="14.3">екстрений перезапуск роторів</tspan><tspan x="655.0" dy="14.3">при Vz &lt; -2.5 м/с</tspan></text>
</svg>