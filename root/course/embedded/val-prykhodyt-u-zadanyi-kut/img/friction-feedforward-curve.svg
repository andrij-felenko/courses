<line x1="267.0" y1="130.0" x2="267.0" y2="340.0" stroke="#64748b" stroke-width="1.5"/>
<text x="465.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="end" font-weight="700">ω (швидкість)</text>
<text x="275.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">τ_fric (момент тертя)</text>
