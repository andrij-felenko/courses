<text x="285.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">+τ_stiction (зрив)</text>
<text x="250.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">−τ_stiction</text>
<line x1="310.0" y1="200.0" x2="310.0" y2="235.0" stroke="#94a3b8" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="315.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0284c7" text-anchor="start">Кулонівське тертя τ_c</text>
<text x="440.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">В'язке тертя: k_v · ω</text>
<rect x="55.0" y="360.0" width="425.0" height="80.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="267.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Головна пастка: при нульовій швидкості тертя найвище!</text>
<text x="267.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ПІД-регулятор запізнюється зі створенням моменту страгування,</text>
<text x="267.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">що породжує зону застопорення (Dead Zone) і затримку старту</text>
<rect x="535.0" y="60.0" width="475.0" height="395.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="772.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Алгоритм Stiction &amp; Dynamic Feedforward</text>
<text x="772.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Миттєве додавання розрахованого моменту до уставки струму</text>
<rect x="560.0" y="120.0" width="425.0" height="230.0" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
