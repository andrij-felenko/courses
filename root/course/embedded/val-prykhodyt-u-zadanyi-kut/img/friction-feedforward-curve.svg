<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель тертя механічного приводу та функція прямої компенсації (Feedforward)</text>
<rect x="30.0" y="60.0" width="475.0" height="395.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="267.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Фізична характеристика тертя вала</text>
<text x="267.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тертя спокою (Stiction) + ефект Страйбека + в'язке тертя</text>
<rect x="55.0" y="120.0" width="425.0" height="230.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
