<line x1="772.0" y1="130.0" x2="772.0" y2="340.0" stroke="#64748b" stroke-width="1.5"/>
<text x="970.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="end" font-weight="700">ω* (задана)</text>
<text x="780.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">τ_ff (добавка)</text>
<path d="M 772.0,235.0 L 776.0,185.0 L 850.0,185.0 L 960.0,155.0" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 772.0,235.0 L 768.0,285.0 L 694.0,285.0 L 584.0,315.0" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linejoin="round"/>
<text x="850.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">+τ_c + k_v·ω*</text>
<text x="690.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">−τ_c − k_v·ω*</text>
<text x="785.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Stiction-імпульс</text>
<rect x="560.0" y="360.0" width="425.0" height="80.0" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.0"/>
<text x="772.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">Формула повного моменту випередження:</text>
<text x="772.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="700">τ_cmd = τ_PID + J·α* + τ_coulomb·sgn(ω*) + k_v·ω* + τ_gravity(θ)</text>
<text x="772.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Похибка регулювання падає до 5–10 разів без зміни коефіцієнтів ПІД</text>
</svg>