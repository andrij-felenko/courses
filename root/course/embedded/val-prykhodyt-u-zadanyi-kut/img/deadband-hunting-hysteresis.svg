<text x="267.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Вал зупинився з помилкою в 1 тік енкодера (e = +1)</text>
<text x="267.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2. P-момент замалий, але I-складова невпинно росте</text>
<text x="267.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">3. Момент перевищує тертя спокою → вал різко зривається</text>
<text x="267.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">4. Вал перелітає ціль на e = −1 → процес повторюється назад</text>
