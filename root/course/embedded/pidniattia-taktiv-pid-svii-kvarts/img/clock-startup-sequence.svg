<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930.1 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930.1" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпечна послідовність підняття робочої частоти мікроконтролера</text>
<rect x="13.1" y="82.2" width="197.8" height="55.6" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="112.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="112.0" dy="0.0">1. Живлення &amp; Flash</tspan><tspan x="112.0" dy="14.3">Ввімкнути VOS/Overdrive</tspan><tspan x="112.0" dy="14.3">Встановити Flash Latency (WS)</tspan></text>
<line x1="189.0" y1="110.0" x2="209.0" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="205.9" y="82.2" width="160.2" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="286.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="286.0" dy="0.0">2. Запуск HSE</tspan><tspan x="286.0" dy="14.3">HSEON = 1 у RCC_CR</tspan><tspan x="286.0" dy="14.3">Чекати HSERDY + таймаут</tspan></text>
<line x1="363.0" y1="110.0" x2="383.0" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="376.8" y="82.2" width="166.5" height="55.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">3. Налаштування PLL</tspan><tspan x="460.0" dy="14.3">Записати M, N, P, Q</tspan><tspan x="460.0" dy="14.3">PLLON = 1, чекати PLLRDY</tspan></text>
<line x1="537.0" y1="110.0" x2="557.0" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="532.0" y="82.2" width="204.1" height="55.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="634.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="634.0" dy="0.0">4. Дільники шин</tspan><tspan x="634.0" dy="14.3">AHB (/1), APB1 (/4), APB2 (/2)</tspan><tspan x="634.0" dy="14.3">у регістрі RCC_CFGR</tspan></text>
<line x1="711.0" y1="110.0" x2="731.0" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="706.0" y="82.2" width="204.1" height="55.6" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="808.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="808.0" dy="0.0">5. Вибір SYSCLK</tspan><tspan x="808.0" dy="14.3">SW = PLL, чекати SWS = PLL</tspan><tspan x="808.0" dy="14.3">Увімкнути CSS (Clock Security)</tspan></text>
<rect x="40.0" y="209.3" width="840.0" height="41.3" rx="6" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1.0"/><text x="460.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="460.0" dy="0.0">Критичне правило: латентність Flash та напруга ядра (VOS) збільшуються ДО підняття частоти.</tspan><tspan x="460.0" dy="14.3">При зниженні частоти порядок суворо зворотний: спершу перемикання SYSCLK, а потім зменшення затримок Flash.</tspan></text>
</svg>