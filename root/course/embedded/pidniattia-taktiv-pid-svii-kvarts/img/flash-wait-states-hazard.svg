<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка затримок читання Flash (Wait States) при підвищенні частоти</text>
<rect x="60.0" y="56.3" width="180.0" height="37.3" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="71.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Без затримок (0 WS)</tspan><tspan x="150.0" dy="14.3">168 МГц (T = 5.95 нс)</tspan></text>
<rect x="260.0" y="60.0" width="100.0" height="30.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="310.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Такт 1 (5.95 нс)</text>
<rect x="365.0" y="60.0" width="160.0" height="30.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="445.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Flash ще зчитує комірку...</text>
<rect x="530.0" y="60.0" width="320.0" height="30.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="690.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ядро забирає шум ──&gt; HardFault (IBUSERR)</text>
<rect x="60.0" y="146.3" width="180.0" height="37.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Із затримками (5 WS)</tspan><tspan x="150.0" dy="14.3">168 МГц (T = 5.95 нс)</tspan></text>
<rect x="260.0" y="150.0" width="80.0" height="30.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="300.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Такт 0 (Адреса)</text>
<rect x="345.0" y="150.0" width="200.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="445.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">5 тактів очікування WS (29.75 нс)</text>
<rect x="550.0" y="150.0" width="300.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="700.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Дані зафіксовані ──&gt; Валідна інструкція</text>
<rect x="20.0" y="229.3" width="840.0" height="41.3" rx="6" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1.0"/><text x="440.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="440.0" dy="0.0">Час доступу матриці Flash становить 25–30 нс. Якщо процесор звертається до пам'яті швидше, ніж завершиться</tspan><tspan x="440.0" dy="14.3">перехідний процес у чутливих підсилювачах, на шину інструкцій потрапляє сміття, що викликає апаратний збій.</tspan></text>
</svg>