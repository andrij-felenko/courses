<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аварійне перемикання Clock Security System (CSS) при зриві генерації</text>
<rect x="35.0" y="72.2" width="170.0" height="55.6" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Зовнішній кварц (HSE)</tspan><tspan x="120.0" dy="14.3">Зрив коливань:</tspan><tspan x="120.0" dy="14.3">тріщина, обрив, удар</tspan></text>
<rect x="255.0" y="65.0" width="210.0" height="69.9" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="82.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Апаратний детектор CSS</tspan><tspan x="360.0" dy="14.3">RC-таймаут виявив зупинку:</tspan><tspan x="360.0" dy="14.3">1. SYSCLK ──&gt; HSI (16 МГц)</tspan><tspan x="360.0" dy="14.3">2. PLLON ──&gt; 0 (Вимкнено)</tspan></text>
<line x1="205.0" y1="100.0" x2="255.0" y2="100.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="57.9" width="240.0" height="84.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Генерація NMI винятку</tspan><tspan x="660.0" dy="14.3">Обробник NMI_Handler():</tspan><tspan x="660.0" dy="14.3">1. Безпечний стан (стоп ШІМ)</tspan><tspan x="660.0" dy="14.3">2. Очищення CSSC</tspan><tspan x="660.0" dy="14.3">3. Сповіщення або рестарт</tspan></text>
<line x1="465.0" y1="100.0" x2="540.0" y2="100.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="209.3" width="840.0" height="41.3" rx="6" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1.0"/><text x="450.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="450.0" dy="0.0">CSS не дає процесору зависнути намертво при фізичній втраті тактового сигналу HSE.</tspan><tspan x="450.0" dy="14.3">Апаратне перемикання на внутрішній HSI відбувається миттєво, а переривання NMI не можна заблокувати програмно.</tspan></text>
</svg>