<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тракт тактування мікроконтролера: від резонатора до периферії</text>
<rect x="30.0" y="58.2" width="140.0" height="43.6" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="100.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">HSE (Кварц)</tspan><tspan x="100.0" dy="15.6">8–25 МГц</tspan></text>
<rect x="30.0" y="133.2" width="140.0" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="100.0" y="151.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="100.0" dy="0.0">HSI (Внутр. RC)</tspan><tspan x="100.0" dy="15.6">16 МГц (±1%)</tspan></text>
<rect x="194.1" y="58.2" width="111.8" height="43.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Дільник /M</tspan><tspan x="250.0" dy="15.6">(вхід 1–2 МГц)</tspan></text>
<line x1="170.0" y1="80.0" x2="195.0" y2="80.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="321.9" y="56.2" width="176.2" height="47.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/><text x="410.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">PLL (PFD + VCO ×N)</tspan><tspan x="410.0" dy="15.6">Діапазон: 100–432 МГц</tspan></text>
<line x1="305.0" y1="80.0" x2="325.0" y2="80.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
