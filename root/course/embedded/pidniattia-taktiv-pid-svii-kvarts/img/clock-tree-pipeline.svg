<rect x="514.4" y="136.3" width="131.1" height="37.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="580.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Дільник /Q</tspan><tspan x="580.0" dy="14.3">(USB 48 МГц / SDIO)</tspan></text>
<line x1="495.0" y1="80.0" x2="515.0" y2="80.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="495.0" y1="95.0" x2="515.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="640.4" y="59.3" width="159.2" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">SYSCLK Мультиплексор</tspan><tspan x="720.0" dy="14.3">(SW: HSI / HSE / PLL)</tspan></text>
<line x1="645.0" y1="80.0" x2="650.0" y2="80.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="170.0" y1="155.0" x2="650.0" y2="95.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="810.0" y="59.3" width="120.0" height="41.3" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="870.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Шина AHB (HCLK)</tspan><tspan x="870.0" dy="14.3">Ядро, Flash, DMA</tspan></text>
<line x1="790.0" y1="80.0" x2="810.0" y2="80.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="600.0" y="217.2" width="240.0" height="55.6" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.2"/><text x="720.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Шина APB1 (/4)</tspan><tspan x="720.0" dy="14.3">PCLK1 = 42 МГц (макс. 45 МГц)</tspan><tspan x="720.0" dy="14.3">Таймери TIM2–TIM7 (×2 = 84 МГц)</tspan></text>
<rect x="240.0" y="217.2" width="240.0" height="55.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="360.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Шина APB2 (/2)</tspan><tspan x="360.0" dy="14.3">PCLK2 = 84 МГц (макс. 90 МГц)</tspan><tspan x="360.0" dy="14.3">Таймери TIM1, TIM8 (×2 = 168 МГц)</tspan></text>
<line x1="870.0" y1="115.0" x2="780.0" y2="215.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="850.0" y1="115.0" x2="450.0" y2="215.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="304.4" width="860.0" height="41.3" rx="6" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1.0"/><text x="480.0" y="321.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="480.0" dy="0.0">Дільник /M формує частоту порівняння 1–2 МГц; VCO множить її до сотень мегагерц.</tspan><tspan x="480.0" dy="14.3">Дільники шин гарантують безпечні частоти периферії, а множник таймерів (×2) подвоює тактування при APB &gt; 1.</tspan></text>
</svg>