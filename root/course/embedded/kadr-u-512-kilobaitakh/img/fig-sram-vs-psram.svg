<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішній SRAM проти зовнішньої PSRAM: пропускна здатність і затримки</text>
<rect x="30.0" y="55.0" width="440.0" height="310.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="45.0" y="68.0" width="410.0" height="32.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="250.0" y="88.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Внутрішня SRAM (128–512 КБ)</tspan></text>
<rect x="50.0" y="115.0" width="400.0" height="48.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="250.0" y="135.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">• Прямий доступ через 32/64-бітну шину AXI/AHB</tspan><tspan x="250.0" dy="14.3">• Затримка доступу: 1 такт процесора (0 wait-states)</tspan></text>
<rect x="50.0" y="172.0" width="400.0" height="48.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="250.0" y="192.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">• DMA пише напряму в RAM без участі CPU</tspan><tspan x="250.0" dy="14.3">• Немає конфліктів кешу та затримок витіснення</tspan></text>
<rect x="50.0" y="230.0" width="400.0" height="115.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="250.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Головний глухий кут внутрішнього SRAM:</text>
<text x="250.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">VGA 640×480 RGB888 = 921 КБ (НЕ ВМІЩАЄТЬСЯ)</tspan><tspan x="250.0" dy="13.7">VGA 640×480 RGB565 / YUV = 614 КБ (НЕ ВМІЩАЄТЬСЯ)</tspan><tspan x="250.0" dy="13.7">Доступний суцільний Heap: лише 180–320 КБ</tspan></text>
<rect x="490.0" y="55.0" width="440.0" height="310.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="505.0" y="68.0" width="410.0" height="32.0" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="710.0" y="88.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#3730a3" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Зовнішня PSRAM (Quad / Octal SPI 2–8 МБ)</tspan></text>
<rect x="510.0" y="115.0" width="400.0" height="48.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="710.0" y="135.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">• Величезна ємність: кадр 640×480 або 1600×1200</tspan><tspan x="710.0" dy="14.3">• Доступ відображається в адресний простір через MMU</tspan></text>
<rect x="510.0" y="172.0" width="400.0" height="48.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="710.0" y="192.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">• Доступ проходить крізь контролер Flash/PSRAM Cache</tspan><tspan x="710.0" dy="14.3">• Потребує періодичного самооновлення (Self-Refresh)</tspan></text>
<rect x="510.0" y="230.0" width="400.0" height="115.0" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="710.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Прихована ціна та пастки PSRAM:</text>
<text x="710.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Затримка промаху кешу (Cache Miss): 15–40 тактів CPU</tspan><tspan x="710.0" dy="13.7">Шинні колізії (Bus Contention) між DMA та ядром</tspan><tspan x="710.0" dy="13.7">Стеля швидкості: QSPI 80 МГц ≈ 40 МБ/с (падає FPS)</tspan></text>
<rect x="30.0" y="385.0" width="900.0" height="115.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="480.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Інженерне вирішення дилеми пам'яті:</text>
<rect x="50.0" y="425.0" width="270.0" height="60.0" rx="4" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
<text x="185.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Сирий кадр VGA (YUV422)</text>
<text x="185.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">614.4 КБ (потребує PSRAM)</text>
<rect x="345.0" y="425.0" width="270.0" height="60.0" rx="4" fill="#ffffff" stroke="#4ade80" stroke-width="1.2"/>
<text x="480.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Апаратний JPEG на сенсорі</text>
<text x="480.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">15–40 КБ (вміщається в SRAM)</text>
<rect x="640.0" y="425.0" width="270.0" height="60.0" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
<text x="775.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">Потоковий Line/Chunk DMA</text>
<text x="775.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">2 × 2 КБ = 4 КБ у швидкому SRAM</text>
</svg>