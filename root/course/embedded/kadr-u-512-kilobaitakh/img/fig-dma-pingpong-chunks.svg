<rect x="240.0" y="209.0" width="330.0" height="48.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="405.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="405.0" dy="0.0">DMA наповнює буфер поточними байтами з DVP.</tspan><tspan x="405.0" dy="13.0">Переривання по закінченню дескриптора (EOF).</tspan></text>
<rect x="230.0" y="305.0" width="350.0" height="92.0" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
<text x="405.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a16207" text-anchor="middle" font-weight="700">Буфер B (2048 байтів) [CPU ОБРОБКА]</text>
<rect x="240.0" y="339.0" width="330.0" height="48.0" rx="6" fill="#ffffff" stroke="#fde047" stroke-width="1.5"/><text x="405.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle"><tspan x="405.0" dy="0.0">CPU валідує SOI/EOI маркери, формує заголовок</tspan><tspan x="405.0" dy="13.0">пакета й відправляє чанк у мережевий стек.</tspan></text>
