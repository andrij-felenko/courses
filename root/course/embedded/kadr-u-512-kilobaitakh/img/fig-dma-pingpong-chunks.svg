<rect x="670.0" y="162.0" width="230.0" height="34.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="785.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle"><tspan x="785.0" dy="0.0">Заголовок: [Magic|ID|Idx|Len|CRC]</tspan><tspan x="785.0" dy="12.3">Корисне навантаження: 1400 Б (MTU)</tspan></text>
