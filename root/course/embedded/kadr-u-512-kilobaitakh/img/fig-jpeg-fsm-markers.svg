<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат (FSM) розбору потоку JPEG та виявлення маркерів</text>
<rect x="20.0" y="50.0" width="920.0" height="450.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="45.0" y="140.0" width="185.0" height="120.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="137.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">IDLE / WAIT_FRAME</text>
<rect x="53.0" y="176.0" width="169.0" height="74.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="137.5" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle"><tspan x="137.5" dy="0.0">Очікування старту VSYNC.</tspan><tspan x="137.5" dy="11.7">Скидання лічильника байтів.</tspan><tspan x="137.5" dy="11.7">Ігнорування сміття шини.</tspan></text>
<rect x="275.0" y="140.0" width="185.0" height="120.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="367.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">SEARCH_SOI</text>
<rect x="283.0" y="176.0" width="169.0" height="74.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="367.5" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle"><tspan x="367.5" dy="0.0">Сканування потоку байтів.</tspan><tspan x="367.5" dy="11.7">Пошук маркера:</tspan><tspan x="367.5" dy="11.7">0xFF, 0xD8 (Start of Image).</tspan><tspan x="367.5" dy="11.7">Відкидання паддінгу.</tspan></text>
<rect x="505.0" y="140.0" width="185.0" height="120.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
<text x="597.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a16207" text-anchor="middle" font-weight="700">STREAM_PAYLOAD</text>
<rect x="513.0" y="176.0" width="169.0" height="74.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="597.5" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle"><tspan x="597.5" dy="0.0">Запис байтів у чанк-буфер.</tspan><tspan x="597.5" dy="11.7">Підрахунок контрольної суми.</tspan><tspan x="597.5" dy="11.7">Відправка пакета при 1400 Б.</tspan><tspan x="597.5" dy="11.7">Паралельний пошук 0xFF 0xD9.</tspan></text>
<rect x="735.0" y="140.0" width="185.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="827.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">FRAME_COMPLETE</text>
<rect x="743.0" y="176.0" width="169.0" height="74.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="827.5" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle"><tspan x="827.5" dy="0.0">Знайдено маркер:</tspan><tspan x="827.5" dy="13.0">0xFF, 0xD9 (End of Image).</tspan><tspan x="827.5" dy="13.0">Відправка фінального чанка</tspan><tspan x="827.5" dy="13.0">з прапором LAST_CHUNK.</tspan></text>
<line x1="230.0" y1="200.0" x2="275.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="252.5" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle" font-weight="700">VSYNC High</text>
<line x1="460.0" y1="200.0" x2="505.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="482.5" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">SOI (FF D8)</text>
<line x1="690.0" y1="200.0" x2="735.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="712.5" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700">EOI (FF D9)</text>
<line x1="827.5" y1="260.0" x2="827.5" y2="290.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="827.5" y1="290.0" x2="137.5" y2="290.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="137.5" y1="290.0" x2="137.5" y2="260.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="350.0" y="278.0" width="260.0" height="24.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="480.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Скидання стану перед новим кадром (VSYNC Low)</tspan></text>
<line x1="597.5" y1="140.0" x2="597.5" y2="115.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="597.5" y1="115.0" x2="137.5" y2="115.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="137.5" y1="115.0" x2="137.5" y2="140.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210.0" y="103.0" width="280.0" height="24.0" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/><text x="350.0" y="111.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Помилка: VSYNC впав до EOI (Drop Frame)</tspan></text>
<rect x="40.0" y="365.0" width="880.0" height="105.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="480.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Маркери формату JPEG та їх призначення у потоковому DVP-драйвері:</text>
<rect x="60.0" y="401.0" width="260.0" height="56.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="190.0" y="419.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="190.0" dy="0.0">0xFF 0xD8 (SOI — Start of Image)</tspan><tspan x="190.0" dy="13.0">Початок корисного тіла кадру.</tspan><tspan x="190.0" dy="13.0">Все до цього маркера є сміттям.</tspan></text>
<rect x="350.0" y="401.0" width="260.0" height="56.0" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/><text x="480.0" y="419.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle"><tspan x="480.0" dy="0.0">0xFF 0x00 (Byte Stuffing у JPEG)</tspan><tspan x="480.0" dy="13.0">Екранування байта 0xFF всередині</tspan><tspan x="480.0" dy="13.0">ентропійного потоку Хаффмана.</tspan></text>
<rect x="640.0" y="401.0" width="260.0" height="56.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="770.0" y="419.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle"><tspan x="770.0" dy="0.0">0xFF 0xD9 (EOI — End of Image)</tspan><tspan x="770.0" dy="13.0">Кінець кадру. Сенсор може далі</tspan><tspan x="770.0" dy="13.0">гнати нулі або 0xFF до VSYNC Low.</tspan></text>
</svg>