<rect x="60.0" y="460.0" width="880.0" height="46.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="500.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Ключовий принцип: моніторинг ДО діода бачить обрив за 1 мкс, поки діод блокує витік енергії з C_hold назад у вхідну мережу.</text>
<text x="500.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Це дає повний запас енергії буфера для живлення DC-DC та бекапу без жодних паразитних втрат.</text>
