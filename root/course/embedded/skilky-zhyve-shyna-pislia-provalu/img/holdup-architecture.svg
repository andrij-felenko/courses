<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна топологія захисту від знеструмлення: детектування ДО діода</text>
<text x="500.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Розділення точок вимірювання та накопичення заряду для максимального вікна реакції</text>
