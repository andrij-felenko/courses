<rect x="788.2" y="150.9" width="183.7" height="88.2" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/><text x="880.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Мікроконтролер (MCU)</tspan><tspan x="880.0" dy="14.3">• NMI / PVD переривання</tspan><tspan x="880.0" dy="14.3">• Load Shedding (GPIO=0)</tspan><tspan x="880.0" dy="14.3">• Екстрений запис</tspan><tspan x="880.0" dy="14.3">• Стан сну перед BOR</tspan></text>
<line x1="880.0" y1="265.0" x2="880.0" y2="345.0" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="804.9" y="356.1" width="150.2" height="57.8" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Пам'ять стану:</tspan><tspan x="880.0" dy="13.7">FRAM / MRAM / Flash</tspan><tspan x="880.0" dy="13.7">(Заздалегідь стерта)</tspan></text>
<line x1="360.0" y1="260.0" x2="765.0" y2="260.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="765.0" y1="260.0" x2="795.0" y2="230.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="580.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Сигнал тривоги NMI / EXTI (0.5 мкс)</text>
