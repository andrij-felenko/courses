<line x1="690.0" y1="305.0" x2="690.0" y2="355.0" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="617.3" y="367.0" width="145.4" height="56.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="385.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Вторинна периферія:</tspan><tspan x="690.0" dy="13.0">Дисплей, Радіо, Мотори</tspan><tspan x="690.0" dy="13.0">(Миттєво вимикаються)</tspan></text>
