<line x1="145.0" y1="150.0" x2="245.0" y2="150.0" stroke="#1e293b" stroke-width="2.0"/>
<circle cx="195.0" cy="150.0" r="3.5" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
