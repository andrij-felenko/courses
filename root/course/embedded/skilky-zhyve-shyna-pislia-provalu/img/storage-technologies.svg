<text x="500.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Золотий стандарт для надійних MCU-пристроїв: Полімерний тантал або комбінація MLCC + Тантал на високовольтній шині 12–24 В.</text>
