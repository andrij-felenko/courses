<rect x="85.0" y="330.5" width="370.0" height="69.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">БЕЗ ДЖИТЕРА (жорсткий таймер):</tspan><tspan x="270.0" dy="13.0">100 датчиків увімкнулися одночасно</tspan><tspan x="270.0" dy="13.0">→ шлють HB кожні строго 1000 мс</tspan><tspan x="270.0" dy="13.0">→ шторм колізій в ефірі щосекунди.</tspan></text>
<rect x="485.0" y="330.5" width="390.0" height="69.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">З ДЖИТЕРОМ (рандомізація ±15%):</tspan><tspan x="680.0" dy="13.0">Період = T_hb ± rand(-0.15, +0.15) × T_hb</tspan><tspan x="680.0" dy="13.0">→ фази імпульсів розмазуються в часі</tspan><tspan x="680.0" dy="13.0">→ навантаження на канал рівномірне.</tspan></text>
