<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому апаратний лінк не гарантує життя вузла</text>
<rect x="44.0" y="60.0" width="276.0" height="440.0" rx="10" fill="#fffaf0" stroke="#d97706" stroke-width="1.8"/>
<text x="182.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9a5b00" text-anchor="middle" font-weight="700">1. Завис процесор / ОС</text>
<rect x="64.0" y="110.0" width="105.0" height="70.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="116.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хост A</text>
<text x="116.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Чекає дані</text>
<rect x="194.0" y="110.0" width="105.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="246.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вузол B</text>
<text x="246.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">HardFault / Lock</text>
<line x1="169.0" y1="145.0" x2="194.0" y2="145.0" stroke="#27ae60" stroke-width="3.0"/>
<circle cx="181.0" cy="132.0" r="4.0" fill="#27ae60" stroke="none" stroke-width="0.0"/>
<text x="181.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">PHY UP</text>
<rect x="59.0" y="210.1" width="246.0" height="139.7" rx="6" fill="#ffffff" stroke="#e0caa0" stroke-width="1.5"/><text x="182.0" y="229.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="182.0" dy="0.0">Апаратний трансивер</tspan><tspan x="182.0" dy="13.7">(Ethernet PHY, CAN-чіп,</tspan><tspan x="182.0" dy="13.7">RS-485 драйвер) живиться</tspan><tspan x="182.0" dy="13.7">і тримає несучу частоту</tspan><tspan x="182.0" dy="13.7">або рівень шини.</tspan><tspan x="182.0" dy="13.7"></tspan><tspan x="182.0" dy="13.7">Процесор ядра завис</tspan><tspan x="182.0" dy="13.7">у мертвому циклі й не шле</tspan><tspan x="182.0" dy="13.7">жодних корисних команд.</tspan></text>
<rect x="59.0" y="411.1" width="246.0" height="57.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="182.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="182.0" dy="0.0">Наслідок:</tspan><tspan x="182.0" dy="13.7">Пін LINK світиться зеленим,</tspan><tspan x="182.0" dy="13.7">але зв'язку немає взагалі.</tspan></text>
<rect x="342.0" y="60.0" width="276.0" height="440.0" rx="10" fill="#eef2f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="480.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Асиметричний канал</text>
<rect x="362.0" y="110.0" width="105.0" height="70.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="414.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пульт TX</text>
<text x="414.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Шле 100 мВт</text>
<rect x="492.0" y="110.0" width="105.0" height="70.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="544.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дрон RX</text>
<text x="544.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Шле 10 мВт</text>
<line x1="467.0" y1="135.0" x2="492.0" y2="135.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="492.0" y1="155.0" x2="480.0" y2="155.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="479.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<rect x="357.0" y="210.1" width="246.0" height="139.7" rx="6" fill="#ffffff" stroke="#c8d6e8" stroke-width="1.5"/><text x="480.0" y="229.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Прямий лінк (TX хоста)</tspan><tspan x="480.0" dy="13.7">потужний і доходить,</tspan><tspan x="480.0" dy="13.7">але зворотний лінк (RX)</tspan><tspan x="480.0" dy="13.7">заглушений завадою або</tspan><tspan x="480.0" dy="13.7">має слабкий передавач.</tspan><tspan x="480.0" dy="13.7"></tspan><tspan x="480.0" dy="13.7">Хост думає, що дрон пропав,</tspan><tspan x="480.0" dy="13.7">а дрон усе ще виконує</tspan><tspan x="480.0" dy="13.7">старі команди з ефіру.</tspan></text>
<rect x="357.0" y="411.1" width="246.0" height="57.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Наслідок:</tspan><tspan x="480.0" dy="13.7">Односторонній політ у стіну</tspan><tspan x="480.0" dy="13.7">через хибний стан зв'язку.</tspan></text>
<rect x="640.0" y="60.0" width="276.0" height="440.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="778.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Напіввідкритий сокет</text>
<rect x="660.0" y="110.0" width="75.0" height="70.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="697.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт</text>
<text x="697.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ESTABL.</text>
<rect x="742.0" y="118.0" width="72.0" height="54.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="778.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">NAT / AP</text>
<text x="778.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Drop state</text>
<rect x="820.0" y="110.0" width="75.0" height="70.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="857.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер</text>
<text x="857.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вимкнено</text>
<rect x="655.0" y="203.3" width="246.0" height="153.3" rx="6" fill="#ffffff" stroke="#d0d6dd" stroke-width="1.5"/><text x="778.0" y="222.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">Кабель живлення висмикнули,</tspan><tspan x="778.0" dy="13.7">але жоден TCP FIN або RST</tspan><tspan x="778.0" dy="13.7">не було надіслано в мережу.</tspan><tspan x="778.0" dy="13.7"></tspan><tspan x="778.0" dy="13.7">Проміжний роутер тихо</tspan><tspan x="778.0" dy="13.7">витер трансляцію з пам'яті.</tspan><tspan x="778.0" dy="13.7"></tspan><tspan x="778.0" dy="13.7">Стандартний TCP Keepalive</tspan><tspan x="778.0" dy="13.7">за замовчуванням чекає</tspan><tspan x="778.0" dy="13.7">2 години до першої проби!</tspan></text>
<rect x="655.0" y="411.1" width="246.0" height="57.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="778.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="778.0" dy="0.0">Наслідок:</tspan><tspan x="778.0" dy="13.7">Сокет висить годинами,</tspan><tspan x="778.0" dy="13.7">пам'ять і дескриптори течуть.</tspan></text>
</svg>