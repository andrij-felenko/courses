<text x="577.5" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Лінійний стабілізатор</text>
<rect x="419.5" y="106.2" width="96.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="467.5" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="467.5" dy="0.0">Вхід</tspan><tspan x="467.5" dy="15.6">8 В · I</tspan></text>
<rect x="592.5" y="100.2" width="110.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="647.5" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="647.5" dy="0.0">гасить</tspan><tspan x="647.5" dy="14.3">(8−4) В</tspan><tspan x="647.5" dy="14.3">в собі</tspan></text>
<line x1="515.5" y1="130.0" x2="592.5" y2="130.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
