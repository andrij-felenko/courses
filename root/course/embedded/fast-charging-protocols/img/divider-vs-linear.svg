<rect x="202.5" y="100.2" width="120.0" height="59.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="262.5" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">перекладає</tspan><tspan x="262.5" dy="14.3">заряд</tspan><tspan x="262.5" dy="14.3">конденсатором</tspan></text>
<line x1="130.5" y1="130.0" x2="202.5" y2="130.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
