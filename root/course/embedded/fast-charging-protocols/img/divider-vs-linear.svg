<text x="385.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама напруга 8 В → 4 В: дільник перекладає заряд, лінійник його спалює</text>
