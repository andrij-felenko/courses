<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріада вимірювальних приладів лабораторії розробника</text>
<rect x="30.0" y="30.0" width="230.0" height="230.0" rx="8" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.8"/>
<text x="145.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Мультиметр (DMM)</text>
<text x="145.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Статика та квазістатика</text>
<line x1="45.0" y1="82.0" x2="245.0" y2="82.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="42.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Напруга постійна й змінна (DC/AC)</text>
<text x="42.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вхідний опір: 10 МОм</text>
<text x="42.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Прозвонка з компаратором (&lt;30 Ом)</text>
<text x="42.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Падіння на діодах і p-n переходах</text>
<text x="42.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Струм (падіння на шунті)</text>
<rect x="40.0" y="226.0" width="210.0" height="24.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="145.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Точне число в окремій точці</text>
<rect x="295.0" y="30.0" width="230.0" height="230.0" rx="8" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
<text x="410.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Лабораторний БЖ</text>
<text x="410.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Керована енергія та захист</text>
<line x1="310.0" y1="82.0" x2="510.0" y2="82.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="307.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Режими: CV (напруга) та CC (струм)</text>
<text x="307.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Миттєве обмеження струму при КЗ</text>
<text x="307.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Захист: OVP, OCP, переполюсовка</text>
<text x="307.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Безпечний «холодний пуск» (50 мА)</text>
<text x="307.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Контроль споживання всієї плати</text>
<rect x="305.0" y="226.0" width="210.0" height="24.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="410.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Безпечне живлення схеми</text>
<rect x="560.0" y="30.0" width="230.0" height="230.0" rx="8" fill="#f0faf3" stroke="#27ae60" stroke-width="1.8"/>
<text x="675.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Осцилограф (DSO)</text>
<text x="675.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Динаміка в часі (форма хвиль)</text>
<line x1="575.0" y1="82.0" x2="775.0" y2="82.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="572.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Графік U(t): фронти, шуми, викиди</text>
<text x="572.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Смуга (BW) та частота семплування (Fs)</text>
<text x="572.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Захоплення одиничних імпульсів (Trigger)</text>
<text x="572.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Виявлення паразитного дзвону й пульсацій</text>
<text x="572.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Щупи 1X / 10X з RC-компенсацією</text>
<rect x="570.0" y="226.0" width="210.0" height="24.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="675.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Форма сигналу в реальному часі</text>
</svg>