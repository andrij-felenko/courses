<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння традиційного паяльника та картриджного жала</text>
<rect x="30.0" y="25.0" width="365.0" height="230.0" rx="8" fill="#fdfbf7" stroke="#c0392b" stroke-width="1.4"/>
<text x="212.5" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційний паяльник (наприклад, 900M)</text>
<text x="212.5" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Роздільний нагрівач і насадне жало</text>
<rect x="50.0" y="77.0" width="90.0" height="70.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.0"/>
<text x="95.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Керамічний</text>
<text x="95.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">нагрівач + ТП</text>
<rect x="145.0" y="77.0" width="38.0" height="70.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="164.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">Зазор</text>
<text x="164.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">повітря</text>
<rect x="188.0" y="77.0" width="182.0" height="70.0" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="1.0"/>
<text x="279.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle" font-weight="700">Масивне знімне жало</text>
<text x="279.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Кінчик жала (точка пайки)</text>
<text x="50.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Термопара всередині нагрівача, далеко від кінчика</text>
<text x="50.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Величезний тепловий опір повітряного зазору</text>
<text x="50.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• Температура кінчика просідає на 40–80 °C на полігонах</text>
<text x="50.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Повільна реакція зворотного зв'язку (5–15 секунд)</text>
<rect x="425.0" y="25.0" width="365.0" height="230.0" rx="8" fill="#f2faf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="607.5" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Картриджна система (T12 / C245)</text>
<text x="607.5" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Монолітний картридж «все-в-одному»</text>
<rect x="445.0" y="77.0" width="320.0" height="70.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.2"/>
<text x="605.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Монолітний картридж із прямим контактом</text>
<rect x="455.0" y="113.0" width="140.0" height="24.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="0.8"/>
<text x="525.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Нагрівач + термопара</text>
<rect x="605.0" y="113.0" width="150.0" height="24.0" rx="3" fill="#bbf7d0" stroke="#27ae60" stroke-width="0.8"/>
<text x="680.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Жало (в 2–3 мм від ТП)</text>
<text x="445.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Термопара розміщена впритул до робочої зони жала</text>
<text x="445.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Відсутність повітряного зазору (пряма теплопередача)</text>
<text x="445.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Миттєве форсування потужності при контакті з міддю</text>
<text x="445.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Відновлення температури за 1–2 секунди</text>
</svg>