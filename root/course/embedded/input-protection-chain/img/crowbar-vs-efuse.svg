<text x="122.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Fuse</text>
<line x1="230.0" y1="125.0" x2="230.0" y2="215.0" stroke="#333333" stroke-width="1.8"/>
<rect x="212.0" y="155.0" width="36.0" height="30.0" rx="3" fill="#fdedec" stroke="#c0392b" stroke-width="1.8"/>
<text x="223.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">SCR</text>
<line x1="180.0" y1="125.0" x2="180.0" y2="170.0" stroke="#333333" stroke-width="1.4"/>
<line x1="180.0" y1="170.0" x2="212.0" y2="170.0" stroke="#333333" stroke-width="1.4"/>
<text x="165.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">Dz
33V</text>
<text x="225.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• При V &gt; 33V тиристор закорочує шину на GND</text>
<text x="225.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Спалює запобіжник (Fuse) за мілісекунди</text>
<text x="225.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Мінус: одноразовий ремонтний випадок</text>
