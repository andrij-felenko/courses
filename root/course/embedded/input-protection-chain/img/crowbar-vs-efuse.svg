<text x="610.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">eFuse IC (TPS2595)</text>
<text x="610.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">MOSFET + OVP + CurrentLimit</text>
<text x="610.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Час відсікання: &lt; 2 мкс</text>
<line x1="610.0" y1="180.0" x2="610.0" y2="215.0" stroke="#333333" stroke-width="1.4"/>
<text x="635.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">FLT → MCU</text>
<text x="615.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Миттєве розмикання ключа при V_in &gt; V_ovp</text>
<text x="615.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Не руйнує схему, авто-відновлення (Auto-Retry)</text>
<text x="615.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Плюс: багаторазовий активний захист + моніторинг</text>
