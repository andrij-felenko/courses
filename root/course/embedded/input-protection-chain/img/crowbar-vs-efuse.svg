<text x="615.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Б) Електронний ключ eFuse (TPS2595)</text>
<line x1="465.0" y1="125.0" x2="540.0" y2="125.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="680.0" y1="125.0" x2="765.0" y2="125.0" stroke="#c0392b" stroke-width="2.0"/>
