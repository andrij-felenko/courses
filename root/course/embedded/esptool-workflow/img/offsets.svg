<rect x="410.0" y="80.0" width="280.0" height="70.0" rx="6" fill="#eafaf1" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="111.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">0x0:</tspan><tspan x="550.0" dy="15.6">завантажувач (одразу з початку)</tspan></text>
<rect x="410.0" y="154.0" width="280.0" height="36.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/>
