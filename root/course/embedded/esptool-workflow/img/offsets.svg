<rect x="410.0" y="194.0" width="280.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">0x10000: прошивка</tspan></text>
<rect x="410.0" y="258.0" width="280.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="550.0" y="275.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="550.0" dy="0.0">Secure Boot v2 не тримає окремого</tspan><tspan x="550.0" dy="11.7">сектора попереду: підпис ДОПИСАНО</tspan></text>
<text x="550.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">перед завантажувачем нічого не бронюють → 0x0</text>
<text x="380.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зсув не примха: на класичному ESP32 перший сектор заброньовано під дайджест Secure Boot v1.</text>
