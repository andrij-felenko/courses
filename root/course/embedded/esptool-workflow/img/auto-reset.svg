<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як esptool сам уводить чип у режим завантаження</text>
<rect x="40.0" y="110.0" width="130.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="105.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">USB↔UART</text>
<text x="105.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">DTR</text>
<text x="105.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">RTS</text>
<rect x="290.0" y="110.0" width="110.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">транзистор</tspan><tspan x="345.0" dy="13.0">(DTR→IO0)</tspan></text>
<rect x="290.0" y="180.0" width="110.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">транзистор</tspan><tspan x="345.0" dy="13.0">(RTS→EN)</tspan></text>
<rect x="540.0" y="110.0" width="140.0" height="110.0" rx="6" fill="#eafaf1" stroke="#333333" stroke-width="1.5"/>
<text x="610.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP32</text>
<text x="610.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">IO0 (boot)</text>
<text x="610.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">EN (reset)</text>
<line x1="170.0" y1="165.0" x2="288.0" y2="135.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="170.0" y1="188.0" x2="288.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="135.0" x2="538.0" y2="168.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="205.0" x2="538.0" y2="192.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Хитрість схеми: транзистори увімкнено так, що коли DTR і RTS смикають разом —</text>
<text x="360.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">чип НЕ скидається. Тому esptool може окремо «притиснути IO0», тоді «смикнути EN» —</text>
<text x="360.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">і чип прокидається вже в режимі завантаження, без жодної кнопки.</text>
</svg>