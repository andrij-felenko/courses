<text x="575.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Офіційний тест перевіряє тільки сумарне дальнє поле</text>
