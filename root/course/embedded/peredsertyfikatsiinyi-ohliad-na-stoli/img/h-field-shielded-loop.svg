<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Екранований зонд магнітного поля: розріз екрана та детектування струму</text>
<rect x="30.0" y="50.0" width="330.0" height="285.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="195.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будова петльового коаксіального зонда</text>
<circle cx="195" cy="180" r="60" fill="none" stroke="#2563eb" stroke-width="8"/>
<circle cx="195" cy="180" r="60" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,4"/>
<rect x="183.0" y="115.0" width="24.0" height="12.0" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="195.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Розріз екрана (Gap)</text>
<text x="195.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Потік Φ (H-поле)</text>
<text x="195.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">V = -dΦ/dt</text>
<text x="195.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Мідний екран блокує електричне E-поле</text>
<text x="195.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Розріз запобігає к.з. витку й пропускає магнітне H-поле</text>
<text x="195.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Сигнал індукується за законом Фарадея</text>
<rect x="390.0" y="50.0" width="340.0" height="285.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="560.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Орієнтація зонда відносно доріжки з ВЧ-струмом</text>
<rect x="420.0" y="230.0" width="280.0" height="16.0" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="560.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доріжка PCB зі струмом I_RF (di/dt)  →</text>
<rect x="420.0" y="105.0" width="130.0" height="95.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.4"/>
<text x="485.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Паралельно доріжці</text>
<text x="485.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">θ = 0°  (cos θ = 1)</text>
<text x="485.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">МАКСИМУМ зв'язку</text>
<text x="485.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">потік Φ пронизує петлю</text>
<rect x="570.0" y="105.0" width="140.0" height="95.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.4"/>
<text x="640.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Перпендикулярно</text>
<text x="640.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">θ = 90°  (cos θ = 0)</text>
<text x="640.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">МІНІМУМ зв'язку</text>
<text x="640.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">потік ковзає вздовж петлі</text>
<text x="560.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Поворот зонда на 90° визначає точний вектор</text>
<text x="560.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">протікання завадного високочастотного струму</text>
</svg>