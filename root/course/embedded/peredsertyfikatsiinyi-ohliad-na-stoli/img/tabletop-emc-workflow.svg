<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покроковий регламент передсертифікаційного тестування плати на столі</text>
<rect x="18.0" y="65.0" width="100.0" height="100.0" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="68.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle" font-weight="700">1. Базовий фон</text>
<text x="68.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Сканування кімнати</text>
<text x="68.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">без DUT (ефір)</text>
<line x1="120.0" y1="115.0" x2="130.0" y2="115.0" stroke="#64748b" stroke-width="2.0"/>
<polygon points="130.0,111.0 134.0,115.0 130.0,119.0" fill="#64748b"/>
<rect x="132.0" y="65.0" width="100.0" height="100.0" rx="5" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="182.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4338ca" text-anchor="middle" font-weight="700">2. LISN тест</text>
<text x="182.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Кондуктивні завади</text>
<text x="182.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">150 кГц – 30 МГц</text>
<line x1="234.0" y1="115.0" x2="244.0" y2="115.0" stroke="#64748b" stroke-width="2.0"/>
<polygon points="244.0,111.0 248.0,115.0 244.0,119.0" fill="#64748b"/>
<rect x="246.0" y="65.0" width="100.0" height="100.0" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="296.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">3. H-зонд (огляд)</text>
<text x="296.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Панорама плати</text>
<text x="296.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">30 МГц – 1 ГГц</text>
<line x1="348.0" y1="115.0" x2="358.0" y2="115.0" stroke="#64748b" stroke-width="2.0"/>
<polygon points="358.0,111.0 362.0,115.0 358.0,119.0" fill="#64748b"/>
<rect x="360.0" y="65.0" width="100.0" height="100.0" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="410.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">4. H/E локалізація</text>
<text x="410.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Точкові піки котушок,</text>
<text x="410.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">чипів та швів</text>
<line x1="462.0" y1="115.0" x2="472.0" y2="115.0" stroke="#64748b" stroke-width="2.0"/>
<polygon points="472.0,111.0 476.0,115.0 472.0,119.0" fill="#64748b"/>
<rect x="474.0" y="65.0" width="100.0" height="100.0" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>
<text x="524.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#db2777" text-anchor="middle" font-weight="700">5. RF-кліщі</text>
<text x="524.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Струм I_cm кабелів</text>
<text x="524.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">і роз'ємів</text>
<line x1="576.0" y1="115.0" x2="586.0" y2="115.0" stroke="#64748b" stroke-width="2.0"/>
<polygon points="586.0,111.0 590.0,115.0 586.0,119.0" fill="#64748b"/>
<rect x="588.0" y="65.0" width="100.0" height="100.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="638.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">6. Контрзаходи</text>
<text x="638.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Снабери, ферити,</text>
<text x="638.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">екрани, slew rate</text>
<line x1="690.0" y1="115.0" x2="700.0" y2="115.0" stroke="#64748b" stroke-width="2.0"/>
<polygon points="700.0,111.0 704.0,115.0 700.0,119.0" fill="#64748b"/>
<rect x="702.0" y="65.0" width="100.0" height="100.0" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="752.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">7. Дельта-контроль</text>
<text x="752.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Порівняння спектрів:</text>
<text x="752.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">запас ≥ 6 дБ</text>
<rect x="18.0" y="190.0" width="784.0" height="140.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="410.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові принципи аудиту на лабораторному столі</text>
<text x="38.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Відносність вимірювань:</text>
<text x="233.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Мета — не абсолютні мкВ/м, а фіксація придушення ΔдБ після кожного кроку.</text>
<text x="38.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Режим Max Hold:</text>
<text x="233.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Завжди фіксуйте максимальні піки спектра для виявлення рідкісних імпульсних викидів.</text>
<text x="38.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Запас надійності (Margin):</text>
<text x="233.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Домагайтеся мінімум 6–10 дБ запасу до ліній норм CISPR для гарантованого проходження.</text>
<text x="38.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Комплексність перевірки:</text>
<text x="233.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Тиха плата з брудним кабелем провалить тест так само, як і шумна мікросхема.</text>
</svg>