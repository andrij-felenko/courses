<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 851.66 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="851.66" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="30.0" width="780.0" height="100.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="50.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="start" font-weight="700">Рівень 3: Людина над контуром (Human-above-the-loop)</text>
<text x="50.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Масштаб часу: хвилини — години</text>
<text x="50.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Задачі: вибір полігонів пошуку, коридори безпеки, затвердження дій (ROE), пріоритети</text>
<rect x="661.6" y="56.2" width="116.7" height="47.6" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="720.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Оператор</tspan><tspan x="720.0" dy="15.6">(HMI / Карта)</tspan></text>
<line x1="250.0" y1="130.0" x2="250.0" y2="168.0" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="260.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">Групові цілі, зони, обмеження</text>
<line x1="590.0" y1="168.0" x2="590.0" y2="130.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="600.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">Критичні винятки, виявлені цілі</text>
<rect x="30.0" y="170.0" width="780.0" height="100.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="50.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="start" font-weight="700">Рівень 2: Ройовий планувальник і координатор (Swarm Coordinator)</text>
<text x="50.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Масштаб часу: 1 — 10 секунд (децентралізований / наземний диспетчер)</text>
<text x="50.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Задачі: розподіл цілей (аукціони CBBA), розбиття площі (Вороний), динамічні маршрути</text>
<rect x="665.4" y="196.2" width="109.3" height="47.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.2"/><text x="720.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Ройовий</tspan><tspan x="720.0" dy="15.6">планувальник</tspan></text>
<line x1="250.0" y1="270.0" x2="250.0" y2="308.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="260.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Індивідуальні польотні завдання (Waypoints)</text>
<line x1="590.0" y1="308.0" x2="590.0" y2="270.0" stroke="#4b5563" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="600.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="start" font-weight="700">Локальні позиції, стан батарей, зв'язок</text>
<rect x="30.0" y="310.0" width="780.0" height="100.0" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
<text x="50.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7e22ce" text-anchor="start" font-weight="700">Рівень 1: Бортовий автопілот (Flight Controller on-board)</text>
<text x="50.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Масштаб часу: 1 — 10 мілісекунд (100 — 400 Гц контур стабілізації)</text>
<text x="50.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• Задачі: PID кутів/швидкостей, утримання висоти, локальний обхід перешкод (ORCA / APF)</text>
<rect x="676.5" y="336.2" width="87.0" height="47.6" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/><text x="720.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Бортовий</tspan><tspan x="720.0" dy="15.6">контролер</tspan></text>
</svg>