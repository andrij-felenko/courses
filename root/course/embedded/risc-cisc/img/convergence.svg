<text x="511.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle">µops — прості RISC-подібні мікрооперації</text>
<text x="390.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Видима ISA лишається CISC заради СУМІСНОСТІ зі старим софтом;</text>
<text x="390.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">реалізація під нею — RISC-стилю. Перемогла сама ідея простих швидких кроків.</text>
