<text x="390.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сучасний x86: складна мова зовні, прості кроки всередині</text>
<rect x="40.0" y="116.0" width="150.0" height="68.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2.0"/><text x="115.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">складна</tspan><tspan x="115.0" dy="14.3">x86-команда</tspan><tspan x="115.0" dy="14.3">(видима ISA)</tspan></text>
<line x1="192.0" y1="150.0" x2="236.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="238.0" y="116.0" width="150.0" height="68.0" rx="6" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="2.0"/><text x="313.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="313.0" dy="0.0">декодер</tspan><tspan x="313.0" dy="15.0">розкладає</tspan></text>
<line x1="390.0" y1="150.0" x2="434.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
