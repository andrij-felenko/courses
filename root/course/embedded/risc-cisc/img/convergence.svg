<rect x="436.0" y="136.0" width="150.0" height="28.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="511.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">µop 2</text>
