<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розвилка філософії: мало простих чи багато складних?</text>
<rect x="187.9" y="36.5" width="344.2" height="43.0" rx="6" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="2.0"/><text x="360.0" y="63.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Скільки команд має знати процесор?</tspan></text>
