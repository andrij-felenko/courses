<line x1="390.0" y1="79.5" x2="510.0" y2="94.0" stroke="#1f47b5" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="138.5" y="116.6" width="143.0" height="82.8" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.0"/><text x="210.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">RISC</tspan><tspan x="210.0" dy="15.6">мало, усі прості</tspan><tspan x="210.0" dy="15.6">однакова довжина</tspan><tspan x="210.0" dy="15.6">~1 такт кожна</tspan></text>
<rect x="434.8" y="116.6" width="150.5" height="82.8" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2.0"/><text x="510.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">CISC</tspan><tspan x="510.0" dy="15.6">багато, є складні</tspan><tspan x="510.0" dy="15.6">різна довжина</tspan><tspan x="510.0" dy="15.6">різна тривалість</tspan></text>
<text x="210.0" y="225.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle">ARM · RISC-V · AVR · Xtensa (ESP32)</text>
<text x="510.0" y="225.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle">x86 — процесори ПК</text>
<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Дві протилежні відповіді на одне й те саме питання.</text>
