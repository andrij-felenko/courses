<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна простоти — довший код — і як її майже відіграли</text>
<line x1="120.0" y1="250.0" x2="120.0" y2="72.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="120.0" y1="250.0" x2="590.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="104.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">розмір
коду</text>
<rect x="140.0" y="144.6" width="60.7" height="105.4" rx="4" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="170.4" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.4" dy="0.0">CISC x86</tspan><tspan x="170.4" dy="12.3">(щільний)</tspan></text>
<rect x="237.9" y="80.0" width="60.7" height="170.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="268.3" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="268.3" dy="0.0">RISC ARM32</tspan><tspan x="268.3" dy="12.3">(усе 32-біт)</tspan></text>
<rect x="335.8" y="131.0" width="60.7" height="119.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="366.2" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="366.2" dy="0.0">Thumb-2</tspan><tspan x="366.2" dy="12.3">(16/32)</tspan></text>
<rect x="433.8" y="127.6" width="60.7" height="122.4" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="464.1" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="464.1" dy="0.0">RISC-V +C</tspan><tspan x="464.1" dy="12.3">(16/32)</tspan></text>
<line x1="268.3" y1="76.0" x2="464.1" y2="76.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="366.2" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">компресія: −25…30 % коду</text>
<text x="360.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класичний RISC платить довшим кодом. Стиснуті набори (Thumb-2, розширення C) вертають щільність,</text>
<text x="360.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">лишаючи декодування простим: 16-бітову команду декодер розкриває в звичайну 32-бітову.</text>
</svg>