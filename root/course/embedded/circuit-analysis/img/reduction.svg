<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стратегія 1: згортання (вперед — до R_екв, назад — до всіх величин)</text>
<circle cx="95.0" cy="165.0" r="46.0" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.4"/>
<text x="95.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">повна</tspan><tspan x="95.0" dy="15.0">схема</tspan></text>
<text x="95.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">R₁, R₂∥R₃, …</text>
<line x1="145.0" y1="165.0" x2="250.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="300.0" cy="165.0" r="46.0" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.4"/>
<text x="300.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">згорнули</tspan><tspan x="300.0" dy="15.0">паралель</tspan></text>
<text x="300.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">R₂∥R₃ → 1 опір</text>
<line x1="350.0" y1="165.0" x2="455.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="505.0" cy="165.0" r="46.0" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.4"/>
<text x="505.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">згорнули</tspan><tspan x="505.0" dy="15.0">послідовно</tspan></text>
<text x="505.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">усе → R_екв</text>
<line x1="555.0" y1="165.0" x2="615.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="665.0" cy="165.0" r="46.0" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.4"/>
<text x="665.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">повний</tspan><tspan x="665.0" dy="15.0">струм</tspan></text>
<text x="665.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">I = V/R_екв</text>
<line x1="665.0" y1="235.0" x2="95.0" y2="235.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">«розгортаємо» назад: дільниками — спади й гілкові струми</text>
</svg>