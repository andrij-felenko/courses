<text x="460.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Чистий узгоджений фронт (з резистором 33–50 Ом)</text>
<rect x="30.0" y="260.0" width="720.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#e0e0e0" stroke-width="1.0"/><text x="390.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Чому дзвоніння спотворює пакети:</tspan><tspan x="390.0" dy="13.7">1. Кожен паразитний перетин порогу V_IH сприймається апаратним тригером як повноцінний такт SCK/SCL.</tspan><tspan x="390.0" dy="13.7">2. Приймач зсуває у свій регістр зайвий біт — весь подальший потік даних десинхронізується.</tspan><tspan x="390.0" dy="13.7">3. Засоби усунення: послідовний резистор (Series Termination 33–100 Ом) біля виводу передавача,</tspan><tspan x="390.0" dy="13.7">   зменшення швидкості наростання фронту (GPIO Slew Rate = Low/Medium) та скорочення довжини шлейфів.</tspan></text>
</svg>