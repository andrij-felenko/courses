<rect x="30.0" y="290.0" width="720.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#e0e0e0" stroke-width="1.0"/><text x="390.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">У додатковому коді (Two's Complement) знак числа визначається його найстаршим бітом.</tspan><tspan x="390.0" dy="13.7">Якщо давач 12-бітний, його знаковий біт — це біт 11. Перенесення числа у 16-бітний `int16_t` процесора</tspan><tspan x="390.0" dy="13.7">вимагає розмноження (копіювання) біта 11 на позиції 12, 13, 14 та 15. Якщо цього не зробити,</tspan><tspan x="390.0" dy="13.7">будь-яке навіть крихітне від'ємне число (−0.1 °C або −0.05 g) перетворюється на колосальне додатне.</tspan></text>
</svg>