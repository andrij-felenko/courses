<text x="200.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Плавний монотоний відгук давача</text>
<rect x="410.0" y="70.0" width="340.0" height="250.0" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1.2"/>
