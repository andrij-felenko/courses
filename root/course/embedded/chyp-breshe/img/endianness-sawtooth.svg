<text x="580.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Дикі стрибки на 256 відліків на кожен крок LSB</text>
<rect x="30.0" y="336.0" width="720.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#e0e0e0" stroke-width="1.0"/><text x="390.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Коли старший і молодший байти переплутані місцями, кожна зміна молодшого біта фізичної величини</tspan><tspan x="390.0" dy="13.7">примножується у 256 разів (зсув на 8 позицій). Сигнал не зникає і не стає нулем — він перетворюється</tspan><tspan x="390.0" dy="13.7">на характерну «пилку», де прилад нібито реагує на вплив, але показує хаотичні гігантські стрибки.</tspan></text>
</svg>