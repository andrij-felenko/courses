<text x="580.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">молодший байт потрапляє на місце старшого</text>
<line x1="455.0" y1="270.0" x2="725.0" y2="270.0" stroke="#1a1a1a" stroke-width="1.4"/>
