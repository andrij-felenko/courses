<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевернутий порядок байтів: як спотворюється сигнал</text>
<text x="390.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">плавне нагрівання давача (24 °C → 25.5 °C) при помилці MSB/LSB перетворюється на пилку</text>
<rect x="30.0" y="70.0" width="340.0" height="250.0" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1.2"/>
