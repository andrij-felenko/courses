<rect x="30.0" y="250.0" width="720.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#e0e0e0" stroke-width="1.0"/><text x="390.0" y="301.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Симптоми неузгодженості CPOL/CPHA в SPI:</tspan><tspan x="390.0" dy="13.7">• Зсув на 1 біт вліво (&lt;&lt; 1): старший біт D7 втрачається, усі значення подвоюються, а молодший біт читає шум.</tspan><tspan x="390.0" dy="13.7">• Зсув на 1 біт вправо (&gt;&gt; 1): затримка на півтакту змушує прочитати попередній стан шини як старший біт.</tspan><tspan x="390.0" dy="13.7">• Ідентифікатор WHO_AM_I замість очікуваного 0x68 читається як 0xD0 (0x68 &lt;&lt; 1) або 0x34 (0x68 &gt;&gt; 1).</tspan><tspan x="390.0" dy="13.7">• Діагностика: перевірте в даташиті, за яким саме фронтом такту (Rising/Falling) давач защіпає та змінює дані.</tspan></text>
