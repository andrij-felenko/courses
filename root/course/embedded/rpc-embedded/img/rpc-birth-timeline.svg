<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 916 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="916" height="510" fill="#ffffff"/>
