<text x="450.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Ідея, термін, перша реалізація, доказ практичності й масовий ужиток — РІЗНІ внески РІЗНИХ людей. RPC ніхто не «винайшов» сам.</text>
