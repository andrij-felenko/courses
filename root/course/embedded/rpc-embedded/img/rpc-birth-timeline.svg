<circle cx="109.5" cy="160.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="109.5" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1975-76</text>
