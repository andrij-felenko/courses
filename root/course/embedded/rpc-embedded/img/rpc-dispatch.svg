<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Диспетчер на мікроконтролері: номер функції → таблиця → обробник</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кадр несе НОМЕР функції; таблиця вказівників веде до потрібного обробника — без дерева if</text>
<rect x="60.0" y="110.0" width="86.0" height="34.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="103.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ID=9</text>
<rect x="150.0" y="110.0" width="86.0" height="34.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="193.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">func=2</text>
<rect x="240.0" y="110.0" width="86.0" height="34.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="283.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">arg=10</text>
<rect x="330.0" y="110.0" width="86.0" height="34.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="373.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">CRC</text>
<text x="60.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">вхідний кадр запиту</text>
<text x="426.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">→</text>
<text x="470.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">таблиця функцій (масив вказівників)</text>
<rect x="470.0" y="96.0" width="330.0" height="36.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="488.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">[0]</text>
<text x="516.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ping()</text>
<text x="792.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">→ pong</text>
<rect x="470.0" y="136.0" width="330.0" height="36.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="488.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">[1]</text>
<text x="516.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">read_sensor(n)</text>
<text x="792.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">→ значення АЦП</text>
<rect x="470.0" y="176.0" width="330.0" height="36.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="488.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">[2]</text>
<text x="516.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">set_motor(d)</text>
<text x="792.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-style="italic">→ статус</text>
<rect x="470.0" y="216.0" width="330.0" height="36.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="488.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">[3]</text>
<text x="516.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">reboot()</text>
<text x="792.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">→ (без відповіді)</text>
<line x1="193.0" y1="144.0" x2="464.0" y2="194.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="331.5" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">func=2 індексує таблицю</text>
<text x="430.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">table[func](arg) — один рядок коду диспетчеризує будь-яку команду; нова команда = новий рядок таблиці.</text>
<text x="430.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">CRC відсіває побиті кадри до виклику; reboot() може не слати відповіді — клієнт це мусить знати.</text>
</svg>