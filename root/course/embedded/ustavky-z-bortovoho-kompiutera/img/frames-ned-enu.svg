<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="35.0" width="420.0" height="385.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="240.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Світові системи координат (World)</text>
<rect x="50.0" y="85.0" width="180.0" height="220.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="140.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">NED (Автопілоти)</text>
<text x="140.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">North - East - Down</text>
<line x1="140.0" y1="190.0" x2="140.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="152.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+X (North)</text>
<line x1="140.0" y1="190.0" x2="185.0" y2="190.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="188.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">+Y (East)</text>
<line x1="140.0" y1="190.0" x2="110.0" y2="220.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="105.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">+Z (Down / глибина)</text>
<text x="140.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Yaw: ↻ за годинниковою
від Півночі до Сходу</text>
<rect x="250.0" y="85.0" width="180.0" height="220.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="340.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ENU (ROS 2)</text>
<text x="340.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">East - North - Up</text>
<line x1="340.0" y1="190.0" x2="385.0" y2="190.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="388.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">+X (East)</text>
<line x1="340.0" y1="190.0" x2="340.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="352.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+Y (North)</text>
<line x1="340.0" y1="190.0" x2="310.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="305.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">+Z (Up / висота)</text>
<text x="340.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Yaw: ↺ проти годинникової
від Сходу до Півночі</text>
<rect x="50.0" y="315.0" width="380.0" height="90.0" rx="4" fill="#eef2f6" stroke="#6b7280" stroke-width="1.0"/>
<text x="240.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетворення координат (World Conversion):</text>
<text x="240.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">x_ned = y_enu  |  y_ned = x_enu  |  z_ned = −z_enu</text>
<text x="240.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">yaw_ned = π/2 − yaw_enu  (зміна напрямку обертання)</text>
<rect x="490.0" y="35.0" width="420.0" height="385.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="700.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язані системи апарата (Body)</text>
<rect x="510.0" y="85.0" width="180.0" height="220.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="600.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">FRD (Автопілоти)</text>
<text x="600.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Forward - Right - Down</text>
<line x1="600.0" y1="190.0" x2="600.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="612.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+X (Forward / ніс)</text>
<line x1="600.0" y1="190.0" x2="645.0" y2="190.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="648.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">+Y (Right / борт)</text>
<line x1="600.0" y1="190.0" x2="570.0" y2="220.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="565.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">+Z (Down / днище)</text>
<text x="600.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Крен (Roll): правий борт вниз
Тангаж (Pitch): ніс угору</text>
<rect x="710.0" y="85.0" width="180.0" height="220.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="800.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">FLU (ROS 2)</text>
<text x="800.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Forward - Left - Up</text>
<line x1="800.0" y1="190.0" x2="800.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="812.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+X (Forward / ніс)</text>
<line x1="800.0" y1="190.0" x2="755.0" y2="190.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="752.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">+Y (Left / лівий)</text>
<line x1="800.0" y1="190.0" x2="830.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="835.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">+Z (Up / дах)</text>
<text x="800.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Крен (Roll): лівий борт вниз
Тангаж (Pitch): ніс униз</text>
<rect x="510.0" y="315.0" width="380.0" height="90.0" rx="4" fill="#eef2f6" stroke="#6b7280" stroke-width="1.0"/>
<text x="700.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетворення зв'язаних осей (Body Conversion):</text>
<text x="700.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">x_frd = x_flu  |  y_frd = −y_flu  |  z_frd = −z_flu</text>
<text x="700.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">roll_frd = roll_flu  |  pitch_frd = −pitch_flu  |  yaw_frd = −yaw_flu</text>
</svg>