<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="40.0" width="390.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="225.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бортовий комп'ютер (Linux SBC)</text>
<text x="225.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Raspberry Pi 5 / Jetson Orin / Radxa</text>
<rect x="124.1" y="107.3" width="201.8" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="225.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">М'який реальний час (Soft RT)</tspan><tspan x="225.0" dy="14.3">Потужні CPU/GPU обчислення</tspan></text>
<rect x="50.0" y="175.0" width="350.0" height="245.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="225.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Високорівневі задачі (5–20 Гц)</text>
<text x="65.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Комп'ютерний зір і розпізнавання цілей (YOLO)</text>
<text x="65.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Візуальна одометрія та картографування (VIO / SLAM)</text>
<text x="65.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Планування траєкторій та обхід перешкод</text>
<text x="65.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Автомат місії та поведінкові дерева (BehaviorTree)</text>
<text x="65.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зв'язок із хмарою, базою та LTE-модемом</text>
<text x="225.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Генерація уставок: позиція, швидкість, курс</text>
<rect x="435.0" y="140.0" width="70.0" height="200.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="470.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Канал</text>
<text x="470.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">UART /</text>
<text x="470.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">USB /</text>
<text x="470.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ethernet</text>
<line x1="400.0" y1="255.0" x2="520.0" y2="255.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="470.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Уставки</text>
<text x="470.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">10–50 Гц</text>
<line x1="540.0" y1="305.0" x2="420.0" y2="305.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="470.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Телеметрія</text>
<text x="470.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">20–100 Гц</text>
<rect x="520.0" y="40.0" width="390.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="715.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Польотний контролер (FCU / MCU)</text>
<text x="715.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">STM32F7 / STM32H7 (PX4 / ArduPilot)</text>
<rect x="607.8" y="107.3" width="214.4" height="45.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="715.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Жорсткий реальний час (Hard RT)</tspan><tspan x="715.0" dy="14.3">Джиттер такту &lt; 50 мкс</tspan></text>
<rect x="540.0" y="175.0" width="350.0" height="245.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="715.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Низькорівневе керування (100–1000 Гц)</text>
<text x="555.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Опитування IMU / барометра / магнітометра (1 кГц)</text>
<text x="555.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Оцінювач орієнтації та позиції (EKF2, 100–250 Гц)</text>
<text x="555.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Каскад ПІД: кутові швидкості (1 кГц), кути (400 Гц)</text>
<text x="555.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Контур позиції та швидкості (50–100 Гц)</text>
<text x="555.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Мікшер моторів, виходи DShot / PWM, Failsafe</text>
<text x="715.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Виконання уставок та безпека платформи</text>
</svg>