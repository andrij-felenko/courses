<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація трафіку пристроїв та оптимальний вибір інтерфейсу</text>
<rect x="50.0" y="70.0" width="740.0" height="105.0" rx="6" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.2"/>
<rect x="50.0" y="70.0" width="6.0" height="105.0" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="70.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">1. Неперервний потік</text>
<text x="70.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">(Continuous Streaming)</text>
<rect x="230.0" y="78.0" width="380.0" height="88.0" rx="6" fill="#fbfcfd" stroke="#fbfcfd" stroke-width="1.5"/><text x="420.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Обсяг: мегабайти / гігабайти</tspan><tspan x="420.0" dy="11.7">Затримка: &lt;50–100 мс (жорстка)</tspan><tspan x="420.0" dy="11.7">Характер: потокове відео/аудіо, RTK-навігація, високочастотна телеметрія 50–100 Гц</tspan><tspan x="420.0" dy="11.7">Живлення: стаціонарна мережа або АКБ із щоденною підзарядкою</tspan></text>
<rect x="625.0" y="78.0" width="150.0" height="88.0" rx="6" fill="#fbe7e4" stroke="#c0392b" stroke-width="1.4"/>
<text x="700.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Оптимальний вибір:</text>
<rect x="630.0" y="102.0" width="140.0" height="58.0" rx="6" fill="#fbe7e4" stroke="#fbe7e4" stroke-width="1.5"/><text x="700.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Wi-Fi (802.11ax/ac/n)</tspan><tspan x="700.0" dy="11.7">LTE Cat-1 / Cat-4</tspan><tspan x="700.0" dy="11.7">Ethernet</tspan></text>
<rect x="50.0" y="190.0" width="740.0" height="105.0" rx="6" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.2"/>
<rect x="50.0" y="190.0" width="6.0" height="105.0" rx="0" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="70.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2. Періодична телеметрія</text>
<text x="70.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">(Periodic Reporting)</text>
<rect x="230.0" y="198.0" width="380.0" height="88.0" rx="6" fill="#fbfcfd" stroke="#fbfcfd" stroke-width="1.5"/><text x="420.0" y="227.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Обсяг: 10–200 байтів</tspan><tspan x="420.0" dy="11.7">Період: 1 раз на 15 хв — 1 раз на добу</tspan><tspan x="420.0" dy="11.7">Характер: лічильники води/газу/тепла, метеостанції, агромоніторинг ґрунту</tspan><tspan x="420.0" dy="11.7">Живлення: автономна батарея LiSOCl2 / LiMnO2 на 5–10 років</tspan></text>
<rect x="625.0" y="198.0" width="150.0" height="88.0" rx="6" fill="#e4f4ea" stroke="#27ae60" stroke-width="1.4"/>
<text x="700.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Оптимальний вибір:</text>
<rect x="630.0" y="222.0" width="140.0" height="58.0" rx="6" fill="#e4f4ea" stroke="#e4f4ea" stroke-width="1.5"/><text x="700.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">LoRaWAN (Class A)</tspan><tspan x="700.0" dy="13.0">NB-IoT (PSM)</tspan><tspan x="700.0" dy="13.0">Sigfox (12 B)</tspan><tspan x="700.0" dy="13.0">BLE Beacon</tspan></text>
<rect x="50.0" y="310.0" width="740.0" height="105.0" rx="6" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.2"/>
<rect x="50.0" y="310.0" width="6.0" height="105.0" rx="0" fill="#7d3c98" stroke="#7d3c98" stroke-width="0.0"/>
<text x="70.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d3c98" text-anchor="start" font-weight="700">3. Подійно-аварійний трафік</text>
<text x="70.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">(Event-Driven &amp; Reactive)</text>
<rect x="230.0" y="318.0" width="380.0" height="88.0" rx="6" fill="#fbfcfd" stroke="#fbfcfd" stroke-width="1.5"/><text x="420.0" y="347.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Обсяг: 10–50 байтів на тривогу</tspan><tspan x="420.0" dy="11.7">Затримка: критична (&lt;1–3 с на доставку сигналу)</tspan><tspan x="420.0" dy="11.7">Характер: датчики відкриття дверей/люків, пожежна тривога, витік газу, SOS-кнопки</tspan><tspan x="420.0" dy="11.7">Живлення: батарея або мережа + резервний акумулятор</tspan></text>
<rect x="625.0" y="318.0" width="150.0" height="88.0" rx="6" fill="#efe6f4" stroke="#7d3c98" stroke-width="1.4"/>
<text x="700.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d3c98" text-anchor="middle" font-weight="700">Оптимальний вибір:</text>
<rect x="630.0" y="342.0" width="140.0" height="58.0" rx="6" fill="#efe6f4" stroke="#efe6f4" stroke-width="1.5"/><text x="700.0" y="356.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">LTE-M / NB-IoT</tspan><tspan x="700.0" dy="11.7">LoRaWAN (переривання)</tspan><tspan x="700.0" dy="11.7">Zigbee / Thread</tspan><tspan x="700.0" dy="11.7">ESP-NOW</tspan></text>
</svg>