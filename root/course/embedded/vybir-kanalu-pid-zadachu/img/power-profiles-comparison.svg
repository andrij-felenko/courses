<text x="470.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Сеанс: 1.2–3.5 с · Піки: 220–500 мА · Сон PSM: 3 мкА · Енергія: ~450 мДж</text>
