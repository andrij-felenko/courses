<text x="50.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">LoRaWAN EU868 SF10/12 (Довгий ефір)</text>
