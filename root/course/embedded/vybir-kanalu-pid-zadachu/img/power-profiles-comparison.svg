<rect x="50.0" y="420.0" width="740.0" height="36.0" rx="6" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.5"/><text x="420.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">У стільникових модулях та LoRaWAN витрати енергії визначаються не стільки передачею байтів, скільки супутніми фазами:</tspan><tspan x="420.0" dy="13.0">пробудження синтезатора, підтримання синхронізації соти, очікування вікон прийому (RX) та засинання.</tspan></text>
