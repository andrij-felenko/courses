<text x="50.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">BLE 5.0 (Швидкий сплеск)</text>
<text x="470.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Сеанс: 2–5 мс · Пік: 15 мА · Сон: 1.5 мкА · Енергія: ~0.1 мДж</text>
