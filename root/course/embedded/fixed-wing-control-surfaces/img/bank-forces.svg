<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розклад підіймальної сили в крені φ</text>
<polygon points="265.6,244.4 410.6,357.7 404.4,365.6 259.4,252.3" fill="#e3e8ee" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="335.0" cy="305.0" r="11.0" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="335.0" y1="305.0" x2="335.0" y2="115.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="340.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">вертикаль</text>
<line x1="335.0" y1="305.0" x2="448.9" y2="159.2" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="457.9" y="156.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">L</text>
<text x="457.9" y="173.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">підйом</text>
<line x1="335.0" y1="305.0" x2="335.0" y2="159.2" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="325.0" y="232.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">L·cos φ</text>
<line x1="335.0" y1="159.2" x2="448.9" y2="159.2" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="391.9" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">L·sin φ</text>
