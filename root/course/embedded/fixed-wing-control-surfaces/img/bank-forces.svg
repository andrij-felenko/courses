<line x1="335.0" y1="305.0" x2="335.0" y2="430.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="325.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">вага W</text>
<path d="M 335.0 251.0 A 54.0 54.0 0 0 1 368.2 262.4" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="357.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">φ</text>
<text x="444.9" y="174.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">до центра →</text>
<rect x="511.3" y="110.0" width="177.3" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="130.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Вертикаль тримає вагу:</tspan><tspan x="600.0" dy="15.6">L·cos φ = W</tspan><tspan x="600.0" dy="15.6">→ n = L/W = 1/cos φ</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">Горизонталь — доосьова:</tspan><tspan x="600.0" dy="15.6">F = L·sin φ = W·tan φ</tspan></text>
