<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">СИСТЕМА БАГАТОКАНАЛЬНОЇ АНОНСАЦІЇ РЕЖИМІВ (FEEDBACK ANNUNCIATION)</text>
<rect x="20.0" y="50.0" width="180.0" height="290.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="110.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. ВІЗУАЛЬНИЙ (HUD / OSD)</text>
<line x1="30.0" y1="88.0" x2="190.0" y2="88.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="110.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Великий банер зміни режиму</text>
<text x="110.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Колірний індикатор стану:</text>
<text x="110.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Зелений — Повний GPS/PosHold</text>
<text x="110.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Жовтий — Деградація/AltHold</text>
<text x="110.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Червоний — Ручний/Аварійний</text>
<text x="110.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Мерехтіння 2.5 с при переході</text>
<rect x="220.0" y="50.0" width="180.0" height="290.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="310.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. АКУСТИЧНИЙ (АУДІО)</text>
<line x1="230.0" y1="88.0" x2="390.0" y2="88.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="310.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Голосовий синтез події:</text>
<text x="310.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Warning: Alt-Hold Mode»</text>
<text x="310.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Характерний тональний звук</text>
<text x="310.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Різні патерни для деградації</text>
<text x="310.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">та аварійного повернення</text>
<text x="310.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Пріоритет над телеметрією</text>
<rect x="420.0" y="50.0" width="180.0" height="290.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
<text x="510.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ca8a04" text-anchor="middle" font-weight="700">3. ТАКТИЛЬНИЙ (HAPTIC)</text>
<line x1="430.0" y1="88.0" x2="590.0" y2="88.0" stroke="#ca8a04" stroke-width="1.0"/>
<text x="510.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Вібрація корпусу пульта</text>
<text x="510.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Подвійний імпульс: відкат</text>
<text x="510.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Безперервний зумер: аварія</text>
<text x="510.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Миттєве відчуття в руках</text>
<text x="510.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Працює при втраті зорового</text>
<text x="510.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">контакту з екраном</text>
<rect x="620.0" y="50.0" width="180.0" height="290.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
<text x="710.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9333ea" text-anchor="middle" font-weight="700">4. ПРОЦЕДУРНИЙ (FMA)</text>
<line x1="630.0" y1="88.0" x2="790.0" y2="88.0" stroke="#9333ea" stroke-width="1.0"/>
<text x="710.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Обов'язкове підтвердження</text>
<text x="710.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Голосовий виголос пілота:</text>
<text x="710.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Mode Changed to AltHold»</text>
<text x="710.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Дисципліна двох операторів</text>
<text x="710.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зняття когнітивного</text>
<text x="710.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">тунелювання</text>
</svg>