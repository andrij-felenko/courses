<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="400.0" height="360.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="2.0"/>
<text x="220.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">МЕНТАЛЬНА МОДЕЛЬ ОПЕРАТОРА</text>
<text x="220.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">(Що людина думає про стан апарата)</text>
<rect x="480.0" y="20.0" width="400.0" height="360.0" rx="8" fill="#fdfbf7" stroke="#c0392b" stroke-width="2.0"/>
<text x="680.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">РЕАЛЬНИЙ СТАН АВТОПІЛОТА</text>
<text x="680.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">(Фактичний режим прошивки борту)</text>
<rect x="78.6" y="93.2" width="282.8" height="43.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="111.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Режим: PosHold (GPS)</tspan><tspan x="220.0" dy="15.6">«Відпускаю стік — апарат сам загальмує»</tspan></text>
<rect x="106.0" y="170.4" width="228.0" height="59.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Вхід оператора:</tspan><tspan x="220.0" dy="15.6">Стік Roll/Pitch у центрі (0, 0)</tspan><tspan x="220.0" dy="15.6">Очікування: нульова швидкість</tspan></text>
<rect x="111.6" y="275.4" width="216.9" height="59.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="293.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Automation Surprise:</tspan><tspan x="220.0" dy="15.6">«Чому він летить у дерево?!</tspan><tspan x="220.0" dy="15.6">Він не слухається!»</tspan></text>
<rect x="559.1" y="85.4" width="241.7" height="59.2" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="680.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Режим: AltHold (Втрата GPS)</tspan><tspan x="680.0" dy="15.6">«Стік у центрі = тримати кут 0°</tspan><tspan x="680.0" dy="15.6">(горизонтальний дрейф за вітром)»</tspan></text>
<rect x="531.8" y="170.4" width="296.4" height="59.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Фактична дія регулятора:</tspan><tspan x="680.0" dy="15.6">PID крену тримає 0°, але швидкість 12 м/с</tspan><tspan x="680.0" dy="15.6">Апарат несе інерція та порив вітру</tspan></text>
<rect x="579.0" y="275.4" width="202.0" height="59.2" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="293.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Фізичний наслідок:</tspan><tspan x="680.0" dy="15.6">Зіткнення з перешкодою</tspan><tspan x="680.0" dy="15.6">через хибні дії оператора</tspan></text>
<line x1="420.0" y1="115.0" x2="480.0" y2="115.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
