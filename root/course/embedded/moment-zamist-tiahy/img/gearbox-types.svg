<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Топології приводів ровера: компроміс ККД, реверсивності та габаритів</text>
<rect x="40.0" y="55.0" width="325.0" height="180.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="202.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Планетарний редуктор (Planetary)</text>
<line x1="52.0" y1="91.0" x2="353.0" y2="91.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="54.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Передавальне число i: 4:1 – 100:1 (багатоступеневий)</text>
<text x="54.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• ККД: 75–90% (падає як η^n зі ступенями)</text>
<text x="54.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зворотний хід: високий (ровер котиться зі схилу)</text>
<text x="54.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: тягові колеса всюдиходів, 4WD/6WD</text>
<rect x="395.0" y="55.0" width="325.0" height="180.0" rx="8" fill="#fefaf6" stroke="#d35400" stroke-width="1.8"/>
<text x="557.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">Черв'ячний редуктор (Worm Drive)</text>
<line x1="407.0" y1="91.0" x2="708.0" y2="91.0" stroke="#d35400" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="409.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Передавальне число i: 20:1 – 80:1 в 1 ступені</text>
<text x="409.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• ККД: 45–70% (високе тертя ковзання витків)</text>
<text x="409.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зворотний хід: самогальмування (тримає схил без струму!)</text>
<text x="409.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: роботи-маніпулятори, круті ухили, лебідки</text>
<rect x="40.0" y="255.0" width="325.0" height="180.0" rx="8" fill="#f0f8ff" stroke="#2980b9" stroke-width="1.8"/>
<text x="202.5" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2980b9" text-anchor="middle" font-weight="700">Циклоїдний / Хвильовий (Cycloidal/Strain-wave)</text>
<line x1="52.0" y1="291.0" x2="353.0" y2="291.0" stroke="#2980b9" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="54.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Передавальне число i: 30:1 – 150:1 в 1 ступені</text>
<text x="54.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• ККД: 70–85%, нульовий люфт (zero-backlash)</text>
<text x="54.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Висока жорсткість на скручування й ударні піки</text>
<text x="54.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: поворотні модулі осей, точні шарніри</text>
<rect x="395.0" y="255.0" width="325.0" height="180.0" rx="8" fill="#faf5ff" stroke="#8e44ad" stroke-width="1.8"/>
<text x="557.5" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">Прямий привід (Direct Drive / Hub Motor)</text>
<line x1="407.0" y1="291.0" x2="708.0" y2="291.0" stroke="#8e44ad" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="409.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Передавальне число i: 1:1 (без зубчастих передач)</text>
<text x="409.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• ККД: 85–95%, нульовий знос механіки, тиша</text>
<text x="409.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Недолік: малий крутний момент на низьких RPM</text>
<text x="409.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: швидкісні легкі патрульні ровери</text>
</svg>