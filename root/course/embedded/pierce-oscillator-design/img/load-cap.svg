<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підбір C1 і C2 під навантажувальну ємність CL</text>
<text x="180.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що кварц бачить ззовні</text>
<line x1="120.0" y1="110.0" x2="120.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="104.0" y1="110.0" x2="136.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="104.0" y1="100.0" x2="136.0" y2="100.0" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="120.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">C1</text>
<line x1="120.0" y1="140.0" x2="240.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="240.0" y1="110.0" x2="240.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="224.0" y1="110.0" x2="256.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="224.0" y1="100.0" x2="256.0" y2="100.0" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="240.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">C2</text>
<text x="180.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">через землю → послідовно</text>
<line x1="120.0" y1="100.0" x2="120.0" y2="80.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="120.0" cy="80.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="240.0" y1="100.0" x2="240.0" y2="80.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="240.0" cy="80.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="120.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">до кварцу</text>
<rect x="70.0" y="210.0" width="230.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="242.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">CL = C1·C2/(C1+C2) + Cпар</tspan></text>
<text x="185.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Cпар = ніжки + доріжки</text>
<text x="185.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(зазвичай 2…5 пФ)</text>
<line x1="360.0" y1="60.0" x2="360.0" y2="320.0" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="540.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Симетрично: C1 = C2 = C</text>
<rect x="420.0" y="95.0" width="250.0" height="50.0" rx="6" fill="#eef9f0" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">CL = C/2 + Cпар</tspan></text>
<rect x="420.0" y="160.0" width="250.0" height="50.0" rx="6" fill="#eef9f0" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">C = 2·(CL − Cпар)</tspan></text>
<text x="545.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">↓ беремо найближчий</text>
<text x="545.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">стандартний номінал</text>
<rect x="440.0" y="285.0" width="210.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="545.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">напр. 27 пФ на вивід</tspan></text>
