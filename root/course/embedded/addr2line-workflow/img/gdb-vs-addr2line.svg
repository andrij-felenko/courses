<text x="442.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">одна річ — зроблена добре</text>
<text x="575.0" y="258.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#6b7280" text-anchor="middle">cat log | addr2line -e fw.elf</text>
<text x="380.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Лаутер 1997-го виокремив саме цю операцію: ганяти GDB заради перекладу адрес — як танком забивати цвях.</text>
