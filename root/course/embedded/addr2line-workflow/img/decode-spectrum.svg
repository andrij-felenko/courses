<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи перетворити адреси на рядки</text>
<rect x="30.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="140.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">idf.py monitor</text>
<text x="140.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">автоматично, наживо</text>
<rect x="42.0" y="138.0" width="196.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">нуль зусиль; лише поки</tspan><tspan x="140.0" dy="15.6">дивишся живу консоль</tspan></text>
<line x1="252.0" y1="145.0" x2="268.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="2.0"/>
<text x="380.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">addr2line вручну</text>
<text x="380.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">лог із поля + .elf</text>
<rect x="282.0" y="138.0" width="196.0" height="66.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">слід з будь-якого логу,</tspan><tspan x="380.0" dy="15.6">без чипа; лише рядки</tspan></text>
<line x1="492.0" y1="145.0" x2="508.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="510.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="620.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">GDB над core dump</text>
<text x="620.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">повна сцена офлайн</text>
<rect x="522.0" y="138.0" width="196.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">змінні, кадри, всі задачі;</tspan><tspan x="620.0" dy="15.6">треба записаний дамп</tspan></text>
<text x="380.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ліворуч — менше зусиль; праворуч — більше сили й більше підготовки</text>
<text x="380.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">addr2line — золота середина: працює з голого тексту логу</text>
</svg>