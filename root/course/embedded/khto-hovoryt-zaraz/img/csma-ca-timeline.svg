<rect x="30.0" y="275.0" width="700.0" height="80.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="297.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Правила пріоритетів і арбітражу:</tspan><tspan x="380.0" dy="14.3">1. SIFS &lt; DIFS: відповідь ACK має абсолютний пріоритет над будь-яким новим кадром.</tspan><tspan x="380.0" dy="14.3">2. Випадковий відкат (Backoff = rand(0, CW) · SlotTime) розводить вузли, що чекали одночасно.</tspan><tspan x="380.0" dy="14.3">3. Замороження: вузол не скидає лічильник, а зупиняє його, зберігаючи чесну чергу.</tspan></text>
</svg>