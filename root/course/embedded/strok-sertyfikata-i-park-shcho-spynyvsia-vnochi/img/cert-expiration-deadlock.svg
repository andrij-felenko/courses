<text x="430.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ПАРАДОКС ТЕЛЕКЕРУВАННЯ: ЗАМКНЕНЕ КОЛО БЕЗВИХОДІ</text>
<text x="430.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Щоб оновити сертифікат, потрібен робочий зв'язок з OTA → але зв'язок неможливий через прострочений сертифікат</text>
