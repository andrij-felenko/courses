<text x="700.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(оновлений бекенд)</text>
<rect x="622.4" y="131.3" width="155.2" height="37.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Новий TLS сертифікат:</tspan><tspan x="700.0" dy="14.3">Видано новим Root CA</tspan></text>
<rect x="612.5" y="191.3" width="175.0" height="37.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Сервіс оновлення OTA:</tspan><tspan x="700.0" dy="14.3">Готовий надіслати новий CA</tspan></text>
<rect x="616.6" y="247.3" width="166.8" height="35.3" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="700.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Стан: Очікує підключення</tspan><tspan x="700.0" dy="14.3">Канал керування розірвано</tspan></text>
