<rect x="60.0" y="191.3" width="200.1" height="37.3" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="160.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">RTC / Таймер:</tspan><tspan x="160.0" dy="14.3">Збій або точний UTC &gt; notAfter</tspan></text>
