<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .hdr { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .label { font-family: system-ui, sans-serif; font-size: 11.5px; fill: #334155; }
      .code { font-family: ui-monospace, monospace; font-size: 11px; fill: #0f172a; }
      .box-pane { rx: 6px; ry: 6px; stroke-width: 1.5; }
      .flow-arrow { stroke: #0284c7; stroke-width: 1.8; fill: none; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="800" height="380" rx="8"/>
  <text class="title" x="24" y="30">Анатомія зворотної верифікації (Read-Back Verification)</text>
  <rect class="box-pane" x="24" y="65" width="220" height="95" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="hdr" x="36" y="87">1. Цільовий запис</text>
  <text class="code" x="36" y="110">Target = 0x34</text>
  <text class="label" x="36" y="130">[0b00110100] (Range+ODR)</text>
  <text class="label" x="36" y="148">wr_reg(CTRL_REG, 0x34)</text>
  <rect class="box-pane" x="280" y="65" width="220" height="95" fill="#fefce8" stroke="#fde047"/>
  <text class="hdr" x="292" y="87">2. Читання з шини</text>
  <text class="code" x="292" y="110">ReadBack = 0xB4</text>
  <text class="label" x="292" y="130">[0b10110100] (Біт 7=DRDY)</text>
  <text class="label" x="292" y="148">rd_reg(CTRL_REG, &amp;val)</text>
  <rect class="box-pane" x="280" y="195" width="220" height="85" fill="#fdf4ff" stroke="#f0abfc"/>
  <text class="hdr" x="292" y="217">3. Маскування (Care Bits)</text>
  <text class="code" x="292" y="240">MASK = 0x7F (біти 0..6 R/W)</text>
  <text class="label" x="292" y="260">Біт 7 (RO Status) ігнорується</text>
  <rect class="box-pane" x="540" y="115" width="235" height="110" fill="#f0fdf4" stroke="#86efac"/>
  <text class="hdr" x="552" y="137">4. Цифровий компаратор</text>
  <text class="code" x="552" y="160">(Target &amp; MASK) == (Read &amp; MASK)</text>
  <text class="code" x="552" y="180">(0x34 &amp; 0x7F) == (0xB4 &amp; 0x7F)</text>
  <text class="code" x="552" y="202" fill="#16a34a" font-weight="700">0x34 == 0x34  [MATCH!]</text>
  <line class="flow-arrow" x1="244" y1="110" x2="280" y2="110"/>
  <line class="flow-arrow" x1="390" y1="160" x2="390" y2="195"/>
  <line class="flow-arrow" x1="500" y1="160" x2="540" y2="160"/>
  <rect class="box-pane" x="540" y="295" width="110" height="60" fill="#dcfce7" stroke="#4ade80"/>
  <text class="hdr" x="550" y="319" fill="#15803d">УСПІХ (OK)</text>
  <text class="label" x="550" y="339">Наступний регістр</text>
  <rect class="box-pane" x="665" y="295" width="110" height="60" fill="#fee2e2" stroke="#f87171"/>
  <text class="hdr" x="675" y="319" fill="#b91c1c">РОЗБІЖНІСТЬ</text>
  <text class="label" x="675" y="339">Retry / Bus Reset</text>
  <line x1="595" y1="225" x2="595" y2="295" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="720" y1="225" x2="720" y2="295" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text class="label" x="24" y="320">Перевага: виявляє апаратні збої, коли лінія I2C/SPI відповіла ACK,</text>
  <text class="label" x="24" y="340">але значення не збереглося у регістрі через просідання VDD чи захист.</text>
</svg>