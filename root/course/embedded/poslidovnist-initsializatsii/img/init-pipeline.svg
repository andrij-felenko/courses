<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .step-hdr { font-family: system-ui, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: system-ui, sans-serif; font-size: 10.5px; fill: #475569; }
      .code { font-family: ui-monospace, monospace; font-size: 10px; fill: #1e293b; }
      .step-box { rx: 8px; ry: 8px; stroke-width: 1.5; }
      .flow-arrow { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .err-arrow { stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="420" rx="8"/>
  <text class="title" x="24" y="30">Архітектурний конвеєр надійної ініціалізації (Device Init Pipeline)</text>
  <rect class="step-box" x="24" y="58" width="150" height="180" fill="#f0fdf4" stroke="#86efac"/>
  <text class="step-hdr" x="34" y="80">1. POR &amp; Затримка</text>
  <text class="desc" x="34" y="102">• Подача VDD</text>
  <text class="desc" x="34" y="120">• Стабілізація LDO</text>
  <text class="desc" x="34" y="138">• Витримка t_boot</text>
  <text class="code" x="34" y="164" fill="#16a34a">delay_ms(10..50)</text>
  <text class="desc" x="34" y="188">Шина в Hi-Z стані</text>
  <text class="desc" x="34" y="206">Захист від NACK</text>
  <rect class="step-box" x="198" y="58" width="150" height="180" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="step-hdr" x="208" y="80">2. Скидання та ID</text>
  <text class="desc" x="208" y="102">• Запис SW_RESET</text>
  <text class="desc" x="208" y="120">• Poll Ready біта</text>
  <text class="desc" x="208" y="138">• Читання CHIP_ID</text>
  <text class="code" x="208" y="164" fill="#2563eb">id == EXPECT_ID</text>
  <text class="desc" x="208" y="188">Таймаут опитування</text>
  <text class="desc" x="208" y="206">Перевірка зв'язку</text>
  <rect class="step-box" x="372" y="58" width="150" height="180" fill="#fdf4ff" stroke="#f0abfc"/>
  <text class="step-hdr" x="382" y="80">3. Конфігурація</text>
  <text class="desc" x="382" y="102">1) Електрика (IO)</text>
  <text class="desc" x="382" y="120">2) Діапазон шкали</text>
  <text class="desc" x="382" y="138">3) Фільтр (DLPF)</text>
  <text class="desc" x="382" y="156">4) Частота ODR</text>
  <text class="desc" x="382" y="174">5) Переривання INT</text>
  <text class="code" x="382" y="200" fill="#9333ea">wr(REG, val)</text>
  <rect class="step-box" x="546" y="58" width="150" height="180" fill="#fefce8" stroke="#fde047"/>
  <text class="step-hdr" x="556" y="80">4. Read-Back</text>
  <text class="desc" x="556" y="102">• Зчитування назад</text>
  <text class="desc" x="556" y="120">• Бітова маска</text>
  <text class="desc" x="556" y="138">• Порівняння полів</text>
  <text class="code" x="556" y="164" fill="#ca8a04">(rd&amp;m) == (wr&amp;m)</text>
  <text class="desc" x="556" y="188">Ігнорування RO-біт</text>
  <text class="desc" x="556" y="206">Захист від збоїв</text>
  <rect class="step-box" x="720" y="58" width="150" height="180" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="step-hdr" x="730" y="80">5. Активація</text>
  <text class="desc" x="730" y="102">• Режим Normal</text>
  <text class="desc" x="730" y="120">• Час прогріву</text>
  <text class="desc" x="730" y="138">• Очищення FIFO</text>
  <text class="code" x="730" y="164" fill="#059669">STATE_READY</text>
  <text class="desc" x="730" y="188">Старт вимірювань</text>
  <text class="desc" x="730" y="206">Передача в app</text>
  <line class="flow-arrow" x1="174" y1="133" x2="198" y2="133"/>
  <line class="flow-arrow" x1="348" y1="133" x2="372" y2="133"/>
  <line class="flow-arrow" x1="522" y1="133" x2="546" y2="133"/>
  <line class="flow-arrow" x1="696" y1="133" x2="720" y2="133"/>
  <rect class="step-box" x="24" y="285" width="480" height="105" fill="#fff1f2" stroke="#fca5a5"/>
  <text class="step-hdr" x="36" y="307" fill="#e11d48">Обробка помилок та Retry Logic</text>
  <text class="desc" x="36" y="329">1. Збій зв'язку / NACK / Розбіжність Read-Back / Таймаут</text>
  <text class="desc" x="36" y="349">2. Лічильник спроб (retries &lt; MAX): експоненційний backoff</text>
  <text class="desc" x="36" y="369">3. Відновлення шини (Bus Recovery) та повтор з Кроку 1</text>
  <rect class="step-box" x="540" y="285" width="330" height="105" fill="#fef2f2" stroke="#ef4444"/>
  <text class="step-hdr" x="552" y="307" fill="#b91c1c">Аварійний Safe State</text>
  <text class="desc" x="552" y="329">• Вичерпано ліміт спроб (retries &gt;= MAX)</text>
  <text class="desc" x="552" y="349">• Відкат стану драйвера (Driver Rollback)</text>
  <text class="desc" x="552" y="369">• Перехід у безпечний режим системи</text>
  <line class="err-arrow" x1="273.0" y1="238" x2="273.0" y2="285"/>
  <line class="err-arrow" x1="447.0" y1="238" x2="447.0" y2="285"/>
  <line class="err-arrow" x1="621.0" y1="238" x2="621.0" y2="285"/>
  <line class="err-arrow" x1="504" y1="337" x2="540" y2="337"/>
</svg>