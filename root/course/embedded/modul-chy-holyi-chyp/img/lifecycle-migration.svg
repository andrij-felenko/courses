<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">4-етапна стратегія міграції конструктиву виробу</text>
<rect x="10.0" y="10.0" width="920.0" height="400.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="470.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція продукту: 4-етапна міграція від макетки до Chip-down</text>
<rect x="35.0" y="80.0" width="205.0" height="270.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.0"/>
<rect x="40.0" y="88.0" width="195.0" height="32.0" rx="4" fill="#d97706" stroke="#d97706" stroke-width="1.0"/>
<text x="137.5" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1. Прототип (PoC)</text>
<text x="137.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Тираж: 1 – 10 шт.</text>
<line x1="50.0" y1="154.0" x2="225.0" y2="154.0" stroke="#d97706" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="137.5" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.5" dy="0.0">DIP / Breakout плати</tspan><tspan x="137.5" dy="12.6">(Adafruit, SparkFun)</tspan></text>
<text x="137.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle"><tspan x="137.5" dy="0.0">Швидка перевірка ідеї на столі,</tspan><tspan x="137.5" dy="12.3">з'єднання dupont-проводами.</tspan></text>
<line x1="242.0" y1="215.0" x2="258.0" y2="215.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="260.0" y="80.0" width="205.0" height="270.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.0"/>
<rect x="265.0" y="88.0" width="195.0" height="32.0" rx="4" fill="#16a34a" stroke="#16a34a" stroke-width="1.0"/>
<text x="362.5" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2. Пілот (MVP)</text>
<text x="362.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Тираж: 100 – 1,000 шт.</text>
<line x1="275.0" y1="154.0" x2="450.0" y2="154.0" stroke="#16a34a" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="362.5" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="362.5" dy="0.0">Сертифікований SMD модуль</tspan><tspan x="362.5" dy="12.6">(ESP32-WROOM, Quectel)</tspan></text>
<text x="362.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle"><tspan x="362.5" dy="0.0">Швидкий TTM, модульний FCC ID, 2</tspan><tspan x="362.5" dy="12.3">-шарова базова плата.</tspan></text>
<line x1="467.0" y1="215.0" x2="483.0" y2="215.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="485.0" y="80.0" width="205.0" height="270.0" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.0"/>
<rect x="490.0" y="88.0" width="195.0" height="32.0" rx="4" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.0"/>
<text x="587.5" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3. Серія (Scale-up)</text>
<text x="587.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="700">Тираж: 1k – 10k шт.</text>
<line x1="500.0" y1="154.0" x2="675.0" y2="154.0" stroke="#4f46e5" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="587.5" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="587.5" dy="0.0">SoM / Оптимізований модуль</tspan><tspan x="587.5" dy="12.6">(виробничий стенд)</tspan></text>
<text x="587.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle"><tspan x="587.5" dy="0.0">Стабілізація прошивки, аналіз DF</tspan><tspan x="587.5" dy="12.3">M/DFT, підготовка до chip-down.</tspan></text>
<line x1="692.0" y1="215.0" x2="708.0" y2="215.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="710.0" y="80.0" width="205.0" height="270.0" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2.0"/>
<rect x="715.0" y="88.0" width="195.0" height="32.0" rx="4" fill="#db2777" stroke="#db2777" stroke-width="1.0"/>
<text x="812.5" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4. Масове вир-во</text>
<text x="812.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#db2777" text-anchor="middle" font-weight="700">Тираж: &gt; 10,000+ шт.</text>
<line x1="725.0" y1="154.0" x2="900.0" y2="154.0" stroke="#db2777" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="812.5" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="812.5" dy="0.0">Повний Chip-down дизайн</tspan><tspan x="812.5" dy="12.6">(голі QFN/BGA мікросхеми)</tspan></text>
<text x="812.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle"><tspan x="812.5" dy="0.0">Мінімальний BOM, власна FCC серт</tspan><tspan x="812.5" dy="12.3">ифікація, 4-6 шарові плати.</tspan></text>
<rect x="35.0" y="365.0" width="870.0" height="40.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="60.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Час виходу на ринок (TTM): від 2 тижнів → до 9-12 місяців</text>
<text x="880.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">Собівартість одиниці BOM: від $15+ → до &lt; $3.50</text>
</svg>