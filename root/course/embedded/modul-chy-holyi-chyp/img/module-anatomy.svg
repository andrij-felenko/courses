<text x="585.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start"><tspan x="585.0" dy="0.0">вбудований FCC ID усуває потребу дорогої</tspan><tspan x="585.0" dy="12.5">сертифікації випромінювача ($15k–$50k).</tspan></text>
