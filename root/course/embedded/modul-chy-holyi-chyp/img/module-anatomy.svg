<text x="585.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start"><tspan x="585.0" dy="0.0">декаплінг прямо під кристалом, трасування</tspan><tspan x="585.0" dy="12.5">Octal SPI без паразитних відбиттів.</tspan></text>
<circle cx="570.0" cy="357.0" r="5.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<text x="585.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Готовий модуль як чорна скринька:</text>
<text x="585.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start"><tspan x="585.0" dy="0.0">живлення 3.3 В + лінії UART/GPIO — базова</tspan><tspan x="585.0" dy="12.5">плата розробника лишається простою 2-шаровою.</tspan></text>
