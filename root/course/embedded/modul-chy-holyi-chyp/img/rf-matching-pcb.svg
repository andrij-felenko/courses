<text x="55.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Суцільний неперервний опорний шар GND під трасою (L2).</text>
<text x="55.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зшивка полігонів отворами (Via fence) з кроком &lt; λ/20.</text>
<text x="55.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Відсутність розривів імпедансу (постійна ширина W).</text>
<text x="55.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Повний зворотний струм тече строго під сигнальною трасою.</text>
<text x="55.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="start" font-weight="700">• Нульове паразитне випромінювання на гармоніках.</text>
