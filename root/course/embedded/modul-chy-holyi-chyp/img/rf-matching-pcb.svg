<text x="685.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="700">EMC завада!</text>
<text x="505.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Розрив опорного шару змушує струм робити петлю.</text>
<text x="505.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Стрибок імпедансу з 50 Ом до &gt; 120 Ом (високий КСХ).</text>
<text x="505.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Гострий кут створює паразитну ємність і відбиття хвиль.</text>
<text x="505.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Падіння дальності зв'язку на 60–80%.</text>
<text x="505.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="700">• Гарантований провал сертифікації FCC/CE по випромінюванню.</text>
