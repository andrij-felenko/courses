<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="350.0" height="320.0" rx="6" fill="#fdfbfb" stroke="#e0b4b4" stroke-width="1.2"/>
<text x="195.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Довгий дріт заземлення (12–15 см)</text>
<rect x="45.0" y="75.0" width="300.0" height="110.0" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.0"/>
<text x="60.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Паразитний LC-контур щупа:</text>
<text x="60.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• L_петлі ≈ 120–150 нГн (дріт + крокодил)</text>
<text x="60.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• C_щупа ≈ 12–15 пФ (вхідна ємність)</text>
<text x="60.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• f_рез ≈ 120 МГц (високочастотний дзвін)</text>
<text x="60.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">• V_паразитна = L · (di/dt) спотворює сигнал</text>
<line x1="50.0" y1="300.0" x2="340.0" y2="300.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="340.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">t</text>
<polyline points="60.0,250.0 100.0,250.0 110.0,210.0 125.0,290.0 140.0,225.0 155.0,265.0 170.0,242.0 185.0,254.0 200.0,250.0 330.0,250.0" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linejoin="round"/>
<text x="150.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Фантомний дзвін</text>
<rect x="390.0" y="20.0" width="350.0" height="320.0" rx="6" fill="#fbfdfb" stroke="#b4e0be" stroke-width="1.2"/>
<text x="565.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Пружинне заземлення (Ground Spring)</text>
<rect x="415.0" y="75.0" width="300.0" height="110.0" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.0"/>
<text x="430.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Мінімальна індуктивність контуру:</text>
<text x="430.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• L_петлі &lt; 5–8 нГн (коротка пружина)</text>
<text x="430.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Прямий контакт із землею конденсатора</text>
<text x="430.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• f_рез &gt; 800 МГц (поза смугою вимірювання)</text>
<text x="430.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">• Чиста перехідна характеристика без шуму</text>
<line x1="420.0" y1="300.0" x2="710.0" y2="300.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="710.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">t</text>
<polyline points="430.0,250.0 470.0,250.0 478.0,270.0 570.0,270.0 585.0,250.0 700.0,250.0" fill="none" stroke="#27ae60" stroke-width="2.2" stroke-linejoin="round"/>
<text x="524.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Справжній профіль провалу</text>
