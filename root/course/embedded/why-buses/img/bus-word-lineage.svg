<text x="270.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">1828</text>
<text x="270.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">повіз для всіх</text>
<circle cx="430.0" cy="120.0" r="8.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
