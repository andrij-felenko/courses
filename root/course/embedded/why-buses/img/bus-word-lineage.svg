<rect x="30.0" y="248.0" width="720.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#e0e0e0" stroke-width="1.0"/><text x="390.0" y="264.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Слово несе свою суть незмінно: лінія, СПІЛЬНА для всіх, хто до неї під'єднаний —</tspan><tspan x="390.0" dy="13.7">спершу пасажирів, потім кіл живлення, нарешті мікросхем на платі.</tspan></text>
