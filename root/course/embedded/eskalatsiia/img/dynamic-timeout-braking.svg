<text x="470.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формула розрахунку жорсткого дедлайну ескалації:</text>
<text x="470.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">T_deadline = (D_obs - D_brake - D_margin) / V_curr - t_sensor_lag</text>
