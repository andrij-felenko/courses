<text x="260.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">T_deadline = D_react / V = 2.25 с</text>
<rect x="410.0" y="220.0" width="260.0" height="60.0" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="540.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">ГАЛЬМІВНИЙ ШЛЯХ (D_brake = 16 м)</text>
<text x="540.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">a_max = 2.0 м/с² (фізична межа гальм)</text>
