<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="60.0" width="210.0" height="200.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="125.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Неоднозначність сцени</text>
<line x1="30.0" y1="98.0" x2="220.0" y2="98.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="125.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Softmax-ентропія вище норми;</tspan><tspan x="125.0" dy="14.9">дві близькі гіпотези:</tspan><tspan x="125.0" dy="14.9">• P(людина) = 0.48</tspan><tspan x="125.0" dy="14.9">• P(тінь/мішок) = 0.52</tspan><tspan x="125.0" dy="14.9">Ціна помилки неприйнятна.</tspan></text>
<line x1="125.0" y1="260.0" x2="125.0" y2="305.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250.0" y="60.0" width="210.0" height="200.0" rx="8" fill="#fff0f0" stroke="#c0392b" stroke-width="2.0"/>
<text x="355.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Глухий кут планувальника</text>
<line x1="260.0" y1="98.0" x2="450.0" y2="98.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="355.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">Усі кандидатні траєкторії в</tspan><tspan x="355.0" dy="14.9">сітці вартостей (costmap)</tspan><tspan x="355.0" dy="14.9">заблоковані або мають вартість</tspan><tspan x="355.0" dy="14.9">вище допустимої стелі безпеки.</tspan></text>
<line x1="355.0" y1="260.0" x2="355.0" y2="305.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="60.0" width="210.0" height="200.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.0"/>
<text x="585.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">3. Сіра зона детекції</text>
<line x1="490.0" y1="98.0" x2="680.0" y2="98.0" stroke="#d97706" stroke-width="1.2"/>
<text x="585.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Критичний об'єкт у діапазоні</tspan><tspan x="585.0" dy="14.9">граничної впевненості [0.4..0.7]:</tspan><tspan x="585.0" dy="14.9">ігнорувати небезпечно,</tspan><tspan x="585.0" dy="14.9">аварійне гальмування — зрив місії.</tspan></text>
<line x1="585.0" y1="260.0" x2="585.0" y2="305.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="710.0" y="60.0" width="210.0" height="200.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.0"/>
<text x="815.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">4. Вихід за межі ODD</text>
<line x1="720.0" y1="98.0" x2="910.0" y2="98.0" stroke="#7c3aed" stroke-width="1.2"/>
<text x="815.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Порушення робочого домену:</tspan><tspan x="815.0" dy="14.9">• засліплення камери сонцем</tspan><tspan x="815.0" dy="14.9">• знос вітром &gt; 12 м/с</tspan><tspan x="815.0" dy="14.9">• розходження EKF (іновації &gt; 3σ)</tspan><tspan x="815.0" dy="14.9">• OOD-аномалія на вході.</tspan></text>
<line x1="815.0" y1="260.0" x2="815.0" y2="305.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="310.0" width="780.0" height="110.0" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2.0"/>
<text x="470.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">БОРТОВИЙ МОДУЛЬ ЕСКАЛАЦІЇ (Escalation Supervisor)</text>
<text x="470.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle"><tspan x="470.0" dy="0.0">1. Фіксація поточного безпечного стану та увімкнення динамічного таймера</tspan><tspan x="470.0" dy="16.2">2. Пакування контексту: стиснутий ROI 256x256 + локальна сітка + вектор стану</tspan><tspan x="470.0" dy="16.2">3. Генерація структурованих варіантів дій A / B / C і надсилання оператору</tspan></text>
</svg>