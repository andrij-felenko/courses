<rect x="20.0" y="330.0" width="900.0" height="85.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="40.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">ВІДПОВІДЬ ОПЕРАТОРА (ESCALATION_RESPONSE):</text>
<text x="40.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="40.0" dy="0.0">• query_id (2 байти) + selected_option (1 байт) + auth_token (4 байти) = 7 байтів корисного навантаження.</tspan><tspan x="40.0" dy="15.0">• Оператор не формує складну траєкторію вручну — він обирає одне з прорахованих безпечних рішень одним кліком.</tspan></text>
