<text x="32.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="32.0" dy="0.0">• ID запиту: 0x8A4F</tspan><tspan x="32.0" dy="14.9">• Код причини: PATH_BLOCKED</tspan><tspan x="32.0" dy="14.9">• Рівень тривоги: WARNING</tspan><tspan x="32.0" dy="14.9">• Часова мітка: 142.850 с</tspan><tspan x="32.0" dy="14.9">• Динамічний дедлайн: 3.2 с</tspan></text>
