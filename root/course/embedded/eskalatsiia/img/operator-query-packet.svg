<text x="333.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">Секція 2: Візуальний ROI</text>
<line x1="231.0" y1="134.0" x2="435.0" y2="134.0" stroke="#059669" stroke-width="1.0"/>
<text x="235.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="235.0" dy="0.0">• Кроп камери: 256x256 px</tspan><tspan x="235.0" dy="14.9">• Формат: JPEG Q=45 (280 B)</tspan><tspan x="235.0" dy="14.9">• Bounding Box детекції</tspan><tspan x="235.0" dy="14.9">• Вектор руху цілі (Vx, Vy)</tspan><tspan x="235.0" dy="14.9">• Клас: UNKNOWN_OBSTACLE</tspan></text>
