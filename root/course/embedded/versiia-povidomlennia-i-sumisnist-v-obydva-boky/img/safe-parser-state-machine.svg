<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 843.6 383" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="843.6" height="383" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр відмовостійкого розбору версіонованого пакета</text>
<rect x="25.0" y="55.5" width="170.0" height="69.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">1. Валідація заголовка</tspan><tspan x="110.0" dy="13.0">Magic == 0xAA55</tspan><tspan x="110.0" dy="13.0">CRC8 заголовка</tspan><tspan x="110.0" dy="13.0">Major_Ver == SUPPORTED</tspan></text>
<line x1="195.0" y1="90.0" x2="245.0" y2="90.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="253.1" y="55.5" width="173.9" height="69.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">2. Ініціалізація результату</tspan><tspan x="340.0" dy="13.0">memset(&amp;msg, 0, sizeof)</tspan><tspan x="340.0" dy="13.0">Temp = NAN, Volt = 0</tspan><tspan x="340.0" dy="13.0">present_mask = 0</tspan></text>
<line x1="425.0" y1="90.0" x2="475.0" y2="90.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500.0" y="55.5" width="200.0" height="69.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="600.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">3. Цикл розбору полів</tspan><tspan x="600.0" dy="13.0">Поки (offset &lt; payload_len):</tspan><tspan x="600.0" dy="13.0">Перевірка залишку буфера</tspan><tspan x="600.0" dy="13.0">Зчитування Tag + Len</tspan></text>
<line x1="600.0" y1="135.0" x2="340.0" y2="195.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Тег відомий</text>
<line x1="600.0" y1="135.0" x2="600.0" y2="195.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="622.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="700">Тег невідомий</text>
<line x1="700.0" y1="115.0" x2="760.0" y2="115.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="730.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Збій len</text>
<rect x="716.4" y="133.8" width="107.2" height="52.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="151.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Аварійне скидання</tspan><tspan x="770.0" dy="11.7">PARSE_ERR_BOUNDS</tspan><tspan x="770.0" dy="11.7">Пакет відхилено</tspan></text>
<line x1="760.0" y1="115.0" x2="770.0" y2="130.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="245.0" y="199.0" width="190.0" height="82.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="217.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">4A. Розбір значення</tspan><tspan x="340.0" dy="13.0">Валідація Len == expected</tspan><tspan x="340.0" dy="13.0">read_le32/16 (без UB)</tspan><tspan x="340.0" dy="13.0">msg.field = val</tspan><tspan x="340.0" dy="13.0">present_mask |= FLAG</tspan></text>
<rect x="478.9" y="192.5" width="242.3" height="95.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="600.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">4B. Перевірка прапорця критичності</tspan><tspan x="600.0" dy="13.0">Якщо Tag &amp; CRITICAL_BIT:</tspan><tspan x="600.0" dy="13.0">  → ПОМИЛКА: невідоме обов'язкове поле!</tspan><tspan x="600.0" dy="13.0">Інакше:</tspan><tspan x="600.0" dy="13.0">  offset += Len (безпечний пропуск)</tspan><tspan x="600.0" dy="13.0">  skipped_tags_count++</tspan></text>
<line x1="340.0" y1="285.0" x2="470.0" y2="335.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="600.0" y1="285.0" x2="470.0" y2="335.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300.0" y="307.0" width="340.0" height="56.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="325.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">5. Успішний результат (PARSE_OK)</tspan><tspan x="470.0" dy="13.0">Повідомлення готове до обробки прикладною логікою;</tspan><tspan x="470.0" dy="13.0">Всі відомі поля заповнені, нові коректно пропущені.</tspan></text>
</svg>