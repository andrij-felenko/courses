<text x="380.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідок дефекту: DMA пропускає запис байта без BusFault помилки (Silent Data Corruption)</text>
