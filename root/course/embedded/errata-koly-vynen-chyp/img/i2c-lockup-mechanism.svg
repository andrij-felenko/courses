<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм апаратного зависання I2C (STM32F103 Silicon Errata)</text>
<rect x="40.0" y="55.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична лінія I2C</text>
<line x1="55.0" y1="105.0" x2="225.0" y2="105.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="60.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">SDA (3.3V)</text>
<line x1="55.0" y1="135.0" x2="225.0" y2="135.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="60.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">SCL (3.3V)</text>
<text x="140.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Шина вільна, є підтяжка</text>
<line x1="240.0" y1="110.0" x2="285.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="285.0" y="55.0" width="210.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="390.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Аналоговий Noise Filter</text>
<text x="390.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Сплеск завади (&lt; 50 нс)</text>
<text x="390.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Хибний детекшн START</text>
<text x="390.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">FSM у невалідному стані</text>
<text x="390.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Clock stretching триває</text>
<line x1="495.0" y1="110.0" x2="540.0" y2="110.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="55.0" width="180.0" height="110.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.8"/>
<text x="630.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Регістри I2C_SR1 / SR2</text>
<rect x="555.0" y="92.0" width="150.0" height="24.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="630.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">SR2: BUSY = 1 (LATCH)</text>
<rect x="555.0" y="122.0" width="150.0" height="24.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="630.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">SR1: BTF / ADDR = 0</text>
<line x1="630.0" y1="165.0" x2="630.0" y2="205.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380.0" y="205.0" width="340.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="550.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Глухий кут у стандартному драйвері</text>
<rect x="400.0" y="240.0" width="300.0" height="32.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="550.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">while (I2C1-&gt;SR2 &amp; I2C_SR2_BUSY);</text>
<text x="550.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Прапорець BUSY ніколи не скинеться апаратно!</text>
<text x="550.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Потрібен примусовий RCC reset периферії</text>
<rect x="40.0" y="205.0" width="300.0" height="120.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="190.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Апаратне лікування (Workaround)</text>
<text x="60.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. RCC-&gt;APB1RSTR |= I2C1RST (скидання блоку)</text>
<text x="60.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. GPIO Bit-Bang: 9 тактів SCL (скидання Slave)</text>
<text x="60.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Генерація STOP на шині через GPIO</text>
<text x="60.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">4. Повна переініціалізація I2C регістрами</text>
</svg>