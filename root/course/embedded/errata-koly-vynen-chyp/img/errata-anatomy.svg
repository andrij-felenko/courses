<text x="75.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Рекомендований обхід (Workaround):</text>
<text x="75.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Програмне скидання периферії через біт I2C1RST у регістрі RCC-&gt;APB1RSTR.</text>
<text x="75.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Переведення пінів у GPIO: вибити 9 тактів на SCL для звільнення лінії SDA зовнішнім слейвом.</text>
