<text x="75.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Короткий сплеск завади під час очікування шини переводить аналоговий фільтр у стан десинхронізації.</text>
<text x="75.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Скінченний автомат виставляє біт BUSY=1. Генерація тактів SCL зупиняється навічно, модуль не реагує на START.</text>
