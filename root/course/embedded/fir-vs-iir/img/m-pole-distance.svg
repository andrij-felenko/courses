<rect x="60.0" y="300.0" width="640.0" height="56.0" rx="6" fill="#fbf7ee" stroke="#b9770e" stroke-width="1.4"/><text x="380.0" y="331.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">У лупі коло майже пряме, а полюс — на глибині 1−r під ним. Найближче точка підходить рівно над полюсом: d_min ≈ 1−r. Відстань виростає в √2 (потужність удвічі менша, −3 дБ), коли точка відходить убік теж на ≈ 1−r → ширина піка Δω ≈ 2(1−r).</tspan></text>
