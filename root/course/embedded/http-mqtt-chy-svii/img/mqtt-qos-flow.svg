<line x1="220.0" y1="85.0" x2="220.0" y2="310.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="70.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Клієнт</text>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Брокер</text>
