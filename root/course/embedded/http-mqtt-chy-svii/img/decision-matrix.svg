<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -10 910 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-70" y="-10" width="910" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інженерна матриця вибору протоколу до сервера</text>
<rect x="25.0" y="56.0" width="210.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Батарейне живлення</tspan><tspan x="130.0" dy="14.3">(глибокий сон 95%+)</tspan></text>
<rect x="475.0" y="56.0" width="210.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Постійне живлення</tspan><tspan x="580.0" dy="14.3">(мережа / бортова мережа)</tspan></text>
<rect x="25.0" y="156.0" width="210.0" height="48.0" rx="6" fill="#fff8e1" stroke="#1a1a1a" stroke-width="1.5"/><text x="130.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Трафік критичний?</tspan><tspan x="130.0" dy="14.3">(NB-IoT / LoRa / супутник)</tspan></text>
<rect x="-60.0" y="254.0" width="180.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="30.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="30.0" dy="0.0">Так: ліміт байтів</tspan><tspan x="30.0" dy="14.3">→ Власний бінарний UDP</tspan><tspan x="30.0" dy="14.3">або CoAP</tspan></text>
<rect x="140.0" y="254.0" width="180.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Ні: Wi-Fi / LTE-M</tspan><tspan x="230.0" dy="14.3">→ HTTP REST (JSON/CBOR)</tspan><tspan x="230.0" dy="14.3">короткі пачки</tspan></text>
<rect x="475.0" y="156.0" width="210.0" height="48.0" rx="6" fill="#fff8e1" stroke="#1a1a1a" stroke-width="1.5"/><text x="580.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Потрібен миттєвий зворотний</tspan><tspan x="580.0" dy="14.3">контроль (Push від сервера)?</tspan></text>
<rect x="390.0" y="254.0" width="180.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Так: двосторонній канал</tspan><tspan x="480.0" dy="14.3">→ MQTT (TLS, Keep-Alive)</tspan><tspan x="480.0" dy="14.3">або WebSockets</tspan></text>
<rect x="590.0" y="254.0" width="180.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Ні: тільки вивантаження</tspan><tspan x="680.0" dy="14.3">логів / OTA / телеметрія</tspan><tspan x="680.0" dy="14.3">→ HTTP/HTTPS REST</tspan></text>
<line x1="130.0" y1="104.0" x2="130.0" y2="156.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="580.0" y1="104.0" x2="580.0" y2="156.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="100.0" y1="204.0" x2="60.0" y2="254.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="60.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Так</text>
<line x1="160.0" y1="204.0" x2="200.0" y2="254.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="195.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Ні</text>
<line x1="550.0" y1="204.0" x2="510.0" y2="254.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="510.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Так</text>
<line x1="610.0" y1="204.0" x2="650.0" y2="254.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="645.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Ні</text>
<rect x="74.6" y="390.2" width="690.9" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="409.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Критерій вибору зводиться до двох запитань: (1) чи дозволяє бюджет енергії тримати TCP-з'єднання відкритим?</tspan><tspan x="420.0" dy="14.3">(2) чи повинна хмара миттєво віддавати команди на пристрій без запиту з його боку?</tspan><tspan x="420.0" dy="14.3">Відповідь «Ні + Ні» веде до бінарного UDP; «Ні + Так» — до MQTT; «Так + Ні» — до стандартного HTTP/REST.</tspan></text>
</svg>