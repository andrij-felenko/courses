<line x1="150.0" y1="245.0" x2="150.0" y2="185.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="430.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">напруга на активній лінії &lt; порога присутності  →  on_detach, навантаження OFF</text>
