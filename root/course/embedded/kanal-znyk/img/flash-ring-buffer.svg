<rect x="76.6" y="405.1" width="686.9" height="69.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="420.0" y="422.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1. Дозапис кадру: записуються всі поля, крім Commit Token (у флеші лишається 0xFFFFFFFF).</tspan><tspan x="420.0" dy="14.3">2. Перевірка цілісності: MCU зчитує записаний кадр і звіряє CRC32.</tspan><tspan x="420.0" dy="14.3">3. Фіксація (Commit): слово Commit Token програмується в 0xAA55AA55 (перехід 1 → 0 без стирання).</tspan><tspan x="420.0" dy="14.3">Якщо живлення зникло посеред запису — токен лишається 0xFF, і під час старту пошкоджений запис ігнорується.</tspan></text>
