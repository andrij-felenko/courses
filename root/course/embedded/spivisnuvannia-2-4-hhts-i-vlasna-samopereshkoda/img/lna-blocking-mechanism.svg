<line x1="490.0" y1="133.0" x2="548.0" y2="133.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="485.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e8449" text-anchor="end" font-weight="700">Корисний сигнал -95 dBm</text>
<rect x="600.0" y="120.0" width="160.0" height="65.0" rx="6" fill="#ebf5fb" stroke="#3498db" stroke-width="1.4"/>
<text x="680.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b4f72" text-anchor="middle" font-weight="700">Вхідний LNA</text>
<text x="680.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">P₁dB ≈ -10 dBm</text>
<text x="680.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">IIP3 ≈ 0 dBm</text>
<rect x="540.0" y="200.0" width="220.0" height="105.0" rx="6" fill="#fdecea" stroke="#e74c3c" stroke-width="1.2"/>
<text x="650.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#922b21" text-anchor="middle" font-weight="700">Наслідки самоперешкоди:</text>
<text x="650.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">1. Насичення LNA: Gain падає на &gt;15 dB</text>
<text x="650.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">2. Зворотне змішування шуму (Reciprocal Mix)</text>
<text x="650.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">3. Інтермодуляція IMD3 прямо в смугу RX</text>
<text x="650.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78281f" text-anchor="middle" font-weight="700">Підсумок: 100% втрата пакетів (PER = 1.0)</text>
<text x="410.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Без часового арбітражу (PTA) або фільтрації передавач Wi-Fi засліплює сусідній LNA на тій самій платі</text>
