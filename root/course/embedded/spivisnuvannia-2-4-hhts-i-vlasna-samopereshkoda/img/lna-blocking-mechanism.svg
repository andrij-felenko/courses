<rect x="280.0" y="110.0" width="220.0" height="160.0" rx="8" fill="#f8f9f9" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="390.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="700">Паразитний зв'язок на платі</text>
<line x1="260.0" y1="160.0" x2="500.0" y2="160.0" stroke="#e74c3c" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="390.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Потужна завада Wi-Fi</text>
<text x="390.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2980b9" text-anchor="middle" font-weight="700">Розв'язка антен: S₂₁ ≈ -20 dB</text>
<text x="390.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Рівень на вході LNA: 0 dBm</text>
<text x="390.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#922b21" text-anchor="middle">(на 10 дБ вище точки P1dB!)</text>
<text x="390.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Пряме наведення по спільній землі</text>
