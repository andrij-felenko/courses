<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="490.0" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="420.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна архітектура вбудованої системи</text><rect x="35.0" y="65.0" width="365.0" height="200.0" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2.0"/><rect x="35.0" y="65.0" width="365.0" height="32.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="217.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">1. Підсистема живлення (Power)</text><text x="50.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Джерела: Мережа AC/DC, Li-Ion, LiFePO4, Батарея</text><text x="50.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Перетворення: Імпульсні DC-DC (ККД 85-95%) та LDO</text><text x="50.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Захист: TVS-діоди від ESD, захист від переполюсовки</text><text x="50.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Розв'язка: Декаплінг 100 нФ + 10 мкФ біля VDD</text><rect x="440.0" y="65.0" width="365.0" height="200.0" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.0"/><rect x="440.0" y="65.0" width="365.0" height="32.0" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="622.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">2. Обчислювальне ядро (Compute)</text><text x="455.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Процесор: Ядро MCU (Cortex-M, RISC-V, AVR) або SoC</text><text x="455.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Пам'ять: Вбудована Flash (код) + швидка SRAM (дані)</text><text x="455.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Тактування: Кварцовий резонатор (HSE), RC, PLL</text><text x="455.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Надійність: Сторожовий таймер (WDT), скидання (BOD)</text><rect x="35.0" y="285.0" width="365.0" height="200.0" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2.0"/><rect x="35.0" y="285.0" width="365.0" height="32.0" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="217.5" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">3. Периферія та інтерфейси (Interconnect)</text><text x="50.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Базовий ввід/вивід: GPIO (Push-Pull, Open-Drain)</text><text x="50.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Платові шини: I2C (адресна, 2 дроти), SPI (швидка), UART</text><text x="50.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Промислові мережі: CAN-bus, RS-485, USB</text><text x="50.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Радіозв'язок: BLE, Wi-Fi, LoRa Sub-1GHz, Zigbee</text><rect x="440.0" y="285.0" width="365.0" height="200.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2.0"/><rect x="440.0" y="285.0" width="365.0" height="32.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="622.5" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">4. Фізичний світ (Sensors &amp; Actuators)</text><text x="455.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Сенсори: Аналогові й цифрові МЕМС (тиск, темп., IMU)</text><text x="455.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Кондиціювання: Підсилювачі (Op-Amp), фільтри (AAF), АЦП</text><text x="455.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Актуатори: Двигуни (DC, BLDC, Stepper), реле, нагрів</text><text x="455.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Силові драйвери: MOSFET-ключі, H-мости, оптопари</text><line x1="217.0" y1="265.0" x2="217.0" y2="285.0" stroke="#64748b" stroke-width="2.0" stroke-dasharray="3,3"/><line x1="622.0" y1="265.0" x2="622.0" y2="285.0" stroke="#64748b" stroke-width="2.0" stroke-dasharray="3,3"/><line x1="400.0" y1="165.0" x2="440.0" y2="165.0" stroke="#64748b" stroke-width="2.0" stroke-dasharray="3,3"/><line x1="400.0" y1="385.0" x2="440.0" y2="385.0" stroke="#64748b" stroke-width="2.0" stroke-dasharray="3,3"/>
</svg>