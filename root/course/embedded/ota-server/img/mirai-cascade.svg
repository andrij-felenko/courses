<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскад 2016-го: дешева камера поклала пів-інтернету</text>
<rect x="30.0" y="110.0" width="150.0" height="96.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="105.0" y="147.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">~150 тис. камер</tspan><tspan x="105.0" dy="15.6">і DVR</tspan><tspan x="105.0" dy="15.6">пароль admin</tspan></text>
<text x="105.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">стандартні</text>
<text x="105.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">заводські паролі</text>
<rect x="230.0" y="110.0" width="140.0" height="96.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="300.0" y="147.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">MIRAI</tspan><tspan x="300.0" dy="15.6">перебір 62 пар</tspan><tspan x="300.0" dy="15.6">логін/пароль</tspan></text>
<text x="300.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">росте сама,</text>
<text x="300.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">як епідемія</text>
<rect x="420.0" y="110.0" width="140.0" height="96.0" rx="10" fill="#eef4ff" stroke="#2457d6" stroke-width="1.7"/><text x="490.0" y="147.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">удар по Dyn</tspan><tspan x="490.0" dy="15.6">(DNS-служба)</tspan><tspan x="490.0" dy="15.6">~1.2 Тбіт/с</tspan></text>
<text x="490.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">21.10.2016</text>
<text x="490.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">телефонна книга</text>
<rect x="605.0" y="110.0" width="130.0" height="96.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.7"/><text x="670.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">недосяжні:</tspan><tspan x="670.0" dy="15.0">Twitter, GitHub</tspan><tspan x="670.0" dy="15.0">Netflix, Reddit</tspan></text>
<text x="670.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">самі живі —</text>
<text x="670.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">адреси не знайти</text>
<line x1="182.0" y1="158.0" x2="228.0" y2="158.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrR)" stroke-linecap="round"/>
<line x1="372.0" y1="158.0" x2="418.0" y2="158.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrR)" stroke-linecap="round"/>
<line x1="562.0" y1="158.0" x2="603.0" y2="158.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">вразливість — не код сайтів, а заводський пароль у двадцятидоларовій камері</text>
<text x="380.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зброєю стали РЕЧІ звичайних людей, оновлювані абияк або ніяк</text>
</svg>