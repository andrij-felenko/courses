<line x1="628.0" y1="140.0" x2="685.0" y2="140.0" stroke="#68d391" stroke-width="2.0"/>
<line x1="685.0" y1="140.0" x2="690.0" y2="185.0" stroke="#68d391" stroke-width="2.0"/>
<line x1="690.0" y1="185.0" x2="780.0" y2="185.0" stroke="#48bb78" stroke-width="1.8"/>
<text x="690.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#68d391" text-anchor="middle" font-weight="700">Vcc + Vz (швидко)</text>
<text x="581.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Пік: Vcc + Vz (наприклад 36 В)</text>
<text x="581.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Час: швидко (t ≈ L·I₀/Vz)</text>
<text x="581.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Ідеальний компроміс: швидке</text>
<text x="581.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">гасіння магнітного поля без дуги</text>
<text x="581.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">й безпечна напруга для ключа.</text>
