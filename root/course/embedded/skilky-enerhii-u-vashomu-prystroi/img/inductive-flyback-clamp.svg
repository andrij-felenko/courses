<text x="420.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2. Діод вільного ходу</text>
<text x="420.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Flyback Diode паралельно котушці</text>
<rect x="320.0" y="110.0" width="200.0" height="95.0" rx="4" fill="#1a202c" stroke="#4a5568" stroke-width="1.0"/>
<line x1="330.0" y1="185.0" x2="355.0" y2="185.0" stroke="#48bb78" stroke-width="1.8"/>
<line x1="355.0" y1="185.0" x2="358.0" y2="167.0" stroke="#63b3ed" stroke-width="2.0"/>
<line x1="358.0" y1="167.0" x2="495.0" y2="167.0" stroke="#63b3ed" stroke-width="2.0"/>
<line x1="495.0" y1="167.0" x2="510.0" y2="185.0" stroke="#48bb78" stroke-width="1.8"/>
<text x="420.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#63b3ed" text-anchor="middle" font-weight="700">Vcc + 0.7 В (повільно)</text>
<text x="311.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Пік: Vcc + 0.7 В</text>
<text x="311.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2980b9" text-anchor="start" font-weight="700">Час: повільно (3..5 · L/R)</text>
<text x="311.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Захищає ключ надійно,</text>
<text x="311.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">але затягує відпускання реле.</text>
<text x="311.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Контакти тягнуть дугу й горять.</text>
<rect x="565.0" y="30.0" width="250.0" height="300.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="565.0" y="30.0" width="250.0" height="38.0" rx="0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="690.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3. Діод + Стабілітрон / TVS</text>
<text x="690.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Zener Clamp для швидкого скидання</text>
<rect x="590.0" y="110.0" width="200.0" height="95.0" rx="4" fill="#1a202c" stroke="#4a5568" stroke-width="1.0"/>
