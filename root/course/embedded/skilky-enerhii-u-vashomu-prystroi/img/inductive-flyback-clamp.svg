<text x="150.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1. Без захисту (Аварія)</text>
<text x="150.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">V = -L · (di/dt) → сотні вольт</text>
<rect x="50.0" y="110.0" width="200.0" height="95.0" rx="4" fill="#1a202c" stroke="#4a5568" stroke-width="1.0"/>
<line x1="60.0" y1="185.0" x2="85.0" y2="185.0" stroke="#48bb78" stroke-width="1.8"/>
