<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскадні температурні фази теплового розгону літієвого акумулятора</text>
<rect x="10.0" y="10.0" width="820.0" height="340.0" rx="8" fill="#fdfefe" stroke="#6b7280" stroke-width="1.0"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика та хімія теплового розгону (Thermal Runaway) у Li-ion</text>
<rect x="26.0" y="60.0" width="148.0" height="260.0" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.8"/>
<rect x="26.0" y="60.0" width="148.0" height="36.0" rx="0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="100.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">&lt; 60 °C</text>
<text x="100.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Норма / Нагрів</text>
<text x="36.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Робочий стан або</text>
<text x="36.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">струмове перевантаження (I²·R).</text>
<line x1="176.0" y1="190.0" x2="184.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="186.0" y="60.0" width="148.0" height="260.0" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.8"/>
<rect x="186.0" y="60.0" width="148.0" height="36.0" rx="0" fill="#d69e2e" stroke="#d69e2e" stroke-width="1.0"/>
<text x="260.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">80–120 °C</text>
<text x="260.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d69e2e" text-anchor="middle" font-weight="700">Розпад пасивації (SEI)</text>
<text x="196.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Руйнування плівки SEI.</text>
<text x="196.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Екзотермічна реакція анода</text>
<text x="196.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">з органічним розчинником.</text>
<line x1="336.0" y1="190.0" x2="344.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="346.0" y="60.0" width="148.0" height="260.0" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.8"/>
<rect x="346.0" y="60.0" width="148.0" height="36.0" rx="0" fill="#dd6b20" stroke="#dd6b20" stroke-width="1.0"/>
<text x="420.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">130–170 °C</text>
<text x="420.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dd6b20" text-anchor="middle" font-weight="700">Плавлення сепаратора</text>
<text x="356.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ПЕ/ПП мембрана плавиться.</text>
<text x="356.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Масивне внутрішнє КЗ</text>
<text x="356.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">між катодом і анодом.</text>
<line x1="496.0" y1="190.0" x2="504.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="506.0" y="60.0" width="148.0" height="260.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<rect x="506.0" y="60.0" width="148.0" height="36.0" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="580.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">180–220 °C</text>
<text x="580.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Розпад катода + O₂</text>
<text x="516.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Оксид металу виділяє кисень!</text>
<text x="516.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Горіння електроліту</text>
<text x="516.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">не потребує зовнішнього повітря.</text>
<line x1="656.0" y1="190.0" x2="664.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="666.0" y="60.0" width="148.0" height="260.0" rx="6" fill="#fff5f5" stroke="#742a2a" stroke-width="1.8"/>
<rect x="666.0" y="60.0" width="148.0" height="36.0" rx="0" fill="#742a2a" stroke="#742a2a" stroke-width="1.0"/>
<text x="740.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">&gt; 600–900 °C</text>
<text x="740.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#742a2a" text-anchor="middle" font-weight="700">Тепловий вибух</text>
<text x="676.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Струмінь полум'я, тиск газів,</text>
<text x="676.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">викид розплавленого металу,</text>
<text x="676.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ланцюговий розгін батареї.</text>
</svg>