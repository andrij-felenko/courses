<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 878.4 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="878.4" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схеми розрядників та часові діаграми пасивного й активного знеструмлення</text>
<rect x="10.0" y="10.0" width="820.0" height="340.0" rx="8" fill="#fdfefe" stroke="#6b7280" stroke-width="1.0"/>
<text x="220.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схемотехніка безпечного розряду (Bleeder)</text>
<rect x="25.0" y="55.0" width="385.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="35.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Пасивний резистор (постійні втрати)</text>
<text x="35.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Формула розряду: V(t) = V₀ · exp(-t / (R · C))</text>
<text x="35.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Постійні втрати тепла під час роботи: P = V² / R</text>
<text x="35.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Для 400 В і R=100 кОм: P_loss = 1.6 Вт постійно!</text>
<text x="35.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">• Час до 50 В (безпечно): t_safe ≈ 2.1 · R · C ≈ 100 с</text>
<rect x="25.0" y="195.0" width="385.0" height="140.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="35.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Активний розрядник (Zero Standby Loss)</text>
<text x="35.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ключ (MOSFET / Depletion / IC типу CAPZero).</text>
<text x="35.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• При наявності мережі ключ закритий: P_loss ≈ 0 мВт.</text>
<text x="35.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• При зникненні мережі ключ відкривається миттєво.</text>
<text x="35.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Малий опір розряду R_act = 5–10 кОм → розряд &lt; 1 с!</text>
<text x="35.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Виконує вимоги IEC 62368-1 / UL 60950.</text>
<text x="625.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крива розряду конденсатора V(t)</text>
<line x1="475.0" y1="290.0" x2="810.0" y2="290.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="475.0" y1="290.0" x2="475.0" y2="60.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="805.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">час t (с)</text>
<text x="467.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700" font-style="italic">Напруга V</text>
<line x1="475.0" y1="90.0" x2="795.0" y2="90.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="469.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">400 В</text>
<line x1="475.0" y1="265.0" x2="795.0" y2="265.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="799.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">50 В (SELV)</text>
