<rect x="10.0" y="10.0" width="920.0" height="410.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат детектора посадки (Land Detector FSM)</text>
<rect x="25.0" y="85.0" width="175.0" height="90.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.0"/><text x="112.5" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.5" dy="0.0">1. DESCENDING</tspan><tspan x="112.5" dy="13.7">(Швидкий спуск)</tspan><tspan x="112.5" dy="13.7">V_z = -1.0...-1.5 м/с</tspan><tspan x="112.5" dy="13.7">Повний PID-контроль</tspan></text>
<line x1="200.0" y1="130.0" x2="255.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="227.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">h &lt; h_trans</text>
<rect x="255.0" y="85.0" width="175.0" height="90.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="2.0"/><text x="342.5" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="342.5" dy="0.0">2. NEAR GROUND</tspan><tspan x="342.5" dy="13.0">(Майже земля)</tspan><tspan x="342.5" dy="13.0">V_z = -0.3...-0.4 м/с</tspan><tspan x="342.5" dy="13.0">Заморозка I-терму</tspan><tspan x="342.5" dy="13.0">T_max ≤ 0.7·T_hover</tspan></text>
<line x1="430.0" y1="130.0" x2="485.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="457.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Дотик</text>
<rect x="485.0" y="85.0" width="175.0" height="90.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2.0"/><text x="572.5" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="572.5" dy="0.0">3. GROUND CONTACT</tspan><tspan x="572.5" dy="13.0">(Контакт із землею)</tspan><tspan x="572.5" dy="13.0">V_z ≈ 0, Газ мінімальний</tspan><tspan x="572.5" dy="13.0">Підтвердження accel/I</tspan><tspan x="572.5" dy="13.0">Таймер t ≥ 0.35 с</tspan></text>
<line x1="660.0" y1="130.0" x2="715.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="687.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Таймаут</text>
<rect x="715.0" y="85.0" width="175.0" height="90.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.0"/><text x="802.5" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="802.5" dy="0.0">4. DISARMED</tspan><tspan x="802.5" dy="13.7">(Роззброєно)</tspan><tspan x="802.5" dy="13.7">Мотори вимкнено</tspan><tspan x="802.5" dy="13.7">ШІМ заблоковано</tspan><tspan x="802.5" dy="13.7">Посадка завершена</tspan></text>
<rect x="25.0" y="215.0" width="275.0" height="175.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="162.5" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">А. Критерій зупинки спуску</text>
<text x="162.5" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">• Вертикальна швидкість |V_z| &lt; 0.15 м/с</tspan><tspan x="162.5" dy="14.7">• Контролер вивів газ у нижній упор</tspan><tspan x="162.5" dy="14.7">• Дисперсія шуму акселерометра в нормі</tspan><tspan x="162.5" dy="14.7">• Підтвердження падіння струму шини</tspan></text>
<rect x="332.0" y="215.0" width="275.0" height="175.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="469.5" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Б. Захист від Tip-over</text>
<text x="469.5" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="469.5" dy="0.0">• Обнулення інтегратора крену/тангажу</tspan><tspan x="469.5" dy="14.7">• Заморожування I-терму в зоні подушки</tspan><tspan x="469.5" dy="14.7">• Зниження коефіцієнтів PID на 40%</tspan><tspan x="469.5" dy="14.7">• Заборона набору висоти при контакті</tspan></text>
<rect x="640.0" y="215.0" width="275.0" height="175.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="777.5" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">В. Аварійні запобіжники</text>
<text x="777.5" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">• Крен &gt; 25° під час спуску -&gt; газ 80%</tspan><tspan x="777.5" dy="14.7">• Стрибок барометра -&gt; перехід на ToF</tspan><tspan x="777.5" dy="14.7">• Таймаут контакту &gt; 3.0 с -&gt; Disarm</tspan><tspan x="777.5" dy="14.7">• Відмова сенсорів -&gt; аварійний зрив</tspan></text>
</svg>