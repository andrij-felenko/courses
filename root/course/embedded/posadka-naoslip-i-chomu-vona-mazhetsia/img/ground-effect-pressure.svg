<text x="242.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Повітряна подушка (T_IGE &gt; T_OGE)</text>
<rect x="499.1" y="85.0" width="291.9" height="69.9" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="645.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">1. Стрибок статичного тиску:</tspan><tspan x="645.0" dy="14.3">Відбитий потік створює підпір ΔP = ½·ρ·v².</tspan><tspan x="645.0" dy="14.3">Барометр бачить зростання тиску на 10-25 Па.</tspan><tspan x="645.0" dy="14.3">Формула висоти дає: Δh_baro = -1.0...-2.5 м.</tspan></text>
<rect x="489.7" y="192.9" width="310.7" height="84.2" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="645.0" y="210.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">2. Реакція автопілота наосліп:</tspan><tspan x="645.0" dy="14.3">• Контролер думає: 'я падаю занадто швидко'</tspan><tspan x="645.0" dy="14.3">• PID додає тягу моторів -&gt; дрон підкидає вгору</tspan><tspan x="645.0" dy="14.3">• Вийшовши з подушки, тяга падає -&gt; просідання</tspan><tspan x="645.0" dy="14.3">• Наслідок: вертикальна розкачка біля землі.</tspan></text>
<rect x="492.8" y="310.1" width="304.4" height="69.9" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/><text x="645.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">3. Зростання тяги (Ground Effect):</tspan><tspan x="645.0" dy="14.3">При сталій потужності тяга росте на 15-30%.</tspan><tspan x="645.0" dy="14.3">Без зниження газу дрон зависає на висоті 20 см</tspan><tspan x="645.0" dy="14.3">і не може торкнутися землі (пружинить).</tspan></text>
