<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зависання шини I2C (SDA у нулі) та процедура апаратного виведення (Bus Recovery)</text>
<rect x="30.0" y="42.0" width="760.0" height="68.0" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
<text x="45.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start" font-weight="700">1. Причина глухого кута (Deadlock):</text>
<text x="45.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start">Мікроконтролер перезавантажився посеред читання байта, коли чип передавав '0' і тримав SDA притиснутим до землі.</text>
<text x="45.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start" font-weight="700">Майстер не може згенерувати умову START або STOP, оскільки лінія SDA заблокована веденим у стані LOW.</text>
<rect x="35.0" y="125.0" width="175.0" height="115.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<text x="122.5" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 1: Реконфігурація</text>
<line x1="45.0" y1="159.0" x2="200.0" y2="159.0" stroke="#3b82f6" stroke-width="1.0"/>
<text x="122.5" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Перевести SCL у GPIO Output</text>
<text x="122.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Перевести SDA у GPIO Input</text>
<line x1="211.0" y1="182.5" x2="224.0" y2="182.5" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="226.0" y="125.0" width="175.0" height="115.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<text x="313.5" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 2: 9 тактових імпульсів</text>
<line x1="236.0" y1="159.0" x2="391.0" y2="159.0" stroke="#d97706" stroke-width="1.0"/>
<text x="313.5" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Подати до 9 імпульсів на SCL</text>
<text x="313.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Ведений довиштовхує свій байт</text>
<line x1="402.0" y1="182.5" x2="415.0" y2="182.5" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="417.0" y="125.0" width="175.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
<text x="504.5" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 3: Перевірка SDA</text>
<line x1="427.0" y1="159.0" x2="582.0" y2="159.0" stroke="#16a34a" stroke-width="1.0"/>
<text x="504.5" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">SDA звільнено веденим і</text>
<text x="504.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">підтягнуто до '1' через Pull-Up</text>
<line x1="593.0" y1="182.5" x2="606.0" y2="182.5" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="608.0" y="125.0" width="175.0" height="115.0" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.3"/>
<text x="695.5" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 4: Умова STOP</text>
<line x1="618.0" y1="159.0" x2="773.0" y2="159.0" stroke="#8b5cf6" stroke-width="1.0"/>
<text x="695.5" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Сформувати перехід SDA 0→1</text>
<text x="695.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">при високому рівні на SCL</text>
</svg>