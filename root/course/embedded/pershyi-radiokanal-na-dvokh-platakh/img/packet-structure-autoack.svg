<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура радіопакета в ефірі та часова шкала апаратного підтвердження Auto-ACK</text>
<rect x="0.0" y="0.0" width="840.0" height="440.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура радіопакета Enhanced ShockBurst (ESB) в ефірі</text>
<rect x="40.0" y="48.0" width="110.0" height="52.0" rx="4" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="95.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="700">Преамбула</text>
<text x="95.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#3730a3" text-anchor="middle">1 байт (0xAA / 0x55)</text>
<rect x="155.0" y="48.0" width="155.0" height="52.0" rx="4" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
<text x="232.5" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Адреса (Sync Word)</text>
<text x="232.5" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle">3…5 байтів</text>
<rect x="315.0" y="48.0" width="175.0" height="52.0" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
<text x="402.5" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Packet Control</text>
<text x="402.5" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="middle">9 бітів (Len, PID, NO_ACK)</text>
<rect x="495.0" y="48.0" width="200.0" height="52.0" rx="4" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text x="595.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Корисне навантаження (Payload)</text>
<text x="595.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">0…32 байти (Dynamic Payload)</text>
<rect x="700.0" y="48.0" width="100.0" height="52.0" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
<text x="750.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">CRC</text>
<text x="750.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">1 або 2 байти</text>
<rect x="230.0" y="122.0" width="350.0" height="48.0" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="405.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Packet Control Field: 9 бітів</text>
<text x="405.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">Payload Length (6 біт)  |  PID (2 біти)  |  NO_ACK (1 біт)</text>
<line x1="405.0" y1="122.0" x2="405.0" y2="102.0" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="40.0" y1="195.0" x2="800.0" y2="195.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="420.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія апаратного підтвердження (Auto-ACK / ARQ)</text>
<text x="80.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Передавач (TX Node)</text>
<line x1="80.0" y1="265.0" x2="780.0" y2="265.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="80.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Приймач (RX Node)</text>
<line x1="80.0" y1="350.0" x2="780.0" y2="350.0" stroke="#2457d6" stroke-width="1.8"/>
<rect x="180.0" y="251.0" width="150.0" height="28.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.4"/>
<text x="255.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Пакет даних (Data)</text>
<line x1="255.0" y1="281.0" x2="310.0" y2="348.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="310.0" y="336.0" width="110.0" height="28.0" rx="4" fill="#dbeafe" stroke="#2457d6" stroke-width="1.4"/>
<text x="365.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Перевірка CRC</text>
<rect x="430.0" y="336.0" width="120.0" height="28.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.4"/>
<text x="490.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ACK відповідь</text>
<line x1="490.0" y1="334.0" x2="550.0" y2="267.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="550.0" y="251.0" width="180.0" height="28.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="640.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">IRQ: TX_DS (успішна доставка)</text>
<line x1="180.0" y1="243.0" x2="550.0" y2="243.0" stroke="#94a3b8" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="365.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Вікно очікування Auto Retransmit Delay (ARD: 250…4000 мкс)</text>
<text x="420.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Якщо ACK не надійшов до кінця ARD — модуль робить повтор (до ARC спроб)</text>
</svg>