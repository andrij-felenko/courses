<text x="355.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">Правило адресації Multiceiver:</text>
<text x="235.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">1. Pipe 0 та Pipe 1 мають</text>
<text x="235.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">   повні унікальні 5-байтові</text>
<text x="235.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">   адреси.</text>
<text x="235.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">2. Pipe 2…5 ділять 4 старші</text>
<text x="235.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">   байти адреси (MSB) з Pipe 1,</text>
<text x="235.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">   і відрізняються лише 1</text>
<text x="235.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">   молодшим байтом (LSB).</text>
<text x="235.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">3. Передавач TX перемикається</text>
<text x="235.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">   на Pipe 0 для прийому ACK.</text>
