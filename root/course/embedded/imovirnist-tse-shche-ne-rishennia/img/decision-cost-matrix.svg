<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця втрат і зсув порогу прийняття рішення</text>
<rect x="50.0" y="65.0" width="350.0" height="310.0" rx="8" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="225.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця ціни помилок (Cost Matrix)</text>
<text x="250.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дія: Стоп (a₁)</text>
<text x="340.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дія: Рух (a₀)</text>
<text x="70.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Факт: Перешкода</text>
<text x="70.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Факт: Чисто</text>
<rect x="210.0" y="145.0" width="80.0" height="70.0" rx="4" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.2"/>
<text x="250.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">C_TP = 0</text>
<text x="250.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вчасний стоп</text>
<rect x="300.0" y="145.0" width="80.0" height="70.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="340.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">C_FN = 1000</text>
<text x="340.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Аварія / Травма</text>
<rect x="210.0" y="225.0" width="80.0" height="70.0" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="250.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">C_FP = 1</text>
<text x="250.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Затримка 2 с</text>
<rect x="300.0" y="225.0" width="80.0" height="70.0" rx="4" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.2"/>
<text x="340.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">C_TN = 0</text>
<text x="340.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Штатний рух</text>
<text x="225.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Асиметрія: C_FN &gt;&gt; C_FP (у 1000 разів)</text>
<rect x="430.0" y="65.0" width="370.0" height="310.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="615.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бейєсівський оптимум порогу T*</text>
<rect x="445.0" y="113.0" width="340.0" height="48.0" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
<text x="615.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">T* = C_FP / ( C_FP + C_FN )</text>
<line x1="460.0" y1="220.0" x2="770.0" y2="220.0" stroke="#333333" stroke-width="3.0"/>
<line x1="460.0" y1="212.0" x2="460.0" y2="228.0" stroke="#333333" stroke-width="2.0"/>
<line x1="770.0" y1="212.0" x2="770.0" y2="228.0" stroke="#333333" stroke-width="2.0"/>
<text x="460.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0.0</text>
<text x="770.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1.0</text>
<line x1="615.0" y1="205.0" x2="615.0" y2="235.0" stroke="#9ca3af" stroke-width="2.0" stroke-dasharray="3,3"/>
<circle cx="615.0" cy="220.0" r="5.0" fill="#9ca3af" stroke="#ffffff" stroke-width="1.5"/>
<text x="615.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Наївний T = 0.5</text>
<text x="615.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(ігнорує ціну смерті)</text>
<line x1="475.0" y1="200.0" x2="475.0" y2="240.0" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="475.0" cy="220.0" r="6.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="510.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Оптимум T* ≈ 0.001</text>
<text x="510.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Гальмуємо навіть при P = 0.01</text>
<text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Висновок інженера:</text>
<text x="450.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Краще 10 разів помилково зупинитися,</text>
<text x="450.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ніж 1 раз на повній швидкості збити перешкоду.</text>
</svg>