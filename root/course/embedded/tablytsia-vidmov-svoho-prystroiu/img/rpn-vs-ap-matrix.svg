<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця Action Priority проти чистого RPN</text>
<text x="440.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця пріоритету дій (Action Priority) проти пастки чистого RPN</text>
<rect x="50.0" y="60.0" width="380.0" height="300.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="240.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл пріоритетів (S × O)</text>
<rect x="68.0" y="102.0" width="344.0" height="68.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/>
<text x="240.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">S = 9..10: Високий пріоритет (High Priority)</text>
<text x="240.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Катастрофічний наслідок: захист обов'язковий</text>
<rect x="68.0" y="180.0" width="344.0" height="76.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/>
<text x="240.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">S = 7..8 (або S=5..6 та O≥5): Середній (Medium)</text>
<text x="240.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Суттєва деградація: потрібні заходи в коді й схемі</text>
<rect x="68.0" y="266.0" width="344.0" height="80.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="240.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">S = 1..4: Низький пріоритет (Low Priority)</text>
<text x="240.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Незначний вплив або надійно ізольована відмова</text>
<text x="240.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Достатньо штатного моніторингу та логування</text>
<rect x="460.0" y="60.0" width="370.0" height="300.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="645.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка множення RPN = S · O · D</text>
<rect x="475.0" y="105.0" width="340.0" height="102.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="645.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Випадок А: Відмова клапана (пробій ключа)</text>
<text x="645.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">S = 10,  O = 2,  D = 9</text>
<text x="645.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">RPN = 180  →  Action Priority = HIGH</text>
<text x="645.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">Смертельний ризик. Лагодити першим!</text>
<rect x="475.0" y="218.0" width="340.0" height="102.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="645.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Випадок Б: Згас додатковий LED індикації</text>
<text x="645.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">S = 3,  O = 6,  D = 10</text>
<text x="645.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">RPN = 180  →  Action Priority = LOW</text>
<text x="645.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">Косметичний збій. Не зупиняє проєкт.</text>
<text x="645.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Однаковий RPN=180 приховує протилежну критичність!</text>
<rect x="50.0" y="375.0" width="780.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="440.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Методологія AIAG &amp; VDA оцінює логіку пріоритетів за S, O, D послідовно, а не сліпим множенням.</text>
</svg>