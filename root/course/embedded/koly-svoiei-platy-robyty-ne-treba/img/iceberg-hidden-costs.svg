<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="520.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Айсберг витрат власної розробки заліза проти уявного BOM</text><rect x="25.0" y="135.0" width="790.0" height="350.0" rx="6" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.0"/><line x1="25.0" y1="135.0" x2="815.0" y2="135.0" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="6,4"/><text x="800.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="end" font-weight="700">Поверхня води (видима частина)</text><rect x="160.0" y="55.0" width="520.0" height="68.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.0"/><text x="420.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Видима собівартість (BOM у кошику дистриб'ютора)</text><text x="420.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Сума мікросхем, резисторів, роз'ємів та склотекстоліту ($15–$45 на плату)</text><text x="420.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">«Ми зробимо це за $30 замість купувати ПЛК за $350!» — класична інженерна пастка</text><rect x="45.0" y="150.0" width="360.0" height="95.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/><text x="60.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="start" font-weight="700">1. Інженерні людино-години (NRE)</text><text x="60.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Схемотехніка, топологія 4-6 шарів ($15k–$35k)</text><text x="60.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Моделювання цілісності сигналів та живлення</text><text x="60.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Розробка низькорівневого BSP та драйверів</text><rect x="435.0" y="150.0" width="360.0" height="95.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="450.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">2. Ітерації заліза (Rev A → Rev B → Rev C)</text><text x="450.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 2–3 повторні замовлення плат і SMD-монтажу</text><text x="450.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Помилки strapping-пінів, перегрів LDO, шум АЦП</text><text x="450.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Затримка проєкту на 3–6 місяців через перезамовлення</text><rect x="45.0" y="258.0" width="360.0" height="95.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="60.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">3. Тестувальна інфраструктура (Test Jigs)</text><text x="60.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Проектування стенда з pogo-голками ($3k–$8k)</text><text x="60.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• ПЗ автоматизованого вихідного контролю</text><text x="60.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Калібрувальне обладнання та HIL-стенди</text><rect x="435.0" y="258.0" width="360.0" height="95.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="450.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ea580c" text-anchor="start" font-weight="700">4. Сертифікація та лабораторії</text><text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Випробування EMC/EMI в безлунній камері (CE/FCC)</text><text x="450.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Електробезпека LVD, кліматичні тести (-40..+85 °C)</text><text x="450.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ризик повторної спроби ($8k–$25k за кожну сесію)</text><rect x="45.0" y="366.0" width="360.0" height="105.0" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="60.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#059669" text-anchor="start" font-weight="700">5. Ланцюжок постачання (Supply Chain)</text><text x="60.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• EOL / NRND статус компонентів через 6 місяців</text><text x="60.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Мінімальні партії замовлення (MOQ 3000 шт котушки)</text><text x="60.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Заморожений капітал і ризик контрафакту</text><rect x="435.0" y="366.0" width="360.0" height="105.0" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="450.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">6. Польові відмови та рекламації</text><text x="450.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Відсутність перевіреної часом статистики MTBF</text><text x="450.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Виїзд сервісного техніка в поле ($300–$800 за виклик)</text><text x="450.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Проти 2-хвилинної заміни COTS-блоку на DIN-рейці</text><rect x="45.0" y="495.0" width="750.0" height="28.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/><text x="420.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реальна ціна власної плати = BOM + (NRE + Тести + Сертифікація + Ризики) / Тираж</text>
</svg>