<rect x="171.8" y="145.1" width="536.4" height="69.9" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/><text x="440.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Значення полів CP10 та CP11 (керування FPU):</tspan><tspan x="440.0" dy="14.3">• 0b00: Доступ заборонено (спроба FPU-команди викликає NOCP UsageFault / HardFault)</tspan><tspan x="440.0" dy="14.3">• 0b01: Тільки привілейований режим</tspan><tspan x="440.0" dy="14.3">• 0b11: Повний доступ (Full Access) — запис маски (0xF &lt;&lt; 20) = 0x00F00000</tspan></text>
