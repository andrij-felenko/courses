<rect x="450.3" y="28.2" width="279.3" height="55.6" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.4"/><text x="590.0" y="45.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Апаратне завантаження в регістр SP (MSP):</tspan><tspan x="590.0" dy="14.3">Вказує на кінець виділеної RAM (_estack).</tspan><tspan x="590.0" dy="14.3">Стек готовий ще ДО першої інструкції коду.</tspan></text>
<line x1="398.0" y1="56.0" x2="446.3" y2="56.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="419.0" y="125.0" width="342.0" height="69.9" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.4"/><text x="590.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Завантаження адреси точки входу в регістр PC:</tspan><tspan x="590.0" dy="14.3">Зверніть увагу на LSB: адреса 0x0800018D є непарною!</tspan><tspan x="590.0" dy="14.3">Біт 0 = 1 перемикає ядро в режим Thumb-2.</tspan><tspan x="590.0" dy="14.3">Якщо біт 0 = 0 → негайний UsageFault (INVSTATE).</tspan></text>
<line x1="398.0" y1="88.0" x2="415.0" y2="160.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="419.0" y="275.1" width="342.0" height="69.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/><text x="590.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Регістр SCB-&gt;VTOR (Vector Table Offset):</tspan><tspan x="590.0" dy="14.3">Дозволяє перенести таблицю векторів у RAM</tspan><tspan x="590.0" dy="14.3">або іншу область Flash (актуально для Bootloader).</tspan><tspan x="590.0" dy="14.3">Вимога: адреса має бути вирівняна по ступеню двійки.</tspan></text>
<line x1="398.0" y1="376.0" x2="415.0" y2="310.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
