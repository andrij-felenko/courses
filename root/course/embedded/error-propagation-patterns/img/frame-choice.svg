<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три відповіді на помилку в цій рамці</text>
<rect x="243.8" y="46.0" width="232.3" height="36.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.0"/><text x="360.0" y="68.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Помилка прийшла в цю функцію</tspan></text>
<line x1="360.0" y1="82.0" x2="150.0" y2="136.0" stroke="#27ae60" stroke-width="1.5"/>
<rect x="90.0" y="136.0" width="120.0" height="28.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="150.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">ПРОВЕСТИ</tspan></text>
<text x="150.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">return err;</tspan><tspan x="150.0" dy="13.0">мені тут не зарадити —</tspan><tspan x="150.0" dy="13.0">нехай вирішує вищий рівень</tspan></text>
<text x="150.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">типовий вибір</text>
<line x1="360.0" y1="82.0" x2="360.0" y2="136.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="300.0" y="136.0" width="120.0" height="28.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="360.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">ОБРОБИТИ</tspan></text>
<text x="360.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">тут є запасний план:</tspan><tspan x="360.0" dy="13.0">ретрай, значення за</tspan><tspan x="360.0" dy="13.0">замовчуванням, інша гілка</tspan></text>
<text x="360.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">де є чим зарадити</text>
<line x1="360.0" y1="82.0" x2="570.0" y2="136.0" stroke="#c0392b" stroke-width="1.5"/>
<rect x="510.0" y="136.0" width="120.0" height="28.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="570.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">ПРОКОВТНУТИ</tspan></text>
<text x="570.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">ігнорую свідомо й</tspan><tspan x="570.0" dy="13.0">з коментарем — лише на</tspan><tspan x="570.0" dy="13.0">шляху прибирання тощо</tspan></text>
<text x="570.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">рідко й обережно</text>
<text x="360.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">три чесні відповіді на одну помилку; проковтнути — лише свідомо й із приміткою, ніколи мовчки</text>
</svg>