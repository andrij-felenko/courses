<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансляція різнорідних протоколів у структуровані MQTT повідомлення</text>
<rect x="20.0" y="35.0" width="780.0" height="190.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Трансляція Modbus RTU (RS-485) → MQTT JSON</text>
<rect x="35.0" y="75.0" width="210.0" height="125.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Сирий кадр Modbus RTU</tspan><tspan x="140.0" dy="13.0">`0x01 0x03 0x04`</tspan><tspan x="140.0" dy="13.0">`0x42 0x88 0x00 0x00`</tspan><tspan x="140.0" dy="13.0">`0x6E 0x92`</tspan><tspan x="140.0" dy="13.0">(Slave 1, Func 3, 4 байти, CRC)</tspan></text>
<line x1="245.0" y1="137.0" x2="280.0" y2="102.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="280.0" y="75.0" width="240.0" height="125.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Шлюзовий дескриптор пристрою</tspan><tspan x="400.0" dy="13.0">· Перевірка CRC16 (OK)</tspan><tspan x="400.0" dy="13.0">· Мапінг: Reg 40001-40002</tspan><tspan x="400.0" dy="13.0">· Word Swap (IEEE 754 Float32)</tspan><tspan x="400.0" dy="13.0">→ `value = 68.0 bar`</tspan><tspan x="400.0" dy="13.0">· Мітка RTC: `1724698800`</tspan></text>
<line x1="520.0" y1="137.0" x2="555.0" y2="102.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="555.0" y="75.0" width="230.0" height="125.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">MQTT Топік &amp; JSON Payload</tspan><tspan x="670.0" dy="13.0">`plant/boiler_1/pressure`</tspan><tspan x="670.0" dy="13.0">{</tspan><tspan x="670.0" dy="13.0">  &quot;val&quot;: 68.0,</tspan><tspan x="670.0" dy="13.0">  &quot;unit&quot;: &quot;bar&quot;,</tspan><tspan x="670.0" dy="13.0">  &quot;ts&quot;: 1724698800</tspan><tspan x="670.0" dy="13.0">}</tspan></text>
<rect x="20.0" y="240.0" width="780.0" height="190.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Трансляція LoRaWAN Бінарного пакета → MQTT JSON</text>
<rect x="35.0" y="280.0" width="210.0" height="125.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="313.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Сирий радіопакет LoRaWAN</tspan><tspan x="140.0" dy="13.0">DevAddr: `0x26012A34`</tspan><tspan x="140.0" dy="13.0">FPort: `2`</tspan><tspan x="140.0" dy="13.0">Payload: `0x01 0x67 0x01 0x1A`</tspan><tspan x="140.0" dy="13.0">`0x02 0x68 0x78`</tspan><tspan x="140.0" dy="13.0">(Cayenne LPP формат)</tspan></text>
<line x1="245.0" y1="342.0" x2="280.0" y2="102.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="280.0" y="280.0" width="240.0" height="125.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Декодер корисного навантаження</tspan><tspan x="400.0" dy="11.7">· Перевірка MIC та лічильника FCnt</tspan><tspan x="400.0" dy="11.7">· Канал 1: Temp (0x011A / 10 = 28.2°C)</tspan><tspan x="400.0" dy="11.7">· Канал 2: Hum (0x78 / 2 = 60.0%)</tspan><tspan x="400.0" dy="11.7">· Метрики радіо: RSSI -85, SNR +9</tspan><tspan x="400.0" dy="11.7">· Апаратна мітка часу RTC</tspan></text>
<line x1="520.0" y1="342.0" x2="555.0" y2="102.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="555.0" y="280.0" width="230.0" height="125.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">MQTT Топік &amp; JSON Payload</tspan><tspan x="670.0" dy="13.0">`farm/greenhouse/node_34/env`</tspan><tspan x="670.0" dy="13.0">{</tspan><tspan x="670.0" dy="13.0">  &quot;temp&quot;: 28.2,</tspan><tspan x="670.0" dy="13.0">  &quot;hum&quot;: 60.0,</tspan><tspan x="670.0" dy="13.0">  &quot;rssi&quot;: -85,</tspan><tspan x="670.0" dy="13.0">  &quot;ts&quot;: 1724698800</tspan><tspan x="670.0" dy="13.0">}</tspan></text>
</svg>