<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл механізму Store-and-Forward</text>
<rect x="30.0" y="95.0" width="170.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">1. ONLINE STREAMING</tspan><tspan x="115.0" dy="11.7">Пряма трансляція в MQTT</tspan><tspan x="115.0" dy="11.7">Черга порожня, нульова затримка</tspan></text>
<rect x="230.0" y="95.0" width="170.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="327.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="327.0" dy="0.0">2. OFFLINE BUFFERING</tspan><tspan x="327.0" dy="11.7">Висхідний канал обірвано</tspan><tspan x="327.0" dy="11.7">Запис у SQLite WAL на Flash</tspan></text>
<rect x="430.0" y="95.0" width="170.0" height="70.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/><text x="515.0" y="102.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">3. WAN RECOVERING</tspan><tspan x="515.0" dy="13.0">Зв'язок відновився</tspan><tspan x="515.0" dy="13.0">Рукостискання TLS + MQTT</tspan></text>
<rect x="630.0" y="95.0" width="170.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="715.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">4. DRAINING SYNC</tspan><tspan x="715.0" dy="11.7">Порційний злив черги</tspan><tspan x="715.0" dy="11.7">Контроль темпу й підтверджень</tspan></text>
<line x1="200.0" y1="115.0" x2="230.0" y2="115.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="215.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Обрив WAN</text>
<line x1="400.0" y1="115.0" x2="430.0" y2="115.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="415.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle" font-weight="700">Link Up</text>
<line x1="600.0" y1="115.0" x2="630.0" y2="115.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="615.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">MQTT Conn</text>
<line x1="715.0" y1="165.0" x2="715.0" y2="200.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="715.0" y1="200.0" x2="115.0" y2="200.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="115.0" y1="200.0" x2="115.0" y2="165.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="415.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Черга вичерпана (Queue Empty) → повернення до прямої трансляції</text>
<line x1="700.0" y1="95.0" x2="700.0" y2="60.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="700.0" y1="60.0" x2="315.0" y2="60.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="315.0" y1="60.0" x2="315.0" y2="95.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="510.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Повторний обрив WAN під час зливу</text>
<rect x="30.0" y="235.0" width="760.0" height="175.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="410.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм порційного зливу (Batch Drain) без перевантаження мережі</text>
<rect x="50.0" y="280.0" width="210.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="316.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">1. Вибірка пачки (Batch SELECT)</tspan><tspan x="155.0" dy="13.0">`SELECT * FROM queue`</tspan><tspan x="155.0" dy="13.0">`ORDER BY priority DESC, id ASC`</tspan><tspan x="155.0" dy="13.0">`LIMIT 50;`</tspan></text>
<line x1="260.0" y1="332.0" x2="290.0" y2="97.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="290.0" y="280.0" width="220.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">2. Публікація в MQTT (QoS 1)</tspan><tspan x="400.0" dy="14.3">Відправка з оригінальною</tspan><tspan x="400.0" dy="14.3">міткою часу вимірювання</tspan><tspan x="400.0" dy="14.3">`sampled_at: 1724700000`</tspan></text>
<line x1="510.0" y1="332.0" x2="540.0" y2="97.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540.0" y="280.0" width="230.0" height="105.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">3. Атомарне видалення (DELETE)</tspan><tspan x="655.0" dy="14.3">Отримано `PUBACK` від брокера:</tspan><tspan x="655.0" dy="14.3">`DELETE FROM queue`</tspan><tspan x="655.0" dy="14.3">`WHERE id IN (пачка_id);`</tspan></text>
</svg>