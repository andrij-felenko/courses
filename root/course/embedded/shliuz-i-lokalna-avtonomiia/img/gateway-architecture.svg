<rect x="285.0" y="85.0" width="280.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="425.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">Конвеєр первинної обробки</tspan><tspan x="425.0" dy="14.3">· Десеріалізація та мічення часу RTC</tspan><tspan x="425.0" dy="14.3">· Апертурна фільтрація (Deadband)</tspan><tspan x="425.0" dy="14.3">· Фільтрація викидів (Sanity Check)</tspan><tspan x="425.0" dy="14.3">· Віконна агрегація (Avg, Min, Max)</tspan></text>
