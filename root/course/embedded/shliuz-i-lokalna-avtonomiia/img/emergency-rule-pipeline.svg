<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розділення локального аварійного контуру та висхідного моніторингу</text>
<rect x="20.0" y="50.0" width="780.0" height="170.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="410.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Локальний аварійний контур (Fast-Path) — детермінована реакція &lt; 1 мс</text>
<rect x="40.0" y="95.0" width="155.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="117.5" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="117.5" dy="0.0">Сирий вхідний кадр</tspan><tspan x="117.5" dy="14.3">DMA переривання UART</tspan><tspan x="117.5" dy="14.3">або SPI LoRa пакета</tspan></text>
<line x1="195.0" y1="142.0" x2="230.0" y2="92.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
