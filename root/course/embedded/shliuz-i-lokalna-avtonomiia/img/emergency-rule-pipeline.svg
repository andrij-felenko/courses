<line x1="405.0" y1="142.0" x2="440.0" y2="92.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="95.0" width="175.0" height="95.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="527.5" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="527.5" dy="0.0">Rule Engine</tspan><tspan x="527.5" dy="14.3">`T &gt; 95°C || P &gt; 6 bar`</tspan><tspan x="527.5" dy="14.3">Миттєвий розрахунок</tspan></text>
<line x1="615.0" y1="142.0" x2="645.0" y2="92.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="645.0" y="95.0" width="140.0" height="95.0" rx="6" fill="#c0392b" stroke="#962d22" stroke-width="1.5"/><text x="715.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Захисна дія</tspan><tspan x="715.0" dy="14.3">GPIO клапана,</tspan><tspan x="715.0" dy="14.3">вимикання котла</tspan></text>
<rect x="20.0" y="250.0" width="780.0" height="170.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="410.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Хмарний контур моніторингу — непередбачувана затримка (200 мс — обрив каналу)</text>
<line x1="317.0" y1="190.0" x2="317.0" y2="295.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="325.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Асинхронно</text>
<rect x="230.0" y="295.0" width="175.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="317.5" y="332.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="317.5" dy="0.0">Буфер SQLite WAL</tspan><tspan x="317.5" dy="14.3">Збереження для</tspan><tspan x="317.5" dy="14.3">хмарної аналітики</tspan></text>
<line x1="405.0" y1="342.0" x2="440.0" y2="92.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="440.0" y="295.0" width="175.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="527.5" y="332.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="527.5" dy="0.0">WAN / 4G / Wi-Fi</tspan><tspan x="527.5" dy="14.3">Передача через TCP/IP</tspan><tspan x="527.5" dy="14.3">(ризик втрати зв'язку)</tspan></text>
<line x1="615.0" y1="342.0" x2="645.0" y2="92.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="645.0" y="295.0" width="140.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="715.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Хмарний сервер</tspan><tspan x="715.0" dy="13.0">Аналітика, графіки,</tspan><tspan x="715.0" dy="13.0">довгострокові тренди</tspan></text>
<text x="120.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Безпека не чекає
