<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 833 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="833" height="340" fill="#ffffff"/>
