<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="740.0" height="320.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="35.0" y="35.0" width="215.0" height="270.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="145.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">1. FIFO Drop</text>
<line x1="50.0" y1="75.0" x2="235.0" y2="75.0" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="145.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Стратегія: викидати найстаріше</tspan><tspan x="145.0" dy="14.2">Коли Head наздогнав Tail:</tspan><tspan x="145.0" dy="14.2">Tail просувається на +1 сектор,</tspan><tspan x="145.0" dy="14.2">а старий сектор стирається.</tspan></text>
<text x="145.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="145.0" dy="0.0">Застосування: телеметрія</tspan><tspan x="145.0" dy="14.2">свіжого стану (тиск, рівень),</tspan><tspan x="145.0" dy="14.2">де нові дані цінніші</tspan><tspan x="145.0" dy="14.2">за пропущені старі.</tspan></text>
<rect x="74.2" y="253.5" width="141.6" height="23.0" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="145.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Пріоритет: свіжість</tspan></text>
<rect x="272.0" y="35.0" width="215.0" height="270.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="380.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">2. LIFO / Tail Drop</text>
<line x1="287.0" y1="75.0" x2="472.0" y2="75.0" stroke="#fde68a" stroke-width="1.2"/>
<text x="380.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Стратегія: ігнорувати нове</tspan><tspan x="380.0" dy="14.2">Коли буфер переповнено:</tspan><tspan x="380.0" dy="14.2">нові події відкидаються,</tspan><tspan x="380.0" dy="14.2">поки мережа не вичитає хвіст.</tspan></text>
<text x="380.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">Застосування: діагностика</tspan><tspan x="380.0" dy="14.2">першопричин аварій (RCA),</tspan><tspan x="380.0" dy="14.2">де перші 1000 записів</tspan><tspan x="380.0" dy="14.2">після збою є критичними.</tspan></text>
<rect x="295.6" y="253.5" width="168.9" height="23.0" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="380.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Пріоритет: початок збою</tspan></text>
<rect x="510.0" y="35.0" width="215.0" height="270.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="615.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. Multi-Ring (Пріоритет)</text>
<line x1="525.0" y1="75.0" x2="710.0" y2="75.0" stroke="#fca5a5" stroke-width="1.2"/>
<text x="615.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Стратегія: 2 кільця</tspan><tspan x="615.0" dy="14.2">Кільце A (90%): телеметрія</tspan><tspan x="615.0" dy="14.2">працює в режимі FIFO Drop.</tspan><tspan x="615.0" dy="14.2">Кільце B (10%): аварії/тривоги</tspan><tspan x="615.0" dy="14.2">ніколи не стираються!</tspan></text>
<text x="615.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="615.0" dy="0.0">Застосування: промавтоматика.</tspan><tspan x="615.0" dy="14.2">Потік телеметрії деградує,</tspan><tspan x="615.0" dy="14.2">але жоден сигнал аварії</tspan><tspan x="615.0" dy="14.2">не втрачається.</tspan></text>
<rect x="520.3" y="253.5" width="189.3" height="23.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="615.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">Пріоритет: гарантія тривог</tspan></text>
</svg>