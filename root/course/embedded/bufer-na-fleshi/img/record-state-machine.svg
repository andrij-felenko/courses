<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="740.0" height="320.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="35.0" y="45.0" width="150.0" height="200.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="110.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">1. Стерто / Вільно</text>
<text x="110.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">0xFF (1111 1111b)</text>
<line x1="50.0" y1="113.0" x2="170.0" y2="113.0" stroke="#94a3b8" stroke-width="1.0"/>
<text x="110.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="110.0" dy="0.0">Свіжий сектор</tspan><tspan x="110.0" dy="14.9">після Erase.</tspan><tspan x="110.0" dy="14.9">Пам'ять готова</tspan><tspan x="110.0" dy="14.9">до запису.</tspan></text>
<line x1="187.0" y1="100.0" x2="211.0" y2="100.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="215.0" y="45.0" width="150.0" height="200.0" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="290.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">2. Запис даних</text>
<text x="290.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">0xFE (1111 1110b)</text>
<line x1="230.0" y1="113.0" x2="350.0" y2="113.0" stroke="#f59e0b" stroke-width="1.0"/>
<text x="290.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="290.0" dy="0.0">Записано Header</tspan><tspan x="290.0" dy="14.9">та Payload.</tspan><tspan x="290.0" dy="14.9">При знеструмленні:</tspan><tspan x="290.0" dy="14.9">CRC не зійдеться.</tspan></text>
<line x1="367.0" y1="100.0" x2="391.0" y2="100.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="395.0" y="45.0" width="150.0" height="200.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="470.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">3. Зафіксовано</text>
<text x="470.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">0xFC (1111 1100b)</text>
<line x1="410.0" y1="113.0" x2="530.0" y2="113.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="470.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="470.0" dy="0.0">Атомарний запис 1 Б.</tspan><tspan x="470.0" dy="14.9">Скинуто біт 1 -&gt; 0.</tspan><tspan x="470.0" dy="14.9">Запис готовий</tspan><tspan x="470.0" dy="14.9">до відправлення.</tspan></text>
<line x1="547.0" y1="100.0" x2="571.0" y2="100.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="575.0" y="45.0" width="150.0" height="200.0" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="650.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">4. Вичитано (ACK)</text>
<text x="650.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">0x00 (0000 0000b)</text>
<line x1="590.0" y1="113.0" x2="710.0" y2="113.0" stroke="#3b82f6" stroke-width="1.0"/>
<text x="650.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="650.0" dy="0.0">Мережа надіслала ACK.</tspan><tspan x="650.0" dy="14.9">Скинуто всі біти.</tspan><tspan x="650.0" dy="14.9">Запис позначено</tspan><tspan x="650.0" dy="14.9">як спожитий.</tspan></text>
<rect x="54.9" y="269.4" width="650.3" height="41.3" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Головний принцип Flash State Machine: перехід між станами здійснюється скиданням бітів 1 -&gt; 0</tspan><tspan x="380.0" dy="14.3">без попереднього стирання сектора. Жодне знеструмлення не пошкоджує готові дані.</tspan></text>
</svg>