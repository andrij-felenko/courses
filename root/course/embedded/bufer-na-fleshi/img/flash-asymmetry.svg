<text x="615.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Гранулярність: 4096 Б</tspan><tspan x="615.0" dy="16.1">Час стирання: 40–200 мс</tspan><tspan x="615.0" dy="16.1">Всі біти стають 1 (0xFF)</tspan></text>
<text x="615.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="615.0" dy="0.0">Висока напруга (12–20 В)</tspan><tspan x="615.0" dy="14.9">Тунелювання електронів</tspan><tspan x="615.0" dy="14.9">Деградація оксидного шару</tspan></text>
