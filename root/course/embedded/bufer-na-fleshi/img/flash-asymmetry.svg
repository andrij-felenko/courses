<text x="380.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Гранулярність: 1–256 Б</tspan><tspan x="380.0" dy="16.1">Час запису: ~0.7–3.0 мс</tspan><tspan x="380.0" dy="16.1">Тільки біти 1 -&gt; 0</tspan></text>
<text x="380.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">Інжекція електронів</tspan><tspan x="380.0" dy="14.9">у плаваючий затвор.</tspan><tspan x="380.0" dy="14.9">0 -&gt; 1 без стирання — ні!</tspan></text>
<rect x="302.4" y="253.5" width="155.2" height="23.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Атомарний зсув 1 -&gt; 0</tspan></text>
