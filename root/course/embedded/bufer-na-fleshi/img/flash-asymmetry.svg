<text x="145.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="145.0" dy="0.0">Довільний доступ по SPI</tspan><tspan x="145.0" dy="14.9">Читання не зношує</tspan><tspan x="145.0" dy="14.9">структуру затвора</tspan></text>
<rect x="70.8" y="253.5" width="148.4" height="23.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="145.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Знос: 0 (необмежено)</tspan></text>
<rect x="272.0" y="35.0" width="215.0" height="270.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
