<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 876.36 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="876.36" height="430" fill="#ffffff"/>
