<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="20.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний хід події: від попередження до відновлення при старті</text>
<text x="490.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен рубіж закриває свою дірку: попередження дає шанс, FRAM встигає, BOD страхує, перевірка відсіює сміття</text>
<line x1="70.0" y1="130.0" x2="910.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="910.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">час</text>
<circle cx="150.0" cy="130.0" r="8.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="150.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">живлення</text>
<text x="150.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">зникло</text>
<line x1="150.0" y1="100.0" x2="150.0" y2="122.0" stroke="#6b7280" stroke-width="1.1"/>
<text x="150.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">напруга поповзла вниз</text>
<circle cx="320.0" cy="130.0" r="8.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="320.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ВЕРХНІЙ ПОРІГ</text>
<text x="320.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">переривання</text>
<line x1="320.0" y1="100.0" x2="320.0" y2="122.0" stroke="#2457d6" stroke-width="1.1"/>
<text x="320.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">процесор прокинувся</text>
<circle cx="500.0" cy="130.0" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="500.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ВІКНО</text>
<text x="500.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">запис у FRAM</text>
<line x1="500.0" y1="100.0" x2="500.0" y2="122.0" stroke="#27ae60" stroke-width="1.1"/>
<text x="500.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">глуши споживачів,</text>
<text x="500.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">збережи стан + CRC</text>
<circle cx="680.0" cy="130.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="680.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НИЖНІЙ ПОРІГ</text>
<text x="680.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">скидання BOD</text>
<line x1="680.0" y1="100.0" x2="680.0" y2="122.0" stroke="#c0392b" stroke-width="1.1"/>
<text x="680.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">дані врятовано</text>
<text x="680.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">від спотворення</text>
<circle cx="855.0" cy="130.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="855.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">СТАРТ</text>
<text x="855.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">перевірка CRC</text>
<line x1="855.0" y1="100.0" x2="855.0" y2="122.0" stroke="#1a1a1a" stroke-width="1.1"/>
<text x="855.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">сума сходиться →</text>
<text x="855.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">відновити; ні → скинути</text>
<line x1="320.0" y1="38.0" x2="680.0" y2="38.0" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">вікно реакції (мілісекунди)</text>
<line x1="320.0" y1="42.0" x2="320.0" y2="66.0" stroke="#27ae60" stroke-width="1.1"/>
<line x1="680.0" y1="42.0" x2="680.0" y2="66.0" stroke="#27ae60" stroke-width="1.1"/>
<text x="767.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="767.0" dy="0.0">… живлення</tspan><tspan x="767.0" dy="13.0">повернулося</tspan></text>
<text x="490.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Цілісність гарантує BOD, шанс на стан дає попередження, встигає FRAM, а перевірка суми не дає ожити з брехливими даними.</text>
