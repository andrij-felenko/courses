<text x="710.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Піддерево: [0x2A02 .. 0x5400]</text>
<line x1="190.0" y1="193.0" x2="120.0" y2="255.0" stroke="#27ae60" stroke-width="1.4"/>
