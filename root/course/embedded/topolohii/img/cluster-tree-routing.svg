<text x="820.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Давач D4</text>
<line x1="135.0" y1="255.0" x2="210.0" y2="193.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="240.0" y1="145.0" x2="420.0" y2="89.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="520.0" y1="89.0" x2="690.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="725.0" y1="193.0" x2="810.0" y2="252.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="155.0" width="300.0" height="75.0" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.4"/>
<text x="470.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Траєкторія Tree Routing Stretch (4 хопи):</text>
<text x="470.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">D1 → R1 → Корінь → R2 → D4</text>
<text x="470.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Маршрут через спільного предка (навіть якщо D2 і D3 поруч)</text>
<rect x="40.0" y="325.0" width="410.0" height="105.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="245.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Арифметична маршрутизація Cskip (Без таблиць):</text>
<text x="55.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Якщо Target ∈ [Child_Min .. Child_Max] → шлемо ВНИЗ дитині</text>
<text x="55.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Якщо Target ∉ моєму піддереву → шлемо ВГОРУ батькові</text>
<text x="55.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Ціна в пам'яті: O(1) RAM — обчислення формулою на льоту</text>
<rect x="490.0" y="325.0" width="410.0" height="105.0" rx="6" fill="#fdf2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="695.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Вразливість деревоподібної структури:</text>
<text x="505.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• Падіння роутера R1 миттєво відрізає D1 та D2 від мережі</text>
<text x="505.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Нащадки переходять у стан Orphan (сирота) і шукають батька</text>
<text x="505.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Re-association займає сотні мілісекунд або секунди</text>
</svg>