<text x="120.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x0002</text>
<text x="120.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Давач D1</text>
<line x1="270.0" y1="193.0" x2="270.0" y2="255.0" stroke="#27ae60" stroke-width="1.4"/>
<circle cx="270.0" cy="265.0" r="16.0" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<text x="270.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x0003</text>
<text x="270.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Давач D2</text>
<line x1="670.0" y1="193.0" x2="670.0" y2="255.0" stroke="#27ae60" stroke-width="1.4"/>
