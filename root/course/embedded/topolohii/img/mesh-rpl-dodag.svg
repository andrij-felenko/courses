<text x="470.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чарункова мережа RPL: дерево DODAG, розрахунок рангу та локальне самовідновлення</text>
