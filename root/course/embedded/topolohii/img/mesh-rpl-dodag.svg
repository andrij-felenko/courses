<line x1="645.0" y1="155.0" x2="490.0" y2="80.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="302.0" y1="170.0" x2="638.0" y2="170.0" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="470.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Sibling link (той самий ранг)</text>
