<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерела розсіювання тепла в силовій установці BLDC + ESC</text>
<rect x="30.0" y="60.0" width="390.0" height="420.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="225.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Електродвигун (BLDC Motor)</text>
<rect x="94.5" y="122.5" width="261.1" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="225.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Омічні втрати в міді (Copper Losses)</tspan><tspan x="225.0" dy="13.0">P_cu = 3/2 · I_phase² · R_phase(T)</tspan><tspan x="225.0" dy="13.0">• Нагрів збільшує опір міді: +0.393%/°C</tspan><tspan x="225.0" dy="13.0">• Домінують при великій тязі й перегазовках</tspan></text>
<rect x="66.0" y="236.0" width="318.1" height="78.0" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.8"/><text x="225.0" y="252.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Магнітні втрати в статорі (Iron/Core Losses)</tspan><tspan x="225.0" dy="13.0">P_fe = P_hysteresis + P_eddy</tspan><tspan x="225.0" dy="13.0">• Гістерезис: перемагнічування сталі ~ f_elec · B^1.6</tspan><tspan x="225.0" dy="13.0">• Вихрові струми Фуко: ~ f_elec² · B² · d_lam²</tspan><tspan x="225.0" dy="13.0">• Ростуть з обертами (RPM) навіть без тяги</tspan></text>
<rect x="111.6" y="362.5" width="226.9" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="225.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Механічні й аеродинамічні втрати</tspan><tspan x="225.0" dy="13.0">P_mech = P_bearing + P_windage</tspan><tspan x="225.0" dy="13.0">• Тертя в кулькових підшипниках</tspan><tspan x="225.0" dy="13.0">• Аеродинамічний опір ротора / дзвона</tspan></text>
<rect x="460.0" y="60.0" width="390.0" height="420.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="655.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Регулятор швидкості (ESC)</text>
<rect x="515.9" y="122.5" width="278.2" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="655.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Втрати провідності ключів (Conduction)</tspan><tspan x="655.0" dy="13.0">P_cond = 2 · I_rms² · R_DS(on)(T_j)</tspan><tspan x="655.0" dy="13.0">• R_DS(on) подвоюється при нагріванні до 150°C</tspan><tspan x="655.0" dy="13.0">• Пряме джоулеве тепло відкритого каналу</tspan></text>
<rect x="507.4" y="236.0" width="295.3" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="655.0" y="252.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Динамічні комутаційні втрати (Switching)</tspan><tspan x="655.0" dy="13.0">P_sw = V_in · I_out · f_pwm · (t_rise + t_fall)</tspan><tspan x="655.0" dy="13.0">• Енергія розсіювання під час перемикання V·I</tspan><tspan x="655.0" dy="13.0">• Залежать від ємності затвора Q_g та драйвера</tspan><tspan x="655.0" dy="13.0">• Зростають лінійно з частотою ШІМ (24→48→96 кГц)</tspan></text>
<rect x="501.6" y="362.5" width="306.7" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="655.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Втрати мертвого часу та конденсаторів</tspan><tspan x="655.0" dy="13.0">• Провідність body-діода під час dead-time</tspan><tspan x="655.0" dy="13.0">• Втрати заряду затвора P_gate = Q_g · V_gs · f_pwm</tspan><tspan x="655.0" dy="13.0">• Пульсації струму на ESR електролітів шини</tspan></text>
<text x="440.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Тепловий баланс: мотор страждає від пікового струму й високих обертів, а регулятор — від перегріву R_DS(on) і частоти ШІМ</text>
</svg>