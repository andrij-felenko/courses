<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шляхи розсіювання тепла: обдування гвинтом та відцентрова вентиляція</text>
<rect x="30.0" y="60.0" width="400.0" height="370.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="230.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Охолодження BLDC мотора</text>
<rect x="100.0" y="120.0" width="260.0" height="50.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="230.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Обертовий дзвін ротора (Bell)</text>
<rect x="130.0" y="185.0" width="200.0" height="70.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="230.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Статор та мідні обмотки</text>
<text x="230.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Головний генератор тепла (I²R + Iron)</text>
<line x1="60.0" y1="145.0" x2="95.0" y2="145.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="75.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Вхід</text>
<line x1="230.0" y1="172.0" x2="230.0" y2="183.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="332.0" y1="220.0" x2="375.0" y2="220.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="360.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Вихід</text>
<rect x="56.7" y="296.0" width="346.6" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="312.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Конструктивні фактори охолодження:</tspan><tspan x="230.0" dy="13.0">• Відцентрові крильчатки в базі дзвона (Centrifugal Vents)</tspan><tspan x="230.0" dy="13.0">• Набігаючий потік від гвинта (Prop Wash / Slipstream)</tspan><tspan x="230.0" dy="13.0">• Теплопровідність до карбонового променя рами</tspan><tspan x="230.0" dy="13.0">• Режим висіння (Hover): потік малий, нагрів максимальний</tspan></text>
<rect x="450.0" y="60.0" width="400.0" height="370.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="650.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Охолодження регулятора (ESC)</text>
<rect x="520.0" y="120.0" width="260.0" height="25.0" rx="2" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.6"/>
<text x="650.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Алюмінієвий радіатор / Heatsink</text>
<rect x="540.0" y="150.0" width="220.0" height="20.0" rx="2" fill="#fef9e7" stroke="#e67e22" stroke-width="1.5"/>
<text x="650.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e67e22" text-anchor="middle">Термопрокладка / Thermal Pad (θ_CS)</text>
<rect x="520.0" y="175.0" width="260.0" height="30.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="650.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Силові MOSFET ключі (Junction T_j)</text>
<rect x="500.0" y="210.0" width="300.0" height="35.0" rx="2" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="650.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Багатошарова друкована плата (2–4 oz міді + Vias)</text>
<text x="650.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Тепловий розподіл по внутрішніх шарах</text>
<line x1="470.0" y1="132.0" x2="515.0" y2="132.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="485.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Обдув</text>
<rect x="456.8" y="296.0" width="386.5" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="312.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Правила монтажу ESC:</tspan><tspan x="650.0" dy="13.0">• Розміщення прямо під струменем гвинта на промені</tspan><tspan x="650.0" dy="13.0">• Термоусадка (Heatshrink) ізолює тепло — робити вікно!</tspan><tspan x="650.0" dy="13.0">• Товсті мідні шари (3 oz / 105 мкм) знижують опір плати</tspan><tspan x="650.0" dy="13.0">• ESC 4-в-1 у закритому фюзеляжі перегрівається в 2.5 рази швидше</tspan></text>
<text x="440.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Прямий набігаючий потік від лопатей знижує тепловий опір у повітря R_θ у 3–5 разів порівняно зі стоячим повітрям</text>
</svg>