<circle cx="290.0" cy="170.0" r="5.0" fill="#c0392b" stroke="#900c3f" stroke-width="1.5"/>
<text x="290.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Коліно перегину (Knee Point)</text>
<rect x="548.9" y="73.5" width="282.2" height="173.0" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Температурні класи NdFeB:</tspan><tspan x="690.0" dy="13.0"></tspan><tspan x="690.0" dy="13.0">• N52 (Standard): T_max = 80 °C</tspan><tspan x="690.0" dy="13.0">  Дешеві мотори; швидке розмагнічування</tspan><tspan x="690.0" dy="13.0">• N52H (High Temp): T_max = 120 °C</tspan><tspan x="690.0" dy="13.0">  Оптимальний вибір для фристайлу/FPV</tspan><tspan x="690.0" dy="13.0">• N52SH (Super High): T_max = 150 °C</tspan><tspan x="690.0" dy="13.0">  Важкі дрони, витривалість під навантаженням</tspan><tspan x="690.0" dy="13.0">• N52UH / EH: T_max = 180–200 °C</tspan><tspan x="690.0" dy="13.0">  Спеціальні індустріальні приводи</tspan><tspan x="690.0" dy="13.0"></tspan><tspan x="690.0" dy="13.0">Точка Кюрі T_c ≈ 310–320 °C (повний нуль поля)</tspan></text>
<rect x="532.8" y="305.0" width="314.4" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="690.0" y="322.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Наслідки перегріву ротора:</tspan><tspan x="690.0" dy="13.0">1. Падіння залишкової індукції B_r → дрейф K_v вгору</tspan><tspan x="690.0" dy="13.0">2. Зниження крутного моменту: τ = k_t · I_phase</tspan><tspan x="690.0" dy="13.0">3. Необоротне розмагнічування від зустрічного</tspan><tspan x="690.0" dy="13.0">   магнітного поля статора при перегазовках</tspan></text>
<text x="430.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Коли температура магніту перевищує робочу межу марки, зустрічне поле статора необоротно зсуває робочу точку за коліно перегину</text>
</svg>