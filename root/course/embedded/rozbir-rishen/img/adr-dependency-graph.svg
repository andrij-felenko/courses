<rect x="185.0" y="310.0" width="260.0" height="85.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="2.0"/><text x="315.0" y="341.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">ADR-0004: Протокол зв'язку</tspan><tspan x="315.0" dy="15.6">MQTT Topic Tree + Retain + LWT</tspan><tspan x="315.0" dy="15.6">(QoS 1, ідемпотентність)</tspan></text>
