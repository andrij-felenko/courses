<rect x="440.0" y="196.0" width="330.0" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="605.0" y="225.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Резистор = Z₀ на землю біля приймача. Хвиля одразу «бачить»</tspan><tspan x="605.0" dy="11.1">узгодження — відбиття немає. Та через нього тече струм.</tspan></text>
