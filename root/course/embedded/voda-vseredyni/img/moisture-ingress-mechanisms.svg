<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три фізичні механізми проникнення вологи в закритий корпус</text>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три фізичні механізми проникнення вологи в закритий корпус</text>
<rect x="30.0" y="55.0" width="280.0" height="395.0" rx="8" fill="#fdfbf7" stroke="#d35400" stroke-width="1.8"/>
<text x="170.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">1. Капілярний ефект (Wicking)</text>
<text x="170.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перетік вздовж жил кабелю</text>
<rect x="70.0" y="120.0" width="200.0" height="70.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="80.0" y="130.0" width="180.0" height="50.0" rx="3" fill="#fadbd8" stroke="#c0392b" stroke-width="1.2"/>
<line x1="85.0" y1="143.0" x2="255.0" y2="143.0" stroke="#b9770e" stroke-width="2.5"/>
<line x1="85.0" y1="151.0" x2="255.0" y2="151.0" stroke="#b9770e" stroke-width="2.5"/>
<line x1="85.0" y1="159.0" x2="255.0" y2="159.0" stroke="#b9770e" stroke-width="2.5"/>
<line x1="85.0" y1="167.0" x2="255.0" y2="167.0" stroke="#b9770e" stroke-width="2.5"/>
<line x1="50.0" y1="155.0" x2="78.0" y2="155.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="48.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">Вода</text>
<text x="170.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Капілярний тиск у жилах:</text>
<text x="170.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">h = (2 · γ · cos θ) / (ρ · g · r)</text>
<text x="170.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Сальник обтискає оболонку,</text>
<text x="170.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">  але зазори r ≈ 5–20 мкм</text>
<text x="170.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">  між жилами лишаються вільними</text>
<text x="170.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Вода піднімається на висоту</text>
<text x="170.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">  до 0.5–1.5 м прямо на плату</text>
<text x="170.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Захист: water-block заливка,</text>
<text x="170.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">розтин ізоляції у гермовводі,</text>
<text x="170.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">прохідні болти (penetrators)</text>
<rect x="335.0" y="55.0" width="280.0" height="395.0" rx="8" fill="#f4f8fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="475.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Динамічний напір води</text>
<text x="475.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Швидкість човна / удари хвиль</text>
<rect x="395.0" y="120.0" width="160.0" height="70.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<line x1="475.0" y1="120.0" x2="475.0" y2="190.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="365.0" y1="140.0" x2="470.0" y2="140.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="365.0" y1="170.0" x2="470.0" y2="170.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="363.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">v = 15 м/с</text>
<text x="475.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкісний тиск гальмування:</text>
<text x="475.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">q = 0.5 · ρ · v² ≈ 112.5 кПа</text>
<text x="475.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Статичний IP67 = 1 м (10 кПа)</text>
<text x="475.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Швидкісний напір на 54 км/год</text>
<text x="475.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">  еквівалентний глибині 11.5 м!</text>
<text x="475.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Струмінь відгинає плоскі</text>
<text x="475.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">  кромки та ковпачки сальників</text>
<text x="475.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Захист: замкнені пази O-ring,</text>
<text x="475.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">жорсткі фланці, захисні</text>
<text x="475.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">дефлектори та лабіринти</text>
<rect x="640.0" y="55.0" width="280.0" height="395.0" rx="8" fill="#fbf5f5" stroke="#c0392b" stroke-width="1.8"/>
<text x="780.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. Термічне «дихання»</text>
<text x="780.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Цикл нагріву й охолодження</text>
<rect x="700.0" y="120.0" width="160.0" height="70.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="780.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+65 °C → +10 °C у воді</text>
<text x="780.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ΔP ≈ −16 кПа (вакуум)</text>
<line x1="875.0" y1="155.0" x2="850.0" y2="155.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="880.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">Всмоктування</text>
<text x="780.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон стану ідеального газу:</text>
<text x="780.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">P₁ / T₁ = P₂ / T₂</text>
<text x="780.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• При нагріві повітря виходить</text>
<text x="780.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">  крізь мікрощілини назовні</text>
<text x="780.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• При різкому охолодженні</text>
<text x="780.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">  утворюється глибокий вакуум,</text>
<text x="780.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">  що засмоктує воду крізь шви</text>
<text x="780.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Захист: ePTFE Gore-Tex</text>
<text x="780.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">дихальні клапани (Vents),</text>
<text x="780.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">вирівнювання тиску ΔP = 0</text>
</svg>