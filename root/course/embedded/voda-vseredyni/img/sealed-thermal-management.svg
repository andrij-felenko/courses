<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях тепловідведення в герметичному металевому корпусі</text>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях тепловідведення в герметичному металевому корпусі</text>
<rect x="40.0" y="55.0" width="420.0" height="380.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="250.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка: Повітряний зазор у боксі</text>
<text x="250.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повітря як ефективний теплоізолятор</text>
<rect x="100.0" y="145.0" width="300.0" height="90.0" rx="4" fill="#ffffff" stroke="#991b1b" stroke-width="2.0"/>
<rect x="140.0" y="200.0" width="220.0" height="12.0" rx="2" fill="#15803d" stroke="#166534" stroke-width="1.2"/>
<rect x="210.0" y="170.0" width="80.0" height="30.0" rx="3" fill="#fca5a5" stroke="#c0392b" stroke-width="1.5"/>
<text x="250.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">SoC / ESC (15 Вт)</text>
<text x="250.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Повітряний зазор: k = 0.026 Вт/(м·К)</text>
<text x="250.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">T_кристал &gt; +110 °C (Тротлінг / Перегрів)</text>
<text x="250.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Термодинамічна пастка замкненого об'єму:</text>
<text x="250.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Природна конвекція у вузькому зазорі придушена</text>
<text x="250.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Тепловий опір повітря: R_th &gt; 12–18 °C/Вт</text>
<text x="250.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Тепло акумулюється всередині гермоблоку</text>
<text x="250.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Батареї та кристали перегріваються за 10–15 хв</text>
<text x="250.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Висновок: герметичний бокс не можна</text>
<text x="250.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">залишати з порожнім повітряним прошарком!</text>
<rect x="480.0" y="55.0" width="420.0" height="380.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="690.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Правильно: Прямий тепловий міст (Thermal Bridge)</text>
<text x="690.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Thermal Pad + Алюмінієвий корпус + Вода</text>
<rect x="540.0" y="145.0" width="300.0" height="90.0" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2.0"/>
<rect x="540.0" y="145.0" width="300.0" height="20.0" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<line x1="570.0" y1="145.0" x2="570.0" y2="130.0" stroke="#475569" stroke-width="3.0"/>
<line x1="610.0" y1="145.0" x2="610.0" y2="130.0" stroke="#475569" stroke-width="3.0"/>
<line x1="650.0" y1="145.0" x2="650.0" y2="130.0" stroke="#475569" stroke-width="3.0"/>
<line x1="690.0" y1="145.0" x2="690.0" y2="130.0" stroke="#475569" stroke-width="3.0"/>
<line x1="730.0" y1="145.0" x2="730.0" y2="130.0" stroke="#475569" stroke-width="3.0"/>
<line x1="770.0" y1="145.0" x2="770.0" y2="130.0" stroke="#475569" stroke-width="3.0"/>
<line x1="810.0" y1="145.0" x2="810.0" y2="130.0" stroke="#475569" stroke-width="3.0"/>
<rect x="580.0" y="210.0" width="220.0" height="12.0" rx="2" fill="#15803d" stroke="#166534" stroke-width="1.2"/>
<rect x="650.0" y="180.0" width="80.0" height="30.0" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
<text x="690.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="middle" font-weight="700">SoC / ESC</text>
<rect x="648.0" y="163.0" width="84.0" height="17.0" rx="6" fill="#86efac" stroke="#27ae60" stroke-width="1.5"/>
<text x="690.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700">Thermal Pad (k=6 Вт/мК)</text>
<text x="690.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">T_кристал &lt; +55 °C (Стабільна робота)</text>
<text x="690.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Зовнішній теплообмін у воді: h = 1000–2500 Вт/(м²·К)</text>
<text x="690.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Переваги прямого теплового контакту:</text>
<text x="690.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Thermal Pad стискається на 25–40% без тиску на кристал</text>
<text x="690.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Сумарний опір R_th ланцюга: &lt; 1.2 °C/Вт</text>
<text x="690.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Алюмінієвий сплав (6061) k ≈ 160–180 Вт/(м·К)</text>
<text x="690.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Вода зовні має гігантську тепловіддачу h_вода</text>
<text x="690.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Корпус катера/ровера розсіює десятки ватів</text>
<text x="690.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">тепла прямо у водойму або забортне повітря!</text>
</svg>