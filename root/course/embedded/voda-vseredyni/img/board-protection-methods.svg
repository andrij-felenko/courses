<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння конформного покриття та компаундування друкованої плати</text>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист електроніки на рівні плати: Conformal Coating проти Potting</text>
<rect x="40.0" y="55.0" width="420.0" height="380.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="250.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Конформне покриття (Conformal Coating)</text>
<text x="250.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тонка полімерна плівка товщиною 25–75 мкм</text>
<rect x="90.0" y="175.0" width="320.0" height="18.0" rx="2" fill="#15803d" stroke="#166534" stroke-width="1.5"/>
<rect x="130.0" y="150.0" width="60.0" height="25.0" rx="2" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
<text x="160.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">MCU</text>
<rect x="220.0" y="160.0" width="35.0" height="15.0" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="1.0"/>
<text x="238.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">LDO</text>
<rect x="290.0" y="155.0" width="45.0" height="20.0" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
<text x="312.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Baro</text>
<line x1="90.0" y1="172.0" x2="125.0" y2="172.0" stroke="#4ade80" stroke-width="4.0"/>
<line x1="125.0" y1="147.0" x2="195.0" y2="147.0" stroke="#4ade80" stroke-width="4.0"/>
<line x1="195.0" y1="172.0" x2="215.0" y2="172.0" stroke="#4ade80" stroke-width="4.0"/>
<line x1="215.0" y1="157.0" x2="260.0" y2="157.0" stroke="#4ade80" stroke-width="4.0"/>
<line x1="260.0" y1="172.0" x2="285.0" y2="172.0" stroke="#4ade80" stroke-width="4.0"/>
<line x1="340.0" y1="172.0" x2="410.0" y2="172.0" stroke="#4ade80" stroke-width="4.0"/>
<text x="312.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Маскування!</text>
<text x="250.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матеріали за IPC-CC-830:</text>
<text x="250.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Акрил (AR) — легко наносити і змивати при пайці</text>
<text x="250.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Поліуретан (UR) — висока хімічна стійкість</text>
<text x="250.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Силікон (SR) — еластичний, термостійкий (−50..+200 °C)</text>
<text x="250.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Парилен (XY) — безпорова плівка з вакуумної фази</text>
<text x="250.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Переваги та обмеження:</text>
<text x="250.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">✓ Мінімальна додаткова маса (грами)</text>
<text x="250.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">✓ Зберігає можливість діагностики й ремонту</text>
<text x="250.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">✗ Не захищає від тиску води при тривалому зануренні</text>
<rect x="480.0" y="55.0" width="420.0" height="380.0" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.8"/>
<text x="690.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Компаундування (Potting / Encapsulation)</text>
<text x="690.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Монолітна заливка всього об'єму смолою</text>
<rect x="530.0" y="130.0" width="320.0" height="80.0" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="550.0" y="185.0" width="280.0" height="15.0" rx="2" fill="#15803d" stroke="#166534" stroke-width="1.2"/>
<rect x="610.0" y="160.0" width="60.0" height="25.0" rx="2" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
<text x="640.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">ESC</text>
<text x="690.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Суцільний шар компаунду (PU / Epoxy)</text>
<text x="690.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матеріали компаундів:</text>
<text x="690.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Поліуретан (PU) — гнучкий, гасить ударні навантаження</text>
<text x="690.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Епоксид (Epoxy) — максимальна міцність, адгезія</text>
<text x="690.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Теплопровідний силікон — краще відводить тепло</text>
<text x="690.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Вакуумна дегазація усуває бульбашки повітря</text>
<text x="690.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Переваги та обмеження:</text>
<text x="690.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">✓ Абсолютний захист від води, тиску й вібрацій</text>
<text x="690.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">✗ Неможливість ремонту (одноразовий модуль)</text>
<text x="690.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">✗ Ризик відриву пайок через різницю розширення (CTE)</text>
</svg>