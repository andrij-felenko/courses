<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канонічний розрахунок прямокутного паза O-Ring за стандартом ISO 3601-2</text>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канонічний розрахунок прямокутного паза O-Ring (ISO 3601-2)</text>
<rect x="40.0" y="55.0" width="420.0" height="380.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія паза та стиснення шнура</text>
<rect x="100.0" y="185.0" width="300.0" height="110.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<rect x="190.0" y="185.0" width="120.0" height="60.0" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2.0"/>
<rect x="100.0" y="155.0" width="300.0" height="25.0" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
<ellipse cx="250.0" cy="215.0" rx="48.0" ry="24.0" fill="#fecaca" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="250.0" cy="215.0" r="30.0" fill="none" stroke="#6b7280" stroke-width="1.5"/>
<line x1="325.0" y1="185.0" x2="325.0" y2="245.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="335.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">h (глибина)</text>
<line x1="190.0" y1="265.0" x2="310.0" y2="265.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="250.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">b (ширина паза)</text>
<text x="195.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">d₂</text>
<text x="250.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Ключові розрахункові інваріанти:</text>
<text x="250.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Стиснення (Squeeze): S = (d₂ − h) / d₂ = 18–28%</text>
<text x="250.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Заповнення (Groove Fill): GF = A_oring / A_groove = 70–82%</text>
<text x="250.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3. Розтяг по ID (Stretch): ID_str = 1.5–4% (макс 6%)</text>
<text x="250.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4. Радіуси скруглення кутів: R₁ = 0.4–0.8 мм, R₂ = 0.2 мм</text>
<rect x="480.0" y="55.0" width="420.0" height="380.0" rx="8" fill="#fffaf5" stroke="#d97706" stroke-width="1.5"/>
<text x="690.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Ефект самоущільнення та типові аварії</text>
<rect x="540.0" y="185.0" width="300.0" height="110.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<rect x="630.0" y="185.0" width="120.0" height="60.0" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2.0"/>
<rect x="540.0" y="155.0" width="300.0" height="25.0" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
<ellipse cx="705.0" cy="215.0" rx="42.0" ry="24.0" fill="#bbf7d0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="635.0" y1="210.0" x2="680.0" y2="210.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="635.0" y1="225.0" x2="680.0" y2="225.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="655.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Тиск води P</text>
<text x="690.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Чому паз не можна заповнювати на 100%:</text>
<text x="690.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Гума нестислива за об'ємом (коефіцієнт Пуассона ν ≈ 0.5)</text>
<text x="690.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Теплове розширення гуми у 10× більше за алюміній</text>
<text x="690.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Набухання в мастилі додає 3–8% об'єму</text>
<text x="690.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Переповнений паз (&gt;90%) вигинає кришку або зрізає O-ring!</text>
</svg>