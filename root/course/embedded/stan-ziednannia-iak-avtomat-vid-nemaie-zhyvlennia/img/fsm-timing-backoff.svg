<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова шкала таймаутів та експоненційного відкату (Backoff + Jitter)</text>
<line x1="60.0" y1="120.0" x2="840.0" y2="120.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="855.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">t</text>
<line x1="80.0" y1="105.0" x2="80.0" y2="135.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="80.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0 с</text>
<text x="80.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">FET ON
+ PWRKEY</text>
<line x1="160.0" y1="105.0" x2="160.0" y2="135.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="160.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1.5 с</text>
<text x="160.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">AT OK
CPIN OK</text>
<rect x="160.0" y="110.0" width="160.0" height="20.0" rx="3" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
<text x="240.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">NET_SEARCH: Timeout 60 s</text>
<line x1="320.0" y1="105.0" x2="320.0" y2="135.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="320.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">61.5 с</text>
<text x="320.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">CREG Timeout!
Retry #1</text>
<rect x="320.0" y="110.0" width="70.0" height="20.0" rx="3" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="355.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Sleep 4s</text>
<rect x="390.0" y="110.0" width="120.0" height="20.0" rx="3" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
<text x="450.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">NET_SEARCH (60s)</text>
<rect x="510.0" y="110.0" width="100.0" height="20.0" rx="3" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="560.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Sleep 16s + Jitter</text>
<rect x="610.0" y="110.0" width="80.0" height="20.0" rx="3" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="650.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">CREG: 1 OK</text>
<line x1="690.0" y1="105.0" x2="690.0" y2="135.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="750.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">TCP CONNECT
+ MQTT SEND (2s)</text>
<rect x="690.0" y="110.0" width="120.0" height="20.0" rx="3" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
<text x="750.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ONLINE / TX OK</text>
<rect x="50.0" y="230.0" width="380.0" height="190.0" rx="6" fill="#fdfefe" stroke="#c0392b" stroke-width="1.5"/>
<text x="240.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний підхід: Фіксований інтервал (5 с)</text>
<text x="70.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• 10 000 лічильників відключаються через збій БС</text>
<text x="70.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Усі одночасно починають штурмувати RACH кожні 5 с</text>
<text x="70.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Повна колізія пакетів: мережа не встигає піднятися</text>
<text x="70.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Акумулятор розряджається в 10 разів швидше</text>
<text x="70.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Результат: «Лавина запитів» (Thundering Herd)</text>
<rect x="470.0" y="230.0" width="380.0" height="190.0" rx="6" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/>
<text x="660.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Стійкий підхід: Експонента + Full Jitter</text>
<text x="490.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Інтервал подвоюється: T_k = min(T_max, T_base · 2^k)</text>
<text x="490.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Додається випадковий зсув: t_sleep = rand(0, T_k)</text>
<text x="490.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запити розподіляються рівномірно за часом</text>
<text x="490.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Базова станція плавно обслуговує чергу</text>
<text x="490.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Результат: 99.8% пристроїв відновлюють зв'язок</text>
</svg>