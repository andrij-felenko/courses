<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="460.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр відеопотоку та вшивання метаданих SEI у кадри H.264</text>
<rect x="25.0" y="65.0" width="175.0" height="120.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
<rect x="25.0" y="65.0" width="175.0" height="26.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0"/>
<text x="112.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">1. Сенсор камери</text>
<text x="35.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Фотодіоди + Shutter</text>
<text x="35.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• Апаратний Strobe</text>
<text x="35.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Початок експозиції</text>
<text x="35.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  на Input Capture МК</text>
<line x1="200.0" y1="125.0" x2="235.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="235.0" y="65.0" width="175.0" height="120.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<rect x="235.0" y="65.0" width="175.0" height="26.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.0"/>
<text x="322.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Фіксація мітки МК</text>
<text x="245.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Апаратний таймер (TIM)</text>
<text x="245.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• Похибка &lt; 1 мкс</text>
<text x="245.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Зчитування UTC з GPS</text>
<text x="245.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Прив'язка кватерніона</text>
<line x1="410.0" y1="125.0" x2="445.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="445.0" y="65.0" width="175.0" height="120.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<rect x="445.0" y="65.0" width="175.0" height="26.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.0"/>
<text x="532.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Енкодер (V4L2/ISP)</text>
<text x="455.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Стиснення (YUV420)</text>
<text x="455.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• NAL Type 6 (SEI)</text>
<text x="455.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• user_data_unregistered</text>
<text x="455.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Вшивання перед IDR</text>
<line x1="620.0" y1="125.0" x2="655.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="655.0" y="65.0" width="175.0" height="120.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="655.0" y="65.0" width="175.0" height="26.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.0"/>
<text x="742.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">4. RTSP / MP4 Запис</text>
<text x="665.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Контейнер MP4 / RTP</text>
<text x="665.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">• Метадані не псують кадр</text>
<text x="665.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Стандартні плеєри грають</text>
<text x="665.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Парсер витягує лог</text>
