<text x="440.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">payloadType = 5 (user_data_unregistered) | Довжина L байтів</text>
<rect x="610.0" y="243.0" width="205.0" height="42.0" rx="4" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="712.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">NAL 5: IDR Slice (I-Frame)</text>
<text x="712.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Стиснені пікселі кадру</text>
<rect x="40.0" y="297.0" width="775.0" height="148.0" rx="5" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="55.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Структура корисного навантаження SEI (Бінарний заголовок телеметрії кадру):</text>
