<rect x="25.0" y="205.0" width="810.0" height="26.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
<text x="40.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Анатомія NAL-юнітів кадру: вбудовування SEI User Data Unregistered (PayloadType = 5)</text>
