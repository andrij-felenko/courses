<text x="140.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">UUID ідентифікатор</text>
<text x="65.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">16 байтів (GUID)</text>
<text x="65.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Унікальний ключ схеми</text>
<text x="65.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">для перевірки типу</text>
<rect x="240.0" y="329.0" width="195.0" height="100.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="337.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Часові мітки (uint64)</text>
<text x="250.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• timestamp_utc_us (64 біти)</text>
<text x="250.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• timestamp_boot_us (64 біти)</text>
<text x="250.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• exposure_us (32 біти)</text>
<rect x="450.0" y="329.0" width="185.0" height="100.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="542.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Бортовий стан дрона</text>
<text x="460.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Кватерніон q[4] (float32)</text>
<text x="460.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Координати Lat/Lon/Alt</text>
<text x="460.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Кутові швидкості gyro[3]</text>
<rect x="650.0" y="329.0" width="165.0" height="100.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="732.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Службові поля</text>
<text x="660.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• frame_sequence (32 біти)</text>
<text x="660.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• sensor_id (8 бітів)</text>
<text x="660.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• CRC32 контрольна сума</text>
