<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="460.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура робастного фільтра зміщення часу (Timesync Filter)</text>
<rect x="25.0" y="65.0" width="150.0" height="140.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<rect x="25.0" y="65.0" width="150.0" height="26.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.0"/>
<text x="100.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Сирі мітки</text>
<text x="35.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">TIMESYNC / PTP</text>
<text x="35.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• t₁, t₂, t₃, t₄</text>
<text x="35.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Обчислення сирих:</text>
<text x="35.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">  raw_rtt = t₄ - t₁</text>
<text x="35.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">  raw_offset = θ_raw</text>
<line x1="175.0" y1="135.0" x2="193.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="193.0" y="65.0" width="150.0" height="140.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
<rect x="193.0" y="65.0" width="150.0" height="26.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0"/>
<text x="268.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">2. Кільцевий буфер</text>
<text x="203.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0369a1" text-anchor="start" font-weight="700">Ковзне вікно (K=16)</text>
<text x="203.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Збереження K пар</text>
<text x="203.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  (offset_i, rtt_i)</text>
<text x="203.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Витіснення старих</text>
<text x="203.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Захист від втрат</text>
<line x1="343.0" y1="135.0" x2="361.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="361.0" y="65.0" width="150.0" height="140.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<rect x="361.0" y="65.0" width="150.0" height="26.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.0"/>
<text x="436.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. Min-RTT Фільтр</text>
<text x="371.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Відбір вибірок</text>
<text x="371.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Знаходження min(RTT)</text>
<text x="371.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">• Відкидання піків</text>
<text x="371.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Фільтрація викидів</text>
<text x="371.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  (Outlier Rejection)</text>
<line x1="511.0" y1="135.0" x2="529.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="529.0" y="65.0" width="150.0" height="140.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<rect x="529.0" y="65.0" width="150.0" height="26.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.0"/>
<text x="604.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">4. Оцінка фази й дрейфу</text>
<text x="539.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">EWMA + Skew Rate</text>
<text x="539.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Згладжування фази:</text>
<text x="539.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">  θ_filt = (1-α)θ + α·θ_new</text>
<text x="539.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Лінійна регресія дрейфу</text>
<text x="539.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  частоти (ppm / skew)</text>
<line x1="679.0" y1="135.0" x2="697.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="697.0" y="65.0" width="150.0" height="140.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="697.0" y="65.0" width="150.0" height="26.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.0"/>
<text x="772.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">5. Синхронізатор</text>
<text x="707.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Плавне підтягування</text>
<text x="707.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">• Slewing (±500 ppm)</text>
<text x="707.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• Заборона стрибків назад</text>
<text x="707.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Гарантія dt &gt; 0 для PID</text>
<text x="707.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Монотонна шкала часу</text>
<rect x="25.0" y="225.0" width="810.0" height="235.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="25.0" y="225.0" width="810.0" height="26.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
<text x="40.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Порівняння стратегій корекції: Миттєвий стрибок (Stepping) проти Плавного підтягування (Slewing)</text>
<rect x="40.0" y="261.0" width="375.0" height="185.0" rx="5" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="227.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Миттєвий стрибок (Clock Stepping) — НЕБЕЗПЕЧНО</text>
<text x="55.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">Механізм: Прямий запис нового часу у годинник: t_now = t_new</text>
<text x="55.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">• Якщо годинник випереджав: час стрибає НАЗАД на Δt.</text>
<text x="55.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Обчислення інтервалу в контурі керування ламається:</text>
<text x="65.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">dt = t_now - t_prev  →  dt &lt; 0  або  4 294 967 мс (uint32)!</text>
<text x="55.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Наслідок: інтегратор PID видає нескінченний ривок, таймери</text>
<text x="65.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">FreeRTOS блокуються, EKF розходиться.</text>
<text x="55.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">✓ Дозволено ЛИШЕ один раз під час холодного старту системи (|θ| &gt; 1 с).</text>
<rect x="445.0" y="261.0" width="375.0" height="185.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="632.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Плавне підтягування (Clock Slewing) — НАДІЙНО</text>
<text x="460.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">Механізм: Тимчасова зміна темпу ходу годинника на ±r ppm</text>
<text x="460.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Годинник ніколи не стрибає і ніколи не йде назад.</text>
<text x="460.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Якщо годинник поспішає на 10 мс, прискорюємо або</text>
<text x="470.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">сповільнюємо віртуальний час на 500 ppm (0.5 мс/с).</text>
<text x="460.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">• За 20 секунд помилка 10 мс повністю усувається без ривків.</text>
<text x="460.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• Інваріант строгого монотонного зростання: dt &gt; 0 ЗАВЖДИ.</text>
<text x="460.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">✓ Стандарт для PX4/ArduPilot, Linux adjtimex() та промислового PTP.</text>
</svg>