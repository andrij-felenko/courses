<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="480.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двосторонній обмін мітками часу: розрахунок RTT і зміщення годинника</text>
<rect x="70.0" y="57.0" width="180.0" height="30.0" rx="5" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
<text x="160.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Клієнт (Станція GCS)</text>
<rect x="410.0" y="57.0" width="180.0" height="30.0" rx="5" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="500.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сервер (Бортовий МК)</text>
<line x1="160.0" y1="91.0" x2="160.0" y2="345.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="500.0" y1="91.0" x2="500.0" y2="345.0" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="160.0" cy="120.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="145.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">t₁ (відправка запиту)</text>
<circle cx="500.0" cy="175.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="515.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">t₂ (прийом сервером)</text>
<line x1="160.0" y1="120.0" x2="500.0" y2="175.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="330.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">TIMESYNC #111 [tc1=0, ts1=t₁]</text>
<text x="330.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Затримка прямого каналу d_fwd</text>
<circle cx="500.0" cy="205.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="515.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">t₃ (відправка відповіді)</text>
<line x1="506.0" y1="175.0" x2="506.0" y2="205.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="645.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">t_proc = t₃ - t₂</text>
<circle cx="160.0" cy="285.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="145.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">t₄ (прийом відповіді)</text>
<line x1="500.0" y1="205.0" x2="160.0" y2="285.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="330.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">TIMESYNC #111 [tc1=t₁, ts1=t₂]</text>
<text x="330.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Затримка зворотного каналу d_rev</text>
<rect x="635.0" y="75.0" width="200.0" height="265.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="635.0" y="75.0" width="200.0" height="26.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
<text x="735.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формули обчислення</text>
<text x="645.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Час кругового обігу (RTT):</text>
<text x="645.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">δ = (t₄ - t₁) - (t₃ - t₂)</text>
<text x="645.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Зміщення годинника (Offset):</text>
<text x="645.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">θ = ((t₂ - t₁) + (t₃ - t₄)) / 2</text>
<text x="645.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">У разі швидкої відповіді (t₂ ≈ t₃):</text>
<text x="645.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">δ = t₄ - t₁</text>
<text x="645.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">θ = t₂ - (t₁ + t₄) / 2</text>
<text x="645.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Похибка асиметрії каналу:</text>
<text x="645.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">ε = (d_rev - d_fwd) / 2</text>
<rect x="25.0" y="360.0" width="810.0" height="115.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
<rect x="25.0" y="360.0" width="810.0" height="26.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0"/>
<text x="40.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="start" font-weight="700">Ключовий інваріант: мінімізація асиметрії через фільтрацію Min-RTT</text>
<text x="40.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Затримка поширення сигналу в ефірі суворо симетрична: d_fwd ≈ d_rev.</text>
<text x="40.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Асиметрія виникає через черги буферизації в ОС, стеках Wi-Fi/LTE та радіомодемах (Bufferbloat).</text>
<text x="40.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Вибірка з мінімальним RTT у ковзному вікні гарантує проходження без затримок у чергах: ε → 0.</text>
</svg>