<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерела апаратного скидання мікроконтролера та прапорці статусу</text>
<rect x="30.0" y="65.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="42.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Power-On / Power-Down (POR/PDR)</text>
<text x="42.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Подача живлення або знеструмлення (&lt; 1.8V)</text>
<line x1="350.0" y1="90.0" x2="410.0" y2="90.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="127.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="2.0"/>
<text x="42.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="start" font-weight="700">Brown-Out Detector (BOR / PVD)</text>
<text x="42.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Короткочасне просідання напруги живлення</text>
<line x1="350.0" y1="152.0" x2="410.0" y2="152.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="189.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="2.0"/>
<text x="42.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2980b9" text-anchor="start" font-weight="700">Зовнішній пін скидання (NRST)</text>
<text x="42.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Апаратна кнопка або сигнал зовнішнього супервізора</text>
<line x1="350.0" y1="214.0" x2="410.0" y2="214.0" stroke="#2980b9" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="251.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="2.0"/>
<text x="42.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700">Незалежний сторож (IWDG)</text>
<text x="42.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Зависання головного циклу / такт від LSI 32 кГц</text>
<line x1="350.0" y1="276.0" x2="410.0" y2="276.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="313.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#16a085" stroke-width="2.0"/>
<text x="42.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a085" text-anchor="start" font-weight="700">Віконний сторож (WWDG)</text>
<text x="42.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Передчасне або запізніле оновлення сторожа</text>
<line x1="350.0" y1="338.0" x2="410.0" y2="338.0" stroke="#16a085" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="375.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="2.0"/>
<text x="42.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="start" font-weight="700">Програмне скидання (SFTRST)</text>
<text x="42.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Виклик NVIC_SystemReset() з коду прошивки</text>
<line x1="350.0" y1="400.0" x2="410.0" y2="400.0" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="420.0" y="65.0" width="170.0" height="360.0" rx="8" fill="#edf2f7" stroke="#333333" stroke-width="2.0"/>
<text x="505.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний</text>
<text x="505.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">контролер скидання</text>
<text x="505.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(RCC / Reset Control)</text>
<rect x="432.0" y="175.0" width="146.0" height="140.0" rx="5" fill="#ffffff" stroke="#718096" stroke-width="1.5"/>
<text x="505.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Липкі тригери</text>
<text x="505.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">(Sticky Flags)</text>
<text x="505.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зберігають джерело</text>
<text x="505.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">крізь перезапуск;</text>
<text x="505.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">не зникають самі!</text>
<text x="505.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Генерація сигналу</text>
<text x="505.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">System Reset на ядро</text>
<line x1="590.0" y1="245.0" x2="640.0" y2="245.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="65.0" width="195.0" height="360.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="2.0"/>
<text x="737.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">Регістр RCC-&gt;CSR</text>
<text x="737.5" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Reset Status Register)</text>
<rect x="650.0" y="140.0" width="175.0" height="20.0" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="658.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">LPWRRSTF</text>
<text x="819.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Low-power reset</text>
<rect x="650.0" y="164.0" width="175.0" height="20.0" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="658.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">WWDGRSTF</text>
<text x="819.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Window watchdog</text>
<rect x="650.0" y="188.0" width="175.0" height="20.0" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="658.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">IWDGRSTF</text>
<text x="819.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Independent watchdog</text>
<rect x="650.0" y="212.0" width="175.0" height="20.0" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="658.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">SFTRSTF</text>
<text x="819.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Software reset</text>
<rect x="650.0" y="236.0" width="175.0" height="20.0" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="658.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">PORRSTF</text>
<text x="819.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Power-on reset</text>
<rect x="650.0" y="260.0" width="175.0" height="20.0" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="658.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">PINRSTF</text>
<text x="819.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">NRST pin reset</text>
<rect x="650.0" y="284.0" width="175.0" height="20.0" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="658.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">BORRSTF</text>
<text x="819.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Brown-out reset</text>
<rect x="650.0" y="320.0" width="175.0" height="95.0" rx="5" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="737.5" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Діагностика в main():</text>
<text x="737.5" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1. Зчитати прапорці</text>
<text x="737.5" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Записати RMVF = 1</text>
<text x="737.5" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(очистити для історії)</text>
<text x="430.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Якщо не скинути RMVF на старті, усі наступні збої змішаються з попередніми</text>
</svg>