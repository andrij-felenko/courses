<text x="440.0" y="21.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія апаратних винятків Cortex-M та механізм ескалації збоїв</text>
