<text x="705.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#feb2b2" text-anchor="middle" font-weight="700">Вихід ТІЛЬКИ через апаратний Reset (Watchdog/NRST)</text>
<rect x="30.0" y="365.0" width="480.0" height="80.0" rx="6" fill="#ebf8ff" stroke="#bee3f8" stroke-width="1.5"/>
<text x="270.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="700">Золоте правило надійності в Cortex-M:</text>
<text x="270.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Завжди вмикайте індивідуальні винятки в SHCSR на старті системи!</text>
<text x="270.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тоді збій викличе точний обробник замість миттєвого звалювання в HardFault.</text>
