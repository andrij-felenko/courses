<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 494" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="494" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця рішень: незмінний виріб проти оновлюваного</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця вибору: коли незмінність є чесною інженерною відповіддю</text>
<rect x="40.0" y="60.0" width="410.0" height="185.0" rx="10" fill="#edf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="60.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">1. Незмінність — критична вимога</text>
<line x1="60.0" y1="100.0" x2="430.0" y2="100.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="64.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">• Системи безпеки SIL-3 / SIL-4</tspan><tspan x="64.0" dy="15.4">• Авіоніка (DO-178C Level A)</tspan><tspan x="64.0" dy="15.4">• Медичні імпланти (FDA Class III)</tspan><tspan x="64.0" dy="15.4">• Оновлення анулює сертифікацію</tspan></text>
<rect x="490.0" y="60.0" width="410.0" height="185.0" rx="10" fill="#eef4fa" stroke="#2457d6" stroke-width="1.8"/>
<text x="510.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">2. Незмінність — оптимізація вартості</text>
<line x1="510.0" y1="100.0" x2="880.0" y2="100.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="514.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="514.0" dy="0.0">• Автономні давачі (10+ років)</tspan><tspan x="514.0" dy="15.4">• Фіксовані мости (USB-UART, BMS)</tspan><tspan x="514.0" dy="15.4">• Одноразові логери температури</tspan><tspan x="514.0" dy="15.4">• Мінімізація Flash, RAM і струму</tspan></text>
<rect x="40.0" y="260.0" width="410.0" height="185.0" rx="10" fill="#fdf8e8" stroke="#b8860b" stroke-width="1.8"/>
<text x="60.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="start" font-weight="700">3. Локальне сервісне оновлення</text>
<line x1="60.0" y1="300.0" x2="430.0" y2="300.0" stroke="#b8860b" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="64.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">• Промислові контролери без мережі</tspan><tspan x="64.0" dy="15.4">• Доступ через техніка з ноутбуком</tspan><tspan x="64.0" dy="15.4">• Фізичний перемикач запису на платі</tspan><tspan x="64.0" dy="15.4">• Суворий регламент техогляду</tspan></text>
<rect x="490.0" y="260.0" width="410.0" height="185.0" rx="10" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="510.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">4. Динамічне OTA обов'язкове</text>
<line x1="510.0" y1="300.0" x2="880.0" y2="300.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="514.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="514.0" dy="0.0">• Споживчі IoT-шлюзи та хаби</tspan><tspan x="514.0" dy="15.4">• Пристрої з мінливими протоколами</tspan><tspan x="514.0" dy="15.4">• Системи зі стрічками вразливостей</tspan><tspan x="514.0" dy="15.4">• Продукти з новими платними фічами</tspan></text>
<rect x="40.0" y="452.0" width="860.0" height="22.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="470.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Критерій вибору: складність оточення, вимоги регуляторів, бюджет енергії та ціна помилки в полі</text>
