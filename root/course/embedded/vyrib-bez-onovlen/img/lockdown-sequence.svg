<text x="60.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">Після перепалювання апаратних фьюзів або переведення Option Bytes у стан Level 2 кристал переходить у стан остаточного замкнення.</tspan><tspan x="60.0" dy="14.2">Шина зневадження SWD/JTAG фізично відключається логікою кристала. Повернення в режим розробки або повторне зчитування прошивки</tspan><tspan x="60.0" dy="14.2">неможливе навіть за наявності фізичного доступу до виводів мікроконтролера.</tspan></text>
