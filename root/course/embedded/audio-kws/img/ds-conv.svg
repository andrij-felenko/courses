<rect x="525.0" y="82.0" width="330.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="99.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">крок 1 — глибинна: простір,</tspan><tspan x="690.0" dy="14.3">по каналах ОКРЕМО</tspan></text>
