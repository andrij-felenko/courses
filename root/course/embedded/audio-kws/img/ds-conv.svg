<rect x="708.0" y="132.0" width="150.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="783.0" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="783.0" dy="0.0">C_in · C_out</tspan></text>
<rect x="525.0" y="176.0" width="330.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="199.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">крок 2 — точкова 1×1: змішує канали</tspan></text>
<rect x="293.1" y="243.0" width="353.8" height="38.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="470.0" y="266.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">виграш = (C_out · k·k) / (k·k + C_out)</tspan></text>
