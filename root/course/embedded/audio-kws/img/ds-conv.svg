<text x="470.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">та сама форма шару — майже увосьмеро менше множень</text>
<text x="470.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тому DS-CNN виграє всі три бюджети «Hello Edge» (95.4%)</text>
