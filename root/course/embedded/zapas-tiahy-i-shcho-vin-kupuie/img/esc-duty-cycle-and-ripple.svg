<text x="450.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вплив надлишкового TWR на режим роботи ESC і пульсації струму</text>
<rect x="50.0" y="55.0" width="370.0" height="20.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="68.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">Надлишковий TWR = 8.0 (Duty cycle D ≈ 12%)</tspan></text>
