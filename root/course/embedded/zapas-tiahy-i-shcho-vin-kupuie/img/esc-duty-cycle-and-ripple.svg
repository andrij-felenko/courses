<text x="655.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Оптимальний Duty Cycle: високий ККД силового каскаду</text>
<rect x="470.0" y="225.0" width="370.0" height="110.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="257.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Переваги узгодженого TWR:</tspan><tspan x="655.0" dy="13.0">• Силова частина працює в зоні високого ККД силових ключів</tspan><tspan x="655.0" dy="13.0">• Мінімальне теплове навантаження на ключі ESC</tspan><tspan x="655.0" dy="13.0">• Лінійний відгук обертів на зміну сигналу керування</tspan><tspan x="655.0" dy="13.0">• Чиста силова шина без критичних імпульсних викидів</tspan></text>
</svg>