<text x="235.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Низький Duty Cycle: високі комутаційні втрати MOSFET</text>
<rect x="50.0" y="225.0" width="370.0" height="110.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="257.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Пастки надлишкового TWR при висінні:</tspan><tspan x="235.0" dy="13.0">• Високий пульсуючий струм I_ripple = I_motor · √(D·(1-D))</tspan><tspan x="235.0" dy="13.0">• Нагрів електролітичних конденсаторів через ESR</tspan><tspan x="235.0" dy="13.0">• Нелінійність тяги на низьких обертах (важко тримати висоту)</tspan><tspan x="235.0" dy="13.0">• Комутаційні перешкоди (EMI) на лініях датчиків IMU</tspan></text>
<rect x="470.0" y="55.0" width="370.0" height="20.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="68.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Оптимальний TWR = 2.5 (Duty cycle D ≈ 45%)</tspan></text>
