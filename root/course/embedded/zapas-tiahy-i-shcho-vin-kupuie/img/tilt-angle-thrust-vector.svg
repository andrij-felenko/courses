<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторне розкладання тяги при нахилі рами (Pitch / Roll)</text>
<line x1="110.0" y1="260.0" x2="290.0" y2="140.0" stroke="#333333" stroke-width="3.0"/>
<circle cx="110.0" cy="260.0" r="8.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<circle cx="290.0" cy="140.0" r="8.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<circle cx="200.0" cy="200.0" r="14.0" fill="#edf2f7" stroke="#333333" stroke-width="2.0"/>
<line x1="200.0" y1="200.0" x2="292.0" y2="108.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="307.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Повна тяга T_total</text>
<line x1="200.0" y1="200.0" x2="200.0" y2="108.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="185.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">T_vert = T·cos(θ)</text>
<text x="185.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end">(= m·g для висіння)</text>
<line x1="200.0" y1="200.0" x2="292.0" y2="200.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="246.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">T_horiz = T·sin(θ)</text>
<text x="246.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">(рух уперед / опір вітру)</text>
<line x1="292.0" y1="108.0" x2="200.0" y2="108.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="292.0" y1="108.0" x2="292.0" y2="200.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="200.0" y1="200.0" x2="200.0" y2="290.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="188.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Вага m·g</text>
<text x="218.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">θ = 45°</text>
<rect x="450.0" y="55.0" width="410.0" height="290.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="103.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Залежність потрібної тяги від кута нахилу θ</tspan><tspan x="655.0" dy="14.3"></tspan><tspan x="655.0" dy="14.3">Щоб апарат не втрачав висоту, вертикальна складова</tspan><tspan x="655.0" dy="14.3">мусить дорівнювати вазі: T · cos(θ) = m · g</tspan><tspan x="655.0" dy="14.3">Отже, мінімальний необхідний TWR = 1 / cos(θ)</tspan><tspan x="655.0" dy="14.3"></tspan><tspan x="655.0" dy="14.3">• θ = 0°  (висіння):      TWR_min = 1.00  (базовий баланс)</tspan><tspan x="655.0" dy="14.3">• θ = 30° (плавний рух):   TWR_min = 1.15  (+15% тяги)</tspan><tspan x="655.0" dy="14.3">• θ = 45° (швидкий політ): TWR_min = 1.41  (+41% тяги)</tspan><tspan x="655.0" dy="14.3">• θ = 60° (порив вітру):   TWR_min = 2.00  (+100% тяги)</tspan><tspan x="655.0" dy="14.3">• θ = 70° (екстрений кут): TWR_min = 2.92  (+192% тяги)</tspan><tspan x="655.0" dy="14.3">• θ = 80° (акробатика):    TWR_min = 5.76  (+476% тяги)</tspan><tspan x="655.0" dy="14.3"></tspan><tspan x="655.0" dy="14.3">Якщо TWR платформи дорівнює 1.5, при нахилі понад 48°</tspan><tspan x="655.0" dy="14.3">навіть 100% газу не втримають висоту — дрон неминуче падає.</tspan></text>
</svg>