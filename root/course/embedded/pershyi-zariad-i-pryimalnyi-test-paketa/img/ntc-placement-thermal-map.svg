<text x="535.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">T1: Центр ядра збірки (Core)</text>
<text x="535.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Найгірше відведення тепла (адіабатичне серце)</text>
<text x="535.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Поріг заряду: COTP = 45 °C (вимкнення)</text>
<text x="535.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Поріг розряду: DOTP = 60 °C (вимкнення)</text>
<text x="535.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Контроль дельти: ΔT (T1 - T2) ≤ 5 °C</text>
<rect x="525.0" y="205.0" width="380.0" height="95.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="535.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">T2: Силова струмознімна шина</text>
<text x="535.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Моніторинг опору силового з'єднувача</text>
<text x="535.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ловить ослаблення болтів / контактів</text>
<text x="535.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Поріг спрацьовування: 65 °C</text>
<text x="535.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Захист від холодного заряду: CUTP = 0 °C</text>
<rect x="525.0" y="315.0" width="380.0" height="95.0" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/>
<text x="535.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="start" font-weight="700">T3: Силові MOSFET та шунти BMS</text>
<text x="535.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Нагрів ключів при тривалому розряді</text>
<text x="535.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Тепловиділення балансувальних резисторів</text>
<text x="535.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Поріг аварійного захисту: 85 °C</text>
<text x="535.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Запобігає тепловому пробою кристалів</text>
