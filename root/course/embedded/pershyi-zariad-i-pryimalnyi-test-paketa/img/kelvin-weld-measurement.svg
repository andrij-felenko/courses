<rect x="470.0" y="50.0" width="450.0" height="360.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="695.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Диференційний мікровольтметр</text>
<text x="495.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Тестовий струм:  I_test = 10.0 А</text>
<text x="495.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Виміряний спад:   ΔU = 2.4 мВ = 0.0024 В</text>
<text x="495.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">3. Опір з'єднання:  R = ΔU / I = 0.24 мОм (НОРМА)</text>
<text x="495.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"></text>
<text x="495.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Критерії бракування зварного шва:</text>
<text x="495.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• R &lt; 0.35 мОм  → Відмінна якість зварювання</text>
<text x="495.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• 0.35..0.70 мОм → Задовільно (допустимий контакт)</text>
<text x="495.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• R &gt; 0.70 мОм  → БРАК: холодний шов / недовар</text>
<text x="495.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"></text>
<text x="495.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Втрати при струмі 30 А (R = 1.5 мОм):</text>
<text x="495.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">P = I² · R = 30² · 0.0015 = 1.35 Вт (перегрів!)</text>
</svg>