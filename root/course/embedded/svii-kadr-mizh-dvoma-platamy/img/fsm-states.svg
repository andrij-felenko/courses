<line x1="145.0" y1="210.0" x2="145.0" y2="180.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="345.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кадр оброблено -&gt; повернення в IDLE</text>
<line x1="400.0" y1="180.0" x2="400.0" y2="245.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="385.0" y="212.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-weight="700">len &gt;= MAX</text>
