<text x="435.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">STATE_RECEIVE</text>
<text x="435.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Накопичення байтів</text>
<text x="435.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">buf[rx_len++] = byte</text>
<rect x="340.0" y="245.0" width="190.0" height="65.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="435.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">STATE_OVERFLOW</text>
<text x="435.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Буфер вичерпано</text>
<text x="435.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Скидання до 0x00</text>
<rect x="630.0" y="110.0" width="180.0" height="70.0" rx="8" fill="#fff8e7" stroke="#d35400" stroke-width="1.8"/>
<text x="720.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">COBS DECODE</text>
<text x="720.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Перевірка CRC-16</text>
<text x="720.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">on_frame_valid()</text>
