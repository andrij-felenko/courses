<rect x="490.0" y="250.0" width="130.0" height="36.0" rx="4" fill="#fff3cd" stroke="#e67e22" stroke-width="1.5"/>
<text x="555.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Затримка RTOS &gt; T_gap</text>
<text x="555.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d35400" text-anchor="middle" font-style="italic">фальшивий таймаут!</text>
<rect x="630.0" y="250.0" width="140.0" height="36.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
