<text x="550.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Приймач чекає 250 байтів: кадри 2 і 3 ковтаються як «дані» битого кадру</text>
<text x="30.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Міжкадровий таймаут (Modbus-подібний): джиттер RTOS розриває цілий кадр</text>
