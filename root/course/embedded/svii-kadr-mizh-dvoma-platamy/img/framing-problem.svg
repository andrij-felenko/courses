<text x="30.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Наслідок: один цілий кадр розколюється на два фрагменти, обидва відкидаються за помилкою CRC.</text>
