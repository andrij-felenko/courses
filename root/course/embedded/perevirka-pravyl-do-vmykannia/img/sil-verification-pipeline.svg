<text x="537.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">3. Суха прогонка</text>
<text x="537.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Dry Run / Disarm Mode</text>
<line x1="462.0" y1="124.0" x2="612.0" y2="124.0" stroke="#7e22ce" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="537.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="537.0" dy="0.0">Виконання на залізі,</tspan><tspan x="537.0" dy="15.4">але силові ключі знеструмлені;</tspan><tspan x="537.0" dy="15.4">аудит вихідного логу дій</tspan></text>
<line x1="630.0" y1="180.0" x2="649.0" y2="180.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="653.0" y="60.0" width="180.0" height="240.0" rx="8" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.8"/>
<text x="743.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">4. SIL-симулятор</text>
<text x="743.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Software-in-the-Loop</text>
<line x1="668.0" y1="124.0" x2="818.0" y2="124.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="743.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="743.0" dy="0.0">Замкнений контур із фізичною</tspan><tspan x="743.0" dy="15.4">моделлю об'єкта (Plant Model)</tspan><tspan x="743.0" dy="15.4">та віртуальним часом</tspan></text>
<rect x="35.0" y="330.0" width="798.0" height="65.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="430.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">СИЛОВЕ ВМИКАННЯ (ARMED STATE): РЕЛЕ, ТЕНИ, НАСОСИ, КЛАПАНИ</text>
<text x="430.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Подача живлення на приводи дозволена лише за 100% проходження перевірок 1-4 без порушення інваріантів безпеки</text>
