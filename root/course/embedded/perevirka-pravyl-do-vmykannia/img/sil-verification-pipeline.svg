<text x="331.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">2. Ін'єкція входів</text>
<text x="331.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Sensor Mocking &amp; Faults</text>
<line x1="256.0" y1="124.0" x2="406.0" y2="124.0" stroke="#d97706" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="331.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="331.0" dy="0.0">Подача 150 °C, 0 бар, NaN,</tspan><tspan x="331.0" dy="15.4">обривів зв'язку та</tspan><tspan x="331.0" dy="15.4">аномальних комбінацій</tspan></text>
<line x1="424.0" y1="180.0" x2="443.0" y2="180.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
