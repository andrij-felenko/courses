<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Етапи верифікації правил до подачі напруги на навантаження</text>
<rect x="35.0" y="60.0" width="180.0" height="240.0" rx="8" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="125.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Табличний аналіз</text>
<text x="125.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Повний перебір 2^N станів</text>
<line x1="50.0" y1="124.0" x2="200.0" y2="124.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="125.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Виявлення конфліктів,</tspan><tspan x="125.0" dy="15.4">суперечностей і глухих</tspan><tspan x="125.0" dy="15.4">кутів (deadlocks)</tspan></text>
