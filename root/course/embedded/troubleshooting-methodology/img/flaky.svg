<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 346" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="346" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плавучий предикат ламає бісекцію</text>
<text x="180.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">детермінований предикат</text>
<rect x="60.0" y="82.0" width="240.0" height="46.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="1.6"/>
<text x="180.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">увімкнув причину → впало ЩОРАЗУ</tspan><tspan x="180.0" dy="13.1">вимкнув → не впало ЩОРАЗУ</tspan></text>
<text x="180.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">«так/ні» чесне</text>
<line x1="180.0" y1="168.0" x2="180.0" y2="206.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="210.0" width="220.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/>
<text x="180.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">вікно ділиться навпіл</tspan><tspan x="180.0" dy="13.1">вірно щокроку → винуватець</tspan></text>
<text x="540.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">плавучий предикат</text>
<rect x="420.0" y="82.0" width="240.0" height="46.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/>
<text x="540.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">збій раз на годину «коли схоче»</tspan><tspan x="540.0" dy="13.1">не впало за 5 хв — хибне чи не пощастило?</tspan></text>
<text x="540.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">одна хибна «ні»</text>
<line x1="540.0" y1="168.0" x2="540.0" y2="206.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="422.0" y="210.0" width="236.0" height="44.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/>
<text x="540.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">відкинуто ЗДОРОВУ половину</tspan><tspan x="540.0" dy="13.1">(з винуватцем) → пошук у пустелі</tspan></text>
<line x1="360.0" y1="60.0" x2="360.0" y2="264.0" stroke="#c8ccd0" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="360.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">спершу приборкай плавучість (зроби, щоб падало щоразу) — потім дели навпіл</text>
<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">бісекція коректна рівно доти, доки кожна відповідь предиката однозначна</text>
</svg>