<rect x="295.0" y="220.0" width="300.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="445.0" y="240.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="445.0" dy="0.0">double-T → fly-by</tspan><tspan x="445.0" dy="11.7">стуби стали неприйнятні; з'явилися</tspan><tspan x="445.0" dy="11.7">write/read leveling — проблема SI</tspan><tspan x="445.0" dy="11.7">переїхала в контролер</tspan></text>
<line x1="445.0" y1="200.0" x2="445.0" y2="158.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="100.0" y1="280.0" x2="358.8" y2="280.0" stroke="#2457d6" stroke-width="1.4"/>
<text x="229.4" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">ера розгалужень (стуби)</text>
<line x1="360.8" y1="280.0" x2="790.0" y2="280.0" stroke="#27ae60" stroke-width="1.4"/>
<text x="660.6" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">ера fly-by (вирівнювання в контролері)</text>
<text x="430.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">зі зростанням швидкості JEDEC переламав топологію на DDR3 — і складність перейшла з плати в контролер</text>
