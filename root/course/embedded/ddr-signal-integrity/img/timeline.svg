<text x="617.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">DDR4</text>
<text x="617.5" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1600–3200 МТ/с</text>
<line x1="617.5" y1="112.0" x2="617.5" y2="142.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3 3"/>
