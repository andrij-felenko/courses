<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження вирівнювання: чип сам каже, коли DQS збігся з тактом</text>
<rect x="70.0" y="120.0" width="150.0" height="150.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.8"/><text x="145.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">КОНТРОЛЕР</tspan><tspan x="145.0" dy="14.3"></tspan><tspan x="145.0" dy="14.3">зсуває фазу DQS</tspan><tspan x="145.0" dy="14.3">кроками лінії</tspan><tspan x="145.0" dy="14.3">затримки</tspan></text>
<rect x="630.0" y="120.0" width="160.0" height="150.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="710.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0"></tspan></text>
<text x="710.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">DRAM</text>
<rect x="666.0" y="164.0" width="90.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="711.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">тригер</text>
<text x="670.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">D ← CK</text>
<text x="670.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">такт ← DQS</text>
<line x1="220.0" y1="170.0" x2="630.0" y2="170.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="425.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">повільні імпульси DQS →</text>
<text x="425.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(чип ловить ними свій CK)</text>
<line x1="630.0" y1="230.0" x2="220.0" y2="230.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="425.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">← відповідь по лінії DQ</text>
<text x="425.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 = DQS рано · 1 = DQS збігся з фронтом CK</text>
<rect x="70.0" y="320.0" width="750.0" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="445.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Контролер зсуває DQS, доки відповідь не перемкнеться 0 → 1: саме там фронт DQS лягає на фронт CK у ЦЬОГО чипа.</tspan><tspan x="445.0" dy="13.0">Для кожного чипа — свій зсув; так керований перекіс fly-by вимірюється апаратно, а не рахується олівцем.</tspan></text>
<text x="430.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">write leveling: контролер не рахує затримку, а ПИТАЄ чип — і той відповідає одним бітом по DQ</text>
</svg>