<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="910.0" height="510.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівнева архітектура сховища бортового реєстратора (L1 RAM → L2 Non-Volatile)</text>
<rect x="35.0" y="70.0" width="410.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="240.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень 1 (L1): Швидкий буфер у SRAM (.noinit)</text>
<text x="240.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розмір: 4–8 КБ | Затримка: 0 мкс | Ресурс: ∞</text>
<rect x="55.0" y="135.0" width="370.0" height="60.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="240.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Заголовок буфера (Ring Header)</text>
<text x="240.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Magic: 0x52494E47 | Head: 142 | Tail: 0 | Frozen: 0</text>
<rect x="55.0" y="205.0" width="370.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="240.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Масив 256–512 бінарних кадрів (Event Array)</text>
<text x="240.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Кадри пишуться циклічно під час кожного виклику</text>
<text x="240.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Прямий доступ з переривань ISR без м'ютексів</text>
<text x="240.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• Секція .noinit зберігає дані при скиданні NVIC_SystemReset()</text>
<text x="240.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• При HardFault буфер заморожується (Frozen = 1)</text>
<rect x="55.0" y="345.0" width="370.0" height="110.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="240.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Регістри стану ядра (Crash Context)</text>
<text x="240.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">CFSR, HFSR, MMFAR, BFAR (причина винятку)</text>
<text x="240.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">R0..R3, R12, LR, PC, xPSR (стековий кадр винятку)</text>
<text x="240.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Стан FSM усіх підсистем + покажчик вершини стека SP</text>
<line x1="450.0" y1="270.0" x2="485.0" y2="270.0" stroke="#15803d" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="467.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700">Flush /</text>
<text x="467.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700">Commit</text>
<rect x="490.0" y="70.0" width="420.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="700.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень 2 (L2): Енергонезалежна пам'ять (FRAM / Flash)</text>
<text x="700.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розмір: 32–64 КБ | Захист від повного знеструмлення</text>
<rect x="510.0" y="135.0" width="380.0" height="55.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="700.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">0x0000: Метадані тому (Partition Header)</text>
<text x="700.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Magic: 0x424F5831 | Boot Count: 84 | Crash Count: 2 | CRC-16</text>
<rect x="510.0" y="200.0" width="380.0" height="120.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="700.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">0x1000..0x3FFF: Слоти аварійних знімків (Crash Dumps)</text>
<text x="700.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Слот 0 (2 КБ): Попередній аварійний дамп</text>
<text x="700.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• Слот 1 (2 КБ): Останній аварійний дамп (Активний)</text>
<text x="700.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Слот 2 (2 КБ): Резервний слот</text>
<text x="700.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Слот 3 (2 КБ): Резервний слот</text>
<rect x="510.0" y="330.0" width="380.0" height="125.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
<text x="700.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">0x4000..0xFFFF: Кільцевий журнал подій (Flight Log)</text>
<text x="700.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• 48 КБ неперервного запису ключових телеметричних подій</text>
<text x="700.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Монотонний sequence_id для відновлення послідовності</text>
<text x="700.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700">• FRAM: миттєвий побайтовий запис без зносу (10^14 циклів)</text>
<text x="700.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Flash: ротація секторів (Sector Erase + Ping-Pong)</text>
<rect x="17.1" y="484.8" width="905.8" height="30.5" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="503.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Дворівнева буферизація розділяє нульову затримку запису в RAM під час роботи та гарантоване енергонезалежне збереження інциденту в постійну пам'ять.</tspan></text>
</svg>