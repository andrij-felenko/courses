<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Петля гістерезису сегнетоелектрика: два стійкі стани без живлення</text>
<text x="500.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Поляризація P проти поля E: при E=0 лишається ±Pr (два біти); перемикання коштує подолати коерцитивне поле ±Ec</text>
<line x1="120.0" y1="320.0" x2="880.0" y2="320.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="500.0" y1="550.0" x2="500.0" y2="90.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="890.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">E</text>
<text x="890.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">поле</text>
<text x="512.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">P</text>
<text x="512.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">поляризація</text>
<line x1="140.0" y1="196.0" x2="500.0" y2="196.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="140.0" y1="444.0" x2="500.0" y2="444.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="348.8" y1="320.0" x2="348.8" y2="444.0" stroke="#b9770e" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="651.2" y1="320.0" x2="651.2" y2="196.0" stroke="#b9770e" stroke-width="1.0" stroke-dasharray="4,4"/>
<path d="M 140.0 492.0 C 454.6 492.0, 651.2 431.6, 651.2 295.2 S 820.0 148.0, 860.0 148.0" fill="none" stroke="#2457d6" stroke-width="3"/>
<path d="M 860.0 148.0 C 545.4 148.0, 348.8 208.4, 348.8 344.8 S 180.0 492.0, 140.0 492.0" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="741.2" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">→ запис «1»</text>
<text x="258.8" y="483.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">← запис «0»</text>
<circle cx="500.0" cy="196.0" r="6.0" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.2"/>
<circle cx="500.0" cy="444.0" r="6.0" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.2"/>
<text x="486.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">+Pr = «1»</text>
<text x="514.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">−Pr = «0»</text>
<text x="651.2" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">+Ec</text>
<text x="348.8" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">−Ec</text>
<rect x="120.0" y="502.0" width="760.0" height="48.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/><text x="500.0" y="522.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">При знятому полі (E=0) диполі не повертаються самі — лишаються в +Pr або −Pr.</tspan><tspan x="500.0" dy="15.6">Ось нелеткість: біт тримає застигла орієнтація диполів, а не струм чи заряд-що-стікає.</tspan></text>
