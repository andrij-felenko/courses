<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дешеве правило без буфера: розв'язати імпедансами</text>
<rect x="60.0" y="70.0" width="250.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Ланка 1</tspan><tspan x="185.0" dy="19.5">вихідний опір</tspan><tspan x="185.0" dy="19.5">≈ R1</tspan><tspan x="185.0" dy="19.5">(на низьких частотах)</tspan></text>
<rect x="390.0" y="70.0" width="250.0" height="120.0" rx="6" fill="#fdf3ea" stroke="#b9770e" stroke-width="1.5"/><text x="515.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">Ланка 2</tspan><tspan x="515.0" dy="19.5">вхідний опір</tspan><tspan x="515.0" dy="19.5">≈ R2 + (Xc2)</tspan><tspan x="515.0" dy="19.5">— на зрізі ~ R2</tspan></text>
<line x1="315" y1="130" x2="385" y2="130" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="350.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">живить</text>
<rect x="120.0" y="215.0" width="460.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="350.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Щоб ланка 2 майже не навантажувала ланку 1:</tspan><tspan x="350.0" dy="16.9">R2  ≥  10 · R1     — тоді відгук ≈ добуток, без буфера.</tspan></text>
