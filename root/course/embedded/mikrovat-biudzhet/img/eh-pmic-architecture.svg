<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня структура наноекономічного PMIC (BQ25570 / ADP5091)</text>
<rect x="180.0" y="50.0" width="580.0" height="430.0" rx="10" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/>
<text x="470.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">EH PMIC (Власний струм спокою I_q &lt; 300 нА)</text>
<rect x="20.0" y="180.0" width="120.0" height="100.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="80.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерело збору</text>
<text x="80.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">TEG / Solar / PZT</text>
<text x="80.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">U_in = 0.1..2.0 В</text>
<line x1="140.0" y1="230.0" x2="210.0" y2="230.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="175.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">VIN</text>
<rect x="210.0" y="110.0" width="240.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="330.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Холодний старт (Cold-Start)</text>
<text x="330.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Автогенератор від 100..330 мВ</text>
<text x="330.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">ККД ~ 15..25% до U_stor = 1.8 В</text>
<rect x="210.0" y="210.0" width="240.0" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="330.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Головний Boost-перетворювач</text>
<text x="330.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Синхронний ключ (ККД 80..90%)</text>
<text x="330.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">FOCV MPPT (семплування 16 с)</text>
<text x="330.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Опорний конденсатор VREF_SAMP</text>
<rect x="210.0" y="340.0" width="240.0" height="115.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="330.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нановольтовий супервізор</text>
<text x="330.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">V_OV = 3.6 В (Захист від перезаряду)</text>
<text x="330.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">V_OK_HYST: Увімк 3.3 В / Вимк 2.0 В</text>
<text x="330.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Компаратори зі струмом &lt; 50 нА</text>
<rect x="485.0" y="110.0" width="245.0" height="180.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="607.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Керування накопичувачем</text>
<text x="607.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Шина V_STOR (2.0..3.6 В)</text>
<text x="607.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ключ захисту батареї / іоністора</text>
<rect x="485.0" y="310.0" width="245.0" height="145.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="607.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Вихідний Buck / Ключ навантаження</text>
<text x="607.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Стабілізована шина V_OUT (3.0 В / 1.8 В)</text>
<text x="607.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Керується сигналом VBAT_OK</text>
<text x="607.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">I_q_buck &lt; 150 нА</text>
<rect x="800.0" y="110.0" width="120.0" height="90.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="860.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Іоністор</text>
<text x="860.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">0.047..0.22 Ф</text>
<text x="860.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Буфер енергії</text>
<line x1="730.0" y1="155.0" x2="800.0" y2="155.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="765.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">VBAT</text>
<rect x="800.0" y="330.0" width="120.0" height="110.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="860.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">MCU + Давачі</text>
<text x="860.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">BLE / Sub-GHz</text>
<text x="860.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">V_OUT = 3.0 В</text>
<text x="860.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">VBAT_OK прапорець</text>
<line x1="730.0" y1="375.0" x2="800.0" y2="375.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="765.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">VOUT</text>
<line x1="730.0" y1="420.0" x2="800.0" y2="420.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="765.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">VBAT_OK</text>
</svg>