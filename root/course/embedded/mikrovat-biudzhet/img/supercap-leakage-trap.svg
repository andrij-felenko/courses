<text x="742.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">C * (dV/dt) = I_harvest - I_leak(V, T) - I_q</text>
<text x="742.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Коли I_leak(V) -&gt; I_harvest, dV/dt -&gt; 0</text>
