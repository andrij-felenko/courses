<rect x="120.0" y="350.0" width="320.0" height="44.0" rx="6" fill="#f6f7f9" stroke="#6b7280" stroke-width="1.5"/><text x="280.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">r₁ ≈ 8.66·√(d/f)   (r,м · d,км · f,ГГц)</tspan></text>
<text x="660.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">нижча частота ⇒ товща «сигара» ⇒ потрібно вище підняти антени</text>
