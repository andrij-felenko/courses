<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловий моніторинг першого старту: сигнатури дефектів</text>
<rect x="23.0" y="60.0" width="190.0" height="210.0" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>
<rect x="23.0" y="60.0" width="190.0" height="36.0" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
<text x="118.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">A. Точковий пробій MLCC</text>
<text x="33.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Hotspot: &gt; 75 °C на площі 1 мм²</text>
<text x="33.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Причина: мікротріщина кераміки</text>
<text x="33.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Струм реал: 200–600 мА</text>
<text x="33.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Дія: демонтаж конденсатора</text>
<rect x="229.0" y="60.0" width="190.0" height="210.0" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
<rect x="229.0" y="60.0" width="190.0" height="36.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
<text x="324.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">B. Самозбудження LDO</text>
<text x="239.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Hotspot: 60–90 °C на всьому чіпі</text>
<text x="239.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Причина: невідповідний ESR MLCC</text>
<text x="239.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Осцилограф: ВЧ-дзвін 2 МГц</text>
<text x="239.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Дія: додати послідовно 0.5 Ом</text>
<rect x="435.0" y="60.0" width="190.0" height="210.0" rx="8" fill="#ffffff" stroke="#ec4899" stroke-width="1.8"/>
<rect x="435.0" y="60.0" width="190.0" height="36.0" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.8"/>
<text x="530.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">C. Переполюсовка танталу</text>
<text x="445.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Hotspot: &gt; 110 °C за 1 секунду</text>
<text x="445.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Причина: смуга на плюсі (не мінус)</text>
<text x="445.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ризик: займання діелектрика</text>
<text x="445.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Дія: негайне знеструмлення</text>
<rect x="641.0" y="60.0" width="190.0" height="210.0" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
<rect x="641.0" y="60.0" width="190.0" height="36.0" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="1.8"/>
<text x="736.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">D. Нормальний MCU Idle</text>
<text x="651.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Температура: 24–28 °C (+3 °C)</text>
<text x="651.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Рівномірний градієнт кристала</text>
<text x="651.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Струм споживання: 12–25 мА</text>
<text x="651.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Статус: норма, готовність до FW</text>
<rect x="23.0" y="290.0" width="814.0" height="80.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Альтернатива тепловізору: тест ізопропіловим спиртом (IPA Evaporation)</text>
<text x="38.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">1. Нанести тонкий шар IPA пензлем на знеструмлену плату.</text>
<text x="38.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">2. Подати живлення з лімітом струму 100 мА.</text>
<text x="38.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">3. Точка дефекту (КЗ / пробій) миттєво висихає за 1–2 с через локальний нагрів (суха пляма на вологому тлі).</text>
</svg>