<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трасування партії прототипів: від голої плати до рольового призначення</text>
<rect x="28.0" y="60.0" width="185.0" height="215.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="28.0" y="60.0" width="185.0" height="36.0" rx="8" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<text x="120.5" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Реєстрація ID</text>
<text x="40.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Присвоєння Serial ID</text>
<text x="40.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• QR-код / маркування</text>
<text x="40.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зв'язування з MCU UID</text>
<text x="40.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запис дати й монтажника</text>
<line x1="216.0" y1="167.5" x2="235.0" y2="167.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="238.0" y="60.0" width="185.0" height="215.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="238.0" y="60.0" width="185.0" height="36.0" rx="8" fill="#fef3c7" stroke="#333333" stroke-width="1.5"/>
<text x="330.5" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Холодний аудит</text>
<text x="250.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Опір рейок до GND</text>
<text x="250.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Діодна продзвонка ESD</text>
<text x="250.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Контроль ключа Pin 1</text>
<text x="250.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Оптична інспекція QFN</text>
<line x1="426.0" y1="167.5" x2="445.0" y2="167.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="448.0" y="60.0" width="185.0" height="215.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="448.0" y="60.0" width="185.0" height="36.0" rx="8" fill="#fee2e2" stroke="#333333" stroke-width="1.5"/>
<text x="540.5" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Перший вольт</text>
<text x="460.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Струм у скиданні (NRST=0)</text>
<text x="460.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Напруги в точках TP</text>
<text x="460.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Тепловізорний скринінг</text>
<text x="460.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Осцилограма рейок LDO</text>
<line x1="636.0" y1="167.5" x2="655.0" y2="167.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="658.0" y="60.0" width="185.0" height="215.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="658.0" y="60.0" width="185.0" height="36.0" rx="8" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/>
<text x="750.5" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Прошивка й ролі</text>
<text x="670.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Тестовий ранер (UID/I2C)</text>
<text x="670.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Робочий струм (Active/Sleep)</text>
<text x="670.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фіксація патчів у журналі</text>
<text x="670.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Розподіл плат за ролями</text>
