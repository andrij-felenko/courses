<text x="100.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Старт</text>
<rect x="70.0" y="240.0" width="320.0" height="110.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="85.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Одне правило діє ізольовано:</text>
<text x="85.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Батарея 100% (немає обмеження тяги)</text>
<text x="85.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Вітер 0 м/с (немає бокового зносу)</text>
<text x="85.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Результат: маневр обходу успішний</text>
