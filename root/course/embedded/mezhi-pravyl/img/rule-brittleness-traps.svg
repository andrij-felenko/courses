<text x="295.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Стіна</text>
<path d="M 100 180 L 220 180 Q 260 120 330 120 L 380 120" fill="none" stroke="#27ae60" stroke-width="2.5"/>
