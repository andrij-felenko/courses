<text x="650.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Реальне поле: накладання збурень</text>
<line x1="500.0" y1="180.0" x2="800.0" y2="180.0" stroke="#cbd5e1" stroke-width="2.0" stroke-dasharray="4,4"/>
<rect x="700.0" y="140.0" width="30.0" height="80.0" rx="4" fill="#fecaca" stroke="#c0392b" stroke-width="1.5"/>
<text x="715.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Стіна</text>
<line x1="640.0" y1="115.0" x2="640.0" y2="155.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="640.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Боковий вітер 12 м/с</text>
<path d="M 520 180 L 630 180 Q 660 160 700 170" fill="none" stroke="#c0392b" stroke-width="2.5"/>
