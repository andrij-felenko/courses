<text x="682.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ЗІТКНЕННЯ</text>
<rect x="490.0" y="240.0" width="320.0" height="110.0" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.0"/>
<text x="505.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Конфлікт 3 дискретних правил:</text>
<text x="505.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1. Rule_Обхід: повернути вліво</text>
<text x="505.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">2. Rule_Економія: обмежити струм до 40%</text>
<text x="505.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">3. Вітер зносить апарат швидше за поворот</text>
</svg>