<text x="450.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">СПІЛЬНА ЗЕМЛЯ (Common Ground)</text>
<rect x="103.4" y="421.1" width="713.1" height="41.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="460.0" y="439.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Якщо фьюзи налаштовані на зовнішній кварц, якого немає, автомат інтерфейсу програмування не отримує стробуючих тактів.</tspan><tspan x="460.0" dy="12.3">Подача зовнішнього меандру на XTAL1 відновлює тактування шини SPI/SWD і дозволяє перепрограмувати фьюзи на внутрішній генератор.</tspan></text>
</svg>