<rect x="88.1" y="420.5" width="743.9" height="43.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="460.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Connect Under Reset утримує пін NRST притиснутим до землі, поки налагоджувач конфігурує апаратне перехоплення вектору скидання.</tspan><tspan x="460.0" dy="13.0">Це унеможливлює виконання користувацького коду, який вимикає лінії SWD або переводить чип у глибокий сон.</tspan></text>
