<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="480.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="420.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний життєвий цикл входу в сон та відновлення системи</text>
<rect x="30.0" y="55.0" width="245.0" height="420.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="152.5" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ФАЗА 1: Узгодження та паркування</text>
<rect x="40.0" y="97.0" width="225.0" height="64.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="48.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">1. Арбітраж блокувань</text>
<text x="48.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Перевірка Power Locks усіх модулів</text>
<rect x="40.0" y="169.0" width="225.0" height="64.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="48.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">2. Очікування черг</text>
<text x="48.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">DMA flush, завершення TX UART/SPI</text>
<rect x="40.0" y="241.0" width="225.0" height="64.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="48.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">3. Відключення периферії</text>
<text x="48.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Зупинка тактування шин APB/AHB</text>
<rect x="40.0" y="313.0" width="225.0" height="64.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="48.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">4. Ізоляція GPIO</text>
<text x="48.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Виводи у режим Analog High-Z</text>
<rect x="40.0" y="385.0" width="225.0" height="64.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="48.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">5. Налаштування джерела</text>
<text x="48.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Таймер RTC / Wakeup EXTI пін</text>
<rect x="295.0" y="55.0" width="250.0" height="420.0" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
<text x="420.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">ФАЗА 2: Атомний перехід у сон</text>
<rect x="305.0" y="97.0" width="230.0" height="64.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="313.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">6. Заборона переривань</text>
<text x="313.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">__disable_irq() (встановлення PRIMASK)</text>
<rect x="305.0" y="169.0" width="230.0" height="64.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="313.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">7. Перевірка прапорців</text>
<text x="313.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Чи не виникла подія в мікросекунду засинання?</text>
<rect x="305.0" y="241.0" width="230.0" height="64.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="313.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">8. Конфігурація ядра</text>
<text x="313.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">SCR.SLEEPDEEP = 1, DSB(), ISB()</text>
<rect x="305.0" y="313.0" width="230.0" height="64.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="313.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">9. Інструкція зупинки</text>
<text x="313.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Виконання __WFI() ядра Cortex-M</text>
<rect x="305.0" y="385.0" width="230.0" height="64.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="313.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">10. РЕЖИМ СПОКОЮ</text>
<text x="313.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Струм 2 мкА, ядро чекає переривання</text>
<rect x="565.0" y="55.0" width="245.0" height="420.0" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
<text x="687.5" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle" font-weight="700">ФАЗА 3: Пробудження та рестарт</text>
<rect x="575.0" y="97.0" width="225.0" height="64.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.0"/>
<text x="583.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">11. Апаратне пробудження</text>
<text x="583.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Сигнал EXTI / RTC піднімає ядро</text>
<rect x="575.0" y="169.0" width="225.0" height="64.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.0"/>
<text x="583.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">12. Дозвіл переривань</text>
<text x="583.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">__enable_irq(), вхід в ISR обробника</text>
<rect x="575.0" y="241.0" width="225.0" height="64.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.0"/>
<text x="583.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">13. Відновлення тактування</text>
<text x="583.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Старт HSE/MSI, очікування PLL Lock</text>
<rect x="575.0" y="313.0" width="225.0" height="64.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.0"/>
<text x="583.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">14. Відновлення GPIO</text>
<text x="583.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Повернення режимів AF/Push-Pull</text>
<rect x="575.0" y="385.0" width="225.0" height="64.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.0"/>
<text x="583.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">15. Запуск диспетчера</text>
<text x="583.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Обробка черги подій у main loop</text>
<line x1="275.0" y1="260.0" x2="295.0" y2="260.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="545.0" y1="260.0" x2="565.0" y2="260.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>