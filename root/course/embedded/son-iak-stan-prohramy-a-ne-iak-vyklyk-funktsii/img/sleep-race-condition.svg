<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="800.0" height="420.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стан гонитви перед сном (Sleep Race Condition) та атомний захист</text>
<rect x="25.0" y="60.0" width="370.0" height="360.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпечно: WFI з увімкненими перериваннями</text>
<rect x="40.0" y="110.0" width="340.0" height="62.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="50.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. if (event_queue_is_empty())</text>
<text x="50.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Черга порожня, вирішено заснути</text>
<rect x="40.0" y="184.0" width="340.0" height="62.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="50.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">⚡ ПЕРЕРИВАННЯ ISR!</text>
<text x="50.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Датчик дав сигнал: подія додана в чергу</text>
<rect x="40.0" y="258.0" width="340.0" height="62.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="50.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. __WFI();</text>
<text x="50.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Ядро засинає! Подія проігнорована</text>
<rect x="40.0" y="332.0" width="340.0" height="62.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="50.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">⚠ НАСЛІДОК: Зависання</text>
<text x="50.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Система спить до наступного таймера</text>
<rect x="425.0" y="60.0" width="370.0" height="360.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="610.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечно: Cortex-M WFI при PRIMASK = 1</text>
<rect x="440.0" y="110.0" width="340.0" height="62.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="450.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">1. __disable_irq();</text>
<text x="450.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">PRIMASK = 1 (обробники не перебивають)</text>
<rect x="440.0" y="184.0" width="340.0" height="62.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="450.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">2. if (event_queue_is_empty())</text>
<text x="450.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Атомарна перевірка черги</text>
<rect x="440.0" y="258.0" width="340.0" height="62.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="450.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">3. __WFI();</text>
<text x="450.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Очікування: якщо прапорець виставлено — вихід!</text>
<rect x="440.0" y="332.0" width="340.0" height="62.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="450.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">4. __enable_irq();</text>
<text x="450.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Миттєве виконання ISR без втрати подій</text>
</svg>