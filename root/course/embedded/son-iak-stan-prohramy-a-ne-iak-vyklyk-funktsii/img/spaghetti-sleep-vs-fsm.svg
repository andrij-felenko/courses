<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="460.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сон як локальний виклик функції проти сну як системного автомата</text>
<rect x="25.0" y="55.0" width="380.0" height="405.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="215.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка: delay / sleep у бізнес-функціях</text>
<text x="215.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">«Заснути прямо зараз звідси»</text>
<rect x="40.0" y="110.0" width="350.0" height="72.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="50.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">read_sensor() → delay_ms(100)</text>
<text x="50.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">✖ Не узгоджено з іншими вузлами</text>
<text x="50.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">⚠ Блокує потік, ядро марно крутить цикли (15 мА)</text>
<rect x="40.0" y="192.0" width="350.0" height="72.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="50.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">send_packet() → enter_sleep()</text>
<text x="50.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">✖ Не узгоджено з іншими вузлами</text>
<text x="50.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">⚠ DMA ще передає по SPI! Шина обривається</text>
<rect x="40.0" y="274.0" width="350.0" height="72.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="50.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">flash_write() → WFI()</text>
<text x="50.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">✖ Не узгоджено з іншими вузлами</text>
<text x="50.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">⚠ Flash не записана, дані пошкоджено</text>
<rect x="40.0" y="356.0" width="350.0" height="72.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="50.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">GPIO Pins → Плаваючий стан</text>
<text x="50.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">✖ Не узгоджено з іншими вузлами</text>
<text x="50.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">⚠ Витоки струму 1-3 мА через КМОН-буфери</text>
<rect x="435.0" y="55.0" width="380.0" height="405.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="625.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Архітектура: Сон як глобальний стан системи</text>
<text x="625.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">«Сон — це стан спокою, коли всі узгодили»</text>
<rect x="450.0" y="110.0" width="350.0" height="72.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="460.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Модулі програми → Power Locks (QoS)</text>
<text x="460.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">✔ Централізоване узгодження периферії</text>
<text x="460.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">✓ Драйвери тримають блокування лише під час активності</text>
<rect x="450.0" y="192.0" width="350.0" height="72.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="460.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Головний цикл → Арбітраж глибини</text>
<text x="460.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">✔ Централізоване узгодження периферії</text>
<text x="460.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">✓ Power Manager обирає найглибший дозволений режим</text>
<rect x="450.0" y="274.0" width="350.0" height="72.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="460.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Підготовка сну → Pre-sleep Callbacks</text>
<text x="460.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">✔ Централізоване узгодження периферії</text>
<text x="460.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">✓ DMA flush, паркування шин, GPIO в Analog High-Z</text>
<rect x="450.0" y="356.0" width="350.0" height="72.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="460.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Ядро зупинено → Атомний вхід WFI</text>
<text x="460.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">✔ Централізоване узгодження периферії</text>
<text x="460.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">✓ Мікроспоживання 2 мкА, безпечне миттєве пробудження</text>
