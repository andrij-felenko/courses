<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна лінія, три транспорти — код той самий</text>
<rect x="30.0" y="64.0" width="180.0" height="46.0" rx="8" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.7"/>
<text x="120.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">серійний порт</text>
<text x="120.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">COM5 / ttyUSB0</text>
<rect x="30.0" y="128.0" width="180.0" height="46.0" rx="8" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.7"/>
<text x="120.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">UDP</text>
<text x="120.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">udpin:...:14550</text>
<rect x="30.0" y="192.0" width="180.0" height="46.0" rx="8" fill="#fbfbfb" stroke="#b08900" stroke-width="1.7"/>
<text x="120.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700">TCP</text>
<text x="120.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">tcp:...:5760</text>
<rect x="300.0" y="116.0" width="160.0" height="60.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.9"/>
<text x="380.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">рядок</text>
<text x="380.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">з'єднання</text>
<line x1="214.0" y1="87.0" x2="296.0" y2="146.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="214.0" y1="151.0" x2="296.0" y2="146.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="214.0" y1="215.0" x2="296.0" y2="146.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="512.0" y="96.0" width="218.0" height="100.0" rx="8" fill="#1b1f24" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="526.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9fb0c0" text-anchor="start">той самий код:</text>
<text x="526.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#cfe8cf" text-anchor="start">• дочекатися heartbeat</text>
<text x="526.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#cfe8cf" text-anchor="start">• читати потік</text>
<text x="526.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#cfe8cf" text-anchor="start">• слати команди</text>
<line x1="464.0" y1="146.0" x2="508.0" y2="146.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">перемкнути симулятор на реальний модем — це змінити один рядок</text>
</svg>