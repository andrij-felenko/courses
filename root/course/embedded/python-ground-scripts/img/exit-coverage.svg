<circle cx="86.0" cy="182.0" r="13.0" fill="#ffffff" stroke="#b08900" stroke-width="2.0"/>
<text x="86.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b08900" text-anchor="middle" font-weight="700">!</text>
