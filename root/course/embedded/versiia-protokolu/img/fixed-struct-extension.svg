<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція фіксованої структури: розширення в хвіст і відсікання</text>
<text x="440.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">збереження позицій полів v1.0 та ініціалізація нових полів значеннями за замовчуванням</text>
<text x="75.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Пакет v1.0</text>
<text x="75.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">(8 байтів)</text>
<rect x="90.0" y="90.0" width="100.0" height="50.0" rx="4" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Header [2B]</text>
<text x="140.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Type=1, Len=8</text>
<rect x="195.0" y="90.0" width="140.0" height="50.0" rx="4" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="265.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">voltage_mv [2B]</text>
<text x="265.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Offset: 2..3</text>
<rect x="340.0" y="90.0" width="180.0" height="50.0" rx="4" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="430.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">current_ma [4B]</text>
<text x="430.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Offset: 4..7</text>
<text x="75.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Пакет v1.1</text>
<text x="75.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">(14 байтів)</text>
<rect x="90.0" y="190.0" width="100.0" height="50.0" rx="4" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Header [2B]</text>
<text x="140.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Type=1, Len=14</text>
<rect x="195.0" y="190.0" width="140.0" height="50.0" rx="4" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="265.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">voltage_mv [2B]</text>
<text x="265.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Offset: 2..3 (Стале)</text>
<rect x="340.0" y="190.0" width="180.0" height="50.0" rx="4" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="430.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">current_ma [4B]</text>
<text x="430.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Offset: 4..7 (Стале)</text>
<rect x="525.0" y="190.0" width="140.0" height="50.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.8"/>
<text x="595.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">+ temp_c [2B]</text>
<text x="595.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Offset: 8..9 (Нове)</text>
<rect x="670.0" y="190.0" width="160.0" height="50.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.8"/>
<text x="750.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">+ flags [4B]</text>
<text x="750.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Offset: 10..13 (Нове)</text>
<line x1="435.0" y1="145.0" x2="435.0" y2="185.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="445.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">базові зміщення не порушено</text>
<rect x="80.0" y="275.0" width="750.0" height="105.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="100.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="start" font-weight="700">Алгоритм безпечного розбору змінної довжини у фіксованих структурах:</text>
<text x="100.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Старий парсер читає v1.1: бере перші 8 байтів (розмір struct v1.0), а хвіст (байти 8..13) відкидає.</text>
<text x="100.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Новий парсер читає v1.0: бачить Len=8 &lt; 14, копіює 8 байтів, а temp_c та flags ініціалізує дефолтами.</text>
<text x="100.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">3. ЗАБОРОНЕНО змінювати зміщення або типи полів Offset 2..7 — це миттєво ламає старих клієнтів!</text>
<text x="440.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Правило: поля додаються виключно в кінець структури; парсер перевіряє фактичну довжину кадру.</text>
</svg>