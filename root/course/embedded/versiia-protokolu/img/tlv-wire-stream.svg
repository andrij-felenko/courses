<text x="447.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0xAA 0xBB 0xCC 0xDD 0xEE 0xFF</text>
<line x1="547.0" y1="105.0" x2="547.0" y2="145.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
