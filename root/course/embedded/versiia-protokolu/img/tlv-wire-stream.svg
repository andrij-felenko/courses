<text x="700.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">94 %</text>
<line x1="306.0" y1="85.0" x2="568.0" y2="85.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="437.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Стрибок: ptr += sizeof(Tag) + sizeof(Len) + Len (пропуск 8 байтів)</text>
<text x="140.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">✔ 0x01: Розпізнано -&gt; Temp=23.48°C</text>
<text x="410.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">⚠ 0x85: Невідомий тег -&gt; Пропущено без збою</text>
<text x="725.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">✔ 0x02: Розпізнано -&gt; Batt=94%</text>
<rect x="45.0" y="220.0" width="790.0" height="150.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="65.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Переваги та компроміси TLV у вбудованих системах:</text>
<text x="65.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Абсолютна пряма сумісність: приймач не потребує знання про майбутні сенсори; Len задає зміщення.</text>
<text x="65.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Відсутність динамічної пам'яті: цикл розбору ітерується вхідним буфером без жодного malloc().</text>
<text x="65.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">3. Накладні витрати: кожен елемент вимагає 2 додаткові байти (Tag + Len). Для 1B даних це +200% оверхеду.</text>
<text x="65.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4. Вкладеність (Nested TLV): значенням тегу може бути інший потік TLV-записів (для складних об'єктів).</text>
<text x="65.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">5. Валідація меж: перед переходом парсер перевіряє offset + tag_len &lt;= buffer_size для захисту від атаки.</text>
</svg>