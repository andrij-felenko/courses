<rect x="380.0" y="75.0" width="440.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="395.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Рівень &gt; W_high: Скидання (Drop Policies)</text>
<text x="395.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Drop Oldest: витіснення застарілої телеметрії</text>
<text x="395.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Лічильник drops_total++ для моніторингу черги</text>
<rect x="380.0" y="175.0" width="440.0" height="95.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
<text x="395.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d6608" text-anchor="start" font-weight="700">Рівень між W_low та W_high: Зворотний тиск (Backpressure)</text>
<text x="395.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Приймач знімає EPOLLIN з дескрипторів сокетів</text>
<text x="395.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• TCP Window звужується до 0 -&gt; затримка на шлюзі</text>
<text x="395.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Локальне буферизування на периферійному шлюзі</text>
<rect x="380.0" y="290.0" width="440.0" height="85.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="395.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Рівень &lt; W_low: Штатна безперебійна робота</text>
<text x="395.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Повне відновлення обробки мережевих подій</text>
<text x="395.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Нульова затримка доставки телеметрії (P99 &lt; 15 мс)</text>
