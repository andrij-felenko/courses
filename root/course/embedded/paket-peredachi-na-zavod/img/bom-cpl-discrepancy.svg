<text x="70.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Поворот 0° у CAD проти стрічки живильника: діод запаяно катодом навпаки (180° mismatch).</text>
<text x="70.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Відсутність синхронізації DNP: PnP автомат шукає котушку для R12 або змонтує непотрібний резистор.</text>
