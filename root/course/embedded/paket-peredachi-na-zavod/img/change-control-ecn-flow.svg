<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл інженерної зміни: від дефекту до зміни на конвеєрі</text>
<rect x="40.0" y="74.0" width="132.0" height="110.0" rx="6" fill="#fff8e6" stroke="#b07a35" stroke-width="1.6"/>
<text x="106.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b07a35" text-anchor="middle" font-weight="700">1. Ініціація (ECR)</text>
<line x1="48.0" y1="106.0" x2="164.0" y2="106.0" stroke="#b07a35" stroke-width="0.8"/>
<text x="106.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="106.0" dy="0.0">Виявлено дефект,</tspan><tspan x="106.0" dy="12.3">дефіцит чіпа або</tspan><tspan x="106.0" dy="12.3">запит на поліпшення</tspan></text>
<line x1="174.0" y1="129.0" x2="188.0" y2="129.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="192.0" y="74.0" width="132.0" height="110.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="258.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Оцінка впливу</text>
<line x1="200.0" y1="106.0" x2="316.0" y2="106.0" stroke="#1a1a1a" stroke-width="0.8"/>
<text x="258.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">Аналіз залишків складу,</tspan><tspan x="258.0" dy="12.3">сумісності прошивки,</tspan><tspan x="258.0" dy="12.3">собівартості та термінів</tspan></text>
<line x1="326.0" y1="129.0" x2="340.0" y2="129.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344.0" y="74.0" width="132.0" height="110.0" rx="6" fill="#eaf4ec" stroke="#27ae60" stroke-width="1.6"/>
<text x="410.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Наказ ECO</text>
<line x1="352.0" y1="106.0" x2="468.0" y2="106.0" stroke="#27ae60" stroke-width="0.8"/>
<text x="410.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Затвердження нової</tspan><tspan x="410.0" dy="12.3">ревізії: PCB Rev B</tspan><tspan x="410.0" dy="12.3">або PCBA Rev 1.2</tspan></text>
<line x1="478.0" y1="129.0" x2="492.0" y2="129.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="496.0" y="74.0" width="132.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="562.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">4. Випуск пакета</text>
<line x1="504.0" y1="106.0" x2="620.0" y2="106.0" stroke="#2457d6" stroke-width="0.8"/>
<text x="562.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="562.0" dy="0.0">Повна перегенерація</tspan><tspan x="562.0" dy="12.3">Gerber, BOM, CPL,</tspan><tspan x="562.0" dy="12.3">SHA-256 та архіву</tspan></text>
<line x1="630.0" y1="129.0" x2="644.0" y2="129.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="648.0" y="74.0" width="132.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="714.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">5. Впровадження</text>
<line x1="656.0" y1="106.0" x2="772.0" y2="106.0" stroke="#c0392b" stroke-width="0.8"/>
<text x="714.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="714.0" dy="0.0">Акт зрізу партії (Cutoff),</tspan><tspan x="714.0" dy="12.3">утилізація/доробка,</tspan><tspan x="714.0" dy="12.3">старт нової серії</tspan></text>
<rect x="40.0" y="210.0" width="760.0" height="110.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розділення ревізій: Гола плата (PCB) проти Зібраного вузла (PCBA)</text>
<rect x="60.0" y="246.0" width="340.0" height="60.0" rx="6" fill="#eaf4ec" stroke="#27ae60" stroke-width="1.2"/>
<text x="230.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">PCB Revision (напр. Rev A → Rev B)</text>
<text x="223.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зміна міді, шарів, перехідних отворів чи форми. Вимагає нового трафарету й оснастки.</text>
<rect x="440.0" y="246.0" width="340.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="610.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">PCBA Revision (напр. Rev 1.0 → Rev 1.1)</text>
<text x="610.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зміна номіналу деталей чи MPN на тій самій платі. Трафарет і мідь лишаються незмінними.</text>
<rect x="40.0" y="336.0" width="760.0" height="32.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="355.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Правило ECO: релізний пакет перегенеровується цілком під новим ревізійним номером; заборонено виправляти окремі файли вручну.</tspan></text>
</svg>