<text x="420.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Єдиний самодостатній архів: версія зафіксована, контрольні суми SHA-256 пораховані</text>
