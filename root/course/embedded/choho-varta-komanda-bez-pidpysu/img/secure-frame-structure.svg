<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 852.5 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="852.5" height="350" fill="#ffffff"/>
