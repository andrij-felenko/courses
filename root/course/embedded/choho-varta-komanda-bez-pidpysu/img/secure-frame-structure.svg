<text x="75.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0xA55A</text>
<rect x="110.0" y="75.0" width="80.0" height="65.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/>
<text x="150.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Ver / ID</text>
<text x="150.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 Б</text>
<text x="150.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Type/Cmd</text>
<rect x="190.0" y="75.0" width="120.0" height="65.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="250.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">SeqNum</text>
<text x="250.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">8 Б</text>
<text x="250.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Лічильник</text>
<rect x="310.0" y="75.0" width="100.0" height="65.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="360.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Timestamp</text>
<text x="360.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4 Б</text>
<text x="360.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">UTC час</text>
<rect x="410.0" y="75.0" width="80.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="450.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">Len</text>
<text x="450.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 Б</text>
<text x="450.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Довжина N</text>
<rect x="490.0" y="75.0" width="200.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="590.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">Payload</text>
<text x="590.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">N Б</text>
<text x="590.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Дані команди (кут, швидкість, реле)</text>
<rect x="690.0" y="75.0" width="110.0" height="65.0" rx="6" fill="#fff7f5" stroke="#c0392b" stroke-width="1.6"/>
<text x="745.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Auth Tag</text>
<text x="745.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">16 / 64 Б</text>
<text x="745.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">HMAC / Ed25519</text>
<line x1="40.0" y1="155.0" x2="690.0" y2="155.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="40.0" y1="150.0" x2="40.0" y2="160.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="690.0" y1="150.0" x2="690.0" y2="160.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="365.0" y1="155.0" x2="365.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="365.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Дані, що покриваються криптографічним кодом (AAD / Signed Message)</text>
<line x1="745.0" y1="180.0" x2="745.0" y2="145.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="745.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Тег обчислюється над цим діапазоном</text>
<rect x="40.0" y="220.0" width="760.0" height="95.0" rx="6" fill="#fcfcfd" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="249.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Ключові властивості полів:</tspan><tspan x="420.0" dy="14.3">• SeqNum (64 біти) унеможливлює атаку повтору (переповниться лише через 584 роки при 1 млрд пакетів/с).</tspan><tspan x="420.0" dy="14.3">• Timestamp (32 біти) обмежує часове вікно валідності кадру при відомому часі RTC/GNSS.</tspan><tspan x="420.0" dy="14.3">• Auth Tag захищає весь заголовок і корисне навантаження: зміна бодай одного біта робить тег невалідним.</tspan></text>
</svg>