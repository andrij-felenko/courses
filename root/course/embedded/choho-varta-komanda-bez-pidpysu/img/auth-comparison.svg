<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння: Симетричний MAC vs Асиметричний цифровий підпис</text>
<rect x="40.0" y="65.0" width="360.0" height="300.0" rx="6" fill="#fcfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Симетричний MAC (HMAC / AES-GMAC / Poly1305)</text>
<text x="56.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Секрет:</text>
<rect x="56.0" y="124.0" width="328.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="0.8"/><text x="220.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Спільний ключ K у пульта і в мікроконтролера</tspan></text>
<text x="56.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Швидкість:</text>
<rect x="56.0" y="170.0" width="328.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="0.8"/><text x="220.0" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">10 – 80 мкс на Cortex-M4 (дуже швидко)</tspan></text>
<text x="56.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Розмір тегу:</text>
<rect x="56.0" y="216.0" width="328.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="0.8"/><text x="220.0" y="231.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">8 – 16 байтів (HMAC) або 16 байтів (GMAC/Poly)</tspan></text>
<text x="56.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Вразливість:</text>
<rect x="56.0" y="262.0" width="328.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="0.8"/><text x="220.0" y="277.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Злам одного чипа розкриває ключ для всіх!</tspan></text>
<text x="56.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Призначення:</text>
<rect x="56.0" y="308.0" width="328.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="0.8"/><text x="220.0" y="323.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Високочастотне керування (мотори, телеметрія)</tspan></text>
<rect x="440.0" y="65.0" width="360.0" height="300.0" rx="6" fill="#fcfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="620.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Асиметричний підпис (Ed25519 / ECDSA)</text>
<text x="456.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Секрет:</text>
<rect x="456.0" y="124.0" width="328.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="0.8"/><text x="620.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Приватний SK — на сервері, відкритий PK — у чипі</tspan></text>
<text x="456.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Швидкість:</text>
<rect x="456.0" y="170.0" width="328.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="0.8"/><text x="620.0" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">3 – 40 мс на Cortex-M4 (у 500–1000 разів довше)</tspan></text>
<text x="456.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Розмір підпису:</text>
<rect x="456.0" y="216.0" width="328.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="0.8"/><text x="620.0" y="231.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">64 байти (Ed25519) або 64 байти (ECDSA P-256)</tspan></text>
<text x="456.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Безпека:</text>
<rect x="456.0" y="262.0" width="328.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="0.8"/><text x="620.0" y="277.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Вичитка Flash дає лише PK — підробити команду годі!</tspan></text>
<text x="456.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Призначення:</text>
<rect x="456.0" y="308.0" width="328.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="0.8"/><text x="620.0" y="323.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Оновлення прошивки (OTA), конфігурація, зміна сесії</tspan></text>
</svg>