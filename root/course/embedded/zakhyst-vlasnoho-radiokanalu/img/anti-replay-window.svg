<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ковзне вікно Anti-Replay: обробка затримок і блокування повторів</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ефір переставляє пакети місцями; вікно з бітовою маскою розрізняє запізнілі пакети та атаки повтору</text>
