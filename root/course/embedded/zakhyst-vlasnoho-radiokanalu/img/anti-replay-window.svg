<text x="155.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Якщо seq ≤ last_seq - 64 → скидання без криптографії.</text>
<text x="155.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Якщо у вікні й біт = 1 → скидання дубліката.</text>
<rect x="265.0" y="299.0" width="200.0" height="120.0" rx="4" fill="#fafbfc" stroke="#b9770e" stroke-width="1.4"/>
<text x="365.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">Крок 2. Перевірка Тегу</text>
<text x="365.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">AEAD перевіряє Auth Tag над (AAD + Ciphertext).</text>
<text x="365.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Усі розрахунки в constant-time!</text>
<rect x="475.0" y="299.0" width="200.0" height="120.0" rx="4" fill="#fafbfc" stroke="#27ae60" stroke-width="1.4"/>
<text x="575.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Крок 3. Фіксація стану</text>
<text x="575.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">ЛИШЕ після валідного тегу: оновлюємо bitmap</text>
<text x="575.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">та last_seq. Невалідному кадру стан не міняти!</text>
<rect x="685.0" y="299.0" width="200.0" height="120.0" rx="4" fill="#fafbfc" stroke="#27ae60" stroke-width="1.4"/>
<text x="785.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Крок 4. Розшифрування</text>
<text x="785.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Корисне навантаження передається обробнику</text>
<text x="785.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">команд застосунку. Пристрій у безпеці.</text>
