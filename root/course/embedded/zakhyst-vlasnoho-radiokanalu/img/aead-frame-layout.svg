<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура захищеного радіокадру: AAD, шифротекст і тег</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">заголовок передається відкритим для маршрутизації, але криптографічно захищений тегом разом із тілом</text>
<rect x="40.0" y="90.0" width="110.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="95.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Preamble + Sync</text>
<text x="95.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Фізичний рівень</text>
<rect x="155.0" y="90.0" width="315.0" height="65.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="312.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Відкритий заголовок (AAD — Associated Data)</text>
<text x="312.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Proto (1B) | Flags (1B) | Src (2B) | Dst (2B) | Seq/Counter (4B)</text>
<rect x="475.0" y="90.0" width="260.0" height="65.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="605.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Зашифровані дані (Ciphertext)</text>
<text x="605.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Payload = Plaintext ⊕ Keystream (N байтів)</text>
<rect x="740.0" y="90.0" width="160.0" height="65.0" rx="4" fill="#fdf6e7" stroke="#b9770e" stroke-width="2.0"/>
<text x="820.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">Тег автентичності</text>
<text x="820.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Tag (16B Poly1305 / CCM)</text>
<line x1="155.0" y1="170.0" x2="470.0" y2="170.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="312.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Відкритий текст (видно в ефірі для швидкої фільтрації)</text>
<line x1="475.0" y1="170.0" x2="735.0" y2="170.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="605.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Зашифровано (конфіденційність)</text>
<line x1="155.0" y1="210.0" x2="735.0" y2="210.0" stroke="#b9770e" stroke-width="2.2"/>
<line x1="155.0" y1="205.0" x2="155.0" y2="215.0" stroke="#b9770e" stroke-width="2.2"/>
<line x1="735.0" y1="205.0" x2="735.0" y2="215.0" stroke="#b9770e" stroke-width="2.2"/>
<line x1="445.0" y1="210.0" x2="740.0" y2="165.0" stroke="#b9770e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="445.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">Вхід AEAD-автентифікації: MAC обчислюється над (AAD + Ciphertext)</text>
<rect x="40.0" y="260.0" width="410.0" height="195.0" rx="8" fill="#fafbfc" stroke="#2457d6" stroke-width="1.5"/>
<text x="245.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Конструкція 12-байтного Nonce (Одноразового числа)</text>
<text x="60.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Src ID (2B):</text>
<text x="160.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">унікальний ідентифікатор передавача</text>
<text x="60.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Dst ID (2B):</text>
<text x="160.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">ідентифікатор цільового вузла</text>
<text x="60.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Epoch (4B):</text>
<text x="160.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">номер сесії після перезавантаження МК</text>
<text x="60.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Counter (4B):</text>
<text x="160.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">монотонний лічильник пакета в сесії</text>
<text x="245.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Ключове правило: пара (Ключ, Nonce) НІКОЛИ не повторюється!</text>
<rect x="480.0" y="260.0" width="420.0" height="195.0" rx="8" fill="#fafbfc" stroke="#27ae60" stroke-width="1.5"/>
<text x="690.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Чому AAD передається відкритим, а не шифрується</text>
<text x="500.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Апаратна / швидка фільтрація:</text>
<text x="516.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Приймач відкидає чужі Dst ID до важкого AEAD.</text>
<text x="500.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Захист від відмови в обслуговуванні (DoS):</text>
<text x="516.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Старий Sequence Counter відсікається без криптографії.</text>
<text x="500.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Неможливість підміни:</text>
<text x="516.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">Зміна хоч одного біта AAD ламає тег → пакет дропається.</text>
</svg>