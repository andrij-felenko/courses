<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель загроз відкритого радіоефіру: три вектори атаки</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">радіохвилі доступні кожному в зоні досяжності; дріт не захищає, контрольна сума (CRC) не рятує</text>
<rect x="40.0" y="90.0" width="190.0" height="130.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="135.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол A (Передавач)</text>
<text x="135.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Пульт / Сенсор</text>
<line x1="70.0" y1="160.0" x2="200.0" y2="160.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="135.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">tx_cmd = MOTOR_ON</text>
<text x="135.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">антена випромінює в ефір</text>
<rect x="710.0" y="90.0" width="190.0" height="130.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="805.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол B (Приймач)</text>
<text x="805.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Дрон / Контролер</text>
<line x1="740.0" y1="160.0" x2="870.0" y2="160.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="805.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">rx_exec(cmd)</text>
<text x="805.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">виконує прийняту дію</text>
<line x1="230.0" y1="155.0" x2="710.0" y2="155.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="6,4"/>
<text x="470.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">відкритий радіоканал (2.4 ГГц / 868 МГц)</text>
<rect x="340.0" y="205.0" width="260.0" height="80.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="470.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Зловмисник (SDR / трансивер)</text>
<text x="470.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">пасивний слухач або активний інжектор</text>
<text x="470.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">перехоплює 100% пакетів</text>
<rect x="40.0" y="310.0" width="266.0" height="130.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="173.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Прослуховування (Eavesdropping)</text>
<text x="52.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="64.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Пасивне перехоплення відкритих даних</text>
<text x="52.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="64.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Витік координат, телеметрії, ключів</text>
<text x="52.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="64.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Ліки: автентифіковане шифрування</text>
<rect x="337.0" y="310.0" width="266.0" height="130.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="470.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Підміна та інжекція (Tampering)</text>
<text x="349.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="361.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Модифікація бітів у польоті (bit-flipping)</text>
<text x="349.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="361.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Фальшиві команди (CRC перераховується!)</text>
<text x="349.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="361.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Ліки: автентифікаційний тег (MAC)</text>
<rect x="634.0" y="310.0" width="266.0" height="130.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="767.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. Повтор (Replay Attack)</text>
<text x="646.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="658.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Запис валідного зашифрованого кадру</text>
<text x="646.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="658.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Повторна відправка через N хвилин</text>
<text x="646.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">•</text>
<text x="658.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Ліки: монотонний Nonce + Anti-Replay</text>
</svg>