<rect x="181.9" y="336.8" width="576.1" height="46.5" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="356.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Добуток станів розпадається назад на суму (стан — у стеку кожної задачі),</tspan><tspan x="470.0" dy="15.0">блокування однієї не морозить інших, найгіршій затримці можна поставити стелю.</tspan></text>
