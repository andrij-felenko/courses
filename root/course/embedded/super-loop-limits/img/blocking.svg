<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блокування: одна пауза заморожує весь цикл</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">будь-який виклик, що чекає (delay, повільне читання, мережа), спиняє все інше</text>
<text x="70.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">час процесора →</text>
<line x1="70.0" y1="150.0" x2="880.0" y2="150.0" stroke="#d0d5dd" stroke-width="1.2"/>
<rect x="70.0" y="150.0" width="90.0" height="34.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="115.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">робота</text>
<rect x="165.0" y="150.0" width="520.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="425.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">delay(1000) / повільне читання — чекаємо</text>
<rect x="690.0" y="150.0" width="90.0" height="34.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="735.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">робота</text>
<text x="425.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ціла секунда — а пристрій «мертвий»</text>
<text x="210.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">✗ LED не блимає</text>
<text x="210.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">✗ кнопку не помічено</text>
<text x="210.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">✗ екран не оновлюється</text>
<text x="560.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="560.0" dy="0.0">процесор простоює,</tspan><tspan x="560.0" dy="13.7">та зайнятий очікуванням —</tspan><tspan x="560.0" dy="13.7">користі нуль</tspan></text>
<rect x="158.7" y="314.0" width="622.6" height="32.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="470.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">У super-loop усе йде по черзі: поки один крок чекає, решта просто не виконується.</tspan></text>
</svg>