<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три несумісні світи 13.56 МГц сходяться під дахом NFC</text>
<text x="490.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кожна родина зі своїм роком і батьком → спільний стандарт NFCIP-1 (2004) → типи міток NFC Forum</text>
<rect x="30.0" y="66.0" width="260.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="160.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">ISO 14443 Type A</tspan><tspan x="160.0" dy="13.0">Philips / MIFARE · 1994 (Mikron, Ґраткорн)</tspan></text>
<rect x="30.0" y="156.0" width="260.0" height="68.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="160.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">ISO 14443 Type B</tspan><tspan x="160.0" dy="13.0">Innovatron + транспорт · «розумна» картка</tspan></text>
<rect x="30.0" y="246.0" width="260.0" height="68.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.2"/><text x="160.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Sony FeliCa</tspan><tspan x="160.0" dy="14.3">Sony · 1988 → Octopus, Гонконг · 1997</tspan></text>
<rect x="30.0" y="350.0" width="260.0" height="40.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.4"/><text x="160.0" y="373.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">FeliCa → «Type C»?  ВІДХИЛЕНО (WG8)</tspan></text>
<text x="160.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">→ окремо: JIS X 6319-4</text>
<rect x="385.0" y="150.0" width="210.0" height="120.0" rx="12" fill="#fff8e6" stroke="#b9770e" stroke-width="3.0"/>
<text x="490.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#b9770e" text-anchor="middle" font-weight="700">NFCIP-1</text>
<text x="490.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ISO/IEC 18092</text>
<text x="490.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">= ECMA-340</text>
<text x="490.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ISO 08.12.2003</text>
<text x="490.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ECMA грудень 2004</text>
<line x1="290.0" y1="100.0" x2="385.0" y2="210.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="290.0" y1="190.0" x2="385.0" y2="210.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="290.0" y1="280.0" x2="385.0" y2="210.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="380.0" y="286.0" width="220.0" height="48.0" rx="6" fill="#fbfdfb" stroke="#6b7280" stroke-width="1.2"/><text x="490.0" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">успадкував нижні шари:</tspan><tspan x="490.0" dy="11.1">106 кбіт/с = Type A · 212/424 = FeliCa</tspan></text>
<rect x="630.0" y="58.0" width="300.0" height="56.0" rx="6" fill="#fff8e6" stroke="#b9770e" stroke-width="1.8"/><text x="780.0" y="82.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">NFC Forum · 18.03.2004</tspan><tspan x="780.0" dy="15.6">NXP (Philips) + Sony + Nokia</tspan></text>
<line x1="595.0" y1="158.0" x2="630.0" y2="100.0" stroke="#b9770e" stroke-width="1.6" stroke-dasharray="4,4"/>
<rect x="630.0" y="129.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="780.0" y="151.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Type 1 / Type 2</tspan><tspan x="780.0" dy="15.0">Topaz · MIFARE Ultralight / NTAG (14443A)</tspan></text>
<line x1="595.0" y1="210.0" x2="630.0" y2="155.0" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="630.0" y="194.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="780.0" y="216.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Type 4</tspan><tspan x="780.0" dy="15.0">MIFARE DESFire (14443 A/B)</tspan></text>
<line x1="595.0" y1="210.0" x2="630.0" y2="220.0" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="630.0" y="259.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="780.0" y="281.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Type 3</tspan><tspan x="780.0" dy="15.0">Sony FeliCa (JIS X 6319-4)</tspan></text>
<line x1="595.0" y1="210.0" x2="630.0" y2="285.0" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="630.0" y="324.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="780.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Type 5</tspan><tspan x="780.0" dy="15.0">ISO 15693 (сусід, «дальше поле»)</tspan></text>
<line x1="595.0" y1="210.0" x2="630.0" y2="350.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30.0" y="470.0" width="920.0" height="62.0" rx="8" fill="#fbfdfb" stroke="#6b7280" stroke-width="1.2"/>
<text x="490.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три народи не злилися — над ними став перекладач: NFC-читач упізнає тип і говорить кожному його мовою</text>
<text x="490.0" y="514.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">колись відхилена FeliCa повертається рівноправним Type 3; 6 базових патентів — Ф. Амтманн (австрієць) і Ф. Можар (француз), 2015</text>
</svg>