<rect x="105.0" y="107.0" width="30.0" height="16.0" rx="6" fill="#cbd5e1" stroke="#333333" stroke-width="1.2"/>
<line x1="135.0" y1="115.0" x2="155.0" y2="115.0" stroke="#333333" stroke-width="1.5"/>
<line x1="155.0" y1="115.0" x2="155.0" y2="155.0" stroke="#333333" stroke-width="1.5"/>
<line x1="155.0" y1="155.0" x2="140.0" y2="155.0" stroke="#333333" stroke-width="1.5"/>
<text x="120.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">XTAL</text>
<line x1="85.0" y1="155.0" x2="85.0" y2="180.0" stroke="#333333" stroke-width="1.5"/>
<line x1="75.0" y1="180.0" x2="95.0" y2="180.0" stroke="#333333" stroke-width="1.5"/>
<line x1="75.0" y1="185.0" x2="95.0" y2="185.0" stroke="#333333" stroke-width="1.5"/>
<text x="85.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">C₁=12пФ</text>
<line x1="155.0" y1="155.0" x2="155.0" y2="180.0" stroke="#333333" stroke-width="1.5"/>
<line x1="145.0" y1="180.0" x2="165.0" y2="180.0" stroke="#333333" stroke-width="1.5"/>
<line x1="145.0" y1="185.0" x2="165.0" y2="185.0" stroke="#333333" stroke-width="1.5"/>
<text x="155.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">C₂=12пФ</text>
<line x1="155.0" y1="155.0" x2="240.0" y2="155.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,3"/>
<circle cx="240.0" cy="155.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<rect x="248.0" y="127.0" width="110.0" height="56.0" rx="4" fill="#fff1f2" stroke="#c0392b" stroke-width="1.4"/>
<text x="303.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Щуп 1X</text>
<text x="303.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">C_щупа ≈ 100 пФ!</text>
<text x="303.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">R_вх = 1 МОм</text>
<text x="220.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Ємність щупа (100 пФ) ≫ C₂ (12 пФ) → зрив коливань</text>
<rect x="440.0" y="60.0" width="360.0" height="225.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<rect x="440.0" y="60.0" width="360.0" height="32.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.6"/>
<text x="620.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечні методи контролю тактування</text>
<text x="454.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Дільник щупа 1:10 (10X):</text>
<text x="454.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">   Ємність щупа падає до 10–13 пФ (генерація зберігається).</text>
<text x="454.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Активний FET-пробник:</text>
<text x="454.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">   Паразитна ємність &lt; 0.8 пФ, опір &gt; 1 МОм на 100 МГц.</text>
<text x="454.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Вивід MCO (Microcontroller Clock Output):</text>
<text x="454.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">   Прошивка конфігурує буферизований цифровий пін для HSE.</text>
<rect x="40.0" y="310.0" width="760.0" height="78.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Діагностичне правило: якщо при торканні щупом 1x генерація на OSC_OUT зникає — це НЕ ознака мертвого кварцу.</tspan><tspan x="420.0" dy="14.3">Щуп вніс ємність, що перевищує розрахункову навантажувальну ємність контуру в 8–10 разів.</tspan><tspan x="420.0" dy="14.3">Для достовірної оцінки використовуйте тільки дільник 1:10 на виводі OSC_OUT або буферизований пін MCO.</tspan></text>
</svg>