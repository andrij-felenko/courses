<text x="198.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Спайка</text>
<rect x="35.0" y="240.0" width="230.0" height="145.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="150.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">• Неправильний кут Pin 1 =</tspan><tspan x="150.0" dy="13.7">  миттєва загибель чіпа при старті.</tspan><tspan x="150.0" dy="13.7">• Мости припою між виводами</tspan><tspan x="150.0" dy="13.7">  0.5 мм кроку в QFN / QFP.</tspan><tspan x="150.0" dy="13.7">• Tombstone («надгробок»):</tspan><tspan x="150.0" dy="13.7">  відрив SMD 0402 одним кінцем.</tspan></text>
<rect x="295.0" y="60.0" width="250.0" height="345.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="295.0" y="60.0" width="250.0" height="32.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.4"/>
<text x="420.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Полярність: пастка танталу</text>
<rect x="355.0" y="112.0" width="60.0" height="30.0" rx="2" fill="#d97706" stroke="#333333" stroke-width="1.2"/>
<rect x="355.0" y="112.0" width="14.0" height="30.0" rx="1" fill="#fef08a" stroke="#333333" stroke-width="1.0"/>
<text x="362.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#854d0e" text-anchor="middle" font-weight="700">+</text>
<text x="390.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Тантал</text>
<text x="378.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Смужка = АНОД (+)</text>
<circle cx="465.0" cy="127.0" r="16.0" fill="#94a3b8" stroke="#333333" stroke-width="1.2"/>
<rect x="449.0" y="111.0" width="10.0" height="32.0" rx="6" fill="#334155" stroke="none" stroke-width="1.5"/>
<text x="454.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">−</text>
<text x="465.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Смужка = КАТОД (−)</text>
<rect x="305.0" y="240.0" width="230.0" height="145.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="420.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">• Тантал: смуга на корпусі — це</tspan><tspan x="420.0" dy="13.7">  плюс (+). Переполюсовка танталу</tspan><tspan x="420.0" dy="13.7">  веде до пробою з полум'ям.</tspan><tspan x="420.0" dy="13.7">• Алюмінієвий електроліт:</tspan><tspan x="420.0" dy="13.7">  смуга на корпусі — це мінус (−).</tspan><tspan x="420.0" dy="13.7">• Діоди: смуга катода (K) має</tspan><tspan x="420.0" dy="13.7">  дивитися в бік вищого потенціалу.</tspan></text>
<rect x="565.0" y="60.0" width="250.0" height="345.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="565.0" y="60.0" width="250.0" height="32.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.4"/>
<text x="690.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Продзвонка рейок на GND</text>
<rect x="645.0" y="106.0" width="90.0" height="48.0" rx="5" fill="#fbbf24" stroke="#333333" stroke-width="1.5"/>
<rect x="654.0" y="112.0" width="72.0" height="20.0" rx="2" fill="#ecfccb" stroke="#333333" stroke-width="1.0"/>
<text x="690.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">0.482 V / &gt;10k</text>
<circle cx="690.0" cy="144.0" r="4.0" fill="#1e293b" stroke="#333333" stroke-width="1.0"/>
<rect x="575.0" y="166.0" width="230.0" height="220.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="232.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">• Опір &lt; 1–2 Ом = тверде КЗ</tspan><tspan x="690.0" dy="11.7">  (металевий місток, пробитий TVS).</tspan><tspan x="690.0" dy="11.7">• Зростаючий опір від 0 до сотен кОм =</tspan><tspan x="690.0" dy="11.7">  нормальний заряд ємностей MLCC.</tspan><tspan x="690.0" dy="11.7">• Низький опір ядер (1.0V) = 15–50 Ом</tspan><tspan x="690.0" dy="11.7">  для FPGA/MPU є нормою, але для</tspan><tspan x="690.0" dy="11.7">  MCU 3.3V це дефект кристала.</tspan><tspan x="690.0" dy="11.7">• Diode mode: падіння 0.3–0.6 В</tspan><tspan x="690.0" dy="11.7">  підтверджує цілісність ESD-діодів.</tspan></text>
</svg>