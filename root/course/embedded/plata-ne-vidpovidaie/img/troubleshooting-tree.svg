<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево пошуку несправностей під час першого ввімкнення</text>
<rect x="260.0" y="47.0" width="320.0" height="36.0" rx="6" fill="#1e293b" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Подача живлення через БЖ (CC = 100 мА)</text>
<line x1="420.0" y1="83.0" x2="140.0" y2="130.0" stroke="#333333" stroke-width="1.5"/>
<rect x="30.0" y="130.0" width="220.0" height="40.0" rx="5" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="140.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Струм б'є в ліміт (CC)</text>
<text x="140.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Напруга просіла до ~0.2–1.0 В</text>
<line x1="140.0" y1="170.0" x2="140.0" y2="210.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="25.0" y="210.0" width="230.0" height="110.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="140.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Тепловізор або тест спиртом</text>
<text x="40.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Шукати гарячий чіп / MLCC</text>
<text x="40.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Перевірити полярність танталу</text>
<text x="40.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Демонтувати LDO / супресор</text>
<text x="40.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Оглянути спайки ніжок QFN</text>
<line x1="420.0" y1="83.0" x2="420.0" y2="130.0" stroke="#333333" stroke-width="1.5"/>
<rect x="320.0" y="130.0" width="200.0" height="40.0" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="420.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Струм 0 мА (Обрив)</text>
<text x="420.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">Схема взагалі не бере струм</text>
<line x1="420.0" y1="170.0" x2="420.0" y2="210.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="315.0" y="210.0" width="210.0" height="110.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="420.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Перевірка вхідного кола</text>
<text x="330.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Самозвідний фюз (PTC / Fuse)</text>
<text x="330.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Захисний діод від переполюсовки</text>
<text x="330.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Кнопка / джампер живлення</text>
<text x="330.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Падіння на вході LDO / DC-DC</text>
<line x1="420.0" y1="83.0" x2="700.0" y2="130.0" stroke="#333333" stroke-width="1.5"/>
<rect x="590.0" y="130.0" width="220.0" height="40.0" rx="5" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
<text x="700.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Струм 15–40 мА (Норма)</text>
<text x="700.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Напруги 3.3V OK, але SWD німий</text>
<line x1="700.0" y1="170.0" x2="700.0" y2="210.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="585.0" y="210.0" width="230.0" height="240.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="700.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Покрокова діагностика MCU</text>
<text x="598.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">1. Лінія NRST: V &gt; 2.8 В?</text>
<text x="598.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="start">   Ні → кнопка замкнена / C_rst КЗ</text>
<text x="598.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">2. Ядро VCAP / VDD_CORE = 1.2V?</text>
<text x="598.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="start">   Ні → непропай VCAP / збій LDO</text>
<text x="598.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">3. BOOT0 притягнутий до GND?</text>
<text x="598.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="start">   Ні → чіп завис у системному ROM</text>
<text x="598.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">4. Спільний GND із ST-Link / J-Link?</text>
<text x="598.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="start">   Ні → відсутня спільна опора сигналів</text>
<text x="598.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">5. Знизити SWD clock до 100 кГц:</text>
<text x="598.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">   Режим 'Connect under Reset'</text>
<rect x="25.0" y="430.0" width="790.0" height="52.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="452.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Золоте правило діагностики: 95% випадків мовчання плати викликані відсутністю спільної землі з відлагоджувачем,</tspan><tspan x="420.0" dy="14.3">затиснутою лінією NRST, перевернутим танталовим конденсатором або плаваючим піном BOOT0.</tspan></text>
</svg>