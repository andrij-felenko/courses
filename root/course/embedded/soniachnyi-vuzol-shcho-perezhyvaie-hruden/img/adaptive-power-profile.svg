<text x="320.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="middle">(Survival)</text>
<text x="320.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="700">Сон: 6–12 год</text>
<text x="320.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="middle">Лише маяк (Heartbeat)</text>
