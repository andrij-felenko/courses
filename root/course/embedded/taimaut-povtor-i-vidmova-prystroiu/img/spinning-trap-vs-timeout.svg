<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 960 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="960" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="480.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння реакцій системи на апаратний збій периферії</text>
<rect x="30.0" y="55.0" width="420.0" height="400.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="240.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний цикл: while (!flag)</text>
<text x="240.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Небезпека мертвого зависання процесора</text>
<rect x="50.0" y="125.0" width="380.0" height="50.0" rx="6" fill="#ffffff" stroke="#e0b4b4" stroke-width="1.5"/><text x="240.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">1. Процесор ініціює зчитування I2C/SPI</tspan><tspan x="240.0" dy="14.3">Очікує прапорець готовності RXNE / BUSY=0</tspan></text>
<rect x="50.0" y="190.0" width="380.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">2. Збій: обрив дроту, зависання давача</tspan><tspan x="240.0" dy="14.3">Лінія SCL затиснута в 0 (Clock Stretching)</tspan></text>
<rect x="50.0" y="255.0" width="380.0" height="55.0" rx="6" fill="#ffffff" stroke="#e0b4b4" stroke-width="1.5"/><text x="240.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">3. Прапорець ніколи не виставиться в 1</tspan><tspan x="240.0" dy="14.3">while (!(I2C1-&gt;SR1 &amp; RXNE)) крутиться вічно,</tspan><tspan x="240.0" dy="14.3">стек не розкручується, інші задачі заблоковані</tspan></text>
<rect x="50.0" y="325.0" width="380.0" height="55.0" rx="6" fill="#fbe8e8" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="342.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">4. Катастрофічний наслідок:</tspan><tspan x="240.0" dy="14.3">Сторожовий таймер (WDT) скидає мікроконтролер</tspan><tspan x="240.0" dy="14.3">або система мертво зависає без оновлень</tspan></text>
<rect x="50.0" y="395.0" width="380.0" height="42.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="419.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Підсумок: Відмова одного давача кладе весь пристрій</tspan></text>
<rect x="490.0" y="55.0" width="420.0" height="400.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="700.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Захищений таймаут: DWT / SysTick</text>
<text x="700.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Гарантоване повернення керування за дедлайном</text>
<rect x="510.0" y="125.0" width="380.0" height="50.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/><text x="700.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">1. Фіксація стартового часу операції</tspan><tspan x="700.0" dy="14.3">t_start = get_time();  t_deadline = t_start + timeout;</tspan></text>
<rect x="510.0" y="190.0" width="380.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="700.0" dy="0.0">2. Збій: шина зависла / чип мовчить</tspan><tspan x="700.0" dy="14.3">Прапорець апаратно не перемикається</tspan></text>
<rect x="510.0" y="255.0" width="380.0" height="55.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/><text x="700.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">3. Спрацьовує умова (get_time() &gt; t_deadline)</tspan><tspan x="700.0" dy="14.3">Цикл примусово переривається,</tspan><tspan x="700.0" dy="14.3">драйвер повертає статусний код ERR_TIMEOUT</tspan></text>
<rect x="510.0" y="325.0" width="380.0" height="55.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="342.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">4. Контрольоване відновлення:</tspan><tspan x="700.0" dy="14.3">Виклик bus_recover(), повтор через Backoff,</tspan><tspan x="700.0" dy="14.3">або перехід у режим деградації (Failsafe)</tspan></text>
<rect x="510.0" y="395.0" width="380.0" height="42.0" rx="6" fill="#bbf7d0" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="419.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Підсумок: Система жива, процесор керує ситуацією</tspan></text>
</svg>