<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 960 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="960" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="480.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація помилок комунікації та маршрути відновлення</text>
<rect x="340.0" y="50.0" width="260.0" height="45.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="69.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Збій транзакції драйвера</tspan><tspan x="470.0" dy="13.7">NACK / Timeout / CRC Error / Bad ID</tspan></text>
<line x1="470.0" y1="95.0" x2="230.0" y2="135.0" stroke="#333333" stroke-width="1.5"/>
<line x1="470.0" y1="95.0" x2="710.0" y2="135.0" stroke="#333333" stroke-width="1.5"/>
<rect x="35.0" y="135.0" width="390.0" height="320.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="230.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Транзиєнтні збої (Transient)</text>
<text x="230.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Короткочасні електричні або програмні завади</text>
<rect x="55.0" y="195.0" width="350.0" height="55.0" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/><text x="230.0" y="205.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Причини:</tspan><tspan x="230.0" dy="13.7">• Електромагнітна завада (EMI) на шині</tspan><tspan x="230.0" dy="13.7">• Одиничний збій контрольної суми CRC</tspan><tspan x="230.0" dy="13.7">• Давач зайнятий перетворенням АЦП (NACK)</tspan></text>
<rect x="55.0" y="260.0" width="350.0" height="55.0" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/><text x="230.0" y="270.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Стратегія реакції:</tspan><tspan x="230.0" dy="13.7">• Повторна спроба (Retry) після паузи</tspan><tspan x="230.0" dy="13.7">• Експоненційний відкат (Backoff) з джитером</tspan><tspan x="230.0" dy="13.7">• Ліміт спроб: N = 2..4 рази</tspan></text>
<rect x="55.0" y="325.0" width="350.0" height="60.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Результат повтору:</tspan><tspan x="230.0" dy="14.3">• Успіх → продовжуємо штатну роботу</tspan><tspan x="230.0" dy="14.3">• Вичерпано N спроб → ескалація до фатальної</tspan></text>
<rect x="55.0" y="395.0" width="350.0" height="45.0" rx="6" fill="#bfdbfe" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="421.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Ціль: Не збурювати систему через одиничний шум</tspan></text>
<rect x="515.0" y="135.0" width="390.0" height="320.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="710.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Фатальні відмови (Permanent)</text>
<text x="710.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Фізичне пошкодження або втрата зв'язку</text>
<rect x="535.0" y="195.0" width="350.0" height="55.0" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="710.0" y="198.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Причини:</tspan><tspan x="710.0" dy="13.7">• Фізичний обрив дроту SDA / SCL / MISO</tspan><tspan x="710.0" dy="13.7">• Знеструмлення або пробій мікросхеми</tspan><tspan x="710.0" dy="13.7">• Невідповідність WHO_AM_I (0x00 / 0xFF)</tspan><tspan x="710.0" dy="13.7">• Залипання шини веденим чипом</tspan></text>
<rect x="535.0" y="260.0" width="350.0" height="55.0" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="710.0" y="270.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Стратегія реакції:</tspan><tspan x="710.0" dy="13.7">• Відмова від негайних ретраїв (no busy-spin)</tspan><tspan x="710.0" dy="13.7">• Апаратне скидання шини (I2C Bus Clear / Reset)</tspan><tspan x="710.0" dy="13.7">• Спрацьовування Circuit Breaker (розрив)</tspan></text>
<rect x="535.0" y="325.0" width="350.0" height="60.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="710.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Результат ескалації:</tspan><tspan x="710.0" dy="14.3">• Перехід у захисний режим (Failsafe mode)</tspan><tspan x="710.0" dy="14.3">• Перемикання на дублюючий давач / зупинка</tspan></text>
<rect x="535.0" y="395.0" width="350.0" height="45.0" rx="6" fill="#fecaca" stroke="#c0392b" stroke-width="1.5"/><text x="710.0" y="421.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Ціль: Захистити шину і процесор від спаму відмов</tspan></text>
</svg>