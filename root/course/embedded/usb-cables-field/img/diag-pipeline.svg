<rect x="60.0" y="320.0" width="660.0" height="88.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="390.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна структура стану, один виклик на цикл, три відповіді назовні</text>
<text x="80.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• міряй ПІД навантаженням: без струму падіння ΔV = I·R = 0, і найгірший кабель бреше «5 В»;</text>
<text x="80.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• усереднюй АЦП: сирий відлік стрибає на десятки мВ, а поріг просадки — теж десятки мВ;</text>
<text x="80.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• класифікуй матрицею, тоді дебаунс: діагноз має вистоятися, перш ніж діяти чи говорити.</text>
