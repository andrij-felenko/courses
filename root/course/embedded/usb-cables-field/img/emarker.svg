<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">e-marker: чип, що дозволяє кабелю більше</text>
<rect x="50.0" y="64.0" width="312.0" height="132.0" rx="12" fill="#fbf7ec" stroke="#b8860b" stroke-width="1.7"/>
<text x="206.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">Кабель БЕЗ e-marker</text>
<line x1="80.0" y1="122.0" x2="332.0" y2="122.0" stroke="#b8860b" stroke-width="3.0"/>
<text x="206.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">система не знає меж кабелю</text>
<text x="206.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">→ припускає безпечні 3 А, EPR нема</text>
<rect x="378.0" y="64.0" width="312.0" height="132.0" rx="12" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.7"/>
<text x="534.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Кабель З e-marker</text>
<line x1="408.0" y1="122.0" x2="660.0" y2="122.0" stroke="#b8860b" stroke-width="3.0"/>
<rect x="504.0" y="108.0" width="56.0" height="24.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="532.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">e-marker</text>
<text x="534.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">живиться з VCONN</text>
<text x="534.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">→ доповідає: 5 А, швидкість, довжина</text>
<rect x="110.0" y="224.0" width="520.0" height="100.0" rx="12" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="370.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що каже e-marker системі</text>
<text x="178.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">струм</text>
<text x="178.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">3 А чи 5 А</text>
<text x="320.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">швидкість</text>
<text x="320.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">USB 2.0 / 3.x</text>
<text x="450.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">довжина</text>
<text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">затримки, втрати</text>
<text x="572.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">тип</text>
<text x="572.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">пасивний / активний</text>
<rect x="50.0" y="344.0" width="640.0" height="52.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="370.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Понад 3 А й уся EPR можливі лише з кабелем, що має e-marker. Нема чипа — система</tspan><tspan x="370.0" dy="14.0">перестраховується 3 амперами, хоч би що міг зарядний; тому «той самий блок, інший шнур»</tspan></text>
</svg>