<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Удар інтегратора (Integrator Shock): чому I=0 обвалює тягу</text>
<rect x="60.0" y="65.0" width="760.0" height="115.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="440.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівновага сил у польоті: сталий трим (Trim) утримується виключно інтегратором</text>
<text x="220.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ручний режим (Manual):</text>
<text x="220.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">u_manual = 58% газу (утримання висоти)</text>
<text x="440.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="700">➔ перемикання ➔</text>
<text x="640.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автоматичний режим (Alt-Hold):</text>
<text x="640.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">u_pid = Kp·e + Ki·∫e dt   [якщо I = 0, e = 0 → u = 0%]</text>
<rect x="60.0" y="205.0" width="760.0" height="175.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<line x1="100.0" y1="345.0" x2="780.0" y2="345.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="785.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t</text>
<line x1="280.0" y1="220.0" x2="280.0" y2="365.0" stroke="#d35400" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="280.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">t_перемикання</text>
<line x1="110.0" y1="270.0" x2="280.0" y2="270.0" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="190.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тяга 58% (Hold)</text>
<path d="M 280.0 345.0 C 340.0 265.0, 460.0 280.0, 770.0 345.0" fill="none" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="3 3"/>
<text x="375.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">P-складова (Kp·e)</text>
<path d="M 280.0 345.0 C 420.0 345.0, 560.0 285.0, 770.0 270.0" fill="none" stroke="#27ae60" stroke-width="2.2"/>
<text x="560.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">I-складова (накопичує трим заново)</text>
<path d="M 280.0 345.0 C 320.0 285.0, 430.0 250.0, 770.0 270.0" fill="none" stroke="#c0392b" stroke-width="2.8"/>
<text x="425.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Сумарне u(t): провал до 0% і переліт!</text>
<rect x="290.0" y="325.0" width="140.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="360.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Яма втрати тяги</text>
</svg>