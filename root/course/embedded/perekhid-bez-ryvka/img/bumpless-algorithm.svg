<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм безперервного переходу (Bumpless Handover)</text>
<rect x="50.0" y="70.0" width="210.0" height="85.0" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
<text x="155.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Попередній режим A</text>
<text x="155.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Останній керувальний</text>
<text x="155.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">сигнал: u_prev</text>
<rect x="330.0" y="70.0" width="490.0" height="240.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="575.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ініціалізація стану нового регулятора B (в момент перемикання)</text>
<rect x="350.0" y="115.0" width="450.0" height="50.0" rx="4" fill="#f9fbf9" stroke="#27ae60" stroke-width="1.0"/>
<text x="365.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 1. Відстеження цілі (Setpoint Tracking):</text>
<text x="365.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">Setpoint_new = Measurement_current  ➔  e = 0  ➔  P_new = 0</text>
<rect x="350.0" y="175.0" width="450.0" height="48.0" rx="4" fill="#f9fbf9" stroke="#27ae60" stroke-width="1.0"/>
<text x="365.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 2. Скидання пам'яті похідної (D-kick prevent):</text>
<text x="365.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">meas_prev = Measurement_current  ➔  D_new = 0</text>
<rect x="350.0" y="233.0" width="450.0" height="62.0" rx="4" fill="#eef8f1" stroke="#27ae60" stroke-width="1.4"/>
<text x="365.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Крок 3. Передзавантаження інтегратора (Pre-loading):</text>
<text x="365.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">I_new = clamp(u_prev − P_new − D_new − FF_new, I_min, I_max)</text>
<line x1="260.0" y1="112.0" x2="330.0" y2="265.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">u_prev</text>
<rect x="330.0" y="340.0" width="490.0" height="85.0" rx="6" fill="#f3f9f4" stroke="#27ae60" stroke-width="1.5"/>
<text x="575.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідний сигнал регулятора B на першому кроці t = 0+</text>
<text x="575.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">u_B(0+) = P_new + I_new + D_new + FF = 0 + (u_prev − FF) + 0 + FF = u_prev</text>
<text x="575.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Механічний привід не відчуває перемикання (нульовий ривок: Δu = 0)</text>
<line x1="575.0" y1="310.0" x2="575.0" y2="340.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>