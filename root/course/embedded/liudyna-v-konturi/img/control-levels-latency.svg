<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія рівнів абстракції керування та допустима затримка</text>
<rect x="28.3" y="147.3" width="239.4" height="145.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="148.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="148.0" dy="0.0">RATE / ACRO</tspan><tspan x="148.0" dy="14.3">(кутова швидкість)</tspan><tspan x="148.0" dy="14.3"></tspan><tspan x="148.0" dy="14.3">ДОПУСТИМА ЗАТРИМКА:</tspan><tspan x="148.0" dy="14.3">τ_max &lt; 60–80 мс</tspan><tspan x="148.0" dy="14.3"></tspan><tspan x="148.0" dy="14.3">Пряме керування моментом/швидкістю.</tspan><tspan x="148.0" dy="14.3">Інтегратор 1/s у контурі.</tspan><tspan x="148.0" dy="14.3">Найвища чутливість до затримок.</tspan></text>
<line x1="255.0" y1="220.0" x2="269.0" y2="220.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="268.8" y="147.3" width="214.4" height="145.4" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/><text x="376.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="376.0" dy="0.0">ANGLE / STABILIZE</tspan><tspan x="376.0" dy="14.3">(кутова орієнтація)</tspan><tspan x="376.0" dy="14.3"></tspan><tspan x="376.0" dy="14.3">ДОПУСТИМА ЗАТРИМКА:</tspan><tspan x="376.0" dy="14.3">τ_max ≈ 200–300 мс</tspan><tspan x="376.0" dy="14.3"></tspan><tspan x="376.0" dy="14.3">Бортовий PID тримає кут нахилу.</tspan><tspan x="376.0" dy="14.3">Стік задає нахил (Pitch/Roll).</tspan><tspan x="376.0" dy="14.3">При відпусканні — автогоризонт.</tspan></text>
<line x1="483.0" y1="220.0" x2="497.0" y2="220.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="478.0" y="147.3" width="252.0" height="145.4" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/><text x="604.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="604.0" dy="0.0">POSITION HOLD</tspan><tspan x="604.0" dy="14.3">(утримання точки)</tspan><tspan x="604.0" dy="14.3"></tspan><tspan x="604.0" dy="14.3">ДОПУСТИМА ЗАТРИМКА:</tspan><tspan x="604.0" dy="14.3">τ_max ≈ 0.8–2.0 с</tspan><tspan x="604.0" dy="14.3"></tspan><tspan x="604.0" dy="14.3">Борт тримає швидкість і координати.</tspan><tspan x="604.0" dy="14.3">Стік задає вектор швидкості v_x, v_y.</tspan><tspan x="604.0" dy="14.3">Без команд — зависання в точці.</tspan></text>
<line x1="711.0" y1="220.0" x2="725.0" y2="220.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="706.0" y="147.3" width="252.0" height="145.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="832.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="832.0" dy="0.0">SUPERVISORY / MISSION</tspan><tspan x="832.0" dy="14.3">(маршрутні точки)</tspan><tspan x="832.0" dy="14.3"></tspan><tspan x="832.0" dy="14.3">ДОПУСТИМА ЗАТРИМКА:</tspan><tspan x="832.0" dy="14.3">τ_max &gt; 5–30 с</tspan><tspan x="832.0" dy="14.3"></tspan><tspan x="832.0" dy="14.3">Високорівневі цілі (Waypoints/Go-To).</tspan><tspan x="832.0" dy="14.3">Уся фізика й навігація — на борту.</tspan><tspan x="832.0" dy="14.3">Стійкий до супутникових лагів.</tspan></text>
<line x1="43.0" y1="380.0" x2="937.0" y2="380.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень автономності бортового контролера зростає  ⟶  Стійкість до затримок каналу зростає</text>
</svg>