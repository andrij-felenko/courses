<text x="245.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 1: Прецизійний розріз доріжки (Trace Cut)</text>
<rect x="80.0" y="160.0" width="140.0" height="30.0" rx="3" fill="#38a169" stroke="#276749" stroke-width="1.5"/>
<text x="150.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Траса (Вхід)</text>
<rect x="270.0" y="160.0" width="140.0" height="30.0" rx="3" fill="#38a169" stroke="#276749" stroke-width="1.5"/>
<text x="340.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Траса (Вихід)</text>
<line x1="245.0" y1="145.0" x2="245.0" y2="205.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="245.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Розріз &gt; 0.5 мм</text>
<rect x="94.1" y="239.3" width="301.9" height="61.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="245.0" y="259.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">• Зняти захисну маску лезом скальпеля</tspan><tspan x="245.0" dy="15.0">• Вирізати ділянку міді шириною ≥ 0.5 мм</tspan><tspan x="245.0" dy="15.0">• Перевірити опір мультиметром (R &gt; 10 МОм)</tspan></text>
<rect x="510.0" y="60.0" width="410.0" height="310.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="715.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 2: Монтаж та фіксація перемички (Bodge Wire)</text>
<circle cx="570.0" cy="175.0" r="14.0" fill="#cbd5e1" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="570.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">TP1</text>
<circle cx="860.0" cy="175.0" r="14.0" fill="#cbd5e1" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="860.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">IC2.4</text>
<line x1="570.0" y1="175.0" x2="680.0" y2="150.0" stroke="#27ae60" stroke-width="3.0"/>
<line x1="680.0" y1="150.0" x2="760.0" y2="200.0" stroke="#27ae60" stroke-width="3.0"/>
<line x1="760.0" y1="200.0" x2="860.0" y2="175.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="715.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Емальований дріт 30 AWG (Kynar)</text>
<circle cx="680.0" cy="150.0" r="9.0" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
<circle cx="760.0" cy="200.0" r="9.0" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
<text x="720.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="700">Фіксація краплями УФ-маски</text>
<rect x="560.8" y="269.3" width="308.4" height="61.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="715.0" y="289.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">• Паяння до тестової точки або виводу чипа</tspan><tspan x="715.0" dy="15.0">• Акуратне прокладання вздовж полігону</tspan><tspan x="715.0" dy="15.0">• Фіксація УФ-клеєм для захисту від вібрації</tspan></text>
<rect x="158.6" y="381.8" width="642.7" height="46.5" rx="6" fill="#eefaf1" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="401.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Апаратний патч першої ревізії обов'язково фотографується та супроводжується Rework-інструкцією,</tspan><tspan x="480.0" dy="15.0">щоб уся партія лабораторних прототипів була модифікована ідентично.</tspan></text>
