<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця класифікації апаратних дефектів та вибору стратегії виправлення</text>
<rect x="73.4" y="206.6" width="173.1" height="66.8" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="2.0"/><text x="160.0" y="227.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Виявлено дефект</tspan><tspan x="160.0" dy="16.9">на платі Rev 1.0</tspan><tspan x="160.0" dy="16.9">(Аномалія в роботі)</tspan></text>
<line x1="245.0" y1="240.0" x2="315.0" y2="240.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="285.3" y="194.3" width="249.4" height="91.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Діагностика першопричини (RCA):</tspan><tspan x="410.0" dy="15.0">• Помилка схеми (Schematic bug)</tspan><tspan x="410.0" dy="15.0">• Помилка футпрінта (Footprint bug)</tspan><tspan x="410.0" dy="15.0">• Завади та цілісність сигналу</tspan><tspan x="410.0" dy="15.0">• Порушення послідовності живлення</tspan></text>
<line x1="515.0" y1="210.0" x2="580.0" y2="120.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="520.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">Блокуючий дефект</text>
<rect x="559.9" y="74.3" width="400.2" height="91.3" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/><text x="760.0" y="94.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Категорія 1: Блокуючі дефекти (Hardware Rework)</tspan><tspan x="760.0" dy="15.0">• Фізичне коротке замикання або переполюсовка</tspan><tspan x="760.0" dy="15.0">• Дзеркальний чип / непідключені життєві шини</tspan><tspan x="760.0" dy="15.0">Рішення: Різання доріжок (Cut) + дротяні перемички (Bodge)</tspan><tspan x="760.0" dy="15.0">Обов'язково: Технологічна інструкція монтажнику (SOP)</tspan></text>
<line x1="515.0" y1="270.0" x2="580.0" y2="360.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="520.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">Некритичний дефект</text>
<rect x="550.1" y="314.4" width="419.9" height="91.3" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="2.0"/><text x="760.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Категорія 2: Некритичні дефекти (Software Workaround)</tspan><tspan x="760.0" dy="15.0">• Зависання датчика через збій FSM шини</tspan><tspan x="760.0" dy="15.0">• Брязкіт контактів / відсутність RC-фільтра</tspan><tspan x="760.0" dy="15.0">• Завалені фронти шини через велику ємність</tspan><tspan x="760.0" dy="15.0">Рішення: Програмне скидання GPIO, таймерний фільтр, downclock</tspan></text>
</svg>