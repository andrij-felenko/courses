<rect x="445.0" y="320.0" width="370.0" height="60.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="630.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">ЗАХИСТ ЧЕРЕЗ CONFIRMATION:</tspan><tspan x="630.0" dy="14.3">FC бачить confirmation = 1 для щойно виконаної команди →</tspan><tspan x="630.0" dy="14.3">НЕ чіпає замок удруге, а лише ПОВТОРЮЄ кешований ACK!</tspan></text>
<text x="625.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">confirmation &gt; 0 дозволяє борту відрізнити ретрай від нової дії.</text>
