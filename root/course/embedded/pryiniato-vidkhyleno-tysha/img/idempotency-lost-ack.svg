<text x="215.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">f(f(x)) = f(x) — безпечний повтор</text>
<text x="215.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Приклад: SET_MODE(GUIDED) / ARM / SET_SERVO</text>
