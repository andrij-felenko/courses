<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три результати відправки команди через ненадійний радіоефір</text>
<text x="120.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наземна станція (GCS)</text>
<text x="420.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Радіоканал (Uplink / Downlink)</text>
<text x="720.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Польотний контролер (FC)</text>
<line x1="240.0" y1="50.0" x2="240.0" y2="460.0" stroke="#e0e0e0" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="600.0" y1="50.0" x2="600.0" y2="460.0" stroke="#e0e0e0" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="15.0" y="85.0" width="810.0" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="30.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">1. ПРИЙНЯТО (ACCEPTED)</text>
<rect x="30.0" y="120.0" width="180.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="145.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Шле COMMAND_LONG</tspan><tspan x="120.0" dy="15.6">(confirmation = 0)</tspan></text>
<line x1="215.0" y1="140.0" x2="625.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">COMMAND_LONG (ARM / SET_MODE)</text>
<rect x="630.0" y="120.0" width="180.0" height="58.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="145.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Перевірка стану: OK</tspan><tspan x="720.0" dy="15.6">Дію виконано! Шле ACK</tspan></text>
<line x1="625.0" y1="163.0" x2="215.0" y2="163.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">COMMAND_ACK (MAV_RESULT_ACCEPTED)</text>
<rect x="15.0" y="210.0" width="810.0" height="110.0" rx="6" fill="#fdedec" stroke="#e74c3c" stroke-width="1.2"/>
<text x="30.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e74c3c" text-anchor="start" font-weight="700">2. ВІДХИЛЕНО (DENIED / TEMPORARILY_REJECTED / FAILED)</text>
<rect x="30.0" y="245.0" width="180.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="270.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Шле команду</tspan><tspan x="120.0" dy="15.6">(наприклад, ARM)</tspan></text>
<line x1="215.0" y1="265.0" x2="625.0" y2="265.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">COMMAND_LONG (ARM motors)</text>
<rect x="630.0" y="245.0" width="180.0" height="58.0" rx="6" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5"/><text x="720.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Pre-arm: калібрування гіро!</tspan><tspan x="720.0" dy="13.0">Заборона армінгу</tspan></text>
<line x1="625.0" y1="288.0" x2="215.0" y2="288.0" stroke="#e74c3c" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle">COMMAND_ACK (MAV_RESULT_DENIED / TEMPORARILY_REJECTED)</text>
<rect x="15.0" y="335.0" width="810.0" height="120.0" rx="6" fill="#f8f9fa" stroke="#95a5a6" stroke-width="1.2"/>
<text x="30.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">3. ТИША (TIMEOUT / ВТРАТА В ЕФІРІ / ЗАВИСАННЯ)</text>
<rect x="30.0" y="370.0" width="180.0" height="68.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="120.0" y="393.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Чекає 1000 мс...</tspan><tspan x="120.0" dy="14.3">Відповіді нема!</tspan><tspan x="120.0" dy="14.3">Стан борту НЕВІДОМИЙ</tspan></text>
<line x1="215.0" y1="387.0" x2="380.0" y2="387.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="395.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">✖</text>
<text x="475.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Пакет втрачено в Uplink</text>
<line x1="625.0" y1="417.0" x2="460.0" y2="417.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="445.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">✖</text>
<text x="360.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ACK втрачено в Downlink</text>
<rect x="630.0" y="370.0" width="180.0" height="68.0" rx="6" fill="#f8f9fa" stroke="#95a5a6" stroke-width="1.5"/><text x="720.0" y="393.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Або не почув команду,</tspan><tspan x="720.0" dy="14.3">або виконав, але ACK упав,</tspan><tspan x="720.0" dy="14.3">або завис RTOS-потік</tspan></text>
</svg>