<rect x="20.0" y="420.0" width="800.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="420.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Головне правило автомату: при відхиленні (DENIED) повтори ЗАБОРОНЕНІ — це свідома відмова борту.</text>
<text x="420.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Повтори робляться ТІЛЬКИ при тиші (таймаут), а поле confirmation сигналізує борту про повтор спроби.</text>
