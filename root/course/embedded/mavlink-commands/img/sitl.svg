<text x="380.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стенд</text>
<text x="380.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">реальна плата, гвинти зняті;</tspan><tspan x="380.0" dy="15.0">мотори крутяться, не злетить</tspan></text>
<line x1="489.0" y1="145.0" x2="511.0" y2="145.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
