<text x="620.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">відкрите безпечне місце,</tspan><tspan x="620.0" dy="15.0">далеко від людей</tspan></text>
<text x="380.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Кожна команда реально рухає апарат — гвинти востаннє</text>
