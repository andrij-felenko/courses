<text x="140.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">віртуальний апарат у комп'ютері;</tspan><tspan x="140.0" dy="15.0">MAVLink справжній, збити нічого</tspan></text>
<line x1="249.0" y1="145.0" x2="271.0" y2="145.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
