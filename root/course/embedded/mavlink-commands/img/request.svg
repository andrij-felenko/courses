<text x="380.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">Не замовив — повідомлення «немає». Критичне — частіше, фонове — рідше,</tspan><tspan x="380.0" dy="15.6">щоб не перевантажити вузький канал телеметрії.</tspan></text>
