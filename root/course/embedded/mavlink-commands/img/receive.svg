<text x="359.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">збирає кадр, звіряє CRC</text>
<line x1="430.0" y1="108.0" x2="470.0" y2="108.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="476.0" y="69.0" width="235.0" height="92.0" rx="6" fill="#eef4ff" stroke="#c9d6f0" stroke-width="1.5"/><text x="593.5" y="95.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="593.5" dy="0.0">msg = ATTITUDE</tspan><tspan x="593.5" dy="15.6">  msg.roll  = 0.03</tspan><tspan x="593.5" dy="15.6">  msg.pitch = -0.11</tspan><tspan x="593.5" dy="15.6">  msg.yaw   = 1.57</tspan></text>
