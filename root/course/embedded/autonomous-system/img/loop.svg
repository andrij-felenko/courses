<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автономний апарат — це замкнений контур, а не пряма лінія</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="490.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">давачі → оцінювач стану → керування → виконання → апарат → і знову давачі</text>
<rect x="36.0" y="179.0" width="150.0" height="72.0" rx="10" fill="#eef2ff" stroke="#2457d6" stroke-width="1.7"/><text x="111.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="111.0" dy="0.0">ДАВАЧІ</tspan><tspan x="111.0" dy="16.2">вимірюють</tspan></text>
<rect x="222.0" y="179.0" width="168.0" height="72.0" rx="10" fill="#f4f4f5" stroke="#1a1a1a" stroke-width="1.7"/><text x="306.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="306.0" dy="0.0">ОЦІНЮВАЧ</tspan><tspan x="306.0" dy="16.2">СТАНУ</tspan></text>
<rect x="426.0" y="179.0" width="152.0" height="72.0" rx="10" fill="#eafaef" stroke="#27ae60" stroke-width="1.7"/><text x="502.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="502.0" dy="0.0">КЕРУВАННЯ</tspan><tspan x="502.0" dy="16.2">порівняти й виправити</tspan></text>
<rect x="614.0" y="179.0" width="160.0" height="72.0" rx="10" fill="#fff5e6" stroke="#d98a00" stroke-width="1.7"/><text x="694.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="694.0" dy="0.0">ВИКОНАВЧІ</tspan><tspan x="694.0" dy="16.2">МЕХАНІЗМИ</tspan></text>
<rect x="810.0" y="179.0" width="140.0" height="72.0" rx="10" fill="#ececef" stroke="#1a1a1a" stroke-width="1.7"/><text x="880.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">АПАРАТ</tspan><tspan x="880.0" dy="16.2">+ фізика</tspan></text>
<line x1="186.0" y1="215.0" x2="219.0" y2="215.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="204.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сирі виміри</text>
<line x1="390.0" y1="215.0" x2="423.0" y2="215.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="408.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">оцінка стану</text>
<line x1="578.0" y1="215.0" x2="611.0" y2="215.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="596.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">команди</text>
<line x1="774.0" y1="215.0" x2="807.0" y2="215.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="792.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сили / моменти</text>
<rect x="410.0" y="64.0" width="184.0" height="50.0" rx="10" fill="#eef6ff" stroke="#2457d6" stroke-width="1.7"/><text x="502.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="502.0" dy="0.0">ЗАВДАННЯ — бажаний стан</tspan><tspan x="502.0" dy="15.0">(уставка)</tspan></text>
<line x1="502.0" y1="114.0" x2="502.0" y2="177.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="556.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-style="italic">уставка</text>
<line x1="880.0" y1="251.0" x2="880.0" y2="372.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="880.0" y1="372.0" x2="111.0" y2="372.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="111.0" y1="372.0" x2="111.0" y2="253.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="495.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">апарат рухається → давачі міряють новий стан: контур замикається</text>
<text x="490.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ключова ідея: керування спирається на оцінку стану, а не на сирі давачі, і безперервно порівнює її з уставкою.</text>
</svg>