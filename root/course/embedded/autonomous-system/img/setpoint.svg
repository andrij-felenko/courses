<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться «бажаний стан»: пілот чи місія — ядро те саме</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ручний і автономний режими різняться лише джерелом уставки</text>
<rect x="46.0" y="78.0" width="250.0" height="78.0" rx="11" fill="#eef6ff" stroke="#2457d6" stroke-width="1.7"/>
<text x="60.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">ПІЛОТ — RC-стіки</text>
<text x="60.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ручна уставка просто зараз:</text>
<text x="60.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">«нахили праворуч на 15°»</text>
<rect x="46.0" y="250.0" width="250.0" height="78.0" rx="11" fill="#eafaef" stroke="#27ae60" stroke-width="1.7"/>
<text x="60.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">АВТОНОМНА МІСІЯ</text>
<text x="60.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">точки маршруту → навігація</text>
<text x="60.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">рахує уставку: «лети до точки B»</text>
<rect x="346.0" y="165.0" width="128.0" height="76.0" rx="10" fill="#f4f4f5" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="410.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">ВИБІР</tspan><tspan x="410.0" dy="16.2">РЕЖИМУ</tspan></text>
<line x1="296.0" y1="117.0" x2="344.0" y2="188.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<line x1="296.0" y1="289.0" x2="344.0" y2="218.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrG)" stroke-linecap="round"/>
<rect x="512.0" y="165.0" width="188.0" height="76.0" rx="11" fill="#eafaef" stroke="#27ae60" stroke-width="1.7"/>
<text x="606.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="606.0" dy="0.0">КЕРУВАННЯ</tspan><tspan x="606.0" dy="16.2">(те саме ядро)</tspan></text>
<line x1="474.0" y1="203.0" x2="510.0" y2="203.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="728.0" y="165.0" width="140.0" height="76.0" rx="11" fill="#fff5e6" stroke="#d98a00" stroke-width="1.7"/>
<text x="798.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="798.0" dy="0.0">ВИКОНАВЧІ</tspan><tspan x="798.0" dy="16.2">МЕХАНІЗМИ</tspan></text>
<line x1="700.0" y1="203.0" x2="726.0" y2="203.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="450.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Те, що нижче «вибору режиму» (керування → виконання → апарат → давачі), однакове для ручного й автономного польоту.</text>
</svg>