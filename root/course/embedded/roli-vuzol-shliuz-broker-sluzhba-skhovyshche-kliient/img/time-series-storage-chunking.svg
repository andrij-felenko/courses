<text x="655.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ДАУНСЕМПЛІНГ</text>
<line x1="590.0" y1="138.0" x2="720.0" y2="138.0" stroke="#475569" stroke-width="1.0"/>
<text x="590.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• 1-хв середні/мін/макс</text>
<text x="590.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Сирі секунди вилучені</text>
<text x="590.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Довготривалий архів</text>
<text x="590.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Збереження 2 роки</text>
<text x="590.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Економія диска 98%</text>
<rect x="30.0" y="276.0" width="720.0" height="84.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="390.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Чому не класичний PostgreSQL B-Tree для всього потоку? При мільйонах рядків B-дерево перестає вміщатися в RAM,</tspan><tspan x="390.0" dy="12.3">кожен INSERT спричиняє довільне читання/запис блоків на диск (Write Amplification) і блокування індексу.</tspan><tspan x="390.0" dy="12.3">Time-Series DB ділить час на чанки: запис іде послідовно лише в Активний чанк, а старі чанки пакуються в колумнарний архів.</tspan></text>
</svg>