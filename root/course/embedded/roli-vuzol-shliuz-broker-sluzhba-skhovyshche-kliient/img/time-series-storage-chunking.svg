<line x1="260.0" y1="138.0" x2="385.0" y2="138.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="260.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Пишеться в RAM</text>
