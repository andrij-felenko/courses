<text x="487.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">СТИСНЕНИЙ ЧАНК</text>
<line x1="425.0" y1="138.0" x2="550.0" y2="138.0" stroke="#d35400" stroke-width="1.0"/>
<text x="425.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Read-Only сегмент</text>
<text x="425.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Gorilla / Delta-of-Δ</text>
<text x="425.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d35400" text-anchor="start" font-weight="700">• Обсяг: 8–10% від сирого</text>
<text x="425.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Колоночний формат</text>
<text x="425.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Швидкі агрегати</text>
