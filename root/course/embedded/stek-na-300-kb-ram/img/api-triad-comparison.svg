<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріада API lwIP: вибір між мінімальним споживанням RAM та сумісністю POSIX</text>
<rect x="40.0" y="60.0" width="270.0" height="375.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="175.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Raw Callback API</text>
<text x="175.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Подієва модель (Event-Driven)</text>
<rect x="55.0" y="130.0" width="240.0" height="75.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="175.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Один спільний потік</text>
<text x="175.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Головний цикл або один</text>
<text x="175.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">потік обробки переривань</text>
<rect x="55.0" y="215.0" width="240.0" height="115.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="175.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зворотні виклики:</text>
<text x="175.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• tcp_recv() / tcp_sent()</text>
<text x="175.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• tcp_accept() / tcp_err()</text>
<text x="175.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• tcp_poll() за таймером</text>
<text x="175.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">0 копіювань, нуль RTOS задач</text>
<rect x="55.0" y="340.0" width="240.0" height="80.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="175.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витрати пам'яті:</text>
<text x="175.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Лише struct tcp_pcb (≈160 Б)</text>
<text x="175.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Найшвидший, 0 накладів RTOS</text>
<rect x="335.0" y="60.0" width="270.0" height="375.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="470.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Netconn API</text>
<text x="470.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Послідовна блокуюча модель</text>
<rect x="350.0" y="130.0" width="240.0" height="75.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.0"/>
<text x="470.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Окремий tcpip_thread</text>
<text x="470.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Взаємодія через черги RTOS</text>
<text x="470.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(sys_mbox) та семафори</text>
<rect x="350.0" y="215.0" width="240.0" height="115.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.0"/>
<text x="470.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блокуючі виклики:</text>
<text x="470.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• netconn_new() / bind()</text>
<text x="470.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• netconn_accept() [блок]</text>
<text x="470.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• netconn_recv() / write()</text>
<text x="470.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Зручний лінійний код у RTOS</text>
<rect x="350.0" y="340.0" width="240.0" height="80.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.0"/>
<text x="470.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витрати пам'яті:</text>
<text x="470.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Стек tcpip_thread + стеки задач</text>
<text x="470.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">≈ 2–4 КБ на кожне з'єднання</text>
<rect x="630.0" y="60.0" width="270.0" height="375.0" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.8"/>
<text x="765.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#a855f7" text-anchor="middle" font-weight="700">BSD Sockets API</text>
<text x="765.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">POSIX Стандартний шар</text>
<rect x="645.0" y="130.0" width="240.0" height="75.0" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.0"/>
<text x="765.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a855f7" text-anchor="middle" font-weight="700">Обгортка над Netconn</text>
<text x="765.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Таблиця сокетів sockets[]</text>
<text x="765.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">та дескрипторів файлів</text>
<rect x="645.0" y="215.0" width="240.0" height="115.0" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.0"/>
<text x="765.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">POSIX функції:</text>
<text x="765.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• socket(), bind(), listen()</text>
<text x="765.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• send(), recv(), select()</text>
<text x="765.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• setsockopt(), poll()</text>
<text x="765.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#a855f7" text-anchor="middle" font-weight="700">Максимальна сумісність коду</text>
<rect x="645.0" y="340.0" width="240.0" height="80.0" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.0"/>
<text x="765.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витрати пам'яті:</text>
<text x="765.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Найважчий стек + копіювання</text>
<text x="765.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Копіювання з pbuf у буфер char*</text>
</svg>