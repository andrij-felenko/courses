<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура пам'яті вбудованого TCP/IP стека у ліміті 300 КБ RAM</text>
<rect x="40.0" y="60.0" width="860.0" height="390.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="470.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Загальний бюджет оперативної пам'яті (SRAM 300 КБ, наприклад STM32F4/F7 або ESP32)</text>
<rect x="60.0" y="110.0" width="240.0" height="320.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="180.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Додаток та RTOS</text>
<text x="180.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">≈ 120–140 КБ</text>
<rect x="75.0" y="175.0" width="210.0" height="50.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="180.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек завдань FreeRTOS</text>
<text x="180.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Задачі давачів, логіки, UI</text>
<rect x="75.0" y="235.0" width="210.0" height="50.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="180.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Черги, м'ютекси, семафори</text>
<text x="180.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">IPC ядра операційної системи</text>
<rect x="75.0" y="295.0" width="210.0" height="50.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="180.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Глобальні змінні й Heap</text>
<text x="180.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">.data / .bss та malloc() додатку</text>
<rect x="75.0" y="355.0" width="210.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="180.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Буфери периферії</text>
<text x="180.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">UART, SPI, дисплей, файли</text>
<rect x="320.0" y="110.0" width="350.0" height="320.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="495.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">lwIP Стек (Пул пам'яті й Купа)</text>
<text x="495.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">≈ 120–140 КБ (конфігурація мережі)</text>
<rect x="335.0" y="175.0" width="320.0" height="110.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="495.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Фіксовані пули пам'яті (memp)</text>
<text x="350.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• PBUF_POOL: 16–32 буфери (по 512–1536 Б)</text>
<text x="350.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• TCP_PCB (TCB): 8–16 блоків (по 160 Б)</text>
<text x="350.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• TCP_SEG, UDP_PCB, NETCONN структури</text>
<text x="350.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• O(1) алокація без фрагментації пам'яті</text>
<rect x="335.0" y="295.0" width="320.0" height="120.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="495.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Купа мережевого стека (MEM_SIZE Heap)</text>
<text x="350.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Динамічні буфери PBUF_RAM (TX черги)</text>
<text x="350.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Збірка IP-фрагментів і TCP-сегментів</text>
<text x="350.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Буфери сокетних структур та опцій</text>
<text x="350.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Виділений статичний масив ram_heap[]</text>
<rect x="690.0" y="110.0" width="190.0" height="320.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="785.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ethernet DMA</text>
<text x="785.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">≈ 20–30 КБ</text>
<rect x="705.0" y="175.0" width="160.0" height="70.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="785.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">RX Дільники DMA</text>
<text x="785.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">4–8 дескрипторів</text>
<text x="785.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Кільцевий список</text>
<rect x="705.0" y="255.0" width="160.0" height="70.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="785.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">TX Дільники DMA</text>
<text x="785.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">4–8 дескрипторів</text>
<text x="785.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Кільцевий список</text>
<rect x="705.0" y="335.0" width="160.0" height="80.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="785.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">DMA Буфери RAM</text>
<text x="785.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Zero-Copy прив'язка</text>
<text x="785.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">до pbuf_pool блоків</text>
</svg>