<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нескінченний цикл перезавантаження через скид по напрузі (Brown-out)</text>
<rect x="30.0" y="30.0" width="880.0" height="400.0" rx="8" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
<text x="50.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Анатомія пастки циклічного перезавантаження (Brown-out Bootloop)</text>
<rect x="102.8" y="100.2" width="214.4" height="59.6" rx="6" fill="#f0f4f8" stroke="#4b6b94" stroke-width="1.5"/><text x="210.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. Пробудження зі сну</tspan><tspan x="210.0" dy="14.3">• I = 10 мкА -&gt; 15 мА</tspan><tspan x="210.0" dy="14.3">• Батарея має 3.0 В (відпочила)</tspan></text>
<rect x="600.3" y="100.2" width="239.4" height="59.6" rx="6" fill="#fff8ee" stroke="#d97706" stroke-width="1.5"/><text x="720.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">2. Запуск радіопередавача</tspan><tspan x="720.0" dy="14.3">• I_tx = 120 мА за 2 мкс</tspan><tspan x="720.0" dy="14.3">• Стрибок навантаження у 8000 разів</tspan></text>
<rect x="619.1" y="273.1" width="201.8" height="73.9" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/><text x="720.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">3. Провал напруги та BOR</tspan><tspan x="720.0" dy="14.3">• ΔV = 120 мА · 25 Ом = 3.0 В</tspan><tspan x="720.0" dy="14.3">• V_DD падає до 1.2 В &lt; 2.0 В</tspan><tspan x="720.0" dy="14.3">• BOR апаратно скидає ядро</tspan></text>
<rect x="102.8" y="273.1" width="214.4" height="73.9" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">4. Скидання TX і рестарт</tspan><tspan x="210.0" dy="14.3">• Радіо вимкнулось, I падає</tspan><tspan x="210.0" dy="14.3">• Напруга повертається до 3.0 В</tspan><tspan x="210.0" dy="14.3">• МК знову починає Bootloader</tspan></text>
<line x1="330.0" y1="130.0" x2="580.0" y2="130.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="455.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Зчитування датчика, старт TX</text>
<line x1="720.0" y1="185.0" x2="720.0" y2="250.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="795.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2..5 мкс</text>
<line x1="580.0" y1="310.0" x2="340.0" y2="310.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="460.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратний скид (Reset Vector)</text>
<line x1="210.0" y1="250.0" x2="210.0" y2="185.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="140.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Повторний запуск</text>
<rect x="360.0" y="175.0" width="200.0" height="80.0" rx="6" fill="#2b2b2b" stroke="#000000" stroke-width="1.5"/>
<text x="460.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f87171" text-anchor="middle" font-weight="700">НАСЛІДОК ПАСТКИ:</text>
<text x="460.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">• Пакет не відправлено</text>
<text x="460.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">• Батарея виснажена за добу</text>
</svg>