<rect x="110.0" y="250.0" width="520.0" height="22.0" rx="3" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/><rect x="110.0" y="110.0" width="520.0" height="22.0" rx="3" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/><text x="102.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">зовнішня</text><text x="102.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">внутрішня</text><circle cx="349.2" cy="191.0" r="57.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="349.2" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">кулька</text><circle cx="349.2" cy="250.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><text x="349.2" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">v = 0</text><text x="349.2" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(нерухомий контакт)</text><circle cx="349.2" cy="132.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><line x1="349.2" y1="132.0" x2="441.2" y2="132.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="446.2" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">v = vᵢ</text><line x1="349.2" y1="191.0" x2="395.2" y2="191.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/><text x="400.2" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">vᵢ/2</text><text x="349.2" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">центр = середнє двох контактів</text><line x1="228.2" y1="250.0" x2="228.2" y2="132.0" stroke="#6b7280" stroke-width="1.4"/><polygon points="228.2,250.0 184.2,132.0 228.2,132.0" fill="none" stroke="#2457d6" stroke-width="1.8"/><text x="180.2" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">vᵢ</text><text x="233.2" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">0</text><text x="206.2" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">лінійний</text><text x="206.2" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">профіль</text><rect x="140.0" y="300.0" width="460.0" height="46.0" rx="6" fill="#f0f7f2" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="325.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Нема проковзування → швидкість контакту = швидкість доріжки. Центр кульки (а з ним сепаратор) рухається із СЕРЕДНЬОЮ двох контактів — тому сепаратор завжди повільніший за вал.</tspan></text>
