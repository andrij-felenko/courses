<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр віддаленої діагностики польового пристрою</text>
<rect x="22.0" y="56.0" width="172.0" height="210.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="108.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Базовий моніторинг</text>
<text x="108.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Пасивна телеметрія</text>
<line x1="32.0" y1="112.0" x2="184.0" y2="112.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3 2"/>
<text x="32.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Heartbeat-пакети</text>
<text x="32.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Напруга живлення Vbat</text>
<text x="32.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Завантаження CPU / RAM</text>
<text x="32.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Температура кристала</text>
<line x1="196.0" y1="156.0" x2="208.0" y2="156.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210.0" y="56.0" width="172.0" height="210.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="296.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Мережевий тракт</text>
<text x="296.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">Метрики сокетів і пам'яті</text>
<line x1="220.0" y1="112.0" x2="372.0" y2="112.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 2"/>
<text x="220.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• TCP Retransmits / RST</text>
<text x="220.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Latency DNS / сервера</text>
<text x="220.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• High-water mark пулів</text>
<text x="220.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Найбільший блок купи</text>
<line x1="384.0" y1="156.0" x2="396.0" y2="156.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="398.0" y="56.0" width="172.0" height="210.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.8"/>
<text x="484.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Посмертний зріз</text>
<text x="484.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">Crash Dump (.noinit)</text>
<line x1="408.0" y1="112.0" x2="560.0" y2="112.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 2"/>
<text x="408.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Регістри R0-R15, xPSR</text>
<text x="408.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Регістри CFSR / BFAR</text>
<text x="408.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зріз вершини стека</text>
<text x="408.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Стек викликів DWARF</text>
<line x1="572.0" y1="156.0" x2="584.0" y2="156.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="586.0" y="56.0" width="172.0" height="210.0" rx="6" fill="#fbf0fa" stroke="#8e44ad" stroke-width="1.8"/>
<text x="672.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Активний зонд</text>
<text x="672.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-style="italic">Безпечний Remote Shell</text>
<line x1="596.0" y1="112.0" x2="748.0" y2="112.0" stroke="#8e44ad" stroke-width="1.0" stroke-dasharray="3 2"/>
<text x="596.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Сканування шини I2C</text>
<text x="596.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Мережевий Ping вузла</text>
<text x="596.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Апаратний POST-тест</text>
<text x="596.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Контроль таймаутів</text>
<text x="390.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Від періодичного пульсу до глибокого розслідування причин аварій без виїзду на об'єкт</text>
<text x="390.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен наступний шар додає деталізації, не порушуючи автономності пристрою</text>
</svg>