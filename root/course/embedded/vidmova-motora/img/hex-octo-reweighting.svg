<text x="40.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Ранг матриці B_red = 4 (повні 6 DOF зберігаються)</text>
<text x="40.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Дисбаланс реактивного моменту: 3 CW проти 2 CCW</text>
<text x="40.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Для утримання курсу (τ_yaw = 0) контролер душить</text>
<text x="40.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  протилежну групу моторів CCW (до ~45% тяги)</text>
<text x="40.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Штраф на сумарну тягу: втрата ~35-40% ліфту!</text>
<text x="40.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запас TWR &gt; 1.6 утримує висоту; інакше — спуск</text>
