<text x="500.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Дисбаланс моменту легко компенсується (4 CW / 3 CCW)</text>
