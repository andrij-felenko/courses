<text x="500.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Здатний пережити втрату 2 моторів (не суміжних)</text>
