<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="900.0" height="420.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багаторівневий конвеєр виявлення та ізоляції відмови мотора (FDI)</text>
<rect x="40.0" y="75.0" width="200.0" height="50.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="140.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">DShot Bidirectional</text>
<text x="140.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">eRPM мотора (1 кГц)</text>
<line x1="140.0" y1="125.0" x2="140.0" y2="153.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255.0" y="75.0" width="200.0" height="50.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="355.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Телеметрія ESC</text>
<text x="355.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Струм фази I_phase, T_esc</text>
<line x1="355.0" y1="125.0" x2="355.0" y2="153.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470.0" y="75.0" width="200.0" height="50.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="570.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інерційний давач IMU</text>
<text x="570.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Кутові прискорення dω/dt</text>
<line x1="570.0" y1="125.0" x2="570.0" y2="153.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="685.0" y="75.0" width="200.0" height="50.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="785.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">PID-регулятор</text>
<text x="785.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Насичення інтегратора I-term</text>
<line x1="785.0" y1="125.0" x2="785.0" y2="153.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="160.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="140.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">1. Нульові eRPM при команді</text>
<text x="140.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">cmd &gt; 15% &amp; RPM &lt; 100</text>
<line x1="140.0" y1="220.0" x2="470.0" y2="255.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="255.0" y="160.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="355.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2. Відрив пропелера</text>
<text x="355.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">RPM високі &amp; струм ~0A</text>
<line x1="355.0" y1="220.0" x2="470.0" y2="255.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="470.0" y="160.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="570.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">3. Спостерігач розбіжності</text>
<text x="570.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">J·dω/dt &lt;&lt; B·u_cmd</text>
<line x1="570.0" y1="220.0" x2="470.0" y2="255.0" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="685.0" y="160.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="785.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">4. Насичення I-term</text>
<text x="785.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">|I_axis| == I_max &gt; 80 мс</text>
<line x1="785.0" y1="220.0" x2="470.0" y2="255.0" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="230.0" y="265.0" width="480.0" height="50.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="470.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">Арбітраж та захист від хибних спрацьовувань (Debounce)</text>
<text x="470.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Підтвердження тривалості 50...100 мс + перевірка загальної напруги батареї</text>
<line x1="350.0" y1="315.0" x2="240.0" y2="345.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="590.0" y1="315.0" x2="700.0" y2="345.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="350.0" width="400.0" height="75.0" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
<text x="240.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#be123c" text-anchor="middle" font-weight="700">Квадрокоптер (Quad): Аварійний режим</text>
<text x="240.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Відключення I-term по осі Yaw (скидання курсу)</text>
<text x="240.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Запуск Single-Axis Spinning Recovery + керований спуск</text>
<rect x="500.0" y="350.0" width="400.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="700.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Гекса / Октокоптер: Перерахунок мікшера</text>
<text x="700.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Moore-Penrose Pseudoinverse з нульовою вагою мотора</text>
<text x="700.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Стабілізація 6-DOF або безпечне RTH / керована посадка</text>
</svg>