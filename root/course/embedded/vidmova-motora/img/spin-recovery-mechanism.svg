<text x="295.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">M1</text>
<circle cx="212.5" cy="212.6" r="12.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="212.5" y="215.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">M2</text>
<circle cx="212.5" cy="117.4" r="12.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="212.5" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">M3</text>
<text x="40.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Жертвування віссю курсу (τ_yaw ≠ 0)</text>
<text x="40.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Неперервне обертання рами навколо осі Z_body</text>
<text x="40.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Бічні перекидні моменти інтегруються за період</text>
<text x="40.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  обертання T_spin = 2π/ω_z та дають нуль у просторі:</text>
<text x="40.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">  ∫ τ_xy(t) dt = 0  →  кути Roll/Pitch стабільні!</text>
<text x="40.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Середній вектор тяги спрямований вздовж осі Z_world</text>
<rect x="480.0" y="25.0" width="440.0" height="370.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="700.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Фазова модуляція тяги (Cyclic Thrust)</text>
