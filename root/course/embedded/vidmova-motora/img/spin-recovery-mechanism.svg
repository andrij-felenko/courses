<circle cx="240.0" cy="165.0" r="14.0" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<text x="240.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Z_b</text>
