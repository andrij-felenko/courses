<text x="240.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Гіроскопічне усереднення (Spinning Control)</text>
<circle cx="240.0" cy="165.0" r="70.0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<path d="M 180 105 A 85 85 0 0 1 300 105" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
