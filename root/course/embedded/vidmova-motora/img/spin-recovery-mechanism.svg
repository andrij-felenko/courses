<text x="632.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">+Δf (імпульс нахилу)</text>
<text x="500.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Модель автомата перекосу (Cyclic Pitch/Thrust):</text>
<text x="500.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">  f_i(t) = f_0 + Δf · cos(ψ(t) − φ_target)</text>
<text x="500.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• f_0 утримує висоту та задає швидкість спуску</text>
<text x="500.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Δf синхронізовано з фазою кута орієнтації ψ(t)</text>
<text x="500.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Створює постійний бічний нахил у системі NED</text>
<text x="500.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Забезпечує керований дрейф у безпечну зону посадки</text>
</svg>