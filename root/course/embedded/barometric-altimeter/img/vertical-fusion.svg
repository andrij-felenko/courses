<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 915 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="915" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комплементарний фільтр вертикалі: баро (повільне) + акселерометр (швидке)</text>
<rect x="60.0" y="90.0" width="210.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="111.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">БАРОМЕТР</tspan><tspan x="165.0" dy="15.6">абсолютна висота,</tspan><tspan x="165.0" dy="15.6">повільна + шумна</tspan></text>
<rect x="60.0" y="250.0" width="210.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="271.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">АКСЕЛЕРОМЕТР (вісь Z)</tspan><tspan x="165.0" dy="15.6">двічі проінтегрувати →</tspan><tspan x="165.0" dy="15.6">швидка, але ДРЕЙФУЄ</tspan></text>
<rect x="320.0" y="96.0" width="150.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="395.0" y="119.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">НИЗЬКІ частоти</tspan><tspan x="395.0" dy="14.3">(повільна правда)</tspan></text>
<rect x="320.0" y="254.0" width="150.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="395.0" y="277.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">ВИСОКІ частоти</tspan><tspan x="395.0" dy="14.3">(швидка зміна)</tspan></text>
<line x1="270.0" y1="123.0" x2="320.0" y2="123.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="270.0" y1="283.0" x2="320.0" y2="281.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="545.0" cy="205.0" r="26.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="545.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text>
<line x1="470.0" y1="123.0" x2="525.0" y2="191.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="470.0" y1="281.0" x2="525.0" y2="219.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="571.0" y1="205.0" x2="640.0" y2="205.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="600.0" y="171.0" width="110.0" height="68.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">ВИСОТА:</tspan><tspan x="655.0" dy="14.3">гладка +</tspan><tspan x="655.0" dy="14.3">без дрейфу</tspan></text>
<rect x="300.0" y="350.0" width="380.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Частота зрізу ставить межу довіри: повільніше за неї віримо барометру (не дрейфує), швидше — акселерометру (не шумить). Точнісінько як крен = гіро+акселерометр, лише для вертикалі.</tspan></text>
</svg>