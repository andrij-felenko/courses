<text x="40.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f2328" text-anchor="start">Таблиця точок місії • Графіки телеметрії • Панелі налаштування PID-регуляторів</text>
