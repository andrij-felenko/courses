<text x="40.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f2328" text-anchor="start">Критичний статусний бар • Анонсатор режимів • Індикатори батареї та зв'язку • Постійна сітка</text>
