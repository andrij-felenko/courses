<rect x="10.0" y="10.0" width="820.0" height="430.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="700">АРХІТЕКТУРА ШАРІВ GUI: НЕЗМІННЕ ЗАКРІПЛЕННЯ СТАТУС-БАРУ</text>
<text x="420.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#656d76" text-anchor="middle">Ієрархія Z-order: критичний шар заблокований поверх будь-яких діалогів та вікон</text>
