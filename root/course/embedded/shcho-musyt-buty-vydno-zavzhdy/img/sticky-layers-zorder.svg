<text x="40.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f2328" text-anchor="start">Відеопотік з FPV-камери (1080p60) • Векторна карта рельєфу • Штучний горизонт PFD</text>
