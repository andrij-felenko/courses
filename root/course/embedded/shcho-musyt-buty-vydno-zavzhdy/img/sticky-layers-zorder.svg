<line x1="675.0" y1="130.0" x2="675.0" y2="85.0" stroke="#cf222e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="675.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#cf222e" text-anchor="middle" font-weight="700">Z-ORDER RENDER</text>
<rect x="25.0" y="390.0" width="790.0" height="32.0" rx="4" fill="#24292f" stroke="#1f2328" stroke-width="1.0"/>
<text x="420.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Заборона оклюзії: модальне вікно затемнює шар 1 і 0, але НІКОЛИ не накриває шар 3</text>
