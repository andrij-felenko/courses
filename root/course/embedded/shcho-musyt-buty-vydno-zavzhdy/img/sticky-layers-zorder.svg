<text x="40.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f2328" text-anchor="start">Спливаючі підтвердження («Slide to Arm») • Повідомлення про калібрування • Меню конфігурації</text>
