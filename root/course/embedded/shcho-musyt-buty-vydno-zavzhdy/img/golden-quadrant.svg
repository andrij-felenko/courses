<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="440.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="700">ЗОЛОТИЙ КВАДРАНТ КРИТИЧНОГО СТАТУСУ ОПЕРАТОРА</text>
<text x="420.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#656d76" text-anchor="middle">Чотири базові групи параметрів, які ніколи не зникають з поля зору</text>
<rect x="22.0" y="72.0" width="390.0" height="155.0" rx="6" fill="#f0f8ff" stroke="#0969da" stroke-width="1.8"/>
<rect x="22.0" y="72.0" width="390.0" height="30.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="37.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0969da" text-anchor="start" font-weight="700">1. ПРОСТОРОВИЙ СТАН (STATE)</text>
<text x="37.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="start"><tspan x="37.0" dy="0.0">• Просторове положення: крен, тангаж, рискання (Attitude)</tspan><tspan x="37.0" dy="15.4">• Швидкість: повітряна (IAS) та шляхова над ґрунтом (GS)</tspan><tspan x="37.0" dy="15.4">• Висота: абсолютна (Baro/AMSL) та над рельєфом (AGL)</tspan><tspan x="37.0" dy="15.4">• Вертикальна динаміка: швидкість підйому / спуску (VSI)</tspan></text>
<text x="37.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start" font-style="italic">Питання: «Де саме перебуває апарат і куди він рухається?»</text>
<rect x="428.0" y="72.0" width="390.0" height="155.0" rx="6" fill="#fcf8e3" stroke="#9a6700" stroke-width="1.8"/>
<rect x="428.0" y="72.0" width="390.0" height="30.0" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
<text x="443.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a6700" text-anchor="start" font-weight="700">2. РЕЖИМ КЕРУВАННЯ (MODE)</text>
<text x="443.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="start"><tspan x="443.0" dy="0.0">• Активний автопілотний режим: MANUAL / ALTHOLD / AUTO</tspan><tspan x="443.0" dy="15.4">• Стан виконавчої готовності: DISARMED / ARMED / EMERGENCY</tspan><tspan x="443.0" dy="15.4">• Джерело навігаційних уставок: RC / Місія / ШІ-супутник</tspan><tspan x="443.0" dy="15.4">• Фаза навігаційної задачі: Takeoff / Waypoint / Hold / RTL</tspan></text>
<text x="443.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start" font-style="italic">Питання: «Хто керує апаратом і яка логіка активна зараз?»</text>
<rect x="22.0" y="245.0" width="390.0" height="155.0" rx="6" fill="#fdf2f2" stroke="#cf222e" stroke-width="1.8"/>
<rect x="22.0" y="245.0" width="390.0" height="30.0" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/>
<text x="37.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#cf222e" text-anchor="start" font-weight="700">3. ЗДОРОВ'Я ПЛАТФОРМИ (HEALTH)</text>
<text x="37.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="start"><tspan x="37.0" dy="0.0">• Батарейна шина: напруга під навантаженням (V_bat), розкид</tspan><tspan x="37.0" dy="15.4">• Енергетика: струм споживання (I_load), витрачена ємність</tspan><tspan x="37.0" dy="15.4">• Тепловий стан: температура силових ключів (ESC), АКБ</tspan><tspan x="37.0" dy="15.4">• Бортові ресурси: навантаження MCU/CPU (%), вільна пам'ять</tspan></text>
<text x="37.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start" font-style="italic">Питання: «Скільки енергії та робочого ресурсу лишилося?»</text>
<rect x="428.0" y="245.0" width="390.0" height="155.0" rx="6" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.8"/>
<rect x="428.0" y="245.0" width="390.0" height="30.0" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="443.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a7f37" text-anchor="start" font-weight="700">4. СТАН КАНАЛІВ ЗВ'ЯЗКУ (LINK)</text>
<text x="443.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="start"><tspan x="443.0" dy="0.0">• Енергетика радіолінка: рівень RSSI (дБм), співвідношення SNR</tspan><tspan x="443.0" dy="15.4">• Якість потоку пакетів: Link Quality (LQ %) у ковзному вікні</tspan><tspan x="443.0" dy="15.4">• Кругова затримка зв'язку: Round-Trip Time (RTT, мс)</tspan><tspan x="443.0" dy="15.4">• Вік останнього кадру: Packet Age / Staleness (мс / с)</tspan></text>
<text x="443.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start" font-style="italic">Питання: «Чи актуальні дані й чи пройде керівна команда?»</text>
<rect x="319.9" y="215.3" width="200.1" height="41.3" rx="6" fill="#24292f" stroke="#1f2328" stroke-width="1.5"/><text x="420.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">СИТУАЦІЙНА ОБІЗНАНІСТЬ</tspan><tspan x="420.0" dy="14.3">(100% фіксовані координати)</tspan></text>
<rect x="22.0" y="418.0" width="796.0" height="26.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.0"/>
<text x="420.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#24292f" text-anchor="middle" font-weight="700">Правило: жоден параметр із цих чотирьох груп не може бути прихований чи заміщений</text>
</svg>