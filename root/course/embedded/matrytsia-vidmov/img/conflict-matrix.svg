<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія та матриця розв'язання конфліктів одночасних відмов</text>
<text x="230.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія пріоритетів безпеки</text>
<rect x="80.2" y="85.2" width="299.6" height="59.6" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="2.0"/><text x="230.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">РІВЕНЬ 1 (Найвищий): Безпека людей</tspan><tspan x="230.0" dy="14.3">Запобігання некерованому падінню в натовп</tspan><tspan x="230.0" dy="14.3">Дія: Негайний Disarm / Викид парашута</tspan></text>
<rect x="73.4" y="165.2" width="313.3" height="59.6" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.8"/><text x="230.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">РІВЕНЬ 2: Межі дозволеного простору</tspan><tspan x="230.0" dy="14.3">Порушення Geofence (периметр / стеля)</tspan><tspan x="230.0" dy="14.3">Дія: Зупинка біля кордону / Примусовий Land</tspan></text>
<rect x="70.0" y="245.2" width="320.1" height="59.6" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.8"/><text x="230.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">РІВЕНЬ 3: Енергетична невідворотність</tspan><tspan x="230.0" dy="14.3">Критична напруга акумулятора (Batt Critical)</tspan><tspan x="230.0" dy="14.3">Дія: Термінова вертикальна посадка Land</tspan></text>
<rect x="76.8" y="325.2" width="306.4" height="59.6" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.8"/><text x="230.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">РІВЕНЬ 4: Навігаційна достовірність</tspan><tspan x="230.0" dy="14.3">Втрата / глушіння / спуфінг GNSS</tspan><tspan x="230.0" dy="14.3">Дія: Спуск в AltHold або оптичне утримання</tspan></text>
<rect x="80.2" y="405.2" width="299.6" height="59.6" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.8"/><text x="230.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">РІВЕНЬ 5: Канал зв'язку оператора</tspan><tspan x="230.0" dy="14.3">Втрата RC або телеметрії GCS</tspan><tspan x="230.0" dy="14.3">Дія: Автономний RTL або продовження місії</tspan></text>
<text x="710.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розв'язання конфліктів одночасних відмов</text>
<rect x="480.0" y="97.2" width="460.0" height="55.6" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Комбінація: Втрата зв'язку (RC Loss) + Втрата супутників (GNSS Glitch)</tspan><tspan x="710.0" dy="14.3">Конфлікт: RTL вимагає навігації, але координати недостовірні</tspan><tspan x="710.0" dy="14.3">Арбітраж: Заборона RTL -&gt; Перехід у Land або AltHold спуск</tspan></text>
<rect x="480.0" y="189.2" width="460.0" height="55.6" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="710.0" y="206.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Комбінація: Втрата зв'язку (RC Loss) + Критична батарея (Batt Crit)</tspan><tspan x="710.0" dy="14.3">Конфлікт: Часу дольоту до Home більше, ніж запасу енергії комірок</tspan><tspan x="710.0" dy="14.3">Арбітраж: Скасування RTL -&gt; Негайна вертикальна посадка на місці</tspan></text>
<rect x="480.0" y="281.2" width="460.0" height="55.6" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="710.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Комбінація: Вихід за Geofence + Втрата зв'язку (RC Loss)</tspan><tspan x="710.0" dy="14.3">Конфлікт: RTL летить через заборонену зону / продовжує виліт</tspan><tspan x="710.0" dy="14.3">Арбітраж: Пріоритет Geofence -&gt; Гальмування на межі та посадка</tspan></text>
<rect x="480.0" y="373.2" width="460.0" height="55.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="390.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Комбінація: Відмова 1 мотора (Гексакоптер) + Спуфінг GNSS</tspan><tspan x="710.0" dy="14.3">Конфлікт: Обмежена тяга та відсутність зовнішньої позиції</tspan><tspan x="710.0" dy="14.3">Арбітраж: Деградація кутів нахилу + Екстрений спуск на тязі 5 моторів</tspan></text>
</svg>