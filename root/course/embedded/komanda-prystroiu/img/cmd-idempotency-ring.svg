<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий буфер ідемпотентності: дедуплікація та кешування відповідей</text>
<rect x="35.0" y="140.0" width="200.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="135.0" y="162.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Вхідний пакет команди:</tspan><tspan x="135.0" dy="13.0">• Command: RELAY_ON</tspan><tspan x="135.0" dy="13.0">• Token: 0x8F3A2B1C</tspan><tspan x="135.0" dy="13.0">• Nonce: 1042</tspan><tspan x="135.0" dy="13.0">• TTL: 30 s</tspan></text>
<line x1="240.0" y1="185.0" x2="305.0" y2="185.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="240.0" y="145.0" width="80.0" height="28.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="280.0" y="156.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Пошук токена</tspan><tspan x="280.0" dy="11.7">в кеші</tspan></text>
<rect x="310.0" y="65.0" width="250.0" height="250.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="435.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий буфер ідемпотентності</text>
<text x="435.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Idempotency Ring Buffer / RAM)</text>
<rect x="320.0" y="120.0" width="230.0" height="30.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.5"/><text x="435.0" y="138.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">[0] Tok: 0x11A204BF → DONE (OK)</tspan></text>
<rect x="320.0" y="158.0" width="230.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="435.0" y="176.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">[1] Tok: 0x8F3A2B1C → DONE (OK) ★</tspan></text>
<rect x="320.0" y="196.0" width="230.0" height="30.0" rx="6" fill="#f8f9fa" stroke="#2457d6" stroke-width="1.5"/><text x="435.0" y="214.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">[2] Tok: 0x4C99E012 → EXECUTING</tspan></text>
<rect x="320.0" y="234.0" width="230.0" height="30.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.5"/><text x="435.0" y="252.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">[3] Tok: 0x00000000 → FREE</tspan></text>
<text x="435.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вказівник перезапису: найстаріший слот</text>
<line x1="565.0" y1="160.0" x2="645.0" y2="110.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="65.0" width="195.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="747.5" y="89.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="747.5" dy="0.0">ТОКЕН ЗНАЙДЕНО (Дублікат):</tspan><tspan x="747.5" dy="11.7">1. Залізо НЕ чіпаємо!</tspan><tspan x="747.5" dy="11.7">(реле не смикається вдруге)</tspan><tspan x="747.5" dy="11.7">2. Миттєво повертаємо збережену</tspan><tspan x="747.5" dy="11.7">відповідь: ACK_COMPLETED</tspan></text>
<line x1="565.0" y1="205.0" x2="645.0" y2="255.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="210.0" width="195.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="747.5" y="228.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="747.5" dy="0.0">НОВИЙ ТОКЕН:</tspan><tspan x="747.5" dy="11.7">1. Запис токена в слот буфера</tspan><tspan x="747.5" dy="11.7">2. Стан = EXECUTING</tspan><tspan x="747.5" dy="11.7">3. Фізичне спрацювання реле</tspan><tspan x="747.5" dy="11.7">4. Оновлення стану = DONE</tspan><tspan x="747.5" dy="11.7">5. Відправка ACK_COMPLETED</tspan></text>
<rect x="35.0" y="345.0" width="790.0" height="110.0" rx="8" fill="#fcfcfc" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від накопичення та розмноження побічних ефектів</text>
<rect x="50.0" y="385.0" width="365.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="232.5" y="404.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">Неідемпотентна дія («Змінити стан на протилежний»)</tspan><tspan x="232.5" dy="13.0">Без токена: реле вмикається і вимикається 5 разів</tspan><tspan x="232.5" dy="13.0">через мережеві ретраї при поганому радіозв'язку.</tspan></text>
<rect x="430.0" y="385.0" width="380.0" height="58.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="404.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Ідемпотентна дія («Увімкнути з токеном 0x8F3A2B1C»)</tspan><tspan x="620.0" dy="13.0">З токеном: реле спрацьовує РІВНО ОДИН РАЗ.</tspan><tspan x="620.0" dy="13.0">Усі 4 дублікати повертають успіх з кешу без повторного удару.</tspan></text>
</svg>