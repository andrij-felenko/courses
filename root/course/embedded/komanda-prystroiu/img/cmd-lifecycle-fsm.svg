<line x1="483.0" y1="145.0" x2="522.0" y2="145.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="42.0" width="260.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="570.0" y="59.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Фаза 1: ACK_RECEIVED (Квиток прийому)</tspan><tspan x="570.0" dy="13.0">Перевірено CRC, підпис, токен і TTL</tspan></text>
<line x1="595.0" y1="115.0" x2="560.0" y2="85.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="525.0" y="117.0" width="140.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="595.0" y="136.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">EXECUTING</tspan><tspan x="595.0" dy="11.7">Виконується залізом</tspan><tspan x="595.0" dy="11.7">(мотор, реле, сенсор)</tspan></text>
<line x1="668.0" y1="135.0" x2="692.0" y2="85.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="695.0" y="47.0" width="140.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="65.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">SUCCEEDED</tspan><tspan x="765.0" dy="13.0">Успішно завершено</tspan><tspan x="765.0" dy="13.0">(ACK_COMPLETED)</tspan></text>
