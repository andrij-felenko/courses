<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат станів команди та архітектура двофазного квитування</text>
<rect x="50.0" y="117.0" width="120.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="110.0" y="136.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">CREATED</tspan><tspan x="110.0" dy="11.7">Створено сервером</tspan><tspan x="110.0" dy="11.7">(UUID, Token, TTL)</tspan></text>
<line x1="173.0" y1="145.0" x2="202.0" y2="145.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
