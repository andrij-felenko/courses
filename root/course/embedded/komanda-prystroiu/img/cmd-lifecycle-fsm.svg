<line x1="595.0" y1="175.0" x2="690.0" y2="290.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530.0" y="245.0" width="180.0" height="26.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="261.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Перевищено таймаут виконання</tspan></text>
<rect x="40.0" y="375.0" width="780.0" height="105.0" rx="8" fill="#fcfcfc" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двофазне квитування: чітке розмежування обов'язків</text>
<rect x="55.0" y="410.0" width="360.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="429.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Фаза 1: ACK прийняття (транспортна гарантія)</tspan><tspan x="235.0" dy="13.0">• Захищає сервер від повторних перевідправок у мережу</tspan><tspan x="235.0" dy="13.0">• Підтверджує, що пристрій живий і зафіксував токен</tspan></text>
<rect x="430.0" y="410.0" width="375.0" height="58.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="617.5" y="429.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="617.5" dy="0.0">Фаза 2: ACK результату (фізична гарантія)</tspan><tspan x="617.5" dy="13.0">• Передає статус кінцевиків, виміряні величини або код аварії</tspan><tspan x="617.5" dy="13.0">• Дозволяє бізнес-логіці оновити актуальний стан у хмарі</tspan></text>
