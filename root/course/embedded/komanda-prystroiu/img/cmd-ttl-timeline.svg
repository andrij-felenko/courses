<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова лінія перевірки строку дії (TTL) та блокування застарілих сигналів керування</text>
<line x1="80.0" y1="70.0" x2="780.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="770.0" y1="70.0" x2="790.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="780.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Час (t)</text>
<line x1="100.0" y1="62.0" x2="100.0" y2="78.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="100.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₀ = 0 с</text>
<rect x="20.0" y="110.0" width="160.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="100.0" y="127.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">Створення команди</tspan><tspan x="100.0" dy="11.7">(TTL = 30 с, дедлайн t₀+30)</tspan></text>
<line x1="310.0" y1="62.0" x2="310.0" y2="78.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="310.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₁ = 10 с</text>
<rect x="230.0" y="110.0" width="160.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="310.0" y="127.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Прийом пристроєм</tspan><tspan x="310.0" dy="11.7">(Залишок TTL = 20 с &gt; 0 → OK)</tspan></text>
<line x1="530.0" y1="62.0" x2="530.0" y2="78.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="530.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₂ = 30 с</text>
<rect x="450.0" y="110.0" width="160.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="127.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">МЕЖА TTL (Дедлайн)</tspan><tspan x="530.0" dy="11.7">Після цього — заборона дії</tspan></text>
<line x1="720.0" y1="62.0" x2="720.0" y2="78.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="720.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₃ = 45 с</text>
<rect x="640.0" y="110.0" width="160.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="127.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Запізніле пробудження</tspan><tspan x="720.0" dy="11.7">(TTL вичерпано → DROP)</tspan></text>
<rect x="50.0" y="175.0" width="760.0" height="110.0" rx="8" fill="#f4faf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="170.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сценарій А: Виконання в межах TTL</text>
<line x1="310.0" y1="225.0" x2="480.0" y2="225.0" stroke="#27ae60" stroke-width="6.0"/>
<rect x="310.0" y="240.0" width="170.0" height="28.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="395.0" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">Виконання: 10 с ... 18 с (&lt; 30 с)</tspan></text>
<rect x="500.0" y="215.0" width="200.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="230.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">РЕЗУЛЬТАТ: УСПІХ</tspan><tspan x="600.0" dy="13.0">Клапан відкрито вчасно,</tspan><tspan x="600.0" dy="13.0">ACK_COMPLETED відправлено</tspan></text>
<rect x="50.0" y="305.0" width="760.0" height="115.0" rx="8" fill="#fff7f7" stroke="#c0392b" stroke-width="1.5"/>
<text x="190.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій Б: Скасування застарілої команди</text>
<line x1="310.0" y1="355.0" x2="720.0" y2="355.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4 4"/>
<rect x="310.0" y="370.0" width="200.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="385.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Затримка в радіомережі / сон МК</tspan><tspan x="410.0" dy="11.7">(спроба старту на t₃ = 45 с)</tspan></text>
<rect x="530.0" y="350.0" width="260.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="367.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">РЕЗУЛЬТАТ: ВІДХИЛЕНО (EXPIRED)</tspan><tspan x="660.0" dy="11.7">Перевірка: Now(45 с) &gt; Deadline(30 с)!</tspan><tspan x="660.0" dy="11.7">Фізичну дію заблоковано, емітовано ACK_EXPIRED</tspan></text>
</svg>