<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мережеві аномалії: втрата квитків, сон пристрою та розрив між транспортом і залізом</text>
<rect x="20.0" y="45.0" width="260.0" height="36.0" rx="6" fill="#fcfcfc" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="67.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Втрата зворотного квитка</tspan></text>
<rect x="300.0" y="45.0" width="260.0" height="36.0" rx="6" fill="#fcfcfc" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="67.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">2. Залп черги після сну</tspan></text>
<rect x="580.0" y="45.0" width="260.0" height="36.0" rx="6" fill="#fcfcfc" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="67.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">3. Транспортний ≠ Бізнес ACK</tspan></text>
<line x1="70.0" y1="100.0" x2="70.0" y2="440.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="230.0" y1="100.0" x2="230.0" y2="440.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="70.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер</text>
<text x="230.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пристрій</text>
<line x1="70.0" y1="130.0" x2="230.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="80.0" y="125.0" width="140.0" height="24.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="150.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Команда 1: «Увімкнути»</tspan></text>
<rect x="175.0" y="165.0" width="105.0" height="26.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="227.5" y="181.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="227.5" dy="0.0">Реле: КЛІК (УВІМК)</tspan></text>
<line x1="230.0" y1="205.0" x2="130.0" y2="220.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="95.0" y="215.0" width="75.0" height="22.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="132.5" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="132.5" dy="0.0">ACK втрачено</tspan></text>
<line x1="125.0" y1="215.0" x2="135.0" y2="225.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="135.0" y1="215.0" x2="125.0" y2="225.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="40.0" y="250.0" width="115.0" height="26.0" rx="6" fill="#fff3f0" stroke="#c0392b" stroke-width="1.5"/><text x="97.5" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="97.5" dy="0.0">Таймаут сервера 5 с</tspan></text>
<line x1="70.0" y1="290.0" x2="230.0" y2="310.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="80.0" y="285.0" width="140.0" height="24.0" rx="6" fill="#fff3f0" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="293.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Повтор: «Увімкнути»</tspan></text>
<rect x="150.0" y="335.0" width="145.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="222.5" y="351.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="222.5" dy="0.0">Без токена: повторний КЛІК</tspan><tspan x="222.5" dy="11.7">(руйнівний дублікат!)</tspan></text>
<rect x="150.0" y="388.0" width="145.0" height="38.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="222.5" y="404.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="222.5" dy="0.0">З токеном: КЛІК пропущено,</tspan><tspan x="222.5" dy="11.7">повторено збережений ACK</tspan></text>
<rect x="310.0" y="100.0" width="240.0" height="38.0" rx="6" fill="#f0f2f5" stroke="#6b7280" stroke-width="1.5"/><text x="430.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Пристрій у глибокому сні</tspan><tspan x="430.0" dy="13.0">(Wi-Fi / NB-IoT / LoRaWAN)</tspan></text>
<rect x="310.0" y="150.0" width="240.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="167.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Черга брокера / шлюзу:</tspan><tspan x="430.0" dy="13.0">1. 10:00 — «Відкрити клапан»</tspan><tspan x="430.0" dy="13.0">2. 10:05 — «Закрити клапан»</tspan><tspan x="430.0" dy="13.0">3. 10:15 — «Відкрити на 50%»</tspan><tspan x="430.0" dy="13.0">4. 10:40 — «АВАРІЙНИЙ СТОП»</tspan></text>
<line x1="430.0" y1="240.0" x2="430.0" y2="275.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="285.0" width="220.0" height="28.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="302.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Пробудження: залп 4 команд!</tspan></text>
<rect x="310.0" y="330.0" width="240.0" height="95.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Без перевірки TTL:</tspan><tspan x="430.0" dy="13.0">виконання всіх 4 застарілих дій</tspan><tspan x="430.0" dy="13.0">(клапан смикається туди-сюди!)</tspan><tspan x="430.0" dy="13.0"></tspan><tspan x="430.0" dy="13.0">З перевіркою TTL:</tspan><tspan x="430.0" dy="13.0">команди 1–3 прострочено (DROP),</tspan><tspan x="430.0" dy="13.0">виконується лише аварійний стоп</tspan></text>
<rect x="580.0" y="100.0" width="260.0" height="52.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="710.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Клієнт шле команду в MQTT / HTTP</tspan><tspan x="710.0" dy="13.0">`POST /api/v1/device/door/open`</tspan><tspan x="710.0" dy="13.0">(рівень транспорту: QoS 1 / TCP)</tspan></text>
<line x1="710.0" y1="160.0" x2="710.0" y2="190.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="580.0" y="200.0" width="260.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="710.0" y="214.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Транспортний ACK (PUBACK / 200 OK):</tspan><tspan x="710.0" dy="13.0">«Пакет осів у буфері брокера»</tspan><tspan x="710.0" dy="13.0">(залізо ще навіть не знає про нього!)</tspan></text>
<line x1="710.0" y1="255.0" x2="710.0" y2="285.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="580.0" y="295.0" width="260.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="311.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Етап 1: Квиток отримання (Phase 1 ACK)</tspan><tspan x="710.0" dy="13.0">«Пристрій розібрав команду,</tspan><tspan x="710.0" dy="13.0">перевірив TTL і взяв у чергу»</tspan></text>
<line x1="710.0" y1="355.0" x2="710.0" y2="385.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="580.0" y="395.0" width="260.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="411.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Етап 2: Квиток виконання (Phase 2 ACK)</tspan><tspan x="710.0" dy="13.0">«Кінцевик спрацював, мотор спинено,</tspan><tspan x="710.0" dy="13.0">результат: SUCCESS (або FAULT)»</tspan></text>
</svg>