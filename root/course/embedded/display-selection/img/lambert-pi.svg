<rect x="469.8" y="289.2" width="260.4" height="29.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="600.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">два cos θ скорочуються ⇒ L = стала</tspan></text>
<text x="410.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">весь відбитий потік ρ·E збирається в π·I₀ — тому яскравість відблиску дорівнює ρ·E/π</text>
