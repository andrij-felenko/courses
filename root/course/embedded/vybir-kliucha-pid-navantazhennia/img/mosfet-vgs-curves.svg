<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Залежність опору R_ds(on) від напруги затвора V_gs</text>
<line x1="80.0" y1="280.0" x2="460.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="80.0" y1="280.0" x2="80.0" y2="60.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="455.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">V_gs (В)</text>
<text x="65.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700" font-style="italic">R_ds(on)</text>
<polyline points="110,90 130,100 150,130 170,180 200,235 240,258 320,266 440,270" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<line x1="140.0" y1="280.0" x2="140.0" y2="90.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="140.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">V_gs(th) (1.5–2 В)</text>
<rect x="208.4" y="91.0" width="143.1" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="280.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Пастка V_gs(th)!</tspan><tspan x="280.0" dy="13.0">Струм I_d лише 250 мкА!</tspan><tspan x="280.0" dy="13.0">Транзистор ЩЕ ЗАКРИТИЙ</tspan></text>
<line x1="220.0" y1="115.0" x2="145.0" y2="130.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="220.0" y1="280.0" x2="220.0" y2="90.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="220.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">3.3 В (МК)</text>
<circle cx="220.0" cy="247.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="248.0" y="193.5" width="124.0" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="310.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Logic-Level FET:</tspan><tspan x="310.0" dy="13.0">R_ds(on) мінімальний</tspan></text>
<line x1="255.0" y1="210.0" x2="224.0" y2="245.0" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="400.0" y1="280.0" x2="400.0" y2="90.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="400.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">10 В (Драйвер)</text>
<circle cx="400.0" cy="269.0" r="4.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<rect x="466.2" y="86.0" width="337.5" height="178.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="635.0" y="107.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">ПРАВИЛО ВИБОРУ ПОЛЬОВОГО ТРАНЗИСТОРА:</tspan><tspan x="635.0" dy="14.3"></tspan><tspan x="635.0" dy="14.3">• Звичайний MOSFET (IRFZ44N, IRF540):</tspan><tspan x="635.0" dy="14.3">  - V_gs(th) = 2..4 В</tspan><tspan x="635.0" dy="14.3">  - Повне відкриття лише при V_gs = 10 В!</tspan><tspan x="635.0" dy="14.3">  - Від 3.3 В ледь прочиняється → перегрів.</tspan><tspan x="635.0" dy="14.3"></tspan><tspan x="635.0" dy="14.3">• Logic-Level MOSFET (IRLZ44N, AO3400):</tspan><tspan x="635.0" dy="14.3">  - Гарантований R_ds(on) при V_gs = 2.5–3.3 В</tspan><tspan x="635.0" dy="14.3">  - Втрати провідності: P = I_d² × R_ds(on)</tspan><tspan x="635.0" dy="14.3">  - Наприклад: 5 А при 0.02 Ом = 0.5 Вт (холодний)</tspan></text>
<text x="420.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ніколи не вибирайте транзистор за V_gs(th) — дивіться графік R_ds(on) при напрузі вашого GPIO (3.3 В)</text>
</svg>