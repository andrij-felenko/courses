<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 371.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="371.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист ключа від індуктивного викиду зворотної ЕРС за допомогою діода</text>
<line x1="420.0" y1="45.0" x2="420.0" y2="335.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="210.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. БЕЗ захисного діода (АВАРІЯ)</text>
<rect x="30.0" y="112.0" width="360.0" height="186.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">+ VCC (12 В)</tspan><tspan x="210.0" dy="13.0">    │</tspan><tspan x="210.0" dy="13.0"> [ КОТУШКА (L) ]  → Струм розривається!</tspan><tspan x="210.0" dy="13.0">    │</tspan><tspan x="210.0" dy="13.0"> [ КЛЮЧ: РОЗМИКАЄТЬСЯ ]</tspan><tspan x="210.0" dy="13.0">    │</tspan><tspan x="210.0" dy="13.0">   GND</tspan><tspan x="210.0" dy="13.0"></tspan><tspan x="210.0" dy="13.0">ФІЗИКА ПРОЦЕСУ:</tspan><tspan x="210.0" dy="13.0">• Закон Фарадея: e = −L × (di/dt)</tspan><tspan x="210.0" dy="13.0">• di/dt прямує до нескінченності за мікросекунди</tspan><tspan x="210.0" dy="13.0">• Напруга на колекторі/стоку стрибає до +200..1000 В!</tspan><tspan x="210.0" dy="13.0">• РЕЗУЛЬТАТ: Миттєвий лавинний пробій і смерть ключа</tspan></text>
<text x="630.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2. Зі зворотним діодом (Flyback Diode)</text>
<rect x="450.0" y="105.5" width="360.0" height="199.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">+ VCC (12 В) ───┐</tspan><tspan x="630.0" dy="13.0">    │           │ (Катод діода до +)</tspan><tspan x="630.0" dy="13.0"> [ КОТУШКА ]  [ ДІОД ШОТТКІ ] ↺ Струм циркулює</tspan><tspan x="630.0" dy="13.0">    │           │ (Анод діода до стоку)</tspan><tspan x="630.0" dy="13.0">    ├───────────┘</tspan><tspan x="630.0" dy="13.0"> [ КЛЮЧ: ВИМКНЕНО ]</tspan><tspan x="630.0" dy="13.0">    │</tspan><tspan x="630.0" dy="13.0">   GND</tspan><tspan x="630.0" dy="13.0"></tspan><tspan x="630.0" dy="13.0">ЯК ПРАЦЮЄ ЗАХИСТ:</tspan><tspan x="630.0" dy="13.0">• Діод відмикається самоіндукцією: V_drain = VCC + 0.4 В</tspan><tspan x="630.0" dy="13.0">• Енергія магнітного поля E = 0.5 × L × I²</tspan><tspan x="630.0" dy="13.0">  безпечно розсіюється на активному опорі котушки</tspan><tspan x="630.0" dy="13.0">• Ключ бачить лише напругу живлення + спад на діоді</tspan></text>
<text x="420.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Діод паралельно індуктивному навантаженню — обов'язковий елемент схеми для будь-якого реле, клапана чи мотора</text>
</svg>