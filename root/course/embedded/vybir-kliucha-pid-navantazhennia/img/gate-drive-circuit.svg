<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 353.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="353.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обов'язкова обв'язка затвора MOSFET: резистори R_gate та R_pull</text>
<rect x="50.0" y="130.2" width="120.0" height="59.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">GPIO МК</tspan><tspan x="110.0" dy="14.3">(0 / 3.3 В)</tspan><tspan x="110.0" dy="14.3">C_out ≈ 5 пФ</tspan></text>
<line x1="170.0" y1="160.0" x2="230.0" y2="160.0" stroke="#333333" stroke-width="2.0"/>
<rect x="240.5" y="142.5" width="69.0" height="35.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="275.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">R_gate</tspan><tspan x="275.0" dy="13.0">(22–100 Ω)</tspan></text>
<line x1="320.0" y1="160.0" x2="420.0" y2="160.0" stroke="#333333" stroke-width="2.0"/>
<circle cx="370.0" cy="160.0" r="3.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="370.0" y1="160.0" x2="370.0" y2="210.0" stroke="#333333" stroke-width="1.8"/>
<rect x="307.0" y="221.0" width="126.0" height="48.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="370.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">R_pull (10–100 кОм)</tspan><tspan x="370.0" dy="13.0">Стягує затвор на GND</tspan><tspan x="370.0" dy="13.0">під час Reset / Hi-Z</tspan></text>
<line x1="370.0" y1="280.0" x2="370.0" y2="305.0" stroke="#333333" stroke-width="1.8"/>
<line x1="355.0" y1="305.0" x2="385.0" y2="305.0" stroke="#333333" stroke-width="2.0"/>
<line x1="360.0" y1="309.0" x2="380.0" y2="309.0" stroke="#333333" stroke-width="1.5"/>
<line x1="365.0" y1="313.0" x2="375.0" y2="313.0" stroke="#333333" stroke-width="1.2"/>
<rect x="454.2" y="123.0" width="151.7" height="73.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">N-MOSFET</tspan><tspan x="530.0" dy="14.3">Logic-Level</tspan><tspan x="530.0" dy="14.3">(C_iss = C_gs + C_gd)</tspan><tspan x="530.0" dy="14.3">Затвор = конденсатор</tspan></text>
<line x1="420.0" y1="160.0" x2="460.0" y2="160.0" stroke="#333333" stroke-width="2.0"/>
<rect x="144.5" y="42.5" width="261.1" height="65.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.2"/><text x="275.0" y="59.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">НАВІЩО R_gate:</tspan><tspan x="275.0" dy="13.0">1. Обмежує піковий струм заряду C_iss</tspan><tspan x="275.0" dy="13.0">   (захищає GPIO від імпульсу &gt; 100 мА)</tspan><tspan x="275.0" dy="13.0">2. Гасить LC-дзвін паразитної індуктивності</tspan></text>
<line x1="275.0" y1="115.0" x2="275.0" y2="135.0" stroke="#b8860b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="600.0" y1="130.0" x2="680.0" y2="130.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="690.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">До навантаження (Drain)</text>
<line x1="600.0" y1="190.0" x2="680.0" y2="190.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="690.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">GND (Source)</text>
<text x="420.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Затвор не споживає постійного струму, але є ємнісним навантаженням під час кожного фронту перемикання</text>
</svg>