<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 371.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="371.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння топологій комутації: Low-Side проти High-Side</text>
<line x1="420.0" y1="45.0" x2="420.0" y2="335.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="210.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">LOW-SIDE КЛЮЧ (Комутація по GND)</text>
<rect x="30.0" y="92.5" width="360.0" height="225.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.4"/><text x="210.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">+ V_supply (наприклад, 12 В)</tspan><tspan x="210.0" dy="13.0">    │</tspan><tspan x="210.0" dy="13.0"> [ НАВАНТАЖЕННЯ ]</tspan><tspan x="210.0" dy="13.0">    │  ← «Плаваюча» точка!</tspan><tspan x="210.0" dy="13.0"> [ N-MOSFET ]</tspan><tspan x="210.0" dy="13.0">    │</tspan><tspan x="210.0" dy="13.0">   GND</tspan><tspan x="210.0" dy="13.0"></tspan><tspan x="210.0" dy="13.0">ПЕРЕВАГИ:</tspan><tspan x="210.0" dy="13.0">• Просте пряме керування від 3.3 В GPIO</tspan><tspan x="210.0" dy="13.0">• Дешеві n-канальні транзистори з низьким R_ds</tspan><tspan x="210.0" dy="13.0"></tspan><tspan x="210.0" dy="13.0">НЕДОЛІКИ ТА НЕБЕЗПЕКИ:</tspan><tspan x="210.0" dy="13.0">• Навантаження завжди під плюсовим потенціалом!</tspan><tspan x="210.0" dy="13.0">• Замикання дроту навантаження на корпус (GND)</tspan><tspan x="210.0" dy="13.0">  вмикає навантаження НАЗАВЖДИ без відома МК!</tspan></text>
<text x="630.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">HIGH-SIDE КЛЮЧ (Комутація по VCC)</text>
<rect x="450.0" y="92.5" width="360.0" height="225.0" rx="6" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.4"/><text x="630.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">+ V_supply (12 В)</tspan><tspan x="630.0" dy="13.0">    │</tspan><tspan x="630.0" dy="13.0"> [ P-MOSFET / Smart Switch ]</tspan><tspan x="630.0" dy="13.0">    │  ← Відключається плюс живлення</tspan><tspan x="630.0" dy="13.0"> [ НАВАНТАЖЕННЯ ]</tspan><tspan x="630.0" dy="13.0">    │</tspan><tspan x="630.0" dy="13.0">   GND (Твердий спільний корпус)</tspan><tspan x="630.0" dy="13.0"></tspan><tspan x="630.0" dy="13.0">ПЕРЕВАГИ:</tspan><tspan x="630.0" dy="13.0">• Повна безпека: вимкнений прилад знеструмлений</tspan><tspan x="630.0" dy="13.0">• Замикання на корпус викликає КЗ джерела,</tspan><tspan x="630.0" dy="13.0">  а не аварійний самовільний запуск приводу</tspan><tspan x="630.0" dy="13.0"></tspan><tspan x="630.0" dy="13.0">СКЛАДНІСТЬ:</tspan><tspan x="630.0" dy="13.0">• P-MOSFET потребує проміжного NPN-транзистора</tspan><tspan x="630.0" dy="13.0">  для зсуву логічного рівня 3.3 В → 12 В</tspan></text>
<text x="420.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">В автопромі та промислових приводах стандартом безпеки є комутація верхнього плеча (High-Side)</text>
</svg>