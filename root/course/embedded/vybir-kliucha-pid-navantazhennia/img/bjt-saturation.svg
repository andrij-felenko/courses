<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 371.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="371.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Робота BJT у режимі ключа: вимушене насичення (h_FE_sat = 10..20)</text>
<line x1="80.0" y1="290.0" x2="460.0" y2="290.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="80.0" y1="290.0" x2="80.0" y2="50.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="455.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">V_ce (В)</text>
<text x="65.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700" font-style="italic">I_c</text>
<polyline points="80,290 105,263.0 140,260 440,258.5" fill="none" stroke="#333333" stroke-width="1.8"/>
<polyline points="80,290 105,227.0 140,220 440,216.5" fill="none" stroke="#333333" stroke-width="1.8"/>
<polyline points="80,290 105,182.0 140,170 440,164.0" fill="none" stroke="#333333" stroke-width="1.8"/>
<polyline points="80,290 105,137.0 140,120 440,111.5" fill="none" stroke="#333333" stroke-width="1.8"/>
<rect x="80.0" y="70.0" width="45.0" height="220.0" rx="0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<line x1="125.0" y1="290.0" x2="125.0" y2="70.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="102.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Насичення</text>
<text x="135.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">V_ce_sat ≈ 0.2 В</text>
<rect x="209.4" y="144.0" width="181.3" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="300.0" y="167.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Активний (лінійний) режим</tspan><tspan x="300.0" dy="13.0">I_c = h_FE × I_b</tspan><tspan x="300.0" dy="13.0">Ключ напіввідкритий → кипить!</tspan></text>
<rect x="475.7" y="71.7" width="318.7" height="206.6" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/><text x="635.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">РОЗРАХУНОК БАЗОВОГО РЕЗИСТОРА:</tspan><tspan x="635.0" dy="14.3"></tspan><tspan x="635.0" dy="14.3">1. Паспортний h_FE (100–300) — для підсилювача!</tspan><tspan x="635.0" dy="14.3">2. Для надійного КЛЮЧА беруть h_FE_sat = 10..20</tspan><tspan x="635.0" dy="14.3">3. Необхідний струм бази:</tspan><tspan x="635.0" dy="14.3">   I_b = I_load / h_FE_sat</tspan><tspan x="635.0" dy="14.3"></tspan><tspan x="635.0" dy="14.3">4. Базовий резистор R_b:</tspan><tspan x="635.0" dy="14.3">   R_b = (V_gpio − V_be) / I_b</tspan><tspan x="635.0" dy="14.3">   де V_be ≈ 0.7 В для кремнію</tspan><tspan x="635.0" dy="14.3"></tspan><tspan x="635.0" dy="14.3">5. Втрати потужності ключа:</tspan><tspan x="635.0" dy="14.3">   P_loss = (V_ce_sat × I_c) + (V_be × I_b)</tspan></text>
<text x="420.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Без надлишкового струму бази транзистор залишається в активному режимі та розсіює надлишкове тепло</text>
</svg>