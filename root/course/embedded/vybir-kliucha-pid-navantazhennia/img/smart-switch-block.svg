<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 371.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="371.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура інтелектуального силового ключа (Smart Power Switch)</text>
<rect x="60.0" y="45.0" width="720.0" height="275.0" rx="10" fill="#f8fafc" stroke="#333333" stroke-width="2.0"/>
<text x="420.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Smart High-Side Switch (PROFET / High-Side Power Switch)</text>
<rect x="90.0" y="109.0" width="120.0" height="22.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.2"/><text x="150.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">IN (GPIO 3.3 В)</tspan></text>
<rect x="75.6" y="222.5" width="148.8" height="35.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.2"/><text x="150.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">IS / CS (Струм / Статус)</tspan><tspan x="150.0" dy="13.0">До АЦП мікроконтролера</tspan></text>
<rect x="270.0" y="96.0" width="140.0" height="48.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.2"/><text x="340.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Charge Pump</tspan><tspan x="340.0" dy="13.0">(Помпа заряду)</tspan><tspan x="340.0" dy="13.0">V_gate = V_bat + 10 В</tspan></text>
<rect x="259.9" y="164.5" width="160.2" height="61.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="340.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Блок захисту:</tspan><tspan x="340.0" dy="13.0">• Обмеження струму (КЗ)</tspan><tspan x="340.0" dy="13.0">• Тепловий захист (150°C)</tspan><tspan x="340.0" dy="13.0">• Захист від зникнення GND</tspan></text>
<rect x="262.8" y="252.5" width="154.5" height="35.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="340.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Струмове дзеркало:</tspan><tspan x="340.0" dy="13.0">I_sense = I_load / k_ILIS</tspan></text>
<rect x="500.0" y="130.2" width="160.0" height="59.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="580.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Силовий N-MOSFET</tspan><tspan x="580.0" dy="14.3">Верхнього плеча</tspan><tspan x="580.0" dy="14.3">(R_ds = 10..50 мОм)</tspan></text>
<line x1="660.0" y1="120.0" x2="750.0" y2="120.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">V_bat (+12 В / +24 В)</text>
<line x1="660.0" y1="200.0" x2="750.0" y2="200.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">OUT (До навантаження)</text>
<line x1="210.0" y1="120.0" x2="270.0" y2="120.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
