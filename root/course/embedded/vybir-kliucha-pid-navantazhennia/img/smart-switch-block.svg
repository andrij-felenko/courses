<line x1="420.0" y1="195.0" x2="500.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580.0" y1="210.0" x2="420.0" y2="270.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="260.0" y1="240.0" x2="220.0" y2="240.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Інтелектуальний ключ замінює десятки дискретних деталей: захищає проводку, комутує плюс і вимірює струм</text>
