<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура безперервного логування сенсорних даних на МК</text>
<text x="440.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">1. Апаратні джерела потоків (DMA без переривання процесора)</text>
<rect x="46.0" y="75.0" width="180.0" height="52.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="136.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Акселерометр / IMU</text>
<text x="136.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="136.0" dy="0.0">SPI DMA @ 1.6 кГц</tspan><tspan x="136.0" dy="12.3">(вібрація, кути)</tspan></text>
<line x1="136.0" y1="127.0" x2="136.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250.0" y="75.0" width="180.0" height="52.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="340.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Струмовий шунт</text>
<text x="340.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">ADC DMA @ 10 кГц</tspan><tspan x="340.0" dy="12.3">(струм, напруга)</tspan></text>
<line x1="340.0" y1="127.0" x2="340.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="454.0" y="75.0" width="180.0" height="52.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="544.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Мікрофон</text>
<text x="544.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="544.0" dy="0.0">I2S DMA @ 16 кГц</tspan><tspan x="544.0" dy="12.3">(акустичний шуми)</tspan></text>
<line x1="544.0" y1="127.0" x2="544.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="658.0" y="75.0" width="180.0" height="52.0" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="748.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний таймер</text>
<text x="748.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">TIM 32-bit @ 1 МГц</tspan><tspan x="748.0" dy="12.3">(мікросекунди us)</tspan></text>
<line x1="748.0" y1="127.0" x2="748.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">2. Подвійний буфер у RAM (Ping-Pong) та пакування фреймів</text>
<rect x="60.0" y="185.0" width="340.0" height="65.0" rx="6" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="230.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Буфер A (наповнюється від DMA)</text>
<text x="230.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сенсори пишуть сюди в реальному часі</text>
<text x="230.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Апаратний таймстемп + лічильник seq_num</text>
<rect x="430.0" y="195.0" width="30.0" height="45.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="445.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">⇄</text>
<rect x="480.0" y="185.0" width="340.0" height="65.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="1.6"/>
<text x="650.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Буфер B (скидається на накопичувач)</text>
<text x="650.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Готовий блок передається у фонову задачу</text>
<text x="650.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Розмір кратний сектору Flash (512 / 4096 байт)</text>
<line x1="440.0" y1="252.0" x2="440.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">3. Структура бінарного фрейму (без текстового оверхеду)</text>
<rect x="46.0" y="302.0" width="126.0" height="42.0" rx="4" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/>
<text x="109.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Magic (2B)</text>
<text x="109.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0xAA55</text>
<rect x="177.0" y="302.0" width="126.0" height="42.0" rx="4" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/>
<text x="240.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Stream ID (1B)</text>
<text x="240.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0x01 = IMU</text>
<rect x="308.0" y="302.0" width="126.0" height="42.0" rx="4" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/>
<text x="371.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Seq Num (4B)</text>
<text x="371.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0..4294967295</text>
<rect x="439.0" y="302.0" width="126.0" height="42.0" rx="4" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/>
<text x="502.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Timestamp (8B)</text>
<text x="502.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Час у мкс</text>
<rect x="570.0" y="302.0" width="126.0" height="42.0" rx="4" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/>
<text x="633.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Payload (N байт)</text>
<text x="633.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Сирі відліки LSB</text>
<rect x="701.0" y="302.0" width="126.0" height="42.0" rx="4" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/>
<text x="764.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">CRC32 (4B)</text>
<text x="764.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Контроль цілісності</text>
<line x1="440.0" y1="346.0" x2="440.0" y2="368.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="370.0" width="680.0" height="52.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="440.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">4. Накопичувач (SD-карта / eMMC) та черга запису</text>
<text x="440.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Фоновий потік поглинає затримки Flash GC (до 250 мс) за рахунок RAM-черги без втрати пакетів</text>
</svg>