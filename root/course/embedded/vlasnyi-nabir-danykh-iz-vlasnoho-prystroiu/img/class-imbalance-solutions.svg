<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дисбаланс класів: парадокс точності та методи вирішення</text>
<rect x="40.0" y="55.0" width="370.0" height="335.0" rx="7" fill="#fff9f8" stroke="#c0392b" stroke-width="1.5"/>
<text x="225.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Проблема: 99.9% норми проти 0.1% поломок</text>
<rect x="55.0" y="98.0" width="340.0" height="32.0" rx="4" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.2"/>
<text x="195.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Штатна робота (годинами / днями)</text>
<rect x="365.0" y="98.0" width="30.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="380.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">💥</text>
<text x="225.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парадокс точності (Accuracy Paradox):</text>
<rect x="55.0" y="162.0" width="340.0" height="58.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="225.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Наївний класифікатор вивчив одне правило:</text>
<text x="225.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">«Завжди відповідай: ШТАТНО»</text>
<text x="225.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Формальна точність: 99.9% | Виявлено аварій: 0%</text>
<text x="225.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наслідки для пристрою:</text>
<text x="65.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="65.0" dy="0.0">• Класифікатор сліпий до рідкісних катастроф</tspan><tspan x="65.0" dy="14.0">• Метрика Accuracy втрачає будь-який сенс</tspan><tspan x="65.0" dy="14.0">• Необхідні Precision/Recall, F1 та PR-AUC</tspan></text>
<rect x="55.0" y="325.0" width="340.0" height="48.0" rx="6" fill="#fef0ee" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Висновок: звичайний багатокласовий класифікатор</tspan><tspan x="225.0" dy="13.0">не працює на сирих потоках телеметрії</tspan></text>
<rect x="450.0" y="55.0" width="390.0" height="335.0" rx="7" fill="#f4f8fb" stroke="#2457d6" stroke-width="1.5"/>
<text x="645.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Три інженерні стратегії подолання</text>
<rect x="465.0" y="100.0" width="360.0" height="72.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="645.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. Активний збір крайових випадків</text>
<text x="475.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="475.0" dy="0.0">• Випробувальні стенди, перевантаження</tspan><tspan x="475.0" dy="12.8">• Штучні дефекти: надпил підшипника, дисбаланс</tspan></text>
<rect x="465.0" y="185.0" width="360.0" height="72.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="645.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Однокласове моделювання (One-Class)</text>
<text x="475.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="475.0" dy="0.0">• One-Class SVM / Isolation Forest</tspan><tspan x="475.0" dy="12.8">• Описують межу нормальної поведінки</tspan></text>
<rect x="465.0" y="270.0" width="360.0" height="72.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="645.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. Автоенкодер реконструкції сигналу</text>
<text x="475.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="475.0" dy="0.0">• Вчиться тільки на 100% здоровій роботі</tspan><tspan x="475.0" dy="12.8">• Аномалія = висока похибка відновлення MSE(x, x̂)</tspan></text>
<rect x="465.0" y="358.0" width="360.0" height="24.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="645.0" y="373.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Головний підхід в Edge AI: навчатися на нормі, ловити відхилення</tspan></text>
</svg>