<text x="470.7" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">HMAC-SHA256 / Poly1305 тег автентичності: 8 Б</text>
<rect x="571.8" y="394.0" width="202.2" height="24.0" rx="0" fill="#27ae60" stroke="#bdc3c7" stroke-width="0.8"/>
