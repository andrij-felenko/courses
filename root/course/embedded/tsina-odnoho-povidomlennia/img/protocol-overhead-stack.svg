<rect x="329.1" y="292.0" width="182.0" height="24.0" rx="0" fill="#d0d0d0" stroke="#bdc3c7" stroke-width="0.8"/>
<text x="408.1" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">DTLS 1.3 Record (CID + MAC): 16 Б</text>
<rect x="511.1" y="292.0" width="161.8" height="24.0" rx="0" fill="#e0e0e0" stroke="#bdc3c7" stroke-width="0.8"/>
<text x="592.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">CoAP NON POST + CBOR бінарні дані: 14 Б</text>
<rect x="672.9" y="292.0" width="101.1" height="24.0" rx="0" fill="#2457d6" stroke="#bdc3c7" stroke-width="0.8"/>
<text x="723.4" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Дані (10 Б)</text>
<text x="46.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Без стану з'єднання, без TCP-рукостискання, нульові витрати на закриття</text>
<rect x="30.0" y="364.0" width="760.0" height="92.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="46.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ультракомпактний бінарний кадр поверх UDP / NB-IoT NIDD</text>
<text x="774.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">Разом: 28 байтів</text>
<rect x="46.0" y="394.0" width="728.0" height="24.0" rx="3" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.0"/>
