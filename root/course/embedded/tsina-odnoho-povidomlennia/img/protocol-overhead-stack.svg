<text x="619.6" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">MQTT CONNECT / CONNACK + PUBLISH (JSON): 110 Б</text>
<rect x="718.8" y="190.0" width="55.2" height="24.0" rx="0" fill="#d35400" stroke="#bdc3c7" stroke-width="0.8"/>
<text x="746.4" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Дані (10 Б)</text>
<text x="46.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Потребує підтримання TCP Keep-Alive або повторного TCP-з'єднання</text>
<rect x="30.0" y="262.0" width="760.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="46.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">CoAP / UDP + DTLS Connection ID (CID) + CBOR</text>
<text x="774.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">Разом: ~68 байтів</text>
