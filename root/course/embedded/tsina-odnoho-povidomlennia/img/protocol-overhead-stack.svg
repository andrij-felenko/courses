<text x="46.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Максимальна ефективність: понад 35% кадру — корисна інформація</text>
