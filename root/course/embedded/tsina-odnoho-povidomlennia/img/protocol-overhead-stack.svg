<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Накладні витрати передачі 10 байтів корисних даних у різних стеках</text>
<rect x="30.0" y="58.0" width="760.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="46.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">HTTPS / TLS 1.2 + JSON (нове з'єднання)</text>
<text x="774.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">Разом: ~6400 байтів (6.4 КБ)</text>
<rect x="46.0" y="88.0" width="728.0" height="24.0" rx="3" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.0"/>
<rect x="46.0" y="88.0" width="59.6" height="24.0" rx="0" fill="#e0e0e0" stroke="#bdc3c7" stroke-width="0.8"/>
<text x="75.8" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">TCP (120 Б)</text>
<rect x="105.6" y="88.0" width="503.0" height="24.0" rx="0" fill="#d0d0d0" stroke="#bdc3c7" stroke-width="0.8"/>
<text x="357.1" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">TLS 1.2 Handshake + X.509 Сертифікати: 4800 Б</text>
<rect x="608.5" y="88.0" width="79.4" height="24.0" rx="0" fill="#e0e0e0" stroke="#bdc3c7" stroke-width="0.8"/>
<text x="648.3" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">HTTP (380 Б)</text>
<rect x="688.0" y="88.0" width="66.2" height="24.0" rx="0" fill="#d0d0d0" stroke="#bdc3c7" stroke-width="0.8"/>
<text x="721.1" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">TCP (160 Б)</text>
<rect x="754.1" y="88.0" width="19.9" height="24.0" rx="0" fill="#c0392b" stroke="#bdc3c7" stroke-width="0.8"/>
<text x="46.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Корисне навантаження становить лише 0.15% від переданого радіотрафіку</text>
<rect x="30.0" y="160.0" width="760.0" height="92.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.6"/>
<text x="46.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">MQTT + TLS (відновлення сесії Session Ticket)</text>
<text x="774.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="end" font-weight="700">Разом: ~480 байтів</text>
<rect x="46.0" y="190.0" width="728.0" height="24.0" rx="3" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.0"/>
