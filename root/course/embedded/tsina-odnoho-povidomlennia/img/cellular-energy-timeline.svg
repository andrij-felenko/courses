<text x="446.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="446.0" dy="0.0">• Енергія на 1 повідомлення: ~0.008–0.015 мА·год (у 25 разів менше)</tspan><tspan x="446.0" dy="13.0">• Модем засинає в PSM (3.5 мкА) за 200 мс після прийому ACK</tspan><tspan x="446.0" dy="13.0">• Автономна робота тієї ж батареї: 6–8 років</tspan></text>
