<text x="86.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="86.0" dy="0.0">• Енергія на 1 повідомлення: ~0.25–0.40 мА·год</tspan><tspan x="86.0" dy="13.0">• 90% заряду згорає на встановлення сесії та хвіст таймера</tspan><tspan x="86.0" dy="13.0">• Батарея LiSOCl2 (2.4 А·год) виснажується за 45–60 днів</tspan></text>
