<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріумвірат обмежень: чому розподіл обов'язків є фізичною необхідністю</text>
<rect x="30.0" y="55.0" width="365.0" height="335.0" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8"/>
<text x="212.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">КРАЙ (Локальний вузол / MCU)</text>
<rect x="44.5" y="107.3" width="335.0" height="45.3" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="212.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Затримка 1–10 мс: детерміновані замкнені контури</tspan><tspan x="212.0" dy="14.3">(ПІД-регулятори, аварійна зупинка, ШІМ двигуна)</tspan></text>
<rect x="44.5" y="172.3" width="335.0" height="45.3" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="212.0" y="191.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Енергетична вигода: мікроконтролер витрачає</tspan><tspan x="212.0" dy="14.3">наноджоулі на інструкцію в режимі сну та обробки</tspan></text>
<rect x="44.5" y="237.3" width="335.0" height="45.3" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="212.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Первинна компресія: фільтрація шумів, FFT,</tspan><tspan x="212.0" dy="14.3">відсікання надлишкових 99.9% сирих вибірок датчика</tspan></text>
<rect x="39.0" y="307.4" width="346.0" height="45.3" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="212.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Повна автономність: робота без доступу до інтернету,</tspan><tspan x="212.0" dy="14.3">конфіденційність сирих чутливих даних на місці</tspan></text>
<rect x="425.0" y="55.0" width="365.0" height="335.0" rx="8" fill="#fdfbf7" stroke="#d97706" stroke-width="1.8"/>
<text x="607.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">ХМАРА (Серверний бекенд / Fleet)</text>
<rect x="434.0" y="107.3" width="346.0" height="45.3" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/><text x="607.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.0" dy="0.0">Макроаналіз парку: крос-кореляція тисяч вузлів,</tspan><tspan x="607.0" dy="14.3">виявлення глобальних тенденцій деградації обладнання</tspan></text>
<rect x="439.5" y="172.3" width="335.0" height="45.3" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/><text x="607.0" y="191.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.0" dy="0.0">Машинне навчання: важке навчання моделей,</tspan><tspan x="607.0" dy="14.3">кластеризація та оновлення профілів для вузлів</tspan></text>
<rect x="439.5" y="237.3" width="335.0" height="45.3" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/><text x="607.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.0" dy="0.0">Довготривалий архів: гігабайти історичних зведень,</tspan><tspan x="607.0" dy="14.3">юридичний аудит, звітність за місяці й роки</tspan></text>
<rect x="439.5" y="307.4" width="335.0" height="45.3" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/><text x="607.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.0" dy="0.0">Глобальне керування: бізнес-панелі оператора,</tspan><tspan x="607.0" dy="14.3">оновлення прошивок по повітрю (FOTA), білінг</tspan></text>
<line x1="395.0" y1="222.0" x2="425.0" y2="222.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="425.0" y1="238.0" x2="395.0" y2="238.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" font-weight="700">події</text>
<text x="410.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">моделі</text>
