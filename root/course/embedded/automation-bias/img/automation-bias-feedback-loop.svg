<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Петля деградації пильності та автоматизаційної упередженості</text>
<rect x="20.0" y="50.0" width="840.0" height="440.0" rx="8" fill="#fafbfc" stroke="#e1e4e8" stroke-width="1.0"/>
<rect x="198.3" y="73.0" width="483.4" height="53.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="440.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">1. Уявна бездоганність автоматики</tspan><tspan x="440.0" dy="16.9">(Тривалий безаварійний період та стабільні звіти системи)</tspan></text>
<rect x="560.0" y="188.4" width="279.9" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">2. Когнітивне розвантаження</tspan><tspan x="700.0" dy="15.6">(Автоматика сприймається як авторитет;</tspan><tspan x="700.0" dy="15.6">делегування рішень софту)</tspan></text>
<rect x="542.9" y="338.4" width="314.1" height="63.2" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="700.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">3. Зниження пильності (Vigilance Decrement)</tspan><tspan x="700.0" dy="15.6">(Пропуск звірки з первинними датчиками;</tspan><tspan x="700.0" dy="15.6">ігнорування дрібних аномалій)</tspan></text>
<rect x="182.2" y="423.1" width="515.7" height="53.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="440.0" y="446.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">4. Помилки упущення (Omission) та дії (Commission)</tspan><tspan x="440.0" dy="16.9">(Непомічена тиха відмова або сліпе виконання хибних директив)</tspan></text>
<rect x="43.5" y="258.4" width="273.1" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">5. Атрофія навичок (Out-of-the-Loop)</tspan><tspan x="180.0" dy="15.6">(Втрата ментальної моделі процесу;</tspan><tspan x="180.0" dy="15.6">неготовність до ручного перехоплення)</tspan></text>
<line x1="600.0" y1="100.0" x2="700.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="270.0" x2="700.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="420.0" x2="600.0" y2="450.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="280.0" y1="450.0" x2="180.0" y2="345.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="180.0" y1="235.0" x2="300.0" y2="115.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.3" y="238.4" width="259.4" height="63.2" rx="6" fill="#ffffff" stroke="#95a5a6" stroke-width="1.2"/><text x="440.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Самопосилювана петля:</tspan><tspan x="440.0" dy="15.6">Чим довше система мовчить,</tspan><tspan x="440.0" dy="15.6">тим менше оператор перевіряє фізику</tspan></text>
</svg>