<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три рівні ситуаційної обізнаності (Endsley) та точки відмови автоматизації</text>
<rect x="15.0" y="45.0" width="870.0" height="435.0" rx="8" fill="#fafbfc" stroke="#e1e4e8" stroke-width="1.0"/>
<rect x="40.0" y="90.0" width="260.0" height="280.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="170.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень 1: Сприйняття</text>
<text x="170.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">(Perception)</text>
<text x="55.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">• Первинні сенсорні дані</tspan><tspan x="55.0" dy="15.4">• Індикатори панелі приладів</tspan><tspan x="55.0" dy="15.4">• Статус лінка та систем</tspan><tspan x="55.0" dy="15.4">• Зчитування числових значень</tspan></text>
<rect x="71.1" y="392.2" width="197.8" height="55.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="170.0" y="409.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Вразливість до автоматизації:</tspan><tspan x="170.0" dy="14.3">Сенсорне перевантаження,</tspan><tspan x="170.0" dy="14.3">пропуск дрейфу сигналів</tspan></text>
<line x1="170.0" y1="370.0" x2="170.0" y2="390.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="320.0" y="90.0" width="260.0" height="280.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="450.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень 2: Осмислення</text>
<text x="450.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">(Comprehension)</text>
<text x="335.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="335.0" dy="0.0">• Інтеграція показів у модель</tspan><tspan x="335.0" dy="15.4">• Розуміння фізики процесу</tspan><tspan x="335.0" dy="15.4">• Виявлення суперечностей датчиків</tspan><tspan x="335.0" dy="15.4">• Оцінка поточного режиму роботи</tspan></text>
<rect x="347.9" y="392.2" width="204.1" height="55.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="450.0" y="409.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Вразливість до автоматизації:</tspan><tspan x="450.0" dy="14.3">Когнітивне тунелювання,</tspan><tspan x="450.0" dy="14.3">сліпа довіра до зелених плашок</tspan></text>
<line x1="450.0" y1="370.0" x2="450.0" y2="390.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="600.0" y="90.0" width="260.0" height="280.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="730.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень 3: Прогнозування</text>
<text x="730.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">(Projection)</text>
<text x="615.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="615.0" dy="0.0">• Екстраполяція траєкторії</tspan><tspan x="615.0" dy="15.4">• Оцінка залишку часу та енергії</tspan><tspan x="615.0" dy="15.4">• Передбачення розвитку аварії</tspan><tspan x="615.0" dy="15.4">• Планування ручного втручання</tspan></text>
<rect x="628.0" y="392.2" width="204.1" height="55.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="730.0" y="409.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Вразливість до автоматизації:</tspan><tspan x="730.0" dy="14.3">Феномен Out-of-the-Loop,</tspan><tspan x="730.0" dy="14.3">неготовність до збою алгоритму</tspan></text>
<line x1="730.0" y1="370.0" x2="730.0" y2="390.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300.0" y1="220.0" x2="320.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="580.0" y1="220.0" x2="600.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>