<rect x="667.1" y="253.1" width="265.8" height="53.9" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2.0"/><text x="800.0" y="276.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">ACK ALARM</tspan><tspan x="800.0" dy="16.9">(Підтверджена активна тривога)</tspan></text>
<rect x="351.0" y="393.1" width="298.0" height="53.9" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.8"/><text x="500.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">RTN UNACK</tspan><tspan x="500.0" dy="16.9">(Повернуто в норму без квитування)</tspan></text>
<rect x="54.8" y="296.2" width="170.5" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">SHELVED</tspan><tspan x="140.0" dy="15.6">(Тимчасово відкладена)</tspan></text>
<rect x="37.7" y="416.2" width="204.7" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">SUPPRESSED</tspan><tspan x="140.0" dy="15.6">(Пригнічена логікою режиму)</tspan></text>
