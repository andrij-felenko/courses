<rect x="45.0" y="110.0" width="190.0" height="45.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="140.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Хаб Порт 1-2.1</tspan><tspan x="140.0" dy="13.0">Серійник: FT4232_A01_01</tspan><tspan x="140.0" dy="13.0">(UART Консоль Слота 1)</tspan></text>
