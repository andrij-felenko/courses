<rect x="285.0" y="65.0" width="250.0" height="290.0" rx="6" fill="#fef3c7" stroke="#333333" stroke-width="1.6"/>
<text x="410.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">/etc/udev/rules.d/99-rack.rules</text>
<rect x="295.0" y="110.0" width="230.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="410.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">SUBSYSTEM==&quot;tty&quot;, \</tspan><tspan x="410.0" dy="11.7">ATTRS{serial}==&quot;FT4232_A01_01&quot;, \</tspan><tspan x="410.0" dy="11.7">SYMLINK+=&quot;dut-slot-01-uart&quot;</tspan></text>
<rect x="295.0" y="170.0" width="230.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="410.0" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">SUBSYSTEM==&quot;usb&quot;, \</tspan><tspan x="410.0" dy="11.7">ATTRS{serial}==&quot;JLINK_98765432&quot;, \</tspan><tspan x="410.0" dy="11.7">SYMLINK+=&quot;dut-slot-01-swd&quot;</tspan></text>
<rect x="295.0" y="230.0" width="230.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="410.0" y="246.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">SUBSYSTEM==&quot;tty&quot;, \</tspan><tspan x="410.0" dy="11.7">ATTRS{serial}==&quot;RELAY_PWR_S01&quot;, \</tspan><tspan x="410.0" dy="11.7">SYMLINK+=&quot;dut-slot-01-pwr&quot;</tspan></text>
<rect x="295.0" y="290.0" width="230.0" height="45.0" rx="6" fill="#fef9c3" stroke="#6b7280" stroke-width="1.0"/><text x="410.0" y="309.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">udevadm control --reload</tspan><tspan x="410.0" dy="13.0">udevadm trigger</tspan></text>
<rect x="570.0" y="65.0" width="220.0" height="290.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/>
<text x="680.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стабільні симлінки в ОС</text>
<rect x="585.0" y="115.0" width="190.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="680.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">/dev/dut-slot-01-uart</tspan><tspan x="680.0" dy="13.0">(Консоль завжди тут)</tspan></text>
<rect x="585.0" y="175.0" width="190.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="680.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">/dev/dut-slot-01-swd</tspan><tspan x="680.0" dy="13.0">(SWD зонд завжди тут)</tspan></text>
<rect x="585.0" y="235.0" width="190.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="680.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">/dev/dut-slot-01-pwr</tspan><tspan x="680.0" dy="13.0">(Керування живленням)</tspan></text>
<rect x="585.0" y="295.0" width="190.0" height="45.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.2"/><text x="680.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Pytest Runner:</tspan><tspan x="680.0" dy="13.0">pytest --slot=1</tspan><tspan x="680.0" dy="13.0">(Жодних колізій портів)</tspan></text>
