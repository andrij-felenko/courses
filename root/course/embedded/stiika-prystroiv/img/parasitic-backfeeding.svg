<text x="350.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">GND (Спільна)</text>
<rect x="40.0" y="395.0" width="720.0" height="35.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="400.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Рішення: Буфери з функцією Ioff (SN74LVC1T45) або переведення ліній програматора в Hi-Z при Power-Off</text>
