<rect x="55.0" y="115.0" width="190.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="150.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">USB-UART / ST-Link</tspan><tspan x="150.0" dy="14.3">Живлення 3.3 В АКТИВНЕ</tspan></text>
<rect x="55.0" y="180.0" width="190.0" height="35.0" rx="6" fill="#fef3c7" stroke="#c0392b" stroke-width="1.2"/><text x="150.0" y="201.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">UART TX = 3.3 В (High)</tspan></text>
<rect x="55.0" y="230.0" width="190.0" height="35.0" rx="6" fill="#fef3c7" stroke="#c0392b" stroke-width="1.2"/><text x="150.0" y="251.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">SWDIO / SWCLK = 3.3 В</tspan></text>
<rect x="55.0" y="320.0" width="190.0" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="150.0" y="341.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Спільна земля (GND)</tspan></text>
