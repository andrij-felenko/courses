<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подійна модель автомата I2C</text>
<text x="360.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подійна модель апаратного ведучого I2C (Master Transmitter Flow)</text>
<rect x="29.8" y="86.9" width="100.3" height="46.2" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/><text x="80.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="80.0" dy="0.0">1. СТАРТ</tspan><tspan x="80.0" dy="12.3">CR1: START=1</tspan><tspan x="80.0" dy="12.3">Лінії захоплено</tspan></text>
<line x1="80.0" y1="142.0" x2="80.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="22.6" y="186.9" width="114.9" height="46.2" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/><text x="80.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="80.0" dy="0.0">Подія EV5</tspan><tspan x="80.0" dy="12.3">SR1: SB=1</tspan><tspan x="80.0" dy="12.3">(Старт згенеровано)</tspan></text>
<line x1="132.0" y1="210.0" x2="168.0" y2="210.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="163.9" y="86.9" width="112.1" height="46.2" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/><text x="220.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">2. АДРЕСА</tspan><tspan x="220.0" dy="12.3">Запис адреси у DR</tspan><tspan x="220.0" dy="12.3">(7 біт + R/W=0)</tspan></text>
<line x1="220.0" y1="142.0" x2="220.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="157.1" y="186.9" width="125.7" height="46.2" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/><text x="220.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Подія EV6</tspan><tspan x="220.0" dy="12.3">SR1: ADDR=1</tspan><tspan x="220.0" dy="12.3">(Отримано ACK адреси)</tspan></text>
<line x1="272.0" y1="210.0" x2="308.0" y2="210.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="303.9" y="86.9" width="112.1" height="46.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.3"/><text x="360.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">3. БАЙТ 1</tspan><tspan x="360.0" dy="12.3">Запис даних у DR</tspan><tspan x="360.0" dy="12.3">Зсув байта по SDA</tspan></text>
<line x1="360.0" y1="142.0" x2="360.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="305.3" y="186.9" width="109.5" height="46.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="360.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Подія EV8</tspan><tspan x="360.0" dy="12.3">SR1: TXE=1</tspan><tspan x="360.0" dy="12.3">(Буфер DR вільний)</tspan></text>
<line x1="412.0" y1="210.0" x2="448.0" y2="210.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="441.0" y="86.9" width="118.0" height="46.2" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.3"/><text x="500.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">4. БАЙТ 2 (фінал)</tspan><tspan x="500.0" dy="12.3">Останній байт у DR</tspan><tspan x="500.0" dy="12.3">Очікування ACK</tspan></text>
<line x1="500.0" y1="142.0" x2="500.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="439.9" y="186.9" width="120.3" height="46.2" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/><text x="500.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Подія EV8_2</tspan><tspan x="500.0" dy="12.3">SR1: BTF=1, TXE=1</tspan><tspan x="500.0" dy="12.3">(Передачу завершено)</tspan></text>
<line x1="552.0" y1="210.0" x2="588.0" y2="210.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="589.8" y="86.9" width="100.3" height="46.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.3"/><text x="640.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">5. СТОП</tspan><tspan x="640.0" dy="12.3">CR1: STOP=1</tspan><tspan x="640.0" dy="12.3">Формування STOP</tspan></text>
<line x1="640.0" y1="142.0" x2="640.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="582.6" y="186.9" width="114.9" height="46.2" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="640.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Шина вільна</tspan><tspan x="640.0" dy="12.3">SR2: BUSY=0</tspan><tspan x="640.0" dy="12.3">(Готовий до обміну)</tspan></text>
<rect x="40.0" y="245.0" width="640.0" height="55.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="360.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дисципліна обробки: запис у DR очищує TXE, читання SR1+SR2 очищує ADDR,</text>
<text x="360.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">а затримка запису активує BTF (Byte Transfer Finished) і розтягує SCL для захисту від Underrun.</text>
</svg>