<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійна теплова пастка умов «High &amp; Hot»</text>
<text x="470.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чому розріджене гаряче повітря призводить до лавинного перегріву двигунів та ESC</text>
<rect x="40.0" y="75.0" width="260.0" height="260.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="170.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Зростання виділення тепла</text>
<line x1="55.0" y1="113.0" x2="285.0" y2="113.0" stroke="#fca5a5" stroke-width="1.2"/>
<text x="55.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Менша густина ρ:</text>
<text x="65.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">гвинт захоплює менше маси</text>
<text x="55.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Зростання обертів n:</text>
<text x="65.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">n ∝ 1/√(ρ/ρ₀) для тієї ж тяги</text>
<text x="55.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Зростання струму I:</text>
<text x="65.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">I ∝ P/U → стрибок струму</text>
<text x="55.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Джоулів нагрів обмоток:</text>
<text x="65.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">P_loss = I²·R (+30..+70% тепла!)</text>
<text x="170.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ВТРАТИ РОСТУТЬ В КВАДРАТІ</text>
<rect x="640.0" y="75.0" width="260.0" height="260.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="770.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Падіння тепловідведення</text>
<line x1="655.0" y1="113.0" x2="885.0" y2="113.0" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="655.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Менша масова витрата:</text>
<text x="665.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">менше кг повітря обдуває мотор</text>
<text x="655.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Падіння конвекції h_conv:</text>
<text x="665.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">h_conv ∝ (ρ·v)^0.8 (на −20..−35%)</text>
<text x="655.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">• Менший перепад ΔT:</text>
<text x="665.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">T_amb = +40 °C замість +15 °C</text>
<text x="655.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">• Падіння об'ємної теплоємності:</text>
<text x="665.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">C_v = ρ·c_p нижча на 20–30%</text>
<text x="770.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ОХОЛОДЖЕННЯ ЕФЕКТИВНО ВПАЛО</text>
<rect x="330.0" y="105.0" width="280.0" height="200.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="470.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">РЕЗУЛЬТАТ: ТЕРМО-РОЗГІН</text>
<line x1="350.0" y1="145.0" x2="590.0" y2="145.0" stroke="#fde68a" stroke-width="1.5"/>
<text x="470.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">T_motor підскакує вище 110 °C:</text>
<text x="470.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Деградація магнітів NdFeB</text>
<text x="470.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(незворотна втрата магнітного поля)</text>
<text x="470.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Перегрів MOSFET регулятора</text>
<text x="470.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(R_DS(on) росте → тепловий пробій)</text>
<text x="470.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Battery Sag &amp; дострокова відсічка</text>
<line x1="305.0" y1="205.0" x2="325.0" y2="205.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="635.0" y1="205.0" x2="615.0" y2="205.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="360.0" width="860.0" height="75.0" rx="8" fill="#fafbfc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="470.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Інженерне рішення для «High &amp; Hot»:</text>
<text x="470.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зменшення злітної маси на 15–25% • Збільшення діаметра/кроку гвинта з контролем струму ESC</text>
<text x="470.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Охолодження батарей у тіні перед стартом • Моніторинг температури ESC по телеметрії</text>
</svg>