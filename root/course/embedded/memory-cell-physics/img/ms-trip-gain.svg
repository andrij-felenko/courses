<text x="410.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Один інвертор: три ділянки VTC — дві пласкі полиці й крутий обвал у Vм. Нахил у Vм дорівнює −A; саме він визначає, наскільки широкі лопаті метелика.</text>
