<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плавучий затвор: транзистор, що пам'ятає заряд</text>
<rect x="150.0" y="250.0" width="240.0" height="36.0" rx="6" fill="#eef0f4" stroke="#6b7280" stroke-width="1.4"/>
<text x="270.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">кремнієва підкладка (канал)</text>
<rect x="150.0" y="230.0" width="52.0" height="20.0" rx="6" fill="#dfe6f5" stroke="#2457d6" stroke-width="1.3"/>
<text x="176.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">витік</text>
<rect x="338.0" y="230.0" width="52.0" height="20.0" rx="6" fill="#dfe6f5" stroke="#2457d6" stroke-width="1.3"/>
<text x="364.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">стік</text>
<rect x="180.0" y="218.0" width="180.0" height="12.0" rx="6" fill="#f3f5fd" stroke="#6b7280" stroke-width="1.0"/>
<text x="398.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">тонкий «тунельний» оксид</text>
<rect x="180.0" y="188.0" width="180.0" height="28.0" rx="6" fill="#fff2cc" stroke="#b9770e" stroke-width="2.0"/>
<text x="270.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">ПЛАВУЧИЙ затвор (заряд замкнено)</text>
<text x="202.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="226.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="250.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="274.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="298.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="322.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="346.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<rect x="180.0" y="176.0" width="180.0" height="12.0" rx="6" fill="#f3f5fd" stroke="#6b7280" stroke-width="1.0"/>
<text x="398.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">ізолятор (з усіх боків!)</text>
<rect x="180.0" y="148.0" width="180.0" height="28.0" rx="6" fill="#dfe6f5" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="270.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">керівний затвор</text>
<line x1="270.0" y1="132.0" x2="270.0" y2="148.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="270.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">вивід</text>
<rect x="450.0" y="120.0" width="340.0" height="170.0" rx="6" fill="#fff8e8" stroke="#b9770e" stroke-width="1.6"/><text x="620.0" y="209.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0"></tspan></text>
<text x="620.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700">Як заряд кодує біт</text>
<text x="466.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Заряд на плавучому затворі зсуває</text>
<text x="466.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">поріг, за яким транзистор вмикається:</text>
<text x="466.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">є замкнений заряд → високий поріг → «0»</text>
<text x="466.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">нема заряду → низький поріг → «1»</text>
<text x="466.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Читаємо просто: пробуємо ввімкнути —</text>
<text x="466.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">відкрився чи ні і каже, який біт усередині.</text>
<rect x="154.6" y="301.1" width="510.8" height="57.8" rx="6" fill="#f4f7f4" stroke="#b9770e" stroke-width="1.5"/><text x="410.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Ось де НЕЛЕТКІСТЬ: затвор оточений ізолятором, заряд нікуди не дінеться —</tspan><tspan x="410.0" dy="13.7">тримається роками без живлення. «Роками», а не «вічно»: заряд — лічені тисячі</tspan><tspan x="410.0" dy="13.7">електронів, із часом чи від нагріву помалу губиться (скінченний строк зберігання).</tspan></text>
</svg>