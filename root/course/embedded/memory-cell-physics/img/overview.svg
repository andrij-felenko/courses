<line x1="580.0" y1="132.0" x2="794.0" y2="132.0" stroke="#b9770e" stroke-width="1.1"/>
<text x="687.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">біт — заряд, замкнений</text>
<text x="687.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">в ізоляторі; тримається</text>
<text x="687.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">роками без живлення</text>
<rect x="574.0" y="256.0" width="226.0" height="24.0" rx="6" fill="#fff8e8" stroke="none" stroke-width="0.0"/><text x="687.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700"><tspan x="687.0" dy="0.0">нелетка · запис зі зносом</tspan></text>
<text x="410.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Дві ідеї: тримати біт ЖИВИМ (струмом у петлі чи зарядом-що-стікає) — це летко;</text>
