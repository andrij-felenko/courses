<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 876 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="876" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід плавучого затвора: ідея, перший чип, спадкоємці</text>
<rect x="30.0" y="72.0" width="196.0" height="150.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.7"/>
<text x="128.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1967</text>
<line x1="48.0" y1="106.0" x2="208.0" y2="106.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="128.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Канг і Це (Bell Labs):</text>
<text x="128.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">ідея плавучого затвора</text>
<text x="128.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">на папері, без чипа</text>
<rect x="240.0" y="72.0" width="196.0" height="150.0" rx="6" fill="#fff8e8" stroke="#b9770e" stroke-width="1.7"/>
<text x="338.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700">1971</text>
<line x1="258.0" y1="106.0" x2="418.0" y2="106.0" stroke="#b9770e" stroke-width="1.0"/>
<text x="338.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Фроман (Intel):</text>
<text x="338.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">комірка FAMOS і чип 1702 —</text>
<text x="338.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">перша EPROM, стирання УФ</text>
<line x1="224.0" y1="147.0" x2="238.0" y2="147.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="450.0" y="72.0" width="196.0" height="150.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.7"/>
<text x="548.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">кінець 1970-х</text>
<line x1="468.0" y1="106.0" x2="628.0" y2="106.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="548.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">EEPROM:</text>
<text x="548.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">стирання ЕЛЕКТРИКОЮ,</text>
<text x="548.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">віконце зникає</text>
<line x1="434.0" y1="147.0" x2="448.0" y2="147.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="660.0" y="72.0" width="196.0" height="150.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="758.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1980-ті й далі</text>
<line x1="678.0" y1="106.0" x2="838.0" y2="106.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="758.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Flash:</text>
<text x="758.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">дешевше й щільніше,</text>
<text x="758.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">стирання блоками</text>
<line x1="644.0" y1="147.0" x2="658.0" y2="147.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен крок додав своє; жоден не зробив усього сам. Підручник любить одне ім'я там, де працював цілий ланцюг.</text>
</svg>