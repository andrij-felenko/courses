<line x1="222.0" y1="90.0" x2="222.0" y2="410.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="110.0" y1="218.0" x2="670.0" y2="218.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="334.0" y1="90.0" x2="334.0" y2="410.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="110.0" y1="282.0" x2="670.0" y2="282.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="446.0" y1="90.0" x2="446.0" y2="410.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="110.0" y1="346.0" x2="670.0" y2="346.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="558.0" y1="90.0" x2="558.0" y2="410.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="110.0" y1="410.0" x2="705.0" y2="410.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="110.0" y1="410.0" x2="110.0" y2="65.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Швидкість ω (RPM)</text>
<text x="95.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Момент T (Н·м)</text>
<line x1="110.0" y1="160.0" x2="560.0" y2="410.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="370.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Колекторний DC</text>
<path d="M 110 115 Q 200 125 280 220 T 400 400" fill="none" stroke="#d35400" stroke-width="3"/>
<text x="175.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Кроковий (утримання)</text>
<path d="M 110 195 L 450 205 Q 580 230 650 410" fill="none" stroke="#27ae60" stroke-width="3"/>
<text x="500.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">BLDC / PMSM (FOC)</text>
<path d="M 110 130 L 220 130 L 250 410" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="255.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Серво з редуктором</text>
<circle cx="110.0" cy="115.0" r="4.0" fill="#d35400" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="100.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="end">T_hold</text>
<circle cx="110.0" cy="160.0" r="4.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="100.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">T_stall</text>
<circle cx="560.0" cy="410.0" r="4.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="560.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ω_0 (BDC)</text>
<circle cx="650.0" cy="410.0" r="4.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="650.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ω_max (BLDC)</text>
<rect x="700.0" y="90.0" width="230.0" height="320.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="815.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Висновки для вибору</text>
<text x="712.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="start" font-weight="700">Кроковий мотор:</text>
<text x="712.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Максимальний момент у</text>
<text x="712.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">статиці. На швидкості &gt;</text>
<text x="712.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1000 RPM момент падає</text>
<text x="712.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">майже до нуля.</text>
<text x="712.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Колекторний DC:</text>
<text x="712.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Лінійне падіння моменту.</text>
<text x="712.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Легко регулювати швидкість</text>
<text x="712.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">напругою/ШІМ.</text>
<text x="712.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">BLDC (FOC):</text>
<text x="712.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Широка зона номінального</text>
<text x="712.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">моменту. Здатний розвивати</text>
<text x="712.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">10 000+ RPM з ККД &gt; 85%.</text>
<text x="712.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Сервопривід:</text>
<text x="712.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Редуктор множить момент у</text>
<text x="712.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">десятки разів, але</text>
<text x="712.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">пропорційно обмежує</text>
<text x="712.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">швидкість.</text>
</svg>