<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інженерне дерево вибору типу електроприводу</text>
<text x="520.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Покроковий алгоритм від кінематичних вимог до оптимального мотора</text>
<rect x="30.0" y="230.0" width="150.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="105.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Який тип руху</text>
<text x="105.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">потрібен системі?</text>
<line x1="180.0" y1="245.0" x2="240.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="210.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Неперервне</text>
<line x1="180.0" y1="275.0" x2="240.0" y2="380.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="210.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Позиція / Кут</text>
<rect x="240.0" y="105.0" width="170.0" height="70.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/>
<text x="325.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ресурс, оберти та</text>
<text x="325.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">вимоги до ККД?</text>
<rect x="240.0" y="345.0" width="170.0" height="70.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/>
<text x="325.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний оберт чи</text>
<text x="325.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">фіксований сектор?</text>
<line x1="410.0" y1="125.0" x2="520.0" y2="95.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Низька ціна, низькі RPM</text>
<line x1="410.0" y1="155.0" x2="520.0" y2="185.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">ККД &gt; 85%, 5k+ RPM, ресурс</text>
<line x1="410.0" y1="365.0" x2="520.0" y2="310.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Сектор &lt; 360°, важіль</text>
<line x1="410.0" y1="395.0" x2="520.0" y2="430.0" stroke="#d35400" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d35400" text-anchor="middle">Багатооборотне безлюфтове</text>
<rect x="525.0" y="65.0" width="485.0" height="65.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="540.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Колекторний DC мотор (BDC + Редуктор)</text>
<text x="540.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Застосування: колеса бюджетних роботів, помпи, вентилятори, іграшки, електроінструмент.</text>
<rect x="525.0" y="155.0" width="485.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="540.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Безколекторний мотор (BLDC / PMSM + FOC)</text>
<text x="540.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Застосування: дрони, шпинделі, електромобільність, безперервні насоси, прецизійні шарніри.</text>
<rect x="525.0" y="275.0" width="485.0" height="75.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="540.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Сервопривід (RC PWM або Smart Bus RS-485)</text>
<text x="540.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">RC PWM: кермові поверхні літаків, замки, проста робототехніка.</text>
<text x="540.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Smart Bus: багатоланкові маніпулятори (Dynamixel), людиноподібні роботи з телеметрією.</text>
<rect x="525.0" y="395.0" width="485.0" height="75.0" rx="6" fill="#fff7ed" stroke="#d35400" stroke-width="1.5"/>
<text x="540.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="start" font-weight="700">Кроковий мотор (Bipolar Stepper + TMC silent driver)</text>
<text x="540.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Застосування: 3D-принтери, верстати ЧПК, сканери, дозатори, фокусери об'єктивів.</text>
<text x="540.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Особливість: гарантована повторюваність кута без енкодера за умови запасу по моменту.</text>
</svg>