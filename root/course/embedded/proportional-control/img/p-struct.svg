<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один P-контур як структура: налаштування + діагностика</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="360.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">усе, що визначає один P-контур, — в одній структурі</text>
<rect x="90.0" y="76.0" width="540.0" height="232.0" rx="12" fill="#eef6ff" stroke="#2457d6" stroke-width="1.9"/>
<text x="112.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">НАЛАШТУВАННЯ — задати один раз</text>
<rect x="108.0" y="132.0" width="504.0" height="38.0" rx="8" fill="#ffffff" stroke="#a9c2f2" stroke-width="1.2"/>
<text x="124.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">kp</text>
<text x="300.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">коефіцієнт [одиниць виходу / одиницю помилки]</text>
<rect x="108.0" y="176.0" width="504.0" height="38.0" rx="8" fill="#ffffff" stroke="#a9c2f2" stroke-width="1.2"/>
<text x="124.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">beta</text>
<text x="300.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">вага завдання: 1 = P-на-помилці · 0 = P-на-вимірі</text>
<rect x="108.0" y="220.0" width="504.0" height="38.0" rx="8" fill="#ffffff" stroke="#a9c2f2" stroke-width="1.2"/>
<text x="124.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">u_min · u_max</text>
<text x="300.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">реальні межі виконавчого органу</text>
<rect x="108.0" y="264.0" width="504.0" height="38.0" rx="8" fill="#ffffff" stroke="#a9c2f2" stroke-width="1.2"/>
<text x="124.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">u_bias</text>
<text x="300.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">відома наперед поправка (живлення наперед)</text>
<rect x="90.0" y="322.0" width="540.0" height="84.0" rx="12" fill="#f4f4f5" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="112.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">ДІАГНОСТИКА — модуль оновлює щотакту</text>
<rect x="108.0" y="358.0" width="244.0" height="36.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="124.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">last_u</text>
<text x="210.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">сирий вплив</text>
<rect x="368.0" y="358.0" width="244.0" height="36.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="384.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">saturated</text>
<text x="486.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">уперся в межу?</text>
<line x1="360.0" y1="314.0" x2="360.0" y2="320.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="360.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Стан окремо від логіки: налаштування незмінні, діагностику видно в телеметрії — і скільки завгодно незалежних осей на одному коді.</text>
</svg>