<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка фіксованої коми: множення переповнює 32 біти</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">kp_q · e за великої помилки перестрибує межу 32-біт і обертає вплив на протилежний</text>
<line x1="80.0" y1="150.0" x2="860.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="80.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">32-бітний знаковий проміжок</text>
<line x1="641.6" y1="140.0" x2="641.6" y2="160.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="641.6" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">+2.147 млрд (межа)</text>
<text x="80.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">0</text>
<rect x="641.6" y="144.0" width="218.4" height="12.0" rx="6" fill="#fbe3df" stroke="none" stroke-width="0.0"/>
<text x="750.8" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">тут результат ЗАГОРТАЄТЬСЯ</text>
<line x1="120.0" y1="88.0" x2="782.0" y2="138.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="120.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">kp_q·e росте з помилкою →</text>
<circle cx="782.0" cy="150.0" r="6.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="782.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">хоче сюди</text>
<circle cx="204.8" cy="150.0" r="7.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="782.0" y1="158.0" x2="204.8" y2="158.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="493.4" y1="158.0" x2="208.8" y2="154.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrR)" stroke-linecap="round"/>
<text x="204.8" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">падає СЮДИ (від'ємне!)</text>
<text x="164.8" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">вплив уперед → різкий ривок назад</text>
<line x1="80.0" y1="320.0" x2="860.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="80.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">64-бітний проміжок (int64_t)</text>
<rect x="80.0" y="314.0" width="780.0" height="12.0" rx="6" fill="#e5f6ec" stroke="none" stroke-width="0.0"/>
<circle cx="314.0" cy="320.0" r="7.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="314.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">той самий добуток — вміщається</text>
<line x1="314.0" y1="328.0" x2="164.0" y2="360.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrG)" stroke-linecap="round"/>
<text x="158.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">&gt;&gt; QBITS після ділення на масштаб → мале число → назад у 32 біти</text>
<text x="860.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">величезний запас</text>
<text x="470.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ліки: приведення (int64_t) на ОПЕРАНДАХ до множення, не на результаті; +пів масштабу для округлення, тоді зсув назад.</text>
</svg>