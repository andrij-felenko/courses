<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три шари: мозок, м'язи і право вето</text>
<rect x="60.0" y="56.0" width="700.0" height="78.0" rx="10" fill="#fff" stroke="#6b7280" stroke-width="2.0"/>
<text x="76.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1 · Рішення (логіка балансира)</text>
<text x="410.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">знайти найповнішу й найслабшу за ПРАВИЛЬНИМ критерієм (U чи SOC за хімією) ·</tspan><tspan x="410.0" dy="11.9">увімкнути перенос із гістерезисом · обрати напрям (заряд / розряд)</tspan></text>
<rect x="60.0" y="158.0" width="700.0" height="78.0" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2.0"/>
<rect x="60.0" y="158.0" width="700.0" height="22" rx="10" fill="#c0392b" fill-opacity="0.12"/>
<text x="76.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2 · Силовий вузол (ключі, котушка/трансформатор, балансувальні резистори)</text>
<text x="410.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">тримає заданий струм переносу · має ВЛАСНИЙ датчик температури ·</tspan><tspan x="410.0" dy="11.9">перегрівся → сам просить COOLDOWN, не чекаючи зовнішнього дозволу</tspan></text>
<rect x="60.0" y="260.0" width="700.0" height="78.0" rx="10" fill="#fff" stroke="#2457d6" stroke-width="2.4"/>
<rect x="60.0" y="260.0" width="700.0" height="22" rx="10" fill="#2457d6" fill-opacity="0.12"/>
<text x="76.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">3 · Монітор-захист комірок  (ПРАВО ВЕТО — стоїть над усіма)</text>
<text x="410.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">стежить за межами U, I, T кожної комірки · будь-яке порушення →</tspan><tspan x="410.0" dy="11.9">балансир НЕГАЙНО в IDLE; захист завжди важить більше за вирівнювання</tspan></text>
<line x1="180.0" y1="134.0" x2="180.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">команда</text>
<line x1="180.0" y1="236.0" x2="180.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M 650 260 C 770 230 770 76 660 64" fill="none" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="700.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ВЕТО ↑</text>
<rect x="60.0" y="350.0" width="700.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="410.0" y="377.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Балансир — це лише шар 1, що командує шаром 2. Він НІКОЛИ не сперечається із шаром 3: коли захист каже «стоп», балансування зупиняється першим. Перегрів власне силового вузла — окремий внутрішній стоп-кран (шар 2), а не привід чекати команди ззовні.</tspan></text>
</svg>