<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузьке місце: один канал ділить пропускну здатність на код і дані</text>
<rect x="300.0" y="110.0" width="360.0" height="60.0" rx="6" fill="#f2f4f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="480.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">одна шина — одна смуга: B = ширина × частота</text>
<rect x="306.0" y="118.0" width="210.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="411.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">трафік коду</text>
<rect x="522.0" y="118.0" width="130.0" height="44.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/>
<text x="587.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">дані</text>
<rect x="90.0" y="123.5" width="120.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">процесор</tspan></text>
<rect x="670.0" y="116.2" width="120.0" height="47.6" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="730.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">пам'ять</tspan><tspan x="730.0" dy="15.6">код + дані</tspan></text>
<line x1="210.0" y1="140.0" x2="300.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="660.0" y1="140.0" x2="672.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="160.0" y="220.0" width="500.0" height="34.0" rx="6" fill="#fff8e6" stroke="#caa24a" stroke-width="1.5"/><text x="410.0" y="241.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">код і дані ділять ту саму B: B_код + B_дані ≤ B</tspan></text>
<text x="410.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хоч би який швидкий процесор — сумарний потік до пам'яті впирається в одну смугу. Це і є вузьке місце.</text>
</svg>