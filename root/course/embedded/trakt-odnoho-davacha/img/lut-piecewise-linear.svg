<rect x="532.0" y="92.0" width="291.0" height="60.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="677.5" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">T_x = T[i] + (Code_x − Code[i]) · k</text>
<text x="677.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">де k = (T[i+1] − T[i]) / (Code[i+1] − Code[i])</text>
<text x="535.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Переваги для мікроконтролера:</text>
<text x="535.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Жодних важких викликів log() та pow()</text>
<text x="535.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• 1 ділення + 1 множення або бітовий зсув</text>
<text x="535.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Таблиця 33–65 точок дає похибку &lt; 0.05 °C</text>
<text x="535.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Час виконання: лічені такти процесора</text>
