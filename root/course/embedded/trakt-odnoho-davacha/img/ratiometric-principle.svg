<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логометричний принцип: чому шум живлення взаємно знищується</text>
<rect x="30.0" y="50.0" width="380.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="220.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Напруга на вході АЦП (V_in)</text>
<text x="220.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Дільник живиться від спільної шини V_ref:</text>
<rect x="60.0" y="120.0" width="320.0" height="48.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="220.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_in = (V_ref + ΔV) ·</text>
<text x="310.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">R_ntc</text>
<line x1="265.0" y1="142.0" x2="365.0" y2="142.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="315.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">R_ref + R_ntc</text>
<text x="220.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Якщо V_ref просіла або шумить на +ΔV,</text>
<text x="220.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">вхідна напруга V_in масштабується синхронно</text>
<text x="220.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">у точно такій самій пропорції.</text>
<line x1="418.0" y1="150.0" x2="442.0" y2="150.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="450.0" y="50.0" width="380.0" height="200.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.2"/>
<text x="640.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Цифровий код АЦП (Код)</text>
<text x="640.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">АЦП ділить вхід на власну шкалу V_ref:</text>
<rect x="475.0" y="120.0" width="330.0" height="52.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="525.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Код = 2ᴺ ·</text>
<text x="665.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">(V_ref + ΔV) · (R_ntc / (R_ref + R_ntc))</text>
<line x1="570.0" y1="144.0" x2="790.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="665.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">(V_ref + ΔV)</text>
<line x1="576.0" y1="141.0" x2="655.0" y2="133.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="625.0" y1="166.0" x2="705.0" y2="157.0" stroke="#2457d6" stroke-width="1.8"/>
<rect x="495.0" y="188.0" width="290.0" height="42.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="640.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Код = 2ᴺ · R_ntc / (R_ref + R_ntc)</text>
<text x="640.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">✓ Дрейф опорної напруги повністю зникає з результату!</text>
</svg>