<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Польовий антенний тракт: вибір діаграми спрямованості та грозозахист</text>
<rect x="50.0" y="60.0" width="420.0" height="335.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="260.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типи польових антен для Wi-Fi</text>
<rect x="70.0" y="110.0" width="380.0" height="60.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="80.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">1. Штирьовий диполь / колінеар (Dipole)</text>
<text x="80.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="80.0" dy="0.0">Всеспрямована 360° по горизонту (+2..+5 дБі).</tspan><tspan x="80.0" dy="12.3">Стискає вертикальну пелюстку: при нахилі щогли лінк зникає!</tspan></text>
<rect x="70.0" y="185.0" width="380.0" height="60.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="80.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">2. Патч-антена (Microstrip Panel)</text>
<text x="80.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="80.0" dy="0.0">Секторна 60°..90° (+8..+14 дБі).</tspan><tspan x="80.0" dy="12.3">Компактна, стійка до вітру, для базових станцій на межі поля.</tspan></text>
<rect x="70.0" y="260.0" width="380.0" height="60.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="80.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">3. Хвильовий канал (Yagi-Uda)</text>
<text x="80.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="80.0" dy="0.0">Гостроспрямована 25°..40° (+12..+18 дБі).</tspan><tspan x="80.0" dy="12.3">Максимальна дальність для фіксованих точкових радіомостів.</tspan></text>
<rect x="500.0" y="60.0" width="390.0" height="335.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="695.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Схема захисту від атмосферної статики</text>
<line x1="560.0" y1="110.0" x2="560.0" y2="360.0" stroke="#4b5563" stroke-width="5.0"/>
<text x="548.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Щогла</text>
<line x1="560.0" y1="110.0" x2="560.0" y2="90.0" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="560.0" cy="85.0" r="4.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="572.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Антена (DC-Grounded)</text>
<rect x="570.0" y="138.0" width="45.0" height="24.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="592.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">GDT</text>
<line x1="560.0" y1="110.0" x2="570.0" y2="150.0" stroke="#333333" stroke-width="2.0"/>
<line x1="592.0" y1="162.0" x2="592.0" y2="360.0" stroke="#d97706" stroke-width="3.0" stroke-dasharray="4,2"/>
<line x1="580.0" y1="360.0" x2="604.0" y2="360.0" stroke="#d97706" stroke-width="3.0"/>
<line x1="584.0" y1="366.0" x2="600.0" y2="366.0" stroke="#d97706" stroke-width="2.5"/>
<line x1="588.0" y1="372.0" x2="596.0" y2="372.0" stroke="#d97706" stroke-width="2.0"/>
<text x="610.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="start" font-weight="700">Контур заземлення (PE)
мідна шина ≥16 мм²</text>
<rect x="630.0" y="210.0" width="140.0" height="95.0" rx="5" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="700.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гермобокс IP67</text>
<text x="700.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ESP32 / Wi-Fi вузол</tspan><tspan x="700.0" dy="12.3">(Фідер &lt; 0.5 м LMR-195)</tspan><tspan x="700.0" dy="12.3"></tspan><tspan x="700.0" dy="12.3">Вниз іде лише дріт</tspan><tspan x="700.0" dy="12.3">живлення / PoE / RS-485</tspan></text>
<line x1="615.0" y1="150.0" x2="630.0" y2="240.0" stroke="#333333" stroke-width="2.0"/>
</svg>