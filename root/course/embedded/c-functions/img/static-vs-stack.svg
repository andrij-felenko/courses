<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"> f() кличе f(), поки перший виклик ще працює</text>
<text x="205.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">статично (Fortran)</text>
<text x="205.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">один слот на функцію, назавжди</text>
<rect x="110.0" y="150.0" width="190.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="205.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">слот f()</text>
<text x="205.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">локальні + адреса</text>
<text x="205.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">повернення</text>
<text x="145.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">1-й виклик</text>
<text x="265.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2-й виклик</text>
<line x1="145.0" y1="292.0" x2="175.0" y2="244.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="265.0" y1="292.0" x2="235.0" y2="244.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">другий затирає перший</text>
<text x="205.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">повернутися вже нікуди</text>
<line x1="380.0" y1="60.0" x2="380.0" y2="360.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,5"/>
<text x="555.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">стеково (ALGOL 60)</text>
<text x="555.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">свіжий кадр на КОЖЕН виклик</text>
<rect x="460.0" y="248.0" width="190.0" height="52.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="555.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">кадр f() — виклик 1</text>
<text x="555.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">свої дані, ціле</text>
<rect x="460.0" y="190.0" width="190.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="555.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">кадр f() — виклик 2</text>
<text x="555.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">окремі дані, ціле</text>
<text x="555.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">обидва живі — рекурсія працює</text>
</svg>