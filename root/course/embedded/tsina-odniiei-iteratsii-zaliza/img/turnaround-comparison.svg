<text x="40.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Дозволяє команді писати код драйверів вже сьогодні, доки виправлена версія плати виготовляється штатно.</text>
