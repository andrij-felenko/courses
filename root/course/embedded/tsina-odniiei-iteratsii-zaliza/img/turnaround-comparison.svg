<text x="835.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="end" font-weight="700">Час: 18–25 днів | Вартість: $1500–$4000*</text>
