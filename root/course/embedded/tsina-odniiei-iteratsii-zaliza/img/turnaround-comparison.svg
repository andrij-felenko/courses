<text x="835.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">Час: 2–6 годин | Прямі витрати: ~$0</text>
