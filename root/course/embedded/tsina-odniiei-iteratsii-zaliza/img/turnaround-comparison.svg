<text x="40.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Плата за терміновість (Rush fee) збільшує вартість фабрикації у 2–4 рази, але суттєво рятує дедлайн.</text>
