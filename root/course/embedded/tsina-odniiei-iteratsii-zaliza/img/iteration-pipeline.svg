<text x="437.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="437.0" dy="0.0">Дозволяє відновити базові функції за 1–4 години та продовжити розробку вбудованого ПЗ,</tspan><tspan x="437.0" dy="13.5">поки виправлена ревізія друкується й монтується у фоновому режимі.</tspan></text>
