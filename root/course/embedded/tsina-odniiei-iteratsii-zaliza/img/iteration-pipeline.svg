<text x="320.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">• Затримка проєкту: 14–28 днів (перевиправлення CAD, очікування нової ревізії Rev B)</tspan><tspan x="320.0" dy="12.8">• Фінансові втрати: списання зіпсованих компонентів, повторна оплата підготовки SMT, доставка</tspan><tspan x="320.0" dy="12.8">• Простій команди: розробники прошивки заблоковані через відсутність робочого заліза</tspan></text>
