<rect x="325.0" y="345.0" width="290.0" height="65.0" rx="5" fill="#fffaf9" stroke="#c0392b" stroke-width="1.1"/>
<text x="470.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Сторож таймаутів (10 Гц)</text>
<text x="470.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сплив час → onError(TIMEOUT)</text>
