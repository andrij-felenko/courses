<line x1="50.0" y1="465.0" x2="890.0" y2="465.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="470.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Гібридна модель: семантика запит-відповідь для програміста, але повністю асинхронна шина без зависань потоків.</text>
