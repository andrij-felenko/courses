<text x="785.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">[ID=42, RSP, RESULT]</text>
<line x1="270.0" y1="185.0" x2="310.0" y2="185.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
