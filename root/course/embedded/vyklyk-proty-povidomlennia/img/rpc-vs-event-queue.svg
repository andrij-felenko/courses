<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння парадигм: Синхронний RPC проти Черги повідомлень</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">використання потоків RTOS, блокування стека та розподіл часу під час віддаленої взаємодії</text>
<rect x="40.0" y="80.0" width="410.0" height="380.0" rx="8" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<text x="245.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Синхронний RPC (Request-Response)</text>
<text x="245.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ілюзія локальної функції: int res = read_sensor();</text>
<rect x="65.0" y="150.0" width="100.0" height="32.0" rx="5" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="115.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік клієнта</text>
<line x1="115.0" y1="182.0" x2="115.0" y2="410.0" stroke="#c0392b" stroke-width="1.5"/>
<rect x="107.0" y="210.0" width="16.0" height="140.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="100.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">Блокування RTOS</text>
<text x="100.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">(xSemaphoreTake)</text>
<rect x="325.0" y="150.0" width="100.0" height="32.0" rx="5" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="375.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Серверний вузол</text>
<line x1="375.0" y1="182.0" x2="375.0" y2="410.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="115.0" y1="210.0" x2="375.0" y2="250.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="245.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Маршалінг + TX запиту</text>
<rect x="367.0" y="250.0" width="16.0" height="60.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="395.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Обробка</text>
<line x1="375.0" y1="310.0" x2="115.0" y2="350.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="245.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">RX відповіді + розпакування</text>
<text x="245.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Стек задачі утримується весь RTT (10–200 мс)</text>
<text x="245.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Втрата пакету блокує потік до таймауту</text>
<rect x="490.0" y="80.0" width="410.0" height="380.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="695.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Черга повідомлень (Event-Driven / Actor)</text>
<text x="695.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Асинхронний поділ: post_msg(EVT_REQ, id);</text>
<rect x="515.0" y="150.0" width="100.0" height="32.0" rx="5" fill="#eefaf2" stroke="#27ae60" stroke-width="1.2"/>
<text x="565.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Задача-сенсор</text>
<line x1="565.0" y1="182.0" x2="565.0" y2="410.0" stroke="#27ae60" stroke-width="1.5"/>
<rect x="775.0" y="150.0" width="100.0" height="32.0" rx="5" fill="#eefaf2" stroke="#27ae60" stroke-width="1.2"/>
<text x="825.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шина / Диспетчер</text>
<line x1="825.0" y1="182.0" x2="825.0" y2="410.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="565.0" y1="205.0" x2="825.0" y2="220.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="695.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Push у чергу (2 мкс)</text>
<rect x="557.0" y="225.0" width="16.0" height="120.0" rx="3" fill="#dcfce7" stroke="#27ae60" stroke-width="1.2"/>
<text x="550.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">Потік працює далі!</text>
<text x="550.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Керує мотором/LED</text>
<line x1="825.0" y1="350.0" x2="565.0" y2="375.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="695.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Вхідна подія EVT_DATA</text>
<text x="695.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Нульове блокування: 1 потік на всю систему</text>
<text x="695.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стійкість до будь-яких затримок середовища</text>
<line x1="50.0" y1="485.0" x2="890.0" y2="485.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="470.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">RPC прив'язує час життя локального потоку до надійності віддаленої мережі; черга подій розриває цей зв'язок.</text>
</svg>