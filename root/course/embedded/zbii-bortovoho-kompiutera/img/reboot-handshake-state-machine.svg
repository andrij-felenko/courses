<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів безпечного відновлення зв'язку під час рестарту SBC у польоті</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="490.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат безпечного підключення та повернення в Offboard після перезапуску SBC</text>
<text x="490.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">заборонено миттєво вмикати Offboard: потрібна фаза синхронізації телеметрії та прогріву потоку уставок</text>
<rect x="40.0" y="120.0" width="160.0" height="90.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="120.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. ЗБІЙ І РЕСТАРТ</text>
<line x1="50.0" y1="154.0" x2="190.0" y2="154.0" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="120.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">FCU в режимі LOITER</text>
<text x="120.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">SBC перезавантажується</text>
<text x="120.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Живлення скинуто</text>
<rect x="230.0" y="120.0" width="165.0" height="90.0" rx="10" fill="#fff5e6" stroke="#d98a00" stroke-width="1.8"/>
<text x="312.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="700">2. СТАРТ СЛУЖОБ</text>
<line x1="240.0" y1="154.0" x2="385.0" y2="154.0" stroke="#d98a00" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="312.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Linux завантажився</text>
<text x="312.5" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">ROS 2 / MAVSDK запуск</text>
<text x="312.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">UART порт відкрито</text>
<rect x="430.0" y="120.0" width="165.0" height="90.0" rx="10" fill="#eef2ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="512.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">3. СИНХРОНІЗАЦІЯ</text>
<line x1="440.0" y1="154.0" x2="585.0" y2="154.0" stroke="#2457d6" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="512.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Читання поточної позиції</text>
<text x="512.5" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Звірка режиму польоту</text>
<text x="512.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Оцінка здоров'я EKF</text>
<rect x="630.0" y="120.0" width="165.0" height="90.0" rx="10" fill="#eafaef" stroke="#27ae60" stroke-width="1.8"/>
<text x="712.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">4. ПРОГРІВ ПОТОКУ</text>
<line x1="640.0" y1="154.0" x2="785.0" y2="154.0" stroke="#27ae60" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="712.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Уставки = поточній точці</text>
<text x="712.5" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Потік 20 Гц понад 1 с</text>
<text x="712.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Помилка = 0</text>
<rect x="830.0" y="120.0" width="120.0" height="90.0" rx="10" fill="#dcfce7" stroke="#27ae60" stroke-width="1.8"/>
<text x="890.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5. OFFBOARD</text>
<line x1="840.0" y1="154.0" x2="940.0" y2="154.0" stroke="#27ae60" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="890.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Handshake OK</text>
<text x="890.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Плавний рух</text>
<text x="890.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Місія триває</text>
<line x1="200.0" y1="165.0" x2="227.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<line x1="395.0" y1="165.0" x2="427.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<line x1="595.0" y1="165.0" x2="627.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrG)" stroke-linecap="round"/>
<line x1="795.0" y1="165.0" x2="827.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrG)" stroke-linecap="round"/>
<text x="195.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">boot complete (~20 с)</text>
<text x="397.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">MAVLink heartbeat OK</text>
<text x="597.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">потік стабільний 1 с</text>
<text x="797.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">FCU switch accept</text>
<rect x="80.0" y="270.0" width="820.0" height="160.0" rx="12" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="490.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЧОМУ НЕОБХІДНИЙ ПРОГРІВ ПОТОКУ (BUMPLESS TRANSFER НА ЕТАПІ 4)</text>
<rect x="100.0" y="318.0" width="380.0" height="95.0" rx="8" fill="#fff3f3" stroke="#c0392b" stroke-width="1.4"/>
<text x="290.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">НЕБЕЗПЕЧНО: СТАРТ ЗІ СТАРИМИ УСТАВКАМИ</text>
<text x="290.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Якщо SBC надішле ціль до збою, дрон</text>
<text x="290.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">зробить різкий ривок на повній швидкості,</text>
<text x="290.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">що спричинить зрив потоку або аварію.</text>
<rect x="500.0" y="318.0" width="380.0" height="95.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="690.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">БЕЗПЕЧНО: СИНХРОНІЗОВАНЕ ПІДХОПЛЕННЯ</text>
<text x="690.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">SBC читає координату дрона в LOITER,</text>
<text x="690.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">формує уставку точно в цю точку, і лише</text>
<text x="690.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">потім плавно нарощує вектор траєкторії.</text>
<text x="490.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Повторний вхід у контур Offboard можливий лише після безшовної синхронізації координат і відсутності похибки позиції.</text>
</svg>