<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація збоїв бортового комп'ютера та їх прояв на автопілоті</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="500.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири класи збоїв SBC та їхня трансформація в симптоми на польотному контролері</text>
<text x="500.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">різні фізичні та програмні першопричини зводяться до двох сигналів автопілота: втрата потоку уставок і втрата серцебиття</text>
<rect x="40.0" y="95.0" width="215.0" height="210.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="147.5" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ПРОГРАМНИЙ КРАХ</text>
<line x1="55.0" y1="133.0" x2="240.0" y2="133.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="54.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Падіння ROS 2 / MAVSDK</text>
<text x="54.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• SIGSEGV / Panic у С++</text>
<text x="54.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• OOM Killer через витік RAM</text>
<text x="54.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Стек задач завершено</text>
<rect x="50.0" y="263.0" width="195.0" height="32.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="147.5" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Сокет закрито / потік зупинено</text>
<line x1="147.5" y1="305.0" x2="147.5" y2="360.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrR)" stroke-linecap="round"/>
<rect x="280.0" y="95.0" width="215.0" height="210.0" rx="10" fill="#fff5e6" stroke="#d98a00" stroke-width="1.8"/>
<text x="387.5" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="700">ЗАВИСАННЯ ОС / CPU</text>
<line x1="295.0" y1="133.0" x2="480.0" y2="133.0" stroke="#d98a00" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="294.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Thermal Throttling до 200 МГц</text>
<text x="294.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 100% CPU starvation</text>
<text x="294.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Kernel deadlock / RCU stall</text>
<text x="294.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• I/O залочка на Flash/eMMC</text>
<rect x="290.0" y="263.0" width="195.0" height="32.0" rx="6" fill="#ffffff" stroke="#d98a00" stroke-width="1.2"/>
<text x="387.5" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d98a00" text-anchor="middle" font-weight="700">Джиттер &gt; 1 с / фриз петлі</text>
<line x1="387.5" y1="305.0" x2="387.5" y2="360.0" stroke="#d98a00" stroke-width="2.0" marker-end="url(#arrG)" stroke-linecap="round"/>
<rect x="520.0" y="95.0" width="215.0" height="210.0" rx="10" fill="#eef2ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="627.5" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ЗБІЙ ЛІНІЇ ЗВ'ЯЗКУ</text>
<line x1="535.0" y1="133.0" x2="720.0" y2="133.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="534.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Шуми на UART від моторів</text>
<text x="534.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• RX/TX FIFO buffer overrun</text>
<text x="534.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Збій USB FTDI драйвера</text>
<text x="534.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зрив байтової синхронізації</text>
<rect x="530.0" y="263.0" width="195.0" height="32.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="627.5" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">CRC помилки / биті кадри</text>
<line x1="627.5" y1="305.0" x2="627.5" y2="360.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrB)" stroke-linecap="round"/>
<rect x="760.0" y="95.0" width="200.0" height="210.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="860.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ПРОСАДКА ЖИВЛЕННЯ</text>
<line x1="775.0" y1="133.0" x2="945.0" y2="133.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="774.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Просідання 5V нижче 4.63V</text>
<text x="774.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Піковий струм серво/моторів</text>
<text x="774.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Перегрів імпульсного BEC</text>
<text x="774.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Brownout Reset процесора</text>
<rect x="770.0" y="263.0" width="180.0" height="32.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="860.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Миттєвий рестарт (20-40 с)</text>
<line x1="860.0" y1="305.0" x2="860.0" y2="360.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrR)" stroke-linecap="round"/>
<rect x="60.0" y="365.0" width="880.0" height="140.0" rx="12" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="500.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">РЕАКЦІЯ ПОЛЬОТНОГО КОНТРОЛЕРА (FCU / FMU)</text>
<rect x="90.0" y="415.0" width="380.0" height="72.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="280.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ТАЙМАУТ ПОТОКУ УСТАВОК (250-500 мс)</text>
<text x="280.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">SET_POSITION_TARGET_LOCAL_NED перестали йти</text>
<text x="280.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">→ Зрив режиму Offboard / перехід у Hold</text>
<rect x="530.0" y="415.0" width="380.0" height="72.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="720.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ВТРАТА HEARTBEAT (1.0-3.0 с)</text>
<text x="720.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">MAVLink статус відсутній / відмова шини</text>
<text x="720.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">→ Запуск аварійного повернення (RTL / Failsafe)</text>
<text x="500.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">FCU не знає причини збою: для нього відсутність пакета через Kernel Panic або через брудний UART виглядає однаково.</text>
</svg>