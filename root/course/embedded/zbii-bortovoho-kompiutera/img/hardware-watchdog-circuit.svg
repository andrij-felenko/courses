<text x="815.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Парсер MAVLink / Offboard</text>
<rect x="710.0" y="300.0" width="210.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="815.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">GPIO IN: Strobe / Pulse Capture</text>
<text x="815.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Таймер перевірки імпульсів</text>
<rect x="710.0" y="370.0" width="210.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="815.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">АВТОНОМНИЙ FSM СТЕК</text>
<text x="815.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ПІД-регулятори, EKF2, Nav</text>
<text x="815.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Повністю незалежне живлення</text>
