<line x1="155.0" y1="75.0" x2="155.0" y2="242.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrR)" stroke-linecap="round"/>
<text x="410.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">PWR_EN (FCU скидає живлення при зависанні)</text>
<line x1="590.0" y1="250.0" x2="707.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrB)" stroke-linecap="round"/>
<line x1="710.0" y1="260.0" x2="593.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrB)" stroke-linecap="round"/>
<text x="650.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">MAVLink</text>
<line x1="590.0" y1="325.0" x2="707.0" y2="325.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrG)" stroke-linecap="round"/>
<text x="650.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Heartbeat Pulse</text>
<text x="490.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Апаратний сторож дає незалежність: якщо процес MAVSDK зависне на SBC, строб припиниться, і FCU перезавантажить живлення SBC.</text>
