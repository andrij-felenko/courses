<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема електричного та логічного сполучення FCU і бортового комп'ютера</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="490.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне сполучення FCU та SBC: кероване живлення й апаратний сторож</text>
<text x="490.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">польотний контролер може апаратно перезавантажити бортовий комп'ютер через ключ живлення за відсутності строб-сигналу</text>
<rect x="40.0" y="95.0" width="230.0" height="365.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="155.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ВУЗОЛ ЖИВЛЕННЯ SBC</text>
<rect x="60.0" y="145.0" width="190.0" height="60.0" rx="8" fill="#fff5e6" stroke="#d98a00" stroke-width="1.4"/>
<text x="155.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="700">DC-DC BEC 5V / 12V</text>
<text x="155.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Живлення від батареї LiPo</text>
<rect x="60.0" y="245.0" width="190.0" height="85.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="155.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">P-MOSFET / Ключ живлення</text>
<text x="155.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(High-Side Switch / TPS22810)</text>
<text x="155.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Розриває +5V на SBC</text>
<line x1="155.0" y1="205.0" x2="155.0" y2="242.0" stroke="#d98a00" stroke-width="2.0" marker-end="url(#arrG)" stroke-linecap="round"/>
