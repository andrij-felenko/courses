<text x="300.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+5V Power</text>
<line x1="710.0" y1="185.0" x2="660.0" y2="185.0" stroke="#c0392b" stroke-width="1.8"/>
