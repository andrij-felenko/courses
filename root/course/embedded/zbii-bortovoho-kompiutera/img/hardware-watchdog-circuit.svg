<text x="480.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Перевіряє MAVSDK/ROS 2</text>
<text x="480.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">і смикає GPIO тільки при здоров'ї</text>
<rect x="690.0" y="95.0" width="250.0" height="365.0" rx="10" fill="#eafaef" stroke="#27ae60" stroke-width="1.8"/>
<text x="815.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПОЛЬОТНИЙ КОНТРОЛЕР (FCU)</text>
<text x="815.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Pixhawk / STM32H7 (PX4 / ArduPilot)</text>
<rect x="710.0" y="160.0" width="210.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
