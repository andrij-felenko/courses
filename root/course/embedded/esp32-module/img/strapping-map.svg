<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Піни вибору завантаження й пастка напруги Flash</text>
<text x="430.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Піни-strapping: що вони вирішують у мить скидання</text>
<rect x="60.0" y="80.0" width="160.0" height="64.0" rx="8" fill="#eef1fb" stroke="#27ae60" stroke-width="1.8"/>
<text x="140.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">IO0</text>
<text x="140.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">внутр. підтяжка ↑</text>
<path d="M 224,112 h 26" fill="none" stroke="#6b7280" stroke-width="2"/>
<line x1="250.0" y1="112.0" x2="264.0" y2="112.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="88.0" width="520.0" height="48.0" rx="6" fill="#f6f4ee" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">низько → режим прошивки; високо → запуск з Flash</tspan></text>
<rect x="60.0" y="162.0" width="160.0" height="64.0" rx="8" fill="#eef1fb" stroke="#6b7280" stroke-width="1.8"/>
<text x="140.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">IO2</text>
<text x="140.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">внутр. підтяжка ↓</text>
<path d="M 224,194 h 26" fill="none" stroke="#6b7280" stroke-width="2"/>
<line x1="250.0" y1="194.0" x2="264.0" y2="194.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="170.0" width="520.0" height="48.0" rx="6" fill="#f6f4ee" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="197.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">має бути вільним/низько для входу в прошивку</tspan></text>
<rect x="60.0" y="244.0" width="160.0" height="64.0" rx="8" fill="#eef1fb" stroke="#6b7280" stroke-width="1.8"/>
<text x="140.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">IO15 (MTDO)</text>
<text x="140.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">внутр. підтяжка ↑</text>
<path d="M 224,276 h 26" fill="none" stroke="#6b7280" stroke-width="2"/>
<line x1="250.0" y1="276.0" x2="264.0" y2="276.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="252.0" width="520.0" height="48.0" rx="6" fill="#f6f4ee" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">низько → глушить лог завантажувача на UART</tspan></text>
<rect x="60.0" y="326.0" width="160.0" height="64.0" rx="8" fill="#eef1fb" stroke="#c0392b" stroke-width="1.8"/>
<text x="140.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">IO12 (MTDI)</text>
<text x="140.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">внутр. підтяжка ↓</text>
<path d="M 224,358 h 26" fill="none" stroke="#6b7280" stroke-width="2"/>
<line x1="250.0" y1="358.0" x2="264.0" y2="358.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="334.0" width="520.0" height="48.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="361.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">ВИСОКО при старті → 1.8 В Flash → псує модуль 3.3 В</tspan></text>
<text x="430.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Незадіяний пін бере рівень від внутрішньої підтяжки — тож зовнішня логіка на цих ніжках небезпечна.</text>
</svg>