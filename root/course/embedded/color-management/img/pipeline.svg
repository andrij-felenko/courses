<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр кольору: від макета до скла — де код стає світлом</text>
<text x="440.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">значення збережено в гама-кодуванні (sRGB); десь по дорозі його треба декодувати в світло</text>
<rect x="40.0" y="110.0" width="170.0" height="78.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="125.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет / шрифт</text>
<text x="125.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">значення sRGB</text>
<rect x="250.0" y="110.0" width="180.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="340.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кадровий буфер МК</text>
<text x="340.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ті самі коди в RAM</text>
<rect x="470.0" y="110.0" width="180.0" height="78.0" rx="8" fill="#fff4e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="560.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контролер / панель</text>
<text x="560.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перетворює код у світло</text>
<rect x="700.0" y="110.0" width="140.0" height="78.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="770.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Око</text>
<text x="770.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">бачить яскравість</text>
<line x1="210.0" y1="149.0" x2="248.0" y2="149.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="430.0" y1="149.0" x2="468.0" y2="149.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="650.0" y1="149.0" x2="698.0" y2="149.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="250.0" y="232.0" width="400.0" height="58.0" rx="8" fill="#fff8e8" stroke="#caa24a" stroke-width="1.6"/>
<text x="450.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a7d2e" text-anchor="middle" font-weight="700">ТУТ діє гама: панель (LCD), таблиця LUT або математика в коді</text>
<text x="450.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">блендінг і градієнти рахуй у ЛІНІЙНОМУ світлі, інакше темнітиме й брудниться</text>
<line x1="360.0" y1="232.0" x2="340.0" y2="190.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="232.0" x2="560.0" y2="190.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Помилка: змішати напівпрозорі кольори прямо в кодах sRGB — результат виходить темнішим за правильний.</text>
</svg>