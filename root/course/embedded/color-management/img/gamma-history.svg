<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життя кривої γ крізь століття: причина мінялася тричі, крива — ні</text>
<text x="450.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">один показник степеня переходив від плівки до гармати, тоді до файлу — і жодного разу не зник</text>
<line x1="70.0" y1="360.0" x2="830.0" y2="360.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="826.0" y1="360.0" x2="846.0" y2="360.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="844.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">час</text>
<rect x="76.0" y="78.0" width="248.0" height="270.0" rx="10" fill="#e8eefb" stroke="none" stroke-width="0.0"/>
<text x="200.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ФОТОГРАФІЯ</text>
<rect x="338.0" y="78.0" width="330.0" height="270.0" rx="10" fill="#fdf0e4" stroke="none" stroke-width="0.0"/>
<text x="503.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c77f2e" text-anchor="middle" font-weight="700">ТЕЛЕБАЧЕННЯ</text>
<rect x="683.0" y="78.0" width="147.0" height="270.0" rx="10" fill="#e8f6ec" stroke="none" stroke-width="0.0"/>
<text x="756.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЦИФРА</text>
<rect x="70.9" y="123.2" width="158.2" height="53.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Гуртер і Дріффілд</tspan><tspan x="150.0" dy="14.3">γ — нахил кривої плівки</tspan><tspan x="150.0" dy="14.3">(міра контрасту)</tspan></text>
<line x1="150.0" y1="176.8" x2="150.0" y2="352.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="150.0" cy="360.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<text x="150.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1890</text>
<rect x="348.4" y="123.2" width="133.1" height="53.6" rx="6" fill="#ffffff" stroke="#c77f2e" stroke-width="1.6"/><text x="415.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">Гармата CRT</tspan><tspan x="415.0" dy="14.3">світло ∝ сигнал^2.5</tspan><tspan x="415.0" dy="14.3">камера кодує ^0.45</tspan></text>
<line x1="415.0" y1="176.8" x2="415.0" y2="352.0" stroke="#c77f2e" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="415.0" cy="360.0" r="6.0" fill="#c77f2e" stroke="#ffffff" stroke-width="2.0"/>
<text x="415.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c77f2e" text-anchor="middle" font-weight="700">1930-ті</text>
<rect x="515.3" y="223.2" width="139.4" height="53.6" rx="6" fill="#ffffff" stroke="#c77f2e" stroke-width="1.6"/><text x="585.0" y="239.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Економіка ТБ</tspan><tspan x="585.0" dy="14.3">коректор — у камеру,</tspan><tspan x="585.0" dy="14.3">не в мільйони ТВ</tspan></text>
<line x1="585.0" y1="276.8" x2="585.0" y2="352.0" stroke="#c77f2e" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="585.0" cy="360.0" r="6.0" fill="#c77f2e" stroke="#ffffff" stroke-width="2.0"/>
<text x="585.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c77f2e" text-anchor="middle" font-weight="700">ХХ ст.</text>
<rect x="653.0" y="123.2" width="177.0" height="53.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="741.5" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="741.5" dy="0.0">sRGB (HP+MS)</tspan><tspan x="741.5" dy="14.3">крива застигає в стандарті</tspan><tspan x="741.5" dy="14.3">IEC 61966-2-1, 1999</tspan></text>
<line x1="760.0" y1="176.8" x2="760.0" y2="352.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="760.0" cy="360.0" r="6.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<text x="760.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1996</text>
<text x="450.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Народилась у темній кімнаті фотографа, виросла в електронній гарматі, застигла у файлі — та сама γ.</text>
</svg>