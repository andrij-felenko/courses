<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Диспетчер вивантаження логів, пріоритезація та захист каналу</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розподіл потоків між звичайним кільцевим буфером і аварійним розділом (Crash Dump)</text>
<rect x="40.0" y="80.0" width="200.0" height="160.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="140.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">CRASH / PANIC PARTITION</text>
<text x="140.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Виділений Flash-сектор</text>
<text x="140.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Дамп регістрів (R0-R15)</text>
<text x="140.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Причина паніки / HardFault</text>
<text x="140.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Міні-трейс стека ядра</text>
<text x="140.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Пріоритет #1: Негайно</text>
<rect x="40.0" y="260.0" width="200.0" height="170.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="140.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">RING LOG BUFFER</text>
<text x="140.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кільце секторів (64 КБ)</text>
<text x="140.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Поточні INFO / WARN / ERR</text>
<text x="140.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Накопичення при офлайні</text>
<text x="140.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Витіснення старих INFO</text>
<text x="140.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Пріоритет #2: Фонова пачка</text>
<rect x="290.0" y="80.0" width="240.0" height="350.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.8"/>
<text x="410.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Диспетчер передачі (Uploader)</text>
<line x1="300.0" y1="120.0" x2="520.0" y2="120.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="2 2"/>
<rect x="301.7" y="137.5" width="216.6" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">1. Перевірка наявності Crash Dump</tspan><tspan x="410.0" dy="13.0">Якщо є -&gt; терміновий пакет</tspan></text>
<rect x="317.2" y="202.5" width="185.6" height="35.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">2. Пакування логів у пачку</tspan><tspan x="410.0" dy="13.0">Формування блоку до 512B MTU</tspan></text>
<rect x="329.9" y="267.5" width="160.2" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">3. Кадрування COBS + CRC</tspan><tspan x="410.0" dy="13.0">Захист транспортного рівня</tspan></text>
<rect x="311.0" y="331.0" width="198.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">4. Очікування Server ACK</tspan><tspan x="410.0" dy="13.0">Успіх -&gt; зсув Tail pointer</tspan><tspan x="410.0" dy="13.0">Помилка -&gt; Exponential Backoff</tspan></text>
<line x1="244.0" y1="160.0" x2="286.0" y2="155.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="244.0" y1="345.0" x2="286.0" y2="220.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="580.0" y="80.0" width="220.0" height="170.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="690.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер моніторингу</text>
<text x="690.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Хмара / Ingestion Service</text>
<text x="690.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Прийом пачки логів</text>
<text x="690.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Перевірка CRC та Tokenize</text>
<text x="690.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">• Відповідь: ACK(LastSeq)</text>
<rect x="580.0" y="270.0" width="220.0" height="160.0" rx="8" fill="#fdfefe" stroke="#6b7280" stroke-width="1.2"/>
<text x="690.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Обмежений канал (IoT)</text>
<text x="690.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">NB-IoT / LTE-M / LoRa / BLE</text>
<text x="690.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">• Дорогі байт-квоти й батарея</text>
<text x="690.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">• Пакетування знижує трафік</text>
<text x="690.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">• Тротлінг при слабкому сигналі</text>
<line x1="534.0" y1="180.0" x2="576.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="555.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Batch Data</text>
<line x1="576.0" y1="210.0" x2="534.0" y2="350.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="555.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Server ACK</text>
</svg>