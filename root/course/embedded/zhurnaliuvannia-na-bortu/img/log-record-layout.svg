<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 876 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="876" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Байтове компонування бінарного запису логу (Binary Log Frame)</text>
<text x="410.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Фіксований заголовок, токен, упаковані аргументи змінної довжини та контрольна сума</text>
<rect x="40.0" y="85.0" width="85.0" height="90.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="82.5" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синхробайти</text>
<text x="82.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">0x55AA</text>
<text x="82.5" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2B</text>
<rect x="127.0" y="85.0" width="70.0" height="90.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="162.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Довжина</text>
<text x="162.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Length</text>
<text x="162.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1B</text>
<rect x="199.0" y="85.0" width="65.0" height="90.0" rx="5" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="231.5" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень</text>
<text x="231.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Level</text>
<text x="231.5" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1B</text>
<rect x="266.0" y="85.0" width="65.0" height="90.0" rx="5" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="298.5" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модуль</text>
<text x="298.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ModID</text>
<text x="298.5" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1B</text>
<rect x="333.0" y="85.0" width="95.0" height="90.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="380.5" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність</text>
<text x="380.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">SeqNum</text>
<text x="380.5" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4B</text>
<rect x="430.0" y="85.0" width="100.0" height="90.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="480.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мітка часу</text>
<text x="480.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Timestamp</text>
<text x="480.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4B</text>
<rect x="532.0" y="85.0" width="95.0" height="90.0" rx="5" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
<text x="579.5" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Токен ID</text>
<text x="579.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d4ac0d" text-anchor="middle" font-weight="700">TokenID</text>
<text x="579.5" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4B</text>
<rect x="629.0" y="85.0" width="145.0" height="90.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="701.5" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аргументи (Varargs)</text>
<text x="701.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Payload bytes</text>
<text x="701.5" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">NB</text>
<rect x="776.0" y="85.0" width="80.0" height="90.0" rx="5" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="816.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">CRC16</text>
<text x="816.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">CRC-16</text>
<text x="816.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2B</text>
<rect x="40.0" y="210.0" width="740.0" height="125.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="55.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Синхронізація (0x55AA):</text>
<text x="235.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Дозволяє знайти початок наступного запису після раптового збою живлення чи пошкодження.</text>
<text x="55.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень + Модуль:</text>
<text x="235.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">1 байт рівня (TRACE..FATAL) + 1 байт підсистеми (0: Power, 1: Radio, 2: Sensors, 3: Flash).</text>
<text x="55.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">SeqNum + Час:</text>
<text x="235.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">SeqNum ловить пропущені пакети; Timestamp (мс монотонного таймера) дає точну хронологію.</text>
<text x="55.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">TokenID + Payload:</text>
<text x="235.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">32-бітний хеш рядка замість ASCII-тексту + сирі змінні (int, float, status codes).</text>
<text x="55.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Контрольна сума CRC-16:</text>
<text x="235.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Захист від читання недописаного кадру під час знеструмлення або деградації комірок Flash.</text>
</svg>