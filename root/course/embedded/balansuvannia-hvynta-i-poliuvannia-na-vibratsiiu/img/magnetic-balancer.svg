<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Статичне балансування на магнітному підвісі з нульовим тертям</text>
<rect x="40.0" y="50.0" width="330.0" height="270.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Горизонтальний тест: маса лопатей</text><rect x="105.0" y="110.0" width="16.0" height="70.0" rx="6" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/><rect x="289.0" y="110.0" width="16.0" height="70.0" rx="6" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/><circle cx="121.0" cy="145.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><circle cx="289.0" cy="145.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/><line x1="127.0" y1="145.0" x2="283.0" y2="145.0" stroke="#333333" stroke-width="2.5"/><line x1="145.0" y1="127.0" x2="265.0" y2="163.0" stroke="#1a1a1a" stroke-width="4.0"/><circle cx="205.0" cy="145.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><text x="269.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Важка лопать (падає)</text><line x1="255.0" y1="161.0" x2="255.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="141.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Легка лопать</text><circle cx="56.0" cy="231.0" r="2.5" fill="#333333" stroke="#333333" stroke-width="1.0"/><text x="64.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вал підвішений у магнітному полі (нульове тертя кочення)</text><circle cx="56.0" cy="253.0" r="2.5" fill="#333333" stroke="#333333" stroke-width="1.0"/><text x="64.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Важча лопать під дією гравітації падає вниз</text><circle cx="56.0" cy="275.0" r="2.5" fill="#333333" stroke="#333333" stroke-width="1.0"/><text x="64.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Усунення: шліфування важкої або скотч на легку лопать</text><rect x="430.0" y="50.0" width="330.0" height="270.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="595.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Вертикальний тест: важка маточина (hub)</text><rect x="495.0" y="110.0" width="16.0" height="70.0" rx="6" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/><rect x="679.0" y="110.0" width="16.0" height="70.0" rx="6" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/><line x1="517.0" y1="145.0" x2="673.0" y2="145.0" stroke="#333333" stroke-width="2.5"/><line x1="595.0" y1="100.0" x2="595.0" y2="190.0" stroke="#1a1a1a" stroke-width="4.0"/><circle cx="595.0" cy="145.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><circle cx="605.0" cy="145.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="613.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Важкий бік</text><line x1="620.0" y1="160.0" x2="620.0" y2="177.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="595.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Повертається під вагою маточини</text><circle cx="446.0" cy="231.0" r="2.5" fill="#333333" stroke="#333333" stroke-width="1.0"/><text x="454.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Лопаті виставляються строго вертикально під 90°</text><circle cx="446.0" cy="253.0" r="2.5" fill="#333333" stroke="#333333" stroke-width="1.0"/><text x="454.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Якщо маточина асиметрична — гвинт сповзає вбік</text><circle cx="446.0" cy="275.0" r="2.5" fill="#333333" stroke="#333333" stroke-width="1.0"/><text x="454.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Усунення: крапля клею / скотч на легкий бік маточини</text>
</svg>