<rect x="25.0" y="50.0" width="250.0" height="280.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Статичний дисбаланс</text><circle cx="150.0" cy="145.0" r="40.0" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><line x1="102.0" y1="145.0" x2="198.0" y2="145.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="2 2"/><line x1="150.0" y1="97.0" x2="150.0" y2="193.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="2 2"/><circle cx="150.0" cy="145.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><text x="142.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">O</text><line x1="150.0" y1="145.0" x2="168.0" y2="131.0" stroke="#c0392b" stroke-width="1.5"/><circle cx="168.0" cy="131.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="176.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">m (центр мас)</text><text x="158.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">e</text><line x1="168.0" y1="131.0" x2="192.0" y2="113.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><text x="196.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">F_c</text><circle cx="43.0" cy="226.0" r="3.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/><text x="53.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Центр мас зміщений на e</text><circle cx="43.0" cy="249.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="53.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">Сила F = m·e·ω²</text><circle cx="43.0" cy="272.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><text x="53.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Частота збудження: 1× RPM</text><circle cx="43.0" cy="295.0" r="3.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/><text x="53.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Тягне вал у радіальний бік</text><rect x="300.0" y="50.0" width="250.0" height="280.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="425.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічний (моментний)</text><line x1="425.0" y1="100.0" x2="425.0" y2="190.0" stroke="#333333" stroke-width="2.0"/><text x="433.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">вісь обертання</text><line x1="400.0" y1="105.0" x2="450.0" y2="185.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/><text x="397.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="end">вісь інерції</text><circle cx="447.0" cy="120.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><circle cx="403.0" cy="170.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><line x1="447.0" y1="120.0" x2="467.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="403.0" y1="170.0" x2="383.0" y2="170.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">F</text><text x="380.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">F</text><line x1="417.0" y1="120.0" x2="417.0" y2="170.0" stroke="#6b7280" stroke-width="1.0"/><text x="411.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">l</text><circle cx="318.0" cy="226.0" r="3.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/><text x="328.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Вісь інерції нахилена на α</text><circle cx="318.0" cy="249.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="328.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">Пара сил, момент M = F·l</text><circle cx="318.0" cy="272.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><text x="328.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Частота збудження: 1× RPM</text><circle cx="318.0" cy="295.0" r="3.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/><text x="328.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Розхитує підшипники на згин</text><rect x="575.0" y="50.0" width="250.0" height="280.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аеродинамічний дисбаланс</text><circle cx="700.0" cy="145.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><line x1="700.0" y1="145.0" x2="640.0" y2="135.0" stroke="#333333" stroke-width="4.0"/><line x1="660.0" y1="137.0" x2="660.0" y2="103.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><text x="660.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">T₁ (більша)</text><line x1="700.0" y1="145.0" x2="760.0" y2="150.0" stroke="#333333" stroke-width="4.0"/><line x1="740.0" y1="148.0" x2="740.0" y2="125.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="740.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">T₂ (менша)</text><text x="700.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ΔT = T₁ − T₂ ≠ 0</text><circle cx="593.0" cy="226.0" r="3.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/><text x="603.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Різний крок/форма лопатей</text><circle cx="593.0" cy="249.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="603.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">Різниця тяги ΔT = T₁ − T₂</text><circle cx="593.0" cy="272.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><text x="603.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Частота збудження: 1× RPM</text><circle cx="593.0" cy="295.0" r="3.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/><text x="603.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Пульсація тяги й перекидання</text>
