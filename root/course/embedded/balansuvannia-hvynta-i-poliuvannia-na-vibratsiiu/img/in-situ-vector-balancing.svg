<rect x="30.0" y="45.0" width="440.0" height="315.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторний розрахунок у комплексній площині</text><line x1="80.0" y1="215.0" x2="400.0" y2="215.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="240.0" y1="335.0" x2="240.0" y2="95.0" stroke="#94a3b8" stroke-width="1.2"/><text x="405.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Re</text><text x="240.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Im</text><line x1="240.0" y1="215.0" x2="330.0" y2="155.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/><text x="338.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">V₀ (базова вібрація)</text><line x1="240.0" y1="215.0" x2="280.0" y2="105.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="274.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-weight="700">V₁ (з пробним вантажем)</text><line x1="330.0" y1="155.0" x2="280.0" y2="105.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="315.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">ΔV = V₁ − V₀</text><line x1="240.0" y1="215.0" x2="150.0" y2="275.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/><text x="142.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">−V₀ (мета компенсації)</text><text x="50.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Маса коригування: m_c = m_t · (|V₀| / |ΔV|)</text><rect x="490.0" y="45.0" width="300.0" height="315.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичне розміщення на роторі</text><circle cx="640.0" cy="180.0" r="65.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/><circle cx="640.0" cy="180.0" r="14.0" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><line x1="640.0" y1="180.0" x2="715.0" y2="180.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 2"/><text x="722.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" font-weight="700">0° (мітка)</text><circle cx="695.0" cy="180.0" r="7.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/><text x="695.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">m_t (пробний)</text><line x1="640.0" y1="180.0" x2="594.9" y2="211.5" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="594.9" cy="211.5" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/><text x="584.9" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">m_c (коригувальний)</text><text x="640.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Кут установки θ_c = arg(−V₀) − arg(ΔV)</text><text x="640.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Залишковий дисбаланс падає на 85–95%</text>
