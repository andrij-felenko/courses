<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як вібрація розхитує D-терм і як її вирізає RPM-фільтр</text>
<rect x="30.0" y="50.0" width="250.0" height="250.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="155.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Сирий сигнал гіроскопа</text><line x1="65.0" y1="175.0" x2="245.0" y2="175.0" stroke="#333333" stroke-width="1.2"/><rect x="85.0" y="125.0" width="16.0" height="50.0" rx="2" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/><text x="93.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Корисний (5 Гц)</text><rect x="195.0" y="160.0" width="12.0" height="15.0" rx="2" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="201.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Шум 300 Гц</text><circle cx="46.0" cy="211.0" r="2.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/><text x="54.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Корисний сигнал керування: 1–20 Гц</text><circle cx="46.0" cy="233.0" r="2.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/><text x="54.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Шум дисбалансу мотора: 200–500 Гц</text><circle cx="46.0" cy="255.0" r="2.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/><text x="54.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Амплітуда шуму: мала (1–2°/с)</text><rect x="290.0" y="50.0" width="250.0" height="250.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/><text x="415.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Диференціювання (D-терм)</text><line x1="325.0" y1="175.0" x2="505.0" y2="175.0" stroke="#333333" stroke-width="1.2"/><rect x="345.0" y="150.0" width="16.0" height="25.0" rx="2" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/><text x="353.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">5 Гц</text><rect x="455.0" y="110.0" width="16.0" height="65.0" rx="2" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="463.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Шум × 300!</text><text x="415.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Мотори гріються, батарея тане</text><circle cx="306.0" cy="211.0" r="2.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="314.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Оператор d/dt = множення на 2πf</text><circle cx="306.0" cy="233.0" r="2.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="314.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Шум 300 Гц підсилюється у 300 разів!</text><circle cx="306.0" cy="255.0" r="2.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="314.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Високочастотний шум забиває керування</text><rect x="560.0" y="50.0" width="250.0" height="250.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="685.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. RPM-фільтр (DShot Notch)</text><line x1="595.0" y1="175.0" x2="775.0" y2="175.0" stroke="#333333" stroke-width="1.2"/><rect x="615.0" y="150.0" width="16.0" height="25.0" rx="2" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/><text x="623.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">5 Гц чистий</text><text x="725.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Notch -40 dB</text><line x1="725.0" y1="173.0" x2="725.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="2 2"/><text x="685.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Затримка контуру &lt; 2 мс</text><circle cx="576.0" cy="211.0" r="2.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/><text x="584.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ESC віддає точний RPM мотора</text><circle cx="576.0" cy="233.0" r="2.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/><text x="584.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вузький режекторний Notch на 1× і BPF</text><circle cx="576.0" cy="255.0" r="2.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/><text x="584.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Шум вирізано без затримки низьких частот</text><line x1="282.0" y1="175.0" x2="288.0" y2="175.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="542.0" y1="175.0" x2="558.0" y2="175.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
