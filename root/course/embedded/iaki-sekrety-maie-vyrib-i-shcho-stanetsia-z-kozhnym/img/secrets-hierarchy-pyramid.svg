<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="850.0" height="490.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="440.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія секретів вбудованого виробу за рівнями ізоляції</text><rect x="35.0" y="68.0" width="810.0" height="76.0" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><rect x="35.0" y="68.0" width="810.0" height="24.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.0"/><text x="50.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">1. Корпоративні ключі підпису прошивки (OEM Signing Authority)</text><text x="50.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Де живе: Виключно в ізольованому HSM / KMS сервері збірки (НЕМАЄ на пристрої!)</text><text x="50.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Приватні ключі ECDSA / RSA для підпису офіційних оновлень OTA та образів ОС</text><text x="50.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="700">Витік: Повна катастрофа всього модельного ряду (100% пристроїв під загрозою фальшивої OTA)</text><rect x="35.0" y="154.0" width="810.0" height="76.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><rect x="35.0" y="154.0" width="810.0" height="24.0" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.0"/><text x="50.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">2. Апаратні кореневі секрети кристала (Silicon Root of Trust &amp; Flash Encryption)</text><text x="50.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Де живе: Одноразові апаратні перемички eFuse / OTP, PUF-генератор всередині SoC</text><text x="50.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Ключ розшифрування зовнішньої Flash (FEK), геш публічного ключа Secure Boot</text><text x="50.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">Витік: Дешифрування прошивки конкретного зразка; глобальний крах, якщо ключ однаковий у партії</text><rect x="35.0" y="240.0" width="810.0" height="76.0" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><rect x="35.0" y="240.0" width="810.0" height="24.0" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.0"/><text x="50.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#047857" text-anchor="start" font-weight="700">3. Унікальна ідентичність екземпляра (Device Identity &amp; mTLS Client Keys)</text><text x="50.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Де живе: Криптографічний Secure Element (ATECC608, TPM), апаратний анклав</text><text x="50.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Приватний ключ клієнтського сертифіката для взаємної автентифікації з хмарою (mTLS / MQTT)</text><text x="50.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="start" font-weight="700">Витік: Підміна одного скомпрометованого приладу; миттєво відкликається на сервері без шкоди парку</text><rect x="35.0" y="326.0" width="810.0" height="76.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><rect x="35.0" y="326.0" width="810.0" height="24.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/><text x="50.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">4. Мережеві та локальні облікові дані (Network Credentials)</text><text x="50.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Де живе: Енергонезалежна пам'ять NVS / Flash мікроконтролера, захищена апаратно</text><text x="50.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Паролі Wi-Fi (WPA2/WPA3 PSK), ключі зв'язування Bluetooth (LTK), ключі LoRaWAN AppKey</text><text x="50.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="700">Витік: Компрометація локальної мережі замовника (Pivot Attack); заміна пароля на точці доступу</text><rect x="35.0" y="412.0" width="810.0" height="76.0" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/><rect x="35.0" y="412.0" width="810.0" height="24.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><text x="50.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">5. Операційні, сервісні та користувацькі токени (User Data &amp; Session Tokens)</text><text x="50.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Де живе: Зашифрований розділ NVS, оперативна пам'ять RAM у процесі виконання</text><text x="50.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">API-токени зовнішніх служб, паролі сервісного меню, тимчасові сесійні ключі TLS</text><text x="50.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="start" font-weight="700">Витік: Порушення приватності власника або скидання налаштувань конкретного екземпляра</text>
</svg>