<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="850.0" height="470.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="440.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура довіри: Симетрична пастка проти Асиметричного захисту</text><rect x="35.0" y="65.0" width="810.0" height="195.0" rx="8" fill="#fff5f5" stroke="#b91c1c" stroke-width="2.0"/><rect x="35.0" y="65.0" width="810.0" height="28.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.0"/><text x="50.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">СИМЕТРИЧНА ПАСТКА (Фатальний антипатерн: один секрет для підпису й перевірки)</text><rect x="55.0" y="110.0" width="170.0" height="125.0" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="140.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер виробника</text><rect x="65.0" y="150.0" width="150.0" height="32.0" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.0"/><text x="140.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">Ключ K (симетричний)</text><text x="140.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Підписує прошивку: HMAC(K)</text><line x1="230.0" y1="173.0" x2="335.0" y2="173.0" stroke="#b91c1c" stroke-width="2.0" marker-end="url(#arrow)"/><text x="282.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">OTA образ</text><rect x="340.0" y="110.0" width="230.0" height="125.0" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="455.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">100 000 серійних пристроїв</text><rect x="355.0" y="150.0" width="200.0" height="32.0" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.0"/><text x="455.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">Той самий Ключ K у пам'яті!</text><text x="455.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Перевіряє: HMAC(K) == образ.hmac</text><line x1="575.0" y1="173.0" x2="645.0" y2="173.0" stroke="#b91c1c" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="650.0" y="110.0" width="180.0" height="125.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.0"/><text x="740.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">Злом 1 плати ($50)</text><text x="740.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зчитування Flash / RAM</text><text x="740.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">→ Витік Ключа K!</text><text x="740.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">Наслідок: Атакуючий підписує</text><text x="740.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-weight="700">прошивку для ВСЬОГО парку!</text><rect x="35.0" y="275.0" width="810.0" height="200.0" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="2.0"/><rect x="35.0" y="275.0" width="810.0" height="28.0" rx="8" fill="#dcfce7" stroke="#047857" stroke-width="1.0"/><text x="50.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#047857" text-anchor="start" font-weight="700">АСИМЕТРИЧНА ДОБРОЧЕСНІСТЬ (Канонічний дизайн: розділення підпису та перевірки)</text><rect x="55.0" y="320.0" width="170.0" height="135.0" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="140.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер HSM виробника</text><rect x="65.0" y="360.0" width="150.0" height="32.0" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.0"/><text x="140.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">Приватний ключ SK_oem</text><text x="140.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="700">Ніколи не залишає HSM</text><text x="140.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Підпис: ECDSA_Sign(SK, FW)</text><line x1="230.0" y1="385.0" x2="335.0" y2="385.0" stroke="#047857" stroke-width="2.0" marker-end="url(#arrow)"/><text x="282.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підписана OTA</text><rect x="340.0" y="320.0" width="230.0" height="135.0" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="455.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">100 000 серійних пристроїв</text><rect x="355.0" y="360.0" width="200.0" height="32.0" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><text x="455.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">Публічний ключ PK_oem</text><text x="455.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зашитий в OTP eFuse / ROM</text><text x="455.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Перевірка: ECDSA_Verify(PK)</text><line x1="575.0" y1="385.0" x2="645.0" y2="385.0" stroke="#047857" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="650.0" y="320.0" width="180.0" height="135.0" rx="6" fill="#f0fdf4" stroke="#047857" stroke-width="2.0"/><text x="740.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="middle" font-weight="700">Злом 1 плати ($50)</text><text x="740.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зчитування Flash / RAM</text><text x="740.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">Знайдено: Публічний PK</text><text x="740.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="700">Наслідок: Нульова загроза!</text><text x="740.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Публічний ключ відкритий,</text><text x="740.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#047857" text-anchor="middle" font-weight="700">підробити підпис неможливо</text>
</svg>