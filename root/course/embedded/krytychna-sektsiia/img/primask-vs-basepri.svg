<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія маскування: повне блокування (PRIMASK) проти селективного (BASEPRI)</text>
<rect x="20.0" y="50.0" width="410.0" height="370.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="225.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">PRIMASK = 1 (__disable_irq)</text>
<text x="225.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Глобальне маскування всіх стандартних переривань</text>
<rect x="106.1" y="112.9" width="237.8" height="34.1" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">NMI (Пріоритет -2) &amp; HardFault (-1)</tspan><tspan x="225.0" dy="13.7">НЕ маскуються (виконуються завжди)</tspan></text>
<rect x="106.1" y="171.1" width="237.8" height="47.8" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Високопріоритетні ISR (0 .. 4)</tspan><tspan x="225.0" dy="13.7">(Керування двигуном, силова аварія)</tspan><tspan x="225.0" dy="13.7">ЗАБЛОКОВАНО! Зрив детермінізму</tspan></text>
<rect x="100.3" y="251.1" width="249.4" height="47.8" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="225.0" dy="0.0">RTOS SysTick, PendSV, Драйвери (5 .. 15)</tspan><tspan x="225.0" dy="13.7">(UART, I2C, SPI, таймери)</tspan><tspan x="225.0" dy="13.7">ЗАБЛОКОВАНО</tspan></text>
<rect x="132.1" y="342.9" width="185.8" height="34.1" rx="6" fill="#ebf8ff" stroke="#2457d6" stroke-width="1.5"/><text x="225.0" y="356.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Фоновий потік (Thread Mode)</tspan><tspan x="225.0" dy="13.7">Виконує критичну секцію</tspan></text>
<rect x="450.0" y="50.0" width="410.0" height="370.0" rx="8" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">BASEPRI = 0x50 (taskENTER_CRITICAL)</text>
<text x="655.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Селективне маскування переривань з пріоритетом &gt;= 5</text>
<rect x="601.2" y="112.9" width="107.7" height="34.1" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">NMI &amp; HardFault</tspan><tspan x="655.0" dy="13.7">НЕ маскуються</tspan></text>
<rect x="536.1" y="171.1" width="237.8" height="47.8" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Zero-Latency ISR (Пріоритет 0 .. 4)</tspan><tspan x="655.0" dy="13.7">(FOC ШІМ 20 кГц, струмовий захист)</tspan><tspan x="655.0" dy="13.7">АКТИВНІ! Нульова затримка реакції</tspan></text>
<line x1="460.0" y1="248.0" x2="850.0" y2="248.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="655.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Поріг BASEPRI = configMAX_SYSCALL_INTERRUPT_PRIORITY</text>
<rect x="542.3" y="261.1" width="225.5" height="47.8" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="655.0" dy="0.0">Системні переривання RTOS (5 .. 15)</tspan><tspan x="655.0" dy="13.7">(SysTick, API-переривання периферії)</tspan><tspan x="655.0" dy="13.7">ЗАБЛОКОВАНО (захист структур RTOS)</tspan></text>
<rect x="568.6" y="342.9" width="172.8" height="34.1" rx="6" fill="#ebf8ff" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="356.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Фоновий потік / RTOS Task</tspan><tspan x="655.0" dy="13.7">Виконує критичну секцію</tspan></text>
</svg>