<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний монітор ексклюзивності ARM (LDREX / STREX)</text>
<rect x="20.0" y="50.0" width="410.0" height="370.0" rx="8" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/>
<text x="225.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сценарій 1: Успішна транзакція (без колізій)</text>
<rect x="88.3" y="97.9" width="273.3" height="34.1" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="111.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">1. LDREX r1, [addr]</tspan><tspan x="225.0" dy="13.7">Завантаження значення + монітор -&gt; EXCLUSIVE</tspan></text>
<rect x="93.1" y="164.8" width="263.9" height="20.5" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="178.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Монітор ядра: Стан EXCLUSIVE для [addr]</tspan></text>
<rect x="112.3" y="217.9" width="225.5" height="34.1" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="225.0" y="231.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">2. ADDS r1, r1, #1</tspan><tspan x="225.0" dy="13.7">Модифікація значення в регістрі ядра</tspan></text>
<rect x="73.5" y="281.1" width="302.9" height="47.8" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">3. STREX r2, r1, [addr]</tspan><tspan x="225.0" dy="13.7">Монітор у стані EXCLUSIVE -&gt; Запис дозволено!</tspan><tspan x="225.0" dy="13.7">В ОЗП записано нове значення; r2 = 0 (УСПІХ)</tspan></text>
<rect x="64.4" y="369.8" width="321.2" height="20.5" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="383.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="225.0" dy="0.0">Результат: Швидкий атомарний запис без вимкнення IRQ</tspan></text>
<rect x="450.0" y="50.0" width="410.0" height="370.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="655.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій 2: Втручання ISR під час операції</text>
<rect x="545.3" y="97.9" width="219.5" height="34.1" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="655.0" y="111.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">1. Thread: LDREX r1, [addr]</tspan><tspan x="655.0" dy="13.7">Монітор переходить у стан EXCLUSIVE</tspan></text>
<rect x="493.8" y="162.9" width="322.5" height="34.1" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">2. Апаратний ISR вклинюється і виконує STR!</tspan><tspan x="655.0" dy="13.7">Будь-який запис у пам'ять скидає монітор -&gt; OPEN</tspan></text>
<rect x="503.4" y="234.8" width="303.3" height="20.5" rx="6" fill="#fed7d7" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="248.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="655.0" dy="0.0">Монітор ядра: Стан OPEN (ексклюзивність втрачено)</tspan></text>
<rect x="500.3" y="291.1" width="309.5" height="47.8" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">3. Thread: STREX r2, r1, [addr]</tspan><tspan x="655.0" dy="13.7">Монітор у стані OPEN -&gt; ЗАПИС В ОЗП СКАСОВАНО!</tspan><tspan x="655.0" dy="13.7">Значення в ОЗП не пошкоджено; r2 = 1 (НЕВДАЧА)</tspan></text>
<rect x="487.2" y="369.8" width="335.5" height="20.5" rx="6" fill="#ebf8ff" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="383.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">4. CBNZ r2, retry_loop -&gt; Повторення спроби заново</tspan></text>
</svg>