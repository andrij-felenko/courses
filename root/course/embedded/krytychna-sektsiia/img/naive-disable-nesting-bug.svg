<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка наївного вимкнення: руйнування вкладених критичних секцій</text>
<rect x="20.0" y="50.0" width="840.0" height="390.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="40.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Зовнішня функція: OuterProcess()</text>
<rect x="86.1" y="96.3" width="287.9" height="37.3" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">__disable_irq();  /* CPSID i: PRIMASK = 1 */</tspan><tspan x="230.0" dy="14.3">Переривання глобально вимкнено</tspan></text>
<rect x="104.7" y="156.3" width="250.7" height="37.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Критична робота 1: оновлення буфера</tspan><tspan x="230.0" dy="14.3">[ Секція надійно захищена ]</tspan></text>
<rect x="430.0" y="100.0" width="410.0" height="210.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="450.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="start" font-weight="700">Вкладений виклик: HelperSendByte()</text>
<rect x="507.3" y="144.8" width="255.4" height="20.5" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/><text x="635.0" y="158.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">__disable_irq();  /* PRIMASK вже був 1 */</tspan></text>
<rect x="537.2" y="194.8" width="195.5" height="20.5" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text x="635.0" y="208.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Запис у FIFO регістра периферії</tspan></text>
<rect x="480.3" y="242.9" width="309.5" height="34.1" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="635.0" y="256.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">__enable_irq();   /* CPSIE i: PRIMASK = 0 ! */</tspan><tspan x="635.0" dy="13.7">Сліпе увімкнення переривань!</tspan></text>
<line x1="340.0" y1="195.0" x2="430.0" y2="195.0" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430.0" y1="285.0" x2="340.0" y2="285.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="87.6" y="316.4" width="284.8" height="37.3" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Критична робота 2: оновлення вказівників</tspan><tspan x="230.0" dy="14.3">[ УВАГА: Переривання вже УВІМКНЕНІ! ]</tspan></text>
<line x1="230.0" y1="375.0" x2="230.0" y2="395.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,3"/>
<circle cx="230.0" cy="375.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="230.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ISR вклинюється сюди і ламає інваріант структури!</text>
<rect x="459.7" y="348.5" width="350.6" height="23.0" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="635.0" y="363.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="635.0" dy="0.0">__enable_irq();  /* Запізно: катастрофа вже сталася */</tspan></text>
</svg>