<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівневий наглядач (Task Watchdog Supervisor) у RTOS / Bare-Metal</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">потоки відмічаються в таблиці здоров'я; диспетчер оновлює апаратний таймер лише за 100% готовності</text>
<rect x="40.0" y="75.0" width="230.0" height="325.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="155.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень завдань (Tasks)</text>
<text x="155.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кожен потік має свій таймаут</text>
<rect x="52.0" y="130.0" width="206.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="155.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Task 1: Сенсори (50 мс)</text>
<text x="155.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">wdt_checkin(ID_SENSORS)</text>
<rect x="52.0" y="192.0" width="206.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="155.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Task 2: Керування/PID (10 мс)</text>
<text x="155.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">wdt_checkin(ID_CONTROL)</text>
<rect x="52.0" y="254.0" width="206.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="155.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Task 3: Телеметрія (200 мс)</text>
<text x="155.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">wdt_checkin(ID_TELEMETRY)</text>
<rect x="52.0" y="316.0" width="206.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="155.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Task 4: Логування (500 мс)</text>
<text x="155.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">wdt_checkin(ID_LOGGER)</text>
<rect x="320.0" y="75.0" width="280.0" height="325.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="460.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Диспетчер здоров'я (Supervisor)</text>
<text x="460.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Task із каліброваним пріоритетом</text>
<rect x="334.0" y="130.0" width="252.0" height="140.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="460.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таблиця контролю дедлайнів</text>
<line x1="344.0" y1="160.0" x2="576.0" y2="160.0" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="344.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">ID 0: Sensors     → 12 ms / 50 ms  [OK]</text>
<text x="344.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">ID 1: Control     →  4 ms / 10 ms  [OK]</text>
<text x="344.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">ID 2: Telemetry   → 80 ms / 200 ms [OK]</text>
<text x="344.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">ID 3: Logger      → 150 ms/ 500 ms [OK]</text>
<text x="460.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Усі дедлайни дотримані? (100% OK)</text>
<rect x="334.0" y="280.0" width="252.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="460.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Якщо хоч один потік прострочив:</text>
<text x="460.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Записати Core Dump у noinit RAM → STOP KICK</text>
<rect x="334.0" y="340.0" width="252.0" height="48.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="460.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Якщо всі здорові:</text>
<text x="460.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">hw_wdt_refresh() → скинути залізо</text>
<rect x="650.0" y="75.0" width="190.0" height="325.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="745.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний WDT</text>
<text x="745.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">IWDG / WWDG / Ext IC</text>
<rect x="664.0" y="150.0" width="162.0" height="80.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="745.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таймер 1.0 с</text>
<text x="745.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Отримує імпульс</text>
<text x="745.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">кожні 100 мс</text>
<line x1="745.0" y1="240.0" x2="745.0" y2="280.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="664.0" y="285.0" width="162.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="745.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">MCU RESET</text>
<text x="745.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Спрацьовує при</text>
<text x="745.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">зависанні БУДЬ-ЯКОГО</text>
<text x="745.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">зареєстрованого потоку</text>
<line x1="258.0" y1="156.0" x2="334.0" y2="156.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="258.0" y1="218.0" x2="334.0" y2="218.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="258.0" y1="280.0" x2="334.0" y2="280.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="258.0" y1="342.0" x2="334.0" y2="342.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="586.0" y1="364.0" x2="664.0" y2="190.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Жоден окремий потік не має прямого доступу до апаратного сторожа — лише централізований арбітраж.</text>
