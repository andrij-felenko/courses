<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зовнішній апаратний супервізор (TPS3823 / STWD100)</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">фізично незалежний кристал захищає від latch-up, збоїв внутрішнього живлення та зависання тактування</text>
<rect x="60.0" y="80.0" width="270.0" height="290.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2.0"/>
<text x="195.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікроконтролер (MCU)</text>
<text x="195.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Спільна кремнієва підкладка</text>
<rect x="80.0" y="140.0" width="230.0" height="50.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="195.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">CPU Core + RAM</text>
<text x="195.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Може зависнути в Latch-up / Brownout</text>
<rect x="80.0" y="200.0" width="230.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="195.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">GPIO Pin (WDI Out)</text>
<text x="195.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Імпульси здоров'я (Heartbeat)</text>
<rect x="80.0" y="256.0" width="230.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="195.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">NRST Pin (Вхід скидання)</text>
<text x="195.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Апаратний ресет ядра й периферії</text>
<rect x="80.0" y="312.0" width="230.0" height="42.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="195.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">VDD (3.3V)</text>
<rect x="550.0" y="80.0" width="270.0" height="290.0" rx="8" fill="#fffdfa" stroke="#d97706" stroke-width="2.0"/>
<text x="685.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">Апаратний супервізор (WDT IC)</text>
<text x="685.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Окремий кремній (TPS3823 / STWD100)</text>
<rect x="570.0" y="140.0" width="230.0" height="50.0" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
<text x="685.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прецизійний генератор + WDT</text>
<text x="685.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Таймаут t_WD = 1.6 с (фіксований)</text>
<rect x="570.0" y="200.0" width="230.0" height="46.0" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
<text x="685.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">WDI (Watchdog Input)</text>
<text x="685.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Детектор фронтів (Edge Detector)</text>
<rect x="570.0" y="256.0" width="230.0" height="46.0" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
<text x="685.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">/RESET Out (Open-Drain)</text>
<text x="685.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Формувач імпульсу t_RST = 200 мс</text>
<rect x="570.0" y="312.0" width="230.0" height="42.0" rx="4" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
<text x="685.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Компаратор VDD (BOD)</text>
<text x="685.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Поріг V_IT = 2.93V (1% точність)</text>
<line x1="310.0" y1="223.0" x2="570.0" y2="223.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Лінія WDI (імпульси)</text>
<line x1="570.0" y1="279.0" x2="310.0" y2="279.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Лінія /RESET (активний низький)</text>
<line x1="310.0" y1="333.0" x2="570.0" y2="333.0" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="440.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Шина живлення 3.3V</text>
<text x="440.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Зовнішній супервізор гарантує ресет при збої опорного генератора MCU або просадці живлення нижче 2.93 В.</text>
</svg>