<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="740.0" height="340.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.0"/>
<rect x="40.0" y="90.0" width="140.0" height="70.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.4"/>
<text x="110.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Зовнішній вузол</tspan><tspan x="110.0" dy="14.3">(Передавач)</tspan></text>
<rect x="220.0" y="90.0" width="150.0" height="70.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.4"/>
<text x="295.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Апаратний FIFO /</tspan><tspan x="295.0" dy="14.3">DMA буфер</tspan></text>
<rect x="410.0" y="90.0" width="140.0" height="70.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.4"/>
<text x="480.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Черга повідомлень</tspan><tspan x="480.0" dy="14.3">(RTOS Queue)</tspan></text>
<rect x="590.0" y="90.0" width="130.0" height="70.0" rx="6" fill="#fee2e2" stroke="#333333" stroke-width="1.4"/>
<text x="655.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Завдання запису</tspan><tspan x="655.0" dy="14.3">у Flash (25 мс)</tspan></text>
<line x1="180.0" y1="115.0" x2="220.0" y2="115.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="370.0" y1="115.0" x2="410.0" y2="115.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="550.0" y1="115.0" x2="590.0" y2="115.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Прямий потік даних (Data Flow: RX → ISR → Queue → Task)</text>
<text x="380.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Поширення зворотного тиску (Backpressure Ripple)</text>
