<text x="655.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Затримка Flash</text>
<line x1="590.0" y1="240.0" x2="550.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="410.0" y="230.0" width="140.0" height="50.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="480.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Черга переповнюється</tspan><tspan x="480.0" dy="13.0">(Queue Full)</tspan></text>
<line x1="410.0" y1="255.0" x2="370.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="220.0" y="230.0" width="150.0" height="50.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.0"/>
<text x="295.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Драйвер зупиняє DMA</tspan><tspan x="295.0" dy="13.0">RTS знімається (/RTS=1)</tspan></text>
<line x1="220.0" y1="255.0" x2="180.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="230.0" width="140.0" height="50.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="110.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Передавач бачить CTS=1</tspan><tspan x="110.0" dy="13.0">і зупиняє потік</tspan></text>
<text x="380.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: жоден байт не губиться в усьому конвеєрі</text>
</svg>