<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="440.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пріоритезація збереження даних у Flash під час тривалого офлайну</text>
<rect x="30.0" y="65.0" width="255.0" height="370.0" rx="8" fill="#fff5f5" stroke="#b91c1c" stroke-width="2.0"/>
<rect x="30.0" y="65.0" width="255.0" height="34.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="157.5" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">Рівень 0: Критичні аварії</text>
<text x="45.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Пожежа, витік, E-Stop</text>
<text x="45.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Відмова датчиків безпеки</text>
<text x="45.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Спрацювання тампера</text>
<text x="45.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">──────────────────────</text>
<text x="45.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Політика переповнення:</text>
<text x="45.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ЖОРСТКЕ ЗБЕРЕЖЕННЯ.</text>
<text x="45.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Ніколи не перезаписується</text>
<text x="45.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">іншими типами даних.</text>
<text x="45.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Виділений резервний сектор.</text>
<text x="45.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Передача ПЕРШОЮ чергою</text>
<text x="45.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">після відновлення лінка.</text>
<rect x="305.0" y="65.0" width="255.0" height="370.0" rx="8" fill="#fefce8" stroke="#b45309" stroke-width="2.0"/>
<rect x="305.0" y="65.0" width="255.0" height="34.0" rx="8" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>
<text x="432.5" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Рівень 1: Журнал аудиту</text>
<text x="320.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Прохід за RFID-ключем</text>
<text x="320.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зміна режиму (Auto→Manual)</text>
<text x="320.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Увімкнення/вимкнення реле</text>
<text x="320.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">──────────────────────</text>
<text x="320.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Політика переповнення:</text>
<text x="320.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Кільцевий буфер (Ring Buffer).</text>
<text x="320.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">При нестачі місця старі записи</text>
<text x="320.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">витісняються за принципом</text>
<text x="320.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">FIFO з обов'язковою фіксацією</text>
<text x="320.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">кількості втрачених записів</text>
<text x="320.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">(Drop Counter).</text>
<rect x="580.0" y="65.0" width="255.0" height="370.0" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="2.0"/>
<rect x="580.0" y="65.0" width="255.0" height="34.0" rx="8" fill="#bbf7d0" stroke="#047857" stroke-width="1.5"/>
<text x="707.5" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#047857" text-anchor="middle" font-weight="700">Рівень 2: Телеметрія</text>
<text x="595.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Температура, тиск, напруга</text>
<text x="595.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Періодичний зріз раз на N с</text>
<text x="595.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Статистика споживання</text>
<text x="595.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">──────────────────────</text>
<text x="595.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Політика переповнення:</text>
<text x="595.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ДИНАМІЧНА ДЕГРАДАЦІЯ:</text>
<text x="595.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Фільтрація Deadband (Δ &gt; ε)</text>
<text x="595.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Агрегація (min / max / avg)</text>
<text x="595.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. Збільшення інтервалу (5с→1хв)</text>
<text x="595.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4. Агресивне скидання найстаріших</text>
<text x="595.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">точок заради збереження P0/P1.</text>
</svg>