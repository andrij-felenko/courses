<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="480.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процедура реконсиліації та злиття станів (Link Recovery)</text>
<rect x="35.0" y="65.0" width="790.0" height="95.0" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<rect x="35.0" y="65.0" width="790.0" height="26.0" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="50.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">Крок 1: Відновлення лінка та джитер</text>
<text x="50.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Детекція мережі (TCP/TLS handshake)</text>
<text x="50.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Випадкова затримка (Jitter 0..30 с) для запобігання Thundering Herd на сервер</text>
<text x="50.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Отримання точного часу через NTP / TLS</text>
<line x1="430.0" y1="160.0" x2="430.0" y2="170.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="170.0" width="790.0" height="95.0" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
<rect x="35.0" y="170.0" width="790.0" height="26.0" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="50.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">Крок 2: Обмін поколіннями (Generation Handshake)</text>
<text x="50.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Пристрій надсилає локальну версію стану V_local</text>
<text x="50.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Сервер надсилає Desired State версії V_cloud</text>
<text x="50.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Виявлення розбіжностей у конфігураціях і уставках</text>
<line x1="430.0" y1="265.0" x2="430.0" y2="275.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="275.0" width="790.0" height="95.0" rx="6" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.8"/>
<rect x="35.0" y="275.0" width="790.0" height="26.0" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
<text x="50.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">Крок 3: Семантичне злиття та вирішення конфліктів</text>
<text x="50.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• ПРАВИЛО БЕЗПЕКИ: Локальний аварійний стан (E-Stop, Fault) завжди блокує дистанційне увімкнення</text>
<text x="50.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• ПРАВИЛО УСТАВОК: Нові розклади з хмари оновлюють NVM-слот A/B транзакційно</text>
<line x1="430.0" y1="370.0" x2="430.0" y2="380.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="380.0" width="790.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#047857" stroke-width="1.8"/>
<rect x="35.0" y="380.0" width="790.0" height="26.0" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
<text x="50.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#047857" text-anchor="start" font-weight="700">Крок 4: Дренаж черг і підтвердження (ACK Drain)</text>
<text x="50.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вивантаження буфера P0 (Аварії) → P1 → P2</text>
<text x="50.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Отримання підтвердження від бекенду (ACK id)</text>
<text x="50.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Атомарне зсунення хвоста черги у Flash і перехід у штатний синхронний режим</text>
</svg>