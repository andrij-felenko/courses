<rect x="510.0" y="238.1" width="400.0" height="73.9" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="710.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Операція: пакетний INSERT / COPY (тільки додавання)</tspan><tspan x="710.0" dy="14.3">Обсяг: O(N · T) = мільйони рядків, гігабайти даних</tspan><tspan x="710.0" dy="14.3">Доступ: діапазонні вибірки [T_start, T_end] за індексом</tspan><tspan x="710.0" dy="14.3">Сценарій: «Дай графік температури node-001 за 30 днів»</tspan></text>
<rect x="510.0" y="362.5" width="400.0" height="65.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="710.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle"><tspan x="710.0" dy="0.0">Чому не шукає поточний стан:</tspan><tspan x="710.0" dy="13.0">Запит «який останній стан усіх вузлів» змушений сканувати</tspan><tspan x="710.0" dy="13.0">мільйони точок через SELECT DISTINCT ON, що кладе диск</tspan><tspan x="710.0" dy="13.0">на 100% I/O і триває десятки секунд.</tspan></text>
