<text x="175.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="175.0" dy="0.0">Старий чанк (стиснутий)</tspan><tspan x="175.0" dy="12.5">21.6 млн точок (95 МБ)</tspan></text>
