<text x="50.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">2. Наївне середнє за бакетами (Bucket AVG): ПІК ЗРІЗАНО!</text>
<line x1="50.0" y1="400.0" x2="440.0" y2="400.0" stroke="#cbd5e1" stroke-width="1.2"/>
