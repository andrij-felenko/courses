<text x="50.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Сирий сигнал (10 000 точок): аварійний сплеск температури</text>
