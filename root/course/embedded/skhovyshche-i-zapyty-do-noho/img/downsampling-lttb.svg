<polyline points="50.0,175.0 80.0,174.0 110.0,176.0 140.0,174.0 170.0,175.0 200.0,174.0 220.0,175.0 235.0,170.0 240.0,95.0 245.0,170.0 260.0,175.0 290.0,174.0 320.0,176.0 350.0,175.0 380.0,174.0 410.0,175.0 440.0,175.0" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="240.0" cy="95.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="240.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Пік: 85 °C (тривав 5 с)</text>
<text x="55.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">20 °C</text>
