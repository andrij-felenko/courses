<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трирівнева ієрархія виконання правил: Edge MCU, Local Hub та Cloud</text>
<rect x="10.0" y="10.0" width="920.0" height="500.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<rect x="40.0" y="40.0" width="620.0" height="130.0" rx="6" fill="#f0f4ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="55.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#3b82f6" text-anchor="start" font-weight="700">Хмарний бекенд (Cloud Backend)</text>
<text x="55.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Затримка: 100–1000+ мс  |  Надійність зв'язку: Best-effort (залежність від WAN)</text>
<text x="55.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">• Необмежені ресурси CPU/RAM/NVMe, довгострокові часові ряди (TimescaleDB, ClickHouse)</tspan><tspan x="55.0" dy="14.9">• Глобальна міжоб'єктна аналітика, машинне навчання (ML), оптимізація за тарифами</tspan><tspan x="55.0" dy="14.9">• Зручне версіонування бізнес-правил без втручання в локальну мережу</tspan></text>
<rect x="40.0" y="195.0" width="620.0" height="130.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="55.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="start" font-weight="700">Локальний хаб / Шлюз (Local Gateway / Hub)</text>
<text x="55.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Затримка: 10–50 мс  |  Надійність зв'язку: LAN / Zigbee / Thread (працює без Інтернету)</text>
<text x="55.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">• Крос-девайсна автоматизація (Home Assistant, Edge IPC на Linux/OpenWrt)</tspan><tspan x="55.0" dy="14.9">• Агрегація датчиків різних брендів, сценарне освітлення, кімнатний клімат-контроль</tspan><tspan x="55.0" dy="14.9">• Локальна історія станів, розклади (cron, схід сонця), захист від падіння WAN</tspan></text>
<rect x="40.0" y="350.0" width="620.0" height="130.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="55.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="700">Край / Мікроконтролер пристрою (Edge MCU)</text>
<text x="55.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Затримка: &lt; 1 мс (жорсткий реал-тайм)  |  Надійність зв'язку: 100% автономність</text>
<text x="55.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">• Жорсткі інваріанти безпеки: захист від перегріву, сухий хід, струмовий захист, e-stop</tspan><tspan x="55.0" dy="14.9">• Табличні автомати станів у статичній пам'яті (без malloc), нульовий джиттер (&lt;10 мкс)</tspan><tspan x="55.0" dy="14.9">• Пряме керування апаратними ключами, таймерами, АЦП, повна незалежність від мережі</tspan></text>
<rect x="680.0" y="40.0" width="220.0" height="200.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="790.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Потік завдань униз</text>
<text x="790.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="790.0" dy="0.0">• Бажаний стан (Desired State)</tspan><tspan x="790.0" dy="13.7">• Цільові уставки (Setpoints)</tspan><tspan x="790.0" dy="13.7">• Оренда керування (Lease TTL)</tspan><tspan x="790.0" dy="13.7">• Політики оптимізації</tspan></text>
<line x1="790.0" y1="155.0" x2="790.0" y2="215.0" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="784.0,210.0 796.0,210.0 790.0,223.0" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<rect x="680.0" y="270.0" width="220.0" height="210.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="790.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Потік фактів угору</text>
<text x="790.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="790.0" dy="0.0">• Фактичний стан (Reported)</tspan><tspan x="790.0" dy="13.7">• Дані сенсорів і телеметрія</tspan><tspan x="790.0" dy="13.7">• Аварійні спрацьовування</tspan><tspan x="790.0" dy="13.7">• Підтвердження команд (ACK)</tspan></text>
<line x1="790.0" y1="455.0" x2="790.0" y2="395.0" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="784.0,400.0 796.0,400.0 790.0,387.0" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
</svg>