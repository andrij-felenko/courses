<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл відповідальності між Edge, Local Hub та Cloud</text>
<rect x="10.0" y="10.0" width="920.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="470.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця розподілу відповідальності та піраміда довіри</text>
<text x="470.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Вищий рівень пропонує мету, нижчий рівень забезпечує інваріанти безпеки</text>
<rect x="35.0" y="80.0" width="870.0" height="110.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="50.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#3b82f6" text-anchor="start" font-weight="700">Рівень 2: Глобальна оптимізація та аналітика (Cloud)</text>
<text x="50.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Недетерміноване планування</text>
<text x="460.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="460.0" dy="0.0">• Прогнозування теплової інерції будинку за погодою на 24 години</tspan><tspan x="460.0" dy="13.7">• Оптимізація заряду батарей за погодинним тарифом електроенергії</tspan><tspan x="460.0" dy="13.7">• Предиктивне виявлення зносу ТЕНів і підшипників насоса за трендами</tspan></text>
<text x="50.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Втрата зв'язку: робота за останнім збереженим добовим графіком</text>
<rect x="35.0" y="205.0" width="870.0" height="110.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="50.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="start" font-weight="700">Рівень 1: Автоматизація комфорту та крос-девайси (Local Hub)</text>
<text x="50.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">М'який реальний час (10–50 мс)</text>
<text x="460.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="460.0" dy="0.0">• Підтримання температури в кімнаті за розкладом і датчиками присутності</tspan><tspan x="460.0" dy="13.7">• Узгодження роботи 5 кімнатних термостатів із загальним котлом/насосом</tspan><tspan x="460.0" dy="13.7">• Сценарії «Ніч», «Нікого немає вдома», плавне підсвічування сходів</tspan></text>
<text x="50.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Втрата зв'язку: перехід термостатів на локальні базові уставки (20 °C)</text>
<rect x="35.0" y="330.0" width="870.0" height="110.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="50.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">Рівень 0: Критичні інваріанти безпеки (Edge MCU)</text>
<text x="50.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Жорсткий реальний час (&lt; 1 мс)</text>
<text x="460.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="460.0" dy="0.0">• Захист від закипання котла: негайне знеструмлення при T &gt; 85 °C</tspan><tspan x="460.0" dy="13.7">• Захист від сухого ходу: вимкнення ТЕНа при падінні протоку &lt; 1.5 л/хв</tspan><tspan x="460.0" dy="13.7">• Апаратне блокування одночасного ввімкнення фаз реверсу моторів</tspan></text>
<text x="50.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">Абсолютний пріоритет: інваріант не може бути скасований зверху</text>
</svg>