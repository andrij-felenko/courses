<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Програмний Failsafe проти апаратного Flight Termination System (FTS)</text>
<rect x="20.0" y="60.0" width="780.0" height="185.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
<text x="40.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Програмний ланцюг Failsafe / Disarm (залежний від CPU та RTOS)</text>
<rect x="40.0" y="110.0" width="130.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">RC-приймач</tspan><tspan x="105.0" dy="14.3">(CRSF / SBUS)</tspan><tspan x="105.0" dy="14.3"></tspan><tspan x="105.0" dy="14.3">Пакет керування</tspan></text>
<line x1="170.0" y1="145.0" x2="200.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200.0" y="110.0" width="130.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">UART-драйвер</tspan><tspan x="265.0" dy="14.3">та черга RTOS</tspan><tspan x="265.0" dy="14.3"></tspan><tspan x="265.0" dy="14.3">Обробка байтів</tspan></text>
<line x1="330.0" y1="145.0" x2="360.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360.0" y="110.0" width="130.0" height="70.0" rx="6" fill="#feebe8" stroke="#c0392b" stroke-width="1.5"/><text x="425.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="425.0" dy="0.0">Ядро CPU</tspan><tspan x="425.0" dy="13.0">(Автопілот / PID)</tspan><tspan x="425.0" dy="13.0"></tspan><tspan x="425.0" dy="13.0">[УРАЗЛИВЕ ДО ЗБОЮ]</tspan></text>
<line x1="490.0" y1="145.0" x2="520.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520.0" y="110.0" width="130.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="585.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Таймер ШІМ / DMA</tspan><tspan x="585.0" dy="13.0">(TIMx / DShot)</tspan><tspan x="585.0" dy="13.0"></tspan><tspan x="585.0" dy="13.0">Генерація імпульсів</tspan></text>
<line x1="650.0" y1="145.0" x2="680.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="680.0" y="110.0" width="100.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Регулятори</tspan><tspan x="730.0" dy="14.3">ESC та BLDC</tspan><tspan x="730.0" dy="14.3">двигуни</tspan></text>
<text x="410.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Точка відмови: при HardFault, зацикленні або блокуванні RTOS таймер продовжує видавати останній ШІМ!</text>
<rect x="20.0" y="265.0" width="780.0" height="195.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="40.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Апаратний ланцюг FTS Kill-Switch (незалежне знеструмлення шини)</text>
<rect x="40.0" y="315.0" width="150.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Виділений FTS-канал</tspan><tspan x="115.0" dy="14.3">(433 / 868 МГц LoRa)</tspan><tspan x="115.0" dy="14.3"></tspan><tspan x="115.0" dy="14.3">Незалежний приймач</tspan></text>
<line x1="190.0" y1="350.0" x2="230.0" y2="350.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230.0" y="315.0" width="160.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="310.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Апаратний дешифратор</tspan><tspan x="310.0" dy="14.3">(Safety MCU / CPLD)</tspan><tspan x="310.0" dy="14.3"></tspan><tspan x="310.0" dy="14.3">Перевірка CRC та лінку</tspan></text>
<line x1="390.0" y1="350.0" x2="430.0" y2="350.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="315.0" width="170.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="515.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">Силовий розмикач</tspan><tspan x="515.0" dy="14.3">(Back-to-Back MOSFET)</tspan><tspan x="515.0" dy="14.3"></tspan><tspan x="515.0" dy="14.3">Розрив силового кола</tspan></text>
<line x1="600.0" y1="350.0" x2="640.0" y2="350.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="315.0" width="140.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Шина живлення ESC</tspan><tspan x="710.0" dy="14.3">+ Лінія відстрілу</tspan><tspan x="710.0" dy="14.3">парашута</tspan></text>
<text x="410.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Гарантія: силове живлення знімається напряму з ESC за &lt; 100 мкс незалежно від стану польотного контролера</text>
</svg>