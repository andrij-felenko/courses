<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема силового розмикача FTS на Back-to-Back MOSFET з захистом від дуги</text>
<rect x="30.0" y="60.0" width="190.0" height="130.0" rx="6" fill="#fef9e7" stroke="#d98324" stroke-width="1.6"/><text x="125.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">LiPo Батарея (VBAT)</tspan><tspan x="125.0" dy="14.3">22.2V - 50.4V (6S-12S)</tspan><tspan x="125.0" dy="14.3"></tspan><tspan x="125.0" dy="14.3">Головна силова шина</tspan><tspan x="125.0" dy="14.3">Струм до 150-200 A</tspan></text>
<rect x="30.0" y="220.0" width="190.0" height="170.0" rx="6" fill="#f0f4f8" stroke="#2457d6" stroke-width="1.6"/><text x="125.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Вхід FTS / Kill-Switch</tspan><tspan x="125.0" dy="14.3"></tspan><tspan x="125.0" dy="14.3">• Виділений радіоприймач</tspan><tspan x="125.0" dy="14.3">• Оптоізолятор 2.5 кВ</tspan><tspan x="125.0" dy="14.3">• Активний рівень LOW</tspan><tspan x="125.0" dy="14.3">• Захист від обриву</tspan><tspan x="125.0" dy="14.3">(Pull-Down резистор)</tspan></text>
<rect x="260.0" y="60.0" width="310.0" height="330.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="415.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Силовий вузол розмикача</text>
<rect x="280.0" y="105.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">Драйвер затворів (Gate Driver)</tspan><tspan x="415.0" dy="13.0">із помпою заряду (Charge Pump)</tspan><tspan x="415.0" dy="13.0">Швидке розряджання затвора (t_off &lt; 5 µs)</tspan></text>
<rect x="280.0" y="190.0" width="270.0" height="95.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="415.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">Зустрічні N-MOSFET (Back-to-Back)</tspan><tspan x="415.0" dy="13.0">• Q1: Блокування прямого струму</tspan><tspan x="415.0" dy="13.0">• Q2: Блокування струму рекуперації</tspan><tspan x="415.0" dy="13.0">• Низький опір R_ds(on) &lt; 0.8 мОм</tspan><tspan x="415.0" dy="13.0">• Без дуги та залипання контактів</tspan></text>
<rect x="280.0" y="300.0" width="270.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">Ланцюг захисту від індуктивних викидів</tspan><tspan x="415.0" dy="13.0">• TVS-супресори (V_br = 60 V)</tspan><tspan x="415.0" dy="13.0">• RC-снабер (10 Ом + 100 нФ)</tspan><tspan x="415.0" dy="13.0">• Захист від перенапруги при відсічці</tspan></text>
<rect x="610.0" y="60.0" width="180.0" height="150.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.6"/><text x="700.0" y="103.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Силова шина до ESC</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">• Регулятори моторів</tspan><tspan x="700.0" dy="14.3">• Конденсатори фільтра</tspan><tspan x="700.0" dy="14.3">• Знеструмлення за &lt; 10 µs</tspan><tspan x="700.0" dy="14.3">• Миттєве зняття тяги</tspan></text>
<rect x="610.0" y="240.0" width="180.0" height="150.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.6"/><text x="700.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Лінія порятунку</tspan><tspan x="700.0" dy="14.3">(Safe State Actuator)</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">• Піропатрон парашута</tspan><tspan x="700.0" dy="14.3">• Або сервоскид замка</tspan><tspan x="700.0" dy="14.3">• Затримка 50-100 мс</tspan><tspan x="700.0" dy="14.3">(після зупинки моторів)</tspan></text>
<line x1="220.0" y1="125.0" x2="260.0" y2="125.0" stroke="#d98324" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="220.0" y1="280.0" x2="260.0" y2="280.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="415.0" y1="175.0" x2="415.0" y2="190.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570.0" y1="135.0" x2="610.0" y2="135.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="315.0" x2="610.0" y2="315.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>