<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Загадка 1901 року: сигнал, якого не мало долетіти</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">за прямою видимістю горб океану ховає Ньюфаундленд від Корнуолу — а «S» нібито прийшло</text>
<path d="M 40,392.0 A 1150,1150 0 0 1 900,392.0 L 900,446 L 40,446 Z" fill="#eaf1f6" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="470.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">опуклість Землі — ~3400 км океану між Поудю і Сент-Джонсом</text>
<line x1="150.0" y1="366.0" x2="150.0" y2="326.0" stroke="#b9770e" stroke-width="3.0"/>
<text x="150.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">Поудю (Корнуол)</text>
<text x="150.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">передавач ~13 кВт</text>
<line x1="790.0" y1="366.0" x2="790.0" y2="326.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="790.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Сент-Джонс</text>
<text x="790.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Марконі слухає «S»</text>
<line x1="150.0" y1="326.0" x2="400.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6,5"/>
<line x1="790.0" y1="326.0" x2="540.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6,5"/>
<text x="470.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="470.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">пряма дорога впирається в горб океану</text>
<line x1="120.0" y1="96.0" x2="820.0" y2="96.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="3,7"/>
<text x="470.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">якесь дзеркало вгорі? — 1901-го його ще ніхто не припускав</text>
<path d="M 150,326 Q 310,114 470,104 Q 630,114 790,326" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="7,5"/>
</svg>