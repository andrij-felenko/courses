<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр криптографічної випадковості у вбудованих системах</text>
<rect x="25.0" y="60.0" width="165.0" height="230.0" rx="6" fill="#fdfaf6" stroke="#c0392b" stroke-width="1.6"/>
<text x="107.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Джерела ентропії</text>
<text x="107.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Тепловий шум p-n</text>
<text x="107.5" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Фазовий джиттер ROSC</text>
<text x="107.5" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Молодші біти АЦП</text>
<text x="107.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Дрейф таймерів RC/HSE</text>
<text x="107.5" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Джиттер радіопакетів</text>
<line x1="35.0" y1="208.0" x2="180.0" y2="208.0" stroke="#e5c8ba" stroke-width="1.0"/>
<text x="107.5" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Сирий шум:</text>
<text x="107.5" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Нерівномірний (Bias)</text>
<text x="107.5" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Автокорельований</text>
<line x1="193.0" y1="175.0" x2="212.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="215.0" y="60.0" width="165.0" height="230.0" rx="6" fill="#fffaf0" stroke="#d97706" stroke-width="1.6"/>
<text x="297.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">2. Health Monitor</text>
<text x="297.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(NIST SP 800-90B)</text>
<text x="297.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Repetition Count Test</text>
<text x="297.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Виявляє залипання бітів</text>
<line x1="225.0" y1="160.0" x2="370.0" y2="160.0" stroke="#fde68a" stroke-width="1.0"/>
<text x="297.5" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Adaptive Proportion</text>
<text x="297.5" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Контроль перекосу 0/1</text>
<line x1="225.0" y1="212.0" x2="370.0" y2="212.0" stroke="#fde68a" stroke-width="1.0"/>
<text x="297.5" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Детекція деградації:</text>
<text x="297.5" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Аварійне блокування</text>
<text x="297.5" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">при відмові сенсора</text>
<line x1="383.0" y1="175.0" x2="402.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="405.0" y="60.0" width="185.0" height="230.0" rx="6" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="497.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">3. Пул і кондиціювання</text>
<text x="497.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Entropy Conditioning)</text>
<text x="497.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фільтр Фон Неймана</text>
<text x="497.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Знищення асиметрії 0/1</text>
<line x1="415.0" y1="160.0" x2="580.0" y2="160.0" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="497.5" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Акумулятор ентропії</text>
<text x="497.5" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Криптографічний хеш</text>
<text x="497.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(SHA-256 / Blake2s)</text>
<line x1="415.0" y1="228.0" x2="580.0" y2="228.0" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="497.5" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Вихід: 256-бітний</text>
<text x="497.5" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ідеальний Seed</text>
<line x1="593.0" y1="175.0" x2="612.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="615.0" y="60.0" width="195.0" height="230.0" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.6"/>
<text x="712.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">4. CSPRNG Двигун</text>
<text x="712.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(ChaCha20-DRBG / AES-CTR)</text>
<text x="712.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішній стан:</text>
<text x="712.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Key [256] + Nonce [96]</text>
<line x1="625.0" y1="160.0" x2="800.0" y2="160.0" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="712.5" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Backtracking Resistance</text>
<text x="712.5" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Перезапис ключа після виходу</text>
<line x1="625.0" y1="212.0" x2="800.0" y2="212.0" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="712.5" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Споживачі:</text>
<text x="712.5" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Ключі сесій TLS / DTLS</text>
<text x="712.5" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ECDSA Nonce, AES-GCM IV</text>
<rect x="25.0" y="305.0" width="790.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="420.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Головний принцип: сирий фізичний шум ніколи не подається в криптографію напряму.</tspan><tspan x="420.0" dy="14.3">Він проходить валідацію здоров'я (Health Tests), декореляцію, хеш-кондиціювання в пулі</tspan><tspan x="420.0" dy="14.3">і слугує виключно для початкового посіву (Seed) криптографічно стійкого генератора CSPRNG.</tspan></text>
</svg>