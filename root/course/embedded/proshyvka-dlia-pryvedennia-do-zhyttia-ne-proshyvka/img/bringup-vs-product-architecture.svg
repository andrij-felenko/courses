<text x="617.5" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#21618c" text-anchor="middle" font-weight="700">RF тестовий модуль (CW Mode / RSSI)</text>
<text x="617.5" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Прямий запуск генератора без асоціації</text>
<rect x="450.0" y="256.0" width="335.0" height="42.0" rx="4" fill="#fef9e7" stroke="#7d6608" stroke-width="1.2"/>
<text x="617.5" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7d6608" text-anchor="middle" font-weight="700">Ізольований I2C/SPI Sweep &amp; March C-</text>
<text x="617.5" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Апаратні таймаути й Bus Recovery 9 тактів</text>
<rect x="450.0" y="304.0" width="335.0" height="42.0" rx="4" fill="#f5eef8" stroke="#5b2c6f" stroke-width="1.2"/>
<text x="617.5" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#5b2c6f" text-anchor="middle" font-weight="700">Bare-metal супер-цикл без купи (heap)</text>
<text x="617.5" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Нуль залежностей, запуск на 'голому' чипі</text>
<text x="420.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Робоча прошивка вимагає працездатного заліза; прошивка тестування перевіряє його працездатність</text>
