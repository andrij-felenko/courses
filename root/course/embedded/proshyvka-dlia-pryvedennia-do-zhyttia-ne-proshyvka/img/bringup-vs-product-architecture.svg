<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура: робоча прошивка продукту проти Bring-up прошивки</text>
<rect x="40.0" y="50.0" width="365.0" height="330.0" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.8"/>
<text x="222.5" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b95e04" text-anchor="middle" font-weight="700">Робоча прошивка продукту (App)</text>
<text x="222.5" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Оптимізована під функціонал і справне залізо</text>
<rect x="55.0" y="112.0" width="335.0" height="42.0" rx="4" fill="#f8d7da" stroke="#721c24" stroke-width="1.2"/>
<text x="222.5" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#721c24" text-anchor="middle" font-weight="700">Хмарні сервіси, MQTT, TLS, NTP</text>
<text x="222.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Очікує сертифікати й IP-з'єднання</text>
