<text x="222.5" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Блокування задач на непропаяній периферії</text>
<rect x="55.0" y="304.0" width="335.0" height="42.0" rx="4" fill="#eaeded" stroke="#2c3e50" stroke-width="1.2"/>
