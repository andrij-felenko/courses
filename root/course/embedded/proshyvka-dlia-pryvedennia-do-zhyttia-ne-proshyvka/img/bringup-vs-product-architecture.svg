<text x="617.5" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#117a65" text-anchor="middle" font-weight="700">Модуль eFuse / OTP персоналізації</text>
<text x="617.5" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Стабільне пропалювання ключів та MAC</text>
