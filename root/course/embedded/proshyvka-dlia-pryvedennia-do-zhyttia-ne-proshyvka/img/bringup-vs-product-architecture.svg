<text x="617.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Миттєвий JSON / бінарний звіт стенду</text>
