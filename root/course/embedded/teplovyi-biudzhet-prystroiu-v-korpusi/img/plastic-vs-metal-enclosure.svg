<rect x="35.0" y="380.0" width="770.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="420.0" y="417.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Головний висновок теплового проектування: пластиковий корпус вимагає жорсткого обмеження потужності (&lt; 1–2 Вт).</tspan><tspan x="420.0" dy="14.3">Якщо плата розсіює понад 3–5 Вт у герметичному об'ємі, єдиний надійний шлях — алюмінієве шасі</tspan><tspan x="420.0" dy="14.3">із теплопровідним силіконовим заповнювачем (Gap Pad / Putty) безпосередньо на металеву кришку.</tspan></text>
