<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка тепловіддачі зовнішньої поверхні: конвекція та випромінювання</text>
<rect x="280.0" y="80.0" width="260.0" height="220.0" rx="8" fill="#eaeded" stroke="#333333" stroke-width="2.0"/>
<text x="410.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зовнішня стінка корпусу</text>
<text x="410.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Температура поверхні: T_s</text>
<text x="410.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Q_заг = Q_conv + Q_rad</text>
<rect x="50.0" y="75.0" width="190.0" height="230.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="145.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Природна конвекція</text>
<text x="145.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Q_c = h_c · A · (T_s − T_amb)</text>
<text x="145.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Рушій: сила Архімеда</text>
<text x="145.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(гаряче повітря легше)</text>
<line x1="210.0" y1="260.0" x2="210.0" y2="230.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="210.0" y1="220.0" x2="210.0" y2="190.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="210.0" y1="180.0" x2="210.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="210.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">↑ потік</text>
<text x="145.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">h_c ≈ 3..8 Вт/(м²·К)</text>
<rect x="580.0" y="75.0" width="190.0" height="230.0" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.5"/>
<text x="675.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">2. Теплове випромінювання</text>
<text x="675.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Q_r = ε · σ · A · (T_s⁴ − T_amb⁴)</text>
<text x="675.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Закон Стефана-Больцмана</text>
<line x1="545.0" y1="130.0" x2="575.0" y2="115.0" stroke="#d35400" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="545.0" y1="160.0" x2="580.0" y2="160.0" stroke="#d35400" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="545.0" y1="190.0" x2="575.0" y2="205.0" stroke="#d35400" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="675.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Чорне анодування: ε ≈ 0.9</text>
<text x="675.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Чистий алюміній: ε ≈ 0.05</text>
<text x="675.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(у 18 разів гірша радіація!)</text>
<text x="675.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">h_r ≈ 5..7 Вт/(м²·К)</text>
<rect x="50.0" y="325.0" width="720.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="410.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Співвідношення часток: при природному охолодженні на відкритому повітрі радіація дає 40–55% тепловіддачі,</tspan><tspan x="410.0" dy="14.3">а конвекція — решту 45–60%. Тому фарбування чи анодування металевого корпусу подвоює його ефективність!</tspan><tspan x="410.0" dy="14.3">Орієнтація ребер має бути вертикальною: горизонтальні ребра перекривають природний висхідний потік повітря.</tspan></text>
</svg>