<text x="785.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Довкілля T_amb</text>
<rect x="30.0" y="320.0" width="780.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="420.0" y="357.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Послідовно-паралельний закон: повний опір системи визначає найслабша ланка.</tspan><tspan x="420.0" dy="14.3">Без термопрокладки тепло йде через повітря (R_th_air ≈ 20..50 °C/Вт) — пристрій перегрівається.</tspan><tspan x="420.0" dy="14.3">Прямий контакт через Gap Pad зменшує внутрішній перепад у 10–20 разів, скидаючи тепло на стінку.</tspan></text>
