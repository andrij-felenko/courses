<text x="470.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Напруга ядра на VCAP</text>
<text x="470.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вольтметром на VCAP: 1.2 В?</text>
<line x1="470.0" y1="180.0" x2="470.0" y2="220.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370.0" y="220.0" width="200.0" height="50.0" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="470.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ні (0 В або шум)</text>
<text x="470.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Забули 2.2 мкФ VCAP кераміку</text>
<line x1="470.0" y1="80.0" x2="740.0" y2="120.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="120.0" width="240.0" height="60.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="740.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Рівні на NRST та BOOT0</text>
<text x="740.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">NRST = 3.3 В, BOOT0 = 0 В (GND)?</text>
