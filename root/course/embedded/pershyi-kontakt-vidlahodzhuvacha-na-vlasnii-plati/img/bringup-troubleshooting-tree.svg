<line x1="590.0" y1="310.0" x2="860.0" y2="310.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="470.0" y1="310.0" x2="470.0" y2="340.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="280.0" y="340.0" width="380.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="470.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Апаратні напруги в нормі! Програмний крок:</text>
<text x="470.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Увімкнути режим «Connect under Reset»</text>
<line x1="380.0" y1="405.0" x2="250.0" y2="445.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="90.0" y="445.0" width="320.0" height="85.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="250.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Успішне підключення!</text>
<text x="250.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Причина: попередня прошивка спала</text>
<text x="250.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">або ремапила піни SWDIO/SWCLK</text>
<line x1="560.0" y1="405.0" x2="690.0" y2="445.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530.0" y="445.0" width="320.0" height="85.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="690.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка читання Flash (MEM-AP error)</text>
<text x="690.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Причина: активний захист RDP Level 1</text>
<text x="690.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Рішення: RDP Unlock / Mass Erase через CLI</text>
