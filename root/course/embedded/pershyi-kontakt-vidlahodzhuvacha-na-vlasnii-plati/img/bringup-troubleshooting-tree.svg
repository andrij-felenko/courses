<rect x="645.0" y="220.0" width="190.0" height="50.0" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="740.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ні (NRST=0 або BOOT0=1)</text>
<text x="740.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Залип reset, висить BOOT0</text>
