<text x="470.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Cannot connect to target / Target not found</text>
<line x1="470.0" y1="80.0" x2="200.0" y2="120.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
