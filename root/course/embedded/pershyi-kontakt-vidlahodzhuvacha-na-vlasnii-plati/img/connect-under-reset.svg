<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Connect under Reset: перехоплення керування ядром до виконання прошивки</text>
<rect x="40.0" y="50.0" width="860.0" height="205.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="60.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="start" font-weight="700">Сценарій 1. Звичайне підключення (Normal Connect) — відмова при збійній прошивці</text>
<line x1="80.0" y1="160.0" x2="840.0" y2="160.0" stroke="#cbd5e1" stroke-width="2.0"/>
<text x="840.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Час t →</text>
<rect x="80.0" y="105.0" width="140.0" height="45.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="150.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зняття nRESET</text>
<text x="150.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ядро стартує</text>
<rect x="240.0" y="105.0" width="200.0" height="45.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="340.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Користувацький код (0..5 мкс)</text>
<text x="340.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Ремап SWD в GPIO або Deep Sleep</text>
<rect x="460.0" y="105.0" width="230.0" height="45.0" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
<text x="575.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відлагоджувач шле DP-IDCODE</text>
<text x="575.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Спроба зупинити ядро через DHCSR</text>
<rect x="710.0" y="105.0" width="140.0" height="45.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<text x="780.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ПОМИЛКА ЗВ'ЯЗКУ</text>
<text x="780.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Target not found</text>
<text x="150.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">t = 0</text>
<text x="340.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">t = 5 мкс (SWD вимкнено!)</text>
<text x="575.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">t = 2 мс (запізно)</text>
<rect x="40.0" y="275.0" width="860.0" height="205.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Сценарій 2. Підключення під скиданням (Connect under Reset) — надійне перехоплення</text>
<line x1="80.0" y1="390.0" x2="840.0" y2="390.0" stroke="#cbd5e1" stroke-width="2.0"/>
<text x="840.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Час t →</text>
<rect x="80.0" y="335.0" width="190.0" height="45.0" rx="4" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="175.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Відлагоджувач тримає nRESET=0</text>
<text x="175.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ядро заморожене, CoreSight активний</text>
<rect x="290.0" y="335.0" width="230.0" height="45.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="405.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Налаштування Vector Catch</text>
<text x="405.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">DEMCR.VC_CORERESET = 1, C_DEBUGEN</text>
<rect x="540.0" y="335.0" width="160.0" height="45.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="620.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зняття nRESET (High)</text>
<text x="620.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ядро починає вибірку вектора</text>
<rect x="720.0" y="335.0" width="140.0" height="45.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="2.0"/>
<text x="790.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ЗУПИНКА НА ВЕКТОРІ</text>
<text x="790.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">PC = Reset_Handler</text>
<text x="175.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ядро спить у Reset</text>
<text x="405.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Пастка налаштована</text>
<text x="620.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Апаратний пуск</text>
<text x="790.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Код ще не виконався!</text>
</svg>