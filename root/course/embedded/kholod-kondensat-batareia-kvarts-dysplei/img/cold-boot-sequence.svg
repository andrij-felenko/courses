<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм адаптивного холодного старту вбудованої системи</text>
<text x="380.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Ступеневе розігрівання, захист від Brownout Reset та блокування заряду при T &lt; 0 °C</text>
<rect x="209.0" y="64.3" width="342.0" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">1. Старт ядра від вбудованого генератора (HSI / LSI)</tspan><tspan x="380.0" dy="14.3">(Зовнішній кварц вимкнено, частота ядра знижена)</tspan></text>
<rect x="221.5" y="139.3" width="317.0" height="41.3" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">2. Вимірювання температури NTC / давача кристала</tspan><tspan x="380.0" dy="14.3">Оцінка точки роси та залишкового ESR батареї</tspan></text>
<rect x="84.3" y="226.3" width="231.5" height="67.4" rx="6" fill="#fef9e7" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="243.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Режим «Глибокий холод» (T &lt; -10 °C)</tspan><tspan x="200.0" dy="13.7">• Увімкнення PCB Heater / Dummy Burn</tspan><tspan x="200.0" dy="13.7">• Струм розряду обмежено (C/10)</tspan><tspan x="200.0" dy="13.7">• Блокування заряджання при T &lt; 0 °C</tspan></text>
<rect x="447.3" y="226.3" width="225.5" height="67.4" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="243.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Режим «Нормальний старт»</tspan><tspan x="560.0" dy="13.7">• ESR батареї в нормі</tspan><tspan x="560.0" dy="13.7">• Запуск HSE кварцу з таймаутом</tspan><tspan x="560.0" dy="13.7">• Перевірка працездатності LCD/OLED</tspan></text>
<rect x="199.6" y="339.4" width="360.8" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">4. Валідація стабільності кварцу та напруги VBAT</tspan><tspan x="380.0" dy="14.3">Перемикання тактування на PLL/HSE після виходу на режим</tspan></text>
<rect x="204.9" y="414.4" width="350.2" height="41.3" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="431.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">5. Активація радіотракту (LTE/Wi-Fi) та периферії</tspan><tspan x="380.0" dy="14.3">Ступеневе нарощування потужності</tspan></text>
