<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Який стиль обрати: одне питання</text>
<rect x="237.6" y="44.2" width="224.9" height="51.6" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.0"/><text x="350.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Потрібні передбачуваний час</tspan><tspan x="350.0" dy="15.6">і найменший розмір коду?</tspan></text>
<line x1="309.5" y1="95.8" x2="175.0" y2="180.2" stroke="#27ae60" stroke-width="1.7"/>
<text x="226.3" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">так</text>
<rect x="72.9" y="180.2" width="204.1" height="59.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="175.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">ТАК → коди повернення</tspan><tspan x="175.0" dy="14.3">(вбудоване: ESP-IDF за</tspan><tspan x="175.0" dy="14.3">замовчуванням без винятків)</tspan></text>
<line x1="390.5" y1="95.8" x2="525.0" y2="180.2" stroke="#2457d6" stroke-width="1.7"/>
<text x="473.7" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">ні</text>
<rect x="433.2" y="180.2" width="183.7" height="59.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="525.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">НІ → винятки доречні</tspan><tspan x="525.0" dy="14.3">(хост, десктоп, де чисті</tspan><tspan x="525.0" dy="14.3">щасливі шляхи цінніші)</tspan></text>
<text x="350.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">на мікроконтролері відповідь майже завжди «так» — звідси канон кодів повернення</text>
</svg>