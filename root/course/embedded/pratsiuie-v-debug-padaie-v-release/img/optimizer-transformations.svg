<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="435.0" height="380.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="485.0" y="20.0" width="435.0" height="380.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="35.0" y="35.0" width="405.0" height="42.0" rx="6" fill="#e2e8f0" stroke="#2457d6" stroke-width="1.5"/>
<text x="237.0" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Збірка Debug (-O0): буквальна трансляція</text>
<rect x="35.0" y="95.0" width="405.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="50.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Стек для кожної змінної</text>
<text x="50.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Кожна локальна змінна живе в SRAM; LDR/STR на кожну операцію</text>
<rect x="35.0" y="153.0" width="405.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="50.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Повне збереження викликів</text>
<text x="50.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Жодного inlining: кожна функція генерує чесний BL/BLX та пролог</text>
<rect x="35.0" y="211.0" width="405.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="50.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Буквальне виконання циклів</text>
<text x="50.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Порожні цикли затримки for (i=0; i&lt;N; i++) крутяться в залізі</text>
<rect x="35.0" y="269.0" width="405.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="50.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Строгий порядок пам'яті</text>
<text x="50.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Інструкції йдуть у порядку C-коду; таймінги довгі й повільні</text>
<rect x="35.0" y="327.0" width="405.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="50.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Побічний ефект: маскування багів</text>
<text x="50.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Повільний CPU встигає за периферією, RAM занулена зневаджувачем</text>
<rect x="500.0" y="35.0" width="405.0" height="42.0" rx="6" fill="#e2e8f0" stroke="#c0392b" stroke-width="1.5"/>
<text x="702.0" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Збірка Release (-O2 / -O3): оптимізований конвеєр</text>
<rect x="500.0" y="95.0" width="405.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="515.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Регістровий розподіл</text>
<text x="515.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Змінні кешуються в R0–R12; RAM не опитується без volatile</text>
<rect x="500.0" y="153.0" width="405.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="515.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Агресивний Inlining</text>
<text x="515.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Тіла функцій вбудовуються, межі викликів та кадри стека стираються</text>
<rect x="500.0" y="211.0" width="405.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="515.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Викидання мертвого коду (DCE)</text>
<text x="515.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Порожні затримки без side-effects видаляються на 100% (0 нс)</text>
<rect x="500.0" y="269.0" width="405.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="515.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Перевпорядкування операцій</text>
<text x="515.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Компілятор переставляє LDR/STR для уникнення конвеєрних пауз</text>
<rect x="500.0" y="327.0" width="405.0" height="50.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="515.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Наслідок: оголення дефектів</text>
<text x="515.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Швидкість x10 ламає гонки таймінгів; сміття стека замінює нулі</text>
</svg>