<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зчеплення VAD ↔ AGC: два модулі, одна ниточка керування</text>
<rect x="24.0" y="120.0" width="116.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="82.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="82.0" dy="0.0">чистий кадр</tspan><tspan x="82.0" dy="15.6">(пост.+смуга)</tspan></text>
<circle cx="180.0" cy="150.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="142.0" y1="150.0" x2="178.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="120.0" width="116.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="488.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="488.0" dy="0.0">зчеплений AGC</tspan><tspan x="488.0" dy="13.0">(gain / freeze)</tspan></text>
<line x1="180.0" y1="150.0" x2="428.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="120.0" width="116.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="658.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="658.0" dy="0.0">рівний звук</tspan><tspan x="658.0" dy="15.6">→ важке</tspan></text>
<line x1="548.0" y1="150.0" x2="598.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="122.0" y="40.0" width="116.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">сторож VAD</tspan><tspan x="180.0" dy="15.6">(є голос?)</tspan></text>
<line x1="180.0" y1="148.0" x2="180.0" y2="100.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="180.0" y1="96.0" x2="180.0" y2="94.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="238.0" y1="66.0" x2="388.0" y2="66.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="388.0" y1="66.0" x2="388.0" y2="118.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="388.0" y1="118.0" x2="488.0" y2="118.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="316.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">прапорець voice</text>
<line x1="122.0" y1="100.0" x2="122.0" y2="224.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3"/>
<line x1="122.0" y1="224.0" x2="450.0" y2="224.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3"/>
<line x1="450.0" y1="224.0" x2="450.0" y2="182.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="276.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">фон VAD задає шумовий поріг AGC</text>
<text x="390.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Сторож вирішує «чи є голос»; AGC — «яким бути підсиленню». Один булів прапорець між ними.</text>
</svg>