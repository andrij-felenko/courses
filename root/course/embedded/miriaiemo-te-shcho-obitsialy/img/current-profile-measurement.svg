<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профіль динамічного споживання струму та схема вимірювання</text>
<text x="470.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профіль динамічного споживання струму та схема вимірювання</text>
<rect x="30.0" y="50.0" width="470.0" height="390.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="265.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічний профіль струму i(t)</text>
<line x1="70.0" y1="390.0" x2="470.0" y2="390.0" stroke="#333333" stroke-width="1.5"/>
<line x1="70.0" y1="390.0" x2="70.0" y2="95.0" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">t, мс</text>
<text x="65.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">I, мА</text>
<line x1="65.0" y1="390.0" x2="465.0" y2="390.0" stroke="#eaedf0" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="62.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">0</text>
<line x1="65.0" y1="330.0" x2="465.0" y2="330.0" stroke="#eaedf0" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="62.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">15 мкА</text>
<line x1="65.0" y1="260.0" x2="465.0" y2="260.0" stroke="#eaedf0" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="62.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">10 мА</text>
<line x1="65.0" y1="180.0" x2="465.0" y2="180.0" stroke="#eaedf0" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="62.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">40 мА</text>
<line x1="65.0" y1="115.0" x2="465.0" y2="115.0" stroke="#eaedf0" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="62.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">100 мА</text>
<path d="M 70.0 330.0 L 120.0 330.0 L 122.0 230.0 L 135.0 230.0 L 136.0 280.0 L 190.0 280.0 L 192.0 115.0 L 280.0 115.0 L 282.0 245.0 L 320.0 245.0 L 322.0 330.0 L 460.0 330.0" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<path d="M 192 390 L 192 115 L 280 115 L 280 390 Z" fill="#fdecea" opacity="0.6"/>
<text x="95.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Deep Sleep</text>
<text x="130.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Старт</text>
<text x="163.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Датчик</text>
<text x="236.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Радіоканал (TX)</text>
<text x="301.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Flash</text>
<text x="390.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Deep Sleep (15 мкА)</text>
<rect x="520.0" y="50.0" width="390.0" height="390.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="715.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Методика вимірювання струму</text>
<rect x="535.0" y="95.0" width="360.0" height="140.0" rx="5" fill="#fff5f5" stroke="#c0392b" stroke-width="1.4"/>
<text x="545.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Пастка DMM: Burden Voltage (падіння на шунті)</text>
<text x="545.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Діапазон мкА: R_shunt = 1..10 кОм</text>
<text x="545.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• При стрибку до 50 мА: ΔV = 50 мА · 1 кОм = 50 В (відсічка!)</text>
<text x="545.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Результат: Brown-Out Reset та постійний ребут МК</text>
<text x="545.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Низька частота вибірки (3–10 Sps) втрачає піки</text>
<text x="545.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">Звичайний мультиметр не придатний для DVT</text>
<rect x="535.0" y="250.0" width="360.0" height="175.0" rx="5" fill="#f4fcf6" stroke="#27ae60" stroke-width="1.4"/>
<text x="545.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Профілювальник (PPK2 / Joulescope / SMU)</text>
<text x="545.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Безрозривне автоперемикання шунтів (Auto-ranging)</text>
<text x="545.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Частота дискретизації: 100 kSps .. 2 MSps</text>
<text x="545.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Динамічний діапазон: від 100 нА до 500 мА</text>
<text x="545.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 4-провідне підключення Кельвіна (Kelvin Sense)</text>
<text x="545.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Інтегрування заряду (Кулони Q = ∫ i dt)</text>
<text x="545.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700" font-style="italic">Оцінка життєвого циклу батареї на основі площі заряду</text>
<text x="470.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Вимірювання охоплює 6 порядків струму: від десятків наноамперів у сні до сотень міліамперів у TX</text>
</svg>