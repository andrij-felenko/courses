<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цілісність сигналів шини SPI/QSPI</text>
<text x="470.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цілісність сигналів шини SPI/QSPI: Дзвін, відбиття та демпфування</text>
<rect x="30.0" y="50.0" width="425.0" height="370.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="242.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Без демпфування (Fast Slew Rate, R_s = 0)</text>
<rect x="50.0" y="95.0" width="385.0" height="180.0" rx="4" fill="#1a1a1a" stroke="#333333" stroke-width="1.5"/>
<line x1="50.0" y1="150.0" x2="435.0" y2="150.0" stroke="#555555" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="50.0" y1="235.0" x2="435.0" y2="235.0" stroke="#555555" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="50.0" y1="192.0" x2="435.0" y2="192.0" stroke="#777777" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="55.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#888888" text-anchor="start">VDD (3.3V)</text>
<text x="55.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#888888" text-anchor="start">GND (0V)</text>
<text x="55.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#888888" text-anchor="start">Поріг (1.65V)</text>
<path d="M 60 235 L 100 235 L 120 110 L 135 180 L 150 135 L 165 160 L 180 150 L 240 150 L 260 270 L 275 205 L 290 250 L 305 225 L 320 235 L 420 235" fill="none" stroke="#e74c3c" stroke-width="2.2"/>
<text x="125.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#f1948a" text-anchor="middle" font-weight="700">Overshoot: 4.2V (+0.9V)</text>
<text x="265.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#f1948a" text-anchor="middle" font-weight="700">Undershoot: -0.7V</text>
<text x="142.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Хибний глітч такту!</text>
<rect x="50.0" y="285.0" width="385.0" height="120.0" rx="4" fill="#fff5f5" stroke="#f5c6cb" stroke-width="1.2"/>
<text x="65.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Причини та наслідки відсутності узгодження:</text>
<text x="65.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Драйвер МК має R_out ≈ 15 Ом, імпеданс лінії Z_0 ≈ 60 Ом</text>
<text x="65.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Відбиття сигналу від високого імпедансу приймача</text>
<text x="65.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">• Відкриття вхідних ESD діодів чіпа (стрес кремнію)</text>
<text x="65.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• Помилкові тактові імпульси (False Clocking) на SCK SPI</text>
<text x="65.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Помилки зчитування QSPI Flash та спотворення даних</text>
<rect x="485.0" y="50.0" width="425.0" height="370.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="697.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">З послідовним резистором R_s = 27 Ом + Medium Slew</text>
<rect x="505.0" y="95.0" width="385.0" height="180.0" rx="4" fill="#1a1a1a" stroke="#333333" stroke-width="1.5"/>
<line x1="505.0" y1="150.0" x2="890.0" y2="150.0" stroke="#555555" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="505.0" y1="235.0" x2="890.0" y2="235.0" stroke="#555555" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="505.0" y1="192.0" x2="890.0" y2="192.0" stroke="#777777" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="510.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#888888" text-anchor="start">VDD (3.3V)</text>
<text x="510.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#888888" text-anchor="start">GND (0V)</text>
<text x="510.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#888888" text-anchor="start">Поріг (1.65V)</text>
<path d="M 515 235 L 555 235 Q 575 235 585 170 Q 595 150 610 150 L 700 150 Q 720 150 730 215 Q 740 235 755 235 L 875 235" fill="none" stroke="#2ecc71" stroke-width="2.2"/>
<text x="605.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a9dfbf" text-anchor="middle" font-weight="700">Монотонний фронт без дзвону</text>
<text x="715.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a9dfbf" text-anchor="middle" font-weight="700">Плавний спад без викидів нижче GND</text>
<rect x="505.0" y="285.0" width="385.0" height="120.0" rx="4" fill="#f4fcf6" stroke="#c3e6cb" stroke-width="1.2"/>
<text x="520.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Фізика правильного узгодження лінії:</text>
<text x="520.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">• R_out + R_s = 15 Ом + 27 Ом = 42 Ом ≈ Z_0 (лінія узгоджена)</text>
<text x="520.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Зниження швидкості виводу (GPIO Speed = Medium) обмежує dI/dt</text>
<text x="520.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Резистор гасить енергію відбитої хвилі на виході джерела</text>
<text x="520.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Setup Time та Hold Time гарантовано виконуються</text>
<text x="520.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Нульовий рівень бітових помилок на частотах до 80 МГц</text>
<text x="470.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Послідовний демпфер 22–33 Ом біля виходу драйвера ліквідує дзвін та паразитно збуджені такти</text>
</svg>