<text x="125.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">При −40 °C: −169 ppm</text>
<text x="310.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">При +85 °C: −144 ppm</text>
<text x="245.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Вершина параболи (+25 °C)</text>
<rect x="485.0" y="225.0" width="425.0" height="215.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="697.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Температурний дрейф опори АЦП (VREF)</text>
<rect x="505.0" y="265.0" width="385.0" height="75.0" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="520.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Внутрішній Bandgap МК (30..50 ppm/°C):</text>
<text x="520.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• ΔT = 60 °C → дрейф опори досягає ±0.3..0.5%</text>
<text x="520.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">• 12-бітний АЦП втрачає до 15–20 LSB точності</text>
<rect x="505.0" y="348.0" width="385.0" height="75.0" rx="4" fill="#f4fcf6" stroke="#27ae60" stroke-width="1.2"/>
<text x="520.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Зовнішній прецизійний ІОН (2..5 ppm/°C):</text>
<text x="520.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Дрейф у всьому діапазоні не перевищує 0.03%</text>
<text x="520.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Гарантована абсолютна похибка &lt; 1 LSB</text>
<text x="470.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Кліматичні тести виявляють крайові відмови: зрив генерації кварцу, дрейф АЦП та деградацію ESR батареї</text>
</svg>