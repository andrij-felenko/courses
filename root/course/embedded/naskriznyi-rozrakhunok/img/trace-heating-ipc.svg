<text x="575.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Силова мідь</text>
<rect x="495.0" y="185.0" width="250.0" height="8.0" rx="1" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="620.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">Внутрішній екран GND (Мідь розсіює тепло)</text>
