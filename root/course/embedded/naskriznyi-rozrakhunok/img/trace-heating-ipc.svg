<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловий баланс силової доріжки</text>
<rect x="0.0" y="0.0" width="840.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
