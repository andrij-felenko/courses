<line x1="577.0" y1="140.0" x2="577.0" y2="280.0" stroke="#c0392b" stroke-width="1.5"/>
<rect x="600.0" y="150.0" width="4.0" height="130.0" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.0"/>
<line x1="602.0" y1="140.0" x2="602.0" y2="280.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="660.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Теплові via</text>
<rect x="495.0" y="272.0" width="250.0" height="8.0" rx="1" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="620.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Тепло стікає в площини GND через діелектрик та via</text>
<text x="620.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Велика площа плати ефективно розсіює тепло</text>
<text x="620.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">• Дозволяє меншу ширину доріжки при тому ж ΔT</text>
<text x="620.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">• Враховує товщину плати, шари та охолодження</text>
