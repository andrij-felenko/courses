<rect x="35.0" y="65.0" width="365.0" height="365.0" rx="6" fill="#fef8f8" stroke="#fca5a5" stroke-width="1.5"/>
<text x="217.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Модель IPC-2221 (1954/1998)</text>
<text x="217.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ізольований провідник на чистому FR-4</text>
<rect x="100.0" y="160.0" width="235.0" height="120.0" rx="4" fill="#d97706" stroke="#92400e" stroke-width="2.0"/>
