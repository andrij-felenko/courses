<polygon points="185,100 182,107 188,107" fill="#c0392b"/>
<line x1="217.0" y1="130.0" x2="217.0" y2="105.0" stroke="#c0392b" stroke-width="1.5"/>
<polygon points="217,100 214,107 220,107" fill="#c0392b"/>
<line x1="250.0" y1="130.0" x2="250.0" y2="105.0" stroke="#c0392b" stroke-width="1.5"/>
<polygon points="250,100 247,107 253,107" fill="#c0392b"/>
<text x="217.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Тепловідвід ТІЛЬКИ через конвекцію/випромінювання</text>
<text x="217.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Немає масивних внутрішніх шарів міді</text>
<text x="217.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">• Завищує розрахований перегрів у 1.5..2.5 раза</text>
<text x="217.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">• Придатна лише для одношарових плат</text>
<rect x="435.0" y="65.0" width="370.0" height="365.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="620.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сучасна модель IPC-2152 (2009)</text>
<text x="620.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Зв'язок із суцільними мідними полігонами</text>
