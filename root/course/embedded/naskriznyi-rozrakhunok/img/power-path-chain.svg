<text x="440.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Силовий тракт живлення (Power Path): послідовне накопичення втрат і захист</text>
