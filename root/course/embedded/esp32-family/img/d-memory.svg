<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мапа пам'яті — справжня «особистість» чипа</text>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">той самий байт видно з різних шин; зовнішнє — крізь кеш</text>
<rect x="60.0" y="96.0" width="150.0" height="300.0" rx="12" fill="#eef1f6" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="135.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро</text>
<text x="135.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">шина</text>
<text x="135.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">команд</text>
<text x="135.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">шина</text>
<text x="135.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">даних</text>
<rect x="250.0" y="96.0" width="300.0" height="300.0" rx="12" fill="#fbfbfb" stroke="#cfcfcf" stroke-width="2.0"/>
<text x="400.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">внутрішня SRAM (на кристалі)</text>
<rect x="272.0" y="140.0" width="256.0" height="70.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="400.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">IRAM — код у RAM</text>
<text x="400.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">гарячі функції, ISR (.iram_attr)</text>
<rect x="272.0" y="224.0" width="256.0" height="70.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="400.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">DRAM — дані в RAM</text>
<text x="400.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">.data / .bss / купа / стеки</text>
<rect x="272.0" y="308.0" width="256.0" height="70.0" rx="8" fill="#f3eede" stroke="#caa24a" stroke-width="1.8"/>
<text x="400.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1e" text-anchor="middle" font-weight="700">кеш (частина SRAM)</text>
<text x="400.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">вікно у зовнішні flash і PSRAM</text>
<rect x="600.0" y="96.0" width="300.0" height="300.0" rx="12" fill="#fcfcfc" stroke="#cfcfcf" stroke-width="2.0"/>
<text x="750.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">зовнішні мікросхеми (по SPI)</text>
<rect x="622.0" y="150.0" width="256.0" height="96.0" rx="8" fill="#eef1f6" stroke="#2457d6" stroke-width="1.8"/>
<text x="750.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">flash: IROM + DROM</text>
<text x="750.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">основний код і константи</text>
<text x="750.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">виконується «на місці» крізь кеш</text>
<rect x="622.0" y="262.0" width="256.0" height="96.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="750.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">PSRAM (опційно)</text>
<text x="750.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">великі буфери: кадри, звук, ML</text>
<text x="750.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">теж крізь кеш — повільніше за SRAM</text>
