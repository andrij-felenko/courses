<rect x="150.0" y="418.0" width="640.0" height="42.0" rx="6" fill="#f4f7fb" stroke="#cfd6e2" stroke-width="1.4"/><text x="470.0" y="435.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Внутрішня SRAM — швидка й мала (сотні КБ). Зовнішнє — велике й дешеве,</tspan><tspan x="470.0" dy="13.4">але кожен промах кешу коштує тактів. Звідси весь тюнінг: що тримати всередині.</tspan></text>
