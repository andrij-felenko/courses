<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Великий зсув: від фірмового Xtensa до відкритого RISC-V</text>
<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">новіші, дешевші члени родини йдуть відкритим шляхом</text>
<rect x="60.0" y="100.0" width="320.0" height="220.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="220.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Xtensa</text>
<text x="220.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP32 · S2 · S3</text>
<text x="220.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• фірмове, ліцензоване ядро</text>
<text x="220.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• перевірене, потужне</text>
<text x="220.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• оригінал і серія S</text>
<line x1="395.0" y1="210.0" x2="505.0" y2="210.0" stroke="#1a1a1a" stroke-width="4.0"/>
<line x1="395.0" y1="210.0" x2="505.0" y2="210.0" stroke="#1a1a1a" stroke-width="4.0" marker-end="url(#arrow)"/>
<text x="450.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">новіші,</tspan><tspan x="450.0" dy="13.7">дешевші</tspan></text>
<rect x="520.0" y="100.0" width="320.0" height="220.0" rx="12" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="680.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">RISC-V</text>
<text x="680.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">C3 · C6 · …</text>
<text x="680.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• відкритий стандарт — без ліцензій</text>
<text x="680.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• дешевше, сучасно, вільно</text>
<text x="680.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• майбутнє лінійки</text>
<rect x="120.0" y="360.0" width="660.0" height="34.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/><text x="450.0" y="381.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">У коді різниця майже невидима — Arduino та ESP-IDF ховають ядро.</tspan></text>
</svg>