<rect x="605.0" y="205.0" width="230.0" height="200.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Газ: CO₂ (вуглекислий газ)</tspan><tspan x="720.0" dy="14.3">Механізм: закон Бера-Ламберта,</tspan><tspan x="720.0" dy="14.3">поглинання фотонів зв'язками C=O.</tspan><tspan x="720.0" dy="14.3">Сигнал: падіння теплового потоку.</tspan><tspan x="720.0" dy="14.3">Плюси: нульова крос-чутливість,</tspan><tspan x="720.0" dy="14.3">не труїться силіконом, 10+ років.</tspan><tspan x="720.0" dy="14.3">Мінуси: дорогий, більші габарити.</tspan></text>
