<text x="160.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Хемосорбований O⁻</text>
<rect x="45.0" y="205.0" width="230.0" height="200.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="160.0" y="269.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Газ: VOC, спирти, CO, H₂</tspan><tspan x="160.0" dy="13.0">Механізм: окиснення газу</tspan><tspan x="160.0" dy="13.0">на гарячій поверхні вивільняє</tspan><tspan x="160.0" dy="13.0">електрони в зону провідності.</tspan><tspan x="160.0" dy="13.0">Сигнал: опір плівки Rs падає.</tspan><tspan x="160.0" dy="13.0">Плюси: дешеві, малі, довгий вік.</tspan><tspan x="160.0" dy="13.0">Мінуси: жеруть струм, неселективні.</tspan></text>
<rect x="310.0" y="40.0" width="260.0" height="380.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
