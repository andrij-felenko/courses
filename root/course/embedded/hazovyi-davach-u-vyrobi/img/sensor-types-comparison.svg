<text x="440.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Рідкий/гелевий електроліт</text>
<rect x="325.0" y="205.0" width="230.0" height="200.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="440.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Газ: CO, O₂, NO₂, H₂S, NH₃</tspan><tspan x="440.0" dy="14.3">Механізм: окисно-відновна</tspan><tspan x="440.0" dy="14.3">реакція на робочому електроді.</tspan><tspan x="440.0" dy="14.3">Сигнал: струм Фарадея I ∝ ppm.</tspan><tspan x="440.0" dy="14.3">Плюси: висока вибірковість,</tspan><tspan x="440.0" dy="14.3">лінійність від 0, мікроампери.</tspan><tspan x="440.0" dy="14.3">Мінуси: сохне електроліт (2–3 р).</tspan></text>
<rect x="590.0" y="40.0" width="260.0" height="380.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<rect x="633.4" y="48.5" width="173.1" height="33.0" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="720.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Оптичний NDIR (CO₂)</tspan></text>
<rect x="605.0" y="95.0" width="230.0" height="100.0" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.0"/>
