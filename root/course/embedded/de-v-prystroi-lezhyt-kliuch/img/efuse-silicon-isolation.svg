<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна eFuse-пам'ять: ізоляція ключа від системної шини CPU</text>
<rect x="30.0" y="50.0" width="260.0" height="330.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="160.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика eFuse / Anti-Fuse</text>
<rect x="50.0" y="95.0" width="220.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="160.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Стан 0: Ціла перемичка</tspan><tspan x="160.0" dy="14.3">Низький опір (R ≈ 50 Ом)</tspan><tspan x="160.0" dy="14.3">Струм вільно тече</tspan></text>
<rect x="50.0" y="175.0" width="220.0" height="70.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="160.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Імпульс випалювання</tspan><tspan x="160.0" dy="14.3">Високий струм / VDDQ 2.5V</tspan><tspan x="160.0" dy="14.3">Електроміграція розриває міст</tspan></text>
<rect x="50.0" y="260.0" width="220.0" height="65.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="160.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="160.0" dy="0.0">Стан 1: Розірваний міст</tspan><tspan x="160.0" dy="14.3">Високий опір (R &gt; 100 кОм)</tspan><tspan x="160.0" dy="14.3">Незворотний стан у кремнії</tspan></text>
<text x="160.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Зміна стану одноразова й вічна</text>
<rect x="320.0" y="50.0" width="510.0" height="330.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="575.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема апаратного доступу та апаратних заборон</text>
<rect x="350.0" y="110.0" width="140.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Масив eFuse</tspan><tspan x="420.0" dy="14.3">Блок 0: MAC / Конфіг</tspan><tspan x="420.0" dy="14.3">Блок 1: Ключ Flash</tspan><tspan x="420.0" dy="14.3">Блок 2: Ключ SecureBoot</tspan><tspan x="420.0" dy="14.3">Блок 3: Ключ HMAC</tspan></text>
<rect x="660.0" y="100.0" width="150.0" height="80.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="735.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Апаратний AES /</tspan><tspan x="735.0" dy="15.6">Flash Decryption</tspan><tspan x="735.0" dy="15.6">Акселератор</tspan></text>
<rect x="660.0" y="230.0" width="150.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="735.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Процесор (CPU)</tspan><tspan x="735.0" dy="15.6">Системна шина</tspan><tspan x="735.0" dy="15.6">AHB / AXI</tspan></text>
<line x1="490.0" y1="140.0" x2="660.0" y2="140.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="505.0" y="115.0" width="140.0" height="24.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="575.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Ключ напряму в залізо</text>
<line x1="490.0" y1="240.0" x2="560.0" y2="240.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,4"/>
<rect x="560.0" y="225.0" width="30.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="575.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<line x1="590.0" y1="240.0" x2="660.0" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="510.0" y="275.0" width="130.0" height="35.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="575.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="575.0" dy="0.0">Read Disable біт</tspan><tspan x="575.0" dy="13.0">CPU читає лише 0x00</tspan></text>
<text x="575.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Ключ працює в шифраторі, але процесор не може його зчитати</text>
</svg>