<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поверхня атак на відкритий Flash і незахищену пам'ять</text>
<rect x="30.0" y="50.0" width="240.0" height="340.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Зовнішній Flash (SPI / QSPI)</text><rect x="50.0" y="95.0" width="200.0" height="50.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="150.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">SOIC-8 / WSON-8</tspan><tspan x="150.0" dy="14.3">Кліпса або перехоплювач</tspan></text><rect x="50.0" y="160.0" width="200.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="150.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Пасивне прослуховування</tspan><tspan x="150.0" dy="14.3">Логічний аналізатор читає</tspan><tspan x="150.0" dy="14.3">ключ під час завантаження</tspan></text><rect x="50.0" y="240.0" width="200.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="150.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Прямий дамп пам'яті</tspan><tspan x="150.0" dy="14.3">Зчитування програматором</tspan><tspan x="150.0" dy="14.3">CH341A або flashrom</tspan></text><rect x="50.0" y="320.0" width="200.0" height="55.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="150.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Висновок: відкриті доріжки</tspan><tspan x="150.0" dy="14.3">не захищають секрети</tspan></text>
<rect x="310.0" y="50.0" width="240.0" height="340.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Внутрішній Flash MCU</text><rect x="330.0" y="95.0" width="200.0" height="50.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="430.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">SWD / JTAG порти</tspan><tspan x="430.0" dy="14.3">Налагоджувальний інтерфейс</tspan></text><rect x="330.0" y="160.0" width="200.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="430.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Обхід Readout Protection</tspan><tspan x="430.0" dy="14.3">Зняття захисту (RDP1)</tspan><tspan x="430.0" dy="14.3">через команди стирання</tspan></text><rect x="330.0" y="240.0" width="200.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="430.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Ін'єкція збоїв (Glitching)</tspan><tspan x="430.0" dy="14.3">Voltage / Clock імпульс</tspan><tspan x="430.0" dy="14.3">скидає перевірку бітів</tspan></text><rect x="330.0" y="320.0" width="200.0" height="55.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/><text x="430.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Висновок: програмні біти</tspan><tspan x="430.0" dy="14.3">вразливі до збоїв живлення</tspan></text>
<rect x="590.0" y="50.0" width="240.0" height="340.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оперативна пам'ять (RAM)</text><rect x="610.0" y="95.0" width="200.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="710.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Розгортання ключа в RAM</tspan><tspan x="710.0" dy="14.3">Для програмної криптографії</tspan></text><rect x="610.0" y="160.0" width="200.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="710.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Атака холодного старту</tspan><tspan x="710.0" dy="14.3">Охолодження чипа азотом</tspan><tspan x="710.0" dy="14.3">і залишкові заряди SRAM</tspan></text><rect x="610.0" y="240.0" width="200.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="710.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Дампи після помилок</tspan><tspan x="710.0" dy="14.3">Витік ключа через стек</tspan><tspan x="710.0" dy="14.3">або залишок у буфері heap</tspan></text><rect x="610.0" y="320.0" width="200.0" height="55.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="710.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Висновок: ключ у RAM</tspan><tspan x="710.0" dy="14.3">легко виявити в дампах</tspan></text>
</svg>