<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізично неклоновані функції (PUF): генерація ключа без зберігання</text>
<rect x="30.0" y="50.0" width="800.0" height="120.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="430.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичне джерело: унікальні нанодефекти виготовлення кремнієвої пластини</text>
<rect x="50.0" y="90.0" width="220.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="160.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Комірка SRAM #0</tspan><tspan x="160.0" dy="13.0">Транзистор A сильніший</tspan><tspan x="160.0" dy="13.0">Старт стабільно в '0'</tspan></text>
<rect x="320.0" y="90.0" width="220.0" height="65.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="430.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Комірка SRAM #1</tspan><tspan x="430.0" dy="13.0">Транзистор B сильніший</tspan><tspan x="430.0" dy="13.0">Старт стабільно в '1'</tspan></text>
<rect x="590.0" y="90.0" width="220.0" height="65.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="700.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="700.0" dy="0.0">Комірка SRAM #N (шумна)</tspan><tspan x="700.0" dy="13.0">Температурний дрейф</tspan><tspan x="700.0" dy="13.0">Старт у '0' або '1' (~1-3%)</tspan></text>
<rect x="30.0" y="190.0" width="385.0" height="210.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="222.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Фаза реєстрації (Enrollment, один раз)</text>
<rect x="50.0" y="235.0" width="345.0" height="45.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/>
<text x="222.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="222.0" dy="0.0">Зняття початкового відбитка PUF (R_0)</tspan><tspan x="222.0" dy="14.3">Генерація криптографічного ключа K</tspan></text>
<line x1="222.0" y1="280.0" x2="222.0" y2="305.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="305.0" width="345.0" height="55.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="222.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="222.0" dy="0.0">Обчислення допоміжних даних (Helper Data W)</tspan><tspan x="222.0" dy="13.0">Код виправлення помилок (BCH / Reed-Muller)</tspan><tspan x="222.0" dy="13.0">W = Syndrome(R_0, K)</tspan></text>
<text x="222.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Helper Data не розкриває ключ і лежить у відкритому Flash</text>
<rect x="445.0" y="190.0" width="385.0" height="210.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="637.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2. Фаза відновлення (Reconstruction, щоразу)</text>
<rect x="465.0" y="235.0" width="345.0" height="45.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="637.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="637.0" dy="0.0">Подача живлення → Зашумлений відбиток R'</tspan><tspan x="637.0" dy="14.3">Читання Helper Data W з Flash пам'яті</tspan></text>
<line x1="637.0" y1="280.0" x2="637.0" y2="305.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="465.0" y="305.0" width="345.0" height="55.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="637.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="637.0" dy="0.0">Корекція помилок алгоритмом декодування:</tspan><tspan x="637.0" dy="13.0">K = Decode(R', W) → Точний ідентичний ключ</tspan><tspan x="637.0" dy="13.0">Ключ живе тільки в регістрах під час роботи</tspan></text>
<text x="637.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">При вимкненні живлення ключ безслідно зникає</text>
</svg>