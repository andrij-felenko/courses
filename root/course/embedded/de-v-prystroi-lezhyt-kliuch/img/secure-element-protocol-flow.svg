<text x="430.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Wake Pulse (SDA low &gt; 60 мкс)</text>
<line x1="670.0" y1="160.0" x2="190.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
