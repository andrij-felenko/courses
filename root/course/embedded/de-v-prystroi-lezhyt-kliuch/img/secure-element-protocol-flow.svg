<text x="430.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Відповідь Ready (0x11)</text>
<line x1="190.0" y1="205.0" x2="670.0" y2="205.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="260.0" y="190.0" width="340.0" height="30.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="430.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">2. Команда Sign: [Len][Op=0x41][Slot=0][Digest 32B][CRC16]</tspan></text>
<rect x="590.0" y="240.0" width="160.0" height="55.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="670.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">3. Обчислення ECDSA</tspan><tspan x="670.0" dy="13.0">Ключ береться зі слота</tspan><tspan x="670.0" dy="13.0">t_EXEC ≈ 60-110 мс</tspan></text>
<line x1="670.0" y1="320.0" x2="190.0" y2="320.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="305.0" width="320.0" height="30.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="430.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">4. Відповідь: [Len=67][Підпис R, S (64 байти)][CRC16]</tspan></text>
<line x1="190.0" y1="365.0" x2="670.0" y2="365.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="320.0" y="352.0" width="220.0" height="26.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="430.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">5. Sleep Token (0x01) → Сон (I &lt; 150 нА)</text>
<text x="430.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Приватний ключ жодного разу не перетинав фізичну шину зв'язку</text>
