<text x="430.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол взаємодії: виконання цифрового підпису без передачі ключа</text>
<rect x="80.0" y="50.0" width="220.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="190.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Головний контролер (MCU)</text>
<line x1="190.0" y1="95.0" x2="190.0" y2="410.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="560.0" y="50.0" width="220.0" height="45.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="670.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Secure Element (ATECC608)</text>
<line x1="670.0" y1="95.0" x2="670.0" y2="240.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="670.0" y1="295.0" x2="670.0" y2="410.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
