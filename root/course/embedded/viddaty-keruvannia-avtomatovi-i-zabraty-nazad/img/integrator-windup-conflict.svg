<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтегральне насичення та конфлікт траєкторій</text>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікт автопілота й пілота: інтегральне насичення та ривок при передачі</text>
<rect x="25.0" y="55.0" width="810.0" height="135.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="430.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a6d1a" text-anchor="middle" font-weight="700">Фізика конфлікту траєкторій (Pilot vs Autopilot Conflict)</text>
<rect x="45.0" y="97.0" width="230.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="160.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Уставка автопілота (Setpt)</text>
<text x="160.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Автопілот веде літак за курсом</text>
<text x="160.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Target: Heading = 090°</text>
<rect x="315.0" y="97.0" width="230.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="430.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Дія пілота (Manual Override)</text>
<text x="430.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Пілот відхиляє ручку вліво</text>
<text x="430.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Actual: Heading = 060°</text>
<rect x="585.0" y="97.0" width="230.0" height="75.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.2"/>
<text x="700.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700">Помилка контуру: e(t) ≠ 0</text>
<text x="700.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">e(t) = Setpoint - Actual = +30°</text>
<text x="700.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Інтегратор накопичує I = Ki · ∫ e dt</text>
<rect x="25.0" y="205.0" width="390.0" height="195.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="220.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">БЕЗ скидання інтегратора (Windup Fault)</text>
<rect x="45.0" y="245.0" width="350.0" height="48.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="220.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">I-term виріс до максимального упору (I_max)</text>
<text x="220.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Регулятор перенасичений вправо на 100%</text>
<rect x="45.0" y="303.0" width="350.0" height="85.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="220.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">АВАРІЙНИЙ НАСЛІДОК ПРИ ПОВЕРНЕННІ В АВТО:</text>
<text x="220.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Миттєвий удар кермами вправо (Control Bump)</text>
<text x="220.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Перевантаження крила, зрив потоку, штопор</text>
<text x="220.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• Трагедія Нагоя 1994: боротьба з тримером</text>
<rect x="445.0" y="205.0" width="390.0" height="195.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="640.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">З Anti-Windup та плавною синхронізацією</text>
<rect x="465.0" y="245.0" width="350.0" height="48.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="640.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">I-term заморожується або експоненційно згасає</text>
<text x="640.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">dI/dt = 0 під час ручного втручання оператора</text>
<rect x="465.0" y="303.0" width="350.0" height="85.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="640.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">БЕЗПЕЧНА ПОВЕДІНКА ПРИ ПЕРЕДАЧІ:</text>
<text x="640.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Setpoint підтягується до фактичного курсу</text>
<text x="640.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Плавне наростання авторитету без ривка (Bumpless)</text>
<text x="640.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• Стабільне утримання нової траєкторії</text>
<rect x="25.0" y="408.0" width="810.0" height="24.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Під час перехоплення інтегратор не повинен накопичувати помилку, спричинену діями пілота</text>
</svg>