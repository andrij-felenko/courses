<text x="220.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">CH5: Pos 1 (Auto) → Pos 2/3 (Manual)</text>
