<text x="220.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Апаратний тумблер (Mode Switch)</text>
<text x="220.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Дискретне перемикання через окремий RC-канал</text>
<rect x="45.0" y="120.0" width="350.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
