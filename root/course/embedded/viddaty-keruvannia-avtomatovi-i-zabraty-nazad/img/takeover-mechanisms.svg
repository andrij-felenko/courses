<rect x="45.0" y="270.0" width="350.0" height="105.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="220.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Властивості тумблерного перехоплення:</text>
<text x="55.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">✓ 100% явний намір оператора</text>
<text x="55.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">✓ Повне апаратне відключення автоматики</text>
<text x="55.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">✗ Затримка реакції людини: 0.8…1.5 с на пошук</text>
