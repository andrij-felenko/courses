<text x="220.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Декодер RC-сигналу та фільтр антибрязкоту</text>
<text x="220.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Гістерезис PWM 1000…2000 мкс (Δ &gt; 50 мкс)</text>
