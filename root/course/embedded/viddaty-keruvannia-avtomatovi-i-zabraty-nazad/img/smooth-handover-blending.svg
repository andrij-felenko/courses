<line x1="730.0" y1="105.0" x2="780.0" y2="105.0" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="270.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">T_blend</text>
<text x="590.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">T_hold</text>
<text x="690.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">T_blend</text>
<line x1="110.0" y1="275.0" x2="145.0" y2="275.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="152.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Вага оператора α(t)</text>
<line x1="310.0" y1="275.0" x2="345.0" y2="275.0" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="352.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">Вага автопілота 1 − α(t)</text>
<rect x="25.0" y="300.0" width="810.0" height="125.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="430.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математична модель змішування: u(t) = (1 − α(t)) · u_auto(t) + α(t) · u_pilot(t)</text>
<rect x="45.0" y="338.0" width="235.0" height="75.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.2"/>
<text x="162.5" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1. Початок перехоплення</text>
<text x="162.5" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Стіки &gt; 12% порогу → α плавно зростає від 0 до 1</text>
<text x="162.5" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">за 200 мс. Повна відсутність стрибка моменту на</text>
<text x="162.5" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">сервоприводах.</text>
<rect x="312.0" y="338.0" width="235.0" height="75.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.2"/>
<text x="429.5" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">2. Утримання центру</text>
<text x="429.5" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Стіки повернулися в мертву зону. Запускається та</text>
<text x="429.5" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">ймер T_hold (1.0…2.0 с) для запобігання хибному</text>
<text x="429.5" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">поверненню в авто.</text>
<rect x="580.0" y="338.0" width="235.0" height="75.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="697.5" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">3. Плавне повернення</text>
<text x="697.5" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Таймер вичерпано → α плавно спадає від 1 до 0 за</text>
<text x="697.5" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">400 мс. Автопілот захоплює оновлену лінію шляху</text>
<text x="697.5" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">без клевка.</text>
</svg>