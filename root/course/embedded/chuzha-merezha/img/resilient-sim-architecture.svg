<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура надійності: Multi-IMSI / eUICC та авто-відновлення</text>
<rect x="20.0" y="65.0" width="380.0" height="405.0" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.5"/>
<text x="210.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна частина: SIM / eUICC</text>
<text x="210.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сховище незалежних профілів операторів</text>
<rect x="40.0" y="135.0" width="340.0" height="75.0" rx="4" fill="#efe6f4" stroke="#7d3c98" stroke-width="1.5"/>
<text x="55.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="start" font-weight="700">Bootstrap Profile (Аварійний профіль)</text>
<text x="55.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Глобальний роумінг (100+ країн). Служить лише для</text>
<text x="55.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">відновлення зв'язку та завантаження RSP профілів</text>
<rect x="40.0" y="220.0" width="340.0" height="70.0" rx="4" fill="#e4f4ea" stroke="#27ae60" stroke-width="1.5"/>
<text x="55.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Operational Profile #1 (Основний оператор)</text>
<text x="55.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Локальний контракт, низький тариф, пріоритетна смуга</text>
<text x="55.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">АКТИВНИЙ СТАН (Активний IMSI)</text>
<rect x="40.0" y="300.0" width="340.0" height="70.0" rx="4" fill="#e6ecfb" stroke="#2457d6" stroke-width="1.2"/>
<text x="55.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Operational Profile #2 (Резервний оператор)</text>
<text x="55.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Альтернативна національна мережа</text>
<text x="55.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">РЕЗЕРВ (Standby)</text>
<rect x="40.0" y="380.0" width="340.0" height="75.0" rx="4" fill="#fbeee6" stroke="#d35400" stroke-width="1.2"/>
<text x="55.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="start" font-weight="700">Multi-IMSI Applet / eUICC OS (SGP.32)</text>
<text x="55.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Автоматичне перемикання при втраті мережі &gt; 3 год</text>
<text x="55.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">або за спеціальною AT-командою мікроконтролера</text>
<rect x="420.0" y="65.0" width="400.0" height="405.0" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.5"/>
<text x="620.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Алгоритм захисту від Blacklist-блокувань</text>
<text x="620.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Як прошивка рятує модем від вічного офлайну</text>
<rect x="435.0" y="135.0" width="370.0" height="54.0" rx="4" fill="#fbe7e4" stroke="#c0392b" stroke-width="1.2"/>
<text x="445.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">1. Помилка реєстрації</text>
<text x="445.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">CREG / CEREG повертає 3 (Denied) або Cause #11/#15</text>
<line x1="620.0" y1="189.0" x2="620.0" y2="197.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="435.0" y="196.0" width="370.0" height="54.0" rx="4" fill="#fbeee6" stroke="#d35400" stroke-width="1.2"/>
<text x="445.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="start" font-weight="700">2. Експоненційний відступ</text>
<text x="445.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Сон 1 хв → 5 хв → 30 хв (захист батареї від скану)</text>
<line x1="620.0" y1="250.0" x2="620.0" y2="258.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="435.0" y="257.0" width="370.0" height="54.0" rx="4" fill="#e6ecfb" stroke="#2457d6" stroke-width="1.2"/>
<text x="445.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">3. Скидання чорного списку</text>
<text x="445.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">AT+CFUN=0 → AT+CFUN=1 (очищення кешу PLMN у модемі)</text>
<line x1="620.0" y1="311.0" x2="620.0" y2="319.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="435.0" y="318.0" width="370.0" height="54.0" rx="4" fill="#efe6f4" stroke="#7d3c98" stroke-width="1.2"/>
<text x="445.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="start" font-weight="700">4. Примусовий вибір PLMN</text>
<text x="445.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">AT+COPS=1,2,... (спроба зв'язку з іншою базовою станцією)</text>
<line x1="620.0" y1="372.0" x2="620.0" y2="380.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="435.0" y="379.0" width="370.0" height="54.0" rx="4" fill="#e4f4ea" stroke="#27ae60" stroke-width="1.2"/>
<text x="445.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">5. Аварійне перемикання SIM</text>
<text x="445.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Команда аплету перемкнути IMSI на резервний профіль</text>
</svg>