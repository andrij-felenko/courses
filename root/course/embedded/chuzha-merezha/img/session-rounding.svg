<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія витрат трафіку: корисні байти проти білінгу</text>
<rect x="55.0" y="75.0" width="130.0" height="330.0" rx="6" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.5"/>
<text x="120.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Давач</text>
<text x="120.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Корисне навантаження</text>
<rect x="75.0" y="300.0" width="90.0" height="45.0" rx="4" fill="#e4f4ea" stroke="#27ae60" stroke-width="1.5"/>
<text x="120.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">50 байтів</text>
<text x="120.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Температура, тиск,</text>
<text x="120.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">заряд батареї</text>
<line x1="195.0" y1="235.0" x2="245.0" y2="235.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250.0" y="75.0" width="170.0" height="330.0" rx="6" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.5"/>
<text x="335.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Протоколи</text>
<text x="335.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Реальний ефірний трафік</text>
<rect x="265.0" y="145.0" width="140.0" height="80.0" rx="3" fill="#efe6f4" stroke="#7d3c98" stroke-width="1.2"/>
<text x="335.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="middle" font-weight="700">TLS Handshake</text>
<text x="335.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d3c98" text-anchor="middle">Сертифікати X.509 (~2.5 КБ)</text>
<rect x="265.0" y="230.0" width="140.0" height="40.0" rx="3" fill="#e6ecfb" stroke="#2457d6" stroke-width="1.2"/>
<text x="335.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">TCP 3-Way Handshake</text>
<text x="335.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">SYN, SYN-ACK, ACK (180 Б)</text>
<rect x="265.0" y="275.0" width="140.0" height="35.0" rx="3" fill="#fbeee6" stroke="#d35400" stroke-width="1.2"/>
<text x="335.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">IP + TCP + TLS Headers</text>
<text x="335.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d35400" text-anchor="middle">Заголовки пакетів (85 Б)</text>
<rect x="265.0" y="315.0" width="140.0" height="28.0" rx="3" fill="#e4f4ea" stroke="#27ae60" stroke-width="1.5"/>
<text x="335.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Дані: 50 байтів</text>
<text x="335.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Разом у ефірі:</text>
<text x="335.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">≈ 2.8 КБайт</text>
<line x1="430.0" y1="235.0" x2="480.0" y2="235.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500.0" y="75.0" width="270.0" height="330.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="635.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. Білінг оператора</text>
<text x="635.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Округлення PDP-сесії (Session Rounding)</text>
<rect x="520.0" y="145.0" width="230.0" height="205.0" rx="4" fill="#fbe7e4" stroke="#c0392b" stroke-width="1.5"/>
<text x="635.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Округлення сесії до 100 КБ</text>
<text x="635.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Якщо модем розриває PDP-контекст</text>
<text x="635.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">після кожної передачі телеметрії,</text>
<text x="635.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">оператор списує 100 КБ за 50 байт!</text>
<line x1="540.0" y1="252.0" x2="730.0" y2="252.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="635.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">24 відправки/добу = 2.4 МБ/добу</text>
<text x="635.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">За місяць: 72 МБ замість 2.1 МБ</text>
<text x="635.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Перевищення ліміту ×34 рази</text>
<text x="420.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило: Утримувати відкриту IP-сесію, використовувати TLS Session Resumption або CoAP/UDP.</text>
</svg>