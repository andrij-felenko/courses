<text x="35.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Результат: 35% часу модем не спить. Батарея 2000 мАг сідає за 2-3 тижні замість 5 років.</text>
