<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів RRC та природа гігантського джитеру RTT</text>
<rect x="45.0" y="85.0" width="220.0" height="85.0" rx="6" fill="#e4f4ea" stroke="#27ae60" stroke-width="1.5"/>
<text x="155.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">RRC IDLE / PSM / eDRX</text>
<text x="155.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Модем спить (струм &lt; 10 мкА)</text>
<text x="155.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Радіоканал відсутній</text>
<line x1="155.0" y1="170.0" x2="155.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="163.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Виникли дані (TX)</text>
<rect x="45.0" y="230.0" width="220.0" height="85.0" rx="6" fill="#fbeee6" stroke="#d35400" stroke-width="1.5"/>
<text x="155.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">PRACH Random Access</text>
<text x="155.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Синхронізація з базовою станцією,</text>
<text x="155.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">виділення слотів (1.5 - 6 с)</text>
<line x1="155.0" y1="315.0" x2="155.0" y2="365.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="45.0" y="365.0" width="220.0" height="85.0" rx="6" fill="#e6ecfb" stroke="#2457d6" stroke-width="1.5"/>
<text x="155.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">RRC CONNECTED</text>
<text x="155.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Передача даних (100-250 мА)</text>
<text x="155.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">RTT відгуку: 40 - 80 мс</text>
<line x1="265.0" y1="407.0" x2="265.0" y2="127.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="273.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Inactivity Timer (10-20 с)</text>
<rect x="345.0" y="75.0" width="460.0" height="385.0" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.5"/>
<text x="575.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діапазон RTT в стільникових мережах (LTE-M / NB-IoT)</text>
<rect x="360.0" y="135.0" width="430.0" height="52.0" rx="4" fill="#e4f4ea" stroke="#27ae60" stroke-width="1.0"/>
<text x="370.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Гарячий канал (RRC Connected)</text>
<text x="760.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">40 – 90 мс</text>
<text x="370.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Модем уже синхронізований, дані йдуть миттєво</text>
<rect x="360.0" y="193.0" width="430.0" height="52.0" rx="4" fill="#efe6f4" stroke="#7d3c98" stroke-width="1.0"/>
<text x="370.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Пробудження з eDRX (DRX = 5.12 с)</text>
<text x="760.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="end" font-weight="700">800 – 2500 мс</text>
<text x="370.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Очікування вікна пейджингу + PRACH</text>
<rect x="360.0" y="251.0" width="430.0" height="52.0" rx="4" fill="#fbeee6" stroke="#d35400" stroke-width="1.0"/>
<text x="370.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Холодний старт із PSM / глибокого сну</text>
<text x="760.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="end" font-weight="700">3.0 – 8.0 с</text>
<text x="370.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Повний цикл встановлення RRC з'єднання</text>
<rect x="360.0" y="309.0" width="430.0" height="52.0" rx="4" fill="#fbe7e4" stroke="#c0392b" stroke-width="1.0"/>
<text x="370.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Слабкий сигнал (HARQ / RLC повтори)</text>
<text x="760.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">1.5 – 5.0 с</text>
<text x="370.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Радіоканал втрачає блоки; прозорі ретрансмісії</text>
<rect x="360.0" y="367.0" width="430.0" height="52.0" rx="4" fill="#fbe7e4" stroke="#c0392b" stroke-width="1.0"/>
<text x="370.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">5. Перевантаження стільника (QCI 9)</text>
<text x="760.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">5.0 – 15+ с</text>
<text x="370.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">IoT-трафік витісняється голосовим і відео</text>
<text x="575.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідок: Синхронні RPC-протоколи з короткими таймаутами непридатні!</text>
</svg>