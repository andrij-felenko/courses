<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння стратегій версіонування IoT API: URL Path, Headers та Payload Schema</text>
<rect x="40.0" y="20.0" width="270.0" height="440.0" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="40.0" y="20.0" width="270.0" height="68.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.5"/>
<text x="175.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Версія в URL (URI Path)</text>
<text x="175.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-style="italic">/v1/devices/42/telemetry</text>
<rect x="335.0" y="20.0" width="270.0" height="440.0" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="335.0" y="20.0" width="270.0" height="68.0" rx="8" fill="#fdf0e6" stroke="#c07a2e" stroke-width="1.5"/>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c07a2e" text-anchor="middle" font-weight="700">2. Версія в заголовках (Headers)</text>
<text x="470.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-style="italic">X-API-Version: 2026-03-01</text>
<rect x="630.0" y="20.0" width="270.0" height="440.0" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="630.0" y="20.0" width="270.0" height="68.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="765.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Версія в схемі (Payload Schema)</text>
<text x="765.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-style="italic">{&quot;schema_v&quot;: 2, &quot;readings&quot;: ...}</text>
<rect x="55.0" y="105.0" width="240.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="175.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм:</text>
<text x="175.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Версія зашита прямо в шлях URL.</text>
<text x="175.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">L7-проксі (Nginx/Envoy) легко</text>
<text x="175.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">роутить запит на v1 або v2 пул.</text>
<rect x="55.0" y="215.0" width="240.0" height="115.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<text x="175.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Переваги:</text>
<text x="175.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Максимальна прозорість у логах</text>
<text x="175.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Просте кешування (унікальний URL)</text>
<text x="175.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Без парсингу тіла чи заголовків</text>
<text x="175.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Ідеально для Breaking Changes</text>
<rect x="55.0" y="345.0" width="240.0" height="100.0" rx="6" fill="#fbebee" stroke="#c0392b" stroke-width="1.0"/>
<text x="175.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Недоліки:</text>
<text x="175.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Зміна версії ламає весь префікс</text>
<text x="175.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Дублювання спільних ендпоінтів</text>
<text x="175.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Не підходить для точкових полів</text>
<rect x="350.0" y="105.0" width="240.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="470.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм:</text>
<text x="470.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Версія передається в заголовку</text>
<text x="470.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c07a2e" text-anchor="middle">X-API-Version або Accept Header</text>
<text x="470.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Content Negotiation vnd.iot.v2+json).</text>
<rect x="350.0" y="215.0" width="240.0" height="115.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<text x="470.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Переваги:</text>
<text x="470.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Чистий, постійний ресурсний URL</text>
<text x="470.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Гранулярні версії за датами</text>
<text x="470.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Зручно для еволюції моделей</text>
<text x="470.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Стандарт REST (Content-Type)</text>
<rect x="350.0" y="345.0" width="240.0" height="100.0" rx="6" fill="#fbebee" stroke="#c0392b" stroke-width="1.0"/>
<text x="470.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Недоліки:</text>
<text x="470.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Складніше кешування (Vary Header)</text>
<text x="470.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Вимагає L7 розбору заголовків</text>
<text x="470.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• МК-клієнти часто мають сирі HTTP</text>
<rect x="645.0" y="105.0" width="240.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="765.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм:</text>
<text x="765.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Версія вкладена в тіло пакета</text>
<text x="765.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">чи тег бінарного формату (Protobuf,</text>
<text x="765.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">CBOR, JSON). Парсер обирає схему.</text>
<rect x="645.0" y="215.0" width="240.0" height="115.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<text x="765.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Переваги:</text>
<text x="765.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Працює в MQTT, CoAP, LoRaWAN</text>
<text x="765.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Не залежить від протоколу зв'язку</text>
<text x="765.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Брокеру не потрібен розбір тем</text>
<text x="765.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Сумісність зі Schema Registry</text>
<rect x="645.0" y="345.0" width="240.0" height="100.0" rx="6" fill="#fbebee" stroke="#c0392b" stroke-width="1.0"/>
<text x="765.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Недоліки:</text>
<text x="765.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Оверхед на десеріалізацію в роутері</text>
<text x="765.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• L7 проксі не бачить версію на льоту</text>
<text x="765.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Неможливий швидкий дроп побитого</text>
</svg>