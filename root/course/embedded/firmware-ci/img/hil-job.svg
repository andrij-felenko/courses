<text x="642.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">чіп ожив → крок 3</text>
<line x1="514.0" y1="210.0" x2="558.0" y2="214.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="558.0" y="268.0" width="168.0" height="78.0" rx="9" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="642.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">✗ тиша по UART</text>
<text x="642.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">чіп-цеглинка →</text>
<text x="642.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">КАРАНТИН стенда:</text>
<text x="642.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">не пускати далі</text>
<line x1="514.0" y1="236.0" x2="558.0" y2="300.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="450.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кожен етап може завернути коміт; мовчання чипа не «падіння тесту», а зупинка стенда до огляду</text>
