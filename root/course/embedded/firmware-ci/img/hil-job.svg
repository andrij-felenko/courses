<rect x="214.0" y="96.0" width="300.0" height="62.0" rx="9" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="364.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1 · залити .elf у живий чіп</text>
<text x="364.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">прошивальник пише Flash по SWD</text>
