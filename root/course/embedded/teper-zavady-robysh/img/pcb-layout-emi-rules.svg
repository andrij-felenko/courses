<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові топологічні правила мінімізації EMI на PCB</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">суцільний шар землі, мінімальні контури повернення струму та послідовне демпфування швидких ліній</text>
<rect x="45.0" y="80.0" width="265.0" height="390.0" rx="8" fill="#fcfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="177.5" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. СУЦІЛЬНА ЗЕМЛЯ</text>
<text x="177.5" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">без щілин під швидкими лініями</text>
<rect x="65.0" y="155.0" width="225.0" height="85.0" rx="4" fill="#f6ecd6" stroke="#b9770e" stroke-width="1.5"/>
<text x="177.5" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">Суцільний Ground Plane</text>
<line x1="80.0" y1="210.0" x2="275.0" y2="210.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="177.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Сигнал (прямий струм)</text>
<line x1="80.0" y1="225.0" x2="275.0" y2="225.0" stroke="#b9770e" stroke-width="2.5" stroke-dasharray="3,3"/>
<text x="177.5" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle">Зворотний струм прямо під ним</text>
<text x="177.5" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому це працює:</text>
<text x="65.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• На високій частоті струм тече</text>
<text x="65.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  шляхом найменшої індуктивності</text>
<text x="65.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Площа петлі A → 0</text>
<text x="65.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">• Щілина в землі змушує струм</text>
<text x="65.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">  робити гак → створює рамку EMI!</text>
<rect x="60.0" y="400.0" width="235.0" height="50.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.2"/>
<text x="177.5" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Правило:</text>
<text x="177.5" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Жодних розрізів під сигналами</text>
<rect x="335.0" y="80.0" width="265.0" height="390.0" rx="8" fill="#fcfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="467.5" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. КОМПАКТНА ПЕТЛЯ</text>
<text x="467.5" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вхідний конденсатор впритул до МС</text>
<rect x="360.0" y="155.0" width="85.0" height="80.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="402.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">DC-DC</text>
<text x="402.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">чіп</text>
<rect x="475.0" y="165.0" width="45.0" height="60.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="497.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">C_in</text>
<line x1="445.0" y1="175.0" x2="475.0" y2="175.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="445.0" y1="215.0" x2="475.0" y2="215.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="467.5" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому це працює:</text>
<text x="355.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Керамічний Cin на тому ж шарі</text>
<text x="355.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Прямий контакт без перехідних</text>
<text x="355.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Мінімізує індуктивність L_loop</text>
<text x="355.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Прибирає дзвін на ключах</text>
<text x="355.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Знижує випромінювання на 15 дБ</text>
<rect x="350.0" y="400.0" width="235.0" height="50.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.2"/>
<text x="467.5" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Правило:</text>
<text x="467.5" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Cin за 1–2 мм від виводів чіпа</text>
<rect x="625.0" y="80.0" width="265.0" height="390.0" rx="8" fill="#fcfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="757.5" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. ДЕМПФУВАННЯ ЛІНІЙ</text>
<text x="757.5" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">послідовні резистори 22–47 Ом</text>
<rect x="645.0" y="165.0" width="55.0" height="60.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="672.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">MCU</text>
<rect x="720.0" y="185.0" width="45.0" height="22.0" rx="3" fill="#f6ecd6" stroke="#b9770e" stroke-width="1.5"/>
<text x="742.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">22–33Ω</text>
<line x1="700.0" y1="196.0" x2="720.0" y2="196.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="765.0" y1="196.0" x2="825.0" y2="196.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="825.0" y="165.0" width="45.0" height="60.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="847.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">IC</text>
<text x="757.5" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому це працює:</text>
<text x="645.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Збільшує час наростання t_r</text>
<text x="645.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Зсуває f_knee вліво по осі f</text>
<text x="645.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Пригнічує високочастотний дзвін</text>
<text x="645.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Узгоджує вихід із лінією 50 Ом</text>
<text x="645.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• Не впливає на логіку 10–50 МГц</text>
<rect x="640.0" y="400.0" width="235.0" height="50.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.2"/>
<text x="757.5" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Правило:</text>
<text x="757.5" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">R_series біля піна передавача</text>
</svg>