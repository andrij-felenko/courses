<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія випромінювання DC-DC: де ховаються dv/dt та di/dt</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">два окремі джерела: комутаційний полігон випромінює електричне поле, а вхідна петля перемикання — магнітне</text>
