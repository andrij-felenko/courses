<text x="240.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Гаряча петля Cin-Q1-Q2 (di/dt)</text>
<text x="240.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Розривний струм → петля як магнітна антена → стискати площу до нуля</text>
<text x="660.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Комутаційний полігон SW (dv/dt)</text>
<text x="660.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Стрибки напруги → ємнісна антена → мінімізувати площу міді SW-полігону</text>
