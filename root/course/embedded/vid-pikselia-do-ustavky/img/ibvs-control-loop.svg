<rect x="35.0" y="390.0" width="870.0" height="75.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="470.0" y="417.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Замкнений контур IBVS (Image-Based Visual Servoing):</tspan><tspan x="470.0" dy="14.3">Помилка формується безпосередньо у площині зображення. Детектор вносить транспортну затримку,</tspan><tspan x="470.0" dy="14.3">фільтр Калмана екстраполює стан цілі на поточний момент часу, а ПІД-регулятор формує уставки кутових швидкостей.</tspan></text>
