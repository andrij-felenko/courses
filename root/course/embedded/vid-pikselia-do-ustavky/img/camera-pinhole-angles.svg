<text x="462.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">v (пікселі)</text>
<circle cx="470.0" cy="130.0" r="4.0" fill="#27ae60" stroke="#333333" stroke-width="1.0"/>
<text x="465.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">(0, 0)</text>
