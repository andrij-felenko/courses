<text x="537.0" y="185.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">P(u, v) центр bounding box</text>
<line x1="560.0" y1="260.0" x2="525.0" y2="260.0" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="3,3"/>
