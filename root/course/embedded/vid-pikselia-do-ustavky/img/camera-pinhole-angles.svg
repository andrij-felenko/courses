<svg xmlns="http://www.w3.org/2000/svg" viewBox="-13.48 -10 1060.48 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-13.48" y="-10" width="1060.48" height="530" fill="#ffffff"/>
