<line x1="180.0" y1="410.0" x2="480.0" y2="410.0" stroke="#333333" stroke-width="1.5"/>
<line x1="180.0" y1="400.0" x2="180.0" y2="420.0" stroke="#333333" stroke-width="1.5"/>
<line x1="480.0" y1="400.0" x2="480.0" y2="420.0" stroke="#333333" stroke-width="1.5"/>
<text x="330.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">f (фокусна відстань у метрах / пікселях fx)</text>
<text x="260.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">α_x, α_y</text>
<line x1="180.0" y1="260.0" x2="480.0" y2="193.3" stroke="#c0392b" stroke-width="1.8"/>
<rect x="790.0" y="95.0" width="40.0" height="50.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="810.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#333333" stroke-width="1.2"/>
<text x="810.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Ціль у просторі (X, Y, Z)</text>
<rect x="480.0" y="390.0" width="420.0" height="95.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="690.0" y="418.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Розрахунок кутових похибок:</tspan><tspan x="690.0" dy="15.6">• x_n = (u − cx) / fx,   y_n = (v − cy) / fy</tspan><tspan x="690.0" dy="15.6">• Азимут: α_x = arctan(x_n) ≈ Δu / fx  (yaw)</tspan><tspan x="690.0" dy="15.6">• Тангаж: α_y = arctan(y_n) ≈ Δv / fy  (pitch)</tspan></text>
</svg>