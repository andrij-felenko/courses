<circle cx="180.0" cy="260.0" r="6.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
<text x="165.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">Oc (оптичний центр камери)</text>
<rect x="470.0" y="130.0" width="180.0" height="260.0" rx="4" fill="#f8fafc" stroke="#2457d6" stroke-width="2.0"/>
