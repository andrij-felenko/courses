<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="470.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типи доступу до регістрів та поведінка бітів при зверненні</text>
<rect x="25.0" y="60.0" width="380.0" height="190.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="25.0" y="60.0" width="380.0" height="30.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">R/W (Read / Write) — Конфігурація</text>
<text x="37.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запис: зберігає значення у внутрішньому тригері.</text>
<text x="37.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Читання: повертає раніше записане значення.</text>
<text x="37.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Безпечний патерн: Read-Modify-Write (RMW).</text>
<text x="37.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Приклад: вибір діапазону FSR, частоти ODR, осей.</text>
<rect x="33.0" y="205.0" width="364.0" height="40.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.0"/>
<text x="215.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">Пастка: не затирати біти сусідніх конфігурацій сліпим записом!</text>
<rect x="435.0" y="60.0" width="380.0" height="190.0" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<rect x="435.0" y="60.0" width="380.0" height="30.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="625.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">RO (Read Only) — Дані сенсора</text>
<text x="447.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запис: ігнорується кремнієм або викликає Bus Error.</text>
<text x="447.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Читання: повертає поточний вимір АЦП або лічильник.</text>
<text x="447.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Особливість: значення оновлюється незалежно від MCU.</text>
<text x="447.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Приклад: OUT_X_L, OUT_X_H, STATUS, WHO_AM_I.</text>
<rect x="443.0" y="205.0" width="364.0" height="40.0" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.0"/>
<text x="625.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">Пастка: без блокування (BDU) байти X_L і X_H роз'їжджаються.</text>
<rect x="25.0" y="270.0" width="380.0" height="195.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<rect x="25.0" y="270.0" width="380.0" height="30.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="215.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">W1C (Write 1 to Clear) — Прапорці</text>
<text x="37.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запис '1': скидає прапорець переривання в 0.</text>
<text x="37.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запис '0': залишає стан прапорця без змін.</text>
<text x="37.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Читання: показує поточний активний статус.</text>
<text x="37.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Правильний запис: write_reg(STATUS, FLAG_BIT);</text>
<rect x="33.0" y="415.0" width="364.0" height="40.0" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.0"/>
<text x="215.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Критична пастка: reg &amp;= ~FLAG стирає інші активні події!</text>
<rect x="435.0" y="270.0" width="380.0" height="195.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<rect x="435.0" y="270.0" width="380.0" height="30.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="625.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">COR (Clear on Read) — Автоскидання</text>
<text x="447.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Читання: апаратно скидає прапорець у момент транзакції.</text>
<text x="447.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запис: зазвичай не має сенсу або заборонений.</text>
<text x="447.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Небезпека: одне читання знищує факт події.</text>
<text x="447.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Приклад: лічильники помилок, FIFO Watermark.</text>
<rect x="443.0" y="415.0" width="364.0" height="40.0" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.0"/>
<text x="625.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Пастка: вікно Watch у дебагері вичитує регістр і «краде» подію.</text>
</svg>