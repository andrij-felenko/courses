<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="480.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формат транзакцій передачі та читання даних (I2C vs SPI)</text>
<text x="30.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="700">1. Протокол I2C: 7-бітна адреса пристрою + суб-адреса з бітом автоінкременту</text>
<rect x="30.0" y="80.0" width="40.0" height="38.0" rx="4" fill="#fde047" stroke="#ca8a04" stroke-width="1.2"/>
<text x="50.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">START</text>
<text x="50.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">S</text>
<rect x="75.0" y="80.0" width="120.0" height="38.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="135.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Device Addr [7:1]</text>
<text x="135.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">7 біт адреси чипа</text>
<rect x="200.0" y="80.0" width="35.0" height="38.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="217.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">W</text>
<text x="217.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 (W)</text>
<rect x="240.0" y="80.0" width="35.0" height="38.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="257.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACK</text>
<text x="257.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 від чипа</text>
<rect x="280.0" y="80.0" width="160.0" height="38.0" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
<text x="360.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Reg Addr | AutoInc</text>
<text x="360.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Біт 7 = 1 (автоінкремент)</text>
<rect x="445.0" y="80.0" width="35.0" height="38.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="462.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACK</text>
<text x="462.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 від чипа</text>
<rect x="485.0" y="80.0" width="40.0" height="38.0" rx="4" fill="#fde047" stroke="#ca8a04" stroke-width="1.2"/>
<text x="505.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">RESTART</text>
<text x="505.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Sr</text>
<rect x="530.0" y="80.0" width="120.0" height="38.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="590.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Device Addr [7:1]</text>
<text x="590.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">7 біт адреси чипа</text>
<rect x="655.0" y="80.0" width="35.0" height="38.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="672.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">R</text>
<text x="672.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 (R)</text>
<rect x="695.0" y="80.0" width="35.0" height="38.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="712.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACK</text>
<text x="712.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 від чипа</text>
<rect x="735.0" y="80.0" width="75.0" height="38.0" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
<text x="772.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Data L / H...</text>
<text x="772.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Burst потік</text>
<text x="30.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#059669" text-anchor="start" font-weight="700">2. Протокол SPI: повнодуплексний обмін з активним рівнем CS = LOW</text>
<rect x="30.0" y="185.0" width="110.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="85.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">CS (NSS)</text>
<rect x="150.0" y="185.0" width="660.0" height="32.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="165.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Активний низький рівень на весь час транзакції</text>
<rect x="30.0" y="230.0" width="110.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="85.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SCK</text>
<rect x="150.0" y="230.0" width="660.0" height="32.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="165.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Тактовий сигнал: режим CPOL=1/CPHA=1 або CPOL=0/CPHA=0</text>
<rect x="30.0" y="275.0" width="110.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="85.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">MOSI (SDI)</text>
<rect x="150.0" y="275.0" width="660.0" height="32.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="165.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Командний байт: [R/W bit] | [AutoInc bit] | [Reg Addr 6:0]</text>
<rect x="30.0" y="320.0" width="110.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="85.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">MISO (SDO)</text>
<rect x="150.0" y="320.0" width="660.0" height="32.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="165.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вихід даних: Dummy byte під час адреси → Data Byte 0 → Data Byte 1...</text>
<rect x="30.0" y="375.0" width="780.0" height="95.0" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
<text x="420.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">Ключові правила читання діаграм у даташиті:</text>
<text x="45.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Перевіряйте, як даташит вказує I2C адресу: 7 біт (0x68) чи готовий 8-бітний байт запису (0xD0).</text>
<text x="45.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Для пакетного читання (Burst Read) дізнайтеся формат біта автоінкременту (MSB=1 у ST чи окремий прапорець).</text>
<text x="45.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Звірте полярність та фазу SPI (CPOL, CPHA): неправильний режим зсуває всі біти рівно на 1 такт!</text>
</svg>