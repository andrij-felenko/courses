<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Силова комутація: від газової лампи до кремнію</text>
<line x1="70.0" y1="250.0" x2="830.0" y2="250.0" stroke="#6b7280" stroke-width="2.4"/>
<line x1="70.0" y1="244.0" x2="70.0" y2="256.0" stroke="#6b7280" stroke-width="2.4"/>
<line x1="830.0" y1="244.0" x2="830.0" y2="256.0" stroke="#6b7280" stroke-width="2.4"/>
<rect x="70.0" y="246.0" width="360.0" height="8.0" rx="0" fill="#f8efd6" stroke="#b8860b" stroke-width="1.0"/>
<rect x="470.0" y="246.0" width="360.0" height="8.0" rx="0" fill="#e9eefb" stroke="#2457d6" stroke-width="1.0"/>
<text x="250.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">ера газових ламп (скло, розжарений катод, ртуть)</text>
<text x="650.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ера кремнію (твердотільні ключі)</text>
<circle cx="140.0" cy="250.0" r="6.0" fill="#b8860b" stroke="#b8860b" stroke-width="1.0"/>
<line x1="140.0" y1="244.0" x2="140.0" y2="238.0" stroke="#b8860b" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="140.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">~1914</text>
<text x="140.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Ленгмюр і Мікл (GE):</text>
<text x="140.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кероване випрямлення</text>
<text x="140.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">в газовій лампі</text>
<circle cx="300.0" cy="250.0" r="6.0" fill="#b8860b" stroke="#b8860b" stroke-width="1.0"/>
<line x1="300.0" y1="256.0" x2="300.0" y2="270.0" stroke="#b8860b" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="300.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">~1928</text>
<text x="300.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">тиратрон Голла (GE):</text>
<text x="300.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">сітка вмикає дугу —</text>
<text x="300.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">перший кер. ключ</text>
<circle cx="430.0" cy="250.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<line x1="430.0" y1="244.0" x2="430.0" y2="238.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="430.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">1956</text>
<text x="430.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Bell Labs: PNPN-</text>
<text x="430.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">перемикач (Молл,</text>
<text x="430.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Танненбаум, Голді,</text>
<text x="430.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Голоняк)</text>
<circle cx="560.0" cy="250.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<line x1="560.0" y1="256.0" x2="560.0" y2="270.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="560.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">1957</text>
<text x="560.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">GE, Клайд (NY):</text>
<text x="560.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">+ затвор; SCR —</text>
<text x="560.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Голл, Гутцвіллер;</text>
<text x="560.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">перші 2 шт., липень</text>
<circle cx="760.0" cy="250.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<line x1="760.0" y1="244.0" x2="760.0" y2="238.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="760.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">&gt;1960-ті</text>
<text x="760.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">тиристор витісняє</text>
<text x="760.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">тиратрон; IEC:</text>
<text x="760.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">thyristor = thyratron</text>
<text x="760.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">+ transistor</text>
<text x="450.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">назва thyristor зшила обидві ери: «thyra» (грец. «брама/двері») від тиратрона + «-tor» від transistor</text>
