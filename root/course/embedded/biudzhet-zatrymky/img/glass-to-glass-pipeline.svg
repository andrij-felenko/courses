<text x="55.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">• Зрізовий стиск передає перші 16 рядків в ефір, поки сенсор ще експонує нижню частину кадру.</text>
