<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -50 950 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-50" width="950" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формула Фрііса: сферичне розходження потужності та ефективна апертура</text>
<circle cx="120.0" cy="200.0" r="14.0" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<text x="120.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Tx</text>
<rect x="77.4" y="224.3" width="85.2" height="35.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="120.0" y="238.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Випромінювач</tspan><tspan x="120.0" dy="14.3">P_tx · G_tx</tspan></text>
<path d="M 185 154 A 80 80 0 0 1 185 245" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="4,3"/>
<path d="M 251 108 A 160 160 0 0 1 251 291" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="4,3"/>
<path d="M 332 50 A 260 260 0 0 1 332 349" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="4,3"/>
<path d="M 464 -40 A 420 420 0 0 1 464 440" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="4,3"/>
<line x1="136.0" y1="200.0" x2="524.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="330.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відстань прямої видимості R</text>
<rect x="341.9" y="34.3" width="187.6" height="51.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.3"/><text x="435.6" y="56.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.6" dy="0.0">Густина потоку потужності:</tspan><tspan x="435.6" dy="14.3">S = (P_tx · G_tx) / (4·π·R²)</tspan><tspan x="435.6" dy="14.3">[Вт/м²]</tspan></text>
<circle cx="540.0" cy="200.0" r="14.0" fill="#dcfce7" stroke="#27ae60" stroke-width="2.0"/>
<text x="540.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Rx</text>
<rect x="534.0" y="165.0" width="12.0" height="70.0" rx="3" fill="#bbf7d0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="526.0" y1="165.0" x2="526.0" y2="235.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="522.0" y1="165.0" x2="530.0" y2="165.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="522.0" y1="235.0" x2="530.0" y2="235.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="514.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">A_eff</text>
<rect x="569.6" y="138.9" width="170.8" height="82.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/><text x="655.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Ефективна площа антени:</tspan><tspan x="655.0" dy="14.3">A_eff = G_rx · λ² / (4·π)</tspan><tspan x="655.0" dy="14.3"></tspan><tspan x="655.0" dy="14.3">Прийнята потужність:</tspan><tspan x="655.0" dy="14.3">P_rx = S · A_eff</tspan></text>
<rect x="19.3" y="321.0" width="901.4" height="28.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Формула Фрііса: P_rx = P_tx · G_tx · G_rx · [ λ / (4·π·R) ]²   —   згасання як 1/R² (−6 дБ на кожне подвоєння відстані)</tspan></text>
</svg>