<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інженерний цикл переходу від прототипу Rev A до ревізії Rev B</text>
<rect x="17.0" y="65.0" width="190.0" height="240.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="17.0" y="65.0" width="190.0" height="36.0" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.0"/>
<text x="112.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">1. Дослідна експлуатація Rev A</text>
<text x="27.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Оживлення плати (Bringup)</text>
<text x="27.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Верифікація за ТЗ і Worst-case</text>
<text x="27.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Випробування на вібрацію і кліматику</text>
<text x="27.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Монтаж тимчасових дротів (bodge)</text>
<line x1="209.0" y1="185.0" x2="227.0" y2="185.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="229.0" y="65.0" width="190.0" height="240.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<rect x="229.0" y="65.0" width="190.0" height="36.0" rx="6" fill="#d97706" stroke="#d97706" stroke-width="1.0"/>
<text x="324.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">2. Журнал дефектів (Errata)</text>
<text x="239.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Реєстрація всіх перерізів доріжок</text>
<text x="239.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Документування невідповідності пінів</text>
<text x="239.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Звіт технолога SMT про брак пайки</text>
<text x="239.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Аналіз ланцюга постачання (EOL)</text>
<line x1="421.0" y1="185.0" x2="439.0" y2="185.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="441.0" y="65.0" width="190.0" height="240.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<rect x="441.0" y="65.0" width="190.0" height="36.0" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="1.0"/>
<text x="536.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">3. Тріаж та інженерний фільтр</text>
<text x="451.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• ЖОРСТКИЙ ЗАХИСТ: стабільні вузли</text>
<text x="451.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Заборона випадкових змін чіпів</text>
<text x="451.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Уніфікація пасивних номіналів</text>
<text x="451.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Перевірка збереження контуру</text>
<line x1="633.0" y1="185.0" x2="651.0" y2="185.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="653.0" y="65.0" width="190.0" height="240.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<rect x="653.0" y="65.0" width="190.0" height="36.0" rx="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.0"/>
<text x="748.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">4. Випуск і регресія Rev B</text>
<text x="663.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Розведення виправлень у міді</text>
<text x="663.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Додавання Board ID для прошивки</text>
<text x="663.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Виробництво серійної партії</text>
<text x="663.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Регресійне тестування</text>
<line x1="40.0" y1="328.0" x2="820.0" y2="328.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="430.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Головний принцип: Rev B виправляє зареєстровані дефекти, а не створює нову схемотехніку з нуля</text>
</svg>