<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 390.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="390.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна ідентифікація ревізії плати (Board Revision ID) для прошивки</text>
<rect x="30.0" y="60.0" width="385.0" height="280.0" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="30.0" y="60.0" width="385.0" height="36.0" rx="8" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.0"/>
<text x="222.5" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Варіант А: Двійковий Strapping (2-3 GPIO)</text>
<rect x="50.0" y="110.0" width="100.0" height="75.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="100.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700">REV_BIT0</text>
<text x="100.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle">Pull-up 10k</text>
<text x="100.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">або Pull-down</text>
<rect x="165.0" y="110.0" width="100.0" height="75.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="215.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700">REV_BIT1</text>
<text x="215.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle">Pull-up 10k</text>
<text x="215.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">або Pull-down</text>
<line x1="270.0" y1="147.0" x2="305.0" y2="147.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="310.0" y="125.0" width="90.0" height="45.0" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="355.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">MCU GPIO</text>
<text x="355.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Читання)</text>
<text x="45.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Rev A: `00` (обидва резистори на GND)</text>
<text x="45.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Rev B: `01` (BIT0 на 3.3V, BIT1 на GND)</text>
<text x="45.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Rev C: `10` (BIT0 на GND, BIT1 на 3.3V)</text>
<text x="45.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Плюси: миттєве читання без ініціалізації АЦП</text>
<text x="45.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Мінуси: витрачає 2-3 виводи мікроконтролера</text>
<rect x="445.0" y="60.0" width="385.0" height="280.0" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="445.0" y="60.0" width="385.0" height="36.0" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.0"/>
<text x="637.5" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Варіант Б: Резистивний дільник (1 пін АЦП)</text>
<rect x="470.0" y="110.0" width="160.0" height="75.0" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="550.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle" font-weight="700">Дільник R1 / R2 (1%)</text>
<text x="550.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle">+ фільтр C = 100 нФ</text>
<text x="550.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Напруга 0..3.3 В</text>
<line x1="635.0" y1="147.0" x2="675.0" y2="147.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="680.0" y="125.0" width="120.0" height="45.0" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="740.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">MCU ADC_IN</text>
<text x="740.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(1 канал виміру)</text>
<text x="460.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Rev A: 0.00 В (GND, R1 DNP, R2 10k)</text>
<text x="460.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Rev B: 0.82 В (R1 30k, R2 10k, Vref=3.3V)</text>
<text x="460.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Rev C: 1.65 В (R1 10k, R2 10k)</text>
<text x="460.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Плюси: економить піни (потрібен лише 1 пін АЦП)</text>
<text x="460.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Захист: допуски вікна напруги ±150 мВ проти шуму</text>
<line x1="40.0" y1="352.0" x2="820.0" y2="352.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="430.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Ідентифікатор ревізії дозволяє одній прошивці автоматично конфігурувати периферію під будь-яку плату</text>
</svg>