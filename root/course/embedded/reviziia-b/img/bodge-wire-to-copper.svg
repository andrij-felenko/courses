<text x="360.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">U2 (Sensor)</text>
<line x1="115.0" y1="127.0" x2="160.0" y2="107.0" stroke="#2563eb" stroke-width="2.2"/>
<line x1="160.0" y1="107.0" x2="280.0" y2="107.0" stroke="#2563eb" stroke-width="2.2"/>
