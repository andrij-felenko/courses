<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехід від синіх дротів (Rev A) до цілісної топології міді (Rev B)</text>
<rect x="25.0" y="55.0" width="390.0" height="280.0" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="1.5"/>
<rect x="25.0" y="55.0" width="390.0" height="34.0" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="1.0"/>
<text x="220.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Rev A: Тимчасовий ремонт (Bodge Wire)</text>
<rect x="45.0" y="105.0" width="70.0" height="45.0" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="80.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">U1 (MCU)</text>
