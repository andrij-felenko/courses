<text x="220.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="700">AWG 30 дріт у повітрі</text>
<line x1="115.0" y1="165.0" x2="195.0" y2="165.0" stroke="#94a3b8" stroke-width="1.8"/>
<line x1="205.0" y1="157.0" x2="215.0" y2="173.0" stroke="#dc2626" stroke-width="2.5"/>
<line x1="205.0" y1="173.0" x2="215.0" y2="157.0" stroke="#dc2626" stroke-width="2.5"/>
<line x1="225.0" y1="165.0" x2="325.0" y2="165.0" stroke="#94a3b8" stroke-width="1.8"/>
<text x="210.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">Переріз скальпелем</text>
<text x="40.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="start">• Паразитна індуктивність контуру: L ~ 1.2 нГн/мм</text>
<text x="40.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="start">• Розірваний зворотний шлях струму на шарі GND</text>
<text x="40.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="start">• Антена для наведених ЕМ-завад і перехресних наводок</text>
<text x="40.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="start">• Ризик відриву пайки при вібрації та термоциклі</text>
<text x="40.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="start">• Непридатність для серійного складання автоматом</text>
<rect x="445.0" y="55.0" width="390.0" height="280.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<rect x="445.0" y="55.0" width="390.0" height="34.0" rx="8" fill="#16a34a" stroke="#16a34a" stroke-width="1.0"/>
<text x="640.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Rev B: Трасування у міді на друкованій платі</text>
<rect x="465.0" y="105.0" width="70.0" height="45.0" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="500.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">U1 (MCU)</text>
<rect x="745.0" y="105.0" width="70.0" height="45.0" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="780.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">U2 (Sensor)</text>
<line x1="535.0" y1="127.0" x2="745.0" y2="127.0" stroke="#16a34a" stroke-width="3.0"/>
<text x="640.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700">Шина 50 Ом з суцільним екраном</text>
<rect x="535.0" y="150.0" width="210.0" height="14.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.0"/>
<text x="640.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle">Шар суцільної землі GND (L2)</text>
<text x="460.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="start">• Контрольований хвильовий опір і мінімальна площа петлі</text>
<text x="460.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="start">• Неперервний шар зворотного струму безпосередньо під трасою</text>
<text x="460.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="start">• Повна відповідність стандартам вібростійкості та надійності</text>
<text x="460.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="start">• Захист паяльною маскою від корозії та КЗ</text>
<text x="460.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="start">• Нульові додаткові трудовитрати при монтажі SMT</text>
<line x1="40.0" y1="350.0" x2="820.0" y2="350.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="430.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Будь-який синій дріт у Rev A має стати перевіреним трасуванням у схемі та топології Rev B</text>
</svg>