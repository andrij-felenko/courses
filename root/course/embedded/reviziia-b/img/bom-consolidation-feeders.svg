<text x="225.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Rev A: 38 унікальних позицій (BOM Lines)</text>
<text x="48.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Резистори 0603: 1k, 1.2k, 2.2k, 4.7k, 5.1k, 10k, 12k, 47k, 100k</text>
<text x="48.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Конденсатори: 10pF, 22pF, 100nF 16V, 100nF 50V, 1uF 10V, 4.7uF</text>
<text x="48.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• 40 фідерів задіяно на Pick &amp; Place автоматі</text>
<text x="48.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Вартість переналаштування лінії: 38 позицій × $15 = $570</text>
<text x="48.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Висока ймовірність помилки заправки стрічки оператором</text>
<text x="48.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Залишки на складі: 20 недовикористаних котушок</text>
<rect x="445.0" y="60.0" width="380.0" height="270.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<rect x="445.0" y="60.0" width="380.0" height="36.0" rx="8" fill="#16a34a" stroke="#16a34a" stroke-width="1.0"/>
<text x="635.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Rev B: 16 уніфікованих позицій (BOM Lines)</text>
<text x="458.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Стандартні резистори 0603 1%: 100R, 1k, 10k, 100k (E6 база)</text>
<text x="458.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Конденсатори 0603 X7R: 22pF (кварц), 100nF 50V, 10uF 25V</text>
<text x="458.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Лише 18 фідерів на автоматі (швидкий монтаж за один прохід)</text>
<text x="458.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Вартість переналаштування лінії: $240 (економія 58%)</text>
<text x="458.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Оптова закупівля котушок по 5000/10000 шт (знижка до 40%)</text>
<text x="458.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Мінімальний складський запас, захист від зупинки лінії</text>
