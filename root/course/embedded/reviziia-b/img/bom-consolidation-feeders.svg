<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимізація BOM у Rev B: уніфікація номіналів та скорочення фідерів</text>
<rect x="35.0" y="60.0" width="380.0" height="270.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
