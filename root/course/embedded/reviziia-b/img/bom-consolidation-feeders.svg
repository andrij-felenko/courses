<text x="430.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Уніфікація номіналів без погіршення режимів роботи скорочує вартість і час монтажу серії</text>
