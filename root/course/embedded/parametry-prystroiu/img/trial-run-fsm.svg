<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат безпечного застосування конфігурації (Trial Run &amp; Safe Rollback)</text>
<rect x="40.0" y="75.0" width="230.0" height="115.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="155.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">1. CONFIG_ACTIVE</tspan><tspan x="155.0" dy="13.7">Штатна конфігурація</tspan><tspan x="155.0" dy="13.7"></tspan><tspan x="155.0" dy="13.7">• Працює стабільний профіль</tspan><tspan x="155.0" dy="13.7">• Зв'язок із сервером активний</tspan><tspan x="155.0" dy="13.7">• Flash містить валідний слот</tspan></text>
<rect x="355.0" y="75.0" width="230.0" height="115.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">2. CONFIG_STAGED</tspan><tspan x="470.0" dy="13.7">Отримано кандидата</tspan><tspan x="470.0" dy="13.7"></tspan><tspan x="470.0" dy="13.7">• Перевірка синтаксису і меж</tspan><tspan x="470.0" dy="13.7">• Крос-валідація залежностей</tspan><tspan x="470.0" dy="13.7">• Резервування RAM під відкат</tspan></text>
<rect x="670.0" y="75.0" width="230.0" height="115.0" rx="6" fill="#fdfaf3" stroke="#d97706" stroke-width="1.5"/><text x="785.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">3. TRIAL_RUNNING</tspan><tspan x="785.0" dy="13.7">Випробувальний режим</tspan><tspan x="785.0" dy="13.7"></tspan><tspan x="785.0" dy="13.7">• Застосовано кандидата</tspan><tspan x="785.0" dy="13.7">• Запущено таймер trial = 60 c</tspan><tspan x="785.0" dy="13.7">• Спроба підключення до лінка</tspan></text>
<rect x="670.0" y="310.0" width="230.0" height="115.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="337.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">4. CONFIG_COMMITTED</tspan><tspan x="785.0" dy="13.7">Успішна фіксація</tspan><tspan x="785.0" dy="13.7"></tspan><tspan x="785.0" dy="13.7">• Хмарний handshake пройдено</tspan><tspan x="785.0" dy="13.7">• Запис у Flash NVS (новий Seq)</tspan><tspan x="785.0" dy="13.7">• Кандидат стає ACTIVE</tspan></text>
<rect x="355.0" y="310.0" width="230.0" height="115.0" rx="6" fill="#fdeded" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="337.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">5. CONFIG_ROLLBACK</tspan><tspan x="470.0" dy="13.7">Автоматичний відкат</tspan><tspan x="470.0" dy="13.7"></tspan><tspan x="470.0" dy="13.7">• Відновлення старого профілю</tspan><tspan x="470.0" dy="13.7">• Переініціалізація радіомодуля</tspan><tspan x="470.0" dy="13.7">• Звіт на сервер про помилку</tspan></text>
