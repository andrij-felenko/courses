<polygon points="155,190 151,198 159,198" fill="#c0392b"/>
<text x="255.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Відкат до старого профілю</text>
<rect x="40.0" y="490.0" width="860.0" height="65.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="470.0" y="519.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Принцип відмовостійкості: Якщо пристрій зависає або перезавантажується під час випробувального режиму (Trial),</tspan><tspan x="470.0" dy="13.0">завантажувач та модуль конфігурації бачать незавершений прапорець випробування і миттєво повертають останній відомий справний профіль.</tspan></text>
