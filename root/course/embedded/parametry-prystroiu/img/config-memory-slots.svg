<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дводіапазонна організація Flash (Ping-Pong Slots) для конфігурації</text>
<rect x="40.0" y="60.0" width="420.0" height="285.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="250.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Slot A (Flash Sector 0, 4 KB) — [ACTIVE]</text>
<rect x="60.0" y="105.0" width="380.0" height="32.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Magic: 0x43464731 ('CFG1') | Version: 3</tspan></text>
<rect x="60.0" y="145.0" width="380.0" height="32.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Sequence Number: 142 (Новіший за Slot B)</tspan></text>
<rect x="60.0" y="185.0" width="380.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Payload Data (Структура конфігурації):</tspan><tspan x="250.0" dy="12.3">Wi-Fi, MQTT, TLS, Calibrations, Timers (256 байтів)</tspan></text>
<rect x="60.0" y="235.0" width="380.0" height="32.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="254.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">CRC32 Checksum: 0xA73F9012 (Valid)</tspan></text>
<rect x="60.0" y="275.0" width="380.0" height="46.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="295.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Стан слота: ВАЛІДНИЙ ТА АКТИВНИЙ</tspan><tspan x="250.0" dy="12.3">Завантажувач обирає цей слот під час старту ядра</tspan></text>
<rect x="480.0" y="60.0" width="420.0" height="285.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="690.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Slot B (Flash Sector 1, 4 KB) — [BACKUP / STANDBY]</text>
<rect x="500.0" y="105.0" width="380.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Magic: 0x43464731 ('CFG1') | Version: 3</tspan></text>
<rect x="500.0" y="145.0" width="380.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Sequence Number: 141 (Попередній робочий стан)</tspan></text>
<rect x="500.0" y="185.0" width="380.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Payload Data (Попередня робоча конфігурація):</tspan><tspan x="690.0" dy="12.3">Wi-Fi, MQTT, TLS, Calibrations, Timers (256 байтів)</tspan></text>
<rect x="500.0" y="235.0" width="380.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="254.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">CRC32 Checksum: 0x51E2B844 (Valid)</tspan></text>
<rect x="500.0" y="275.0" width="380.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="295.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Стан слота: РЕЗЕРВНИЙ (STANDBY)</tspan><tspan x="690.0" dy="12.3">Наступний запис атомарно стирає та перезаписує цей сектор</tspan></text>
<rect x="40.0" y="365.0" width="860.0" height="95.0" rx="6" fill="#fdfaf3" stroke="#d97706" stroke-width="1.5"/><text x="470.0" y="396.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Алгоритм атомарного оновлення (Ping-Pong Switch):</tspan><tspan x="470.0" dy="13.0">1. Нова конфігурація записується у неактивний слот (Slot B) із номером Sequence = 142 + 1 = 143;</tspan><tspan x="470.0" dy="13.0">2. Рахується та записується підсумкова CRC32. Доки запис не завершено, Slot A залишається повністю цілим і робочим;</tspan><tspan x="470.0" dy="13.0">3. При знеструмленні під час запису Slot B матиме биту CRC32, і система прозоро продовжить роботу зі Slot A.</tspan></text>
</svg>