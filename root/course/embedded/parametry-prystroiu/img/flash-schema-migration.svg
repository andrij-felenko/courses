<rect x="40.0" y="410.0" width="860.0" height="65.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="470.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Правило безпечної міграції: Нова прошивка ніколи не виконує Factory Reset наосліп.</tspan><tspan x="470.0" dy="13.0">Вона покроково піднімає версію старої структури через ланцюжок чистих міграторів, додаючи нові поля з безпечними дефолтами</tspan><tspan x="470.0" dy="13.0">і гарантуючи повне збереження унікальних калібрувань давачів та облікових даних зв'язку.</tspan></text>
