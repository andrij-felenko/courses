<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія параметра конфігурації: метадані, діапазони, пам'ять і зв'язки</text>
<rect x="40.0" y="55.0" width="420.0" height="420.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="250.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Статичний дескриптор у Flash (const schema)</text>
<rect x="60.0" y="100.0" width="380.0" height="46.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="119.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Ключ (Key ID &amp; Name):</tspan><tspan x="250.0" dy="14.3">0x1004 / &quot;telemetry_interval_s&quot;</tspan></text>
<rect x="60.0" y="156.0" width="380.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="175.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Тип даних (Type Tag):</tspan><tspan x="250.0" dy="14.3">TYPE_UINT32 (4 байти, беззнакове ціле)</tspan></text>
<rect x="60.0" y="212.0" width="380.0" height="54.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="235.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Межі значень (Validation Bounds):</tspan><tspan x="250.0" dy="14.3">min = 1 c,  max = 86400 c (24 год)</tspan></text>
<rect x="60.0" y="276.0" width="380.0" height="46.0" rx="6" fill="#fdfaf3" stroke="#c07a2e" stroke-width="1.5"/><text x="250.0" y="295.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Типове значення (Default Fallback):</tspan><tspan x="250.0" dy="14.3">default_val = 60 c (1 вимір на хвилину)</tspan></text>
<rect x="60.0" y="332.0" width="380.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="351.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Прапорці доступу (Flags):</tspan><tspan x="250.0" dy="14.3">FLAG_REBOOT_REQ | FLAG_RUNTIME_READ</tspan></text>
<rect x="60.0" y="388.0" width="380.0" height="72.0" rx="6" fill="#fdeded" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Реляційні правила (Cross-field):</tspan><tspan x="250.0" dy="13.7">telemetry_interval_s &lt;= ping_timeout_s / 2</tspan><tspan x="250.0" dy="13.7">(захист від хибного спрацювання watchdog зв'язку)</tspan></text>
<rect x="480.0" y="55.0" width="420.0" height="420.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="690.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Шари зберігання та виконання в runtime</text>
<rect x="500.0" y="100.0" width="380.0" height="60.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Активна робоча копія (RAM Active Slot):</tspan><tspan x="690.0" dy="13.7">uint32_t val = 30; // використовується підсистемами</tspan><tspan x="690.0" dy="13.7">Швидкий прямий доступ за 1 такт CPU без Flash read</tspan></text>
<rect x="500.0" y="170.0" width="380.0" height="60.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.5"/><text x="690.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Кандидат на випробуванні (RAM Candidate):</tspan><tspan x="690.0" dy="13.7">uint32_t candidate_val = 10; // Trial Run 60s</tspan><tspan x="690.0" dy="13.7">Підлягає відкату у разі збою мережевого лінка</tspan></text>
<rect x="500.0" y="240.0" width="380.0" height="75.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="690.0" y="260.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Енергонезалежна копія у Flash NVS:</tspan><tspan x="690.0" dy="13.7">Зміщення: offset 0x0024 у блоці конфігурації</tspan><tspan x="690.0" dy="13.7">Захист цілісності: охоплений єдиною CRC32</tspan><tspan x="690.0" dy="13.7">Версія схеми: Schema v2 (збережено при міграції)</tspan></text>
<rect x="500.0" y="325.0" width="380.0" height="135.0" rx="6" fill="#fdfaf3" stroke="#d97706" stroke-width="1.5"/><text x="690.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Поведінка при пошкодженні комірки Flash:</tspan><tspan x="690.0" dy="13.0">1. Виявлення розбіжності CRC32 блоку</tspan><tspan x="690.0" dy="13.0">2. Зчитування резервного слота (Slot B Ping-Pong)</tspan><tspan x="690.0" dy="13.0">3. При тотальній відмові — підстановка default_val = 60</tspan><tspan x="690.0" dy="13.0">4. Фіксація аварійної події у системному журналі</tspan></text>
</svg>