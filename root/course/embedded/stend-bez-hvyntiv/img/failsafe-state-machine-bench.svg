<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів Failsafe: перевірка реакції на вимкнення передавача (TX Off)</text>
<rect x="51.6" y="102.8" width="156.8" height="94.4" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Нормальний зв'язок</tspan><tspan x="130.0" dy="15.6">(RC_LINK_OK)</tspan><tspan x="130.0" dy="15.6">Приймання пакетів RC</tspan><tspan x="130.0" dy="15.6">Частота: 50 - 500 Гц</tspan><tspan x="130.0" dy="15.6">Мотори активні (Arm)</tspan></text>
<line x1="225.0" y1="150.0" x2="315.0" y2="150.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="270.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Втрата сигналу</text>
<text x="270.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">TX Off / Jamming</text>
<rect x="331.1" y="102.8" width="197.8" height="94.4" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="430.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Failsafe: Етап 1 (Stage 1)</tspan><tspan x="430.0" dy="15.6">Затримка: 0.4 - 1.0 с</tspan><tspan x="430.0" dy="15.6">Утримання останніх команд</tspan><tspan x="430.0" dy="15.6">або вирівнювання горизонту</tspan><tspan x="430.0" dy="15.6">Очікування поновлення</tspan></text>
<line x1="545.0" y1="150.0" x2="635.0" y2="150.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="590.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Таймаут вичерпано</text>
<text x="590.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">t &gt; t_guard</text>
<rect x="650.8" y="102.8" width="218.4" height="94.4" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Failsafe: Етап 2 (Stage 2)</tspan><tspan x="760.0" dy="15.6">Дія: Drop (Вимкнення) або RTH</tspan><tspan x="760.0" dy="15.6">На столі: МИТТЄВА ЗУПИНКА</tspan><tspan x="760.0" dy="15.6">Газ = 0, Disarm = TRUE</tspan><tspan x="760.0" dy="15.6">Звуковий сигнал маяка</tspan></text>
<line x1="430.0" y1="220.0" x2="130.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Поновлення сигналу на Stage 1 -&gt; Відновлення повного керування</text>
<rect x="184.9" y="282.2" width="530.1" height="55.6" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Блокування повторного армінгу після Failsafe:</tspan><tspan x="450.0" dy="14.3">Після переходу в Stage 2 повторний запуск блокується прапорцем FAILSAFE / RX_LOSS.</tspan><tspan x="450.0" dy="14.3">Для відновлення потрібно пересмикнути тумблер Arming у положення Disarm -&gt; Arm.</tspan></text>
</svg>