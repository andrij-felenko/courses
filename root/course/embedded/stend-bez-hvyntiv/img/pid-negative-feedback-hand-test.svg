<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірка відгуку PID: Від'ємний зворотний зв'язок (Negative Feedback) проти розгону</text>
<rect x="40.0" y="60.0" width="390.0" height="335.0" rx="8" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<text x="235.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПРАВИЛЬНО: Опір збуренню (Negative Feedback)</text>
<rect x="89.1" y="119.3" width="291.9" height="41.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="235.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">1. Зовнішня дія:</tspan><tspan x="235.0" dy="14.3">Оператор нахиляє дрон рукою праворуч (+Roll)</tspan></text>
<line x1="235.0" y1="175.0" x2="235.0" y2="205.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="67.1" y="212.2" width="335.8" height="55.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="235.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">2. Сенсорний відгук:</tspan><tspan x="235.0" dy="14.3">Гіроскоп фіксує ω_roll &gt; 0; помилка Error = -ω_roll</tspan><tspan x="235.0" dy="14.3">PID видає коригувальний момент вліво (-Torque)</tspan></text>
<line x1="235.0" y1="275.0" x2="235.0" y2="305.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="92.2" y="317.2" width="285.6" height="55.6" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="235.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">3. Реакція моторів:</tspan><tspan x="235.0" dy="14.3">Праві (нижні) мотори РОЗКРУЧУЮТЬСЯ,</tspan><tspan x="235.0" dy="14.3">ліві (верхні) сповільнюються -&gt; опір нахилу</tspan></text>
<rect x="470.0" y="60.0" width="390.0" height="335.0" rx="8" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.5"/>
<text x="665.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">АВАРІЯ: Додатний зворотний зв'язок (Positive Feedback)</text>
<rect x="519.1" y="119.3" width="291.9" height="41.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="665.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">1. Зовнішня дія:</tspan><tspan x="665.0" dy="14.3">Оператор нахиляє дрон рукою праворуч (+Roll)</tspan></text>
<line x1="665.0" y1="175.0" x2="665.0" y2="205.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="515.9" y="212.2" width="298.1" height="55.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="665.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">2. Помилка орієнтації (Inverted Axis):</tspan><tspan x="665.0" dy="14.3">Через неправильну орієнтацію сенсора/мікшера</tspan><tspan x="665.0" dy="14.3">контролер вважає, що нахил відбувається вліво</tspan></text>
<line x1="665.0" y1="275.0" x2="665.0" y2="305.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="497.1" y="317.2" width="335.8" height="55.6" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="665.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">3. Катастрофічний результат:</tspan><tspan x="665.0" dy="14.3">Ліві (верхні) мотори розганяються, посилюючи нахил!</tspan><tspan x="665.0" dy="14.3">У польоті це призводить до миттєвого перевороту</tspan></text>
</svg>