<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Скільки можу взяти?» — три відповіді залежно від порту</text>
<rect x="196.1" y="37.0" width="327.8" height="38.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.0"/><text x="360.0" y="60.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Скільки струму можу безпечно взяти?</tspan></text>
<line x1="360.0" y1="75.0" x2="150.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="150.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Type-A / micro</text>
<rect x="75.0" y="184.0" width="150.0" height="32.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">угода BC 1.2</tspan></text>
<text x="150.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">тип порту по D+/D−</tspan><tspan x="150.0" dy="14.3">(до 1.5 А)</tspan></text>
<line x1="360.0" y1="75.0" x2="360.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="360.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Type-C без PD</text>
<rect x="285.0" y="184.0" width="150.0" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="360.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">резистори CC</tspan></text>
<text x="360.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">5 В · 1.5 / 3 А</tspan></text>
<line x1="360.0" y1="75.0" x2="570.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="570.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Type-C із PD</text>
<rect x="481.9" y="184.0" width="176.2" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="570.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">переговори протоколом</tspan></text>
<text x="570.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">9 / 15 / 20 / 48 В</tspan><tspan x="570.0" dy="14.3">(до 240 Вт)</tspan></text>
<text x="360.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">три порти — три способи спитати; ця тема лише показує, куди дивитись</text>
