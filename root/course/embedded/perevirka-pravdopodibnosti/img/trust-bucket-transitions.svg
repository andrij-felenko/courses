<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат оцінки довіри на основі інтегратора штрафів (Leaky Bucket)</text>
<rect x="60.0" y="80.0" width="180.0" height="100.0" rx="8" fill="#f2fbf5" stroke="#27ae60" stroke-width="2.0"/>
<text x="150.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">TRUSTED</text>
<text x="150.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Повна довіра (100%)</text>
<line x1="70.0" y1="134.0" x2="230.0" y2="134.0" stroke="#d1fae5" stroke-width="1.0"/>
<text x="150.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Штрафний рахунок &lt; 25</text>
<text x="150.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Сигнал іде в регулятор</text>
<rect x="310.0" y="80.0" width="180.0" height="100.0" rx="8" fill="#fefdf3" stroke="#b9770e" stroke-width="2.0"/>
<text x="400.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">DEGRADED</text>
<text x="400.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Під підозрою (вага 20%)</text>
<line x1="320.0" y1="134.0" x2="480.0" y2="134.0" stroke="#fef3c7" stroke-width="1.0"/>
<text x="400.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Штрафний рахунок 25..80</text>
<text x="400.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">Знижена вага / Затискання</text>
<rect x="560.0" y="80.0" width="180.0" height="100.0" rx="8" fill="#fdf4f4" stroke="#c0392b" stroke-width="2.0"/>
<text x="650.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ISOLATED</text>
<text x="650.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Відмова / Ізоляція (0%)</text>
<line x1="570.0" y1="134.0" x2="730.0" y2="134.0" stroke="#fee2e2" stroke-width="1.0"/>
<text x="650.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Штрафний рахунок ≥ 80</text>
<text x="650.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Failsafe / Резерв / Зупинка</text>
<line x1="240.0" y1="110.0" x2="304.0" y2="110.0" stroke="#b9770e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="275.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">+20 (збій)</text>
<line x1="490.0" y1="110.0" x2="554.0" y2="110.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="525.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+20 (серія збоїв)</text>
<line x1="560.0" y1="150.0" x2="496.0" y2="150.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="525.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">-1 (за відлік)</text>
<line x1="310.0" y1="150.0" x2="246.0" y2="150.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="275.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">-1 (N чистих)</text>
<rect x="60.0" y="215.0" width="680.0" height="95.0" rx="6" fill="#f8fafc" stroke="#d0d4dc" stroke-width="1.0"/>
<text x="78.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Принцип роботи інтегратора (Leak Rate vs Penalty):</text>
<text x="78.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Миттєвий збій (1 глітч) додає +20 балів штрафу: сигнал відкидається, але система НЕ падає у Failsafe.</text>
<text x="78.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Кожен валідний відлік зменшує штраф на -1 бал: через 20 чистих кроків довіра повністю відновлюється.</text>
<text x="78.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Серія з 4 збоїв поспіль досягає порогу 80: сенсор миттєво маркується як ISOLATED для захисту регулятора.</text>
</svg>