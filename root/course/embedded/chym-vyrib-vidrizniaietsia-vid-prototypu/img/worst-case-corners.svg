<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="460.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір варіативності: робочий конверт серійного виробу</text>
<rect x="30.0" y="65.0" width="370.0" height="390.0" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="30.0" y="65.0" width="370.0" height="32.0" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
<text x="215.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">1. Кремнієві кути (Process Corners)</text>
<text x="45.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">• Fast-Fast (FF):</text>
<text x="55.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Транзистори відкриваються надшвидко.</text>
<text x="55.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Ризик: гонки сигналів (Hold Time), великі струми витоку.</text>
<text x="45.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">• Slow-Slow (SS):</text>
<text x="55.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Транзистори перемикаються із запізненням.</text>
<text x="55.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Ризик: порушення Setup Time, провал максимальної частоти.</text>
<text x="45.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">• Typical-Typical (TT):</text>
<text x="55.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Номінальний зразок з лабораторії.</text>
<text x="55.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Працює на столі, але не гарантує роботу країв серії.</text>
<text x="45.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">• Cross (FS / SF):</text>
<text x="55.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Різна швидкість P- та N-канальних польовиків.</text>
<text x="55.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Ризик: зміщення порогу логічних рівнів і тривалості фронтів.</text>
<rect x="430.0" y="65.0" width="380.0" height="390.0" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
<rect x="430.0" y="65.0" width="380.0" height="32.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="620.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">2. Зовнішній конверт і толеранси</text>
<text x="445.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">• Температурний діапазон (-40°C .. +85°C):</text>
<text x="455.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Зміна опору міді на 50%, падіння ємності MLCC,</text>
<text x="455.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">дрейф кварцового резонатора до ±50 ppm.</text>
<text x="445.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">• Нестабільність напруги (V_min .. V_max):</text>
<text x="455.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Просідання шини під час радіопередачі,</text>
<text x="455.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">викиди індуктивності при комутації навантажень.</text>
<text x="445.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">• DC Bias ефект керамічних конденсаторів:</text>
<text x="455.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Падіння реальної ємності на 40-70% під напругою,</text>
<text x="455.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">зростання пульсацій живлення втричі.</text>
<text x="445.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">• Worst-Case Analysis (WCA):</text>
<text x="455.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Розрахунок схеми для найгіршої комбінації:</text>
<text x="455.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">SS кремній + V_min + T_max + толеранси R/C ±10%.</text>
</svg>