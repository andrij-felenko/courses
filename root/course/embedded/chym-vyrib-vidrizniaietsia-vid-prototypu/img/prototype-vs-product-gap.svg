<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="480.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прірва між прототипом (N = 1) та серійним виробом (N = 10 000)</text>
<rect x="30.0" y="65.0" width="350.0" height="410.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2.0"/>
<rect x="30.0" y="65.0" width="350.0" height="36.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="205.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">Лабораторний прототип (Макет)</text>
<text x="45.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">• Умови середовища:</text>
<text x="55.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">+22°C, сухий стіл, без вібрацій та пилу</text>
<text x="45.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">• Електроживлення:</text>
<text x="55.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Лабораторний БЖ з чистим струмом (0.01% пульсацій)</text>
<text x="45.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">• Варіативність (N=1):</text>
<text x="55.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Підібраний авторкою єдиний «золотий» зразок</text>
<text x="45.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">• Схемотехніка:</text>
<text x="55.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Девборди, відкриті джемпери, без TVS/ESD захисту</text>
<text x="45.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">• Прошивка:</text>
<text x="55.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Лінійний код «happy path», delay(), SWD відкритий</text>
<text x="45.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">• Виробництво:</text>
<text x="55.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Ручне паяння, відсутність тестових точок (DFT)</text>
<text x="45.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">• Обслуговування:</text>
<text x="55.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Оновлення кабелем, нуль діагностики збоїв</text>
<rect x="460.0" y="65.0" width="350.0" height="410.0" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2.0"/>
<rect x="460.0" y="65.0" width="350.0" height="36.0" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="635.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">Серійний виріб (Продукт)</text>
<text x="475.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">✓ Умови середовища:</text>
<text x="485.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Від -40°C до +85°C, конденсат, вібрації, удари</text>
<text x="475.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">✓ Електроживлення:</text>
<text x="485.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Імпульсні перешкоди, load dump до 40 В, просадки</text>
<text x="475.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">✓ Варіативність (N=10k):</text>
<text x="485.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Worst-case аналіз, кути кремнію (Process Corners)</text>
<text x="475.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">✓ Схемотехніка:</text>
<text x="485.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Власна PCB, TVS-діоди на портах, DFM/DFA норми</text>
<text x="475.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">✓ Прошивка:</text>
<text x="485.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Автомати станів, WDT, BOR, розблокування шин</text>
<text x="475.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">✓ Виробництво:</text>
<text x="485.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Автоматичний стенд (Bed-of-Nails), тестові точки</text>
<text x="475.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">✓ Обслуговування:</text>
<text x="485.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">FOTA з двома банками (A/B), шифрування, логи</text>
<line x1="386.0" y1="245.0" x2="454.0" y2="245.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="420.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="700">ПЕРЕХІД ДО</text>
<text x="420.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="700">СЕРІЇ</text>
</svg>