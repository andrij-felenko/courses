<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="440.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заводський стенд прошивки й тестування (Bed-of-Nails / ICT)</text>
<rect x="28.0" y="65.0" width="180.0" height="240.0" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
<rect x="28.0" y="65.0" width="180.0" height="36.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="118.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">1. Перевірка живлення</text>
<text x="38.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Опір шин на GND</text>
<text x="38.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Тест на коротке замикання</text>
<text x="38.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Струм споживання у спокої</text>
<text x="38.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Захист від згоряння стенда</text>
<line x1="211.0" y1="185.0" x2="229.0" y2="185.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="232.0" y="65.0" width="180.0" height="240.0" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="232.0" y="65.0" width="180.0" height="36.0" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="322.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">2. SWD / Flashing</text>
<text x="242.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Підключення через SWD/JTAG</text>
<text x="242.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Запис Bootloader + Firmware</text>
<text x="242.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Верифікація контрольної суми</text>
<text x="242.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Запис серійного номера (UUID)</text>
<line x1="415.0" y1="185.0" x2="433.0" y2="185.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="436.0" y="65.0" width="180.0" height="240.0" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
<rect x="436.0" y="65.0" width="180.0" height="36.0" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/>
<text x="526.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="middle" font-weight="700">3. Калібрування та ключі</text>
<text x="446.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Калібрування опори АЦП</text>
<text x="446.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Генерація унікальних ключів</text>
<text x="446.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Запис криптографічних eFuse</text>
<text x="446.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Тест радіочастотного тракту</text>
<line x1="619.0" y1="185.0" x2="637.0" y2="185.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="65.0" width="180.0" height="240.0" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<rect x="640.0" y="65.0" width="180.0" height="36.0" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="730.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">4. Логічний тест і фіксація</text>
<text x="650.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Функціональний самотест</text>
<text x="650.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Замикання зневаджувача (RDP)</text>
<text x="650.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Формування заводського логу</text>
<text x="650.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Друк паспорта виробу</text>
<rect x="28.0" y="320.0" width="784.0" height="115.0" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
<rect x="28.0" y="320.0" width="784.0" height="28.0" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<text x="420.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">Вимоги проєктування для тестованості (DFT — Design for Testability)</text>
<text x="43.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Тестові точки (Test Points) діаметром 1.0 мм розміщуються виключно на нижньому шарі друкованої плати.</text>
<text x="43.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Крок між тестовими точками становить не менше 1.27 мм (рекомендовано 2.54 мм) для точності голчастих зондів.</text>
<text x="43.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Обов'язкова наявність двох технологічних отворів позиціонування (Fiducial / Tooling Holes) без металізації.</text>
<text x="43.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Загальний цикл тестування та первинної прошивки одного екземпляра не повинен перевищувати 15-30 секунд.</text>
</svg>