<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Архітектура багаторегіонального розгортання Active-Active</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Глобальний GeoDNS спрямовує користувачів до найближчого регіону з синхронізацією БД</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-sync" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Top Clients & GeoDNS -->
  <rect x="360" y="90" width="240" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="480" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">Глобальний GeoDNS / Anycast</text>
  <text x="480" y="130" font-size="12" text-anchor="middle" fill="#6b7280">Маршрутизація за затримкою RTT</text>

  <!-- Region 1: Europe -->
  <rect x="40" y="170" width="410" height="230" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="245" y="195" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Регіон EU (eu-central-1)</text>

  <rect x="60" y="215" width="160" height="45" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="140" y="242" font-size="13" text-anchor="middle" fill="#1a1a1a">Load Balancer EU</text>

  <rect x="60" y="275" width="160" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="140" y="302" font-size="13" text-anchor="middle" fill="#2457d6">App Instances EU</text>

  <rect x="260" y="215" width="170" height="165" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="345" y="240" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">БД Кластер EU</text>
  <text x="345" y="268" font-size="12" text-anchor="middle" fill="#1a1a1a">Primary Node A</text>
  <text x="345" y="295" font-size="12" text-anchor="middle" fill="#6b7280">Local Storage</text>
  <text x="345" y="340" font-size="11" text-anchor="middle" fill="#27ae60">Реплікація CDC</text>

  <!-- Region 2: US -->
  <rect x="510" y="170" width="410" height="230" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="715" y="195" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Регіон US (us-east-1)</text>

  <rect x="530" y="215" width="160" height="45" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="610" y="242" font-size="13" text-anchor="middle" fill="#1a1a1a">Load Balancer US</text>

  <rect x="530" y="275" width="160" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="610" y="302" font-size="13" text-anchor="middle" fill="#2457d6">App Instances US</text>

  <rect x="730" y="215" width="170" height="165" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="815" y="240" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">БД Кластер US</text>
  <text x="815" y="268" font-size="12" text-anchor="middle" fill="#1a1a1a">Primary Node B</text>
  <text x="815" y="295" font-size="12" text-anchor="middle" fill="#6b7280">Local Storage</text>
  <text x="815" y="340" font-size="11" text-anchor="middle" fill="#27ae60">Реплікація CDC</text>

  <!-- Arrows from GeoDNS to Regions -->
  <path d="M 420,140 L 245,170" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 540,140 L 715,170" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Cross-Region Replication Arrow below regions -->
  <line x1="430" y1="350" x2="730" y2="350" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-sync)" marker-start="url(#arr-sync)"/>
  <text x="580" y="342" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Двонаправлена синхронізація БД</text>
</svg>
