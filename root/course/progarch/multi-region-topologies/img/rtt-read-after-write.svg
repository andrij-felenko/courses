<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Затримка RTT та узгодженість Read-After-Write при міжрегіональній реплікації</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Читання з локальної репліки до завершення асинхронного реплікаційного RTT повертає застарілі дані</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Lifelines Header -->
  <rect x="100" y="90" width="180" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="190" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Клієнт (User App)</text>

  <rect x="390" y="90" width="180" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="480" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">Master DB (Region EU)</text>

  <rect x="680" y="90" width="180" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="770" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Replica DB (Region US)</text>

  <!-- Lifelines Vertical Lines -->
  <line x1="190" y1="130" x2="190" y2="410" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="480" y1="130" x2="480" y2="410" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="770" y1="130" x2="770" y2="410" stroke="#d0d7de" stroke-dasharray="4,4"/>

  <!-- Step 1: Write to Master -->
  <line x1="190" y1="160" x2="480" y2="180" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="163" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">1. WRITE x=5 (t_0)</text>

  <!-- Master ACK -->
  <line x1="480" y1="195" x2="190" y2="215" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="320" y="200" font-size="12" text-anchor="middle" fill="#27ae60">ACK Write Success</text>

  <!-- Async Replication start -->
  <line x1="480" y1="190" x2="770" y2="330" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="640" y="240" font-size="12" font-weight="bold" fill="#6b7280">Асинхронний RTT = 80ms</text>

  <!-- Step 2: Premature Read from Replica -->
  <line x1="190" y1="235" x2="770" y2="265" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="460" y="242" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">2. READ x (t_1 &lt; t_0 + RTT)</text>

  <line x1="770" y1="280" x2="190" y2="300" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="460" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Повертає застаріле x=4 (Stale Read!)</text>

  <!-- Replication Finishes -->
  <circle cx="770" cy="330" r="4" fill="#27ae60"/>
  <text x="785" y="334" font-size="11" font-weight="bold" fill="#27ae60">х=5 оновлено</text>

  <!-- Step 3: Read after RTT -->
  <line x1="190" y1="355" x2="770" y2="375" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="460" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">3. READ x (t_2 &gt; t_0 + RTT)</text>

  <line x1="770" y1="385" x2="190" y2="400" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <text x="460" y="390" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Повертає свіже x=5 (Consistent)</text>
</svg>
