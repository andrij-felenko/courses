<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Важелі впливу: від наказу до правила в механізмі</text>
<rect x="150.0" y="70.0" width="560.0" height="78.0" rx="10" fill="#e9f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="430.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Хай правило несе МЕХАНІЗМ</text>
<text x="430.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">фітнес-функція, процес поради: авторитет у системі, однаковий для всіх — і для тебе</text>
<rect x="150.0" y="164.0" width="560.0" height="78.0" rx="10" fill="#e6f5f2" stroke="#2f9e8f" stroke-width="2.0"/>
<text x="430.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2f9e8f" text-anchor="middle" font-weight="700">Замости ДОРОГУ до правильного</text>
<text x="430.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">правильне = шлях найменшого спротиву; сперечатися вже нема про що</text>
<rect x="150.0" y="258.0" width="560.0" height="78.0" rx="10" fill="#fff6e0" stroke="#b8862f" stroke-width="2.0"/>
<text x="430.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8862f" text-anchor="middle" font-weight="700">Зрозумій, тоді говори їхньою ВАЛЮТОЮ</text>
<text x="430.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">рішення стає почасти їхнім — тримається, поки їм болить</text>
<rect x="150.0" y="352.0" width="560.0" height="78.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="430.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">НАКАЗ (гола влада)</text>
<text x="430.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">тримається, поки стоїш над душею; роблять букву, не суть — і саботують</text>
<line x1="96.0" y1="430.0" x2="96.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="78" y="250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic" transform="rotate(-90 78 250)">слабший  →  міцніший важіль</text>
<text x="728.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700"><tspan x="728.0" dy="0.0">дорого раз</tspan><tspan x="728.0" dy="13.1">збудувати —</tspan><tspan x="728.0" dy="13.1">тримається само</tspan></text>
<text x="728.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700"><tspan x="728.0" dy="0.0">дешево</tspan><tspan x="728.0" dy="13.1">наказати —</tspan><tspan x="728.0" dy="13.1">дорого тримати</tspan></text>
</svg>