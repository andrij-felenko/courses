<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відповідаєш за форму, але не командуєш руками</text>
<rect x="60.0" y="150.0" width="240.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.9"/><text x="180.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">АРХІТЕКТОР</tspan><tspan x="180.0" dy="16.9">відповідає за форму системи</tspan></text>
<rect x="560.0" y="150.0" width="240.0" height="60.0" rx="6" fill="#e9f6ee" stroke="#27ae60" stroke-width="1.9"/><text x="680.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">КОМАНДИ</tspan><tspan x="680.0" dy="16.9">пишуть код — руки в них</tspan></text>
<rect x="300.0" y="150.0" width="260.0" height="60.0" rx="6" fill="#fbfbfc" stroke="#e3e6ea" stroke-width="1.0"/>
<path d="M 300 150 Q 430 66 560 150" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
<text x="430.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ВПЛИВ — єдиний місток</text>
<line x1="300.0" y1="178.0" x2="418.0" y2="178.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">наказ</text>
<text x="432.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">✗</text>
<text x="430.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">розрив влади: наслідки на тобі — а команди тобі не підлеглі</text>
</svg>