<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як обирати: спершу «хто викликач», тоді «хто чекає» — і зазвичай обидва</text>
<line x1="632.0" y1="132.0" x2="632.0" y2="346.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,6"/>
<rect x="78.0" y="79.0" width="540.0" height="34.0" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.8"/><text x="348.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="348.0" dy="0.0">Питання 1 — ХТО ВИКЛИКАЧ?</tspan></text>
<rect x="73.0" y="161.0" width="210.0" height="54.0" rx="6" fill="#eceef1" stroke="#6b7280" stroke-width="1.5"/><text x="178.0" y="184.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="178.0" dy="0.0">за NAT, без</tspan><tspan x="178.0" dy="15.6">публічної адреси</tspan></text>
<line x1="286.0" y1="188.0" x2="340.0" y2="188.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
