<rect x="73.0" y="259.0" width="210.0" height="54.0" rx="6" fill="#eceef1" stroke="#6b7280" stroke-width="1.5"/><text x="178.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="178.0" dy="0.0">публічний</tspan><tspan x="178.0" dy="15.6">загартований сервер</tspan></text>
<line x1="286.0" y1="286.0" x2="340.0" y2="286.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="259.0" width="268.0" height="54.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="484.0" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="484.0" dy="0.0">ВЕБХУК</tspan></text>
<rect x="678.0" y="79.0" width="540.0" height="34.0" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.8"/><text x="948.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="948.0" dy="0.0">Питання 2 — ХТО ЧЕКАЄ?</tspan></text>
<rect x="673.0" y="161.0" width="210.0" height="54.0" rx="6" fill="#eceef1" stroke="#6b7280" stroke-width="1.5"/><text x="778.0" y="184.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">людина в екрані</tspan><tspan x="778.0" dy="15.6">зараз</tspan></text>
<line x1="886.0" y1="188.0" x2="940.0" y2="188.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="950.0" y="161.0" width="268.0" height="54.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="1084.0" y="184.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1084.0" dy="0.0">тримати лінію /</tspan><tspan x="1084.0" dy="16.9">часто опитувати</tspan></text>
<rect x="673.0" y="259.0" width="210.0" height="54.0" rx="6" fill="#eceef1" stroke="#6b7280" stroke-width="1.5"/><text x="778.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">бекенд,</tspan><tspan x="778.0" dy="15.6">може спати</tspan></text>
<line x1="886.0" y1="286.0" x2="940.0" y2="286.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="950.0" y="259.0" width="268.0" height="54.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="1084.0" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1084.0" dy="0.0">ВЕБХУК</tspan></text>
<rect x="50.0" y="403.1" width="1140.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="620.0" y="424.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Зрілий дефолт — ОБИДВА: вебхук для швидкого шляху + поллінг/звірка як страхувальна сітка,</tspan><tspan x="620.0" dy="16.9">бо вебхуки таки губляться (приймач полежав, проксі відкинув, фільтр спрацював).</tspan></text>
<text x="620.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Досяжність відсіює більшість випадків; на серйозних інтеграціях push і pull живуть разом — швидкість плюс гарантія.</text>
</svg>