<line x1="510.0" y1="300.0" x2="510.0" y2="402.0" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="510.0" cy="300.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="415.0" y="402.0" width="190.0" height="92.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.8"/><text x="510.0" y="435.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">1999 → 2005</tspan><tspan x="510.0" dy="16.9">XHR, тоді AJAX —</tspan><tspan x="510.0" dy="16.9">браузер опитує</tspan></text>
<circle cx="710.0" cy="300.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="615.0" y="254.0" width="190.0" height="92.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.8"/><text x="710.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">2006 · Comet</tspan><tspan x="710.0" dy="16.9">висячий GET —</tspan><tspan x="710.0" dy="16.9">тримати лінію</tspan></text>
<line x1="910.0" y1="300.0" x2="910.0" y2="206.0" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="910.0" cy="300.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="815.0" y="114.0" width="190.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="910.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">2007</tspan><tspan x="910.0" dy="16.9">«webhook»</tspan><tspan x="910.0" dy="16.9">дістає ім'я</tspan></text>
<line x1="1110.0" y1="300.0" x2="1110.0" y2="206.0" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="1110.0" cy="300.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="1015.0" y="114.0" width="190.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1110.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">2010–12</tspan><tspan x="1110.0" dy="16.9">GitHub, Stripe —</tspan><tspan x="1110.0" dy="16.9">вебхуки масові</tspan></text>
<line x1="1310.0" y1="300.0" x2="1310.0" y2="402.0" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="1310.0" cy="300.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="1215.0" y="402.0" width="190.0" height="92.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.8"/><text x="1310.0" y="435.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1310.0" dy="0.0">2020-ті</tspan><tspan x="1310.0" dy="16.9">звірка вертає</tspan><tspan x="1310.0" dy="16.9">поллінг як сітку</tspan></text>
<line x1="1110.0" y1="206.0" x2="1310.0" y2="402.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6,5"/>
<text x="1170.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1170.0" dy="0.0">маятник</tspan><tspan x="1170.0" dy="15.6">хитнувся</tspan><tspan x="1170.0" dy="15.6">назад</tspan></text>
<text x="710.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Розвилку перерішують щоепохи — і зріла відповідь врешті тримає обидва боки: push заради швидкості, pull заради певності.</text>
