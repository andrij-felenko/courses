<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1420" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід «тягнути ⇄ штовхати»: та сама розвилка через сім десятиліть</text>
<line x1="70.0" y1="300.0" x2="1350.0" y2="300.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="80.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">↑ ШТОВХАТИ (push) — пристрій / сервер сам ініціює зв'язок</text>
<text x="80.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">↓ ТЯГНУТИ (pull) — викликач опитує сам, коли захоче</text>
<line x1="110.0" y1="300.0" x2="110.0" y2="402.0" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="110.0" cy="300.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="15.0" y="402.0" width="190.0" height="92.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.8"/><text x="110.0" y="435.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">поч. 1950-х</tspan><tspan x="110.0" dy="16.9">залізо в циклі</tspan><tspan x="110.0" dy="16.9">опитує пристрій</tspan></text>
