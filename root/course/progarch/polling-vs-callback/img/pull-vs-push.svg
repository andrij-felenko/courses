<rect x="230.0" y="459.0" width="632.0" height="34.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.5"/><text x="546.0" y="480.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="546.0" dy="0.0">робота у фоні — оновлюємо прошивку</tspan></text>
<line x1="150.0" y1="582.0" x2="210.0" y2="582.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,5"/>
