<text x="898.5" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">змарнована затримка</text>
<text x="620.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Більшість опитувань вертає «ще ні»; результат, готовий одразу по тику, чекає до наступного — зайва затримка ≈ T/2.</text>
<line x1="60.0" y1="360.0" x2="1180.0" y2="360.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<text x="620.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ВЕБХУК (push) — викликач лишив адресу й пішов; сервер штовхає результат раз</text>
<text x="84.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">сервер</text>
