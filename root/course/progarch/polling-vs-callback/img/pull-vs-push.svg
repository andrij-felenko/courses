<text x="210.0" y="608.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">запуск: 202 {jobId}</text>
<text x="540.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">викликач відсутній — не опитує, ресурси вільні</text>
<line x1="862.0" y1="442.0" x2="862.0" y2="594.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="862.0" y1="491.0" x2="862.0" y2="567.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="862.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">POST «готово ✓»</text>
<text x="872.0" y="529.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">штовхає раз</text>
<rect x="940.0" y="559.4" width="220.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1050.0" y="578.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">ціна: публічна адреса</tspan><tspan x="1050.0" dy="14.3">+ підпис + живий приймач</tspan></text>
<text x="620.0" y="662.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Єдиний виклик у мить готовності: нуль порожніх запитів і майже без затримки — якщо є куди доставити.</text>
