<text x="210.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">GET</text>
<text x="572.5" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">викликач опитує кожні T = 5 с — переважно чує «ще ні»</text>
<line x1="862.0" y1="118.0" x2="862.0" y2="268.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="862.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">результат готовий тут</text>
