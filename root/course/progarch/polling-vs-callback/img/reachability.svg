<line x1="392.0" y1="208.0" x2="872.0" y2="208.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="600.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">поллінг: вихідне з'єднання проходить завжди</text>
<text x="982.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лишається простим —</text>
<text x="982.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тільки відповідає на статус</text>
<line x1="872.0" y1="372.0" x2="616.0" y2="372.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<circle cx="600.0" cy="372.0" r="11.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="600.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="772.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">вебхук: вхідне для викликача</text>
<text x="700.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">NAT/файрвол блокує</text>
<text x="228.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="228.0" dy="0.0">щоб прийняти POST, викликач мусить сам</tspan><tspan x="228.0" dy="14.3">стати сервером: публічна адреса,</tspan><tspan x="228.0" dy="14.3">автентифікація, живий приймач</tspan></text>
<text x="610.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідні дзвінки проходять звідусіль → поллінг доступний завжди. Вебхук жадає, щоб викликач сам був досяжним ззовні.</text>
<text x="610.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Та сама розвилка, що в залізі: процесор опитує пристрій сам — чи пристрій піднімає лінію переривання.</text>
