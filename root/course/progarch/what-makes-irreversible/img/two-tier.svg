<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два яруси довіри: рідкісний корінь наглядає за частим операційним</text>
<rect x="144.4" y="55.6" width="227.2" height="80.8" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="258.0" y="76.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="258.0" dy="0.0">КОРІНЬ (root)</tspan><tspan x="258.0" dy="15.6">офлайн, в HSM</tspan><tspan x="258.0" dy="15.6">підписує лише оновлення ключів</tspan><tspan x="258.0" dy="15.6">ротація — рідко</tspan></text>
<rect x="608.9" y="55.6" width="186.2" height="80.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="702.0" y="76.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="702.0" dy="0.0">ОПЕРАЦІЙНИЙ (hot)</tspan><tspan x="702.0" dy="15.6">у мережі, підписує щодня</tspan><tspan x="702.0" dy="15.6">дозволи на відкриття</tspan><tspan x="702.0" dy="15.6">ротація — часто</tspan></text>
<line x1="258.0" y1="148.0" x2="258.0" y2="197.2" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="702.0" y1="148.0" x2="702.0" y2="197.2" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="250.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">підписує</text>
<text x="710.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">підписує</text>
<rect x="196.7" y="200.2" width="122.6" height="47.6" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="258.0" y="220.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">оновлення ключа</tspan><tspan x="258.0" dy="15.6">(add · revoke)</tspan></text>
<rect x="627.0" y="200.2" width="150.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="702.0" y="220.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="702.0" dy="0.0">дозвіл на відкриття</tspan><tspan x="702.0" dy="15.6">(нонс + термін)</tspan></text>
<line x1="258.0" y1="250.8" x2="330.1" y2="316.2" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="702.0" y1="250.8" x2="629.9" y2="316.2" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="334.1" y="316.2" width="291.8" height="51.6" rx="6" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="338.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">замок у полі</tspan><tspan x="480.0" dy="15.6">звʼязка ключів: kid + вікно чинності</tspan></text>
<text x="480.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Операційний ключ витік? Корінь недоторканий, бо офлайн — підписує «відкликати #1, додати #2».</text>
<text x="480.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Гарячий ключ міняють часто й дешево; корінь тримають офлайн саме щоб він завжди міг підписати порятунок.</text>
</svg>