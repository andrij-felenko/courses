<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один записаний абзац виявляє чотири приховані рішення</text>
<rect x="271.4" y="70.5" width="437.2" height="43.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/><text x="490.0" y="97.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">«Хаб працює офлайн» — здається, вже вирішено</tspan></text>
<line x1="490.0" y1="113.5" x2="490.0" y2="168.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">спробуй ЗАПИСАТИ це реченням</text>
<line x1="250.0" y1="196.0" x2="250.0" y2="548.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="250.0" y1="230.0" x2="300.0" y2="230.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="300.0" y="196.0" width="620.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="610.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Погодні правила тихо вимикаються (їм треба хмара)</tspan><tspan x="610.0" dy="16.9">— ми на це свідомо згодні?</tspan></text>
<circle cx="250.0" cy="230.0" r="12.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="250.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">?</text>
<line x1="250.0" y1="320.0" x2="300.0" y2="320.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="300.0" y="286.0" width="620.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="610.0" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Керування з-поза дому вмирає на весь час збою</tspan><tspan x="610.0" dy="16.9">— це прийнятно?</tspan></text>
<circle cx="250.0" cy="320.0" r="12.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="250.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">?</text>
<line x1="250.0" y1="410.0" x2="300.0" y2="410.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="300.0" y="376.0" width="620.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="610.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Буфер телеметрії: на скільки годин розрахований</tspan><tspan x="610.0" dy="16.9">і що робити, коли переповниться?</tspan></text>
<circle cx="250.0" cy="410.0" r="12.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="250.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">?</text>
<line x1="250.0" y1="500.0" x2="300.0" y2="500.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="300.0" y="466.0" width="620.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="610.0" y="496.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Після відновлення — повторювати чергу команд?</tspan><tspan x="610.0" dy="16.9">А якщо «відчини двері» вже застаріла?</tspan></text>
<circle cx="250.0" cy="500.0" r="12.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="250.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">?</text>
</svg>