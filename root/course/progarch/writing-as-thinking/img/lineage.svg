<text x="248.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a3fb3" text-anchor="middle" font-weight="700">ЛІТЕРАТУРА</text>
<text x="248.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джоан Дідіон</text>
<text x="248.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">есе «Why I Write»</text>
<line x1="248.0" y1="182.0" x2="248.0" y2="281.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="248.0" cy="290.0" r="9.0" fill="#ffffff" stroke="#7a3fb3" stroke-width="2.4"/>
<text x="248.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a3fb3" text-anchor="middle" font-weight="700">1976</text>
<text x="248.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a3fb3" text-anchor="middle" font-style="italic">«пишу — щоб дізнатися,</text>
<text x="248.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a3fb3" text-anchor="middle" font-style="italic">що я думаю»</text>
<rect x="395.0" y="64.0" width="250.0" height="118.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="520.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ФОРМАЛЬНІ МЕТОДИ</text>
<text x="520.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гіндон → Лемпорт</text>
<text x="520.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«Specifying Systems»</text>
<line x1="520.0" y1="182.0" x2="520.0" y2="281.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="520.0" cy="290.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="520.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2002</text>
<text x="520.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">«письмо виказує,</text>
<text x="520.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">яка неохайна думка»</text>
<rect x="667.0" y="64.0" width="250.0" height="118.0" rx="10" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.8"/>
<text x="792.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f7a4d" text-anchor="middle" font-weight="700">УПРАВЛІННЯ</text>
<text x="792.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джефф Безос · Amazon</text>
<text x="792.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">заборона слайдів</text>
<line x1="792.0" y1="182.0" x2="792.0" y2="281.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="792.0" cy="290.0" r="9.0" fill="#ffffff" stroke="#1f7a4d" stroke-width="2.4"/>
<text x="792.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f7a4d" text-anchor="middle" font-weight="700">2004</text>
<text x="792.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f7a4d" text-anchor="middle" font-style="italic">наратив не дає</text>
<text x="792.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f7a4d" text-anchor="middle" font-style="italic">сховати діру за булітами</text>
</svg>