<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому сторінка бачить те, чого не бачить голова</text>
<text x="255.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">У голові</text>
<rect x="55.0" y="84.0" width="400.0" height="366.0" rx="18" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="255.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">робоча пам'ять тримає лиш кілька частин заразом</text>
<circle cx="165" cy="268" r="96" fill="#fff7e6" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="165.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">у фокусі зараз</text>
