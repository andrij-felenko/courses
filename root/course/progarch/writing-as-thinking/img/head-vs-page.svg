<rect x="103.0" y="292.0" width="124.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="165.0" y="311.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">буфер даних</tspan></text>
<rect x="300.0" y="150.0" width="148.0" height="30.0" rx="6" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="374.0" y="168.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="374.0" dy="0.0">погодні правила</tspan></text>
<rect x="300.0" y="225.0" width="148.0" height="30.0" rx="6" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="374.0" y="243.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="374.0" dy="0.0">керування ззовні</tspan></text>
<rect x="300.0" y="300.0" width="148.0" height="30.0" rx="6" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5"/><text x="374.0" y="318.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="374.0" dy="0.0">повтор команд</tspan></text>
<text x="374.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#aab0ba" text-anchor="middle">поза фокусом — наче й немає</text>
<text x="745.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">На сторінці</text>
<rect x="545.0" y="84.0" width="400.0" height="366.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="575.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">п. 3 — хаб працює без хмари</text>
<text x="575.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">п. 12 — телефон керує з дому</text>
<text x="575.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">п. 27 — буфер на добу</text>
<text x="575.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">п. 40 — правило жалюзі чекає хмару</text>
<text x="575.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">п. 55 — після збою — повтор черги</text>
