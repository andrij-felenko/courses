<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель загроз STRIDE та периметр Zero-Trust</text>
<rect x="40.0" y="40.0" width="220.0" height="360.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="150.0" y="152.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c62828" text-anchor="middle"><tspan x="150.0" dy="0.0">Зовнішній периметр</tspan><tspan x="150.0" dy="14.3">(Ненадійна мережа)</tspan><tspan x="150.0" dy="14.3"></tspan><tspan x="150.0" dy="14.3">• Публічний Інтернет</tspan><tspan x="150.0" dy="14.3">• IoT Давачі</tspan><tspan x="150.0" dy="14.3">• Мобільні клієнти</tspan><tspan x="150.0" dy="14.3"></tspan><tspan x="150.0" dy="14.3">Загрози STRIDE:</tspan><tspan x="150.0" dy="14.3">- Spoofing (Підробка)</tspan><tspan x="150.0" dy="14.3">- DoS (Атака на відмову)</tspan><tspan x="150.0" dy="14.3">- Tampering (Перехоплення)</tspan></text>
<line x1="260.0" y1="220.0" x2="330.0" y2="220.0" stroke="#c62828" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="330.0" y="40.0" width="630.0" height="360.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="645.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Периметр Zero-Trust (Внутрішній Service Mesh)</tspan><tspan x="645.0" dy="15.6"></tspan><tspan x="645.0" dy="15.6">Ідентичність: SPIFFE/SPIRE X.509 SVID | mTLS (TLS 1.3)</tspan></text>
<rect x="360.0" y="110.0" width="260.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="490.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1565c0" text-anchor="middle"><tspan x="490.0" dy="0.0">API Gateway / Proxy</tspan><tspan x="490.0" dy="14.3"></tspan><tspan x="490.0" dy="14.3">- Перевірка OAuth2 / JWT</tspan><tspan x="490.0" dy="14.3">- Token Bucket Rate Limit</tspan></text>
<line x1="620.0" y1="150.0" x2="670.0" y2="150.0" stroke="#1565c0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="670.0" y="110.0" width="260.0" height="80.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="800.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle"><tspan x="800.0" dy="0.0">Ledger &amp; Core Services</tspan><tspan x="800.0" dy="14.3"></tspan><tspan x="800.0" dy="14.3">- OPA Rego AuthZ (RBAC)</tspan><tspan x="800.0" dy="14.3">- Envelope Encryption (DEK)</tspan></text>
<rect x="360.0" y="240.0" width="260.0" height="120.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="490.0" y="268.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle"><tspan x="490.0" dy="0.0">KMS &amp; Secrets Manager</tspan><tspan x="490.0" dy="14.3">(Vault / AWS KMS)</tspan><tspan x="490.0" dy="14.3"></tspan><tspan x="490.0" dy="14.3">• Ротація KEK ключа</tspan><tspan x="490.0" dy="14.3">• Генерація тимчасових DEK</tspan><tspan x="490.0" dy="14.3">• Zero-Trust автентифікація</tspan></text>
<rect x="670.0" y="240.0" width="260.0" height="120.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="800.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7b1fa2" text-anchor="middle"><tspan x="800.0" dy="0.0">Захищене Сховище (БД)</tspan><tspan x="800.0" dy="14.3"></tspan><tspan x="800.0" dy="14.3">• Append-Only Audit Log</tspan><tspan x="800.0" dy="14.3">• Шифрування колонок (DEK)</tspan><tspan x="800.0" dy="14.3">• Криптографічні хеш-ланцюги</tspan></text>
</svg>