<text x="430.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">стрілки «потребує» замкнулись у коло — почати нема звідки</text>
