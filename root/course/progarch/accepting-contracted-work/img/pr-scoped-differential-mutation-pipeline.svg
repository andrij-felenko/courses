<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Диференційний мутаційний гейт у CI (PR-Scoped Mutation Gate)</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Аналіз git diff виділяє лише змінені рядки, перетворюючи багатогодинний аналіз на швидкий бар'єр приймання</text>

  <!-- ЕТАП 1: Аналіз Git Diff -->
  <rect x="30" y="76" width="186" height="264" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="38" y="84" width="170" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="123" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">1. Аналіз Git Diff</text>

  <rect x="38" y="124" width="170" height="56" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="48" y="144" font-size="12" font-weight="700" fill="#1a1a1a">PR підрядника</text>
  <text x="48" y="164" font-size="11" fill="#6b7280">+48 рядків у 3 файлах</text>

  <rect x="38" y="188" width="170" height="142" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="48" y="209" font-size="12" font-weight="700" fill="#2457d6">Фільтрація hunks:</text>
  <text x="48" y="231" font-size="11" fill="#1a1a1a">• Порівняння base..head</text>
  <text x="48" y="251" font-size="11" fill="#1a1a1a">• Лише змінені рядки</text>
  <text x="48" y="271" font-size="11" fill="#1a1a1a">• Нові методи та класи</text>
  <text x="48" y="296" font-size="11" font-weight="700" fill="#27ae60">✔ Legacy-код відсічено</text>
  <text x="48" y="314" font-size="11" fill="#6b7280">  (економія 99% часу)</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="216" y1="208" x2="238" y2="208" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ЕТАП 2: Націлені мутації -->
  <rect x="242" y="76" width="196" height="264" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="250" y="84" width="180" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="340" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">2. Націлені мутації</text>

  <rect x="250" y="124" width="180" height="96" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="260" y="144" font-size="12" font-weight="700" fill="#1a1a1a">Оператори мутацій:</text>
  <text x="260" y="165" font-size="11" fill="#6b7280">• Умови: &gt; замінено на &gt;=</text>
  <text x="260" y="184" font-size="11" fill="#6b7280">• Логіка: &amp;&amp; замінено на ||</text>
  <text x="260" y="203" font-size="11" fill="#6b7280">• Межі: 0, nil, порожньо</text>

  <rect x="250" y="228" width="180" height="102" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="260" y="249" font-size="12" font-weight="700" fill="#2457d6">Пул мутантів у PR:</text>
  <text x="260" y="271" font-size="14" font-weight="700" fill="#1a1a1a">Всього: 16 мутантів</text>
  <text x="260" y="293" font-size="11" fill="#6b7280">Створено лише у diff</text>
  <text x="260" y="313" font-size="11" font-weight="700" fill="#27ae60">Замість 4 800+ по системі</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="438" y1="208" x2="460" y2="208" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ЕТАП 3: Селективні тести -->
  <rect x="464" y="76" width="196" height="264" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="472" y="84" width="180" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="562" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">3. Селективні тести</text>

  <rect x="472" y="124" width="180" height="96" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="482" y="144" font-size="12" font-weight="700" fill="#1a1a1a">Impacted Test Selection:</text>
  <text x="482" y="165" font-size="11" fill="#6b7280">• Трасування покриття</text>
  <text x="482" y="184" font-size="11" fill="#6b7280">• Запуск лише тих тестів,</text>
  <text x="482" y="203" font-size="11" fill="#6b7280">  що проходять крізь diff</text>

  <rect x="472" y="228" width="180" height="102" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="482" y="249" font-size="12" font-weight="700" fill="#1a1a1a">Результат прогону:</text>
  <text x="482" y="271" font-size="11" font-weight="700" fill="#27ae60">✔ Killed (вбито):</text>
  <text x="482" y="288" font-size="11" fill="#6b7280">  тест упав (баг виявлено)</text>
  <text x="482" y="307" font-size="11" font-weight="700" fill="#c0392b">✖ Survived (вижив):</text>
  <text x="482" y="322" font-size="11" fill="#6b7280">  тест пройшов (пропуск)</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="660" y1="208" x2="682" y2="208" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ЕТАП 4: Оцінка та поріг DoD -->
  <rect x="686" y="76" width="244" height="264" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="694" y="84" width="228" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="808" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">4. Порівняння з порогом DoD</text>

  <rect x="694" y="124" width="228" height="50" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="808" y="143" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1a1a">Score = Killed / (Killed + Survived)</text>
  <text x="808" y="162" font-size="11" font-weight="700" text-anchor="middle" fill="#2457d6">Поріг приймання (DoD) ≥ 80%</text>

  <rect x="694" y="180" width="228" height="68" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="704" y="200" font-size="12" font-weight="700" fill="#27ae60">Score ≥ 80% — PR ПРИЙНЯТО</text>
  <text x="704" y="220" font-size="11" fill="#1a1a1a">✔ Тести підрядника надійні</text>
  <text x="704" y="238" font-size="11" fill="#6b7280">  Дозвіл на автоматичне злиття</text>

  <rect x="694" y="254" width="228" height="76" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="704" y="274" font-size="12" font-weight="700" fill="#c0392b">Score &lt; 80% — БЛОКУВАННЯ PR</text>
  <text x="704" y="294" font-size="11" fill="#1a1a1a">✖ Фіктивні тести (без assert)</text>
  <text x="704" y="313" font-size="11" fill="#c0392b">  Автозвіт мутантів підряднику</text>

  <!-- НИЖНЯ ПАНЕЛЬ: Порівняння конвеєрів -->
  <rect x="30" y="356" width="900" height="140" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="378" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Економічний ефект: чому приймальний гейт обов'язково має бути диференційним</text>

  <rect x="44" y="388" width="426" height="96" rx="6" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="56" y="408" font-size="12" font-weight="700" fill="#c0392b">Традиційний повний прогін (Full Mutation Testing):</text>
  <text x="56" y="428" font-size="11" fill="#1a1a1a">• Мутується весь моноліт: 4 800+ мутантів по всій кодовій базі</text>
  <text x="56" y="446" font-size="11" fill="#6b7280">• Тривалість: 3–5 годин у CI | Блокує роботу команди й чергу PR</text>
  <text x="56" y="466" font-size="11" font-weight="700" fill="#c0392b">✖ Непридатний як обов'язковий блокуючий гейт на кожен PR</text>

  <rect x="490" y="388" width="426" height="96" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="502" y="408" font-size="12" font-weight="700" fill="#27ae60">Диференційний гейт (PR-Scoped Mutation Gate):</text>
  <text x="502" y="428" font-size="11" fill="#1a1a1a">• Мутуються лише рядки з git diff: 16 мутантів у пул-реквесті</text>
  <text x="502" y="446" font-size="11" fill="#6b7280">• Тривалість: 45–90 секунд у CI | Миттєвий об'єктивний зворотний зв'язок</text>
  <text x="502" y="466" font-size="11" font-weight="700" fill="#27ae60">✔ Об'єктивне приймання: надійний захист від фіктивних тестів</text>
</svg>
