<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Крива ентропії інтеграції: ціна відкладеного злиття</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Кількість конфліктів та вартість їх усунення зростають експоненційно до часу ізоляції гілок</text>

  <!-- Графік: осі -->
  <line x1="80" y1="390" x2="600" y2="390" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <line x1="80" y1="390" x2="80" y2="105" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <!-- Підписи осей -->
  <text x="340" y="445" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">Час роботи в ізоляції без злиття в спільну магістраль →</text>
  <text x="92" y="98" font-size="12" font-weight="bold" fill="#6b7280">Складність і ризик інтеграції ↑</text>

  <!-- Поділки часу по осі X -->
  <line x1="160" y1="386" x2="160" y2="394" stroke="#6b7280" stroke-width="1"/>
  <text x="160" y="414" font-size="12" text-anchor="middle" fill="#6b7280">1 день</text>

  <line x1="260" y1="386" x2="260" y2="394" stroke="#6b7280" stroke-width="1"/>
  <text x="260" y="414" font-size="12" text-anchor="middle" fill="#6b7280">1 тиждень</text>

  <line x1="370" y1="386" x2="370" y2="394" stroke="#6b7280" stroke-width="1"/>
  <text x="370" y="414" font-size="12" text-anchor="middle" fill="#6b7280">1 місяць</text>

  <line x1="490" y1="386" x2="490" y2="394" stroke="#6b7280" stroke-width="1"/>
  <text x="490" y="414" font-size="12" text-anchor="middle" fill="#6b7280">3–6 місяців</text>

  <!-- Червона експоненційна крива (Відкладене злиття) -->
  <path d="M 80 380 C 230 378 350 365 420 310 C 470 270 515 205 540 135" fill="none" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arr-red)"/>

  <!-- Зелена лінія (Неперервна інтеграція) -->
  <path d="M 80 375 L 560 340" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>

  <!-- Легенда / Пояснення кривих у вільній зоні графіка -->
  <rect x="110" y="140" width="260" height="64" rx="4" fill="#fdecea" stroke="#e0b4b0"/>
  <text x="122" y="162" font-size="12" font-weight="bold" fill="#c0392b">Відкладене злиття (Waterfall)</text>
  <text x="122" y="180" font-size="12" fill="#1a1a1a">Експоненційне зростання конфліктів;</text>
  <text x="122" y="194" font-size="12" fill="#6b7280">місяці на виправлення розбіжностей</text>

  <rect x="110" y="220" width="260" height="64" rx="4" fill="#e9f7ef" stroke="#bce7cf"/>
  <text x="122" y="242" font-size="12" font-weight="bold" fill="#27ae60">Неперервна інтеграція (CI / XP)</text>
  <text x="122" y="260" font-size="12" fill="#1a1a1a">Лінійна контрольована складність;</text>
  <text x="122" y="274" font-size="12" fill="#6b7280">швидкий зворотний зв'язок 10–15 хв</text>

  <!-- Права панель: 2 картки -->
  <!-- Картка 1: Проблема -->
  <rect x="630" y="96" width="290" height="154" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="642" y="108" width="266" height="30" rx="4" fill="#c0392b"/>
  <text x="775" y="128" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Відкладена інтеграція</text>

  <text x="650" y="156" font-size="12" font-weight="bold" fill="#c0392b">Інтеграційне пекло</text>
  <text x="650" y="174" font-size="12" fill="#1a1a1a">• Конфлікти ростуть лавиноподібно</text>
  <text x="650" y="192" font-size="12" fill="#1a1a1a">• Злиття коду блокує команди на місяці</text>
  <text x="650" y="210" font-size="12" fill="#1a1a1a">• Дефекти виявляються надто пізно</text>
  <text x="650" y="228" font-size="12" fill="#6b7280">• Колосальні перевитрати бюджету</text>

  <!-- Картка 2: Розв'язок -->
  <rect x="630" y="262" width="290" height="154" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="642" y="274" width="266" height="30" rx="4" fill="#27ae60"/>
  <text x="775" y="294" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Неперервна інтеграція</text>

  <text x="650" y="322" font-size="12" font-weight="bold" fill="#27ae60">Керований ризик</text>
  <text x="650" y="340" font-size="12" fill="#1a1a1a">• Злиття у спільний код щодня</text>
  <text x="650" y="358" font-size="12" fill="#1a1a1a">• Зворотний зв'язок за лічені хвилини</text>
  <text x="650" y="376" font-size="12" fill="#1a1a1a">• Регресійні тести тримають якість</text>
  <text x="650" y="394" font-size="12" fill="#6b7280">• Нуль прихованого технічного боргу</text>
</svg>
