<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- БІЛА ПІДКЛАДКА НА ВСЕ ПОЛОТНО -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Компроміс розміру батчу коду: криві сукупних витрат C_total(S)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Суперпозиція витрат перемикання контексту, затримки черги та ризику витоку дефектів на прод</text>

  <!-- ==================== ЛІВА ОБЛАСТЬ: ГРАФІК КРИВИХ ВИТРАТ ==================== -->
  <rect x="24" y="74" width="616" height="364" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="332" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Графік суперпозиції компонент вартості рецензування</text>

  <!-- Легенда кривих -->
  <rect x="38" y="110" width="588" height="32" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Легенда 1: C_total -->
  <line x1="48" y1="126" x2="68" y2="126" stroke="#1a1a1a" stroke-width="3"/>
  <text x="74" y="130" font-size="12" font-weight="700" fill="#1a1a1a">C_total (сума)</text>

  <!-- Легенда 2: C_trans -->
  <line x1="186" y1="126" x2="206" y2="126" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="212" y="130" font-size="12" fill="#6b7280">C_trans (~ 1/S)</text>

  <!-- Легенда 3: C_hold -->
  <line x1="326" y1="126" x2="346" y2="126" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="352" y="130" font-size="12" fill="#2457d6">C_hold (черга ~ S)</text>

  <!-- Легенда 4: C_defect -->
  <line x1="480" y1="126" x2="500" y2="126" stroke="#c0392b" stroke-width="2"/>
  <text x="506" y="130" font-size="12" font-weight="700" fill="#c0392b">C_defect (~ e^(k·S))</text>

  <!-- Зона оптимуму (200-400 LOC) -->
  <rect x="220" y="154" width="130" height="226" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="285" y="172" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Оптимум: 200–400 LOC</text>
  <text x="285" y="188" font-size="12" fill="#27ae60" text-anchor="middle">Темп до 300 ряд/год</text>

  <!-- Осі координат -->
  <!-- Вісь Y (Вартість C) -->
  <line x1="80" y1="380" x2="80" y2="154" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="88" y="164" font-size="12" font-weight="700" fill="#1a1a1a">Вартість C(S)</text>

  <!-- Вісь X (Розмір батчу S) -->
  <line x1="80" y1="380" x2="610" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="610" y="374" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Розмір батчу S (LOC у PR)</text>

  <!-- Поділки осі X -->
  <text x="80" y="398" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <line x1="220" y1="380" x2="220" y2="385" stroke="#6b7280" stroke-width="1.2"/>
  <text x="220" y="398" font-size="12" fill="#6b7280" text-anchor="middle">200</text>
  <line x1="285" y1="380" x2="285" y2="385" stroke="#27ae60" stroke-width="1.5"/>
  <text x="285" y="416" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">S* ≈ 300</text>
  <line x1="350" y1="380" x2="350" y2="385" stroke="#6b7280" stroke-width="1.2"/>
  <text x="350" y="398" font-size="12" fill="#6b7280" text-anchor="middle">400</text>
  <line x1="470" y1="380" x2="470" y2="385" stroke="#6b7280" stroke-width="1.2"/>
  <text x="470" y="398" font-size="12" fill="#6b7280" text-anchor="middle">600</text>
  <line x1="570" y1="380" x2="570" y2="385" stroke="#c0392b" stroke-width="1.2"/>
  <text x="570" y="398" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">800+</text>

  <!-- Крива 1: C_trans(S) — спадна гіпербола -->
  <path d="M96,190 C120,290 180,350 590,372" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4"/>

  <!-- Крива 2: C_hold(S) — лінійне зростання затримки черги -->
  <line x1="80" y1="375" x2="590" y2="255" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="6,3"/>

  <!-- Крива 3: C_defect(S) — експоненційне зростання витоку дефектів -->
  <path d="M80,378 C240,378 360,372 440,320 C500,275 550,215 585,165" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Крива 4: C_total(S) — результуюча U-подібна крива -->
  <path d="M96,170 C140,245 200,295 285,295 C370,295 450,240 560,155" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Пунктир від мінімуму до осі X -->
  <line x1="285" y1="295" x2="285" y2="380" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Точка мінімуму -->
  <circle cx="285" cy="295" r="5" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
  <text x="285" y="285" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Мінімум витрат</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: АНАЛІТИКА ТА CI GATE ==================== -->
  <rect x="656" y="74" width="280" height="364" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="796" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Аналітичний базис прийому робіт</text>
  <text x="796" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Математичне обґрунтування меж PR</text>

  <!-- Картка 1: Складові вартості -->
  <rect x="670" y="130" width="252" height="96" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="682" y="148" font-size="12" font-weight="700" fill="#1a1a1a">Складові формули C_total(S):</text>
  <text x="682" y="168" font-size="12" fill="#6b7280">1. C_trans ~ 1/S (накладні дії в CI)</text>
  <text x="682" y="188" font-size="12" fill="#2457d6">2. C_hold ~ S (простій задач у черзі)</text>
  <text x="682" y="208" font-size="12" fill="#c0392b">3. C_defect ~ e^(k·S) (пропущені баги)</text>

  <!-- Картка 2: Пастка великого злиття -->
  <rect x="670" y="234" width="252" height="96" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="682" y="252" font-size="12" font-weight="700" fill="#c0392b">Пастка великого злиття (&gt; 400 LOC):</text>
  <text x="682" y="272" font-size="12" fill="#1a1a1a">• Експоненційне падіння уваги</text>
  <text x="682" y="292" font-size="12" fill="#1a1a1a">• Формальний апрув без читання коду</text>
  <text x="682" y="312" font-size="12" fill="#6b7280">• Вартість фіксу на проді в 10–30 разів вища</text>

  <!-- Картка 3: Порогові гейти CI -->
  <rect x="670" y="338" width="252" height="88" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="796" y="358" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Митні пороги в CI (Quality Gate)</text>
  <text x="796" y="378" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">S &lt;= 300 LOC: Зелений коридор</text>
  <text x="796" y="396" font-size="12" fill="#2457d6" text-anchor="middle">300–400 LOC: Вимагає 2+ рев'юерів</text>
  <text x="796" y="414" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">&gt; 400 LOC: Блок PR (вимога спліту)</text>
</svg>
