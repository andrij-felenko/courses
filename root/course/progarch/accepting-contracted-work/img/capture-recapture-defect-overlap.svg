<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Оцінювач Лінкольна-Петерсена: модель Capture-Recapture для аудиту PR</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Статистика перетину зауважень двох рецензентів унаочнює розрахунок невидимих багів N_rem</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ДІАГРАМА ПЕРЕТИНУ ДЕФЕКТІВ ==================== -->
  <rect x="25" y="66" width="465" height="374" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="88" font-size="13" font-weight="700" fill="#1a1a1a">Простір дефектів у коді підрядника (N)</text>
  <text x="40" y="106" font-size="12" fill="#6b7280">Імовірнісна оцінка за перетином двох незалежних рецензій</text>

  <!-- Область N (Загальна популяція дефектів) -->
  <rect x="40" y="120" width="435" height="255" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="52" y="140" font-size="12" font-weight="700" fill="#c0392b">Загальна популяція дефектів N (оцінка = 45)</text>
  <text x="52" y="156" font-size="12" fill="#c0392b">Зона невидимих багів N_rem = 22 (приховані в коді)</text>

  <!-- Коло 1: Рецензент 1 -->
  <circle cx="190" cy="260" r="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" fill-opacity="0.85"/>

  <!-- Коло 2: Рецензент 2 -->
  <circle cx="285" cy="260" r="80" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" fill-opacity="0.85"/>

  <!-- Тексти всередині Кола 1 -->
  <text x="150" y="252" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">n1 = 15</text>
  <text x="150" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Рев'юер 1</text>
  <text x="150" y="284" font-size="12" fill="#6b7280" text-anchor="middle">11 багів</text>

  <!-- Тексти всередині Кола 2 -->
  <text x="325" y="252" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">n2 = 12</text>
  <text x="325" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">Рев'юер 2</text>
  <text x="325" y="284" font-size="12" fill="#6b7280" text-anchor="middle">8 багів</text>

  <!-- Тексти в зоні перетину m -->
  <text x="238" y="252" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">m = 4</text>
  <text x="238" y="268" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Спільні</text>
  <text x="238" y="284" font-size="12" fill="#1a1a1a" text-anchor="middle">баги</text>

  <!-- Підпис внизу області N -->
  <text x="257" y="362" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Невидимі дефекти підрядника: N_rem = N - (n1 + n2 - m) = 22</text>

  <!-- Підсумок під областю N -->
  <text x="40" y="398" font-size="12" font-weight="700" fill="#1a1a1a">Виявлено: 23 баги (51%) | Пропущено в коді: 22 баги (49%)</text>
  <text x="40" y="416" font-size="12" fill="#c0392b">Малий перетин m=4 сигналізує про високу кількість прихованих багів</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: РОЗРАХУНОК ТА ПРАВИЛА ==================== -->
  <rect x="505" y="66" width="430" height="374" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Картка 1: Формули оцінювача -->
  <rect x="517" y="80" width="405" height="104" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="528" y="102" font-size="13" font-weight="700" fill="#1a1a1a">1. Математична модель Лінкольна-Петерсена</text>
  <text x="528" y="122" font-size="12" fill="#1a1a1a">• n1, n2 — дефекти, знайдені двома незалежними рев'юерами</text>
  <text x="528" y="140" font-size="12" fill="#1a1a1a">• m — спільні зауваження, знайдені обома (зона перетину)</text>
  <text x="528" y="158" font-size="12" font-weight="700" fill="#2457d6">• Оцінка всієї популяції: N = (n1 * n2) / m</text>
  <text x="528" y="174" font-size="12" font-weight="700" fill="#c0392b">• Приховані баги: N_rem = N - (n1 + n2 - m)</text>

  <!-- Картка 2: Числовий приклад розрахунку -->
  <rect x="517" y="194" width="405" height="106" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="528" y="216" font-size="13" font-weight="700" fill="#c0392b">2. Розрахунок залишку для PR підрядника</text>
  <text x="528" y="238" font-size="12" fill="#1a1a1a">• n1 = 15 (архітектура), n2 = 12 (тести), m = 4 (спільні)</text>
  <text x="528" y="258" font-size="12" fill="#1a1a1a">• Оцінка дефектів: N = (15 * 12) / 4 = 45 дефектів</text>
  <text x="528" y="278" font-size="12" fill="#1a1a1a">• Виявлено унікальних: 15 + 12 - 4 = 23 дефекти</text>
  <text x="528" y="294" font-size="12" font-weight="700" fill="#c0392b">Залишок у коді: N_rem = 45 - 23 = 22 невидимі дефекти</text>

  <!-- Картка 3: Правила Definition of Done -->
  <rect x="517" y="310" width="405" height="114" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="528" y="332" font-size="13" font-weight="700" fill="#27ae60">3. Архітектурні правила приймання (DoD)</text>
  <text x="528" y="354" font-size="12" font-weight="700" fill="#1a1a1a">• Малий перетин m — ознака сліпої зони, а не чистоти</text>
  <text x="528" y="372" font-size="12" fill="#1a1a1a">• Поріг якості: якщо N_rem > 5, PR блокується на доопрацювання</text>
  <text x="528" y="392" font-size="12" fill="#2457d6">• Обмеження розміру: батчі до 300 рядків коду (S ≤ 300 LOC)</text>
  <text x="528" y="408" font-size="12" fill="#6b7280">Тільки малі PR дають змогу надійно вичерпати дефекти</text>
</svg>
