<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- БІЛА ПІДКЛАДКА НА ВСЕ ПОЛОТНО -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Життєвий цикл мутаційного тестування та розрахунок Mutation Score</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Від синтаксичного дерева й генерації мутантів до класифікації стійкості тестів і формули бала</text>

  <!-- ==================== РЯДОК 1: 4 ЕТАПИ КОНВЕЄРА ==================== -->

  <!-- Блок 1: Парсинг в AST -->
  <rect x="24" y="70" width="216" height="134" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="34" y="90" font-size="13" font-weight="700" fill="#1a1a1a">1. Парсинг в AST</text>
  <text x="34" y="107" font-size="12" fill="#6b7280">Синтаксичний аналіз</text>
  <rect x="34" y="116" width="196" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="42" y="136" font-size="12" fill="#1a1a1a">• Сирцевий код програми</text>
  <text x="42" y="154" font-size="12" fill="#1a1a1a">• Побудова дерева AST</text>
  <text x="42" y="172" font-size="12" fill="#2457d6">• Пошук точок мутації</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="240" y1="137" x2="254" y2="137" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 2: Генерація мутантів -->
  <rect x="256" y="70" width="216" height="134" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="266" y="90" font-size="13" font-weight="700" fill="#2457d6">2. Генерація мутантів</text>
  <text x="266" y="107" font-size="12" fill="#6b7280">Мутаційні оператори</text>
  <rect x="266" y="116" width="196" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="274" y="136" font-size="12" fill="#1a1a1a">• Оператори: + → -, * → /</text>
  <text x="274" y="154" font-size="12" fill="#1a1a1a">• Умови: &gt;= → &gt;, == → !=</text>
  <text x="274" y="172" font-size="12" fill="#2457d6">• Повернення: true → false</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="472" y1="137" x2="486" y2="137" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 3: Виконання тестів -->
  <rect x="488" y="70" width="216" height="134" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="498" y="90" font-size="13" font-weight="700" fill="#1a1a1a">3. Виконання тестів</text>
  <text x="498" y="107" font-size="12" fill="#6b7280">Запуск тест-сьюту</text>
  <rect x="498" y="116" width="196" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="506" y="136" font-size="12" fill="#1a1a1a">• 1 мутант = 1 прогін тестів</text>
  <text x="506" y="154" font-size="12" fill="#1a1a1a">• Ізольований пісочник</text>
  <text x="506" y="172" font-size="12" fill="#2457d6">• Зупинка при 1-му падінні</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="704" y1="137" x2="718" y2="137" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 4: Класифікація -->
  <rect x="720" y="70" width="216" height="134" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="730" y="90" font-size="13" font-weight="700" fill="#1a1a1a">4. Класифікація</text>
  <text x="730" y="107" font-size="12" fill="#6b7280">Фіксація вердиктів</text>
  <rect x="730" y="116" width="196" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="738" y="136" font-size="12" font-weight="700" fill="#27ae60">• Вбиті мутанти (Killed)</text>
  <text x="738" y="154" font-size="12" font-weight="700" fill="#c0392b">• Мутанти, що вижили</text>
  <text x="738" y="172" font-size="12" fill="#6b7280">• Таймаути (Timed out)</text>

  <!-- Вертикальна стрілка від блоку 4 до правої панелі формули -->
  <line x1="828" y1="204" x2="828" y2="232" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="838" y="222" font-size="12" fill="#6b7280">Підрахунок K та S</text>

  <!-- ==================== РЯДОК 2: ДЕТАЛІ ТА РОЗРАХУНОК ==================== -->

  <!-- Ліва частина: Анатомія мутантів (Вбитий vs Вижив) -->
  <rect x="24" y="236" width="446" height="270" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="36" y="258" font-size="13" font-weight="700" fill="#1a1a1a">Анатомія мутантів: Вбиті проти тих, що вижили</text>
  <text x="36" y="275" font-size="12" fill="#6b7280">Критерій виявлення штучних дефектів набором тестів підрядника</text>

  <!-- Зелена картка: Вбитий мутант -->
  <rect x="36" y="286" width="422" height="96" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="48" y="306" font-size="12" font-weight="700" fill="#27ae60">✓ ВБИТИЙ МУТАНТ (Killed) — Тест якісний і чутливий</text>
  <text x="48" y="324" font-size="12" fill="#1a1a1a">Поведінка: Тести впали (AssertionError або Runtime Exception)</text>
  <text x="48" y="342" font-size="12" fill="#1a1a1a">Приклад: Заміна &gt;= на &gt; призвела до падіння тесту граничного стану</text>
  <text x="48" y="360" font-size="12" fill="#27ae60">Висновок: Тест реально перевіряє контракт і захищає логіку</text>

  <!-- Червона картка: Мутант, що вижив -->
  <rect x="36" y="394" width="422" height="96" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="48" y="414" font-size="12" font-weight="700" fill="#c0392b">✗ МУТАНТ, ЩО ВИЖИВ (Survived) — Сліпа зона тестів</text>
  <text x="48" y="432" font-size="12" fill="#1a1a1a">Поведінка: Тести успішно пройшли (Green), попри зміну поведінки</text>
  <text x="48" y="450" font-size="12" fill="#1a1a1a">Приклад: Метод повертає null або 0, але тест не має асерта на результат</text>
  <text x="48" y="468" font-size="12" fill="#c0392b">Висновок: Фіктивне покриття коду; дефект буде пропущено в прод</text>

  <!-- Права частина: Формула Mutation Score та митний поріг -->
  <rect x="490" y="236" width="446" height="270" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="502" y="258" font-size="13" font-weight="700" fill="#2457d6">Формула розрахунку Mutation Score (MS)</text>
  <text x="502" y="275" font-size="12" fill="#6b7280">Математичний оракул для об'єктивного приймання коду в CI</text>

  <!-- Плашка формули -->
  <rect x="502" y="286" width="422" height="96" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="514" y="296" width="398" height="34" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="713" y="318" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">MS = ( Вбиті мутанти [K] / Усього мутантів [M] ) × 100%</text>
  <text x="514" y="346" font-size="12" fill="#1a1a1a">K — кількість виявлених дефектів (вбиті мутанти + таймаути)</text>
  <text x="514" y="364" font-size="12" fill="#6b7280">M — загальна кількість мутантів без еквівалентних (M = K + Survived)</text>

  <!-- Плашка митного гейту DoD -->
  <rect x="502" y="394" width="422" height="96" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="514" y="414" font-size="12" font-weight="700" fill="#1a1a1a">Митний поріг якості в CI (Definition of Done):</text>
  <text x="514" y="432" font-size="12" fill="#1a1a1a">Приклад: Згенеровано 120 мутантів: 102 вбито, 18 вижило → MS = 85%</text>
  <text x="514" y="450" font-size="12" font-weight="700" fill="#27ae60">Вимога договору: MS ≥ 80% → СХВАЛЕНО (Merge Allowed)</text>
  <text x="514" y="468" font-size="12" fill="#c0392b">Якщо MS &lt; 80% → Блокування PR; підрядник дописує асерти</text>
</svg>
