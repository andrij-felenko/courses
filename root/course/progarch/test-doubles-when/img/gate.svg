<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спершу — чи потрібен тут дубль узагалі</text>
<rect x="60.0" y="176.0" width="190.0" height="92.0" rx="6" fill="#fbfcfd" stroke="#1a1a1a" stroke-width="2.0"/><text x="155.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">співавтор,</tspan><tspan x="155.0" dy="17.6">від якого залежить</tspan><tspan x="155.0" dy="17.6">твій код</tspan></text>
<line x1="252.0" y1="222.0" x2="322.0" y2="222.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="324.0" y="96.0" width="300.0" height="252.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="474.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">чи він…</text>
<text x="350.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start">•</text>
<text x="370.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">повільний</text>
<text x="350.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start">•</text>
<text x="370.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">недетермінований</text>
<text x="350.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start">•</text>
<text x="370.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">має незворотний ефект</text>
<text x="350.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start">•</text>
<text x="370.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">ще не існує / недосяжний</text>
<line x1="624.0" y1="156.0" x2="700.0" y2="128.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="668.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">хоч один</text>
<rect x="704.0" y="92.0" width="250.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="829.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="829.0" dy="0.0">ДУБЛЬ на шві —</tspan><tspan x="829.0" dy="16.2">найдешевший, що дає</tspan><tspan x="829.0" dy="16.2">керування й спостереження</tspan></text>
<line x1="624.0" y1="288.0" x2="700.0" y2="320.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="660.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">жоден</text>
<rect x="704.0" y="284.0" width="250.0" height="96.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="829.0" y="320.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="829.0" dy="0.0">бери СПРАВЖНІЙ —</tspan><tspan x="829.0" dy="16.2">насамперед власну</tspan><tspan x="829.0" dy="16.2">чисту логіку</tspan></text>
</svg>