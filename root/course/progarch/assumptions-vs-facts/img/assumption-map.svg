<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="680" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мапа припущень: що перевіряти першим</text>
<rect x="150.0" y="80.0" width="225.0" height="200.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="262.5" y="157.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">ПЕРЕВІР ПЕРШИМ</tspan><tspan x="262.5" dy="18.2"></tspan><tspan x="262.5" dy="18.2">дорого помилитись,</tspan><tspan x="262.5" dy="18.2">мало впевненості</tspan></text>
<rect x="375.0" y="80.0" width="225.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="487.5" y="157.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Спирайся,</tspan><tspan x="487.5" dy="18.2">але тримай знак</tspan><tspan x="487.5" dy="18.2"></tspan><tspan x="487.5" dy="18.2">(може змінитись)</tspan></text>
<rect x="150.0" y="280.0" width="225.0" height="200.0" rx="6" fill="#f7f8fa" stroke="#333333" stroke-width="1.5"/><text x="262.5" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">Не марнуй перевірку</tspan><tspan x="262.5" dy="18.2"></tspan><tspan x="262.5" dy="18.2">прийми як є</tspan></text>
<rect x="375.0" y="280.0" width="225.0" height="200.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="487.5" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Це вже факт</tspan><tspan x="487.5" dy="18.2"></tspan><tspan x="487.5" dy="18.2">не стеж як за ризиком</tspan></text>
<line x1="150.0" y1="502.0" x2="600.0" y2="502.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="375.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">впевненість, що припущення істинне →</text>
<line x1="128.0" y1="480.0" x2="128.0" y2="80.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="78.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="78.0" dy="0.0">вплив,</tspan><tspan x="78.0" dy="16.2">якщо</tspan><tspan x="78.0" dy="16.2">хибне  ↑</tspan></text>
</svg>