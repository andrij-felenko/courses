<text x="950.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">лише вхід, не глибину</text>
<rect x="40.0" y="424.0" width="1060.0" height="150.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="570.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне питання: чи потрібно знати, ЩО означає виклик?</text>
<text x="570.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">так → застосунок      ·      ні, лише труба → сітка/сайдкар      ·      груба брама на вході → шлюз</text>
<text x="570.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">і головне — кожен прийом живе рівно в ОДНОМУ домі, інакше шари перемножуються</text>
