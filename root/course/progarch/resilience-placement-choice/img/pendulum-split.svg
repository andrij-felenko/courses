<text x="510.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкол не за модою, а за знанням</text>
<text x="510.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що вирішується самими байтами → сітка   ·   що вимагає сенсу виклику → застосунок</text>
