<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1050" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="525.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек повторів множиться, а не додається</text>
<text x="44.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">один запит користувача</text>
<rect x="470.0" y="96.0" width="17.8" height="46.0" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="501.8" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="start" font-weight="700">= 1</text>
<text x="44.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">+ шлюз повторює ×3</text>
<rect x="470.0" y="178.0" width="53.3" height="46.0" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="537.3" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="start" font-weight="700">= 3</text>
<text x="44.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">+ сайдкар сітки повторює ×3</text>
<rect x="470.0" y="260.0" width="160.0" height="46.0" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="644.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="start" font-weight="700">= 9</text>
<text x="44.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">+ застосунок повторює ×3</text>
<rect x="470.0" y="342.0" width="480.0" height="46.0" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="964.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="start" font-weight="700">= 27</text>
<rect x="642.0" y="124.5" width="300.0" height="51.1" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="792.0" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="792.0" dy="0.0">3 × 3 × 3 = 27</tspan><tspan x="792.0" dy="17.6">додай 4-й шар → 3⁴ = 81</tspan></text>
<rect x="300.0" y="452.0" width="500.0" height="54.0" rx="8" fill="#fff6f5" stroke="#c0392b" stroke-width="2.0"/>
<text x="550.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">повільна залежність B — уже задихається</text>
<line x1="690.0" y1="388.0" x2="620.0" y2="450.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>