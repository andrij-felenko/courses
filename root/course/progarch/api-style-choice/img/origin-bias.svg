<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Походження — це упередження</text>
<text x="230.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ПОЛОГОВИЙ БІЛЬ</text>
<text x="580.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">СТИЛЬ</text>
<text x="915.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ВРОДЖЕНЕ УПЕРЕДЖЕННЯ · РІДНЕ СЕРЕДОВИЩЕ</text>
<rect x="50.0" y="84.0" width="360.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Веб уже масштабувався</tspan><tspan x="230.0" dy="16.9">сам; SOAP/WS-*</tspan><tspan x="230.0" dy="16.9">дедалі тяжчали</tspan></text>
<line x1="416.0" y1="130.0" x2="494.0" y2="130.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="500.0" y="110.5" width="160.0" height="39.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/><text x="580.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">REST</tspan></text>
<line x1="666.0" y1="130.0" x2="734.0" y2="130.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="740.0" y="84.0" width="380.0" height="92.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="930.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">відкритість, без стану, єдині</tspan><tspan x="930.0" dy="16.9">дієслова, їде на HTTP-інфрі —</tspan><tspan x="930.0" dy="16.9">під чужих некерованих клієнтів</tspan></text>
<rect x="50.0" y="212.0" width="360.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="245.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">30 років мрії RPC</tspan><tspan x="230.0" dy="16.9">(Нельсон → CORBA) +</tspan><tspan x="230.0" dy="16.9">внутрішня шкала Google</tspan></text>
<line x1="416.0" y1="258.0" x2="494.0" y2="258.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="500.0" y="238.5" width="160.0" height="39.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="580.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">gRPC</tspan></text>
<line x1="666.0" y1="258.0" x2="734.0" y2="258.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="740.0" y="212.0" width="380.0" height="92.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="930.0" y="245.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">щільний типізований контракт,</tspan><tspan x="930.0" dy="16.9">швидкість, генерований клієнт —</tspan><tspan x="930.0" dy="16.9">свій сервіс до свого сервіса</tspan></text>
<rect x="50.0" y="340.0" width="360.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="373.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">мобільна стрічка задихалась:</tspan><tspan x="230.0" dy="16.9">багато екранів, кепський</tspan><tspan x="230.0" dy="16.9">канал, недобір і перебір</tspan></text>
<line x1="416.0" y1="386.0" x2="494.0" y2="386.0" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="500.0" y="366.5" width="160.0" height="39.0" rx="6" fill="#f2ecfb" stroke="#7c3aed" stroke-width="2.0"/><text x="580.0" y="392.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">GraphQL</tspan></text>
<line x1="666.0" y1="386.0" x2="734.0" y2="386.0" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="740.0" y="340.0" width="380.0" height="92.0" rx="6" fill="#f2ecfb" stroke="#7c3aed" stroke-width="1.5"/><text x="930.0" y="373.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">форму відповіді малює сам</tspan><tspan x="930.0" dy="16.9">клієнт — один багатий граф</tspan><tspan x="930.0" dy="16.9">під багато різних облич</tspan></text>
</svg>