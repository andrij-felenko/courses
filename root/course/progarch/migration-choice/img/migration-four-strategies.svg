<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння чотирьох фундаментальних стратегій міграції систем</text>
<rect x="40.0" y="40.0" width="440.0" height="190.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="260.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle"><tspan x="260.0" dy="0.0">1. Big Bang (Одномоментна заміна)</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6">• Одномоментне перемикання всього трафіку</tspan><tspan x="260.0" dy="15.6">• Високий ризик, точка неповернення</tspan><tspan x="260.0" dy="15.6">• Придатний лише для простіших або некритичних систем</tspan></text>
<rect x="520.0" y="40.0" width="440.0" height="190.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="740.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle"><tspan x="740.0" dy="0.0">2. Strangler Fig (Поступове витіснення)</tspan><tspan x="740.0" dy="15.6"></tspan><tspan x="740.0" dy="15.6">• Огородження legacy через API Gateway / Proxy</tspan><tspan x="740.0" dy="15.6">• Інкрементальне винесення методів та доменів</tspan><tspan x="740.0" dy="15.6">• Безперервний продаж і прозорий rollback</tspan></text>
<rect x="40.0" y="250.0" width="440.0" height="190.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="260.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1565c0" text-anchor="middle"><tspan x="260.0" dy="0.0">3. Dark Launching / Shadowing (Тіньовий запуск)</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6">• Дублювання реального трафіку без впливу на UX</tspan><tspan x="260.0" dy="15.6">• Порівняння відповідей (Diff Engine) під навантаженням</tspan><tspan x="260.0" dy="15.6">• Ізоляція побічних ефектів (Write Isolation)</tspan></text>
<rect x="520.0" y="250.0" width="440.0" height="190.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="740.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7b1fa2" text-anchor="middle"><tspan x="740.0" dy="0.0">4. Branch by Abstraction (Гілкування в коді)</tspan><tspan x="740.0" dy="15.6"></tspan><tspan x="740.0" dy="15.6">• Внутрішній шов: інтерфейс-абстракція всередині коду</tspan><tspan x="740.0" dy="15.6">• Перемикання реалізацій через Feature Flags</tspan><tspan x="740.0" dy="15.6">• Видалення legacy після стабілізації</tspan></text>
</svg>