<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фази життєвого циклу Branch by Abstraction</text>
<rect x="40.0" y="40.0" width="440.0" height="160.0" rx="6" fill="#eef2f6" stroke="#1e293b" stroke-width="1.5"/><text x="260.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Фаза 1: Огородження інтерфейсом</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6">• Клієнтський код переводиться на Abstraction Interface</tspan><tspan x="260.0" dy="15.6">• Єдина реалізація: Legacy Implementation</tspan><tspan x="260.0" dy="15.6">• Нульова зміна поведінки в продакшні</tspan></text>
<rect x="520.0" y="40.0" width="440.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="740.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1565c0" text-anchor="middle"><tspan x="740.0" dy="0.0">Фаза 2: Нова реалізація та Feature Flag</tspan><tspan x="740.0" dy="15.6"></tspan><tspan x="740.0" dy="15.6">• Додається New Implementation поруч зі старою</tspan><tspan x="740.0" dy="15.6">• Динамічний перемикач (Feature Flag / Config)</tspan><tspan x="740.0" dy="15.6">• Можливість канарейкового перемикання або shadowing</tspan></text>
<rect x="40.0" y="230.0" width="440.0" height="160.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="260.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle"><tspan x="260.0" dy="0.0">Фаза 3: Перемикання на нову систему</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6">• 100% трафіку іде через New Implementation</tspan><tspan x="260.0" dy="15.6">• Стара реалізація залишається як fallback</tspan><tspan x="260.0" dy="15.6">• Спостереження за метриками й стабільністю</tspan></text>
<rect x="520.0" y="230.0" width="440.0" height="160.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="740.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7b1fa2" text-anchor="middle"><tspan x="740.0" dy="0.0">Фаза 4: Зачистка кодової бази</tspan><tspan x="740.0" dy="15.6"></tspan><tspan x="740.0" dy="15.6">• Остаточне видалення Legacy Implementation</tspan><tspan x="740.0" dy="15.6">• Очищення Feature Flag та конфігураторів</tspan><tspan x="740.0" dy="15.6">• Код знову чистий, без слідів міграції</tspan></text>
</svg>