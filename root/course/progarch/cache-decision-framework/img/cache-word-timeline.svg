<text x="788.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-style="italic">саме наймення дало ім'я одній із двох важких речей</text>
</svg>