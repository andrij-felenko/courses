<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="64.0" width="320.0" height="168.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">1965</tspan><tspan x="200.0" dy="18.2">Морис Вілкс описує</tspan><tspan x="200.0" dy="18.2">«slave memory» —</tspan><tspan x="200.0" dy="18.2">малу швидку пам'ять</tspan><tspan x="200.0" dy="18.2">перед великою повільною</tspan></text>
<line x1="200.0" y1="232.0" x2="200.0" y2="297.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="430.0" y="64.0" width="320.0" height="168.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">1968</tspan><tspan x="590.0" dy="18.2">IBM 360/85: інженери пишуть</tspan><tspan x="590.0" dy="18.2">«high-speed buffer»;</tspan><tspan x="590.0" dy="18.2">редактор бере словник</tspan><tspan x="590.0" dy="18.2">синонімів → «cache»</tspan><tspan x="590.0" dy="18.2">(фр. cacher — ховати)</tspan></text>
<line x1="590.0" y1="232.0" x2="590.0" y2="297.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="820.0" y="64.0" width="330.0" height="168.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="985.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">1996–97</tspan><tspan x="985.0" dy="18.2">Тім Брей записує жарт</tspan><tspan x="985.0" dy="18.2">Філа Карлтона: «дві важкі</tspan><tspan x="985.0" dy="18.2">речі — інвалідація кешу</tspan><tspan x="985.0" dy="18.2">й наймення»</tspan></text>
<line x1="985.0" y1="232.0" x2="985.0" y2="297.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="60.0" y1="300.0" x2="1150.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1146.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час →</text>
