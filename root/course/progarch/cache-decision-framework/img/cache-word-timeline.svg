<circle cx="590.0" cy="300.0" r="9.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="985.0" cy="300.0" r="9.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
