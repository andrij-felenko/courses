<rect x="45.0" y="226.0" width="470.0" height="30.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="280.0" y="245.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">таблиця schema_version — память бази про себе</tspan></text>
