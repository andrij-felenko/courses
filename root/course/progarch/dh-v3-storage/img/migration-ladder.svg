<rect x="560.0" y="226.0" width="515.0" height="30.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="817.5" y="245.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="817.5" dy="0.0">накатник run_migrations</tspan></text>
<rect x="560.0" y="266.0" width="515.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="817.5" y="303.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="817.5" dy="0.0">бере лише version &gt; current</tspan><tspan x="817.5" dy="16.9">накочені кроки пропускає — повторний запуск no-op (ідемпотентно)</tspan><tspan x="817.5" dy="16.9">кожен крок — своя транзакція: зміна схеми + відмітка версії разом</tspan></text>
<rect x="45.0" y="392.0" width="1030.0" height="60.0" rx="6" fill="#fbfbe8" stroke="#c9b458" stroke-width="2.0"/><text x="560.0" y="418.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Схема — не застиглий камінь, а живий контракт із лінійною історією: дописується лише з хвоста,</tspan><tspan x="560.0" dy="16.9">тож копії бази — і в розробника, і в проді — сходяться до однієї форми.</tspan></text>
