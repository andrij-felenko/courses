  <polyline points="85.0,350.0 91.8,350.0 98.6,350.0 105.4,350.0 112.2,350.0 119.0,350.0 125.8,350.0 132.6,350.0 139.4,350.0 146.2,350.0 153.0,350.0 159.8,350.0 166.6,350.0 173.4,350.0 180.2,350.0 187.0,350.0 193.8,350.0 200.6,350.0 207.4,350.0 214.2,350.0 221.0,350.0 227.8,350.0 234.6,350.0 241.4,350.0 248.2,350.0 255.0,350.0 261.8,350.0 268.6,350.0 275.4,350.0 282.2,350.0 289.0,350.0 295.8,350.0 302.6,350.0 309.4,350.0 316.2,350.0 323.0,350.0 329.8,350.0 336.6,350.0 343.4,350.0 350.2,350.0 357.0,350.0 363.8,350.0 370.6,350.0 377.4,350.0 384.2,350.0 391.0,350.0 397.8,350.0 404.6,350.0 411.4,350.0 418.2,350.0 425.0,350.0" fill="none" stroke="#27ae60" stroke-width="3"/>

  <text x="390" y="260" font-size="12" font-weight="700" fill="#c0392b">p₉₉ (5.9 с)</text>
  <text x="390" y="298" font-size="12" font-weight="700" fill="#2457d6">p₉₅ (3.3 с)</text>
  <text x="210" y="342" font-size="12" font-weight="700" fill="#27ae60">p₅₀ ≈ 2 мс (медіана стабільна)</text>

  <!-- Приклад з тексту: ρ₂ = 8% -->
  <line x1="153" y1="304" x2="153" y2="350" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="153" cy="304" r="4" fill="#c0392b"/>
  <text x="162" y="250" font-size="12" font-weight="700" fill="#c0392b">ρ₂ = 8%: p₉₉ = 3.3 с</text>

  <!-- ================= ПРАВА ПАНЕЛЬ: Cv = 2.0 ================= -->
  <rect x="492" y="74" width="444" height="328" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка правої панелі -->
  <rect x="504" y="84" width="420" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="714" y="101" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Висока варіативність: Cv = 2.0 (важкі хвости, σ₂ = 2·S̄₂)</text>

  <!-- Зона катастрофічного вибуху затримок -->
  <rect x="598" y="130" width="297" height="220" fill="#fdecea" opacity="0.45"/>
  <text x="746" y="148" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Вибух хвоста: затримки зростають у 2.5 раза!</text>

  <!-- Інформаційна плашка множника в правій панелі -->
  <rect x="604" y="162" width="180" height="54" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="614" y="180" font-size="12" font-weight="700" fill="#c0392b">Фактор дисперсії:</text>
  <text x="614" y="196" font-size="12" font-weight="700" fill="#1a1a1a">(1 + Cv²) / 2 = 2.5</text>
  <text x="614" y="210" font-size="12" fill="#6b7280">Ампліфікація розкиду</text>

  <line x1="548" y1="295" x2="555" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="542" y="299" font-size="12" fill="#6b7280" text-anchor="end">4 с</text>
  <line x1="548" y1="240" x2="555" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="542" y="244" font-size="12" fill="#6b7280" text-anchor="end">8 с</text>
  <line x1="548" y1="185" x2="555" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="542" y="189" font-size="12" fill="#6b7280" text-anchor="end">12 с</text>
  <line x1="548" y1="130" x2="555" y2="130" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="542" y="134" font-size="12" fill="#6b7280" text-anchor="end">16 с</text>
  <line x1="640" y1="350" x2="640" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="640" y="370" font-size="12" fill="#6b7280" text-anchor="middle">10%</text>
  <line x1="725" y1="350" x2="725" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="725" y="370" font-size="12" fill="#6b7280" text-anchor="middle">20%</text>
  <line x1="810" y1="350" x2="810" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="810" y="370" font-size="12" fill="#6b7280" text-anchor="middle">30%</text>
  <line x1="895" y1="350" x2="895" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="895" y="370" font-size="12" fill="#6b7280" text-anchor="middle">40%</text>
  <!-- Осі координат: Права панель -->
  <line x1="555" y1="350" x2="915" y2="350" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="555" y1="350" x2="555" y2="114" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="542" y="354" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="555" y="118" font-size="12" font-weight="700" fill="#1a1a1a">Затримка p_q</text>
  <text x="915" y="386" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Завантаження фоном ρ₂ →</text>

  <line x1="598" y1="350" x2="598" y2="355" stroke="#c0392b" stroke-width="1.5"/>
  <text x="598" y="370" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">5%</text>

  <!-- Криві квантилів: Права панель -->
  <polyline points="555.0,350.0 561.8,350.0 568.6,324.1 575.4,301.8 582.2,286.0 589.0,273.7 595.8,263.7 602.6,255.2 609.4,247.9 616.2,241.4 623.0,235.6 629.8,230.4 636.6,225.6 643.4,221.2 650.2,217.1 657.0,213.3 663.8,209.8 670.6,206.4 677.4,203.3 684.2,200.3 691.0,197.5 697.8,194.8 704.6,192.2 711.4,189.8 718.2,187.5 725.0,185.2 731.8,183.1 738.6,181.0 745.4,179.0 752.2,177.0 759.0,175.2 765.8,173.4 772.6,171.6 779.4,169.9 786.2,168.3 793.0,166.7 799.8,165.2 806.6,163.6 813.4,162.2 820.2,160.7 827.0,159.4 833.8,158.0 840.6,156.7 847.4,155.4 854.2,154.1 861.0,152.9 867.8,151.7 874.6,150.5 881.4,149.3 888.2,148.2 895.0,147.1" fill="none" stroke="#c0392b" stroke-width="2.5"/>
