  <text x="790" y="165" font-size="12" font-weight="700" fill="#c0392b">p₉₉ (14.8 с)</text>
  <text x="815" y="230" font-size="12" font-weight="700" fill="#2457d6">p₉₅ (8.3 с)</text>
  <text x="680" y="342" font-size="12" font-weight="700" fill="#27ae60">p₅₀ ≈ 2 мс (медіана на дні)</text>

  <!-- Приклад з тексту: ρ₂ = 8% при Cv = 2.0 -->
  <line x1="623" y1="236" x2="623" y2="350" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="623" cy="236" r="4" fill="#c0392b"/>
  <text x="632" y="248" font-size="12" font-weight="700" fill="#c0392b">ρ₂ = 8%: p₉₉ = 8.3 с</text>

  <!-- ================= НИЖНІ КАРТКИ ВИСНОВКІВ ================= -->
  <rect x="24" y="418" width="296" height="92" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="36" y="438" font-size="13" font-weight="700" fill="#27ae60">1. Медіана p₅₀: ілюзія безпеки</text>
  <text x="36" y="456" font-size="12" font-weight="700" fill="#1a1a1a">p₅₀ ≈ S₁ = 2 мс (доки ρ₂ &lt; 50%)</text>
  <text x="36" y="474" font-size="12" fill="#6b7280">• Понад 90% викликів не чекають фону</text>
  <text x="36" y="492" font-size="12" fill="#27ae60">• Середні метрики маскують колапс SLA</text>

  <rect x="332" y="418" width="296" height="92" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="344" y="438" font-size="13" font-weight="700" fill="#c0392b">2. Хвости p₉₅ та p₉₉: вибух затримок</text>
  <text x="344" y="456" font-size="12" font-weight="700" fill="#1a1a1a">p_q ≈ S̄₂ · ln(ρ₂ / (1 - q))</text>
  <text x="344" y="474" font-size="12" fill="#6b7280">• При ρ₂ &gt; 5% хвости злітають у секунди</text>
  <text x="344" y="492" font-size="12" fill="#c0392b">• Запити блокуються залишком фону R</text>

  <rect x="640" y="418" width="296" height="92" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="652" y="438" font-size="13" font-weight="700" fill="#2457d6">3. Вплив варіативності часу Cv</text>
  <text x="652" y="456" font-size="12" font-weight="700" fill="#1a1a1a">Множник затримки = (1 + Cv²) / 2</text>
  <text x="652" y="474" font-size="12" fill="#6b7280">• Дисперсія σ₂² поглиблює важкий хвіст</text>
  <text x="652" y="492" font-size="12" fill="#2457d6">• Необхідна ізоляція фронтів (Bulkhead)</text>

</svg>
