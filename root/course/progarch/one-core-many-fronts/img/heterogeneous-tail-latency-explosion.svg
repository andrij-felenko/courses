<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Вибух хвостових затримок у спільному ядрі: розходження квантилів</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Медіана p₅₀ зберігає ілюзію стабільності, тоді як хвости p₉₅ та p₉₉ нелінійно вибухають при зростанні фону ρ₂ та дисперсії Cv</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: Cv = 1.0 ================= -->
  <rect x="24" y="74" width="444" height="328" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка лівої панелі -->
  <rect x="36" y="84" width="420" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="246" y="101" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Помірна варіативність: Cv = 1.0 (експоненційний час, σ₂ = S̄₂)</text>

  <!-- Зона зриву SLA та розходження хвостів (ρ₂ > 0.05) -->
  <rect x="128" y="130" width="297" height="220" fill="#fdecea" opacity="0.45"/>
  <text x="276" y="148" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Зона розходження: фонові блокування ядра</text>

  <!-- Інформаційна плашка формул у лівій панелі -->
  <rect x="136" y="162" width="280" height="54" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="146" y="180" font-size="12" font-weight="700" fill="#1a1a1a">Формули квантилів (S̄₂ = 1.6 с, S₁ = 2 мс):</text>
  <text x="146" y="196" font-size="12" fill="#c0392b">• p₉₉ ≈ 1.6 · ln(ρ₂ / 0.01)    (при ρ₂ &gt; 1%)</text>
  <text x="146" y="210" font-size="12" fill="#2457d6">• p₉₅ ≈ 1.6 · ln(ρ₂ / 0.05)    (при ρ₂ &gt; 5%)</text>

  <line x1="78" y1="295" x2="85" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="72" y="299" font-size="12" fill="#6b7280" text-anchor="end">4 с</text>
  <line x1="78" y1="240" x2="85" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="72" y="244" font-size="12" fill="#6b7280" text-anchor="end">8 с</text>
  <line x1="78" y1="185" x2="85" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="72" y="189" font-size="12" fill="#6b7280" text-anchor="end">12 с</text>
  <line x1="78" y1="130" x2="85" y2="130" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="72" y="134" font-size="12" fill="#6b7280" text-anchor="end">16 с</text>
  <line x1="170" y1="350" x2="170" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="170" y="370" font-size="12" fill="#6b7280" text-anchor="middle">10%</text>
  <line x1="255" y1="350" x2="255" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="370" font-size="12" fill="#6b7280" text-anchor="middle">20%</text>
  <line x1="340" y1="350" x2="340" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="340" y="370" font-size="12" fill="#6b7280" text-anchor="middle">30%</text>
  <line x1="425" y1="350" x2="425" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="425" y="370" font-size="12" fill="#6b7280" text-anchor="middle">40%</text>
  <!-- Осі координат: Ліва панель -->
  <line x1="85" y1="350" x2="445" y2="350" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="85" y1="350" x2="85" y2="114" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="72" y="354" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="85" y="118" font-size="12" font-weight="700" fill="#1a1a1a">Затримка p_q</text>
  <text x="445" y="386" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Завантаження фоном ρ₂ →</text>

  <!-- Поріг відриву хвостів ρ₂ = 5% -->
  <line x1="128" y1="350" x2="128" y2="355" stroke="#c0392b" stroke-width="1.5"/>
  <text x="128" y="370" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">5%</text>

