<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Трансляція доменних результатів у структури протоколів</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Бар'єр ізоляції блокує витік деталей ядра та транслює канонічні типи в HTTP, черги і CLI</text>

  <!-- ======================================================================= -->
  <!-- КОЛОНКА 1: ДОМЕННЕ ЯДРО (ВХІДНИЙ ПОРТ) (x: 24..254, w=230)               -->
  <!-- ======================================================================= -->
  <rect x="24" y="74" width="230" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="34" y="84" width="210" height="28" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="139" y="103" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхідний порт ядра</text>
  <text x="139" y="125" font-size="12" fill="#6b7280" text-anchor="middle">Вихід: Result&lt;T, DomainError&gt;</text>

  <!-- Блок 1.1: Успішний результат -->
  <rect x="34" y="136" width="210" height="66" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="139" y="156" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Result::Ok(T)</text>
  <text x="139" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Created(id) / EntityDTO</text>
  <text x="139" y="191" font-size="12" fill="#6b7280" text-anchor="middle">Чисті дані без транспорту</text>

  <!-- Блок 1.2: Канонічні типи помилок -->
  <rect x="34" y="214" width="210" height="170" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="44" y="233" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">✗ Result::Err(DomainError)</text>
  <text x="44" y="257" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">• NotFound</tspan><tspan fill="#6b7280"> (не знайдено)</tspan></text>
  <text x="44" y="282" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">• Conflict</tspan><tspan fill="#6b7280"> (конфлікт стану)</tspan></text>
  <text x="44" y="307" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">• ValidationError</tspan><tspan fill="#6b7280"> (інваріанти)</tspan></text>
  <text x="44" y="332" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">• Unauthorized</tspan><tspan fill="#6b7280"> (права доступу)</tspan></text>
  <text x="139" y="365" font-size="12" fill="#6b7280" text-anchor="middle">Типізований перелік (enum)</text>

  <!-- Блок 1.3: Внутрішні винятки -->
  <rect x="34" y="396" width="210" height="126" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="139" y="416" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Внутрішній стан і збої</text>
  <text x="139" y="437" font-size="12" fill="#1a1a1a" text-anchor="middle">SQLException · NullPointer</text>
  <text x="139" y="456" font-size="12" fill="#1a1a1a" text-anchor="middle">Стектрейси · Схеми БД</text>
  <text x="139" y="482" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⛔ Небезпека витоку</text>
  <text x="139" y="502" font-size="12" fill="#6b7280" text-anchor="middle">руйнує ізоляцію ядра</text>

  <!-- ======================================================================= -->
  <!-- КОЛОНКА 2: КОМПОНЕНТ МАПІНГУ ТА БАР'ЄР ІЗОЛЯЦІЇ (x: 270..494, w=224)     -->
  <!-- ======================================================================= -->
  <rect x="270" y="74" width="224" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="280" y="84" width="204" height="28" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="382" y="103" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Компонент мапінгу</text>
  <text x="382" y="125" font-size="12" fill="#6b7280" text-anchor="middle">Response Translator / Barrier</text>

  <!-- Блок 2.1: Трансляція успіху -->
  <rect x="280" y="136" width="204" height="66" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="382" y="156" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Трансляція даних</text>
  <text x="382" y="174" font-size="12" fill="#1a1a1a" text-anchor="middle">DTO ➔ формат протоколу</text>
  <text x="382" y="191" font-size="12" fill="#6b7280" text-anchor="middle">Location URI / payload / stdout</text>

  <!-- Блок 2.2: Трансляція помилок -->
  <rect x="280" y="214" width="204" height="170" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="382" y="233" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Мапінг кодів збоїв</text>
  <text x="290" y="257" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">NotFound</tspan><tspan fill="#6b7280"> ➔ 404 / NACK / exit 1</tspan></text>
  <text x="290" y="282" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">Conflict</tspan><tspan fill="#6b7280"> ➔ 409 / NACK / exit 2</tspan></text>
  <text x="290" y="307" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">Validation</tspan><tspan fill="#6b7280"> ➔ 422 / DLQ / exit 2</tspan></text>
  <text x="290" y="332" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">Auth</tspan><tspan fill="#6b7280"> ➔ 401, 403 / DLQ / exit 1</tspan></text>
  <text x="382" y="365" font-size="12" fill="#2457d6" text-anchor="middle">Формування RFC 7807 тіла</text>

  <!-- Блок 2.3: Захисний мур (бар'єр) -->
  <rect x="280" y="396" width="204" height="126" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="290" y="406" width="184" height="22" rx="4" fill="#c0392b"/>
  <text x="382" y="422" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⛔ НЕПРОНИКНИЙ БАР'ЄР</text>
  <text x="382" y="446" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гасіння винятків ядра</text>
  <text x="382" y="466" font-size="12" fill="#6b7280" text-anchor="middle">Стектрейси й БД не протікають</text>
  <text x="382" y="488" font-size="12" fill="#1a1a1a" text-anchor="middle">Санітизація у безпечний статус:</text>
  <text x="382" y="508" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">500 Internal / DLQ / exit 1</text>

  <!-- ======================================================================= -->
  <!-- КОЛОНКА 3: ДРАЙВУЮЧІ АДАПТЕРИ (x: 510..936, w=426)                      -->
  <!-- ======================================================================= -->
  <rect x="510" y="74" width="426" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="520" y="84" width="406" height="28" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="723" y="103" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Драйвуючі адаптери: протокольні формати</text>
  <text x="723" y="125" font-size="12" fill="#6b7280" text-anchor="middle">Зовнішні контракти відповідей за специфікаціями</text>

  <!-- Адаптер 1: HTTP -->
  <rect x="520" y="136" width="406" height="152" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="532" y="156" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">1. HTTP-адаптер (REST API)</text>
  <text x="914" y="156" font-size="12" fill="#6b7280" text-anchor="end">RFC 7807 Problem Details</text>
  <text x="532" y="177" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold" fill="#27ae60">201 Created</tspan><tspan fill="#6b7280"> (Location: /res/42) · </tspan><tspan font-weight="bold" fill="#27ae60">200 OK</tspan><tspan fill="#6b7280"> (JSON)</tspan></text>
  <text x="532" y="198" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold" fill="#c0392b">404</tspan><tspan fill="#6b7280"> Not Found · </tspan><tspan font-weight="bold" fill="#c0392b">409</tspan><tspan fill="#6b7280"> Conflict · </tspan><tspan font-weight="bold" fill="#c0392b">422</tspan><tspan fill="#6b7280"> Unprocessable · </tspan><tspan font-weight="bold" fill="#c0392b">401/403</tspan></text>
  <rect x="532" y="210" width="382" height="66" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="544" y="228" font-size="12" text-anchor="start"><tspan font-weight="bold" fill="#2457d6">application/problem+json</tspan><tspan fill="#6b7280"> (стандарт RFC 7807):</tspan></text>
  <text x="544" y="247" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-family="monospace">{ "type", "title", "status", "detail" }</tspan></text>
  <text x="544" y="265" font-size="12" text-anchor="start"><tspan font-weight="bold" fill="#27ae60">✓ Ізоляція:</tspan><tspan fill="#6b7280"> назви таблиць БД та стектрейси приховано</tspan></text>

  <!-- Адаптер 2: Споживач черги -->
  <rect x="520" y="300" width="406" height="116" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="532" y="320" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">2. Споживач черги (AMQP / RabbitMQ / Kafka)</text>
  <text x="914" y="320" font-size="12" fill="#6b7280" text-anchor="end">Директиви брокера</text>
  <text x="532" y="342" font-size="12" text-anchor="start"><tspan font-weight="bold" fill="#27ae60">• ACK (Acknowledge)</tspan><tspan fill="#1a1a1a"> — успіх: видалення повідомлення з черги</tspan></text>
  <text x="532" y="364" font-size="12" text-anchor="start"><tspan font-weight="bold" fill="#c0392b">• NACK ➔ DLQ</tspan><tspan fill="#1a1a1a"> — доменний збій (скидання без повтору)</tspan></text>
  <text x="532" y="386" font-size="12" text-anchor="start"><tspan font-weight="bold" fill="#2457d6">• Requeue (повтор)</tspan><tspan fill="#1a1a1a"> — виключно при збої інфраструктури</tspan></text>
  <text x="532" y="405" font-size="12" fill="#6b7280" text-anchor="start">Немає клієнтського тіла: реакція полягає у квитуванні брокера</text>

  <!-- Адаптер 3: CLI -->
  <rect x="520" y="428" width="406" height="98" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="532" y="448" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">3. CLI-адаптер (Консольна команда POSIX)</text>
  <text x="914" y="448" font-size="12" fill="#6b7280" text-anchor="end">Коди виходу процесу</text>
  <text x="532" y="470" font-size="12" text-anchor="start"><tspan font-weight="bold" fill="#27ae60">• Код 0 (EXIT_SUCCESS)</tspan><tspan fill="#1a1a1a"> ➔ корисні дані у потік </tspan><tspan font-weight="bold" fill="#1a1a1a">stdout</tspan></text>
  <text x="532" y="492" font-size="12" text-anchor="start"><tspan font-weight="bold" fill="#c0392b">• Коди 1, 2 (EXIT_FAILURE)</tspan><tspan fill="#1a1a1a"> ➔ текст помилки у потік </tspan><tspan font-weight="bold" fill="#1a1a1a">stderr</tspan></text>
  <text x="532" y="512" font-size="12" fill="#6b7280" text-anchor="start">Без стектрейсів: безпечна композиція в конвеєрах скриптів</text>

  <!-- ======================================================================= -->
  <!-- СТРІЛКИ ЗВ'ЯЗКІВ МІЖ КОЛОНКАМИ                                          -->
  <!-- ======================================================================= -->
  <!-- Потік між колонкою 1 та 2 -->
  <line x1="244" y1="169" x2="268" y2="169" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="244" y1="299" x2="268" y2="299" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="244" y1="459" x2="268" y2="459" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>

  <!-- Потік між колонкою 2 та 3 -->
  <line x1="494" y1="212" x2="508" y2="212" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="494" y1="358" x2="508" y2="358" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="494" y1="476" x2="508" y2="476" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
