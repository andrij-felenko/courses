<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="560" fill="white"/>

<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
  <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
  </marker>
</defs>

<!-- Header & Subtitle -->
<text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двостороння трансляція у тонкому драйвуючому адаптері</text>
<text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Десеріалізація протоколу в чисту команду та зворотний мапінг Result у коди HTTP, POSIX чи брокера</text>

<!-- ======================================================================= -->
<!-- COLUMN 1: КЛІЄНТСЬКІ ФРОНТИ (x: 24..180, w=156)                          -->
<!-- ======================================================================= -->

<!-- ROW 1: HTTP Client -->
<rect x="24" y="72" width="156" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="34" y="82" width="136" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="102" y="98" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Web / REST API</text>
<text x="34" y="122" font-size="12" font-weight="bold" fill="#1a1a1a">POST /api/heating</text>
<text x="34" y="138" font-size="12" fill="#6b7280">{ &quot;roomId&quot;: &quot;bed1&quot;,</text>
<text x="34" y="154" font-size="12" fill="#6b7280">  &quot;temp&quot;: 22.5 }</text>
<text x="34" y="174" font-size="12" fill="#1a1a1a">Відповідь клієнту:</text>
<text x="34" y="192" font-size="12" fill="#6b7280">200 OK / RFC 7807</text>

<!-- ROW 2: CLI Client -->
<rect x="24" y="232" width="156" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="34" y="242" width="136" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="102" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Термінал (CLI)</text>
<text x="34" y="282" font-size="12" font-weight="bold" fill="#1a1a1a">dh-cli heating set</text>
<text x="34" y="298" font-size="12" fill="#6b7280">--room bed1</text>
<text x="34" y="314" font-size="12" fill="#6b7280">--temp 22.5</text>
<text x="34" y="334" font-size="12" fill="#1a1a1a">Статус завершення:</text>
<text x="34" y="352" font-size="12" fill="#6b7280">код 0 / коди 1, 2</text>

<!-- ROW 3: Broker / Queue Client -->
<rect x="24" y="392" width="156" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="34" y="402" width="136" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="102" y="418" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Брокер черг</text>
<text x="34" y="442" font-size="12" font-weight="bold" fill="#1a1a1a">heating.commands</text>
<text x="34" y="458" font-size="12" fill="#6b7280">AMQP payload (байти)</text>
<text x="34" y="474" font-size="12" fill="#6b7280">header: trace_id</text>
<text x="34" y="494" font-size="12" fill="#1a1a1a">Директива брокеру:</text>
<text x="34" y="512" font-size="12" fill="#6b7280">basic.ack / basic.nack</text>

<!-- ======================================================================= -->
<!-- COLUMN 2: ТОНКІ ДРАЙВУЮЧІ АДАПТЕРИ (x: 212..692, w=480)                 -->
<!-- ======================================================================= -->

<!-- ROW 1 ADAPTER: HTTP -->
<rect x="212" y="72" width="480" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<!-- Inbound Sub-box -->
<rect x="222" y="82" width="460" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="234" y="99" font-size="12" font-weight="bold" fill="#2457d6">HTTP-адаптер: десеріалізація JSON + валідація схеми + CallContext</text>
<text x="234" y="121" font-size="12" fill="#1a1a1a">→ Команда: SetTargetTemperatureCommand(roomId, temp)</text>
<!-- Outbound Sub-box -->
<rect x="222" y="142" width="460" height="66" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="234" y="157" font-size="12" font-weight="bold" fill="#1a1a1a">Result Mapper: зворотна трансляція Result&lt;Void, DomainError&gt;</text>
<rect x="230" y="165" width="220" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="238" y="180" font-size="12" font-weight="bold" fill="#27ae60">✓ Успіх: 200 OK / 201 Created</text>
<text x="238" y="195" font-size="12" fill="#27ae60">серіалізація результату в JSON</text>
<rect x="462" y="165" width="212" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="470" y="180" font-size="12" font-weight="bold" fill="#c0392b">✗ Помилка: RFC 7807</text>
<text x="470" y="195" font-size="12" fill="#c0392b">404 NotFound / 422 Conflict</text>

<!-- ROW 2 ADAPTER: CLI -->
<rect x="212" y="232" width="480" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<!-- Inbound Sub-box -->
<rect x="222" y="242" width="460" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="234" y="259" font-size="12" font-weight="bold" fill="#2457d6">CLI-адаптер: розбір аргументів argv + перевірка типів + CallContext</text>
<text x="234" y="281" font-size="12" fill="#1a1a1a">→ Команда: SetTargetTemperatureCommand(roomId, temp)</text>
<!-- Outbound Sub-box -->
<rect x="222" y="302" width="460" height="66" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="234" y="317" font-size="12" font-weight="bold" fill="#1a1a1a">Result Mapper: зворотна трансляція Result&lt;Void, DomainError&gt;</text>
<rect x="230" y="325" width="220" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="238" y="340" font-size="12" font-weight="bold" fill="#27ae60">✓ Успіх: код POSIX 0</text>
<text x="238" y="355" font-size="12" fill="#27ae60">форматований текст у stdout</text>
<rect x="462" y="325" width="212" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="470" y="340" font-size="12" font-weight="bold" fill="#c0392b">✗ Помилка: коди 1, 2</text>
<text x="470" y="355" font-size="12" fill="#c0392b">повідомлення збою у stderr</text>

<!-- ROW 3 ADAPTER: AMQP -->
<rect x="212" y="392" width="480" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<!-- Inbound Sub-box -->
<rect x="222" y="402" width="460" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="234" y="419" font-size="12" font-weight="bold" fill="#2457d6">AMQP-адаптер: розпакування кадру + перевірка полів + CallContext</text>
<text x="234" y="441" font-size="12" fill="#1a1a1a">→ Команда: SetTargetTemperatureCommand(roomId, temp)</text>
<!-- Outbound Sub-box -->
<rect x="222" y="462" width="460" height="66" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="234" y="477" font-size="12" font-weight="bold" fill="#1a1a1a">Result Mapper: зворотна трансляція Result&lt;Void, DomainError&gt;</text>
<rect x="230" y="485" width="220" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="238" y="500" font-size="12" font-weight="bold" fill="#27ae60">✓ Успіх: basic.ack</text>
<text x="238" y="515" font-size="12" fill="#27ae60">підтвердження доставки в брокер</text>
<rect x="462" y="485" width="212" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="470" y="500" font-size="12" font-weight="bold" fill="#c0392b">✗ Збій: basic.nack</text>
<text x="470" y="515" font-size="12" fill="#c0392b">requeue=false → у чергу DLQ</text>

<!-- ======================================================================= -->
<!-- COLUMN 3: СПІЛЬНЕ ПРИКЛАДНЕ ЯДРО (x: 724..936, w=212, h=464)            -->
<!-- ======================================================================= -->
<rect x="724" y="72" width="212" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

<!-- Core Title Badge -->
<rect x="734" y="82" width="192" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="830" y="101" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Єдине прикладне ядро</text>
<text x="830" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Нейтральне до транспорту</text>

<!-- Inbound Driving Port -->
<rect x="734" y="136" width="192" height="84" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="744" y="154" font-size="12" font-weight="bold" fill="#2457d6">Вхідний порт (Use Case)</text>
<text x="744" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">SetTargetTemperaturePort</text>
<text x="744" y="190" font-size="12" fill="#2457d6">execute(command, ctx)</text>
<text x="744" y="208" font-size="12" fill="#6b7280">cmd: Command DTO</text>

<!-- Domain Business Rules -->
<rect x="734" y="230" width="192" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="744" y="248" font-size="12" font-weight="bold" fill="#1a1a1a">Сценарій опалення</text>
<text x="744" y="268" font-size="12" fill="#1a1a1a">• Доменні інваріанти</text>
<text x="744" y="286" font-size="12" fill="#1a1a1a">• Перевірка стану вікон</text>
<text x="744" y="304" font-size="12" fill="#1a1a1a">• Ліміт нагріву (≤30°C)</text>

<!-- Domain Result Container -->
<rect x="734" y="336" width="192" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="744" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">Контейнер Result:</text>
<text x="744" y="372" font-size="12" font-weight="bold" fill="#2457d6">Result&lt;Void, DomainError&gt;</text>
<text x="744" y="394" font-size="12" font-weight="bold" fill="#27ae60">✓ Ok(void) — успіх</text>
<text x="744" y="416" font-size="12" font-weight="bold" fill="#c0392b">✗ Err(DomainError):</text>
<text x="744" y="434" font-size="12" fill="#c0392b">• NotFound</text>
<text x="744" y="450" font-size="12" fill="#c0392b">• RuleViolation</text>
<text x="744" y="466" font-size="12" fill="#c0392b">• AccessDenied</text>

<text x="830" y="494" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Єдине джерело правди</text>
<text x="830" y="514" font-size="12" fill="#6b7280" text-anchor="middle">Нуль залежностей від мережі</text>

<!-- ======================================================================= -->
<!-- CONNECTING ARROWS BETWEEN COLUMNS                                       -->
<!-- ======================================================================= -->

<!-- ROW 1 ARROWS -->
<!-- Inbound: Client -> Adapter -->
<line x1="180" y1="108" x2="210" y2="108" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<!-- Inbound: Adapter -> Core -->
<line x1="692" y1="108" x2="722" y2="108" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<!-- Outbound: Core -> Adapter (dashed return flow) -->
<line x1="724" y1="175" x2="694" y2="175" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>
<!-- Outbound: Adapter -> Client (dashed return flow) -->
<line x1="212" y1="175" x2="182" y2="175" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>

<!-- ROW 2 ARROWS -->
<!-- Inbound: Client -> Adapter -->
<line x1="180" y1="268" x2="210" y2="268" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<!-- Inbound: Adapter -> Core -->
<line x1="692" y1="268" x2="722" y2="268" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<!-- Outbound: Core -> Adapter (dashed return flow) -->
<line x1="724" y1="335" x2="694" y2="335" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>
<!-- Outbound: Adapter -> Client (dashed return flow) -->
<line x1="212" y1="335" x2="182" y2="335" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>

<!-- ROW 3 ARROWS -->
<!-- Inbound: Client -> Adapter -->
<line x1="180" y1="428" x2="210" y2="428" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<!-- Inbound: Adapter -> Core -->
<line x1="692" y1="428" x2="722" y2="428" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<!-- Outbound: Core -> Adapter (dashed return flow) -->
<line x1="724" y1="495" x2="694" y2="495" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>
<!-- Outbound: Adapter -> Client (dashed return flow) -->
<line x1="212" y1="495" x2="182" y2="495" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>

</svg>
