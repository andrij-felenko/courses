<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Приймальне тестування: HTTP-контур проти in-memory стенда</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Пряме підключення до драйвуючих портів усуває мережеві прошарки та прискорює зворотний зв&apos;язок</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ТЕСТУВАННЯ ЧЕРЕЗ HTTP ==================== -->
  <rect x="24" y="74" width="444" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок лівої панелі -->
  <text x="246" y="96" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">HTTP-ланцюжок: повільний наскрізний контур</text>
  <text x="246" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Повний транспортний стек: сокети, веб-сервер, база в Docker</text>

  <!-- Блок 1 (Зліва): Тестовий набір і HTTP-клієнт -->
  <rect x="44" y="128" width="404" height="46" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="246" y="146" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Acceptance Test Suite + HTTP Client</text>
  <text x="246" y="163" font-size="12" fill="#6b7280" text-anchor="middle">Серіалізація команди в JSON, відкриття HTTP-з&apos;єднання</text>

  <!-- Стрілка 1 (Зліва): від клієнта до мережевого шару -->
  <line x1="246" y1="174" x2="246" y2="190" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Блок 2 (Зліва): Мережевий транспорт і веб-сервер -->
  <rect x="44" y="194" width="404" height="78" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="246" y="212" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Мережевий транспорт і веб-сервер (Накладні витрати)</text>

  <!-- Підблоки 2 (Зліва): Сокети та Контролер -->
  <rect x="54" y="222" width="186" height="42" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="147" y="237" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Мережа / TCP сокети</text>
  <text x="147" y="253" font-size="12" fill="#6b7280" text-anchor="middle">Затримка стека: 50–200 мс</text>

  <rect x="252" y="222" width="186" height="42" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="345" y="237" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">HTTP-контролер</text>
  <text x="345" y="253" font-size="12" fill="#6b7280" text-anchor="middle">Десеріалізація JSON, роутинг</text>

  <!-- Стрілка 2 (Зліва): від контролера до портів -->
  <line x1="246" y1="272" x2="246" y2="288" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Блок 3 (Зліва): Вхідні порти -->
  <rect x="44" y="292" width="404" height="42" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="246" y="309" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вхідний драйвуючий порт (Driving Port / Use Case)</text>
  <text x="246" y="325" font-size="12" fill="#6b7280" text-anchor="middle">Контракт сценарію: типізована команда (DTO) + CallContext</text>

  <!-- Стрілка 3 (Зліва): від порту до ядра -->
  <line x1="246" y1="334" x2="246" y2="348" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Блок 4 (Зліва): Прикладне ядро та важка БД -->
  <rect x="44" y="350" width="404" height="66" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="246" y="369" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Прикладне ядро (Application Core)</text>
  <text x="246" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">Виконання бізнес-правил та інваріантів сценарію</text>
  <text x="246" y="403" font-size="12" fill="#c0392b" text-anchor="middle">Звернення до БД у Docker-контейнері (дисковий I/O, міграції)</text>

  <!-- Блок 5 (Зліва): Підсумкові характеристики HTTP -->
  <rect x="44" y="428" width="404" height="96" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="56" y="447" font-size="12" font-weight="700" fill="#c0392b">Характеристики наскрізного HTTP-контуру:</text>
  <text x="56" y="466" font-size="12" fill="#1a1a1a">• Затримка зворотного зв&apos;язку: 200–1500 мс на один сценарій</text>
  <text x="56" y="484" font-size="12" fill="#1a1a1a">• Флапання: конфлікти TCP-портів, таймаути з&apos;єднань у CI</text>
  <text x="56" y="502" font-size="12" fill="#1a1a1a">• Зчеплення: неможливо тестувати ядро без веб-сервера</text>
  <text x="56" y="517" font-size="12" fill="#6b7280">Повільний зворотний зв&apos;язок блокує продуктивний TDD</text>


  <!-- ==================== ПРАВА ПАНЕЛЬ: IN-MEMORY ТЕСТУВАННЯ ==================== -->
  <rect x="492" y="74" width="444" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок правої панелі -->
  <text x="714" y="96" font-size="14" font-weight="700" fill="#27ae60" text-anchor="middle">In-Memory стенд: прямий тестовий драйвер</text>
  <text x="714" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Тестовий набір як клієнт ядра: виклик портів у пам&apos;яті процесу</text>

  <!-- Блок 1 (Справа): Тестовий набір і In-Memory Драйвер -->
  <rect x="512" y="128" width="404" height="46" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="714" y="146" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Acceptance Test Suite + Test Driver</text>
  <text x="714" y="163" font-size="12" fill="#1a1a1a" text-anchor="middle">Тестовий драйвер-адаптер: пряме конструювання DTO в RAM</text>

  <!-- Стрілка 1 (Справа): від драйвера до нульового прошарку -->
  <line x1="714" y1="174" x2="714" y2="190" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Блок 2 (Справа): Мережевий прошарок усунено -->
  <rect x="512" y="194" width="404" height="78" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="714" y="212" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Мережевий прошарок усунено (Zero Overhead)</text>

  <!-- Підблоки 2 (Справа): Без сокетів та Без контролера -->
  <rect x="522" y="222" width="186" height="42" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="615" y="237" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Без TCP та сокетів</text>
  <text x="615" y="253" font-size="12" fill="#6b7280" text-anchor="middle">Прямий виклик коду в пам&apos;яті</text>

  <rect x="720" y="222" width="186" height="42" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="813" y="237" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Без веб-контролера</text>
  <text x="813" y="253" font-size="12" fill="#6b7280" text-anchor="middle">Нуль JSON-серіалізації</text>

  <!-- Стрілка 2 (Справа): прямий перехід до портів -->
  <line x1="714" y1="272" x2="714" y2="288" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Блок 3 (Справа): Вхідні порти -->
  <rect x="512" y="292" width="404" height="42" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="714" y="309" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вхідний драйвуючий порт (Driving Port / Use Case)</text>
  <text x="714" y="325" font-size="12" fill="#6b7280" text-anchor="middle">Той самий контракт use-case, що й для бойових точок входу</text>

  <!-- Стрілка 3 (Справа): від порту до ядра -->
  <line x1="714" y1="334" x2="714" y2="348" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Блок 4 (Справа): Прикладне ядро та In-Memory дублери -->
  <rect x="512" y="350" width="404" height="66" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="714" y="369" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Прикладне ядро (Application Core)</text>
  <text x="714" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">Виконання тих самих бізнес-правил та інваріантів</text>
  <text x="714" y="403" font-size="12" fill="#27ae60" text-anchor="middle">In-Memory дублери сховищ (RAM Repository / Fake Stubs, 0 ms)</text>

  <!-- Блок 5 (Справа): Підсумкові характеристики In-Memory -->
  <rect x="512" y="428" width="404" height="96" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="524" y="447" font-size="12" font-weight="700" fill="#27ae60">Характеристики in-memory стенда:</text>
  <text x="524" y="466" font-size="12" fill="#1a1a1a">• Затримка зворотного зв&apos;язку: &lt; 2–5 мс на один сценарій</text>
  <text x="524" y="484" font-size="12" fill="#1a1a1a">• Детермінізм: нуль мережевих флапань, 100% повторюваність</text>
  <text x="524" y="502" font-size="12" fill="#1a1a1a">• Автономність: перевірка ядра ще до створення веб-контролерів</text>
  <text x="524" y="517" font-size="12" fill="#6b7280">Миттєвий зворотний зв&apos;язок скорочує час розробки в рази</text>
</svg>
