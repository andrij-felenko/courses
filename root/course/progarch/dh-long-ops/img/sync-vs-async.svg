<text x="600.0" y="624.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Та сама робота — 45 с. Угорі вона прив'язана до з'єднання, що вмирає на 30-й, і кожен розрив множить її. Унизу її відв'язано від дроту — і тривалість роботи вже нікого не тримає.</text>
