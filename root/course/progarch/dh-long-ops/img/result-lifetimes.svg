<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тлінний результат: три строки, і кожен заданий явно</text>
<text x="120.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Підписане посилання</text>
<rect x="400.0" y="131.0" width="70.0" height="28.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="435.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">15 хв</text>
<text x="482.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">✗ підпис протух → 403</text>
<text x="120.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Файл у сховищі</text>
<rect x="400.0" y="226.0" width="180.0" height="28.0" rx="6" fill="#e6eefb" stroke="#2457d6" stroke-width="1.7"/>
<text x="490.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">7 днів · політика сховища</text>
<text x="592.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">✗ прибрано автоматично</text>
<text x="120.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Запис операції у БД</text>
<rect x="400.0" y="321.0" width="530.0" height="28.0" rx="6" fill="#f0f0f2" stroke="#6b7280" stroke-width="1.7"/>
<text x="665.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">≈30 днів</text>
<text x="942.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">✗ застарів → прибрано</text>
<line x1="400.0" y1="115.0" x2="400.0" y2="360.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="400.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">t = 0: кліп готовий</text>
<text x="600.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Поки живий ФАЙЛ, за операцією можна щоразу взяти свіже 15-хвилинне посилання; коли політика сховища прибирає файл, зникає й сенс запису. Нічого не задано «назавжди» — тому ніщо не тече в нескінченність.</text>
</svg>