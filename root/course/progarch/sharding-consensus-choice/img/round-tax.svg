<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="680" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Податок раундів: локальна операція проти рішення консенсусом</text>
<text x="600.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна однієї операції на спільній осі часу (RTT у ДЦ ≈ 1 мс)</text>
<line x1="150.0" y1="250.0" x2="1000.0" y2="250.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="150.0" y1="246.0" x2="150.0" y2="254.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="150.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<line x1="400.0" y1="246.0" x2="400.0" y2="254.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="400.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 мс</text>
<line x1="650.0" y1="246.0" x2="650.0" y2="254.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="650.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2 мс</text>
<line x1="900.0" y1="246.0" x2="900.0" y2="254.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="900.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">3 мс</text>
<text x="150.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Щабель 0 · локальна операція</text>
<rect x="150.0" y="120.0" width="50.0" height="28.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="214.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">≈ 0.2 мс · 0 мережевих раундів</text>
