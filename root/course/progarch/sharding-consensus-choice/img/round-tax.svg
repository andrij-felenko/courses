<text x="337.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">поріг: останній потрібний акк</text>
<line x1="337.0" y1="448.0" x2="453.0" y2="552.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="600.0" y="646.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Кворум = ⌊N/2⌋+1: більше вузлів → більший кворум → останній потрібний акк лише пізніше. +Вузли = витривалість, не швидкість; лідер із логом лишається один.</text>
