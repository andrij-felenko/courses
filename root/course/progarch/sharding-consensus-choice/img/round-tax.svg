<circle cx="308.0" cy="582.0" r="15.0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<circle cx="366.0" cy="582.0" r="15.0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
