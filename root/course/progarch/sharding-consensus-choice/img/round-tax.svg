<rect x="150.0" y="196.0" width="125.0" height="28.0" rx="6" fill="#fff8ec" stroke="#c9922e" stroke-width="1.6"/>
<rect x="275.0" y="196.0" width="250.0" height="28.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/>
