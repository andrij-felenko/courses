<circle cx="366.0" cy="500.0" r="15.0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<circle cx="424.0" cy="500.0" r="15.0" fill="#eef1f4" stroke="#6b7280" stroke-width="1.2"/>
