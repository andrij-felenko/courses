<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три пастки аудиту: де чуйка бреше про щабель</text>
<text x="590.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Ворота: «чи мусить бути рівно один / строгий порядок?»</text>
<text x="175.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Операція</text>
<text x="510.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c9922e" text-anchor="middle" font-weight="700">Як підказує чуйка</text>
<text x="905.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що каже питання воріт</text>
<rect x="59.0" y="143.6" width="232.0" height="48.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="175.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Унікальний ID</tspan><tspan x="175.0" dy="16.2">пристрою / замовлення</tspan></text>
<line x1="296.0" y1="168.0" x2="372.0" y2="168.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="381.0" y="144.2" width="258.0" height="47.6" rx="6" fill="#fff8ec" stroke="#c9922e" stroke-width="1.5"/><text x="510.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">наче щабель 2</tspan><tspan x="510.0" dy="15.6">кожен номер — через ядро</tspan></text>
<line x1="648.0" y1="168.0" x2="752.0" y2="168.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="759.0" y="144.2" width="292.0" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="905.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="905.0" dy="0.0">насправді щабель 0</tspan><tspan x="905.0" dy="15.6">ліза блоку ID → далі локально</tspan></text>
<rect x="59.0" y="285.6" width="232.0" height="48.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="175.0" y="306.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Оновлення</tspan><tspan x="175.0" dy="16.2">прошивки пристрою</tspan></text>
<line x1="296.0" y1="310.0" x2="372.0" y2="310.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="381.0" y="286.2" width="258.0" height="47.6" rx="6" fill="#fff8ec" stroke="#c9922e" stroke-width="1.5"/><text x="510.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">наче щабель 0</tspan><tspan x="510.0" dy="15.6">просто запис у пристрій</tspan></text>
<line x1="648.0" y1="310.0" x2="752.0" y2="310.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="759.0" y="286.2" width="292.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="905.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="905.0" dy="0.0">насправді щабель 2</tspan><tspan x="905.0" dy="15.6">двоє не разом → замок + fencing</tspan></text>
<rect x="59.0" y="427.6" width="232.0" height="48.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="175.0" y="448.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Лічильник</tspan><tspan x="175.0" dy="16.2">використання / білінг</tspan></text>
<line x1="296.0" y1="452.0" x2="372.0" y2="452.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="381.0" y="428.2" width="258.0" height="47.6" rx="6" fill="#fff8ec" stroke="#c9922e" stroke-width="1.5"/><text x="510.0" y="448.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">наче щабель 2</tspan><tspan x="510.0" dy="15.6">має бути точно до копійки</tspan></text>
<line x1="648.0" y1="452.0" x2="752.0" y2="452.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="759.0" y="428.2" width="292.0" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="905.0" y="448.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="905.0" dy="0.0">насправді щабель 0</tspan><tspan x="905.0" dy="15.6">лічильники домів → сума потім</tspan></text>
<text x="590.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Наївний щабель — амбер; справжній — зелений (0) чи червоний (2). Пастка саме там, де чуйка тягне не туди.</text>
</svg>