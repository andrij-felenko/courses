<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Центр чи сервіс» — це не один важіль, а три</text>
<rect x="685.0" y="44.0" width="296.0" height="368.0" rx="6" fill="#f2fbf5" stroke="#27ae60" stroke-width="2.6"/>
<rect x="24.0" y="48.0" width="170.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="109.0" y="74.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="109.0" dy="0.0">важіль ↓ / варіант →</tspan></text>
<rect x="206.0" y="48.0" width="232.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="322.0" y="67.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="322.0" dy="0.0">Варіант А</tspan><tspan x="322.0" dy="16.2">усе в сервісі</tspan></text>
<rect x="448.0" y="48.0" width="232.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="564.0" y="67.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="564.0" dy="0.0">Варіант Б</tspan><tspan x="564.0" dy="16.2">усе в центрі</tspan></text>
<rect x="690.0" y="48.0" width="286.0" height="46.0" rx="6" fill="#e7f6ec" stroke="#333333" stroke-width="1.5"/><text x="833.0" y="67.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="833.0" dy="0.0">Гібрид</tspan><tspan x="833.0" dy="16.2">кожен важіль окремо</tspan></text>
<rect x="24.0" y="104.0" width="170.0" height="92.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="109.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="109.0" dy="0.0">Політика</tspan><tspan x="109.0" dy="15.6">(текст правила)</tspan></text>
<rect x="206.0" y="104.0" width="232.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="322.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="322.0" dy="0.0">у сервісі</tspan><tspan x="322.0" dy="15.6">(N копій)</tspan></text>
<rect x="448.0" y="104.0" width="232.0" height="92.0" rx="6" fill="#fbf1dc" stroke="#333333" stroke-width="1.5"/><text x="564.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="564.0" dy="0.0">у центрі</tspan></text>
<rect x="690.0" y="104.0" width="286.0" height="92.0" rx="6" fill="#fbf1dc" stroke="#27ae60" stroke-width="1.6"/><text x="833.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="833.0" dy="0.0">у центрі</tspan><tspan x="833.0" dy="15.6">(одне джерело)</tspan></text>
<rect x="24.0" y="204.0" width="170.0" height="92.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="109.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="109.0" dy="0.0">Рішення</tspan><tspan x="109.0" dy="15.6">(оцінка вердикту)</tspan></text>
<rect x="206.0" y="204.0" width="232.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="322.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="322.0" dy="0.0">у сервісі</tspan><tspan x="322.0" dy="15.6">(виклик функції)</tspan></text>
<rect x="448.0" y="204.0" width="232.0" height="92.0" rx="6" fill="#fbf1dc" stroke="#333333" stroke-width="1.5"/><text x="564.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="564.0" dy="0.0">у центрі</tspan><tspan x="564.0" dy="15.6">(стрибок мережею)</tspan></text>
<rect x="690.0" y="204.0" width="286.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.6"/><text x="833.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="833.0" dy="0.0">у сервісі</tspan><tspan x="833.0" dy="15.6">(локально, без стрибка)</tspan></text>
<rect x="24.0" y="304.0" width="170.0" height="106.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="109.0" y="353.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="109.0" dy="0.0">Дані</tspan><tspan x="109.0" dy="15.6">(факти для рішення)</tspan></text>
<rect x="206.0" y="304.0" width="232.0" height="106.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="322.0" y="353.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="322.0" dy="0.0">локальні</tspan><tspan x="322.0" dy="15.6">(поруч)</tspan></text>
<rect x="448.0" y="304.0" width="232.0" height="106.0" rx="6" fill="#fbf1dc" stroke="#333333" stroke-width="1.5"/><text x="564.0" y="361.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="564.0" dy="0.0">стягнуті в центр</tspan></text>
<rect x="690.0" y="304.0" width="286.0" height="106.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="833.0" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="833.0" dy="0.0">розділено:</tspan><tspan x="833.0" dy="15.6">локальні — тут,</tspan><tspan x="833.0" dy="15.6">наскрізні — в центрі</tspan></text>
<text x="500.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">А жене всі три важелі в один бік, Б — в інший; гібрид садить кожен на своє місце.</text>
</svg>