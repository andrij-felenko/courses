<rect x="28.0" y="418.0" width="904.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="480.0" dy="0.0">❌ Наївно: промах чи збій центру → «щоб не блокувати — пустити» (allow).</tspan><tspan x="480.0" dy="16.2">Мить недоступності — і кожен чужий проходить. Правило: підтвердь членство або відмов.</tspan></text>
