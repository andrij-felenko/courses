<rect x="568.3" y="109.3" width="283.3" height="45.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="710.0" y="128.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">1. «Для чистоти коду»</tspan><tspan x="710.0" dy="14.3">чистоту дає модуль у моноліті, а не мережа</tspan></text>
