<rect x="103.2" y="121.2" width="293.6" height="47.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="141.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">1. Різна швидкість деплою</tspan><tspan x="250.0" dy="15.6">незалежний реліз-цикл для автономних фіч</tspan></text>
