<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 432" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="432" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один збій, два виклики — протилежний fallback</text>
<rect x="380.0" y="52.0" width="280.0" height="52.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.8"/><text x="520.0" y="74.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Хмара мовчить</tspan><tspan x="520.0" dy="15.6">(таймаут / запобіжник розімкнено)</tspan></text>
<line x1="520.0" y1="132.0" x2="520.0" y2="322.0" stroke="#e5e7eb" stroke-width="1.0"/>
<line x1="468.0" y1="106.0" x2="300.0" y2="148.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="572.0" y1="106.0" x2="740.0" y2="148.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="90.0" y="150.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="179.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Читання: показати температуру</tspan></text>
<text x="250.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">допуск: застаріле на 2 хв — байдуже</text>
<rect x="90.0" y="246.0" width="320.0" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Fallback: кеш останнього стану</tspan><tspan x="250.0" dy="16.9">— безпечно</tspan></text>
<rect x="630.0" y="150.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="790.0" y="179.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Дія: відчинити замок</tspan></text>
<text x="790.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">допуск: застаріле «дозволено» — небезпечно</text>
<rect x="630.0" y="246.0" width="320.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="790.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Наосліп кеш НЕ можна →</tspan><tspan x="790.0" dy="16.9">fail-closed або LAN-режим</tspan></text>
<rect x="70.0" y="344.0" width="900.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="520.0" y="374.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Та сама тиша. Що віддати — вирішує не збій, а що робить із відповіддю той, хто питає.</tspan></text>
</svg>