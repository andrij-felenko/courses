<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 476" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="476" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина відповідей: що віддати, коли залежність замовкла</text>
<line x1="94.0" y1="92.0" x2="94.0" y2="448.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="64.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">↑ більше користі, менша брехня</text>
<text x="64.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">↓ ближче до повної відмови</text>
<rect x="110.0" y="90.0" width="440.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="330.0" y="121.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">① Свіжа справжня відповідь</tspan></text>
<text x="580.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">залежність жива — деградації не треба</text>
<rect x="110.0" y="150.0" width="440.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="330.0" y="181.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">② Кешований останній добрий стан</tspan></text>
<text x="580.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">твін показує температуру, яку бачив 2 хв тому</text>
<rect x="110.0" y="210.0" width="440.0" height="52.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.8"/><text x="330.0" y="241.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">③ Розумний дефолт</tspan></text>
<text x="580.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">рекомендації мовчать → загальні хіти</text>
<rect x="110.0" y="270.0" width="440.0" height="52.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.8"/><text x="330.0" y="301.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">④ Функція вимкнена, сервіс живий</tspan></text>
<text x="580.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">кнопку сіро, віджет сховано — решта працює</text>
<rect x="110.0" y="330.0" width="440.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="330.0" y="361.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">⑤ Чесна вузька помилка</tspan></text>
<text x="580.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">падає лише зламаний блок, не вся сторінка</text>
<rect x="110.0" y="390.0" width="440.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="330.0" y="421.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">⑥ Уся сторінка вмирає</tspan></text>
<text x="580.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">катастрофа, якої уникаємо</text>
</svg>