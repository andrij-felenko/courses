<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два контракти межі: оголошений і справжній</text>
<rect x="150.0" y="100.0" width="560.0" height="250.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="430.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">спостережна поведінка — усе, що видно ззовні</text>
<rect x="310.0" y="172.0" width="240.0" height="104.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/><text x="430.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">оголошений</tspan><tspan x="430.0" dy="19.5">контракт</tspan></text>
<text x="430.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">різниця = випадковий контракт, на який уже спираються (Гайрам)</text>
<text x="490.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">мета дисципліни — стиснути кільце: обіцяти явно, ховати решту</text>
</svg>