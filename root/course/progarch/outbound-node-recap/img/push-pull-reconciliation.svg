<svg xmlns="http://www.w3.org/2000/svg" viewBox="-101.68 -10 1361.68 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-101.68" y="-10" width="1361.68" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стратегія Push + Pull: миттєвий пуш та фонова звірка</text>
<text x="120.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Шлях PUSH (активний, швидкий, подійний)</text>
<rect x="135.8" y="166.2" width="228.3" height="47.6" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="250.0" y="186.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Бізнес-подія</tspan><tspan x="250.0" dy="15.6">(наприклад, замок відчинено)</tspan></text>
<line x1="364.0" y1="190.0" x2="506.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="510.0" y="166.2" width="240.0" height="47.6" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.5"/><text x="630.0" y="186.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Вихідний вузол (Egress)</tspan><tspan x="630.0" dy="15.6">Outbox → Retry → HTTP POST</tspan></text>
<line x1="754.0" y1="190.0" x2="906.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="910.0" y="166.2" width="220.0" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="186.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">Приймач партнера</tspan><tspan x="1020.0" dy="15.6">(доставка за мілісекунди)</tspan></text>
<text x="630.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">⚠️ При тривалому падінні мережі / сервісу push згасає (DLQ після max retries)</text>
<line x1="80.0" y1="300.0" x2="1180.0" y2="300.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="120.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Шлях PULL (периодична фонова звірка / Reconciliation)</text>
<rect x="140.0" y="406.2" width="220.0" height="47.6" rx="6" fill="#eceef1" stroke="#1a1a1a" stroke-width="1.5"/><text x="250.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Cron-сканер звірки</tspan><tspan x="250.0" dy="15.6">(раз на годину / добу)</tspan></text>
<line x1="364.0" y1="430.0" x2="506.0" y2="430.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="510.0" y="406.2" width="240.0" height="47.6" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="630.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Запит стану API партнера</tspan><tspan x="630.0" dy="15.6">GET /v1/events / GET /status</tspan></text>
<line x1="754.0" y1="430.0" x2="906.0" y2="430.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="910.0" y="406.2" width="220.0" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">Порівняння станів</tspan><tspan x="1020.0" dy="15.6">Відновлення узгодженості</tspan></text>
<text x="630.0" y="610.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Push гарантує низьку латентність у 99.9% випадків. Pull гарантує остаточну узгодженість при 0.1% катастроф.</text>
</svg>