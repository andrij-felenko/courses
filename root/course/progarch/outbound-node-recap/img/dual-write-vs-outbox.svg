<rect x="140.0" y="428.4" width="200.0" height="63.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="448.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">1. BEGIN SQL</tspan><tspan x="240.0" dy="15.6">Оновити стан БД +</tspan><tspan x="240.0" dy="15.6">Запис в outbox</tspan></text>
