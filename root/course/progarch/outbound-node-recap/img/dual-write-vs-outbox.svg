<text x="630.0" y="555.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">✓ Мережевий HTTP-виклик повністю винесено за межі SQL-транзакції.
