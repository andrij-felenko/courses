<text x="630.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">💥 Якщо крок 2 завис або впав — БД робить ROLLBACK, але HTTP POST ВЖЕ полетів! Дублювання грошей / SMS.
