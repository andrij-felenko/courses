<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52.78 -10 1350.5 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-52.78" y="-10" width="1350.5" height="690" fill="#ffffff"/>
