<text x="630.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка подвійного запису (Dual-Write) проти Transactional Outbox</text>
