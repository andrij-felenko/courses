<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихід назовні: три адресати — один архітектурний вузол</text>
<rect x="50.0" y="143.4" width="280.0" height="63.2" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="190.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">ВЕБХУК (машині)</tspan><tspan x="190.0" dy="15.6">POST JSON · HMAC-підпис</tspan><tspan x="190.0" dy="15.6">at-least-once · SLA мілісекунди</tspan></text>
<line x1="336.0" y1="175.0" x2="470.0" y2="345.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="313.4" width="280.0" height="63.2" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.5"/><text x="190.0" y="333.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">СПОВІЩЕННЯ (людині)</tspan><tspan x="190.0" dy="15.6">Push / SMS / Email · тихі години</tspan><tspan x="190.0" dy="15.6">дайджести · пріоритет каналів</tspan></text>
<line x1="336.0" y1="345.0" x2="470.0" y2="345.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="483.4" width="280.0" height="63.2" rx="6" fill="#eafaf0" stroke="#1a1a1a" stroke-width="1.5"/><text x="190.0" y="503.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">ЗОШНІШНЄ API (партнерові)</tspan><tspan x="190.0" dy="15.6">REST / gRPC · OAuth / API-ключ</tspan><tspan x="190.0" dy="15.6">таймаути · ліміти викликів</tspan></text>
<line x1="336.0" y1="515.0" x2="470.0" y2="345.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.5" y="282.2" width="459.0" height="125.6" rx="6" fill="#eceef1" stroke="#1a1a1a" stroke-width="2.0"/><text x="660.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">ЄДИНИЙ ШАР ВИХОДУ (OUTBOUND EGRESS NODE)</tspan><tspan x="660.0" dy="15.6">1. Transactional Outbox (гарантія збереження наміру)</tspan><tspan x="660.0" dy="15.6">2. Egress Dispatcher &amp; Dedup (генерування ключів)</tspan><tspan x="660.0" dy="15.6">3. Policy &amp; Preferences Gate (підписки та тихі години)</tspan><tspan x="660.0" dy="15.6">4. Rate Limiter &amp; Throttler (захист темпу й бюджету)</tspan><tspan x="660.0" dy="15.6">5. Transport &amp; Circuit Breaker (ретраї з jitter + розмикач)</tspan><tspan x="660.0" dy="15.6">6. DLQ &amp; Audit Log (мертва черга й трасування)</tspan></text>
<line x1="895.5" y1="345.0" x2="959.0" y2="345.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="965.0" y="282.2" width="270.0" height="125.6" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="1100.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1100.0" dy="0.0">ЗОШНІШНІ МЕРЕЖІ ТА ПАРТНЕРИ</tspan><tspan x="1100.0" dy="15.6">Сервери партнерів (Webhooks)</tspan><tspan x="1100.0" dy="15.6">Провайдери (APNs, FCM, Twilio)</tspan><tspan x="1100.0" dy="15.6">Зовнішні платіжні / CRM API</tspan><tspan x="1100.0" dy="15.6">― ― ― ― ― ― ― ― ― ― ― ―</tspan><tspan x="1100.0" dy="15.6">Неконтрольовані лаг, падіння,</tspan><tspan x="1100.0" dy="15.6">таймаути та дублікати</tspan></text>
<text x="640.0" y="640.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Адресат визначає формати й політики, але мережеві катастрофи та тактики стійкості ідентичні для всіх виходів.</text>
</svg>