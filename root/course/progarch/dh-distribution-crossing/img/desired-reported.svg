<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один стан на одній машині — три стани на двох</text>
<line x1="440.0" y1="110.0" x2="440.0" y2="158.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,6"/>
<line x1="440.0" y1="178.0" x2="440.0" y2="256.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,6"/>
<line x1="440.0" y1="282.0" x2="440.0" y2="336.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,6"/>
<text x="440.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">межа машини</text>
<text x="210.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">У ДОМІ — джерело правди</text>
<rect x="80.0" y="150.0" width="260.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="210.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">справжній стан</tspan><tspan x="210.0" dy="18.2">ЗАЧИНЕНО</tspan></text>
<text x="720.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">У ХМАРІ — два здогади</text>
<rect x="560.0" y="138.0" width="360.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">бажаний (desired):  ЗАЧИНЕНО</tspan></text>
<rect x="560.0" y="214.0" width="360.0" height="60.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="740.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">востаннє почутий (reported):</tspan><tspan x="740.0" dy="16.2">ВІДЧИНЕНО о 10:02</tspan></text>
<text x="500.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">надсилай бажаний, доки не збіжеться</text>
<line x1="556.0" y1="180.0" x2="344.0" y2="192.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="344.0" y1="226.0" x2="556.0" y2="244.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="500.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">перечитуй справжній</text>
<rect x="120.0" y="350.0" width="760.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Хмара не тримає правду — вона тримає бажане й востаннє почуте; збігаються вони у фоні, не миттєво.</tspan></text>
<text x="830.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">→ зерно твіна дому</text>
