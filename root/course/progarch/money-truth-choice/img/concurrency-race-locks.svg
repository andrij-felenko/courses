<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="340.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="20.0" y="20.0" width="240.0" height="290.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Ordered Locking</text>
<text x="140.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Pessimistic SELECT FOR UPDATE</text>
<rect x="59.9" y="128.6" width="160.2" height="112.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Блокування рахунків</tspan><tspan x="140.0" dy="14.3">у порядку зростання ID:</tspan><tspan x="140.0" dy="14.3">lock(min(AccA, AccB));</tspan><tspan x="140.0" dy="14.3">lock(max(AccA, AccB));</tspan><tspan x="140.0" dy="14.3"></tspan><tspan x="140.0" dy="14.3">✔ Запобігає Deadlocks</tspan><tspan x="140.0" dy="14.3">✖ Блокує потік бази</tspan></text>
<rect x="280.0" y="20.0" width="250.0" height="290.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="405.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Optimistic Sequence</text>
<text x="405.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">CAS / Version per Account</text>
<rect x="318.6" y="128.6" width="172.8" height="112.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="405.0" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Кожен рахунок має</tspan><tspan x="405.0" dy="14.3">послідовний sequence_num.</tspan><tspan x="405.0" dy="14.3">INSERT перевіряє:</tspan><tspan x="405.0" dy="14.3">seq == expected_seq</tspan><tspan x="405.0" dy="14.3"></tspan><tspan x="405.0" dy="14.3">✔ Без блокувань у БД</tspan><tspan x="405.0" dy="14.3">✖ Retry при конфліктах</tspan></text>
<rect x="550.0" y="20.0" width="250.0" height="290.0" rx="8" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/>
<text x="675.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">3. Single-Writer Log</text>
<text x="675.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Partitioned Event Loop</text>
<rect x="594.9" y="128.6" width="160.2" height="112.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Транзакції для рахунку</tspan><tspan x="675.0" dy="14.3">ідуть в один потік.</tspan><tspan x="675.0" dy="14.3">Нуль блокувань!</tspan><tspan x="675.0" dy="14.3">До 100,000+ tx/sec.</tspan><tspan x="675.0" dy="14.3"></tspan><tspan x="675.0" dy="14.3">✔ Максимальна швидкість</tspan><tspan x="675.0" dy="14.3">✔ Гарантований порядок</tspan></text>
</svg>