<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюційний конвеєр Deprecation та автоматизований контроль ерозії</text>
<rect x="40.0" y="60.0" width="210.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="145.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Фаза 1: Notice</tspan><tspan x="145.0" dy="13.0"></tspan><tspan x="145.0" dy="13.0">• Додавання Sunset HTTP-заголовків</tspan><tspan x="145.0" dy="13.0">• Фіксація контрактів у CI</tspan><tspan x="145.0" dy="13.0">• Оповіщення споживачів</tspan></text>
<line x1="250.0" y1="130.0" x2="280.0" y2="130.0" stroke="#1a202c" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="280.0" y="60.0" width="210.0" height="140.0" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/><text x="385.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Фаза 2: Shadowing</tspan><tspan x="385.0" dy="11.7"></tspan><tspan x="385.0" dy="11.7">• Трафіковий дубляж (Traffic Shadowing)</tspan><tspan x="385.0" dy="11.7">• Порівняння відповідей</tspan><tspan x="385.0" dy="11.7">• Нульовий вплив на prod</tspan></text>
<line x1="490.0" y1="130.0" x2="520.0" y2="130.0" stroke="#1a202c" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="60.0" width="210.0" height="140.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="625.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Фаза 3: Dual Write</tspan><tspan x="625.0" dy="11.7"></tspan><tspan x="625.0" dy="11.7">• Подвійний запис у стару й нову БД</tspan><tspan x="625.0" dy="11.7">• Перемикання читання (Canary)</tspan><tspan x="625.0" dy="11.7">• Можливість відкату</tspan></text>
<line x1="730.0" y1="130.0" x2="760.0" y2="130.0" stroke="#1a202c" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="60.0" width="200.0" height="140.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="860.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">Фаза 4: Tombstone</tspan><tspan x="860.0" dy="13.0"></tspan><tspan x="860.0" dy="13.0">• Відключення старого шлюзу</tspan><tspan x="860.0" dy="13.0">• Архівація даних і коду</tspan><tspan x="860.0" dy="13.0">• Звільнення ресурсів</tspan></text>
<rect x="40.0" y="240.0" width="920.0" height="130.0" rx="6" fill="#eef2f6" stroke="#78909c" stroke-width="1.5"/><text x="500.0" y="280.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Автоматизований контроль ерозії (Architecture Fitness Functions у CI/CD):</tspan><tspan x="500.0" dy="14.3"></tspan><tspan x="500.0" dy="14.3">1. Static AST Linter: Заборона нових викликів Deprecated-ендпоінтів у код-базі</tspan><tspan x="500.0" dy="14.3">2. Metrics Alert: Авто-сповіщення при виявленні трафіку на розкладених версіях за 14 днів до Sunset</tspan><tspan x="500.0" dy="14.3">3. ArchUnit Contract Gate: Автоматичне блокування PR, що порушують нові межі команд</tspan></text>
</svg>