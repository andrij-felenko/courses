<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15.64 -10 1015.64 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-15.64" y="-10" width="1015.64" height="460" fill="#ffffff"/>
