<text x="30.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="700">Exit Cost ↑</text>
<line x1="490.0" y1="50.0" x2="490.0" y2="385.0" stroke="#cfd8dc" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="85.0" y1="225.0" x2="930.0" y2="225.0" stroke="#cfd8dc" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="110.0" y="240.0" width="360.0" height="120.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="290.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">1. Self-Hosted (Vanilla Postgres, K8s)</tspan><tspan x="290.0" dy="14.3"></tspan><tspan x="290.0" dy="14.3">• Lock-in Exit Cost: Низька (0–10%)</tspan><tspan x="290.0" dy="14.3">• TCO: Висока операційна складність</tspan><tspan x="290.0" dy="14.3">• Швидкість старту: Повільна</tspan></text>
<rect x="520.0" y="240.0" width="380.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="710.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">2. Managed Open Standard (AWS RDS, MSK)</tspan><tspan x="710.0" dy="14.3"></tspan><tspan x="710.0" dy="14.3">• Lock-in Exit Cost: Поміркована (10–25%)</tspan><tspan x="710.0" dy="14.3">• TCO: Оптимальний баланс</tspan><tspan x="710.0" dy="14.3">• Швидкість старту: Висока (Golden Path)</tspan></text>
<rect x="520.0" y="80.0" width="380.0" height="130.0" rx="6" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/><text x="710.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">3. Deep Cloud Native (DynamoDB, Lambda, AppSync)</tspan><tspan x="710.0" dy="14.3"></tspan><tspan x="710.0" dy="14.3">• Lock-in Exit Cost: Критично висока (60–90%)</tspan><tspan x="710.0" dy="14.3">• TCO: Низький старт, дорого у масштабі</tspan><tspan x="710.0" dy="14.3">• Швидкість: Максимальна на старті</tspan></text>
<rect x="110.0" y="80.0" width="360.0" height="130.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="290.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">4. Cloud Agnostic Trap (Власні обгортки)</tspan><tspan x="290.0" dy="14.3"></tspan><tspan x="290.0" dy="14.3">• Lock-in Exit Cost: Теоретично низька</tspan><tspan x="290.0" dy="14.3">• TCO: Катастрофічно висока (Extraneous Load)</tspan><tspan x="290.0" dy="14.3">• Швидкість: Постійний підпис абстракцій</tspan></text>
