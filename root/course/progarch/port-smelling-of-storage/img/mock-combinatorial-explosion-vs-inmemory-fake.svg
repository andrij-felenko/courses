<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Тестування через порт: комбінаторні моки проти автономного Fake</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Низькорівневий CRUD-порт спричиняє вибух перестановок O(k!); доменний Fake зберігає стан за O(1)</text>

  <!-- ЛІВА ПАНЕЛЬ: Технічний порт і моки -->
  <rect x="24" y="78" width="446" height="422" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шапка лівої панелі -->
  <rect x="40" y="92" width="414" height="44" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="110" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Технічний CRUD-порт: граф моків</text>
  <text x="247" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Верифікація викликів • Комбінаторний вибух O(k!) та O(m^k)</text>

  <!-- Вузол: Тестовий сценарій (ліворуч) -->
  <rect x="162" y="148" width="170" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="167" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Сценарій: PayOrder(id)</text>

  <!-- Стрілка до рівня 1 -->
  <path d="M247,176 L247,194" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Рівень 1: Перший виклик мока -->
  <rect x="137" y="196" width="220" height="30" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="247" y="215" font-size="12" fill="#c0392b" text-anchor="middle">1. port.findById(id) ➔ mock</text>

  <!-- Стрілки розгалуження до рівня 2 -->
  <path d="M220,226 L117,252" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <path d="M247,226 L247,252" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <path d="M274,226 L377,252" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <!-- Рівень 2: Проміжні виклики -->
  <!-- 2a: tx.begin() -->
  <rect x="48" y="254" width="118" height="42" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="107" y="271" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">2a. tx.begin()</text>
  <text x="107" y="287" font-size="12" fill="#6b7280" text-anchor="middle">транзакція БД</text>

  <!-- 2b: lockRow() -->
  <rect x="188" y="254" width="118" height="42" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="271" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">2b. lockRow()</text>
  <text x="247" y="287" font-size="12" fill="#6b7280" text-anchor="middle">SQL-блокування</text>

  <!-- 2c: checkVer() -->
  <rect x="328" y="254" width="118" height="42" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="387" y="271" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">2c. checkVer()</text>
  <text x="387" y="287" font-size="12" fill="#6b7280" text-anchor="middle">перевірка версії</text>

  <!-- Стрілки перехресних перестановок між рівнем 2 і 3 -->
  <path d="M107,296 L107,322" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M125,296 L230,322" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M235,296 L125,322" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M247,296 L247,322" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M260,296 L368,322" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M370,296 L265,322" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M387,296 L387,322" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>

  <!-- Рівень 3: Завершальні технічні кроки -->
  <!-- 3a: updateRow() -->
  <rect x="52" y="324" width="112" height="38" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="108" y="340" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">3a. updateRow()</text>
  <text x="108" y="354" font-size="12" fill="#6b7280" text-anchor="middle">SQL UPDATE</text>

  <!-- 3b: auditLog() -->
  <rect x="191" y="324" width="112" height="38" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="340" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">3b. auditLog()</text>
  <text x="247" y="354" font-size="12" fill="#6b7280" text-anchor="middle">запис в аудит</text>

  <!-- 3c: tx.commit() -->
  <rect x="331" y="324" width="112" height="38" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="387" y="340" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">3c. tx.commit()</text>
  <text x="387" y="354" font-size="12" fill="#6b7280" text-anchor="middle">фіксація БД</text>

  <!-- Рамка комбінаторики перестановок -->
  <rect x="65" y="374" width="364" height="30" rx="4" fill="#ffffff" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="247" y="393" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">k = 5 CRUD-викликів ➔ k! = 120 перестановок у verify()</text>

  <!-- Нижній блок проблем лівої панелі -->
  <rect x="40" y="418" width="414" height="72" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="52" y="437" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#c0392b">Жорстка прив&apos;язка: </tspan>тест дублює послідовність CRUD-викликів</text>
  <text x="52" y="455" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#c0392b">Вибух O(k!): </tspan>перестановка операцій ламає inOrder.verify()</text>
  <text x="52" y="473" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#c0392b">Крихкість: </tspan>рефакторинг запитів руйнує тестовий набір</text>


  <!-- ПРАВА ПАНЕЛЬ: Доменний порт і Fake -->
  <rect x="490" y="78" width="446" height="422" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шапка правої панелі -->
  <rect x="506" y="92" width="414" height="44" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="713" y="110" font-size="14" font-weight="700" fill="#27ae60" text-anchor="middle">Доменний порт: автономний In-Memory Fake</text>
  <text x="713" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Перевірка стану • Константна складність O(1) на хеш-таблиці</text>

  <!-- Вузол: Тестовий сценарій (праворуч) -->
  <rect x="628" y="148" width="170" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="713" y="167" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Сценарій: PayOrder(id)</text>

  <!-- Стрілка до порту наміру -->
  <path d="M713,176 L713,194" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Доменний порт (один атомарний виклик наміру) -->
  <rect x="578" y="196" width="270" height="30" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="713" y="215" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">orders.save(order) ➔ виклик наміру O(1)</text>

  <!-- Стрілка до Fake -->
  <path d="M713,226 L713,244" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- In-Memory Fake контейнер -->
  <rect x="526" y="246" width="374" height="114" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="542" y="265" font-size="12" font-weight="700" fill="#27ae60">InMemoryOrderRepository</text>
  <text x="884" y="265" font-size="12" fill="#6b7280" text-anchor="end">Map&lt;Id, Order&gt; • O(1)</text>

  <!-- Елемент хеш-таблиці: Запис 1 -->
  <rect x="540" y="275" width="346" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="0.75"/>
  <rect x="548" y="282" width="64" height="20" rx="2" fill="#ffffff" stroke="#27ae60" stroke-width="0.5"/>
  <text x="580" y="296" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">id: 101</text>
  <path d="M620,292 L636,292" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="646" y="296" font-size="12" fill="#1a1a1a">Order(status: <tspan font-weight="700" fill="#27ae60">PAID</tspan>, total: 450 грн)</text>

  <!-- Елемент хеш-таблиці: Запис 2 -->
  <rect x="540" y="316" width="346" height="34" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="0.75"/>
  <rect x="548" y="323" width="64" height="20" rx="2" fill="#ffffff" stroke="#d0d7de" stroke-width="0.5"/>
  <text x="580" y="337" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">id: 102</text>
  <path d="M620,333 L636,333" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="646" y="337" font-size="12" fill="#6b7280">Order(status: NEW,  total: 120 грн)</text>

  <!-- Стрілка до верифікації стану -->
  <path d="M713,360 L713,372" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Блок верифікації стану -->
  <rect x="540" y="374" width="346" height="30" rx="4" fill="#ffffff" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="713" y="393" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">assert fake.findById(101).status == PAID (стан O(1))</text>

  <!-- Нижній блок розв'язку правої панелі -->
  <rect x="506" y="418" width="414" height="72" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="518" y="437" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#27ae60">Повна автономність: </tspan>двійник не потребує mock-бібліотек</text>
  <text x="518" y="455" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#27ae60">Складність O(1): </tspan>один атомарний виклик доменного наміру</text>
  <text x="518" y="473" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#27ae60">Стійкість: </tspan>рефакторинг не ламає перевірку кінцевого стану</text>
</svg>
