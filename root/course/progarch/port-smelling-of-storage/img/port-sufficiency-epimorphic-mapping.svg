<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Відображення просторів контракту: відкритий витік vs епіморфізм намірів</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Відкритий порт пропускає дерево виразів L_rel у ядро; достатній порт утворює епіморфізм f: I ↠ Ops і закриває схему S в адаптері</text>

  <!-- ==================== ВЕРХНЯ ПАНЕЛЬ: ВІДКРИТИЙ ПОРТ (НЕ ТАК) ==================== -->
  <rect x="24" y="68" width="912" height="224" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок верхньої панелі та плашка стану -->
  <text x="44" y="91" font-size="14" font-weight="700" fill="#c0392b">ВІДКРИТИЙ ПОРТ: ВИТІК РЕЛЯЦІЙНОГО ДЕРЕВА ВИРАЗІВ L_rel У ЯДРО</text>
  <rect x="686" y="76" width="230" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="801" y="91" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">ПРОТІКАННЯ ШАРУ • ρ = ∞</text>

  <!-- Картка 1: Доменне ядро (Top) -->
  <rect x="44" y="104" width="242" height="144" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="165" y="124" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Доменне ядро (Core)</text>
  <text x="165" y="140" font-size="12" fill="#6b7280" text-anchor="middle">Сценарій клімат-контролю</text>
  <text x="56" y="158" font-size="12" fill="#1a1a1a">• Намір i₁: нагріти холодні зони</text>
  <text x="56" y="174" font-size="12" fill="#c0392b">• Будує реляційне дерево:</text>
  <text x="68" y="192" font-size="12" font-weight="700" fill="#c0392b">AND(current_temp &lt; 18, ...)</text>
  <rect x="54" y="204" width="222" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="165" y="218" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Витік схеми: h(S) ⊂ Core</text>
  <text x="165" y="233" font-size="12" fill="#c0392b" text-anchor="middle">Ризик стану s ∉ Σ_valid</text>

  <!-- Зв'язок 1->2 (Top: виклик зі специфікацією) -->
  <line x1="286" y1="146" x2="330" y2="146" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="311" y="140" font-size="12" fill="#6b7280" text-anchor="middle">виклик</text>
  <!-- Зв'язок 2->1 (Top: проникнення мови запитів L_rel назад у ядро) -->
  <line x1="338" y1="184" x2="294" y2="184" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="311" y="178" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">L_rel</text>

  <!-- Картка 2: Відкритий дірявий порт (Top) -->
  <rect x="338" y="104" width="264" height="144" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="470" y="124" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Відкритий дірявий порт</text>
  <text x="470" y="140" font-size="12" fill="#6b7280" text-anchor="middle">Нескінченна виразна сила Q(S)</text>
  <text x="350" y="158" font-size="12" font-weight="700" fill="#1a1a1a">+ find(Specification&lt;Zone&gt; spec)</text>
  <text x="350" y="174" font-size="12" fill="#1a1a1a">• Приймає довільні: σ_ϕ, π_X, ⋈</text>
  <text x="350" y="192" font-size="12" fill="#c0392b">• Дерево виразів L_rel не обмежене</text>
  <rect x="348" y="204" width="244" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="470" y="218" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Надлишковість ρ = |Q(S)|/|I| = ∞</text>
  <text x="470" y="233" font-size="12" fill="#c0392b" text-anchor="middle">Пряме проникнення алгебри Кодда</text>

  <!-- Зв'язок 2->3 (Top: трансляція без захисту) -->
  <line x1="602" y1="160" x2="644" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="625" y="152" font-size="12" fill="#6b7280" text-anchor="middle">SQL</text>

  <!-- Картка 3: Сховище та пасивний адаптер (Top) -->
  <rect x="652" y="104" width="264" height="144" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="784" y="124" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Сховище та пасивний адаптер</text>
  <text x="784" y="140" font-size="12" fill="#6b7280" text-anchor="middle">Реляційна схема S = {R₁..R_m}</text>
  <text x="664" y="158" font-size="12" fill="#1a1a1a">• Пасивний транслятор Criteria 1:1</text>
  <text x="664" y="174" font-size="12" fill="#1a1a1a">• Стовпчик: zone.current_temp</text>
  <text x="664" y="192" font-size="12" fill="#c0392b">• Зміна схеми: S → S' (нова таблиця)</text>
  <rect x="662" y="204" width="244" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="784" y="218" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Схема S незахищена (витік)</text>
  <text x="784" y="233" font-size="12" fill="#c0392b" text-anchor="middle">Ламає сценарій у ядрі (ΔCore ≠ ∅)</text>

  <!-- Підсумкова плашка верхньої панелі -->
  <rect x="44" y="258" width="872" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="274" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Зміна схеми сховища руйнує ядро: ∂Core/∂S = (∂Core/∂L_port) · h'(S) ≠ 0 ➔ доменні сценарії потребують модифікації</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ЗАКРИТИЙ ПОРТ (ТАК) ==================== -->
  <rect x="24" y="308" width="912" height="224" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок нижньої панелі та плашка стану -->
  <text x="44" y="331" font-size="14" font-weight="700" fill="#27ae60">ЗАКРИТИЙ ДОСТАТНІЙ ПОРТ: ЕПІМОРФІЗМ НАМІРІВ f: I ↠ Ops_port</text>
  <rect x="686" y="316" width="230" height="22" rx="11" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="801" y="331" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ДОСТАТНІЙ ПОРТ • ρ = 1</text>

  <!-- Картка 1: Доменне ядро (Bottom) -->
  <rect x="44" y="344" width="242" height="144" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="165" y="364" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Доменне ядро (Core)</text>
  <text x="165" y="380" font-size="12" fill="#6b7280" text-anchor="middle">Скінченна множина намірів I</text>
  <text x="56" y="398" font-size="12" font-weight="700" fill="#1a1a1a">I = { i₁, i₂, ..., i_n } (бізнес-наміри)</text>
  <text x="56" y="416" font-size="12" fill="#1a1a1a">• i₁: зони, де потрібне опалення</text>
  <text x="56" y="434" font-size="12" fill="#1a1a1a">• i₂: кімнати з відкритими вікнами</text>
  <rect x="54" y="444" width="222" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="165" y="458" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Збереження інваріантів I_dom</text>
  <text x="165" y="473" font-size="12" fill="#27ae60" text-anchor="middle">Стан валідний: s ∈ Σ_valid</text>

  <!-- Зв'язок 1->2 (Bottom: сюр'єктивне звернення f) -->
  <line x1="286" y1="400" x2="330" y2="400" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="311" y="392" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">f(I)</text>

  <!-- Картка 2: Закритий достатній порт (Bottom) -->
  <rect x="338" y="344" width="264" height="144" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="470" y="364" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Закритий достатній порт</text>
  <text x="470" y="380" font-size="12" fill="#6b7280" text-anchor="middle">Дискретні операції Ops ⊂ P_dom</text>
  <text x="350" y="398" font-size="12" font-weight="700" fill="#2457d6">+ findZonesRequiringHeating()</text>
  <text x="350" y="416" font-size="12" font-weight="700" fill="#2457d6">+ findRoomsWithOpenWindows()</text>
  <text x="350" y="434" font-size="12" fill="#1a1a1a">• Суто доменні предикати P_dom</text>
  <rect x="348" y="444" width="244" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="470" y="458" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Сюр'єкція: f : I ↠ Ops_port</text>
  <text x="470" y="473" font-size="12" fill="#27ae60" text-anchor="middle">Оптимальність: ρ = |Ops|/|I| = 1</text>

  <!-- Зв'язок 2->3 (Bottom: адаптер реалізує контракт) -->
  <line x1="602" y1="400" x2="644" y2="400" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="625" y="392" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">T(I)</text>

  <!-- Картка 3: Вторинний адаптер і сховище (Bottom) -->
  <rect x="652" y="344" width="264" height="144" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="784" y="364" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Вторинний адаптер і сховище</text>
  <text x="784" y="380" font-size="12" fill="#6b7280" text-anchor="middle">Поглинання реляційної складності</text>
  <text x="664" y="398" font-size="12" fill="#1a1a1a">• Трансляція T: I → Q(S) всередині</text>
  <text x="664" y="416" font-size="12" fill="#1a1a1a">• PostgreSQL: SQL + JOIN ⋈</text>
  <text x="664" y="434" font-size="12" fill="#1a1a1a">• Redis: SMEMBERS, HGETALL</text>
  <rect x="662" y="444" width="244" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="784" y="458" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Повна ізоляція: S_rel або S_kv</text>
  <text x="784" y="473" font-size="12" fill="#27ae60" text-anchor="middle">Зміна схеми не виходить з адаптера</text>

  <!-- Підсумкова плашка нижньої панелі -->
  <rect x="44" y="498" width="872" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="514" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Адаптер поглинає схему сховища: ∂Core/∂S = (∂Core/∂Ops) · 0 = 0 ➔ доменне ядро цілком інваріантне до змін БД (ΔCore = ∅)</text>
</svg>
