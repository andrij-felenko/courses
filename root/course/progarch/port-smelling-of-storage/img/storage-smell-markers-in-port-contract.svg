<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Анатомія запаху сховища в контракті порту</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Чотири точки інфікування: інтерфейс копіює табличну модель СКБД замість намірів домену</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ДОМЕННЕ ЯДРО ==================== -->
  <rect x="24" y="74" width="426" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок лівої панелі -->
  <text x="38" y="96" font-size="13" font-weight="bold" fill="#1a1a1a">ДОМЕННЕ ЯДРО: ІНТЕРФЕЙС ПОРТУ</text>
  <text x="38" y="114" font-size="12" fill="#6b7280">Пакет domain.port • Формально всередині ядра</text>

  <!-- Плашка статусу зліва -->
  <rect x="316" y="84" width="122" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="377" y="99" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ЗАПАХ СХОВИЩА</text>

  <!-- Контейнер коду інтерфейсу -->
  <rect x="34" y="126" width="406" height="398" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Заголовок інтерфейсу -->
  <rect x="34" y="126" width="406" height="26" fill="#fdecea"/>
  <text x="44" y="144" font-size="12" font-weight="bold" fill="#c0392b">public interface DeviceRepository {</text>

  <!-- Блок 1: CRUD-дієслова -->
  <rect x="42" y="158" width="390" height="80" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="52" y="174" font-size="12" font-weight="bold" fill="#c0392b">МАРКЕР 1: CRUD-ДІЄСЛОВА (save, delete)</text>
  <text x="52" y="194" font-size="12">
    <tspan fill="#6b7280">void </tspan>
    <tspan font-weight="bold" fill="#c0392b">save</tspan>
    <tspan fill="#1a1a1a">(DeviceEntity device);</tspan>
  </text>
  <text x="52" y="212" font-size="12">
    <tspan fill="#6b7280">void </tspan>
    <tspan font-weight="bold" fill="#c0392b">delete</tspan>
    <tspan fill="#1a1a1a">(Long id);</tspan>
  </text>
  <text x="52" y="230" font-size="12" fill="#6b7280">Операції життєвого циклу таблиць замість дій домену</text>

  <!-- Блок 2: Витік ORM-сутності -->
  <rect x="42" y="248" width="390" height="80" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="52" y="264" font-size="12" font-weight="bold" fill="#c0392b">МАРКЕР 2: ВИТІК ORM-СУТНОСТІ (DeviceEntity)</text>
  <text x="52" y="284" font-size="12">
    <tspan font-weight="bold" fill="#c0392b">DeviceEntity</tspan>
    <tspan fill="#1a1a1a"> findById(Long id);</tspan>
  </text>
  <text x="52" y="302" font-size="12">
    <tspan fill="#6b7280">@Entity @Table </tspan>
    <tspan font-weight="bold" fill="#c0392b">DeviceEntity</tspan>
    <tspan fill="#6b7280"> (сетери)</tspan>
  </text>
  <text x="52" y="320" font-size="12" fill="#6b7280">Сетери руйнують інкапсуляцію, ризик Lazy Loading</text>

  <!-- Блок 3: Первинний числовий ключ -->
  <rect x="42" y="338" width="390" height="80" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="52" y="354" font-size="12" font-weight="bold" fill="#c0392b">МАРКЕР 3: ЧИСЛОВИЙ КЛЮЧ БД (Long id)</text>
  <text x="52" y="374" font-size="12">
    <tspan fill="#1a1a1a">void updateStatus(</tspan>
    <tspan font-weight="bold" fill="#c0392b">Long id</tspan>
    <tspan fill="#1a1a1a">, String status);</tspan>
  </text>
  <text x="52" y="392" font-size="12">
    <tspan fill="#1a1a1a">findById(</tspan>
    <tspan font-weight="bold" fill="#c0392b">Long id</tspan>
    <tspan fill="#1a1a1a">);  delete(</tspan>
    <tspan font-weight="bold" fill="#c0392b">Long id</tspan>
    <tspan fill="#1a1a1a">);</tspan>
  </text>
  <text x="52" y="410" font-size="12" fill="#6b7280">Сирий примітив без валідації замість Value Object</text>

  <!-- Блок 4: Реляційна пагінація -->
  <rect x="42" y="428" width="390" height="80" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="52" y="444" font-size="12" font-weight="bold" fill="#c0392b">МАРКЕР 4: РЕЛЯЦІЙНА ПАГІНАЦІЯ (Pageable)</text>
  <text x="52" y="464" font-size="12">
    <tspan fill="#1a1a1a">List&lt;DeviceEntity&gt; findAll(</tspan>
    <tspan font-weight="bold" fill="#c0392b">Pageable</tspan>
    <tspan fill="#1a1a1a"> p);</tspan>
  </text>
  <text x="52" y="482" font-size="12">
    <tspan fill="#6b7280">org.springframework.data.domain.</tspan>
    <tspan font-weight="bold" fill="#c0392b">Pageable</tspan>
  </text>
  <text x="52" y="500" font-size="12" fill="#6b7280">Протікання SQL-фільтрів та табличного сортування</text>

  <!-- Закриття інтерфейсу -->
  <text x="44" y="518" font-size="12" font-weight="bold" fill="#c0392b">}</text>

  <!-- ==================== МЕЖА ДОМЕНУ (РОЗДІЛЮВАЧ) ==================== -->
  <text x="480" y="88" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">
    <tspan x="480" dy="0">МЕЖА</tspan>
    <tspan x="480" dy="14">ДОМЕНУ</tspan>
  </text>
  <line x1="480" y1="110" x2="480" y2="534" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- ==================== ПРАВА ПАНЕЛЬ: ІНФРАСТРУКТУРА ==================== -->
  <rect x="510" y="74" width="426" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок правої панелі -->
  <text x="524" y="96" font-size="13" font-weight="bold" fill="#1a1a1a">ІНФРАСТРУКТУРА: БАЗА ДАНИХ ТА ORM</text>
  <text x="524" y="114" font-size="12" fill="#6b7280">Зовнішній рівень • Технічні механізми збереження</text>

  <!-- Плашка статусу справа -->
  <rect x="806" y="84" width="118" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="865" y="99" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ДЖЕРЕЛО ВИТОКУ</text>

  <!-- Картка 1: Джерело CRUD -->
  <rect x="518" y="158" width="410" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="528" y="174" font-size="12" font-weight="bold" fill="#c0392b">ДЖЕРЕЛО: SQL-КОМАНДИ INSERT / DELETE</text>
  <text x="528" y="194" font-size="12" fill="#1a1a1a">Походження: мутації рядків у фізичній таблиці СКБД</text>
  <text x="528" y="212" font-size="12" fill="#6b7280">Симптом: агрегат вироджується у пасивний контейнер даних</text>
  <text x="528" y="230" font-size="12" font-weight="bold" fill="#27ae60">Доменний шов: registerDevice(), retireDevice()</text>

  <!-- Картка 2: Джерело ORM -->
  <rect x="518" y="248" width="410" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="528" y="264" font-size="12" font-weight="bold" fill="#c0392b">ДЖЕРЕЛО: ПЕРСИСТЕНТНА МОДЕЛЬ JPA / HIBERNATE</text>
  <text x="528" y="284" font-size="12" fill="#1a1a1a">Походження: проксі-об'єкти, прив'язані до сесії СКБД</text>
  <text x="528" y="302" font-size="12" fill="#6b7280">Симптом: аварія LazyInitializationException у тестах</text>
  <text x="528" y="320" font-size="12" font-weight="bold" fill="#27ae60">Доменний шов: чистий SmartDevice + знімок стану</text>

  <!-- Картка 3: Джерело PK -->
  <rect x="518" y="338" width="410" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="528" y="354" font-size="12" font-weight="bold" fill="#c0392b">ДЖЕРЕЛО: РЕЛЯЦІЙНИЙ ПЕРВИННИЙ КЛЮЧ (BIGINT)</text>
  <text x="528" y="374" font-size="12" fill="#1a1a1a">Походження: числовий автоінкремент або стовпчик таблиці</text>
  <text x="528" y="392" font-size="12" fill="#6b7280">Симптом: ризик перестановки id будинку та пристрою в коді</text>
  <text x="528" y="410" font-size="12" font-weight="bold" fill="#27ae60">Доменний шов: незмінний Value Object DeviceId</text>

  <!-- Картка 4: Джерело Пагінації -->
  <rect x="518" y="428" width="410" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="528" y="444" font-size="12" font-weight="bold" fill="#c0392b">ДЖЕРЕЛО: РЕЛЯЦІЙНА АЛГЕБРА (LIMIT / OFFSET)</text>
  <text x="528" y="464" font-size="12" fill="#1a1a1a">Походження: технічна вибірка порціями для UI або мережі</text>
  <text x="528" y="482" font-size="12" fill="#6b7280">Симптом: домен стає заручником механізмів вибірки СКБД</text>
  <text x="528" y="500" font-size="12" font-weight="bold" fill="#27ae60">Доменний шов: бізнес-предикати (findActiveDevices())</text>

  <!-- ==================== СТРІЛКИ ПЕРЕТИНУ МЕЖІ ==================== -->
  <!-- Стрілка 1: Інфікування CRUD -->
  <line x1="518" y1="198" x2="434" y2="198" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- Стрілка 2: Інфікування ORM -->
  <line x1="518" y1="288" x2="434" y2="288" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- Стрілка 3: Інфікування PK -->
  <line x1="518" y1="378" x2="434" y2="378" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- Стрілка 4: Інфікування Пагінацією -->
  <line x1="518" y1="468" x2="434" y2="468" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
</svg>
