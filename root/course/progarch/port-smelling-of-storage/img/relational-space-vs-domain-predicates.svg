<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Невідповідність просторів: реляційна алгебра Q(S) проти предикатів P_dom</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Відкрита фільтрація веде до витоку схеми й руйнує I_dom; закриті предикати захищають Σ_valid</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ПРОБЛЕМА ==================== -->
  <rect x="24" y="68" width="444" height="412" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка лівої панелі -->
  <rect x="36" y="78" width="420" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="246" y="97" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Витік сховища: відкритий реляційний простір Q(S)</text>
  <text x="246" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Необмежена реляційна алгебра експортує внутрішню схему S</text>

  <!-- Блок сигнатури: витік мови сховища -->
  <rect x="36" y="136" width="420" height="58" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="155" font-size="12" font-weight="bold" fill="#c0392b">Порт із витоком фільтрації (|Q(S)| = ∞):</text>
  <text x="50" y="175" font-size="12" fill="#1a1a1a">find(filter: Expression&lt;Func&lt;OrderTable, bool&gt;&gt;): List&lt;Order&gt;</text>

  <!-- Блок діаграми станів: лівий -->
  <rect x="36" y="202" width="420" height="188" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="222" font-size="12" font-weight="bold" fill="#1a1a1a">Простір станів таблиць Σ_rel та операцій Q(S):</text>

  <!-- Заборонена зона: Σ_rel \ Σ_valid -->
  <rect x="48" y="234" width="396" height="106" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="58" y="250" font-size="12" font-weight="bold" fill="#c0392b">Заборонені стани: Σ_rel \ Σ_valid (I_dom = false)</text>

  <!-- Область допустимих станів Σ_valid -->
  <rect x="56" y="262" width="134" height="66" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="123" y="290" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Область Σ_valid</text>
  <text x="123" y="310" font-size="12" fill="#2457d6" text-anchor="middle">I_dom = true</text>

  <!-- Реляційна вибірка q = σ_θ(S), що перетинає межу (контур) -->
  <rect x="180" y="268" width="254" height="54" rx="6" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="307" y="290" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вибірка q = σ_θ(S) над таблицями S</text>
  <text x="307" y="309" font-size="12" fill="#c0392b" text-anchor="middle">Захоплює невалідні стани поза Σ_valid!</text>

  <text x="50" y="360" font-size="12" fill="#6b7280">Довільна селекція σ_θ розсікає простір без контролю агрегату</text>
  <text x="50" y="377" font-size="12" fill="#6b7280">Ядро отримує частковий або пошкоджений стан (I_dom зруйновано)</text>

  <!-- Блок висновку лівої панелі -->
  <rect x="36" y="398" width="420" height="66" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="50" y="419" font-size="12" font-weight="bold" fill="#c0392b">Помилка проєктування: протікання реляційної алгебри</text>
  <text x="50" y="437" font-size="12" fill="#1a1a1a">|Q(S)| = ∞: порт не встановлює замкненої архітектурної межі;</text>
  <text x="50" y="453" font-size="12" fill="#6b7280">бізнес-правила розпорошуються між клієнтами та базою даних</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: РОЗВ'ЯЗОК ==================== -->
  <rect x="492" y="68" width="444" height="412" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка правої панелі -->
  <rect x="504" y="78" width="420" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="714" y="97" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Захищений порт: замкнена система предикатів P_dom</text>
  <text x="714" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Скінченний контракт фіксує бізнес-сценарії без витоку SQL</text>

  <!-- Блок сигнатури закритого порту -->
  <rect x="504" y="136" width="420" height="58" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="518" y="155" font-size="12" font-weight="bold" fill="#27ae60">Замкнений доменний контракт (|P_dom| = k &lt; ∞):</text>
  <text x="518" y="175" font-size="12" fill="#1a1a1a">findPendingForCustomer(id: CustomerId): List&lt;Order&gt;</text>

  <!-- Блок діаграми станів: правий -->
  <rect x="504" y="202" width="420" height="188" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="518" y="222" font-size="12" font-weight="bold" fill="#1a1a1a">Замкнений периметр бізнес-предикатів P_dom:</text>

  <!-- Заборонена зона недосяжна -->
  <rect x="516" y="234" width="396" height="106" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="526" y="250" font-size="12" fill="#6b7280">Недосяжні стани: Σ_rel \ Σ_valid (ізольовано портом)</text>

  <!-- Захисний периметр P_dom навколо Σ_valid -->
  <rect x="526" y="262" width="376" height="66" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <!-- Предикат p1 -->
  <rect x="536" y="271" width="104" height="48" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="588" y="290" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">p_1(s) ∈ P_dom</text>
  <text x="588" y="308" font-size="12" fill="#1a1a1a" text-anchor="middle">активні замовл.</text>

  <!-- Предикат p2 -->
  <rect x="650" y="271" width="104" height="48" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="702" y="290" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">p_2(s) ∈ P_dom</text>
  <text x="702" y="308" font-size="12" fill="#1a1a1a" text-anchor="middle">протерміновані</text>

  <!-- Область валідних станів Σ_valid -->
  <rect x="764" y="271" width="128" height="48" rx="4" fill="#27ae60"/>
  <text x="828" y="290" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Область Σ_valid</text>
  <text x="828" y="308" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">I_dom = true</text>

  <text x="518" y="360" font-size="12" fill="#6b7280">Усі запити відображаються у скінченну множину сценаріїв</text>
  <text x="518" y="377" font-size="12" fill="#6b7280">Доменні інваріанти непорушні: ∀s ∈ Σ_valid : I_dom(s) = true</text>

  <!-- Блок висновку правої панелі -->
  <rect x="504" y="398" width="420" height="66" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="518" y="419" font-size="12" font-weight="bold" fill="#27ae60">Формальний критерій достатності порту</text>
  <text x="518" y="437" font-size="12" fill="#1a1a1a">|P_dom| = k &lt; ∞: повна інкапсуляція доменних інваріантів;</text>
  <text x="518" y="453" font-size="12" fill="#6b7280">нуль витоку сховища, контракт формулюється мовою намірів ядра</text>
</svg>
