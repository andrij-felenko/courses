<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <!-- Маркери стрілок для потоків викликів та поширення змін -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Синтаксична та семантична інверсія залежностей</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Чистий семантичний порт поглинає зміни сховища в адаптері, захищаючи домен від деталей бази даних</text>

  <!-- ==================== ВЕРХНЯ ПАНЕЛЬ: СИНТАКСИЧНА ІНВЕРСІЯ (НЕ ТАК) ==================== -->
  <rect x="24" y="72" width="912" height="226" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок верхньої панелі та плашка стану -->
  <text x="44" y="95" font-size="14" font-weight="bold" fill="#c0392b">Синтаксична інверсія: порт дублює табличну структуру БД</text>
  <rect x="712" y="80" width="204" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="814" y="95" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ХИБНА ІНВЕРСІЯ • ЗАПАХ БД</text>

  <!-- Картка 1: Доменне ядро -->
  <rect x="44" y="110" width="196" height="130" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="142" y="130" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Доменне ядро</text>
  <text x="142" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Сценарій замовлення</text>
  <text x="142" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">repo.getByUserId(fk)</text>
  <rect x="54" y="188" width="176" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="142" y="203" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Залежне від схеми БД</text>
  <text x="142" y="220" font-size="12" fill="#c0392b" text-anchor="middle">Ламається при рефакторингу</text>

  <!-- Зв'язок 1->2 (виклик) -->
  <line x1="240" y1="148" x2="254" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Картка 2: Синтаксичний порт -->
  <rect x="256" y="110" width="224" height="130" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="368" y="130" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">«Порт» (калька БД)</text>
  <text x="368" y="148" font-size="12" fill="#6b7280" text-anchor="middle">«Фальшивий» інтерфейс</text>
  <text x="368" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">IOrderTableRepository</text>
  <rect x="268" y="188" width="200" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="368" y="203" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">CRUD, OrderRowDTO, FK</text>
  <text x="368" y="220" font-size="12" fill="#c0392b" text-anchor="middle">Протікання понять SQL</text>

  <!-- Зв'язок 3->2 (реалізація) -->
  <line x1="496" y1="148" x2="482" y2="148" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>

  <!-- Картка 3: Адаптер сховища -->
  <rect x="496" y="110" width="210" height="130" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="601" y="130" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Адаптер сховища</text>
  <text x="601" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Тонкий passthrough</text>
  <text x="601" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">OrderDaoAdapter</text>
  <rect x="508" y="188" width="186" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="601" y="203" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Без захисного мапінгу</text>
  <text x="601" y="220" font-size="12" fill="#c0392b" text-anchor="middle">Транслює виклики 1:1</text>

  <!-- Зв'язок 3->4 (SQL виклики) -->
  <line x1="706" y1="148" x2="720" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Картка 4: База даних -->
  <rect x="722" y="110" width="194" height="130" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="819" y="130" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">База даних (БД)</text>
  <text x="819" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Реляційна схема</text>
  <text x="819" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">Таблиця order_table</text>
  <rect x="732" y="188" width="174" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="819" y="203" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зміна схеми: поділ</text>
  <text x="819" y="220" font-size="12" fill="#c0392b" text-anchor="middle">Нові стовпці, типи</text>

  <!-- Хвиля змін у верхній панелі -->
  <line x1="819" y1="258" x2="144" y2="258" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="480" y="280" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Хвиля змін схеми БД проходить крізь фальшивий порт і ламає бізнес-правила домену</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: СЕМАНТИЧНА ІНВЕРСІЯ (ТАК) ==================== -->
  <rect x="24" y="312" width="912" height="226" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок нижньої панелі та плашка стану -->
  <text x="44" y="335" font-size="14" font-weight="bold" fill="#27ae60">Семантична інверсія: контракт виражено мовою доменних потреб</text>
  <rect x="712" y="320" width="204" height="22" rx="11" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="814" y="335" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">СПРАВЖНІЙ ПОРТ • ІЗОЛЯЦІЯ</text>

  <!-- Картка 1: Доменне ядро -->
  <rect x="44" y="350" width="196" height="130" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="142" y="370" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Доменне ядро</text>
  <text x="142" y="388" font-size="12" fill="#6b7280" text-anchor="middle">Сценарій замовлення</text>
  <text x="142" y="408" font-size="12" fill="#1a1a1a" text-anchor="middle">port.register(order)</text>
  <rect x="54" y="428" width="176" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="142" y="443" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Чисті сутності бізнесу</text>
  <text x="142" y="460" font-size="12" fill="#27ae60" text-anchor="middle">Повна стабільність ядра</text>

  <!-- Зв'язок 1->2 (виклик) -->
  <line x1="240" y1="388" x2="254" y2="388" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Картка 2: Семантичний порт -->
  <rect x="256" y="350" width="224" height="130" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="368" y="370" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Семантичний порт</text>
  <text x="368" y="388" font-size="12" fill="#6b7280" text-anchor="middle">Вихідний інтерфейс</text>
  <text x="368" y="408" font-size="12" fill="#1a1a1a" text-anchor="middle">OrderPlacementPort</text>
  <rect x="268" y="428" width="200" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="368" y="443" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">placeOrder(Order)</text>
  <text x="368" y="460" font-size="12" fill="#27ae60" text-anchor="middle">Нуль витоків деталей БД</text>

  <!-- Зв'язок 3->2 (реалізація) -->
  <line x1="496" y1="388" x2="482" y2="388" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>

  <!-- Картка 3: Адаптер сховища -->
  <rect x="496" y="350" width="210" height="130" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="601" y="370" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Адаптер сховища</text>
  <text x="601" y="388" font-size="12" fill="#6b7280" text-anchor="middle">Поглинач складності</text>
  <text x="601" y="408" font-size="12" fill="#1a1a1a" text-anchor="middle">OrderSqlRepository</text>
  <rect x="508" y="428" width="186" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="601" y="443" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Мапінг, транзакції, SQL</text>
  <text x="601" y="460" font-size="12" fill="#27ae60" text-anchor="middle">Поглинає зміни сховища</text>

  <!-- Зв'язок 3->4 (SQL виклики) -->
  <line x1="706" y1="388" x2="720" y2="388" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Картка 4: База даних -->
  <rect x="722" y="350" width="194" height="130" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="819" y="370" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">База даних (БД)</text>
  <text x="819" y="388" font-size="12" fill="#6b7280" text-anchor="middle">Реляційна схема</text>
  <text x="819" y="408" font-size="12" fill="#1a1a1a" text-anchor="middle">Таблиці orders, items</text>
  <rect x="732" y="428" width="174" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="819" y="443" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зміна схеми: поділ</text>
  <text x="819" y="460" font-size="12" fill="#6b7280" text-anchor="middle">Впливає ЛИШЕ на адаптер</text>

  <!-- Захист та зупинка хвилі змін у нижній панелі -->
  <rect x="144" y="485" width="320" height="22" rx="11" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="304" y="500" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ДОМЕННЕ ЯДРО ТА ПОРТ ЗАХИЩЕНІ</text>

  <rect x="506" y="485" width="190" height="22" rx="11" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="601" y="500" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ЗМІНА ПОГЛИНУТА ТУТ</text>

  <line x1="819" y1="496" x2="702" y2="496" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <text x="480" y="523" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Адаптер бере зміни сховища на себе: контракт порту не змінюється, доменне ядро стабільне</text>
</svg>
