  </defs>
  <rect x="0" y="0" width="960" height="550" fill="white"/>
  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Комбінаторний простір мокування CRUD-порту: перестановки й параметри</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Мок фіксує 1 шлях: черговість кроків роздувається як O(k!), а стани — як O(m^k), спричиняючи хибні падіння</text>
  <!-- ЛІВА ПАНЕЛЬ: Дерево перестановок O(k!) -->
  <rect x="24" y="76" width="446" height="452" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="90" width="414" height="46" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="109" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Дерево перестановок викликів O(k!)</text>
  <text x="247" y="125" font-size="12" fill="#6b7280" text-anchor="middle">k = 5 викликів CRUD-порту • |S₅| = 120 валідних послідовностей</text>
  <rect x="40" y="148" width="414" height="212" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Корінь дерева -->
  <rect x="177" y="158" width="140" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="247" y="174" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Сценарій (k = 5 дій)</text>
  <!-- Гілки рівня 1 -->
  <path d="M247,180 L247,198" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M210,180 L110,198" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <path d="M284,180 L384,198" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <rect x="65" y="200" width="90" height="22" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="110" y="215" font-size="12" fill="#c0392b" text-anchor="middle">c₂: checkExists</text>
  <rect x="197" y="200" width="100" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="215" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">1. c₁: findById</text>
  <rect x="339" y="200" width="90" height="22" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="384" y="215" font-size="12" fill="#c0392b" text-anchor="middle">c₃: update</text>
