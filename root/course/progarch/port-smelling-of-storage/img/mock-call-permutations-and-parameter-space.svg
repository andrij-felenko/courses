  <path d="M110,222 L85,238" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M384,222 L409,238" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <rect x="52" y="240" width="66" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="85" y="254" font-size="12" fill="#6b7280" text-anchor="middle">c₁ ➔ …</text>
  <rect x="145" y="240" width="60" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="175" y="254" font-size="12" fill="#6b7280" text-anchor="middle">c₃ ➔ …</text>
  <rect x="214" y="240" width="66" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="254" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">2. c₂: check</text>
  <rect x="289" y="240" width="60" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="319" y="254" font-size="12" fill="#6b7280" text-anchor="middle">c₄ ➔ …</text>
  <rect x="376" y="240" width="66" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="409" y="254" font-size="12" fill="#6b7280" text-anchor="middle">c₁ ➔ …</text>
  <!-- Гілки рівня 3 -->
  <path d="M247,260 L247,276" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M85,260 L75,276" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M409,260 L419,276" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <rect x="207" y="278" width="80" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="292" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">3. c₃: update</text>
  <text x="110" y="292" font-size="12" fill="#c0392b" text-anchor="middle">··· 119 гілок ···</text>
  <text x="384" y="292" font-size="12" fill="#c0392b" text-anchor="middle">··· розгалужень ···</text>
  <!-- Фінал фіксованого шляху мока -->
  <path d="M247,298 L247,314" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="187" y="316" width="120" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="330" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">4. c₄: save ➔ 5. c₅</text>
  <path d="M247,336 L247,352" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M75,298 L75,352" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M110,298 L110,352" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M384,298 L384,352" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <path d="M419,298 L419,352" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr-red)"/>
  <!-- Картки результатів перестановок -->
  <rect x="40" y="372" width="198" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="139" y="392" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Фіксований шлях π₁</text>
  <text x="139" y="410" font-size="12" fill="#1a1a1a" text-anchor="middle">1 із 120: Тест PASS</text>
  <rect x="256" y="372" width="198" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="355" y="392" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">119 інших перестановок</text>
  <text x="355" y="410" font-size="12" fill="#c0392b" text-anchor="middle">False Positive: ТЕСТ ПАДАЄ</text>
  <!-- Аналітичний підсумок перестановок -->
  <rect x="40" y="436" width="414" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="455" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#1a1a1a">Розмір простору: </tspan>|S₅| = 5! = 120 валідних послідовностей</text>
  <text x="52" y="473" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#c0392b">Ризик хибного збою: </tspan>P(FP) = 1 - 1/5! = 119/120 ≈ 99.17%</text>
  <text x="52" y="491" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#c0392b">Крихкість: </tspan>зміна черговості комутативних дій руйнує тест</text>
  <!-- ПРАВА ПАНЕЛЬ: Простір параметрів і станів O(m^k) -->
  <rect x="490" y="76" width="446" height="452" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="506" y="90" width="414" height="46" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="713" y="109" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Експоненційний простір станів O(m^k)</text>
  <text x="713" y="125" font-size="12" fill="#6b7280" text-anchor="middle">k = 5 кроків, m = 3 стани повернення • |Ω| = 3⁵ = 243 стани</text>
  <rect x="506" y="148" width="414" height="212" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Заголовки таблиці станів -->
  <text x="546" y="164" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Виклик</text>
  <text x="630" y="164" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ У тесті</text>
  <text x="720" y="164" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Сліпий стан 2</text>
  <text x="810" y="164" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Сліпий стан 3</text>
  <text x="880" y="164" font-size="12" fill="#6b7280" text-anchor="middle">m</text>
  <rect x="516" y="172" width="60" height="18" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="0.8"/>
  <text x="546" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">c₁ find</text>
  <rect x="584" y="172" width="92" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="630" y="185" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">знайдено</text>
  <rect x="684" y="172" width="72" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="720" y="185" font-size="12" fill="#c0392b" text-anchor="middle">не знайдено</text>
  <rect x="764" y="172" width="92" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="810" y="185" font-size="12" fill="#c0392b" text-anchor="middle">помилка БД</text>
  <text x="880" y="185" font-size="12" fill="#6b7280" text-anchor="middle">m=3</text>
  <rect x="516" y="194" width="60" height="18" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="0.8"/>
  <text x="546" y="207" font-size="12" fill="#1a1a1a" text-anchor="middle">c₂ check</text>
  <rect x="584" y="194" width="92" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="630" y="207" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">активний</text>
  <rect x="684" y="194" width="72" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="720" y="207" font-size="12" fill="#c0392b" text-anchor="middle">заблоковано</text>
  <rect x="764" y="194" width="92" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="810" y="207" font-size="12" fill="#c0392b" text-anchor="middle">таймаут</text>
  <text x="880" y="207" font-size="12" fill="#6b7280" text-anchor="middle">m=3</text>
  <rect x="516" y="216" width="60" height="18" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="0.8"/>
  <text x="546" y="229" font-size="12" fill="#1a1a1a" text-anchor="middle">c₃ update</text>
  <rect x="584" y="216" width="92" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="630" y="229" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">оновлено</text>
  <rect x="684" y="216" width="72" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="720" y="229" font-size="12" fill="#c0392b" text-anchor="middle">конфлікт</text>
  <rect x="764" y="216" width="92" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="810" y="229" font-size="12" fill="#c0392b" text-anchor="middle">збій мережі</text>
  <text x="880" y="229" font-size="12" fill="#6b7280" text-anchor="middle">m=3</text>
  <rect x="516" y="238" width="60" height="18" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="0.8"/>
  <text x="546" y="251" font-size="12" fill="#1a1a1a" text-anchor="middle">c₄ save</text>
  <rect x="584" y="238" width="92" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="630" y="251" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">збережено</text>
  <rect x="684" y="238" width="72" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="720" y="251" font-size="12" fill="#c0392b" text-anchor="middle">помилка валід.</text>
  <rect x="764" y="238" width="92" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="810" y="251" font-size="12" fill="#c0392b" text-anchor="middle">дедлок</text>
  <text x="880" y="251" font-size="12" fill="#6b7280" text-anchor="middle">m=3</text>
  <rect x="516" y="260" width="60" height="18" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="0.8"/>
  <text x="546" y="273" font-size="12" fill="#1a1a1a" text-anchor="middle">c₅ flush</text>
  <rect x="584" y="260" width="92" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="630" y="273" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">успіх</text>
  <rect x="684" y="260" width="72" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="720" y="273" font-size="12" fill="#c0392b" text-anchor="middle">буфер переповн.</text>
  <rect x="764" y="260" width="92" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="810" y="273" font-size="12" fill="#c0392b" text-anchor="middle">аварія сховища</text>
  <text x="880" y="273" font-size="12" fill="#6b7280" text-anchor="middle">m=3</text>
  <!-- Візуалізація декартового простору 243 станів -->
  <text x="518" y="306" font-size="12" font-weight="700" fill="#1a1a1a">Декартовий добуток Ω = M₁ × M₂ × M₃ × M₄ × M₅ (243 стани):</text>
  <rect x="518" y="314" width="44" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="335" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ω₁</text>
  <text x="574" y="335" font-size="14" font-weight="700" fill="#6b7280" text-anchor="middle">+</text>
  <rect x="590" y="314" width="318" height="34" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="749" y="329" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">242 неперевірені комбінації (99.59 %)</text>
  <text x="749" y="343" font-size="12" fill="#6b7280" text-anchor="middle">Сліпа зона: непередбачена відповідь мока не протестована</text>
  <!-- Картки результатів комбінаторики станів -->
  <rect x="506" y="372" width="198" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="605" y="392" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Вектор ω₁ у фікстурі</text>
  <text x="605" y="410" font-size="12" fill="#1a1a1a" text-anchor="middle">Покриття: Cov = 0.41%</text>
  <rect x="722" y="372" width="198" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="821" y="392" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">242 стани: Сліпа зона</text>
  <text x="821" y="410" font-size="12" fill="#c0392b" text-anchor="middle">99.59% поза тестом</text>
  <!-- Аналітичний підсумок простору станів -->
  <rect x="506" y="436" width="414" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="518" y="455" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#1a1a1a">Простір станів: </tspan>|Ω| = mᵏ = 3⁵ = 243 можливі конфігурації</text>
  <text x="518" y="473" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#c0392b">Частка покриття: </tspan>Cov = 1/mᵏ = 1/243 ≈ 0.41% одним тестом</text>
  <text x="518" y="491" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#c0392b">Експоненційний параліч: </tspan>для 100% покриття треба 243 фікстури</text>
</svg>
