<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід терміна «велика грудка болота»</text>
<text x="520.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">сіре й штрихове — походження не доведене; кольорове й суцільне — задокументовані події</text>
<line x1="50.0" y1="150.0" x2="985.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="985.0" y1="150.0" x2="1002.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">1970-ті</text>
<circle cx="150.0" cy="150.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<line x1="150.0" y1="157.0" x2="150.0" y2="172.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,3"/>
<rect x="40.0" y="172.0" width="220.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="150.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">MIT: мову Lisp</tspan><tspan x="150.0" dy="16.2">жартома звуть</tspan><tspan x="150.0" dy="16.2">«грудкою болота»</tspan><tspan x="150.0" dy="16.2">(хто перший — спірно)</tspan></text>
<text x="400.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">початок 1990-х</text>
<circle cx="400.0" cy="150.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<line x1="400.0" y1="157.0" x2="400.0" y2="172.0" stroke="#2457d6" stroke-width="1.4"/>
<rect x="290.0" y="172.0" width="220.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="400.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Група архітектури ПЗ,</tspan><tspan x="400.0" dy="16.2">Університет Іллінойсу:</tspan><tspan x="400.0" dy="16.2">Браян Марік дає назву</tspan><tspan x="400.0" dy="16.2">цілому класу систем</tspan></text>
<text x="650.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">вересень 1997</text>
<circle cx="650.0" cy="150.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<line x1="650.0" y1="157.0" x2="650.0" y2="172.0" stroke="#27ae60" stroke-width="1.4"/>
<rect x="540.0" y="172.0" width="220.0" height="96.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="650.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">PLoP '97, Монтічелло:</tspan><tspan x="650.0" dy="16.2">Фут і Йодер</tspan><tspan x="650.0" dy="16.2">представляють</tspan><tspan x="650.0" dy="16.2">однойменну роботу</tspan></text>
<text x="900.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2000</text>
<circle cx="900.0" cy="150.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="900.0" y1="157.0" x2="900.0" y2="172.0" stroke="#1a1a1a" stroke-width="1.4"/>
<rect x="790.0" y="172.0" width="220.0" height="96.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="900.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Розділ 29 у «Pattern</tspan><tspan x="900.0" dy="16.2">Languages of Program</tspan><tspan x="900.0" dy="16.2">Design 4»</tspan><tspan x="900.0" dy="16.2">— стає класикою</tspan></text>
</svg>