<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ті самі двадцять рядків — але рішення в них не рівні</text>
<rect x="90.0" y="98.0" width="120.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="150.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">датчик t°</text>
<rect x="330.0" y="88.0" width="160.0" height="68.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="2.0"/>
<text x="410.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">хаб-скрипт</tspan><tspan x="410.0" dy="16.9">(один процес)</tspan></text>
<rect x="610.0" y="98.0" width="120.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="670.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">реле обігрівача</text>
<line x1="214.0" y1="122.0" x2="326.0" y2="122.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="494.0" y1="122.0" x2="606.0" y2="122.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="64.0" y="196.0" width="344.0" height="244.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/>
<text x="236.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">дешево змінити — деталь</text>
<text x="90.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="90.0" dy="0.0">•  поріг спрацювання: 25 °C</tspan><tspan x="90.0" dy="20.9">•  період опитування: 2 с</tspan><tspan x="90.0" dy="20.9">•  назви змінних, стиль коду</tspan><tspan x="90.0" dy="20.9">•  текст повідомлення в журналі</tspan></text>
<text x="90.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="90.0" dy="0.0">правиш за хвилину —</tspan><tspan x="90.0" dy="16.2">ніхто інший не зачеплений</tspan></text>
<rect x="412.0" y="196.0" width="344.0" height="244.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="584.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">дорого змінити — архітектура</text>
<text x="438.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="438.0" dy="0.0">•  усе в одному процесі</tspan><tspan x="438.0" dy="20.9">•  стан лише у файлі на диску</tspan><tspan x="438.0" dy="20.9">•  формат даних на диску</tspan><tspan x="438.0" dy="20.9">•  нема межі «пристрій ↔ хмара»</tspan></text>
<text x="438.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="438.0" dy="0.0">зміниш пізніше — переписуєш</tspan><tspan x="438.0" dy="16.2">і мігруєш геть усе</tspan></text>
</svg>