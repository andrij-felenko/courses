<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="548" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема даних для рішення: кому можна вірити на слово</text>
<rect x="40.0" y="58.0" width="436.0" height="456.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="258.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Наївно: віримо контексту як є</text>
<rect x="64.0" y="104.0" width="388.0" height="76.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="258.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">запит у центр:</tspan><tspan x="258.0" dy="15.6">Оксана · unlock · door:42</tspan><tspan x="258.0" dy="15.6">context.homeId = home:12   (ПІДРОБЛЕНО)</tspan></text>
<line x1="258.0" y1="182.0" x2="258.0" y2="214.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="64.0" y="216.0" width="388.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="258.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="258.0" dy="0.0">наївний PDP довіряє контексту:</tspan><tspan x="258.0" dy="15.6">Оксана — власниця home:12? так</tspan><tspan x="258.0" dy="15.6">→ власнику unlock можна → ALLOW</tspan></text>
<line x1="258.0" y1="296.0" x2="258.0" y2="330.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="64.0" y="332.0" width="388.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="258.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="258.0" dy="0.0">чужий замок #42 (дім 7) ВІДЧИНЕНО</tspan><tspan x="258.0" dy="16.2">IDOR через підроблений факт</tspan></text>
<rect x="64.0" y="410.0" width="388.0" height="92.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/><text x="258.0" y="445.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="258.0" dy="0.0">корінь біди: факт для рішення прийшов від того,</tspan><tspan x="258.0" dy="15.0">хто за нього НЕ відповідає — клієнт вибрав</tspan><tspan x="258.0" dy="15.0">і замок, і «його» дім воднораз</tspan></text>
<rect x="524.0" y="58.0" width="436.0" height="456.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="742.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Правильно: факт — з авторитетного джерела</text>
<rect x="548.0" y="104.0" width="388.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="742.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">claim клієнта homeId=home:12 — ІГНОРУЄМО;</tspan><tspan x="742.0" dy="15.6">джерело правди: door:42 → home:7</tspan><tspan x="742.0" dy="15.6">(кортеж графа / сервіс пристроїв)</tspan></text>
<line x1="742.0" y1="182.0" x2="742.0" y2="214.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="548.0" y="216.0" width="388.0" height="78.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="742.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">PDP питає ГРАФ, а не контекст:</tspan><tspan x="742.0" dy="15.6">Оксана — член home:7? ні</tspan><tspan x="742.0" dy="15.6">(її членство у home:12, не тут)</tspan></text>
<line x1="742.0" y1="296.0" x2="742.0" y2="330.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="548.0" y="332.0" width="388.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="742.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="742.0" dy="0.0">жодне правило не збіглося → DENY 403</tspan><tspan x="742.0" dy="16.2">замок лишається замкненим</tspan></text>
<rect x="548.0" y="410.0" width="388.0" height="92.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/><text x="742.0" y="445.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="742.0" dy="0.0">правило: факт входить у рішення лише від</tspan><tspan x="742.0" dy="15.0">джерела, яке за нього ВІДПОВІДАЄ;</tspan><tspan x="742.0" dy="15.0">клієнт не відповідає ні за що</tspan></text>
</svg>