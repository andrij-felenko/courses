<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Центр знає запит, але не знає фактів — вони живуть у сервісах</text>
<rect x="330.0" y="62.0" width="300.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="480.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Центральний PDP отримав запит</text>
<rect x="352.0" y="100.0" width="256.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="480.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Богдан · «відчинити» · door:42</tspan></text>
<text x="480.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">…але для вердикту бракує двох фактів, яких у центрі немає:</text>
<rect x="60.0" y="224.0" width="380.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="250.0" y="250.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">чий це замок door:42?</tspan><tspan x="250.0" dy="16.2">(потрібен власник об'єкта)</tspan></text>
<line x1="404.0" y1="166.0" x2="250.0" y2="222.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="250.0" y1="286.0" x2="250.0" y2="344.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="346.0" width="380.0" height="60.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="250.0" y="372.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Сервіс пристроїв</tspan><tspan x="250.0" dy="16.2">тут живе власник #42</tspan></text>
<rect x="520.0" y="224.0" width="380.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="710.0" y="250.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Богдан — член дому 7?</tspan><tspan x="710.0" dy="16.2">(потрібне членство)</tspan></text>
<line x1="556.0" y1="166.0" x2="710.0" y2="222.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="710.0" y1="286.0" x2="710.0" y2="344.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="520.0" y="346.0" width="380.0" height="60.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="710.0" y="372.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Сервіс домогосподарств</tspan><tspan x="710.0" dy="16.2">тут живе членство</tspan></text>
<text x="480.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">PDP мусить або дотягтися по ці факти (стрибок + застарілість), або отримати їх у контексті запиту.</text>
</svg>