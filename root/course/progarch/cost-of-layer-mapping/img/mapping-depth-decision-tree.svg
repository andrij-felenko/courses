<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="600" fill="white"/>

  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Дерево рішень: вибір глибини мапінгу між шарами</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Покроковий вибір рівня ізоляції за чутливістю контракту, темпами змін, інваріантами та бюджетом GC</text>

  <!-- З'єднувальні лінії та стрілки -->
  <!-- 1 -> 2 (Внутрішня межа) -->
  <path d="M 380,142 L 380,161 L 235,161 L 235,180" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="305" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Внутрішня (НІ)</text>

  <!-- 1 -> 3 (Публічна межа) -->
  <path d="M 572,142 L 572,280" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="582" y="215" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">Публічна межа (ТАК)</text>

  <!-- 2 -> Результат 1 (Однакові темпи) -->
  <path d="M 150,242 L 150,280" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="160" y="265" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Однакові (НІ)</text>

  <!-- 2 -> 3 (Різні темпи) -->
  <path d="M 390,211 L 450,211 L 450,280" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="420" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Різні темпи (ТАК)</text>

  <!-- 3 -> Результат 2 (Чисте читання) -->
  <path d="M 720,311 L 765,311" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="742" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Читання (НІ)</text>

  <!-- 3 -> 4 (Модифікація / Запис) -->
  <path d="M 572,342 L 572,382" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="582" y="366" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">Запис (ТАК)</text>

  <!-- 4 -> Результат 3 (Критично до пам'яті) -->
  <path d="M 490,444 L 490,464 L 430,464 L 430,484" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="460" y="459" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Критично (ТАК)</text>

  <!-- 4 -> Результат 4 (Допустимий оверхед) -->
  <path d="M 650,444 L 650,464 L 725,464 L 725,484" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="687" y="459" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Допустимо (НІ)</text>

  <!-- Вузол 1: Чутливість контракту -->
  <rect x="320" y="80" width="320" height="62" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">1. Чутливість контракту</text>
  <text x="480" y="118" text-anchor="middle" font-size="12" fill="#1a1a1a">Чи є межа публічною (зовнішній API / клієнти)</text>
  <text x="480" y="133" text-anchor="middle" font-size="12" fill="#6b7280">чи це внутрішня межа всередині підсистеми?</text>

  <!-- Вузол 2: Темпи змін -->
  <rect x="80" y="180" width="310" height="62" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="235" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">2. Темпи змін (Різні годинники)</text>
  <text x="235" y="218" text-anchor="middle" font-size="12" fill="#1a1a1a">Чи змінюються схема сховища та споживач</text>
  <text x="235" y="233" text-anchor="middle" font-size="12" fill="#6b7280">з різною частотою та з різних причин?</text>

  <!-- Вузол 3: Доменні інваріанти -->
  <rect x="425" y="280" width="295" height="62" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="572" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">3. Наявність доменних інваріантів</text>
  <text x="572" y="318" text-anchor="middle" font-size="12" fill="#1a1a1a">Операція модифікує стан і має бізнес-правила</text>
  <text x="572" y="333" text-anchor="middle" font-size="12" fill="#6b7280">чи це сценарій читання для відображення?</text>

  <!-- Вузол 4: Бюджет продуктивності -->
  <rect x="425" y="382" width="295" height="62" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="572" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">4. Бюджет продуктивності та GC</text>
  <text x="572" y="420" text-anchor="middle" font-size="12" fill="#1a1a1a">Чи критичні витрати на allocation churn</text>
  <text x="572" y="435" text-anchor="middle" font-size="12" fill="#6b7280">та затримки збирача сміття під навантаженням?</text>

  <!-- Результат 1: Наскрізна модель (Zero Mapping) -->
  <rect x="30" y="280" width="245" height="94" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="42" y="292" width="125" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="104" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">НУЛЬОВИЙ МАПІНГ</text>
  <text x="42" y="324" font-size="13" font-weight="bold" fill="#1a1a1a">Наскрізна модель</text>
  <text x="42" y="340" font-size="12" fill="#1a1a1a">Єдина структура крізь усі шари.</text>
  <text x="42" y="354" font-size="12" fill="#6b7280">Для CRUD без логіки з однаковим</text>
  <text x="42" y="367" font-size="12" fill="#6b7280">темпом змін на обох кінцях.</text>

  <!-- Результат 2: Пряма проєкція (CQRS Read) -->
  <rect x="765" y="280" width="165" height="94" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="777" y="292" width="115" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="834" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">ПРЯМА ПРОЄКЦІЯ</text>
  <text x="777" y="324" font-size="13" font-weight="bold" fill="#1a1a1a">CQRS Read Model</text>
  <text x="777" y="340" font-size="12" fill="#1a1a1a">Сховище ──> DTO.</text>
  <text x="777" y="354" font-size="12" fill="#6b7280">В обхід домену,</text>
  <text x="777" y="367" font-size="12" fill="#6b7280">нуль проміжних копій.</text>

  <!-- Результат 3: Оновлення за місцем (@MappingTarget) -->
  <rect x="300" y="484" width="260" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="312" y="494" width="140" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="382" y="507" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">МУТАЦІЯ ЗА МІСЦЕМ</text>
  <text x="312" y="527" font-size="13" font-weight="bold" fill="#1a1a1a">Оновлення @MappingTarget</text>
  <text x="312" y="543" font-size="12" fill="#1a1a1a">Модифікація наявного об'єкта.</text>
  <text x="312" y="558" font-size="12" fill="#6b7280">Усуває allocation churn під час</text>
  <text x="312" y="570" font-size="12" fill="#6b7280">масових операцій PUT та PATCH.</text>

  <!-- Результат 4: Повний тришаровий мапінг -->
  <rect x="590" y="484" width="270" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="602" y="494" width="130" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="667" y="507" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ПОВНА ІЗОЛЯЦІЯ</text>
  <text x="602" y="527" font-size="13" font-weight="bold" fill="#1a1a1a">Повний тришаровий мапінг</text>
  <text x="602" y="543" font-size="12" fill="#1a1a1a">DTO ↔ Доменний агрегат ↔ Entity.</text>
  <text x="602" y="558" font-size="12" fill="#6b7280">Повна герметичність домену від</text>
  <text x="602" y="570" font-size="12" fill="#6b7280">схеми бази даних та клієнтів API.</text>
</svg>
