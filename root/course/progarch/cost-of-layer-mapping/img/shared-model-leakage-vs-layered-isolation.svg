<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Наскрізна модель проти повної ізоляції шарів</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Спільна сутність пробиває публічний контракт, а тотальна ізоляція створює ланцюг із чотирьох класів</text>

  <!-- ================= ЛІВА ПАНЕЛЬ (НАСКРІЗНА МОДЕЛЬ) ================= -->
  <rect x="28" y="74" width="440" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Заголовок лівої панелі -->
  <rect x="42" y="86" width="412" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="248" y="104" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">НАСКРІЗНА МОДЕЛЬ: ПРОТІКАННЯ МЕЖ</text>

  <!-- Блок 1: Сховище (БД) -->
  <rect x="42" y="124" width="412" height="62" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="141" font-size="12" font-weight="bold" fill="#1a1a1a">Шар даних: таблиця thermostats</text>
  <text x="56" y="159" font-size="12" fill="#6b7280">Колонки: id (UUID), device_token (secret), temp_c</text>
  <text x="56" y="177" font-size="12" font-weight="bold" fill="#c0392b">Перейменування в БД: temp_c → target_temp</text>

  <!-- Стрілка передачі моделі -->
  <line x1="120" y1="186" x2="120" y2="204" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="135" y="199" font-size="12" fill="#c0392b">Наскрізний клас ThermostatNode (без мапінгу)</text>

  <!-- Блок 2: Доменний шар -->
  <rect x="42" y="204" width="412" height="48" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="222" font-size="12" font-weight="bold" fill="#1a1a1a">Доменний шар: сервіс ThermostatService</text>
  <text x="56" y="240" font-size="12" fill="#6b7280">Використовує сутність ThermostatNode з полями БД</text>

  <!-- Стрілка до публічного API -->
  <line x1="120" y1="252" x2="120" y2="270" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="135" y="265" font-size="12" fill="#c0392b">Пряма серіалізація сутності в HTTP-відповідь</text>

  <!-- Блок 3: Публічний API (Аварії) -->
  <rect x="42" y="270" width="412" height="140" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="56" y="290" font-size="12" font-weight="bold" fill="#c0392b">Публічний API: прямий JSON-експорт ThermostatNode</text>
  <text x="56" y="311" font-size="12" fill="#1a1a1a">{ "id": "th-101", "target_temp": 21.5, "device_token": "sec_8f9a" }</text>
  
  <text x="56" y="338" font-size="12" font-weight="bold" fill="#c0392b">• Поламка контракту: поле БД target_temp зламало API</text>
  <text x="68" y="355" font-size="12" fill="#6b7280">(клієнти очікували temp_c, але отримали target_temp)</text>
  
  <text x="56" y="380" font-size="12" font-weight="bold" fill="#c0392b">• Витік секрету: поле device_token потрапило у JSON</text>
  <text x="68" y="397" font-size="12" fill="#6b7280">(внутрішній токен пристрою став доступним назовні)</text>

  <!-- Підсумок зліва -->
  <rect x="42" y="424" width="412" height="102" rx="6" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="56" y="444" font-size="12" font-weight="bold" fill="#c0392b">Наслідки наскрізної моделі:</text>
  <text x="56" y="464" font-size="12" fill="#1a1a1a">1. Жорстке зчеплення контракту API зі схемою бази даних.</text>
  <text x="56" y="483" font-size="12" fill="#1a1a1a">2. Будь-яка міграція сховища ламає зовнішні інтеграції.</text>
  <text x="56" y="502" font-size="12" fill="#1a1a1a">3. Відсутність ізоляції призводить до витоку секретів.</text>

  <!-- ================= ПРАВА ПАНЕЛЬ (ТОТАЛЬНА ІЗОЛЯЦІЯ) ================= -->
  <rect x="492" y="74" width="440" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок правої панелі -->
  <rect x="506" y="86" width="412" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ТОТАЛЬНА ІЗОЛЯЦІЯ: ЛАНЦЮГ ІЗ ЧОТИРЬОХ КЛАСІВ</text>

  <!-- Рівень 1: Сховище (Entity) -->
  <rect x="506" y="124" width="412" height="40" rx="5" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="140" font-size="12" font-weight="bold" fill="#1a1a1a">1. ThermostatEntity (Шар даних / ORM-сутність)</text>
  <text x="520" y="155" font-size="12" fill="#6b7280">Поля: id, target_temp, device_token (стовпці бази даних)</text>

  <!-- Мапер 1 -->
  <line x1="528" y1="164" x2="528" y2="180" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="544" y="176" font-size="12" fill="#2457d6">EntityToDomainMapper: фільтрує токен, адаптує назви</text>

  <!-- Рівень 2: Домен (Aggregate) -->
  <rect x="506" y="180" width="412" height="40" rx="5" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="196" font-size="12" font-weight="bold" fill="#1a1a1a">2. Thermostat (Доменна модель / Агрегат)</text>
  <text x="520" y="211" font-size="12" fill="#6b7280">Поля: id, targetTemperature (чистий стан без секретів)</text>

  <!-- Мапер 2 -->
  <line x1="528" y1="220" x2="528" y2="236" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="544" y="232" font-size="12" fill="#2457d6">DomainToDtoMapper: проекція сутності під use case</text>

  <!-- Рівень 3: Застосунок (DTO) -->
  <rect x="506" y="236" width="412" height="40" rx="5" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="252" font-size="12" font-weight="bold" fill="#1a1a1a">3. ThermostatDto (Шар застосунку / Use Case DTO)</text>
  <text x="520" y="267" font-size="12" fill="#6b7280">Поля: id, targetTemperature (структура передачі даних)</text>

  <!-- Мапер 3 -->
  <line x1="528" y1="276" x2="528" y2="292" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="544" y="288" font-size="12" fill="#2457d6">DtoToResponseMapper: серіалізація під контракт API</text>

  <!-- Рівень 4: Публічний API (Response) -->
  <rect x="506" y="292" width="412" height="40" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="520" y="308" font-size="12" font-weight="bold" fill="#27ae60">4. ThermostatResponse (Публічний контракт / DTO API)</text>
  <text x="520" y="323" font-size="12" fill="#1a1a1a">JSON: { "id": "th-101", "temp_c": 21.5 } (контракт збережено)</text>

  <!-- Переваги ізоляції -->
  <rect x="506" y="346" width="412" height="64" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="520" y="367" font-size="12" font-weight="bold" fill="#27ae60">Результат ізоляції шарів:</text>
  <text x="520" y="386" font-size="12" fill="#1a1a1a">✓ Зміна схеми БД ізольована мапером і не вплинула на API.</text>
  <text x="520" y="402" font-size="12" fill="#1a1a1a">✓ Секретний device_token відфільтровано на межі збереження.</text>

  <!-- Підсумок справа (Ціна) -->
  <rect x="506" y="424" width="412" height="102" rx="6" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="520" y="444" font-size="12" font-weight="bold" fill="#2457d6">Початкова ціна догми повної ізоляції:</text>
  <text x="520" y="464" font-size="12" fill="#1a1a1a">1. Чотири класи та три мапери для однієї сутності.</text>
  <text x="520" y="483" font-size="12" fill="#1a1a1a">2. Рутинний бойлерплейт перекладання однакових полів.</text>
  <text x="520" y="502" font-size="12" fill="#1a1a1a">3. Зайві алокації проміжних об'єктів і тиск на GC.</text>
</svg>
