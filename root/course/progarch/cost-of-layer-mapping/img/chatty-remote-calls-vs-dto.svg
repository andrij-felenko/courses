<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" width="960" height="485" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="485" fill="white"/>

  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Походження DTO: балакучі віддалені виклики проти пакетного перенесення</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Оригінальне призначення патерну: подолання мережевої затримки шляхом збирання полів у єдиний пакет</text>

  <!-- ЛІВА ПАНЕЛЬ: Балакучий інтерфейс -->
  <rect x="30" y="75" width="435" height="388" rx="8" fill="#fcfdfd" stroke="#d0d7de" stroke-width="1.5"/>

  <rect x="45" y="88" width="250" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="170" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">БАЛАКУЧИЙ ІНТЕРФЕЙС (FINE-GRAINED)</text>

  <text x="45" y="130" font-size="14" font-weight="bold" fill="#1a1a1a">Окремий віддалений виклик на кожне поле</text>
  <text x="45" y="147" font-size="12" fill="#6b7280">EJB 1.x / CORBA: катастрофічне накопичення затримок RTT</text>

  <!-- Вузли лівої панелі -->
  <rect x="45" y="160" width="85" height="230" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="87" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Клієнт</text>
  <text x="87" y="202" text-anchor="middle" font-size="12" fill="#6b7280">EJB Client</text>

  <rect x="365" y="160" width="85" height="230" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="407" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сервер</text>
  <text x="407" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Entity Bean</text>

  <!-- Мережева межа (ліва) -->
  <line x1="247" y1="165" x2="247" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="247" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">МЕРЕЖА</text>

  <!-- Виклики лівої панелі -->
  <!-- 1. getName -->
  <path d="M 135,175 L 360,175" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="247" y="169" text-anchor="middle" font-size="12" fill="#c0392b">1. getName()</text>
  <path d="M 360,205 L 135,205" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="247" y="199" text-anchor="middle" font-size="12" fill="#6b7280">повертає "Ковальчук"</text>

  <!-- 2. getAddress -->
  <path d="M 135,235 L 360,235" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="247" y="229" text-anchor="middle" font-size="12" fill="#c0392b">2. getAddress()</text>
  <path d="M 360,265 L 135,265" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="247" y="259" text-anchor="middle" font-size="12" fill="#6b7280">повертає "Київ"</text>

  <!-- 3. getBalance -->
  <path d="M 135,295 L 360,295" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="247" y="289" text-anchor="middle" font-size="12" fill="#c0392b">3. getBalance()</text>
  <path d="M 360,325 L 135,325" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="247" y="319" text-anchor="middle" font-size="12" fill="#6b7280">повертає 15400.00</text>

  <!-- 4. getStatus -->
  <path d="M 135,355 L 360,355" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="247" y="349" text-anchor="middle" font-size="12" fill="#c0392b">4. getStatus()</text>
  <path d="M 360,385 L 135,385" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="247" y="379" text-anchor="middle" font-size="12" fill="#6b7280">повертає "ACTIVE"</text>

  <!-- Підсумок лівої панелі -->
  <rect x="45" y="405" width="405" height="46" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="423" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">4 мережеві раунд-тріпи × 50 мс = 200 мс затримки</text>
  <text x="247" y="440" text-anchor="middle" font-size="12" fill="#1a1a1a">Потік клієнта заблоковано очікуванням кожного окремого поля</text>

  <!-- ПРАВА ПАНЕЛЬ: Data Transfer Object -->
  <rect x="495" y="75" width="435" height="388" rx="8" fill="#fcfdfd" stroke="#d0d7de" stroke-width="1.5"/>

  <rect x="510" y="88" width="265" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="642" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">ПАТЕРН DATA TRANSFER OBJECT (DTO)</text>

  <text x="510" y="130" font-size="14" font-weight="bold" fill="#1a1a1a">Єдиний виклик для передачі всього агрегата</text>
  <text x="510" y="147" font-size="12" fill="#6b7280">Мартін Фаулер: упаковка всіх полів у серіалізований контейнер</text>

  <!-- Вузли правої панелі -->
  <rect x="510" y="160" width="85" height="230" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="552" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Клієнт</text>
  <text x="552" y="202" text-anchor="middle" font-size="12" fill="#6b7280">App Client</text>

  <rect x="830" y="160" width="85" height="230" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="872" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сервер</text>
  <text x="872" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Session Facade</text>

  <!-- Мережева межа (права) -->
  <line x1="712" y1="165" x2="712" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="712" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">МЕРЕЖА</text>

  <!-- Виклики правої панелі -->
  <path d="M 600,215 L 825,215" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="712" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1. getCustomerDetails(id)</text>

  <!-- Пакет DTO -->
  <rect x="625" y="240" width="175" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">CustomerDTO</text>
  <text x="712" y="274" text-anchor="middle" font-size="11" fill="#1a1a1a">name: "Ковальчук"</text>
  <text x="712" y="288" text-anchor="middle" font-size="11" fill="#1a1a1a">address: "Київ" | balance: 15400</text>
  <text x="712" y="302" text-anchor="middle" font-size="11" fill="#1a1a1a">status: "ACTIVE"</text>

  <path d="M 825,345 L 600,345" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <text x="712" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">повертає серіалізований CustomerDTO</text>

  <!-- Підсумок правої панелі -->
  <rect x="510" y="405" width="405" height="46" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="423" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">1 мережевий раунд-тріп × 50 мс = 50 мс (економія 75%)</text>
  <text x="712" y="440" text-anchor="middle" font-size="12" fill="#1a1a1a">Усі дані передано за один раз; мережеві затримки зведено до мінімуму</text>
</svg>
