<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Розмноження об'єктного графа при шаровому мапінгу (Graph Multiplication)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Повне копіювання дерева глибини d на кожній з M меж множить кількість алокацій у M разів</text>

  <!-- ============================================================ -->
  <!-- ВЕРХНІ 4 КОЛОНКИ: 4 ШАРИ ІЗОЛЯЦІЇ (M = 4)                   -->
  <!-- ============================================================ -->

  <!-- КОЛОНКА 1: Шар 1 (Persistence Entity) -->
  <rect x="30" y="76" width="204" height="266" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="76" width="204" height="24" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="132" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1. DB ENTITY (СХОВИЩЕ)</text>

  <!-- Вузол 0 (Root): OrderEntity -->
  <rect x="77" y="114" width="110" height="24" rx="4" fill="#2457d6"/>
  <text x="132" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">OrderEntity</text>

  <!-- Вузол 1A: ItemEntity 1 -->
  <rect x="42" y="152" width="80" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="82" y="167" text-anchor="middle" font-size="12" fill="#2457d6">ItemEntity 1</text>

  <!-- Вузол 1B: ItemEntity 2 -->
  <rect x="142" y="152" width="80" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="182" y="167" text-anchor="middle" font-size="12" fill="#2457d6">ItemEntity 2</text>

  <!-- Листки під ItemEntity 1 -->
  <rect x="42" y="188" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="82" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Param 1</text>
  <rect x="42" y="222" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="82" y="236" text-anchor="middle" font-size="12" fill="#6b7280">Param 2</text>

  <!-- Листки під ItemEntity 2 -->
  <rect x="142" y="188" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="182" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Param 3</text>
  <rect x="142" y="222" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="182" y="236" text-anchor="middle" font-size="12" fill="#6b7280">Param 4</text>

  <!-- Лічильник алокацій Колонки 1 -->
  <rect x="42" y="256" width="180" height="72" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="132" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Алокації: +7 об'єктів</text>
  <text x="132" y="294" text-anchor="middle" font-size="12" fill="#1a1a1a">Сумарно: 7 об'єктів</text>
  <text x="132" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Базове дерево (1×)</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="234" y1="180" x2="262" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- КОЛОНКА 2: Шар 2 (Domain Model) -->
  <rect x="262" y="76" width="204" height="266" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="262" y="76" width="204" height="24" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="364" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">2. DOMAIN (ДОМЕН)</text>

  <!-- Вузол 0 (Root): Order -->
  <rect x="309" y="114" width="110" height="24" rx="4" fill="#2457d6"/>
  <text x="364" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Order</text>

  <!-- Вузол 1A: OrderItem 1 -->
  <rect x="274" y="152" width="80" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="314" y="167" text-anchor="middle" font-size="12" fill="#2457d6">OrderItem 1</text>

  <!-- Вузол 1B: OrderItem 2 -->
  <rect x="374" y="152" width="80" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="414" y="167" text-anchor="middle" font-size="12" fill="#2457d6">OrderItem 2</text>

  <!-- Листки під OrderItem 1 -->
  <rect x="274" y="188" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="314" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Option 1</text>
  <rect x="274" y="222" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="314" y="236" text-anchor="middle" font-size="12" fill="#6b7280">Option 2</text>

  <!-- Листки під OrderItem 2 -->
  <rect x="374" y="188" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="414" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Option 3</text>
  <rect x="374" y="222" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="414" y="236" text-anchor="middle" font-size="12" fill="#6b7280">Option 4</text>

  <!-- Лічильник алокацій Колонки 2 -->
  <rect x="274" y="256" width="180" height="72" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="364" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Мапінг 1: +7 об'єктів</text>
  <text x="364" y="294" text-anchor="middle" font-size="12" fill="#1a1a1a">Сумарно: 14 об'єктів</text>
  <text x="364" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Подвоєння графа (2×)</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="466" y1="180" x2="494" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- КОЛОНКА 3: Шар 3 (Application DTO) -->
  <rect x="494" y="76" width="204" height="266" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="494" y="76" width="204" height="24" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="596" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">3. APP DTO (СЕРВІС)</text>

  <!-- Вузол 0 (Root): OrderDto -->
  <rect x="541" y="114" width="110" height="24" rx="4" fill="#2457d6"/>
  <text x="596" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">OrderDto</text>

  <!-- Вузол 1A: ItemDto 1 -->
  <rect x="506" y="152" width="80" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="546" y="167" text-anchor="middle" font-size="12" fill="#2457d6">ItemDto 1</text>

  <!-- Вузол 1B: ItemDto 2 -->
  <rect x="606" y="152" width="80" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="646" y="167" text-anchor="middle" font-size="12" fill="#2457d6">ItemDto 2</text>

  <!-- Листки під ItemDto 1 -->
  <rect x="506" y="188" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="546" y="202" text-anchor="middle" font-size="12" fill="#6b7280">OptDto 1</text>
  <rect x="506" y="222" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="546" y="236" text-anchor="middle" font-size="12" fill="#6b7280">OptDto 2</text>

  <!-- Листки під ItemDto 2 -->
  <rect x="606" y="188" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="646" y="202" text-anchor="middle" font-size="12" fill="#6b7280">OptDto 3</text>
  <rect x="606" y="222" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="646" y="236" text-anchor="middle" font-size="12" fill="#6b7280">OptDto 4</text>

  <!-- Лічильник алокацій Колонки 3 -->
  <rect x="506" y="256" width="180" height="72" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="596" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Мапінг 2: +7 об'єктів</text>
  <text x="596" y="294" text-anchor="middle" font-size="12" fill="#1a1a1a">Сумарно: 21 об'єкт</text>
  <text x="596" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Потроєння графа (3×)</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="698" y1="180" x2="726" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- КОЛОНКА 4: Шар 4 (Presentation ViewModel) -->
  <rect x="726" y="76" width="204" height="266" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="726" y="76" width="204" height="24" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="828" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">4. API VIEW (ВІДОБРАЖЕННЯ)</text>

  <!-- Вузол 0 (Root): OrderResponse -->
  <rect x="773" y="114" width="110" height="24" rx="4" fill="#2457d6"/>
  <text x="828" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">OrderResponse</text>

  <!-- Вузол 1A: ItemView 1 -->
  <rect x="738" y="152" width="80" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="778" y="167" text-anchor="middle" font-size="12" fill="#2457d6">ItemView 1</text>

  <!-- Вузол 1B: ItemView 2 -->
  <rect x="838" y="152" width="80" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="878" y="167" text-anchor="middle" font-size="12" fill="#2457d6">ItemView 2</text>

  <!-- Листки під ItemView 1 -->
  <rect x="738" y="188" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="778" y="202" text-anchor="middle" font-size="12" fill="#6b7280">OptView 1</text>
  <rect x="738" y="222" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="778" y="236" text-anchor="middle" font-size="12" fill="#6b7280">OptView 2</text>

  <!-- Листки під ItemView 2 -->
  <rect x="838" y="188" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="878" y="202" text-anchor="middle" font-size="12" fill="#6b7280">OptView 3</text>
  <rect x="838" y="222" width="80" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="878" y="236" text-anchor="middle" font-size="12" fill="#6b7280">OptView 4</text>

  <!-- Лічильник алокацій Колонки 4 -->
  <rect x="738" y="256" width="180" height="72" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="828" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Мапінг 3: +7 об'єктів</text>
  <text x="828" y="294" text-anchor="middle" font-size="12" fill="#1a1a1a">Сумарно: 28 об'єктів</text>
  <text x="828" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Чотирикратний ріст (4×)</text>

  <!-- ============================================================ -->
  <!-- НИЖНІ ПАНЕЛІ: МАТЕМАТИКА ТА НАСЛІДКИ ДЛЯ GC                 -->
  <!-- ============================================================ -->

  <!-- Нижня панель 1: Математична модель розмноження -->
  <rect x="30" y="356" width="440" height="180" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="356" width="440" height="24" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="250" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">АНАЛІТИЧНА МОДЕЛЬ РОЗМНОЖЕННЯ ГРАФА</text>

  <text x="44" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">Формула розміру дерева:</text>
  <text x="44" y="416" font-size="12" font-weight="bold" fill="#2457d6">N_tree = (b^(d+1) - 1) / (b - 1)</text>
  <text x="44" y="434" font-size="12" fill="#6b7280">• При d=2, b=2: 1 корінь + 2 гілки + 4 листки = 7 об'єктів</text>
  <text x="44" y="452" font-size="12" fill="#6b7280">• При b=3 (кошик): 1 + 3 + 9 = 13 об'єктів на одне дерево</text>
  <text x="44" y="474" font-size="12" font-weight="bold" fill="#c0392b">Сумарні алокації на 1 запит через M шарів:</text>
  <text x="44" y="492" font-size="12" font-weight="bold" fill="#c0392b">N_total = M × N_tree  (де M — кількість шарів)</text>
  <text x="44" y="510" font-size="12" fill="#1a1a1a">• 4 шари: 4 × 7 = 28 нових об'єктів на ОДИН виклик!</text>
  <text x="44" y="526" font-size="12" fill="#6b7280">• Кожен новий шар копіює весь об'єм пам'яті графа</text>

  <!-- Нижня панель 2: Наслідки для Runtime та GC -->
  <rect x="490" y="356" width="440" height="180" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="490" y="356" width="440" height="24" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="710" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">НАСЛІДКИ ДЛЯ RUNTIME, GC ТА ЗАТРИМОК</text>

  <text x="504" y="398" font-size="12" font-weight="bold" fill="#c0392b">Генерація сміття (Allocation Churn):</text>
  <text x="504" y="416" font-size="12" fill="#1a1a1a">• При 10 000 RPS: 10 000 × 28 = 280 000 об'єктів/с!</text>
  <text x="504" y="434" font-size="12" fill="#6b7280">• Стрімке заповнення пам'яті покоління Eden</text>
  <text x="504" y="456" font-size="12" font-weight="bold" fill="#c0392b">Деградація продуктивності:</text>
  <text x="504" y="474" font-size="12" fill="#1a1a1a">• Часті фази Stop-the-World: GC зупиняє мутатори</text>
  <text x="504" y="492" font-size="12" fill="#c0392b">• Спалахи затримок p99/p99.9 під час збірок GC</text>
  <text x="504" y="510" font-size="12" fill="#6b7280">• Вимивання кешу L1/L2 даними транзитних DTO</text>
  <text x="504" y="526" font-size="12" font-weight="bold" fill="#2457d6">• Шаровий мапінг без лімітів витісняє бізнес-код</text>
</svg>
