<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ціна мапінгу: алокація об'єктів та навантаження на GC</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Проміжні графи на кожному переході шарів спричиняють GC churn та деградацію затримки p99</text>

  <!-- ================= ЛІВА ПАНЕЛЬ (ПОТІК АЛОКАЦІЙ) ================= -->
  <rect x="28" y="74" width="440" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Заголовок лівої панелі -->
  <rect x="42" y="86" width="412" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="248" y="104" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">ПЕРЕХОДИ МІЖ 4 ШАРАМИ ТА АЛОКАЦІЇ</text>

  <!-- Шар 1: Web / API -->
  <rect x="42" y="124" width="412" height="38" rx="5" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="140" font-size="12" font-weight="bold" fill="#1a1a1a">1. Web / API: TelemetryPayload (HTTP DTO)</text>
  <text x="56" y="154" font-size="12" fill="#6b7280">Десеріалізація JSON → граф 1.2 KB</text>

  <!-- Стрілка 1 -->
  <line x1="120" y1="162" x2="120" y2="176" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="135" y="172" font-size="12" fill="#c0392b">мапінг у команду (Mapper 1)</text>

  <!-- Шар 2: Application -->
  <rect x="42" y="176" width="412" height="38" rx="5" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="192" font-size="12" font-weight="bold" fill="#1a1a1a">2. Application: ProcessTelemetryCommand</text>
  <text x="56" y="206" font-size="12" fill="#6b7280">Параметри use case → граф 1.0 KB</text>

  <!-- Стрілка 2 -->
  <line x1="120" y1="214" x2="120" y2="228" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="135" y="224" font-size="12" fill="#c0392b">мапінг у домен (Mapper 2)</text>

  <!-- Шар 3: Domain -->
  <rect x="42" y="228" width="412" height="38" rx="5" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="244" font-size="12" font-weight="bold" fill="#1a1a1a">3. Domain: ThermostatTelemetry (Агрегат)</text>
  <text x="56" y="258" font-size="12" fill="#6b7280">Бізнес-правила й стан → граф 1.8 KB</text>

  <!-- Стрілка 3 -->
  <line x1="120" y1="266" x2="120" y2="280" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="135" y="276" font-size="12" fill="#c0392b">мапінг в ORM (Mapper 3)</text>

  <!-- Шар 4: Persistence -->
  <rect x="42" y="280" width="412" height="38" rx="5" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="296" font-size="12" font-weight="bold" fill="#1a1a1a">4. Persistence: TelemetryRecord (ORM)</text>
  <text x="56" y="310" font-size="12" fill="#6b7280">Запис у таблицю БД → граф 1.4 KB</text>

  <!-- Young Gen (Eden Space) Churn Box -->
  <rect x="42" y="332" width="412" height="86" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="56" y="352" font-size="12" font-weight="bold" fill="#c0392b">Young Gen (Eden Space): скидання короткоживучих графів</text>
  <text x="56" y="371" font-size="12" fill="#1a1a1a">• 5.4 KB об'єктів на кожен запит (4 транзитні графи)</text>
  <text x="56" y="390" font-size="12" fill="#1a1a1a">• 20 000 RPS = 108 MB/с аллокацій короткоживучого сміття</text>
  <text x="56" y="407" font-size="12" fill="#6b7280">• Eden переповнюється за лічені секунди → лавина Minor GC</text>

  <!-- Підсумок зліва -->
  <rect x="42" y="432" width="412" height="96" rx="6" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="56" y="451" font-size="12" font-weight="bold" fill="#c0392b">Механізм навантаження на пам'ять:</text>
  <text x="56" y="470" font-size="12" fill="#1a1a1a">1. Транзитні об'єкти живуть мікросекунди й відкидаються.</text>
  <text x="56" y="489" font-size="12" fill="#1a1a1a">2. Збирач сміття витрачає CPU на сканування Eden Space.</text>
  <text x="56" y="508" font-size="12" fill="#1a1a1a">3. За високого навантаження потоки зупиняються на паузи.</text>

  <!-- ================= ПРАВА ПАНЕЛЬ (ГРАФІК P99 ТА STW) ================= -->
  <rect x="492" y="74" width="440" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок правої панелі -->
  <rect x="506" y="86" width="412" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">НАСЛІДОК: РІСТ P99 ТА ПАУЗ STOP-THE-WORLD</text>

  <!-- Блок графіка -->
  <rect x="506" y="124" width="412" height="286" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="144" font-size="12" font-weight="bold" fill="#1a1a1a">Затримка p99 та тривалість STW-пауз від RPS</text>

  <!-- Сітка графіка -->
  <line x1="565" y1="330" x2="890" y2="330" stroke="#d0d7de" stroke-width="1"/>
  <line x1="565" y1="285" x2="890" y2="285" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="565" y1="240" x2="890" y2="240" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="565" y1="195" x2="890" y2="195" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="565" y1="165" x2="890" y2="165" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="565" y1="165" x2="565" y2="330" stroke="#d0d7de" stroke-width="1"/>

  <!-- Підписи осі Y -->
  <text x="558" y="334" font-size="12" fill="#6b7280" text-anchor="end">0 ms</text>
  <text x="558" y="289" font-size="12" fill="#6b7280" text-anchor="end">50 ms</text>
  <text x="558" y="244" font-size="12" fill="#6b7280" text-anchor="end">100 ms</text>
  <text x="558" y="199" font-size="12" fill="#6b7280" text-anchor="end">200 ms</text>
  <text x="558" y="169" font-size="12" fill="#6b7280" text-anchor="end">350 ms</text>

  <!-- Підписи осі X -->
  <text x="565" y="347" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="630" y="347" font-size="12" fill="#6b7280" text-anchor="middle">10k</text>
  <text x="695" y="347" font-size="12" fill="#6b7280" text-anchor="middle">20k</text>
  <text x="760" y="347" font-size="12" fill="#6b7280" text-anchor="middle">30k</text>
  <text x="825" y="347" font-size="12" fill="#6b7280" text-anchor="middle">40k</text>
  <text x="890" y="347" font-size="12" fill="#6b7280" text-anchor="middle">50k</text>

  <text x="728" y="363" font-size="12" fill="#6b7280" text-anchor="middle">Інтенсивність вхідних запитів (RPS)</text>

  <!-- Крива 1: Зелена (пряма проекція) -->
  <path d="M565,326 C660,323 760,318 890,310" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="890" cy="310" r="3.5" fill="#27ae60"/>

  <!-- Крива 2: Червона (повний мапінг) -->
  <path d="M565,324 C650,320 720,290 770,250 C810,210 850,185 890,172" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="890" cy="172" r="3.5" fill="#c0392b"/>

  <!-- Анотація колапсу -->
  <text x="780" y="214" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Лавина STW-пауз GC</text>
  <text x="780" y="228" font-size="12" fill="#c0392b" text-anchor="end">(p99 зростає у 15 разів)</text>

  <!-- Легенда під графіком -->
  <line x1="520" y1="382" x2="538" y2="382" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="529" cy="382" r="3" fill="#c0392b"/>
  <text x="544" y="386" font-size="12" font-weight="bold" fill="#c0392b">Повний мапінг (4 шари): лавина алокацій у Young Gen</text>

  <line x1="520" y1="399" x2="538" y2="399" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="529" cy="399" r="3" fill="#27ae60"/>
  <text x="544" y="403" font-size="12" font-weight="bold" fill="#27ae60">Пряма проекція: мінімум алокацій, плаский p99</text>

  <!-- Підсумок справа (Ціна) -->
  <rect x="506" y="424" width="412" height="104" rx="6" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="520" y="444" font-size="12" font-weight="bold" fill="#2457d6">Фізична ціна ізоляції під навантаженням:</text>
  <text x="520" y="464" font-size="12" fill="#1a1a1a">1. Архітектурна ізоляція оплачується CPU збирача сміття.</text>
  <text x="520" y="483" font-size="12" fill="#1a1a1a">2. Коли Eden заповнюється, потоки стають на GC-паузи.</text>
  <text x="520" y="502" font-size="12" fill="#1a1a1a">3. Для високих RPS прямі проекції рятують від сплесків p99.</text>
</svg>
