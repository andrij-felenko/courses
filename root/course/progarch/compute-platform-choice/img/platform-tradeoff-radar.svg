<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняльний шар компромісів обчислювальних платформ</text>
<rect x="40.0" y="25.0" width="960.0" height="45.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="52.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Порівняльний шар компромісів обчислювальних платформ (DH Matrix)</tspan></text>
<rect x="45.0" y="85.0" width="300.0" height="55.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="195.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">Serverless / Fargate</tspan><tspan x="195.0" dy="16.9">(AWS Lambda, Cloud Run, Fargate)</tspan></text>
<rect x="45.0" y="150.0" width="300.0" height="260.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="195.0" y="244.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">• Затримка p99: Низька / Cold Start (50ms–2s)</tspan><tspan x="195.0" dy="13.0">• Утилізація: Ідеальна (Pay-per-use, 0% idle)</tspan><tspan x="195.0" dy="13.0">• Ціна 24/7: Дуже висока ($/GB-sec)</tspan><tspan x="195.0" dy="13.0">• Операційне навантаження: Мінімальне (No OS/K8s)</tspan><tspan x="195.0" dy="13.0">• Контроль ядра/Hardware: Відсутній (Sandbox)</tspan><tspan x="195.0" dy="13.0"></tspan><tspan x="195.0" dy="13.0">🎯 Найкраще для: Webhooks, Crons, Spiky REST API</tspan></text>
<rect x="370.0" y="85.0" width="300.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Kubernetes Cluster</tspan><tspan x="520.0" dy="16.9">(Managed EKS / GKE / Self-hosted)</tspan></text>
<rect x="370.0" y="150.0" width="300.0" height="260.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="248.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">• Затримка p99: Стабільна (&lt; 5ms), без cold start</tspan><tspan x="520.0" dy="11.7">• Утилізація: Висока (Bin-packing HPA/KEDA)</tspan><tspan x="520.0" dy="11.7">• Ціна 24/7: Поміркована (Spot + Savings Plans)</tspan><tspan x="520.0" dy="11.7">• Операційне навантаження: Помірне/Високе (K8s Ops)</tspan><tspan x="520.0" dy="11.7">• Контроль ядра/Hardware: Частковий (cgroups/Device)</tspan><tspan x="520.0" dy="11.7"></tspan><tspan x="520.0" dy="11.7">🎯 Найкраще для: Microservices, Core API, Ingress</tspan></text>
<rect x="695.0" y="85.0" width="300.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">Bare Metal / Direct VM</tspan><tspan x="845.0" dy="16.9">(Physical Rack / IaaS EC2/KVM)</tspan></text>
<rect x="695.0" y="150.0" width="300.0" height="260.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="248.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">• Затримка p99: Ультра-низька (&lt; 1ms, CPU Pinning)</tspan><tspan x="845.0" dy="11.7">• Утилізація: Погана при спалахах (Fixed Limit)</tspan><tspan x="845.0" dy="11.7">• Ціна 24/7: Мінімальна за 1 core (При U &gt; 70%)</tspan><tspan x="845.0" dy="11.7">• Операційне навантаження: Максимальне (OS, HW, Network)</tspan><tspan x="845.0" dy="11.7">• Контроль ядра/Hardware: Повний (eBPF, DPDK, GPU)</tspan><tspan x="845.0" dy="11.7"></tspan><tspan x="845.0" dy="11.7">🎯 Найкраще для: IoT Stream Ingest, Video AI, DB</tspan></text>
</svg>