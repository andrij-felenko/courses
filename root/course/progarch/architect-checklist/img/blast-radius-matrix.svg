<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця аналізу blast radius та ізоляції збоїв</text>
<rect x="40.0" y="40.0" width="450.0" height="160.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="265.0" y="77.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle"><tspan x="265.0" dy="0.0">БЕЗ ІЗОЛЯЦІЇ</tspan><tspan x="265.0" dy="15.6">(Каскадний колапс)</tspan><tspan x="265.0" dy="15.6"></tspan><tspan x="265.0" dy="15.6">Збій у дрібній залежності →</tspan><tspan x="265.0" dy="15.6">Вичерпання пулу сокетів →</tspan><tspan x="265.0" dy="15.6">Блокування асинхронного ядра →</tspan><tspan x="265.0" dy="15.6">Повний даунтайм платформи</tspan></text>
<rect x="530.0" y="40.0" width="450.0" height="160.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="755.0" y="77.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">ЗАХИЩЕНА АРХІТЕКТУРА</tspan><tspan x="755.0" dy="15.6">(Ізольований радіус)</tspan><tspan x="755.0" dy="15.6"></tspan><tspan x="755.0" dy="15.6">Збій залежності →</tspan><tspan x="755.0" dy="15.6">Circuit Breaker відсікає виклики →</tspan><tspan x="755.0" dy="15.6">Fallback повертає стан з кешу →</tspan><tspan x="755.0" dy="15.6">Основний сервіс продовжує роботу</tspan></text>
<rect x="40.0" y="250.0" width="210.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="145.0" y="280.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1565c0" text-anchor="middle"><tspan x="145.0" dy="0.0">A. Bulkheads</tspan><tspan x="145.0" dy="15.6">(Перегородки)</tspan><tspan x="145.0" dy="15.6"></tspan><tspan x="145.0" dy="15.6">Ізольовані пули потоків</tspan><tspan x="145.0" dy="15.6">і сокетів для кожного</tspan><tspan x="145.0" dy="15.6">downstream-сервісу</tspan></text>
<rect x="280.0" y="250.0" width="210.0" height="130.0" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/><text x="385.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#00838f" text-anchor="middle"><tspan x="385.0" dy="0.0">B. Circuit Breaker</tspan><tspan x="385.0" dy="15.6"></tspan><tspan x="385.0" dy="15.6">Автоматичне розмикання</tspan><tspan x="385.0" dy="15.6">кола при зростанні</tspan><tspan x="385.0" dy="15.6">помилок &gt; 5%</tspan></text>
<rect x="520.0" y="250.0" width="210.0" height="130.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="625.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle"><tspan x="625.0" dy="0.0">C. Graceful Fallback</tspan><tspan x="625.0" dy="15.6"></tspan><tspan x="625.0" dy="15.6">Повернення дегродваного</tspan><tspan x="625.0" dy="15.6">відповідника замість</tspan><tspan x="625.0" dy="15.6">500 Internal Error</tspan></text>
<rect x="760.0" y="250.0" width="210.0" height="130.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="865.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7b1fa2" text-anchor="middle"><tspan x="865.0" dy="0.0">D. Load Shedding</tspan><tspan x="865.0" dy="15.6"></tspan><tspan x="865.0" dy="15.6">Відкидання некритичного</tspan><tspan x="865.0" dy="15.6">трафіку при сатурації</tspan><tspan x="865.0" dy="15.6">CPU &gt; 85%</tspan></text>
</svg>