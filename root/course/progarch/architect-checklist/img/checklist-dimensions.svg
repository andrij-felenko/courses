<rect x="700.0" y="370.0" width="280.0" height="110.0" rx="6" fill="#f5f5f5" stroke="#424242" stroke-width="1.5"/><text x="840.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#424242" text-anchor="middle"><tspan x="840.0" dy="0.0">6. Соціотехніка (Team Topologies)</tspan><tspan x="840.0" dy="15.6"></tspan><tspan x="840.0" dy="15.6">• Conway's Law Alignment</tspan><tspan x="840.0" dy="15.6">• Team Cognitive Load Limits</tspan><tspan x="840.0" dy="15.6">• Explicit Service Contracts</tspan></text>
<line x1="700.0" y1="425.0" x2="610.0" y2="315.0" stroke="#424242" stroke-width="2.0" marker-end="url(#arrow)"/>
