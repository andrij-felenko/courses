<rect x="370.0" y="370.0" width="280.0" height="110.0" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/><text x="510.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#00838f" text-anchor="middle"><tspan x="510.0" dy="0.0">5. Еволіціонованість (Evolvability)</tspan><tspan x="510.0" dy="15.6"></tspan><tspan x="510.0" dy="15.6">• SemVer &amp; API Deprecation</tspan><tspan x="510.0" dy="15.6">• Expand-Contract DB Migrations</tspan><tspan x="510.0" dy="15.6">• Reversibility (2-way doors)</tspan></text>
