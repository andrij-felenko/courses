<rect x="700.0" y="30.0" width="280.0" height="110.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="840.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7b1fa2" text-anchor="middle"><tspan x="840.0" dy="0.0">3. Безпека (Security)</tspan><tspan x="840.0" dy="15.6"></tspan><tspan x="840.0" dy="15.6">• STRIDE Threat Modeling</tspan><tspan x="840.0" dy="15.6">• mTLS, PoLP &amp; Secret Mgmt</tspan><tspan x="840.0" dy="15.6">• Audit Logging &amp; Sanitization</tspan></text>
