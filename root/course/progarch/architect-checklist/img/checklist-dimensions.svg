<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мапа 7 критичних вимірів архітектурного чеклиста</text>
<rect x="380.0" y="205.0" width="260.0" height="110.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="510.0" y="222.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">АРХІТЕКТУРНИЙ</tspan><tspan x="510.0" dy="16.9">READINESS GATE</tspan><tspan x="510.0" dy="16.9"></tspan><tspan x="510.0" dy="16.9">• 7 критичних вимірів</tspan><tspan x="510.0" dy="16.9">• Суворі SLO &amp; risk-бюджети</tspan><tspan x="510.0" dy="16.9">• Валідація перед розгортанням</tspan></text>
<rect x="40.0" y="30.0" width="280.0" height="110.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="180.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle"><tspan x="180.0" dy="0.0">1. Стійкість (Resilience)</tspan><tspan x="180.0" dy="15.6"></tspan><tspan x="180.0" dy="15.6">• Blast Radius &amp; Cell Isolation</tspan><tspan x="180.0" dy="15.6">• Circuit Breakers &amp; Fallbacks</tspan><tspan x="180.0" dy="15.6">• Load Shedding &amp; Backpressure</tspan></text>
<line x1="320.0" y1="85.0" x2="410.0" y2="205.0" stroke="#c62828" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="370.0" y="30.0" width="280.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="510.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1565c0" text-anchor="middle"><tspan x="510.0" dy="0.0">2. Масштабованість (Scalability)</tspan><tspan x="510.0" dy="15.6"></tspan><tspan x="510.0" dy="15.6">• Resource Saturation Limits</tspan><tspan x="510.0" dy="15.6">• Sharding &amp; Caching Topologies</tspan><tspan x="510.0" dy="15.6">• Asynchronous Decoupling</tspan></text>
