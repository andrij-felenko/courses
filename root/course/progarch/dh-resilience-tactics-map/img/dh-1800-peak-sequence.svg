<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Послідовність захисту системи при піковому навантаженні 1800 req/s</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Адаптивне відсікання надлишкових запитів на рівні Rate Limiter захищає ядро бази даних</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-drop" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-pass" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Lifelines -->
  <rect x="60" y="90" width="160" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="140" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Вхідний потік (1800 r/s)</text>

  <rect x="290" y="90" width="160" height="40" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="370" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">Rate Limiter (Max 1000)</text>

  <rect x="520" y="90" width="160" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="600" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Bulkhead Pool</text>

  <rect x="740" y="90" width="160" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="820" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">Core DB Engine</text>

  <!-- Vertical lines -->
  <line x1="140" y1="130" x2="140" y2="410" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="370" y1="130" x2="370" y2="410" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="600" y1="130" x2="600" y2="410" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="820" y1="130" x2="820" y2="410" stroke="#d0d7de" stroke-dasharray="4,4"/>

  <!-- Step 1: Burst Surge -->
  <line x1="140" y1="160" x2="370" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="255" y="163" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">1800 req/s Burst</text>

  <!-- Step 2: Rate Limiter Shedding -->
  <line x1="370" y1="205" x2="140" y2="235" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-drop)"/>
  <text x="255" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Drop 800 req/s (HTTP 429 Too Many Requests)</text>

  <!-- Step 3: Passed Traffic to Bulkhead -->
  <line x1="370" y1="250" x2="600" y2="270" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-pass)"/>
  <text x="485" y="253" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Pass 1000 req/s</text>

  <!-- Step 4: Bulkhead Isolation -->
  <line x1="600" y1="290" x2="820" y2="310" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-pass)"/>
  <text x="710" y="293" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Bounded Thread Pool (100 threads)</text>

  <!-- Step 5: DB Response -->
  <line x1="820" y1="340" x2="140" y2="380" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-pass)"/>
  <text x="480" y="355" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Успішна відповідь 1000 req/s (Стабільна затримка 15ms)</text>
</svg>
