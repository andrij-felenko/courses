<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Конвеєр тактик стійкості розподіленого сервісу</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Послідовні рубежі захисту запиту від входу в API Gateway до обробки в базі даних</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Pipeline Stages -->
  <!-- Stage 1: API Gateway / Rate Limiting -->
  <rect x="40" y="140" width="150" height="200" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="115" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">1. Rate Limiting</text>
  <line x1="55" y1="185" x2="175" y2="185" stroke="#2457d6" stroke-width="1"/>
  <text x="115" y="210" font-size="12" text-anchor="middle" fill="#1a1a1a">Token Bucket</text>
  <text x="115" y="235" font-size="12" text-anchor="middle" fill="#6b7280">Захист від DoS</text>
  <text x="115" y="260" font-size="12" text-anchor="middle" fill="#c0392b">HTTP 429 при &gt; max</text>

  <!-- Arrow 1-2 -->
  <line x1="190" y1="240" x2="215" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 2: Timeout Guard -->
  <rect x="220" y="140" width="150" height="200" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="295" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. Timeout Guard</text>
  <line x1="235" y1="185" x2="355" y2="185" stroke="#d0d7de" stroke-width="1"/>
  <text x="295" y="210" font-size="12" text-anchor="middle" fill="#1a1a1a">Max Duration</text>
  <text x="295" y="235" font-size="12" text-anchor="middle" fill="#6b7280">500 ms limit</text>
  <text x="295" y="260" font-size="12" text-anchor="middle" fill="#c0392b">Переривання потоку</text>

  <!-- Arrow 2-3 -->
  <line x1="370" y1="240" x2="395" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 3: Circuit Breaker -->
  <rect x="400" y="140" width="150" height="200" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="475" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">3. Circuit Breaker</text>
  <line x1="415" y1="185" x2="535" y2="185" stroke="#c0392b" stroke-width="1"/>
  <text x="475" y="210" font-size="12" text-anchor="middle" fill="#1a1a1a">State: Closed/Open</text>
  <text x="475" y="235" font-size="12" text-anchor="middle" fill="#6b7280">50% помилок → Open</text>
  <text x="475" y="260" font-size="12" text-anchor="middle" fill="#c0392b">Fast Fail (без виклику)</text>

  <!-- Arrow 3-4 -->
  <line x1="550" y1="240" x2="575" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 4: Bulkhead Isolation -->
  <rect x="580" y="140" width="150" height="200" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="655" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">4. Bulkhead Pool</text>
  <line x1="595" y1="185" x2="715" y2="185" stroke="#d0d7de" stroke-width="1"/>
  <text x="655" y="210" font-size="12" text-anchor="middle" fill="#1a1a1a">Thread Isolation</text>
  <text x="655" y="235" font-size="12" text-anchor="middle" fill="#6b7280">Окремий пулю (50)</text>
  <text x="655" y="260" font-size="12" text-anchor="middle" fill="#2457d6">Ізоляція збоїв</text>

  <!-- Arrow 4-5 -->
  <line x1="730" y1="240" x2="755" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 5: Backend & Fallback -->
  <rect x="760" y="140" width="160" height="200" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="840" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">5. Target DB / Cache</text>
  <line x1="775" y1="185" x2="905" y2="185" stroke="#27ae60" stroke-width="1"/>
  <text x="840" y="210" font-size="12" text-anchor="middle" fill="#1a1a1a">Primary Processing</text>
  <text x="840" y="235" font-size="12" text-anchor="middle" fill="#6b7280">Fallback to Cache</text>
  <text x="840" y="260" font-size="12" text-anchor="middle" fill="#27ae60">Graceful Degrade</text>

  <!-- Summary Bottom Banner -->
  <rect x="40" y="370" width="880" height="45" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="397" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Результат: Захист від каскадного падіння, вичерпання ресурсів та контрольована деградація</text>
</svg>
