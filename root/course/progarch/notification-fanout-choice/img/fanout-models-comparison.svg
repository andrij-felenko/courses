<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння моделей масової розсилки сповіщень: On-Write, On-Read та Гібрид</text>
<rect x="40.0" y="40.0" width="320.0" height="430.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.6"/><text x="200.0" y="223.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">ON-WRITE (PUSH / MATERIALIZED)</tspan><tspan x="200.0" dy="11.7"></tspan><tspan x="200.0" dy="11.7">• Продюсер дублює запис для кожного з N підписників у момент події.</tspan><tspan x="200.0" dy="11.7">• Сховище: N записів у БД / чергах.</tspan><tspan x="200.0" dy="11.7">• Читання: O(1) — миттєво зі скриньки.</tspan><tspan x="200.0" dy="11.7">• Запис: O(N) — вибух навантаження на спалахах (fan-out amplification).</tspan><tspan x="200.0" dy="11.7">• Ідеально для: вузької аудиторії (сім'я, 1–10 пристроїв).</tspan></text>
<rect x="390.0" y="40.0" width="320.0" height="430.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="550.0" y="223.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">ON-READ (PULL / BROADCAST)</tspan><tspan x="550.0" dy="11.7"></tspan><tspan x="550.0" dy="11.7">• Продюсер пише подійний запис ЛИШЕ ОДИН РАЗ у загальний журнал.</tspan><tspan x="550.0" dy="11.7">• Сховище: 1 запис у БД.</tspan><tspan x="550.0" dy="11.7">• Запис: O(1) — миттєво та дешево.</tspan><tspan x="550.0" dy="11.7">• Читання: O(M) — кожен із M активних підписників фільтрує стрічку при вході.</tspan><tspan x="550.0" dy="11.7">• Ідеально для: масових подій ЖК та системи (10 000+ мешканців).</tspan></text>
<rect x="740.0" y="40.0" width="320.0" height="430.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="900.0" y="223.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">ГІБРИДНА МОДЕЛЬ (TIERED)</tspan><tspan x="900.0" dy="11.7"></tspan><tspan x="900.0" dy="11.7">• Динамічний роутинг за розміром аудиторії N та критичністю.</tspan><tspan x="900.0" dy="11.7">• Вузька аудиторія → On-Write.</tspan><tspan x="900.0" dy="11.7">• Велика аудиторія → On-Read для стрічки + асинхронний push-дайджест.</tspan><tspan x="900.0" dy="11.7">• Критична тривога → Аварійний обхід (Emergency bypass).</tspan><tspan x="900.0" dy="11.7">• Ідеально для: Digital Homes.</tspan></text>
</svg>