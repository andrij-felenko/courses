<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1160 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1160" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="575.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура трирівневого Fan-Out роутера Digital Homes</text>
<rect x="40.0" y="200.0" width="180.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="130.0" y="250.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">ВХІДНА ПОДІЯ</tspan><tspan x="130.0" dy="16.9">(Event Ingress)</tspan><tspan x="130.0" dy="16.9"></tspan><tspan x="130.0" dy="16.9">Тип, Scope, N,</tspan><tspan x="130.0" dy="16.9">Пріоритет</tspan></text>
<line x1="222.0" y1="280.0" x2="280.0" y2="280.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="285.0" y="200.0" width="200.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="2.0"/><text x="385.0" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="385.0" dy="0.0">FAN-OUT ROUTER</tspan><tspan x="385.0" dy="16.9">(Аналіз аудиторії N</tspan><tspan x="385.0" dy="16.9">та SLA доставки)</tspan></text>
<line x1="487.0" y1="230.0" x2="565.0" y2="120.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="510.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Emergency / N &lt;= 10</text>
<rect x="570.0" y="60.0" width="530.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="835.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">TIER 1: EMERGENCY &amp; HOME SCOPE (On-Write + Fast-Track)</tspan><tspan x="835.0" dy="15.6">Пряма розсилка по індивідуальних пристроях без злиття (лаг &lt; 500 мс).</tspan><tspan x="835.0" dy="15.6">Bypass throttling. Пули високого пріоритету.</tspan></text>
<line x1="487.0" y1="280.0" x2="565.0" y2="280.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="510.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">10 &lt; N &lt;= 5000</text>
<rect x="570.0" y="220.0" width="530.0" height="120.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="835.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">TIER 2: COMMUNITY SCOPE (Hybrid: On-Read Feed + Batched Push)</tspan><tspan x="835.0" dy="15.6">Новина в загальний журнал ЖК. Push розсилається батчами (chunking = 500)</tspan><tspan x="835.0" dy="15.6">із дедуплікацією та throttling.</tspan></text>
<line x1="487.0" y1="330.0" x2="565.0" y2="440.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="510.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">N &gt; 5000</text>
<rect x="570.0" y="380.0" width="530.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.8"/><text x="835.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">TIER 3: SYSTEM BROADCAST (On-Read Only + Topic Push)</tspan><tspan x="835.0" dy="15.6">1 запис у глобальну стрічку. Жодних записів в inboxes.</tspan><tspan x="835.0" dy="15.6">Push через broadcast FCM/APNs topics.</tspan></text>
</svg>