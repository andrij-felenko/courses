<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White background rect -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-error" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вкладений порядок обробників у конвеєрі стійкості</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Зовнішній фаллбек захищає від усіх збоїв, повтори крутять спроби навколо автомата й таймауту</text>

  <!-- Nested Enclosures (Russian Doll Hierarchy) -->
  <!-- 1. Fallback enclosure (Outermost) -->
  <rect x="30" y="76" width="900" height="352" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="45" y="93" font-size="13" font-weight="bold" fill="#1a1a1a">1. ФАЛЛБЕК (FALLBACK)</text>

  <!-- 2. Retry enclosure -->
  <rect x="210" y="98" width="705" height="324" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="225" y="115" font-size="13" font-weight="bold" fill="#2457d6">2. ПОВТОРИ (RETRY)</text>

  <!-- 3. Circuit Breaker enclosure -->
  <rect x="390" y="120" width="510" height="294" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="405" y="137" font-size="13" font-weight="bold" fill="#1a1a1a">3. РОЗРИВ ЛАНЦЮГА</text>

  <!-- 4. Timeout enclosure -->
  <rect x="570" y="142" width="315" height="264" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="585" y="159" font-size="13" font-weight="bold" fill="#2457d6">4. ТАЙМАУТ СПРОБИ</text>

  <!-- 5. Remote Call enclosure (Innermost) -->
  <rect x="745" y="166" width="125" height="230" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="755" y="184" font-size="12" font-weight="bold" fill="#1a1a1a">СИСТЕМНА МЕЖА</text>

  <!-- Column 1: Fallback Cards -->
  <rect x="42" y="102" width="156" height="144" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="118" font-size="12" font-weight="bold" fill="#1a1a1a">Остання лінія:</text>
  <text x="50" y="136" font-size="12" fill="#1a1a1a">• Огортає всі спроби</text>
  <text x="50" y="154" font-size="12" fill="#1a1a1a">• Ловить будь-який</text>
  <text x="50" y="172" font-size="12" fill="#1a1a1a">  залишковий збій</text>
  <text x="50" y="190" font-size="12" fill="#1a1a1a">• Захищає від 500</text>
  <text x="50" y="210" font-size="12" fill="#6b7280">• Ізолює аварію</text>
  <text x="50" y="228" font-size="12" fill="#6b7280">• Працює в памʼяті</text>

  <rect x="42" y="260" width="156" height="154" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="50" y="276" font-size="12" font-weight="bold" fill="#27ae60">Запасна дія:</text>
  <text x="50" y="294" font-size="12" fill="#1a1a1a">• Читання з кешу</text>
  <text x="50" y="312" font-size="12" fill="#1a1a1a">• Статичний дефолт</text>
  <text x="50" y="330" font-size="12" fill="#1a1a1a">• Скидання в чергу</text>
  <text x="50" y="348" font-size="12" fill="#1a1a1a">• Прапорець збою</text>
  <text x="50" y="372" font-size="12" font-weight="bold" fill="#27ae60">Результат:</text>
  <text x="50" y="392" font-size="12" fill="#1a1a1a">200 OK (деградація)</text>

  <!-- Column 2: Retry Cards -->
  <rect x="222" y="124" width="156" height="142" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="230" y="140" font-size="12" font-weight="bold" fill="#2457d6">Параметри циклу:</text>
  <text x="230" y="158" font-size="12" fill="#1a1a1a">• Ліміт спроб: N = 3</text>
  <text x="230" y="176" font-size="12" fill="#1a1a1a">• Експоненційний крок</text>
  <text x="230" y="194" font-size="12" fill="#1a1a1a">• Дрижання (jitter)</text>
  <text x="230" y="212" font-size="12" fill="#1a1a1a">• Проти резонансу</text>
  <text x="230" y="232" font-size="12" fill="#6b7280">• Не блокує сервіс</text>
  <text x="230" y="252" font-size="12" fill="#6b7280">• Пауза між викликами</text>

  <rect x="222" y="280" width="156" height="128" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="230" y="296" font-size="12" font-weight="bold" fill="#2457d6">Поведінка спроб:</text>
  <text x="230" y="316" font-size="12" fill="#1a1a1a">• Таймаут/5xx ➔ повтор</text>
  <text x="230" y="334" font-size="12" fill="#1a1a1a">• Помилка 4xx ➔ вихід</text>
  <text x="230" y="352" font-size="12" fill="#1a1a1a">• Кожна спроба — в CB</text>
  <text x="230" y="376" font-size="12" font-weight="bold" fill="#c0392b">Якщо N вичерпано:</text>
  <text x="230" y="394" font-size="12" fill="#c0392b">➔ виняток у Фаллбек</text>

  <!-- Column 3: Circuit Breaker Cards -->
  <rect x="402" y="146" width="156" height="132" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="410" y="162" font-size="12" font-weight="bold" fill="#1a1a1a">Стани автомата:</text>
  <text x="410" y="180" font-size="12" font-weight="bold" fill="#27ae60">• Closed: штатно</text>
  <text x="410" y="198" font-size="12" font-weight="bold" fill="#c0392b">• Open: розімкнено</text>
  <text x="410" y="216" font-size="12" font-weight="bold" fill="#2457d6">• Half-Open: проба</text>
  <text x="410" y="236" font-size="12" fill="#1a1a1a">• Поріг відмов: 50%</text>
  <text x="410" y="256" font-size="12" fill="#6b7280">• Ковзне вікно подій</text>

  <rect x="402" y="292" width="156" height="108" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="410" y="308" font-size="12" font-weight="bold" fill="#c0392b">Швидка відмова:</text>
  <text x="410" y="328" font-size="12" fill="#1a1a1a">• Якщо стан Open ➔</text>
  <text x="410" y="346" font-size="12" fill="#1a1a1a">  відсікає миттєво</text>
  <text x="410" y="366" font-size="12" fill="#1a1a1a">• Без виклику мережі</text>
  <text x="410" y="386" font-size="12" fill="#6b7280">• Рятує чужий вузол</text>

  <!-- Column 4: Timeout Cards -->
  <rect x="582" y="168" width="150" height="112" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="590" y="184" font-size="12" font-weight="bold" fill="#2457d6">Дедлайн спроби:</text>
  <text x="590" y="202" font-size="12" fill="#1a1a1a">• Ліміт на 1 виклик</text>
  <text x="590" y="220" font-size="12" fill="#1a1a1a">• Наприклад: 800 мс</text>
  <text x="590" y="238" font-size="12" fill="#1a1a1a">• Обриває підвисання</text>
  <text x="590" y="258" font-size="12" fill="#6b7280">• Звільняє ресурси</text>

  <rect x="582" y="294" width="150" height="94" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="590" y="310" font-size="12" font-weight="bold" fill="#2457d6">При перевищенні:</text>
  <text x="590" y="330" font-size="12" fill="#1a1a1a">• TimeoutException</text>
  <text x="590" y="348" font-size="12" fill="#1a1a1a">• Враховується в CB</text>
  <text x="590" y="368" font-size="12" fill="#1a1a1a">• Запускає ретрай</text>

  <!-- Column 5: Target Cards -->
  <rect x="753" y="194" width="110" height="184" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="760" y="212" font-size="12" font-weight="bold" fill="#1a1a1a">Віддалений</text>
  <text x="760" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">сервіс:</text>
  <text x="760" y="252" font-size="12" fill="#c0392b">• Затримки</text>
  <text x="760" y="272" font-size="12" fill="#c0392b">• Втрата пакета</text>
  <text x="760" y="292" font-size="12" fill="#c0392b">• Падіння 503</text>
  <text x="760" y="318" font-size="12" fill="#6b7280">• Обрив сокета</text>
  <text x="760" y="342" font-size="12" font-weight="bold" fill="#1a1a1a">Мережева</text>
  <text x="760" y="358" font-size="12" font-weight="bold" fill="#1a1a1a">непевність</text>

  <!-- Bottom Summary Cards: Why this nesting order -->
  <rect x="30" y="445" width="213" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="42" y="465" font-size="13" font-weight="bold" fill="#1a1a1a">1. Фаллбек — найширше</text>
  <text x="42" y="485" font-size="12" fill="#6b7280">Остання інстанція:</text>
  <text x="42" y="503" font-size="12" fill="#1a1a1a">перехоплює збої ретраїв</text>
  <text x="42" y="521" font-size="12" fill="#1a1a1a">та аварії відкритого CB</text>

  <rect x="259" y="445" width="213" height="95" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="271" y="465" font-size="13" font-weight="bold" fill="#2457d6">2. Повтори — над CB</text>
  <text x="271" y="485" font-size="12" fill="#6b7280">Контроль спроб:</text>
  <text x="271" y="503" font-size="12" fill="#1a1a1a">кожна спроба запитує дозвіл</text>
  <text x="271" y="521" font-size="12" fill="#1a1a1a">в автомата (Open ➔ відсіч)</text>

  <rect x="488" y="445" width="213" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="500" y="465" font-size="13" font-weight="bold" fill="#1a1a1a">3. Автомат — над таймаутом</text>
  <text x="500" y="485" font-size="12" fill="#6b7280">Облік стану вузла:</text>
  <text x="500" y="503" font-size="12" fill="#1a1a1a">фіксує перевищення ліміту</text>
  <text x="500" y="521" font-size="12" fill="#1a1a1a">як відмову й ізолює вузол</text>

  <rect x="717" y="445" width="213" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="729" y="465" font-size="13" font-weight="bold" fill="#2457d6">4. Таймаут — найглибше</text>
  <text x="729" y="485" font-size="12" fill="#6b7280">Квантування спроби:</text>
  <text x="729" y="503" font-size="12" fill="#1a1a1a">обмежує окрему спробу,</text>
  <text x="729" y="521" font-size="12" fill="#1a1a1a">а не весь сумарний час</text>
</svg>
