<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Адаптивний шлюз на межі: мікропакетування та проєкція полів</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Пакетування ліквідує стіну латентності, а маскування полів — стіну пропускної здатності, утримуючи систему в долині ціни</text>

  <!-- ==================== ЗОНА 1: ВХІДНИЙ ПОТІК ЗАПИТІВ ==================== -->
  <rect x="24" y="72" width="180" height="268" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="114" y="94" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Вхідний потік</text>
  <text x="114" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Окремі запити клієнтів</text>

  <!-- Дрібні запити -->
  <rect x="36" y="126" width="156" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="114" y="148" font-size="12" fill="#1a1a1a" text-anchor="middle">Запит 1: GetOrder(101)</text>

  <rect x="36" y="170" width="156" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="114" y="192" font-size="12" fill="#1a1a1a" text-anchor="middle">Запит 2: GetOrder(102)</text>

  <rect x="36" y="214" width="156" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="114" y="236" font-size="12" fill="#1a1a1a" text-anchor="middle">Запит 3: GetOrder(103)</text>

  <!-- Попередження: стіна латентності -->
  <rect x="36" y="264" width="156" height="62" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="114" y="284" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Стіна латентності</text>
  <text x="114" y="304" font-size="12" fill="#1a1a1a" text-anchor="middle">N запитів = N × RTT</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="204" y1="190" x2="214" y2="190" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ==================== ЗОНА 2: АДАПТИВНЕ МІКРОПАКЕТУВАННЯ ==================== -->
  <rect x="216" y="72" width="230" height="268" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="331" y="94" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Мікропакетування</text>
  <text x="331" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Адаптивний буфер черги</text>

  <!-- Буфер черги -->
  <rect x="228" y="126" width="206" height="72" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="331" y="145" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Черга накопичення батчу</text>
  <text x="331" y="165" font-size="12" fill="#1a1a1a" text-anchor="middle">[Req 1] + [Req 2] + [Req 3]</text>
  <text x="331" y="185" font-size="12" fill="#6b7280" text-anchor="middle">Об'єднання викликів</text>

  <!-- Тригери -->
  <rect x="228" y="206" width="98" height="48" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="277" y="225" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Таймер T_wait</text>
  <text x="277" y="243" font-size="12" fill="#1a1a1a" text-anchor="middle">5–10 мс</text>

  <rect x="336" y="206" width="98" height="48" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="385" y="225" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ліміт N_batch</text>
  <text x="385" y="243" font-size="12" fill="#1a1a1a" text-anchor="middle">50 запитів</text>

  <!-- Спрацювання тригера -->
  <rect x="228" y="264" width="206" height="62" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="331" y="284" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Спрацювання тригера</text>
  <text x="331" y="304" font-size="12" fill="#1a1a1a" text-anchor="middle">1 виклик замість N</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="446" y1="190" x2="458" y2="190" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ==================== ЗОНА 3: ПЕРЕТИН МЕЖІ ==================== -->
  <rect x="460" y="72" width="220" height="268" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="570" y="94" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Перетин межі</text>
  <text x="570" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Пакетний виклик сервісу</text>

  <!-- Семантична межа -->
  <rect x="472" y="126" width="196" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="570" y="143" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">СЕМАНТИЧНА МЕЖА</text>
  <text x="570" y="159" font-size="12" fill="#1a1a1a" text-anchor="middle">1 пакетний виклик</text>

  <!-- Віддалений сервіс -->
  <rect x="472" y="176" width="196" height="72" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="570" y="195" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Бекенд / Сховище</text>
  <text x="570" y="214" font-size="12" fill="#6b7280" text-anchor="middle">Повертає повні сутності</text>
  <text x="570" y="233" font-size="12" fill="#c0392b" text-anchor="middle">40+ полів (по 25 КБ)</text>

  <!-- Загроза надвибірки -->
  <rect x="472" y="256" width="196" height="70" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="570" y="276" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Стіна пропускної здатності</text>
  <text x="570" y="296" font-size="12" fill="#c0392b" text-anchor="middle">Загроза: Over-fetching</text>
  <text x="570" y="314" font-size="12" fill="#6b7280" text-anchor="middle">передача зайвих байтів</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="680" y1="190" x2="692" y2="190" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ==================== ЗОНА 4: ПРОЄКЦІЯ ПОЛІВ ==================== -->
  <rect x="694" y="72" width="242" height="268" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="815" y="94" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">4. Проєкція полів</text>
  <text x="815" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Field Masking на шлюзі</text>

  <!-- Маска полів -->
  <rect x="706" y="126" width="218" height="76" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="815" y="145" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Маска: fields=[id,status]</text>
  <text x="815" y="165" font-size="12" fill="#1a1a1a" text-anchor="middle">Відсікання зайвих полів</text>
  <text x="815" y="185" font-size="12" fill="#6b7280" text-anchor="middle">(опис, аудіт, blob)</text>

  <!-- Стиснена відповідь -->
  <rect x="706" y="210" width="218" height="44" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="815" y="228" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Стиснений вихідний батч</text>
  <text x="815" y="245" font-size="12" fill="#1a1a1a" text-anchor="middle">Розмір: 1.5 КБ замість 50 КБ</text>

  <!-- Результат економії -->
  <rect x="706" y="264" width="218" height="62" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="815" y="284" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Економія трафіку > 90%</text>
  <text x="815" y="304" font-size="12" fill="#27ae60" text-anchor="middle">Мінімальна затримка</text>

  <!-- ==================== ПАНЕЛЬ: ДОЛИНА ЦІНИ ==================== -->
  <rect x="24" y="354" width="912" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="372" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ДОЛИНА ЦІНИ: БАЛАНС ЛАТЕНТНОСТІ ТА ПРОПУСКНОЇ ЗДАТНОСТІ НА МЕЖІ</text>

  <!-- Ліва стіна -->
  <text x="46" y="394" font-size="12" font-weight="bold" fill="#c0392b">Ліва стіна: Chatty виклики</text>
  <text x="46" y="412" font-size="12" fill="#1a1a1a">• Накладні витрати RTT на запит</text>
  <text x="46" y="430" font-size="12" fill="#27ae60">• Ліквідується мікропакетуванням</text>

  <!-- Розділювач 1 -->
  <line x1="310" y1="384" x2="310" y2="434" stroke="#d0d7de" stroke-width="1"/>

  <!-- Оптимум -->
  <text x="480" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Оптимум: Долина ціни (Cost Valley)</text>
  <text x="480" y="412" font-size="12" fill="#1a1a1a" text-anchor="middle">• T_wait (5–10 мс) + N_batch (50)</text>
  <text x="480" y="430" font-size="12" fill="#2457d6" text-anchor="middle">• Проєкція полів: лише потрібний DTO</text>

  <!-- Розділювач 2 -->
  <line x1="650" y1="384" x2="650" y2="434" stroke="#d0d7de" stroke-width="1"/>

  <!-- Права стіна -->
  <text x="662" y="394" font-size="12" font-weight="bold" fill="#c0392b">Права стіна: Over-fetching</text>
  <text x="662" y="412" font-size="12" fill="#1a1a1a">• Перевантаження каналу даними</text>
  <text x="662" y="430" font-size="12" fill="#27ae60">• Ліквідується маскуванням полів</text>
</svg>
