<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Обвал доступності при синхронному розгалуженні (Fan-Out)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Комбінована надійність A_sys = A^k стрімко падає нижче 95% навіть для сервісів «трьох дев'яток»</text>

  <!-- ЛІВА ПАНЕЛЬ: ГРАФІК -->
  <rect x="30" y="74" width="570" height="466" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="74" width="570" height="32" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="315" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">КРИВІ ДЕГРАДАЦІЇ ДОСТУПНОСТІ ПРИ СИНХРОННОМУ FAN-OUT</text>

  <!-- Пояснення порогу 95% угорі над графіком -->
  <text x="95" y="124" font-size="12" font-weight="bold" fill="#c0392b">• Пунктир: поріг 95% (1 збій на 20 викликів)</text>

  <!-- Горизонтальні лінії сітки та підписи осі Y -->
  <line x1="95" y1="140" x2="515" y2="140" stroke="#d0d7de" stroke-width="1"/>
  <text x="88" y="144" text-anchor="end" font-size="12" fill="#6b7280">100%</text>

  <!-- Поріг 95% (червона пунктирна лінія) -->
  <line x1="95" y1="165" x2="515" y2="165" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <rect x="34" y="154" width="54" height="22" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="61" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">95%</text>

  <line x1="95" y1="190" x2="515" y2="190" stroke="#d0d7de" stroke-width="1"/>
  <text x="88" y="194" text-anchor="end" font-size="12" fill="#6b7280">90%</text>

  <line x1="95" y1="240" x2="515" y2="240" stroke="#d0d7de" stroke-width="1"/>
  <text x="88" y="244" text-anchor="end" font-size="12" fill="#6b7280">80%</text>

  <line x1="95" y1="290" x2="515" y2="290" stroke="#d0d7de" stroke-width="1"/>
  <text x="88" y="294" text-anchor="end" font-size="12" fill="#6b7280">70%</text>

  <line x1="95" y1="340" x2="515" y2="340" stroke="#d0d7de" stroke-width="1"/>
  <text x="88" y="344" text-anchor="end" font-size="12" fill="#6b7280">60%</text>

  <line x1="95" y1="390" x2="515" y2="390" stroke="#d0d7de" stroke-width="1"/>
  <text x="88" y="394" text-anchor="end" font-size="12" fill="#6b7280">50%</text>

  <line x1="95" y1="440" x2="515" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="444" text-anchor="end" font-size="12" fill="#6b7280">40%</text>

  <!-- Вертикальні лінії сітки та підписи осі X -->
  <line x1="95" y1="140" x2="95" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="95" y="458" text-anchor="middle" font-size="12" fill="#6b7280">0</text>

  <line x1="165" y1="140" x2="165" y2="440" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="165" y="458" text-anchor="middle" font-size="12" fill="#6b7280">10</text>

  <line x1="235" y1="140" x2="235" y2="440" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="235" y="458" text-anchor="middle" font-size="12" fill="#6b7280">20</text>

  <line x1="305" y1="140" x2="305" y2="440" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="305" y="458" text-anchor="middle" font-size="12" fill="#6b7280">30</text>

  <line x1="375" y1="140" x2="375" y2="440" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="375" y="458" text-anchor="middle" font-size="12" fill="#6b7280">40</text>

  <line x1="445" y1="140" x2="445" y2="440" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="445" y="458" text-anchor="middle" font-size="12" fill="#6b7280">50</text>

  <line x1="515" y1="140" x2="515" y2="440" stroke="#d0d7de" stroke-width="1"/>
  <text x="515" y="458" text-anchor="middle" font-size="12" fill="#6b7280">60</text>

  <!-- Підпис осі X -->
  <text x="305" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кількість синхронних залежностей (викликів k)</text>

  <!-- Три криві деградації -->
  <!-- 1. Крива 99.9% (зелена) -->
  <path d="M 95.0,140.0 L 102.0,140.5 L 109.0,141.0 L 116.0,141.5 L 123.0,142.0 L 130.0,142.5 L 137.0,143.0 L 144.0,143.5 L 151.0,144.0 L 158.0,144.5 L 165.0,145.0 L 172.0,145.5 L 179.0,146.0 L 186.0,146.5 L 193.0,147.0 L 200.0,147.5 L 207.0,148.0 L 214.0,148.4 L 221.0,148.9 L 228.0,149.4 L 235.0,149.9 L 242.0,150.4 L 249.0,150.9 L 256.0,151.4 L 263.0,151.9 L 270.0,152.3 L 277.0,152.8 L 284.0,153.3 L 291.0,153.8 L 298.0,154.3 L 305.0,154.8 L 312.0,155.3 L 319.0,155.8 L 326.0,156.2 L 333.0,156.7 L 340.0,157.2 L 347.0,157.7 L 354.0,158.2 L 361.0,158.7 L 368.0,159.2 L 375.0,159.6 L 382.0,160.1 L 389.0,160.6 L 396.0,161.1 L 403.0,161.6 L 410.0,162.1 L 417.0,162.5 L 424.0,163.0 L 431.0,163.5 L 438.0,164.0 L 445.0,164.5 L 452.0,165.0 L 459.0,165.5 L 466.0,165.9 L 473.0,166.4 L 480.0,166.9 L 487.0,167.4 L 494.0,167.9 L 501.0,168.4 L 508.0,168.8 L 515.0,169.3" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="522" y="167" font-size="12" font-weight="bold" fill="#27ae60">99.9%</text>
  <text x="522" y="181" font-size="12" fill="#27ae60">(94.2%)</text>

  <!-- 2. Крива 99.5% (синя) -->
  <path d="M 95.0,140.0 L 102.0,142.5 L 109.0,145.0 L 116.0,147.5 L 123.0,149.9 L 130.0,152.4 L 137.0,154.8 L 144.0,157.3 L 151.0,159.7 L 158.0,162.1 L 165.0,164.4 L 172.0,166.8 L 179.0,169.2 L 186.0,171.5 L 193.0,173.9 L 200.0,176.2 L 207.0,178.5 L 214.0,180.8 L 221.0,183.1 L 228.0,185.3 L 235.0,187.6 L 242.0,189.9 L 249.0,192.1 L 256.0,194.4 L 263.0,196.6 L 270.0,198.8 L 277.0,201.0 L 284.0,203.2 L 291.0,205.4 L 298.0,207.6 L 305.0,209.8 L 312.0,211.9 L 319.0,214.1 L 326.0,216.2 L 333.0,218.4 L 340.0,220.5 L 347.0,222.6 L 354.0,224.7 L 361.0,226.8 L 368.0,228.9 L 375.0,231.0 L 382.0,233.0 L 389.0,235.1 L 396.0,237.2 L 403.0,239.2 L 410.0,241.3 L 417.0,243.3 L 424.0,245.3 L 431.0,247.3 L 438.0,249.4 L 445.0,251.4 L 452.0,253.4 L 459.0,255.4 L 466.0,257.3 L 473.0,259.3 L 480.0,261.3 L 487.0,263.3 L 494.0,265.2 L 501.0,267.2 L 508.0,269.1 L 515.0,271.1" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="522" y="268" font-size="12" font-weight="bold" fill="#2457d6">99.5%</text>
  <text x="522" y="282" font-size="12" fill="#2457d6">(74.0%)</text>

  <!-- 3. Крива 99.0% (червона) -->
  <path d="M 95.0,140.0 L 102.0,145.0 L 109.0,149.9 L 116.0,154.8 L 123.0,159.7 L 130.0,164.5 L 137.0,169.3 L 144.0,174.0 L 151.0,178.6 L 158.0,183.2 L 165.0,187.8 L 172.0,192.3 L 179.0,196.7 L 186.0,201.2 L 193.0,205.5 L 200.0,209.9 L 207.0,214.2 L 214.0,218.4 L 221.0,222.6 L 228.0,226.8 L 235.0,231.0 L 242.0,235.0 L 249.0,239.1 L 256.0,243.1 L 263.0,247.1 L 270.0,251.0 L 277.0,254.9 L 284.0,258.8 L 291.0,262.6 L 298.0,266.3 L 305.0,270.1 L 312.0,273.8 L 319.0,277.4 L 326.0,281.0 L 333.0,284.6 L 340.0,288.2 L 347.0,291.7 L 354.0,295.2 L 361.0,298.6 L 368.0,302.0 L 375.0,305.4 L 382.0,308.8 L 389.0,312.1 L 396.0,315.4 L 403.0,318.6 L 410.0,321.8 L 417.0,325.0 L 424.0,328.2 L 431.0,331.3 L 438.0,334.4 L 445.0,337.4 L 452.0,340.5 L 459.0,343.4 L 466.0,346.4 L 473.0,349.3 L 480.0,352.3 L 487.0,355.1 L 494.0,358.0 L 501.0,360.8 L 508.0,363.6 L 515.0,366.3" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="522" y="364" font-size="12" font-weight="bold" fill="#c0392b">99.0%</text>
  <text x="522" y="378" font-size="12" fill="#c0392b">(54.7%)</text>

  <!-- Точка перетину 99.9% з 95% (k = 51) -->
  <circle cx="454" cy="165" r="4" fill="#c0392b"/>
  <rect x="380" y="106" width="175" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="467" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">k = 51: A_sys = 94.9%</text>
  <text x="467" y="133" text-anchor="middle" font-size="12" fill="#1a1a1a">Обвал «3 дев'яток» &lt; 95%</text>
  <line x1="454" y1="140" x2="454" y2="157" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ПРАВА ПАНЕЛЬ: АНАЛІЗ -->
  <rect x="618" y="74" width="312" height="466" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="618" y="74" width="312" height="32" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="774" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">МАТЕМАТИКА КОМБІНОВАНОЇ ВІДМОВИ</text>

  <!-- Картка 1: Закон добутку -->
  <rect x="630" y="120" width="288" height="120" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <rect x="630" y="120" width="288" height="24" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="774" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Закон добутку доступності</text>
  <rect x="644" y="156" width="260" height="24" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="774" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">A_sys = A₁ × A₂ × ... × A_k = A^k</text>
  <text x="644" y="196" font-size="12" fill="#1a1a1a">• Кожна синхронна межа — точка відмови</text>
  <text x="644" y="213" font-size="12" fill="#6b7280">• Успіх комплексного запиту вимагає</text>
  <text x="644" y="229" font-size="12" fill="#6b7280">  одночасного успіху всіх k залежностей</text>

  <!-- Картка 2: Точки падіння нижче 95% -->
  <rect x="630" y="254" width="288" height="134" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <rect x="630" y="254" width="288" height="24" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="774" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Коли доступність падає нижче 95%?</text>

  <rect x="644" y="290" width="260" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="774" y="305" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">99.0%:</tspan> обвал уже при k = 6</text>

  <rect x="644" y="324" width="260" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="774" y="339" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">99.5%:</tspan> обвал уже при k = 11</text>

  <rect x="644" y="358" width="260" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="774" y="373" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">99.9%:</tspan> обвал уже при k = 51</text>

  <!-- Картка 3: Архітектурний висновок -->
  <rect x="630" y="402" width="288" height="126" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <rect x="630" y="402" width="288" height="24" rx="6" fill="#1a1a1a" stroke="#c0392b" stroke-width="1.5"/>
  <text x="774" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Архітектурний порятунок</text>
  <text x="644" y="442" font-size="12" font-weight="bold" fill="#c0392b">Синхронний fan-out — це глухий кут!</text>
  <text x="644" y="460" font-size="12" fill="#1a1a1a">• Асинхронні черги (декуплінг часу)</text>
  <text x="644" y="477" font-size="12" fill="#1a1a1a">• Bulkhead-ізоляція та Circuit Breaker</text>
  <text x="644" y="494" font-size="12" fill="#1a1a1a">• Деградація замість відмови (Fallback)</text>
  <text x="644" y="511" font-size="12" fill="#6b7280">• Жорсткі дедлайни та hedged requests</text>
</svg>
