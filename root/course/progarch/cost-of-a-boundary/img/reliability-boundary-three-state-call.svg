<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Межа надійності: тризначна логіка та захист від мережевих збоїв</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">При обриві зв'язку стан стає невизначеним — прозорий RPC руйнується без ідемпотентності та Circuit Breaker</text>

  <!-- ЛІВА ПАНЕЛЬ: ТРИЗНАЧНА ЛОГІКА -->
  <rect x="25" y="80" width="445" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="45" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">Тризначна логіка мережевого виклику</text>
  <rect x="320" y="92" width="130" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="385" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Стан «Невідомо»</text>

  <!-- Порівняльна плашка: 2 стани проти 3 станів -->
  <rect x="45" y="130" width="405" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="149" font-size="12" font-weight="bold" fill="#27ae60">Локальний (2 стани):</text>
  <text x="200" y="149" font-size="12" fill="#1a1a1a">Успіх [✓]  або  Помилка [✕] (пам'ять)</text>

  <text x="55" y="173" font-size="12" font-weight="bold" fill="#c0392b">Мережевий (3 стани):</text>
  <text x="200" y="173" font-size="12" font-weight="bold" fill="#c0392b">Успіх • Помилка • НЕВІДОМО (?)</text>

  <!-- Часова діаграма послідовності -->
  <rect x="45" y="204" width="405" height="213" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вузли часової діаграми -->
  <rect x="55" y="214" width="120" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="115" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Клієнт (App/Hub)</text>

  <rect x="320" y="214" width="120" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="380" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Сервер (Реле)</text>

  <!-- Лінії життя -->
  <line x1="115" y1="236" x2="115" y2="405" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="380" y1="236" x2="380" y2="405" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Активація клієнта -->
  <rect x="110" y="258" width="10" height="117" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>

  <!-- Крок 1: Запит -->
  <line x1="120" y1="268" x2="373" y2="268" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="247" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1. POST /relay/toggle (Key: 0x4F)</text>

  <!-- Крок 2: Сервер виконує -->
  <rect x="375" y="268" width="10" height="35" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="247" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">2. Фізичне реле замкнено (успіх)</text>

  <!-- Крок 3: Обрив повернення -->
  <line x1="375" y1="322" x2="265" y2="322" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="247" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">✕</text>
  <text x="250" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">3. Обрив зв'язку: втрата 200 OK</text>

  <!-- Крок 4: Таймаут і невизначеність -->
  <text x="247" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">4. Таймаут 500 мс -> TimeoutException</text>
  <text x="247" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Клієнт НЕ ЗНАЄ: чи увімкнене світло?</text>

  <!-- Нижня плашка висновку лівої панелі -->
  <rect x="45" y="429" width="405" height="81" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="60" y="449" font-size="12" font-weight="bold" fill="#c0392b">Крах ілюзії прозорого RPC:</text>
  <text x="60" y="471" font-size="12" fill="#1a1a1a">Повтор (retry) призведе до подвійного спрацьовування</text>
  <text x="60" y="493" font-size="12" fill="#1a1a1a">Мережа позбавляє детермінізму: потрібні спеціальні патерни</text>

  <!-- ПРАВА ПАНЕЛЬ: МЕХАНІЗМИ ЗАХИСТУ -->
  <rect x="490" y="80" width="445" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="505" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">Механізми захисту на межі надійності</text>
  <rect x="800" y="92" width="120" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="860" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Захист межі</text>

  <!-- Секція 1: Circuit Breaker -->
  <rect x="505" y="130" width="415" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="149" font-size="13" font-weight="bold" fill="#2457d6">1. Автомат Circuit Breaker (запобіжник)</text>

  <!-- 3 стани Circuit Breaker -->
  <rect x="515" y="160" width="120" height="58" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="575" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">CLOSED</text>
  <text x="575" y="194" text-anchor="middle" font-size="12" fill="#1a1a1a">Нормальний стан</text>
  <text x="575" y="210" text-anchor="middle" font-size="12" fill="#6b7280">Запити йдуть</text>

  <rect x="652" y="160" width="120" height="58" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="712" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">OPEN</text>
  <text x="712" y="194" text-anchor="middle" font-size="12" fill="#1a1a1a">Ланцюг розімкнено</text>
  <text x="712" y="210" text-anchor="middle" font-size="12" fill="#c0392b">Швидка відмова</text>

  <rect x="790" y="160" width="120" height="58" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="850" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">HALF-OPEN</text>
  <text x="850" y="194" text-anchor="middle" font-size="12" fill="#1a1a1a">Пробна спроба</text>
  <text x="850" y="210" text-anchor="middle" font-size="12" fill="#2457d6">Один запит</text>

  <text x="712" y="238" text-anchor="middle" font-size="12" fill="#6b7280">Помилки > поріг -> розмикання  •  Таймаут охолодження -> проба</text>
  <text x="712" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Успіх проби -> замкнено  |  Невдача -> знову розімкнено</text>

  <!-- Секція 2: Backoff + Jitter -->
  <rect x="505" y="278" width="415" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="299" font-size="13" font-weight="bold" fill="#2457d6">2. Експоненційний відступ із дрижанням (Jitter)</text>

  <text x="520" y="324" font-size="12" font-weight="bold" fill="#1a1a1a">Формула паузи:</text>
  <text x="630" y="324" font-size="12" fill="#2457d6">t = 2^k x 100 мс + random_jitter</text>

  <text x="520" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">Шкала спроб:</text>
  <text x="630" y="350" font-size="12" fill="#1a1a1a">1-а: 100 мс -> 2-а: 240 мс -> 3-я: 580 мс</text>

  <text x="520" y="376" font-size="12" fill="#6b7280">Дрижання (jitter) запобігає резонансу (thundering herd)</text>

  <!-- Секція 3: Idempotency Key -->
  <rect x="505" y="400" width="415" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="520" y="422" font-size="13" font-weight="bold" fill="#27ae60">3. Ключ ідемпотентності (Idempotency Key)</text>

  <text x="520" y="446" font-size="12" font-weight="bold" fill="#1a1a1a">Захист від дублювання:</text>
  <text x="680" y="446" font-size="12" fill="#1a1a1a">Idempotency-Key: UUID у заголовку</text>

  <text x="520" y="470" font-size="12" fill="#1a1a1a">Сервер кешує результат мутації в базі ідемпотентності</text>
  <text x="520" y="494" font-size="12" font-weight="bold" fill="#27ae60">Повторний запит повертає кеш БЕЗ повторної дії</text>
</svg>
