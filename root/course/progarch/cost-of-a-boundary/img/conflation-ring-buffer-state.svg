<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Кільцевий буфер зі згортанням (Conflation): оновлення стану на місці</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Перезапис значень за sensor_id утримує чергу в межах фіксованої пам'яті O(K) і запобігає збою OOM</text>

  <!-- ГОЛОВНА ПАНЕЛЬ: МЕХАНІЗМ ЗГОРТАННЯ В БУФЕРІ -->
  <rect x="25" y="80" width="910" height="255" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="45" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Архітектура буфера зі згортанням стану (State Conflation Ring Buffer)</text>
  <rect x="715" y="84" width="200" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="815" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Пам'ять: O(K) const (No OOM)</text>

  <!-- 1. Вхідний замір -->
  <rect x="45" y="120" width="175" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="132" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ВХІДНИЙ ЗАМІР</text>
  <text x="132" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">sensor_id: 101</text>
  <text x="132" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">temp: 22.0 °C</text>
  <text x="132" y="200" text-anchor="middle" font-size="12" fill="#6b7280">мітка часу: T+4</text>
  <text x="132" y="218" text-anchor="middle" font-size="12" font-style="italic" fill="#2457d6">Нове значення</text>

  <!-- Стрілка від входу до диспетчера індексу -->
  <line x1="220" y1="175" x2="250" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 2. Диспетчер / Хеш-індекс ключів -->
  <rect x="252" y="120" width="165" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="334" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ДИСПЕТЧЕР КЛЮЧІВ</text>
  <text x="334" y="160" text-anchor="middle" font-size="12" fill="#6b7280">Швидкий пошук O(1)</text>
  <text x="334" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">101 -&gt; Комірка #0</text>
  <text x="334" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">Ключ уже існує!</text>
  <text x="334" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Дія: перезапис</text>

  <!-- Стрілка від індексу до комірки #0 -->
  <line x1="417" y1="175" x2="447" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 3. Комірки кільцевого буфера (4 слоти) -->

  <!-- Комірка 0: ПЕРЕЗАПИС НА МІСЦІ -->
  <rect x="450" y="120" width="105" height="110" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="502" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">КОМІРКА #0</text>
  <text x="502" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">id: 101</text>
  <text x="502" y="174" text-anchor="middle" font-size="12" fill="#6b7280">було: 21.4°C</text>
  <text x="502" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">22.0°C</text>
  <text x="502" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ПЕРЕЗАПИС</text>

  <!-- Комірка 1 -->
  <rect x="569" y="120" width="105" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="621" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">КОМІРКА #1</text>
  <text x="621" y="156" text-anchor="middle" font-size="12" fill="#1a1a1a">id: 102</text>
  <text x="621" y="174" text-anchor="middle" font-size="12" fill="#2457d6">5.1 bar</text>
  <text x="621" y="192" text-anchor="middle" font-size="12" fill="#6b7280">час: T+2</text>
  <text x="621" y="212" text-anchor="middle" font-size="12" fill="#27ae60">Без змін</text>

  <!-- Комірка 2 -->
  <rect x="688" y="120" width="105" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="740" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">КОМІРКА #2</text>
  <text x="740" y="156" text-anchor="middle" font-size="12" fill="#1a1a1a">id: 103</text>
  <text x="740" y="174" text-anchor="middle" font-size="12" fill="#2457d6">14.2 A</text>
  <text x="740" y="192" text-anchor="middle" font-size="12" fill="#6b7280">час: T+1</text>
  <text x="740" y="212" text-anchor="middle" font-size="12" fill="#27ae60">Без змін</text>

  <!-- Комірка 3 -->
  <rect x="807" y="120" width="105" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="859" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">КОМІРКА #3</text>
  <text x="859" y="156" text-anchor="middle" font-size="12" fill="#1a1a1a">id: 104</text>
  <text x="859" y="174" text-anchor="middle" font-size="12" fill="#2457d6">1420 rpm</text>
  <text x="859" y="192" text-anchor="middle" font-size="12" fill="#6b7280">час: T+3</text>
  <text x="859" y="212" text-anchor="middle" font-size="12" fill="#27ae60">Без змін</text>

  <!-- Нижня плашка всередині панелі: Механіка conflation -->
  <rect x="45" y="248" width="867" height="66" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="478" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">ПРИНЦИП ЗГОРТАННЯ: Оновлення на місці (In-place Overwrite) без додавання в хвіст черги</text>
  <text x="478" y="296" text-anchor="middle" font-size="12" fill="#1a1a1a">Розмір черги суворо обмежений кількістю унікальних ключів K | Нуль алокацій у GC | Захист від Out-of-Memory</text>

  <!-- НИЖНІ ПОЯСНЮВАЛЬНІ КАРТКИ (3 шт) -->

  <!-- Картка 1: Наївна черга FIFO -->
  <rect x="25" y="350" width="293" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="374" font-size="13" font-weight="bold" fill="#c0392b">1. Наївна черга FIFO (без згортання)</text>
  <text x="40" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">Поведінка:</text>
  <text x="115" y="398" font-size="12" fill="#1a1a1a">замір падає в хвіст черги</text>
  <text x="40" y="422" font-size="12" font-weight="bold" fill="#1a1a1a">Швидкість:</text>
  <text x="115" y="422" font-size="12" fill="#c0392b">високий темп надходження</text>
  <text x="40" y="446" font-size="12" font-weight="bold" fill="#1a1a1a">Наслідок:</text>
  <text x="105" y="446" font-size="12" fill="#c0392b">неконтрольований ріст черги</text>
  <text x="40" y="470" font-size="12" fill="#6b7280">Споживач читає застарілі дані</text>
  <text x="171" y="500" text-anchor="middle" font-size="12" font-style="italic" fill="#c0392b">Аварійне падіння: Out-of-Memory</text>

  <!-- Картка 2: Механіка Conflation -->
  <rect x="333" y="350" width="294" height="175" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="348" y="374" font-size="13" font-weight="bold" fill="#2457d6">2. Згортання стану (Conflation)</text>
  <text x="348" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">Семантика:</text>
  <text x="425" y="398" font-size="12" fill="#2457d6">важливий лише свіжий стан</text>
  <text x="348" y="422" font-size="12" font-weight="bold" fill="#1a1a1a">Оновлення:</text>
  <text x="425" y="422" font-size="12" fill="#1a1a1a">новий замір у той самий слот</text>
  <text x="348" y="446" font-size="12" font-weight="bold" fill="#1a1a1a">Пам'ять:</text>
  <text x="405" y="446" font-size="12" fill="#1a1a1a">нуль нових алокацій у купі</text>
  <text x="348" y="470" font-size="12" fill="#6b7280">Проміжний стан скидається</text>
  <text x="480" y="500" text-anchor="middle" font-size="12" font-style="italic" fill="#2457d6">In-place оновлення в кільці</text>

  <!-- Картка 3: Гарантія константної пам'яті -->
  <rect x="642" y="350" width="293" height="175" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="657" y="374" font-size="13" font-weight="bold" fill="#27ae60">3. Гарантія стабільності пам'яті</text>
  <text x="657" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">Обсяг RAM:</text>
  <text x="735" y="398" font-size="12" font-weight="bold" fill="#27ae60">O(K) — суворо фіксований</text>
  <text x="657" y="422" font-size="12" font-weight="bold" fill="#1a1a1a">Свіжість:</text>
  <text x="720" y="422" font-size="12" fill="#1a1a1a">споживач читає останній замір</text>
  <text x="657" y="446" font-size="12" font-weight="bold" fill="#1a1a1a">Надійність:</text>
  <text x="735" y="446" font-size="12" fill="#27ae60">100% захист від збою OOM</text>
  <text x="657" y="470" font-size="12" fill="#6b7280">Для телеметрії та швидких даних</text>
  <text x="788" y="500" text-anchor="middle" font-size="12" font-style="italic" fill="#27ae60">Константна пам'ять за будь-якого потоку</text>
</svg>
