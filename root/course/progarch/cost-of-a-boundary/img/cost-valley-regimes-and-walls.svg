<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Полотно -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr-axis" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-opt" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Долина питомих витрат: стіни латентності, пропускної здатності та оптимум N*</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Мінімум c(N*) досягається на перетині гіперболи латентності T_fixed/N та прямої штрафу β·N</text>

  <!-- Верхні банери трьох режимів -->
  <rect x="130" y="74" width="180" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="220" y="91" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Стіна латентності (N &lt;&lt; N*)</text>

  <rect x="326" y="74" width="168" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="410" y="91" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Долина ціни: оптимум N*</text>

  <rect x="510" y="74" width="385" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="702" y="91" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Стіна пропускної здатності (N &gt;&gt; N*)</text>

  <!-- Розділювачі зон на графіку -->
  <line x1="318" y1="106" x2="318" y2="356" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="502" y1="106" x2="502" y2="356" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Координатні осі -->
  <!-- Вісь Y -->
  <line x1="140" y1="356" x2="140" y2="114" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="130" y="108" font-size="13" font-weight="bold" text-anchor="end" fill="#1a1a1a">c(N)</text>

  <!-- Вісь X -->
  <line x1="140" y1="356" x2="900" y2="356" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <!-- Асимптота 1: Спадна гіпербола латентності c_lat(N) = T_fixed / N -->
  <path d="M230.0,144.8 L234.0,154.8 L238.0,164.0 L242.0,172.3 L246.0,180.0 L250.0,187.0 L254.0,193.5 L258.0,199.5 L262.0,205.1 L266.0,210.3 L270.0,215.2 L274.0,219.7 L278.0,224.0 L282.0,228.0 L286.0,231.7 L290.0,235.3 L294.0,238.6 L298.0,241.8 L302.0,244.8 L306.0,247.7 L310.0,250.4 L314.0,253.0 L318.0,255.4 L322.0,257.7 L326.0,260.0 L330.0,262.1 L334.0,264.2 L338.0,266.1 L342.0,268.0 L346.0,269.8 L350.0,271.5 L354.0,273.2 L358.0,274.8 L362.0,276.3 L366.0,277.8 L370.0,279.2 L374.0,280.6 L378.0,281.9 L382.0,283.2 L386.0,284.4 L390.0,285.6 L394.0,286.7 L398.0,287.9 L402.0,288.9 L406.0,290.0 L410.0,291.0 L414.0,292.0 L418.0,292.9 L422.0,293.9 L426.0,294.8 L430.0,295.6 L434.0,296.5 L438.0,297.3 L442.0,298.1 L446.0,298.9 L450.0,299.7 L454.0,300.4 L458.0,301.1 L462.0,301.8 L466.0,302.5 L470.0,303.2 L474.0,303.8 L478.0,304.5 L482.0,305.1 L486.0,305.7 L490.0,306.3 L494.0,306.9 L498.0,307.4 L502.0,308.0 L506.0,308.5 L510.0,309.1 L514.0,309.6 L518.0,310.1 L522.0,310.6 L526.0,311.1 L530.0,311.5 L534.0,312.0 L538.0,312.4 L542.0,312.9 L546.0,313.3 L550.0,313.8 L554.0,314.2 L558.0,314.6 L562.0,315.0 L566.0,315.4 L570.0,315.8 L574.0,316.1 L578.0,316.5 L582.0,316.9 L586.0,317.2 L590.0,317.6 L594.0,317.9 L598.0,318.3 L602.0,318.6 L606.0,318.9 L610.0,319.3 L614.0,319.6 L618.0,319.9 L622.0,320.2 L626.0,320.5 L630.0,320.8 L634.0,321.1 L638.0,321.4 L642.0,321.7 L646.0,321.9 L650.0,322.2 L654.0,322.5 L658.0,322.7 L662.0,323.0 L666.0,323.2 L670.0,323.5 L674.0,323.7 L678.0,324.0 L682.0,324.2 L686.0,324.5 L690.0,324.7 L694.0,324.9 L698.0,325.2 L702.0,325.4 L706.0,325.6 L710.0,325.8 L714.0,326.0 L718.0,326.2 L722.0,326.5 L726.0,326.7 L730.0,326.9 L734.0,327.1 L738.0,327.3 L742.0,327.5 L746.0,327.6 L750.0,327.8 L754.0,328.0 L758.0,328.2 L762.0,328.4 L766.0,328.6 L770.0,328.7 L774.0,328.9 L778.0,329.1 L782.0,329.3 L786.0,329.4 L790.0,329.6 L794.0,329.8 L798.0,329.9 L802.0,330.1 L806.0,330.2 L810.0,330.4 L814.0,330.5 L818.0,330.7 L822.0,330.9 L826.0,331.0 L830.0,331.1 L834.0,331.3 L838.0,331.4 L842.0,331.6 L846.0,331.7 L850.0,331.9 L854.0,332.0 L858.0,332.1 L862.0,332.3 L866.0,332.4 L870.0,332.5" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Асимптота 2: Зростаюча пряма штрафу за розмір c_size(N) = beta * N -->
  <path d="M150.0,356.0 L870.0,176.0" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Сумарна крива питомих витрат c(N) -->
  <path d="M230.0,124.8 L234.0,133.8 L238.0,142.0 L242.0,149.3 L246.0,156.0 L250.0,162.0 L254.0,167.5 L258.0,172.5 L262.0,177.1 L266.0,181.3 L270.0,185.2 L274.0,188.7 L278.0,192.0 L282.0,195.0 L286.0,197.7 L290.0,200.3 L294.0,202.6 L298.0,204.8 L302.0,206.8 L306.0,208.7 L310.0,210.4 L314.0,212.0 L318.0,213.4 L322.0,214.7 L326.0,216.0 L330.0,217.1 L334.0,218.2 L338.0,219.1 L342.0,220.0 L346.0,220.8 L350.0,221.5 L354.0,222.2 L358.0,222.8 L362.0,223.3 L366.0,223.8 L370.0,224.2 L374.0,224.6 L378.0,224.9 L382.0,225.2 L386.0,225.4 L390.0,225.6 L394.0,225.7 L398.0,225.9 L402.0,225.9 L406.0,226.0 L410.0,226.0 L414.0,226.0 L418.0,225.9 L422.0,225.9 L426.0,225.8 L430.0,225.6 L434.0,225.5 L438.0,225.3 L442.0,225.1 L446.0,224.9 L450.0,224.7 L454.0,224.4 L458.0,224.1 L462.0,223.8 L466.0,223.5 L470.0,223.2 L474.0,222.8 L478.0,222.5 L482.0,222.1 L486.0,221.7 L490.0,221.3 L494.0,220.9 L498.0,220.4 L502.0,220.0 L506.0,219.5 L510.0,219.1 L514.0,218.6 L518.0,218.1 L522.0,217.6 L526.0,217.1 L530.0,216.5 L534.0,216.0 L538.0,215.4 L542.0,214.9 L546.0,214.3 L550.0,213.8 L554.0,213.2 L558.0,212.6 L562.0,212.0 L566.0,211.4 L570.0,210.8 L574.0,210.1 L578.0,209.5 L582.0,208.9 L586.0,208.2 L590.0,207.6 L594.0,206.9 L598.0,206.3 L602.0,205.6 L606.0,204.9 L610.0,204.3 L614.0,203.6 L618.0,202.9 L622.0,202.2 L626.0,201.5 L630.0,200.8 L634.0,200.1 L638.0,199.4 L642.0,198.7 L646.0,197.9 L650.0,197.2 L654.0,196.5 L658.0,195.7 L662.0,195.0 L666.0,194.2 L670.0,193.5 L674.0,192.7 L678.0,192.0 L682.0,191.2 L686.0,190.5 L690.0,189.7 L694.0,188.9 L698.0,188.2 L702.0,187.4 L706.0,186.6 L710.0,185.8 L714.0,185.0 L718.0,184.2 L722.0,183.5 L726.0,182.7 L730.0,181.9 L734.0,181.1 L738.0,180.3 L742.0,179.5 L746.0,178.6 L750.0,177.8 L754.0,177.0 L758.0,176.2 L762.0,175.4 L766.0,174.6 L770.0,173.7 L774.0,172.9 L778.0,172.1 L782.0,171.3 L786.0,170.4 L790.0,169.6 L794.0,168.8 L798.0,167.9 L802.0,167.1 L806.0,166.2 L810.0,165.4 L814.0,164.5 L818.0,163.7 L822.0,162.9 L826.0,162.0 L830.0,161.1 L834.0,160.3 L838.0,159.4 L842.0,158.6 L846.0,157.7 L850.0,156.9 L854.0,156.0 L858.0,155.1 L862.0,154.3 L866.0,153.4 L870.0,152.5" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Лінія проекції оптимуму N* на вісь X -->
  <line x1="410" y1="226" x2="410" y2="356" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Точка перетину асимптот (410, 291) -->
  <circle cx="410" cy="291" r="4" fill="#6b7280" stroke="white" stroke-width="1.5"/>

  <!-- Точка мінімуму (дно долини) c(N*) -->
  <circle cx="410" cy="226" r="5" fill="#27ae60" stroke="white" stroke-width="2"/>

  <!-- Підписи кривих усередині графіка -->
  <!-- Ліва асимптота -->
  <text x="165" y="282" font-size="12" fill="#c0392b">c_lat(N) = T_fixed / N</text>
  <text x="165" y="298" font-size="12" fill="#6b7280">(амортизація T_fixed)</text>

  <!-- Дно долини: мінімум витрат -->
  <text x="410" y="202" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">c_min = 2√(T_fixed·β)</text>

  <!-- Сумарна крива -->
  <text x="520" y="142" font-size="13" font-weight="bold" fill="#2457d6">c(N) = T_fixed/N + β·N</text>
  <text x="520" y="158" font-size="12" fill="#2457d6">(сумарні питомі витрати)</text>

  <!-- Права асимптота -->
  <text x="660" y="252" font-size="12" fill="#c0392b">c_size(N) = β·N</text>
  <text x="660" y="268" font-size="12" fill="#6b7280">(штраф за роздуття пакета)</text>

  <!-- Підписи на осі X -->
  <text x="150" y="380" font-size="12" fill="#6b7280">1 (поштучно)</text>
  <text x="410" y="380" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">N* = √(T_fixed / β)</text>
  <text x="890" y="380" font-size="13" font-weight="bold" text-anchor="end" fill="#1a1a1a">Розмір пакета N →</text>

  <!-- Нижні картки архітектурного аналізу режимів -->
  <!-- Картка 1: Стіна латентності -->
  <rect x="24" y="412" width="286" height="104" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="167" y="432" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">Стіна латентності (N &lt;&lt; N*)</text>
  <text x="36" y="454" font-size="12" fill="#1a1a1a">• Фіксована затримка T_fixed домінує</text>
  <text x="36" y="474" font-size="12" fill="#6b7280">• Питома ціна зростає гіперболічно: ~1/N</text>
  <text x="36" y="494" font-size="12" fill="#6b7280">• Приклад: N+1 запитів, syscall на 1 байт</text>

  <!-- Картка 2: Дно долини -->
  <rect x="326" y="412" width="296" height="104" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="474" y="432" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">Дно долини: оптимум N*</text>
  <text x="338" y="454" font-size="12" font-weight="bold" fill="#1a1a1a">• Рівновага: T_fixed / N* = β · N*</text>
  <text x="338" y="474" font-size="12" fill="#1a1a1a">• N* = √(T_fixed / β), c_min = 2√(T_fixed·β)</text>
  <text x="338" y="494" font-size="12" fill="#27ae60">• Оптимальний розмір батчу / сторінки</text>

  <!-- Картка 3: Стіна смуги / буфера -->
  <rect x="638" y="412" width="298" height="104" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="787" y="432" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">Стіна смуги / буфера (N &gt;&gt; N*)</text>
  <text x="650" y="454" font-size="12" fill="#1a1a1a">• Штраф за розмір пакета β·N домінує</text>
  <text x="650" y="474" font-size="12" fill="#6b7280">• Надвибірка полів, буферизація, повтори</text>
  <text x="650" y="494" font-size="12" fill="#6b7280">• Приклад: гігантські DTO, блокування черг</text>
</svg>
