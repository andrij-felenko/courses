<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Революція IPC: буферизація Mach проти регістрового перемикання L4</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Йохен Літке довів: передача даних через регістри CPU та direct switch прискорюють IPC у 50 разів</text>

  <!-- ЛІВА КОЛОНКА: Mach 3.0 -->
  <rect x="30" y="75" width="440" height="335" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="50" y="98" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">Mach 3.0 (1990): Буферизований IPC</text>
  <text x="50" y="115" font-size="12" fill="#6b7280" text-anchor="start">Затримка: ~100 мкс (~2000 тактів на 486 CPU)</text>

  <!-- Mach Клієнт (Ring 3) -->
  <rect x="50" y="130" width="180" height="60" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="140" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Клієнт (Потік A)</text>
  <text x="140" y="168" font-size="12" fill="#6b7280" text-anchor="middle">Пам'ять процесу: буфер msg</text>

  <!-- Mach Сервер (Ring 3) -->
  <rect x="270" y="130" width="180" height="60" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="360" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сервер (Потік B)</text>
  <text x="360" y="168" font-size="12" fill="#6b7280" text-anchor="middle">Пам'ять процесу: буфер recv</text>

  <!-- Стрілки виклику ядра в Mach -->
  <line x1="140" y1="190" x2="140" y2="208" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="360" y1="210" x2="360" y2="192" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Mach Ядро (Ring 0) -->
  <rect x="50" y="210" width="400" height="140" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="65" y="230" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">ЯДРО MACH (Ring 0): ПОДВІЙНА БУФЕРИЗАЦІЯ ТА ЧЕРГИ</text>
  <text x="65" y="252" font-size="12" fill="#1a1a1a" text-anchor="start">1. Копіювання №1: з пам'яті A в буфер порту ядра</text>
  <text x="65" y="272" font-size="12" fill="#1a1a1a" text-anchor="start">2. Складна перевірка прав порту (capability lookup)</text>
  <text x="65" y="292" font-size="12" fill="#1a1a1a" text-anchor="start">3. Виклик диспетчера потоків + повний скид TLB (CR3)</text>
  <text x="65" y="312" font-size="12" fill="#1a1a1a" text-anchor="start">4. Копіювання №2: з буфера ядра в пам'ять процесу B</text>
  <text x="65" y="336" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Втрата кешу L1, промахи TLB, подвійний оверхед пам'яті</text>

  <!-- Mach Підсумок -->
  <rect x="50" y="362" width="400" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="250" y="384" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Підсумок: 2 копіювання в RAM + перемикання планувальника</text>

  <!-- ПРАВА КОЛОНКА: L4 Йохена Літке -->
  <rect x="490" y="75" width="440" height="335" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="510" y="98" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">L4 Йохена Літке (1995): Регістровий IPC</text>
  <text x="510" y="115" font-size="12" fill="#6b7280" text-anchor="start">Затримка: ~1.5 мкс (~120 тактів на 486 CPU) — стрибок у 50 разів</text>

  <!-- L4 Клієнт (Ring 3) -->
  <rect x="510" y="130" width="180" height="60" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="600" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Клієнт (Потік A)</text>
  <text x="600" y="168" font-size="12" font-weight="600" fill="#2457d6" text-anchor="middle">Запис у регістри CPU</text>

  <!-- L4 Сервер (Ring 3) -->
  <rect x="730" y="130" width="180" height="60" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="820" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сервер (Потік B)</text>
  <text x="820" y="168" font-size="12" font-weight="600" fill="#2457d6" text-anchor="middle">Читання з регістрів CPU</text>

  <!-- Стрілки передачі регістрів в L4 -->
  <line x1="600" y1="190" x2="600" y2="203" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="820" y1="205" x2="820" y2="192" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- L4 Апаратний рівень: Регістри процесора -->
  <rect x="510" y="205" width="400" height="48" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="525" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">РЕГІСТРИ CPU (EAX, EDX, EBX, ESI, EDI): НУЛЬ КОПІЮВАНЬ</text>
  <text x="525" y="242" font-size="12" fill="#1a1a1a" text-anchor="start">Дані передаються всередині кристала: нуль звернень до RAM</text>

  <!-- L4 Мікроядро (Ring 0) -->
  <rect x="510" y="265" width="400" height="85" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="285" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">МІКРОЯДРО L4 (Ring 0): РАДИКАЛЬНА МІНІМАЛЬНІСТЬ</text>
  <text x="525" y="305" font-size="12" fill="#1a1a1a" text-anchor="start">1. Синхронний rendezvous: потік A блокується, B стартує</text>
  <text x="525" y="325" font-size="12" fill="#1a1a1a" text-anchor="start">2. Direct Switch: пряма передача кванта часу без диспетчера</text>
  <text x="525" y="345" font-size="12" fill="#1a1a1a" text-anchor="start">3. Збереження TLB: ядро ~12 КБ повністю вміщується в кеш L1</text>

  <!-- Зв'язок між регістрами та мікроядром L4 -->
  <line x1="710" y1="253" x2="710" y2="263" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- L4 Підсумок -->
  <rect x="510" y="362" width="400" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="710" y="384" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Підсумок: нуль копій у RAM + direct switch + гарячий кеш L1</text>

  <!-- НИЖНЯ ПАНЕЛЬ: Інженерний висновок та апаратна підлога -->
  <rect x="30" y="422" width="900" height="118" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="442" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">ІНЖЕНЕРНИЙ ВИСНОВОК: АПАРАТНА ПІДЛОГА ТА ПРИРОДА ЦІНИ МЕЖІ</text>
  <text x="50" y="464" font-size="12" fill="#1a1a1a" text-anchor="start">• Провал Mach — наслідок переускладнених абстракцій і поганого коду, а не пороку мікроядер.</text>
  <text x="50" y="484" font-size="12" fill="#1a1a1a" text-anchor="start">• Літке оптимізував архітектуру під залізо: передав дані регістрами й усунув черги з ядра.</text>
  <text x="50" y="504" font-size="12" fill="#1a1a1a" text-anchor="start">• Стрибок у 50 разів спростував міф про принципову повільність захищених процесних меж.</text>
  <text x="50" y="524" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">• Проте апаратна підлога лишається: перехід Ring 3 → Ring 0 і перемикання MMU завжди коштують тактів.</text>
</svg>
