<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Градієнт затримок архітектурних меж: логарифмічний масштаб</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Від 1 нс до 1 мс: кожен підйом шкалою ізоляції коштує стрибка на порядки величини</text>

  <!-- ВЕРХНЯ ПАНЕЛЬ: СТОВПЧАСТА ДІАГРАМА -->
  <rect x="30" y="74" width="900" height="288" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="74" width="900" height="26" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ЛОГАРИФМІЧНА ШКАЛА ЗАТРИМОК ПЕРЕТИНУ МЕЖ (ВІД 10⁰ ДО 10⁶ НАНОСЕКУНД)</text>

  <!-- Стовпчик 1: Direct Call -->
  <text x="232" y="127" text-anchor="end" font-size="12" fill="#1a1a1a">Прямий виклик (Direct)</text>
  <rect x="240" y="112" width="18" height="22" rx="3" fill="#27ae60"/>
  <text x="266" y="127" font-size="12" font-weight="bold" fill="#27ae60">~1.5 нс (1×)</text>

  <!-- Стовпчик 2: Vtable Call -->
  <text x="232" y="161" text-anchor="end" font-size="12" fill="#1a1a1a">Віртуальний виклик (Vtable)</text>
  <rect x="240" y="146" width="54" height="22" rx="3" fill="#27ae60"/>
  <text x="302" y="161" font-size="12" font-weight="bold" fill="#27ae60">~3.5 нс (2.3×)</text>

  <!-- Стовпчик 3: Thread Queue -->
  <text x="232" y="195" text-anchor="end" font-size="12" fill="#1a1a1a">Черга потоків (Queue)</text>
  <rect x="240" y="180" width="308" height="22" rx="3" fill="#2457d6"/>
  <text x="556" y="195" font-size="12" font-weight="bold" fill="#2457d6">~1.2 мкс (800×)</text>

  <!-- Стовпчик 4: UDS (AF_UNIX) -->
  <text x="232" y="229" text-anchor="end" font-size="12" fill="#1a1a1a">Доменний сокет (AF_UNIX)</text>
  <rect x="240" y="214" width="418" height="22" rx="3" fill="#2457d6"/>
  <text x="666" y="229" font-size="12" font-weight="bold" fill="#2457d6">~15 мкс (10 000×)</text>

  <!-- Стовпчик 5: gRPC (Protobuf) -->
  <text x="232" y="263" text-anchor="end" font-size="12" fill="#1a1a1a">Локальний gRPC (Protobuf)</text>
  <rect x="240" y="248" width="498" height="22" rx="3" fill="#c0392b"/>
  <text x="746" y="263" font-size="12" font-weight="bold" fill="#c0392b">~95 мкс (63 000×)</text>

  <!-- Стовпчик 6: REST (JSON) -->
  <text x="232" y="297" text-anchor="end" font-size="12" fill="#1a1a1a">Локальний REST (JSON)</text>
  <rect x="240" y="282" width="602" height="22" rx="3" fill="#c0392b"/>
  <text x="834" y="297" text-anchor="end" font-size="12" font-weight="bold" fill="#ffffff">~1.05 мс (700 000×)</text>

  <!-- Вісь X (горизонтальна) -->
  <line x1="240" y1="318" x2="870" y2="318" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Засічки та підписи декад осі X -->
  <line x1="240" y1="318" x2="240" y2="323" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="337" text-anchor="middle" font-size="12" fill="#6b7280">1 нс</text>

  <line x1="340" y1="318" x2="340" y2="323" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="340" y="337" text-anchor="middle" font-size="12" fill="#6b7280">10 нс</text>

  <line x1="440" y1="318" x2="440" y2="323" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="440" y="337" text-anchor="middle" font-size="12" fill="#6b7280">100 нс</text>

  <line x1="540" y1="318" x2="540" y2="323" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="540" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1 мкс</text>

  <line x1="640" y1="318" x2="640" y2="323" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="640" y="337" text-anchor="middle" font-size="12" fill="#6b7280">10 мкс</text>

  <line x1="740" y1="318" x2="740" y2="323" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="740" y="337" text-anchor="middle" font-size="12" fill="#6b7280">100 мкс</text>

  <line x1="840" y1="318" x2="840" y2="323" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="840" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">1 мс</text>

  <!-- Підпис осі X -->
  <text x="540" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Затримка однієї операції (логарифмічний масштаб)</text>

  <!-- НИЖНІ КАРТКИ: 3 КЛАСИ МЕЖ -->

  <!-- Картка 1: В межах потоку -->
  <rect x="30" y="376" width="290" height="158" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="376" width="290" height="26" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="175" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">1. В МЕЖАХ ПОТОКУ: НАНОСЕКУНДИ</text>
  <text x="44" y="416" font-size="12" font-weight="bold" fill="#1a1a1a">Direct (~1.5 нс) vs Vtable (~3.5 нс)</text>
  <text x="44" y="434" font-size="12" fill="#1a1a1a">• Виконання в регістрах CPU та L1</text>
  <text x="44" y="452" font-size="12" fill="#6b7280">• Vtable: 1 непрямий перехід</text>
  <text x="44" y="470" font-size="12" fill="#6b7280">  та можливий branch mispredict</text>
  <text x="44" y="492" font-size="12" font-weight="bold" fill="#27ae60">• Модульність майже безплатна</text>
  <text x="44" y="510" font-size="12" fill="#6b7280">  (спільна пам'ять і ядро CPU)</text>

  <!-- Картка 2: Потоки та процеси -->
  <rect x="335" y="376" width="290" height="158" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="335" y="376" width="290" height="26" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">2. ПОТОКИ ТА IPC: МІКРОСЕКУНДИ</text>
  <text x="349" y="416" font-size="12" font-weight="bold" fill="#1a1a1a">Queue (~1.2 мкс) vs UDS (~15 мкс)</text>
  <text x="349" y="434" font-size="12" fill="#1a1a1a">• Стрибок на 3 порядки (×800–10 000!)</text>
  <text x="349" y="452" font-size="12" fill="#6b7280">• Queue: атоміки + MESI bouncing</text>
  <text x="349" y="470" font-size="12" fill="#6b7280">• UDS: системні виклики send/recv</text>
  <text x="349" y="488" font-size="12" fill="#6b7280">  і копіювання в буфери ядра ОС</text>
  <text x="349" y="510" font-size="12" font-weight="bold" fill="#2457d6">• Межа процесу вимагає захисту ОС</text>

  <!-- Картка 3: Мережевий стек -->
  <rect x="640" y="376" width="290" height="158" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="640" y="376" width="290" height="26" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="785" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">3. МЕРЕЖА ТА RPC: МІЛІСЕКУНДИ</text>
  <text x="654" y="416" font-size="12" font-weight="bold" fill="#1a1a1a">gRPC (~95 мкс) vs REST (~1.05 мс)</text>
  <text x="654" y="434" font-size="12" fill="#c0392b">• Стрибок на 5–6 порядків (×700 000!)</text>
  <text x="654" y="452" font-size="12" fill="#6b7280">• gRPC: бінарний Protobuf + HTTP/2</text>
  <text x="654" y="470" font-size="12" fill="#6b7280">• REST: JSON парсинг, HTTP хедери</text>
  <text x="654" y="488" font-size="12" fill="#6b7280">  та алокації рядків у купі (heap)</text>
  <text x="654" y="510" font-size="12" font-weight="bold" fill="#c0392b">• Розподіленість ніколи не безплатна</text>
</svg>
