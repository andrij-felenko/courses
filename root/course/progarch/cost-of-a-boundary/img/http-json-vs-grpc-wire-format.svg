<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формат даних у мережі: HTTP/JSON проти gRPC/Protobuf</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Protobuf зменшує обсяг та прискорює парсинг за рахунок бінарних тегів і varint замість рядкових ключів</text>

  <!-- LEFT PANEL: HTTP / JSON -->
  <rect x="25" y="85" width="445" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- JSON Header Banner -->
  <rect x="40" y="100" width="415" height="38" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="52" y="124" font-size="14" font-weight="bold" fill="#c0392b">HTTP / JSON (Текстовий)</text>
  <text x="443" y="124" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="end">~118 байт</text>

  <!-- JSON Sub-box 1: Wire Representation -->
  <rect x="40" y="152" width="415" height="152" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="52" y="170" font-size="12" font-weight="bold" fill="#6b7280">Структура кадру даних (ASCII / UTF-8):</text>

  <!-- Code container -->
  <rect x="52" y="178" width="391" height="64" rx="4" fill="#f8f9fa" stroke="#e1e4e8"/>
  <text x="62" y="197" font-size="12" font-family="Courier New, monospace">
    <tspan fill="#c0392b">{"order_id"</tspan><tspan fill="#1a1a1a">: </tspan><tspan fill="#2457d6">1024</tspan><tspan fill="#1a1a1a">, </tspan><tspan fill="#c0392b">"status"</tspan><tspan fill="#1a1a1a">: </tspan><tspan fill="#c0392b">"PAID"</tspan><tspan fill="#1a1a1a">,</tspan>
  </text>
  <text x="62" y="217" font-size="12" font-family="Courier New, monospace">
    <tspan fill="#c0392b"> "amount"</tspan><tspan fill="#1a1a1a">: </tspan><tspan fill="#2457d6">1500</tspan><tspan fill="#1a1a1a">, </tspan><tspan fill="#c0392b">"customer_id"</tspan><tspan fill="#1a1a1a">: </tspan><tspan fill="#2457d6">8841</tspan><tspan fill="#c0392b">}</tspan>
  </text>

  <!-- Red callout box inside Sub-box 1 -->
  <rect x="52" y="252" width="391" height="42" rx="4" fill="#fdecea" stroke="#f5c6cb"/>
  <text x="62" y="268" font-size="11" fill="#c0392b">
    <tspan font-weight="bold">Надлишковість: </tspan><tspan>назви ключів ("order_id", "status"...)</tspan>
  </text>
  <text x="62" y="284" font-size="11" fill="#c0392b">
    <tspan>та синтаксичні символи займають &gt;60% обсягу</tspan>
  </text>

  <!-- JSON Sub-box 2: Causes of Overhead -->
  <rect x="40" y="318" width="415" height="184" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="52" y="338" font-size="12" font-weight="bold" fill="#1a1a1a">Причини низької ефективності парсингу:</text>

  <!-- JSON Bullet 1 -->
  <rect x="52" y="348" width="6" height="6" rx="1" fill="#c0392b"/>
  <text x="66" y="354" font-size="11" font-weight="bold" fill="#c0392b">1. Повторення текстових ключів</text>
  <text x="66" y="367" font-size="11" fill="#6b7280">Ключі передаються у кожному HTTP-пакеті повторно</text>

  <!-- JSON Bullet 2 -->
  <rect x="52" y="386" width="6" height="6" rx="1" fill="#c0392b"/>
  <text x="66" y="392" font-size="11" font-weight="bold" fill="#c0392b">2. Текстовий парсинг (String Scanning)</text>
  <text x="66" y="405" font-size="11" fill="#6b7280">Посимвольний аналіз, виділення лапок, ком та двоеточій</text>

  <!-- JSON Bullet 3 -->
  <rect x="52" y="424" width="6" height="6" rx="1" fill="#c0392b"/>
  <text x="66" y="430" font-size="11" font-weight="bold" fill="#c0392b">3. Навантаження на Garbage Collector</text>
  <text x="66" y="443" font-size="11" fill="#6b7280">Створення безлічі тимчасових String-об'єктів у RAM</text>

  <!-- JSON Bullet 4 -->
  <rect x="52" y="462" width="6" height="6" rx="1" fill="#c0392b"/>
  <text x="66" y="468" font-size="11" font-weight="bold" fill="#c0392b">4. Конвертація типів (Text -&gt; Number)</text>
  <text x="66" y="481" font-size="11" fill="#6b7280">Трансляція ASCII-символів цифр у машинні числа</text>

  <!-- RIGHT PANEL: gRPC / Protobuf -->
  <rect x="490" y="85" width="445" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Protobuf Header Banner -->
  <rect x="505" y="100" width="415" height="38" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="517" y="124" font-size="14" font-weight="bold" fill="#27ae60">gRPC / Protobuf (Двійковий)</text>
  <text x="908" y="124" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">Обсяг: ~18 байт (-85%)</text>

  <!-- Protobuf Sub-box 1: Wire Representation -->
  <rect x="505" y="152" width="415" height="152" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="517" y="170" font-size="12" font-weight="bold" fill="#6b7280">Структура двійкового кадру (Wire Format):</text>

  <!-- Byte stream visualization container -->
  <g>
    <!-- Field 1: Tag + Varint -->
    <rect x="517" y="178" width="32" height="26" rx="3" fill="#2457d6"/>
    <text x="533" y="195" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">08</text>
    <rect x="552" y="178" width="44" height="26" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="574" y="195" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">80 08</text>

    <!-- Field 2: Tag + Enum -->
    <rect x="606" y="178" width="32" height="26" rx="3" fill="#2457d6"/>
    <text x="622" y="195" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
    <rect x="641" y="178" width="32" height="26" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="657" y="195" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">01</text>

    <!-- Field 3: Tag + Varint -->
    <rect x="683" y="178" width="32" height="26" rx="3" fill="#2457d6"/>
    <text x="699" y="195" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">18</text>
    <rect x="718" y="178" width="44" height="26" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="740" y="195" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">DC 0B</text>

    <!-- Field 4: Tag + Varint -->
    <rect x="772" y="178" width="32" height="26" rx="3" fill="#2457d6"/>
    <text x="788" y="195" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">20</text>
    <rect x="807" y="178" width="44" height="26" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="829" y="195" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">89 45</text>

    <!-- Legend below byte stream -->
    <rect x="517" y="216" width="10" height="10" rx="2" fill="#2457d6"/>
    <text x="532" y="225" font-size="11" fill="#1a1a1a">Тег (ID + Type)</text>

    <rect x="640" y="216" width="10" height="10" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="655" y="225" font-size="11" fill="#1a1a1a">Значення (Varint/Enum)</text>
  </g>

  <!-- Green callout box inside Sub-box 1 -->
  <rect x="517" y="252" width="391" height="42" rx="4" fill="#e9f7ef" stroke="#a3e4d7"/>
  <text x="527" y="268" font-size="11" fill="#27ae60">
    <tspan font-weight="bold">Ефективність: </tspan><tspan>немає рядкових ключів і дужок/лапок</tspan>
  </text>
  <text x="527" y="284" font-size="11" fill="#27ae60">
    <tspan>тег 1 байт замінює назву поля "order_id" (8 байт)</tspan>
  </text>

  <!-- Protobuf Sub-box 2: Causes of Speed -->
  <rect x="505" y="318" width="415" height="184" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="517" y="338" font-size="12" font-weight="bold" fill="#1a1a1a">Причини високої швидкості та компактності:</text>

  <!-- Protobuf Bullet 1 -->
  <rect x="517" y="348" width="6" height="6" rx="1" fill="#27ae60"/>
  <text x="531" y="354" font-size="11" font-weight="bold" fill="#27ae60">1. Компактні числові теги (Field ID)</text>
  <text x="531" y="367" font-size="11" fill="#6b7280">Замість назв полів передаються ID (1-2 байти)</text>

  <!-- Protobuf Bullet 2 -->
  <rect x="517" y="386" width="6" height="6" rx="1" fill="#27ae60"/>
  <text x="531" y="392" font-size="11" font-weight="bold" fill="#27ae60">2. Кодування чисел через Varint</text>
  <text x="531" y="405" font-size="11" fill="#6b7280">Малі числа кодуються 1-2 байтами за допомогою 7-біт</text>

  <!-- Protobuf Bullet 3 -->
  <rect x="517" y="424" width="6" height="6" rx="1" fill="#27ae60"/>
  <text x="531" y="430" font-size="11" font-weight="bold" fill="#27ae60">3. Бінарне зчитування без сканування</text>
  <text x="531" y="443" font-size="11" fill="#6b7280">Прямі побітові зсуви та читання з баферу пам'яті</text>

  <!-- Protobuf Bullet 4 -->
  <rect x="517" y="462" width="6" height="6" rx="1" fill="#27ae60"/>
  <text x="531" y="468" font-size="11" font-weight="bold" fill="#27ae60">4. Схема відома заздалегідь (.proto IDL)</text>
  <text x="531" y="481" font-size="11" fill="#6b7280">Генерований код уникає алокацій ключів у RAM</text>
</svg>
