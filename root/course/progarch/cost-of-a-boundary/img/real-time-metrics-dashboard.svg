<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" width="960" height="525" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="525" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Монітор телеметрії шлюзу: затримка P50/P95/P99 та долина ціни</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#6b7280">Адаптивний регулятор утримує систему на дні оптимуму B* під час зміни навантаження</text>

  <!-- Рамка термінального вікна -->
  <rect x="40" y="86" width="880" height="416" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок термінального вікна -->
  <path d="M 40,124 V 94 A 8,8 0 0 1 48,86 H 912 A 8,8 0 0 1 920,94 V 124 Z" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="62" cy="105" r="4" fill="#c0392b"/>
  <circle cx="76" cy="105" r="4" fill="#f39c12"/>
  <circle cx="90" cy="105" r="4" fill="#27ae60"/>
  <text x="480" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">telemetry-monitor --gateway-metrics --live</text>
  <text x="900" y="110" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">● LIVE: 100 ms</text>

  <!-- Рядок лічильників KPI -->
  <rect x="54" y="136" width="852" height="64" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="267" y1="144" x2="267" y2="192" stroke="#d0d7de" stroke-width="1"/>
  <line x1="480" y1="144" x2="480" y2="192" stroke="#d0d7de" stroke-width="1"/>
  <line x1="693" y1="144" x2="693" y2="192" stroke="#d0d7de" stroke-width="1"/>

  <!-- Колонка 1: RPS -->
  <text x="160" y="160" text-anchor="middle" font-size="12" fill="#6b7280">Пропускна здатність</text>
  <text x="160" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">12 450 req/s</text>

  <!-- Колонка 2: P50 / P95 -->
  <text x="373" y="160" text-anchor="middle" font-size="12" fill="#6b7280">Затримка P50 / P95</text>
  <text x="373" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">1.2 мс / 3.4 мс</text>

  <!-- Колонка 3: P99 -->
  <text x="587" y="160" text-anchor="middle" font-size="12" fill="#6b7280">Хвіст P99 (SLA ≤ 10 мс)</text>
  <text x="587" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">7.8 мс (Норма)</text>

  <!-- Колонка 4: Режим -->
  <text x="800" y="160" text-anchor="middle" font-size="12" fill="#6b7280">Розмір пачки / Режим</text>
  <text x="800" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">B = 16 (Оптимум B*)</text>

  <!-- ЛІВА ПАНЕЛЬ: Перцентилі в часі -->
  <rect x="54" y="214" width="420" height="272" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="72" y="240" font-size="13" font-weight="bold" fill="#1a1a1a">Графіки перцентилів затримки (P50, P95, P99)</text>
  <text x="72" y="265" font-size="12" fill="#6b7280">Адаптація вікна утримує P99 під стелею SLA під час сплеску</text>

  <!-- Легенда графіків -->
  <text x="120" y="295" font-size="12" font-weight="bold" fill="#c0392b">● P99</text>
  <text x="170" y="295" font-size="12" font-weight="bold" fill="#2457d6">● P95</text>
  <text x="220" y="295" font-size="12" font-weight="bold" fill="#27ae60">● P50</text>

  <!-- Стеля SLA -->
  <line x1="115" y1="310" x2="450" y2="310" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="445" y="295" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Стеля SLA (10 мс)</text>

  <!-- Осі лівого графіка -->
  <line x1="115" y1="440" x2="115" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="115" y1="440" x2="450" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="100" y="314" text-anchor="end" font-size="12" fill="#6b7280">10мс</text>
  <text x="100" y="379" text-anchor="end" font-size="12" fill="#6b7280">5мс</text>
  <text x="100" y="444" text-anchor="end" font-size="12" fill="#6b7280">0</text>

  <!-- Криві перцентилів -->
  <path d="M 115,395 C 180,390 230,392 260,345 C 290,325 380,332 450,330" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 115,415 C 180,412 230,415 260,390 C 290,380 380,382 450,380" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 115,430 L 450,428" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Маркер сплеску навантаження -->
  <line x1="260" y1="315" x2="260" y2="440" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="260" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">▲ Сплеск RPS</text>

  <!-- ПРАВА ПАНЕЛЬ: Долина ціни та робоча точка -->
  <rect x="486" y="214" width="420" height="272" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="504" y="240" font-size="13" font-weight="bold" fill="#1a1a1a">Положення на кривій долини ціни</text>
  <text x="504" y="265" font-size="12" fill="#6b7280">Шлюз утримує систему на дні оптимального розміру B* = 16</text>

  <!-- Позначки схилів -->
  <text x="545" y="295" font-size="12" font-weight="bold" fill="#c0392b">◄ Балакучість (N=1)</text>
  <text x="850" y="295" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Надвибірка (N≫1) ►</text>

  <!-- Осі правого графіка -->
  <line x1="530" y1="440" x2="530" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="530" y1="440" x2="860" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- U-подібна крива -->
  <path d="M 550,310 C 600,390 650,400 680,400 C 720,400 780,380 840,320" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Активна робоча точка на дні долини -->
  <line x1="680" y1="407" x2="680" y2="440" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="680" cy="400" r="7" fill="#27ae60" stroke="#ffffff" stroke-width="2.5"/>

  <text x="680" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">● Поточна точка: B = 16</text>
  <text x="680" y="370" text-anchor="middle" font-size="12" fill="#1a1a1a">Дно долини (Min T_total)</text>
  <text x="680" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Оптимальний розмір пачки B* = 16</text>
</svg>
