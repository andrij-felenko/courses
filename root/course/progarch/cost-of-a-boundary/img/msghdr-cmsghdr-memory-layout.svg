<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" width="960" height="525" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="525" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Розкладка пам'яті msghdr та cmsghdr: передача дескрипторів (SCM_RIGHTS)</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#6b7280">Макроси CMSG_* гарантують 8-байтове вирівнювання, яке ламає ручна арифметика</text>

  <!-- ВЕРХНІЙ ЯРУС: Архітектура msghdr -->
  <!-- Картка 1: struct msghdr -->
  <rect x="50" y="86" width="240" height="128" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <path d="M 50,124 V 92 A 6,6 0 0 1 56,86 H 284 A 6,6 0 0 1 290,92 V 124 Z" fill="#2457d6"/>
  <text x="170" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">struct msghdr</text>

  <text x="65" y="148" font-size="12" fill="#1a1a1a">msg_iov ────────▶</text>
  <text x="65" y="173" font-size="12" fill="#1a1a1a">msg_iovlen = 1</text>
  <text x="65" y="198" font-size="12" font-weight="bold" fill="#2457d6">msg_control ────▼</text>

  <!-- Стрілка зв'язку до iovec -->
  <line x1="290" y1="144" x2="345" y2="144" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Картка 2: struct iovec -->
  <rect x="350" y="86" width="250" height="128" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 350,124 V 92 A 6,6 0 0 1 356,86 H 594 A 6,6 0 0 1 600,92 V 124 Z" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="475" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">struct iovec (Дані)</text>

  <text x="365" y="148" font-size="12" fill="#1a1a1a">iov_base ──▶ Буфер замовлення</text>
  <text x="365" y="173" font-size="12" fill="#1a1a1a">iov_len  = 256 байтів</text>
  <text x="365" y="198" font-size="12" fill="#6b7280">Бізнес-повідомлення (JSON / DTO)</text>

  <!-- Картка 3: Розділення каналів -->
  <rect x="640" y="86" width="270" height="128" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="775" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Розділення каналів у POSIX</text>
  <text x="655" y="148" font-size="12" fill="#1a1a1a">● iovec: звичайний потік байтів</text>
  <text x="655" y="173" font-size="12" font-weight="bold" fill="#2457d6">● msg_control: дескриптори ОС</text>
  <text x="655" y="198" font-size="12" fill="#6b7280">Ядро дублює дескриптор у таблицю</text>

  <!-- Стрілка переходу від msghdr до msg_control -->
  <line x1="170" y1="214" x2="170" y2="240" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- НИЖНІЙ ЯРУС: Блок msg_control та вирівнювання cmsghdr -->
  <rect x="50" y="244" width="860" height="258" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="70" y="270" font-size="13" font-weight="bold" fill="#1a1a1a">Блок допоміжних даних msg_control: розкладка cmsghdr та SCM_RIGHTS</text>
  <text x="70" y="295" font-size="12" fill="#6b7280">Архітектурне слово (64-біт): кожен наступний заголовок вимагає адреси, кратної 8</text>

  <!-- Верхній розмірний маркер: CMSG_LEN -->
  <line x1="70" y1="332" x2="530" y2="332" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="70" y1="324" x2="70" y2="336" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="530" y1="324" x2="530" y2="336" stroke="#2457d6" stroke-width="1.5"/>
  <text x="300" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">CMSG_LEN(sizeof(int)) = 16B заголовок + 4B fd = 20 байтів (без падінгу)</text>

  <!-- Стрічка пам'яті (Memory Tape) -->
  <!-- Комірка 1: struct cmsghdr (16 байтів) -->
  <rect x="70" y="344" width="320" height="60" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <line x1="210" y1="344" x2="210" y2="404" stroke="#2457d6" stroke-width="1"/>
  <line x1="300" y1="344" x2="300" y2="404" stroke="#2457d6" stroke-width="1"/>

  <text x="140" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">cmsg_len = 20</text>
  <text x="140" y="392" text-anchor="middle" font-size="12" fill="#6b7280">(8 байтів)</text>

  <text x="255" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SOL_SOCKET</text>
  <text x="255" y="392" text-anchor="middle" font-size="12" fill="#6b7280">(4 байти)</text>

  <text x="345" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SCM_RIGHTS</text>
  <text x="345" y="392" text-anchor="middle" font-size="12" fill="#6b7280">(4 байти)</text>

  <!-- Комірка 2: CMSG_DATA (4 байти) -->
  <rect x="390" y="344" width="140" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="460" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">fd = 5 (4 байти)</text>
  <text x="460" y="392" text-anchor="middle" font-size="12" fill="#27ae60">CMSG_DATA</text>

  <!-- Комірка 3: Падінг вирівнювання CMSG_ALIGN (4 байти) -->
  <rect x="530" y="344" width="140" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="600" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Падінг 4 байти</text>
  <text x="600" y="392" text-anchor="middle" font-size="12" fill="#c0392b">CMSG_ALIGN</text>

  <!-- Комірка 4: Наступний cmsghdr -->
  <rect x="670" y="344" width="210" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="775" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Наступний cmsghdr</text>
  <text x="775" y="392" text-anchor="middle" font-size="12" fill="#27ae60">Зсув 24B (кратно 8) ✔</text>

  <!-- Нижній розмірний маркер: CMSG_SPACE -->
  <line x1="70" y1="416" x2="670" y2="416" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="70" y1="408" x2="70" y2="424" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="670" y1="408" x2="670" y2="424" stroke="#27ae60" stroke-width="1.5"/>
  <text x="370" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">CMSG_SPACE(sizeof(int)) = 20B + 4B падінг = 24 байти (виділяється в буфері)</text>

  <!-- Підсумкові попередження та правила -->
  <text x="480" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">✖ Ручний зсув (+20B): вказівник не кратний 8 → апаратна помилка вирівнювання (SIGBUS)</text>
  <text x="480" y="488" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✔ Макрос CMSG_NXTHDR (+24B): вирівнює адресу через CMSG_ALIGN → безпечний обхід</text>
</svg>
