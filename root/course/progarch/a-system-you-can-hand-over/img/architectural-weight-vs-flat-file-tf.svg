<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Архітектурна вага проти наївного плоского підрахунку Truck Factor</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Маскування монополії на ядро системи великою кількістю периферійних файлів</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: НАЇВНИЙ ПЛОСКИЙ ПІДРАХУНОК ==================== -->
  <rect x="25" y="66" width="445" height="374" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="90" font-size="13" font-weight="700" fill="#c0392b">1. Наївний плоский підрахунок файлів</text>
  <text x="40" y="108" font-size="12" fill="#6b7280">Кожен файл вважається однаково важливим (вага = 1)</text>

  <!-- Картка 1: Структура репозиторію -->
  <rect x="40" y="122" width="415" height="88" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="52" y="142" font-size="12" font-weight="700" fill="#1a1a1a">Розподіл 100 файлів репозиторію:</text>
  <text x="52" y="162" font-size="12" fill="#27ae60">• 95 файлів: UI, конфіги, тексти (команда з 4 осіб)</text>
  <text x="52" y="182" font-size="12" fill="#c0392b">• 5 файлів: архітектурне ядро (лише автор А)</text>
  <text x="52" y="198" font-size="12" fill="#6b7280">Автор А володіє лише 5% від загальної кількості файлів</text>

  <!-- Картка 2: Візуальна шкала -->
  <rect x="40" y="220" width="415" height="80" rx="6" fill="white" stroke="#d0d7de"/>
  <rect x="52" y="238" width="390" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <rect x="52" y="238" width="26" height="24" rx="4" fill="#c0392b" stroke="#c0392b"/>
  <text x="52" y="280" font-size="12" font-weight="700" fill="#c0392b">Ядро: 5% (Автор А)</text>
  <text x="442" y="280" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">Периферія: 95% (Команда B, C, D)</text>

  <!-- Картка 3: Хибний висновок -->
  <rect x="40" y="310" width="415" height="116" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="52" y="332" font-size="13" font-weight="700" fill="#c0392b">Хибний висновок: TF = 4 (Безпечно)</text>
  <text x="52" y="354" font-size="12" fill="#1a1a1a">• Модель вважає: втрата автора А зачіпає лише 5% файлів</text>
  <text x="52" y="374" font-size="12" fill="#1a1a1a">• Решта команди нібито впевнено володіє 95% проєкту</text>
  <text x="52" y="394" font-size="12" font-weight="700" fill="#c0392b">ІЛЮЗІЯ: монополія на ядро схована масою дрібних файлів</text>
  <text x="52" y="412" font-size="12" fill="#6b7280">Приймати систему за такою наївною метрикою небезпечно</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: ЗВАЖЕНИЙ ЗА ГРАФОМ TF ==================== -->
  <rect x="490" y="66" width="445" height="374" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="90" font-size="13" font-weight="700" fill="#27ae60">2. Зважений за графом залежностей TF</text>
  <text x="505" y="108" font-size="12" fill="#6b7280">Вага розраховується через транзитивний вплив на систему</text>

  <!-- Картка 1: Архітектурна вага -->
  <rect x="505" y="122" width="415" height="88" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="517" y="142" font-size="12" font-weight="700" fill="#1a1a1a">Архітектурна вага компонентів:</text>
  <text x="517" y="162" font-size="12" fill="#c0392b">• 5 файлів ядра несуть 85% залежностей усього коду</text>
  <text x="517" y="182" font-size="12" fill="#2457d6">• 95 периферійних файлів спираються на інваріанти ядра</text>
  <text x="517" y="198" font-size="12" fill="#6b7280">Каскадний ефект: вихід ядра паралізує весь проєкт</text>

  <!-- Картка 2: Візуальна шкала -->
  <rect x="505" y="220" width="415" height="80" rx="6" fill="white" stroke="#d0d7de"/>
  <rect x="517" y="238" width="390" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <rect x="517" y="238" width="331" height="24" rx="4" fill="#c0392b" stroke="#c0392b"/>
  <text x="517" y="280" font-size="12" font-weight="700" fill="#c0392b">Архітектурна вага ядра: 85% (Автор А)</text>
  <text x="907" y="280" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">Периферія: 15%</text>

  <!-- Картка 3: Реальний вердикт -->
  <rect x="505" y="310" width="415" height="116" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="517" y="332" font-size="13" font-weight="700" fill="#27ae60">Реальний висновок: TF = 1 (Критичний ризик)</text>
  <text x="517" y="354" font-size="12" fill="#1a1a1a">• Втрата автора А руйнує 85% працездатності системи</text>
  <text x="517" y="374" font-size="12" fill="#1a1a1a">• Справжній Truck Factor дорівнює 1 людині</text>
  <text x="517" y="394" font-size="12" font-weight="700" fill="#2457d6">Вимога приймання: передача знань та ротація по ядру</text>
  <text x="517" y="412" font-size="12" fill="#6b7280">Захист замовника від залежності від одного виконавця</text>
</svg>
