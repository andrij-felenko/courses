<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Життєвий цикл та заміщення архітектурних рішень (ADR)</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Минулі рішення не редагуються заднім числом: зміна курсу породжує новий ADR із посиланням</text>

  <!-- Стан 1: Proposed -->
  <rect x="40" y="100" width="230" height="120" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="52" y="112" width="206" height="28" rx="4" fill="#2457d6"/>
  <text x="155" y="131" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Стан: Proposed (Пропозиція)</text>
  <text x="155" y="160" font-size="12" text-anchor="middle" fill="#1a1a1a">Створено чернетку в репозиторії;</text>
  <text x="155" y="180" font-size="12" text-anchor="middle" fill="#1a1a1a">команда обговорює сили,</text>
  <text x="155" y="200" font-size="12" text-anchor="middle" fill="#6b7280">контекст та компроміси вибору</text>

  <!-- Стрілка Proposed -> Accepted -->
  <line x1="270" y1="160" x2="365" y2="160" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="318" y="148" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Схвалено</text>

  <!-- Стан 2: Accepted -->
  <rect x="375" y="100" width="240" height="120" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="387" y="112" width="216" height="28" rx="4" fill="#27ae60"/>
  <text x="495" y="131" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Стан: Accepted (Чинне)</text>
  <text x="495" y="160" font-size="12" text-anchor="middle" fill="#1a1a1a">Рішення діє та втілюється в коді;</text>
  <text x="495" y="180" font-size="12" text-anchor="middle" fill="#1a1a1a">інваріанти закріплено тестами CI</text>
  <text x="495" y="200" font-size="12" text-anchor="middle" fill="#6b7280">(файл стає незмінним артефактом)</text>

  <!-- Стрілка Proposed -> Rejected -->
  <line x1="155" y1="220" x2="155" y2="295" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="175" y="260" font-size="12" font-weight="bold" fill="#c0392b">Відхилено</text>

  <!-- Стан 3: Rejected -->
  <rect x="40" y="305" width="230" height="120" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="52" y="317" width="206" height="28" rx="4" fill="#c0392b"/>
  <text x="155" y="336" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Стан: Rejected (Відхилено)</text>
  <text x="155" y="365" font-size="12" text-anchor="middle" fill="#1a1a1a">Зберігає «негативне знання»:</text>
  <text x="155" y="385" font-size="12" text-anchor="middle" fill="#1a1a1a">чому ідея не підійшла системі;</text>
  <text x="155" y="405" font-size="12" text-anchor="middle" fill="#6b7280">захищає від повторення помилок</text>

  <!-- Стрілка Accepted -> Superseded -->
  <line x1="615" y1="160" x2="710" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="663" y="148" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Новий ADR</text>

  <!-- Стан 4: Superseded -->
  <rect x="720" y="100" width="200" height="120" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="732" y="112" width="176" height="28" rx="4" fill="#6b7280"/>
  <text x="820" y="131" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Стан: Superseded</text>
  <text x="820" y="160" font-size="12" text-anchor="middle" fill="#1a1a1a">Заміщено новішим записом;</text>
  <text x="820" y="180" font-size="12" text-anchor="middle" fill="#2457d6">містить лінк: superseded by #0042</text>
  <text x="820" y="200" font-size="12" text-anchor="middle" fill="#6b7280">Текст рішення лишається незмінним</text>

  <!-- Нижня панель: Механізм заміщення Найґарда -->
  <rect x="375" y="270" width="545" height="155" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="395" y="295" font-size="13" font-weight="bold" fill="#1a1a1a">Принцип Найґарда: незмінність історії (Immutability of History)</text>

  <!-- Вкладений блок ADR 0012 -->
  <rect x="395" y="310" width="240" height="98" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="407" y="330" font-size="12" font-weight="bold" fill="#6b7280">ADR-0012: Монолітна БД PostgreSQL</text>
  <text x="407" y="350" font-size="12" fill="#c0392b">Status: Superseded by ADR-0042</text>
  <text x="407" y="370" font-size="12" fill="#1a1a1a">Контекст 2021 року: простота старту,</text>
  <text x="407" y="390" font-size="12" fill="#6b7280">єдина команда, ліміт бюджету</text>

  <!-- Двонапрямний зв'язок між записами -->
  <line x1="635" y1="360" x2="665" y2="360" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Вкладений блок ADR 0042 -->
  <rect x="675" y="310" width="230" height="98" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="687" y="330" font-size="12" font-weight="bold" fill="#27ae60">ADR-0042: Шардування БД</text>
  <text x="687" y="350" font-size="12" fill="#27ae60">Status: Accepted (Supersedes ADR-0012)</text>
  <text x="687" y="370" font-size="12" fill="#1a1a1a">Контекст 2024 року: зростання до</text>
  <text x="687" y="390" font-size="12" fill="#6b7280">100 млн записів, навантаження x50</text>
</svg>
