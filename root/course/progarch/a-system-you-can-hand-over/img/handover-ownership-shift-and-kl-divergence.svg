<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Динаміка передачі системи: частки володіння та збіжність знань</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Зростання O(D_new), спадання O(D_vendor) та мінімізація дивергенції D_KL(P || Q) за спринтами</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: ЧАСТКА ВОЛОДІННЯ ================= -->
  <rect x="25" y="68" width="445" height="304" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="90" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Частка володіння кодом O(D)</text>
  <text x="247" y="112" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Поріг автономності: O(D_новий) ≥ 80%</text>

  <!-- Сітка графіка ліворуч -->
  <line x1="78" y1="125" x2="430" y2="125" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="78" y1="155" x2="430" y2="155" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="78" y1="200" x2="430" y2="200" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="78" y1="245" x2="430" y2="245" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="78" y1="275" x2="430" y2="275" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="78" y1="125" x2="78" y2="275" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Y-ticks ліворуч -->
  <text x="68" y="129" font-size="12" fill="#6b7280" text-anchor="end">100%</text>
  <text x="68" y="159" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">80%</text>
  <text x="68" y="204" font-size="12" fill="#6b7280" text-anchor="end">50%</text>
  <text x="68" y="249" font-size="12" fill="#6b7280" text-anchor="end">20%</text>
  <text x="68" y="279" font-size="12" fill="#6b7280" text-anchor="end">0%</text>

  <!-- X-ticks ліворуч -->
  <text x="95" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С1</text>
  <text x="161" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С2</text>
  <text x="227" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С3</text>
  <text x="293" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С4</text>
  <text x="359" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С5</text>
  <text x="425" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С6</text>
  <text x="260" y="314" font-size="12" fill="#6b7280" text-anchor="middle">Спринти транзитного періоду (t)</text>

  <!-- Крива Нова команда O(D_new): (95,260) -> (161,238) -> (227,208) -> (293,182) -> (359,161) -> (425,143) -->
  <polyline points="95,260 161,238 227,208 293,182 359,161 425,143" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="95" cy="260" r="3.5" fill="#2457d6"/>
  <circle cx="161" cy="238" r="3.5" fill="#2457d6"/>
  <circle cx="227" cy="208" r="3.5" fill="#2457d6"/>
  <circle cx="293" cy="182" r="3.5" fill="#2457d6"/>
  <circle cx="359" cy="161" r="3.5" fill="#2457d6"/>
  <circle cx="425" cy="143" r="4.5" fill="#2457d6"/>

  <!-- Крива Підрядник O(D_vendor): (95,140) -> (161,162) -> (227,192) -> (293,218) -> (359,239) -> (425,257) -->
  <polyline points="95,140 161,162 227,192 293,218 359,239 425,257" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="95" cy="140" r="3.5" fill="#c0392b"/>
  <circle cx="161" cy="162" r="3.5" fill="#c0392b"/>
  <circle cx="227" cy="192" r="3.5" fill="#c0392b"/>
  <circle cx="293" cy="218" r="3.5" fill="#c0392b"/>
  <circle cx="359" cy="239" r="3.5" fill="#c0392b"/>
  <circle cx="425" cy="257" r="4.5" fill="#c0392b"/>

  <!-- Точка паритету (50%) -->
  <circle cx="250" cy="200" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Легенда лівої панелі -->
  <text x="78" y="336" font-size="12" font-weight="bold" fill="#2457d6">Нова команда: 10% → 88%</text>
  <text x="268" y="336" font-size="12" font-weight="bold" fill="#c0392b">Підрядник: 90% → 12%</text>
  <text x="247" y="354" font-size="12" fill="#6b7280" text-anchor="middle">Паритет володіння (50%): пройдено на Спринті 3.5</text>

  <!-- ================= ПРАВА ПАНЕЛЬ: ДИВЕРГЕНЦІЯ КУЛЬБАКА - ЛЕЙБЛЕРА ================= -->
  <rect x="490" y="68" width="445" height="304" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="90" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дивергенція знань D_KL(P || Q)</text>

  <!-- Фази передачі вгорі -->
  <text x="593" y="112" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Тіньовий нагляд</text>
  <text x="725" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Спільні зміни</text>
  <text x="857" y="112" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Повна автономія</text>

  <!-- Безпечний коридор (D_KL < 0.20): y = 250..275 -->
  <rect x="545" y="250" width="355" height="25" fill="#e9f7ef" stroke="none"/>
  <line x1="545" y1="250" x2="900" y2="250" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Розділювачі фаз -->
  <line x1="659" y1="125" x2="659" y2="275" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="791" y1="125" x2="791" y2="275" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Сітка графіка праворуч -->
  <line x1="545" y1="125" x2="900" y2="125" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="163" x2="900" y2="163" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="200" x2="900" y2="200" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="238" x2="900" y2="238" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="275" x2="900" y2="275" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="545" y1="125" x2="545" y2="275" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Y-ticks праворуч -->
  <text x="535" y="129" font-size="12" fill="#6b7280" text-anchor="end">1.2</text>
  <text x="535" y="167" font-size="12" fill="#6b7280" text-anchor="end">0.9</text>
  <text x="535" y="204" font-size="12" fill="#6b7280" text-anchor="end">0.6</text>
  <text x="535" y="242" font-size="12" fill="#6b7280" text-anchor="end">0.3</text>
  <text x="535" y="279" font-size="12" fill="#6b7280" text-anchor="end">0.0</text>

  <!-- X-ticks праворуч -->
  <text x="560" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С1</text>
  <text x="626" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С2</text>
  <text x="692" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С3</text>
  <text x="758" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С4</text>
  <text x="824" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С5</text>
  <text x="890" y="295" font-size="12" fill="#6b7280" text-anchor="middle">С6</text>
  <text x="725" y="314" font-size="12" fill="#6b7280" text-anchor="middle">Спринти транзитного періоду (t)</text>

  <!-- Крива D_KL: (560,138) -> (626,178) -> (692,215) -> (758,240) -> (824,257) -> (890,267) -->
  <polyline points="560,138 626,178 692,215 758,240 824,257 890,267" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="560" cy="138" r="3.5" fill="#2457d6"/>
  <circle cx="626" cy="178" r="3.5" fill="#2457d6"/>
  <circle cx="692" cy="215" r="3.5" fill="#2457d6"/>
  <circle cx="758" cy="240" r="3.5" fill="#2457d6"/>
  <circle cx="824" cy="257" r="4.5" fill="#27ae60"/>
  <circle cx="890" cy="267" r="4.5" fill="#27ae60"/>

  <!-- Пояснення правої панелі -->
  <text x="712" y="336" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зона безпечної автономії: D_KL &lt; 0.20</text>
  <text x="712" y="354" font-size="12" fill="#6b7280" text-anchor="middle">Знання ядра передано: D_KL впала з 1.10 до 0.06</text>

  <!-- ================= НИЖНІЙ БАР'ЄР ПРИЙМАННЯ ================= -->
  <rect x="25" y="380" width="910" height="62" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="404" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Критерій підписання акта приймання (Handover Acceptance Gate)</text>
  <text x="480" y="426" font-size="12" fill="#2457d6" text-anchor="middle">Умова автономності виконана: O(D_новий) = 88% (&gt; 80%) та D_KL = 0.06 (&lt; 0.20) — ризик зупинки усунено</text>
</svg>
