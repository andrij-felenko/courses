<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- БІЛА ПІДКЛАДКА НА ВСЕ ПОЛОТНО -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Специфікація IETF Health Check JSON та ієрархія статусів</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Агрегація субкомпонентів (pass/warn/fail), HTTP-коди, метрики затримок та заголовки no-store</text>

  <!-- ==================== ПАНЕЛЬ 1: ЗАГОЛОВКИ ТА СТАТУСИ ==================== -->
  <rect x="24" y="74" width="312" height="364" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="180" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">1. Заголовки та статуси IETF</text>
  <text x="180" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Протокол передачі та ієрархія</text>

  <!-- Картка HTTP-заголовків -->
  <rect x="36" y="130" width="288" height="64" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="148" font-size="12" font-weight="700" fill="#1a1a1a">Обов'язкові HTTP-заголовки:</text>
  <text x="48" y="168" font-size="12" fill="#2457d6">Content-Type: application/health+json</text>
  <text x="48" y="184" font-size="12" font-weight="700" fill="#c0392b">Cache-Control: no-store, no-cache</text>

  <!-- Рівень 1: PASS -->
  <rect x="36" y="204" width="288" height="46" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="48" y="222" font-size="12" font-weight="700" fill="#27ae60">PASS  -&gt;  HTTP 200 OK</text>
  <text x="48" y="240" font-size="12" fill="#1a1a1a">Всі субкомпоненти працюють штатно</text>

  <!-- Рівень 2: WARN -->
  <rect x="36" y="258" width="288" height="46" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="48" y="276" font-size="12" font-weight="700" fill="#2457d6">WARN  -&gt;  HTTP 200 OK (деградація)</text>
  <text x="48" y="294" font-size="12" fill="#1a1a1a">Сповільнення або збій некритичних кешів</text>

  <!-- Рівень 3: FAIL -->
  <rect x="36" y="312" width="288" height="46" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="48" y="330" font-size="12" font-weight="700" fill="#c0392b">FAIL  -&gt;  HTTP 503 Service Unavailable</text>
  <text x="48" y="348" font-size="12" fill="#1a1a1a">Відмова критичного сховища / черги</text>

  <!-- Правило агрегації -->
  <rect x="36" y="366" width="288" height="60" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="386" font-size="12" font-weight="700" fill="#1a1a1a">Логіка зведення верхнього статусу:</text>
  <text x="48" y="404" font-size="12" fill="#6b7280">• Якщо хоч 1 компонент fail =&gt; fail (503)</text>
  <text x="48" y="418" font-size="12" fill="#6b7280">• Якщо є warn без fail =&gt; warn (200)</text>

  <!-- ==================== ПАНЕЛЬ 2: IETF JSON СТРУКТУРА ==================== -->
  <rect x="352" y="74" width="312" height="364" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="508" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">2. Структура IETF Health JSON</text>
  <text x="508" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Специфікація полів та метрик субкомпонентів</text>

  <!-- Верхні атрибути -->
  <rect x="364" y="130" width="288" height="50" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="376" y="148" font-size="12" font-weight="700" fill="#1a1a1a">status: "fail" (агрегований стан)</text>
  <text x="376" y="168" font-size="12" fill="#6b7280">version: "1.4" | releaseId: "2026.09-rc2"</text>

  <!-- Блок checks -->
  <rect x="364" y="188" width="288" height="238" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="376" y="206" font-size="12" font-weight="700" fill="#2457d6">checks: { ...деталізація вузлів... }</text>

  <!-- Перевірка 1: database:postgres -->
  <rect x="376" y="214" width="264" height="60" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="386" y="232" font-size="12" font-weight="700" fill="#27ae60">database:postgres</text>
  <text x="630" y="232" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">status: pass</text>
  <text x="386" y="250" font-size="12" fill="#1a1a1a">observedValue: 14 | observedUnit: "ms"</text>
  <text x="386" y="266" font-size="12" fill="#6b7280">компонент повністю готовий</text>

  <!-- Перевірка 2: cache:redis -->
  <rect x="376" y="282" width="264" height="64" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="386" y="300" font-size="12" font-weight="700" fill="#2457d6">cache:redis</text>
  <text x="630" y="300" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">status: warn</text>
  <text x="386" y="318" font-size="12" fill="#1a1a1a">observedValue: 620 | observedUnit: "ms"</text>
  <text x="386" y="336" font-size="12" fill="#6b7280">висока затримка (поріг &gt; 500 ms)</text>

  <!-- Перевірка 3: storage:s3 -->
  <rect x="376" y="354" width="264" height="64" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="386" y="372" font-size="12" font-weight="700" fill="#c0392b">storage:s3</text>
  <text x="630" y="372" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">status: fail</text>
  <text x="386" y="390" font-size="12" fill="#c0392b">output: "Connection timeout"</text>
  <text x="386" y="408" font-size="12" fill="#6b7280">санітизований текст без стек-трейсу</text>

  <!-- ==================== ПАНЕЛЬ 3: ОРКЕСТРАЦІЯ ТА ЗАХИСТ ==================== -->
  <rect x="680" y="74" width="256" height="364" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="808" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">3. Оркестрація та захист</text>
  <text x="808" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Розподіл probe-контрактів у k8s</text>

  <!-- Картка 1: Розподіл зондів -->
  <rect x="692" y="130" width="232" height="112" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="704" y="148" font-size="12" font-weight="700" fill="#1a1a1a">Розподіл зондів у кластері:</text>
  <text x="704" y="168" font-size="12" fill="#2457d6">• Startup: прогрів, міграції</text>
  <text x="704" y="190" font-size="12" fill="#1a1a1a">• Liveness: цикл самого процесу</text>
  <text x="704" y="208" font-size="12" fill="#6b7280">  (рестарт при дедлоку потоків)</text>
  <text x="704" y="230" font-size="12" fill="#27ae60">• Readiness: зняття з балансувальника</text>

  <!-- Картка 2: Антипатерни -->
  <rect x="692" y="250" width="232" height="92" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="704" y="268" font-size="12" font-weight="700" fill="#c0392b">Митні інженерні заборони:</text>
  <text x="704" y="288" font-size="12" fill="#1a1a1a">• Заборона перевірки БД у liveness</text>
  <text x="704" y="306" font-size="12" fill="#6b7280">  (захист від каскадного рестарту)</text>
  <text x="704" y="328" font-size="12" fill="#c0392b">• 0 секретів і стек-трейсів в output</text>

  <!-- Картка 3: Критерій відчуження -->
  <rect x="692" y="350" width="232" height="76" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="808" y="370" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Критерій відчуження:</text>
  <text x="808" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Таймаут проби ≤ 1.5 с</text>
  <text x="808" y="410" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ Готовність до оркестрації</text>
</svg>
