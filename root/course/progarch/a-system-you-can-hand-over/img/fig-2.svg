<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- БІЛА ПІДКЛАДКА НА ВСЕ ПОЛОТНО -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="26" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ізольований стенд чистої збірки: Cleanroom Bootstrap Harness</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Виявлення прихованих залежностей через детерміноване розгортання в герметичному ефемерному контурі</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ЗАСМІЧЕНЕ ОТОЧЕННЯ (АНТИПАТЕРН) ==================== -->
  <rect x="24" y="66" width="444" height="366" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  
  <!-- Заголовок лівої панелі -->
  <rect x="36" y="78" width="420" height="32" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="48" y="99" font-size="13" font-weight="700" fill="#c0392b">Засмічене оточення розробника («Працює на моїй машині»)</text>

  <!-- Блок 1: Неявні глобальні пакети -->
  <rect x="36" y="124" width="420" height="62" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="142" font-size="12" font-weight="700" fill="#c0392b">1. Приховані глобальні пакети та SDK</text>
  <text x="48" y="158" font-size="12" fill="#1a1a1a">• Залежність від незафіксованих системних бібліотек хоста</text>
  <text x="48" y="174" font-size="12" fill="#6b7280">• Шляхи до утиліт зашиті жорстко (/usr/local/bin, ~/.local)</text>

  <!-- Блок 2: Залишкові кеші та відсутність Lock-файлів -->
  <rect x="36" y="200" width="420" height="62" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="218" font-size="12" font-weight="700" fill="#c0392b">2. Прогріті кеші та відсутність Lock-файлів</text>
  <text x="48" y="234" font-size="12" fill="#1a1a1a">• Збірка проходить лише завдяки кешам (node_modules, .m2)</text>
  <text x="48" y="250" font-size="12" fill="#6b7280">• Видалені або застарілі upstream-пакети приховані в кеші</text>

  <!-- Блок 3: Закритий периметр та неявні конфіги -->
  <rect x="36" y="276" width="420" height="62" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="294" font-size="12" font-weight="700" fill="#c0392b">3. Закриті ресурси підрядника та «ручні» дані</text>
  <text x="48" y="310" font-size="12" fill="#1a1a1a">• Неоголошений доступ до внутрішніх VPN, DNS та registry</text>
  <text x="48" y="326" font-size="12" fill="#6b7280">• БД заповнена вручну, міграції з нуля не запускалися</text>

  <!-- Підсумок лівої панелі -->
  <rect x="36" y="352" width="420" height="66" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="48" y="372" font-size="12" font-weight="700" fill="#c0392b">НАСЛІДОК ДЛЯ ПЕРЕДАЧІ СИСТЕМИ:</text>
  <text x="48" y="390" font-size="12" fill="#1a1a1a">Код неможливо відтворити поза машиною автора.</text>
  <text x="48" y="406" font-size="12" fill="#c0392b">Повна залежність замовника від підрядника (Vendor Lock-in).</text>


  <!-- ==================== ПРАВА ПАНЕЛЬ: ГЕРМЕТИЧНИЙ СТЕНД (СТАНДАРТ) ==================== -->
  <rect x="492" y="66" width="444" height="366" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>

  <!-- Заголовок правої панелі -->
  <rect x="504" y="78" width="420" height="32" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="516" y="99" font-size="13" font-weight="700" fill="#27ae60">Герметичний стенд замовника (Cleanroom Harness)</text>

  <!-- Блок 1: Ефемерний чистий раннер -->
  <rect x="504" y="124" width="420" height="62" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="516" y="142" font-size="12" font-weight="700" fill="#27ae60">1. Ефемерний чистий раннер (Clean Slate VM)</text>
  <text x="516" y="158" font-size="12" fill="#1a1a1a">• Одноразовий контейнер без збереження стану хоста</text>
  <text x="516" y="174" font-size="12" fill="#6b7280">• Усі кеші пакетів монтуються порожніми (No cache reuse)</text>

  <!-- Блок 2: Мережева ізоляція -->
  <rect x="504" y="200" width="420" height="62" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="516" y="218" font-size="12" font-weight="700" fill="#27ae60">2. Ізольований мережевий контур (Air-gap / Proxy)</text>
  <text x="516" y="234" font-size="12" fill="#1a1a1a">• Заборона доступу до корпоративних серверів підрядника</text>
  <text x="516" y="250" font-size="12" fill="#6b7280">• Завантаження лише верифікованих публічних залежностей</text>

  <!-- Блок 3: Автоматичний bootstrap-конвеєр -->
  <rect x="504" y="276" width="420" height="62" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="516" y="294" font-size="12" font-weight="700" fill="#27ae60">3. Автоматизований Bootstrap-пайплайн</text>
  <text x="516" y="310" font-size="12" fill="#1a1a1a">• Детермінована збірка + підняття сервісів (compose up)</text>
  <text x="516" y="326" font-size="12" fill="#6b7280">• Міграції БД з нуля + seed-дані + відкат + smoke-тести</text>

  <!-- Підсумок правої панелі -->
  <rect x="504" y="352" width="420" height="66" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="516" y="372" font-size="12" font-weight="700" fill="#27ae60">ГАРАНТІЯ ВІДЧУЖУВАНОСТІ СИСТЕМИ:</text>
  <text x="516" y="390" font-size="12" fill="#1a1a1a">Повна повторюваність розгортання будь-якою командою.</text>
  <text x="516" y="406" font-size="12" fill="#27ae60">Об'єктивний критерій підписання акта передачі продукту.</text>


  <!-- ==================== НИЖНІЙ БАНЕР: КРИТЕРІЙ ВАЛІДАЦІЇ ==================== -->
  <rect x="24" y="448" width="912" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="469" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">ІНВАРІАНТ ПРИЙМАННЯ: ЖОДЕН АКТ НЕ ПІДПИСУЄТЬСЯ БЕЗ ПРОХОДЖЕННЯ CLEAN-SLATE ХАРНЕСА</text>
  <text x="480" y="489" font-size="12" fill="#1a1a1a" text-anchor="middle">Якщо репозиторій не розгортається на чистій ізольованій машині однією командою — система не відчужена</text>

</svg>
