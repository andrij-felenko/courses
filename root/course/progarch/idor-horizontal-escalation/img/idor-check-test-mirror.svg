<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Латка й вартовий: чек і тест — дзеркальна пара</text>
<text x="345.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">пропуск: щасливий шлях зелений</text>
<text x="765.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">повно: негатив на місці</text>
<text x="58.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">ЧЕК</text>
<rect x="185.0" y="107.0" width="320.0" height="156.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="345.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="345.0" dy="0.0">обробник без belongsTo</tspan><tspan x="345.0" dy="18.2">власний → 200 ✓</tspan><tspan x="345.0" dy="18.2">сусід → 200  ВИТІК</tspan></text>
<rect x="605.0" y="107.0" width="320.0" height="156.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.2"/><text x="765.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">+ belongsTo(session.userId)</tspan><tspan x="765.0" dy="18.2">власний → 200</tspan><tspan x="765.0" dy="18.2">сусід → 404</tspan></text>
<text x="58.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">ТЕСТ</text>
<rect x="185.0" y="307.0" width="320.0" height="156.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="345.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="345.0" dy="0.0">лише «власний → 200»</tspan><tspan x="345.0" dy="18.2">зелено — а діру</tspan><tspan x="345.0" dy="18.2">НЕ ловить</tspan></text>
<rect x="605.0" y="307.0" width="320.0" height="156.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.2"/><text x="765.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">+ «чужий існує → 404»</tspan><tspan x="765.0" dy="18.2">+ перебір → 404</tspan><tspan x="765.0" dy="18.2">вартовий ловить регрес</tspan></text>
<text x="520.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">пропущений тест має ту саму форму, що пропущений чек — обидва зелені на щасливому шляху</text>
</svg>