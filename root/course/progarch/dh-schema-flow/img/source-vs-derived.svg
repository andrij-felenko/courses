<rect x="253.8" y="318.4" width="512.5" height="63.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Кеш (модуль 13) вводив ДРУГЕ джерело правди, що тихо дрейфує.</tspan><tspan x="510.0" dy="15.6">Тут похідне теж може розійтися з сирим — але сире незмінне, тож будь-яку</tspan><tspan x="510.0" dy="15.6">розбіжність лікуємо, відкинувши й перебудувавши похідне з нуля.</tspan></text>
