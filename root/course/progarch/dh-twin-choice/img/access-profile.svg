<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому композиція: гарячий набір малий, холодний хвіст величезний</text>
<rect x="60.0" y="66.0" width="1000.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="93.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">профіль доступу: читань «покажи мій дім» — десятки тисяч/с ≫ записів; ключ усюди — home_id (природний шард)</tspan></text>
<rect x="90.0" y="190.0" width="200.0" height="74.0" rx="0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="190.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">на зв'язку зараз</tspan><tspan x="190.0" dy="15.6">десятки тисяч</tspan></text>
<rect x="290.0" y="190.0" width="740.0" height="74.0" rx="0" fill="#eef0f3" stroke="#6b7280" stroke-width="2.0"/>
<text x="660.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">офлайн / сплять</tspan><tspan x="660.0" dy="15.6">сотні тисяч — довгий холодний хвіст</tspan></text>
<text x="560.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">усі доми платформи</text>
<line x1="190.0" y1="270.0" x2="190.0" y2="308.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="314.0" width="300.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="343.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">→ АКТОР-ШАР</tspan><tspan x="190.0" dy="16.2">жива сесія, real-time, read-your-writes</tspan></text>
<line x1="660.0" y1="270.0" x2="660.0" y2="308.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="485.0" y="314.0" width="350.0" height="66.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">→ ШАРДОВАНА БД</tspan><tspan x="660.0" dy="13.7">дешеве читання по ключу home_id, без гарячої машинерії</tspan></text>
<text x="560.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">А «що коли ставалось» (замки, доступ) не лягає ні туди, ні туди — це вузька скибка в журнал аудиту.</text>
</svg>