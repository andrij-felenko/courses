<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння ACID в моноліті проти Saga у мікросервісах</text>
<rect x="230.2" y="23.0" width="679.7" height="34.0" rx="6" fill="#eef2fb" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="44.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Анатомія обробки відмови: Моноліт (ACID) проти Мікросервісів (Saga + Outbox)</tspan></text>
<rect x="40.0" y="80.0" width="510.0" height="410.0" rx="6" fill="#fcfdfe" stroke="#27ae60" stroke-width="1.8"/>
<rect x="40.0" y="80.0" width="510.0" height="40.0" rx="4" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="295.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Модульний моноліт: Атомарна ACID-транзакція</text>
<rect x="70.0" y="145.5" width="450.0" height="31.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="295.0" y="164.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">1. Запит: Оформлення замовлення</tspan></text>
<rect x="70.0" y="189.5" width="450.0" height="31.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="295.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">2. BEGIN TRANSACTION (1 БД)</tspan></text>
<rect x="70.0" y="233.5" width="450.0" height="31.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="295.0" y="252.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">3. UPDATE Accounts SET balance = balance - 100</tspan></text>
<rect x="70.0" y="277.5" width="450.0" height="31.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="295.0" y="296.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">4. INSERT INTO Orders (status = 'created')</tspan></text>
<rect x="70.0" y="321.5" width="450.0" height="31.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="295.0" y="340.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">5. UPDATE Inventory SET qty = qty - 1</tspan></text>
<rect x="70.0" y="365.5" width="450.0" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="384.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">6. Якщо збій на кроці 5 -&gt; ROLLBACK</tspan></text>
<rect x="70.0" y="409.5" width="450.0" height="31.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="295.0" y="428.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">7. Атомарний COMMIT (стан консистентний за &lt;5 мс)</tspan></text>
<rect x="590.0" y="80.0" width="510.0" height="410.0" rx="6" fill="#fcfdfe" stroke="#2457d6" stroke-width="1.8"/>
<rect x="590.0" y="80.0" width="510.0" height="40.0" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="845.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Мікросервіси: Saga + Transactional Outbox</text>
<rect x="610.0" y="145.5" width="470.0" height="31.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="845.0" y="164.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">1. Service A: Charge Account -&gt; Write DB + Write Outbox Table</tspan></text>
<rect x="610.0" y="189.5" width="470.0" height="31.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="845.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">2. CDC / Relay (Debezium): Poll Outbox -&gt; Publish to Kafka</tspan></text>
<rect x="610.0" y="233.5" width="470.0" height="31.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="845.0" y="252.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">3. Service B consumes event -&gt; Reserve Inventory</tspan></text>
<rect x="610.0" y="277.5" width="470.0" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="296.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">4. Збій у Service B (немає товару)</tspan></text>
<rect x="610.0" y="321.5" width="470.0" height="31.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="845.0" y="340.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">5. Service B publishes 'InventoryFailedEvent' to Kafka</tspan></text>
<rect x="610.0" y="365.5" width="470.0" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="384.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">6. Service A consumes failure event -&gt; Runs Compensating Tx</tspan></text>
<rect x="610.0" y="409.5" width="470.0" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="428.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">7. Service A: Refund Account (Eventual consistency, ~500-2000 мс)</tspan></text>
</svg>