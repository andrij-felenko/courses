<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр складності програмних рішень</text>
<rect x="40.0" y="60.0" width="290.0" height="220.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="185.0" y="119.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle"><tspan x="185.0" dy="0.0">ПРИМІТИВНА НЕЗРІЛІСТЬ</tspan><tspan x="185.0" dy="15.6"></tspan><tspan x="185.0" dy="15.6">• Хаотичний спагетті-код</tspan><tspan x="185.0" dy="15.6">• Відсутність меж і контрактів</tspan><tspan x="185.0" dy="15.6">• Неконтрольовані побічні ефекти</tspan><tspan x="185.0" dy="15.6">• Змішування бізнес-логіки з I/O</tspan><tspan x="185.0" dy="15.6"></tspan><tspan x="185.0" dy="15.6">Ризик: Аварії при зростанні</tspan></text>
<rect x="365.0" y="40.0" width="290.0" height="260.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="510.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">ЗОНА ІНЖЕНЕРНОГО СМАКУ</tspan><tspan x="510.0" dy="14.3">(Елегантна простота)</tspan><tspan x="510.0" dy="14.3"></tspan><tspan x="510.0" dy="14.3">• Чіткі межі та ізольовані контексти</tspan><tspan x="510.0" dy="14.3">• Мінімально необхідна абстракція</tspan><tspan x="510.0" dy="14.3">• Прозора простежуваність викликів</tspan><tspan x="510.0" dy="14.3">• Низьке зчеплення, висока зв'язність</tspan><tspan x="510.0" dy="14.3">• YAGNI за замовчуванням</tspan><tspan x="510.0" dy="14.3"></tspan><tspan x="510.0" dy="14.3">Перевага: Керована еволюція</tspan></text>
<rect x="690.0" y="60.0" width="290.0" height="220.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="835.0" y="111.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle"><tspan x="835.0" dy="0.0">НАДПРОЄКТУВАННЯ</tspan><tspan x="835.0" dy="15.6">(Over-engineering Trap)</tspan><tspan x="835.0" dy="15.6"></tspan><tspan x="835.0" dy="15.6">• 7 шарів не потрібної індирекції</tspan><tspan x="835.0" dy="15.6">• CQRS / Event Sourcing без потреби</tspan><tspan x="835.0" dy="15.6">• Саморобні фреймворки й DSL</tspan><tspan x="835.0" dy="15.6">• 15 DTO для передачі одного поля</tspan><tspan x="835.0" dy="15.6"></tspan><tspan x="835.0" dy="15.6">Ризик: Когнітивний колапс</tspan></text>
<line x1="330.0" y1="170.0" x2="365.0" y2="170.0" stroke="#2e7d32" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="655.0" y1="170.0" x2="690.0" y2="170.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="315.0" width="940.0" height="45.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="510.0" y="341.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Золота середина: Архітектурний смак утримує систему в зеленій зоні, запобігаючи хаосу та надлишку</tspan></text>
</svg>