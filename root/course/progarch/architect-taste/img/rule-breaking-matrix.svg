<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця контрольованого порушення архітектурних правил</text>
<rect x="40.0" y="30.0" width="460.0" height="45.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="270.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">СЛІПИЙ ДОГМАТИЗМ (Правило ради правила)</tspan></text>
<rect x="520.0" y="30.0" width="460.0" height="45.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="750.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">КОНТРОЛЬОВАНЕ ПОРУШЕННЯ (Смак і прагматизм)</tspan></text>
<rect x="40.0" y="95.0" width="460.0" height="90.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="270.0" y="131.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Сліпий DRY:</tspan><tspan x="270.0" dy="11.7">Штучне об'єднання двох різних контекстів у єдиний клас ради усунення 5 одинакових рядків.</tspan><tspan x="270.0" dy="11.7">Наслідок: Паразитне зчеплення (Coupling)</tspan></text>
<rect x="520.0" y="95.0" width="460.0" height="90.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="750.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle"><tspan x="750.0" dy="0.0">Дублювання замість невірної абстракції:</tspan><tspan x="750.0" dy="15.6">Свідоме дублювання структури в двох сервісах.</tspan><tspan x="750.0" dy="15.6">Наслідок: Повна автономія еволюції контекстів</tspan></text>
<rect x="40.0" y="205.0" width="460.0" height="90.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="270.0" y="241.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Сліпа шаруватість:</tspan><tspan x="270.0" dy="11.7">Прогонка транзакцій аналітики через Controller -&gt; Service -&gt; Domain -&gt; DAO -&gt; DTO.</tspan><tspan x="270.0" dy="11.7">Наслідок: Затримка й когнітивний оверхед</tspan></text>
<rect x="520.0" y="205.0" width="460.0" height="90.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="750.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle"><tspan x="750.0" dy="0.0">Свідомий прокол шару (Direct Read):</tspan><tspan x="750.0" dy="15.6">Прямий read-only SQL запит з контролера аналітики.</tspan><tspan x="750.0" dy="15.6">Наслідок: p99 латентність &lt; 5 мс, код у 20 рядків</tspan></text>
<rect x="40.0" y="315.0" width="460.0" height="90.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="270.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Сліпі мікросервіси:</tspan><tspan x="270.0" dy="15.6">Виділення 12 сервісів для команди з 3 розробників.</tspan><tspan x="270.0" dy="15.6">Наслідок: Розподілений моноліт, мережеві каскади</tspan></text>
<rect x="520.0" y="315.0" width="460.0" height="90.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="750.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle"><tspan x="750.0" dy="0.0">Модульний моноліт на старті:</tspan><tspan x="750.0" dy="15.6">Один процес з чіткими межами модулів у git.</tspan><tspan x="750.0" dy="15.6">Наслідок: Миттєвий деплой, проста реорганізація</tspan></text>
</svg>