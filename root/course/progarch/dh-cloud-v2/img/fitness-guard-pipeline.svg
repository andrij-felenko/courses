<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контур автоматизованого fitness-контролю ерозії архітектури</text>
<rect x="40.0" y="60.0" width="230.0" height="100.0" rx="6" fill="#eef2f6" stroke="#1e293b" stroke-width="1.5"/><text x="155.0" y="90.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">1. Git Commit / PR</tspan><tspan x="155.0" dy="15.6"></tspan><tspan x="155.0" dy="15.6">Новий код мікросервісу v2</tspan><tspan x="155.0" dy="15.6">або зміна схеми події</tspan></text>
<line x1="270.0" y1="110.0" x2="320.0" y2="110.0" stroke="#1e293b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="40.0" width="380.0" height="360.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="340.0" y="50.0" width="340.0" height="35.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="510.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">2. CI/CD Fitness Guard Pipeline</tspan></text>
<rect x="340.0" y="100.0" width="340.0" height="70.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="510.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle"><tspan x="510.0" dy="0.0">Перевірка залежностей коду (AST / ArchUnit)</tspan><tspan x="510.0" dy="14.3">Заборона прямих викликів v1 DB з v2 сервісів</tspan><tspan x="510.0" dy="14.3">Заборона обходу DeviceTwinRepository</tspan></text>
<rect x="340.0" y="185.0" width="340.0" height="70.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="510.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle"><tspan x="510.0" dy="0.0">Валідація схем подій Kafka Outbox</tspan><tspan x="510.0" dy="14.3">Перевірка монотонності versionSeq</tspan><tspan x="510.0" dy="14.3">Перевірка обов'язкових метрик SLO</tspan></text>
<rect x="340.0" y="270.0" width="340.0" height="60.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="510.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Автоматичний результат:</tspan><tspan x="510.0" dy="14.3">PASS -&gt; Merge / FAIL -&gt; Блокування PR</tspan></text>
<line x1="700.0" y1="300.0" x2="760.0" y2="300.0" stroke="#2e7d32" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="60.0" width="240.0" height="320.0" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
<rect x="775.0" y="75.0" width="210.0" height="45.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="880.0" y="93.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">3. Runtime Drift Control</tspan><tspan x="880.0" dy="15.6">(Prometheus / Grafana)</tspan></text>
<rect x="775.0" y="135.0" width="210.0" height="225.0" rx="6" fill="#ffffff" stroke="#fde047" stroke-width="1.5"/><text x="880.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle"><tspan x="880.0" dy="0.0">Метрики в реальному часі:</tspan><tspan x="880.0" dy="14.3"></tspan><tspan x="880.0" dy="14.3">• twin_mismatch_total</tspan><tspan x="880.0" dy="14.3">  (розбіжність v1 vs v2)</tspan><tspan x="880.0" dy="14.3"></tspan><tspan x="880.0" dy="14.3">• outbox_lag_seconds</tspan><tspan x="880.0" dy="14.3">  (затримка інвалідації)</tspan><tspan x="880.0" dy="14.3"></tspan><tspan x="880.0" dy="14.3">• fitness_violations_total</tspan><tspan x="880.0" dy="14.3">  (зафіксований дрейф)</tspan><tspan x="880.0" dy="14.3"></tspan><tspan x="880.0" dy="14.3">Авто-алерт при виході</tspan><tspan x="880.0" dy="14.3">за межі SLO!</tspan></text>
</svg>