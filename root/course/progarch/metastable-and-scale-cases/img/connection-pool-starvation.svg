<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскадне виснаження пулів з'єднань і голодування потоків</text>
<rect x="40.0" y="60.0" width="180.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Вхідні HTTP Клієнти</tspan><tspan x="130.0" dy="14.3">(10 000 r/s)</tspan><tspan x="130.0" dy="14.3">503 Service Unavailable</tspan></text>
<rect x="300.0" y="60.0" width="220.0" height="80.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="410.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">API Gateway Workers</tspan><tspan x="410.0" dy="15.6">Thread Pool (200 threads)</tspan><tspan x="410.0" dy="15.6">СТАН: Blocked / Waiting</tspan></text>
<rect x="600.0" y="60.0" width="180.0" height="80.0" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="690.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">DB Connection Pool</tspan><tspan x="690.0" dy="15.6">(Max 50 connections)</tspan><tspan x="690.0" dy="15.6">100% EXHAUSTED</tspan></text>
<rect x="840.0" y="60.0" width="120.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="900.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">Slow DB / Lock</tspan><tspan x="900.0" dy="14.3">RTT: 5s</tspan></text>
<line x1="220.0" y1="100.0" x2="300.0" y2="100.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="260.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Запити</text>
<line x1="520.0" y1="100.0" x2="600.0" y2="100.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="560.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle">Acquire</text>
<line x1="780.0" y1="100.0" x2="840.0" y2="100.0" stroke="#8b5cf6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="810.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8b5cf6" text-anchor="middle">Query</text>
<rect x="40.0" y="220.0" width="920.0" height="160.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="265.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Механізм каскадного блокування за Законом Літтла (N = λ · W):</tspan><tspan x="500.0" dy="15.6">1. Затримка бази даних зростає з 10 ms до 500 ms (у 50 разів).</tspan><tspan x="500.0" dy="15.6">2. Усі 50 з'єднань у пулі виявляються зайнятими тривалими запитами.</tspan><tspan x="500.0" dy="15.6">3. Воркери API чекають на вільне з'єднання з пулу і блокують свої потоки.</tspan><tspan x="500.0" dy="15.6">4. Пул потоків API (200 threads) повністю виснажується за декілька секунд.</tspan><tspan x="500.0" dy="15.6">5. API Gateway припиняє приймати нові HTTP-з'єднання й відкидає трафік.</tspan></text>
</svg>