<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскадна спіраль повторних запитів та марна робота</text>
<rect x="40.0" y="50.0" width="180.0" height="70.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="130.0" y="73.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Клієнти / App</tspan><tspan x="130.0" dy="15.6">T_timeout = 2.0s</tspan><tspan x="130.0" dy="15.6">Retry count = 3</tspan></text>
<rect x="300.0" y="50.0" width="200.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="73.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">API Gateway / LB</tspan><tspan x="400.0" dy="15.6">Routing &amp; Retries</tspan><tspan x="400.0" dy="15.6">Active Connection Pool</tspan></text>
<rect x="580.0" y="50.0" width="360.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="73.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">Backend Сервіс (Обробник)</tspan><tspan x="760.0" dy="15.6">Обробка запиту = 2.5s (Деградація)</tspan><tspan x="760.0" dy="15.6">Queue Capacity = EXHAUSTED</tspan></text>
<line x1="220.0" y1="85.0" x2="300.0" y2="85.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="260.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Запит #1 (t=0s)</text>
<line x1="500.0" y1="85.0" x2="580.0" y2="85.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Обробка</text>
<rect x="40.0" y="200.0" width="900.0" height="180.0" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="490.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Хронологія марної роботи (Wasted Work):</tspan><tspan x="490.0" dy="15.6">1. t=0.0s — Клієнт надсилає Запит #1. Сервіс починає важке обчислення.</tspan><tspan x="490.0" dy="15.6">2. t=2.0s — У клієнта спрацьовує таймаут T_timeout. Клієнт анулює чекання і генерує Повтор #2.</tspan><tspan x="490.0" dy="15.6">3. t=2.5s — Сервіс завершує Запит #1 і надсилає відповідь, але клієнт її вже відкинув! (Марний CPU/RAM).</tspan><tspan x="490.0" dy="15.6">4. t=4.0s — Повтор #2 падає за таймаутом. Клієнт генерує Повтор #3. Навантаження на сервіс зростає втричі.</tspan></text>
</svg>