<text x="530.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Метастабільна відмова (W &gt;&gt; 1)</text>
<line x1="480.0" y1="140.0" x2="480.0" y2="324.0" stroke="#8b5cf6" stroke-width="2.0" stroke-dasharray="4 4"/>
