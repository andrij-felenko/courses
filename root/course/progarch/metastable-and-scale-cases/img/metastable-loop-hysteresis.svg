<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Петля метастабільної відмови та гістерезис продуктивності</text>
<rect x="50.0" y="40.0" width="230.0" height="70.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="165.0" y="63.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Зовнішній тригер / сплеск</tspan><tspan x="165.0" dy="15.6">(Cold Cache / DB Outage)</tspan><tspan x="165.0" dy="15.6">Load L &gt; Capacity C</tspan></text>
<rect x="50.0" y="160.0" width="230.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="183.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Зростання затримок</tspan><tspan x="165.0" dy="15.6">(Latency Spike &amp; Queues)</tspan><tspan x="165.0" dy="15.6">T_response &gt; T_timeout</tspan></text>
<rect x="50.0" y="280.0" width="230.0" height="70.0" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="165.0" y="303.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Шторм повторів (Retries)</tspan><tspan x="165.0" dy="15.6">W(L) = 1 + r · P_retry(L)</tspan><tspan x="165.0" dy="15.6">Підсилення роботи W &gt; 1</tspan></text>
