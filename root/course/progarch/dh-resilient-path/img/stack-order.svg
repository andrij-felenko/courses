<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стійкий шлях одного виклику, ззовні всередину</text>
<rect x="70.0" y="90.0" width="700.0" height="400.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.9"/>
<text x="86.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Перебірка — узяти слот з пулу телеметрії (≤ 10)</text>
<rect x="120.0" y="145.0" width="600.0" height="290.0" rx="6" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.9"/>
<text x="136.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Запобіжник — відкритий? одразу фолбек, без виклику</text>
<rect x="170.0" y="200.0" width="500.0" height="180.0" rx="6" fill="#fbfcfe" stroke="#1a1a1a" stroke-width="1.9"/>
<text x="186.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Таймаут — стеля на цю спробу</text>
<rect x="220.0" y="255.0" width="400.0" height="90.0" rx="6" fill="#e6eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="420.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Виклик  telemetry.lastReadings()</tspan><tspan x="420.0" dy="16.2">повтор — усередині; його відмови лічить запобіжник</tspan></text>
<rect x="830.0" y="145.0" width="200.0" height="245.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="930.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">ФОЛБЕК</tspan><tspan x="930.0" dy="18.2">пристрій</tspan><tspan x="930.0" dy="18.2">без останнього</tspan><tspan x="930.0" dy="18.2">виміру</tspan></text>
<line x1="724.0" y1="300.0" x2="824.0" y2="260.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="785.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">відмова /</text>
<text x="785.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">таймаут →</text>
<line x1="670.0" y1="200.0" x2="824.0" y2="190.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="775.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">відкритий →</text>
<text x="550.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Обгортки стоять у певному порядку: слот → перевірка запобіжника → стеля часу → виклик; будь-який шар може зійти на фолбек.</text>
</svg>