<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільний клієнт: стос на кожну залежність, фолбек — у каллера</text>
<rect x="50.0" y="105.6" width="320.0" height="48.8" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="210.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">головний екран</tspan><tspan x="210.0" dy="16.2">читання останнього виміру</tspan></text>
<rect x="50.0" y="275.6" width="320.0" height="48.8" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="210.0" y="296.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">головний екран</tspan><tspan x="210.0" dy="16.2">список пристроїв</tspan></text>
<rect x="50.0" y="405.6" width="320.0" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="210.0" y="426.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">команда «зачинити»</tspan><tspan x="210.0" dy="16.2">критичний шлях</tspan></text>
<rect x="455.0" y="90.6" width="330.0" height="78.8" rx="6" fill="#e6eefb" stroke="#2457d6" stroke-width="1.8"/><text x="620.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">ServiceClient «telemetry»</tspan><tspan x="620.0" dy="15.6">resolve → реєстр</tspan><tspan x="620.0" dy="15.6">пул 10 · fail-fast</tspan><tspan x="620.0" dy="15.6">запобіжник 5 / 2с · таймаут 3с</tspan></text>
<rect x="455.0" y="325.6" width="330.0" height="78.8" rx="6" fill="#e6eefb" stroke="#2457d6" stroke-width="1.8"/><text x="620.0" y="345.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">ServiceClient «core»</tspan><tspan x="620.0" dy="15.6">resolve → реєстр</tspan><tspan x="620.0" dy="15.6">пул 40 · черга 40</tspan><tspan x="620.0" dy="15.6">запобіжник 10 / 1с · таймаут 1с</tspan></text>
<rect x="930.0" y="105.6" width="250.0" height="48.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/><text x="1055.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1055.0" dy="0.0">фолбек каллера:</tspan><tspan x="1055.0" dy="16.2">«—» без виміру</tspan></text>
<rect x="930.0" y="283.8" width="250.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="1055.0" y="304.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1055.0" dy="0.0">список пристроїв</tspan></text>
<rect x="930.0" y="406.2" width="250.0" height="47.6" rx="6" fill="#fff4e0" stroke="#c77800" stroke-width="1.9"/><text x="1055.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c77800" text-anchor="middle" font-weight="700"><tspan x="1055.0" dy="0.0">БЕЗ фолбека:</tspan><tspan x="1055.0" dy="15.6">чесна відмова «спробуйте ще»</tspan></text>
<line x1="376.0" y1="130.0" x2="449.0" y2="130.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="376.0" y1="300.0" x2="449.0" y2="350.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="376.0" y1="430.0" x2="449.0" y2="385.0" stroke="#c0392b" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="791.0" y1="130.0" x2="924.0" y2="130.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="791.0" y1="350.0" x2="924.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="791.0" y1="385.0" x2="924.0" y2="430.0" stroke="#c77800" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="610.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Той самий клієнт на кожен шов; окремий пул на залежність — окремий радіус ураження. Фолбек не в клієнті, а в каллера: читання деградує до «—», команда не бреше.</text>
</svg>