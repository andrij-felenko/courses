<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняльний бенчмарк: Канонічна шаровість проти Read Bypass (CQRS)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Усунення транзитних шарів при читанні знижує алокації пам'яті у 4 рази та стабілізує хвіст затримки p99</text>

  <!-- LEFT PANEL: Allocation Churn (B/op) -->
  <rect x="40" y="90" width="420" height="390" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="55" y="118" font-size="14" font-weight="bold" fill="#1a1a1a">1. Алокації пам'яті у купі (Gen 0 Churn)</text>
  <text x="55" y="138" font-size="12" fill="#6b7280">Обсяг короткоживучої пам'яті на один запит</text>

  <!-- Left Chart Box -->
  <rect x="55" y="152" width="390" height="315" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Bar 1: Canonical 4-Layer Mapping -->
  <text x="70" y="178" font-size="12" font-weight="bold" fill="#c0392b">Канонічна шаровість (4-Layer Mapping)</text>
  <text x="70" y="196" font-size="11" fill="#6b7280">DTO → Command → Domain → Entity → WebDTO</text>
  <rect x="70" y="206" width="320" height="32" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="85" y="227" font-size="13" font-weight="bold" fill="#c0392b">800 байт / запит</text>
  <text x="380" y="227" text-anchor="end" font-size="11" fill="#c0392b">(4 копії об'єктів)</text>

  <!-- Bar 2: AutoMapper / Reflection -->
  <text x="70" y="260" font-size="12" font-weight="bold" fill="#c0392b">Динамічний мапінг (AutoMapper / Reflection)</text>
  <text x="70" y="278" font-size="11" fill="#6b7280">Накладні витрати рефлексії та боксингу</text>
  <rect x="70" y="288" width="350" height="32" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="85" y="309" font-size="13" font-weight="bold" fill="#c0392b">1 120 байт / запит</text>
  <text x="410" y="309" text-anchor="end" font-size="11" fill="#c0392b">(найгірший результат)</text>

  <!-- Bar 3: CQRS Read Bypass -->
  <text x="70" y="342" font-size="12" font-weight="bold" fill="#27ae60">Пряма проєкція / CQRS (Read Bypass)</text>
  <text x="70" y="360" font-size="11" fill="#6b7280">Прямий SELECT u.id, u.name INTO DTO</text>
  <rect x="70" y="370" width="80" height="32" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="78" y="391" font-size="12" font-weight="bold" fill="#27ae60">200 B</text>
  <text x="160" y="391" font-size="12" font-weight="bold" fill="#27ae60">200 байт (1 алокація)</text>

  <!-- Memory Summary Badge -->
  <rect x="70" y="418" width="360" height="34" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="250" y="439" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Економія пам'яті: -75% алокацій (в 4 рази менше!)</text>


  <!-- RIGHT PANEL: Latency p95/p99 -->
  <rect x="500" y="90" width="420" height="390" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="515" y="118" font-size="14" font-weight="bold" fill="#1a1a1a">2. Затримка обробки під навантаженням</text>
  <text x="515" y="138" font-size="12" fill="#6b7280">Час відповіді при 10 000 req/s (BenchmarkDotNet)</text>

  <!-- Right Chart Box -->
  <rect x="515" y="152" width="390" height="315" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Scenario 1: Canonical 4-Layer -->
  <text x="530" y="178" font-size="12" font-weight="bold" fill="#c0392b">Канонічна шаровість (паузи GC Gen 0)</text>
  
  <rect x="530" y="192" width="110" height="22" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="3"/>
  <text x="540" y="207" font-size="11" font-weight="bold" fill="#c0392b">p95: 4.8 мс</text>

  <rect x="530" y="220" width="350" height="24" fill="#c0392b" rx="3"/>
  <text x="540" y="236" font-size="11" font-weight="bold" fill="white">p99: 28.5 мс (через паузи GC STW)</text>

  <!-- Scenario 2: CQRS Read Bypass -->
  <text x="530" y="272" font-size="12" font-weight="bold" fill="#27ae60">Прямі проєкції (без транзитних об'єктів)</text>
  
  <rect x="530" y="286" width="40" height="22" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="580" y="301" font-size="11" font-weight="bold" fill="#27ae60">p95: 1.1 мс</text>

  <rect x="530" y="314" width="70" height="24" fill="#27ae60" rx="3"/>
  <text x="610" y="330" font-size="11" font-weight="bold" fill="#27ae60">p99: 1.8 мс (стабільний хвіст)</text>

  <!-- Metrics Table Box -->
  <rect x="530" y="354" width="360" height="98" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  
  <text x="542" y="374" font-size="11" fill="#6b7280">Частота колекцій GC Gen 0:</text>
  <text x="875" y="374" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">142 колекцій/с</text>

  <text x="542" y="394" font-size="11" fill="#6b7280">При CQRS Read Bypass:</text>
  <text x="875" y="394" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">18 колекцій/с</text>

  <line x1="542" y1="406" x2="875" y2="406" stroke="#d0d7de" stroke-width="1"/>

  <text x="542" y="424" font-size="11" font-weight="bold" fill="#27ae60">Зниження хвоста p99: пришвидшення у 15.8 раза!</text>

  <!-- BOTTOM TAKEAWAY BADGE -->
  <rect x="40" y="492" width="880" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="480" y="511" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">⚡ Висновок бенчмарку: Усунення «податку на читання» у 4 рази зменшує навантаження на купу</text>
  <text x="480" y="526" text-anchor="middle" font-size="11" fill="#1a1a1a">та ліквідує сплески затримки p99 з 28.5 мс до 1.8 мс під високим навантаженням</text>
</svg>
