<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Редукція графа: стягування транзитної вершини (Vertex Contraction)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Ланцюжок u → v_t → w скорочується до прямої дуги u → w зі збереженням композиції</text>

  <!-- ЛІВА ПАНЕЛЬ: ДО РЕДУКЦІЇ -->
  <rect x="28" y="78" width="440" height="385" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="248" y="104" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">До редукції: транзитний вузол v_t</text>
  <text x="248" y="122" font-size="12" fill="#6b7280" text-anchor="middle">Вироджена вершина з нульовим приростом інформації</text>

  <!-- Граф 1: u -> v_t -> w -->
  <rect x="42" y="136" width="412" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="248" y="154" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Орієнтований ланцюжок: u → v_t → w</text>

  <!-- Вузол u -->
  <rect x="56" y="168" width="96" height="74" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="104" y="190" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол u</text>
  <text x="104" y="210" font-size="12" fill="#6b7280" text-anchor="middle">Контролер</text>
  <text x="104" y="228" font-size="12" fill="#6b7280" text-anchor="middle">deg⁺ = 1</text>

  <!-- Стрілка u -> v_t -->
  <line x1="152" y1="205" x2="194" y2="205" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="173" y="195" font-size="12" fill="#c0392b" text-anchor="middle">id</text>

  <!-- Вузол v_t -->
  <rect x="198" y="168" width="102" height="74" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="249" y="190" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Вузол v_t</text>
  <text x="249" y="210" font-size="12" fill="#c0392b" text-anchor="middle">Транзит</text>
  <text x="249" y="228" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">deg⁻=1, deg⁺=1</text>

  <!-- Стрілка v_t -> w -->
  <line x1="300" y1="205" x2="342" y2="205" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="321" y="195" font-size="12" fill="#c0392b" text-anchor="middle">f</text>

  <!-- Вузол w -->
  <rect x="346" y="168" width="96" height="74" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="394" y="190" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол w</text>
  <text x="394" y="210" font-size="12" fill="#6b7280" text-anchor="middle">Репозиторій</text>
  <text x="394" y="228" font-size="12" fill="#6b7280" text-anchor="middle">deg⁻ = 1</text>

  <!-- Характеристики графа до -->
  <rect x="42" y="268" width="412" height="104" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="248" y="288" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Формальні характеристики до стягування</text>
  <text x="248" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">• Складність: |V| = 3, |E| = 2 (довжина шляху = 2)</text>
  <text x="248" y="330" font-size="12" fill="#c0392b" text-anchor="middle">• Тотожний оператор: v_t(x) = id(x), приріст ΔI = 0</text>
  <text x="248" y="350" font-size="12" fill="#6b7280" text-anchor="middle">• Хвильовий ефект: ланцюгова зміна 3 класів</text>

  <!-- Картка висновку ліворуч -->
  <rect x="42" y="384" width="412" height="66" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="248" y="405" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Діагноз: фіктивний транзитний бар'єр</text>
  <text x="248" y="424" font-size="12" fill="#1a1a1a" text-anchor="middle">Штучне подовження графа без ізоляції чи інкапсуляції</text>
  <text x="248" y="442" font-size="12" fill="#6b7280" text-anchor="middle">Накладні витрати на транзитні виклики та зайвий мапінг</text>


  <!-- ПРАВА ПАНЕЛЬ: ПІСЛЯ РЕДУКЦІЇ -->
  <rect x="492" y="78" width="440" height="385" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="104" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Після редукції: стягування u → w</text>
  <text x="712" y="122" font-size="12" fill="#6b7280" text-anchor="middle">Мінімальний еквівалентний граф без мертвого вузла</text>

  <!-- Граф 2: u -> w -->
  <rect x="506" y="136" width="412" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="154" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Редукований граф: безпосередня дуга u → w</text>

  <!-- Вузол u -->
  <rect x="526" y="168" width="108" height="74" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="580" y="190" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол u</text>
  <text x="580" y="210" font-size="12" fill="#6b7280" text-anchor="middle">Контролер</text>
  <text x="580" y="228" font-size="12" fill="#6b7280" text-anchor="middle">deg⁺ = 1</text>

  <!-- Пряма дуга u -> w -->
  <line x1="634" y1="205" x2="786" y2="205" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="710" y="195" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">оператор f</text>
  <text x="710" y="224" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">f(id(x)) = f(x)</text>
  <text x="710" y="240" font-size="12" fill="#6b7280" text-anchor="middle">(v_t усунуто)</text>

  <!-- Вузол w -->
  <rect x="790" y="168" width="108" height="74" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="844" y="190" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вузол w</text>
  <text x="844" y="210" font-size="12" fill="#1a1a1a" text-anchor="middle">Репозиторій</text>
  <text x="844" y="228" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">deg⁻ = 1</text>

  <!-- Характеристики графа після -->
  <rect x="506" y="268" width="412" height="104" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="288" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Формальні характеристики після стягування</text>
  <text x="712" y="310" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">• Складність: |V| = 2, |E| = 1 (шлях скорочено на 50%)</text>
  <text x="712" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">• Еквівалентність: тотожна дія f(id(x)) = f(x)</text>
  <text x="712" y="350" font-size="12" fill="#6b7280" text-anchor="middle">• Локалізація змін: хвильовий ефект скорочено до 2 вузлів</text>

  <!-- Картка висновку праворуч -->
  <rect x="506" y="384" width="412" height="66" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="405" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: оптимальна топологія</text>
  <text x="712" y="424" font-size="12" fill="#1a1a1a" text-anchor="middle">Безпечна редукція транзитного шару зі збереженням поведінки</text>
  <text x="712" y="442" font-size="12" fill="#6b7280" text-anchor="middle">Нуль накладних витрат, прямий контракт залежностей</text>
</svg>
