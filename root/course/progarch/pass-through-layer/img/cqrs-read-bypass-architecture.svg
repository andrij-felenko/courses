<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура CQRS з наскрізним обходом доменного ядра (Read Bypass)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Команди проходять повну валідацію в агрегатах, а запити читають пласкі DTO напряму зі сховища</text>

  <!-- ВЕРХНЯ ПАНЕЛЬ: ТРАКТ КОМАНД (ЗАПИС) -->
  <rect x="25" y="78" width="910" height="175" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="45" y="102" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="start">Тракт команд (Запис / Mutation)</text>
  <text x="320" y="102" font-size="12" fill="#6b7280" text-anchor="start">— суворий захист бізнес-інваріантів через агрегати</text>

  <!-- Блок 1.1: Клієнт / POST -->
  <rect x="40" y="118" width="140" height="118" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">API Контролер</text>
  <rect x="48" y="150" width="124" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="110" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">POST /orders</text>
  <text x="110" y="202" font-size="12" fill="#6b7280" text-anchor="middle">CreateOrderCmd</text>
  <text x="110" y="222" font-size="12" fill="#6b7280" text-anchor="middle">вхідні параметри</text>

  <line x1="180" y1="177" x2="208" y2="177" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 1.2: Обробник команд -->
  <rect x="210" y="118" width="155" height="118" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="287.5" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Command Handler</text>
  <rect x="218" y="150" width="139" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="287.5" y="172" font-size="12" fill="#1a1a1a" text-anchor="middle">Завантаження агрегату</text>
  <text x="287.5" y="202" font-size="12" fill="#6b7280" text-anchor="middle">• Валідація прав</text>
  <text x="287.5" y="222" font-size="12" fill="#6b7280" text-anchor="middle">• Межі транзакції</text>

  <line x1="365" y1="177" x2="393" y2="177" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 1.3: Доменний агрегат -->
  <rect x="395" y="118" width="185" height="118" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="487.5" y="139" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Доменний агрегат (Order)</text>
  <rect x="405" y="150" width="165" height="34" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="487.5" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Order.Create(...)</text>
  <text x="487.5" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">• Перевірка інваріантів</text>
  <text x="487.5" y="222" font-size="12" fill="#2457d6" text-anchor="middle">• Генерація подій домену</text>

  <line x1="580" y1="177" x2="608" y2="177" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 1.4: Репозиторій -->
  <rect x="610" y="118" width="155" height="118" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="687.5" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Репозиторій домену</text>
  <rect x="618" y="150" width="139" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="687.5" y="172" font-size="12" fill="#1a1a1a" text-anchor="middle">IOrderRepository</text>
  <text x="687.5" y="202" font-size="12" fill="#6b7280" text-anchor="middle">• Мапінг сутності в БД</text>
  <text x="687.5" y="222" font-size="12" fill="#6b7280" text-anchor="middle">• Unit of Work / Save</text>

  <line x1="765" y1="177" x2="793" y2="177" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 1.5: База даних -->
  <rect x="795" y="118" width="125" height="118" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="857.5" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сховище даних</text>
  <rect x="803" y="150" width="109" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="857.5" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">INSERT / UPDATE</text>
  <text x="857.5" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">Таблиці orders,</text>
  <text x="857.5" y="222" font-size="12" fill="#6b7280" text-anchor="middle">order_items</text>



  <!-- НИЖНЯ ПАНЕЛЬ: ТРАКТ ЗАПИТІВ (ЧИТАННЯ / READ BYPASS) -->
  <rect x="25" y="265" width="910" height="195" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="45" y="289" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="start">Тракт запитів (Читання / Read Bypass)</text>
  <text x="340" y="289" font-size="12" fill="#6b7280" text-anchor="start">— прямий наскрізний вичит DTO в обхід доменного ядра</text>

  <!-- Блок 2.1: Клієнт / GET -->
  <rect x="40" y="305" width="140" height="140" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="326" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">API Контролер</text>
  <rect x="48" y="337" width="124" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="110" y="359" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GET /orders/{id}</text>
  <text x="110" y="390" font-size="12" fill="#27ae60" text-anchor="middle">← Отримує DTO</text>
  <text x="110" y="410" font-size="12" fill="#6b7280" text-anchor="middle">OrderSummaryDto</text>
  <text x="110" y="430" font-size="12" fill="#6b7280" text-anchor="middle">без очікування</text>

  <line x1="180" y1="364" x2="208" y2="364" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Блок 2.2: Обробник запитів -->
  <rect x="210" y="305" width="155" height="140" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="287.5" y="326" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Query Handler</text>
  <rect x="218" y="337" width="139" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="287.5" y="359" font-size="12" fill="#1a1a1a" text-anchor="middle">IOrderQueries</text>
  <text x="287.5" y="390" font-size="12" fill="#6b7280" text-anchor="middle">• Формування запиту</text>
  <text x="287.5" y="410" font-size="12" fill="#6b7280" text-anchor="middle">• Проєкція вибірки</text>
  <text x="287.5" y="430" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">• Без сутності Order</text>

  <line x1="365" y1="364" x2="393" y2="364" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Блок 2.3: Наскрізний канал читання (Read Bypass) -->
  <rect x="395" y="305" width="370" height="140" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="580" y="326" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Прямий наскрізний канал (Read Bypass Engine)</text>
  
  <rect x="407" y="337" width="346" height="34" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="580" y="359" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Dapper: SELECT id, total, status FROM orders</text>

  <text x="580" y="390" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">✓ Оминає: агрегати, сутності та репозиторії</text>
  <text x="580" y="410" font-size="12" fill="#6b7280" text-anchor="middle">• Нуль транзитних прокидань через посередників</text>
  <text x="580" y="430" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">• Без зайвого мапінгу та навантаження на GC</text>

  <line x1="765" y1="364" x2="793" y2="364" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Блок 2.4: База даних (Читання) -->
  <rect x="795" y="305" width="125" height="140" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="857.5" y="326" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сховище даних</text>
  <rect x="803" y="337" width="109" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="857.5" y="359" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SELECT (NoLock)</text>
  <text x="857.5" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Пласка вибірка</text>
  <text x="857.5" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Індексований</text>
  <text x="857.5" y="430" font-size="12" fill="#27ae60" text-anchor="middle">швидкий доступ</text>
</svg>
