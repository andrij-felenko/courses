<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="470" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Дерево рішень: оцінка доцільності проміжного шару</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Послідовна перевірка доданої вартості шару для вибору оптимальної архітектурної стратегії</text>

  <!-- Column 1: Decision 1 & Output 1 -->
  <!-- Decision 1 Card -->
  <rect x="40" y="80" width="200" height="115" rx="8" ry="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="140" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">1. Бізнес-логіка</text>
  <text x="140" y="124" font-size="12" text-anchor="middle" fill="#1a1a1a">Чи є мутація стану</text>
  <text x="140" y="142" font-size="12" text-anchor="middle" fill="#1a1a1a">або складні доменні</text>
  <text x="140" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">інваріанти?</text>

  <!-- Arrow Down to Output 1 -->
  <line x1="140" y1="195" x2="140" y2="248" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="152" y="226" font-size="12" font-weight="bold" fill="#27ae60">ТАК</text>

  <!-- Output 1 Card -->
  <rect x="40" y="250" width="200" height="145" rx="8" ry="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="140" y="272" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">✅ Залишити шар</text>
  <text x="140" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Повноцінний сервіс</text>
  <text x="140" y="318" font-size="12" text-anchor="middle" fill="#6b7280">Шар захищає правила</text>
  <text x="140" y="336" font-size="12" text-anchor="middle" fill="#6b7280">та керує мутаціями</text>
  <text x="140" y="368" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">(Повна вартість)</text>

  <!-- Arrow Right to Decision 2 -->
  <line x1="240" y1="137" x2="268" y2="137" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="254" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">НІ</text>

  <!-- Column 2: Decision 2 & Output 2 -->
  <!-- Decision 2 Card -->
  <rect x="270" y="80" width="200" height="115" rx="8" ry="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="370" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">2. Системні межі</text>
  <text x="370" y="124" font-size="12" text-anchor="middle" fill="#1a1a1a">Чи є транзакції,</text>
  <text x="370" y="142" font-size="12" text-anchor="middle" fill="#1a1a1a">авторизація або</text>
  <text x="370" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ACL трансляція?</text>

  <!-- Arrow Down to Output 2 -->
  <line x1="370" y1="195" x2="370" y2="248" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="382" y="226" font-size="12" font-weight="bold" fill="#2457d6">ТАК</text>

  <!-- Output 2 Card -->
  <rect x="270" y="250" width="200" height="145" rx="8" ry="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="370" y="272" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">🔹 Тонкий шар</text>
  <text x="370" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Facade / ACL Adapter</text>
  <text x="370" y="318" font-size="12" text-anchor="middle" fill="#6b7280">Без логіки, але тримає</text>
  <text x="370" y="336" font-size="12" text-anchor="middle" fill="#6b7280">системні контури</text>
  <text x="370" y="368" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">(Виправданий шар)</text>

  <!-- Arrow Right to Decision 3 -->
  <line x1="470" y1="137" x2="498" y2="137" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="484" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">НІ</text>

  <!-- Column 3: Decision 3 & Output 3 -->
  <!-- Decision 3 Card -->
  <rect x="500" y="80" width="200" height="115" rx="8" ry="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="600" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">3. Тип операції</text>
  <text x="600" y="124" font-size="12" text-anchor="middle" fill="#1a1a1a">Це простий запит</text>
  <text x="600" y="142" font-size="12" text-anchor="middle" fill="#1a1a1a">читання даних</text>
  <text x="600" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">(Read / Query)?</text>

  <!-- Arrow Down to Output 3 -->
  <line x1="600" y1="195" x2="600" y2="248" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="612" y="226" font-size="12" font-weight="bold" fill="#27ae60">ТАК</text>

  <!-- Output 3 Card -->
  <rect x="500" y="250" width="200" height="145" rx="8" ry="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="600" y="272" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">⚡ Відкритий обхід</text>
  <text x="600" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Relaxed Bypass</text>
  <text x="600" y="318" font-size="12" text-anchor="middle" fill="#6b7280">Контролер звертається</text>
  <text x="600" y="336" font-size="12" text-anchor="middle" fill="#6b7280">напряму до Repo</text>
  <text x="600" y="368" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">(Оминає порожнечу)</text>

  <!-- Arrow Right to Output 4 -->
  <line x1="700" y1="137" x2="728" y2="137" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="714" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">НІ</text>

  <!-- Column 4: Output 4 (Red Action Card) -->
  <rect x="730" y="80" width="190" height="315" rx="8" ry="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="825" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">🛑 Видалити ланку</text>
  <text x="825" y="126" font-size="12" text-anchor="middle" fill="#6b7280">Pass-Through Layer</text>

  <rect x="742" y="142" width="166" height="180" rx="6" ry="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="752" y="166" font-size="12" font-weight="bold" fill="#c0392b">Висновок аналізу:</text>
  <text x="752" y="190" font-size="12" fill="#1a1a1a">• Фіктивна абстракція</text>
  <text x="752" y="212" font-size="12" fill="#1a1a1a">• Трансляція 1-в-1</text>
  <text x="752" y="234" font-size="12" fill="#1a1a1a">• Зайвий мапінг DTO</text>
  <text x="752" y="260" font-size="12" font-weight="bold" fill="#c0392b">Рішення:</text>
  <text x="752" y="282" font-size="12" font-weight="bold" fill="#c0392b">Повне вилучення!</text>
  <text x="752" y="304" font-size="12" fill="#6b7280">з проміжного ланцюга</text>

  <text x="825" y="368" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">(Усунення бруду)</text>

  <!-- Bottom Summary Banner -->
  <rect x="40" y="425" width="880" height="32" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="446" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">💡 Кожен шар повинен нести корисне навантаження, а не бути ритуальною прокладкою</text>
</svg>
