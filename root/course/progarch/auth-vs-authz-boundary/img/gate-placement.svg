<text x="630.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Брама стоїть ПІСЛЯ завантаження: рішення потребує самого обʼєкта — його власника й ролей, а не лише імені.</text>
