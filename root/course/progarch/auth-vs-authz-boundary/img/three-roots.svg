<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один розлам — три скам'янілості</text>
<line x1="90.0" y1="280.0" x2="1150.0" y2="280.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1156.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час →</text>
<text x="1148.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">різні століття, різні середовища</text>
<line x1="280.0" y1="191.8" x2="280.0" y2="271.0" stroke="#1a1a1a" stroke-width="1.4"/>
<rect x="184.8" y="108.2" width="190.4" height="83.7" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.7"/><text x="280.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">≈ XV століття · у мові</tspan><tspan x="280.0" dy="16.9">хибна етимологія зрощує</tspan><tspan x="280.0" dy="16.9">грецьке «справжній»</tspan><tspan x="280.0" dy="16.9">з латинським «влада»</tspan></text>
<circle cx="280.0" cy="280.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="620.0" y1="191.8" x2="620.0" y2="271.0" stroke="#1a1a1a" stroke-width="1.4"/>
<rect x="521.1" y="108.2" width="197.8" height="83.7" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.7"/><text x="620.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">1977 → 1988 · у системах</tspan><tspan x="620.0" dy="16.9">«збитий з пантелику</tspan><tspan x="620.0" dy="16.9">заступник» — привілей</tspan><tspan x="620.0" dy="16.9">діє чужою рукою</tspan></text>
<circle cx="620.0" cy="280.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="960.0" y1="191.8" x2="960.0" y2="271.0" stroke="#1a1a1a" stroke-width="1.4"/>
<rect x="864.8" y="108.2" width="190.4" height="83.7" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.7"/><text x="960.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">1996 · у протоколі</tspan><tspan x="960.0" dy="16.9">HTTP 401 «Unauthorized»</tspan><tspan x="960.0" dy="16.9">названо збоєм</tspan><tspan x="960.0" dy="16.9">АВТЕНТИФІКАЦІЇ</tspan></text>
<circle cx="960.0" cy="280.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="280.0" y1="288.0" x2="280.0" y2="348.2" stroke="#6b7280" stroke-width="1.2"/>
<rect x="205.0" y="348.2" width="150.0" height="47.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="280.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="280.0" dy="0.0">правопис «author» —</tspan><tspan x="280.0" dy="15.6">шрам тієї плутанини</tspan></text>
<line x1="620.0" y1="288.0" x2="620.0" y2="348.2" stroke="#6b7280" stroke-width="1.2"/>
<rect x="541.6" y="348.2" width="156.8" height="47.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="620.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="620.0" dy="0.0">компілятор переписав</tspan><tspan x="620.0" dy="15.6">білінг Tymshare</tspan></text>
<line x1="960.0" y1="288.0" x2="960.0" y2="348.2" stroke="#6b7280" stroke-width="1.2"/>
<rect x="888.4" y="348.2" width="143.1" height="47.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="960.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="960.0" dy="0.0">401 і 403 плутають</tspan><tspan x="960.0" dy="15.6">досі</tspan></text>
<text x="620.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">усі три — той самий розлом:</text>
<line x1="528.3" y1="502.0" x2="691.5" y2="502.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="620.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">сплутано в одне</text>
<rect x="413.7" y="473.1" width="108.7" height="49.9" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="468.0" y="494.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="468.0" dy="0.0">справжність</tspan><tspan x="468.0" dy="16.9">«хто ти?»</tspan></text>
<rect x="697.5" y="473.1" width="149.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="772.0" y="494.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="772.0" dy="0.0">надане право</tspan><tspan x="772.0" dy="16.9">«що тобі можна?»</tspan></text>
</svg>