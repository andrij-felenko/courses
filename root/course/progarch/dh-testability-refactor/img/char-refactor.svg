<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рефакторинг під характеризацією: пришпилити → змінити → упіймати червоне → закріпити</text>
<line x1="223.4" y1="118.0" x2="338.5" y2="118.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="281.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">додаємо вартового</text>
<line x1="491.5" y1="118.0" x2="626.7" y2="118.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="559.1" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">той самий тест</text>
<line x1="723.3" y1="118.0" x2="874.6" y2="118.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="799.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">оновлюємо пін</text>
<rect x="88.6" y="93.0" width="132.8" height="49.9" rx="6" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.5"/><text x="155.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">характеризація</tspan><tspan x="155.0" dy="16.9">ЗЕЛЕНА</tspan></text>
<rect x="340.5" y="93.0" width="149.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">+ FreshnessGuard</tspan><tspan x="415.0" dy="16.9">у збірці</tspan></text>
<rect x="628.7" y="93.0" width="92.5" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="675.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">та сама —</tspan><tspan x="675.0" dy="16.9">ЧЕРВОНА</tspan></text>
<rect x="876.6" y="93.0" width="116.7" height="49.9" rx="6" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.5"/><text x="935.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="935.0" dy="0.0">пін оновлено</tspan><tspan x="935.0" dy="16.9">+ регресія</tspan></text>
<text x="155.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">фіксує ваду:</tspan><tspan x="155.0" dy="14.3">застиглий гріє вічно</tspan></text>
<text x="415.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">структуру змінено,</tspan><tspan x="415.0" dy="14.3">decide не чіпали</tspan></text>
<text x="675.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">зміна дотяглася</tspan><tspan x="675.0" dy="14.3">саме до пришпиленого</tspan></text>
<text x="935.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">бажану поведінку</tspan><tspan x="935.0" dy="14.3">закріплено</tspan></text>
</svg>