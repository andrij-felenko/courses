<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця прийняття рішень: Ціна відкату проти Невизначеності</text>
<rect x="40.0" y="50.0" width="450.0" height="170.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="265.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle"><tspan x="265.0" dy="0.0">ДЕЛЕГУВАННЯ ТА ШВИДКИЙ ПУСК (Two-Way Door)</tspan><tspan x="265.0" dy="15.6"></tspan><tspan x="265.0" dy="15.6">• Висока зворотність, низька невизначеність</tspan><tspan x="265.0" dy="15.6">• Дія: Делегувати розробнику, вирішити за 10 хв</tspan><tspan x="265.0" dy="15.6">• Приклад: Внутрішня структура модуля, логування</tspan></text>
<rect x="530.0" y="50.0" width="450.0" height="170.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="755.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1565c0" text-anchor="middle"><tspan x="755.0" dy="0.0">TIMEBOXED СПАЙК ТА ПРОТОТИП</tspan><tspan x="755.0" dy="15.6"></tspan><tspan x="755.0" dy="15.6">• Висока зворотність, висока невизначеність</tspan><tspan x="755.0" dy="15.6">• Дія: Купити інформацію спайком на 2 дні</tspan><tspan x="755.0" dy="15.6">• Приклад: Перевірка продуктивності бібліотеки</tspan></text>
<rect x="40.0" y="240.0" width="450.0" height="170.0" rx="6" fill="#eef2f6" stroke="#1c2b36" stroke-width="1.5"/><text x="265.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle"><tspan x="265.0" dy="0.0">СТАНДАРТНЕ ВИКОНАННЯ (Boring Standard)</tspan><tspan x="265.0" dy="15.6"></tspan><tspan x="265.0" dy="15.6">• Низька зворотність, низька невизначеність</tspan><tspan x="265.0" dy="15.6">• Дія: Застосувати перевірений патерн/БД</tspan><tspan x="265.0" dy="15.6">• Приклад: Реляційна модель для фінансового леджера</tspan></text>
<rect x="530.0" y="240.0" width="450.0" height="170.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="755.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">УВАГА: ONE-WAY DOOR (Глибокий аналіз)</tspan><tspan x="755.0" dy="15.6"></tspan><tspan x="755.0" dy="15.6">• Низька зворотність, висока невизначеність</tspan><tspan x="755.0" dy="15.6">• Дія: Pre-Mortem сесія, RFC, колегія архітекторів</tspan><tspan x="755.0" dy="15.6">• Приклад: Публічний API, формат баз, криптографія</tspan></text>
<rect x="40.0" y="15.0" width="940.0" height="30.0" rx="6" fill="#eef2f6" stroke="#1c2b36" stroke-width="1.5"/><text x="510.0" y="40.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1c2b36" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">ВЕРТИКАЛЬ: ЗВОРОТНІСТЬ (Верх = Висока ціна відкату легко уникається | Нижче = Односторонні двері)</tspan></text>
</svg>