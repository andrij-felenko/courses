<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджет інноваційних жетонів та нудні технології</text>
<rect x="40.0" y="40.0" width="290.0" height="220.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="185.0" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1565c0" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">БЮДЖЕТ ІННОВАЦІЙ</tspan><tspan x="185.0" dy="11.7">(Максимум 2–3 жетони)</tspan><tspan x="185.0" dy="11.7"></tspan><tspan x="185.0" dy="11.7">• Витрачаються ЛИШЕ на ядро бізнесу</tspan><tspan x="185.0" dy="11.7">• Унікальна цінність продукту</tspan><tspan x="185.0" dy="11.7">• Приклад: Власний алгоритм розпізнавання відео в DH</tspan></text>
<rect x="365.0" y="40.0" width="290.0" height="220.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="510.0" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">НУДНИЙ СТАНДАРТ</tspan><tspan x="510.0" dy="11.7">(0 жетонів, дефолт)</tspan><tspan x="510.0" dy="11.7"></tspan><tspan x="510.0" dy="11.7">• Зрозумілі відмови й моніторинг</tspan><tspan x="510.0" dy="11.7">• Наявність спеціалістів на ринку</tspan><tspan x="510.0" dy="11.7">• Приклад: PostgreSQL, Redis, Linux, C++/Go/TS</tspan></text>
<rect x="690.0" y="40.0" width="290.0" height="220.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="835.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle"><tspan x="835.0" dy="0.0">ЗОНА ОПЕРАЦІЙНОГО КОЛАПСУ</tspan><tspan x="835.0" dy="15.6">(Перевитрата 5+ жетонів)</tspan><tspan x="835.0" dy="15.6"></tspan><tspan x="835.0" dy="15.6">• Нова експериментальна БД</tspan><tspan x="835.0" dy="15.6">• Нова мова програмування</tspan><tspan x="835.0" dy="15.6">• Необкатаний кастомний RPC</tspan><tspan x="835.0" dy="15.6">• Свої розробки замість SaaS</tspan></text>
<line x1="330.0" y1="150.0" x2="365.0" y2="150.0" stroke="#2e7d32" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="655.0" y1="150.0" x2="690.0" y2="150.0" stroke="#c62828" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="290.0" width="940.0" height="60.0" rx="6" fill="#eef2f6" stroke="#1c2b36" stroke-width="1.5"/><text x="510.0" y="324.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Правило: Купуй інновацію там, де робиш гроші; в решті місць використовуй технології із 10-річною історією</tspan></text>
