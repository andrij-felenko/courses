<text x="150.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">правильний гейт бачить досяжний рядок → «червоно, декодер ще потрібен»</text>
