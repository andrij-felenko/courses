<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лійка рішення: яку стратегію еволюції даних узяти</text>
<rect x="233.6" y="53.9" width="132.8" height="52.2" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="300.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Треба змінити</tspan><tspan x="300.0" dy="18.2">форму даних</tspan></text>
<line x1="300.0" y1="116.0" x2="300.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="196.0" y="152.0" width="208.0" height="62.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="2.0"/><text x="300.0" y="178.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Це похідні</tspan><tspan x="300.0" dy="19.5">дані?</tspan></text>
<text x="468.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">так</text>
<line x1="404.0" y1="183.0" x2="608.0" y2="183.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="610.0" y="150.0" width="400.0" height="68.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Не мігруй нічого: зміни функцію →</tspan><tspan x="810.0" dy="16.9">перебудуй із джерела</tspan><tspan x="810.0" dy="16.9">(немає вікна — найдешевше)</tspan></text>
<text x="318.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ні</text>
<line x1="300.0" y1="214.0" x2="300.0" y2="292.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="186.0" y="294.0" width="228.0" height="66.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="2.0"/><text x="300.0" y="322.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Наявні дані</tspan><tspan x="300.0" dy="18.2">можна переписати?</tspan></text>
<text x="474.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="474.0" dy="0.0">так —</tspan><tspan x="474.0" dy="15.0">змінне,</tspan><tspan x="474.0" dy="15.0">обмежене</tspan></text>
<line x1="414.0" y1="327.0" x2="608.0" y2="327.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="610.0" y="294.0" width="400.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="810.0" y="315.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Міграція на місці:</tspan><tspan x="810.0" dy="16.9">expand → backfill → contract</tspan><tspan x="810.0" dy="16.9">(вікно коротке, дані твої)</tspan></text>
<text x="322.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="322.0" dy="0.0">ні —</tspan><tspan x="322.0" dy="15.0">незмінна</tspan><tspan x="322.0" dy="15.0">історія</tspan></text>
<line x1="300.0" y1="360.0" x2="300.0" y2="438.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="100.0" y="440.0" width="400.0" height="74.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="300.0" y="464.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">schema-on-read:</tspan><tspan x="300.0" dy="16.9">версіонуй записи, декодуй на читанні,</tspan><tspan x="300.0" dy="16.9">історію не переписуй</tspan></text>
<rect x="96.0" y="556.0" width="918.0" height="76.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="2.0"/><text x="555.0" y="590.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">Перетинає межу, яку не оновиш разом (пристрої в полі, зовнішні клієнти, незалежні сервіси)?</tspan><tspan x="555.0" dy="16.9">→ обидві форми мусять бути валідні одночасно; тримай сумісність — вікно може не закритися ніколи</tspan></text>
<line x1="810.0" y1="362.0" x2="810.0" y2="556.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 6"/>
<line x1="300.0" y1="514.0" x2="300.0" y2="556.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 6"/>
</svg>