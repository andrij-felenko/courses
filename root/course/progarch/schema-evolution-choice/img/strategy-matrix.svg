<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стратегія випливає з двох питань: переписувані? · контролюєш обидва боки?</text>
<rect x="250.0" y="66.0" width="396.0" height="88.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="448.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="448.0" dy="0.0">Контролюєш обидва боки</tspan><tspan x="448.0" dy="16.9">ТАК</tspan><tspan x="448.0" dy="16.9">(один сервіс, спільний деплой)</tspan></text>
<rect x="668.0" y="66.0" width="396.0" height="88.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="866.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="866.0" dy="0.0">Контролюєш обидва боки</tspan><tspan x="866.0" dy="16.9">НІ</tspan><tspan x="866.0" dy="16.9">(пристрої в полі, зовнішні клієнти)</tspan></text>
<rect x="64.0" y="176.0" width="168.0" height="176.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="148.0" y="234.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="148.0" dy="0.0">Пере-</tspan><tspan x="148.0" dy="16.9">писувані</tspan><tspan x="148.0" dy="16.9">ТАК</tspan><tspan x="148.0" dy="16.9">(змінне,</tspan><tspan x="148.0" dy="16.9">обмежене)</tspan></text>
<rect x="64.0" y="372.0" width="168.0" height="176.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="148.0" y="430.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="148.0" dy="0.0">Пере-</tspan><tspan x="148.0" dy="16.9">писувані</tspan><tspan x="148.0" dy="16.9">НІ</tspan><tspan x="148.0" dy="16.9">(незмінна</tspan><tspan x="148.0" dy="16.9">історія)</tspan></text>
<rect x="250.0" y="176.0" width="396.0" height="176.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="448.0" y="243.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="448.0" dy="0.0">Міграція на місці.</tspan><tspan x="448.0" dy="16.9">Big-bang, якщо простій прийнятний;</tspan><tspan x="448.0" dy="16.9">інакше expand-contract.</tspan><tspan x="448.0" dy="16.9">Вікно коротке.</tspan></text>
<rect x="668.0" y="176.0" width="396.0" height="176.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="866.0" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="866.0" dy="0.0">expand → migrate → contract.</tspan><tspan x="866.0" dy="16.9">Backward + forward сумісність.</tspan><tspan x="866.0" dy="16.9">Вікно довге, але закриється.</tspan></text>
<rect x="250.0" y="372.0" width="396.0" height="176.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="448.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="448.0" dy="0.0">schema-on-read.</tspan><tspan x="448.0" dy="16.9">Версіонуй записи,</tspan><tspan x="448.0" dy="16.9">декодер росте кейсами.</tspan><tspan x="448.0" dy="16.9">Історію не чіпаєш.</tspan></text>
<rect x="668.0" y="372.0" width="396.0" height="176.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="866.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="866.0" dy="0.0">schema-on-read + ПОСТІЙНА сумісність.</tspan><tspan x="866.0" dy="16.9">Версію ніколи не перепризначай.</tspan><tspan x="866.0" dy="16.9">Contract може не настати.</tspan></text>
<rect x="232.0" y="566.0" width="656.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="560.0" y="590.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">А якщо дані ПОХІДНІ — матриця не потрібна: зміни функцію й перебудуй із джерела</tspan></text>
</svg>