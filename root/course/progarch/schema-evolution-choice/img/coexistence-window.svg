<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Cutover ламає тих, кого не оновив; expand-contract тримає вікно</text>
<text x="66.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Cutover — жорсткий флип</text>
<line x1="150.0" y1="128.0" x2="1020.0" y2="128.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="560.0" y1="98.0" x2="560.0" y2="158.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="560.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">мить флипу — усі мусять перескочити разом</text>
<text x="350.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">стара форма</text>
<text x="790.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">нова форма</text>
<circle cx="690.0" cy="128.0" r="13.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.9"/><line x1="682.0" y1="120.0" x2="698.0" y2="136.0" stroke="#c0392b" stroke-width="2.0"/><line x1="698.0" y1="120.0" x2="682.0" y2="136.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="690.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">старий читач ще живий → ламається</text>
<text x="66.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Expand → Migrate → Contract</text>
<rect x="150.0" y="300.0" width="590.0" height="132.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<text x="445.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">обидві форми валідні — будь-який читач, оновлений чи ні, працює</text>
<line x1="150.0" y1="360.0" x2="1020.0" y2="360.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="150.0" y1="352.0" x2="150.0" y2="368.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="445.0" y1="352.0" x2="445.0" y2="368.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="740.0" y1="352.0" x2="740.0" y2="368.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="1020.0" y1="352.0" x2="1020.0" y2="368.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="297.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="297.0" dy="0.0">EXPAND</tspan><tspan x="297.0" dy="16.2">пиши обидві,</tspan><tspan x="297.0" dy="16.2">читай стару</tspan></text>
<text x="592.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="592.0" dy="0.0">MIGRATE</tspan><tspan x="592.0" dy="16.2">бекфіл старих рядків,</tspan><tspan x="592.0" dy="16.2">читачі → нова</tspan></text>
<text x="880.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">CONTRACT</tspan><tspan x="880.0" dy="16.2">припини писати стару,</tspan><tspan x="880.0" dy="16.2">викинь</tspan></text>
<circle cx="360.0" cy="360.0" r="13.0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/><text x="360.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">✓</text>
<circle cx="640.0" cy="360.0" r="13.0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/><text x="640.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">✓</text>
<line x1="740.0" y1="330.0" x2="740.0" y2="368.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 5"/>
<text x="830.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">вікно закрите — лишилась одна форма</text>
<text x="560.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ніколи не флип: відкрий вікно, де обидві форми істинні, і закрий, лише коли всі перейшли</text>
</svg>