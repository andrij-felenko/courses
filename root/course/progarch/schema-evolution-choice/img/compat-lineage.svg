<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві лінії роду, що збіглися в одному законі: сумісність живе в читанні</text>
<text x="590.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід сумісності схем — кожен крок штовхає форму ближче до читача</text>
<rect x="10.0" y="64.0" width="260.0" height="30.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="140.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1984 · ASN.1</tspan></text>
<rect x="10.0" y="94.0" width="260.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="140.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">теги замість позицій;</tspan><tspan x="140.0" dy="16.9">«зарезервуй біти на потім»,</tspan><tspan x="140.0" dy="16.9">старий код ігнорує незнане</tspan></text>
<rect x="310.0" y="64.0" width="260.0" height="30.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="440.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">2007–08 · Thrift · Protobuf</tspan></text>
<rect x="310.0" y="94.0" width="260.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="440.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">поле — за НОМЕРОМ,</tspan><tspan x="440.0" dy="16.9">не за іменем;</tspan><tspan x="440.0" dy="16.9">невідомий тег зберігають</tspan></text>
<rect x="610.0" y="64.0" width="260.0" height="30.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="740.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">2009 · Apache Avro</tspan></text>
<rect x="610.0" y="94.0" width="260.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="740.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">схема писаря їде з даними;</tspan><tspan x="740.0" dy="16.9">читач резолвить свою</tspan><tspan x="740.0" dy="16.9">проти писаревої</tspan></text>
<rect x="910.0" y="64.0" width="260.0" height="30.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="1040.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1040.0" dy="0.0">2015 · Schema Registry</tspan></text>
<rect x="910.0" y="94.0" width="260.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="1040.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">центральний реєстр версій;</tspan><tspan x="1040.0" dy="16.9">гейт сумісності (backward)</tspan><tspan x="1040.0" dy="16.9">не пустить ламке в прод</tspan></text>
<line x1="270.0" y1="140.0" x2="310.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="570.0" y1="140.0" x2="610.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="870.0" y1="140.0" x2="910.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="1040.0" y1="186.0" x2="1040.0" y2="210.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="210.0" width="1100.0" height="84.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="2.0"/><text x="590.0" y="247.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Сумісність — властивість ЧИТАННЯ, а не труби.</tspan><tspan x="590.0" dy="19.5">Обидві гілки штовхають турботу в мить читання: реєстр — форму, ідемпотентність — дублі.</tspan></text>
<line x1="200.0" y1="342.0" x2="200.0" y2="296.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="590.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паралельна гілка: чому «рівно раз» на доставці — міф</text>
<rect x="30.0" y="342.0" width="340.0" height="30.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="200.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">1975 · Дві армії (Two Generals)</tspan></text>
<rect x="30.0" y="372.0" width="340.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Аккоюнлу, Еканадгам, Губер;</tspan><tspan x="200.0" dy="16.2">назвав Джим Ґрей, 1978:</tspan><tspan x="200.0" dy="16.2">«рівно раз» на доставці —</tspan><tspan x="200.0" dy="16.2">довести неможливо</tspan></text>
<rect x="420.0" y="342.0" width="340.0" height="30.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="590.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Практика замість дива</tspan></text>
<rect x="420.0" y="372.0" width="340.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">at-least-once + ідемпотентність</tspan><tspan x="590.0" dy="16.2">= «фактично раз»;</tspan><tspan x="590.0" dy="16.2">читач терпить дублі й повтори</tspan></text>
<rect x="810.0" y="342.0" width="340.0" height="30.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="980.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">2017 · Kafka EOS</tspan></text>
<rect x="810.0" y="372.0" width="340.0" height="96.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="980.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">ідемпотентний продюсер</tspan><tspan x="980.0" dy="16.2">+ транзакції;</tspan><tspan x="980.0" dy="16.2">«рівно раз» лише В МЕЖАХ Kafka</tspan></text>
<line x1="370.0" y1="420.0" x2="420.0" y2="420.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="760.0" y1="420.0" x2="810.0" y2="420.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
</svg>