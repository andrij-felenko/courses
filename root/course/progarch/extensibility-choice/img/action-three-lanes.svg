<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1260" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна дія — три моделі: де біжить логіка й що буде, коли вона зламається</text>
<rect x="31.0" y="276.6" width="130.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="96.0" y="297.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="96.0" dy="0.0">рух</tspan><tspan x="96.0" dy="16.9">у коридорі</tspan><tspan x="96.0" dy="16.9">(подія)</tspan></text>
<line x1="164.0" y1="310.0" x2="298.0" y2="160.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="164.0" y1="310.0" x2="298.0" y2="310.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="164.0" y1="310.0" x2="298.0" y2="460.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="320.0" y="135.1" width="290.0" height="49.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/><text x="465.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">Обмежений рушій</tspan><tspan x="465.0" dy="16.9">обхід дерева + пальне</tspan></text>
<text x="465.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">пальне + межа каскаду — не зациклиться</text>
<line x1="612.0" y1="160.0" x2="786.0" y2="160.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="790.0" y="143.2" width="300.0" height="33.5" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="940.0" y="164.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="940.0" dy="0.0">Радіус: межа словника</tspan></text>
<text x="940.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">чужого коду нема — лише твої дієслова</text>
<rect x="320.0" y="293.5" width="290.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="465.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">Плагін у процесі хаба</tspan></text>
<text x="465.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">нічим не стримано — сама лише довіра</text>
<line x1="612.0" y1="310.0" x2="786.0" y2="310.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="790.0" y="292.5" width="300.0" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="940.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">Радіус: ВЕСЬ ХАБ</tspan></text>
<text x="940.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зависання · виняток · крадіжка токена</text>
<rect x="320.0" y="435.1" width="290.0" height="49.9" rx="6" fill="#f2ecfb" stroke="#7c3aed" stroke-width="1.8"/><text x="465.0" y="456.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">Хаб штовхає подію</tspan><tspan x="465.0" dy="16.9">чужому адаптеру</tspan></text>
<text x="465.0" y="504.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">таймаут + ізоляція — мертвий не тримає решту</text>
<line x1="612.0" y1="460.0" x2="644.0" y2="460.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="648.0" y="426.0" width="12.0" height="68.0" rx="3" fill="#d1d5db" stroke="#6b7280" stroke-width="1.1"/>
<text x="654.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">стіна</text>
<line x1="664.0" y1="460.0" x2="786.0" y2="460.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="790.0" y="443.2" width="300.0" height="33.5" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="940.0" y="464.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle"><tspan x="940.0" dy="0.0">Радіус: за стіною</tspan></text>
<text x="940.0" y="494.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">чужий збій = твій таймаут</text>
</svg>