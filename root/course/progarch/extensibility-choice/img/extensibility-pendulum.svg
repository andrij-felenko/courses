<text x="978.0" y="598.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="978.0" dy="0.0">влада + стримування</tspan><tspan x="978.0" dy="16.2">разом, за побудовою</tspan></text>
<line x1="28.0" y1="656.0" x2="1172.0" y2="656.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,7"/>
<text x="600.0" y="682.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Тричі однаковий розмах: влада → ціна → відвойована ізоляція. Четвертий раз — обоє відразу.</text>
