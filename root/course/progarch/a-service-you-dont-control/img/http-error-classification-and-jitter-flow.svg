<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Класифікація відповідей HTTP та алгоритм Full Jitter</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Диференціація 2xx, 4xx та 5xx для відсікання безнадійних запитів і усунення шторму повторів</text>

  <!-- ==================== ЕТАП 1: КЛАСИФІКАЦІЯ ВІДПОВІДЕЙ ==================== -->
  <rect x="24" y="72" width="912" height="194" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок етапу 1 -->
  <text x="36" y="92" font-size="12" font-weight="700" fill="#1a1a1a">ЕТАП 1: ДИФЕРЕНЦІАЦІЯ СТАТУС-КОДІВ ТА ВИБІР СТРАТЕГІЇ</text>
  <text x="924" y="92" text-anchor="end" font-size="12" fill="#6b7280">Вхід: HTTP-відповідь або таймаут сокета</text>

  <!-- КОЛОНКА 1: 2xx Success -->
  <rect x="36" y="104" width="284" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="42" y="110" width="272" height="22" rx="3" fill="#27ae60"/>
  <text x="178" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2xx: УСПІШНА ДОСТАВКА</text>

  <text x="48" y="146" font-size="12" font-weight="700" fill="#27ae60">Коди: 200 OK, 201 Created, 204</text>
  <text x="48" y="166" font-size="12" fill="#1a1a1a">Запит прийнято й виконано шлюзом.</text>
  <text x="48" y="184" font-size="12" fill="#6b7280">Фіксація ідемпотентного результату.</text>

  <rect x="42" y="196" width="272" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="178" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">ДІЯ: Завершення події</text>
  <text x="178" y="232" text-anchor="middle" font-size="12" fill="#1a1a1a">Статус: PROCESSED ✓</text>

  <!-- КОЛОНКА 2: 4xx Client Error (Non-Retryable) -->
  <rect x="338" y="104" width="284" height="150" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="344" y="110" width="272" height="22" rx="3" fill="#c0392b"/>
  <text x="480" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4xx: ФАТАЛЬНА ПОМИЛКА</text>

  <text x="350" y="146" font-size="12" font-weight="700" fill="#c0392b">400, 401, 403, 404, 422 (крім 429)</text>
  <text x="350" y="166" font-size="12" fill="#1a1a1a">Невалідна схема, помилка авторизації.</text>
  <text x="350" y="184" font-size="12" fill="#6b7280">Повтори марні — код 400 не зміниться!</text>

  <rect x="344" y="196" width="272" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">ДІЯ: Зупинка ретраїв (Non-Retryable)</text>
  <text x="480" y="232" text-anchor="middle" font-size="12" fill="#c0392b">Карантин: DEAD_LETTER (DLQ) ✗</text>

  <!-- КОЛОНКА 3: 5xx / 429 / Timeouts (Retryable) -->
  <rect x="640" y="104" width="284" height="150" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="646" y="110" width="272" height="22" rx="3" fill="#2457d6"/>
  <text x="782" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5xx / 429: ТИМЧАСОВИЙ ЗБІЙ</text>

  <text x="652" y="146" font-size="12" font-weight="700" fill="#2457d6">500, 502, 503, 504, 429, Timeout</text>
  <text x="652" y="166" font-size="12" fill="#1a1a1a">Перевантаження, ліміти, збій мережі.</text>
  <text x="652" y="184" font-size="12" fill="#6b7280">Повторювана помилка (Retryable Error).</text>

  <rect x="646" y="196" width="272" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="782" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">ДІЯ: Запуск циклу повторів</text>
  <text x="782" y="232" text-anchor="middle" font-size="12" fill="#2457d6">➔ Перехід до Full Jitter Backoff</text>

  <!-- Зв'язуюча стрілка від колонки 3 до Етапу 2 (у порожньому проміжку y=254..276) -->
  <line x1="782" y1="254" x2="782" y2="276" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ==================== ЕТАП 2: РОЗРАХУНОК FULL JITTER ==================== -->
  <rect x="24" y="278" width="912" height="158" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Заголовок етапу 2 -->
  <text x="36" y="298" font-size="12" font-weight="700" fill="#2457d6">ЕТАП 2: РОЗРАХУНОК ІНТЕРВАЛІВ FULL JITTER: t_sleep = random(0, min(Max, Base · 2^(a - 1)))</text>
  <text x="924" y="298" text-anchor="end" font-size="12" fill="#6b7280">Base = 100 мс, Max = 2000 мс</text>

  <!-- Рядок 1: Спроба 1 -->
  <text x="36" y="323" font-size="12" font-weight="700" fill="#1a1a1a">Спроба 1 (a=1):</text>
  <rect x="150" y="312" width="27" height="14" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="700" y="323" font-size="12" fill="#1a1a1a">t_sleep ∈ [0, 100] мс (Cap = 0.1 с)</text>

  <!-- Рядок 2: Спроба 2 -->
  <text x="36" y="343" font-size="12" font-weight="700" fill="#1a1a1a">Спроба 2 (a=2):</text>
  <rect x="150" y="332" width="53" height="14" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="700" y="343" font-size="12" fill="#1a1a1a">t_sleep ∈ [0, 200] мс (Cap = 0.2 с)</text>

  <!-- Рядок 3: Спроба 3 -->
  <text x="36" y="363" font-size="12" font-weight="700" fill="#1a1a1a">Спроба 3 (a=3):</text>
  <rect x="150" y="352" width="106" height="14" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="700" y="363" font-size="12" fill="#1a1a1a">t_sleep ∈ [0, 400] мс (Cap = 0.4 с)</text>

  <!-- Рядок 4: Спроба 4 -->
  <text x="36" y="383" font-size="12" font-weight="700" fill="#1a1a1a">Спроба 4 (a=4):</text>
  <rect x="150" y="372" width="212" height="14" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="700" y="383" font-size="12" fill="#1a1a1a">t_sleep ∈ [0, 800] мс (Cap = 0.8 с)</text>

  <!-- Рядок 5: Спроба 5 -->
  <text x="36" y="403" font-size="12" font-weight="700" fill="#1a1a1a">Спроба 5 (a=5):</text>
  <rect x="150" y="392" width="424" height="14" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="700" y="403" font-size="12" fill="#1a1a1a">t_sleep ∈ [0, 1600] мс (Cap = 1.6 с)</text>

  <!-- Рядок 6: Спроба 6 (MaxDelay) -->
  <text x="36" y="423" font-size="12" font-weight="700" fill="#1a1a1a">Спроба 6 (a=6):</text>
  <rect x="150" y="412" width="530" height="14" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
  <text x="700" y="423" font-size="12" font-weight="700" fill="#2457d6">t_sleep ∈ [0, 2000] мс (MaxDelay)</text>

  <!-- ==================== НИЖНІ КАРТКИ: ПІДСУМОК ==================== -->
  <!-- Ліва картка -->
  <rect x="24" y="448" width="446" height="58" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="36" y="468" font-size="12" font-weight="700" fill="#c0392b">Чому не можна ретраїти 4xx (Non-Retryable):</text>
  <text x="36" y="488" font-size="12" fill="#1a1a1a">Невалідний запит не виправиться сам — повтори спалюють ліміти.</text>

  <!-- Права картка -->
  <rect x="490" y="448" width="446" height="58" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="502" y="468" font-size="12" font-weight="700" fill="#27ae60">Чому Full Jitter рятує від Thundering Herd:</text>
  <text x="502" y="488" font-size="12" fill="#1a1a1a">Випадковий розкид розбиває резонанс і плавно розподіляє трафік.</text>
</svg>
