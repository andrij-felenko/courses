  <line x1="374" y1="305" x2="444" y2="305" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue-end)"/>
  <text x="350" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Δt = 4</text>

