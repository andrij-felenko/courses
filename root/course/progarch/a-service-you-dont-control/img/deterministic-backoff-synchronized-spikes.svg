  <line x1="85" y1="360" x2="910" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="918" y="375" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">t (с)</text>

  <!-- Лінія граничної місткості C_max -->
  <line x1="90" y1="324" x2="870" y2="324" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Засічки та підписи на осі X (Графік 2) -->
  <line x1="100" y1="360" x2="100" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="100" y="375" text-anchor="middle" font-size="12" fill="#6b7280">0</text>
  <line x1="150" y1="360" x2="150" y2="364" stroke="#1a1a1a" stroke-width="1"/>
