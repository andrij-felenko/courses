  <line x1="850" y1="360" x2="850" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="850" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">15</text>

  <!-- Пікові імпульси в експоненційні моменти часу -->
  <!-- t=0: початковий сплеск -->
  <rect x="97" y="290" width="6" height="70" fill="#c0392b" rx="1"/>

  <!-- t=1: 1-й повтор (інтервал 1 с) -->
  <rect x="147" y="290" width="6" height="70" fill="#c0392b" rx="1"/>
  <text x="150" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Удар 1</text>

  <!-- t=3: 2-й повтор (інтервал 2 с) -->
  <rect x="247" y="290" width="6" height="70" fill="#c0392b" rx="1"/>
  <text x="250" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Удар 2</text>

  <!-- t=7: 3-й повтор (інтервал 4 с) -->
  <rect x="447" y="290" width="6" height="70" fill="#c0392b" rx="1"/>
  <text x="450" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Удар 3</text>

