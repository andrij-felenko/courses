  <!-- Анотація графіка 1 -->
  <rect x="510" y="112" width="340" height="22" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="680" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Постійне добивання: сервер не встигає піднятися</text>

  <!-- ==================== ЧАСТИНА 2: ЕКСПОНЕНЦІЙНИЙ ВІДСТУП (РОЗРІДЖЕНІ УДАРИ) ==================== -->
  <rect x="24" y="236" width="912" height="150" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок графіка 2 -->
  <rect x="36" y="246" width="280" height="20" rx="3" fill="#2457d6"/>
  <text x="176" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ЕКСПОНЕНЦІЙНИЙ ВІДСТУП (t = 2ⁿ⁻¹)</text>
  <text x="328" y="261" font-size="12" font-weight="700" fill="#c0392b">Хвилі розріджуються, але пік N не зменшується!</text>

