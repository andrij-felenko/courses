  <rect x="847" y="290" width="6" height="70" fill="#c0392b" rx="1"/>
  <text x="850" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Удар 4</text>

  <!-- Стрілки та підписи розширення інтервалів (розбиті на 2 сегменти, щоб не різати текст) -->
  <!-- Інтервал 2 с (між 1 та 3) -->
  <line x1="156" y1="305" x2="176" y2="305" stroke="#2457d6" stroke-width="1.8" marker-start="url(#arr-blue-start)"/>
