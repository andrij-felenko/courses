  <!-- Пікові імпульси навантаження (Графік 1) -->
  <rect x="97" y="128" width="6" height="70" fill="#c0392b" rx="1"/>
  <rect x="147" y="128" width="6" height="70" fill="#c0392b" rx="1"/>
  <rect x="197" y="128" width="6" height="70" fill="#c0392b" rx="1"/>
