  <line x1="650" y1="360" x2="650" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="650" y="375" text-anchor="middle" font-size="12" fill="#6b7280">11</text>
  <line x1="700" y1="360" x2="700" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="700" y="375" text-anchor="middle" font-size="12" fill="#6b7280">12</text>
  <line x1="750" y1="360" x2="750" y2="364" stroke="#1a1a1a" stroke-width="1"/>
