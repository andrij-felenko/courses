  <line x1="90" y1="360" x2="90" y2="276" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="84" y="278" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">λ (RPS)</text>
  <text x="84" y="296" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b">Пік N</text>
  <text x="84" y="328" text-anchor="end" font-size="12" fill="#6b7280">C_max</text>
  <text x="84" y="364" text-anchor="end" font-size="12" fill="#6b7280">0</text>

