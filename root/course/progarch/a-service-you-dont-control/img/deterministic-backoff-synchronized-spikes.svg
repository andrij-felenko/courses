  <text x="700" y="213" text-anchor="middle" font-size="12" fill="#6b7280">12</text>
  <line x1="750" y1="198" x2="750" y2="202" stroke="#1a1a1a" stroke-width="1"/>
  <text x="750" y="213" text-anchor="middle" font-size="12" fill="#6b7280">13</text>
  <line x1="800" y1="198" x2="800" y2="202" stroke="#1a1a1a" stroke-width="1"/>
