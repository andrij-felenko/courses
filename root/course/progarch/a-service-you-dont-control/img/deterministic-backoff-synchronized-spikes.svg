  <!-- Заголовок графіка 1 -->
  <rect x="36" y="84" width="230" height="20" rx="3" fill="#c0392b"/>
  <text x="151" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ФІКСОВАНИЙ ІНТЕРВАЛ (T = const)</text>
  <text x="278" y="99" font-size="12" font-weight="700" fill="#c0392b">Безперервний резонансний шторм: однакові удари кожні 1 с</text>

  <!-- Вісь Y (Графік 1) -->
  <line x1="90" y1="198" x2="90" y2="114" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="84" y="116" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">λ (RPS)</text>
  <text x="84" y="134" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b">Пік N</text>
  <text x="84" y="166" text-anchor="end" font-size="12" fill="#6b7280">C_max</text>
  <text x="84" y="202" text-anchor="end" font-size="12" fill="#6b7280">0</text>

  <!-- Вісь X (Графік 1) -->
  <line x1="85" y1="198" x2="910" y2="198" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="918" y="213" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">t (с)</text>

  <!-- Лінія граничної місткості C_max -->
  <line x1="90" y1="162" x2="870" y2="162" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Засічки та підписи на осі X (Графік 1) -->
