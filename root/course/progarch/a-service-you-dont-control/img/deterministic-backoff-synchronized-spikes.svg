  <line x1="680" y1="305" x2="844" y2="305" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue-end)"/>
  <text x="650" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Δt = 8 с</text>

  <!-- ==================== НИЖНЯ ЧАСТИНА: АНАЛІЗ ТА РОЗВ'ЯЗОК ==================== -->

  <!-- Ліва картка: Чому детермінізм не працює -->
  <rect x="24" y="398" width="446" height="100" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="36" y="408" width="180" height="20" rx="3" fill="#c0392b"/>
  <text x="126" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ФАЗОВА КОГЕРЕНТНІСТЬ</text>
  <text x="224" y="423" font-size="12" font-weight="700" fill="#c0392b">Крах детермінізму</text>

  <rect x="36" y="432" width="422" height="56" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="48" y="449" font-size="12" fill="#1a1a1a">Коефіцієнт піка: K_пік(n) = λ_пік / λ_сер = (t_base · 2ⁿ⁻¹) / δt</text>
  <text x="48" y="465" font-size="12" fill="#1a1a1a">Усі N клієнтів мають синхронні таймери: зсув фаз Δφ = 0</text>
  <text x="48" y="481" font-size="12" font-weight="700" fill="#c0392b">⚠ Чергування мертвої тиші та повторних ударів амплітудою N</text>

  <!-- Права картка: Стохастичний розв'язок (Jitter) -->
  <rect x="490" y="398" width="446" height="100" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="502" y="408" width="180" height="20" rx="3" fill="#27ae60"/>
  <text x="592" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">РОЗВ'ЯЗОК: ДЖИТЕР</text>
  <text x="690" y="423" font-size="12" font-weight="700" fill="#27ae60">Стохастичне розсіювання</text>

  <rect x="502" y="432" width="422" height="56" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="514" y="449" font-size="12" fill="#1a1a1a">Випадкове тремтіння: S_n ~ U(0, t_wait) розсіює фази клієнтів</text>
  <text x="514" y="465" font-size="12" fill="#1a1a1a">Синхронний дельта-удар N переходить у потік із шумом ~√N</text>
  <text x="514" y="481" font-size="12" font-weight="700" fill="#27ae60">✓ Пікове навантаження падає нижче C_max, сервіс оживає</text>

</svg>
