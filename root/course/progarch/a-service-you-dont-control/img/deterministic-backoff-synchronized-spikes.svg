  <line x1="200" y1="360" x2="200" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="200" y="375" text-anchor="middle" font-size="12" fill="#6b7280">2</text>
  <line x1="250" y1="360" x2="250" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="250" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">3</text>
  <line x1="300" y1="360" x2="300" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="300" y="375" text-anchor="middle" font-size="12" fill="#6b7280">4</text>
  <line x1="350" y1="360" x2="350" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="350" y="375" text-anchor="middle" font-size="12" fill="#6b7280">5</text>
  <line x1="400" y1="360" x2="400" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="400" y="375" text-anchor="middle" font-size="12" fill="#6b7280">6</text>
  <line x1="450" y1="360" x2="450" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="450" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">7</text>
  <line x1="500" y1="360" x2="500" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="500" y="375" text-anchor="middle" font-size="12" fill="#6b7280">8</text>
  <line x1="550" y1="360" x2="550" y2="364" stroke="#1a1a1a" stroke-width="1"/>
  <text x="550" y="375" text-anchor="middle" font-size="12" fill="#6b7280">9</text>
  <line x1="600" y1="360" x2="600" y2="364" stroke="#1a1a1a" stroke-width="1"/>
