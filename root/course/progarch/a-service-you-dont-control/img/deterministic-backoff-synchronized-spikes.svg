<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L1,3.5 L7,6 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-end" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L6,3.5 L0,6 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Фазова синхронізація повторів: крах детерміністичного відступу</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Детерміністичний backoff розсовує удари в часі, але зберігає руйнівний дельта-пік навантаження амплітудою N</text>

  <!-- ==================== ЧАСТИНА 1: ФІКСОВАНИЙ ІНТЕРВАЛ (ПЕРІОДИЧНІ УДАРИ) ==================== -->
