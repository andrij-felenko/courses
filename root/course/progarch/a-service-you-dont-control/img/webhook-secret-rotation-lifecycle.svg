<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Чотирифазний життєвий цикл безшовної ротації секретів (Secret Rotation)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Використання двійкового кільця ключів (Dual Keyring) для оновлення HMAC без втрати вебхуків і 401-помилок</text>

  <!-- ==================== ФАЗА 1: БАЗОВИЙ СТАН ==================== -->
  <rect x="20" y="75" width="215" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="127" y="94" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фаза 1. Базовий стан</text>
  <text x="127" y="112" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle">Штатний режим • Одиночний ключ</text>

  <!-- Картка 1A: Провайдер -->
  <rect x="28" y="126" width="199" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="36" y="144" font-size="11" font-weight="700" fill="#1a1a1a">Провайдер (підпис):</text>
  <text x="36" y="162" font-size="10" font-weight="700" fill="#2457d6">• Активний: Secret A</text>
  <text x="36" y="178" font-size="10" fill="#6b7280">Підписує 100% вебхуків</text>
  <text x="36" y="190" font-size="10" fill="#6b7280">Новий ключ ще не створено</text>

  <!-- Картка 1B: Keyring -->
  <rect x="28" y="208" width="199" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="36" y="226" font-size="11" font-weight="700" fill="#1a1a1a">Кільце ключів (Keyring):</text>
  <text x="36" y="244" font-size="10" font-weight="700" fill="#2457d6">• Primary: Secret A</text>
  <text x="36" y="260" font-size="10" fill="#6b7280">• Secondary: [ Порожньо ]</text>
  <text x="36" y="278" font-size="10" fill="#1a1a1a">Звірка тільки з Secret A</text>
  <text x="36" y="292" font-size="10" fill="#6b7280">Спільний секрет у Vault</text>

  <!-- Картка 1C: Результат -->
  <rect x="28" y="310" width="199" height="85" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="36" y="328" font-size="11" font-weight="700" fill="#27ae60">Статус верифікації:</text>
  <text x="36" y="346" font-size="10" font-weight="700" fill="#27ae60">200 OK: Валідний підпис</text>
  <text x="36" y="364" font-size="10" fill="#1a1a1a">• Одинарне обчислення HMAC</text>
  <text x="36" y="380" font-size="10" fill="#6b7280">Система стабільна</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="235" y1="90" x2="251" y2="90" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>


  <!-- ==================== ФАЗА 2: ПІДГОТОВКА КІЛЬЦЯ ==================== -->
  <rect x="255" y="75" width="215" height="330" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="362" y="94" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фаза 2. Підготовка кільця</text>
  <text x="362" y="112" font-size="10" font-weight="600" fill="#2457d6" text-anchor="middle">Додавання кандидата • Dual Keyring</text>

  <!-- Картка 2A: Провайдер -->
  <rect x="263" y="126" width="199" height="70" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="271" y="144" font-size="11" font-weight="700" fill="#1a1a1a">Провайдер (підпис):</text>
  <text x="271" y="162" font-size="10" font-weight="700" fill="#2457d6">• Активний: Secret A</text>
  <text x="271" y="178" font-size="10" fill="#2457d6">• Згенеровано: Secret B</text>
  <text x="271" y="190" font-size="10" fill="#6b7280">Підпис іще йде старим Secret A</text>

  <!-- Картка 2B: Keyring -->
  <rect x="263" y="208" width="199" height="90" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="271" y="226" font-size="11" font-weight="700" fill="#2457d6">Кільце ключів (Keyring):</text>
  <text x="271" y="244" font-size="10" font-weight="700" fill="#2457d6">• Primary: Secret A</text>
  <text x="271" y="260" font-size="10" font-weight="700" fill="#27ae60">• Secondary: Secret B (new)</text>
  <text x="271" y="278" font-size="10" fill="#1a1a1a">Приймач знає обидва ключі</text>
  <text x="271" y="292" font-size="10" fill="#6b7280">Готовий до перемикання</text>

  <!-- Картка 2C: Результат -->
  <rect x="263" y="310" width="199" height="85" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="271" y="328" font-size="11" font-weight="700" fill="#27ae60">Статус верифікації:</text>
  <text x="271" y="346" font-size="10" font-weight="700" fill="#27ae60">200 OK: Нуль збоїв</text>
  <text x="271" y="364" font-size="10" fill="#1a1a1a">• Підпис A проходить одразу</text>
  <text x="271" y="380" font-size="10" fill="#27ae60">Тестовий підпис B теж валідний</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="470" y1="90" x2="486" y2="90" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>


  <!-- ==================== ФАЗА 3: ПЕРЕМИКАННЯ ПІДПИСУ ==================== -->
  <rect x="490" y="75" width="215" height="330" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="597" y="94" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фаза 3. Перемикання підпису</text>
  <text x="597" y="112" font-size="10" font-weight="600" fill="#2457d6" text-anchor="middle">Активний Secret B • Grace-період</text>

  <!-- Картка 3A: Провайдер -->
  <rect x="498" y="126" width="199" height="70" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="506" y="144" font-size="11" font-weight="700" fill="#1a1a1a">Провайдер (підпис):</text>
  <text x="506" y="162" font-size="10" font-weight="700" fill="#27ae60">• Активний: Secret B (Cutover)</text>
  <text x="506" y="178" font-size="10" fill="#6b7280">• У черзі / retries: Secret A</text>
  <text x="506" y="190" font-size="10" fill="#c0392b">Змішаний трафік у польоті!</text>

  <!-- Картка 3B: Keyring -->
  <rect x="498" y="208" width="199" height="90" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="506" y="226" font-size="11" font-weight="700" fill="#2457d6">Кільце ключів (Keyring):</text>
  <text x="506" y="244" font-size="10" font-weight="700" fill="#27ae60">• Primary: Secret B (new)</text>
  <text x="506" y="260" font-size="10" font-weight="700" fill="#2457d6">• Secondary: Secret A (old)</text>
  <text x="506" y="278" font-size="10" fill="#1a1a1a">Спершу звірка з B, фолбек на A</text>
  <text x="506" y="292" font-size="10" fill="#6b7280">Grace period (24–48 год)</text>

  <!-- Картка 3C: Результат -->
  <rect x="498" y="310" width="199" height="85" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="506" y="328" font-size="11" font-weight="700" fill="#27ae60">Статус верифікації:</text>
  <text x="506" y="346" font-size="10" font-weight="700" fill="#27ae60">200 OK: 100% прийнято</text>
  <text x="506" y="364" font-size="10" fill="#1a1a1a">• Нові запити валідує Secret B</text>
  <text x="506" y="380" font-size="10" fill="#27ae60">• Запізнілі ретраї валідує Secret A</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="705" y1="90" x2="721" y2="90" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>


  <!-- ==================== ФАЗА 4: ОЧИЩЕННЯ ТА ФІНАЛ ==================== -->
  <rect x="725" y="75" width="215" height="330" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="832" y="94" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фаза 4. Очищення та фінал</text>
  <text x="832" y="112" font-size="10" font-weight="600" fill="#27ae60" text-anchor="middle">Анулювання A • Новий Baseline</text>

  <!-- Картка 4A: Провайдер -->
  <rect x="733" y="126" width="199" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="741" y="144" font-size="11" font-weight="700" fill="#1a1a1a">Провайдер (підпис):</text>
  <text x="741" y="162" font-size="10" font-weight="700" fill="#27ae60">• Активний: Secret B</text>
  <text x="741" y="178" font-size="10" fill="#c0392b">• Secret A: Видалено з кабінету</text>
  <text x="741" y="190" font-size="10" fill="#6b7280">Старий секрет відкликано</text>

  <!-- Картка 4B: Keyring -->
  <rect x="733" y="208" width="199" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="741" y="226" font-size="11" font-weight="700" fill="#27ae60">Кільце ключів (Keyring):</text>
  <text x="741" y="244" font-size="10" font-weight="700" fill="#27ae60">• Primary: Secret B</text>
  <text x="741" y="260" font-size="10" fill="#6b7280">• Secondary: [ Порожньо ]</text>
  <text x="741" y="278" font-size="10" fill="#1a1a1a">Secret A видалено з конфігу</text>
  <text x="741" y="292" font-size="10" fill="#6b7280">Ротацію завершено без простою</text>

  <!-- Картка 4C: Результат -->
  <rect x="733" y="310" width="199" height="85" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="741" y="328" font-size="11" font-weight="700" fill="#27ae60">Статус верифікації:</text>
  <text x="741" y="346" font-size="10" font-weight="700" fill="#27ae60">200 OK: Новий цикл</text>
  <text x="741" y="364" font-size="10" fill="#1a1a1a">• 0 помилок 401 за весь період</text>
  <text x="741" y="380" font-size="10" fill="#27ae60">Повний захист від компрометації</text>


  <!-- ==================== НИЖНІЙ БАНЕР: АЛГОРИТМ КІЛЬЦЯ ==================== -->
  <rect x="20" y="420" width="920" height="58" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="480" y="440" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Інженерний алгоритм Keyring: valid_hmac(body, Primary) || valid_hmac(body, Secondary) -> 200 OK</text>
  <text x="480" y="458" font-size="10" fill="#6b7280" text-anchor="middle">Двійкове кільце гарантує нуль 401-помилок у момент перемикання ключів і коректно приймає запізнілі ретраї провайдера</text>

</svg>
