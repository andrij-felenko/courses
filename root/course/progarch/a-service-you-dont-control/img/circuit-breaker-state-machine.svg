<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Скінченний автомат захисту: Circuit Breaker</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Переходи між станами Closed, Open та Half-Open за порогами збоїв, повільних відповідей і таймером</text>

  <!-- Стан 1: CLOSED (Замкнено) -->
  <rect x="50" y="100" width="270" height="180" rx="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="65" y="115" width="240" height="32" rx="6" fill="#27ae60"/>
  <text x="185" y="136" font-size="14" font-weight="700" fill="white" text-anchor="middle">CLOSED (Замкнено)</text>
  <text x="70" y="172" font-size="12" font-weight="700" fill="#1a1a1a">• Нормальне пропускання трафіку</text>
  <text x="70" y="194" font-size="12" fill="#1a1a1a">• Запити вільно йдуть до API</text>
  <text x="70" y="216" font-size="12" fill="#1a1a1a">• Збір статистики у ковзне вікно</text>
  <text x="70" y="238" font-size="12" fill="#6b7280">• Підрахунок частоти збоїв і затримок</text>
  <text x="70" y="260" font-size="12" font-weight="700" fill="#27ae60">Статус: Служба здорова</text>

  <!-- Стан 2: OPEN (Розімкнено) -->
  <rect x="640" y="100" width="270" height="180" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="655" y="115" width="240" height="32" rx="6" fill="#c0392b"/>
  <text x="775" y="136" font-size="14" font-weight="700" fill="white" text-anchor="middle">OPEN (Розімкнено)</text>
  <text x="660" y="172" font-size="12" font-weight="700" fill="#1a1a1a">• Швидка відмова (fail-fast 0 мс)</text>
  <text x="660" y="194" font-size="12" fill="#1a1a1a">• Мережеві запити блокуються</text>
  <text x="660" y="216" font-size="12" fill="#1a1a1a">• Миттєвий перехід на Fallback / кеш</text>
  <text x="660" y="238" font-size="12" fill="#6b7280">• Захист партнера від лавини ретраїв</text>
  <text x="660" y="260" font-size="12" font-weight="700" fill="#c0392b">Статус: Таймер охолодження</text>

  <!-- Стан 3: HALF-OPEN (Зондування) -->
  <rect x="345" y="330" width="270" height="160" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="360" y="345" width="240" height="32" rx="6" fill="#2457d6"/>
  <text x="480" y="366" font-size="14" font-weight="700" fill="white" text-anchor="middle">HALF-OPEN (Зондування)</text>
  <text x="365" y="400" font-size="12" font-weight="700" fill="#1a1a1a">• Дозована квота пробних викликів</text>
  <text x="365" y="422" font-size="12" fill="#1a1a1a">• Перевірка відновлення сервісу</text>
  <text x="365" y="444" font-size="12" fill="#1a1a1a">• Решта запитів відсікається у Fallback</text>
  <text x="365" y="466" font-size="12" font-weight="700" fill="#2457d6">Статус: Очікування результатів проб</text>

  <!-- Перехід 1: CLOSED -> OPEN (Розмикання ланцюга) -->
  <line x1="320" y1="150" x2="632" y2="150" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="480" y="122" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Частка збоїв ≥ 50% або повільних відповідей ≥ 50%</text>
  <text x="480" y="138" font-size="12" fill="#c0392b" text-anchor="middle">(за наявності вибірки ≥ minCalls у вікні)</text>

  <!-- Перехід 2: HALF-OPEN -> OPEN (Збій пробного запиту) -->
  <path d="M 460,330 L 460,220 L 632,220" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="550" y="196" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Збій пробного виклику</text>
  <text x="550" y="212" font-size="12" fill="#c0392b" text-anchor="middle">(миттєве повернення в OPEN)</text>

  <!-- Перехід 3: OPEN -> HALF-OPEN (Сплив таймера охолодження) -->
  <path d="M 820,280 L 820,440 L 623,440" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="720" y="365" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Таймаут охолодження сплив</text>
  <text x="720" y="383" font-size="12" fill="#2457d6" text-anchor="middle">(waitDurationInOpenStateMs)</text>
  <text x="720" y="401" font-size="12" fill="#6b7280" text-anchor="middle">перехід до пробного зондування</text>

  <!-- Перехід 4: HALF-OPEN -> CLOSED (Успішне відновлення) -->
  <path d="M 345,440 L 120,440 L 120,288" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="230" y="370" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Усі пробні виклики успішні</text>
  <text x="230" y="388" font-size="12" fill="#27ae60" text-anchor="middle">(досягнуто квоту успіхів)</text>
  <text x="230" y="406" font-size="12" fill="#6b7280" text-anchor="middle">ланцюг повністю замикається</text>
</svg>
