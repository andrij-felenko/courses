<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Ізоляція ресурсів (Bulkhead): семафорний бар'єр паралелізму</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Квотування слотів зовнішнього шлюзу захищає локальні воркери та блокує розповсюдження затримок</text>

  <!-- КОЛОНКА 1: Вхідний трафік -->
  <rect x="24" y="68" width="216" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="36" y="80" width="130" height="22" rx="3" fill="#2457d6"/>
  <text x="101" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ВХІДНИЙ ТРАФІК</text>
  <text x="36" y="120" font-size="13" font-weight="700" fill="#1a1a1a">Розподіл потоків</text>

  <!-- Картка 1.1: Локальні запити -->
  <rect x="36" y="132" width="192" height="114" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="46" y="152" font-size="12" font-weight="700" fill="#27ae60">Локальні операції (85%)</text>
  <text x="46" y="172" font-size="12" fill="#1a1a1a">· /health (K8s liveness probe)</text>
  <text x="46" y="190" font-size="12" fill="#1a1a1a">· /catalog (Пошук товарів)</text>
  <text x="46" y="208" font-size="12" fill="#27ae60">· Цільовий час: 2–5 мс</text>
  <text x="46" y="226" font-size="12" fill="#6b7280">· Прямий доступ до ядра</text>
  <text x="46" y="240" font-size="12" font-weight="700" fill="#27ae60">Критично важливий SLA</text>

  <!-- Картка 1.2: Зовнішні запити -->
  <rect x="36" y="258" width="192" height="158" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="46" y="278" font-size="12" font-weight="700" fill="#c0392b">Зовнішні виклики (15%)</text>
  <text x="46" y="298" font-size="12" fill="#1a1a1a">· /checkout (Оплата замовлення)</text>
  <text x="46" y="316" font-size="12" fill="#6b7280">· Потребують сторонній API</text>
  <text x="46" y="334" font-size="12" fill="#c0392b">· Ризик: лаг та зависання</text>
  
  <rect x="44" y="344" width="176" height="62" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="52" y="362" font-size="12" font-weight="700" fill="#c0392b">КОНТРОЛЬ ПЕРЕБІРКОЮ:</text>
  <text x="52" y="380" font-size="12" fill="#2457d6">· Проходять через семафор</text>
  <text x="52" y="396" font-size="12" fill="#c0392b">· Надлишок ➔ відхилення</text>

  <!-- КОЛОНКА 2: Архітектура Bulkhead -->
  <rect x="254" y="68" width="446" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="266" y="80" width="210" height="22" rx="3" fill="#2457d6"/>
  <text x="371" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ВЕБ-СЕРВЕР З ПЕРЕБІРКАМИ</text>
  <text x="490" y="96" font-size="12" font-weight="700" fill="#2457d6">Ізоляція пулу воркерів</text>

  <!-- Сектор А: Захищена локальна зона -->
  <rect x="266" y="110" width="422" height="136" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="278" y="128" font-size="12" font-weight="700" fill="#27ae60">1. Захищена зона локальних запитів (C_loc = 170 воркерів)</text>

  <rect x="278" y="136" width="398" height="22" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="477" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Пул локальних воркерів: 170 / 170 доступні (100% захист)</text>

  <text x="278" y="174" font-size="12" fill="#1a1a1a">· Повна ізоляція: зовнішні мережеві виклики сюди НЕ допускаються</text>
  <text x="278" y="192" font-size="12" fill="#27ae60">· Liveness probe /health відповідає за 1 мс — k8s не перезапускає под</text>
  <text x="278" y="210" font-size="12" fill="#1a1a1a">· Запити каталогу працюють без черг із пам'яті та реплік БД</text>
  <text x="278" y="228" font-size="12" font-weight="700" fill="#27ae60">✓ Нульовий вплив чужих збоїв: локальний SLA збережено</text>

  <!-- Сектор Б: Семафорний сектор шлюзу -->
  <rect x="266" y="254" width="422" height="162" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="278" y="272" font-size="12" font-weight="700" fill="#2457d6">2. Лімітований семафорний сектор шлюзу (C_ext = 30 слотів)</text>

  <rect x="278" y="280" width="220" height="22" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="388" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Семафор: 30 / 30 зайнято</text>

  <rect x="508" y="280" width="168" height="22" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="592" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Черга: 5 / 5 повна</text>

  <text x="278" y="318" font-size="12" fill="#1a1a1a">· Асинхронний семафор acquire(): обмежує паралелізм до maxConcurrent</text>
  <text x="278" y="336" font-size="12" fill="#c0392b">· Усі 30 слотів зависли в очікуванні сокета — АЛЕ лише 30, не більше!</text>
  <text x="278" y="354" font-size="12" fill="#1a1a1a">· Черга переповнена ➔ викидається виняток BulkheadFullError</text>
  
  <rect x="278" y="364" width="398" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="477" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Fail-Fast: 31-й виклик миттєво повертає 503 / Fallback (0.1 мс)</text>
  
  <text x="278" y="406" font-size="12" font-weight="700" fill="#2457d6">Захисна стіна перебірки блокує розповсюдження затримок</text>

  <!-- КОЛОНКА 3: Цільові системи -->
  <rect x="714" y="68" width="222" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="726" y="80" width="140" height="22" rx="3" fill="#1a1a1a"/>
  <text x="796" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ЦІЛЬОВІ СЕРВІСИ</text>
  <text x="726" y="120" font-size="13" font-weight="700" fill="#1a1a1a">Реакція систем</text>

  <!-- Ціль 1: Внутрішні БД -->
  <rect x="726" y="132" width="198" height="114" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="736" y="152" font-size="12" font-weight="700" fill="#27ae60">Внутрішні ресурси БД</text>
  <text x="736" y="172" font-size="12" fill="#1a1a1a">· PostgreSQL / Redis Cache</text>
  <text x="736" y="190" font-size="12" fill="#27ae60">· Затримка: 1–3 мс</text>
  <text x="736" y="208" font-size="12" fill="#27ae60">· 100% доступність</text>
  <text x="736" y="226" font-size="12" fill="#6b7280">· Жодних черг чи витоків</text>
  <text x="736" y="240" font-size="12" font-weight="700" fill="#27ae60">Стабільна робота</text>

  <!-- Ціль 2: Сторонній API -->
  <rect x="726" y="258" width="198" height="158" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="736" y="278" font-size="12" font-weight="700" fill="#c0392b">Сторонній платіжний API</text>
  <text x="736" y="298" font-size="12" fill="#c0392b">· Глибока деградація</text>
  <text x="736" y="316" font-size="12" fill="#c0392b">· Затримка: 45–60 с (лаг)</text>
  <text x="736" y="334" font-size="12" fill="#6b7280">· Втрата пакетів, мовчання</text>
  <text x="736" y="352" font-size="12" fill="#1a1a1a">· Відсік ізольовано!</text>
  
  <rect x="734" y="362" width="182" height="44" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="742" y="380" font-size="12" font-weight="700" fill="#c0392b">ЛОКАЛІЗАЦІЯ АВАРІЇ:</text>
  <text x="742" y="396" font-size="12" fill="#27ae60">Втрати обмежено 30 слотами</text>

  <!-- НИЖНЯ ПАНЕЛЬ: Математика та Архітектурний висновок -->
  <rect x="24" y="440" width="912" height="80" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="36" y="450" width="180" height="20" rx="3" fill="#2457d6"/>
  <text x="126" y="464" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">АРХІТЕКТУРНИЙ ВИСНОВОК</text>
  <text x="226" y="465" font-size="12" font-weight="700" fill="#1a1a1a">Математика Bulkhead: C_pool = C_loc + C_ext та стримування закону Літтла</text>
  <text x="36" y="488" font-size="12" fill="#1a1a1a">· Пробоїна в одному відсіку не топить судно: семафор обмежує L_ext ≤ 30, захищаючи спільний пул від захоплення</text>
  <text x="36" y="508" font-size="12" fill="#27ae60">· Ефект відсікання: швидкі локальні сервіси мають 170 воркерів, а зовнішній надлишок миттєво відхиляється (0.1 мс)</text>

</svg>
