<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Архітектура інтеграційного тестового стенду та хаос-інжекції</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Верифікація гарантій At-Least-Once, детектора ідемпотентності та захисту від чужих аварій</text>

  <!-- ==================== БЛОК 1: ЛОКАЛЬНА БД ==================== -->
  <rect x="24" y="72" width="212" height="352" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="32" y="80" width="196" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="130" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">ЛОКАЛЬНА БД (PostgreSQL)</text>

  <!-- Підблок 1.1: Схема outbox_events -->
  <rect x="32" y="112" width="196" height="140" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="42" y="130" font-size="12" font-weight="700" fill="#1a1a1a">Таблиця outbox_events</text>
  <line x1="38" y1="138" x2="222" y2="138" stroke="#d0d7de" stroke-width="1"/>
  <text x="42" y="156" font-size="12" fill="#1a1a1a">· id: UUID (PK)</text>
  <text x="42" y="174" font-size="12" fill="#2457d6">· idempotency_key (UQ)</text>
  <text x="42" y="192" font-size="12" fill="#1a1a1a">· payload: JSONB</text>
  <text x="42" y="210" font-size="12" fill="#1a1a1a">· attempts, max_attempts</text>
  <text x="42" y="228" font-size="12" fill="#6b7280">· locked_at, locked_by</text>
  <text x="42" y="244" font-size="12" fill="#6b7280">· next_retry_at (timestamp)</text>

  <!-- Підблок 1.2: Частковий індекс -->
  <rect x="32" y="260" width="196" height="74" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="42" y="278" font-size="12" font-weight="700" fill="#27ae60">Частковий індекс</text>
  <text x="42" y="296" font-size="12" fill="#1a1a1a">idx_outbox_active_fetch</text>
  <text x="42" y="314" font-size="12" fill="#6b7280">WHERE status IN</text>
  <text x="42" y="328" font-size="12" fill="#27ae60">('PENDING', 'PROCESSING')</text>

  <!-- Підблок 1.3: Статуси -->
  <rect x="32" y="342" width="196" height="74" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="42" y="360" font-size="12" font-weight="700" fill="#1a1a1a">Статуси записів:</text>
  <text x="42" y="378" font-size="12" fill="#2457d6">PENDING ➔ PROCESSING</text>
  <text x="42" y="396" font-size="12" fill="#27ae60">PROCESSED (успіх: 9)</text>
  <text x="42" y="410" font-size="12" fill="#c0392b">DEAD_LETTER (DLQ: 1)</text>

  <!-- Зв'язки між БД та Воркерами -->
  <line x1="260" y1="146" x2="236" y2="146" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="236" y1="222" x2="260" y2="222" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="260" y1="360" x2="236" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== БЛОК 2: ПУЛ ВОРКЕРІВ ==================== -->
  <rect x="260" y="72" width="264" height="352" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="268" y="80" width="248" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="392" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">ПУЛ ВОРКЕРІВ (Transactional Outbox)</text>

  <!-- Воркер 1 -->
  <rect x="268" y="112" width="248" height="68" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="278" y="130" font-size="12" font-weight="700" fill="#2457d6">Екземпляр: Worker-1 (XID 4052)</text>
  <text x="278" y="148" font-size="12" fill="#1a1a1a">Вибірка: SKIP LOCKED (пакет 1)</text>
  <text x="278" y="166" font-size="12" fill="#6b7280">locked_by = 'worker-1' (оренда)</text>

  <!-- Воркер 2 -->
  <rect x="268" y="188" width="248" height="68" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="278" y="206" font-size="12" font-weight="700" fill="#2457d6">Екземпляр: Worker-2 (XID 4053)</text>
  <text x="278" y="224" font-size="12" fill="#1a1a1a">Вибірка: SKIP LOCKED (пакет 2)</text>
  <text x="278" y="242" font-size="12" fill="#6b7280">Паралельний розбір без блокувань</text>

  <!-- Захищений HTTP-клієнт -->
  <rect x="268" y="264" width="248" height="152" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="274" y="270" width="236" height="20" rx="3" fill="#f4f6f8"/>
  <text x="392" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Захищений HTTP-клієнт</text>
  <text x="278" y="306" font-size="12" font-weight="700" fill="#2457d6">• Idempotency-Key:</text>
  <text x="278" y="324" font-size="12" fill="#1a1a1a">  детермінований заголовок запиту</text>
  <text x="278" y="344" font-size="12" font-weight="700" fill="#2457d6">• Full Jitter Backoff:</text>
  <text x="278" y="362" font-size="12" fill="#1a1a1a">  t_sleep = random(0, Cap)</text>
  <text x="278" y="382" font-size="12" font-weight="700" fill="#c0392b">• Карантин DLQ:</text>
  <text x="278" y="400" font-size="12" fill="#1a1a1a">  ізоляція 400 помилок без повторів</text>

  <!-- Зв'язки між Воркерами та Шлюзом -->
  <line x1="524" y1="288" x2="554" y2="288" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="554" y1="328" x2="524" y2="328" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- ==================== БЛОК 3: ІНЖЕКТОР ХАОСУ ==================== -->
  <rect x="554" y="72" width="382" height="114" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="562" y="80" width="366" height="24" rx="4" fill="#c0392b"/>
  <text x="745" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ІНЖЕКТОР ХАОСУ (Керовані аномалії стенду)</text>

  <text x="566" y="122" font-size="12" font-weight="700" fill="#c0392b">• chaos_latency_s = 0.030 с:</text>
  <text x="760" y="122" font-size="12" fill="#1a1a1a">тест таймаутів сокета</text>

  <text x="566" y="140" font-size="12" font-weight="700" fill="#c0392b">• chaos_fail_rate = 50%:</text>
  <text x="730" y="140" font-size="12" fill="#1a1a1a">інжекція 503 помилок</text>

  <text x="566" y="158" font-size="12" font-weight="700" fill="#c0392b">• drop_response_keys:</text>
  <text x="712" y="158" font-size="12" fill="#1a1a1a">скидання TCP після запису</text>

  <text x="566" y="176" font-size="12" font-weight="700" fill="#c0392b">• fatal_event_types:</text>
  <text x="706" y="176" font-size="12" fill="#1a1a1a">інжекція 400 для тесту DLQ</text>

  <!-- Стрілка інжекції від хаосу до дублера -->
  <line x1="745" y1="186" x2="745" y2="198" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- ==================== БЛОК 4: СЕРВЕР-ДУБЛЕР ==================== -->
  <rect x="554" y="198" width="382" height="226" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="562" y="206" width="366" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="745" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">СЕРВЕР-ДУБЛЕР СТОРОННЬОГО API (Mock Service)</text>

  <!-- Підблок 4.1: Детектор ідемпотентності -->
  <rect x="562" y="238" width="366" height="104" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="572" y="256" font-size="12" font-weight="700" fill="#27ae60">Реєстр ідемпотентності (Idempotency Registry)</text>
  <text x="572" y="274" font-size="12" fill="#1a1a1a">1. Отримано Idempotency-Key ➔ перевірка в кеші:</text>
  <text x="572" y="292" font-size="12" fill="#27ae60">· Новий ключ ➔ списання коштів + кешування 200</text>
  <text x="572" y="310" font-size="12" fill="#2457d6">· Відомий ключ ➔ дублікат фіксовано, повернено 200 OK</text>
  <text x="572" y="328" font-size="12" font-weight="700" fill="#27ae60">Результат: 0 повторних списань (мутації ідемпотентні)</text>

  <!-- Підблок 4.2: Баланс операцій -->
  <rect x="562" y="350" width="366" height="66" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="572" y="368" font-size="12" font-weight="700" fill="#1a1a1a">Фактичний баланс експерименту:</text>
  <text x="572" y="386" font-size="12" fill="#2457d6">Всього HTTP-викликів: 13 (9 первинних + 4 ретраї)</text>
  <text x="572" y="404" font-size="12" fill="#27ae60">Успішних мутацій: 9 | Втрачено: 0 | У DLQ: 1</text>

  <!-- ==================== НИЖНІ КАРТКИ: ПІДСУМКИ ВЕРИФІКАЦІЇ ==================== -->
  <!-- Ліва картка -->
  <rect x="24" y="438" width="446" height="68" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="36" y="458" font-size="12" font-weight="700" fill="#27ae60">Гарантія доставки «принаймні один раз» (At-Least-Once):</text>
  <text x="36" y="478" font-size="12" fill="#1a1a1a">0 втрачених подій при аваріях TCP. Отруйну пігулку ізольовано в DLQ.</text>
  <text x="36" y="496" font-size="12" font-weight="700" fill="#27ae60">N_lost = 0 | Всі 9 валідних подій гарантовано доставлено</text>

  <!-- Права картка -->
  <rect x="490" y="438" width="446" height="68" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="502" y="458" font-size="12" font-weight="700" fill="#2457d6">Бізнес-семантика Exactly-Once завдяки Idempotency-Key:</text>
  <text x="502" y="478" font-size="12" fill="#1a1a1a">4 повторні спроби через 503 не викликали дублювання операцій.</text>
  <text x="502" y="496" font-size="12" font-weight="700" fill="#2457d6">N_double_mutations = 0 | Повний захист від чужих аварій</text>
</svg>
