<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Конверт бюджету дедлайну: гранична межа повторних спроб</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Сума мережевих таймаутів і пауз відступу обмежує безпечне число спроб до M = 4 на фоні дедлайну 5000 мс</text>

  <!-- ==================== ЛІВА ЧАСТИНА: ГРАФІК БЮДЖЕТУ ДЕДЛАЙНУ ==================== -->
  <rect x="24" y="74" width="596" height="424" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Червона зона перевищення дедлайну (фонова заливка вище 5000 мс) -->
  <rect x="80" y="110" width="510" height="120" fill="#fdecea" fill-opacity="0.6"/>

  <!-- Зелена зона безпечного бюджету (нижче 5000 мс) -->
  <rect x="80" y="230" width="510" height="200" fill="#e9f7ef" fill-opacity="0.3"/>

  <!-- Горизонтальні сіткові лінії та підписи осі Y (Час) -->
  <line x1="80" y1="430" x2="590" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <text x="74" y="434" text-anchor="end" font-size="12" fill="#6b7280">0</text>

  <line x1="80" y1="390" x2="590" y2="390" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="74" y="394" text-anchor="end" font-size="12" fill="#6b7280">1000</text>

  <line x1="80" y1="350" x2="590" y2="350" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="74" y="354" text-anchor="end" font-size="12" fill="#6b7280">2000</text>

  <line x1="80" y1="310" x2="590" y2="310" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="74" y="314" text-anchor="end" font-size="12" fill="#6b7280">3000</text>

  <line x1="80" y1="270" x2="590" y2="270" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="74" y="274" text-anchor="end" font-size="12" fill="#6b7280">4000</text>

  <!-- Лінія жорсткого дедлайну клієнта 5000 мс -->
  <line x1="80" y1="230" x2="590" y2="230" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="74" y="234" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b">5000</text>
  <rect x="88" y="214" width="226" height="18" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="201" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Жорсткий дедлайн: T_budget = 5000 мс</text>

  <line x1="80" y1="190" x2="590" y2="190" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="74" y="194" text-anchor="end" font-size="12" fill="#6b7280">6000</text>

  <line x1="80" y1="150" x2="590" y2="150" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="74" y="154" text-anchor="end" font-size="12" fill="#c0392b">7000</text>

  <!-- Вісь Y -->
  <line x1="80" y1="430" x2="80" y2="102" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="74" y="96" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">Час (мс)</text>

  <!-- Вісь X (Кількість спроб M) -->
  <line x1="75" y1="430" x2="585" y2="430" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="594" y="434" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">M</text>

  <!-- Вертикальна межа відсікання M = 4 -->
  <line x1="465" y1="430" x2="465" y2="104" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,4"/>
  <rect x="420" y="86" width="90" height="20" rx="3" fill="#c0392b"/>
  <text x="465" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">МЕЖА M = 4</text>

  <!-- -------------------- СТОВПЧИКИ НАКОПИЧЕНОГО ЧАСУ -------------------- -->

  <!-- Стовпчик 1: M = 1 (T = 800 мс) -->
  <rect x="113" y="398" width="54" height="32" rx="3" fill="#2457d6"/>
  <text x="140" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">800 мс</text>
  <text x="140" y="374" text-anchor="middle" font-size="12" fill="#27ae60">+4200 мс</text>
  <text x="140" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">M = 1</text>

  <!-- Стовпчик 2: M = 2 (T = 1800 мс: мережа 1600 + пауза 200) -->
  <rect x="203" y="366" width="54" height="64" rx="3" fill="#2457d6"/>
  <rect x="203" y="358" width="54" height="8" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="230" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">1800 мс</text>
  <text x="230" y="334" text-anchor="middle" font-size="12" fill="#27ae60">+3200 мс</text>
  <text x="230" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">M = 2</text>

  <!-- Стовпчик 3: M = 3 (T = 3000 мс: мережа 2400 + пауза 600) -->
  <rect x="293" y="334" width="54" height="96" rx="3" fill="#2457d6"/>
  <rect x="293" y="310" width="54" height="24" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="320" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">3000 мс</text>
  <text x="320" y="286" text-anchor="middle" font-size="12" fill="#27ae60">+2000 мс</text>
  <text x="320" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">M = 3</text>

  <!-- Стовпчик 4: M = 4 (T = 4600 мс: мережа 3200 + пауза 1400) - ГРАНИЧНИЙ БЕЗПЕЧНИЙ -->
  <rect x="383" y="302" width="54" height="128" rx="3" fill="#2457d6"/>
  <rect x="383" y="246" width="54" height="56" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="410" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">4600 мс</text>
  <text x="410" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">+400 мс (запас)</text>
  <text x="410" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">M = 4 ✓</text>

  <!-- Стовпчик 5: M = 5 (T = 7000 мс: мережа 4000 + пауза 3000) - ЗРИВ ДЕДЛАЙНУ! -->
  <rect x="493" y="270" width="54" height="160" rx="3" fill="#2457d6"/>
  <rect x="493" y="230" width="54" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="493" y="150" width="54" height="80" rx="3" fill="#c0392b"/>
  <text x="520" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">7000 мс</text>
  <text x="520" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">-2000 мс (зрив!)</text>
  <text x="520" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">M = 5 ✖</text>

  <!-- Легенда графіка -->
  <rect x="100" y="462" width="16" height="16" rx="2" fill="#2457d6"/>
  <text x="122" y="475" font-size="12" fill="#1a1a1a">Мережа (M · 800 мс)</text>

  <rect x="265" y="462" width="16" height="16" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="287" y="475" font-size="12" fill="#1a1a1a">Паузи відступу</text>

  <rect x="410" y="462" width="16" height="16" rx="2" fill="#c0392b"/>
  <text x="432" y="475" font-size="12" font-weight="700" fill="#c0392b">Зрив дедлайну (> 5000 мс)</text>

  <!-- ==================== ПРАВА ЧАСТИНА: МАТЕМАТИЧНИЙ АНАЛІЗ ==================== -->

  <!-- Картка 1: Формула бюджету -->
  <rect x="636" y="74" width="300" height="126" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="648" y="84" width="160" height="20" rx="3" fill="#2457d6"/>
  <text x="728" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ФОРМУЛА БЮДЖЕТУ</text>
  <text x="816" y="99" font-size="12" font-weight="700" fill="#2457d6">T ≤ T_budget</text>

  <rect x="648" y="112" width="276" height="76" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="658" y="130" font-size="12" fill="#1a1a1a">T_вит = M·T_out + ∑ S_k</text>
  <text x="658" y="148" font-size="12" fill="#6b7280">T_out = 800 мс, t_base = 200 мс, b = 2</text>
  <text x="658" y="166" font-size="12" fill="#1a1a1a">Кожна спроба експоненційно</text>
  <text x="658" y="182" font-size="12" fill="#2457d6">спалює часовий ліміт клієнта</text>

  <!-- Картка 2: Безпечна зона -->
  <rect x="636" y="212" width="300" height="130" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="648" y="222" width="160" height="20" rx="3" fill="#27ae60"/>
  <text x="728" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">БЕЗПЕЧНА ЗОНА (M ≤ 4)</text>
  <text x="816" y="237" font-size="12" font-weight="700" fill="#27ae60">Запас SLA</text>

  <rect x="648" y="250" width="276" height="80" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="658" y="268" font-size="12" fill="#1a1a1a">M = 3: запас 2000 мс (комфортно)</text>
  <text x="658" y="286" font-size="12" fill="#1a1a1a">M = 4: запас 400 мс (критично!)</text>
  <text x="658" y="304" font-size="12" fill="#6b7280">Операція вкладається у дедлайн</text>
  <text x="658" y="322" font-size="12" font-weight="700" fill="#27ae60">✓ M_max = 4 — надійний ліміт</text>

  <!-- Картка 3: Пастка M = 5 -->
  <rect x="636" y="354" width="300" height="144" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="648" y="364" width="160" height="20" rx="3" fill="#c0392b"/>
  <text x="728" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ЗОНА ЗРИВУ (M = 5)</text>
  <text x="816" y="379" font-size="12" font-weight="700" fill="#c0392b">Аварія 504</text>

  <rect x="648" y="392" width="276" height="94" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="658" y="412" font-size="12" fill="#1a1a1a">M = 5: T = 7000 мс (> 5000 мс)</text>
  <text x="658" y="430" font-size="12" fill="#c0392b">Хвіст розподілу пробиває стелю</text>
  <text x="658" y="448" font-size="12" fill="#6b7280">Шлюз розірве зв'язок на 5000 мс,</text>
  <text x="658" y="466" font-size="12" fill="#6b7280">а 5-та спроба згорить даремно!</text>
  <text x="658" y="482" font-size="12" font-weight="700" fill="#c0392b">⚠ Ліміт M ≥ 5 неприпустимий</text>

</svg>
