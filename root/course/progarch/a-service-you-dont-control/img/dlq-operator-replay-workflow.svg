<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Життєвий цикл карантину: ізоляція отруйного запису та ручний переграш</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Вичерпання ліміту повторів витісняє подію в DLQ, захищаючи чергу від затору до виправлення інженером</text>

  <!-- ==================== ЕТАП 1: РОБОЧА ЧЕРГА OUTBOX ==================== -->
  <rect x="30" y="80" width="200" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">1. Робоча черга Outbox</text>
  
  <rect x="45" y="116" width="170" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="130" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">status: PENDING</text>

  <text x="45" y="164" font-size="12" fill="#1a1a1a">Вичитування воркером</text>
  <text x="45" y="184" font-size="12" fill="#c0392b">HTTP 400 Bad Request</text>
  <text x="45" y="204" font-size="12" fill="#6b7280">Невалідне поле payload</text>
  <text x="45" y="226" font-size="12" font-weight="700" fill="#c0392b">Спроби: 5 / 5 (вичерпано)</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="230" y1="172" x2="262" y2="172" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="250" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Збій</text>

  <!-- ==================== ЕТАП 2: КАРАНТИН (DLQ) ==================== -->
  <rect x="270" y="80" width="200" height="185" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">2. Карантин: DLQ</text>

  <rect x="285" y="116" width="170" height="26" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="370" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">status: DEAD_LETTER</text>

  <text x="285" y="164" font-size="12" fill="#1a1a1a">Отруйний запис вилучено</text>
  <text x="285" y="184" font-size="12" fill="#27ae60">Чергу Outbox розблоковано</text>
  <text x="285" y="204" font-size="12" fill="#6b7280">Збережено стек і причину</text>
  <text x="285" y="226" font-size="12" fill="#c0392b">Очікування втручання</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="470" y1="172" x2="502" y2="172" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="490" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Алерт</text>

  <!-- ==================== ЕТАП 3: СПОВІЩЕННЯ ТА АУДИТ ==================== -->
  <rect x="510" y="80" width="200" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="610" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">3. Сповіщення й аудит</text>

  <rect x="525" y="116" width="170" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="610" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Alertmanager / Slack</text>

  <text x="525" y="164" font-size="12" fill="#c0392b">Метрика: dlq_depth &gt; 0</text>
  <text x="525" y="184" font-size="12" fill="#1a1a1a">Сповіщення чергового</text>
  <text x="525" y="204" font-size="12" fill="#6b7280">Аналіз стеку викликів</text>
  <text x="525" y="226" font-size="12" fill="#1a1a1a">Локалізація помилки схеми</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="710" y1="172" x2="742" y2="172" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="730" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Розбір</text>

  <!-- ==================== ЕТАП 4: РУЧНЕ ВИПРАВЛЕННЯ ==================== -->
  <rect x="750" y="80" width="180" height="185" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="840" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">4. Виправлення JSON</text>

  <rect x="760" y="116" width="160" height="26" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="840" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Payload Correction</text>

  <text x="762" y="164" font-size="12" fill="#1a1a1a">Оператор редагує дані</text>
  <text x="762" y="184" font-size="12" fill="#27ae60">Валідний формат JSON</text>
  <text x="762" y="204" font-size="12" fill="#6b7280">Збереження в аудит-лог</text>
  <text x="762" y="226" font-size="12" fill="#27ae60">Готово до переграшу</text>

  <!-- Стрілка 4 -> 5 (Вниз) -->
  <line x1="840" y1="265" x2="840" y2="292" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="848" y="284" font-size="12" font-weight="700" fill="#27ae60">Replay</text>

  <!-- ==================== ЕТАП 5: ОПЕРАТОРСЬКИЙ ПЕРЕГРАШ ==================== -->
  <rect x="510" y="300" width="420" height="190" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="720" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">5. Операторський переграш (DLQ Replay)</text>

  <rect x="530" y="340" width="380" height="44" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="542" y="358" font-size="12" font-family="monospace" fill="#1a1a1a">UPDATE outbox SET status = &apos;PENDING&apos;,</text>
  <text x="542" y="374" font-size="12" font-family="monospace" fill="#27ae60">       attempts = 0, payload = :corrected WHERE id = :id</text>

  <text x="530" y="408" font-size="12" fill="#1a1a1a">Атомарна транзакція повернення в робочий статус</text>
  <text x="530" y="428" font-size="12" fill="#6b7280">Збереження оригінального ключа ідемпотентності</text>
  <text x="530" y="448" font-size="12" fill="#2457d6">Скидання лічильника спроб (attempts = 0)</text>
  <text x="530" y="468" font-size="12" fill="#27ae60">Запис у DLQ отримує статус REPLAYED</text>

  <!-- Стрілка 5 -> 6 (Вліво) -->
  <line x1="510" y1="395" x2="478" y2="395" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="494" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Черга</text>

  <!-- ==================== ЕТАП 6: ПОВТОРНА ОБРОБКА ТА ДОСТАВКА ==================== -->
  <rect x="30" y="300" width="440" height="190" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="250" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">6. Повторне виконання Outbox Worker</text>

  <rect x="50" y="340" width="400" height="44" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="62" y="358" font-size="12" font-family="monospace" fill="#2457d6">POST /api/v1/charge (Idempotency-Key: pay-981)</text>
  <text x="62" y="374" font-size="12" font-family="monospace" font-weight="700" fill="#27ae60">Відповідь сторонньої служби: 200 OK</text>

  <text x="50" y="408" font-size="12" fill="#1a1a1a">Вичитування: SELECT ... FOR UPDATE SKIP LOCKED</text>
  <text x="50" y="428" font-size="12" fill="#27ae60">Успішна доставка без ризику дублювання платежу</text>
  <text x="50" y="448" font-size="12" fill="#6b7280">Оновлення локального стану: status = DELIVERED</text>
  <text x="50" y="468" font-size="12" font-weight="700" fill="#27ae60">Асинхронний шов збережено, стан домену узгоджено</text>
</svg>
