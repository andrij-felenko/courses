<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Анатомія важкого холодного старту та шторму повторів S3</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Перевірка цілісності трильйонів об'єктів блокується лавиною неконтрольованих клієнтських ретраїв</text>

  <!-- Колонка 1: Важкий холодний старт -->
  <rect x="40" y="96" width="270" height="344" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="56" y="112" width="238" height="32" rx="4" fill="#6b7280"/>
  <text x="175" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="white">1. Важкий холодний старт S3</text>

  <rect x="56" y="156" width="238" height="110" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="175" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Масштаб накопичених даних</text>
  <text x="175" y="200" font-size="12" text-anchor="middle" fill="#1a1a1a">Система не перезапускалася роками;</text>
  <text x="175" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">обсяг сховища зріс у тисячі разів</text>
  <text x="175" y="240" font-size="12" text-anchor="middle" fill="#6b7280">(трильйони метаданих у бакетах)</text>

  <rect x="56" y="278" width="238" height="142" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="175" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Валідація цілісності при старті</text>
  <text x="175" y="322" font-size="12" text-anchor="middle" fill="#1a1a1a">Під час завантаження підсистема індексів</text>
  <text x="175" y="342" font-size="12" text-anchor="middle" fill="#1a1a1a">мусить перевірити всі записи на диску;</text>
  <text x="175" y="364" font-size="12" text-anchor="middle" fill="#1a1a1a">процес вимагає годин роботи процесора</text>
  <text x="175" y="386" font-size="12" text-anchor="middle" fill="#c0392b">і займає всю смугу введення-виведення</text>

  <!-- Стрілка від колонки 1 до колонки 2 -->
  <line x1="310" y1="268" x2="335" y2="268" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Колонка 2: Метастабільний збій і Retry Storm -->
  <rect x="345" y="96" width="270" height="344" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="361" y="112" width="238" height="32" rx="4" fill="#c0392b"/>
  <text x="480" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="white">2. Метастабільна пастка (Retry Storm)</text>

  <rect x="361" y="156" width="238" height="110" rx="4" fill="white" stroke="#e0b4b0"/>
  <text x="480" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Шквал повторних запитів</text>
  <text x="480" y="200" font-size="12" text-anchor="middle" fill="#1a1a1a">Тисячі клієнтських систем не чекають</text>
  <text x="480" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">й одночасно шлють агресивні повтори</text>
  <text x="480" y="240" font-size="12" text-anchor="middle" fill="#c0392b">(синхронні ретраї без джитера)</text>

  <rect x="361" y="278" width="238" height="142" rx="4" fill="white" stroke="#e0b4b0"/>
  <text x="480" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Самопідтримуваний колапс</text>
  <text x="480" y="322" font-size="12" text-anchor="middle" fill="#1a1a1a">Щойно сервер запускається,</text>
  <text x="480" y="342" font-size="12" text-anchor="middle" fill="#1a1a1a">його накриває лавина відкладених дій;</text>
  <text x="480" y="364" font-size="12" text-anchor="middle" fill="#1a1a1a">черги сокетів переповнюються,</text>
  <text x="480" y="386" font-size="12" text-anchor="middle" fill="#c0392b">і вузол падає знову (метастабільність)</text>

  <!-- Стрілка від колонки 2 до колонки 3 -->
  <line x1="615" y1="268" x2="640" y2="268" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Колонка 3: Вихід із глухого кута -->
  <rect x="650" y="96" width="270" height="344" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="666" y="112" width="238" height="32" rx="4" fill="#27ae60"/>
  <text x="785" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="white">3. Механізм виходу зі збою</text>

  <rect x="666" y="156" width="238" height="110" rx="4" fill="white" stroke="#bce7cf"/>
  <text x="785" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Повне відсікання вхідного трафіку</text>
  <text x="785" y="200" font-size="12" text-anchor="middle" fill="#1a1a1a">Шлюзи API повністю закривають</text>
  <text x="785" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">для зовнішніх клієнтських запитів;</text>
  <text x="785" y="240" font-size="12" text-anchor="middle" fill="#2457d6">серверам дають спокій на ініціалізацію</text>

  <rect x="666" y="278" width="238" height="142" rx="4" fill="white" stroke="#bce7cf"/>
  <text x="785" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Ступеневе ввімкнення (Ramping)</text>
  <text x="785" y="322" font-size="12" text-anchor="middle" fill="#1a1a1a">Трафік пускають порціями: 5% → 20% → 100%;</text>
  <text x="785" y="342" font-size="12" text-anchor="middle" fill="#1a1a1a">клієнти переходять на затримки</text>
  <text x="785" y="364" font-size="12" text-anchor="middle" fill="#2457d6">з експоненційним випадковим джитером;</text>
  <text x="785" y="386" font-size="12" text-anchor="middle" fill="#27ae60">система повертається до стабільності</text>
</svg>
