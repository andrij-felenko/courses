<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Архітектура приймача вебхуків: розрив прийому та обробки (Ingest-Process Split)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Швидка верифікація та синхронний Fast Ack проти асинхронної буферизації та ідемпотентного воркера</text>

  <!-- ==================== КОЛОНКА 1: ЗОВНІШНЯ СЛУЖБА ==================== -->
  <rect x="20" y="75" width="165" height="340" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="102" y="98" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зовнішня служба</text>
  <text x="102" y="116" font-size="10" font-weight="600" fill="#c0392b" text-anchor="middle">Stripe / GitHub / Банк</text>

  <rect x="28" y="126" width="149" height="274" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="102" y="148" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">Вхідний вебхук</text>
  <text x="36" y="172" font-size="10" font-weight="700" fill="#1a1a1a">• HTTP POST запит:</text>
  <text x="42" y="188" font-size="10" fill="#1a1a1a">Raw JSON payload</text>
  <text x="36" y="210" font-size="10" font-weight="700" fill="#1a1a1a">• HMAC-підпис:</text>
  <text x="42" y="226" font-size="10" fill="#6b7280">X-Signature-SHA256</text>
  <text x="36" y="248" font-size="10" font-weight="700" fill="#1a1a1a">• Таймстемп події:</text>
  <text x="42" y="264" font-size="10" fill="#6b7280">X-Timestamp: 171800...</text>
  <text x="36" y="290" font-size="10" font-weight="700" fill="#c0392b">• Жорсткий таймаут:</text>
  <text x="42" y="306" font-size="10" fill="#c0392b">Очікування 1–2 секунди</text>
  <text x="36" y="328" font-size="10" font-weight="700" fill="#c0392b">• Ризик затримки:</text>
  <text x="42" y="344" font-size="10" fill="#c0392b">Лавинні повтори (Retries)</text>
  <text x="42" y="360" font-size="10" fill="#6b7280">при таймауті або 5xx</text>
  <text x="36" y="382" font-size="10" font-weight="700" fill="#27ae60">Очікує: 200 OK / 202</text>

  <!-- СТРІЛКИ МІЖ КОЛОНКОЮ 1 І 2 -->
  <text x="207" y="173" font-size="10" font-weight="700" fill="#2457d6" text-anchor="middle">POST</text>
  <line x1="177" y1="180" x2="226" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <text x="207" y="233" font-size="10" font-weight="700" fill="#27ae60" text-anchor="middle">200 OK</text>
  <line x1="230" y1="240" x2="181" y2="240" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <text x="207" y="278" font-size="10" font-weight="700" fill="#c0392b" text-anchor="middle">401/400</text>
  <line x1="230" y1="285" x2="181" y2="285" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>


  <!-- ==================== КОЛОНКА 2: ШВИДКИЙ ПРИЙМАЧ ==================== -->
  <rect x="230" y="75" width="245" height="340" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="352" y="98" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. Швидкий прийом (Ingest)</text>
  <text x="352" y="116" font-size="10" font-weight="600" fill="#2457d6" text-anchor="middle">Синхронний контур • Бюджет &lt; 50 мс</text>

  <!-- Блок 2A: Безпека -->
  <rect x="240" y="126" width="225" height="78" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="248" y="144" font-size="11" font-weight="700" fill="#2457d6">Крок 1. Верифікація безпеки</text>
  <text x="248" y="162" font-size="10" fill="#1a1a1a">• Перевірка HMAC (Secret + Raw Body)</text>
  <text x="248" y="178" font-size="10" fill="#1a1a1a">• Контроль таймстемпу (±300 с tolerance)</text>
  <text x="248" y="194" font-size="10" fill="#c0392b">Захист від підробки та Replay-атак</text>

  <!-- Блок 2B: Буферизація -->
  <rect x="240" y="218" width="225" height="82" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="248" y="236" font-size="11" font-weight="700" fill="#2457d6">Крок 2. Буферизація події</text>
  <text x="248" y="254" font-size="10" fill="#1a1a1a">• Вилучення зовнішнього event_id</text>
  <text x="248" y="270" font-size="10" fill="#1a1a1a">• Атомарний запис у чергу / Inbox</text>
  <text x="248" y="286" font-size="10" fill="#6b7280">• Збереження сирого Raw JSON</text>
  <text x="248" y="296" font-size="10" fill="#27ae60">Жодної важкої бізнес-обробки!</text>

  <!-- Блок 2C: Fast Ack -->
  <rect x="240" y="314" width="225" height="86" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="248" y="332" font-size="11" font-weight="700" fill="#27ae60">Крок 3. Негайний Fast Ack</text>
  <text x="248" y="350" font-size="10" fill="#1a1a1a">• Повернення 200 OK або 202 Accepted</text>
  <text x="248" y="366" font-size="10" fill="#1a1a1a">• Відповідь за 10–30 мілісекунд</text>
  <text x="248" y="382" font-size="10" fill="#27ae60">• Запобігає retry-штормам провайдера</text>
  <text x="248" y="394" font-size="10" fill="#6b7280">З'єднання з відправником закрито</text>

  <!-- СТРІЛКА МІЖ КОЛОНКОЮ 2 І 3 -->
  <text x="490" y="252" font-size="10" font-weight="700" fill="#2457d6" text-anchor="middle">Push</text>
  <line x1="465" y1="259" x2="501" y2="259" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>


  <!-- ==================== КОЛОНКА 3: БУФЕР / ЧЕРГА ==================== -->
  <rect x="505" y="75" width="165" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="587" y="98" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. Буфер / Черга</text>
  <text x="587" y="116" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle">Асинхронний розрив</text>

  <rect x="515" y="126" width="145" height="274" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="587" y="148" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Черга подій (Inbox)</text>
  <text x="523" y="172" font-size="10" font-weight="700" fill="#2457d6">• Технологія:</text>
  <text x="529" y="188" font-size="10" fill="#1a1a1a">Kafka / RabbitMQ / SQS</text>
  <text x="529" y="204" font-size="10" fill="#6b7280">або inbox_events в БД</text>
  <text x="523" y="228" font-size="10" font-weight="700" fill="#27ae60">• Spike Arrest:</text>
  <text x="529" y="244" font-size="10" fill="#1a1a1a">Амортизація сплесків</text>
  <text x="529" y="260" font-size="10" fill="#6b7280">Захист бази від лавин</text>
  <text x="523" y="284" font-size="10" font-weight="700" fill="#1a1a1a">• Гарантія доставки:</text>
  <text x="529" y="300" font-size="10" fill="#1a1a1a">At-least-once delivery</text>
  <text x="529" y="316" font-size="10" fill="#6b7280">Події в надійному сховищі</text>
  <text x="523" y="340" font-size="10" font-weight="700" fill="#1a1a1a">• Дані в черзі:</text>
  <text x="529" y="356" font-size="10" fill="#1a1a1a">event_id + payload</text>
  <text x="529" y="372" font-size="10" fill="#6b7280">+ timestamp + headers</text>

  <!-- СТРІЛКА МІЖ КОЛОНКОЮ 3 І 4 -->
  <text x="685" y="252" font-size="10" font-weight="700" fill="#2457d6" text-anchor="middle">Pull</text>
  <line x1="660" y1="259" x2="696" y2="259" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>


  <!-- ==================== КОЛОНКА 4: ДОМЕННИЙ ВОРКЕР ==================== -->
  <rect x="700" y="75" width="240" height="340" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="820" y="98" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. Доменний воркер</text>
  <text x="820" y="116" font-size="10" font-weight="600" fill="#27ae60" text-anchor="middle">Асинхронна обробка • Стійкість</text>

  <!-- Блок 4A: Дедуплікація -->
  <rect x="710" y="126" width="220" height="78" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="718" y="144" font-size="11" font-weight="700" fill="#27ae60">Крок 4. Дедуплікація (Idempotency)</text>
  <text x="718" y="162" font-size="10" fill="#1a1a1a">• Перевірка event_id у processed_events</text>
  <text x="718" y="178" font-size="10" fill="#1a1a1a">• Якщо вже є — ігнорування дубліката</text>
  <text x="718" y="194" font-size="10" fill="#6b7280">Безпечно при повторних вебхуках</text>

  <!-- Блок 4B: Out of order & ACL -->
  <rect x="710" y="218" width="220" height="82" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="718" y="236" font-size="11" font-weight="700" fill="#27ae60">Крок 5. Контроль порядку й ACL</text>
  <text x="718" y="254" font-size="10" fill="#1a1a1a">• Обробка Out-of-Order повідомлень</text>
  <text x="718" y="270" font-size="10" fill="#1a1a1a">• Перевірка версії стану (optimistic lock)</text>
  <text x="718" y="286" font-size="10" fill="#1a1a1a">• ACL: мапінг DTO у доменні типи</text>

  <!-- Блок 4C: Транзакція -->
  <rect x="710" y="314" width="220" height="86" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="718" y="332" font-size="11" font-weight="700" fill="#27ae60">Крок 6. Доменна транзакція</text>
  <text x="718" y="350" font-size="10" fill="#1a1a1a">• Виконання бізнес-логіки (замовлення)</text>
  <text x="718" y="366" font-size="10" fill="#1a1a1a">• Оновлення доменної бази даних</text>
  <text x="718" y="382" font-size="10" fill="#27ae60">• При збоях: Retry з backoff або DLQ</text>
  <text x="718" y="394" font-size="10" fill="#6b7280">Не впливає на відправника вебхуків</text>


  <!-- ==================== НИЖНІЙ БАНЕР: ЗОЛОТЕ ПРАВИЛО ==================== -->
  <rect x="20" y="428" width="920" height="50" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="480" y="448" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Золоте правило межі: Синхронний ендпойнт робить ТІЛЬКИ перевірку підпису (HMAC) і запис у чергу (&lt; 50 мс)</text>
  <text x="480" y="466" font-size="10" fill="#6b7280" text-anchor="middle">Важка бізнес-логіка, дедуплікація за event_id та оновлення БД виконуються виключно асинхронно у воркерах</text>

</svg>
