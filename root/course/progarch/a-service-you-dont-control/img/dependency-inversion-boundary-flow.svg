<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Інверсія залежностей на архітектурній межі (Dependency Inversion)</text>
  <text x="480" y="57" text-anchor="middle" font-size="13" fill="#6b7280">Потік керування під час виконання виходить назовні, тоді як залежність вихідного коду дивиться всередину</text>

  <!-- ==================== ВЕРХНІЙ ЯРУС: КОМПОНЕНТИ ТА МЕЖА ==================== -->

  <!-- Ліва панель: Внутрішній домен -->
  <rect x="30" y="78" width="425" height="160" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="42" y="88" width="160" height="22" rx="4" fill="#27ae60"/>
  <text x="122" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ВНУТРІШНІЙ ДОМЕН</text>
  <text x="215" y="104" font-size="12" font-weight="700" fill="#1a1a1a">Бізнес-ядро системи (чистий код)</text>

  <!-- Блок 1: Доменна служба -->
  <rect x="42" y="118" width="180" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="54" y="138" font-size="13" font-weight="700" fill="#1a1a1a">Доменна служба</text>
  <text x="54" y="156" font-size="12" font-weight="600" fill="#2457d6">PaymentService</text>
  <text x="54" y="176" font-size="12" fill="#1a1a1a">• Бізнес-правила оплати</text>
  <text x="54" y="194" font-size="12" fill="#6b7280">• Не знає про Stripe / HTTP</text>
  <text x="54" y="212" font-size="12" fill="#27ae60">• Оперує тільки портом</text>

  <!-- Стрілка виклику в межах домену -->
  <line x1="222" y1="168" x2="257" y2="168" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="240" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#2457d6">виклик</text>

  <!-- Блок 2: Доменний порт -->
  <rect x="265" y="118" width="180" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="277" y="138" font-size="13" font-weight="700" fill="#27ae60">Вихідний порт (Port)</text>
  <text x="277" y="156" font-size="12" font-weight="600" fill="#1a1a1a">interface PaymentGateway</text>
  <text x="277" y="176" font-size="12" fill="#1a1a1a">• Чистий контракт домену</text>
  <text x="277" y="194" font-size="12" fill="#6b7280">• Метод: charge(Money, Card)</text>
  <text x="277" y="212" font-size="12" fill="#27ae60">• Домен володіє цим типом</text>

  <!-- Центральний коридор: Архітектурна межа -->
  <rect x="458" y="82" width="44" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">МЕЖА</text>
  <line x1="480" y1="110" x2="480" y2="238" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Стрілки між портом та адаптером через межу -->
  <line x1="445" y1="150" x2="509" y2="150" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="517" y1="186" x2="453" y2="186" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- Права панель: Шар інтеграції та зовнішня служба -->
  <rect x="505" y="78" width="425" height="160" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="517" y="88" width="160" height="22" rx="4" fill="#2457d6"/>
  <text x="597" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ШАР ІНТЕГРАЦІЇ</text>
  <text x="690" y="104" font-size="12" font-weight="700" fill="#1a1a1a">Антикорупційний шар (ACL)</text>

  <!-- Блок 3: Адаптер -->
  <rect x="517" y="118" width="215" height="110" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="529" y="138" font-size="13" font-weight="700" fill="#2457d6">Адаптер антикорупції</text>
  <text x="529" y="156" font-size="12" font-weight="600" fill="#1a1a1a">class StripePaymentAdapter</text>
  <text x="529" y="176" font-size="12" fill="#27ae60">• implements PaymentGateway</text>
  <text x="529" y="194" font-size="12" fill="#1a1a1a">• Мапінг доменних типів у DTO</text>
  <text x="529" y="212" font-size="12" fill="#c0392b">• Ізолює vendor exceptions</text>

  <!-- Стрілка виклику до зовнішнього сервісу -->
  <line x1="732" y1="168" x2="760" y2="168" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="746" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#2457d6">HTTP</text>

  <!-- Блок 4: Зовнішній сервіс -->
  <rect x="768" y="118" width="150" height="110" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="843" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">Зовнішня служба</text>
  <text x="843" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Stripe REST API</text>
  <text x="778" y="176" font-size="12" fill="#c0392b">• Чужі типи й статуси</text>
  <text x="778" y="194" font-size="12" fill="#6b7280">• Непідконтрольний код</text>
  <text x="778" y="212" font-size="12" fill="#6b7280">• Ризик ерозії бізнес-ядра</text>

  <!-- ==================== СЕРЕДНІЙ ЯРУС: ДВА ВЕКТОРИ ==================== -->

  <!-- Вектор 1: Потік керування під час виконання -->
  <rect x="30" y="250" width="900" height="64" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="46" y="272" font-size="13" font-weight="700" fill="#2457d6">ПОТІК КЕРУВАННЯ (Runtime Flow):</text>
  <text x="280" y="272" font-size="12" fill="#1a1a1a">Спрямований НАЗОВНІ → виклик методу йде від ядра через адаптер до зовнішньої мережі</text>
  <line x1="46" y1="296" x2="905" y2="296" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

  <!-- Вектор 2: Компіляційна залежність -->
  <rect x="30" y="324" width="900" height="64" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="46" y="346" font-size="13" font-weight="700" fill="#27ae60">КОМПІЛЯЦІЙНА ЗАЛЕЖНІСТЬ (Source Dependency):</text>
  <text x="380" y="346" font-size="12" fill="#1a1a1a">Спрямована ВСЕРЕДИНУ ← адаптер реалізує порт, ядро не знає про адаптер</text>
  <text x="46" y="374" font-size="12" font-weight="700" fill="#27ae60">Залежності ядра = 0</text>
  <line x1="625" y1="370" x2="355" y2="370" stroke="#27ae60" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>
  <text x="768" y="374" font-size="12" font-weight="600" fill="#6b7280">Вендор не знає про порт</text>

  <!-- ==================== НИЖНІЙ ЯРУС: АРХІТЕКТУРНЕ ПРАВИЛО ==================== -->
  <rect x="30" y="398" width="900" height="54" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="480" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Архітектурне правило: Інверсія залежностей повністю ізолює домен від чужого життєвого циклу</text>
  <text x="480" y="438" text-anchor="middle" font-size="12" fill="#6b7280">Будь-які зміни в API сторонньої служби змушують оновлювати лише адаптер, залишаючи бізнес-ядро непорушним</text>

</svg>
