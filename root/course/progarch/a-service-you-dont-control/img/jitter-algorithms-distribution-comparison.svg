<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Розподіли інтервалів очікування для стратегій джитеру</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Форми щільності ймовірності p(t) для Full, Equal та Decorrelated Jitter відносно експоненційної межі tₙ</text>

  <!-- КОЛОНКА 1: Full Jitter -->
  <rect x="24" y="70" width="290" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка Колонки 1 -->
  <rect x="36" y="82" width="266" height="36" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="169" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">1. Повний джитер (Full Jitter)</text>

  <!-- Формула Колонки 1 -->
  <rect x="36" y="126" width="266" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="145" font-size="11" fill="#6b7280">Рівномірний розподіл на [0, tₙ]:</text>
  <text x="48" y="165" font-size="13" font-weight="700" fill="#2457d6">t = rand(0, tₙ)</text>
  <text x="48" y="184" font-size="11" fill="#1a1a1a">E[t] = 0.5 · tₙ,  Var[t] = tₙ² / 12</text>

  <!-- Графік щільності 1 -->
  <rect x="36" y="208" width="266" height="128" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="226" font-size="11" font-weight="700" fill="#1a1a1a">Щільність p(t) на інтервалі [0, tₙ]:</text>

  <!-- Базова лінія графіка 1 -->
  <line x1="60" y1="305" x2="278" y2="305" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Засічки осі X 1 -->
  <line x1="70" y1="305" x2="70" y2="310" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="165" y1="305" x2="165" y2="310" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="260" y1="305" x2="260" y2="310" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="70" y="322" text-anchor="middle" font-size="11" fill="#6b7280">0</text>
  <text x="165" y="322" text-anchor="middle" font-size="11" fill="#6b7280">tₙ/2</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">tₙ</text>

  <!-- Прямокутник щільності 1: p(t) = 1/t_n -->
  <rect x="70" y="260" width="190" height="45" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="165" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#2457d6">E[t] = 0.5 · tₙ</text>
  <text x="165" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#2457d6">p(t) = 1/tₙ (100% діапазону)</text>

  <!-- Результат Колонки 1 -->
  <rect x="36" y="344" width="266" height="102" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="48" y="364" font-size="12" font-weight="700" fill="#2457d6">Властивості Full Jitter:</text>
  <text x="48" y="383" font-size="11" fill="#1a1a1a">· Найнижчий сумарний час очікування</text>
  <text x="48" y="400" font-size="11" fill="#1a1a1a">· Максимальне згладжування піків</text>
  <text x="48" y="419" font-size="11" font-weight="700" fill="#2457d6">Ризик: короткі відступи біля 0</text>
  <text x="48" y="435" font-size="11" fill="#6b7280">можуть створити ранні повтори</text>

  <!-- КОЛОНКА 2: Equal Jitter -->
  <rect x="335" y="70" width="290" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка Колонки 2 -->
  <rect x="347" y="82" width="266" height="36" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="480" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">2. Зрівняний (Equal Jitter)</text>

  <!-- Формула Колонки 2 -->
  <rect x="347" y="126" width="266" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="359" y="145" font-size="11" fill="#6b7280">Гарантована база + рандомізація:</text>
  <text x="359" y="165" font-size="13" font-weight="700" fill="#27ae60">t = tₙ/2 + rand(0, tₙ/2)</text>
  <text x="359" y="184" font-size="11" fill="#1a1a1a">E[t] = 0.75 · tₙ,  Var[t] = tₙ² / 48</text>

  <!-- Графік щільності 2 -->
  <rect x="347" y="208" width="266" height="128" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="359" y="226" font-size="11" font-weight="700" fill="#1a1a1a">Щільність p(t) на інтервалі [0, tₙ]:</text>

  <!-- Базова лінія графіка 2 -->
  <line x1="371" y1="305" x2="589" y2="305" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Засічки осі X 2 -->
  <line x1="381" y1="305" x2="381" y2="310" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="476" y1="305" x2="476" y2="310" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="571" y1="305" x2="571" y2="310" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="381" y="322" text-anchor="middle" font-size="11" fill="#6b7280">0</text>
  <text x="476" y="322" text-anchor="middle" font-size="11" fill="#6b7280">tₙ/2</text>
  <text x="571" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">tₙ</text>

  <!-- Зона нульової ймовірності -->
  <text x="428" y="286" text-anchor="middle" font-size="11" fill="#c0392b">p = 0 (пауза)</text>

  <!-- Прямокутник щільності 2: p(t) = 2/t_n на [t_n/2, t_n] -->
  <rect x="476" y="242" width="95" height="63" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="523" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60">E = 0.75 · tₙ</text>
  <text x="523" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60">p(t) = 2/tₙ</text>

  <!-- Результат Колонки 2 -->
  <rect x="347" y="344" width="266" height="102" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="359" y="364" font-size="12" font-weight="700" fill="#27ae60">Властивості Equal Jitter:</text>
  <text x="359" y="383" font-size="11" fill="#1a1a1a">· Гарантує паузу не менше 0.5·tₙ</text>
  <text x="359" y="400" font-size="11" fill="#1a1a1a">· Запобігає передчасним повторам</text>
  <text x="359" y="419" font-size="11" font-weight="700" fill="#27ae60">Баланс: захист від спаму</text>
  <text x="359" y="435" font-size="11" fill="#6b7280">ціною помірного росту затримки</text>

  <!-- КОЛОНКА 3: Decorrelated Jitter -->
  <rect x="646" y="70" width="290" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка Колонки 3 -->
  <rect x="658" y="82" width="266" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="791" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">3. Некорельований (Decorrelated)</text>

  <!-- Формула Колонки 3 -->
  <rect x="658" y="126" width="266" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="670" y="145" font-size="11" fill="#6b7280">Стохастичний марковський крок:</text>
  <text x="670" y="165" font-size="12" font-weight="700" fill="#c0392b">t_{i+1} = min(t_max, rand(t_base, 3·t_i))</text>
  <text x="670" y="184" font-size="11" fill="#1a1a1a">E[t_{i+1}] ≈ 1.5 · t_i (динамічний ріст)</text>

  <!-- Графік щільності 3 -->
  <rect x="658" y="208" width="266" height="128" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="670" y="226" font-size="11" font-weight="700" fill="#1a1a1a">Форма щільності p(t):</text>

  <!-- Базова лінія графіка 3 -->
  <line x1="682" y1="305" x2="900" y2="305" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Засічки осі X 3 -->
  <line x1="692" y1="305" x2="692" y2="310" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="787" y1="305" x2="787" y2="310" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="882" y1="305" x2="882" y2="310" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="692" y="322" text-anchor="middle" font-size="11" fill="#6b7280">t_base</text>
  <text x="787" y="322" text-anchor="middle" font-size="11" fill="#6b7280">t_i</text>
  <text x="882" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">3·t_i</text>

  <!-- Крива розподілу 3 -->
  <polygon points="692,305 692,252 720,262 755,277 800,292 850,301 882,305" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="787" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">E ≈ 1.5 · t_prev</text>
  <text x="765" y="274" font-size="11" fill="#c0392b">Стохастичний хвіст</text>

  <!-- Результат Колонки 3 -->
  <rect x="658" y="344" width="266" height="102" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="670" y="364" font-size="12" font-weight="700" fill="#c0392b">Властивості Decorrelated:</text>
  <text x="670" y="383" font-size="11" fill="#1a1a1a">· Повний розрив фазової кореляції</text>
  <text x="670" y="400" font-size="11" fill="#1a1a1a">· Не залежить від фіксованого кроку n</text>
  <text x="670" y="419" font-size="11" font-weight="700" fill="#c0392b">Ціна: висока дисперсія затримки</text>
  <text x="670" y="435" font-size="11" fill="#6b7280">окремі запити чекають значно довше</text>
</svg>
