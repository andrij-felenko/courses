<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-problem" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Фонова підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часове ковзне вікно з нарізкою на кошики (Bucketed Sliding Window)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Кільцевий масив із B кошиків кроком Δt: акумуляція за O(1) та відсікання вичерпаних періодів</text>

  <!-- Верхня часова шкала: фон активного вікна -->
  <rect x="235" y="78" width="640" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="545" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Активне часове вікно аналізу: T = B · Δt (10 с = 5 кошиків × 2 с)</text>
  <text x="545" y="116" font-size="12" fill="#1a1a1a" text-anchor="middle">Поточна оцінка помилок розраховується сумарно за всіма кошиками у вікні T</text>

  <!-- Застарілий період ліворуч -->
  <rect x="55" y="78" width="160" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-dasharray="4 4"/>
  <text x="135" y="98" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Вичерпаний період</text>
  <text x="135" y="116" font-size="12" fill="#6b7280" text-anchor="middle">t &lt; now − T (зрізається)</text>

  <!-- Стрілка витіснення за межі вікна -->
  <path d="M230 238 L202 238" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-problem)"/>
  <text x="216" y="224" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">Вибуття</text>

  <!-- Застарілий витіснений кошик -->
  <rect x="55" y="150" width="135" height="145" rx="6" fill="#fdecea" stroke="#c0392b" stroke-dasharray="4 4"/>
  <rect x="55" y="150" width="135" height="28" rx="6" fill="#fadbd8"/>
  <text x="122" y="169" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Кошик [t − 5Δt]</text>
  <text x="122" y="198" font-size="12" fill="#c0392b" text-anchor="middle">Вибув із вікна T</text>
  <text x="122" y="222" font-size="12" fill="#6b7280" text-anchor="middle">Успішні: 40</text>
  <text x="122" y="242" font-size="12" fill="#6b7280" text-anchor="middle">Помилки: 2</text>
  <text x="122" y="268" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">Скидається в 0</text>

  <!-- 5 Активних кошиків -->
  <!-- Кошик 1 -->
  <rect x="245" y="150" width="115" height="145" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="245" y="150" width="115" height="28" rx="6" fill="#e1e4e8"/>
  <text x="302" y="169" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кошик [t − 4Δt]</text>
  <text x="302" y="200" font-size="12" fill="#27ae60" text-anchor="middle">Успішні: 45</text>
  <text x="302" y="222" font-size="12" fill="#c0392b" text-anchor="middle">Помилки: 1</text>
  <text x="302" y="244" font-size="12" fill="#6b7280" text-anchor="middle">Повільні: 0</text>
  <text x="302" y="274" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Σ = 46</text>

  <!-- Кошик 2 -->
  <rect x="370" y="150" width="115" height="145" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="370" y="150" width="115" height="28" rx="6" fill="#e1e4e8"/>
  <text x="427" y="169" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кошик [t − 3Δt]</text>
  <text x="427" y="200" font-size="12" fill="#27ae60" text-anchor="middle">Успішні: 50</text>
  <text x="427" y="222" font-size="12" fill="#c0392b" text-anchor="middle">Помилки: 0</text>
  <text x="427" y="244" font-size="12" fill="#6b7280" text-anchor="middle">Повільні: 1</text>
  <text x="427" y="274" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Σ = 51</text>

  <!-- Кошик 3 -->
  <rect x="495" y="150" width="115" height="145" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="495" y="150" width="115" height="28" rx="6" fill="#e1e4e8"/>
  <text x="552" y="169" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кошик [t − 2Δt]</text>
  <text x="552" y="200" font-size="12" fill="#27ae60" text-anchor="middle">Успішні: 36</text>
  <text x="552" y="222" font-size="12" fill="#c0392b" text-anchor="middle">Помилки: 4</text>
  <text x="552" y="244" font-size="12" fill="#6b7280" text-anchor="middle">Повільні: 3</text>
  <text x="552" y="274" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Σ = 43</text>

  <!-- Кошик 4 -->
  <rect x="620" y="150" width="115" height="145" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="620" y="150" width="115" height="28" rx="6" fill="#e1e4e8"/>
  <text x="677" y="169" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кошик [t − 1Δt]</text>
  <text x="677" y="200" font-size="12" fill="#27ae60" text-anchor="middle">Успішні: 25</text>
  <text x="677" y="222" font-size="12" fill="#c0392b" text-anchor="middle">Помилки: 11</text>
  <text x="677" y="244" font-size="12" fill="#6b7280" text-anchor="middle">Повільні: 6</text>
  <text x="677" y="274" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Σ = 42</text>

  <!-- Кошик 5: Активний / Голова -->
  <rect x="745" y="150" width="130" height="145" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="745" y="150" width="130" height="28" rx="6" fill="#2457d6"/>
  <text x="810" y="169" font-size="12" font-weight="700" fill="white" text-anchor="middle">Кошик [now] • ГОЛОВА</text>
  <text x="810" y="197" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Акумуляція O(1)</text>
  <text x="810" y="220" font-size="12" fill="#27ae60" text-anchor="middle">Успішні: 12</text>
  <text x="810" y="240" font-size="12" fill="#c0392b" text-anchor="middle">Помилки: 5</text>
  <text x="810" y="260" font-size="12" fill="#6b7280" text-anchor="middle">Повільні: 3</text>
  <text x="810" y="284" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">Інтервал [t, t+Δt)</text>

  <!-- Стрілка вхідного потоку викликів -->
  <path d="M810 128 L810 146" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- Нижня панель 1: Агрегація -->
  <rect x="55" y="320" width="500" height="132" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="75" y="344" font-size="13" font-weight="700" fill="#1a1a1a">Агрегація метрик у ковзному вікні T:</text>
  <text x="75" y="368" font-size="12" fill="#1a1a1a">• Всього викликів у вікні: N_total = 46 + 51 + 43 + 42 + 20 = 202</text>
  <text x="75" y="390" font-size="12" fill="#c0392b">• Невдалі та повільні: N_fail = 1 + 1 + 7 + 17 + 8 = 34 виклики</text>
  <text x="75" y="412" font-size="12" fill="#1a1a1a">• Відсоток збоїв: Failure Rate = 34 / 202 = 16.8% (поріг розмикання θ = 50%)</text>
  <text x="75" y="434" font-size="12" font-weight="700" fill="#27ae60">• Стан Circuit Breaker: CLOSED (ланцюг замкнено, запити проходять)</text>

  <!-- Нижня панель 2: Переваги алгоритму -->
  <rect x="570" y="320" width="335" height="132" rx="6" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="588" y="344" font-size="13" font-weight="700" fill="#2457d6">Переваги кошикової моделі:</text>
  <text x="588" y="368" font-size="12" fill="#1a1a1a">1. Пам'ять O(B): фіксований масив із B кошиків</text>
  <text x="588" y="390" font-size="12" fill="#1a1a1a">2. Запис O(1): атомарний інкремент у голові</text>
  <text x="588" y="412" font-size="12" fill="#1a1a1a">3. Ротація без пауз: очищення кошика раз на Δt</text>
  <text x="588" y="434" font-size="12" fill="#6b7280">4. Точність: похибка вікна обмежена кроком Δt</text>
</svg>
