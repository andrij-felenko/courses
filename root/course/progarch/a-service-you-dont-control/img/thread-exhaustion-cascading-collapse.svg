<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Вичерпання пулу потоків: механіка каскадного колапсу</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Зависання на зовнішньому сокеті блокує спільний пул потоків і відкидає локальні запити каталогу</text>

  <!-- Стрілки між етапами -->
  <line x1="274" y1="228" x2="300" y2="228" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="659" y1="210" x2="685" y2="210" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- КОЛОНКА 1: Вхідний потік -->
  <rect x="20" y="78" width="250" height="300" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="34" y="90" width="120" height="24" rx="4" fill="#2457d6"/>
  <text x="94" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ВХІДНИЙ ПОТІК</text>
  <text x="34" y="132" font-size="14" font-weight="700" fill="#1a1a1a">Змішаний трафік</text>

  <!-- Картка 1.1 -->
  <rect x="34" y="144" width="222" height="98" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="44" y="165" font-size="13" font-weight="700" fill="#c0392b">Запити на оплату (15%)</text>
  <text x="44" y="185" font-size="12" fill="#6b7280">· Оформлення замовлень</text>
  <text x="44" y="203" font-size="12" fill="#6b7280">· Потребують платіжний API</text>
  <text x="44" y="221" font-size="12" fill="#c0392b">· Зависають на очікуванні</text>

  <!-- Картка 1.2 -->
  <rect x="34" y="254" width="222" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="275" font-size="13" font-weight="700" fill="#1a1a1a">Запити каталогу (85%)</text>
  <text x="44" y="295" font-size="12" fill="#6b7280">· Читання товарів, пошук</text>
  <text x="44" y="313" font-size="12" fill="#6b7280">· Локальні, швидкі (5 мс)</text>
  <text x="44" y="331" font-size="12" fill="#c0392b">· Жертви: відкидаються!</text>
  <text x="44" y="349" font-size="12" fill="#6b7280">· Помилка 504 через брак пулу</text>

  <!-- КОЛОНКА 2: Сервер застосунків -->
  <rect x="305" y="78" width="350" height="300" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="319" y="90" width="130" height="24" rx="4" fill="#c0392b"/>
  <text x="384" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">СПІЛЬНИЙ ПУЛ</text>
  <text x="319" y="132" font-size="14" font-weight="700" fill="#c0392b">Сервер застосунків (Параліч)</text>

  <!-- Картка 2.1: Пул потоків -->
  <rect x="319" y="144" width="322" height="132" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="331" y="165" font-size="13" font-weight="700" fill="#c0392b">Thread Pool: 200 / 200 зайнято (100%)</text>

  <rect x="331" y="174" width="298" height="24" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="341" y="190" font-size="12" fill="#c0392b">Потік 01..180: socket.read() (завис 45с)</text>

  <rect x="331" y="204" width="298" height="24" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="341" y="220" font-size="12" fill="#c0392b">Потік 181..200: очікування з'єднання з API</text>

  <rect x="331" y="234" width="298" height="24" rx="3" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="341" y="250" font-size="12" fill="#6b7280">Вільних потоків: 0 (воркери вичерпано)</text>

  <!-- Картка 2.2: Голодування -->
  <rect x="319" y="286" width="322" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="331" y="307" font-size="13" font-weight="700" fill="#c0392b">Голодування ресурсів (Thread Starvation)</text>
  <text x="331" y="327" font-size="12" fill="#6b7280">· Черга очікування переповнена, запити скидаються</text>
  <text x="331" y="345" font-size="12" fill="#c0392b">· Швидкий каталог тоне через повільні платежі</text>

  <!-- КОЛОНКА 3: Чужа служба -->
  <rect x="690" y="78" width="250" height="300" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="704" y="90" width="130" height="24" rx="4" fill="#c0392b"/>
  <text x="769" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ЧУЖА СЛУЖБА</text>
  <text x="704" y="132" font-size="14" font-weight="700" fill="#c0392b">Платіжний шлюз</text>

  <!-- Картка 3.1 -->
  <rect x="704" y="144" width="222" height="98" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="714" y="165" font-size="13" font-weight="700" fill="#c0392b">Стрибок затримки (Lag)</text>
  <text x="714" y="185" font-size="12" fill="#6b7280">· Нормальний час: 200 мс</text>
  <text x="714" y="203" font-size="12" fill="#c0392b">· Поточний стан: 30–60 с</text>
  <text x="714" y="221" font-size="12" fill="#6b7280">· Втрата пакетів, повільний TCP</text>

  <!-- Картка 3.2 -->
  <rect x="704" y="254" width="222" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="714" y="275" font-size="13" font-weight="700" fill="#1a1a1a">Помилка інтеграції</text>
  <text x="714" y="295" font-size="12" fill="#6b7280">· Немає сокетного таймауту</text>
  <text x="714" y="313" font-size="12" fill="#6b7280">· Відсутній Circuit Breaker</text>
  <text x="714" y="331" font-size="12" fill="#6b7280">· Немає перебірок (Bulkhead)</text>
  <text x="714" y="349" font-size="12" fill="#c0392b">· Безкінечне очікування сокета</text>

  <!-- НИЖНЯ ПАНЕЛЬ: Архітектурний висновок -->
  <rect x="20" y="394" width="920" height="86" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="34" y="404" width="165" height="22" rx="4" fill="#c0392b"/>
  <text x="116" y="419" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">АНАТОМІЯ КАСКАДУ</text>
  <text x="210" y="420" font-size="13" font-weight="700" fill="#c0392b">Як повільний партнер перетворюється на самогубство власної системи</text>
  <text x="34" y="444" font-size="12" fill="#1a1a1a">· Відсутність перебірок (Bulkhead): запити оплати та каталогу конкурують за один пул; зависання оплати блокує весь сервер</text>
  <text x="34" y="464" font-size="12" fill="#6b7280">· Рішення Найґарда (Release It!): жорсткі сокетні таймаути, ізольовані пули на кожну інтеграцію та Circuit Breaker (fail-fast)</text>
</svg>
