<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Алгоритм рішень на межі: Валідація вебхука та коди відповіді</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Послідовний ланцюг перевірок: HMAC, Timestamp, Дедуплікація та вибір семантики (200, 4xx, 5xx)</text>

  <!-- ==================== КОЛОНКА 1: ВХІДНИЙ ЗАПИТ ==================== -->
  <rect x="20" y="85" width="150" height="75" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="95" y="105" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Вхідний запит</text>
  <text x="95" y="122" font-size="10" font-weight="700" fill="#2457d6" text-anchor="middle">POST /webhooks</text>
  <text x="95" y="138" font-size="10" fill="#6b7280" text-anchor="middle">Raw Body + Headers</text>
  <text x="95" y="150" font-size="10" fill="#6b7280" text-anchor="middle">(Signature, Timestamp)</text>

  <line x1="170" y1="122" x2="191" y2="122" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- ==================== КОЛОНКА 2: ПЕРЕВІРКА HMAC ==================== -->
  <rect x="195" y="85" width="165" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="277" y="105" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">1. Перевірка HMAC</text>
  <text x="277" y="122" font-size="10" fill="#1a1a1a" text-anchor="middle">HMAC(body, secret)</text>
  <text x="277" y="138" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">Підпис збігається?</text>
  <text x="277" y="150" font-size="10" fill="#6b7280" text-anchor="middle">Timing-safe compare</text>

  <!-- Стрілка Так -> до Кроку 2 -->
  <text x="372" y="115" font-size="10" font-weight="700" fill="#27ae60" text-anchor="middle">Так</text>
  <line x1="360" y1="122" x2="381" y2="122" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Стрілка Ні -> до 401 -->
  <text x="287" y="178" font-size="10" font-weight="700" fill="#c0392b">Ні</text>
  <line x1="277" y1="160" x2="277" y2="191" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Картка 401 Unauthorized -->
  <rect x="195" y="196" width="165" height="122" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="277" y="216" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">401 Unauthorized</text>
  <text x="203" y="236" font-size="10" fill="#1a1a1a">• Підробка запиту</text>
  <text x="203" y="252" font-size="10" fill="#1a1a1a">• Невірний спільний секрет</text>
  <text x="203" y="268" font-size="10" fill="#6b7280">• Зміна тіла при передачі</text>
  <text x="203" y="288" font-size="10" font-weight="700" fill="#c0392b">• Дія: фатальне відхилення</text>
  <text x="203" y="304" font-size="10" fill="#6b7280">Провайдер НЕ повторює</text>

  <!-- ==================== КОЛОНКА 3: КОНТРОЛЬ ЧАСУ ==================== -->
  <rect x="385" y="85" width="165" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="467" y="105" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">2. Контроль часу</text>
  <text x="467" y="122" font-size="10" fill="#1a1a1a" text-anchor="middle">|T_now - T_event|</text>
  <text x="467" y="138" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">Різниця &lt;= 300 с?</text>
  <text x="467" y="150" font-size="10" fill="#6b7280" text-anchor="middle">Захист від replay</text>

  <!-- Стрілка Так -> до Кроку 3 -->
  <text x="562" y="115" font-size="10" font-weight="700" fill="#27ae60" text-anchor="middle">Так</text>
  <line x1="550" y1="122" x2="571" y2="122" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Стрілка Ні -> до 400 -->
  <text x="477" y="178" font-size="10" font-weight="700" fill="#c0392b">Ні</text>
  <line x1="467" y1="160" x2="467" y2="191" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Картка 400 Bad Request -->
  <rect x="385" y="196" width="165" height="122" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="467" y="216" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">400 Bad Request</text>
  <text x="393" y="236" font-size="10" fill="#1a1a1a">• Replay Attack (атака)</text>
  <text x="393" y="252" font-size="10" fill="#1a1a1a">• Застаріла часова мітка</text>
  <text x="393" y="268" font-size="10" fill="#6b7280">• Запит із майбутнього</text>
  <text x="393" y="288" font-size="10" font-weight="700" fill="#c0392b">• Дія: дроп без повтору</text>
  <text x="393" y="304" font-size="10" fill="#6b7280">Провайдер НЕ повторює</text>

  <!-- ==================== КОЛОНКА 4: ДЕДУПЛІКАЦІЯ ==================== -->
  <rect x="575" y="85" width="165" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="657" y="105" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">3. Дедуплікація</text>
  <text x="657" y="122" font-size="10" fill="#1a1a1a" text-anchor="middle">event_id у сховищі?</text>
  <text x="657" y="138" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">Це дублікат події?</text>
  <text x="657" y="150" font-size="10" fill="#6b7280" text-anchor="middle">At-least-once контроль</text>

  <!-- Стрілка Ні -> до Кроку 4 -->
  <text x="752" y="115" font-size="10" font-weight="700" fill="#2457d6" text-anchor="middle">Ні</text>
  <line x1="740" y1="122" x2="761" y2="122" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Стрілка Так -> до 200 Дублікат -->
  <text x="667" y="178" font-size="10" font-weight="700" fill="#27ae60">Так</text>
  <line x1="657" y1="160" x2="657" y2="191" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Картка 200 OK Дублікат -->
  <rect x="575" y="196" width="165" height="122" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="657" y="216" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">200 OK (Дублікат)</text>
  <text x="583" y="236" font-size="10" fill="#1a1a1a">• Подія вже збережена</text>
  <text x="583" y="252" font-size="10" fill="#1a1a1a">• Пропуск запису в чергу</text>
  <text x="583" y="268" font-size="10" fill="#6b7280">• Захист від подвійних дій</text>
  <text x="583" y="288" font-size="10" font-weight="700" fill="#27ae60">• Дія: ідемпотентний Ack</text>
  <text x="583" y="304" font-size="10" fill="#27ae60">Зупиняє цикл повторів</text>

  <!-- ==================== КОЛОНКА 5: ЗАПИС У ЧЕРГУ ==================== -->
  <rect x="765" y="85" width="175" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="852" y="105" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">4. Буферизація</text>
  <text x="852" y="122" font-size="10" fill="#1a1a1a" text-anchor="middle">Запис event_id + body</text>
  <text x="852" y="138" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">У чергу / Inbox-таблицю</text>
  <text x="852" y="150" font-size="10" fill="#6b7280" text-anchor="middle">Атомарна операція</text>

  <!-- Стрілка вниз до результату запису -->
  <text x="862" y="178" font-size="10" font-weight="700" fill="#2457d6">Запис</text>
  <line x1="852" y1="160" x2="852" y2="191" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Картка результатів запису -->
  <rect x="765" y="196" width="175" height="122" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>

  <!-- Під-блок 503 -->
  <rect x="771" y="202" width="163" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="852" y="218" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">Збій: 503 Unavailable</text>
  <text x="777" y="234" font-size="10" fill="#1a1a1a">• Черга переповнена / офлайн</text>
  <text x="777" y="248" font-size="10" font-weight="700" fill="#c0392b">Сигнал: повторити (Retry)</text>

  <!-- Під-блок 200 OK -->
  <rect x="771" y="260" width="163" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="852" y="276" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">Успіх: 200 OK / 202</text>
  <text x="777" y="292" font-size="10" fill="#1a1a1a">• Подію надійно буферизовано</text>
  <text x="777" y="306" font-size="10" font-weight="700" fill="#27ae60">Запуск асинхронного воркера</text>

  <!-- ==================== НИЖНЯ МАТРИЦЯ СЕМАНТИКИ ==================== -->
  <rect x="20" y="335" width="920" height="143" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="480" y="354" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зведена матриця семантики відповідей приймача вебхуків (Webhook Response Contract)</text>

  <!-- Картка матриці 1 -->
  <rect x="30" y="365" width="213" height="103" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="136" y="383" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">401 Unauthorized</text>
  <text x="38" y="401" font-size="10" font-weight="700" fill="#1a1a1a">Причина: HMAC не зійшовся</text>
  <text x="38" y="417" font-size="10" fill="#1a1a1a">• Підробка або невірний ключ</text>
  <text x="38" y="433" font-size="10" fill="#6b7280">• Провайдер: НЕ повторювати</text>
  <text x="38" y="451" font-size="10" font-weight="700" fill="#c0392b">Статус: Фатальна помилка</text>

  <!-- Картка матриці 2 -->
  <rect x="258" y="365" width="213" height="103" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="364" y="383" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">400 Bad Request</text>
  <text x="266" y="401" font-size="10" font-weight="700" fill="#1a1a1a">Причина: Timestamp skew</text>
  <text x="266" y="417" font-size="10" fill="#1a1a1a">• Різниця часу понад ±300 с</text>
  <text x="266" y="433" font-size="10" fill="#6b7280">• Блокування Replay-атаки</text>
  <text x="266" y="451" font-size="10" font-weight="700" fill="#c0392b">Статус: Дроп без повтору</text>

  <!-- Картка матриці 3 -->
  <rect x="486" y="365" width="213" height="103" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="592" y="383" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">200 OK (Дедуплікація)</text>
  <text x="494" y="401" font-size="10" font-weight="700" fill="#1a1a1a">Причина: event_id вже є</text>
  <text x="494" y="417" font-size="10" fill="#1a1a1a">• At-least-once повтор мережі</text>
  <text x="494" y="433" font-size="10" fill="#6b7280">• Пропуск черги (дедуп)</text>
  <text x="494" y="451" font-size="10" font-weight="700" fill="#27ae60">Статус: Зупинити retry-шторм</text>

  <!-- Картка матриці 4 -->
  <rect x="714" y="365" width="216" height="103" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="822" y="383" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">503 Unavailable / 200 OK</text>
  <text x="722" y="401" font-size="10" font-weight="700" fill="#1a1a1a">Причина: Стан буфера черги</text>
  <text x="722" y="417" font-size="10" fill="#1a1a1a">• 503: Черга лежить -> Retry пізніше</text>
  <text x="722" y="433" font-size="10" fill="#27ae60">• 200/202: Записано -> Успіх</text>
  <text x="722" y="451" font-size="10" font-weight="700" fill="#2457d6">Статус: Гарантія збереження</text>

</svg>
