<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Архітектурна межа: доменне ядро, антикорупційний шар (ACL) та зовнішній транспорт</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Антикорупційний шар повністю ізолює доменні моделі від чужих DTO, протоколів та сирих винятків мережі</text>

  <!-- Вертикальні межі розділення -->
  <line x1="316" y1="72" x2="316" y2="506" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="644" y1="72" x2="644" y2="506" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- КОЛОНКА 1: Доменне ядро -->
  <rect x="24" y="72" width="280" height="434" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="36" y="84" width="130" height="22" rx="3" fill="#27ae60"/>
  <text x="101" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ДОМЕННЕ ЯДРО</text>
  <text x="36" y="122" font-size="13" font-weight="700" fill="#1a1a1a">Чиста бізнес-модель (Trust Zone)</text>

  <!-- Картка 1.1: Доменні сутності -->
  <rect x="36" y="134" width="256" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="154" font-size="12" font-weight="700" fill="#27ae60">Доменні сутності (Entities)</text>
  <text x="48" y="174" font-size="12" fill="#1a1a1a">· PaymentCommand, Order</text>
  <text x="48" y="192" font-size="12" fill="#1a1a1a">· Money { amount, currency }</text>
  <text x="48" y="210" font-size="12" fill="#6b7280">Чисті бізнес-типи мови ядра</text>

  <!-- Картка 1.2: Інтерфейс шлюзу -->
  <rect x="36" y="242" width="256" height="104" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="48" y="262" font-size="12" font-weight="700" fill="#27ae60">Інтерфейс шлюзу (Gateway Port)</text>
  <text x="48" y="282" font-size="12" fill="#1a1a1a">interface PaymentGateway {</text>
  <text x="56" y="302" font-size="12" font-weight="700" fill="#2457d6">charge(cmd): PaymentResult</text>
  <text x="48" y="322" font-size="12" fill="#1a1a1a">}</text>
  <text x="48" y="338" font-size="12" fill="#6b7280">Контракт, яким володіє домен</text>

  <!-- Картка 1.3: Типізовані доменні помилки -->
  <rect x="36" y="358" width="256" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="378" font-size="12" font-weight="700" fill="#27ae60">Доменні помилки (Domain Errors)</text>
  <text x="48" y="398" font-size="12" fill="#1a1a1a">· PaymentDeclinedError</text>
  <text x="48" y="416" font-size="12" fill="#1a1a1a">· ProviderUnavailableError</text>
  <text x="48" y="434" font-size="12" fill="#1a1a1a">· InsufficientFundsError</text>
  <rect x="44" y="446" width="240" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="52" y="462" font-size="12" font-weight="700" fill="#27ae60">✓ Повна ізоляція від HTTP</text>
  <text x="52" y="476" font-size="12" fill="#27ae60">✓ Жодного сирого винятку мережі</text>

  <!-- КОЛОНКА 2: Антикорупційний шар -->
  <rect x="328" y="72" width="304" height="434" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="340" y="84" width="194" height="22" rx="3" fill="#2457d6"/>
  <text x="437" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">АНТИКОРУПЦІЙНИЙ ШАР (ACL)</text>
  <text x="340" y="122" font-size="13" font-weight="700" fill="#1a1a1a">Шлюз + Санітарний кордон</text>

  <!-- Картка 2.1: Транслятор вихідного наміру -->
  <rect x="340" y="134" width="280" height="96" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="350" y="154" font-size="12" font-weight="700" fill="#2457d6">1. Двостороння трансляція (DTO)</text>
  <text x="350" y="174" font-size="12" fill="#1a1a1a">PaymentCommand ➔ VendorDTO</text>
  <text x="350" y="192" font-size="12" fill="#6b7280">· Гривні ➔ копійки (amount_cents)</text>
  <text x="350" y="210" font-size="12" fill="#6b7280">· Генерація токена Idempotency-Key</text>

  <!-- Картка 2.2: Захисний конвеєр стійкості -->
  <rect x="340" y="242" width="280" height="136" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="350" y="260" font-size="12" font-weight="700" fill="#2457d6">2. Конвеєр стійкості (Middleware)</text>
  <rect x="350" y="268" width="260" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="283" text-anchor="middle" font-size="12" fill="#2457d6">Bulkhead (ліміт паралелізму)</text>
  <rect x="350" y="294" width="260" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="309" text-anchor="middle" font-size="12" fill="#2457d6">Circuit Breaker (запобіжник)</text>
  <rect x="350" y="320" width="260" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="335" text-anchor="middle" font-size="12" fill="#2457d6">Timeouts + Full Jitter Retries</text>
  <text x="350" y="356" font-size="12" fill="#6b7280">Fail-fast при аварії провайдера</text>
  <text x="350" y="370" font-size="12" fill="#6b7280">Автоматичний fallback на кеш</text>

  <!-- Картка 2.3: Карантин винятків -->
  <rect x="340" y="390" width="280" height="104" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="350" y="408" font-size="12" font-weight="700" fill="#2457d6">3. Карантин сирих помилок</text>
  <text x="350" y="426" font-size="12" fill="#c0392b">HTTP 502/503, SocketTimeout ➔</text>
  <text x="350" y="444" font-size="12" font-weight="700" fill="#27ae60">➔ ProviderUnavailableError</text>
  <text x="350" y="464" font-size="12" fill="#1a1a1a">Парсинг JSON ➔ GatewayResponse</text>
  <text x="350" y="482" font-size="12" fill="#6b7280">Нормалізація схеми даних вендора</text>

  <!-- КОЛОНКА 3: Непідконтрольний сервіс -->
  <rect x="656" y="72" width="280" height="434" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="668" y="84" width="206" height="22" rx="3" fill="#c0392b"/>
  <text x="771" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">НЕПІДКОНТРОЛЬНИЙ СЕРВІС</text>
  <text x="668" y="122" font-size="13" font-weight="700" fill="#1a1a1a">Зовнішній API та мережа</text>

  <!-- Картка 3.1: Мережевий транспорт -->
  <rect x="668" y="134" width="256" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="678" y="154" font-size="12" font-weight="700" fill="#c0392b">Мережевий транспорт</text>
  <text x="678" y="174" font-size="12" fill="#1a1a1a">· HTTP/1.1, HTTP/2, TLS 1.3</text>
  <text x="678" y="192" font-size="12" fill="#1a1a1a">· TCP Sockets, сирі пакети</text>
  <text x="678" y="210" font-size="12" fill="#c0392b">· Зависання сокета, скидання RST</text>

  <!-- Картка 3.2: Вендорські DTO -->
  <rect x="668" y="242" width="256" height="104" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="678" y="262" font-size="12" font-weight="700" fill="#c0392b">Вендорські DTO та протокол</text>
  <text x="678" y="280" font-size="12" fill="#1a1a1a">{"merchant_order_id": "...",</text>
  <text x="678" y="298" font-size="12" fill="#1a1a1a"> "amt_cents": 1050, "cur": 840}</text>
  <text x="678" y="318" font-size="12" fill="#6b7280">Заголовки Authorization, API Keys</text>
  <text x="678" y="336" font-size="12" fill="#c0392b">Несподівані зміни полів вендором</text>

  <!-- Картка 3.3: Сирі мережеві винятки -->
  <rect x="668" y="358" width="256" height="136" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="678" y="378" font-size="12" font-weight="700" fill="#c0392b">Сирі мережеві винятки</text>
  <text x="678" y="398" font-size="12" fill="#c0392b">· ECONNREFUSED, ETIMEDOUT</text>
  <text x="678" y="416" font-size="12" fill="#c0392b">· HTTP 503 Service Unavailable</text>
  <text x="678" y="434" font-size="12" fill="#c0392b">· HTTP 429 Too Many Requests</text>
  <text x="678" y="452" font-size="12" fill="#c0392b">· Битий JSON у тілі відповіді</text>
  <text x="678" y="474" font-size="12" font-weight="700" fill="#c0392b">⚠ Заблоковано на кордоні ACL</text>

  <!-- Стрілки зв'язку між колонками -->
  <line x1="292" y1="174" x2="338" y2="174" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="620" y1="174" x2="666" y2="174" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="668" y1="426" x2="622" y2="426" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="340" y1="444" x2="294" y2="444" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Підписи зон унизу -->
  <text x="164" y="534" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">ДОМЕННА ЗОНА ДОВІРИ</text>
  <text x="480" y="534" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">БУФЕР ІЗОЛЯЦІЇ ТА ТРАНСЛЯЦІЇ</text>
  <text x="796" y="534" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">ЗОНА ЗОВНІШНЬОГО ХАОСУ</text>
</svg>
