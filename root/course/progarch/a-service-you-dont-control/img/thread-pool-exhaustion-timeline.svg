<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Динаміка вичерпання пулу потоків при стрибку латентності</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Зависання чужої служби паралізує пул воркерів за час t_exhaust = C_pool / λ з подальшим вибухом черги</text>

  <!-- ЛІВА ПАНЕЛЬ: Хронологічний графік фаз -->
  <rect x="24" y="70" width="580" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="40" y="94" font-size="14" font-weight="700" fill="#1a1a1a">Фази вичерпання пулу воркерів</text>
  <text x="40" y="112" font-size="12" fill="#6b7280">Пул C_pool = 200 воркерів, вхідний потік λ = 100 зап/с</text>

  <!-- Легенда ліній -->
  <rect x="330" y="82" width="258" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <line x1="340" y1="100" x2="356" y2="100" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="348" cy="100" r="3" fill="#2457d6"/>
  <text x="362" y="104" font-size="11" font-weight="700" fill="#2457d6">Воркери пулу (L)</text>

  <line x1="472" y1="100" x2="488" y2="100" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,3"/>
  <circle cx="480" cy="100" r="3" fill="#c0392b"/>
  <text x="494" y="104" font-size="11" font-weight="700" fill="#c0392b">Черга (Backlog)</text>

  <!-- Плашки 3-х фаз над графіком -->
  <!-- Фаза 1 -->
  <rect x="85" y="126" width="94" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="132" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60">Фаза 1: Норма</text>

  <!-- Фаза 2 -->
  <rect x="187" y="126" width="170" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="272" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#2457d6">Фаза 2: Насичення воркерів</text>

  <!-- Фаза 3 -->
  <rect x="365" y="126" width="180" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="455" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">Фаза 3: Вибух черги (Backlog)</text>

  <!-- Вертикальні межі фаз -->
  <line x1="185" y1="152" x2="185" y2="230" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="365" y1="152" x2="365" y2="230" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Горизонтальна лінія ліміту воркерів C_pool = 200 -->
  <line x1="75" y1="255" x2="550" y2="255" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="80" y="247" font-size="11" font-weight="700" fill="#c0392b">Ліміт пулу: C_pool = 200 потоків</text>

  <!-- Горизонтальна лінія осі часу (baseline 0) -->
  <line x1="75" y1="365" x2="550" y2="365" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Засічки осі Y (ліворуч) -->
  <line x1="70" y1="145" x2="75" y2="145" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="70" y1="255" x2="75" y2="255" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="70" y1="365" x2="75" y2="365" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Мітки осі Y -->
  <text x="66" y="149" text-anchor="end" font-size="11" font-weight="700" fill="#c0392b">400</text>
  <text x="66" y="259" text-anchor="end" font-size="11" font-weight="700" fill="#1a1a1a">200</text>
  <text x="66" y="369" text-anchor="end" font-size="11" fill="#6b7280">0</text>

  <!-- Крива воркерів пулу: L(t) -->
  <polyline points="95,362 185,362 365,255 545,255" fill="none" stroke="#2457d6" stroke-width="3"/>
  <circle cx="95" cy="362" r="4" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="185" cy="362" r="4" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="365" cy="255" r="5" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="545" cy="255" r="4" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Крива зростання беклогу: черга у Фазі 3 -->
  <polyline points="365,255 545,145" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="5,4"/>
  <circle cx="545" cy="145" r="5" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>



  <!-- Картка події: Стрибок затримки -->
  <rect x="95" y="272" width="166" height="42" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="178" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#2457d6">Стрибок W: 50 мс → 5 с</text>
  <text x="178" y="304" text-anchor="middle" font-size="11" fill="#1a1a1a">Воркери блокуються в сокетах</text>

  <!-- Картка події: Критична точка вичерпання -->
  <rect x="375" y="272" width="170" height="42" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="460" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">t_exhaust = 2.0 с (t = 3.0 с)</text>
  <text x="460" y="304" text-anchor="middle" font-size="11" fill="#1a1a1a">Пул 100% зайнято (L = 200)</text>

  <!-- Засічки осі X (часу) -->
  <line x1="95" y1="365" x2="95" y2="370" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="185" y1="365" x2="185" y2="370" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="275" y1="365" x2="275" y2="370" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="365" y1="365" x2="365" y2="370" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="455" y1="365" x2="455" y2="370" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="545" y1="365" x2="545" y2="370" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Підписи значень осі X -->
  <text x="95" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60">0.0 с</text>
  <text x="185" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="#2457d6">1.0 с</text>
  <text x="275" y="383" text-anchor="middle" font-size="11" fill="#6b7280">2.0 с</text>
  <text x="365" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">3.0 с</text>
  <text x="455" y="383" text-anchor="middle" font-size="11" fill="#6b7280">4.0 с</text>
  <text x="545" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">5.0 с</text>

  <!-- Назва осі X -->
  <text x="320" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Час від початку спостереження, секунди</text>

  <!-- Пояснювальний бейдж внизу графіка -->
  <rect x="40" y="422" width="548" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="314" y="439" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">Після t_exhaust нові запити не отримують потоків і вибухово заповнюють чергу</text>

  <!-- ПРАВА ПАНЕЛЬ: Формули та архітектурні висновки -->
  <rect x="620" y="70" width="316" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="636" y="94" font-size="14" font-weight="700" fill="#1a1a1a">Математика вичерпання ресурсів</text>
  <text x="636" y="112" font-size="12" fill="#6b7280">Закон Літтла та динаміка колапсу пулу</text>

  <!-- Картка 1: Розрахунок часу до колапсу -->
  <rect x="636" y="126" width="284" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="648" y="146" font-size="13" font-weight="700" fill="#2457d6">Час до повного колапсу пулу</text>
  <text x="648" y="167" font-size="12" font-weight="700" fill="#1a1a1a">t_exhaust ≈ (C_pool - L₀) / λ</text>
  <text x="648" y="187" font-size="11" fill="#6b7280">При C_pool = 200, λ = 100 зап/с:</text>
  <text x="648" y="204" font-size="11" font-weight="700" fill="#c0392b">t_exhaust = (200 - 5) / 100 ≈ 1.95 с</text>

  <!-- Картка 2: Три фази вичерпання -->
  <rect x="636" y="232" width="284" height="102" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="648" y="252" font-size="13" font-weight="700" fill="#c0392b">Анатомія трьох фаз колапсу</text>
  <text x="648" y="272" font-size="11" fill="#1a1a1a">1. Норма: W=50 мс → L = 5 потоків</text>
  <text x="648" y="290" font-size="11" fill="#1a1a1a">2. Насичення: 100 воркерів/с блокуються</text>
  <text x="648" y="308" font-size="11" font-weight="700" fill="#c0392b">3. Backlog: черга росте на 100 зап/с</text>
  <text x="648" y="324" font-size="11" fill="#6b7280">Швидкі локальні виклики вмирають</text>

  <!-- Картка 3: Захисні шаблони -->
  <rect x="636" y="344" width="284" height="102" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="648" y="364" font-size="13" font-weight="700" fill="#27ae60">Архітектурні запобіжники</text>
  <text x="648" y="384" font-size="11" fill="#1a1a1a">· Таймаут: L_max = λ · T_timeout</text>
  <text x="648" y="402" font-size="11" fill="#1a1a1a">· Bulkhead: окремий пул для чужих API</text>
  <text x="648" y="420" font-size="11" fill="#1a1a1a">· Circuit Breaker: відсікає виклики (W→0)</text>
  <text x="648" y="436" font-size="11" font-weight="700" fill="#27ae60">Запобігає каскадному голодуванню</text>
</svg>
