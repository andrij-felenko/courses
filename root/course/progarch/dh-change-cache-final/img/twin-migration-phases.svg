<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="690" fill="#ffffff"/>
