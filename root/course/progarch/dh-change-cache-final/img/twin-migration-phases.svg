<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">4-фазна zero-downtime міграція цифрового твіна DH від Варіанта Б до В</text>
<text x="540.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">4-фазна zero-downtime міграція цифрового твіна Digital Homes (Б → В)</text>
