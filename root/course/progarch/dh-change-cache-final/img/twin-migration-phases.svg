<text x="86.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Фаза 1: Expand &amp; Dual-Write (Подвійний запис і порівняння)</text>
<text x="86.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Запис синхронно в Б + через Outbox в Kafka → Твін В. Читання з Б. Verification Harness порівнює 1% відповідей.</text>
<text x="86.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">• Відкат: Вимкнути dual_write_flag • Метрика mismatch: twin_mismatch_total → 0</text>
<line x1="540.0" y1="324.0" x2="540.0" y2="346.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
