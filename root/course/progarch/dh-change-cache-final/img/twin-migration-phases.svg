<rect x="60.0" y="346.0" width="10.0" height="116.0" rx="0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="86.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Фаза 2: Switch Read Primary &amp; Backfill (Перемикання читання і тротльований backfill)</text>
<text x="86.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Онлайн-backfill історичних твінів Б → В (тротлінг 500 req/s). Читання з В, Fallback на Б при помилках.</text>
<text x="86.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">• ТОЧКА НЕПОВЕРНЕННЯ: В стає джерелом нової телеметрії • Відкат: Потребує реверсного backfill</text>
<line x1="540.0" y1="462.0" x2="540.0" y2="484.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="484.0" width="960.0" height="116.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<rect x="60.0" y="484.0" width="10.0" height="116.0" rx="0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="86.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Фаза 3: Contract &amp; Deprecate B (Завершення та відключення Б)</text>
<text x="86.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">100% читань і записів тільки через Твін В. Твін Б відключено, таблиці архівуються після 72г без fallback.</text>
<text x="86.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">• Цільовий стан: Event-Driven CQRS твін без боргу • SLO доступності: 99.99%</text>
