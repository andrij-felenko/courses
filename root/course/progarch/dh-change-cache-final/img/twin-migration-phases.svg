<text x="86.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Фаза 0: Baseline (Стабільний стан Б)</text>
<text x="86.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">100% запитів іде на Твін Б (PostgreSQL + Redis). Твін В не існує або в розробці.</text>
<text x="86.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">• Відкат: Не потрібен • Ризик: 0 • Метрика mismatch: N/A</text>
