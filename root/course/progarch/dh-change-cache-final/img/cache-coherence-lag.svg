<rect x="646.4" y="116.2" width="307.3" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Датчик / MQTT → Ingestion Pipeline</tspan><tspan x="800.0" dy="15.6">(Мережевий &amp; batching лаг Δt ≈ 350-2500ms)</tspan></text>
