<rect x="143.5" y="206.2" width="273.1" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Kafka Topic: twin.state_changed</tspan><tspan x="280.0" dy="15.6">(payload: home_id, ETag, version_seq)</tspan></text>
<rect x="126.4" y="306.2" width="307.3" height="47.6" rx="6" fill="#fffceb" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Gateway / BFF Cache Invalidator</tspan><tspan x="280.0" dy="15.6">(Перевіряє: event.version &gt; cache.version)</tspan></text>
<rect x="117.5" y="416.2" width="325.0" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Redis Edge Cache (Версійний запис)</tspan><tspan x="280.0" dy="15.6">+ Read-Your-Writes Header (X-Min-Version)</tspan></text>
