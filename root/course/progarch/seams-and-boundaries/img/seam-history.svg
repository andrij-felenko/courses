<text x="180.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="180.0" dy="0.0">Кент Бек і Еріх Гамма пишуть юніт-тест</tspan><tspan x="180.0" dy="17.2">у літаку до OOPSLA — тестування виходить</tspan></text>
