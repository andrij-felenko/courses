<text x="180.0" y="571.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="180.0" dy="0.0">шов поза тестами: зонди спостережності,</tspan><tspan x="180.0" dy="17.2">витиснення старого новим</tspan></text>
