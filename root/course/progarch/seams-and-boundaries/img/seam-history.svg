<text x="180.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Книжка: «Модель шва»</text>
<text x="180.0" y="459.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="180.0" dy="0.0">три роди швів за конвеєром збірки:</tspan><tspan x="180.0" dy="17.2">препроцесорний · лінк · об'єктний</tspan></text>
