<text x="180.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Стаття Object Mentor</text>
<text x="180.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="180.0" dy="0.0">названо «дилему легасі-коду»:</tspan><tspan x="180.0" dy="17.2">щоб тестувати — міняй, щоб міняти — тестуй</tspan></text>
