<text x="180.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="180.0" dy="0.0">Фезерс переносить JUnit у C++ —</tspan><tspan x="180.0" dy="17.2">мову, що чинить опір тестам</tspan></text>
