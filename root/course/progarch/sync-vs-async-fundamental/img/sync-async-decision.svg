<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="200.0" y="74.5" width="760.0" height="35.0" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.8"/><text x="580.0" y="97.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Чи потрібен викликачеві результат ЗАРАЗ, щоб рухатися далі?</tspan></text>
<line x1="460.0" y1="109.5" x2="340.0" y2="176.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="109.5" x2="820.0" y2="176.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="370.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">так</text>
<text x="800.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ні / інше</text>
<rect x="150.0" y="181.9" width="300.0" height="52.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="300.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">СИНХРОННО</tspan><tspan x="300.0" dy="18.2">запит → відповідь</tspan></text>
<rect x="710.0" y="181.9" width="300.0" height="52.2" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="2.0"/><text x="860.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">АСИНХРОННО</tspan><tspan x="860.0" dy="18.2">повідомлення / подія</tspan></text>
<rect x="110.0" y="268.0" width="380.0" height="146.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="130.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• людина чекає відповіді на екрані</text>
<text x="130.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• потрібне негайне «вийшло / ні»</text>
<text x="130.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• проста лінійна логіка, один стек</text>
<text x="130.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• повільний B сам гальмує A</text>
<rect x="670.0" y="268.0" width="380.0" height="146.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="690.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• робота може статися пізніше</text>
<text x="690.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• має пережити падіння отримувача</text>
<text x="690.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• розходиться на багатьох (віяло)</text>
<text x="690.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">• вирівняти сплески навантаження</text>
<text x="580.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Вибір — на КОЖНУ взаємодію окремо, не на всю систему. Один продукт спокійно живе з обома.</text>
</svg>