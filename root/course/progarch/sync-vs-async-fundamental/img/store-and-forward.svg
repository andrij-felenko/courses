<line x1="186.0" y1="150.0" x2="238.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Відправник уже пішов, отримувач іще спить — а повідомлення живе на гачку в черзі. Це і є розчеплення в часі, зроблене руками.</text>
<line x1="70.0" y1="330.0" x2="1150.0" y2="330.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<text x="610.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один силует — буфер, що тримає повідомлення через розрив у часі — три епохи</text>
<rect x="120.0" y="418.0" width="260.0" height="68.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="448.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">телеграфне реле</tspan><tspan x="250.0" dy="16.9">гачок зі стрічкою</tspan></text>
<text x="250.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">1948</text>
