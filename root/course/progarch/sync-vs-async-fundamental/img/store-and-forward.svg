<text x="610.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Store-and-forward: вузол тримає повідомлення, доки наступний готовий</text>
<rect x="50.0" y="115.0" width="130.0" height="70.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="115.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Відправник</tspan></text>
