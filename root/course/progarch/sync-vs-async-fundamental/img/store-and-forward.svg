<text x="550.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реле-вузол (torn-tape) — оператор рве стрічку, читає адресу</text>
