<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що дозволено із запитом, а що — з командою</text>
<rect x="395.0" y="42.0" width="150.0" height="47.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="62.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">ЗАПИТ</tspan><tspan x="470.0" dy="16.9">(безпечний)</tspan></text>
<rect x="615.0" y="42.0" width="150.0" height="47.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="62.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">КОМАНДА</tspan><tspan x="690.0" dy="16.9">(з наслідком)</tspan></text>
<text x="300.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">викликати ще раз</text>
<rect x="395.0" y="108.0" width="150.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15703b" text-anchor="middle"><tspan x="470.0" dy="0.0">✓ те саме</tspan></text>
<rect x="615.0" y="108.0" width="150.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="690.0" dy="0.0">✗ ще один ефект</tspan></text>
<text x="300.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">переставити місцями</text>
<rect x="395.0" y="162.0" width="150.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="188.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15703b" text-anchor="middle"><tspan x="470.0" dy="0.0">✓ вільно</tspan></text>
<rect x="615.0" y="162.0" width="150.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="188.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="690.0" dy="0.0">✗ порядок важить</tspan></text>
<text x="300.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">закешувати відповідь</text>
<rect x="395.0" y="216.0" width="150.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="242.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15703b" text-anchor="middle"><tspan x="470.0" dy="0.0">✓ можна</tspan></text>
<rect x="615.0" y="216.0" width="150.0" height="44.0" rx="6" fill="#fef7e6" stroke="#b8860b" stroke-width="1.5"/><text x="690.0" y="242.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d0b" text-anchor="middle"><tspan x="690.0" dy="0.0">— нема чого</tspan></text>
<text x="300.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">не викликати, як не треба</text>
<rect x="395.0" y="270.0" width="150.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="296.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15703b" text-anchor="middle"><tspan x="470.0" dy="0.0">✓ дарма</tspan></text>
<rect x="615.0" y="270.0" width="150.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="296.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="690.0" dy="0.0">✗ дія пропаде</tspan></text>
<text x="300.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">протестувати</text>
<rect x="395.0" y="324.0" width="150.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="342.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15703b" text-anchor="middle"><tspan x="470.0" dy="0.0">✓ виклич і</tspan><tspan x="470.0" dy="15.6">порівняй</tspan></text>
<rect x="615.0" y="324.0" width="150.0" height="44.0" rx="6" fill="#fef7e6" stroke="#b8860b" stroke-width="1.5"/><text x="690.0" y="342.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d0b" text-anchor="middle"><tspan x="690.0" dy="0.0">⚠ перевіряй</tspan><tspan x="690.0" dy="15.6">зміну стану</tspan></text>
<text x="430.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">усі «так» лівого стовпця — з однієї причини: запит не лишає слідів</text>
</svg>