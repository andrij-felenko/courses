<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-bad" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Дерево каталогів проти реального графа імпортів</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">Охайна ієрархія тек приховує несанкціоновані горизонтальні зв’язки, цикли та критичний радіус utils</text>

  <!-- LEFT PANEL: Visual Directory Tree -->
  <rect x="24" y="76" width="436" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="104" font-size="14" font-weight="700" fill="#1a1a1a">Візуальна структура каталогів</text>
  <text x="44" y="122" font-size="12" fill="#6b7280">Уявний порядок: теки виглядають автономними й чистими</text>

  <!-- Explorer Container Card -->
  <rect x="44" y="138" width="396" height="294" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Explorer Header -->
  <path d="M44,138 H440 V166 H44 Z" fill="#f4f6f8"/>
  <line x1="44" y1="166" x2="440" y2="166" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="157" font-size="12" font-weight="700" fill="#6b7280">СТРУКТУРА ФАЙЛІВ ПРОЄКТУ</text>

  <!-- Tree Guide Lines -->
  <!-- Main root spine -->
  <line x1="68" y1="192" x2="68" y2="384" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Folder Branches from root -->
  <line x1="68" y1="210" x2="80" y2="210" stroke="#d0d7de" stroke-width="1"/>
  <line x1="68" y1="274" x2="80" y2="274" stroke="#d0d7de" stroke-width="1"/>
  <line x1="68" y1="338" x2="80" y2="338" stroke="#d0d7de" stroke-width="1"/>
  <line x1="68" y1="384" x2="80" y2="384" stroke="#d0d7de" stroke-width="1"/>

  <!-- Sub-spines for files inside folders -->
  <line x1="94" y1="218" x2="94" y2="250" stroke="#e1e4e8" stroke-width="1"/>
  <line x1="94" y1="232" x2="104" y2="232" stroke="#e1e4e8" stroke-width="1"/>
  <line x1="94" y1="250" x2="104" y2="250" stroke="#e1e4e8" stroke-width="1"/>

  <line x1="94" y1="282" x2="94" y2="314" stroke="#e1e4e8" stroke-width="1"/>
  <line x1="94" y1="296" x2="104" y2="296" stroke="#e1e4e8" stroke-width="1"/>
  <line x1="94" y1="314" x2="104" y2="314" stroke="#e1e4e8" stroke-width="1"/>

  <line x1="94" y1="346" x2="94" y2="360" stroke="#e1e4e8" stroke-width="1"/>
  <line x1="94" y1="360" x2="104" y2="360" stroke="#e1e4e8" stroke-width="1"/>

  <line x1="94" y1="392" x2="94" y2="424" stroke="#e1e4e8" stroke-width="1"/>
  <line x1="94" y1="406" x2="104" y2="406" stroke="#e1e4e8" stroke-width="1"/>
  <line x1="94" y1="424" x2="104" y2="424" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Root src -->
  <text x="58" y="186" font-size="13" font-weight="700" fill="#1a1a1a">src/</text>

  <!-- billing folder -->
  <text x="84" y="214" font-size="13" font-weight="700" fill="#2457d6">billing/</text>
  <rect x="356" y="200" width="70" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="391" y="214" font-size="12" fill="#2457d6" text-anchor="middle">модуль</text>
  <text x="110" y="236" font-size="12" fill="#1a1a1a">invoice.ts</text>
  <text x="110" y="254" font-size="12" fill="#1a1a1a">payment.ts</text>

  <!-- identity folder -->
  <text x="84" y="278" font-size="13" font-weight="700" fill="#2457d6">identity/</text>
  <rect x="356" y="264" width="70" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="391" y="278" font-size="12" fill="#2457d6" text-anchor="middle">модуль</text>
  <text x="110" y="300" font-size="12" fill="#1a1a1a">session.ts</text>
  <text x="110" y="318" font-size="12" fill="#1a1a1a">user.ts</text>

  <!-- telemetry folder -->
  <text x="84" y="342" font-size="13" font-weight="700" fill="#2457d6">telemetry/</text>
  <rect x="356" y="328" width="70" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="391" y="342" font-size="12" fill="#2457d6" text-anchor="middle">модуль</text>
  <text x="110" y="364" font-size="12" fill="#1a1a1a">tracker.ts</text>

  <!-- utils folder -->
  <text x="84" y="388" font-size="13" font-weight="700" fill="#6b7280">utils/</text>
  <rect x="356" y="374" width="70" height="20" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="391" y="388" font-size="12" fill="#6b7280" text-anchor="middle">спільне</text>
  <text x="110" y="410" font-size="12" fill="#1a1a1a">format.ts</text>
  <text x="110" y="428" font-size="12" fill="#1a1a1a">http.ts</text>

  <!-- Left Bottom Summary Card -->
  <rect x="44" y="446" width="396" height="74" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="58" y="468" font-size="13" font-weight="700" fill="#27ae60">Ілюзія порядку на рівні тек</text>
  <text x="58" y="488" font-size="12" fill="#1a1a1a">Теки виглядають автономними, але файлова структура</text>
  <text x="58" y="506" font-size="12" fill="#6b7280">не показує реальних зв’язків та імпортів між ними</text>


  <!-- RIGHT PANEL: Actual Import Graph -->
  <rect x="492" y="76" width="444" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="512" y="104" font-size="14" font-weight="700" fill="#1a1a1a">Реальний граф імпортів між файлами</text>
  <text x="512" y="122" font-size="12" fill="#c0392b">Хаос зв’язків: несанкціоновані перетини та спільне звалище</text>

  <!-- Module: billing -->
  <rect x="512" y="140" width="180" height="78" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="522" y="156" font-size="12" font-weight="700" fill="#2457d6">billing/</text>
  <rect x="520" y="164" width="76" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="558" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">invoice.ts</text>
  <rect x="604" y="164" width="80" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="644" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">payment.ts</text>

  <!-- Module: identity -->
  <rect x="736" y="140" width="180" height="78" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="746" y="156" font-size="12" font-weight="700" fill="#2457d6">identity/</text>
  <rect x="744" y="164" width="80" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="784" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">session.ts</text>
  <rect x="832" y="164" width="76" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="870" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">user.ts</text>

  <!-- Module: telemetry -->
  <rect x="512" y="348" width="136" height="78" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="522" y="364" font-size="12" font-weight="700" fill="#2457d6">telemetry/</text>
  <rect x="522" y="374" width="116" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="580" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">tracker.ts</text>

  <!-- Module: utils (SHARED DUMP) -->
  <rect x="680" y="250" width="236" height="176" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="692" y="270" font-size="12" font-weight="700" fill="#c0392b">utils/ (спільне звалище)</text>
  
  <rect x="692" y="282" width="94" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="739" y="298" font-size="12" fill="#1a1a1a" text-anchor="middle">format.ts</text>
  
  <rect x="798" y="282" width="106" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="851" y="298" font-size="12" fill="#1a1a1a" text-anchor="middle">http.ts</text>

  <!-- Leak Card inside utils -->
  <rect x="692" y="318" width="212" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="702" y="334" font-size="12" font-weight="700" fill="#c0392b">Витік: імпортує user.ts</text>
  <text x="702" y="350" font-size="12" fill="#6b7280">з утиліт назад у домен</text>

  <!-- Blast Radius Badge -->
  <rect x="692" y="372" width="212" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3 2"/>
  <text x="798" y="388" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Критичний радіус ураження</text>
  <text x="798" y="404" font-size="12" fill="#c0392b" text-anchor="middle">100% модулів залежать від utils</text>

  <!-- EDGES / ARROWS -->
  <!-- 1. Horizontal cross-module cycle between payment.ts and session.ts -->
  <line x1="684" y1="170" x2="734" y2="170" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <line x1="734" y1="182" x2="684" y2="182" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <text x="710" y="158" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">цикл</text>

  <!-- 2. Import from session.ts down to format.ts (curved entering from left) -->
  <path d="M744,188 C710,210 670,240 682,298" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 3. Accidental reverse import from utils leak up to user.ts (forming CYCLES!) -->
  <path d="M880,318 L880,198" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arr-bad)"/>
  <text x="906" y="246" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">цикл</text>

  <!-- 4. Import from tracker.ts to utils -->
  <path d="M638,386 L670,386" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- 5. Import from invoice.ts down to format.ts -->
  <path d="M558,188 C558,240 610,294 682,288" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Right Bottom Summary Card -->
  <rect x="512" y="446" width="404" height="74" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="526" y="468" font-size="13" font-weight="700" fill="#c0392b">Архітектурна деградація та циклічність</text>
  <text x="526" y="488" font-size="12" fill="#1a1a1a">Горизонтальні витоки та спільний utils створюють цикли</text>
  <text x="526" y="506" font-size="12" fill="#6b7280">Радіус ураження охоплює всю систему (монолітний вузол)</text>
</svg>
