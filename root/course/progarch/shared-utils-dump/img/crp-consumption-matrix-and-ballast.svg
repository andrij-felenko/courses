  <text x="40" y="490" font-size="12" font-weight="700" fill="#c0392b">Наслідок: зміна білінгу змушує ретестувати прошивку заліза!</text>
  <text x="40" y="512" font-size="12" fill="#6b7280">Штучне зчеплення незалежних систем через монолітне спільне звалище.</text>
