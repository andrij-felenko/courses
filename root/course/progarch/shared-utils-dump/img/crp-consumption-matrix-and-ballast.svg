  <text x="504" y="356" font-size="12" font-weight="700" fill="#1a1a1a">Розщеплення utils на монофункціональні когезивні бібліотеки</text>
  <text x="504" y="376" font-size="12" fill="#1a1a1a">• Висока згуртованість: кожна бібліотека виконує одну задачу домену.</text>
  <text x="504" y="396" font-size="12" fill="#1a1a1a">• Ліквідація баласту: |F_total| = |Fₖ| = 1, коефіцієнт Wₖ = 0% (ідеал CRP).</text>
