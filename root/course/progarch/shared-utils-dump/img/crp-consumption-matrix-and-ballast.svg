  <text x="40" y="336" font-size="14" font-weight="700" fill="#c0392b">Чому спільний utils порушує принцип CRP (Common Reuse)</text>
  <text x="40" y="356" font-size="12" font-weight="700" fill="#1a1a1a">Принцип CRP: клієнт не повинен залежати від того, чого не викликає</text>
  <text x="40" y="376" font-size="12" fill="#1a1a1a">• Випадкова зв'язність: згуртованість H = 1/N → 0 за відсутності викликів.</text>
  <text x="40" y="396" font-size="12" fill="#1a1a1a">• Баластне поле Wₖ = 91.7%: сервіс тягне 11 непотрібних йому функцій.</text>
