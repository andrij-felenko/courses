<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Штучне зачеплення через utils проти локального копіювання</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Спільний модуль заради 5 рядків зв'язує релізи; локальна копія зберігає автономність</text>

  <!-- ЛІВА ПАНЕЛЬ: Антипатерн -->
  <rect x="24" y="72" width="444" height="366" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="86" width="412" height="32" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="246" y="107" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">Штучне зачеплення через спільний utils</text>

  <!-- Ліва панель: Модуль A -->
  <rect x="40" y="130" width="196" height="76" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="150" font-size="13" font-weight="bold" fill="#1a1a1a">Модуль A (Замовлення)</text>
  <text x="52" y="170" font-size="12" fill="#6b7280">Потребує 5 рядків коду</text>
  <text x="52" y="190" font-size="12" font-weight="bold" fill="#c0392b">Викликає utils.formatDate()</text>

  <!-- Ліва панель: Модуль B -->
  <rect x="256" y="130" width="196" height="76" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="268" y="150" font-size="13" font-weight="bold" fill="#1a1a1a">Модуль B (Платежі)</text>
  <text x="268" y="170" font-size="12" fill="#6b7280">Потребує ті самі 5 рядків</text>
  <text x="268" y="190" font-size="12" font-weight="bold" fill="#c0392b">Викликає utils.formatDate()</text>

  <!-- Ліва панель: Стрілки залежностей -->
  <line x1="138" y1="206" x2="160" y2="234" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="354" y1="206" x2="332" y2="234" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="246" y="222" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">спільна залежність</text>

  <!-- Ліва панель: Спільний вузол utils -->
  <rect x="90" y="236" width="312" height="76" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="246" y="256" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">Спільний пакет: shared/utils</text>
  <text x="246" y="276" font-size="12" text-anchor="middle" fill="#1a1a1a">5 рядків formatDate() заради DRY</text>
  <text x="246" y="296" font-size="12" text-anchor="middle" fill="#6b7280">Спільне версіонування й чужі правки</text>

  <!-- Ліва панель: Наслідки -->
  <rect x="40" y="330" width="412" height="88" rx="6" fill="white" stroke="#c0392b" stroke-width="1.2"/>
  <text x="52" y="350" font-size="12" font-weight="bold" fill="#c0392b">Наслідки штучного зачеплення:</text>
  <text x="52" y="370" font-size="12" fill="#1a1a1a">• Спільний цикл релізів: оновлення utils зачіпає обидва модулі</text>
  <text x="52" y="390" font-size="12" fill="#1a1a1a">• Великий радіус відмови: помилка в утиліті ламає обидва модулі</text>
  <text x="52" y="408" font-size="12" fill="#6b7280">• Економія 5 рядків коштує втрати автономності команд</text>

  <!-- ПРАВА ПАНЕЛЬ: Розв'язок -->
  <rect x="492" y="72" width="444" height="366" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="508" y="86" width="412" height="32" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="714" y="107" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">Локальне дублювання (автономність)</text>

  <!-- Права панель: Модуль A -->
  <rect x="508" y="130" width="196" height="182" rx="6" fill="white" stroke="#27ae60" stroke-width="1.2"/>
  <text x="520" y="152" font-size="13" font-weight="bold" fill="#1a1a1a">Модуль A (Замовлення)</text>
  <text x="520" y="170" font-size="12" fill="#6b7280">Автономний реліз v1.8</text>
  <rect x="518" y="184" width="176" height="74" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="528" y="204" font-size="12" font-weight="bold" fill="#27ae60">internal/format_date.py</text>
  <text x="528" y="224" font-size="12" fill="#1a1a1a">• 5 локальних рядків коду</text>
  <text x="528" y="244" font-size="12" fill="#6b7280">• Приватна реалізація</text>
  <text x="520" y="280" font-size="12" font-weight="bold" fill="#27ae60">Нуль зовнішніх зв'язків</text>
  <text x="520" y="298" font-size="12" fill="#6b7280">Деплой без узгоджень</text>

  <!-- Права панель: Модуль B -->
  <rect x="724" y="130" width="196" height="182" rx="6" fill="white" stroke="#27ae60" stroke-width="1.2"/>
  <text x="736" y="152" font-size="13" font-weight="bold" fill="#1a1a1a">Модуль B (Платежі)</text>
  <text x="736" y="170" font-size="12" fill="#6b7280">Автономний реліз v3.2</text>
  <rect x="734" y="184" width="176" height="74" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="744" y="204" font-size="12" font-weight="bold" fill="#27ae60">internal/format_date.py</text>
  <text x="744" y="224" font-size="12" fill="#1a1a1a">• 5 локальних рядків коду</text>
  <text x="744" y="244" font-size="12" fill="#6b7280">• Еволюціонує незалежно</text>
  <text x="736" y="280" font-size="12" font-weight="bold" fill="#27ae60">Нуль зовнішніх зв'язків</text>
  <text x="736" y="298" font-size="12" fill="#6b7280">Деплой без узгоджень</text>

  <!-- Права панель: Переваги -->
  <rect x="508" y="330" width="412" height="88" rx="6" fill="white" stroke="#27ae60" stroke-width="1.2"/>
  <text x="520" y="350" font-size="12" font-weight="bold" fill="#27ae60">Переваги локального копіювання:</text>
  <text x="520" y="370" font-size="12" fill="#1a1a1a">• Повна автономність випусків: модуль A деплоїться без модуля B</text>
  <text x="520" y="390" font-size="12" fill="#1a1a1a">• Нульовий радіус відмови: внутрішні правки не зачіпають сусідів</text>
  <text x="520" y="408" font-size="12" fill="#6b7280">• 5 дубльованих рядків дешевші за синхронізацію релізів</text>
</svg>
