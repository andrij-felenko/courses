<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Цільова структура системи після ліквідації common-utils</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Ациклічний граф залежностей: доменні моделі, локалізовані утиліти та автономні бібліотеки</text>

  <!-- Головна панель -->
  <rect x="25" y="68" width="910" height="452" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="91" font-size="12" font-weight="bold" fill="#6b7280">АРХІТЕКТУРА БЕЗ СПІЛЬНОГО ЗВАЛИЩА (АЦИКЛІЧНИЙ DAG-ГРАФ ЗАЛЕЖНОСТЕЙ)</text>

  <!-- РІВЕНЬ 1: СЕРВІСИ-СПОЖИВАЧІ -->
  <text x="45" y="113" font-size="12" font-weight="bold" fill="#2457d6">1. СЕРВІСИ-СПОЖИВАЧІ — ЛОКАЛІЗОВАНІ ІНСТРУМЕНТИ ТА ФОРМАТУВАННЯ</text>

  <!-- OrderService -->
  <rect x="45" y="126" width="275" height="76" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="182.5" y="146" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">OrderService</text>
  <text x="182.5" y="165" font-size="12" text-anchor="middle" fill="#1a1a1a">+ formatOrderSummary()</text>
  <text x="182.5" y="186" font-size="12" text-anchor="middle" fill="#27ae60">✓ Форматування в сервісі</text>

  <!-- BillingService -->
  <rect x="342" y="126" width="275" height="76" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="479.5" y="146" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">BillingService</text>
  <text x="479.5" y="165" font-size="12" text-anchor="middle" fill="#1a1a1a">+ formatInvoicePdf()</text>
  <text x="479.5" y="186" font-size="12" text-anchor="middle" fill="#27ae60">✓ Форматування в сервісі</text>

  <!-- NotificationService -->
  <rect x="640" y="126" width="275" height="76" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="777.5" y="146" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">NotificationService</text>
  <text x="777.5" y="165" font-size="12" text-anchor="middle" fill="#1a1a1a">+ formatEmailHeader()</text>
  <text x="777.5" y="186" font-size="12" text-anchor="middle" fill="#27ae60">✓ Форматування в сервісі</text>

  <!-- ЗВ'ЯЗКИ МІЖ РІВНЕМ 1 ТА РІВНЕМ 2 -->
  <!-- OrderService -> Order Model -->
  <line x1="100" y1="202" x2="100" y2="262" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="88" y="235" font-size="12" text-anchor="end" fill="#27ae60">залежить</text>

  <!-- РІВЕНЬ 2: ДОМЕННИЙ ШАР (Напис розташовано між стрілками x=100 та x=540, без перетинів) -->
  <text x="120" y="246" font-size="12" font-weight="bold" fill="#27ae60">2. ДОМЕННІ МОДЕЛІ — ІНКАПСУЛЬОВАНІ ВАЛІДАЦІЇ ТА РОЗРАХУНКИ</text>

  <!-- BillingService -> Invoice Model -->
  <line x1="540" y1="202" x2="540" y2="262" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="552" y="235" font-size="12" text-anchor="start" fill="#27ae60">залежить</text>

  <!-- NotificationService -> Invoice Model -->
  <line x1="777" y1="202" x2="777" y2="262" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="789" y="235" font-size="12" text-anchor="start" fill="#27ae60">виклики</text>

  <!-- Order Domain Model -->
  <rect x="45" y="262" width="414" height="100" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="252" y="282" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Доменна модель Order (Багата сутність)</text>
  <text x="252" y="304" font-size="12" text-anchor="middle" fill="#1a1a1a">• validateStatusTransition() &amp; validateItems()</text>
  <text x="252" y="326" font-size="12" text-anchor="middle" fill="#1a1a1a">• calculateDiscount() &amp; calculateTotal()</text>
  <text x="252" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">✓ Правила повернуто з utils у домен</text>

  <!-- Invoice Domain Model -->
  <rect x="501" y="262" width="414" height="100" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="708" y="282" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Доменна модель Invoice (Багата сутність)</text>
  <text x="708" y="304" font-size="12" text-anchor="middle" fill="#1a1a1a">• checkPaymentRules() &amp; validateVatId()</text>
  <text x="708" y="326" font-size="12" text-anchor="middle" fill="#1a1a1a">• recalculateTax() &amp; applyPenalty()</text>
  <text x="708" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">✓ Правила повернуто з utils у домен</text>

  <!-- ЗВ'ЯЗОК МІЖ РІВНЕМ 2 ТА РІВНЕМ 3 -->
  <!-- Invoice Model -> Standalone Library -->
  <line x1="535" y1="362" x2="535" y2="408" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="523" y="388" font-size="12" text-anchor="end" fill="#27ae60">використовує</text>

  <!-- РІВЕНЬ 3: АВТОНОМНІ БІБЛІОТЕКИ ТА СТАТУС COMMON-UTILS -->
  <text x="45" y="394" font-size="12" font-weight="bold" fill="#1a1a1a">3. ТЕХНІЧНІ АЛГОРИТМИ ТА СТАТУС COMMON-UTILS</text>
  <text x="757" y="388" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">0 зв'язків / 0 залежностей</text>

  <!-- Standalone Library -->
  <rect x="45" y="408" width="530" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="310" y="430" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">pkg / crypto-core (Автономна міні-бібліотека)</text>
  <text x="310" y="452" font-size="12" text-anchor="middle" fill="#1a1a1a">Чистий API (AES/SHA) • Власні unit-тести • Незалежний реліз</text>
  <text x="310" y="476" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">✓ Суто технічний алгоритм винесено в автономну ПКГ</text>

  <!-- Common-Utils Status -->
  <rect x="600" y="408" width="315" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="757" y="430" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">common-utils</text>
  <text x="757" y="452" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">⛔ ПАКЕТ ЛІКВІДОВАНО</text>
  <text x="757" y="476" font-size="12" text-anchor="middle" fill="#6b7280">Залежностей: 0 | Спільне зачеплення: 0</text>
</svg>
