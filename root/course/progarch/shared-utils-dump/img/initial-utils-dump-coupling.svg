<svg viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Спільний пакет «common-utils» як хаотичне звалище</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Накопичення різнородного коду утворює приховані цикли та штучне зачеплення модулів</text>

  <!-- Left Top Panel: BillingService -->
  <rect x="35" y="80" width="220" height="190" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="35" y="80" width="220" height="36" rx="8" fill="#eaf0fd"/>
  <line x1="35" y1="116" x2="255" y2="116" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">BillingService</text>
  <text x="145" y="131" text-anchor="middle" font-size="12" fill="#6b7280">(Модуль білінгу)</text>
  <rect x="45" y="140" width="200" height="58" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="53" y="157" font-size="12" font-weight="bold" fill="#1a1a1a">generateInvoice()</text>
  <text x="53" y="173" font-size="12" fill="#6b7280">Розрахунок податків</text>
  <text x="53" y="189" font-size="12" fill="#6b7280">та дати через utils</text>
  <rect x="45" y="206" width="200" height="56" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="53" y="223" font-size="12" font-weight="bold" fill="#1a1a1a">processPayment()</text>
  <text x="53" y="239" font-size="12" fill="#6b7280">Розрахунок знижок</text>
  <text x="53" y="255" font-size="12" fill="#6b7280">через utils</text>

  <!-- Left Bottom Panel: DomainModels -->
  <rect x="35" y="290" width="220" height="115" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="35" y="290" width="220" height="32" rx="8" fill="#eaf0fd"/>
  <line x1="35" y1="322" x2="255" y2="322" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="311" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Доменні Моделі</text>
  <text x="47" y="340" font-size="12" fill="#1a1a1a">• Сутності: User, Invoice</text>
  <text x="47" y="362" font-size="12" fill="#c0392b">• Викликають utils для</text>
  <text x="59" y="382" font-size="12" fill="#c0392b">валідації email / phone</text>

  <!-- Gap 1 Connections & Cycle Callout Box -->
  <!-- Billing -> utils import arrow -->
  <path d="M 255 140 L 342 140" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="298" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">import</text>

  <!-- Cycle Warning Callout Box -->
  <rect x="263" y="200" width="74" height="66" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="300" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ЦИКЛ!</text>
  <text x="300" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">utils ⟲</text>
  <text x="300" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Домен</text>

  <!-- Cycle Down Arrow: utils Category 1 -> Callout Box -> DomainModels -->
  <path d="M 350 165 L 300 165 L 300 200" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 300 266 L 300 310 L 263 310" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>

  <!-- Cycle Return Arrow: DomainModels -> utils -->
  <path d="M 255 365 L 342 365" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>
  <text x="298" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">виклик</text>

  <!-- Center Panel: common-utils -->
  <rect x="350" y="80" width="310" height="325" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="350" y="80" width="310" height="36" rx="8" fill="#c0392b"/>
  <line x1="350" y1="116" x2="660" y2="116" stroke="#c0392b" stroke-width="2"/>
  <text x="505" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Пакет common-utils (Звалище)</text>

  <!-- Category 1: Business rules -->
  <rect x="362" y="126" width="286" height="78" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="372" y="146" font-size="12" font-weight="bold" fill="#c0392b">1. Прихована бізнес-логіка</text>
  <text x="372" y="165" font-size="12" fill="#1a1a1a">calculateTax(User, Invoice)</text>
  <text x="372" y="189" font-size="12" font-weight="bold" fill="#c0392b">⚠ Залежить від Доменних Моделей!</text>

  <!-- Category 2: Formatting -->
  <rect x="362" y="214" width="286" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="372" y="234" font-size="12" font-weight="bold" fill="#1a1a1a">2. Локальне форматування</text>
  <text x="372" y="253" font-size="12" fill="#1a1a1a">formatInvoiceDate(date)</text>
  <text x="372" y="277" font-size="12" fill="#6b7280">Специфічне лише для Білінгу</text>

  <!-- Category 3: Tech utils -->
  <rect x="362" y="302" width="286" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="372" y="321" font-size="12" font-weight="bold" fill="#1a1a1a">3. Технічні алгоритми</text>
  <text x="372" y="340" font-size="12" fill="#1a1a1a">slugify(str), sanitizeJson(str)</text>
  <text x="372" y="364" font-size="12" fill="#6b7280">Чисті алгоритми без залежностей</text>
  <text x="372" y="381" font-size="12" fill="#6b7280">(кандидати в автономну бібліотеку)</text>

  <!-- Gap 2 Connection: Telemetry -> utils import arrow -->
  <path d="M 740 140 L 668 140" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="704" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">import</text>

  <!-- Right Top Panel: TelemetryService -->
  <rect x="740" y="80" width="185" height="190" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="740" y="80" width="185" height="36" rx="8" fill="#eaf0fd"/>
  <line x1="740" y1="116" x2="925" y2="116" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="832.5" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">TelemetryService</text>
  <text x="832.5" y="131" text-anchor="middle" font-size="12" fill="#6b7280">(Сервіс телеметрії)</text>
  <rect x="750" y="140" width="165" height="58" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="758" y="157" font-size="12" font-weight="bold" fill="#1a1a1a">logEvent()</text>
  <text x="758" y="173" font-size="12" fill="#6b7280">Використовує</text>
  <text x="758" y="189" font-size="12" fill="#6b7280">sanitizeJson()</text>
  <rect x="750" y="206" width="165" height="56" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="758" y="223" font-size="12" font-weight="bold" fill="#c0392b">exportMetrics()</text>
  <text x="758" y="239" font-size="12" fill="#c0392b">Тягне весь utils</text>
  <text x="758" y="255" font-size="12" fill="#c0392b">(і бізнес-код!)</text>

  <!-- Bottom Consequences Panel -->
  <rect x="35" y="420" width="890" height="100" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="50" y="442" font-size="13" font-weight="bold" fill="#c0392b">Наслідки монолітного пакета «common-utils» (Хаотичне звалище):</text>
  <text x="60" y="464" font-size="12" fill="#1a1a1a">• <tspan font-weight="bold" fill="#c0392b">Прихований цикл залежностей:</tspan> Домен ⟲ common-utils маскує порушення інкапсуляції та шарів системи.</text>
  <text x="60" y="484" font-size="12" fill="#1a1a1a">• <tspan font-weight="bold" fill="#c0392b">Штучне зачеплення модулів:</tspan> Зміна дати в Білінгу вимагає перетестування та перезапуску Сервісу Телеметрії.</text>
  <text x="60" y="504" font-size="12" fill="#1a1a1a">• <tspan font-weight="bold" fill="#c0392b">Блокування випусків:</tspan> Будь-яка локальна зміна перебудовує весь граф проекту та сповільнює CI/CD.</text>
</svg>
