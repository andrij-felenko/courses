<rect x="970.0" y="389.5" width="176.0" height="33.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="1058.0" y="410.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1058.0" dy="0.0">Графове</tspan></text>
