<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родину бере той тиск, що назвався; решту тримає дефолт</text>
<rect x="82.0" y="259.7" width="228.0" height="100.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="196.0" y="280.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="196.0" dy="0.0">Реляційне</tspan><tspan x="196.0" dy="16.9">за замовчуванням</tspan><tspan x="196.0" dy="16.9">———</tspan><tspan x="196.0" dy="16.9">лишайся, поки</tspan><tspan x="196.0" dy="16.9">не названо тиск</tspan></text>
<line x1="310.0" y1="310.0" x2="452.0" y2="310.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="452.0" y1="118.0" x2="452.0" y2="502.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="452.0" y1="118.0" x2="566.0" y2="118.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="874.0" y1="118.0" x2="966.0" y2="118.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="570.0" y="94.8" width="300.0" height="46.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="114.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">гарячий пошук за ключем,</tspan><tspan x="720.0" dy="15.0">точковий, мілісекунди</tspan></text>
<rect x="970.0" y="101.5" width="176.0" height="33.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="1058.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1058.0" dy="0.0">Ключ-значення</tspan></text>
<line x1="452.0" y1="214.0" x2="566.0" y2="214.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="874.0" y1="214.0" x2="966.0" y2="214.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
