<rect x="970.0" y="197.5" width="176.0" height="33.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="1058.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1058.0" dy="0.0">Документне</tspan></text>
<line x1="452.0" y1="310.0" x2="566.0" y2="310.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="874.0" y1="310.0" x2="966.0" y2="310.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="570.0" y="286.8" width="300.0" height="46.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="306.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">потік append-only вимірів;</tspan><tspan x="720.0" dy="15.0">читання — діапазони й агрегати</tspan></text>
