<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 466" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="466" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключ ідемпотентності на крок: доставка «щонайменше раз», а ефект — рівно раз</text>
<rect x="40.0" y="92.0" width="184.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="132.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="132.0" dy="0.0">доставка 1</tspan></text>
<rect x="40.0" y="300.0" width="184.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="132.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="132.0" dy="0.0">доставка 2 (дубль)</tspan></text>
<line x1="224.0" y1="115.0" x2="344.0" y2="178.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="224.0" y1="323.0" x2="344.0" y2="262.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="344.0" y="150.0" width="236.0" height="140.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="2.0"/><text x="462.0" y="207.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="462.0" dy="0.0">ВАРТОВИЙ:</tspan><tspan x="462.0" dy="16.9">бачив ключ</tspan><tspan x="462.0" dy="16.9">(sagaId, revokeAccess)?</tspan></text>
<line x1="580.0" y1="184.0" x2="676.0" y2="150.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="676.0" y="116.0" width="456.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="904.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="904.0" dy="0.0">ні → виконати revokeOldKeys,</tspan><tspan x="904.0" dy="16.2">записати ключ + результат</tspan></text>
<line x1="580.0" y1="256.0" x2="676.0" y2="300.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="676.0" y="290.0" width="456.0" height="66.0" rx="6" fill="#efefef" stroke="#6b7280" stroke-width="1.6"/><text x="904.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="904.0" dy="0.0">так → повернути збережений</tspan><tspan x="904.0" dy="16.2">результат, 0 ефекту</tspan></text>
<rect x="266.0" y="392.0" width="628.0" height="52.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="580.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">ефект стався РІВНО раз, попри дві доставки — ключ ідемпотентності знешкодив дубль</tspan></text>
