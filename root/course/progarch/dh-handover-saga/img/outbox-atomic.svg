<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1264 588" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1264" height="588" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="632.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Outbox: стан саги й подія кроку — в одній транзакції, тож крах не лишає напіврезультату</text>
<rect x="44.0" y="60.0" width="556.0" height="500.0" rx="12" fill="#fbf3f2" stroke="#c0392b" stroke-width="1.6"/>
<text x="322.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">НАЇВНИЙ ПОДВІЙНИЙ ЗАПИС</text>
<rect x="102.0" y="120.0" width="440.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="322.0" y="150.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="322.0" dy="0.0">1. коміт: посунути стан саги → крок DONE</tspan></text>
<line x1="322.0" y1="176.0" x2="322.0" y2="206.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="311.0" y1="211.0" x2="333.0" y2="233.0" stroke="#c0392b" stroke-width="3.0"/><line x1="311.0" y1="233.0" x2="333.0" y2="211.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="350.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">крах саме тут</text>
<line x1="322.0" y1="240.0" x2="322.0" y2="270.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="102.0" y="272.0" width="440.0" height="52.0" rx="6" fill="#efefef" stroke="#6b7280" stroke-width="1.6"/><text x="322.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="322.0" dy="0.0">2. публікація події «крок зроблено»</tspan></text>
<text x="322.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">не сталося — подія загубилась</text>
<rect x="80.0" y="442.0" width="484.0" height="92.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="322.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="322.0" dy="0.0">стан саги пішов уперед, а подія кроку</tspan><tspan x="322.0" dy="16.2">загубилась → крок ніколи не поїде далі.</tspan><tspan x="322.0" dy="16.2">(Або навпаки: подія без коміту — привид.)</tspan></text>
<rect x="664.0" y="60.0" width="556.0" height="500.0" rx="12" fill="#f3fbf6" stroke="#27ae60" stroke-width="1.6"/>
<text x="942.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">OUTBOX: ОДНА ТРАНЗАКЦІЯ</text>
<rect x="704.0" y="110.0" width="476.0" height="180.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<text x="942.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ОДНА транзакція:</text>
<rect x="720.0" y="142.0" width="444.0" height="38.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="942.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="942.0" dy="0.0">діло кроку — напр. відкликати ключі</tspan></text>
<rect x="720.0" y="186.0" width="444.0" height="38.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="942.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="942.0" dy="0.0">нова позиція саги → крок DONE</tspan></text>
<rect x="720.0" y="230.0" width="444.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="942.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="942.0" dy="0.0">рядок outbox: подія «крок зроблено»</tspan></text>
<text x="942.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">COMMIT — усе або нічого</text>
<line x1="942.0" y1="320.0" x2="942.0" y2="350.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="742.0" y="352.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="942.0" y="381.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="942.0" dy="0.0">реле: читає outbox → публікує в брокер</tspan></text>
<text x="942.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">крах будь-де — реле по підйому дочитає й опублікує</text>
<rect x="700.0" y="442.0" width="484.0" height="92.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="942.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="942.0" dy="0.0">подія народжується в ТІЙ САМІЙ транзакції,</tspan><tspan x="942.0" dy="16.2">що й діло: коміт дає обидва,</tspan><tspan x="942.0" dy="16.2">крах — жодного напіврезультату</tspan></text>
</svg>