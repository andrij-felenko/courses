<rect x="761.3" y="284.0" width="47.4" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="785.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">стан</tspan></text>
<line x1="720.0" y1="214.0" x2="720.0" y2="376.0" stroke="#c0392b" stroke-width="4.0" stroke-dasharray="7,5"/>
<text x="720.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">«замок не буває нічий» — рветься</text>
<text x="720.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">через стіну одну транзакцію не провести</text>
</svg>