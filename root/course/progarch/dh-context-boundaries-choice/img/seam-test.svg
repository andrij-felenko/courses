<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тест шва: між агрегатами — можна, крізь агрегат — ні</text>
<line x1="480.0" y1="60.0" x2="480.0" y2="470.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,6"/>
<text x="240.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Стіна ТУТ — так</text>
<circle cx="120.0" cy="130.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="120.0" y="134.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="146.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">слово роздвоюється у значенні</text>
<circle cx="120.0" cy="174.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="120.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="146.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">різні годинники зміни</text>
<circle cx="120.0" cy="218.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="120.0" y="222.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="146.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">різна потреба в узгодженні</text>
<rect x="131.7" y="333.5" width="86.7" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="175.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Керування</tspan></text>
<rect x="312.8" y="333.5" width="64.5" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="345.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">Білінг</tspan></text>
<line x1="260.0" y1="316.0" x2="260.0" y2="384.0" stroke="#27ae60" stroke-width="4.0"/>
<text x="240.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">стіна між різними світами</text>
<text x="720.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Стіна ТУТ — ні</text>
<circle cx="600.0" cy="140.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="600.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="626.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">крізь один інваріант</text>
<rect x="590.0" y="220.0" width="260.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
