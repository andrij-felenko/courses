<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне слово — три несумісні значення</text>
<line x1="248.0" y1="285.0" x2="510.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="89.7" width="360.0" height="100.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="700.0" y="110.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ХАБ · КЕРУВАННЯ</tspan><tspan x="700.0" dy="16.9">жива річ: можливості,</tspan><tspan x="700.0" dy="16.9">поточний стан, команди</tspan><tspan x="700.0" dy="16.9">тут живе інваріант</tspan><tspan x="700.0" dy="16.9">змінюється: новий протокол / залізо</tspan></text>
<line x1="248.0" y1="285.0" x2="510.0" y2="285.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="243.2" width="360.0" height="83.7" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/><text x="700.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ТЕЛЕМЕТРІЯ</tspan><tspan x="700.0" dy="16.9">джерело ряду вимірів у часі</tspan><tspan x="700.0" dy="16.9">ні стану, ні життєвого циклу</tspan><tspan x="700.0" dy="16.9">змінюється: retention / аналітика</tspan></text>
<line x1="248.0" y1="285.0" x2="510.0" y2="430.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="388.1" width="360.0" height="83.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="700.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">БІЛІНГ · ЛІЧБА</tspan><tspan x="700.0" dy="16.9">рядок тарифу проти плану дому</tspan><tspan x="700.0" dy="16.9">байдуже, лампа то чи замок</tspan><tspan x="700.0" dy="16.9">змінюється: ціни / плани</tspan></text>
<rect x="60.0" y="265.0" width="180.0" height="40.0" rx="6" fill="#fff8e1" stroke="#6b7280" stroke-width="2.0"/><text x="150.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">«пристрій»?</tspan></text>
<text x="500.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">де слово роздвоюється І годинники зміни різні — там і має пройти стіна</text>
</svg>