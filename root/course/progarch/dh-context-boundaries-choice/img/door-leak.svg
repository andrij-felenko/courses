<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двері, лишені без нагляду, зводять стіну нанівець</text>
<rect x="360.0" y="108.0" width="300.0" height="96.0" rx="6" fill="#fff8e1" stroke="#6b7280" stroke-width="2.0"/>
<text x="510.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">contracts — двері</text>
<text x="510.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">reexport Control.Device</text>
<text x="510.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(нутро тікає назовні)</text>
<line x1="230.0" y1="150.0" x2="358.0" y2="150.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="294.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">дозволено</text>
<line x1="662.0" y1="150.0" x2="770.0" y2="150.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="716.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">протягує нутро</text>
<rect x="90.0" y="133.0" width="140.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="160.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">billing</tspan></text>
<rect x="770.0" y="125.0" width="160.0" height="49.9" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="3.0"/><text x="850.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">control</tspan><tspan x="850.0" dy="16.9">Control.Device</tspan></text>
<text x="500.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">правило billing → control зелене — а модель вже в руках білінгу</text>
<rect x="271.4" y="318.5" width="457.2" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="500.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">лік: стерегти й двері — правило «contracts не знає control»</tspan></text>
</svg>