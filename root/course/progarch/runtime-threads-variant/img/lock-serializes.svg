<rect x="120.0" y="408.0" width="680.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Що більше потоків — то довша черга біля замка: замок стає послідовною часткою, і Амдал вирахує її зі стелі прискорення.</tspan></text>
