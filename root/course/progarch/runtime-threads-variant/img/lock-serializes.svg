<line x1="165.0" y1="116.0" x2="406.0" y2="216.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45.0" y="150.0" width="120.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="105.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">потік 2</text>
<line x1="165.0" y1="171.0" x2="406.0" y2="224.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/>
