<text x="105.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">потік 3</text>
<line x1="165.0" y1="226.0" x2="406.0" y2="224.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/>
<rect x="45.0" y="260.0" width="120.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="105.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">потік 4</text>
<line x1="165.0" y1="281.0" x2="406.0" y2="224.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/>
