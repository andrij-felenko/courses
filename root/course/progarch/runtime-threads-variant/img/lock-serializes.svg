<line x1="165.0" y1="336.0" x2="406.0" y2="224.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="700.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">критична секція: рівно один потік усередині</text>
<rect x="408.0" y="185.0" width="84.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="450.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">замок</text>
<text x="450.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">по одному</text>
<line x1="492.0" y1="220.0" x2="593.0" y2="220.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="595.0" y="178.0" width="270.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="730.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">спільний стан</text>
<text x="730.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">реєстр пристроїв</text>
