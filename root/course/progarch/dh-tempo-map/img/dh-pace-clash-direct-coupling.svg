<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конфлікт темпів змін при прямому зчепленні підсистем (Pace Clash)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Прямі синхронні виклики з динамічного UI до апаратного ядра спричиняють деренчання реле та релізний параліч</text>

  <!-- ЛІВА ПАНЕЛЬ: Швидкий темп (UI / Web) -->
  <rect x="30" y="85" width="270" height="360" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="165" y="115" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Швидкий темп (UI / Web)</text>
  <text x="165" y="135" font-size="12" fill="#1a1a1a" text-anchor="middle">Часті релізи (щотижня) · Висока частота</text>

  <!-- Блок мобільного UI -->
  <rect x="50" y="155" width="230" height="65" rx="6" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="165" y="180" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мобільний UI &amp; Сценарії</text>
  <text x="165" y="198" font-size="12" fill="#6b7280" text-anchor="middle">Шторм вебхуків (100+ запитів/с)</text>

  <!-- Блок потоку викликів -->
  <rect x="50" y="235" width="230" height="190" rx="6" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="165" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Потік викликів без обмежень:</text>
  <text x="65" y="282" font-size="12" fill="#1a1a1a">• TOGGLE (0.01с)</text>
  <text x="65" y="304" font-size="12" fill="#1a1a1a">• TOGGLE (0.02с)</text>
  <text x="65" y="326" font-size="12" fill="#1a1a1a">• TOGGLE (0.03с)</text>

  <rect x="62" y="338" width="206" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="165" y="356" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⚡ Лавинне перемикання</text>
  <text x="165" y="372" font-size="12" fill="#6b7280" text-anchor="middle">Прямі HTTP/RPC запити</text>


  <!-- СЕРЕДНЯ ПАНЕЛЬ: Пряме зчеплення та проблеми -->
  <rect x="310" y="85" width="340" height="360" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="115" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">🚫 Конфлікт темпів (Direct Coupling)</text>
  <text x="480" y="135" font-size="12" fill="#1a1a1a" text-anchor="middle">Відсутність буфера / ACL між шарами</text>

  <!-- Стрілка прямої трансляції -->
  <text x="480" y="163" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Пряма трансляція високої частоти запитів</text>
  <line x1="325" y1="173" x2="635" y2="173" stroke="#c0392b" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arr-red)"/>

  <!-- Блок проблеми 1: Деренчання -->
  <rect x="325" y="195" width="310" height="95" rx="6" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="217" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Деренчання контактів (Contact Chatter)</text>
  <text x="480" y="237" font-size="12" fill="#1a1a1a" text-anchor="middle">Реле фізично клацає 50 разів/сек</text>
  <text x="480" y="257" font-size="12" fill="#1a1a1a" text-anchor="middle">→ Механічний знос, дуга та перегрів</text>
  <text x="480" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Апаратура виходить з ладу за дні</text>

  <!-- Блок проблеми 2: Релізний параліч -->
  <rect x="325" y="305" width="310" height="120" rx="6" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="327" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Релізний параліч (Release Train Lock)</text>
  <text x="480" y="347" font-size="12" fill="#1a1a1a" text-anchor="middle">Будь-яка зміна у вихідному UI DTO</text>
  <text x="480" y="367" font-size="12" fill="#1a1a1a" text-anchor="middle">вимагає синхронного перепрошивання</text>
  <text x="480" y="387" font-size="12" fill="#1a1a1a" text-anchor="middle">фізичних контролерів обладнання</text>
  <text x="480" y="407" font-size="12" fill="#6b7280" text-anchor="middle">Команда втрачає автономність</text>


  <!-- ПРАВА ПАНЕЛЬ: Повільний темп (Hardware) -->
  <rect x="660" y="85" width="270" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="115" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Повільний темп (Hardware)</text>
  <text x="795" y="135" font-size="12" fill="#6b7280" text-anchor="middle">Рідкісні релізи · Фізичні межі</text>

  <!-- Блок апаратного шлюзу -->
  <rect x="680" y="155" width="230" height="75" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="795" y="178" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шлюз Zigbee &amp; Силові реле</text>
  <text x="795" y="198" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фізичний ліміт: max 1-2 перем/с</text>
  <text x="795" y="216" font-size="12" fill="#6b7280" text-anchor="middle">Консервативне доменне ядро</text>

  <!-- Блок аварійного стану -->
  <rect x="680" y="245" width="230" height="180" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="795" y="268" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">🔥 Наслідки для підсистеми:</text>
  <text x="695" y="293" font-size="12" fill="#1a1a1a">• Електрична дуга в реле</text>
  <text x="695" y="315" font-size="12" fill="#1a1a1a">• Залипання контактора</text>
  <text x="695" y="337" font-size="12" fill="#1a1a1a">• Блокування шини Zigbee</text>
  <text x="695" y="359" font-size="12" fill="#1a1a1a">• Синхронні конфліктні релізи</text>
  <text x="795" y="385" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Втрата автономності та аварії</text>
  <text x="795" y="405" font-size="12" fill="#6b7280" text-anchor="middle">без буфера ізоляції (ACL)</text>
</svg>
