<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Карта темпів змін (Pace Layering) у платформі Digital Homes</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Поділ системи на темпові шари та асинхронні шви захищає інфраструктуру й забезпечує швидкість UI</text>

  <!-- BAND 1: Innovation Layer (Fast) -->
  <rect x="40" y="85" width="880" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  
  <!-- Left Header Badge 1 -->
  <text x="65" y="120" font-size="14" font-weight="bold" fill="#2457d6">1. Шар інновацій</text>
  <text x="65" y="142" font-size="12" font-weight="bold" fill="#2457d6">Годинник: Дні / Тижні</text>
  <text x="65" y="162" font-size="11" fill="#6b7280">Мобільні UI та експерименти</text>

  <!-- Component Cards Band 1 -->
  <rect x="290" y="100" width="190" height="80" fill="white" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="385" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Mobile App UI</text>
  <text x="385" y="145" text-anchor="middle" font-size="11" fill="#6b7280">Дашборди й віджети</text>
  <text x="385" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Реліз: 1–2 рази/тиждень</text>

  <rect x="495" y="100" width="190" height="80" fill="white" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="590" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">User Automations</text>
  <text x="590" y="145" text-anchor="middle" font-size="11" fill="#6b7280">Правила користувача</text>
  <text x="590" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Часті конфігурації</text>

  <rect x="700" y="100" width="190" height="80" fill="white" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="795" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Cloud Voice API</text>
  <text x="795" y="145" text-anchor="middle" font-size="11" fill="#6b7280">Голосові помічники</text>
  <text x="795" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">A/B тестування фіч</text>

  <!-- DECOUPLING SEAM 1 -->
  <rect x="40" y="203" width="880" height="28" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,3" rx="4"/>
  <text x="480" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">⚡ ШОВ РОЗВ'ЯЗКИ #1: OpenAPI / WebSocket / Async Event Bus (Ізоляція інтерфейсів від домену)</text>

  <!-- BAND 2: Differentiation Layer (Medium) -->
  <rect x="40" y="238" width="880" height="110" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  
  <!-- Left Header Badge 2 -->
  <text x="65" y="273" font-size="14" font-weight="bold" fill="#27ae60">2. Шар диференціації</text>
  <text x="65" y="295" font-size="12" font-weight="bold" fill="#27ae60">Годинник: Щомісяця</text>
  <text x="65" y="315" font-size="11" fill="#6b7280">Сценарії та агрегація</text>

  <!-- Component Cards Band 2 -->
  <rect x="290" y="253" width="190" height="80" fill="white" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="385" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Scenario Engine</text>
  <text x="385" y="298" text-anchor="middle" font-size="11" fill="#6b7280">Координація кімнат</text>
  <text x="385" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Реліз: раз на місяць</text>

  <rect x="495" y="253" width="190" height="80" fill="white" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="590" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Hub Core Gateway</text>
  <text x="590" y="298" text-anchor="middle" font-size="11" fill="#6b7280">Маршрутизація команд</text>
  <text x="590" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Стабільний рантайм</text>

  <rect x="700" y="253" width="190" height="80" fill="white" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="795" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Telemetry Engine</text>
  <text x="795" y="298" text-anchor="middle" font-size="11" fill="#6b7280">Обробка показників</text>
  <text x="795" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Буферизація даних</text>

  <!-- DECOUPLING SEAM 2 -->
  <rect x="40" y="356" width="880" height="28" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,3" rx="4"/>
  <text x="480" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">⚡ ШОВ РОЗВ'ЯЗКИ #2: Hardware Driver Abstraction / Matter Adapter / Repository Seam</text>

  <!-- BAND 3: Record & Hardware Layer (Slow Infrastructure) -->
  <rect x="40" y="391" width="880" height="110" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  
  <!-- Left Header Badge 3 -->
  <text x="65" y="426" font-size="14" font-weight="bold" fill="#1a1a1a">3. Шар запису й заліза</text>
  <text x="65" y="448" font-size="12" font-weight="bold" fill="#6b7280">Годинник: 5–15+ років</text>
  <text x="65" y="468" font-size="11" fill="#6b7280">Фундамент та інфраструктура</text>

  <!-- Component Cards Band 3 -->
  <rect x="290" y="406" width="190" height="80" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="385" y="431" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Matter/Zigbee Sensors</text>
  <text x="385" y="451" text-anchor="middle" font-size="11" fill="#6b7280">Давачі руху, тепла, CO2</text>
  <text x="385" y="469" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Ресурс батарей: 5–10 років</text>

  <rect x="495" y="406" width="190" height="80" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="590" y="431" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">KNX/Ethernet Bus</text>
  <text x="590" y="451" text-anchor="middle" font-size="11" fill="#6b7280">Фізичні лінії та живильники</text>
  <text x="590" y="469" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Строк служби: 20+ років</text>

  <rect x="700" y="406" width="190" height="80" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="795" y="431" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Device Registry DB</text>
  <text x="795" y="451" text-anchor="middle" font-size="11" fill="#6b7280">Реєстр пристроїв і прав</text>
  <text x="795" y="469" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Висока гарантія цілісності</text>

  <!-- BOTTOM TAKEAWAY BADGE -->
  <rect x="40" y="512" width="880" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="480" y="532" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Висновок: Повільний фундаментальний шар забезпечує надійність, а шви розв'язки дають гнучкість мобільним інтерфейсам</text>
</svg>
