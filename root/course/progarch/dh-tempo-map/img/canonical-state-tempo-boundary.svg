<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Канонічний API стану як межа темпів змін</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Ізоляція частих оновлень UI від низької пропускної здатності Zigbee-координатора</text>

  <!-- COLUMN 1: FAST TEMPO (CLIENTS & UI) -->
  <rect x="24" y="80" width="270" height="416" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>

  <!-- Col 1 Header -->
  <rect x="36" y="92" width="246" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="159" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Швидкий темп (UI / Клієнти)</text>
  <text x="159" y="130" text-anchor="middle" font-size="12" fill="#6b7280">Релізи: тижні • Потік: >100 req/s</text>

  <!-- Col 1 Card 1: Clients -->
  <rect x="36" y="154" width="246" height="94" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="48" y="176" font-size="13" font-weight="bold" fill="#1a1a1a">Джерела навантаження</text>
  <text x="48" y="198" font-size="12" fill="#1a1a1a">• Мобільний додаток (iOS/Android)</text>
  <text x="48" y="218" font-size="12" fill="#1a1a1a">• Веб-панель (Dashboard SPA)</text>
  <text x="48" y="238" font-size="12" fill="#1a1a1a">• Двигун правил автоматизацій</text>

  <!-- Col 1 Card 2: Pattern -->
  <rect x="36" y="260" width="246" height="94" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="48" y="282" font-size="13" font-weight="bold" fill="#1a1a1a">Патерн взаємодії</text>
  <text x="48" y="304" font-size="12" fill="#1a1a1a">• Висока частота опитування (poll)</text>
  <text x="48" y="324" font-size="12" fill="#1a1a1a">• Серійні ретраї при збоях зв'язку</text>
  <text x="48" y="344" font-size="12" fill="#1a1a1a">• Очікування відгуку: &lt; 50 мс</text>

  <!-- Col 1 Card 3: Risks -->
  <rect x="36" y="366" width="246" height="118" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="48" y="388" font-size="13" font-weight="bold" fill="#c0392b">Ризик без API-межі:</text>
  <text x="48" y="410" font-size="12" fill="#c0392b">• Реліз UI блокується прошивкою</text>
  <text x="48" y="432" font-size="12" fill="#c0392b">• Опитування перевантажує шину</text>
  <text x="48" y="454" font-size="12" fill="#c0392b">• Ретраї викликають флуд команд</text>

  <!-- COLUMN 2: BOUNDARY OF STABILITY -->
  <rect x="314" y="80" width="332" height="416" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Col 2 Header -->
  <rect x="326" y="92" width="308" height="50" rx="6" fill="#ffffff" stroke="#2457d6"/>
  <text x="480" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Межа стабільності: Canonical State API</text>
  <text x="480" y="130" text-anchor="middle" font-size="12" fill="#1a1a1a">Заморожений контракт capabilities • Ізоляція</text>

  <!-- Col 2 Card 1: Capabilities -->
  <rect x="326" y="154" width="308" height="94" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="338" y="176" font-size="13" font-weight="bold" fill="#1a1a1a">1. Контракт на основі Capabilities</text>
  <text x="338" y="198" font-size="12" fill="#1a1a1a">• Типи: Switchable, Dimmable, Thermostat</text>
  <text x="338" y="218" font-size="12" fill="#1a1a1a">• Ізоляція клієнтів від деталей вендорів</text>
  <text x="338" y="238" font-size="12" fill="#27ae60">✔ Немає блокування спільних релізів</text>

  <!-- Col 2 Card 2: Cache -->
  <rect x="326" y="260" width="308" height="94" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="338" y="282" font-size="13" font-weight="bold" fill="#1a1a1a">2. Кеш стану (Last-Known State)</text>
  <text x="338" y="304" font-size="12" fill="#1a1a1a">• Миттєвий відгук на Read/Poll з пам'яті</text>
  <text x="338" y="324" font-size="12" fill="#1a1a1a">• Нуль звернень до радіошини при читанні</text>
  <text x="338" y="344" font-size="12" fill="#27ae60">✔ Запобігає радіошторму на координатор</text>

  <!-- Col 2 Card 3: Protection -->
  <rect x="326" y="366" width="308" height="118" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="338" y="388" font-size="13" font-weight="bold" fill="#27ae60">3. Ідемпотентність та Backpressure</text>
  <text x="338" y="410" font-size="12" fill="#1a1a1a">• Дедуплікація команд за Idempotency-Key</text>
  <text x="338" y="432" font-size="12" fill="#1a1a1a">• Контроль черги передачі (Rate Limiting)</text>
  <text x="338" y="454" font-size="12" fill="#1a1a1a">• Буферизація та згладжування подій</text>

  <!-- COLUMN 3: SLOW TEMPO (HARDWARE) -->
  <rect x="666" y="80" width="270" height="416" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>

  <!-- Col 3 Header -->
  <rect x="678" y="92" width="246" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="801" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Повільний темп (Обладнання)</text>
  <text x="801" y="130" text-anchor="middle" font-size="12" fill="#6b7280">Релізи: роки • Ліміт: ~15-30 msg/s</text>

  <!-- Col 3 Card 1: Coordinator -->
  <rect x="678" y="154" width="246" height="94" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="176" font-size="13" font-weight="bold" fill="#1a1a1a">Zigbee-координатор</text>
  <text x="690" y="198" font-size="12" fill="#1a1a1a">• Радіоканал з обмеженням 250 kbps</text>
  <text x="690" y="218" font-size="12" fill="#1a1a1a">• Послідовна обробка черги TX/RX</text>
  <text x="690" y="238" font-size="12" fill="#1a1a1a">• Вразливість до джиттеру й колізій</text>

  <!-- Col 3 Card 2: Devices -->
  <rect x="678" y="260" width="246" height="94" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="282" font-size="13" font-weight="bold" fill="#1a1a1a">Фізичні пристрої</text>
  <text x="690" y="304" font-size="12" fill="#1a1a1a">• Сплячі сенсори (End Devices)</text>
  <text x="690" y="324" font-size="12" fill="#1a1a1a">• Силові реле (механічний ресурс)</text>
  <text x="690" y="344" font-size="12" fill="#1a1a1a">• Пропрієтарні кластери вендорів</text>

  <!-- Col 3 Card 3: Protected -->
  <rect x="678" y="366" width="246" height="118" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="690" y="388" font-size="13" font-weight="bold" fill="#27ae60">Захищений режим роботи</text>
  <text x="690" y="410" font-size="12" fill="#27ae60">• Шина вільна від poll-трафіку</text>
  <text x="690" y="432" font-size="12" fill="#27ae60">• Команди надходять розмірено</text>
  <text x="690" y="454" font-size="12" fill="#27ae60">• Захист від зносу реле та збоїв</text>

  <!-- CONNECTING ARROWS -->
  <!-- Gap 1 (x=294 to x=314) -->
  <line x1="294" y1="201" x2="310" y2="201" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="314" y1="307" x2="298" y2="307" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="294" y1="425" x2="310" y2="425" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Gap 2 (x=646 to x=666) -->
  <line x1="646" y1="201" x2="662" y2="201" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="666" y1="307" x2="650" y2="307" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="646" y1="425" x2="662" y2="425" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
