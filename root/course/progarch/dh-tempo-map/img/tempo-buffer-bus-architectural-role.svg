<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White background rect -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-error" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектурне місце шини ізоляції темпів (TempoBufferBus)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Асинхронний шов розвʼязує високочастотні клієнтські сценарії та консервативне апаратне ядро</text>

  <!-- Panel 1: Fast Pace (UI & Automations) -->
  <rect x="30" y="80" width="250" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="42" y="104" font-size="13" font-weight="bold" fill="#1a1a1a">1. Швидкий шар (UI / Сценарії)</text>
  <text x="42" y="122" font-size="12" fill="#6b7280">Висока частота змін та релізів</text>

  <rect x="42" y="135" width="226" height="95" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="52" y="154" font-size="12" font-weight="bold" fill="#2457d6">Клієнтські сценарії:</text>
  <text x="52" y="174" font-size="12" fill="#1a1a1a">• Мобільні додатки (Flutter/React)</text>
  <text x="52" y="192" font-size="12" fill="#1a1a1a">• Скрипти автоматизацій мешканців</text>
  <text x="52" y="210" font-size="12" fill="#2457d6">• Оновлення щотижня (швидкий темп)</text>

  <rect x="42" y="244" width="226" height="95" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="52" y="264" font-size="12" font-weight="bold" fill="#c0392b">Імпульсний трафік (Bursts):</text>
  <text x="52" y="284" font-size="12" fill="#c0392b">• Пікові сплески до 800 подій/с</text>
  <text x="52" y="302" font-size="12" fill="#1a1a1a">• Повторні запити через таймаути</text>
  <text x="52" y="320" font-size="12" fill="#c0392b">• Загроза перевантаження заліза</text>

  <text x="42" y="365" font-size="12" font-weight="bold" fill="#2457d6">Швидкість змін: 50+ зм/міс</text>
  <text x="42" y="385" font-size="12" fill="#6b7280">Волатильний життєвий цикл</text>
  <text x="42" y="402" font-size="12" fill="#c0392b">Несумісність із темпом ядра</text>

  <!-- Connection Lines: Panel 1 -> Panel 2 -->
  <line x1="268" y1="182" x2="310" y2="182" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="268" y1="291" x2="310" y2="291" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-error)"/>

  <!-- Panel 2: TempoBufferBus Seam -->
  <rect x="300" y="80" width="360" height="345" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="315" y="104" font-size="13" font-weight="bold" fill="#2457d6">2. Шина темпів: TempoBufferBus</text>
  <text x="315" y="122" font-size="12" fill="#6b7280">Амортизатор навантаження та стабільний шов</text>

  <rect x="315" y="135" width="330" height="80" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="327" y="154" font-size="12" font-weight="bold" fill="#1a1a1a">Вхідний фільтр та дедуплікація:</text>
  <rect x="327" y="162" width="306" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="335" y="178" font-size="12" fill="#2457d6">TTL-фільтр телеметрії | Дедуплікація</text>
  <text x="327" y="202" font-size="12" fill="#6b7280">Відсікання дублікатів та застарілих даних</text>

  <rect x="315" y="228" width="330" height="85" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="327" y="248" font-size="12" font-weight="bold" fill="#2457d6">Буферизована черга з Backpressure:</text>
  <rect x="327" y="258" width="306" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="335" y="275" font-size="12" font-weight="bold" fill="#27ae60">Вхід: 800 msg/s ➔ [ БУФЕР ] ➔ Вихід: 30 cmd/s</text>
  <text x="327" y="300" font-size="12" fill="#c0392b">Backpressure: сигнал сповільнення при 80% черги</text>

  <rect x="315" y="326" width="330" height="85" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="327" y="346" font-size="12" font-weight="bold" fill="#27ae60">Вихідний диспетчер (Rate Limiting):</text>
  <text x="327" y="366" font-size="12" fill="#1a1a1a">• Згладжування сплесків: плавний темп (30 cmd/s)</text>
  <text x="327" y="384" font-size="12" fill="#1a1a1a">• Скидання некоректних команд у чергу DLQ</text>
  <text x="327" y="402" font-size="12" fill="#27ae60">• Ядро надійно захищене від перевантажень</text>

  <!-- Connection Lines: Panel 2 -> Panel 3 -->
  <line x1="645" y1="270" x2="687" y2="270" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-success)"/>
  <line x1="645" y1="368" x2="687" y2="368" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-success)"/>

  <!-- Panel 3: Conservative Hardware Core -->
  <rect x="680" y="80" width="250" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="692" y="104" font-size="13" font-weight="bold" fill="#1a1a1a">3. Консервативне ядро (Залізо)</text>
  <text x="692" y="122" font-size="12" fill="#6b7280">Низька частота змін та протоколи</text>

  <rect x="692" y="135" width="226" height="95" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="702" y="154" font-size="12" font-weight="bold" fill="#27ae60">Апаратні протоколи:</text>
  <text x="702" y="174" font-size="12" fill="#1a1a1a">• Шини Zigbee, Matter, Z-Wave</text>
  <text x="702" y="192" font-size="12" fill="#1a1a1a">• Апаратний ліміт: 30-50 пакетів/с</text>
  <text x="702" y="210" font-size="12" fill="#27ae60">• Протоколи не змінюються роками</text>

  <rect x="692" y="244" width="226" height="95" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="702" y="264" font-size="12" font-weight="bold" fill="#27ae60">Силові виконавчі вузли:</text>
  <text x="702" y="284" font-size="12" fill="#1a1a1a">• Силові реле, термостати, замки</text>
  <text x="702" y="302" font-size="12" fill="#1a1a1a">• Захист від зносу та перегріву</text>
  <text x="702" y="320" font-size="12" fill="#27ae60">• Робота без збоїв десятиліттями</text>

  <text x="692" y="365" font-size="12" font-weight="bold" fill="#27ae60">Швидкість змін: 1-2 зм/міс</text>
  <text x="692" y="385" font-size="12" fill="#6b7280">Консервативний життєвий цикл</text>
  <text x="692" y="402" font-size="12" fill="#1a1a1a">Стабільність — головна вимога</text>

  <!-- Bottom Summary Cards -->
  <rect x="30" y="440" width="290" height="95" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="44" y="462" font-size="13" font-weight="bold" fill="#2457d6">1. Амортизація темпів</text>
  <text x="44" y="482" font-size="12" fill="#6b7280">Згладжування імпульсного трафіку:</text>
  <text x="44" y="500" font-size="12" fill="#1a1a1a">Шина поглинає сплески до 800 msg/s і</text>
  <text x="44" y="518" font-size="12" fill="#1a1a1a">видає плавний потік для заліза</text>

  <rect x="335" y="440" width="290" height="95" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="349" y="462" font-size="13" font-weight="bold" fill="#2457d6">2. Зворотний тиск (Backpressure)</text>
  <text x="349" y="482" font-size="12" fill="#6b7280">Захист буфера від переповнення:</text>
  <text x="349" y="500" font-size="12" fill="#1a1a1a">При заповненні 80% шина пригальмовує</text>
  <text x="349" y="518" font-size="12" fill="#1a1a1a">швидких клієнтів, запобігаючи збоям</text>

  <rect x="640" y="440" width="290" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="654" y="462" font-size="13" font-weight="bold" fill="#27ae60">3. Розвʼязка життєвих циклів</text>
  <text x="654" y="482" font-size="12" fill="#6b7280">Незалежні швидкості еволюції:</text>
  <text x="654" y="500" font-size="12" fill="#1a1a1a">UI оновлюється щотижня, а ядро — раз</text>
  <text x="654" y="518" font-size="12" fill="#1a1a1a">на рік: шинний контракт знімає блокування</text>
</svg>
