<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White background rect -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-error" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Життєвий цикл повідомлення в шині ізоляції темпів (TempoBufferBus)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Етапи проходження команди: від виклику dispatch та дедуплікації до вирівнювання черги й термінального ACK/NACK</text>

  <!-- Panel 1: Ingress & Deduplication -->
  <rect x="30" y="80" width="275" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="42" y="104" font-size="13" font-weight="bold" fill="#1a1a1a">1. Вхідний контур (Ingress &amp; Dedup)</text>
  <text x="42" y="122" font-size="12" fill="#6b7280">Прийом наміру, перевірка ключа та TTL</text>

  <rect x="42" y="135" width="251" height="90" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="52" y="154" font-size="12" font-weight="bold" fill="#2457d6">Крок 1: Виклик dispatch(msg)</text>
  <text x="52" y="174" font-size="12" fill="#1a1a1a">• id: cmd-801; key: idem-42</text>
  <text x="52" y="192" font-size="12" fill="#1a1a1a">• ttl: 4000 ms; action: SET_TEMP</text>
  <text x="52" y="210" font-size="12" font-weight="bold" fill="#2457d6">Стан: SUBMITTED ➔ ACCEPTED</text>

  <rect x="42" y="238" width="251" height="95" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="52" y="258" font-size="12" font-weight="bold" fill="#2457d6">Крок 2: Вікно дедуплікації</text>
  <text x="52" y="278" font-size="12" font-weight="bold" fill="#27ae60">✓ Новий ключ ➔ пропуск у чергу</text>
  <text x="52" y="296" font-size="12" fill="#c0392b">⛔ Дублікат ➔ повернення кеш-ACK</text>
  <text x="52" y="314" font-size="12" fill="#6b7280">⛔ TTL &lt; 0 ➔ скидання застарілих</text>

  <text x="42" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">Результат вхідного фільтра:</text>
  <text x="42" y="385" font-size="12" fill="#6b7280">Валідні наміри ідуть у буфер,</text>
  <text x="42" y="402" font-size="12" fill="#6b7280">а дублікати відсікаються без затримок</text>

  <!-- Connection: Panel 1 -> Panel 2 -->
  <line x1="293" y1="285" x2="335" y2="285" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- Panel 2: Buffered Queue & Backpressure -->
  <rect x="325" y="80" width="310" height="345" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="337" y="104" font-size="13" font-weight="bold" fill="#2457d6">2. Буфер черги (Queue &amp; Flow)</text>
  <text x="337" y="122" font-size="12" fill="#6b7280">Амортизація сплесків і контроль тиску</text>

  <rect x="337" y="135" width="286" height="90" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="347" y="154" font-size="12" font-weight="bold" fill="#2457d6">Крок 3: Буферизація (Ring Buffer)</text>
  <rect x="347" y="163" width="266" height="22" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="355" y="179" font-size="12" fill="#1a1a1a">[cmd-801] [cmd-802] [cmd-803] ...</text>
  <text x="347" y="208" font-size="12" font-weight="bold" fill="#2457d6">Стан: QUEUED (гарантована черга)</text>

  <rect x="337" y="238" width="286" height="95" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="347" y="258" font-size="12" font-weight="bold" fill="#c0392b">Крок 4: Захист черги (Watermarks)</text>
  <rect x="347" y="266" width="266" height="22" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="355" y="282" font-size="12" font-weight="bold" fill="#c0392b">Черга &gt; 80% ➔ Сигнал Backpressure</text>
  <text x="347" y="308" font-size="12" fill="#1a1a1a">• Черга 100% ➔ Shedding (скидання)</text>
  <text x="347" y="324" font-size="12" fill="#6b7280">• Продюсери сповільнюють надсилання</text>

  <text x="337" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">Амортизатор темпів:</text>
  <text x="337" y="385" font-size="12" fill="#6b7280">Імпульсний потік клієнта згладжується</text>
  <text x="337" y="402" font-size="12" fill="#6b7280">перед видачею на фізичні драйвери</text>

  <!-- Connection: Panel 2 -> Panel 3 -->
  <line x1="623" y1="285" x2="665" y2="285" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>

  <!-- Panel 3: Egress & Terminal Resolution -->
  <rect x="655" y="80" width="275" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="667" y="104" font-size="13" font-weight="bold" fill="#1a1a1a">3. Виконання та резолюція</text>
  <text x="667" y="122" font-size="12" fill="#6b7280">Rate Limiter, залізо та статуси ACK/NACK</text>

  <rect x="667" y="135" width="251" height="80" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="677" y="154" font-size="12" font-weight="bold" fill="#27ae60">Крок 5: Rate Limiter (30 cmd/s)</text>
  <text x="677" y="174" font-size="12" fill="#1a1a1a">• Диспетчеризація на фізичну шину</text>
  <text x="677" y="194" font-size="12" font-weight="bold" fill="#27ae60">Стан: DISPATCHED / IN_FLIGHT</text>

  <rect x="667" y="228" width="251" height="105" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="677" y="246" font-size="12" font-weight="bold" fill="#1a1a1a">Крок 6: Термінальна резолюція:</text>
  <rect x="677" y="254" width="231" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="685" y="269" font-size="12" font-weight="bold" fill="#27ae60">✓ ACK: успіх ➔ стан COMPLETED</text>
  <rect x="677" y="286" width="231" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="685" y="301" font-size="12" font-weight="bold" fill="#c0392b">✖ NACK: апаратний збій ➔ у DLQ</text>
  <text x="677" y="322" font-size="12" fill="#6b7280">Оновлення канонічного стану пристрою</text>

  <text x="667" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">Завершення життєвого циклу:</text>
  <text x="667" y="385" font-size="12" fill="#6b7280">Клієнт отримує точний результат,</text>
  <text x="667" y="402" font-size="12" fill="#6b7280">а збої ізольовані в черзі DLQ</text>

  <!-- Bottom Summary Cards -->
  <rect x="30" y="440" width="290" height="95" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="44" y="462" font-size="13" font-weight="bold" fill="#2457d6">1. Вхід та дедуплікація</text>
  <text x="44" y="482" font-size="12" fill="#6b7280">Прийом та первинна фільтрація:</text>
  <text x="44" y="500" font-size="12" fill="#1a1a1a">Команда отримує стан SUBMITTED;</text>
  <text x="44" y="518" font-size="12" fill="#1a1a1a">дублікати повертають кеш без заліза</text>

  <rect x="335" y="440" width="290" height="95" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="349" y="462" font-size="13" font-weight="bold" fill="#2457d6">2. Буфер та Backpressure</text>
  <text x="349" y="482" font-size="12" fill="#6b7280">Амортизація сплесків навантаження:</text>
  <text x="349" y="500" font-size="12" fill="#1a1a1a">Стан QUEUED згладжує піки трафіку;</text>
  <text x="349" y="518" font-size="12" fill="#1a1a1a">сигнал зворотного тиску рятує памʼять</text>

  <rect x="640" y="440" width="290" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="654" y="462" font-size="13" font-weight="bold" fill="#27ae60">3. Диспетчеризація та ACK/NACK</text>
  <text x="654" y="482" font-size="12" fill="#6b7280">Термінальне завершення циклу:</text>
  <text x="654" y="500" font-size="12" fill="#1a1a1a">Статус COMPLETED фіксує успішний ACK,</text>
  <text x="654" y="518" font-size="12" fill="#1a1a1a">а збійні команди NACK ідуть у DLQ</text>
</svg>
