<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма обробки команд актуатора</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Захисне вікно блокує часті перемикання, а аварійна команда виконується миттєво</text>

  <rect x="30" y="75" width="900" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вертикальні лінії прив'язки за часом між шарами -->
  <line x1="280" y1="120" x2="280" y2="180" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="280" y1="260" x2="280" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="280" y1="370" x2="280" y2="402" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="375" y1="120" x2="375" y2="180" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="375" y1="260" x2="375" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="375" y1="370" x2="375" y2="402" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="490" y1="120" x2="490" y2="180" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="490" y1="260" x2="490" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="490" y1="370" x2="490" y2="402" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="645" y1="120" x2="645" y2="180" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="645" y1="260" x2="645" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="645" y1="370" x2="645" y2="402" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="730" y1="120" x2="730" y2="180" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="730" y1="260" x2="730" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="730" y1="370" x2="730" y2="402" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="825" y1="120" x2="825" y2="180" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="825" y1="260" x2="825" y2="290" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="825" y1="370" x2="825" y2="402" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ШАР 1: Вхідний потік -->
  <rect x="45" y="92" width="155" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="122" y="114" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний потік</text>
  <text x="122" y="134" font-size="12" fill="#6b7280" text-anchor="middle">(автоматизації)</text>

  <line x1="220" y1="120" x2="880" y2="120" stroke="#d0d7de" stroke-width="2"/>

  <rect x="258" y="85" width="44" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="280" y="101" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ON</text>
  <line x1="280" y1="109" x2="280" y2="119" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="351" y="85" width="48" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="375" y="101" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">OFF</text>
  <line x1="375" y1="109" x2="375" y2="119" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="468" y="85" width="44" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="490" y="101" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ON</text>
  <line x1="490" y1="109" x2="490" y2="119" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="708" y="85" width="44" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="730" y="101" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ON</text>
  <line x1="730" y1="109" x2="730" y2="119" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="780" y="83" width="90" height="26" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
  <text x="825" y="100" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">АВАРІЙНА</text>
  <line x1="825" y1="109" x2="825" y2="119" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- ШАР 2: Шар кулдауну -->
  <rect x="45" y="192" width="155" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="122" y="214" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шар кулдауну</text>
  <text x="122" y="234" font-size="12" fill="#6b7280" text-anchor="middle">(ACL / ізоляція)</text>

  <line x1="220" y1="220" x2="880" y2="220" stroke="#d0d7de" stroke-width="2"/>

  <rect x="280" y="180" width="365" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="462" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Захисне вікно кулдауну T_cooldown (30с)</text>

  <rect x="333" y="222" width="84" height="26" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="375" y="239" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Відкладено</text>

  <rect x="440" y="222" width="100" height="26" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="490" y="239" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Проігноровано</text>

  <rect x="550" y="222" width="92" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="596" y="239" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Виконати OFF</text>

  <rect x="730" y="180" width="160" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="810" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кулдаун #2</text>

  <rect x="785" y="222" width="80" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="825" y="239" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ОБХІД!</text>

  <!-- ШАР 3: Стан актуатора -->
  <rect x="45" y="292" width="155" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="122" y="314" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стан актуатора</text>
  <text x="122" y="334" font-size="12" fill="#6b7280" text-anchor="middle">(реле пристрою)</text>

  <line x1="220" y1="345" x2="280" y2="345" stroke="#6b7280" stroke-width="3"/>
  <text x="250" y="365" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">ВИМК</text>

  <line x1="280" y1="345" x2="280" y2="305" stroke="#27ae60" stroke-width="3"/>

  <line x1="280" y1="305" x2="645" y2="305" stroke="#27ae60" stroke-width="3"/>
  <text x="462" y="292" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">УВІМКНЕНО (активний кулдаун тримає стан)</text>

  <line x1="645" y1="305" x2="645" y2="345" stroke="#6b7280" stroke-width="3"/>

  <line x1="645" y1="345" x2="730" y2="345" stroke="#6b7280" stroke-width="3"/>
  <text x="687" y="365" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">ВИМК</text>

  <line x1="730" y1="345" x2="730" y2="305" stroke="#27ae60" stroke-width="3"/>

  <line x1="730" y1="305" x2="825" y2="305" stroke="#27ae60" stroke-width="3"/>
  <text x="777" y="292" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">УВІМК</text>

  <line x1="825" y1="305" x2="825" y2="345" stroke="#c0392b" stroke-width="3"/>

  <line x1="825" y1="345" x2="880" y2="345" stroke="#c0392b" stroke-width="3"/>
  <text x="852" y="365" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">АВАРІЙНО ВИМКНЕНО</text>

  <!-- ШАР 4: Часова вісь -->
  <line x1="220" y1="405" x2="870" y2="405" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="880" y="409" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Час (t)</text>

  <line x1="280" y1="402" x2="280" y2="408" stroke="#1a1a1a" stroke-width="2"/>
  <text x="280" y="424" font-size="12" fill="#6b7280" text-anchor="middle">t₁</text>
  <text x="280" y="438" font-size="12" fill="#27ae60" text-anchor="middle">(ON)</text>

  <line x1="375" y1="402" x2="375" y2="408" stroke="#1a1a1a" stroke-width="2"/>
  <text x="375" y="424" font-size="12" fill="#6b7280" text-anchor="middle">t₂</text>
  <text x="375" y="438" font-size="12" fill="#c0392b" text-anchor="middle">(OFF)</text>

  <line x1="490" y1="402" x2="490" y2="408" stroke="#1a1a1a" stroke-width="2"/>
  <text x="490" y="424" font-size="12" fill="#6b7280" text-anchor="middle">t₃</text>
  <text x="490" y="438" font-size="12" fill="#c0392b" text-anchor="middle">(ON)</text>

  <line x1="645" y1="402" x2="645" y2="408" stroke="#1a1a1a" stroke-width="2"/>
  <text x="645" y="424" font-size="12" fill="#6b7280" text-anchor="middle">t₄</text>
  <text x="645" y="438" font-size="12" fill="#27ae60" text-anchor="middle">(Кінець К1)</text>

  <line x1="730" y1="402" x2="730" y2="408" stroke="#1a1a1a" stroke-width="2"/>
  <text x="730" y="424" font-size="12" fill="#6b7280" text-anchor="middle">t₅</text>
  <text x="730" y="438" font-size="12" fill="#27ae60" text-anchor="middle">(ON)</text>

  <line x1="825" y1="402" x2="825" y2="408" stroke="#1a1a1a" stroke-width="2"/>
  <text x="825" y="424" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t₆</text>
  <text x="825" y="438" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">(Аварія)</text>

  <!-- ЛЕГЕНДА -->
  <rect x="30" y="458" width="900" height="36" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <rect x="50" y="468" width="24" height="16" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="3 3"/>
  <text x="82" y="480" font-size="12" fill="#1a1a1a">Захисне вікно кулдауну (блокування)</text>

  <rect x="325" y="468" width="24" height="16" rx="3" fill="#ffffff" stroke="#c0392b"/>
  <text x="357" y="480" font-size="12" fill="#1a1a1a">Відкладено / Дедупліковано</text>

  <line x1="545" y1="476" x2="569" y2="476" stroke="#27ae60" stroke-width="3"/>
  <text x="577" y="480" font-size="12" fill="#1a1a1a">Реле УВІМК</text>

  <rect x="645" y="468" width="24" height="16" rx="3" fill="#c0392b"/>
  <text x="677" y="480" font-size="12" fill="#1a1a1a">Аварійний обхід (миттєве виконання)</text>
</svg>
