<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Теорія темпових шарів цивілізації Стюарта Бренда (Pace Layering)</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Швидкі верхні шари генерують новації, повільні нижні — забезпечують безперервність і стабільність</text>

  <!-- LEFT PANEL: 6 Civilization Layers Stack -->
  <rect x="25" y="70" width="545" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Pace Gradient Line & Axis Labels -->
  <line x1="50" y1="100" x2="50" y2="440" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="50" y="86" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Швидко</text>
  <text x="50" y="465" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Повільно</text>

  <!-- Layer 1: FASHION / ART -->
  <rect x="80" y="85" width="475" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="95" y="106" font-size="13" font-weight="bold" fill="#2457d6">1. FASHION / ART (Мода &amp; Мистецтво)</text>
  <text x="95" y="124" font-size="12" fill="#1a1a1a">Новації, тренди, висока волатильність | Дні – місяці</text>

  <!-- Layer 2: COMMERCE -->
  <rect x="80" y="150" width="475" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="95" y="171" font-size="13" font-weight="bold" fill="#1a1a1a">2. COMMERCE (Комерція &amp; Торгівля)</text>
  <text x="95" y="189" font-size="12" fill="#6b7280">Ринкові угоди, швидкий обмін ресурсами | Місяці – роки</text>

  <!-- Layer 3: INFRASTRUCTURE -->
  <rect x="80" y="215" width="475" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="95" y="236" font-size="13" font-weight="bold" fill="#1a1a1a">3. INFRASTRUCTURE (Інфраструктура)</text>
  <text x="95" y="254" font-size="12" fill="#6b7280">Транспорт, комунікації, мережі, енергетика | Десятиліття</text>

  <!-- Layer 4: GOVERNANCE -->
  <rect x="80" y="280" width="475" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="95" y="301" font-size="13" font-weight="bold" fill="#1a1a1a">4. GOVERNANCE (Управління &amp; Право)</text>
  <text x="95" y="319" font-size="12" fill="#6b7280">Конституція, юридичні норми, інституції | Століття</text>

  <!-- Layer 5: CULTURE -->
  <rect x="80" y="345" width="475" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="95" y="366" font-size="13" font-weight="bold" fill="#1a1a1a">5. CULTURE (Культура &amp; Мова)</text>
  <text x="95" y="384" font-size="12" fill="#6b7280">Релігія, мова, цінності, ідентичність | Тисячоліття</text>

  <!-- Layer 6: NATURE -->
  <rect x="80" y="410" width="475" height="52" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="95" y="431" font-size="13" font-weight="bold" fill="#1a1a1a">6. NATURE (Природа &amp; Біосфера)</text>
  <text x="95" y="449" font-size="12" fill="#6b7280">Клімат, геологія, генетичний фонд | Мільйони років</text>

  <!-- RIGHT PANEL: Systemic Balance & Software Analogy -->
  <rect x="595" y="70" width="340" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Top Box: Fast Layers Function -->
  <rect x="610" y="85" width="310" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="625" y="108" font-size="13" font-weight="bold" fill="#2457d6">⚡ Верхні шари: Адаптація</text>
  <text x="625" y="130" font-size="12" fill="#1a1a1a">• Експериментують і поглинають</text>
  <text x="625" y="148" font-size="12" fill="#1a1a1a">  нові зовнішні виклики.</text>
  <text x="625" y="172" font-size="12" fill="#2457d6">• Дають системі швидкість і реакцію.</text>
  <text x="625" y="190" font-size="12" fill="#6b7280">[У ПЗ: UI / Фронтенд / Експерименти]</text>

  <!-- Middle Box: Slow Layers Function -->
  <rect x="610" y="218" width="310" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="625" y="241" font-size="13" font-weight="bold" fill="#27ae60">🛡️ Нижні шари: Стабільність</text>
  <text x="625" y="263" font-size="12" fill="#1a1a1a">• Зберігають пам'ять, цілісність</text>
  <text x="625" y="281" font-size="12" fill="#1a1a1a">  і фундаментальну структуру.</text>
  <text x="625" y="305" font-size="12" fill="#27ae60">• Захищають від хаосу й руйнації.</text>
  <text x="625" y="323" font-size="12" fill="#6b7280">[У ПЗ: Доменне Ядро / Сховище]</text>

  <!-- Bottom Box: Systemic Balance -->
  <rect x="610" y="351" width="310" height="130" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="625" y="374" font-size="13" font-weight="bold" fill="#1a1a1a">⚖️ Системний баланс</text>
  <text x="625" y="396" font-size="12" fill="#1a1a1a">Без швидких — немає навчання,</text>
  <text x="625" y="414" font-size="12" fill="#1a1a1a">без повільних — немає пам'яті.</text>
  <text x="625" y="438" font-size="12" font-weight="bold" fill="#27ae60">Здорові системи поєднують</text>
  <text x="625" y="456" font-size="12" font-weight="bold" fill="#27ae60">новітню динаміку з міцним ядром.</text>
</svg>
