<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Склеювання темпів змін у класі LightActuator</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#6b7280">Змішування низькорівневого протоколу, бізнес-правил та UI в одному файлі змушує чіпати апаратний код через правки інтерфейсу</text>

  <!-- Монолітний клас LightActuator (зовнішній контейнер) -->
  <rect x="25" y="85" width="525" height="405" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Заголовок класу -->
  <rect x="25" y="85" width="525" height="38" rx="8" fill="#c0392b"/>
  <text x="40" y="109" font-size="14" font-weight="bold" fill="#ffffff">Клас LightActuator (єдиний файл зі змішаними темпами)</text>

  <!-- Блок 1: UI / Форматування -->
  <rect x="38" y="137" width="498" height="96" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="408" y="145" width="118" height="22" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="467" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Темп: дні / тижні</text>
  <text x="50" y="160" font-size="13" font-weight="bold" fill="#c0392b">1. Представлення й форматування UI</text>
  <text x="50" y="184" font-size="12" fill="#1a1a1a">formatStatus(lux, lang) → "Увімкнено 75% [Ніч]" / "Active 75%"</text>
  <text x="50" y="204" font-size="12" fill="#6b7280">Локалізація рядків, колірні коди для іконок застосунку</text>

  <!-- Блок 2: Бізнес-правила -->
  <rect x="38" y="247" width="498" height="96" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="408" y="255" width="118" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="467" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Темп: 3–6 місяців</text>
  <text x="50" y="270" font-size="13" font-weight="bold" fill="#2457d6">2. Доменні правила автоматизації</text>
  <text x="50" y="294" font-size="12" fill="#1a1a1a">applySafetyPolicies(motionDetected, smokeAlarm, nightMode)</text>
  <text x="50" y="314" font-size="12" fill="#6b7280">Обмеження яскравості, аварійне ввімкнення світла при тривозі</text>

  <!-- Блок 3: Апаратний протокол -->
  <rect x="38" y="357" width="498" height="96" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="408" y="365" width="118" height="22" rx="4" fill="#f4f6f8" stroke="#6b7280"/>
  <text x="467" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Темп: 3–5 років</text>
  <text x="50" y="380" font-size="13" font-weight="bold" fill="#1a1a1a">3. Бітовий апаратний протокол RS-485</text>
  <text x="50" y="404" font-size="12" fill="#1a1a1a">sendFrame(port, [0x01, 0x06, 0x00, 0x02, 0x03, 0xE8, crc16])</text>
  <text x="50" y="424" font-size="12" fill="#6b7280">Пряма робота з регістрами реле Modbus, таймінги шини</text>

  <!-- Права колонка: Панель 1 - Джерела змін -->
  <rect x="568" y="85" width="365" height="155" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="583" y="110" font-size="14" font-weight="bold" fill="#1a1a1a">Джерела змін із різним ритмом</text>
  
  <text x="583" y="134" font-size="12" font-weight="bold" fill="#c0392b">• Дизайнери UI (щотижня):</text>
  <text x="595" y="152" font-size="12" fill="#6b7280">новий вигляд картки кімнати, тексти підказок</text>

  <text x="583" y="172" font-size="12" font-weight="bold" fill="#2457d6">• Продуктові вимоги (щокварталу):</text>
  <text x="595" y="190" font-size="12" fill="#6b7280">оновлення політик комфорту та енергозбереження</text>

  <text x="583" y="210" font-size="12" font-weight="bold" fill="#1a1a1a">• Виробник обладнання (раз на 3–5 років):</text>
  <text x="595" y="228" font-size="12" fill="#6b7280">нова ревізія мікросхеми або зміна прошивки</text>

  <!-- Права колонка: Панель 2 - Наслідки склеювання темпів -->
  <rect x="568" y="254" width="365" height="236" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="583" y="279" font-size="14" font-weight="bold" fill="#c0392b">🚨 Наслідки склеювання темпів</text>

  <text x="583" y="305" font-size="12" font-weight="bold" fill="#1a1a1a">1. Штучна нестабільність ядра</text>
  <text x="595" y="323" font-size="12" fill="#6b7280">Зміна коми в тексті кнопки змушує перескладати</text>
  <text x="595" y="339" font-size="12" fill="#6b7280">і перетестувати низькорівневий драйвер реле.</text>

  <text x="583" y="363" font-size="12" font-weight="bold" fill="#1a1a1a">2. Ризик критичних апаратних збоїв</text>
  <text x="595" y="381" font-size="12" fill="#6b7280">Помилка у форматуванні рядка UI здатна зламати</text>
  <text x="595" y="397" font-size="12" fill="#6b7280">пакування бітів та заблокувати шину RS-485.</text>

  <text x="583" y="421" font-size="12" font-weight="bold" fill="#1a1a1a">3. Руйнування релізного ритму</text>
  <text x="595" y="439" font-size="12" fill="#6b7280">Повільний шар не може набути стабільності,</text>
  <text x="595" y="455" font-size="12" fill="#6b7280">бо живе в одному файлі з мінливим кодом UI.</text>
</svg>
