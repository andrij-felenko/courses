<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Канонічна модель стану як стабільний якір</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Зовнішні клієнти залежать від незмінного контракту через інверсію залежностей</text>

  <!-- 1. Швидка периферія -->
  <rect x="24" y="78" width="190" height="376" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="119" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Швидка периферія</text>
  <text x="119" y="122" text-anchor="middle" font-size="12" fill="#6b7280">Темп: дні — години (I ≈ 0.9)</text>

  <!-- Картки периферії -->
  <rect x="34" y="136" width="170" height="86" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="119" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Мобільний UI</text>
  <text x="119" y="180" text-anchor="middle" font-size="12" fill="#6b7280">iOS / Android віджети</text>
  <text x="119" y="200" text-anchor="middle" font-size="12" fill="#6b7280">Часті редизайни екранів</text>

  <rect x="34" y="236" width="170" height="86" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="119" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Голосові асистенти</text>
  <text x="119" y="280" text-anchor="middle" font-size="12" fill="#6b7280">Google Home / Alexa</text>
  <text x="119" y="300" text-anchor="middle" font-size="12" fill="#6b7280">Дрейф вендорних схем</text>

  <rect x="34" y="336" width="170" height="86" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="119" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Хмарні тарифи</text>
  <text x="119" y="380" text-anchor="middle" font-size="12" fill="#6b7280">Nord Pool / ENTSO-E</text>
  <text x="119" y="400" text-anchor="middle" font-size="12" fill="#6b7280">Зовнішні API котирувань</text>

  <!-- Стрілки від клієнтів до адаптерів -->
  <line x1="204" y1="179" x2="238" y2="179" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="204" y1="279" x2="238" y2="279" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="204" y1="379" x2="238" y2="379" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- 2. Антикорупційний шар -->
  <rect x="238" y="78" width="224" height="376" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Антикорупційний шар</text>
  <text x="350" y="122" text-anchor="middle" font-size="12" fill="#6b7280">Адаптери швидкої периферії</text>

  <!-- Картки адаптерів -->
  <rect x="248" y="136" width="204" height="86" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="350" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">UI Presentation Adapter</text>
  <text x="350" y="180" text-anchor="middle" font-size="12" fill="#1a1a1a">Згладжування жестів UI</text>
  <text x="350" y="200" text-anchor="middle" font-size="12" fill="#6b7280">Мапінг у канонічні команди</text>

  <rect x="248" y="236" width="204" height="86" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="350" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Smart Home Inbound</text>
  <text x="350" y="280" text-anchor="middle" font-size="12" fill="#1a1a1a">Нормалізація 0..100% у 0..1</text>
  <text x="350" y="300" text-anchor="middle" font-size="12" fill="#6b7280">Відсікання вендорних полів</text>

  <rect x="248" y="336" width="204" height="86" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="350" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Energy Tariff Adapter</text>
  <text x="350" y="380" text-anchor="middle" font-size="12" fill="#1a1a1a">Перерахунок EUR/MWh</text>
  <text x="350" y="400" text-anchor="middle" font-size="12" fill="#6b7280">Ізоляція змін котирувань</text>

  <!-- Напис інверсії залежностей між Col 2 і Col 3 -->
  <text x="517" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Інверсія</text>
  <text x="517" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">залежностей</text>

  <!-- Стрілки інверсії залежностей від Адаптерів до Контракту -->
  <line x1="452" y1="179" x2="572" y2="179" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="452" y1="279" x2="572" y2="232" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="452" y1="379" x2="572" y2="282" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3. Стабільне ядро -->
  <rect x="572" y="78" width="364" height="376" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="754" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Повільне стабільне ядро (Core)</text>
  <text x="754" y="122" text-anchor="middle" font-size="12" fill="#6b7280">Темп: місяці — роки | Стабільність (I ≈ 0.0)</text>

  <!-- Блок «Стабільний якір» — Канонічний контракт -->
  <rect x="584" y="136" width="340" height="168" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="754" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">«СТАБІЛЬНИЙ ЯКІР»</text>
  <text x="754" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">interface ICanonicalDeviceState</text>
  <line x1="600" y1="186" x2="908" y2="186" stroke="#d0d7de" stroke-width="1"/>
  <text x="754" y="205" text-anchor="middle" font-size="12" fill="#1a1a1a">• Одиниці SI: температура °C, потужність W</text>
  <text x="754" y="224" text-anchor="middle" font-size="12" fill="#1a1a1a">• Ідемпотентні команди: SetTargetState</text>
  <text x="754" y="243" text-anchor="middle" font-size="12" fill="#1a1a1a">• Розподіл станів: targetState проти actualState</text>
  <text x="754" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Контракт належить ядру (заморожений)</text>
  <text x="754" y="286" text-anchor="middle" font-size="12" fill="#6b7280">Зміни регламентовані строгими RFC</text>

  <!-- Блок внутрішніх координаторів та драйверів -->
  <rect x="584" y="316" width="340" height="126" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="754" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Внутрішні координатори та драйвери</text>
  <text x="754" y="358" text-anchor="middle" font-size="12" fill="#6b7280">• HeatingZoneController (інваріанти безпеки)</text>
  <text x="754" y="378" text-anchor="middle" font-size="12" fill="#6b7280">• Захист реле від дрижання (anti-chattering)</text>
  <text x="754" y="398" text-anchor="middle" font-size="12" fill="#6b7280">• Апаратні радіодрайвери UART / SPI (роки)</text>
  <text x="754" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ядро реалізує контракт і не знає про клієнтів</text>

</svg>
