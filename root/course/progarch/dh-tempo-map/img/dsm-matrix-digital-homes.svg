<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Матриця структури залежностей (DSM) та метрики нестабільності (I)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Аналіз аферентного (Ca) та еферентного (Ce) зчеплення і градієнта темпів змін у Digital Homes</text>

  <!-- DSM ТАБЛИЦЯ (ЛІВА ЧАСТИНА) -->
  <!-- Загальне тло таблиці -->
  <rect x="40" y="90" width="590" height="380" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовки стовпців DSM -->
  <rect x="40" y="90" width="590" height="40" fill="#f4f6f8" rx="6"/>
  <!-- Перекриваємо нижній радіус заголовка -->
  <rect x="40" y="120" width="590" height="10" fill="#f4f6f8"/>

  <text x="125" y="114" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Компонент (Row → Col)</text>

  <text x="240" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="240" y="124" font-size="11" fill="#6b7280" text-anchor="middle">UI</text>

  <text x="300" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="300" y="124" font-size="11" fill="#6b7280" text-anchor="middle">API</text>

  <text x="360" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>
  <text x="360" y="124" font-size="11" fill="#6b7280" text-anchor="middle">Auto</text>

  <text x="420" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4</text>
  <text x="420" y="124" font-size="11" fill="#6b7280" text-anchor="middle">Sec</text>

  <text x="480" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5</text>
  <text x="480" y="124" font-size="11" fill="#6b7280" text-anchor="middle">Gate</text>

  <text x="537" y="114" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Ce</text>
  <text x="597" y="114" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Нестаб. I</text>

  <!-- Горизонтальні лінії розділення -->
  <line x1="40" y1="130" x2="630" y2="130" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="40" y1="180" x2="630" y2="180" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="230" x2="630" y2="230" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="280" x2="630" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="330" x2="630" y2="330" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="380" x2="630" y2="380" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="40" y1="425" x2="630" y2="425" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Вертикальні лінії розділення -->
  <line x1="210" y1="90" x2="210" y2="470" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="270" y1="90" x2="270" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="330" y1="90" x2="330" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="390" y1="90" x2="390" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="450" y1="90" x2="450" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="510" y1="90" x2="510" y2="470" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="565" y1="90" x2="565" y2="470" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Затінення діагоналі N/A -->
  <rect x="211" y="131" width="58" height="48" fill="#d0d7de" opacity="0.6"/>
  <rect x="271" y="181" width="58" height="48" fill="#d0d7de" opacity="0.6"/>
  <rect x="331" y="231" width="58" height="48" fill="#d0d7de" opacity="0.6"/>
  <rect x="391" y="281" width="58" height="48" fill="#d0d7de" opacity="0.6"/>
  <rect x="451" y="331" width="58" height="48" fill="#d0d7de" opacity="0.6"/>

  <!-- РЯДОК 1: Mobile UI -->
  <text x="50" y="159" font-size="13" font-weight="bold" fill="#1a1a1a">1. Mobile UI</text>
  <text x="300" y="159" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="360" y="159" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="420" y="159" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="480" y="159" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="537" y="159" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <rect x="572" y="139" width="51" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="597" y="160" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">1.00</text>

  <!-- РЯДОК 2: Web API -->
  <text x="50" y="209" font-size="13" font-weight="bold" fill="#1a1a1a">2. Web API</text>
  <text x="240" y="209" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="360" y="209" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="420" y="209" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="480" y="209" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="537" y="209" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2</text>
  <rect x="572" y="189" width="51" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="597" y="210" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">0.67</text>

  <!-- РЯДОК 3: Automation Engine -->
  <text x="50" y="259" font-size="13" font-weight="bold" fill="#1a1a1a">3. Automation</text>
  <text x="240" y="259" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="300" y="259" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="420" y="259" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="480" y="259" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="537" y="259" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2</text>
  <rect x="572" y="239" width="51" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="597" y="260" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">0.67</text>

  <!-- РЯДОК 4: Security Core -->
  <text x="50" y="309" font-size="13" font-weight="bold" fill="#1a1a1a">4. Security Core</text>
  <text x="240" y="309" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="300" y="309" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="360" y="309" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="480" y="309" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="537" y="309" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <rect x="572" y="289" width="51" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="597" y="310" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">0.33</text>

  <!-- РЯДОК 5: Device Gateway -->
  <text x="50" y="359" font-size="13" font-weight="bold" fill="#1a1a1a">5. Device Gateway</text>
  <text x="240" y="359" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="300" y="359" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="360" y="359" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="420" y="359" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
  <text x="537" y="359" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>
  <rect x="572" y="339" width="51" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="597" y="360" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">0.00</text>

  <!-- РЯДОК Ca (Аферентне зчеплення) -->
  <text x="50" y="406" font-size="12" font-weight="bold" fill="#2457d6">Аферентне Ca</text>
  <text x="240" y="406" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>
  <text x="300" y="406" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="360" y="406" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="420" y="406" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2</text>
  <text x="480" y="406" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2</text>
  <text x="570" y="406" font-size="11" fill="#6b7280" text-anchor="middle">Вхідні залеж.</text>

  <!-- РЯДОК Темп змін (τ) -->
  <text x="50" y="451" font-size="12" font-weight="bold" fill="#1a1a1a">Темп змін (τ)</text>
  <text x="240" y="451" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Високий</text>
  <text x="300" y="451" font-size="11" fill="#6b7280" text-anchor="middle">Сер-вис</text>
  <text x="360" y="451" font-size="11" fill="#6b7280" text-anchor="middle">Середній</text>
  <text x="420" y="451" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Низький</text>
  <text x="480" y="451" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Мін (HW)</text>
  <text x="570" y="451" font-size="11" fill="#6b7280" text-anchor="middle">Волатильність</text>

  <!-- ПРАВА ЧАСТИНА: КАРТКИ ФОРМУЛ ТА АУДИТУ -->
  <!-- Картка 1: Формули -->
  <rect x="650" y="90" width="280" height="180" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="665" y="114" font-size="13" font-weight="bold" fill="#1a1a1a">Формули нестабільності:</text>

  <rect x="665" y="125" width="250" height="52" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="790" y="145" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">I = Ce / (Ca + Ce)</text>
  <text x="790" y="163" font-size="11" fill="#6b7280" text-anchor="middle">Ca — вхідні залежності, Ce — вихідні</text>

  <rect x="665" y="185" width="250" height="72" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="675" y="203" font-size="12" font-weight="bold" fill="#2457d6">Принцип стабільності (SDP):</text>
  <text x="675" y="223" font-size="12" font-weight="bold" fill="#1a1a1a">I(залежність) ≤ I(викликач)</text>
  <text x="675" y="243" font-size="11" fill="#6b7280">Залежності мають іти до нижчого I</text>

  <!-- Картка 2: Аудит -->
  <rect x="650" y="282" width="280" height="188" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="665" y="306" font-size="14" font-weight="bold" fill="#2457d6">Архітектурний аудит:</text>

  <text x="665" y="330" font-size="12" fill="#1a1a1a">• Усі залежності (значення 1)</text>
  <text x="677" y="348" font-size="11" fill="#6b7280">розташовані праворуч від діагоналі.</text>

  <text x="665" y="372" font-size="12" font-weight="bold" fill="#27ae60">• Відсутність зворотних циклів:</text>
  <text x="677" y="390" font-size="11" fill="#6b7280">немає залежностей під діагоналлю!</text>

  <text x="665" y="414" font-size="12" fill="#1a1a1a">• Консервативне ядро (Gateway)</text>
  <text x="677" y="432" font-size="11" fill="#6b7280">має I = 0.00 та захищене від релізів.</text>

  <rect x="665" y="444" width="250" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="790" y="458" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ Градієнт темпів узгоджений (No Pace Clash)</text>
</svg>
