<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Узгодження бажаного та підтвердженого станів (Desired vs Reported)</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Петля узгодження фіксує розбіжність між командою UI та реакцією реле, захищаючи систему від ілюзії виконання</text>

  <!-- Головна панель архітектурного потоку -->
  <rect x="25" y="82" width="910" height="280" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Колонка 1: Бажаний стан (UI / Клієнт) -->
  <rect x="38" y="94" width="236" height="256" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="46" y="104" width="220" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="156" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">БАЖАНИЙ СТАН (DESIRED)</text>

  <rect x="46" y="142" width="220" height="152" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="160" font-size="12" font-weight="bold" fill="#1a1a1a">Команда з додатка UI:</text>
  <text x="56" y="180" font-size="12" fill="#2457d6">• target: relay-light-1</text>
  <text x="56" y="198" font-size="12" fill="#2457d6">• command: setPower(ON)</text>
  <text x="56" y="216" font-size="12" fill="#6b7280">• key: "idemp-9481"</text>
  <text x="56" y="238" font-size="12" fill="#1a1a1a">Запис у Тінь пристрою:</text>
  <text x="56" y="258" font-size="12" font-weight="bold" fill="#2457d6">desired.power = ON</text>
  <text x="56" y="278" font-size="12" fill="#6b7280">Час команди: 10:00:01</text>

  <rect x="46" y="308" width="220" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="156" y="328" font-size="12" fill="#2457d6" text-anchor="middle">Очікує узгодження з реле</text>


  <!-- Стрілка 1: Від UI до Тіні пристрою -->
  <line x1="274" y1="218" x2="336" y2="218" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="288" y="160" width="40" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="308" y="174" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Запис</text>
  <text x="308" y="187" font-size="11" fill="#2457d6" text-anchor="middle">API</text>


  <!-- Колонка 2: Рушій узгодження (Device Shadow) -->
  <rect x="342" y="94" width="262" height="256" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="350" y="104" width="246" height="24" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="473" y="120" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ПЕТЛЯ УЗГОДЖЕННЯ (SHADOW)</text>

  <!-- Блок порівняння станів -->
  <rect x="350" y="142" width="246" height="152" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="360" y="160" font-size="12" font-weight="bold" fill="#c0392b">Порівняння станів (Δ-дельта):</text>
  <text x="360" y="180" font-size="12" fill="#2457d6">Бажаний (Desired):   ON</text>
  <text x="360" y="198" font-size="12" fill="#c0392b">Фактичний (Reported): OFF</text>
  <text x="360" y="222" font-size="12" font-weight="bold" fill="#c0392b">Δ = РОЗБІЖНІСТЬ СТАНУ</text>
  <text x="360" y="244" font-size="12" fill="#1a1a1a">Дія: відправка команди на реле</text>
  <text x="360" y="262" font-size="12" fill="#6b7280">Таймер очікування: 5.0 с</text>
  <text x="360" y="280" font-size="12" font-weight="bold" fill="#c0392b">Спроба 3 / 3: ТАЙМАУТ</text>

  <rect x="350" y="308" width="246" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="473" y="328" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Статус: DIVERGENT (Розбіжність)</text>


  <!-- Стрілка 2: Команда на реле -->
  <line x1="604" y1="190" x2="666" y2="190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="618" y="148" width="40" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="638" y="164" font-size="12" fill="#2457d6" text-anchor="middle">Zigbee</text>

  <!-- Стрілка 3: Відмова / Таймаут зв'язку -->
  <line x1="666" y1="240" x2="610" y2="240" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <rect x="618" y="258" width="40" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="638" y="274" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ЗБІЙ</text>


  <!-- Колонка 3: Підтверджений стан (Фізичне реле) -->
  <rect x="672" y="94" width="248" height="256" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="680" y="104" width="232" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="796" y="120" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ПІДТВЕРДЖЕНИЙ СТАН (REPORTED)</text>

  <rect x="680" y="142" width="232" height="152" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="690" y="160" font-size="12" font-weight="bold" fill="#1a1a1a">Фізичне реле освітлення:</text>
  <text x="690" y="180" font-size="12" fill="#c0392b">• hardware_state: OFF</text>
  <text x="690" y="198" font-size="12" fill="#c0392b">• contacts: OPEN (розімкнуто)</text>
  <text x="690" y="216" font-size="12" fill="#6b7280">• last_ack: 09:55:12</text>
  <text x="690" y="238" font-size="12" font-weight="bold" fill="#c0392b">Діагностика шини:</text>
  <text x="690" y="258" font-size="12" fill="#c0392b">Втрата пакетів Zigbee (RF drop)</text>
  <text x="690" y="278" font-size="12" fill="#6b7280">Команда не дійшла до чипа</text>

  <rect x="680" y="308" width="232" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="796" y="328" font-size="12" fill="#c0392b" text-anchor="middle">reported.power = OFF</text>


  <!-- Нижня панель: Наслідки розбіжності для архітектури -->
  <rect x="25" y="376" width="910" height="126" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>

  <rect x="40" y="388" width="240" height="24" rx="4" fill="#c0392b"/>
  <text x="160" y="404" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">РОЗВ'ЯЗАННЯ РОЗБІЖНОСТІ</text>

  <text x="295" y="405" font-size="13" font-weight="bold" fill="#c0392b">Захист інтерфейсу від хибного оптимізму при відмовах заліза</text>

  <!-- 3 картки наслідків всередині нижньої панелі -->
  <rect x="40" y="426" width="280" height="66" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="52" y="444" font-size="12" font-weight="bold" fill="#c0392b">1. Немає хибного успіху</text>
  <text x="52" y="462" font-size="12" fill="#1a1a1a">UI не позначає реле увімкненим,</text>
  <text x="52" y="480" font-size="12" fill="#6b7280">доки залізо не надішле reported</text>

  <rect x="340" y="426" width="280" height="66" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="352" y="444" font-size="12" font-weight="bold" fill="#c0392b">2. Ідемпотентний повтор</text>
  <text x="352" y="462" font-size="12" fill="#1a1a1a">Ключ idemp-9481 виключає</text>
  <text x="352" y="480" font-size="12" fill="#6b7280">подвійний клацальний імпульс реле</text>

  <rect x="640" y="426" width="280" height="66" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="652" y="444" font-size="12" font-weight="bold" fill="#c0392b">3. Сигнал деградації</text>
  <text x="652" y="462" font-size="12" fill="#1a1a1a">Канонічний статус: DIVERGENT</text>
  <text x="652" y="480" font-size="12" fill="#6b7280">користувач бачить попередження</text>
</svg>
