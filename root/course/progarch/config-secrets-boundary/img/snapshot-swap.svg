<line x1="560.0" y1="150.0" x2="560.0" y2="512.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,6"/>
<line x1="120.0" y1="214.0" x2="930.0" y2="214.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="922.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час →</text>
<rect x="150.0" y="186.0" width="398.0" height="56.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="349.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">поточний → знімок A</text>
<text x="349.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">pass = ●●●  (v1)</text>
<rect x="572.0" y="186.0" width="338.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
<text x="741.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">поточний → знімок B</text>
<text x="741.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">pass = ●●●  (v2)</text>
<text x="574.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">атомна підміна</text>
<text x="574.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">одного посилання</text>
<text x="546.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">fail-static:</text>
<text x="546.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">збій → лишається A</text>
<text x="140.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">R1: знімок = поточний()  ОДИН раз</text>
