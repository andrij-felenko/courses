<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина підтверджень, що не має верху</text>
<line x1="180.0" y1="110.0" x2="180.0" y2="468.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,5"/>
<line x1="760.0" y1="110.0" x2="760.0" y2="468.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,5"/>
<text x="470.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">«нападаємо на світанку»</text>
<line x1="214.0" y1="168.0" x2="726.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="470.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">«згоден» — 1-ше підтвердження</text>
<line x1="726.0" y1="253.0" x2="214.0" y2="253.0" stroke="#2457d6" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="470.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">«отримав твоє „згоден“» — 2-ге</text>
<line x1="214.0" y1="338.0" x2="726.0" y2="338.0" stroke="#2457d6" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="470.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">«отримав твоє „отримав“» — 3-тє</text>
<line x1="726.0" y1="423.0" x2="214.0" y2="423.0" stroke="#2457d6" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="470.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">⋮   і так без кінця</text>
<rect x="102.0" y="49.0" width="156.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="70.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Генерал А</tspan><tspan x="180.0" dy="16.9">(лівий пагорб)</tspan></text>
<rect x="682.0" y="49.0" width="156.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="70.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">Генерал Б</tspan><tspan x="760.0" dy="16.9">(правий пагорб)</tspan></text>
<rect x="125.0" y="551.6" width="690.0" height="66.8" rx="6" fill="#fff8e6" stroke="#c0392b" stroke-width="1.8"/><text x="470.0" y="572.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Хто відправив ОСТАННЄ повідомлення — не знає, чи воно дійшло.</tspan><tspan x="470.0" dy="16.9">Тож рівно один із двох завжди лишається без повної певності.</tspan><tspan x="470.0" dy="16.9">Скільки підтверджень не додавай — драбина не закривається.</tspan></text>
</svg>