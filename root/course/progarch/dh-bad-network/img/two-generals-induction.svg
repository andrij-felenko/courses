<text x="545.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Останнє повідомлення завжди зайве — його відправник не певен, що воно дійшло. Зривай його раз за разом — і скінченний протокол тане до нуля.</text>
