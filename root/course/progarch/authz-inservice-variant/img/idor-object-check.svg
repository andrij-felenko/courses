<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключ пошуку членства — дім самого об'єкта: тим і закрито IDOR</text>
<rect x="220.0" y="46.0" width="500.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="70.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Оксана — мешканка дому 12 — тисне «відчинити замок #42»</tspan><tspan x="470.0" dy="16.2">(а замок #42 належить дому 7)</tspan></text>
<text x="470.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ліворуч — багована перевірка; праворуч — правильна</text>
