<rect x="508.0" y="130.0" width="374.0" height="30.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.3"/><text x="695.0" y="149.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">ФІКС: роль У ДОМІ об'єкта</tspan></text>
