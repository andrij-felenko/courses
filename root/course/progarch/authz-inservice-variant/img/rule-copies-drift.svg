<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Те саме правило, скопійоване в кожен сервіс — і воно розповзається</text>
<rect x="16.0" y="92.0" width="196.0" height="34.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="114.0" y="113.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="114.0" dy="0.0">Сервіс пристроїв</tspan></text>
<rect x="16.0" y="130.0" width="196.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="114.0" y="158.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="114.0" dy="0.0">член дому</tspan><tspan x="114.0" dy="15.6">AND роль ∈</tspan><tspan x="114.0" dy="15.6">{власник,</tspan><tspan x="114.0" dy="15.6">мешканець}</tspan></text>
<text x="114.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">еталон</text>
<rect x="242.0" y="92.0" width="196.0" height="34.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="113.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Сервіс камер</tspan></text>
<rect x="242.0" y="130.0" width="196.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.2"/><text x="340.0" y="166.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">член дому</tspan><tspan x="340.0" dy="15.6">AND роль =</tspan><tspan x="340.0" dy="15.6">власник</tspan></text>
<text x="340.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">суворіше</text>
<rect x="468.0" y="92.0" width="196.0" height="34.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="566.0" y="113.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="566.0" dy="0.0">Сервіс правил</tspan></text>
<rect x="468.0" y="130.0" width="196.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.2"/><text x="566.0" y="166.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="566.0" dy="0.0">член дому</tspan><tspan x="566.0" dy="15.6">— роль не</tspan><tspan x="566.0" dy="15.6">перевіряють —</tspan></text>
<text x="566.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">проґавили роль</text>
<rect x="694.0" y="92.0" width="196.0" height="34.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="792.0" y="113.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="792.0" dy="0.0">Сервіс сповіщень</tspan></text>
<rect x="694.0" y="130.0" width="196.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="792.0" y="174.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="792.0" dy="0.0">— перевірки</tspan><tspan x="792.0" dy="15.6">тут забули —</tspan></text>
<text x="792.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">тиха дірка</text>
</svg>