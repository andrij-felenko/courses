<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири стіни однієї машини — кожна інша фізика, кожна жене в свій бік</text>
<rect x="490.0" y="130.0" width="140.0" height="300.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="560.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">ОДНА</tspan><tspan x="560.0" dy="18.4">МАШИНА</tspan></text>
<text x="560.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">усе скінченне:</tspan><tspan x="560.0" dy="16.1">диск · RAM</tspan><tspan x="560.0" dy="16.1">пропускна</tspan><tspan x="560.0" dy="16.1">аптайм</tspan></text>
<rect x="60.0" y="90.0" width="380.0" height="180.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="250.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">НЕ ВЛАЗИТЬ</text><text x="250.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">набір даних більший</tspan><tspan x="250.0" dy="15.6">за диск чи RAM однієї машини</tspan></text><text x="250.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">100 ТБ у машину на 32 не влізуть</text><rect x="84.0" y="230.0" width="332.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="250.0" y="249.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">форма: РОЗБИТИ дані</tspan></text>
<rect x="60.0" y="300.0" width="380.0" height="180.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="250.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">ВПАДЕ</text><text x="250.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">машина колись неодмінно помре —</tspan><tspan x="250.0" dy="15.6">аптайм має жорстку стелю</tspan></text><text x="250.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">згорів диск — зникла вся правда</text><rect x="84.0" y="440.0" width="332.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="250.0" y="459.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">форма: КОПІЇ в різних доменах відмови</tspan></text>
<rect x="680.0" y="90.0" width="380.0" height="180.0" rx="6" fill="#ffffff" stroke="#0e7d4b" stroke-width="2.0"/><text x="870.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#0e7d4b" text-anchor="middle" font-weight="700">НЕ ВСТИГАЄ</text><text x="870.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">потік запитів більший</tspan><tspan x="870.0" dy="15.6">за те, що бере одна машина</tspan></text><text x="870.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">десятки тис. запитів/с — стеля вузла</text><rect x="704.0" y="230.0" width="332.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.7"/><text x="870.0" y="249.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">читання: КОПІЇ · записи: РОЗБИТИ</tspan></text>
<rect x="680.0" y="300.0" width="380.0" height="180.0" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2.0"/><text x="870.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#b45309" text-anchor="middle" font-weight="700">ДАЛЕКО</text><text x="870.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">світло ~200 000 км/с у волокні —</tspan><tspan x="870.0" dy="15.6">непорушний спід на затримку</tspan></text><text x="870.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Нью-Йорк⇄Сідней ≈160 мс туди-й-назад</text><rect x="704.0" y="440.0" width="332.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="870.0" y="459.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">форма: КОПІЇ ближче до людей</tspan></text>
<line x1="490.0" y1="180.0" x2="445.0" y2="180.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="490.0" y1="390.0" x2="445.0" y2="390.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="630.0" y1="180.0" x2="675.0" y2="180.0" stroke="#0e7d4b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="630.0" y1="390.0" x2="675.0" y2="390.0" stroke="#b45309" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>