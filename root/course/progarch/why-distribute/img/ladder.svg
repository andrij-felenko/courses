<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина розподілу: кожен вищий щабель дорожчий за попередній</text>
<rect x="70.0" y="370.0" width="300.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="220.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">1. Одна більша машина</text><text x="90.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">купує: ємність і потік надовго</text><rect x="90.0" y="474.0" width="260.0" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="220.0" y="494.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">координація: НУЛЬ</tspan></text>
<rect x="400.0" y="250.0" width="300.0" height="150.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="550.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">2. Репліки для читань</text><text x="420.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">купує: витривалість і читання</text><rect x="420.0" y="354.0" width="260.0" height="32.0" rx="6" fill="#fdf6e3" stroke="#b45309" stroke-width="1.6"/><text x="550.0" y="374.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">платить лише лагом реплік</tspan></text>
<rect x="730.0" y="130.0" width="300.0" height="150.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="880.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">3. Розбити — багато писарів</text><text x="750.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">купує: потік записів і ємність</text><rect x="750.0" y="234.0" width="260.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="880.0" y="253.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">консенсус · замки · 2PC · годинники</tspan></text>
<line x1="45.0" y1="515.0" x2="45.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="235.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">▲ що вищий щабель —</tspan><tspan x="235.0" dy="16.9">то дорожча координація</tspan></text>
<line x1="372.0" y1="430.0" x2="398.0" y2="360.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="702.0" y1="310.0" x2="728.0" y2="240.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="522.0" width="960.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="550.0" y="543.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">правило: копії — раніше за розбиття, розбиття — раніше за багато писарів; піднімайся лише під поміряним числом</tspan></text>
</svg>