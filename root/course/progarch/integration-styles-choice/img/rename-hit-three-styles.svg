<text x="720.0" y="696.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="720.0" dy="0.0">білінг чужого сховища не читає взагалі;</tspan><tspan x="720.0" dy="15.6">подія тієї самої форми тече далі — проєкція недоторкана</tspan></text>
