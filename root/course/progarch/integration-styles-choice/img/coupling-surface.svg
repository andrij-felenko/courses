<rect x="276.0" y="408.0" width="300.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="426.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="426.0" dy="0.0">device.activated { deviceId, homeId, at }</tspan></text>
<text x="110.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">проєкція — лише форма факту; ще й розчеплена в часі</text>
