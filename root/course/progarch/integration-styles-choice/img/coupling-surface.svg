<text x="1170.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="1170.0" dy="0.0">згори вниз</tspan><tspan x="1170.0" dy="15.6">поверхня вужчає:</tspan><tspan x="1170.0" dy="15.6">• менше може зламатися</tspan><tspan x="1170.0" dy="15.6">• більший клопіт вести</tspan></text>
