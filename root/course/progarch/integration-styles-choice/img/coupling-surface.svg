<rect x="696.0" y="104.0" width="128.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="125.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">тип</tspan><tspan x="760.0" dy="15.0">boolean</tspan></text>
<rect x="836.0" y="104.0" width="128.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="900.0" y="125.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">зміст</tspan><tspan x="900.0" dy="15.0">active=true</tspan></text>
<text x="110.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">спільна таблиця — залежиш від УСЬОГО цього; будь-яка зміна може зачепити</text>
<rect x="110.0" y="248.0" width="150.0" height="66.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/><text x="185.0" y="285.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">КОНТРАКТ</tspan></text>
<rect x="276.0" y="256.0" width="300.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="426.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="426.0" dy="0.0">activeCount(homeId) → count</tspan></text>
<text x="110.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">RPC — лише обіцяна форма; свою схему власник міняє вільно</text>
