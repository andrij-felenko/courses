<rect x="40.0" y="95.0" width="445.0" height="155.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="262.5" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle"><tspan x="262.5" dy="0.0">🟢 Повні перемоги (Achieved Drivers)</tspan><tspan x="262.5" dy="15.6"></tspan><tspan x="262.5" dy="15.6">• Офлайн-автономність замка (&lt;100мс на хабі)</tspan><tspan x="262.5" dy="15.6">• Затримка відео дзвінка (&lt;1.6с через WebRTC)</tspan><tspan x="262.5" dy="15.6">• Зворотна сумісність контракту (4 покоління датчиків)</tspan></text>
<rect x="515.0" y="95.0" width="445.0" height="155.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="737.5" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle"><tspan x="737.5" dy="0.0">🟡 Контрольовані компроміси (Trade-offs)</tspan><tspan x="737.5" dy="15.6"></tspan><tspan x="737.5" dy="15.6">• Пропускна здатність телеметрії (TimescaleDB замість Kafka)</tspan><tspan x="737.5" dy="15.6">• Бюджет сховища (Edge-буфер + Cloud Object Lifecycle)</tspan><tspan x="737.5" dy="15.6">• Багатокомпонентний API Gateway (Envoy gRPC/REST)</tspan></text>
<rect x="40.0" y="270.0" width="445.0" height="155.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="262.5" y="320.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle"><tspan x="262.5" dy="0.0">🔴 Виправлені больові точки (Resolved Friction)</tspan><tspan x="262.5" dy="15.6"></tspan><tspan x="262.5" dy="15.6">• Дрейф стану Device Shadow → Event Sourcing в v3.2</tspan><tspan x="262.5" dy="15.6">• Передчасна мікросервісна декомпозиція → консолідація</tspan><tspan x="262.5" dy="15.6">• Спільна база даних → ізольовані схемні межі</tspan></text>
<rect x="515.0" y="270.0" width="445.0" height="155.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="737.5" y="320.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7b1fa2" text-anchor="middle"><tspan x="737.5" dy="0.0">🟣 Засвоєні уроки штормів (Outage Lessons)</tspan><tspan x="737.5" dy="15.6"></tspan><tspan x="737.5" dy="15.6">• Відновлення після блекауту 50k хабів → Backoff + Jitter</tspan><tspan x="737.5" dy="15.6">• Захист архітектурних меж → Fitness Functions у CI</tspan><tspan x="737.5" dy="15.6">• Односторонній вибір безпеки → mTLS з заводу</tspan></text>
