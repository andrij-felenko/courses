<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація рішений Digital Homes за незворотністю</text>
<rect x="40.0" y="40.0" width="445.0" height="380.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="262.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle"><tspan x="262.5" dy="0.0">🚪 Незворотні рішення (One-Way Doors / Type 1)</tspan><tspan x="262.5" dy="15.6">Ціна зміни: висока (місяці роботи, заміна заліза)</tspan><tspan x="262.5" dy="15.6"></tspan><tspan x="262.5" dy="15.6">1. Edge-First парадигма автономії хаба (C++ Engine)</tspan><tspan x="262.5" dy="15.6">2. Схема бінарного протоколу Protobuf над MQTT</tspan><tspan x="262.5" dy="15.6">3. mTLS криптографічна ідентичність пристроїв</tspan><tspan x="262.5" dy="15.6">4. Доменна ізоляція контекстів і меж агрегатів</tspan><tspan x="262.5" dy="15.6">5. Append-only модель зберігання часових рядів</tspan><tspan x="262.5" dy="15.6"></tspan><tspan x="262.5" dy="15.6">Стратегія: 80% часу аналізу, прототипування, ADR</tspan></text>
<rect x="515.0" y="40.0" width="445.0" height="380.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="737.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1565c0" text-anchor="middle"><tspan x="737.5" dy="0.0">🔄 Двосторонні рішення (Two-Way Doors / Type 2)</tspan><tspan x="737.5" dy="15.6">Ціна зміни: низька (дні/тижні, рефакторинг)</tspan><tspan x="737.5" dy="15.6"></tspan><tspan x="737.5" dy="15.6">1. Вибір СУБД телеметрії (TimescaleDB ↔ VictoriaMetrics)</tspan><tspan x="737.5" dy="15.6">2. Конкретна реалізація MQTT-брокера (Mosquitto ↔ EMQX)</tspan><tspan x="737.5" dy="15.6">3. Фреймворк API Gateway (Nginx ↔ Envoy)</tspan><tspan x="737.5" dy="15.6">4. Протокол live-оновлень UI (WebSockets ↔ SSE)</tspan><tspan x="737.5" dy="15.6">5. Вибір мови високорівневих сервісів (Go ↔ Java)</tspan><tspan x="737.5" dy="15.6"></tspan><tspan x="737.5" dy="15.6">Стратегія: Швидкі експерименти, ізоляція за швами</tspan></text>
</svg>