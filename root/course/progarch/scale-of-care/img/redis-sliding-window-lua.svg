<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподілене ковзне вікно в Redis: атомарність Lua та мережеві збої</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Виконання логіки всередині сховища проти затримки RTT і стратегій Fail-Open / Fail-Closed</text>
  <rect x="24" y="80" width="310" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="36" y="104" font-size="12" font-weight="bold" fill="#1a1a1a">ЗАСТОСУНОК / API GATEWAY</text>
  <rect x="36" y="120" width="286" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="48" y="138" font-size="12" font-weight="bold" fill="#2457d6">Вхідний HTTP-запит</text>
  <text x="48" y="154" font-size="11" fill="#6b7280">Перевірка квоти клієнта перед обробкою</text>
  <rect x="36" y="180" width="286" height="236" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="46" y="200" font-size="11" font-weight="bold" fill="#c0392b">Таймаут Redis (> 10–20 мс) / Розрив з'єднання</text>
  <rect x="46" y="212" width="266" height="90" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="56" y="230" font-size="12" font-weight="bold" fill="#27ae60">Стратегія Fail-Open (Пропустити)</text>
  <text x="56" y="248" font-size="11" fill="#1a1a1a">• Дія: пропустити запит до бекенду</text>
  <text x="56" y="266" font-size="11" fill="#1a1a1a">• Пріоритет: доступність сервісу (SLA)</text>
  <text x="56" y="284" font-size="11" fill="#27ae60">Ризик: каскадне перевантаження баз даних</text>
  <rect x="46" y="316" width="266" height="90" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="56" y="334" font-size="12" font-weight="bold" fill="#c0392b">Стратегія Fail-Closed (Заблокувати)</text>
  <text x="56" y="352" font-size="11" fill="#1a1a1a">• Дія: відхилити із кодом HTTP 429 / 503</text>
  <text x="56" y="370" font-size="11" fill="#1a1a1a">• Пріоритет: жорсткий захист інфраструктури</text>
  <text x="56" y="388" font-size="11" fill="#c0392b">Ризик: відмова для легітимних користувачів</text>
  <rect x="346" y="80" width="268" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="360" y="104" font-size="12" font-weight="bold" fill="#2457d6">МЕРЕЖЕВИЙ СТРИБОК (1 RTT)</text>
  <rect x="358" y="120" width="244" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="368" y="137" font-size="11" font-weight="bold" fill="#2457d6">EVALSHA sliding_window.lua</text>
  <text x="368" y="153" font-size="10" fill="#6b7280">KEYS[1] + now, window, limit, req_id</text>
  <line x1="322" y1="143" x2="354" y2="143" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <line x1="602" y1="143" x2="634" y2="143" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <rect x="358" y="180" width="244" height="70" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="368" y="198" font-size="11" font-weight="bold" fill="#1a1a1a">Ціна мережевого стрибка:</text>
  <text x="368" y="215" font-size="11" fill="#2457d6">• Затримка мережі (RTT): 1–3 мс</text>
  <text x="368" y="231" font-size="11" fill="#27ae60">• Виконання Lua в пам'яті: ~30 мкс</text>
  <rect x="358" y="264" width="244" height="46" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="368" y="281" font-size="11" font-weight="bold" fill="#27ae60">Відповідь: {allowed, rem, retry}</text>
  <text x="368" y="297" font-size="10" fill="#6b7280">1 = Дозволено | 0 = Ліміт вичерпано</text>
  <line x1="638" y1="287" x2="606" y2="287" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="358" y1="287" x2="336" y2="287" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="358" y="324" width="244" height="82" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="368" y="342" font-size="11" font-weight="bold" fill="#c0392b">Мережевий таймаут / Збій</text>
  <text x="368" y="359" font-size="10" fill="#1a1a1a">Відповідь не надійшла вчасно</text>
  <text x="368" y="375" font-size="10" fill="#c0392b">-> активація локальної гілки відмови</text>
  <text x="368" y="391" font-size="10" fill="#6b7280">Перемикання на Fail-Open / Closed</text>
  <line x1="358" y1="365" x2="336" y2="365" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <rect x="626" y="80" width="310" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="638" y="104" font-size="12" font-weight="bold" fill="#1a1a1a">REDIS: АТОМАРНИЙ ЦИКЛ LUA</text>
  <rect x="638" y="120" width="286" height="296" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="648" y="139" font-size="10" font-weight="bold" fill="#2457d6">Єдиний потік: нуль блокувань, без стану гонитви</text>
  <rect x="648" y="152" width="266" height="44" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="658" y="169" font-size="11" font-weight="bold" fill="#1a1a1a">1. ZREMRANGEBYSCORE key -inf (now-W)</text>
  <text x="658" y="185" font-size="10" fill="#6b7280">Видалення застарілих міток за межами вікна</text>
  <rect x="648" y="210" width="266" height="44" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="658" y="227" font-size="11" font-weight="bold" fill="#1a1a1a">2. ZCARD key -> кількість подій у вікні</text>
  <text x="658" y="243" font-size="10" fill="#6b7280">Перевірка умови: поточні запити &lt; ліміт</text>
  <rect x="648" y="268" width="266" height="66" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="658" y="285" font-size="11" font-weight="bold" fill="#27ae60">Якщо квота є: СХВАЛЕНО (status = 1)</text>
  <text x="658" y="302" font-size="10" fill="#1a1a1a">• ZADD key now (now:req_id) [додати подію]</text>
  <text x="658" y="318" font-size="10" fill="#27ae60">• PEXPIRE key W -> {1, remaining, 0}</text>
  <rect x="648" y="348" width="266" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="658" y="365" font-size="11" font-weight="bold" fill="#c0392b">Якщо ліміт вичерпано: ВІДХИЛЕНО (status = 0)</text>
  <text x="658" y="382" font-size="10" fill="#1a1a1a">• ZRANGE 0 0 -> розрахунок retry_after</text>
  <text x="658" y="397" font-size="10" fill="#c0392b">• Без запису -> {0, 0, retry_after}</text>
  <rect x="24" y="446" width="912" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="36" y="465" font-size="11" font-weight="bold" fill="#6b7280">МАСШТАБ ТУРБОТИ: ПОРІВНЯННЯ ВИТРАТ ТА ГАРАНТІЙ</text>
  <rect x="36" y="472" width="284" height="56" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="46" y="489" font-size="11" font-weight="bold" fill="#1a1a1a">1. Локальний процес (In-Memory)</text>
  <text x="46" y="505" font-size="10" fill="#27ae60">Затримка: ~50–100 нс | 0 RTT (без мережі)</text>
  <text x="46" y="520" font-size="10" fill="#6b7280">Мінус: ізольований стан, не бачить кластер</text>
  <rect x="338" y="472" width="284" height="56" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="348" y="489" font-size="11" font-weight="bold" fill="#2457d6">2. Redis + Lua (Sliding Window)</text>
  <text x="348" y="505" font-size="10" fill="#2457d6">Затримка: ~1–3 мс | Рівно 1 мережевий RTT</text>
  <text x="348" y="520" font-size="10" fill="#1a1a1a">Плюс: атомарна спільна квота, 0 блокувань</text>
  <rect x="640" y="472" width="284" height="56" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="650" y="489" font-size="11" font-weight="bold" fill="#c0392b">3. Наївний підхід (Без Lua)</text>
  <text x="650" y="505" font-size="10" fill="#c0392b">Затримка: ~5–12 мс | 4 окремі виклики RTT</text>
  <text x="650" y="520" font-size="10" fill="#6b7280">Мінус: стан гонитви (race condition) у піках</text>
</svg>
