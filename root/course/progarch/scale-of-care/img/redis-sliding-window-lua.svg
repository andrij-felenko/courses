<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Часова діаграма ковзного вікна у Redis через Lua-скрипт</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Ковзне вікно усуває граничні сплески ціною затримки мережевого виклику (RTT)</text>

  <!-- ПАНЕЛЬ 1: Мережева послідовність та серверна атомарність -->
  <rect x="25" y="72" width="910" height="248" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Актор 1: Репліка сервісу -->
  <rect x="45" y="85" width="180" height="34" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="135" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Репліка сервісу (App)</text>
  <text x="135" y="113" text-anchor="middle" font-size="12" fill="#6b7280">Клієнтський HTTP-воркер</text>

  <!-- Вертикальна лінія життя Аплікації -->
  <line x1="135" y1="125" x2="135" y2="305" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Активація 1: Відправка запиту -->
  <rect x="129" y="145" width="12" height="24" rx="2" fill="#2457d6"/>
  <text x="120" y="161" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">Запит клієнта</text>

  <!-- Активація 2: Отримання вердикту -->
  <rect x="129" y="267" width="12" height="24" rx="2" fill="#27ae60"/>
  <text x="120" y="283" text-anchor="end" font-size="12" font-weight="700" fill="#27ae60">Дозвіл запиту</text>

  <!-- Стрілка 1: Запит до Redis -->
  <text x="320" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">1. Запит EVALSHA: sliding_window.lua (key, now, W, limit)</text>
  <text x="320" y="157" text-anchor="middle" font-size="12" fill="#6b7280">Мережевий транзит: t_net ≈ 0.5–2.0 ms</text>
  <line x1="141" y1="165" x2="495" y2="165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Стрілка 2: Відповідь від Redis -->
  <text x="320" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">2. Відповідь: [1, remaining = 1, retry_after = 0]</text>
  <text x="320" y="269" text-anchor="middle" font-size="12" fill="#6b7280">Мережевий транзит: t_net ≈ 0.5–2.0 ms</text>
  <line x1="495" y1="277" x2="147" y2="277" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Індикатор RTT -->
  <line x1="225" y1="165" x2="225" y2="277" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="220" y1="165" x2="230" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="220" y1="277" x2="230" y2="277" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="218" y="215" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">Мережевий RTT</text>
  <text x="218" y="229" text-anchor="end" font-size="12" fill="#6b7280">RTT ≈ 1–5 ms</text>

  <!-- Актор 2: Сервер Redis -->
  <rect x="505" y="85" width="410" height="34" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="710" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Сервер Redis (Основний потік)</text>
  <text x="710" y="113" text-anchor="middle" font-size="12" fill="#6b7280">Однопотоковий рушій Lua: неподільне виконання без блокувань</text>

  <!-- Блок атомарного виконання Lua -->
  <rect x="505" y="125" width="410" height="182" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="515" y="142" font-size="12" font-weight="700" fill="#2457d6">АТОМАРНЕ ВИКОНАННЯ У REDIS (t_lua ≈ 0.05 ms)</text>

  <!-- Крок 1 -->
  <rect x="515" y="149" width="390" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="525" y="164" font-size="12" font-weight="700" fill="#c0392b">1. ZREMRANGEBYSCORE key -inf (now - W)</text>
  <text x="525" y="178" font-size="12" fill="#6b7280">Очищення: вилучення застарілих міток часу поза вікном</text>

  <!-- Крок 2 -->
  <rect x="515" y="191" width="390" height="36" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="206" font-size="12" font-weight="700" fill="#1a1a1a">2. ZCARD key</text>
  <text x="525" y="220" font-size="12" fill="#6b7280">Підрахунок: k активних запитів у вікні (k = 3 &lt; limit = 5)</text>

  <!-- Крок 3 -->
  <rect x="515" y="233" width="390" height="44" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="525" y="248" font-size="12" font-weight="700" fill="#27ae60">3. ZADD key now req_id + PEXPIRE key W</text>
  <text x="525" y="261" font-size="12" fill="#6b7280">Фіксація: реєстрація мітки now та поновлення TTL ключа</text>
  <text x="525" y="272" font-size="12" font-weight="700" fill="#27ae60">Вердикт: [1, remaining = 1, retry_after = 0] (ДОЗВОЛЕНО)</text>

  <!-- ПАНЕЛЬ 2: Стан ZSET на осі часу -->
  <rect x="25" y="332" width="910" height="184" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="352" font-size="13" font-weight="700" fill="#1a1a1a">Стан упорядкованої множини ZSET на осі часу t (score = timestamp у мс)</text>
  <text x="915" y="352" text-anchor="end" font-size="12" fill="#6b7280">Гарантія: суворо ≤ limit запитів за будь-який інтервал W</text>

  <!-- Смуга шкали ZSET: Поза вікном -->
  <rect x="45" y="363" width="235" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="55" y="368" width="95" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="102" y="382" text-anchor="middle" font-size="12" fill="#c0392b">t₁ (вилучено)</text>
  <rect x="160" y="368" width="95" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="207" y="382" text-anchor="middle" font-size="12" fill="#c0392b">t₂ (вилучено)</text>

  <!-- Смуга шкали ZSET: Активне вікно -->
  <rect x="290" y="363" width="325" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="300" y="368" width="42" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="321" y="382" text-anchor="middle" font-size="12" fill="#2457d6">t₃</text>
  <rect x="350" y="368" width="42" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="371" y="382" text-anchor="middle" font-size="12" fill="#2457d6">t₄</text>
  <rect x="400" y="368" width="42" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="421" y="382" text-anchor="middle" font-size="12" fill="#2457d6">t₅</text>
  <rect x="452" y="368" width="153" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="528" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">now: ZADD (4-й із 5)</text>

  <!-- Смуга шкали ZSET: Статус квоти -->
  <rect x="625" y="363" width="290" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="770" y="383" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Квота активна: remaining = 1 (ліміт = 5)</text>

  <!-- Картка 1: Пояснення очищення -->
  <rect x="45" y="403" width="235" height="100" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="420" font-size="12" font-weight="700" fill="#c0392b">Очищення застарілих міток</text>
  <text x="55" y="437" font-size="12" fill="#1a1a1a">• ZREMRANGEBYSCORE</text>
  <text x="55" y="453" font-size="12" fill="#6b7280">• Видаляє score ≤ now - W</text>
  <text x="55" y="469" font-size="12" fill="#6b7280">• Звільняє пам'ять ZSET</text>
  <text x="55" y="485" font-size="12" fill="#c0392b">• Не блокує поточний ліміт</text>

  <!-- Картка 2: Пояснення ковзного вікна -->
  <rect x="290" y="403" width="325" height="100" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="300" y="420" font-size="12" font-weight="700" fill="#2457d6">Підрахунок та реєстрація</text>
  <text x="300" y="437" font-size="12" fill="#1a1a1a">• ZCARD рахує події у вікні (3)</text>
  <text x="300" y="453" font-size="12" fill="#27ae60">• Новий запит дозволено: 4 &lt; 5</text>
  <text x="300" y="469" font-size="12" fill="#6b7280">• ZADD записує now у множину</text>
  <text x="300" y="485" font-size="12" fill="#2457d6">• PEXPIRE поновлює TTL ключа</text>

  <!-- Картка 3: Пояснення усунення сплесків та компромісу -->
  <rect x="625" y="403" width="290" height="100" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="635" y="420" font-size="12" font-weight="700" fill="#27ae60">Усунення граничних сплесків</text>
  <text x="635" y="437" font-size="12" fill="#1a1a1a">• Fixed Window: 2×N сплеск на стику</text>
  <text x="635" y="453" font-size="12" fill="#27ae60">• Sliding Window: суворо ≤ N у вікні</text>
  <text x="635" y="469" font-size="12" fill="#6b7280">• Вікно безперервно ковзає в часі</text>
  <text x="635" y="485" font-size="12" font-weight="700" fill="#1a1a1a">• Ціна: RTT віддаленого виклику</text>
</svg>
