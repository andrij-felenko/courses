<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Падіння кумулятивної надійності системи R_sys від кількості вузлів N</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Послідовний ланцюг мультиплікує ризики: локальні 99% на масштабі N=100 дають лише 36.6% доступності</text>

  <!-- Тло області графіка -->
  <rect x="50" y="82" width="600" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Горизонтальні лінії сітки (значення Y) -->
  <line x1="110" y1="110" x2="630" y2="110" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="174" x2="630" y2="174" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="238" x2="630" y2="238" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="302" x2="630" y2="302" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="366" x2="630" y2="366" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="430" x2="630" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Вертикальні лінії сітки (значення X) -->
  <line x1="110" y1="110" x2="110" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="214" y1="110" x2="214" y2="430" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="318" y1="110" x2="318" y2="430" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="422" y1="110" x2="422" y2="430" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="526" y1="110" x2="526" y2="430" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="630" y1="110" x2="630" y2="430" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Підписи осі Y (Кумулятивна доступність) -->
  <text x="102" y="114" font-size="12" fill="#6b7280" text-anchor="end">100%</text>
  <text x="102" y="178" font-size="12" fill="#6b7280" text-anchor="end">80%</text>
  <text x="102" y="242" font-size="12" fill="#6b7280" text-anchor="end">60%</text>
  <text x="102" y="306" font-size="12" fill="#6b7280" text-anchor="end">40%</text>
  <text x="102" y="370" font-size="12" fill="#6b7280" text-anchor="end">20%</text>
  <text x="102" y="434" font-size="12" fill="#6b7280" text-anchor="end">0%</text>

  <!-- Підписи осі X (Кількість вузлів) -->
  <text x="110" y="450" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="214" y="450" font-size="12" fill="#6b7280" text-anchor="middle">20</text>
  <text x="318" y="450" font-size="12" fill="#6b7280" text-anchor="middle">40</text>
  <text x="422" y="450" font-size="12" fill="#6b7280" text-anchor="middle">60</text>
  <text x="526" y="450" font-size="12" fill="#6b7280" text-anchor="middle">80</text>
  <text x="630" y="450" font-size="12" fill="#6b7280" text-anchor="middle">100</text>

  <!-- Підписи осей -->
  <text x="370" y="482" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кількість послідовних компонентів у ланцюжку (N)</text>
  <text x="65" y="100" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_sys (%)</text>

  <!-- Криві падіння надійності -->
  <!-- 1. R_i = 99.99% -->
  <path d="M 110.0,110.0 L 115.2,110.0 L 120.4,110.1 L 125.6,110.1 L 130.8,110.1 L 136.0,110.2 L 141.2,110.2 L 146.4,110.2 L 151.6,110.3 L 156.8,110.3 L 162.0,110.3 L 167.2,110.4 L 172.4,110.4 L 177.6,110.4 L 182.8,110.4 L 188.0,110.5 L 193.2,110.5 L 198.4,110.5 L 203.6,110.6 L 208.8,110.6 L 214.0,110.6 L 219.2,110.7 L 224.4,110.7 L 229.6,110.7 L 234.8,110.8 L 240.0,110.8 L 245.2,110.8 L 250.4,110.9 L 255.6,110.9 L 260.8,110.9 L 266.0,111.0 L 271.2,111.0 L 276.4,111.0 L 281.6,111.1 L 286.8,111.1 L 292.0,111.1 L 297.2,111.1 L 302.4,111.2 L 307.6,111.2 L 312.8,111.2 L 318.0,111.3 L 323.2,111.3 L 328.4,111.3 L 333.6,111.4 L 338.8,111.4 L 344.0,111.4 L 349.2,111.5 L 354.4,111.5 L 359.6,111.5 L 364.8,111.6 L 370.0,111.6 L 375.2,111.6 L 380.4,111.7 L 385.6,111.7 L 390.8,111.7 L 396.0,111.8 L 401.2,111.8 L 406.4,111.8 L 411.6,111.9 L 416.8,111.9 L 422.0,111.9 L 427.2,111.9 L 432.4,112.0 L 437.6,112.0 L 442.8,112.0 L 448.0,112.1 L 453.2,112.1 L 458.4,112.1 L 463.6,112.2 L 468.8,112.2 L 474.0,112.2 L 479.2,112.3 L 484.4,112.3 L 489.6,112.3 L 494.8,112.4 L 500.0,112.4 L 505.2,112.4 L 510.4,112.5 L 515.6,112.5 L 520.8,112.5 L 526.0,112.5 L 531.2,112.6 L 536.4,112.6 L 541.6,112.6 L 546.8,112.7 L 552.0,112.7 L 557.2,112.7 L 562.4,112.8 L 567.6,112.8 L 572.8,112.8 L 578.0,112.9 L 583.2,112.9 L 588.4,112.9 L 593.6,113.0 L 598.8,113.0 L 604.0,113.0 L 609.2,113.1 L 614.4,113.1 L 619.6,113.1 L 624.8,113.2 L 630.0,113.2" fill="none" stroke="#27ae60" stroke-width="2.5"/>

