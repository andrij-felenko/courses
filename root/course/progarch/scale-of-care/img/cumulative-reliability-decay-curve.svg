  <path d="M 110.0,110.0 L 115.2,110.3 L 120.4,110.6 L 125.6,111.0 L 130.8,111.3 L 136.0,111.6 L 141.2,111.9 L 146.4,112.2 L 151.6,112.6 L 156.8,112.9 L 162.0,113.2 L 167.2,113.5 L 172.4,113.8 L 177.6,114.1 L 182.8,114.5 L 188.0,114.8 L 193.2,115.1 L 198.4,115.4 L 203.6,115.7 L 208.8,116.0 L 214.0,116.3 L 219.2,116.7 L 224.4,117.0 L 229.6,117.3 L 234.8,117.6 L 240.0,117.9 L 245.2,118.2 L 250.4,118.5 L 255.6,118.8 L 260.8,119.2 L 266.0,119.5 L 271.2,119.8 L 276.4,120.1 L 281.6,120.4 L 286.8,120.7 L 292.0,121.0 L 297.2,121.3 L 302.4,121.6 L 307.6,121.9 L 312.8,122.2 L 318.0,122.6 L 323.2,122.9 L 328.4,123.2 L 333.6,123.5 L 338.8,123.8 L 344.0,124.1 L 349.2,124.4 L 354.4,124.7 L 359.6,125.0 L 364.8,125.3 L 370.0,125.6 L 375.2,125.9 L 380.4,126.2 L 385.6,126.5 L 390.8,126.8 L 396.0,127.1 L 401.2,127.4 L 406.4,127.7 L 411.6,128.0 L 416.8,128.3 L 422.0,128.6 L 427.2,128.9 L 432.4,129.2 L 437.6,129.5 L 442.8,129.8 L 448.0,130.1 L 453.2,130.4 L 458.4,130.7 L 463.6,131.0 L 468.8,131.3 L 474.0,131.6 L 479.2,131.9 L 484.4,132.2 L 489.6,132.5 L 494.8,132.8 L 500.0,133.1 L 505.2,133.4 L 510.4,133.7 L 515.6,134.0 L 520.8,134.3 L 526.0,134.6 L 531.2,134.9 L 536.4,135.2 L 541.6,135.5 L 546.8,135.8 L 552.0,136.1 L 557.2,136.4 L 562.4,136.7 L 567.6,137.0 L 572.8,137.3 L 578.0,137.6 L 583.2,137.8 L 588.4,138.1 L 593.6,138.4 L 598.8,138.7 L 604.0,139.0 L 609.2,139.3 L 614.4,139.6 L 619.6,139.9 L 624.8,140.2 L 630.0,140.5" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- 3. R_i = 99.0% -->
  <path d="M 110.0,110.0 L 115.2,113.2 L 120.4,116.4 L 125.6,119.5 L 130.8,122.6 L 136.0,125.7 L 141.2,128.7 L 146.4,131.7 L 151.6,134.7 L 156.8,137.7 L 162.0,140.6 L 167.2,143.5 L 172.4,146.4 L 177.6,149.2 L 182.8,152.0 L 188.0,154.8 L 193.2,157.5 L 198.4,160.3 L 203.6,163.0 L 208.8,165.6 L 214.0,168.3 L 219.2,170.9 L 224.4,173.5 L 229.6,176.0 L 234.8,178.6 L 240.0,181.1 L 245.2,183.6 L 250.4,186.1 L 255.6,188.5 L 260.8,190.9 L 266.0,193.3 L 271.2,195.7 L 276.4,198.0 L 281.6,200.3 L 286.8,202.6 L 292.0,204.9 L 297.2,207.1 L 302.4,209.4 L 307.6,211.6 L 312.8,213.8 L 318.0,215.9 L 323.2,218.1 L 328.4,220.2 L 333.6,222.3 L 338.8,224.4 L 344.0,226.4 L 349.2,228.5 L 354.4,230.5 L 359.6,232.5 L 364.8,234.4 L 370.0,236.4 L 375.2,238.3 L 380.4,240.3 L 385.6,242.1 L 390.8,244.0 L 396.0,245.9 L 401.2,247.7 L 406.4,249.6 L 411.6,251.4 L 416.8,253.1 L 422.0,254.9 L 427.2,256.7 L 432.4,258.4 L 437.6,260.1 L 442.8,261.8 L 448.0,263.5 L 453.2,265.2 L 458.4,266.8 L 463.6,268.4 L 468.8,270.1 L 474.0,271.7 L 479.2,273.2 L 484.4,274.8 L 489.6,276.4 L 494.8,277.9 L 500.0,279.4 L 505.2,280.9 L 510.4,282.4 L 515.6,283.9 L 520.8,285.3 L 526.0,286.8 L 531.2,288.2 L 536.4,289.6 L 541.6,291.0 L 546.8,292.4 L 552.0,293.8 L 557.2,295.2 L 562.4,296.5 L 567.6,297.9 L 572.8,299.2 L 578.0,300.5 L 583.2,301.8 L 588.4,303.1 L 593.6,304.3 L 598.8,305.6 L 604.0,306.8 L 609.2,308.1 L 614.4,309.3 L 619.6,310.5 L 624.8,311.7 L 630.0,312.9" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 4. R_i = 95.0% -->
  <path d="M 110.0,110.0 L 115.2,126.0 L 120.4,141.2 L 125.6,155.6 L 130.8,169.4 L 136.0,182.4 L 141.2,194.8 L 146.4,206.5 L 151.6,217.7 L 156.8,228.3 L 162.0,238.4 L 167.2,248.0 L 172.4,257.1 L 177.6,265.7 L 182.8,273.9 L 188.0,281.7 L 193.2,289.2 L 198.4,296.2 L 203.6,302.9 L 208.8,309.2 L 214.0,315.3 L 219.2,321.0 L 224.4,326.5 L 229.6,331.6 L 234.8,336.6 L 240.0,341.2 L 245.2,345.7 L 250.4,349.9 L 255.6,353.9 L 260.8,357.7 L 266.0,361.3 L 271.2,364.7 L 276.4,368.0 L 281.6,371.1 L 286.8,374.1 L 292.0,376.9 L 297.2,379.5 L 302.4,382.0 L 307.6,384.4 L 312.8,386.7 L 318.0,388.9 L 323.2,390.9 L 328.4,392.9 L 333.6,394.7 L 338.8,396.5 L 344.0,398.2 L 349.2,399.8 L 354.4,401.3 L 359.6,402.7 L 364.8,404.1 L 370.0,405.4 L 375.2,406.6 L 380.4,407.8 L 385.6,408.9 L 390.8,409.9 L 396.0,410.9 L 401.2,411.9 L 406.4,412.8 L 411.6,413.7 L 416.8,414.5 L 422.0,415.3 L 427.2,416.0 L 432.4,416.7 L 437.6,417.4 L 442.8,418.0 L 448.0,418.6 L 453.2,419.2 L 458.4,419.7 L 463.6,420.2 L 468.8,420.7 L 474.0,421.2 L 479.2,421.6 L 484.4,422.0 L 489.6,422.4 L 494.8,422.8 L 500.0,423.2 L 505.2,423.5 L 510.4,423.8 L 515.6,424.1 L 520.8,424.4 L 526.0,424.7 L 531.2,425.0 L 536.4,425.2 L 541.6,425.5 L 546.8,425.7 L 552.0,425.9 L 557.2,426.1 L 562.4,426.3 L 567.6,426.5 L 572.8,426.7 L 578.0,426.8 L 583.2,427.0 L 588.4,427.1 L 593.6,427.3 L 598.8,427.4 L 604.0,427.6 L 609.2,427.7 L 614.4,427.8 L 619.6,427.9 L 624.8,428.0 L 630.0,428.1" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Маркери точок на кривих для наочності -->
  <!-- R=99% at N=100 (x=630, y=312.9) -->
  <circle cx="630" cy="312.9" r="4" fill="#c0392b"/>
  <text x="620" y="294" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">36.6%</text>

  <!-- R=99.9% at N=100 (x=630, y=140.5) -->
  <circle cx="630" cy="140.5" r="4" fill="#2457d6"/>
  <text x="620" y="134" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">90.5%</text>

  <!-- R=99.99% at N=100 (x=630, y=113.2) -> place text above grid line (y=104, fs=12 -> y1=92, y2=104 < 110) -->
  <circle cx="630" cy="113.2" r="4" fill="#27ae60"/>
  <text x="620" y="104" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">99.0%</text>

  <!-- R=95% at N=20 (x=214, y=315.3) -->
  <circle cx="214" cy="315.3" r="4" fill="#6b7280"/>
  <text x="225" y="322" font-size="12" fill="#6b7280" text-anchor="start">35.8% (N=20)</text>

  <!-- ПРАВА ІНФОРМАЦІЙНА ПАНЕЛЬ -->
  <rect x="670" y="82" width="260" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="800" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мультиплікація відмов</text>

  <!-- Блок формули -->
  <rect x="685" y="122" width="230" height="48" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="800" y="142" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">R_sys = ∏ R_i = R^N</text>
  <text x="800" y="158" font-size="12" fill="#6b7280" text-anchor="middle">добуток імовірностей успіху</text>

  <!-- Легенда ліній -->
  <!-- Елемент 1: 99.99% -->
  <line x1="685" y1="190" x2="715" y2="190" stroke="#27ae60" stroke-width="3"/>
  <text x="724" y="194" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_i = 99.99% (4 дев'ятки)</text>
  <text x="724" y="210" font-size="12" fill="#6b7280" text-anchor="start">N=100 → R_sys = 99.0%</text>

  <!-- Елемент 2: 99.9% -->
  <line x1="685" y1="230" x2="715" y2="230" stroke="#2457d6" stroke-width="3"/>
  <text x="724" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_i = 99.9% (3 дев'ятки)</text>
  <text x="724" y="250" font-size="12" fill="#6b7280" text-anchor="start">N=100 → R_sys = 90.5%</text>

  <!-- Елемент 3: 99.0% -->
  <line x1="685" y1="270" x2="715" y2="270" stroke="#c0392b" stroke-width="3"/>
  <text x="724" y="274" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_i = 99.0% (2 дев'ятки)</text>
  <text x="724" y="290" font-size="12" fill="#c0392b" text-anchor="start">N=100 → R_sys = 36.6% (крах)</text>

  <!-- Елемент 4: 95.0% -->
  <line x1="685" y1="310" x2="715" y2="310" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="724" y="314" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_i = 95.0% (нестабільний)</text>
  <text x="724" y="330" font-size="12" fill="#6b7280" text-anchor="start">N=20 → R_sys = 35.8%</text>

  <!-- Картка висновку -->
  <rect x="685" y="350" width="230" height="146" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="800" y="372" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Архітектурний висновок</text>
  <text x="695" y="394" font-size="12" fill="#1a1a1a" text-anchor="start">На вищих масштабах</text>
  <text x="695" y="412" font-size="12" fill="#1a1a1a" text-anchor="start">детермінізм не працює:</text>
  <text x="695" y="432" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="start">• таймаути та circuit breaker</text>
  <text x="695" y="450" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="start">• хеджування повільних викликів</text>
  <text x="695" y="468" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="start">• fallback і плавна деградація</text>
  <text x="695" y="486" font-size="12" fill="#6b7280" text-anchor="start">замість сліпого очікування</text>
</svg>
