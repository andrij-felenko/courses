<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Чотири прірви Волдо: локальний виклик проти мережевого</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Фізичні бар'єри розподілених систем, які неможливо приховати спільним інтерфейсом</text>

  <!-- ЛІВА КОЛОНКА: ЛОКАЛЬНИЙ ВИКЛИК -->
  <rect x="30" y="74" width="420" height="466" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="74" width="420" height="34" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="240" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">ЛОКАЛЬНИЙ ВИКЛИК (В МЕЖАХ ПРОЦЕСУ)</text>

  <!-- Ліва картка 1: Пам'ять -->
  <rect x="42" y="120" width="396" height="72" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="54" y="136" font-size="12" font-weight="bold" fill="#27ae60">1. Пам'ять: спільний адресний простір</text>
  <rect x="54" y="148" width="74" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="91" y="166" text-anchor="middle" font-size="12" fill="#1a1a1a">Клієнт</text>
  <line x1="128" y1="162" x2="158" y2="162" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="164" y="148" width="114" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="221" y="166" text-anchor="middle" font-size="12" fill="#27ae60">ptr (0x7FFE...)</text>
  <line x1="278" y1="162" x2="302" y2="162" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="308" y="148" width="116" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="366" y="166" text-anchor="middle" font-size="12" fill="#1a1a1a">Об'єкт у RAM</text>

  <!-- Ліва картка 2: Затримка -->
  <rect x="42" y="204" width="396" height="72" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="54" y="220" font-size="12" font-weight="bold" fill="#27ae60">2. Затримка: наносекунди (1–10 нс)</text>
  <rect x="54" y="232" width="124" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="116" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">~5–10 нс</text>
  <text x="116" y="260" text-anchor="middle" font-size="12" fill="#1a1a1a">L1/L3 кеш, RAM</text>
  <text x="190" y="246" font-size="12" fill="#1a1a1a">Прямий виклик машинних інструкцій</text>
  <text x="190" y="262" font-size="12" fill="#6b7280">Детермінований час виконання CPU</text>

  <!-- Ліва картка 3: Відмова -->
  <rect x="42" y="288" width="396" height="150" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="54" y="304" font-size="12" font-weight="bold" fill="#27ae60">3. Відмова: спільна доля (Fate-Sharing)</text>
  <rect x="54" y="316" width="372" height="46" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="66" y="334" font-size="12" font-weight="bold" fill="#27ae60">Атомарність:</text>
  <text x="156" y="334" font-size="12" fill="#1a1a1a">функція повертає результат або виняток</text>
  <text x="66" y="352" font-size="12" fill="#6b7280">Стан детермінований: стек викликів відомий процесу</text>
  <rect x="54" y="376" width="372" height="48" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="66" y="394" font-size="12" font-weight="bold" fill="#1a1a1a">Спільна загибель:</text>
  <text x="180" y="394" font-size="12" fill="#1a1a1a">крах вбиває весь процес цілком</text>
  <text x="66" y="412" font-size="12" fill="#6b7280">Немає зависання: результат або є, або процес зник</text>

  <!-- Ліва картка 4: Паралелізм -->
  <rect x="42" y="450" width="396" height="78" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="54" y="466" font-size="12" font-weight="bold" fill="#27ae60">4. Паралелізм: спільний час і синхронізація</text>
  <text x="54" y="484" font-size="12" fill="#1a1a1a">• Єдиний тактовий генератор CPU: чіткий порядок подій</text>
  <text x="54" y="501" font-size="12" fill="#1a1a1a">• Примітиви синхронізації: м'ютекси, бар'єри пам'яті</text>
  <text x="54" y="518" font-size="12" fill="#6b7280">• Передбачуваний локальний стан і керований доступ</text>

  <!-- ПРАВА КОЛОНКА: МЕРЕЖЕВИЙ ВИКЛИК -->
  <rect x="480" y="74" width="450" height="466" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="480" y="74" width="450" height="34" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="705" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">МЕРЕЖЕВИЙ ВИКЛИК (ЧОТИРИ ПРІРВИ ВОЛДО)</text>

  <!-- Права картка 1: Пам'ять і маршалінг -->
  <rect x="492" y="120" width="426" height="72" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="504" y="136" font-size="12" font-weight="bold" fill="#c0392b">1. Пам'ять: податок на маршалінг (ізоляція)</text>
  <rect x="502" y="148" width="52" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="528" y="166" text-anchor="middle" font-size="12" fill="#1a1a1a">Клієнт</text>
  <line x1="554" y1="162" x2="562" y2="162" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="568" y="148" width="78" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="607" y="166" text-anchor="middle" font-size="12" fill="#c0392b">Маршалінг</text>
  <line x1="646" y1="162" x2="654" y2="162" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="660" y="148" width="58" height="28" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="689" y="166" text-anchor="middle" font-size="12" fill="#1a1a1a">Мережа</text>
  <line x1="718" y1="162" x2="726" y2="162" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="732" y="148" width="92" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="778" y="166" text-anchor="middle" font-size="12" fill="#c0392b">Демаршалінг</text>
  <line x1="824" y1="162" x2="832" y2="162" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="838" y="148" width="62" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="869" y="166" text-anchor="middle" font-size="12" fill="#1a1a1a">Сервер</text>

  <!-- Права картка 2: Затримка -->
  <rect x="492" y="204" width="426" height="72" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="504" y="220" font-size="12" font-weight="bold" fill="#c0392b">2. Затримка: стрибок на 5 порядків (1–10 мс)</text>
  <rect x="504" y="232" width="140" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="574" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">~1–10 мс (10⁶ нс)</text>
  <text x="574" y="260" text-anchor="middle" font-size="12" fill="#c0392b">×100 000 повільніше</text>
  <text x="656" y="246" font-size="12" fill="#1a1a1a">Комутатори, черги ОС, затримка лінії</text>
  <text x="656" y="262" font-size="12" fill="#c0392b">Як 1 секунда проти понад 27 годин!</text>

  <!-- Права картка 3: Трикутник невизначеності -->
  <rect x="492" y="288" width="426" height="150" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="504" y="304" font-size="12" font-weight="bold" fill="#c0392b">3. Частинна відмова: трикутник невизначеності</text>

  <!-- Вершина 1: Втрата запиту -->
  <rect x="502" y="320" width="124" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="564" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">1. Втрата запиту</text>
  <text x="564" y="352" text-anchor="middle" font-size="12" fill="#6b7280">Дія не почалася</text>

  <!-- Вершина 2: Збій сервера -->
  <rect x="786" y="320" width="124" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="848" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">2. Збій сервера</text>
  <text x="848" y="352" text-anchor="middle" font-size="12" fill="#6b7280">Дія не завершена</text>

  <!-- Центральний блок: TIMEOUT -->
  <rect x="640" y="320" width="132" height="42" rx="4" fill="#1a1a1a" stroke="#c0392b" stroke-width="1.5"/>
  <text x="706" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">? TIMEOUT ?</text>
  <text x="706" y="352" text-anchor="middle" font-size="12" fill="#fdecea">Сліпа зона клієнта</text>

  <!-- Стрілки до центрального блоку -->
  <line x1="626" y1="341" x2="634" y2="341" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="786" y1="341" x2="778" y2="341" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Вершина 3: Втрата відповіді -->
  <rect x="550" y="378" width="312" height="44" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="706" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">3. Втрата відповіді: дію виконано на сервері!</text>
  <text x="706" y="411" text-anchor="middle" font-size="12" fill="#6b7280">Повтор без ідемпотентності створить дублікат</text>
  <line x1="706" y1="378" x2="706" y2="368" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Права картка 4: Паралелізм -->
  <rect x="492" y="450" width="426" height="78" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="504" y="466" font-size="12" font-weight="bold" fill="#c0392b">4. Паралелізм: відсутність єдиного часу</text>
  <text x="504" y="484" font-size="12" fill="#1a1a1a">• Незалежні фізичні вузли: годинниковий дрифт (Clock Drift)</text>
  <text x="504" y="501" font-size="12" fill="#1a1a1a">• Неможливо знати глобальний порядок без консенсусу</text>
  <text x="504" y="518" font-size="12" fill="#c0392b">• Непередбачувані затримки пакетів і загроза Split-Brain</text>
</svg>
