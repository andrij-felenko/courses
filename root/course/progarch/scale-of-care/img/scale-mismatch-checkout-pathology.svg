<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="24" y="70" width="912" height="38" fill="#eaf0fd" stroke="#2457d6" rx="6"/>
  <rect x="24" y="122" width="336" height="378" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <rect x="36" y="134" width="312" height="42" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="36" y="188" width="312" height="116" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <rect x="36" y="316" width="312" height="102" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="36" y="430" width="312" height="60" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <rect x="384" y="122" width="552" height="378" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <rect x="396" y="134" width="528" height="42" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <rect x="396" y="188" width="117" height="64" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <rect x="533" y="188" width="117" height="64" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <rect x="670" y="188" width="117" height="64" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <rect x="807" y="188" width="117" height="64" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <rect x="396" y="264" width="528" height="154" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <rect x="396" y="430" width="528" height="60" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <rect x="24" y="512" width="912" height="28" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <line x1="513" y1="220" x2="529" y2="220" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="650" y1="220" x2="666" y2="220" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="787" y1="220" x2="803" y2="220" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="372" y1="134" x2="372" y2="494" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="480" y="38" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Анатомія масштабового перекосу: оформлення замовлення</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Штучне розбиття локальної транзакції на мікросервіси породжує лавину випадкової складності</text>
  <text x="480" y="88" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="bold">Бізнес-сценарій: Checkout (Кошик ➔ Резерв товару ➔ Списання коштів ➔ Оформлення доставки)</text>
  <text x="480" y="102" font-size="12" fill="#1a1a1a" text-anchor="middle">Порівняння реалізації на природному масштабі (ACID) проти передчасного мережевого масштабу (саги):</text>
  <text x="192" y="151" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="bold">Природний масштаб: БД та ACID</text>
  <text x="192" y="167" font-size="12" fill="#1a1a1a" text-anchor="middle">Локальна транзакція в одному процесі</text>
  <text x="48" y="206" font-size="12" fill="#27ae60" font-weight="bold">Модульний моноліт (спільна пам'ять)</text>
  <text x="48" y="226" font-size="12" fill="#1a1a1a">• Виклики всередині процесу (~10–50 нс)</text>
  <text x="48" y="246" font-size="12" fill="#1a1a1a">• [Кошик] ➔ [Склад] ➔ [Оплата] ➔ [Доставка]</text>
  <text x="48" y="266" font-size="12" fill="#6b7280">• 0 мережевих сокетів, 0 серіалізації</text>
  <text x="48" y="286" font-size="12" fill="#6b7280">• Гарантія узгодженості типів компілятором</text>
  <text x="48" y="334" font-size="12" fill="#27ae60" font-weight="bold">Атомарність RDBMS (ACID)</text>
  <text x="48" y="354" font-size="12" fill="#1a1a1a">BEGIN TRANSACTION;</text>
  <text x="48" y="372" font-size="12" fill="#1a1a1a">  update_cart(); update_stock(); charge();</text>
  <text x="48" y="390" font-size="12" fill="#27ae60" font-weight="bold">COMMIT;  /* або миттєвий ROLLBACK */</text>
  <text x="48" y="408" font-size="12" fill="#6b7280">Усі таблиці оновлюються атомарно</text>
  <text x="48" y="448" font-size="12" fill="#27ae60" font-weight="bold">✓ Мережевий оверхед: 0 мс (пам'ять)</text>
  <text x="48" y="466" font-size="12" fill="#27ae60" font-weight="bold">✓ Частинні відмови: неможливі</text>
  <text x="48" y="482" font-size="12" fill="#1a1a1a">✓ Випадкова складність: нульова</text>
  <text x="660" y="151" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">Масштабовий перекіс: Мережеві мікросервіси та саги</text>
  <text x="660" y="167" font-size="12" fill="#1a1a1a" text-anchor="middle">Штучне подрібнення транзакції на розподілені вузли</text>
  <text x="454" y="206" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Кошик</text>
  <text x="454" y="224" font-size="12" fill="#6b7280" text-anchor="middle">Cart Service</text>
  <text x="454" y="242" font-size="12" fill="#2457d6" text-anchor="middle">[БД Кошика]</text>
  <text x="591" y="206" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Склад</text>
  <text x="591" y="224" font-size="12" fill="#6b7280" text-anchor="middle">Stock Service</text>
  <text x="591" y="242" font-size="12" fill="#2457d6" text-anchor="middle">[БД Складу]</text>
  <text x="728" y="206" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">Оплата ⚡</text>
  <text x="728" y="224" font-size="12" fill="#6b7280" text-anchor="middle">Payment Svc</text>
  <text x="728" y="242" font-size="12" fill="#c0392b" text-anchor="middle">[БД Оплати]</text>
  <text x="865" y="206" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Доставка</text>
  <text x="865" y="224" font-size="12" fill="#6b7280" text-anchor="middle">Delivery Svc</text>
  <text x="865" y="242" font-size="12" fill="#2457d6" text-anchor="middle">[БД Доставки]</text>
  <text x="408" y="282" font-size="12" fill="#c0392b" font-weight="bold">Оркестратор саги, брокер черг та компенсуючі транзакції</text>
  <text x="408" y="302" font-size="12" fill="#1a1a1a">1. Мережевий запит: OrderPlaced ➔ публікація події в брокер черг</text>
  <text x="408" y="320" font-size="12" fill="#1a1a1a">2. Склад резервує товар: StockReserved ➔ очікування підтвердження</text>
  <text x="408" y="340" font-size="12" fill="#c0392b" font-weight="bold">3. ⚡ ЗБІЙ ОПЛАТИ: мережевий таймаут або відмова банку (PaymentFailed)</text>
  <text x="408" y="360" font-size="12" fill="#c0392b">4. Компенсуюча транзакція: відправка команди скасування у Склад</text>
  <text x="408" y="380" font-size="12" fill="#6b7280">5. Зависання: якщо компенсація загубиться, товар лишається заблокованим</text>
  <text x="408" y="400" font-size="12" fill="#c0392b">6. Частинна відмова: гроші списано, але відповідь втрачено через розрив мережі</text>
  <text x="408" y="448" font-size="12" fill="#c0392b">⚠ Мережевий оверхед: 8–12 RPC викликів, серіалізація, джитер (50–300 мс)</text>
  <text x="408" y="466" font-size="12" fill="#c0392b" font-weight="bold">⚠ Неузгодженість даних: стан Eventual Consistency, фантомні замовлення</text>
  <text x="408" y="482" font-size="12" fill="#c0392b" font-weight="bold">⚠ Випадкова складність: саги, Outbox, ідемпотентність — створені штучно!</text>
  <text x="480" y="530" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Висновок: Локальну транзакцію винесено в мережевий масштаб — система потонула у випадковій складності</text>
</svg>
