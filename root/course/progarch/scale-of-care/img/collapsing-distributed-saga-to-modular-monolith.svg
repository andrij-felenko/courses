<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Згортання розподіленої саги в модульний моноліт</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Ліквідація масштабового перекосу: заміна мережевих швів і саг на виклики в пам'яті та єдину ACID-транзакцію</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: РОЗПОДІЛЕНА СИСТЕМА ================= -->
  <rect x="20" y="68" width="350" height="432" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Плашка заголовка лівої панелі -->
  <rect x="32" y="80" width="326" height="26" rx="4" fill="#c0392b"/>
  <text x="195" y="97" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">МЕРЕЖЕВИЙ КЛАСТЕР (OVER-SCOPING)</text>
  <text x="195" y="120" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Роздута сага: 4 сервіси, брокер і розрізнені БД</text>

  <!-- Сервіс Cart -->
  <rect x="35" y="134" width="145" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="107" y="156" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Сервіс Cart</text>
  <text x="107" y="175" font-size="12" fill="#c0392b" text-anchor="middle">HTTP · своя Cart DB</text>

  <!-- Сервіс Order -->
  <rect x="210" y="134" width="145" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="282" y="156" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Сервіс Order</text>
  <text x="282" y="175" font-size="12" fill="#c0392b" text-anchor="middle">gRPC · своя Order DB</text>

  <!-- Зв'язок Cart -> Order -->
  <line x1="180" y1="161" x2="208" y2="161" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Оркестратор саги + Брокер повідомлень -->
  <rect x="35" y="204" width="320" height="58" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="195" y="226" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Оркестратор саги + Брокер (Kafka)</text>
  <text x="195" y="247" font-size="12" fill="#6b7280" text-anchor="middle">Асинхронні черги · сага з компенсаціями</text>

  <!-- Зв'язки до Оркестратора -->
  <line x1="107" y1="188" x2="107" y2="202" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="282" y1="188" x2="282" y2="202" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Сервіс Payment -->
  <rect x="35" y="278" width="145" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="107" y="300" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Сервіс Payment</text>
  <text x="107" y="319" font-size="12" fill="#c0392b" text-anchor="middle">gRPC · своя Pay DB</text>

  <!-- Сервіс Inventory -->
  <rect x="210" y="278" width="145" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="282" y="300" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Сервіс Inventory</text>
  <text x="282" y="319" font-size="12" fill="#c0392b" text-anchor="middle">gRPC · своя Inv DB</text>

  <!-- Зв'язки від Оркестратора -->
  <line x1="107" y1="262" x2="107" y2="276" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="282" y1="262" x2="282" y2="276" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- 4 розрізнені бази даних -->
  <rect x="35" y="346" width="320" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="195" y="366" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">4 розрізнені бази даних (Database-per-Service)</text>
  <text x="195" y="385" font-size="12" fill="#6b7280" text-anchor="middle">Відсутність ACID: відкат лише через компенсації</text>

  <!-- Зв'язки до плашки баз даних -->
  <line x1="107" y1="332" x2="107" y2="344" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="282" y1="332" x2="282" y2="344" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Підсумок лівої панелі -->
  <rect x="35" y="412" width="320" height="74" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="47" y="429" font-size="12" font-weight="700" fill="#c0392b">Вади розподіленої саги (over-scoping):</text>
  <text x="47" y="447" font-size="12" fill="#1a1a1a">• Часткові відмови та мережеві таймаути</text>
  <text x="47" y="463" font-size="12" fill="#1a1a1a">• Крихкі компенсації замість атомарності</text>
  <text x="47" y="479" font-size="12" font-weight="700" fill="#c0392b">• Затримка P99 ≈ 600 мс (податок мережі)</text>

  <!-- ================= СЕРЕДНЯ КОЛОНКА: ПРОТОКОЛ ЗГОРТАННЯ ================= -->
  <!-- Плашка заголовка середньої колонки -->
  <rect x="398" y="80" width="164" height="26" rx="4" fill="#2457d6"/>
  <text x="480" y="97" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ПРОТОКОЛ ЗГОРТАННЯ</text>
  <text x="480" y="120" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">4 кроки повернення меж</text>

  <!-- Крок 1: Консолідація -->
  <rect x="398" y="134" width="164" height="54" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="480" y="155" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">1. КОНСОЛІДАЦІЯ</text>
  <text x="480" y="174" font-size="12" fill="#1a1a1a" text-anchor="middle">злиття в 1 процес ОС</text>
  <line x1="370" y1="161" x2="396" y2="161" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="562" y1="161" x2="588" y2="161" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Крок 2: Події та брокер -->
  <rect x="398" y="204" width="164" height="58" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="480" y="226" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">2. ПОДІЇ ТА БРОКЕР</text>
  <text x="480" y="247" font-size="12" fill="#1a1a1a" text-anchor="middle">Kafka → in-memory bus</text>
  <line x1="370" y1="233" x2="396" y2="233" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="562" y1="233" x2="588" y2="233" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Крок 3: Мережеві шви -->
  <rect x="398" y="278" width="164" height="54" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="480" y="299" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">3. МЕРЕЖЕВІ ШВИ</text>
  <text x="480" y="318" font-size="12" fill="#1a1a1a" text-anchor="middle">gRPC → пам'ять (RAM)</text>
  <line x1="370" y1="305" x2="396" y2="305" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="562" y1="305" x2="588" y2="305" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Крок 4: Атомарність -->
  <rect x="398" y="346" width="164" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="480" y="367" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">4. АТОМАРНІСТЬ</text>
  <text x="480" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">сага → ACID-транзакція</text>
  <line x1="370" y1="372" x2="396" y2="372" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="562" y1="372" x2="588" y2="372" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Підсумок рефакторингу -->
  <rect x="398" y="412" width="164" height="74" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="480" y="431" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">РЕЗУЛЬТАТ</text>
  <text x="480" y="451" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">P99: 600 → 6 мс</text>
  <text x="480" y="471" font-size="12" fill="#6b7280" text-anchor="middle">Код: −80% рядків</text>

  <!-- ================= ПРАВА ПАНЕЛЬ: МОДУЛЬНИЙ МОНОЛІТ ================= -->
  <rect x="590" y="68" width="350" height="432" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Плашка заголовка правої панелі -->
  <rect x="602" y="80" width="326" height="26" rx="4" fill="#27ae60"/>
  <text x="765" y="97" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">МОДУЛЬНИЙ МОНОЛІТ (LEAST SCOPE)</text>
  <text x="765" y="120" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Єдиний процес ОС + спільна ACID-транзакція</text>

  <!-- Контейнер: Адресний простір процесу -->
  <rect x="605" y="130" width="320" height="202" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="615" y="136" width="190" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="710" y="150" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Адресний простір процесу</text>

  <!-- Модуль Cart -->
  <rect x="615" y="162" width="142" height="44" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/>
  <text x="686" y="181" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Модуль Cart</text>
  <text x="686" y="198" font-size="12" fill="#6b7280" text-anchor="middle">пакет internal/cart</text>

  <!-- Модуль Order -->
  <rect x="773" y="162" width="142" height="44" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/>
  <text x="844" y="181" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Модуль Order</text>
  <text x="844" y="198" font-size="12" fill="#6b7280" text-anchor="middle">пакет internal/order</text>

  <!-- Зв'язок Cart -> Order -->
  <line x1="757" y1="184" x2="771" y2="184" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- In-Memory Event Bus -->
  <rect x="615" y="218" width="300" height="46" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="765" y="237" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">In-Memory Event Bus (шина подій у RAM)</text>
  <text x="765" y="255" font-size="12" fill="#6b7280" text-anchor="middle">типізовані події в RAM замість черг Kafka</text>

  <!-- Зв'язок Order -> Event Bus -->
  <line x1="844" y1="206" x2="844" y2="216" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Модуль Payment -->
  <rect x="615" y="276" width="142" height="46" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/>
  <text x="686" y="295" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Модуль Payment</text>
  <text x="686" y="313" font-size="12" fill="#6b7280" text-anchor="middle">типізований виклик</text>

  <!-- Модуль Inventory -->
  <rect x="773" y="276" width="142" height="46" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/>
  <text x="844" y="295" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Модуль Inventory</text>
  <text x="844" y="313" font-size="12" fill="#6b7280" text-anchor="middle">типізований виклик</text>

  <!-- Зв'язки від Event Bus до Payment та Inventory -->
  <line x1="686" y1="264" x2="686" y2="274" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="844" y1="264" x2="844" y2="274" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Зв'язок Процес -> База даних -->
  <line x1="765" y1="332" x2="765" y2="344" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- Єдина реляційна база даних (ACID) -->
  <rect x="605" y="346" width="320" height="52" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="765" y="366" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Єдина база даних (PostgreSQL) · ACID</text>
  <text x="765" y="385" font-size="12" fill="#1a1a1a" text-anchor="middle">BEGIN ... COMMIT · спільний атомарний ROLLBACK</text>

  <!-- Підсумок правої панелі -->
  <rect x="605" y="412" width="320" height="74" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="617" y="429" font-size="12" font-weight="700" fill="#27ae60">Переваги згортання в моноліт (least scope):</text>
  <text x="617" y="447" font-size="12" fill="#1a1a1a">• Гарантія миттєвої ACID-узгодженості в СУБД</text>
  <text x="617" y="463" font-size="12" fill="#1a1a1a">• Жодних мережевих таймаутів і часткових збоїв</text>
  <text x="617" y="479" font-size="12" font-weight="700" fill="#27ae60">• Латентність P99 ≈ 6 мс (падіння затримки на 99%)</text>
</svg>
