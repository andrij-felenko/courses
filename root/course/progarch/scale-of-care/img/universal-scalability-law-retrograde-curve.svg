<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Тло -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Універсальний закон масштабованості Ґюнтера (USL)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Квадратичний штраф за узгодженість κ обвалює швидкість кластера після критичного піку N*</text>

  <!-- Панель графіка -->
  <rect x="24" y="74" width="576" height="366" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Зона колапсу (тло) -->
  <path d="M 258.8,74 L 576,74 L 576,385.0 L 258.8,385.0 Z" fill="#fdecea" opacity="0.45"/>
  <!-- Зона зростання (тло) -->
  <path d="M 24,74 L 258.8,74 L 258.8,385.0 L 24,385.0 Z" fill="#e9f7ef" opacity="0.35"/>

  <!-- Заголовки зон -->
  <text x="175" y="94" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зона зростання</text>
  <text x="415" y="94" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона ретроградного колапсу</text>

  <!-- Горизонтальна сітка та позначки осі Y -->
  <line x1="90.0" y1="333.0" x2="564" y2="333.0" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="82.0" y="337.0" font-size="12" fill="#6b7280" text-anchor="end">5</text>
  <line x1="90.0" y1="281.0" x2="564" y2="281.0" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="82.0" y="285.0" font-size="12" fill="#6b7280" text-anchor="end">10</text>
  <line x1="90.0" y1="229.0" x2="564" y2="229.0" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="82.0" y="233.0" font-size="12" fill="#6b7280" text-anchor="end">15</text>
  <line x1="90.0" y1="177.0" x2="564" y2="177.0" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="82.0" y="181.0" font-size="12" fill="#6b7280" text-anchor="end">20</text>
  <line x1="90.0" y1="125.0" x2="564" y2="125.0" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="82.0" y="129.0" font-size="12" fill="#6b7280" text-anchor="end">25</text>

  <!-- Засічки осі X -->
  <line x1="166.7" y1="385.0" x2="166.7" y2="390.0" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="166.7" y="403.0" font-size="12" fill="#6b7280" text-anchor="middle">20</text>
  <line x1="396.7" y1="385.0" x2="396.7" y2="390.0" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="396.7" y="403.0" font-size="12" fill="#6b7280" text-anchor="middle">80</text>
  <line x1="550.0" y1="385.0" x2="550.0" y2="390.0" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="550.0" y="403.0" font-size="12" fill="#6b7280" text-anchor="middle">120</text>

  <!-- Осі координат -->
  <line x1="90.0" y1="385.0" x2="570" y2="385.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="90.0" y1="385.0" x2="90.0" y2="102" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="82.0" y="389.0" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="82.0" y="94" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C(N)</text>
  <text x="568" y="422" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">N (вузли кластера)</text>

  <!-- Напрямні піку N* -->
  <line x1="258.8" y1="243.6" x2="258.8" y2="385.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="90.0" y1="243.6" x2="258.8" y2="243.6" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="258.8" y="403.0" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">N* ≈ 44</text>
  <text x="82.0" y="247.6" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">13.6</text>

  <!-- 1. Лінійне масштабування -->
  <line x1="90.0" y1="385.0" x2="185.8" y2="125.0" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="100" y="148" font-size="12" font-weight="bold" fill="#6b7280">C(N) = N</text>
  <text x="100" y="164" font-size="12" fill="#6b7280">(ідеал)</text>

  <!-- 2. Закон Амдала -->
  <polyline points="90.0,385.0 93.8,374.6 97.7,364.8 101.5,355.6 105.3,346.8 109.2,338.6 113.0,330.7 116.8,323.3 120.7,316.2 124.5,309.5 128.3,303.1 132.2,297.0 136.0,291.2 139.8,285.6 143.7,280.3 147.5,275.1 151.3,270.2 155.2,265.5 159.0,261.0 162.8,256.7 166.7,252.5 170.5,248.5 174.3,244.6 178.2,240.9 182.0,237.3 185.8,233.8 189.7,230.5 193.5,227.2 197.3,224.1 201.2,221.1 205.0,218.2 208.8,215.3 212.7,212.6 216.5,209.9 220.3,207.3 224.2,204.8 228.0,202.4 231.8,200.0 235.7,197.7 239.5,195.5 243.3,193.3 247.2,191.2 251.0,189.1 254.8,187.1 258.7,185.2 262.5,183.3 266.3,181.4 270.2,179.6 274.0,177.9 277.8,176.1 281.7,174.5 285.5,172.8 289.3,171.2 293.2,169.7 297.0,168.2 300.8,166.7 304.7,165.2 308.5,163.8 312.3,162.4 316.2,161.1 320.0,159.7 323.8,158.4 327.7,157.2 331.5,155.9 335.3,154.7 339.2,153.5 343.0,152.3 346.8,151.2 350.7,150.0 354.5,148.9 358.3,147.9 362.2,146.8 366.0,145.8 369.8,144.7 373.7,143.7 377.5,142.8 381.3,141.8 385.2,140.9 389.0,139.9 392.8,139.0 396.7,138.1 400.5,137.2 404.3,136.4 408.2,135.5 412.0,134.7 415.8,133.9 419.7,133.1 423.5,132.3 427.3,131.5 431.2,130.7 435.0,130.0 438.8,129.2 442.7,128.5 446.5,127.8 450.3,127.1 454.2,126.4 458.0,125.7 461.8,125.0 465.7,124.3 469.5,123.7 473.3,123.0 477.2,122.4 481.0,121.8 484.8,121.2 488.7,120.6 492.5,120.0 496.3,119.4 500.2,118.8 504.0,118.2 507.8,117.6 511.7,117.1 515.5,116.5 519.3,116.0 523.2,115.5 527.0,114.9 530.8,114.4 534.7,113.9 538.5,113.4 542.3,112.9 546.2,112.4 550.0,111.9" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="385" y="196" font-size="12" font-weight="bold" fill="#2457d6">Закон Амдала (κ = 0)</text>
  <text x="385" y="212" font-size="12" fill="#2457d6">насичення 1/σ ≈ 33.3</text>

  <!-- 3. Закон Ґюнтера USL -->
  <polyline points="90.0,385.0 93.8,374.6 97.7,364.8 101.5,355.6 105.3,347.0 109.2,339.0 113.0,331.4 116.8,324.4 120.7,317.8 124.5,311.6 128.3,305.9 132.2,300.6 136.0,295.6 139.8,291.0 143.7,286.7 147.5,282.7 151.3,279.0 155.2,275.6 159.0,272.4 162.8,269.5 166.7,266.8 170.5,264.3 174.3,262.1 178.2,260.0 182.0,258.0 185.8,256.3 189.7,254.7 193.5,253.2 197.3,251.9 201.2,250.7 205.0,249.6 208.8,248.7 212.7,247.8 216.5,247.1 220.3,246.4 224.2,245.8 228.0,245.3 231.8,244.9 235.7,244.5 239.5,244.2 243.3,244.0 247.2,243.8 251.0,243.7 254.8,243.6 258.7,243.6 262.5,243.6 266.3,243.7 270.2,243.8 274.0,243.9 277.8,244.1 281.7,244.3 285.5,244.5 289.3,244.8 293.2,245.0 297.0,245.3 300.8,245.7 304.7,246.0 308.5,246.4 312.3,246.7 316.2,247.1 320.0,247.6 323.8,248.0 327.7,248.4 331.5,248.9 335.3,249.3 339.2,249.8 343.0,250.3 346.8,250.8 350.7,251.3 354.5,251.8 358.3,252.3 362.2,252.8 366.0,253.3 369.8,253.8 373.7,254.4 377.5,254.9 381.3,255.4 385.2,256.0 389.0,256.5 392.8,257.0 396.7,257.6 400.5,258.1 404.3,258.7 408.2,259.2 412.0,259.8 415.8,260.3 419.7,260.9 423.5,261.4 427.3,262.0 431.2,262.5 435.0,263.0 438.8,263.6 442.7,264.1 446.5,264.7 450.3,265.2 454.2,265.7 458.0,266.3 461.8,266.8 465.7,267.4 469.5,267.9 473.3,268.4 477.2,268.9 481.0,269.5 484.8,270.0 488.7,270.5 492.5,271.0 496.3,271.5 500.2,272.0 504.0,272.5 507.8,273.1 511.7,273.6 515.5,274.1 519.3,274.6 523.2,275.0 527.0,275.5 530.8,276.0 534.7,276.5 538.5,277.0 542.3,277.5 546.2,278.0 550.0,278.4" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="258.8" cy="243.6" r="5" fill="#c0392b"/>
  <text x="268" y="204" font-size="12" font-weight="bold" fill="#c0392b">Пік USL: N* ≈ 44</text>
  <text x="268" y="220" font-size="12" fill="#c0392b">C_max ≈ 13.6</text>

  <!-- Підписи зони колапсу -->
  <text x="415" y="298" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона ретроградного колапсу (N &gt; N*)</text>
  <text x="415" y="316" font-size="12" fill="#c0392b" text-anchor="middle">Квадратичний штраф: κ · N · (N - 1)</text>

  <text x="415" y="352" font-size="12" fill="#6b7280" text-anchor="middle">Координація та інвалідації кешів</text>
  <text x="415" y="368" font-size="12" fill="#6b7280" text-anchor="middle">спалюють більше часу, ніж дають нові вузли</text>

  <!-- Картка 1: Лінійний ідеал -->
  <rect x="618" y="74" width="318" height="88" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="632" y="96" font-size="13" font-weight="bold" fill="#6b7280">1. Лінійне масштабування (ідеал)</text>
  <text x="632" y="116" font-size="12" font-weight="bold" fill="#1a1a1a">C(N) = N  (σ = 0, κ = 0)</text>
  <text x="632" y="134" font-size="12" fill="#6b7280">• Нульові черги та нульова координація</text>
  <text x="632" y="150" font-size="12" fill="#6b7280">• Теоретичний недосяжний орієнтир</text>

  <!-- Картка 2: Закон Амдала -->
  <rect x="618" y="176" width="318" height="106" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="632" y="198" font-size="13" font-weight="bold" fill="#2457d6">2. Закон Амдала (насичення)</text>
  <text x="632" y="218" font-size="12" font-weight="bold" fill="#1a1a1a">C(N) = N / [1 + σ · (N - 1)]</text>
  <text x="632" y="238" font-size="12" fill="#1a1a1a">• Лінійний штраф черг σ (конкуренція)</text>
  <text x="632" y="254" font-size="12" fill="#6b7280">• Насичення: C(N) → 1/σ при N → ∞</text>
  <text x="632" y="270" font-size="12" fill="#6b7280">• Швидкість не падає, але зростання згасає</text>

  <!-- Картка 3: Закон Ґюнтера USL -->
  <rect x="618" y="296" width="318" height="144" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="632" y="318" font-size="13" font-weight="bold" fill="#c0392b">3. Закон Ґюнтера USL (колапс)</text>
  <text x="632" y="338" font-size="12" font-weight="bold" fill="#c0392b">C(N) = N / [1 + σ(N-1) + κ·N(N-1)]</text>
  <text x="632" y="358" font-size="12" font-weight="bold" fill="#c0392b">• Точка піку: N* = √((1 - σ) / κ) ≈ 44</text>
  <text x="632" y="376" font-size="12" fill="#1a1a1a">• Квадратичний штраф узгодженості κ</text>
  <text x="632" y="394" font-size="12" fill="#6b7280">• При N &gt; N*: накладні витрати зв'язку</text>
  <text x="632" y="412" font-size="12" fill="#6b7280">  перевищують корисну потужність вузлів</text>
  <text x="632" y="430" font-size="12" font-weight="bold" fill="#c0392b">➔ Ретроградний колапс: спад швидкості!</text>
</svg>
