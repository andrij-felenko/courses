<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Масштаб турботи: Programming-in-the-Small проти Programming-in-the-Large</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">ДеРемер і Крон (1975): структура модулів і граф зв'язків є окремою дисципліною від алгоритмів</text>

  <!-- LEFT PANEL: Programming-in-the-Small -->
  <rect x="25" y="75" width="445" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">Programming-in-the-Small</text>
  <rect x="310" y="88" width="145" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="382" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Локальний масштаб</text>

  <!-- Left: Code / Algorithm Box -->
  <rect x="45" y="125" width="405" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="60" y="137" width="160" height="22" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="140" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Тіло окремої функції</text>

  <text x="60" y="180" font-size="12" fill="#1a1a1a">function quickSort(arr, low, high) {</text>
  <text x="75" y="200" font-size="12" fill="#2457d6">  let pivot = arr[high]; // вибір опорного елемента</text>
  <text x="75" y="220" font-size="12" fill="#1a1a1a">  while (i &lt;= j) { swap(arr, i, j); }</text>
  <text x="75" y="240" font-size="12" fill="#6b7280">  return partitionIdx; // інваріант циклу</text>
  <text x="60" y="260" font-size="12" fill="#1a1a1a">}</text>

  <!-- Left: Characteristics Box -->
  <rect x="45" y="290" width="405" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="312" font-size="12" font-weight="bold" fill="#2457d6">Об'єкт уваги:</text>
  <text x="155" y="312" font-size="12" fill="#1a1a1a">алгоритми, структури даних, змінні, цикли</text>
  <text x="60" y="334" font-size="12" font-weight="bold" fill="#2457d6">Інструмент:</text>
  <text x="155" y="334" font-size="12" fill="#1a1a1a">алгоритмічні мови (C, Pascal, Go, Java)</text>
  <text x="60" y="356" font-size="12" font-weight="bold" fill="#2457d6">Будівельний блок:</text>
  <text x="185" y="356" font-size="12" fill="#1a1a1a">вираз, оператор, локальний тип даних</text>

  <!-- Left: Bottom Takeaway Box -->
  <rect x="45" y="390" width="405" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="412" font-size="12" font-weight="bold" fill="#1a1a1a">Межі мікромасштабу:</text>
  <text x="60" y="432" font-size="12" fill="#6b7280">Вирішує «як обчислити результат у пам'яті».</text>
  <text x="60" y="448" font-size="12" fill="#6b7280">Не бачить архітектури системи поза тілом окремого модуля.</text>

  <!-- RIGHT PANEL: Programming-in-the-Large -->
  <rect x="490" y="75" width="445" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">Programming-in-the-Large</text>
  <rect x="765" y="88" width="155" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="842" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Системний масштаб</text>

  <!-- Right: Architecture / Module Graph Box -->
  <rect x="510" y="125" width="405" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Module A -->
  <rect x="525" y="142" width="165" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="607" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Module: OrderEngine</text>
  <text x="607" y="180" text-anchor="middle" font-size="12" fill="#6b7280">PROVIDES: ProcessOrder</text>

  <!-- Module B -->
  <rect x="735" y="142" width="165" height="52" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="817" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Module: PaymentGate</text>
  <text x="817" y="180" text-anchor="middle" font-size="12" fill="#6b7280">REQUIRES: TokenAuth</text>

  <!-- Arrow A -> B -->
  <line x1="690" y1="168" x2="727" y2="168" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Module C -->
  <rect x="630" y="215" width="165" height="50" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Module: AuditLog</text>
  <text x="712" y="252" text-anchor="middle" font-size="12" fill="#6b7280">EXPORTS: LogEvent</text>

  <!-- Arrows A -> C and B -> C -->
  <line x1="607" y1="194" x2="648" y2="212" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="817" y1="194" x2="776" y2="212" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Right: Characteristics Box -->
  <rect x="510" y="290" width="405" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="525" y="312" font-size="12" font-weight="bold" fill="#27ae60">Об'єкт уваги:</text>
  <text x="620" y="312" font-size="12" fill="#1a1a1a">модулі, контракти, експорт/імпорт, межі</text>
  <text x="525" y="334" font-size="12" font-weight="bold" fill="#27ae60">Інструмент:</text>
  <text x="620" y="334" font-size="12" fill="#1a1a1a">мови опису модулів (MIL), маніфести, лінкери</text>
  <text x="525" y="356" font-size="12" font-weight="bold" fill="#27ae60">Будівельний блок:</text>
  <text x="650" y="356" font-size="12" fill="#1a1a1a">модуль, підсистема, архітектурне ребро</text>

  <!-- Right: Bottom Takeaway Box -->
  <rect x="510" y="390" width="405" height="70" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="412" font-size="12" font-weight="bold" fill="#27ae60">Сутність архітектури:</text>
  <text x="525" y="432" font-size="12" fill="#1a1a1a">Вирішує «як модулі з'єднані та хто від кого залежить».</text>
  <text x="525" y="448" font-size="12" fill="#27ae60">Синтез системи з модулів без вивчення їхнього коду.</text>
</svg>
