<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="490" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектурний перекос масштабу: розподілений Checkout та його ціна</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Передчасне дроблення транзакції на 4 мікросервіси породжує саги, частинні відмови та ріст P99</text>

  <!-- ЛІВА ПАНЕЛЬ: РОЗПОДІЛЕНИЙ ПОТІК CHECKOUT -->
  <rect x="28" y="78" width="580" height="392" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="318" y="103" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподілений потік оформлення замовлення (Distributed Saga)</text>
  <text x="318" y="121" font-size="12" fill="#6b7280" text-anchor="middle">Ланцюжок синхронних RPC та асинхронна черга компенсацій</text>

  <!-- 1. Оркестратор замовлень -->
  <rect x="42" y="138" width="160" height="190" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="122" y="162" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Order Service</text>
  <text x="122" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">Сага-оркестратор</text>
  <text x="122" y="210" font-size="12" fill="#6b7280" text-anchor="middle">• Крок 1: Перевірка</text>
  <text x="122" y="228" font-size="12" fill="#6b7280" text-anchor="middle">• Крок 2: Резерв</text>
  <text x="122" y="246" font-size="12" fill="#6b7280" text-anchor="middle">• Крок 3: Платіж</text>
  <text x="122" y="280" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Керування станом</text>
  <text x="122" y="300" font-size="12" fill="#c0392b" text-anchor="middle">компенсацій</text>

  <!-- Стрілки RPC від Order Service -->
  <!-- До Cart Service -->
  <line x1="202" y1="165" x2="252" y2="165" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- До Inventory Service -->
  <line x1="202" y1="233" x2="252" y2="233" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- До Payment Service -->
  <line x1="202" y1="301" x2="252" y2="301" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 2. Cart Service -->
  <rect x="254" y="138" width="160" height="54" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="334" y="160" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cart Service</text>
  <text x="334" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Валідація вмісту кошика</text>

  <!-- Бейдж затримки Cart -->
  <rect x="428" y="138" width="166" height="54" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="511" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RPC 1: ~35 мс</text>
  <text x="511" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Мережевий оверхед gRPC</text>

  <!-- 3. Inventory Service -->
  <rect x="254" y="206" width="160" height="54" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="334" y="228" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Inventory Service</text>
  <text x="334" y="246" font-size="12" fill="#6b7280" text-anchor="middle">Резервування залишків</text>

  <!-- Бейдж затримки/ризику Inventory -->
  <rect x="428" y="206" width="166" height="54" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="511" y="228" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RPC 2: ~50 мс</text>
  <text x="511" y="246" font-size="12" fill="#1a1a1a" text-anchor="middle">Розподілений лок товару</text>

  <!-- 4. Payment Service -->
  <rect x="254" y="274" width="160" height="54" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="334" y="296" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Payment Service</text>
  <text x="334" y="314" font-size="12" fill="#c0392b" text-anchor="middle">Списання коштів клієнта</text>

  <!-- Бейдж відмови Payment -->
  <rect x="428" y="274" width="166" height="54" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="511" y="295" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Точка збою: ~180 мс</text>
  <text x="511" y="313" font-size="12" fill="#c0392b" text-anchor="middle">Таймаут або збій банку</text>

  <!-- Стрілка компенсації вниз до черги -->
  <path d="M 334,328 L 334,342" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Черга подій та компенсувальна сага -->
  <rect x="42" y="344" width="552" height="66" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="318" y="365" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Асинхронна черга компенсацій (Compensating Saga Events)</text>
  <text x="318" y="384" font-size="12" fill="#1a1a1a" text-anchor="middle">PaymentFailedEvent -&gt; скасування резерву товару (ReleaseStock)</text>
  <text x="318" y="401" font-size="12" fill="#6b7280" text-anchor="middle">Ризик: підвислий резерв товару при втраті повідомлення у брокері</text>

  <!-- Підсумок затримок внизу панелі -->
  <rect x="42" y="422" width="552" height="36" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="318" y="444" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Сумарна затримка P99: ~350–600 мс (замість &lt; 5 мс у локальній транзакції)</text>


  <!-- ПРАВА ПАНЕЛЬ: АНАЛІЗ ПЕРЕКОСУ МАСШТАБУ -->
  <rect x="626" y="78" width="306" height="392" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="779" y="103" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Симптоми перекосу масштабу</text>
  <text x="779" y="121" font-size="12" fill="#6b7280" text-anchor="middle">Чому розбиття транзакції шкодить</text>

  <!-- Картка 1: Накопичення затримок -->
  <rect x="638" y="136" width="282" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="779" y="156" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Накопичення затримок (P99 Spike)</text>
  <text x="779" y="175" font-size="12" fill="#1a1a1a" text-anchor="middle">• 3 послідовні мережеві RPC-виклики</text>
  <text x="779" y="193" font-size="12" fill="#6b7280" text-anchor="middle">• Затримка зростає у 50–100 разів</text>

  <!-- Картка 2: Частинні відмови -->
  <rect x="638" y="218" width="282" height="70" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="779" y="238" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Частинні відмови (Partial Failures)</text>
  <text x="779" y="257" font-size="12" fill="#1a1a1a" text-anchor="middle">• Збій платежу лишає склад у резерві</text>
  <text x="779" y="275" font-size="12" fill="#c0392b" text-anchor="middle">• Необхідність складних компенсувань</text>

  <!-- Картка 3: Оверхед коду Саги -->
  <rect x="638" y="300" width="282" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="779" y="320" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Складність коду (Accidental Complexity)</text>
  <text x="779" y="339" font-size="12" fill="#1a1a1a" text-anchor="middle">• Ідемпотентність, дедуплікація, ретраї</text>
  <text x="779" y="357" font-size="12" fill="#6b7280" text-anchor="middle">• 70% коду — захист від збоїв мережі</text>

  <!-- Картка 4: Ліки: згортання в моноліт -->
  <rect x="638" y="382" width="282" height="74" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="779" y="402" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Ліки: згортання в модульний моноліт</text>
  <text x="779" y="421" font-size="12" fill="#1a1a1a" text-anchor="middle">• Єдина ACID-транзакція в одній БД</text>
  <text x="779" y="440" font-size="12" fill="#27ae60" text-anchor="middle">• Нульовий мережевий I/O, P99 &lt; 5 мс</text>
</svg>
