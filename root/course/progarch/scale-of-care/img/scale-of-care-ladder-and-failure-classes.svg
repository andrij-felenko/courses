  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Кожен вихід на вищий ступінь незворотно додає новий клас фізичних відмов, не скасовуючи попередніх</text>

  <!-- Column 1: Модуль / Код -->
