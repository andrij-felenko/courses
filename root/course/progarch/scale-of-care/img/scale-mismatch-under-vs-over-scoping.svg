<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Два вектори масштабового перекосу: недорозмірний vs перерозмірний масштаб</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Порушення меж масштабу однаково руйнівне: ігнорування мережі веде до збоїв, передчасний розподіл плодить випадкову складність</text>

  <!-- ЛІВА КОЛОНКА: Недорозмірний масштаб -->
  <rect x="24" y="70" width="444" height="376" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="38" y="82" width="220" height="22" rx="4" fill="#c0392b"/>
  <text x="148" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">НЕДОРОЗМІРНИЙ МАСШТАБ</text>
  <text x="268" y="98" font-size="12" font-weight="700" fill="#c0392b">Under-scoping</text>
  <text x="38" y="118" font-size="12" fill="#6b7280">Витік локальних припущень у мережу (блокування та каскад)</text>

  <!-- Картка 1.1: Схема приховування мережі -->
  <rect x="38" y="128" width="416" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="50" y="146" font-size="12" font-weight="700" fill="#1a1a1a">1. Архітектурна омана: «прозорий» мережевий виклик</text>

  <rect x="50" y="156" width="108" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="104" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Потік процесу</text>
  <text x="104" y="184" text-anchor="middle" font-size="12" fill="#6b7280">turn_off()</text>

  <line x1="158" y1="173" x2="186" y2="173" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="188" y="156" width="128" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="252" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Сокет без ліміту</text>
  <text x="252" y="184" text-anchor="middle" font-size="12" fill="#c0392b">socket.read() [HANG]</text>

  <line x1="316" y1="173" x2="336" y2="173" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>

  <rect x="338" y="156" width="104" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="390" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">Вузол реле</text>
  <text x="390" y="184" text-anchor="middle" font-size="12" fill="#c0392b">збій Wi-Fi</text>

  <text x="50" y="208" font-size="12" fill="#6b7280">• Ігнорування прірв Волдо: синхронний сокет тримає системний потік</text>

  <!-- Картка 1.2: Механізм краху -->
  <rect x="38" y="232" width="416" height="102" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="50" y="250" font-size="12" font-weight="700" fill="#c0392b">2. Фізичний механізм: голодування пулу потоків</text>

  <rect x="50" y="258" width="392" height="24" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="246" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Пул потоків: 200/200 зависли ➔ 0 вільних воркерів</text>

  <text x="50" y="298" font-size="12" fill="#1a1a1a">• Завислі сокети вичерпують таблицю дескрипторів ядра ОС</text>
  <text x="50" y="316" font-size="12" font-weight="700" fill="#c0392b">• Відсутні межі: Socket Timeout, Bulkhead, Circuit Breaker</text>

  <!-- Картка 1.3: Катастрофа -->
  <rect x="38" y="346" width="416" height="92" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="50" y="356" width="164" height="20" rx="3" fill="#c0392b"/>
  <text x="132" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">КАТАСТРОФА ВІДМОВИ</text>
  <text x="224" y="371" font-size="12" font-weight="700" fill="#c0392b">Каскадний колапс системи</text>
  <text x="50" y="394" font-size="12" fill="#1a1a1a">• Легкі локальні виклики (/health, сенсори) блокуються (503)</text>
  <text x="50" y="412" font-size="12" font-weight="700" fill="#c0392b">• Аварійне вимкнення не пройшло ➔ фізичний перегрів приміщення</text>
  <text x="50" y="430" font-size="12" font-weight="700" fill="#c0392b">Підсумок: вичерпання пулу потоків, каскадний колапс вузла</text>

  <!-- ПРАВА КОЛОНКА: Перерозмірний масштаб -->
  <rect x="492" y="70" width="444" height="376" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="506" y="82" width="220" height="22" rx="4" fill="#c0392b"/>
  <text x="616" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ПЕРЕРОЗМІРНИЙ МАСШТАБ</text>
  <text x="736" y="98" font-size="12" font-weight="700" fill="#c0392b">Over-scoping</text>
  <text x="506" y="118" font-size="12" fill="#6b7280">Передчасний поділ локальної задачі (вибух складності)</text>

  <!-- Картка 2.1: Схема передчасного розподілу -->
  <rect x="506" y="128" width="416" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="518" y="146" font-size="12" font-weight="700" fill="#1a1a1a">1. Архітектурна омана: поділ тривіальної задачі на сервіси</text>

  <rect x="518" y="156" width="74" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="555" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">UI-сервіс</text>
  <text x="555" y="184" text-anchor="middle" font-size="12" fill="#6b7280">клік кнопки</text>

  <line x1="592" y1="173" x2="610" y2="173" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="612" y="156" width="88" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="656" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Kafka / черга</text>
  <text x="656" y="184" text-anchor="middle" font-size="12" fill="#6b7280">брокер подій</text>

  <line x1="700" y1="173" x2="718" y2="173" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="720" y="156" width="96" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="768" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Saga Coord</text>
  <text x="768" y="184" text-anchor="middle" font-size="12" fill="#c0392b">сага стану</text>

  <line x1="816" y1="173" x2="834" y2="173" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="836" y="156" width="74" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="873" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Relay Svc</text>
  <text x="873" y="184" text-anchor="middle" font-size="12" fill="#6b7280">окрема БД</text>

  <text x="518" y="208" font-size="12" fill="#6b7280">• Замість одного процесу — 4 мережеві стрибки та серіалізація JSON</text>

  <!-- Картка 2.2: Механізм краху -->
  <rect x="506" y="232" width="416" height="102" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="518" y="250" font-size="12" font-weight="700" fill="#c0392b">2. Фізичний механізм: податок координації та затримок</text>

  <rect x="518" y="258" width="392" height="24" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="714" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Затримка &gt; 500 мс | Втрата ACID ➔ компенсувальні саги</text>

  <text x="518" y="298" font-size="12" fill="#1a1a1a">• Конкурентні натискання плутають порядок повідомлень у чергах</text>
  <text x="518" y="316" font-size="12" font-weight="700" fill="#c0392b">• Квадратичні витрати USL: процесор спалює час на узгодження</text>

  <!-- Картка 2.3: Катастрофа -->
  <rect x="506" y="346" width="416" height="92" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="518" y="356" width="164" height="20" rx="3" fill="#c0392b"/>
  <text x="600" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ПАРАЛІЧ РОЗРОБКИ</text>
  <text x="692" y="371" font-size="12" font-weight="700" fill="#c0392b">Вибух випадкової складності</text>
  <text x="518" y="394" font-size="12" fill="#1a1a1a">• Зміна простого правила вимагає узгодженого релізу 5 сервісів</text>
  <text x="518" y="412" font-size="12" fill="#c0392b">• Команда витрачає 80% сил на інфраструктуру, а не на бізнес-модель</text>
  <text x="518" y="430" font-size="12" font-weight="700" fill="#c0392b">Підсумок: параліч розробки, вибух випадкової складності</text>

  <!-- НИЖНЯ ПАНЕЛЬ: Принцип найменшого достатнього контуру -->
  <rect x="24" y="458" width="912" height="78" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="38" y="468" width="250" height="22" rx="4" fill="#27ae60"/>
  <text x="163" y="483" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">НАЙМЕНШИЙ ДОСТАТНІЙ КОНТУР</text>
  <text x="298" y="484" font-size="12" font-weight="700" fill="#27ae60">Природний масштаб турботи: інженерна дисципліна рішень</text>
  <text x="38" y="508" font-size="12" fill="#1a1a1a">• Локалізувати в мінімумі: тримати логіку в модульному моноліті з ACID, доки навантаження чи закон Конвея не вимагають виходу</text>
  <text x="38" y="526" font-size="12" fill="#6b7280">• Укріплений кордон: при неминучому виході в мережу будувати захист — бюджет таймаутів, Bulkhead, Circuit Breaker та ідемпотентність</text>
</svg>
