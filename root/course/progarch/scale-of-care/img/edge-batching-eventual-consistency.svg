<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Периферійне обмеження частоти: асинхронний батчинг проти затримки світла</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Локальна оренда квоти дає субмілісекундну відповідь клієнту ціною узгодженості у кінцевому підсумку</text>

  <!-- ЗОНА 1: ПЕРИФЕРІЙНІ ВУЗЛИ (EDGE POPS) -->
  <rect x="25" y="80" width="505" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="277" y="104" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Периферійні вузли (Edge PoPs): нульове очікування WAN</text>

  <!-- Вузол 1: Європа -->
  <rect x="38" y="118" width="478" height="175" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="52" y="138" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Edge PoP: Європа (Франкфурт)</text>

  <!-- Клієнтський потік Європа -->
  <rect x="52" y="152" width="125" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="114" y="171" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Користувач</text>
  <text x="114" y="189" font-size="12" fill="#6b7280" text-anchor="middle">RTT &lt; 2 мс</text>

  <!-- Стрілка запиту -->
  <line x1="177" y1="168" x2="210" y2="168" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- Стрілка відповіді -->
  <line x1="210" y1="188" x2="177" y2="188" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Локальний ізолят V8 -->
  <rect x="215" y="150" width="288" height="130" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="359" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cloudflare Worker (V8 Isolate)</text>

  <!-- Локальна оренда -->
  <rect x="226" y="175" width="266" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="359" y="193" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Локальна оренда: 0.15 мс</text>
  <text x="359" y="209" font-size="12" fill="#6b7280" text-anchor="middle">Миттєве списання з пам'яті</text>

  <!-- Асинхронний батчер -->
  <rect x="226" y="228" width="266" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="359" y="246" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Асинхронний буфер дельт</text>
  <text x="359" y="262" font-size="12" fill="#6b7280" text-anchor="middle">Батчинг подій перед скиданням</text>

  <!-- Вузол 2: Азія -->
  <rect x="38" y="308" width="478" height="175" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="52" y="328" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Edge PoP: Азія (Сінгапур)</text>

  <!-- Клієнтський потік Азія -->
  <rect x="52" y="342" width="125" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="114" y="361" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Користувач</text>
  <text x="114" y="379" font-size="12" fill="#6b7280" text-anchor="middle">RTT &lt; 5 мс</text>

  <!-- Стрілка запиту -->
  <line x1="177" y1="358" x2="210" y2="358" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- Стрілка відповіді -->
  <line x1="210" y1="378" x2="177" y2="378" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Локальний ізолят V8 -->
  <rect x="215" y="340" width="288" height="130" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="359" y="358" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cloudflare Worker (V8 Isolate)</text>

  <!-- Локальна оренда -->
  <rect x="226" y="365" width="266" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="359" y="383" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Локальна оренда: 0.18 мс</text>
  <text x="359" y="399" font-size="12" fill="#6b7280" text-anchor="middle">Миттєве списання з пам'яті</text>

  <!-- Асинхронний батчер -->
  <rect x="226" y="418" width="266" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="359" y="436" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Асинхронний буфер дельт</text>
  <text x="359" y="452" font-size="12" fill="#6b7280" text-anchor="middle">Батчинг подій перед скиданням</text>

  <!-- ПРОМІЖНА ЗОНА: WAN ТРАНСПОРТ -->
  <!-- Картка WAN Франкфурт -->
  <rect x="546" y="195" width="116" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="604" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">waitUntil()</text>
  <text x="604" y="233" font-size="12" fill="#6b7280" text-anchor="middle">WAN: 85 мс</text>

  <!-- Лінії від Франкфурта до Центру через картку WAN -->
  <line x1="492" y1="249" x2="546" y2="221" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="662" y1="221" x2="690" y2="221" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- Картка WAN Сінгапур -->
  <rect x="546" y="385" width="116" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="604" y="405" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">waitUntil()</text>
  <text x="604" y="423" font-size="12" fill="#6b7280" text-anchor="middle">WAN: 160 мс</text>

  <!-- Лінії від Сінгапуру до Центру через картку WAN -->
  <line x1="492" y1="439" x2="546" y2="411" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 662,411 L 672,411 L 672,245 L 690,245" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- ЗОНА 2: ЦЕНТРАЛЬНИЙ РЕГІОН -->
  <rect x="675" y="80" width="260" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="805" y="104" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Центральний регіон (us-east)</text>

  <!-- Центральний координатор -->
  <rect x="690" y="118" width="230" height="175" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="805" y="138" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Глобальний координатор</text>
  <text x="805" y="156" font-size="12" fill="#6b7280" text-anchor="middle">Durable Object / Redis</text>

  <rect x="700" y="168" width="210" height="44" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="805" y="186" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Агрегація батчів дельт</text>
  <text x="805" y="202" font-size="12" fill="#6b7280" text-anchor="middle">Зведення лічильників з PoP</text>

  <rect x="700" y="226" width="210" height="52" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="805" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Виділення нових оренд</text>
  <text x="805" y="260" font-size="12" fill="#6b7280" text-anchor="middle">Квоти по 5-10 токенів на вузол</text>
  <text x="805" y="274" font-size="12" fill="#6b7280" text-anchor="middle">Синхронізація ліміту</text>

  <!-- Картка компромісу -->
  <rect x="690" y="308" width="230" height="192" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="805" y="328" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Архітектурний компроміс</text>

  <text x="702" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Вигода: зрізання затримки</text>
  <text x="702" y="366" font-size="12" fill="#1a1a1a" text-anchor="start">Клієнт отримує відповідь за</text>
  <text x="702" y="382" font-size="12" fill="#1a1a1a" text-anchor="start">0.2 мс замість 160 мс WAN</text>

  <text x="702" y="408" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Ціна: нестрогість ліміту</text>
  <text x="702" y="426" font-size="12" fill="#1a1a1a" text-anchor="start">У вікні зведення можливий</text>
  <text x="702" y="442" font-size="12" fill="#1a1a1a" text-anchor="start">короткочасний овербукінг на</text>
  <text x="702" y="458" font-size="12" fill="#1a1a1a" text-anchor="start">розмір сумарних оренд (±5%)</text>
  <text x="702" y="482" font-size="12" fill="#6b7280" text-anchor="start">Eventual Consistency гарантія</text>
</svg>
