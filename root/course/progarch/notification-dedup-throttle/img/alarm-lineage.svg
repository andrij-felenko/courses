<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тривожна втома: та сама помилка в ядерній, клінічній і софтверній царинах</text>
<line x1="90.0" y1="308.0" x2="1150.0" y2="308.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="280.0" cy="308.0" r="13.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<circle cx="620.0" cy="308.0" r="13.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<circle cx="960.0" cy="308.0" r="13.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="300.0" y1="308.0" x2="598.0" y2="308.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="642.0" y1="308.0" x2="938.0" y2="308.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="450.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">той самий урок</text>
<text x="790.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">той самий урок</text>
<rect x="130.0" y="72.0" width="300.0" height="168.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/><text x="280.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">1979 · Ядерна енергетика</tspan><tspan x="280.0" dy="18.2">ТРИ-МАЙЛ-АЙЛЕНД</tspan><tspan x="280.0" dy="18.2">понад 100 однакових тривог</tspan><tspan x="280.0" dy="18.2">за перші хвилини — і жодного</tspan><tspan x="280.0" dy="18.2">способу приглушити дрібні</tspan></text>
<rect x="470.0" y="72.0" width="300.0" height="168.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="620.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">2000-2013 · Лікарняні монітори</tspan><tspan x="620.0" dy="18.2">ALARM FATIGUE</tspan><tspan x="620.0" dy="18.2">72-99% сигналів — хибні;</tspan><tspan x="620.0" dy="18.2">персонал звикає й перестає</tspan><tspan x="620.0" dy="18.2">реагувати на писк</tspan></text>
<rect x="810.0" y="72.0" width="300.0" height="168.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="960.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">2016+ · Софт</tspan><tspan x="960.0" dy="18.2">ALERT / NOTIFICATION FATIGUE</tspan><tspan x="960.0" dy="18.2">чергування (SRE) і застосунки:</tspan><tspan x="960.0" dy="18.2">недиференційований потік</tspan><tspan x="960.0" dy="18.2">глушать цілком</tspan></text>
<line x1="280.0" y1="240.0" x2="280.0" y2="294.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="620.0" y1="240.0" x2="620.0" y2="294.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="960.0" y1="240.0" x2="960.0" y2="294.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="130.0" y="336.0" width="300.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="280.0" y="390.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Оператори не вирізнили</tspan><tspan x="280.0" dy="16.9">головного сигналу, вручну</tspan><tspan x="280.0" dy="16.9">зменшили аварійне охолодження</tspan><tspan x="280.0" dy="16.9">→ розплавлено ~45% зони</tspan></text>
<rect x="470.0" y="336.0" width="300.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="620.0" y="398.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Boston Globe (2011): &gt;200 смертей</tspan><tspan x="620.0" dy="16.9">за 5 років; Joint Commission —</tspan><tspan x="620.0" dy="16.9">80 смертей; ECRI — загроза №1</tspan></text>
<rect x="810.0" y="336.0" width="300.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="960.0" y="390.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="960.0" dy="0.0">Сповіщення вимикають геть —</tspan><tspan x="960.0" dy="16.9">і повз проходить та єдина</tspan><tspan x="960.0" dy="16.9">тривога, заради якої</tspan><tspan x="960.0" dy="16.9">все будувалось</tspan></text>
<line x1="280.0" y1="321.0" x2="280.0" y2="336.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="620.0" y1="321.0" x2="620.0" y2="336.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="960.0" y1="321.0" x2="960.0" y2="336.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="100.0" y="508.0" width="1040.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="620.0" y="536.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Один урок, три домени: потік недиференційованих тривог — це відсутність тривоги.</tspan></text>
<rect x="250.0" y="562.0" width="740.0" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="620.0" y="587.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Відповідь скрізь та сама — пріоритезувати сигнал: критичне в обхід шуму.</tspan></text>
</svg>