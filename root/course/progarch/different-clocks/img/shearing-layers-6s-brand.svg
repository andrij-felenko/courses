<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="550" fill="white"/>
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="480" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Шість зсувних шарів будівлі: модель Стюарта Бренда (6S)</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">Швидкі шари вільно ковзають поверх повільних, якщо між ними не створено жорсткого зчеплення</text>
  <rect x="25" y="80" width="124" height="402" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="87" y="104" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">ТЕМП ЗМІН</text>
  <path d="M 45,460 L 45,124" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="56" y="128" font-size="12" font-weight="700" fill="#2457d6">Швидко</text>
  <text x="56" y="142" font-size="12" fill="#6b7280">дні, тижні</text>
  <text x="56" y="278" font-size="12" font-weight="700" fill="#2457d6">Роки</text>
  <text x="56" y="292" font-size="12" fill="#6b7280">3–30 років</text>
  <text x="56" y="446" font-size="12" font-weight="700" fill="#1a1a1a">Повільно</text>
  <text x="56" y="460" font-size="12" fill="#6b7280">століття</text>
  <rect x="162" y="80" width="516" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="178" y="101" font-size="13" font-weight="700" fill="#2457d6">Stuff · Речі та меблі</text>
  <text x="662" y="101" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">дні, місяці</text>
  <text x="178" y="119" font-size="12" fill="#1a1a1a">Стільці, столи, оргтехніка, особисті речі, лампи · <tspan fill="#6b7280">Рухаються щоденно; нульовий вплив на каркас</tspan></text>
  <path d="M 182,141 L 217,141" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 658,141 L 623,141" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="420" y="145" font-size="12" text-anchor="middle" fill="#6b7280">площина вільного ковзання</text>
  <rect x="162" y="150" width="516" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="178" y="171" font-size="13" font-weight="700" fill="#1a1a1a">Space plan · Планування простору</text>
  <text x="662" y="171" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">3–30 років (офіси: 3–5)</text>
  <text x="178" y="189" font-size="12" fill="#1a1a1a">Внутрішні перегородки, двері, підвісні стелі, фальшпідлоги · <tspan fill="#6b7280">Перебудовується під нові процеси; не тримає навантаження</tspan></text>
  <path d="M 182,211 L 217,211" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 658,211 L 623,211" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="420" y="215" font-size="12" text-anchor="middle" fill="#6b7280">площина вільного ковзання</text>
  <rect x="162" y="220" width="516" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="178" y="241" font-size="13" font-weight="700" fill="#1a1a1a">Services · Комунікації та мережі</text>
  <text x="662" y="241" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">7–15 років</text>
  <text x="178" y="259" font-size="12" fill="#1a1a1a">Електропроводка, водопровід, вентиляція, каналізація, ліфти · <tspan fill="#6b7280">Швидко зношуються; вимагають легкого доступу</tspan></text>
  <path d="M 182,281 L 217,281" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 658,281 L 623,281" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="420" y="285" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">критична площина зсуву: комунікації ↔ каркас</text>
  <rect x="162" y="290" width="516" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="178" y="311" font-size="13" font-weight="700" fill="#1a1a1a">Skin · Оболонка та фасад</text>
  <text x="662" y="311" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">~20 років</text>
  <text x="178" y="329" font-size="12" fill="#1a1a1a">Фасадні панелі, зовнішні вікна, утеплення, покрівля · <tspan fill="#6b7280">Захищає від клімату; змінюється за модою й технологіями</tspan></text>
  <path d="M 182,351 L 217,351" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 658,351 L 623,351" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="420" y="355" font-size="12" text-anchor="middle" fill="#6b7280">площина вільного ковзання</text>
  <rect x="162" y="360" width="516" height="52" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="178" y="381" font-size="13" font-weight="700" fill="#1a1a1a">Structure · Несуча конструкція</text>
  <text x="662" y="381" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">30–300 років</text>
  <text x="178" y="399" font-size="12" fill="#1a1a1a">Фундамент, тримальні колони, залізобетонні балки, перекриття · <tspan fill="#6b7280">Статичний скелет споруди; пошкодження є фатальним</tspan></text>
  <path d="M 182,421 L 217,421" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 658,421 L 623,421" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="420" y="425" font-size="12" text-anchor="middle" fill="#6b7280">площина вільного ковзання</text>
  <rect x="162" y="430" width="516" height="52" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="178" y="451" font-size="13" font-weight="700" fill="#1a1a1a">Site · Земельна ділянка</text>
  <text x="662" y="451" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">вічність, епохи</text>
  <text x="178" y="469" font-size="12" fill="#1a1a1a">Географічне розташування, межі ділянки, топографія, ґрунт · <tspan fill="#6b7280">Абсолютна нерухомість; первинний контекст споруди</tspan></text>
  <rect x="692" y="80" width="243" height="194" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="708" y="104" font-size="13" font-weight="700" fill="#27ae60">Вільне ковзання (так)</text>
  <text x="708" y="122" font-size="12" font-weight="700" fill="#1a1a1a">Незалежні зони стику</text>
  <text x="708" y="142" font-size="12" fill="#1a1a1a">Швидкі шари вільно ковзають</text>
  <text x="708" y="158" font-size="12" fill="#1a1a1a">поверх повільних без тертя.</text>
  <text x="708" y="180" font-size="12" fill="#6b7280">• Кабель-канали й шахти</text>
  <text x="708" y="198" font-size="12" fill="#6b7280">• Модульні перегородки</text>
  <text x="708" y="216" font-size="12" fill="#6b7280">• Навісні фасади на анкерах</text>
  <text x="708" y="244" font-size="12" font-weight="700" fill="#27ae60">→ Каркас залишається цілим</text>
  <rect x="692" y="288" width="243" height="194" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="708" y="312" font-size="13" font-weight="700" fill="#c0392b">Напруга зсуву (не так)</text>
  <text x="708" y="330" font-size="12" font-weight="700" fill="#1a1a1a">Жорстке зрощення шарів</text>
  <text x="708" y="350" font-size="12" fill="#1a1a1a">Спроба оновити швидкий шар</text>
  <text x="708" y="366" font-size="12" fill="#1a1a1a">руйнує довговічну основу.</text>
  <text x="708" y="388" font-size="12" fill="#6b7280">• Труби, замуровані в бетон</text>
  <text x="708" y="406" font-size="12" fill="#6b7280">• Несучі стіни як кімнати</text>
  <text x="708" y="424" font-size="12" fill="#6b7280">• Припаяний UI до схеми БД</text>
  <text x="708" y="452" font-size="12" font-weight="700" fill="#c0392b">→ Злам системи або параліч</text>
  <text x="708" y="470" font-size="12" fill="#6b7280">часті зміни колотять фундамент</text>
  <rect x="162" y="496" width="773" height="26" rx="4" fill="#f4f6f8"/>
  <text x="548" y="513" font-size="12" text-anchor="middle" fill="#1a1a1a">Принцип Бренда: <tspan font-weight="700">повільне не сковує швидке, а швидке не руйнує повільне</tspan> завдяки ковзанню на стиках</text>
</svg>
