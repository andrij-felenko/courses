  <text x="100" y="170" font-size="12" text-anchor="middle" fill="#2457d6">швидкий темп</text>
  <rect x="171" y="130" width="118" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="230" y="152" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Клієнт Б (Batch)</text>
  <text x="230" y="170" font-size="12" text-anchor="middle" fill="#6b7280">повільний темп</text>
  <rect x="41" y="220" width="118" height="58" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="100" y="243" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Фасад V1</text>
