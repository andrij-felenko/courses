  <text x="795" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">3. ЗГОРТАННЯ (CONTRACT)</text>
  <text x="795" y="118" font-size="12" text-anchor="middle" fill="#6b7280">Застарілий V1 остаточно вилучено</text>
