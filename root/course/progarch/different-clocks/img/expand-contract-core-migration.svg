  <rect x="490" y="356" width="114" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="547" y="376" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Контракт V2</text>
  <text x="547" y="392" font-size="12" text-anchor="middle" fill="#27ae60">активний</text>
  <path d="M 413,278 L 413,354" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
