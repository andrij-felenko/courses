  <rect x="805" y="356" width="114" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="862" y="376" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Контракт V2</text>
  <text x="862" y="392" font-size="12" text-anchor="middle" fill="#27ae60">єдиний канон</text>
  <path d="M 862,278 L 862,354" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <rect x="675" y="416" width="240" height="24" rx="4" fill="#e9f7ef"/>
  <text x="795" y="432" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Борг очищено, ядро стабільне</text>
