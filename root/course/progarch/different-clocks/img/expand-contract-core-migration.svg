  <rect x="665" y="308" width="260" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="330" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Консервативне ядро</text>
  <text x="795" y="346" font-size="12" text-anchor="middle" fill="#6b7280">повільний темп релізів</text>
