<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="550" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Матриця структурування: доменна когезія проти темпу змін</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Спільна швидкість не виправдовує злиття непов'язаних доменів, а спільний домен вимагає швів при різному темпі</text>

  <!-- ================= КОЛОНКИ: ВЕРХНІ ЗАГОЛОВКИ (X-AXIS) ================= -->
  <!-- Колонка 1: Низька когезія -->
  <rect x="140" y="82" width="380" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="330" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">НИЗЬКА КОГЕЗІЯ <tspan font-weight="normal" fill="#6b7280">(Непов'язані домени)</tspan></text>

  <!-- Колонка 2: Висока когезія -->
  <rect x="540" y="82" width="380" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="730" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ВИСОКА КОГЕЗІЯ <tspan font-weight="normal" fill="#6b7280">(Єдиний бізнес-контекст)</tspan></text>

  <!-- ================= БІЧНІ МІТКИ (Y-AXIS: ТЕМП ЗМІН) ================= -->
  <!-- Заголовок осі Y -->
  <text x="76" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ТЕМП ЗМІН ▲</text>
  <text x="76" y="157" text-anchor="middle" font-size="12" fill="#6b7280">(Швидкість)</text>

  <!-- Мітка рядка 1: Однаковий темп -->
  <rect x="25" y="170" width="102" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="76" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ОДНАКОВИЙ</text>
  <text x="76" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ТЕМП ЗМІН</text>
  <text x="76" y="222" text-anchor="middle" font-size="12" fill="#6b7280">(Спільний ритм)</text>

  <!-- Пунктир між мітками осі Y -->
  <line x1="76" y1="238" x2="76" y2="345" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Мітка рядка 2: Різні темпи -->
  <rect x="25" y="352" width="102" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="76" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">РІЗНІ</text>
  <text x="76" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ТЕМПИ ЗМІН</text>
  <text x="76" y="404" text-anchor="middle" font-size="12" fill="#6b7280">(Розрив ритмів)</text>

  <!-- ================= 4 КВАДРАНТИ МАТРИЦІ ================= -->

  <!-- Квадрант 1 (Верхній лівий): Низька когезія + Однаковий темп (ХИБНЕ СКЛЕЮВАННЯ) -->
  <rect x="140" y="125" width="380" height="165" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="160" y="152" font-size="14" font-weight="bold" fill="#c0392b">⛔ ХИБНЕ ОБ'ЄДНАННЯ</text>
  <text x="160" y="170" font-size="12" fill="#6b7280">Випадковий збіг частоти змін компонентів</text>
  <text x="160" y="195" font-size="12" fill="#1a1a1a">• Пастка: злиття модулів лише через однаковий темп</text>
  <text x="160" y="215" font-size="12" fill="#1a1a1a">• Наслідок: штучне зчеплення непов'язаних доменів</text>
  <text x="160" y="235" font-size="12" fill="#c0392b">• Помилка: однаковий темп не виправдовує моноліту</text>
  <text x="160" y="258" font-size="12" font-weight="bold" fill="#1a1a1a">➜ Дія: розділяти на автономні доменні модулі</text>

  <!-- Квадрант 2 (Верхній правий): Висока когезія + Однаковий темп (ІДЕАЛЬНИЙ МОДУЛЬ) -->
  <rect x="540" y="125" width="380" height="165" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="560" y="152" font-size="14" font-weight="bold" fill="#27ae60">✓ ІДЕАЛЬНИЙ МОДУЛЬ</text>
  <text x="560" y="170" font-size="12" fill="#6b7280">Спільний бізнес-контекст і синхронний розвиток</text>
  <text x="560" y="195" font-size="12" fill="#1a1a1a">• Гармонія: повний смисловий зв'язок та спільний темп</text>
  <text x="560" y="215" font-size="12" fill="#1a1a1a">• Збіг причин змін: код модифікується для однієї мети</text>
  <text x="560" y="235" font-size="12" fill="#1a1a1a">• Ефект: нульові витрати на додаткові шви та мапінг</text>
  <text x="560" y="258" font-size="12" font-weight="bold" fill="#27ae60">➜ Дія: зберігати разом у межах одного модуля</text>

  <!-- Квадрант 3 (Нижній лівий): Низька когезія + Різні темпи (ПОВНА АВТОНОМІЯ) -->
  <rect x="140" y="305" width="380" height="165" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="332" font-size="14" font-weight="bold" fill="#1a1a1a">○ ПОВНА АВТОНОМІЯ</text>
  <text x="160" y="350" font-size="12" fill="#6b7280">Чужі бізнес-контексти з різними швидкостями</text>
  <text x="160" y="375" font-size="12" fill="#1a1a1a">• Незалежність: немає ні доменного, ні темпового зв'язку</text>
  <text x="160" y="395" font-size="12" fill="#1a1a1a">• Приклад: драйвер опалення та модуль аналітики UI</text>
  <text x="160" y="415" font-size="12" fill="#1a1a1a">• Безпека: компоненти ізольовані на всіх рівнях</text>
  <text x="160" y="438" font-size="12" font-weight="bold" fill="#6b7280">➜ Дія: окремі репозиторії та ізольоване середовище</text>

  <!-- Квадрант 4 (Нижній правий): Висока когезія + Різні темпи (ТЕМПОВЕ РОЗШАРУВАННЯ) -->
  <rect x="540" y="305" width="380" height="165" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="560" y="332" font-size="14" font-weight="bold" fill="#2457d6">⚡ ТЕМПОВЕ РОЗШАРУВАННЯ</text>
  <text x="560" y="350" font-size="12" fill="#6b7280">Спільний домен із різними ритмами змін</text>
  <text x="560" y="375" font-size="12" fill="#1a1a1a">• Конфлікт: ядро сутності повільне, але екранний UI швидкий</text>
  <text x="560" y="395" font-size="12" fill="#c0392b">• Ризик злиття: інверсія темпів та блокування релізів</text>
  <text x="560" y="415" font-size="12" fill="#1a1a1a">• Механіка: захист стабільного ядра спадними контрактами</text>
  <text x="560" y="438" font-size="12" font-weight="bold" fill="#2457d6">➜ Дія: архітектурний шов (Outbox, буфер, CQRS, DTO)</text>

  <!-- ================= ПІДСУМКОВА ПАНЕЛЬ ================= -->
  <rect x="30" y="485" width="900" height="42" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="511" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Головне правило:</tspan> <tspan fill="#1a1a1a">Когезія визначає, ЩО належить до одного домену. Темп змін визначає, ДЕ ставити архітектурні шви.</tspan></text>
</svg>
