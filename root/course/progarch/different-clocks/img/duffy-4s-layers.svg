<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>
  <text x="480" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Чотири шари офісної споруди: модель Френка Даффі (4S)</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">Життєвий цикл компонентів від 50 років до одного дня: швидкі шари вільно адаптуються всередині повільних</text>
  <rect x="25" y="80" width="132" height="352" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="91" y="102" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">ЧАСОВА ШКАЛА</text>
  <path d="M 44,410 L 44,120" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="56" y="120" font-size="12" font-weight="700" fill="#2457d6">1 день – тижні</text>
  <text x="56" y="136" font-size="12" fill="#6b7280">щоденний темп</text>
  <text x="56" y="206" font-size="12" font-weight="700" fill="#1a1a1a">~5 років</text>
  <text x="56" y="222" font-size="12" fill="#6b7280">3–7 років</text>
  <text x="56" y="292" font-size="12" font-weight="700" fill="#1a1a1a">~15 років</text>
  <text x="56" y="308" font-size="12" fill="#6b7280">10–15 років</text>
  <text x="56" y="378" font-size="12" font-weight="700" fill="#1a1a1a">~50 років</text>
  <text x="56" y="394" font-size="12" fill="#6b7280">30–50+ років</text>
  <rect x="171" y="80" width="528" height="72" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="187" y="102" font-size="13" font-weight="700" fill="#2457d6">Set · Реквізит та оснащення</text>
  <text x="683" y="102" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">від 1 дня до місяців</text>
  <text x="187" y="122" font-size="12" fill="#1a1a1a">Столи, стільці, оргтехніка, персональні речі, освітлення</text>
  <text x="187" y="140" font-size="12" fill="#6b7280">🎭 Театр: реквізит вистави · Софт: сесії, стан форми, конфігурація</text>
  <rect x="171" y="166" width="528" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="187" y="188" font-size="13" font-weight="700" fill="#1a1a1a">Scenery · Декорації та інтер'єр</text>
  <text x="683" y="188" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">~5–7 років</text>
  <text x="187" y="208" font-size="12" fill="#1a1a1a">Внутрішні перегородки, двері, підвісні стелі, модульні фальшпідлоги</text>
  <text x="187" y="226" font-size="12" fill="#6b7280">🎭 Театр: декорації сцени · Софт: компонування екранів, сценарії UI</text>
  <rect x="171" y="252" width="528" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="187" y="274" font-size="13" font-weight="700" fill="#1a1a1a">Services · Інженерні мережі</text>
  <text x="683" y="274" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">~15 років</text>
  <text x="187" y="294" font-size="12" fill="#1a1a1a">Електропроводка, кабельні лотки, кондиціонування, опалення, труби</text>
  <text x="187" y="312" font-size="12" fill="#6b7280">🎭 Театр: софіти й підйомники · Софт: мережеві протоколи, черги, брокери</text>
  <rect x="171" y="338" width="528" height="72" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="187" y="360" font-size="13" font-weight="700" fill="#1a1a1a">Shell · Каркас та оболонка будівлі</text>
  <text x="683" y="360" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">~50 років</text>
  <text x="187" y="380" font-size="12" fill="#1a1a1a">Фундамент, тримальні колони, плити перекриття, зовнішній фасад</text>
  <text x="187" y="398" font-size="12" fill="#6b7280">🎭 Театр: кам'яна будівля театру · Софт: доменні інваріанти, первинна схема БД</text>
  <rect x="713" y="80" width="222" height="168" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="727" y="104" font-size="13" font-weight="700" fill="#27ae60">Розчеплення (так)</text>
  <text x="727" y="122" font-size="12" font-weight="700" fill="#1a1a1a">Шар вільно ковзає</text>
  <text x="727" y="142" font-size="12" fill="#1a1a1a">Реквізит рухається щодня</text>
  <text x="727" y="158" font-size="12" fill="#1a1a1a">без пошкодження стін.</text>
  <text x="727" y="180" font-size="12" fill="#6b7280">Мережі йдуть у лотках;</text>
  <text x="727" y="196" font-size="12" fill="#6b7280">декорації не тримають дах.</text>
  <text x="727" y="226" font-size="12" font-weight="700" fill="#27ae60">→ Нульове тертя оновлень</text>
  <rect x="713" y="262" width="222" height="170" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="727" y="286" font-size="13" font-weight="700" fill="#c0392b">Зрощення (не так)</text>
  <text x="727" y="304" font-size="12" font-weight="700" fill="#1a1a1a">Напруга зсуву</text>
  <text x="727" y="324" font-size="12" fill="#1a1a1a">Кабель залито в бетон;</text>
  <text x="727" y="340" font-size="12" fill="#1a1a1a">перегородка тримає балку.</text>
  <text x="727" y="362" font-size="12" fill="#6b7280">Перестановка столу вимагає</text>
  <text x="727" y="378" font-size="12" fill="#6b7280">перфоратора й ламає каркас.</text>
  <text x="727" y="408" font-size="12" font-weight="700" fill="#c0392b">→ Параліч розвитку системи</text>
  <rect x="25" y="450" width="910" height="28" rx="4" fill="#f4f6f8"/>
  <text x="480" y="469" font-size="12" text-anchor="middle" fill="#1a1a1a">Принцип Френка Даффі: <tspan font-weight="700">будівля — це кілька шарів різної довговічності</tspan>, де швидке не повинно дестабілізувати повільне</text>
</svg>
