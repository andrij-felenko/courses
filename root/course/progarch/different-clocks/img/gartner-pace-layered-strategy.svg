<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-slate" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Стратегія темпових шарів Gartner (Pace-Layered Strategy)</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Розподіл систем за темпом змін захищає стабільне ядро від руйнівного впливу частих інновацій</text>

  <!-- РІВЕНЬ 1: SYSTEMS OF INNOVATION (х = 160..800, y = 78..182) -->
  <rect x="160" y="78" width="640" height="104" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <rect x="160" y="78" width="640" height="30" rx="8" fill="#eaf0fd"/>
  <rect x="160" y="98" width="640" height="10" fill="#eaf0fd"/>
  <line x1="160" y1="108" x2="800" y2="108" stroke="#d0d7de" stroke-width="1"/>

  <text x="180" y="98" font-size="13" font-weight="bold" fill="#2457d6">РІВЕНЬ 1: SYSTEMS OF INNOVATION</text>
  <text x="415" y="98" font-size="13" font-weight="bold" fill="#1a1a1a">· Системи інновацій</text>

  <rect x="635" y="84" width="150" height="20" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="710" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Темп: дні – тижні</text>

  <text x="180" y="128" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Призначення:</tspan> швидка перевірка нових бізнес-ідей, прототипи, ad-hoc сервіси, мобільні фічі</text>
  <text x="180" y="148" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Горизонт життя:</tspan> менше 1 року (висока плинність коду, часті експерименти й швидке відсіювання)</text>
  <text x="180" y="168" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Управління й ризик:</tspan> продуктовий пошук, автономні команди, висока толерантність до збоїв</text>

  <!-- Зв'язок 1 -> 2 (залежність вниз) -->
  <line x1="480" y1="184" x2="480" y2="198" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- РІВЕНЬ 2: SYSTEMS OF DIFFERENTIATION (х = 100..860, y = 200..304) -->
  <rect x="100" y="200" width="760" height="104" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <rect x="100" y="200" width="760" height="30" rx="8" fill="#e9f7ef"/>
  <rect x="100" y="220" width="760" height="10" fill="#e9f7ef"/>
  <line x1="100" y1="230" x2="860" y2="230" stroke="#d0d7de" stroke-width="1"/>

  <text x="120" y="220" font-size="13" font-weight="bold" fill="#27ae60">РІВЕНЬ 2: SYSTEMS OF DIFFERENTIATION</text>
  <text x="400" y="220" font-size="13" font-weight="bold" fill="#1a1a1a">· Системи диференціації</text>

  <rect x="695" y="206" width="150" height="20" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="770" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Темп: 1–6 місяців</text>

  <text x="120" y="250" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Призначення:</tspan> унікальні бізнес-процеси, фірмові ноу-хау й алгоритми, специфічні клієнтські сервіси</text>
  <text x="120" y="270" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Горизонт життя:</tspan> 1–3 роки (регулярна переконфігурація під зміни ринку та запити користувачів)</text>
  <text x="120" y="290" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Управління й ризик:</tspan> спільне володіння бізнесу й IT, модульність, антикорупційні шари (ACL)</text>

  <!-- Зв'язок 2 -> 3 (залежність вниз) -->
  <line x1="480" y1="306" x2="480" y2="320" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- РІВЕНЬ 3: SYSTEMS OF RECORD (х = 40..920, y = 322..434) -->
  <rect x="40" y="322" width="880" height="112" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <rect x="40" y="322" width="880" height="30" rx="8" fill="#f1f5f9"/>
  <rect x="40" y="342" width="880" height="10" fill="#f1f5f9"/>
  <line x1="40" y1="352" x2="920" y2="352" stroke="#cbd5e1" stroke-width="1"/>

  <text x="60" y="342" font-size="13" font-weight="bold" fill="#334155">РІВЕНЬ 3: SYSTEMS OF RECORD</text>
  <text x="270" y="342" font-size="13" font-weight="bold" fill="#1a1a1a">· Системи обліку й запису (стабільна основа)</text>

  <rect x="755" y="328" width="150" height="20" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="830" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Темп: роки (1–3+)</text>

  <text x="60" y="372" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#334155">Призначення:</tspan> транзакційне ядро, критичні дані, ERP, CRM, білінг, бухгалтерський облік, регуляторні звіти</text>
  <text x="60" y="394" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#334155">Горизонт життя:</tspan> 10+ років (консервативний фундамент підприємства, еволюція через стабільні контракти)</text>
  <text x="60" y="416" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#334155">Управління й ризик:</tspan> централізований суворий аудит, нульова толерантність до збоїв, гарантії ACID</text>

  <!-- ПІДСУМКОВА ПАНЕЛЬ: АРХІТЕКТУРНИЙ ПРИНЦИП (х = 40..920, y = 450..498) -->
  <rect x="40" y="450" width="880" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Архітектурний закон: залежності спрямовані лише зверху вниз — від швидких шарів до повільних</text>
  <text x="480" y="488" text-anchor="middle" font-size="12" fill="#6b7280">Часове розчеплення усуває напругу зсуву: часті оновлення інновацій не дестабілізують ядро обліку</text>
</svg>
