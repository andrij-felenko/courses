<rect x="45.0" y="210.0" width="390.0" height="165.0" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="240.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Канал інвалідації при зміні стану:</tspan><tspan x="240.0" dy="16.9">1. Запис у DB &amp; L2 Redis</tspan><tspan x="240.0" dy="16.9">2. Redis Pub/Sub → evict L1 memory</tspan><tspan x="240.0" dy="16.9">3. Edge Purge API → evict L3 key</tspan></text>
