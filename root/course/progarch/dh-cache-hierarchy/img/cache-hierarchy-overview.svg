<rect x="275.0" y="50.0" width="200.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="375.0" y="72.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="375.0" dy="0.0">L3: Edge CDN</tspan><tspan x="375.0" dy="16.9">(Cloudflare / Fastly)</tspan><tspan x="375.0" dy="16.9">20–30 ms · HTTP Cache</tspan></text>
<rect x="525.0" y="50.0" width="200.0" height="70.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">L1: Внутрішня пам'ять API</tspan><tspan x="625.0" dy="14.3">(Process Memory LRU)</tspan><tspan x="625.0" dy="14.3">&lt; 1 ms · No I/O</tspan></text>
<rect x="775.0" y="50.0" width="230.0" height="70.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="890.0" y="72.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">L2: Спільний Redis Cluster</tspan><tspan x="890.0" dy="16.9">(Розподілений кеш)</tspan><tspan x="890.0" dy="16.9">1–3 ms · Shared State</tspan></text>
<rect x="525.0" y="310.0" width="480.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="765.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">Origin DB (PostgreSQL / ScyllaDB Cluster)</tspan><tspan x="765.0" dy="16.9">50+ ms · Джерело правди (I/O &amp; Disk Bottleneck)</tspan></text>
