<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна зміни в v0 — не однакова</text>
<text x="330.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">як далеко розходиться правка →</text>
<text x="310.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">«поріг 20 → 22°»</text>
<rect x="330.0" y="81.0" width="40.0" height="26.0" rx="4" fill="#27ae60" stroke="#333333" stroke-width="1.0"/>
<text x="650.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">один рядок</text>
<text x="310.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">«поріг удень / уночі»</text>
<rect x="330.0" y="131.0" width="84.0" height="26.0" rx="4" fill="#27ae60" stroke="#333333" stroke-width="1.0"/>
<text x="650.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">кілька рядків, той самий файл</text>
<text x="310.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">«другий датчик у спальні»</text>
<rect x="330.0" y="181.0" width="200.0" height="26.0" rx="4" fill="#e08a1e" stroke="#333333" stroke-width="1.0"/>
<text x="650.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">ламає «датчик рівно один»</text>
<text x="310.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">«сповіщати, а не гріти»</text>
<rect x="330.0" y="231.0" width="250.0" height="26.0" rx="4" fill="#e08a1e" stroke="#333333" stroke-width="1.0"/>
<text x="650.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">read→decide→act зварені</text>
<text x="310.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">«інший вендор давача»</text>
<rect x="330.0" y="281.0" width="300.0" height="26.0" rx="4" fill="#c0392b" stroke="#333333" stroke-width="1.0"/>
<text x="650.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">драйвер вплетений у логіку</text>
</svg>