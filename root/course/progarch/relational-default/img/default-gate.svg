<rect x="300.0" y="183.1" width="460.0" height="49.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="204.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Чи є ВИМІРЯНИЙ сценарій, що ламає Postgres?</tspan><tspan x="530.0" dy="16.9">(драйвер + число-межа)</tspan></text>
