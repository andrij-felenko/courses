<text x="338.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ні</text>
<rect x="140.0" y="331.5" width="280.0" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="352.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">PostgreSQL за замовчуванням</tspan></text>
