<rect x="660.0" y="331.5" width="260.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="352.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">спеціалізоване сховище</tspan></text>
<text x="790.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="790.0" dy="0.0">назви драйвер і виміряй його ж</tspan><tspan x="790.0" dy="15.6">на Postgres спершу</tspan></text>
