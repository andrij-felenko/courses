<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="95.0" y="24.0" width="810.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="59.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">ті самі оновлення спільної сцени «Вечір кіно»:</tspan><tspan x="500.0" dy="16.9">A: + торшер      B: + гірлянда   (одночасно)</tspan><tspan x="500.0" dy="16.9">потім: − торшер (бачив тег a1)      C: + торшер (новий тег c1)</tspan></text>
<line x1="500.0" y1="120.0" x2="272.0" y2="176.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="120.0" x2="728.0" y2="176.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="272.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">LWW на цілому значенні списку</text>
<rect x="112.0" y="231.0" width="320.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="272.0" y="276.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="272.0" dy="0.0">фінал:  { гірлянда }</tspan><tspan x="272.0" dy="16.9"> </tspan><tspan x="272.0" dy="16.9">«торшер» тихо зник:</tspan><tspan x="272.0" dy="16.9">перезапис затер додавання,</tspan><tspan x="272.0" dy="16.9">якого його автор не бачив</tspan></text>
<text x="272.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">один реальний намір загублено</text>
<text x="728.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">OR-Set — унікальні теги на елемент</text>
<rect x="558.0" y="231.0" width="340.0" height="150.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="728.0" y="276.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="728.0" dy="0.0">фінал:  { гірлянда, торшер }</tspan><tspan x="728.0" dy="16.9"> </tspan><tspan x="728.0" dy="16.9">усі додавання збережено;</tspan><tspan x="728.0" dy="16.9">видалення тега a1 тримається,</tspan><tspan x="728.0" dy="16.9">а новий тег c1 живе далі</tspan></text>
<text x="728.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">нічого не втрачено, без воскресіння</text>
<text x="500.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">обидві стратегії сходяться — але LWW сходиться до НЕПОВНОГО списку</text>
</svg>