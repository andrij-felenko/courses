<text x="490.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">devices = [ lock@спальня ]</text>
<line x1="165.0" y1="134.9" x2="360.0" y2="221.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="130.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">tick(): пише heating,</text>
