<rect x="779.1" y="85.0" width="71.9" height="49.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="815.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Двері 2</tspan><tspan x="815.0" dy="16.9">CLI</tspan></text>
<rect x="394.8" y="483.5" width="190.4" height="33.0" rx="6" fill="#f2f2f2" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="504.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Двері 3 — HTTP (завтра)</tspan></text>
<text x="490.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що записала одна двер, наступне читання іншої вже бачить — бо hub один</text>
