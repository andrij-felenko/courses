<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоє дверей ділять один стан</text>
<rect x="340.0" y="225.0" width="300.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="490.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">HubService — одна правда</text>
<text x="490.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">heating = True</text>
