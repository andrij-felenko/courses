<text x="470.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">логіка не в дверях і не в портах — вона в одному сервісі, який обидві двері гукають</text>
