<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">згори гукають (драйвери) · знизу застосунок тягнеться (драйвовані порти)</text>
