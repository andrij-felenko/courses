<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне слово — три очікування: команда, документ, подія</text>
<text x="590.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне слово — три очікування, яких із байтів не видно</text>
<rect x="56.0" y="150.0" width="250.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="181.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="181.0" dy="0.0">«ПОВІДОМЛЕННЯ»</tspan><tspan x="181.0" dy="18.2">байти без наміру</tspan></text>
<rect x="340.0" y="150.0" width="250.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="465.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">Отримувач не знає:</tspan><tspan x="465.0" dy="16.2">— чекати відповідь?</tspan><tspan x="465.0" dy="16.2">— хто споживач і скільки?</tspan><tspan x="465.0" dy="16.2">— чи важить свіжість?</tspan></text>
<text x="628.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">назвати намір</text>
<line x1="590.0" y1="225.0" x2="656.0" y2="225.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="656.0" y1="225.0" x2="668.0" y2="148.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="668.0" y="96.0" width="496.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="916.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="916.0" dy="0.0">КОМАНДА — «роби це»</tspan><tspan x="916.0" dy="16.2">відповідь можлива · один адресат · час критичний</tspan></text>
<line x1="656.0" y1="225.0" x2="668.0" y2="274.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="668.0" y="222.0" width="496.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="916.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="916.0" dy="0.0">ДОКУМЕНТ — «ось дані»</tspan><tspan x="916.0" dy="16.2">без відповіді · вирішує сам споживач · зміст, не час</tspan></text>
<line x1="656.0" y1="225.0" x2="668.0" y2="400.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="668.0" y="348.0" width="496.0" height="104.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="916.0" y="396.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="916.0" dy="0.0">ПОДІЯ — «сталося»</tspan><tspan x="916.0" dy="16.2">без відповіді · багато невідомих · вміст часто порожній</tspan></text>
</svg>