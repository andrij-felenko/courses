<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 372" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="372" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три питання, якими наводять будь-який принцип</text>
<rect x="40.0" y="78.0" width="300.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="190.0" y="114.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1. Яку СИЛУ</tspan><tspan x="190.0" dy="16.9">це правило стереже?</tspan><tspan x="190.0" dy="16.9">(назви біль)</tspan></text>
<rect x="390.0" y="78.0" width="300.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="540.0" y="114.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">2. Сила тут РЕАЛЬНА</tspan><tspan x="540.0" dy="16.9">і присутня — чи</tspan><tspan x="540.0" dy="16.9">гіпотетична «раптом»?</tspan></text>
<rect x="740.0" y="78.0" width="300.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="890.0" y="114.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">3. Ціна дотримання</tspan><tspan x="890.0" dy="16.9">менша за біль,</tspan><tspan x="890.0" dy="16.9">який він відводить?</tspan></text>
<line x1="340.0" y1="127.0" x2="388.0" y2="127.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="690.0" y1="127.0" x2="738.0" y2="127.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="890.0" y1="176.0" x2="890.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="250.0" y="250.0" width="320.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="277.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">усі ТАК →</tspan><tspan x="410.0" dy="16.9">застосуй: проведи шов,</tspan><tspan x="410.0" dy="16.9">винеси абстракцію</tspan></text>
<rect x="636.0" y="250.0" width="344.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="808.0" y="277.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="808.0" dy="0.0">сили нема →</tspan><tspan x="808.0" dy="16.9">тримай простим,</tspan><tspan x="808.0" dy="16.9">лінза чекає в шухляді</tspan></text>
<line x1="890.0" y1="210.0" x2="470.0" y2="248.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="890.0" y1="210.0" x2="808.0" y2="248.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Присутня сила — застосовуй; нема — найкраще рішення часто «нічого не роби».</text>
</svg>