<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принципи стикаються — суддя вирішує</text>
<rect x="360.0" y="74.0" width="280.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.2"/><text x="500.0" y="100.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">РІШЕННЯ</tspan><tspan x="500.0" dy="16.9">виносити двійника</tspan><tspan x="500.0" dy="16.9">у спільну абстракцію?</tspan></text>
<rect x="48.0" y="250.0" width="258.0" height="88.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="177.0" y="281.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="177.0" dy="0.0">DRY</tspan><tspan x="177.0" dy="16.9">«не дублюй»</tspan><tspan x="177.0" dy="16.9">тягне до ТАК</tspan></text>
<rect x="694.0" y="250.0" width="268.0" height="88.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="828.0" y="281.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="828.0" dy="0.0">Розчеплення + YAGNI</tspan><tspan x="828.0" dy="16.9">«не зшивай дві осі»</tspan><tspan x="828.0" dy="16.9">тягне до НІ</tspan></text>
<line x1="214.0" y1="250.0" x2="402.0" y2="154.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="792.0" y1="250.0" x2="600.0" y2="154.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="292.0" y="366.0" width="416.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="388.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">СУДДЯ — ти</tspan><tspan x="500.0" dy="16.9">питання: це те саме знання</tspan><tspan x="500.0" dy="16.9">чи випадковий збіг?</tspan></text>
<line x1="500.0" y1="364.0" x2="500.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="516.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">зважує сили</text>
<text x="500.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Закон не буває скасований рівним законом. Принципи — важелі; нічию розв'язує суддя.</text>
</svg>