<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 322" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="322" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка: побічний ефект ПЕРЕД фіксацією ключа</text>
<text x="40.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Небезпечно: ефект ПЕРЕД записом ключа</text>
<rect x="40.0" y="72.0" width="180.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="130.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">① прийняв</tspan><tspan x="130.0" dy="15.6">unlock [K]</tspan></text>
<line x1="220.0" y1="98.0" x2="248.0" y2="98.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250.0" y="72.0" width="220.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">② смикнув реле</tspan><tspan x="360.0" dy="15.6">← ЕФЕКТ стався</tspan></text>
<rect x="500.0" y="72.0" width="120.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="560.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">вікно</tspan><tspan x="560.0" dy="15.6">падіння</tspan></text>
<line x1="650.0" y1="98.0" x2="678.0" y2="98.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="72.0" width="190.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">③ записав</tspan><tspan x="775.0" dy="15.6">ключ K</tspan></text>
<text x="455.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">Падіння у вікні: реле вже смикнуло, а ключ K ще не записано —</tspan><tspan x="455.0" dy="15.6">повтор не бачить K і смикає реле ВДРУГЕ.</tspan></text>
<line x1="30.0" y1="172.0" x2="910.0" y2="172.0" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="40.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Безпечно: перевірка + запис ключа + ефект — ОДНЕ ціле</text>
<rect x="40.0" y="214.0" width="180.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="130.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">① прийняв</tspan><tspan x="130.0" dy="15.6">unlock [K]</tspan></text>
<line x1="220.0" y1="240.0" x2="248.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250.0" y="214.0" width="440.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="470.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">② ключ новий? → запис K → реле</tspan><tspan x="470.0" dy="15.6">ОДНА транзакція — неподільно</tspan></text>
<line x1="690.0" y1="240.0" x2="718.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="214.0" width="180.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="810.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">③ готово</tspan></text>
<text x="470.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Падіння — або до транзакції, або після; проміжного стану нема.</tspan><tspan x="470.0" dy="15.6">Повтор бачить K → реле спрацьовує рівно раз.</tspan></text>
</svg>