<rect x="265.0" y="26.0" width="470.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="53.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Неузгодженість імпедансів:</tspan><tspan x="500.0" dy="18.2">обʼєкти в памʼяті — не рядки в базі</tspan></text>
<line x1="430.0" y1="92.0" x2="302.0" y2="133.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="570.0" y1="92.0" x2="698.0" y2="133.0" stroke="#e08a3c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="76.0" y="136.0" width="372.0" height="58.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="262.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="262.0" dy="0.0">Ортогональна тривкість:</tspan><tspan x="262.0" dy="16.9">прибрати межу — мова сама тривка</tspan></text>
<line x1="262.0" y1="195.0" x2="262.0" y2="223.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
