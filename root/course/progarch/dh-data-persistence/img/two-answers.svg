<line x1="262.0" y1="277.0" x2="262.0" y2="313.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="76.0" y="315.0" width="372.0" height="66.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="262.0" y="337.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="262.0" dy="0.0">лишилось як ІДЕАЛ:</tspan><tspan x="262.0" dy="14.3">«прозора тривкість» у JPA/Hibernate —</tspan><tspan x="262.0" dy="14.3">той самий принцип, здобутий мостом</tspan></text>
<rect x="552.0" y="136.0" width="372.0" height="58.0" rx="6" fill="#fdf3e7" stroke="#e08a3c" stroke-width="1.5"/><text x="738.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="738.0" dy="0.0">Мейнстрім:</tspan><tspan x="738.0" dy="16.9">лишити межу, збудувати мости</tspan></text>
<line x1="738.0" y1="195.0" x2="738.0" y2="223.0" stroke="#e08a3c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="552.0" y="226.0" width="372.0" height="50.0" rx="6" fill="#fdf3e7" stroke="#e08a3c" stroke-width="1.5"/><text x="738.0" y="247.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="738.0" dy="0.0">СКБД + серіалізація + ORM</tspan><tspan x="738.0" dy="15.6">(переклад обʼєкт ↔ рядок)</tspan></text>
<line x1="738.0" y1="277.0" x2="738.0" y2="313.0" stroke="#e08a3c" stroke-width="1.8" marker-end="url(#arrow)"/>
