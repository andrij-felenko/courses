<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="240.0" y="27.0" width="400.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="60.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">мусить пережити рестарт як джерело правди?</tspan></text>
<text x="268.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">так</text>
<text x="612.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e08a3c" text-anchor="middle" font-weight="700">ні</text>
<line x1="360.0" y1="88.0" x2="250.0" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="88.0" x2="630.0" y2="150.0" stroke="#e08a3c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65.0" y="151.0" width="320.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="177.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">→ тривке сховище</tspan></text>
<rect x="75.0" y="209.0" width="300.0" height="38.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">пристрої й кімнати</tspan></text>
<rect x="75.0" y="255.0" width="300.0" height="38.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">власник і члени родини</tspan></text>
<rect x="75.0" y="301.0" width="300.0" height="38.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">поріг опалення</tspan></text>
<rect x="75.0" y="347.0" width="300.0" height="38.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="370.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">лічильник «гріємо N хв»</tspan></text>
<rect x="480.0" y="151.0" width="340.0" height="42.0" rx="6" fill="#fdf3e7" stroke="#e08a3c" stroke-width="1.5"/><text x="650.0" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">→ перечитати зі світу, не зберігати</tspan></text>
<rect x="485.0" y="209.0" width="330.0" height="38.0" rx="6" fill="#fdf3e7" stroke="#e08a3c" stroke-width="1.5"/><text x="650.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">поточна температура — з давача</tspan></text>
<rect x="485.0" y="255.0" width="330.0" height="38.0" rx="6" fill="#fdf3e7" stroke="#e08a3c" stroke-width="1.5"/><text x="650.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">«обігрівач увімкнено» — з реле</tspan></text>
<text x="650.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">світ сам тримає цю правду —</text>
<text x="650.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">її не треба дублювати на диск</text>
</svg>