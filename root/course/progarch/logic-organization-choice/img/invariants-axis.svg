<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переможця в порожнечі нема — є поріг за кількістю правил</text>
<rect x="78.0" y="108.0" width="442.0" height="248.0" rx="10" fill="#eef2fb" stroke="none" stroke-width="0.0"/>
<rect x="520.0" y="108.0" width="422.0" height="248.0" rx="10" fill="#eef7f0" stroke="none" stroke-width="0.0"/>
<line x1="520.0" y1="96.0" x2="520.0" y2="368.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,5"/>
<text x="520.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">поріг</text>
<line x1="108.0" y1="244.0" x2="906.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="292.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="292.0" dy="0.0">мало правил над даними</tspan><tspan x="292.0" dy="17.6">проста процедура чесна</tspan></text>
<text x="726.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="726.0" dy="0.0">багато правил, ще й ростуть</tspan><tspan x="726.0" dy="17.6">правило шукає дім в об'єкті</tspan></text>
<line x1="178.0" y1="262.0" x2="178.0" y2="288.2" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="178.0" cy="244.0" r="5.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="130.0" y="288.2" width="96.0" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="178.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="178.0" dy="0.0">довідник</tspan><tspan x="178.0" dy="15.6">пристроїв</tspan></text>
<line x1="312.0" y1="262.0" x2="312.0" y2="288.2" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="312.0" cy="244.0" r="5.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="264.0" y="288.2" width="96.0" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="312.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="312.0" dy="0.0">версії</tspan><tspan x="312.0" dy="15.6">прошивок</tspan></text>
<line x1="438.0" y1="262.0" x2="438.0" y2="296.0" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="438.0" cy="244.0" r="5.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="390.0" y="296.0" width="96.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="438.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="438.0" dy="0.0">звіти</tspan></text>
<line x1="712.0" y1="262.0" x2="712.0" y2="288.2" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="712.0" cy="244.0" r="5.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/>
<rect x="612.0" y="288.2" width="200.0" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="712.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="712.0" dy="0.0">життєвий цикл пристрою</tspan><tspan x="712.0" dy="15.6">(автомат станів)</tspan></text>
<text x="500.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вісь: скільки інваріантів (правил) мусять тримати ці дані  →</text>
<text x="500.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">де саме проходить поріг — вирішує стратегічний розкрій</text>
</svg>