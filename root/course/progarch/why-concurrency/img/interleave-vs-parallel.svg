<text x="510.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">обидва ядра рахують в один і той самий момент — оце і є «водночас»</text>
