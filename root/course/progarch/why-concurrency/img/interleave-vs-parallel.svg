<text x="347.1" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">будь-яка мить → працює рівно одна</text>
<text x="510.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ядро завжди зайняте — лише міняє власника; за кожну мить біжить одна задача</text>
<text x="510.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ДВА ЯДРА: справді водночас = паралелізм</text>
<text x="134.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">ядро 1</text>
<text x="134.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">ядро 2</text>
<rect x="150.0" y="331.0" width="730.0" height="26.0" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="162.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700">задача A біжить увесь час →</text>
