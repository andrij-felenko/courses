<text x="162.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700">задача B біжить увесь час →</text>
<line x1="675.6" y1="326.0" x2="675.6" y2="402.0" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,5"/>
