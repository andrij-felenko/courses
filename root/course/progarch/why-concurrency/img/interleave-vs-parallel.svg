<text x="134.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">задача C</text>
<rect x="405.5" y="181.0" width="109.5" height="26.0" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
