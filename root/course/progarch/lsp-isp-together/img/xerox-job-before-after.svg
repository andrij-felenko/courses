<rect x="697.7" y="322.2" width="204.7" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="800.0" y="342.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Job</tspan><tspan x="800.0" dy="15.6">реалізує всі три інтерфейси</tspan></text>
<text x="800.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">зміна торкається лише свого інтерфейсу — інші клієнти незворушні</text>
<rect x="90.0" y="448.0" width="900.0" height="58.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="540.0" y="473.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Ліки: перед єдиним Job — вузький інтерфейс на кожен тип задачі (PrintJob, StapleJob, …), і клієнт залежить лише від свого.</tspan><tspan x="540.0" dy="15.6">Один клас Job реалізує їх усі; напрям залежності перевернуто через DIP, тож зміна більше не тягне за собою чужих клієнтів.</tspan></text>
