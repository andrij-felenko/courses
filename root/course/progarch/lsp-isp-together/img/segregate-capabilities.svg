<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розріз по здатностях лікує обидві рани одним рухом</text>
<text x="260.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ДО: один товстий IDevice</text>
<text x="740.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ПІСЛЯ: вузькі здатності</text>
<text x="740.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Readable · Switchable · Lockable · Streamable</text>
<line x1="500.0" y1="96.0" x2="500.0" y2="348.0" stroke="#c8ced6" stroke-width="1.4"/>
<rect x="46.0" y="136.0" width="424.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="258.0" y="169.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">Датчик t°  —  чесно read()  ·  turnOn / lock / stream: throw</tspan></text>
<rect x="46.0" y="208.0" width="424.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="258.0" y="242.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">Розетка  —  чесно turnOn / read  ·  lock / stream: throw</tspan></text>
<rect x="46.0" y="280.0" width="424.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="258.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">Камера  —  чесно startStream  ·  read / turnOn / lock: throw</tspan></text>
<rect x="528.0" y="136.0" width="424.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Датчик t°   →   Readable</tspan></text>
<rect x="528.0" y="208.0" width="424.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="242.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Розетка   →   Readable + Switchable</tspan></text>
<rect x="528.0" y="280.0" width="424.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Камера   →   Streamable</tspan></text>
<rect x="70.0" y="372.0" width="860.0" height="66.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="500.0" y="401.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Той самий розріз прибрав вимушену реалізацію (ISP ✓) і повернув чесну підстановку (LSP ✓):</tspan><tspan x="500.0" dy="16.9">жоден пристрій уже не стоїть за обіцянкою, якої не тримає, — а клієнт питає рівно ту здатність, що потрібна.</tspan></text>
</svg>