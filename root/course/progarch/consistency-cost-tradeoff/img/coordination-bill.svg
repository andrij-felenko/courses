<line x1="527.0" y1="248.0" x2="715.5" y2="248.0" stroke="#dfe4e9" stroke-width="1.2"/>
<rect x="523.0" y="258.0" width="196.5" height="190.0" rx="6" fill="#ffffff" stroke="#eef1f4" stroke-width="1.5"/><text x="621.2" y="302.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="621.2" dy="0.0">єдиний глобальний</tspan><tspan x="621.2" dy="15.6">порядок серіалізує</tspan><tspan x="621.2" dy="15.6">гарячий ключ:</tspan><tspan x="621.2" dy="15.6">один пише — інші</tspan><tspan x="621.2" dy="15.6">чекають.</tspan><tspan x="621.2" dy="15.6"></tspan><tspan x="621.2" dy="15.6">закон Амдала</tspan><tspan x="621.2" dy="15.6">на гарячих даних</tspan></text>
<rect x="753.5" y="210.0" width="220.5" height="250.0" rx="10" fill="#eef1f4" stroke="#6b7280" stroke-width="2.2"/>
<text x="863.8" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">ГРОШІ Й СКЛАДНІСТЬ</text>
<line x1="769.5" y1="248.0" x2="958.0" y2="248.0" stroke="#dfe4e9" stroke-width="1.2"/>
<rect x="765.5" y="258.0" width="196.5" height="190.0" rx="6" fill="#ffffff" stroke="#eef1f4" stroke-width="1.5"/><text x="863.8" y="302.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="863.8" dy="0.0">кворум — це більше</tspan><tspan x="863.8" dy="15.6">вузлів; консенсус —</tspan><tspan x="863.8" dy="15.6">непарні 3–5 у синхроні;</tspan><tspan x="863.8" dy="15.6">крос-регіон-лінки</tspan><tspan x="863.8" dy="15.6">платні.</tspan><tspan x="863.8" dy="15.6"></tspan><tspan x="863.8" dy="15.6">+ важче тримати</tspan><tspan x="863.8" dy="15.6">в голові</tspan></text>
