<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один корінь, чотири обличчя: усі ціни консистентності — з координації</text>
<line x1="500.0" y1="127.2" x2="136.2" y2="204.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
