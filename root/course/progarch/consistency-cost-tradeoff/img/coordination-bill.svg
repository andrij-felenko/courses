<line x1="500.0" y1="127.2" x2="863.8" y2="204.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="372.8" y="56.8" width="254.4" height="70.4" rx="6" fill="#eef1f4" stroke="#1a1a1a" stroke-width="2.4"/><text x="500.0" y="78.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">КООРДИНАЦІЯ</tspan><tspan x="500.0" dy="18.2">узгодження перед відповіддю</tspan><tspan x="500.0" dy="18.2">— єдиний корінь усіх цін —</tspan></text>
<rect x="26.0" y="210.0" width="220.5" height="250.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="136.2" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ЗАТРИМКА</text>
<line x1="42.0" y1="248.0" x2="230.5" y2="248.0" stroke="#dfe4e9" stroke-width="1.2"/>
<rect x="38.0" y="258.0" width="196.5" height="190.0" rx="6" fill="#ffffff" stroke="#eef1f4" stroke-width="1.5"/><text x="136.2" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="136.2" dy="0.0">раунд-тріпи мають</tspan><tspan x="136.2" dy="15.6">фізичну підлогу —</tspan><tspan x="136.2" dy="15.6">сигнал не швидший</tspan><tspan x="136.2" dy="15.6">за світло.</tspan><tspan x="136.2" dy="15.6"></tspan><tspan x="136.2" dy="15.6">податок на КОЖНІЙ</tspan><tspan x="136.2" dy="15.6">операції, навіть коли</tspan><tspan x="136.2" dy="15.6">мережа справна.</tspan><tspan x="136.2" dy="15.6"></tspan><tspan x="136.2" dy="15.6">PACELC: гілка «Else»</tspan></text>
<rect x="268.5" y="210.0" width="220.5" height="250.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="378.8" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ДОСТУПНІСТЬ</text>
<line x1="284.5" y1="248.0" x2="473.0" y2="248.0" stroke="#dfe4e9" stroke-width="1.2"/>
<rect x="280.5" y="258.0" width="196.5" height="190.0" rx="6" fill="#ffffff" stroke="#eef1f4" stroke-width="1.5"/><text x="378.8" y="294.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="378.8" dy="0.0">відрізаний вузол</tspan><tspan x="378.8" dy="15.6">мусить відмовити,</tspan><tspan x="378.8" dy="15.6">щоб не збрехати.</tspan><tspan x="378.8" dy="15.6"></tspan><tspan x="378.8" dy="15.6">мережевий збій</tspan><tspan x="378.8" dy="15.6">стає простоєм.</tspan><tspan x="378.8" dy="15.6"></tspan><tspan x="378.8" dy="15.6">CAP: під розривом</tspan><tspan x="378.8" dy="15.6">обирай C або A</tspan></text>
