<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять фаз життєвого циклу Expand-Contract для бази даних та API</text>
<rect x="20.0" y="50.0" width="160.0" height="330.0" rx="8" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="100.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Base State</text>
<text x="100.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема v1</text>
<line x1="30.0" y1="125.0" x2="170.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="100.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">Читання й запис лише в старих полях</tspan></text>
<rect x="35.0" y="270.0" width="130.0" height="80.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="100.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">[ v1_col ]</text>
<line x1="180.0" y1="215.0" x2="205.0" y2="215.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="205.0" y="50.0" width="160.0" height="330.0" rx="8" fill="#e8f4f8" stroke="#1b6ec2" stroke-width="1.8"/>
<text x="285.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b6ec2" text-anchor="middle" font-weight="700">2. Expand</text>
<text x="285.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Додано v2</text>
<line x1="215.0" y1="125.0" x2="355.0" y2="125.0" stroke="#1b6ec2" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="285.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Нові колонки додано в БД (nullable)</tspan></text>
<rect x="220.0" y="270.0" width="130.0" height="80.0" rx="6" fill="#ffffff" stroke="#1b6ec2" stroke-width="1.2"/>
<text x="285.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">[ v1_col ]</text>
<text x="285.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b6ec2" text-anchor="middle" font-weight="700">+ [ v2_col ]</text>
<line x1="365.0" y1="215.0" x2="390.0" y2="215.0" stroke="#1b6ec2" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="390.0" y="50.0" width="160.0" height="330.0" rx="8" fill="#fff3cd" stroke="#d97706" stroke-width="1.8"/>
<text x="470.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">3. Dual-Write</text>
<text x="470.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійний запис</text>
<line x1="400.0" y1="125.0" x2="540.0" y2="125.0" stroke="#d97706" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="470.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Код пише у v1 і v2, бекфілл даних</tspan></text>
<rect x="405.0" y="270.0" width="130.0" height="80.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="470.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Write -&gt; v1</text>
<text x="470.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Write -&gt; v2</text>
<line x1="550.0" y1="215.0" x2="575.0" y2="215.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="575.0" y="50.0" width="160.0" height="330.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="655.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">4. Read Switch</text>
<text x="655.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перемикання</text>
<line x1="585.0" y1="125.0" x2="725.0" y2="125.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="655.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Код читає з v2, фолбек на v1</tspan></text>
<rect x="590.0" y="270.0" width="130.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="655.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Read &lt;- v2</text>
<text x="655.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(fallback v1)</text>
<line x1="735.0" y1="215.0" x2="760.0" y2="215.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="50.0" width="160.0" height="330.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="840.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">5. Contract</text>
<text x="840.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Очищення</text>
<line x1="770.0" y1="125.0" x2="910.0" y2="125.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="840.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Видалено v1, міграцію завершено</tspan></text>
<rect x="775.0" y="270.0" width="130.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="840.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">[ v2_col ]</text>
</svg>