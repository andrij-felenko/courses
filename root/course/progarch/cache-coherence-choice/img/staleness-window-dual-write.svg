<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема подвійного запису та вікно несвіжості кешу</text>
<rect x="320.0" y="20.0" width="400.0" height="36.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="43.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Проблема подвійного запису та зомбі-кеш</tspan></text>
<rect x="30.0" y="70.0" width="470.0" height="340.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="244.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0"></tspan></text>
<rect x="50.0" y="85.0" width="430.0" height="32.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="105.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Сценарій збою при прямому подвійному записі</tspan></text>
<rect x="50.0" y="140.0" width="110.0" height="80.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="105.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">Клієнт /</tspan><tspan x="105.0" dy="16.9">Сервіс А</tspan></text>
<rect x="240.0" y="130.0" width="110.0" height="50.0" rx="6" fill="#e7f6ec" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">Первинна БД</tspan><tspan x="295.0" dy="16.9">(DB v2)</tspan></text>
<rect x="360.0" y="185.0" width="110.0" height="50.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="415.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">Розподілений</tspan><tspan x="415.0" dy="16.9">Кеш (v1)</tspan></text>
<line x1="160.0" y1="155.0" x2="240.0" y2="155.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="200.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">1. Commit OK</text>
<line x1="160.0" y1="195.0" x2="360.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">2. Cache.delete() ❌ Збій мережі / crash</text>
<rect x="60.0" y="230.0" width="410.0" height="80.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">⚠️ РЕЗУЛЬТАТ: ЗОМБІ-КЕШ</tspan><tspan x="265.0" dy="15.6">База даних має v2, а кеш назавжди застряг на v1!</tspan><tspan x="265.0" dy="15.6">Вікно несвіжості W нескінченне (до закінчення TTL).</tspan></text>
<rect x="60.0" y="325.0" width="410.0" height="65.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="265.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="265.0" dy="0.0">Причина: Запис у БД та видалення з кешу в прикладному коді</tspan><tspan x="265.0" dy="14.3">НЕ є атомарною транзакцією (немає 2PC між DB та Redis).</tspan></text>
<rect x="540.0" y="70.0" width="470.0" height="340.0" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/><text x="775.0" y="244.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0"></tspan></text>
<rect x="560.0" y="85.0" width="430.0" height="32.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="775.0" y="105.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e08a1e" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Вплив на сервіси-споживачі (Staleness Window)</tspan></text>
<rect x="560.0" y="135.0" width="110.0" height="60.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="615.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Сервіс Б</tspan><tspan x="615.0" dy="16.9">(Читач)</tspan></text>
<rect x="730.0" y="135.0" width="110.0" height="60.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="785.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Розподілений</tspan><tspan x="785.0" dy="16.9">Кеш</tspan></text>
<rect x="880.0" y="135.0" width="110.0" height="60.0" rx="6" fill="#e7f6ec" stroke="#c0392b" stroke-width="1.5"/><text x="935.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Первинна БД</tspan><tspan x="935.0" dy="16.9">(Джерела)</tspan></text>
<line x1="670.0" y1="150.0" x2="730.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1. Get(key)</text>
<line x1="730.0" y1="175.0" x2="670.0" y2="175.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle">2. Hit: stale v1!</text>
<line x1="615.0" y1="195.0" x2="615.0" y2="215.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="615.0" y1="215.0" x2="935.0" y2="215.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="935.0" y1="215.0" x2="935.0" y2="195.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="775.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3. Запит до БД оминуто (Cache Hit)</text>
<rect x="570.0" y="230.0" width="420.0" height="80.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="780.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">⚡ ВІКНО НЕСВІЖОСТІ W = T_read - T_write</tspan><tspan x="780.0" dy="15.6">Сервіс Б виконує бізнес-логіку на застарілому стані v1,</tspan><tspan x="780.0" dy="15.6">ігноруючи актуальні дані v2 у первинній БД.</tspan></text>
<rect x="570.0" y="325.0" width="420.0" height="65.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="780.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="780.0" dy="0.0">Критичний ризик: Акредитиви, ціни, права доступу та адреси</tspan><tspan x="780.0" dy="14.3">обробляються з помилками через запізнення когерентності.</tspan></text>
</svg>