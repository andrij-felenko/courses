<rect x="318.1" y="108.2" width="67.9" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="352.0" y="128.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="352.0" dy="0.0">сервіс-</tspan><tspan x="352.0" dy="15.6">ресурс</tspan></text>
<line x1="199.0" y1="132.0" x2="319.0" y2="132.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="217.7" y="89.5" width="82.7" height="31.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="259.0" y="108.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="259.0" dy="0.0">JWT: заява</tspan></text>
<text x="245.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">заява про суб'єкта (користувача)</text>
<text x="245.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">сервіс звіряє печатку і вірить,</tspan><tspan x="245.0" dy="15.6">не дзвонячи назад видавцеві</tspan></text>
<text x="245.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">самодостатній лист через межу довіри</text>
<text x="245.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">JWT пасує ✓</text>
<text x="735.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди притягли — жива сесія</text>
<rect x="609.5" y="116.0" width="61.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">сервер</tspan></text>
<rect x="798.1" y="116.0" width="67.9" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="832.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="832.0" dy="0.0">браузер</tspan></text>
<line x1="677.0" y1="132.0" x2="791.0" y2="132.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="689.5" y="89.5" width="89.0" height="31.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="734.0" y="108.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">«це ще ти?»</tspan></text>
<text x="734.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">знову й знову, той самий клієнт</text>
<text x="734.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">треба вміти вимкнути ЗАРАЗ</tspan><tspan x="734.0" dy="15.6">(вихід, крадіжка, забрали право)</tspan></text>
<text x="734.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">а підписаний лист нема де скасувати</text>
<text x="734.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">мінлива правда, та сама сторона</text>
<text x="734.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">JWT не пасує ✗</text>
