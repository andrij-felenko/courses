<line x1="490.0" y1="66.0" x2="490.0" y2="384.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,5"/>
<text x="245.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Для чого зроблено — заява між сторонами</text>
