<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як JWT занесло в сесії — і винесло назад</text>
<line x1="310.0" y1="82.0" x2="310.0" y2="660.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="310.0" cy="120.0" r="10.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="280.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700"><tspan x="280.0" dy="0.0">жовтень</tspan><tspan x="280.0" dy="18.2">2012</tspan></text>
<text x="342.0" y="107.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="342.0" dy="0.0">OAuth 2.0 (RFC 6749, ред. Д. Гардт):</tspan><tspan x="342.0" dy="16.9">access + refresh — для делегованого</tspan><tspan x="342.0" dy="16.9">доступу до ЧУЖОГО ресурсу</tspan></text>
<circle cx="310.0" cy="248.0" r="10.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="280.0" y="242.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="280.0" dy="0.0">травень</tspan><tspan x="280.0" dy="18.2">2015</tspan></text>
<text x="342.0" y="235.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="342.0" dy="0.0">JWT (RFC 7519, родина JOSE):</tspan><tspan x="342.0" dy="16.9">підписаний самодостатній конверт</tspan><tspan x="342.0" dy="16.9">ЗАЯВ між двома сторонами</tspan></text>
<circle cx="310.0" cy="376.0" r="10.0" fill="#e08a00" stroke="#e08a00" stroke-width="1.5"/>
<text x="280.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e08a00" text-anchor="end" font-weight="700"><tspan x="280.0" dy="0.0">2015–16</tspan></text>
<text x="342.0" y="363.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="342.0" dy="0.0">хвиля «автентифікація без стану»:</tspan><tspan x="342.0" dy="16.9">SPA · мікросервіси · серверлес · вендори</tspan><tspan x="342.0" dy="16.9">«без серверних сесій, масштаб задарма»</tspan></text>
<circle cx="310.0" cy="504.0" r="10.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="280.0" y="498.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700"><tspan x="280.0" dy="0.0">червень</tspan><tspan x="280.0" dy="18.2">2016</tspan></text>
<text x="342.0" y="491.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="342.0" dy="0.0">Свен Слотвег (joepie91): «Годі</tspan><tspan x="342.0" dy="16.9">використовувати JWT для сесій» + ч.2 —</tspan><tspan x="342.0" dy="16.9">JWT не сховище сесій, його не відкликати</tspan></text>
<circle cx="310.0" cy="632.0" r="10.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="280.0" y="636.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700"><tspan x="280.0" dy="0.0">згодом</tspan></text>
<text x="342.0" y="619.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="342.0" dy="0.0">консенсус: серверні сесії — дефолт</tspan><tspan x="342.0" dy="16.9">браузерної автентифікації; JWT /</tspan><tspan x="342.0" dy="16.9">access + refresh — крос-сервіс, API, OAuth2</tspan></text>
</svg>