<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Модель розкриття дефектів RIPR та мутаційний аналіз</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Пасивне рядкове покриття фіксує лише досяжність, мутації перевіряють повний ланцюг до асерта</text>

  <!-- Стовпець 1: Reachability -->
  <!-- Етап 1 (Заголовок) -->
  <rect x="24" y="68" width="214" height="78" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="34" y="87" font-size="13" font-weight="bold" fill="#2457d6">1. Reachability</text>
  <text x="34" y="104" font-size="12" font-weight="bold" fill="#1a1a1a">Досяжність дефекту</text>
  <text x="34" y="122" font-size="12" fill="#6b7280">Тест спрямовує потік</text>
  <text x="34" y="139" font-size="12" fill="#6b7280">до рядка з мутацією</text>

  <!-- Трек 1: Рядкове покриття -->
  <rect x="24" y="154" width="214" height="88" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="34" y="173" font-size="12" font-weight="bold" fill="#27ae60">Рядок виконано (+1)</text>
  <text x="34" y="191" font-size="12" fill="#1a1a1a">Виклик методу в тесті:</text>
  <text x="34" y="209" font-size="12" fill="#1a1a1a">service.calc(100, F, 0)</text>
  <text x="34" y="229" font-size="12" font-weight="bold" fill="#27ae60">Лічильник зараховано</text>

  <!-- Трек 2: Мутаційне тестування -->
  <rect x="24" y="250" width="214" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="34" y="269" font-size="12" font-weight="bold" fill="#2457d6">Мутант активований</text>
  <text x="34" y="287" font-size="12" fill="#1a1a1a">Штучна зміна в коді:</text>
  <text x="34" y="305" font-size="12" fill="#c0392b">знак замінено на протилежний</text>
  <text x="34" y="325" font-size="12" fill="#1a1a1a">Мутований рядок</text>
  <text x="34" y="342" font-size="12" fill="#2457d6">отримує вхідні дані</text>

  <!-- Стовпець 2: Infection -->
  <!-- Етап 2 (Заголовок) -->
  <rect x="254" y="68" width="214" height="78" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="264" y="87" font-size="13" font-weight="bold" fill="#2457d6">2. Infection</text>
  <text x="264" y="104" font-size="12" font-weight="bold" fill="#1a1a1a">Інфікування стану</text>
  <text x="264" y="122" font-size="12" fill="#6b7280">Виконання мутації</text>
  <text x="264" y="139" font-size="12" fill="#6b7280">спотворює змінні</text>

  <!-- Трек 1: Рядкове покриття -->
  <rect x="254" y="154" width="214" height="88" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="264" y="173" font-size="12" font-weight="bold" fill="#c0392b">Сліпа зона</text>
  <text x="264" y="191" font-size="12" fill="#1a1a1a">Не перевіряє стан</text>
  <text x="264" y="209" font-size="12" fill="#1a1a1a">об'єкта чи змінних.</text>
  <text x="264" y="229" font-size="12" fill="#c0392b">Збій не фіксується</text>

  <!-- Трек 2: Мутаційне тестування -->
  <rect x="254" y="250" width="214" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="264" y="269" font-size="12" font-weight="bold" fill="#2457d6">Стан інфіковано</text>
  <text x="264" y="287" font-size="12" fill="#1a1a1a">discount = 0.0</text>
  <text x="264" y="305" font-size="12" fill="#6b7280">(замість знижки 15%)</text>
  <text x="264" y="325" font-size="12" fill="#1a1a1a">Внутрішній стан</text>
  <text x="264" y="342" font-size="12" fill="#c0392b">став некоректним</text>

  <!-- Стовпець 3: Propagation -->
  <!-- Етап 3 (Заголовок) -->
  <rect x="484" y="68" width="214" height="78" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="494" y="87" font-size="13" font-weight="bold" fill="#2457d6">3. Propagation</text>
  <text x="494" y="104" font-size="12" font-weight="bold" fill="#1a1a1a">Розповсюдження</text>
  <text x="494" y="122" font-size="12" fill="#6b7280">Спотворений стан</text>
  <text x="494" y="139" font-size="12" fill="#6b7280">доходить до виходу</text>

  <!-- Трек 1: Рядкове покриття -->
  <rect x="484" y="154" width="214" height="88" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="494" y="173" font-size="12" font-weight="bold" fill="#c0392b">Сліпа зона</text>
  <text x="494" y="191" font-size="12" fill="#1a1a1a">Не стежить за тим,</text>
  <text x="494" y="209" font-size="12" fill="#1a1a1a">що повертає метод.</text>
  <text x="494" y="229" font-size="12" fill="#c0392b">Дані не перевірені</text>

  <!-- Трек 2: Мутаційне тестування -->
  <rect x="484" y="250" width="214" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="494" y="269" font-size="12" font-weight="bold" fill="#2457d6">Помилка на виході</text>
  <text x="494" y="287" font-size="12" fill="#1a1a1a">total = 100.0</text>
  <text x="494" y="305" font-size="12" fill="#6b7280">(очікувалось 85.0)</text>
  <text x="494" y="325" font-size="12" fill="#1a1a1a">Спотворене число</text>
  <text x="494" y="342" font-size="12" fill="#2457d6">дійшло до оракула</text>

  <!-- Стовпець 4: Revealability -->
  <!-- Етап 4 (Заголовок) -->
  <rect x="714" y="68" width="222" height="78" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="724" y="87" font-size="13" font-weight="bold" fill="#2457d6">4. Revealability</text>
  <text x="724" y="104" font-size="12" font-weight="bold" fill="#1a1a1a">Розкриття оракулом</text>
  <text x="724" y="122" font-size="12" fill="#6b7280">Твердження assert</text>
  <text x="724" y="139" font-size="12" fill="#6b7280">порівнює з еталоном</text>

  <!-- Трек 1: Рядкове покриття -->
  <rect x="714" y="154" width="222" height="88" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="724" y="173" font-size="12" font-weight="bold" fill="#c0392b">Провал верифікації</text>
  <text x="724" y="191" font-size="12" fill="#1a1a1a">assert res &gt; 0 пройшов</text>
  <text x="724" y="209" font-size="12" fill="#1a1a1a">Формальний асерт!</text>
  <text x="724" y="229" font-size="12" font-weight="bold" fill="#c0392b">Мутант вижив (FAIL)</text>

  <!-- Трек 2: Мутаційне тестування -->
  <rect x="714" y="250" width="222" height="100" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="724" y="269" font-size="12" font-weight="bold" fill="#27ae60">Мутант убитий!</text>
  <text x="724" y="287" font-size="12" fill="#1a1a1a">assert res == 85.0</text>
  <text x="724" y="305" font-size="12" fill="#c0392b">100.0 != 85.0 (ERROR)</text>
  <text x="724" y="325" font-size="12" fill="#1a1a1a">Тест зупинено,</text>
  <text x="724" y="342" font-size="12" font-weight="bold" fill="#27ae60">дефект розкрито!</text>

  <!-- З'ЄДНУВАЛЬНІ СТРІЛКИ В ПРОСВІТАХ -->
  <!-- Верхній ряд (RIPR ланцюг) у просвітах y=107 -->
  <line x1="238" y1="107" x2="252" y2="107" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="468" y1="107" x2="482" y2="107" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="698" y1="107" x2="712" y2="107" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Середній ряд (Покриття - обрив перевірки) у просвітах y=198 -->
  <line x1="238" y1="198" x2="252" y2="198" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="468" y1="198" x2="482" y2="198" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="698" y1="198" x2="712" y2="198" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Нижній ряд (Мутації - повний ланцюг) у просвітах y=300 -->
  <line x1="238" y1="300" x2="252" y2="300" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="468" y1="300" x2="482" y2="300" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="698" y1="300" x2="712" y2="300" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- НИЖНІ ПІДСУМКОВІ КАРТКИ -->
  <!-- Ліва картка (Ілюзія покриття) -->
  <rect x="24" y="362" width="444" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="36" y="382" font-size="13" font-weight="bold" fill="#c0392b">ІЛЮЗІЯ ПОКРИТТЯ (Line Coverage = 100%):</text>
  <text x="36" y="401" font-size="12" fill="#1a1a1a">Фіксує лише крок Reachability (факт виклику коду).</text>
  <text x="36" y="419" font-size="12" fill="#1a1a1a">Пропускає порожні асерти; мутанти виживають у системі.</text>
  <text x="36" y="435" font-size="12" fill="#6b7280">100% покриття створює оманливе враження надійності.</text>

  <!-- Права картка (Мутаційний аналіз) -->
  <rect x="484" y="362" width="452" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="496" y="382" font-size="13" font-weight="bold" fill="#27ae60">МУТАЦІЙНИЙ АНАЛІЗ (Mutation Testing):</text>
  <text x="496" y="401" font-size="12" fill="#1a1a1a">Перевіряє повний ланцюг: Reach до Infect до Propagate.</text>
  <text x="496" y="419" font-size="12" fill="#1a1a1a">Вимагає суворих асертів у точці виклику (Revealability).</text>
  <text x="496" y="435" font-size="12" font-weight="bold" fill="#27ae60">Вбитий мутант підтверджує справжню стійкість тестів.</text>
</svg>
