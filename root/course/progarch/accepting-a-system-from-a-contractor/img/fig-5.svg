<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Економічна оптимізація тестування: знаходження точки Delta t_opt</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Баланс витрат на тестування та ризику аварій: мінімізація сукупної вартості володіння системою</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: ГОЛОВНИЙ ГРАФІК ВИТРАТ ================= -->
  <rect x="25" y="68" width="560" height="304" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="305" y="88" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Оптимізація вартості тестування C(Delta t)</text>
  <text x="305" y="104" font-size="12" fill="#6b7280" text-anchor="middle">Сукупні витрати: C_total = C_тестів + C_ризику відмов</text>

  <!-- Підписи зон над графіком -->
  <text x="197" y="119" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона недотестування</text>
  <text x="432" y="119" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Зона перетестування</text>

  <!-- Зони графіка -->
  <rect x="85" y="125" width="225" height="150" fill="#fdecea" fill-opacity="0.6"/>
  <rect x="310" y="125" width="245" height="150" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Сітка графіка -->
  <line x1="85" y1="125" x2="555" y2="125" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="85" y1="175" x2="555" y2="175" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="85" y1="225" x2="555" y2="225" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="85" y1="275" x2="555" y2="275" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="85" y1="125" x2="85" y2="275" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Y-ticks ліворуч -->
  <text x="75" y="129" font-size="12" fill="#6b7280" text-anchor="end">Високі</text>
  <text x="75" y="179" font-size="12" fill="#6b7280" text-anchor="end">C_min</text>
  <text x="75" y="279" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- X-ticks ліворуч -->
  <text x="85" y="295" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="310" y="295" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Delta t_opt</text>
  <text x="540" y="295" font-size="12" fill="#6b7280" text-anchor="middle">Delta t_max</text>
  <text x="310" y="314" font-size="12" fill="#6b7280" text-anchor="middle">Тривалість додаткового тестування (Delta t)</text>

  <!-- Вертикальна лінія оптимуму -->
  <line x1="310" y1="125" x2="310" y2="275" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 1. Крива C_ризику (спадаюча червона) -->
  <polyline points="85,140 160,185 235,220 310,245 420,262 530,270" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="85" cy="140" r="3" fill="#c0392b"/>
  <circle cx="310" cy="245" r="3" fill="#c0392b"/>

  <!-- 2. Крива C_тестів (зростаюча синя) -->
  <polyline points="85,275 160,252 235,228 310,205 420,172 530,140" fill="none" stroke="#2457d6" stroke-width="2"/>
  <circle cx="85" cy="275" r="3" fill="#2457d6"/>
  <circle cx="310" cy="205" r="3" fill="#2457d6"/>

  <!-- 3. Крива C_total (сукупні витрати: U-подібна) -->
  <polyline points="85,140 160,162 235,173 310,175 420,159 530,135" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="310" cy="175" r="5" fill="#27ae60" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Легенда лівої панелі -->
  <text x="85" y="336" font-size="12" font-weight="bold" fill="#2457d6">— C_тестів (Витрати)</text>
  <text x="255" y="336" font-size="12" font-weight="bold" fill="#c0392b">-- C_ризику (Збитки)</text>
  <text x="425" y="336" font-size="12" font-weight="bold" fill="#1a1a1a">— C_total (Сума)</text>
  <text x="305" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Точка Delta t_opt: глобальний мінімум вартості приймання</text>

  <!-- ================= ПРАВА ПАНЕЛЬ: 3 ЗОНИ РІШЕНЬ ================= -->
  <!-- Картка 1: Недотестування -->
  <rect x="605" y="68" width="330" height="94" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="617" y="88" font-size="12" font-weight="bold" fill="#c0392b">1. Недотестування (Delta t &lt; opt)</text>
  <text x="617" y="108" font-size="12" fill="#1a1a1a">Збитки від аварій у проді значно</text>
  <text x="617" y="126" font-size="12" fill="#1a1a1a">перевищують економію на тестах.</text>
  <text x="617" y="144" font-size="12" fill="#6b7280">Критичний ризик зриву приймання.</text>

  <!-- Картка 2: Оптимум -->
  <rect x="605" y="173" width="330" height="94" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="617" y="193" font-size="12" font-weight="bold" fill="#27ae60">2. Точка зупинки (Delta t = opt)</text>
  <text x="617" y="213" font-size="12" fill="#1a1a1a">Глобальний мінімум сукупних витрат.</text>
  <text x="617" y="231" font-size="12" fill="#1a1a1a">Гранична вартість тесту = ризикам.</text>
  <text x="617" y="249" font-size="12" font-weight="bold" fill="#27ae60">Оптимальний момент підписання акта.</text>

  <!-- Картка 3: Перетестування -->
  <rect x="605" y="278" width="330" height="94" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="617" y="298" font-size="12" font-weight="bold" fill="#6b7280">3. Перетестування (Delta t &gt; opt)</text>
  <text x="617" y="318" font-size="12" fill="#1a1a1a">Вартість пошуку рідкісних дефектів</text>
  <text x="617" y="336" font-size="12" fill="#1a1a1a">вища за можливі збитки від них.</text>
  <text x="617" y="354" font-size="12" fill="#6b7280">Невиправдане спалювання бюджету.</text>

  <!-- ================= НИЖНІЙ БАР'ЄР ПРИЙМАННЯ ================= -->
  <rect x="25" y="380" width="910" height="62" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="404" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Економічне правило зупинки тестування (Stopping Rule)</text>
  <text x="480" y="426" font-size="12" fill="#2457d6" text-anchor="middle">Акт приймання підписується в точці Delta t_opt, де швидкість зниження очікуваних втрат зрівнюється з вартістю тестування</text>
</svg>
