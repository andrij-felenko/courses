  <rect x="248" y="114" width="232" height="322" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="258" y="134" font-size="13" font-weight="bold" fill="#2457d6">2. components[]</text>
  <text x="258" y="150" font-size="12" fill="#6b7280">Реєстр усіх бібліотек</text>
  <line x1="258" y1="158" x2="470" y2="158" stroke="#eaf0fd" stroke-width="1"/>
  <text x="258" y="178" font-size="12" font-weight="bold" fill="#1a1a1a">bom-ref (унікальний ID):</text>
  <text x="258" y="196" font-size="12" fill="#2457d6">pkg:pypi/urllib3@2.0.7</text>
  <text x="258" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">purl (Package URL):</text>
  <text x="258" y="238" font-size="12" fill="#1a1a1a">pkg:pypi/requests@2.31.0</text>
  <text x="258" y="262" font-size="12" font-weight="bold" fill="#1a1a1a">hashes (контрольні суми):</text>
  <text x="258" y="280" font-size="12" fill="#27ae60">alg: "SHA-256", val: "94c8..."</text>
  <text x="258" y="304" font-size="12" font-weight="bold" fill="#1a1a1a">licenses (SPDX каталог):</text>
  <text x="258" y="322" font-size="12" fill="#27ae60">id: "Apache-2.0" (чисто)</text>
  <text x="258" y="340" font-size="12" fill="#6b7280">scope: "required"</text>
  <rect x="256" y="380" width="216" height="46" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="264" y="398" font-size="12" font-weight="bold" fill="#27ae60">ПАСПОРТ МОДУЛЯ:</text>
  <text x="264" y="416" font-size="12" fill="#1a1a1a">Хеш, версія та ліцензія</text>

  <!-- РОЗДІЛ 3: dependencies[] -->
  <rect x="494" y="114" width="214" height="322" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="504" y="134" font-size="13" font-weight="bold" fill="#2457d6">3. dependencies[]</text>
  <text x="504" y="150" font-size="12" fill="#6b7280">Орієнтований граф DAG</text>
  <line x1="504" y1="158" x2="698" y2="158" stroke="#eaf0fd" stroke-width="1"/>
  <text x="504" y="178" font-size="12" font-weight="bold" fill="#1a1a1a">Вузол графа (ref):</text>
  <text x="504" y="196" font-size="12" fill="#2457d6">ref: "pkg:pypi/requests"</text>
  <text x="504" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">dependsOn (масив ребер):</text>
  <text x="504" y="238" font-size="12" fill="#1a1a1a">• "pkg:pypi/urllib3"</text>
  <text x="504" y="256" font-size="12" fill="#1a1a1a">• "pkg:pypi/certifi"</text>
  <text x="504" y="274" font-size="12" fill="#1a1a1a">• "pkg:pypi/idna"</text>
  <text x="504" y="298" font-size="12" font-weight="bold" fill="#1a1a1a">Транзитивність:</text>
  <text x="504" y="316" font-size="12" fill="#1a1a1a">App до Service до Lib</text>
  <text x="504" y="334" font-size="12" fill="#6b7280">Детекція прихованих ребер</text>
  <text x="504" y="352" font-size="12" fill="#c0392b">Заборона циклів у графі</text>
  <rect x="502" y="380" width="198" height="46" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="510" y="398" font-size="12" font-weight="bold" fill="#2457d6">ДЕРЕВО ПОСТАЧАННЯ:</text>
  <text x="510" y="416" font-size="12" fill="#1a1a1a">Прямі та непрямі зв'язки</text>

  <!-- РОЗДІЛ 4: vulnerabilities[] -->
  <rect x="722" y="114" width="218" height="322" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="732" y="134" font-size="13" font-weight="bold" fill="#c0392b">4. vulnerabilities[]</text>
  <text x="732" y="150" font-size="12" fill="#6b7280">Вразливості та VEX</text>
  <line x1="732" y1="158" x2="930" y2="158" stroke="#fdecea" stroke-width="1"/>
  <text x="732" y="178" font-size="12" font-weight="bold" fill="#c0392b">id: "CVE-2023-32681"</text>
  <text x="732" y="196" font-size="12" fill="#6b7280">source: NVD / OSV.dev</text>
  <text x="732" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">ratings (CVSS):</text>
  <text x="732" y="238" font-size="12" font-weight="bold" fill="#c0392b">score: 7.5 (HIGH)</text>
  <text x="732" y="262" font-size="12" font-weight="bold" fill="#1a1a1a">affects (прив'язка):</text>
  <text x="732" y="280" font-size="12" fill="#2457d6">ref: "pkg:pypi/requests"</text>
  <text x="732" y="304" font-size="12" font-weight="bold" fill="#1a1a1a">analysis (VEX-статус):</text>
  <text x="732" y="322" font-size="12" fill="#27ae60">state: "not_affected"</text>
  <text x="732" y="340" font-size="12" fill="#6b7280">justification: "unused"</text>
  <text x="732" y="358" font-size="12" fill="#1a1a1a">detail: функція не активна</text>
  <rect x="730" y="380" width="202" height="46" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="738" y="398" font-size="12" font-weight="bold" fill="#c0392b">VEX ВЕРДИКТ:</text>
  <text x="738" y="416" font-size="12" fill="#1a1a1a">Фільтрація хибних тривог</text>

  <!-- ЗВ'ЯЗКИ МІЖ РОЗДІЛАМИ (у просвітах між колонками) -->
  <!-- 2 -> 3 (bom-ref зв'язок) у просвіті x=480..494 -->
  <line x1="480" y1="196" x2="492" y2="196" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- 3 -> 4 (affects зв'язок) у просвіті x=708..722 -->
  <line x1="708" y1="280" x2="720" y2="280" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-red)"/>
</svg>
