<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Деревоподібна структура документа CycloneDX JSON (SBOM)</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Конверт метаданих, реєстр компонентів, граф залежностей (DAG) та блок вразливостей (VEX)</text>

  <!-- КОРЕНЕВИЙ КОНВЕРТ (ROOT SCHEMA ENVELOPE) -->
  <rect x="20" y="66" width="920" height="38" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="32" y="90" font-size="12" font-weight="bold" fill="#2457d6">ROOT SCHEMA ENVELOPE: bomFormat="CycloneDX" | specVersion="1.5" | serialNumber="urn:uuid:..." | version=1</text>

  <!-- З'ЄДНУВАЛЬНІ ЛІНІЇ ВІД ROOT ДО 4 РОЗДІЛІВ -->
  <line x1="127" y1="104" x2="127" y2="112" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="364" y1="104" x2="364" y2="112" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="601" y1="104" x2="601" y2="112" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="831" y1="104" x2="831" y2="112" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- РОЗДІЛ 1: metadata -->
  <rect x="20" y="114" width="214" height="322" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="30" y="134" font-size="13" font-weight="bold" fill="#2457d6">1. metadata</text>
  <text x="30" y="150" font-size="12" fill="#6b7280">Паспорт та контекст збірки</text>
  <line x1="30" y1="158" x2="224" y2="158" stroke="#eaf0fd" stroke-width="1"/>
  <text x="30" y="178" font-size="12" font-weight="bold" fill="#1a1a1a">timestamp:</text>
  <text x="30" y="196" font-size="12" fill="#6b7280">ISO-8601 (час аудиту)</text>
  <text x="30" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">tools:</text>
  <text x="30" y="238" font-size="12" fill="#1a1a1a">cdxgen / syft / trivy</text>
  <text x="30" y="262" font-size="12" font-weight="bold" fill="#1a1a1a">component (root):</text>
  <text x="30" y="280" font-size="12" fill="#1a1a1a">type: "application"</text>
  <text x="30" y="298" font-size="12" fill="#1a1a1a">name: "payment-service"</text>
  <text x="30" y="316" font-size="12" fill="#1a1a1a">version: "2.4.0"</text>
  <text x="30" y="340" font-size="12" font-weight="bold" fill="#1a1a1a">authors / supplier:</text>
  <text x="30" y="358" font-size="12" fill="#1a1a1a">підрядник, контакти</text>
  <rect x="28" y="380" width="198" height="46" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="36" y="398" font-size="12" font-weight="bold" fill="#2457d6">ФІКСАЦІЯ КОНТЕКСТУ:</text>
  <text x="36" y="416" font-size="12" fill="#1a1a1a">Хто, коли і чим зібрав</text>

