<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Моделі надійності ПЗ (SRGM): Гоел — Окумото vs Ямада</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Накопичені відмови m(t) та інтенсивність lambda(t): точка перегину та ризик передчасного приймання</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: НАКОПИЧЕНІ ВІДМОВИ m(t) ================= -->
  <rect x="25" y="68" width="445" height="304" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="90" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Накопичені відмови m(t)</text>
  <text x="247" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Асимптота a: загальний пул прихованих дефектів</text>

  <!-- Асимптота a (125) та сітка -->
  <line x1="78" y1="125" x2="430" y2="125" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="78" y1="165" x2="430" y2="165" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="78" y1="200" x2="430" y2="200" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="78" y1="238" x2="430" y2="238" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="78" y1="275" x2="430" y2="275" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="78" y1="125" x2="78" y2="275" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Y-ticks ліворуч -->
  <text x="68" y="129" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">a (100%)</text>
  <text x="68" y="169" font-size="12" fill="#6b7280" text-anchor="end">0.75a</text>
  <text x="68" y="204" font-size="12" fill="#6b7280" text-anchor="end">0.50a</text>
  <text x="68" y="242" font-size="12" fill="#6b7280" text-anchor="end">0.25a</text>
  <text x="68" y="279" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- X-ticks ліворуч -->
  <text x="78" y="295" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="148" y="295" font-size="12" fill="#6b7280" text-anchor="middle">t1</text>
  <text x="218" y="295" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_перегину</text>
  <text x="288" y="295" font-size="12" fill="#6b7280" text-anchor="middle">t3</text>
  <text x="358" y="295" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_приймання</text>
  <text x="428" y="295" font-size="12" fill="#6b7280" text-anchor="middle">t</text>
  <text x="250" y="314" font-size="12" fill="#6b7280" text-anchor="middle">Тривалість тестування (t)</text>

  <!-- Крива Гоел-Окумото m(t): concave експонента -->
  <polyline points="78,275 148,208 218,170 288,149 358,137 428,131" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="148" cy="208" r="3" fill="#c0392b"/>
  <circle cx="218" cy="170" r="3" fill="#c0392b"/>
  <circle cx="288" cy="149" r="3" fill="#c0392b"/>
  <circle cx="358" cy="137" r="3" fill="#c0392b"/>

  <!-- Крива Ямади m(t): S-подібна з точкою перегину в (218, 215) -->
  <polyline points="78,275 148,253 218,215 288,173 358,146 428,134" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="148" cy="253" r="3" fill="#2457d6"/>
  <circle cx="218" cy="215" r="5" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="288" cy="173" r="3" fill="#2457d6"/>
  <circle cx="358" cy="146" r="4" fill="#27ae60"/>

  <!-- Пояснення лівої панелі -->
  <text x="78" y="336" font-size="12" font-weight="bold" fill="#2457d6">— Ямада (S-подібна)</text>
  <text x="260" y="336" font-size="12" font-weight="bold" fill="#c0392b">-- Гоел-Окумото (Експ.)</text>
  <text x="247" y="354" font-size="12" fill="#1a1a1a" text-anchor="middle">Точка перегину Ямади: перехід від розгортання до згасання</text>

  <!-- ================= ПРАВА ПАНЕЛЬ: ІНТЕНСИВНІСТЬ lambda(t) ================= -->
  <rect x="490" y="68" width="445" height="304" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="90" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інтенсивність відмов lambda(t)</text>
  <text x="712" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Темп виявлення дефектів за одиницю часу: m&apos;(t)</text>

  <!-- Безпечна зона приймання (lambda <= lambda_target): y = 250..275 -->
  <rect x="545" y="250" width="355" height="25" fill="#e9f7ef" stroke="none"/>
  <line x1="545" y1="250" x2="900" y2="250" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Сітка графіка праворуч -->
  <line x1="545" y1="135" x2="900" y2="135" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="175" x2="900" y2="175" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="210" x2="900" y2="210" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="275" x2="900" y2="275" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="545" y1="125" x2="545" y2="275" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Y-ticks праворуч -->
  <text x="535" y="139" font-size="12" fill="#6b7280" text-anchor="end">lambda_max</text>
  <text x="535" y="179" font-size="12" fill="#6b7280" text-anchor="end">0.75</text>
  <text x="535" y="214" font-size="12" fill="#6b7280" text-anchor="end">0.50</text>
  <text x="535" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">lambda_порогу</text>
  <text x="535" y="279" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- X-ticks праворуч -->
  <text x="545" y="295" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="615" y="295" font-size="12" fill="#6b7280" text-anchor="middle">t1</text>
  <text x="685" y="295" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_пік (1/b)</text>
  <text x="755" y="295" font-size="12" fill="#6b7280" text-anchor="middle">t3</text>
  <text x="825" y="295" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_приймання</text>
  <text x="895" y="295" font-size="12" fill="#6b7280" text-anchor="middle">t</text>
  <text x="720" y="314" font-size="12" fill="#6b7280" text-anchor="middle">Тривалість тестування (t)</text>

  <!-- Крива Гоел-Окумото lambda(t): монотонно спадає від максимуму -->
  <polyline points="545,135 615,175 685,210 755,238 825,255 895,267" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="545" cy="135" r="3" fill="#c0392b"/>
  <circle cx="615" cy="175" r="3" fill="#c0392b"/>
  <circle cx="685" cy="210" r="3" fill="#c0392b"/>
  <circle cx="755" cy="238" r="3" fill="#c0392b"/>
  <circle cx="825" cy="255" r="3" fill="#c0392b"/>

  <!-- Крива Ямади lambda(t): починається з 0, росте до піку, потім спадає -->
  <polyline points="545,275 615,195 685,160 755,195 825,245 895,264" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="615" cy="195" r="3" fill="#2457d6"/>
  <circle cx="685" cy="160" r="5" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="755" cy="195" r="3" fill="#2457d6"/>
  <circle cx="825" cy="245" r="4.5" fill="#27ae60"/>

  <!-- Пояснення правої панелі -->
  <text x="712" y="336" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зона приймання: lambda(t) &le; lambda_порогу (досягнуто при t_приймання)</text>
  <text x="712" y="354" font-size="12" fill="#6b7280" text-anchor="middle">Пік Ямади: максимум темпу дефектів через криву навчання</text>

  <!-- ================= НИЖНІЙ БАР'ЄР ПРИЙМАННЯ ================= -->
  <rect x="25" y="380" width="910" height="62" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="404" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Правило зупинки тестування та шлюз приймання (SRGM Acceptance Gate)</text>
  <text x="480" y="426" font-size="12" fill="#2457d6" text-anchor="middle">Заборонено приймати систему на висхідній фазі Ямади: поріг дозволено фіксувати лише після проходження піку дефектності</text>
</svg>
