<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Розподілений колапс і широкомовний шторм у системі FAA AAS</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Спроба побудувати відмовостійкий консенсус без ізоляції збоїв паралізувала мережу та робочі станції</text>

  <!-- Колонка 1: Робочі станції диспетчерів -->
  <rect x="40" y="96" width="270" height="344" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="56" y="112" width="238" height="32" rx="4" fill="#6b7280"/>
  <text x="175" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="white">1. Робочі станції диспетчерів</text>

  <rect x="56" y="156" width="238" height="110" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="175" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Консолі супроводу рейсів</text>
  <text x="175" y="200" font-size="12" text-anchor="middle" fill="#1a1a1a">Понад 200 станцій у секторі;</text>
  <text x="175" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">складні алгоритми узгодження</text>
  <text x="175" y="240" font-size="12" text-anchor="middle" fill="#6b7280">на незрілих компіляторах мови Ada</text>

  <rect x="56" y="278" width="238" height="142" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="175" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Локальний збій чи затримка</text>
  <text x="175" y="322" font-size="12" text-anchor="middle" fill="#1a1a1a">Короткочасна пауза однієї консолі</text>
  <text x="175" y="342" font-size="12" text-anchor="middle" fill="#1a1a1a">трактується як аварія вузла;</text>
  <text x="175" y="364" font-size="12" text-anchor="middle" fill="#1a1a1a">запускається протокол аварійного</text>
  <text x="175" y="386" font-size="12" text-anchor="middle" fill="#c0392b">перерозподілу секторів контролю</text>

  <!-- Стрілка від 1 до 2 -->
  <line x1="310" y1="268" x2="335" y2="268" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Колонка 2: Широкомовний шторм -->
  <rect x="345" y="96" width="270" height="344" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="361" y="112" width="238" height="32" rx="4" fill="#c0392b"/>
  <text x="480" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="white">2. Широкомовний шторм у мережі</text>

  <rect x="361" y="156" width="238" height="110" rx="4" fill="white" stroke="#e0b4b0"/>
  <text x="480" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Лавина broadcast-пакетів</text>
  <text x="480" y="200" font-size="12" text-anchor="middle" fill="#1a1a1a">Усі станції одночасно починають</text>
  <text x="480" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">штормити мережу службовими даними</text>
  <text x="480" y="240" font-size="12" text-anchor="middle" fill="#c0392b">(відсутність ієрархії та фільтрів)</text>

  <rect x="361" y="278" width="238" height="142" rx="4" fill="white" stroke="#e0b4b0"/>
  <text x="480" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Забивання буферів сокетів</text>
  <text x="480" y="322" font-size="12" text-anchor="middle" fill="#1a1a1a">Мережеві черги переповнюються;</text>
  <text x="480" y="342" font-size="12" text-anchor="middle" fill="#1a1a1a">пакети пульсу (heartbeat) губляться;</text>
  <text x="480" y="364" font-size="12" text-anchor="middle" fill="#1a1a1a">здорові станції вважаються мертвими,</text>
  <text x="480" y="386" font-size="12" text-anchor="middle" fill="#c0392b">що підсилює паніку в мережі</text>

  <!-- Стрілка від 2 до 3 -->
  <line x1="615" y1="268" x2="640" y2="268" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Колонка 3: Наслідки та архітектурний параліч -->
  <rect x="650" y="96" width="270" height="344" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="666" y="112" width="238" height="32" rx="4" fill="#c0392b"/>
  <text x="785" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="white">3. Вичерпання ресурсів і глухий кут</text>

  <rect x="666" y="156" width="238" height="110" rx="4" fill="white" stroke="#e0b4b0"/>
  <text x="785" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Вичерпання пам'яті станцій</text>
  <text x="785" y="200" font-size="12" text-anchor="middle" fill="#1a1a1a">Черги повідомлень з'їдають усю RAM;</text>
  <text x="785" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">диспетчерські консолі зависають</text>
  <text x="785" y="240" font-size="12" text-anchor="middle" fill="#c0392b">і перестають оновлювати радари</text>

  <rect x="666" y="278" width="238" height="142" rx="4" fill="white" stroke="#e0b4b0"/>
  <text x="785" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Архітектурний висновок</text>
  <text x="785" y="322" font-size="12" text-anchor="middle" fill="#1a1a1a">Спроба досягти «7 дев'яток» через</text>
  <text x="785" y="342" font-size="12" text-anchor="middle" fill="#1a1a1a">тотальний розподілений консенсус</text>
  <text x="785" y="364" font-size="12" text-anchor="middle" fill="#1a1a1a">без ізоляції збоїв зруйнувала</text>
  <text x="785" y="386" font-size="12" text-anchor="middle" fill="#2457d6">надійність усієї платформи AAS</text>
</svg>
