<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Анатомія запису компонента в CycloneDX SBOM</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Тріада контролю ланцюга постачання: вузол графа (bom-ref), канонічний ідентифікатор (purl) та криптохеш (hashes)</text>

  <!-- ЛІВА ЧАСТИНА: JSON-маніфест компонента -->
  <rect x="24" y="72" width="406" height="444" rx="8" fill="#f8fafc" stroke="#d0d7de" stroke-width="1.5"/>
  
  <text x="40" y="98" font-size="13" font-weight="700" fill="#1a1a1a">Маніфест CycloneDX 1.5 (запис компонента)</text>
  <line x1="36" y1="108" x2="418" y2="108" stroke="#d0d7de" stroke-width="1"/>

  <text x="40" y="126" font-size="12" fill="#6b7280">{</text>
  <text x="54" y="142" font-size="12" fill="#6b7280">&quot;type&quot;: &quot;library&quot;,</text>

  <!-- Highlight Box 1: bom-ref -->
  <rect x="38" y="152" width="378" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="48" y="172" font-size="12" font-weight="700" fill="#2457d6">&quot;bom-ref&quot;: &quot;pkg:npm/%40fastify/cors@8.3.0&quot;,</text>
  <text x="48" y="190" font-size="12" fill="#2457d6">// Вузловий якір у внутрішньому графі залежностей</text>

  <text x="54" y="216" font-size="12" fill="#1a1a1a">&quot;name&quot;: &quot;@fastify/cors&quot;,</text>
  <text x="54" y="232" font-size="12" fill="#1a1a1a">&quot;version&quot;: &quot;8.3.0&quot;,</text>

  <!-- Highlight Box 2: purl -->
  <rect x="38" y="242" width="378" height="62" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="48" y="262" font-size="12" font-weight="700" fill="#27ae60">&quot;purl&quot;: &quot;pkg:npm/%40fastify/cors@8.3.0&quot;,</text>
  <text x="48" y="280" font-size="12" fill="#27ae60">// Package URL: глобальний ідентифікатор для CVE/NVD</text>
  <text x="48" y="296" font-size="12" fill="#27ae60">// Схема: pkg:type/namespace/name@version</text>

  <!-- Highlight Box 3: hashes -->
  <rect x="38" y="318" width="378" height="128" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="48" y="338" font-size="12" font-weight="700" fill="#c0392b">&quot;hashes&quot;: [</text>
  <text x="58" y="356" font-size="12" fill="#c0392b">{ &quot;alg&quot;: &quot;SHA-256&quot;,</text>
  <text x="68" y="374" font-size="12" fill="#c0392b">&quot;content&quot;: &quot;9b1d7f38d6a8934421b2...&quot; },</text>
  <text x="58" y="392" font-size="12" fill="#c0392b">{ &quot;alg&quot;: &quot;SHA-512&quot;,</text>
  <text x="68" y="410" font-size="12" fill="#c0392b">&quot;content&quot;: &quot;4e72a084c8e19bd620f4...&quot; }</text>
  <text x="48" y="430" font-size="12" fill="#c0392b">] // Масив криптографічних контрольних сум</text>

  <text x="54" y="462" font-size="12" fill="#1a1a1a">&quot;licenses&quot;: [ { &quot;license&quot;: { &quot;id&quot;: &quot;MIT&quot; } } ]</text>
  <text x="40" y="480" font-size="12" fill="#6b7280">}</text>
  <text x="40" y="502" font-size="12" fill="#6b7280">Валідація: офіційна схема CycloneDX JSON Schema v1.5</text>

  <!-- ЗВ'ЯЗКИ МІЖ ЛІВОЮ ТА ПРАВОЮ ЧАСТИНАМИ -->
  <path d="M416,176 C442,176 450,134 476,134" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M416,273 C442,273 450,297 476,297" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M416,382 C442,382 450,457 476,457" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- ПРАВА ЧАСТИНА: 3 АНАЛІТИЧНІ БЛОКИ -->

  <!-- БЛОК 1: bom-ref -->
  <rect x="476" y="72" width="460" height="124" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="492" y="94" font-size="13" font-weight="700" fill="#2457d6">bom-ref</text>
  <text x="556" y="94" font-size="13" font-weight="700" fill="#1a1a1a">— Внутрішній якір графа залежностей</text>
  <line x1="492" y1="104" x2="920" y2="104" stroke="#d0d7de" stroke-width="1"/>
  <text x="492" y="122" font-size="12" fill="#1a1a1a">• Призначення: локальний унікальний ідентифікатор вузла в межах SBOM</text>
  <text x="492" y="140" font-size="12" fill="#1a1a1a">• Зв&apos;язки: секція dependencies будує DAG-граф (ref -&gt; dependsOn: [...])</text>
  <text x="492" y="158" font-size="12" fill="#c0392b">• Контроль CI: розірвані (dangling) чи циклічні посилання блокують збірку</text>
  <text x="492" y="176" font-size="12" fill="#6b7280">• VEX-лінкування: прив&apos;язка статусу експлуатованості CVE до компонента</text>

  <!-- БЛОК 2: purl -->
  <rect x="476" y="210" width="460" height="174" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="492" y="232" font-size="13" font-weight="700" fill="#27ae60">purl (Package URL)</text>
  <text x="636" y="232" font-size="13" font-weight="700" fill="#1a1a1a">— Стандарт глобальної ідентифікації</text>
  <line x1="492" y1="242" x2="920" y2="242" stroke="#d0d7de" stroke-width="1"/>
  
  <rect x="492" y="252" width="428" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="504" y="274" font-size="12" font-weight="700" fill="#1a1a1a">pkg:npm/%40fastify/cors@8.3.0</text>
  <text x="734" y="274" font-size="12" fill="#27ae60">[scheme:type/namespace/name@ver]</text>

  <text x="492" y="306" font-size="12" fill="#1a1a1a">• Інтероперабельність: уніфікований формат для npm, PyPI, Maven, Go, Cargo</text>
  <text x="492" y="324" font-size="12" fill="#1a1a1a">• CVE-сканери: точний пошук у NVD, GitHub Advisory, OSV.dev за purl</text>
  <text x="492" y="342" font-size="12" fill="#1a1a1a">• Ліцензійний комплаєнс: однозначне співставлення з реєстром ліцензій SPDX</text>
  <text x="492" y="360" font-size="12" fill="#c0392b">• Ризик приймання: відсутність або некоректний namespace блокує перевірку</text>

  <!-- БЛОК 3: hashes -->
  <rect x="476" y="398" width="460" height="118" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="492" y="420" font-size="13" font-weight="700" fill="#c0392b">hashes</text>
  <text x="548" y="420" font-size="13" font-weight="700" fill="#1a1a1a">— Криптографічна цілісність та автентичність</text>
  <line x1="492" y1="430" x2="920" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <text x="492" y="448" font-size="12" fill="#1a1a1a">• Стандарт: обов&apos;язкова наявність стійких хешів SHA-256 та/або SHA-512</text>
  <text x="492" y="466" font-size="12" fill="#1a1a1a">• Захист ланцюга: виявлення Dependency Confusion, підміни пакета та MITM</text>
  <text x="492" y="484" font-size="12" fill="#1a1a1a">• Шлюз CI: звірка хешу з lockfile репозиторію та завантаженого артефакту</text>
  <text x="492" y="502" font-size="12" fill="#c0392b">• Вето приймання: розбіжність хешу свідчить про сторонню модифікацію коду</text>
</svg>
