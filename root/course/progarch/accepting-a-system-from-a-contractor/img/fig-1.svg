<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- БІЛА ПІДКЛАДКА НА ВСЕ ПОЛОТНО -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Автоматизована митниця приймання системи: шлюз безпеки Trivy</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Машинний аудит коду, образів та IaC: блокування релізу при exit-code 1 або пропуск із генерацією SBOM</text>

  <!-- ==================== КОЛОНКА 1: АРТЕФАКТИ ПІДРЯДНИКА ==================== -->
  <rect x="25" y="76" width="220" height="356" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="100" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Артефакти постачання</text>
  <text x="135" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Зовнішній репозиторій підрядника</text>

  <!-- Картка 1: Код -->
  <rect x="37" y="132" width="196" height="76" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="49" y="152" font-size="13" font-weight="700" fill="#1a1a1a">Код та залежності</text>
  <text x="49" y="171" font-size="12" fill="#6b7280">npm, pip, maven, go.mod</text>
  <rect x="49" y="180" width="104" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.5"/>
  <text x="101" y="194" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">trivy fs / repo</text>

  <!-- Картка 2: Контейнери -->
  <rect x="37" y="220" width="196" height="76" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="49" y="240" font-size="13" font-weight="700" fill="#1a1a1a">Контейнерні образи</text>
  <text x="49" y="259" font-size="12" fill="#6b7280">OS packages, OCI image tar</text>
  <rect x="49" y="268" width="96" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.5"/>
  <text x="97" y="282" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">trivy image</text>

  <!-- Картка 3: IaC -->
  <rect x="37" y="308" width="196" height="76" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="49" y="328" font-size="13" font-weight="700" fill="#1a1a1a">Інфраструктура (IaC)</text>
  <text x="49" y="347" font-size="12" fill="#6b7280">Dockerfile, K8s, Terraform</text>
  <rect x="49" y="356" width="96" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.5"/>
  <text x="97" y="370" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">trivy config</text>

  <text x="135" y="412" font-size="12" fill="#6b7280" text-anchor="middle">Передаються в CI/CD конвеєр</text>

  <!-- Стрілка передачі до митниці -->
  <line x1="245" y1="254" x2="273" y2="254" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ==================== КОЛОНКА 2: ШЛЮЗ БЕЗПЕКИ TRIVY ==================== -->
  <rect x="275" y="76" width="380" height="356" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="465" y="100" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">Приймальний шлюз Trivy (Митниця)</text>
  <text x="465" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Детермінований аудит артефактів у конвеєрі CI/CD</text>

  <!-- Блок А: Конфігурація та правила -->
  <rect x="289" y="132" width="352" height="92" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="303" y="152" font-size="13" font-weight="700" fill="#1a1a1a">Конфігураційний контракт (trivy.yaml)</text>
  <text x="303" y="172" font-size="12" fill="#1a1a1a">Пороги критичності: <tspan fill="#c0392b" font-weight="700">HIGH, CRITICAL</tspan></text>
  <text x="303" y="192" font-size="12" fill="#1a1a1a">Фільтр вендора: <tspan fill="#2457d6" font-weight="700">--ignore-unfixed</tspan> (без блокування за 0-day)</text>
  <text x="303" y="212" font-size="12" fill="#1a1a1a">Погоджений техборг: <tspan fill="#6b7280" font-weight="700">.trivyignore</tspan> (CVE + justification + exp)</text>

  <!-- Блок Б: 4 вектори аудиту -->
  <rect x="289" y="236" width="352" height="114" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <rect x="299" y="246" width="160" height="44" rx="3" fill="#eaf0fd" stroke="#d0d7de" stroke-width="0.5"/>
  <text x="379" y="263" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вразливості (CVE)</text>
  <text x="379" y="280" font-size="12" fill="#6b7280" text-anchor="middle">OS та language deps</text>

  <rect x="471" y="246" width="160" height="44" rx="3" fill="#eaf0fd" stroke="#d0d7de" stroke-width="0.5"/>
  <text x="551" y="263" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Місконфігурація IaC</text>
  <text x="551" y="280" font-size="12" fill="#6b7280" text-anchor="middle">Root user, відкриті порти</text>

  <rect x="299" y="296" width="160" height="44" rx="3" fill="#eaf0fd" stroke="#d0d7de" stroke-width="0.5"/>
  <text x="379" y="313" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Витік секретів</text>
  <text x="379" y="330" font-size="12" fill="#6b7280" text-anchor="middle">API ключі, токени</text>

  <rect x="471" y="296" width="160" height="44" rx="3" fill="#eaf0fd" stroke="#d0d7de" stroke-width="0.5"/>
  <text x="551" y="313" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Ліцензійна чистота</text>
  <text x="551" y="330" font-size="12" fill="#6b7280" text-anchor="middle">Заборона copyleft / GPL</text>

  <!-- Блок В: Правило зупинки -->
  <rect x="289" y="362" width="352" height="56" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="303" y="382" font-size="13" font-weight="700" fill="#1a1a1a">Критерій зупинки: --exit-code 1</text>
  <text x="303" y="402" font-size="12" fill="#6b7280">Будь-який незнятий дефект зупиняє приймання</text>

  <!-- ==================== СТРІЛКИ ВІДГАЛУЖЕННЯ (РОЗГАЛУЖЕННЯ) ==================== -->
  <path d="M655,254 L672,254 L672,160 L688,160" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M655,254 L672,254 L672,348 L688,348" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- ==================== КОЛОНКА 3: РІШЕННЯ ПРИЙМАННЯ ==================== -->
  <!-- Панель 1: Успіх (exit-code 0) -->
  <rect x="690" y="76" width="245" height="168" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="702" y="88" width="105" height="22" rx="3" fill="#27ae60"/>
  <text x="754" y="103" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">exit-code: 0</text>

  <text x="702" y="126" font-size="14" font-weight="700" fill="#27ae60">ПРИЙМАННЯ ДОЗВОЛЕНО</text>
  <text x="702" y="144" font-size="12" font-weight="700" fill="#1a1a1a">Всі критерії дотримано</text>

  <rect x="702" y="154" width="221" height="76" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="173" font-size="12" fill="#1a1a1a">• Дефектів >= HIGH немає</text>
  <text x="712" y="192" font-size="12" fill="#1a1a1a">• Згенеровано SBOM (CycloneDX)</text>
  <text x="712" y="211" font-size="12" font-weight="700" fill="#27ae60">• Підписання акту приймання</text>

  <!-- Панель 2: Відхилення (exit-code 1) -->
  <rect x="690" y="264" width="245" height="168" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="702" y="276" width="105" height="22" rx="3" fill="#c0392b"/>
  <text x="754" y="291" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">exit-code: 1</text>

  <text x="702" y="314" font-size="14" font-weight="700" fill="#c0392b">БЛОКУВАННЯ РЕЛІЗУ</text>
  <text x="702" y="332" font-size="12" font-weight="700" fill="#1a1a1a">Виявлено критичні дефекти</text>

  <rect x="702" y="342" width="221" height="76" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="712" y="361" font-size="12" fill="#1a1a1a">• Непогоджені CVE або витік ключів</text>
  <text x="712" y="380" font-size="12" fill="#1a1a1a">• Конвеєр CI/CD перервано (Fail)</text>
  <text x="712" y="399" font-size="12" font-weight="700" fill="#c0392b">• Акт заблоковано, доопрацювання</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ІНЖЕНЕРНИЙ ПРИНЦИП ==================== -->
  <rect x="25" y="446" width="910" height="34" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="468" font-size="12" fill="#1a1a1a" text-anchor="middle">Інженерний принцип: машинний аудит через код завершення сканера замінює суб'єктивні запевнення підрядника</text>
</svg>
