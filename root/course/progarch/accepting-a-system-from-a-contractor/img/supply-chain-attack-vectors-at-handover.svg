<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Вектори загроз у сторонньому коді під час приймання системи</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Шлюз аудиту блокує підміну залежностей, плаваючі версії, транзитивні CVE та вірусні ліцензії</text>

  <!-- КОЛОНКА 1: ПІДРЯДНИК -->
  <rect x="24" y="76" width="172" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="32" y="86" width="156" height="28" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="105" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">КОД ПІДРЯДНИКА</text>

  <!-- Блок 1.1: Кодова база -->
  <rect x="32" y="124" width="156" height="86" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="145" font-size="12" font-weight="700" fill="#1a1a1a">Кодова база</text>
  <text x="40" y="166" font-size="12" fill="#6b7280">Власний бізнес-код</text>
  <text x="40" y="185" font-size="12" fill="#6b7280">та маніфести пакетів</text>
  <text x="40" y="203" font-size="12" fill="#2457d6">package.json / pom</text>

  <!-- Блок 1.2: Джерела ризику -->
  <rect x="32" y="226" width="156" height="96" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="40" y="247" font-size="12" font-weight="700" fill="#c0392b">Зовнішні ризики</text>
  <text x="40" y="268" font-size="12" fill="#1a1a1a">• Публічні хаби npm</text>
  <text x="40" y="287" font-size="12" fill="#1a1a1a">• Відкриті бібліотеки</text>
  <text x="40" y="306" font-size="12" fill="#1a1a1a">• Транзитивні дерева</text>

  <!-- Блок 1.3: Сліпа передача -->
  <rect x="32" y="338" width="156" height="86" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="359" font-size="12" font-weight="700" fill="#1a1a1a">Акт передачі</text>
  <text x="40" y="380" font-size="12" fill="#6b7280">Здача робіт без</text>
  <text x="40" y="399" font-size="12" fill="#6b7280">машинозчитуваного</text>
  <text x="40" y="417" font-size="12" fill="#c0392b">паспорта (SBOM)</text>

  <!-- Блок 1.4: Статистика -->
  <rect x="32" y="438" width="156" height="86" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="40" y="459" font-size="12" font-weight="700" fill="#c0392b">Айсберг коду</text>
  <text x="40" y="480" font-size="12" fill="#1a1a1a">80–90% системи —</text>
  <text x="40" y="499" font-size="12" fill="#1a1a1a">це сторонній код</text>
  <text x="40" y="517" font-size="12" fill="#c0392b">невідомої якості</text>

  <!-- КОЛОНКА 2: ВЕКТОРИ ЗАГРОЗ -->
  <rect x="220" y="76" width="506" height="460" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="230" y="86" width="486" height="28" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="473" y="105" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">ЧОТИРИ ВЕКТОРИ ЗАГРОЗ У ЛАНЦЮГУ ПОСТАЧАННЯ</text>

  <!-- Картка 2.1: Підміна залежностей -->
  <rect x="230" y="124" width="486" height="90" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <rect x="240" y="133" width="210" height="18" rx="3" fill="#fdecea"/>
  <text x="246" y="147" font-size="12" font-weight="700" fill="#c0392b">1. Підміна залежностей</text>
  <text x="460" y="147" font-size="12" fill="#6b7280">(Dependency Confusion)</text>
  <text x="240" y="168" font-size="12" fill="#1a1a1a">Атака: публікація внутрішнього імені (@corp/auth) у публічному реєстрі</text>
  <text x="240" y="187" font-size="12" fill="#1a1a1a">Механізм: зловмисник вказує версію 99.0.0, і менеджер тягне її з інтернету</text>
  <text x="240" y="206" font-size="12" font-weight="700" fill="#c0392b">Наслідок: виконання шкідливого бінарного коду всередині контуру</text>

  <!-- Картка 2.2: Плаваючі версії -->
  <rect x="230" y="226" width="486" height="90" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <rect x="240" y="235" width="210" height="18" rx="3" fill="#fdecea"/>
  <text x="246" y="249" font-size="12" font-weight="700" fill="#c0392b">2. Плаваючі версії</text>
  <text x="460" y="249" font-size="12" fill="#6b7280">(Unpinned / Floating Ranges)</text>
  <text x="240" y="270" font-size="12" fill="#1a1a1a">Атака: використання діапазонів ^, ~, * замість строгого lock-файлу</text>
  <text x="240" y="289" font-size="12" fill="#1a1a1a">Механізм: повторний запуск білду затягує скомпрометований реліз</text>
  <text x="240" y="308" font-size="12" font-weight="700" fill="#c0392b">Наслідок: недетермінована збірка та втрата контролю над версіями</text>

  <!-- Картка 2.3: Транзитивні CVE -->
  <rect x="230" y="328" width="486" height="90" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <rect x="240" y="337" width="210" height="18" rx="3" fill="#fdecea"/>
  <text x="246" y="351" font-size="12" font-weight="700" fill="#c0392b">3. Транзитивні CVE</text>
  <text x="460" y="351" font-size="12" fill="#6b7280">(Transitive Vulnerabilities)</text>
  <text x="240" y="372" font-size="12" fill="#1a1a1a">Атака: пряма бібліотека чиста, але глибинна залежність містить CVE</text>
  <text x="240" y="391" font-size="12" fill="#1a1a1a">Механізм: вразливість 3-5 рівня вкладеності (наприклад, CVSS 9.8 RCE)</text>
  <text x="240" y="410" font-size="12" font-weight="700" fill="#c0392b">Наслідок: непомітний бекдор і дистанційне захоплення вузла</text>

  <!-- Картка 2.4: Юридичне інфікування -->
  <rect x="230" y="430" width="486" height="90" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <rect x="240" y="439" width="210" height="18" rx="3" fill="#fdecea"/>
  <text x="246" y="453" font-size="12" font-weight="700" fill="#c0392b">4. Юридичне інфікування</text>
  <text x="460" y="453" font-size="12" fill="#6b7280">(Viral Copyleft Contamination)</text>
  <text x="240" y="474" font-size="12" fill="#1a1a1a">Атака: підключення стороннього модуля під ліцензією GPLv3 чи AGPLv3</text>
  <text x="240" y="493" font-size="12" fill="#1a1a1a">Механізм: суворий копілефт вимагає відкриття похідного бізнес-коду</text>
  <text x="240" y="512" font-size="12" font-weight="700" fill="#c0392b">Наслідок: примусове відкриття таємниці або судовий позов</text>

  <!-- КОЛОНКА 3: ШЛЮЗ ПРИЙМАННЯ ЗАМОВНИКА -->
  <rect x="750" y="76" width="186" height="460" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="758" y="86" width="170" height="28" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="843" y="105" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ШЛЮЗ ПРИЙМАННЯ</text>

  <!-- Бар'єр 3.1: Scoped registry -->
  <rect x="758" y="124" width="170" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <rect x="766" y="133" width="154" height="18" rx="3" fill="#e9f7ef"/>
  <text x="772" y="147" font-size="12" font-weight="700" fill="#27ae60">Захист неймспейсу</text>
  <text x="766" y="168" font-size="12" fill="#1a1a1a">• Приватний скоуп</text>
  <text x="766" y="187" font-size="12" fill="#1a1a1a">• Блок чужих пакетів</text>
  <text x="766" y="206" font-size="12" font-weight="700" fill="#27ae60">Шлюз: блокує підміну</text>

  <!-- Бар'єр 3.2: Lockfile -->
  <rect x="758" y="226" width="170" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <rect x="766" y="235" width="154" height="18" rx="3" fill="#e9f7ef"/>
  <text x="772" y="249" font-size="12" font-weight="700" fill="#27ae60">Lockfile + SHA-256</text>
  <text x="766" y="270" font-size="12" fill="#1a1a1a">• Фіксація версій</text>
  <text x="766" y="289" font-size="12" fill="#1a1a1a">• Звірка хеш-сум</text>
  <text x="766" y="308" font-size="12" font-weight="700" fill="#27ae60">Шлюз: детермінізм</text>

  <!-- Бар'єр 3.3: SBOM + CVE -->
  <rect x="758" y="328" width="170" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <rect x="766" y="337" width="154" height="18" rx="3" fill="#e9f7ef"/>
  <text x="772" y="351" font-size="12" font-weight="700" fill="#27ae60">SBOM + аудит CVE</text>
  <text x="766" y="372" font-size="12" fill="#1a1a1a">• Граф CycloneDX</text>
  <text x="766" y="391" font-size="12" fill="#1a1a1a">• Блок CVSS ≥ 7.0</text>
  <text x="766" y="410" font-size="12" font-weight="700" fill="#27ae60">Шлюз: чисте дерево</text>

  <!-- Бар'єр 3.4: Ліцензії SPDX -->
  <rect x="758" y="430" width="170" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <rect x="766" y="439" width="154" height="18" rx="3" fill="#e9f7ef"/>
  <text x="772" y="453" font-size="12" font-weight="700" fill="#27ae60">Фільтр ліцензій</text>
  <text x="766" y="474" font-size="12" fill="#1a1a1a">• Білий список SPDX</text>
  <text x="766" y="493" font-size="12" fill="#1a1a1a">• Блок AGPL / GPL</text>
  <text x="766" y="512" font-size="12" font-weight="700" fill="#27ae60">Шлюз: захист права</text>

  <!-- З'єднувальні стрілки зліва направо -->
  <line x1="196" y1="169" x2="214" y2="169" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="196" y1="271" x2="214" y2="271" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="196" y1="373" x2="214" y2="373" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="196" y1="475" x2="214" y2="475" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- З'єднувальні стрілки справа на шлюз -->
  <line x1="726" y1="169" x2="744" y2="169" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="726" y1="271" x2="744" y2="271" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="726" y1="373" x2="744" y2="373" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="726" y1="475" x2="744" y2="475" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
</svg>
