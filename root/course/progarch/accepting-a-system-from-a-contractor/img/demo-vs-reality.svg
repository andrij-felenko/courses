<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Заголовок і підзаголовок -->
<text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Демонстрація на стенді проти реальності експлуатації</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Успішний показ інтерфейсу часто приховує відсутність міграцій, слабку безпеку та технічний борг</text>

<!-- Ліва панель: Парадний показ -->
<rect x="50" y="95" width="415" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="257" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Демонстрація підрядника (Фасад)</text>
<text x="257" y="145" text-anchor="middle" font-size="12" fill="#6b7280">Тепличні умови тестового стенду</text>

<rect x="68" y="165" width="379" height="65" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="85" y="190" font-size="13" font-weight="700" fill="#1a1a1a">Ідеальний сценарій (Happy Path)</text>
<text x="85" y="212" font-size="12" fill="#6b7280">Клікабельний UI на заздалегідь підготовлених вручну даних</text>

<rect x="68" y="240" width="379" height="65" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="85" y="265" font-size="13" font-weight="700" fill="#1a1a1a">Приховані локальні залежності</text>
<text x="85" y="287" font-size="12" fill="#6b7280">Хардкод ключів, невідомі сторонні сервіси на ноутбуці автора</text>

<rect x="68" y="315" width="379" height="65" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="85" y="340" font-size="13" font-weight="700" fill="#1a1a1a">Відсутність стрес-навантаження</text>
<text x="85" y="362" font-size="12" fill="#6b7280">Демонстрація для 1 користувача без імітації відмов</text>

<text x="257" y="415" text-anchor="middle" font-size="12" fill="#6b7280">Створює хибне враження повної готовності системи</text>

<!-- Права панель: Реальні дефекти -->
<rect x="495" y="95" width="415" height="340" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="702" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">Реальність у власному контурі</text>
<text x="702" y="145" text-anchor="middle" font-size="12" fill="#6b7280">Що розкриває технічне приймання інженерами</text>

<rect x="513" y="165" width="379" height="65" rx="6" fill="#ffffff" stroke="#c0392b"/>
<text x="530" y="190" font-size="13" font-weight="700" fill="#c0392b">Збірка з чистого git падає</text>
<text x="530" y="212" font-size="12" fill="#1a1a1a">Скрипти міграцій відсутні або ламаються на чистій БД</text>

<rect x="513" y="240" width="379" height="65" rx="6" fill="#ffffff" stroke="#c0392b"/>
<text x="530" y="265" font-size="13" font-weight="700" fill="#c0392b">Токсичний стек і ліцензії</text>
<text x="530" y="287" font-size="12" fill="#1a1a1a">GPL-конфлікти, застарілі вразливі бібліотеки в vendor</text>

<rect x="513" y="315" width="379" height="65" rx="6" fill="#ffffff" stroke="#c0392b"/>
<text x="530" y="340" font-size="13" font-weight="700" fill="#c0392b">Провал під час першого тесту</text>
<text x="530" y="362" font-size="12" fill="#c0392b">Витоки пам'яті, N+1 запити та падіння бази даних</text>

<text x="702" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Підстава для зупинки виплат і гарантійного усунення</text>

</svg>
