<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Крива відгуку системи під час навантажувального стрес-тесту</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Зростання навантаження виявляє точку насичення, експоненціальну затримку та катастрофічний колапс</text>

  <!-- Шапки чотирьох зон -->
  <rect x="100" y="74" width="206" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="203" y="94" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">1. НОРМАЛЬНА ЗОНА</text>

  <rect x="320" y="74" width="166" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="403" y="94" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">2. ТОЧКА НАСИЧЕННЯ</text>

  <rect x="500" y="74" width="166" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="583" y="94" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. ЗОНА ДЕГРАДАЦІЇ</text>

  <rect x="680" y="74" width="200" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="780" y="94" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">4. КАТАСТРОФІЧНИЙ ЗЛАМ</text>

  <!-- Головне поле графіка -->
  <rect x="100" y="112" width="780" height="238" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>

  <!-- Розділювачі зон -->
  <line x1="313" y1="112" x2="313" y2="350" stroke="#d0d7de" stroke-dasharray="4 3" stroke-width="1.5"/>
  <line x1="493" y1="112" x2="493" y2="350" stroke="#d0d7de" stroke-dasharray="4 3" stroke-width="1.5"/>
  <line x1="673" y1="112" x2="673" y2="350" stroke="#c0392b" stroke-dasharray="4 3" stroke-width="1.5"/>

  <!-- Горизонтальні рівні сітки -->
  <line x1="100" y1="170" x2="880" y2="170" stroke="#e1e4e8" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="100" y1="260" x2="880" y2="260" stroke="#e1e4e8" stroke-dasharray="2 2" stroke-width="1"/>

  <!-- Вісь Y зліва (Пропускна здатність) -->
  <text x="92" y="139" font-size="12" fill="#6b7280" text-anchor="end">Макс</text>
  <text x="92" y="264" font-size="12" fill="#6b7280" text-anchor="end">50%</text>
  <text x="92" y="348" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Легенда на графіку в безпечній верхній зоні -->
  <rect x="110" y="122" width="180" height="46" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="118" y1="135" x2="138" y2="135" stroke="#2457d6" stroke-width="3"/>
  <text x="144" y="139" font-size="12" font-weight="700" fill="#2457d6">Пропускна здатність</text>
  <line x1="118" y1="156" x2="138" y2="156" stroke="#c0392b" stroke-width="3"/>
  <text x="144" y="160" font-size="12" font-weight="700" fill="#c0392b">Час відгуку (латентність)</text>

  <!-- КРИВА 1: Пропускна здатність (Синя лінія) -->
  <!-- Лінійне зростання -> плато насичення -> повільне падіння -> обвальний колапс -->
  <path d="M 100 340 Q 200 270 313 175 Q 400 160 493 168 Q 590 185 673 218 Q 720 270 780 325 L 870 338" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- КРИВА 2: Час відгуку / Латентність (Червона лінія) -->
  <!-- Низька стабільна -> коліно вгору -> експоненційне зростання -> поличка таймаутів -->
  <path d="M 100 328 L 313 320 Q 400 305 493 250 Q 580 190 673 145 L 870 145" fill="none" stroke="#c0392b" stroke-width="3"/>

  <!-- Точка «Коліно» (Насичення) на Throughput -->
  <circle cx="313" cy="175" r="5" fill="#2457d6"/>
  <rect x="252" y="188" width="122" height="22" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="313" y="203" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">«Коліно» кривої</text>

  <!-- Точка зламу на графіку -->
  <circle cx="673" cy="218" r="5" fill="#c0392b"/>
  <rect x="618" y="232" width="110" height="22" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="673" y="247" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Точка зламу</text>

  <!-- Підписи по осі X -->
  <text x="206" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">Робочий потік</text>
  <text x="403" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">Граничний потік</text>
  <text x="583" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">Черги та затримки</text>
  <text x="780" y="368" font-size="12" fill="#c0392b" text-anchor="middle">Колапс / помилки</text>

  <!-- Підпис осі X -->
  <text x="480" y="392" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Навантаження на систему (кількість віртуальних користувачів VU / вхідний потік запитів)</text>

  <!-- Чотири інформаційні картки внизу -->
  <!-- Картка 1: Норма -->
  <rect x="24" y="415" width="216" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="34" y="435" font-size="12" font-weight="700" fill="#27ae60">1. Нормальний стан</text>
  <text x="34" y="454" font-size="12" fill="#1a1a1a">• Черги запитів відсутні</text>
  <text x="34" y="472" font-size="12" fill="#1a1a1a">• Низька латентність p95</text>
  <text x="34" y="490" font-size="12" fill="#27ae60">• Виконання вимог SLA</text>

  <!-- Картка 2: Насичення -->
  <rect x="258" y="415" width="216" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="268" y="435" font-size="12" font-weight="700" fill="#2457d6">2. Точка насичення</text>
  <text x="268" y="454" font-size="12" fill="#1a1a1a">• Пул потоків заповнено</text>
  <text x="268" y="472" font-size="12" fill="#1a1a1a">• Піковий Throughput</text>
  <text x="268" y="490" font-size="12" fill="#2457d6">• Початок росту буферів</text>

  <!-- Картка 3: Деградація -->
  <rect x="492" y="415" width="216" height="85" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="502" y="435" font-size="12" font-weight="700" fill="#1a1a1a">3. Зона деградації</text>
  <text x="502" y="454" font-size="12" fill="#1a1a1a">• Різке зростання черг</text>
  <text x="502" y="472" font-size="12" fill="#1a1a1a">• Пробиття порогів p95/p99</text>
  <text x="502" y="490" font-size="12" fill="#c0392b">• Порушення умов SLO</text>

  <!-- Картка 4: Катастрофа -->
  <rect x="726" y="415" width="216" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="736" y="435" font-size="12" font-weight="700" fill="#c0392b">4. Катастрофа (Злам)</text>
  <text x="736" y="454" font-size="12" fill="#1a1a1a">• Вичерпання ресурсів</text>
  <text x="736" y="472" font-size="12" fill="#1a1a1a">• Обвал Throughput</text>
  <text x="736" y="490" font-size="12" fill="#c0392b">• 100% помилок таймауту</text>
</svg>
