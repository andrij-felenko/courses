<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один хід перекидає всі п'ять у зелене</text>
<rect x="40.0" y="64.0" width="250.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="109.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">БУЛО</tspan><tspan x="165.0" dy="16.9">AlarmDispatcher</tspan><tspan x="165.0" dy="16.9">робить усе одразу:</tspan><tspan x="165.0" dy="16.9">політика + текст</tspan><tspan x="165.0" dy="16.9">+ Twilio + файл</tspan></text>
<rect x="690.0" y="64.0" width="250.0" height="150.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="109.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">СТАЛО</tspan><tspan x="815.0" dy="16.9">AlarmPolicy — ядро</tspan><tspan x="815.0" dy="16.9">+ Notifier / Clock</tspan><tspan x="815.0" dy="16.9">подано ззовні;</tspan><tspan x="815.0" dy="16.9">адаптери окремо</tspan></text>
<text x="490.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">один хід: композиція</text>
<line x1="292.0" y1="139.0" x2="688.0" y2="139.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">стабільне ядро окремо, деталі — впорснути</text>
<text x="490.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять оцінок після одного ходу</text>
<circle cx="150.0" cy="286.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<line x1="166.0" y1="286.0" x2="196.0" y2="286.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="212.0" cy="286.0" r="9.0" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="238.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">S</text>
<text x="262.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">кожен актор — у власному класі</text>
<circle cx="150.0" cy="322.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<line x1="166.0" y1="322.0" x2="196.0" y2="322.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="212.0" cy="322.0" r="9.0" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="238.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">O</text>
<text x="262.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">новий канал = новий адаптер, ядро ціле</text>
<circle cx="150.0" cy="358.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
