<text x="238.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">L</text>
<text x="262.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">дублер записує, а не вдає — контракт чесний</text>
<circle cx="150.0" cy="394.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<line x1="166.0" y1="394.0" x2="196.0" y2="394.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="212.0" cy="394.0" r="9.0" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="238.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">I</text>
<text x="262.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Notifier — один метод, вузько</text>
<circle cx="150.0" cy="430.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<line x1="166.0" y1="430.0" x2="196.0" y2="430.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="212.0" cy="430.0" r="9.0" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="238.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">D</text>
<text x="262.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">політика спирається на абстракцію, не на Twilio</text>
