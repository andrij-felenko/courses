<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Замало і забагато структури — обидва краї коштують</text>
<rect x="60.0" y="112.0" width="260.0" height="60.0" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="190.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЗАМАЛО</text>
<text x="190.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="190.0" dy="0.0">грудка болота:</tspan><tspan x="190.0" dy="15.6">зміна розповзається</tspan></text>
<rect x="320.0" y="112.0" width="280.0" height="60.0" rx="0" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="460.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ДОРЕЧНО</text>
<text x="460.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="460.0" dy="0.0">шов там, де</tspan><tspan x="460.0" dy="15.6">зміна реальна</tspan></text>
<rect x="600.0" y="112.0" width="260.0" height="60.0" rx="0" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="730.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЗАБАГАТО</text>
<text x="730.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">передчасна абстракція:</tspan><tspan x="730.0" dy="15.6">податок на непрямість</tspan></text>
<line x1="460.0" y1="72.0" x2="460.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="460.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">вказівник веде реальний тиск зміни, не бажання «набрати SOLID»</text>
</svg>