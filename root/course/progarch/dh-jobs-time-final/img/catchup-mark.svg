<text x="640.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Наздоганяння — не окрема функція, а відсутність бага: воно випадає з формули (mark, сьогодні, політика).</text>
