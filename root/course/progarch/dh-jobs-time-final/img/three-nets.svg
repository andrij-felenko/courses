<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1320" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один нічний запуск на кластер: три сітки, що страхують одна одну</text>
<text x="240.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">СІТКА 1 · ЛІЗА</text>
<line x1="240.0" y1="188.5" x2="240.0" y2="307.4" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="240.0" y1="396.6" x2="240.0" y2="519.6" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="67.0" y="119.5" width="346.0" height="65.0" rx="6" fill="#fff4e0" stroke="#c77800" stroke-width="1.8"/><text x="240.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Двоє вузлів прокинулись</tspan><tspan x="240.0" dy="16.2">о 02:00 — обидва хочуть</tspan><tspan x="240.0" dy="16.2">планувати ніч</tspan></text>
<rect x="62.0" y="311.4" width="356.0" height="81.2" rx="6" fill="#e6eefb" stroke="#2457d6" stroke-width="2.0"/><text x="240.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Лізу (право планувати)</tspan><tspan x="240.0" dy="16.2">атомарно бере ЛИШЕ один.</tspan><tspan x="240.0" dy="16.2">Другий бачить живу лізу</tspan><tspan x="240.0" dy="16.2">й мовчить до її кінця</tspan></text>
<rect x="77.0" y="523.6" width="326.0" height="48.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="240.0" y="544.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">рівно ОДИН планувальник</tspan><tspan x="240.0" dy="16.2">на весь кластер</tspan></text>
<text x="660.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">СІТКА 2 · ФЕНСИНГ-ТОКЕН</text>
<line x1="660.0" y1="188.5" x2="660.0" y2="307.4" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660.0" y1="396.6" x2="660.0" y2="519.6" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="487.0" y="119.5" width="346.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="660.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Власник ліг у GC-паузу,</tspan><tspan x="660.0" dy="16.2">ліза згасла, поки він спав, —</tspan><tspan x="660.0" dy="16.2">а тоді ожив і пише</tspan></text>
<rect x="482.0" y="311.4" width="356.0" height="81.2" rx="6" fill="#e6eefb" stroke="#2457d6" stroke-width="2.0"/><text x="660.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Наступник узяв лізу з</tspan><tspan x="660.0" dy="16.2">токеном 34. Зомбі пише з</tspan><tspan x="660.0" dy="16.2">токеном 33 → сховище бачить</tspan><tspan x="660.0" dy="16.2">33 &lt; 34 і ВІДМОВЛЯЄ</tspan></text>
<rect x="497.0" y="523.6" width="326.0" height="48.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="660.0" y="544.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">застарілий запис відкинуто,</tspan><tspan x="660.0" dy="16.2">вказівник не зіпсовано</tspan></text>
<text x="1080.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">СІТКА 3 · КЛЮЧ (дім, доба)</text>
<line x1="1080.0" y1="188.5" x2="1080.0" y2="307.4" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1080.0" y1="396.6" x2="1080.0" y2="519.6" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="907.0" y="119.5" width="346.0" height="65.0" rx="6" fill="#f0f0f2" stroke="#6b7280" stroke-width="1.8"/><text x="1080.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">Черга «щонайменше раз»</tspan><tspan x="1080.0" dy="16.2">доставила ту саму задачу</tspan><tspan x="1080.0" dy="16.2">агрегації двічі</tspan></text>
<rect x="902.0" y="311.4" width="356.0" height="81.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="1080.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">upsert за ключем (дім, доба):</tspan><tspan x="1080.0" dy="16.2">другий запуск ПЕРЕПИШЕ</tspan><tspan x="1080.0" dy="16.2">той самий рядок тими</tspan><tspan x="1080.0" dy="16.2">самими числами</tspan></text>
<rect x="917.0" y="523.6" width="326.0" height="48.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="1080.0" y="544.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1080.0" dy="0.0">той самий підсумок,</tspan><tspan x="1080.0" dy="16.2">без подвоєння</tspan></text>
<rect x="80.0" y="622.0" width="1160.0" height="62.0" rx="10" fill="#f7f9fb" stroke="#27ae60" stroke-width="2.0"/>
<text x="660.0" y="647.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Три сітки ПЕРЕКРИВАЮТЬСЯ — ніч стоїть на всіх трьох разом, не на одній</text>
<text x="660.0" y="669.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ліза ловить буденний випадок · фенсинг — зомбі після паузи · ключ — дубль від ретраю</text>
</svg>