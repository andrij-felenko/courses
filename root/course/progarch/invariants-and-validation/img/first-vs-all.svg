<text x="675.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">одна відповідь — увесь список</tspan><tspan x="675.0" dy="16.5">правиш усі поля за раз</tspan></text>
