<rect x="55.0" y="118.0" width="340.0" height="64.0" rx="6" fill="#fbeeec" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">{ error: &quot;deviceId порожній&quot; }</tspan><tspan x="225.0" dy="16.2">…і мовчить про решту</tspan></text>
<text x="225.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">спроба 1 → 1 хиба, правиш</tspan><tspan x="225.0" dy="16.5">спроба 2 → наступна хиба</tspan><tspan x="225.0" dy="16.5">спроба 3 → аж тепер пройшло</tspan></text>
