<text x="255.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">тип без зайвого стану</text>
<rect x="169.2" y="264.8" width="171.6" height="70.4" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="255.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">АЛЕКСІС КІНГ · 2019</tspan><tspan x="255.0" dy="18.2">«розбирай,</tspan><tspan x="255.0" dy="18.2">не перевіряй»</tspan></text>
<text x="255.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">межа:</text>
