<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві дороги до одного ходу</text>
<rect x="169.2" y="82.8" width="171.6" height="70.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="255.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">ЯРОН МІНСКІ · 2010</tspan><tspan x="255.0" dy="18.2">«зроби недозволений</tspan><tspan x="255.0" dy="18.2">стан невиразним»</tspan></text>
