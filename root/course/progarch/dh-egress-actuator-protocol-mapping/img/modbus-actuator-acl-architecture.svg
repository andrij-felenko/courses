<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Трансляція доменних команд у протокол актуатора через вихідний адаптер (ACL)</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Антикорупційний шар і координатор шини герметизують домен від регістрів Modbus та обмежень RS-485</text>

  <!-- ================= КОЛОНКА 1: ДОМЕННЕ ЯДРО ================= -->
  <rect x="20" y="68" width="270" height="412" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Плашка заголовка лівої колонки -->
  <rect x="30" y="78" width="250" height="26" rx="4" fill="#27ae60"/>
  <text x="155" y="95" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ДОМЕННЕ ЯДРО (DOMAIN CORE)</text>
  <text x="155" y="116" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Чисті бізнес-правила без зв'язку з I/O</text>

  <!-- Блок: Доменний сервіс -->
  <rect x="30" y="128" width="250" height="66" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="155" y="148" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">HeatingRegulationService</text>
  <text x="155" y="167" font-size="12" fill="#6b7280" text-anchor="middle">Доменна логіка регулювання</text>
  <text x="155" y="185" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">потреба: ValvePosition(75%)</text>

  <!-- Стрілка від Доменного сервісу до Порту -->
  <line x1="155" y1="194" x2="155" y2="208" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Блок: Вихідний порт -->
  <rect x="30" y="210" width="250" height="78" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
  <text x="155" y="230" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">HeatingValveActuatorPort</text>
  <text x="155" y="249" font-size="12" fill="#6b7280" text-anchor="middle">«interface» вихідний порт</text>
  <text x="155" y="268" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">set_position(pos: ValvePosition)</text>

  <!-- Блок герметичності (підсумок домену) -->
  <rect x="30" y="302" width="250" height="166" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="42" y="322" font-size="12" font-weight="700" fill="#27ae60">Герметичність доменного ядра:</text>
  <text x="42" y="344" font-size="12" fill="#1a1a1a">• Оперує Value Object ValvePosition</text>
  <text x="42" y="366" font-size="12" fill="#1a1a1a">• Нуль знань про Modbus і залізо</text>
  <text x="42" y="388" font-size="12" fill="#1a1a1a">• Жодних адрес 16-бітних регістрів</text>
  <text x="42" y="410" font-size="12" fill="#1a1a1a">• Жодної бінарної серіалізації кадрів</text>
  <text x="42" y="432" font-size="12" fill="#1a1a1a">• Захист від таймаутів та помилок CRC</text>
  <text x="42" y="454" font-size="12" font-weight="700" fill="#27ae60">✓ Повна ізоляція від деталей протоколу</text>

  <!-- ================= КОЛОНКА 2: ВИХІДНИЙ АДАПТЕР ================= -->
  <rect x="310" y="68" width="400" height="412" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Плашка заголовка середньої колонки -->
  <rect x="320" y="78" width="380" height="26" rx="4" fill="#2457d6"/>
  <text x="510" y="95" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ВИХІДНИЙ АДАПТЕР (EGRESS ADAPTER)</text>
  <text x="510" y="116" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">ModbusHeatingValveAdapter (імплементація порту)</text>

  <!-- Секція ACL -->
  <rect x="320" y="128" width="380" height="152" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="510" y="146" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Антикорупційний шар (ACL / Translator)</text>

  <!-- Підблок ACL: трансляція величин і команд -->
  <rect x="328" y="156" width="364" height="56" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="338" y="174" font-size="12" font-weight="700" fill="#1a1a1a">Маппінг величин: ValvePosition(75%) → 750 (0..1000)</text>
  <text x="338" y="191" font-size="12" fill="#6b7280">Трансляція відсотка у 16-бітний регістр утримання</text>
  <text x="338" y="205" font-size="12" font-weight="700" fill="#2457d6">Команда: WriteSingleRegister(Slave=1, Addr=0x0102)</text>

  <!-- Підблок ACL: зворотна трансляція помилок -->
  <rect x="328" y="218" width="364" height="54" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="338" y="235" font-size="12" font-weight="700" fill="#c0392b">Зворотний переклад помилок заліза в доменні типи:</text>
  <text x="338" y="252" font-size="12" fill="#1a1a1a">ModbusTimeout / Err 0x02 → ActuatorFault (доменна помилка)</text>
  <text x="338" y="266" font-size="12" fill="#6b7280">Ядро отримує типізований результат замість падіння зв'язку</text>

  <!-- Стрілка від ACL до Координатора шини -->
  <line x1="510" y1="280" x2="510" y2="294" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Секція Координатора шини RS-485 -->
  <rect x="320" y="296" width="380" height="172" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="510" y="315" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Транспортний координатор шини RS-485</text>

  <!-- Підблок: Черга та Mutex -->
  <rect x="328" y="326" width="364" height="62" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="338" y="344" font-size="12" font-weight="700" fill="#1a1a1a">Черга відправки (Queue) + Bus Mutex (lock)</text>
  <text x="338" y="362" font-size="12" fill="#6b7280">• Монопольне захоплення напівдуплексної лінії RS-485</text>
  <text x="338" y="379" font-size="12" fill="#6b7280">• Серіалізація викликів для запобігання колізіям кадрів</text>

  <!-- Підблок: Кадрування і таймінги -->
  <rect x="328" y="394" width="364" height="66" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="338" y="412" font-size="12" font-weight="700" fill="#2457d6">Бінарний кадр Modbus RTU + CRC-16:</text>
  <text x="338" y="430" font-size="12" fill="#1a1a1a">[Slave:01][Func:06][Reg:01 02][Val:02 EE][CRC16: 2A 79]</text>
  <text x="338" y="450" font-size="12" fill="#6b7280">Таймаут відповіді (500 мс) · Пауза між кадрами t3.5</text>

  <!-- ================= КОЛОНКА 3: ФІЗИЧНИЙ АКТУАТОР ================= -->
  <rect x="730" y="68" width="210" height="412" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Плашка заголовка правої колонки -->
  <rect x="740" y="78" width="190" height="26" rx="4" fill="#6b7280"/>
  <text x="835" y="95" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ФІЗИЧНИЙ АКТУАТОР</text>
  <text x="835" y="116" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">Апаратне середовище клапана</text>

  <!-- Блок: Виконавчий механізм клапана -->
  <rect x="740" y="128" width="190" height="88" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="835" y="148" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Опалювальний клапан</text>
  <text x="835" y="167" font-size="12" fill="#6b7280" text-anchor="middle">Електропривод штока</text>
  <text x="835" y="188" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Положення: 75% ВІДКРИТО</text>
  <text x="835" y="205" font-size="12" fill="#27ae60" text-anchor="middle">✓ Фізичний стан узгоджено</text>

  <!-- Стрілка від регістра до штока -->
  <line x1="835" y1="228" x2="835" y2="218" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arr-green)"/>

  <!-- Блок: Контролер клапана та Регістр утримання -->
  <rect x="740" y="230" width="190" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="835" y="250" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Плата контролера (Slave 1)</text>
  <text x="835" y="269" font-size="12" fill="#6b7280" text-anchor="middle">Modbus RTU Slave пристрій</text>
  <rect x="748" y="278" width="174" height="58" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="835" y="296" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Holding Register</text>
  <text x="835" y="313" font-size="12" fill="#2457d6" text-anchor="middle">Адреса: 0x0102 (16-біт)</text>
  <text x="835" y="329" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Значення: 750</text>

  <!-- Стрілка від шини до контролера -->
  <line x1="835" y1="358" x2="835" y2="346" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Блок: Фізична шина RS-485 -->
  <rect x="740" y="360" width="190" height="108" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="835" y="380" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Шина RS-485</text>
  <text x="835" y="399" font-size="12" fill="#6b7280" text-anchor="middle">Напівдуплекс · 9600 8N1</text>
  <text x="835" y="419" font-size="12" fill="#2457d6" text-anchor="middle">Лінії зв'язку: Data+ / Data−</text>
  <text x="835" y="439" font-size="12" fill="#1a1a1a" text-anchor="middle">Спільне середовище</text>
  <text x="835" y="457" font-size="12" fill="#6b7280" text-anchor="middle">Вимагає монополії шини</text>

  <!-- ================= МІЖКОЛОНКОВІ ЗВ'ЯЗКИ (СТРІЛКИ) ================= -->
  <!-- 1. Зв'язок Порт -> ACL (виклик set_position) -->
  <line x1="280" y1="240" x2="318" y2="184" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- 2. Зв'язок зворотний ACL -> Порт (доменні помилки) -->
  <line x1="320" y1="245" x2="282" y2="260" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- 3. Зв'язок Координатор шини -> Шина RS-485 (бінарний кадр) -->
  <line x1="692" y1="427" x2="738" y2="427" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
