<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Схема підключення, узгодження та гальванічної розв'язки шлюзу RS-485</text>
  <text x="480" y="48" font-size="13" text-anchor="middle" fill="#6b7280">Диференціальна пара A/B, термінатори 120 Ом на краях шини, захисне зміщення та заземлення екрана в 1 точці</text>

  <!-- ЗОНА 1: Промисловий інтерфейсний шлюз (Крайній вузол 1) -->
  <rect x="24" y="66" width="386" height="338" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="88" font-size="14" font-weight="700" fill="#1a1a1a">Промисловий інтерфейсний шлюз (Крайній вузол 1)</text>
  <text x="40" y="104" font-size="12" fill="#6b7280">Ethernet / USB → мікропроцесор → ізольований порт RS-485</text>

  <!-- Підпанель 1A: Хостова частина -->
  <rect x="34" y="116" width="120" height="274" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="94" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Хостова логіка</text>
  
  <rect x="42" y="148" width="104" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="94" y="165" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Ethernet / USB</text>
  <text x="94" y="180" font-size="12" text-anchor="middle" fill="#1a1a1a">потік команд</text>

  <rect x="42" y="200" width="104" height="54" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="94" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">MCU шлюзу</text>
  <text x="94" y="233" font-size="12" text-anchor="middle" fill="#6b7280">FIFO буфери</text>
  <text x="94" y="247" font-size="12" text-anchor="middle" fill="#6b7280">черги TX / RX</text>

  <rect x="42" y="264" width="104" height="58" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="94" y="282" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Живлення хоста</text>
  <text x="94" y="298" font-size="12" text-anchor="middle" fill="#6b7280">V_CC1 (+5V)</text>
  <text x="94" y="313" font-size="12" text-anchor="middle" fill="#6b7280">GND1 (хост)</text>

  <text x="94" y="348" font-size="12" text-anchor="middle" fill="#6b7280">Сигнали керування:</text>
  <text x="94" y="364" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">TXD, RXD, RTS/DE</text>

  <!-- Підпанель 1B: Гальванічна розв'язка (Бар'єр) -->
  <rect x="162" y="116" width="66" height="274" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="195" y="136" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">ІЗОЛЯЦІЯ</text>
  <text x="195" y="150" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">≥ 2.5 кВ</text>

  <rect x="168" y="162" width="54" height="54" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="195" y="182" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">DC/DC</text>
  <text x="195" y="197" font-size="12" text-anchor="middle" fill="#1a1a1a">ізольов.</text>
  <text x="195" y="210" font-size="12" text-anchor="middle" fill="#6b7280">перетв.</text>

  <rect x="168" y="228" width="54" height="74" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="195" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Цифрові</text>
  <text x="195" y="261" font-size="12" text-anchor="middle" fill="#1a1a1a">ізолятори</text>
  <text x="195" y="278" font-size="12" text-anchor="middle" fill="#6b7280">TX / RX</text>
  <text x="195" y="293" font-size="12" text-anchor="middle" fill="#6b7280">DE / RE</text>

  <!-- Сигнали між хостом, ізолятором і трансивером -->
  <!-- Живлення V_CC1 до DC/DC -->
  <line x1="146" y1="189" x2="168" y2="189" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Сигнали TX / DE від MCU до цифрових ізоляторів -->
  <line x1="146" y1="246" x2="168" y2="246" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="222" y1="246" x2="242" y2="246" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Сигнал RX від трансивера через ізолятор до MCU -->
  <line x1="242" y1="262" x2="222" y2="262" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="168" y1="262" x2="146" y2="262" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Підпанель 1C: Ізольований трансивер та Fail-Safe коло -->
  <rect x="236" y="116" width="164" height="274" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="318" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Ізольований RS-485</text>

  <!-- Драйвер RS-485 -->
  <rect x="242" y="224" width="48" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="266" y="248" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">RS-485</text>
  <text x="266" y="266" font-size="12" text-anchor="middle" fill="#1a1a1a">чіп</text>

  <!-- Лінія живлення ISO +5V -->
  <line x1="222" y1="172" x2="308" y2="172" stroke="#2457d6" stroke-width="1.5"/>
  <text x="258" y="166" font-size="12" font-weight="700" fill="#2457d6">ISO +5V</text>

  <!-- Лінія живлення ISO GND -->
  <line x1="222" y1="316" x2="308" y2="316" stroke="#6b7280" stroke-width="1.5"/>
  <text x="254" y="330" font-size="12" font-weight="700" fill="#6b7280">ISO GND</text>

  <!-- Коло зміщення (Fail-Safe) та термінатор 1 -->
  <!-- R_PU (Pull-Up) між ISO +5V та лінією B -->
  <line x1="308" y1="172" x2="308" y2="178" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="301" y="178" width="14" height="18" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="308" y1="196" x2="308" y2="205" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="191" font-size="12" font-weight="700" fill="#1a1a1a">R_PU (560 Ω)</text>

  <!-- R_T (Termination 120 Ом) між B та A -->
  <line x1="308" y1="205" x2="308" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="301" y="230" width="14" height="20" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="308" y1="250" x2="308" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="240" font-size="12" font-weight="700" fill="#2457d6">R_T = 120 Ω</text>
  <text x="320" y="254" font-size="12" fill="#6b7280">термінатор 1</text>

  <!-- R_PD (Pull-Down) між лінією A та ISO GND -->
  <line x1="308" y1="275" x2="308" y2="288" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="301" y="288" width="14" height="18" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="308" y1="306" x2="308" y2="316" stroke="#6b7280" stroke-width="1.5"/>
  <text x="320" y="301" font-size="12" font-weight="700" fill="#1a1a1a">R_PD (560 Ω)</text>

  <!-- Лінії від драйвера до вузлів -->
  <!-- Вихід B трансивера (y=240) до лінії B (y=205) -->
  <line x1="290" y1="240" x2="298" y2="240" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="298" y1="240" x2="298" y2="205" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="298" y1="205" x2="308" y2="205" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Вихід A трансивера (y=268) до лінії A (y=275) -->
  <line x1="290" y1="268" x2="298" y2="268" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="298" y1="268" x2="298" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="298" y1="275" x2="308" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Fail-safe плашка внизу 1C -->
  <rect x="244" y="340" width="148" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="318" y="356" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Коло Fail-Safe зміщення</text>
  <text x="318" y="372" font-size="12" text-anchor="middle" fill="#1a1a1a">U_AB ≥ +200 мВ (тиша/обрив)</text>

  <!-- Вихідні клеми шлюзу -->
  <line x1="308" y1="205" x2="410" y2="205" stroke="#2457d6" stroke-width="2"/>
  <circle cx="410" cy="205" r="3.5" fill="#2457d6"/>

  <line x1="308" y1="275" x2="410" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="410" cy="275" r="3.5" fill="#1a1a1a"/>

  <!-- ЗОНА 2: Польова шина RS-485 (Кабель вита пара) -->
  <!-- Екран кабелю (STP envelope) -->
  <rect x="424" y="152" width="260" height="152" rx="6" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="554" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#6b7280">Екран кабелю витої пари (STP / Фольга + обплетення)</text>

  <!-- Лінія B польової шини -->
  <line x1="410" y1="205" x2="712" y2="205" stroke="#2457d6" stroke-width="2"/>
  <text x="554" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Лінія B (Data + / неінверсна)</text>

  <!-- Позначення витої пари посередині -->
  <text x="554" y="235" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Диференціальна вита пара A / B</text>
  <text x="554" y="251" font-size="12" text-anchor="middle" fill="#6b7280">Хвильовий опір лінії Z₀ = 120 Ω</text>

  <!-- Лінія A польової шини -->
  <line x1="410" y1="275" x2="712" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <text x="554" y="295" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Лінія A (Data - / інверсна)</text>

  <!-- Заземлення екрана в ЄДИНІЙ ТОЧЦІ біля шлюзу -->
  <!-- Дріт від екрана до PE -->
  <line x1="436" y1="304" x2="436" y2="350" stroke="#27ae60" stroke-width="2"/>
  <!-- Символ заземлення PE -->
  <line x1="424" y1="350" x2="448" y2="350" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="428" y1="355" x2="444" y2="355" stroke="#27ae60" stroke-width="2"/>
  <line x1="432" y1="360" x2="440" y2="360" stroke="#27ae60" stroke-width="1.5"/>
  <text x="436" y="376" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">PE</text>

  <!-- Пояснення єдиної точки PE -->
  <rect x="456" y="324" width="138" height="68" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="525" y="342" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Єдина точка PE</text>
  <text x="525" y="358" font-size="12" text-anchor="middle" fill="#1a1a1a">Заземлення лише тут</text>
  <text x="525" y="374" font-size="12" text-anchor="middle" fill="#6b7280">Немає петлі струму</text>

  <!-- Позначення незаземленого другого кінця екрана -->
  <rect x="604" y="324" width="90" height="68" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="649" y="342" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Кінець екрана</text>
  <text x="649" y="358" font-size="12" text-anchor="middle" fill="#c0392b">ІЗОЛЬОВАНО</text>
  <text x="649" y="374" font-size="12" text-anchor="middle" fill="#6b7280">Без петлі PE</text>

  <!-- ЗОНА 3: Кінцевий актуатор (Крайній вузол N) -->
  <rect x="702" y="66" width="234" height="338" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="718" y="88" font-size="14" font-weight="700" fill="#1a1a1a">Кінцевий актуатор (Вузол N)</text>
  <text x="718" y="104" font-size="12" fill="#6b7280">Крайній вузол шини: сервопривід / клапан</text>

  <!-- Підпанель актуатора -->
  <rect x="712" y="116" width="214" height="274" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вхідні клеми актуатора -->
  <circle cx="712" cy="205" r="3.5" fill="#2457d6"/>
  <circle cx="712" cy="275" r="3.5" fill="#1a1a1a"/>

  <!-- R_T (Termination 120 Ом) крайнього вузла N -->
  <line x1="712" y1="205" x2="745" y2="205" stroke="#2457d6" stroke-width="2"/>
  <line x1="745" y1="205" x2="745" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="738" y="230" width="14" height="20" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="745" y1="250" x2="745" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="712" y1="275" x2="745" y2="275" stroke="#1a1a1a" stroke-width="2"/>

  <text x="760" y="238" font-size="12" font-weight="700" fill="#2457d6">R_T = 120 Ω</text>
  <text x="760" y="252" font-size="12" fill="#1a1a1a">термінатор 2</text>
  <text x="760" y="266" font-size="12" fill="#6b7280">R_T = Z₀ (край)</text>

  <!-- Продовження ліній до трансивера актуатора -->
  <line x1="745" y1="205" x2="845" y2="205" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="845" y1="205" x2="845" y2="234" stroke="#2457d6" stroke-width="1.5"/>

  <line x1="745" y1="275" x2="845" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="845" y1="275" x2="845" y2="254" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Трансивер актуатора -->
  <rect x="845" y="222" width="68" height="46" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="879" y="242" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">RS-485</text>
  <text x="879" y="257" font-size="12" text-anchor="middle" fill="#6b7280">приймач</text>

  <!-- Зв'язок трансивера з контролером актуатора -->
  <line x1="879" y1="268" x2="879" y2="296" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Мікроконтролер актуатора / Виконавчий механізм -->
  <rect x="726" y="296" width="186" height="54" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="819" y="316" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Контролер приводу / клапана</text>
  <text x="819" y="332" font-size="12" text-anchor="middle" fill="#1a1a1a">Виконання доменних команд</text>
  <text x="819" y="344" font-size="12" text-anchor="middle" fill="#6b7280">Таймаут відповіді вихідного адаптера</text>

  <!-- Локальне живлення актуатора -->
  <text x="819" y="374" font-size="12" text-anchor="middle" fill="#6b7280">Локальне живлення: GND_акт ≠ GND1</text>

  <!-- НИЖНІ ПАНЕЛІ: 3 правила надійності -->
  <rect x="24" y="416" width="296" height="92" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/>
  <text x="36" y="436" font-size="13" font-weight="700" fill="#2457d6">1. Гальванічна розв'язка (≥ 2.5 кВ)</text>
  <text x="36" y="454" font-size="12" fill="#1a1a1a">• DC/DC й ізолятори гасять сплески до 2.5 кВ</text>
  <text x="36" y="470" font-size="12" fill="#1a1a1a">• Розриває контур GND між хостом і цехом</text>
  <text x="36" y="486" font-size="12" fill="#6b7280">• Захищає хост від аварій на актуаторі</text>

  <rect x="332" y="416" width="296" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="344" y="436" font-size="13" font-weight="700" fill="#1a1a1a">2. Захисне зміщення (Fail-Safe Bias)</text>
  <text x="344" y="454" font-size="12" fill="#1a1a1a">• R_PU (+5V) та R_PD (GND) тримають U_AB ≥ 200 мВ</text>
  <text x="344" y="470" font-size="12" fill="#1a1a1a">• Усуває «фантомні байти» в моменти тиші</text>
  <text x="344" y="486" font-size="12" fill="#6b7280">• Фіксує стан MARK при обриві кабелю</text>

  <rect x="640" y="416" width="296" height="92" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/>
  <text x="652" y="436" font-size="13" font-weight="700" fill="#27ae60">3. Узгодження 120 Ом та екран PE</text>
  <text x="652" y="454" font-size="12" fill="#1a1a1a">• R_T = 120 Ω лише на 2 крайніх вузлах</text>
  <text x="652" y="470" font-size="12" fill="#1a1a1a">• Поглинає хвильові відбиття (R_T = Z₀)</text>
  <text x="652" y="486" font-size="12" fill="#6b7280">• Екран заземлено в 1 точці (без петлі PE)</text>
</svg>
