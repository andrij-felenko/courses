<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Ізоляція доменного ядра від протоколу CAN крізь вихідний порт</text>
  <text x="480" y="48" font-size="13" text-anchor="middle" fill="#6b7280">Ядро оперує Value Objects, а CanDamperActuatorAdapter бере на себе DBC-пакування й драйвер CanBusDriver</text>

  <!-- КОЛОНКА 1: ДОМЕННЕ ЯДРО -->
  <rect x="24" y="66" width="270" height="434" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="36" y="88" font-size="14" font-weight="700" fill="#1a1a1a">1. ДОМЕННЕ ЯДРО</text>
  <text x="36" y="104" font-size="12" fill="#6b7280">Чиста бізнес-модель і семантика</text>

  <!-- Блок 1.1: Доменний сервіс та Value Objects -->
  <rect x="36" y="116" width="246" height="124" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="136" font-size="13" font-weight="700" fill="#1a1a1a">VentilationControlService</text>
  <text x="48" y="156" font-size="12" font-weight="700" fill="#2457d6">SetPositionCommand</text>
  <text x="48" y="174" font-size="12" fill="#1a1a1a">• DamperId(&quot;damper-01&quot;)</text>
  <text x="48" y="192" font-size="12" fill="#1a1a1a">• DamperPosition(75.0%)</text>
  <text x="48" y="210" font-size="12" fill="#6b7280">інваріант: [0.0..100.0]%</text>
  <text x="48" y="228" font-size="12" font-weight="700" fill="#2457d6">виклик: port.set_position() ➔</text>

  <!-- Блок 1.2: Вихідний порт та опрацювання Result -->
  <rect x="36" y="252" width="246" height="124" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="48" y="272" font-size="13" font-weight="700" fill="#2457d6">«interface» DamperActuatorPort</text>
  <text x="48" y="292" font-size="12" font-weight="700" fill="#1a1a1a">+ set_position(id, pos)</text>
  <text x="48" y="310" font-size="12" font-weight="700" fill="#2457d6">    ➔ Result&lt;(), ActuatorError&gt;</text>
  <text x="48" y="332" font-size="12" font-weight="700" fill="#27ae60">Ok(()) ➔ підтвердити 75.0%</text>
  <text x="48" y="350" font-size="12" font-weight="700" fill="#c0392b">Err(Stall) ➔ зупинити потік</text>
  <text x="48" y="366" font-size="12" fill="#6b7280">Err(Offline) ➔ аварійний байпас</text>

  <!-- Блок 1.3: Захист бізнес-моделі -->
  <rect x="36" y="388" width="246" height="98" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="48" y="408" font-size="13" font-weight="700" fill="#27ae60">✓ Захист чистоти домену</text>
  <text x="48" y="428" font-size="12" fill="#1a1a1a">• Нуль бітів чи масок CAN</text>
  <text x="48" y="446" font-size="12" fill="#1a1a1a">• Повна відсутність DBC у типах</text>
  <text x="48" y="464" font-size="12" fill="#1a1a1a">• Обробка Result без винятків</text>

  <!-- КОЛОНКА 2: ВИХІДНИЙ АДАПТЕР -->
  <rect x="314" y="66" width="352" height="434" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="326" y="88" font-size="14" font-weight="700" fill="#2457d6">2. ВИХІДНИЙ АДАПТЕР (OUTBOUND)</text>
  <text x="326" y="104" font-size="12" fill="#6b7280">Інкапсуляція протокольних структур CAN</text>

  <!-- Блок 2.1: Клас адаптера та DBC пакування -->
  <rect x="326" y="116" width="328" height="160" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="338" y="136" font-size="13" font-weight="700" fill="#1a1a1a">CanDamperActuatorAdapter</text>
  <text x="338" y="152" font-size="12" font-weight="700" fill="#2457d6">implements DamperActuatorPort</text>
  <text x="338" y="172" font-size="12" fill="#1a1a1a">• Квантування: 75.0% ➔ Raw = 750 (0.1%/LSB)</text>
  <text x="338" y="190" font-size="12" fill="#1a1a1a">• Little-Endian (Intel): data[1..2] = 750</text>
  <text x="338" y="208" font-size="12" fill="#1a1a1a">• Rolling counter: counter++ (4 біти, byte 6)</text>
  <text x="338" y="226" font-size="12" fill="#1a1a1a">• Контрольна сума: CRC-8 (byte 7)</text>
  <text x="338" y="246" font-size="12" font-weight="700" fill="#2457d6">➔ CanFrame (ID: 0x18F01D02, DLC: 8):</text>
  <text x="338" y="264" font-size="12" fill="#1a1a1a">[ 0x01 | 0xEE | 0x02 | 0x00 | 0x00 | 0x00 | 0x3C | 0x8A ]</text>

  <!-- Блок 2.2: Бар'єр ізоляції помилок -->
  <rect x="326" y="288" width="328" height="106" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="338" y="308" font-size="13" font-weight="700" fill="#c0392b">Ізоляція збоїв (CAN ➔ Доменний Result):</text>
  <text x="338" y="328" font-size="12" fill="#c0392b">• CAN Timeout / No ACK ➔ Err(DeviceOffline)</text>
  <text x="338" y="346" font-size="12" fill="#c0392b">• Струм двигуна &gt; I_max ➔ Err(MechanicalStall)</text>
  <text x="338" y="364" font-size="12" fill="#c0392b">• Збій CRC або counter ➔ Err(ProtocolCorrupt)</text>
  <text x="338" y="382" font-size="12" fill="#c0392b">• Bus-Off стан шини ➔ Err(BusFailure)</text>

  <!-- Блок 2.3: Приховування шини -->
  <rect x="326" y="406" width="328" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="338" y="426" font-size="13" font-weight="700" fill="#2457d6">✓ Роль адаптера (Інкапсуляція):</text>
  <text x="338" y="446" font-size="12" fill="#1a1a1a">CAN-кадри, DBC та драйвер сховані всередині.</text>
  <text x="338" y="464" font-size="12" fill="#1a1a1a">Зміна формату кадру не торкається ядра.</text>

  <!-- КОЛОНКА 3: ДРАЙВЕР ТА АКТУАТОР -->
  <rect x="686" y="66" width="250" height="434" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="698" y="88" font-size="14" font-weight="700" fill="#1a1a1a">3. ДРАЙВЕР І АКТУАТОР</text>
  <text x="698" y="104" font-size="12" fill="#6b7280">Апаратний рівень та фізична шина</text>

  <!-- Блок 3.1: Абстрактний драйвер шини -->
  <rect x="698" y="116" width="226" height="104" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="136" font-size="13" font-weight="700" fill="#1a1a1a">«interface» CanBusDriver</text>
  <text x="710" y="156" font-size="12" font-weight="700" fill="#2457d6">+ transmit(frame: CanFrame)</text>
  <text x="710" y="176" font-size="12" fill="#1a1a1a">• Mailbox буфери TX/RX</text>
  <text x="710" y="194" font-size="12" fill="#1a1a1a">• Черга повідомлень FIFO</text>
  <text x="710" y="210" font-size="12" fill="#6b7280">SocketCAN / HAL контролера</text>

  <!-- Блок 3.2: Фізична шина CAN -->
  <rect x="698" y="232" width="226" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="252" font-size="13" font-weight="700" fill="#1a1a1a">Шина CAN 2.0B (500 кбіт/с)</text>
  <text x="710" y="272" font-size="12" fill="#1a1a1a">• Диф. пара CAN_H / CAN_L</text>
  <text x="710" y="290" font-size="12" fill="#1a1a1a">• Термінатори 120 Ом</text>
  <text x="710" y="308" font-size="12" fill="#1a1a1a">• Арбітраж CSMA/CR за ID</text>
  <text x="710" y="326" font-size="12" fill="#6b7280">Стійкість до завад і колізій</text>

  <!-- Блок 3.3: Сервопривід заслінки -->
  <rect x="698" y="354" width="226" height="132" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="710" y="374" font-size="13" font-weight="700" fill="#2457d6">Сервопривід заслінки</text>
  <text x="710" y="394" font-size="12" fill="#1a1a1a">• Вбудований мікроконтролер</text>
  <text x="710" y="412" font-size="12" fill="#1a1a1a">• Верифікація CRC і counter</text>
  <text x="710" y="430" font-size="12" fill="#1a1a1a">• Кроковий мотор заслінки</text>
  <text x="710" y="448" font-size="12" fill="#1a1a1a">• Енкодер кута положення</text>
  <text x="710" y="470" font-size="12" font-weight="700" fill="#27ae60">Поворот заслінки на 75.0%</text>

  <!-- СТРІЛКИ ЗВ'ЯЗКУ МІЖ ЗОНАМИ -->
  <!-- 1.1 -> 1.2: Внутрішній виклик команди до порту -->
  <line x1="159" y1="240" x2="159" y2="252" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 2.1 -> 1.2: Адаптер реалізує (implements) порт -->
  <line x1="326" y1="140" x2="282" y2="265" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>

  <!-- 1.2 -> 2.1: Виклик порту передається в конвеєр адаптера -->
  <line x1="282" y1="285" x2="326" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 2.1 -> 3.1: Адаптер передає CanFrame драйверу CanBusDriver -->
  <line x1="654" y1="250" x2="698" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 3.1 -> 3.2: Драйвер передає кадр у фізичну шину CAN -->
  <line x1="811" y1="220" x2="811" y2="232" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3.2 -> 3.3: Кадр з шини надходить до сервоприводу заслінки -->
  <line x1="811" y1="342" x2="811" y2="354" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 3.3 -> 2.2: Телеметрія / помилки з шини надходять в адаптер -->
  <line x1="698" y1="375" x2="654" y2="340" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- 2.2 -> 1.2: Адаптер повертає типізований Result у порт -->
  <line x1="326" y1="355" x2="282" y2="330" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
