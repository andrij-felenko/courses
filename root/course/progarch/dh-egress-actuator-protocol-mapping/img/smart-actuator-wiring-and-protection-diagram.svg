<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Безпечне підключення контролера: гальванічна розв'язка, TVS-захист та демпфування</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Повне розділення сигнальної та силової земель усуває ground bounce, супресори й діоди гасять перенапругу</text>

  <!-- ==================== ПАНЕЛЬ 1: ВХІД ШИНИ ТА РОЗВ'ЯЗКА ==================== -->
  <rect x="24" y="68" width="270" height="318" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="159" y="88" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ЦЕХОВА ДИФЕРЕНЦІАЛЬНА ШИНА</text>
  <text x="159" y="104" font-size="12" fill="#6b7280" text-anchor="middle">Гальванічна розв'язка та TVS-захист</text>

  <!-- Лінія A (Data+) -->
  <line x1="36" y1="132" x2="146" y2="132" stroke="#2457d6" stroke-width="2"/>
  <circle cx="36" cy="132" r="3.5" fill="#2457d6"/>
  <text x="36" y="124" font-size="12" font-weight="bold" fill="#2457d6">A (Data+)</text>

  <!-- Лінія B (Data-) -->
  <line x1="36" y1="188" x2="146" y2="188" stroke="#2457d6" stroke-width="2"/>
  <circle cx="36" cy="188" r="3.5" fill="#2457d6"/>
  <text x="36" y="202" font-size="12" font-weight="bold" fill="#2457d6">B (Data-)</text>

  <!-- Термінатор R_term -->
  <line x1="72" y1="132" x2="72" y2="148" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="72" cy="132" r="3" fill="#2457d6"/>
  <rect x="66" y="148" width="12" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="72" y1="172" x2="72" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="72" cy="188" r="3" fill="#2457d6"/>
  <text x="60" y="156" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R_term</text>
  <text x="60" y="170" font-size="12" fill="#6b7280" text-anchor="end">120 Ω</text>

  <!-- TVS супресори модуль -->
  <line x1="112" y1="132" x2="112" y2="148" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="112" cy="132" r="3" fill="#2457d6"/>
  <rect x="94" y="148" width="36" height="24" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="112" y="164" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">TVS</text>
  <line x1="112" y1="172" x2="112" y2="188" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="112" cy="188" r="3" fill="#2457d6"/>
  <!-- Провід від TVS до ISO_GND зсунутий вліво, щоб не перетинати напис -->
  <path d="M 94,160 L 86,160 L 86,236" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="86" cy="236" r="3" fill="#27ae60"/>
  <text x="116" y="202" font-size="12" font-weight="bold" fill="#27ae60">TVS захист</text>
  <text x="116" y="216" font-size="12" fill="#6b7280">від ESD</text>

  <!-- Трансивер RS-485 -->
  <rect x="146" y="120" width="54" height="80" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="173" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Трансивер</text>
  <text x="173" y="164" font-size="12" fill="#6b7280" text-anchor="middle">RS-485</text>

  <!-- Лінії зв'язку трансивер -> ізолятор -->
  <line x1="200" y1="142" x2="226" y2="142" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="226" y1="178" x2="200" y2="178" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Гальванічний ізолятор (опторозв'язка) -->
  <rect x="226" y="124" width="56" height="72" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="254" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Опто-</text>
  <text x="254" y="168" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">розв'язка</text>

  <!-- Пунктир бар'єра ізоляції -->
  <line x1="254" y1="110" x2="254" y2="124" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="254" y1="196" x2="254" y2="266" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="254" y="280" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Бар'єр 2.5 кВ</text>

  <!-- Шина ISO_GND -->
  <line x1="40" y1="236" x2="198" y2="236" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="40" y1="236" x2="40" y2="246" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="34" y1="246" x2="46" y2="246" stroke="#6b7280" stroke-width="2"/>
  <line x1="37" y1="250" x2="43" y2="250" stroke="#6b7280" stroke-width="1.5"/>
  <text x="54" y="254" font-size="12" font-weight="bold" fill="#6b7280">ISO_GND (земля шини)</text>

  <!-- Нижня плашка панелі 1 -->
  <rect x="36" y="322" width="246" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="159" y="342" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">✔ Повна гальванічна ізоляція</text>
  <text x="159" y="358" font-size="12" fill="#1a1a1a" text-anchor="middle">Захист логіки від аварій у мережі</text>

  <!-- ==================== ПАНЕЛЬ 2: КОНТРОЛЕР ТА H-МІСТ ==================== -->
  <rect x="306" y="68" width="394" height="318" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="503" y="88" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">РОЗУМНИЙ КОНТРОЛЕР ТА H-МІСТ</text>
  <text x="503" y="104" font-size="12" fill="#6b7280" text-anchor="middle">Логічний мікроконтролер, фільтр C_dec та силовий міст</text>

  <!-- MCU Box -->
  <rect x="318" y="120" width="102" height="132" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="369" y="142" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU</text>
  <text x="369" y="160" font-size="12" fill="#1a1a1a" text-anchor="middle">Регістри / FSM</text>
  <text x="369" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Таймер ШІМ</text>
  <text x="369" y="196" font-size="12" fill="#6b7280" text-anchor="middle">Контроль струму</text>
  <text x="369" y="240" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SGND</text>

  <!-- Зв'язок ізолятор -> MCU -->
  <line x1="282" y1="142" x2="318" y2="142" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="296" y="136" font-size="12" font-weight="bold" fill="#2457d6">Rx</text>
  <line x1="318" y1="178" x2="282" y2="178" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="296" y="194" font-size="12" font-weight="bold" fill="#2457d6">Tx</text>

  <!-- C_dec фільтр живлення логіки -->
  <rect x="318" y="262" width="102" height="48" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="369" y="280" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C_dec: 100 нФ</text>
  <text x="369" y="296" font-size="12" fill="#6b7280" text-anchor="middle">кераміка біля VDD</text>

  <!-- Лінії керування ШІМ від MCU до моста -->
  <line x1="420" y1="150" x2="456" y2="150" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="424" y="142" font-size="12" font-weight="bold" fill="#2457d6">ШІМ_A</text>
  <line x1="420" y1="210" x2="456" y2="210" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="424" y="226" font-size="12" font-weight="bold" fill="#2457d6">ШІМ_B</text>

  <!-- Шина VM (+24V) -->
  <line x1="462" y1="126" x2="682" y2="126" stroke="#c0392b" stroke-width="2"/>
  <circle cx="462" cy="126" r="3.5" fill="#c0392b"/>
  <text x="464" y="118" font-size="12" font-weight="bold" fill="#c0392b">VM (+24 В)</text>

  <!-- Шина PGND силового моста -->
  <line x1="462" y1="264" x2="682" y2="264" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="462" cy="264" r="3.5" fill="#1a1a1a"/>
  <text x="464" y="280" font-size="12" font-weight="bold" fill="#1a1a1a">PGND (силова)</text>

  <!-- Конденсатор C_bulk 470 мкФ -->
  <line x1="486" y1="126" x2="486" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="486" cy="126" r="3" fill="#c0392b"/>
  <line x1="478" y1="185" x2="494" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="478" y1="191" x2="494" y2="191" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="486" y1="191" x2="486" y2="264" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="486" cy="264" r="3" fill="#1a1a1a"/>
  <text x="498" y="184" font-size="12" font-weight="bold" fill="#1a1a1a">C_bulk</text>
  <text x="498" y="198" font-size="12" fill="#6b7280">470 мкФ</text>

  <!-- ПЛЕЧЕ A: Q1, Q2, D1, D2 -->
  <!-- Ключ Q1 -->
  <line x1="536" y1="126" x2="536" y2="152" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="526" y="152" width="20" height="24" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="536" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q1</text>
  <line x1="536" y1="176" x2="536" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Діод D1 (Шотткі антипаралельно Q1) -->
  <line x1="570" y1="126" x2="570" y2="152" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="570" cy="126" r="3" fill="#c0392b"/>
  <!-- Діод спрямований вгору до VM: анод внизу (172), катод вгорі (152) -->
  <line x1="562" y1="152" x2="578" y2="152" stroke="#27ae60" stroke-width="1.5"/>
  <polygon points="562,172 578,172 570,152" fill="#27ae60"/>
  <line x1="570" y1="172" x2="570" y2="190" stroke="#27ae60" stroke-width="1.5"/>
  <text x="582" y="166" font-size="12" font-weight="bold" fill="#27ae60">D1</text>

  <!-- Середня точка плеча A (OUT_A) -->
  <line x1="536" y1="190" x2="570" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="536" cy="190" r="3" fill="#1a1a1a"/>
  <circle cx="570" cy="190" r="3" fill="#1a1a1a"/>

  <!-- Ключ Q2 -->
  <line x1="536" y1="190" x2="536" y2="214" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="526" y="214" width="20" height="24" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="536" y="230" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q2</text>
  <line x1="536" y1="238" x2="536" y2="264" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="536" cy="264" r="3" fill="#1a1a1a"/>

  <!-- Діод D2 (Шотткі антипаралельно Q2) -->
  <line x1="570" y1="190" x2="570" y2="214" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Діод спрямований вгору до OUT_A: анод внизу (234), катод вгорі (214) -->
  <line x1="562" y1="214" x2="578" y2="214" stroke="#27ae60" stroke-width="1.5"/>
  <polygon points="562,234 578,234 570,214" fill="#27ae60"/>
  <line x1="570" y1="234" x2="570" y2="264" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="570" cy="264" r="3" fill="#1a1a1a"/>
  <text x="582" y="228" font-size="12" font-weight="bold" fill="#27ae60">D2</text>

  <!-- ПЛЕЧЕ B: Q3, Q4, D3, D4 -->
  <!-- Ключ Q3 -->
  <line x1="624" y1="126" x2="624" y2="152" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="614" y="152" width="20" height="24" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="624" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q3</text>
  <line x1="624" y1="176" x2="624" y2="204" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Діод D3 (Шотткі антипаралельно Q3) -->
  <line x1="658" y1="126" x2="658" y2="152" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="658" cy="126" r="3" fill="#c0392b"/>
  <!-- Діод спрямований вгору до VM -->
  <line x1="650" y1="152" x2="666" y2="152" stroke="#27ae60" stroke-width="1.5"/>
  <polygon points="650,172 666,172 658,152" fill="#27ae60"/>
  <line x1="658" y1="172" x2="658" y2="204" stroke="#27ae60" stroke-width="1.5"/>
  <text x="670" y="166" font-size="12" font-weight="bold" fill="#27ae60">D3</text>

  <!-- Середня точка плеча B (OUT_B) -->
  <line x1="624" y1="204" x2="658" y2="204" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="624" cy="204" r="3" fill="#1a1a1a"/>
  <circle cx="658" cy="204" r="3" fill="#1a1a1a"/>

  <!-- Ключ Q4 -->
  <line x1="624" y1="204" x2="624" y2="214" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="614" y="214" width="20" height="24" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="624" y="230" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q4</text>
  <line x1="624" y1="238" x2="624" y2="264" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="624" cy="264" r="3" fill="#1a1a1a"/>

  <!-- Діод D4 (Шотткі антипаралельно Q4) -->
  <line x1="658" y1="204" x2="658" y2="214" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Діод спрямований вгору до OUT_B -->
  <line x1="650" y1="214" x2="666" y2="214" stroke="#27ae60" stroke-width="1.5"/>
  <polygon points="650,234 666,234 658,214" fill="#27ae60"/>
  <line x1="658" y1="234" x2="658" y2="264" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="658" cy="264" r="3" fill="#1a1a1a"/>
  <text x="670" y="228" font-size="12" font-weight="bold" fill="#27ae60">D4</text>

  <!-- Нижня плашка панелі 2 -->
  <rect x="318" y="322" width="370" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="503" y="342" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зворотні демпферні діоди Шотткі D1–D4</text>
  <text x="503" y="358" font-size="12" fill="#1a1a1a" text-anchor="middle">Миттєве гасіння струму самоіндукції (trr &lt; 25 нс)</text>

  <!-- ==================== ПАНЕЛЬ 3: ДВИГУН ТА ЕРС ==================== -->
  <rect x="712" y="68" width="224" height="318" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="824" y="88" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ЕЛЕКТРОПРИВОД (ДВИГУН)</text>
  <text x="824" y="104" font-size="12" fill="#6b7280" text-anchor="middle">Індуктивне навантаження актуатора</text>

  <!-- Виводи OUT_A та OUT_B до двигуна -->
  <!-- OUT_A: від (570, 190) до двигуна -->
  <line x1="570" y1="190" x2="618" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 618,190 A 6,6 0 0 1 630,190 L 804,190" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- OUT_B: від (658, 204) до двигуна -->
  <line x1="658" y1="204" x2="804" y2="204" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Символ двигуна -->
  <circle cx="824" cy="197" r="20" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="824" y="203" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>

  <text x="824" y="146" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обмотка двигуна</text>
  <text x="824" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Індуктивність L_m</text>

  <!-- Картка захисту від ЕРС -->
  <rect x="724" y="236" width="200" height="74" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="824" y="254" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠ Зворотна ЕРС двигуна</text>
  <text x="824" y="272" font-size="12" fill="#1a1a1a" text-anchor="middle">V_emf = -L_m · (di/dt) &gt; 100 В</text>
  <text x="824" y="290" font-size="12" fill="#27ae60" text-anchor="middle">Скидання через D1–D4 у VM</text>
  <text x="824" y="304" font-size="12" fill="#6b7280" text-anchor="middle">Захист ключів від пробою</text>

  <!-- Нижня плашка панелі 3 -->
  <rect x="724" y="322" width="200" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="824" y="342" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ Клемпінг напруги</text>
  <text x="824" y="358" font-size="12" fill="#1a1a1a" text-anchor="middle">Рівень обрізання: VM + V_F</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: РОЗДІЛЕННЯ ЗЕМЕЛЬ ==================== -->
  <rect x="24" y="398" width="912" height="106" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Блок живлення -->
  <rect x="36" y="412" width="168" height="80" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="120" y="430" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ДЖЕРЕЛО ЖИВЛЕННЯ</text>
  <text x="48" y="452" font-size="12" font-weight="bold" fill="#c0392b">VM (+24 В)</text>
  <text x="48" y="474" font-size="12" font-weight="bold" fill="#2457d6">VDD (+3.3 В)</text>

  <!-- Точка Star GND на клемі 0 В -->
  <circle cx="190" cy="460" r="5" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="185" y="444" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Star GND</text>

  <!-- Провід чистої сигнальної землі SGND (до MCU) -->
