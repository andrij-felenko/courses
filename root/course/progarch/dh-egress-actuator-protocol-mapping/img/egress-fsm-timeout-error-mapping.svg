<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Скінченний автомат (FSM) трансляції вихідної команди актуатора</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Контроль бюджету WCET, ідемпотентні повтори та ізоляція апаратних збоїв у Result</text>

  <!-- Верхня панель: Бюджет WCET та гарантія ідемпотентності -->
  <rect x="24" y="68" width="912" height="42" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="38" y="93" font-size="12" font-weight="bold" fill="#1a1a1a">Бюджет циклу WCET:</text>
  <text x="168" y="93" font-size="12" font-weight="bold" fill="#2457d6">(N + 1) · T_ack + N · T_retry + T_move</text>
  <text x="490" y="93" font-size="12" font-weight="bold" fill="#1a1a1a">Ідемпотентність:</text>
  <text x="605" y="93" font-size="12" fill="#6b7280">Абсолютна уставка Pos (повтори кадру не зсувають шток)</text>

  <!-- ==================== ВХІД І ПЕРЕВІРКА ДЕДЛАЙНУ ==================== -->
  <!-- Блок: Доменна команда -->
  <rect x="24" y="126" width="118" height="84" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="83" y="146" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Команда ядра</text>
  <text x="83" y="165" font-size="12" fill="#1a1a1a" text-anchor="middle">SetPosition(Pos)</text>
  <text x="83" y="183" font-size="12" fill="#6b7280" text-anchor="middle">Дедлайн: t_dl</text>
  <text x="83" y="200" font-size="12" fill="#6b7280" text-anchor="middle">CancellationToken</text>

  <!-- Стрілка від команди до перевірки дедлайну -->
  <line x1="142" y1="168" x2="166" y2="168" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Блок перевірки WCET -->
  <rect x="166" y="132" width="94" height="72" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="213" y="158" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_dl ≥ WCET?</text>
  <text x="213" y="176" font-size="12" fill="#6b7280" text-anchor="middle">Перевірка</text>
  <text x="213" y="192" font-size="12" fill="#6b7280" text-anchor="middle">бюджету</text>

  <!-- Стрілка переходу: Так (до SEND_FRAME) -->
  <line x1="260" y1="168" x2="294" y2="168" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="277" y="159" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Так</text>

  <!-- Стрілка переходу: Ні (дефіцит часу -> DeadlineExceeded) -->
  <line x1="176" y1="204" x2="176" y2="402" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="168" y="276" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Ні (дефіцит часу)</text>

  <!-- ==================== СТАНИ FSM (РЯДОК 1) ==================== -->
  <!-- Стан 1: SEND_FRAME -->
  <rect x="294" y="126" width="148" height="84" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="368" y="147" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. SEND_FRAME</text>
  <text x="368" y="167" font-size="12" fill="#1a1a1a" text-anchor="middle">Захоплення шини</text>
  <text x="368" y="184" font-size="12" fill="#1a1a1a" text-anchor="middle">Кадр: абсолютна Pos</text>
  <text x="368" y="201" font-size="12" fill="#6b7280" text-anchor="middle">Передача TX у дріт</text>

  <!-- Стрілка від SEND_FRAME до AWAIT_ACK -->
  <line x1="442" y1="168" x2="502" y2="168" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="472" y="159" font-size="12" fill="#1a1a1a" text-anchor="middle">TX OK</text>

  <!-- Стан 2: AWAIT_ACK -->
  <rect x="502" y="126" width="150" height="84" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="577" y="147" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. AWAIT_ACK</text>
  <text x="577" y="167" font-size="12" fill="#1a1a1a" text-anchor="middle">Таймер t ≤ T_ack</text>
  <text x="577" y="184" font-size="12" fill="#1a1a1a" text-anchor="middle">Очікування квитанції</text>
  <text x="577" y="201" font-size="12" fill="#6b7280" text-anchor="middle">Звільнення шини</text>

  <!-- Стрілка від AWAIT_ACK до MONITOR_MOVE -->
  <line x1="652" y1="168" x2="712" y2="168" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="682" y="159" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ACK OK</text>

  <!-- Стан 3: MONITOR_MOVE -->
  <rect x="712" y="126" width="150" height="84" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="787" y="147" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. MONITOR_MOVE</text>
  <text x="787" y="167" font-size="12" fill="#1a1a1a" text-anchor="middle">Опитування t ≤ T_move</text>
  <text x="787" y="184" font-size="12" fill="#1a1a1a" text-anchor="middle">Квант Status Word</text>
  <text x="787" y="201" font-size="12" fill="#6b7280" text-anchor="middle">Контроль заклинювання</text>

  <!-- ==================== ПОВТОРНІ СПРОБИ (РЯДОК 2) ==================== -->
  <!-- Стан повторів: RETRY_WAIT -->
  <rect x="294" y="254" width="154" height="74" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="371" y="274" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RETRY_WAIT (retry &lt; N)</text>
  <text x="371" y="293" font-size="12" fill="#1a1a1a" text-anchor="middle">Пауза T_retry (backoff)</text>
  <text x="371" y="310" font-size="12" fill="#6b7280" text-anchor="middle">Повтор абсолютної Pos</text>

  <!-- Перехід від AWAIT_ACK до RETRY_WAIT (таймаут квитування) -->
  <path d="M 518 210 L 518 280 L 448 280" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="484" y="272" font-size="12" fill="#2457d6" text-anchor="middle">t &gt; T_ack</text>

  <!-- Повернення з RETRY_WAIT до SEND_FRAME -->
  <line x1="368" y1="254" x2="368" y2="210" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="360" y="236" font-size="12" fill="#2457d6" text-anchor="end">Повтор TX (retry++)</text>

  <!-- Перехід від RETRY_WAIT вниз до DeviceOffline (вичерпано спроби N) -->
  <line x1="294" y1="328" x2="294" y2="402" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="302" y="362" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Вичерпано N спроб</text>

  <!-- Перехід від AWAIT_ACK вниз до HardwareFault (апаратний код помилки) -->
  <line x1="562" y1="210" x2="562" y2="402" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="570" y="342" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Апаратний код помилки</text>

  <!-- Перехід від MONITOR_MOVE вниз до MechanicalStall -->
  <line x1="740" y1="210" x2="740" y2="402" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="732" y="362" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Заклинювання / надструм</text>

  <!-- Перехід від MONITOR_MOVE вниз до Ok(Completed) -->
  <line x1="830" y1="210" x2="830" y2="402" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="838" y="286" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Ціль досягнуто</text>
  <text x="838" y="304" font-size="12" fill="#27ae60" text-anchor="start">TargetReached = 1</text>

  <!-- ==================== АНТИКОРУПЦІЙНИЙ ШАР / RESULT ==================== -->
  <!-- Межа ACL: напис у вільній зоні ліворуч (x < 165) -->
  <text x="24" y="364" font-size="12" font-weight="bold" fill="#6b7280">МЕЖА ACL</text>
  <text x="24" y="380" font-size="12" fill="#6b7280">Трансляція в Result</text>
  <!-- Пунктирні розділювачі між стрілками -->
  <line x1="24" y1="388" x2="160" y2="388" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="192" y1="388" x2="280" y2="388" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="310" y1="388" x2="546" y2="388" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="578" y1="388" x2="724" y2="388" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="756" y1="388" x2="814" y2="388" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="846" y1="388" x2="936" y2="388" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Картка 1: DeadlineExceeded -->
  <rect x="24" y="402" width="168" height="136" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="108" y="424" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Err(DeadlineExceeded)</text>
  <text x="108" y="444" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ДЕФІЦИТ ЧАСУ</text>
  <text x="108" y="466" font-size="12" fill="#1a1a1a" text-anchor="middle">t_dl &lt; WCET</text>
  <text x="108" y="484" font-size="12" fill="#6b7280" text-anchor="middle">Відхилено до старту</text>
  <text x="108" y="502" font-size="12" fill="#6b7280" text-anchor="middle">Шток не зрушено</text>
  <text x="108" y="520" font-size="12" fill="#6b7280" text-anchor="middle">Шина вільна</text>

  <!-- Картка 2: DeviceOffline -->
  <rect x="210" y="402" width="168" height="136" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="294" y="424" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Err(DeviceOffline)</text>
  <text x="294" y="444" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ТАЙМАУТ ШИНИ</text>
  <text x="294" y="466" font-size="12" fill="#1a1a1a" text-anchor="middle">Немає ACK після N спроб</text>
  <text x="294" y="484" font-size="12" fill="#6b7280" text-anchor="middle">Привід мовчить</text>
  <text x="294" y="502" font-size="12" fill="#6b7280" text-anchor="middle">Обрив / знеструмлення</text>
  <text x="294" y="520" font-size="12" fill="#6b7280" text-anchor="middle">М'ютекс звільнено</text>

  <!-- Картка 3: HardwareFault -->
  <rect x="396" y="402" width="168" height="136" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="424" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Err(HardwareFault)</text>
  <text x="480" y="444" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ЗБІЙ ПРИСТРОЮ</text>
  <text x="480" y="466" font-size="12" fill="#1a1a1a" text-anchor="middle">Апаратний код помилки</text>
  <text x="480" y="484" font-size="12" fill="#6b7280" text-anchor="middle">CRC / збій пам'яті</text>
  <text x="480" y="502" font-size="12" fill="#6b7280" text-anchor="middle">Повтори заборонено</text>
  <text x="480" y="520" font-size="12" fill="#6b7280" text-anchor="middle">Безпечна зупинка</text>

  <!-- Картка 4: MechanicalStall -->
  <rect x="582" y="402" width="168" height="136" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="666" y="424" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Err(MechanicalStall)</text>
  <text x="666" y="444" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ЗАКЛИНЮВАННЯ</text>
  <text x="666" y="466" font-size="12" fill="#1a1a1a" text-anchor="middle">Струм двигуна I &gt; I_max</text>
  <text x="666" y="484" font-size="12" fill="#6b7280" text-anchor="middle">Аварія в Status Word</text>
  <text x="666" y="502" font-size="12" fill="#6b7280" text-anchor="middle">Знеструмлення обмоток</text>
  <text x="666" y="520" font-size="12" fill="#6b7280" text-anchor="middle">Захист редуктора</text>

  <!-- Картка 5: Ok(Completed) -->
  <rect x="768" y="402" width="168" height="136" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="852" y="424" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Ok(Completed)</text>
  <text x="852" y="444" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">УСПІХ ОПЕРАЦІЇ</text>
  <text x="852" y="466" font-size="12" fill="#1a1a1a" text-anchor="middle">TargetReached = 1</text>
  <text x="852" y="484" font-size="12" fill="#6b7280" text-anchor="middle">Шток у позиції Pos</text>
  <text x="852" y="502" font-size="12" fill="#6b7280" text-anchor="middle">Час t_exec ≤ WCET</text>
  <text x="852" y="520" font-size="12" fill="#6b7280" text-anchor="middle">Шину звільнено</text>
</svg>
