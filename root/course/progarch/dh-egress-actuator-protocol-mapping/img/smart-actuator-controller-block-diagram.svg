<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="560" fill="white"/>

<defs>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
  <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
  </marker>
</defs>

<!-- Main Header -->
<text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня архітектура розумного контролера актуатора</text>
<text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Регістрове ядро та FSM керують H-мостом через драйвер, спираючись на струм і кінцевики</text>

<!-- ==========================================
     ZONE 1: EXTERNAL FIELDBUS & HOST
     ========================================== -->
<rect x="24" y="68" width="88" height="466" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="68" y="90" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ШИНА ЗВ'ЯЗКУ</text>

<!-- Host Adapter Box -->
<rect x="32" y="104" width="72" height="62" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="68" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Доменний</text>
<text x="68" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">адаптер</text>
<text x="68" y="154" font-size="12" fill="#6b7280" text-anchor="middle">(Host ПЛК)</text>

<!-- Bus Protocol Info -->
<rect x="32" y="180" width="72" height="74" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
<text x="68" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RS-485</text>
<text x="68" y="214" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CANopen</text>
<text x="68" y="232" font-size="12" fill="#6b7280" text-anchor="middle">Modbus RTU</text>
<text x="68" y="246" font-size="12" fill="#6b7280" text-anchor="middle">диф. лінії</text>

<!-- Bus Flow Description -->
<rect x="32" y="270" width="72" height="96" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="68" y="288" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Потік даних</text>
<text x="68" y="308" font-size="12" fill="#2457d6" text-anchor="middle">Команди ↓</text>
<text x="68" y="324" font-size="12" fill="#6b7280" text-anchor="middle">ціль, пуск</text>
<text x="68" y="344" font-size="12" fill="#27ae60" text-anchor="middle">↑ Статуси</text>
<text x="68" y="358" font-size="12" fill="#6b7280" text-anchor="middle">струм, клин</text>

<!-- ==========================================
     ZONE 2: LOGIC DOMAIN (VDD = 3.3 V)
     ========================================== -->
<rect x="124" y="68" width="338" height="466" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="136" y="90" font-size="13" font-weight="bold" fill="#2457d6">СИГНАЛЬНЕ КОЛО (Logic, VDD = 3.3 В, GND)</text>

<!-- Transceiver Box -->
<rect x="134" y="140" width="84" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="176" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Шинний</text>
<text x="176" y="176" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">трансивер</text>
<text x="176" y="194" font-size="12" fill="#6b7280" text-anchor="middle">RS-485 / CAN</text>
<line x1="142" y1="204" x2="210" y2="204" stroke="#d0d7de" stroke-width="1"/>
<text x="176" y="222" font-size="12" fill="#1a1a1a" text-anchor="middle">Диф. каскад</text>
<text x="176" y="240" font-size="12" fill="#1a1a1a" text-anchor="middle">TVS-захист</text>

<!-- Lines from Bus to Transceiver -->
<line x1="104" y1="184" x2="134" y2="184" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<line x1="134" y1="224" x2="104" y2="224" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

<!-- MCU Box -->
<rect x="230" y="104" width="222" height="418" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="238" y="112" width="206" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="341" y="128" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер (MCU, 3.3 В)</text>

<!-- Register Map -->
<rect x="238" y="142" width="206" height="110" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="341" y="159" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регістрова пам'ять (Modbus/CAN)</text>

<text x="246" y="178" font-size="12" font-weight="bold" fill="#2457d6">0x00 TARGET_POS</text>
<text x="436" y="178" font-size="12" fill="#6b7280" text-anchor="end">цільова позиція</text>

<text x="246" y="198" font-size="12" font-weight="bold" fill="#2457d6">0x04 CTRL_WORD</text>
<text x="436" y="198" font-size="12" fill="#6b7280" text-anchor="end">пуск / напрямок</text>

<text x="246" y="218" font-size="12" font-weight="bold" fill="#27ae60">0x10 STATUS_WORD</text>
<text x="436" y="218" font-size="12" fill="#6b7280" text-anchor="end">стан приводу</text>

<text x="246" y="238" font-size="12" font-weight="bold" fill="#c0392b">0x14 FAULT_FLAGS</text>
<text x="436" y="238" font-size="12" fill="#6b7280" text-anchor="end">клин / перевант.</text>

<!-- Lines between Transceiver and MCU -->
<line x1="218" y1="184" x2="238" y2="184" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<line x1="238" y1="224" x2="218" y2="224" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

<!-- Arrow from Register Map to FSM -->
<line x1="341" y1="252" x2="341" y2="264" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

<!-- FSM Block -->
<rect x="238" y="264" width="206" height="106" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="341" y="281" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішній автомат станів (FSM)</text>

<!-- State Pills -->
<rect x="246" y="290" width="94" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="293" y="306" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ГОТОВНІСТЬ</text>

<rect x="344" y="290" width="92" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="390" y="306" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">РУХ (ШІМ)</text>

<rect x="246" y="322" width="94" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
<text x="293" y="338" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ГАЛЬМУВАННЯ</text>

<rect x="344" y="322" width="92" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="390" y="338" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">АВАРІЯ</text>

<text x="341" y="360" font-size="12" fill="#6b7280" text-anchor="middle">Переходи за командами й аваріями</text>

<!-- Arrow from FSM to PWM / Protection -->
<line x1="341" y1="370" x2="341" y2="380" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

<!-- PWM & Safety Logic Block -->
<rect x="238" y="380" width="206" height="132" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="341" y="397" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Керування ШІМ і контури захисту</text>

<rect x="246" y="406" width="190" height="28" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
<text x="254" y="424" font-size="12" font-weight="bold" fill="#2457d6">Генератор ШІМ (PWM / DIR)</text>

<rect x="246" y="440" width="190" height="32" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
<text x="254" y="455" font-size="12" font-weight="bold" fill="#c0392b">Компаратор аварійного струму</text>
<text x="254" y="468" font-size="12" fill="#6b7280">Миттєве блокування при I &gt; I_max</text>

<rect x="246" y="478" width="190" height="26" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
<text x="254" y="495" font-size="12" font-weight="bold" fill="#27ae60">Входи кінцевиків (SW1, SW2)</text>

<!-- Ground label Logic domain -->
<text x="136" y="522" font-size="12" fill="#6b7280">GND: сигнальна земля схеми керування</text>

<!-- ==========================================
     ZONE 3: ISOLATION BARRIER & GATE DRIVER
     ========================================== -->
<line x1="506" y1="68" x2="506" y2="534" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>

<rect x="470" y="74" width="72" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="506" y="89" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">РОЗДІЛЕННЯ</text>

<!-- Gate Driver Box -->
<rect x="468" y="394" width="76" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="506" y="412" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Драйвер</text>
<text x="506" y="427" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">затворів</text>
<text x="506" y="440" font-size="12" fill="#6b7280" text-anchor="middle">3.3В → 24В</text>

<!-- Line from PWM to Gate Driver -->
<line x1="436" y1="420" x2="468" y2="420" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

<!-- ==========================================
     ZONE 4: POWER DOMAIN (VM = 24 V)
     ========================================== -->
<rect x="554" y="68" width="248" height="466" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="566" y="90" font-size="13" font-weight="bold" fill="#c0392b">СИЛОВЕ КОЛО (Power, VM = 24 В, PGND)</text>

<!-- Top Power Rail VM -->
<line x1="600" y1="112" x2="748" y2="112" stroke="#c0392b" stroke-width="2"/>
<text x="674" y="108" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+24 В (Силова шина VM)</text>

<!-- H-Bridge Box -->
<rect x="566" y="124" width="224" height="236" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="678" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий H-міст (4× MOSFET)</text>

<!-- MOSFET Switches -->
<!-- Q1 HS Left -->
<rect x="592" y="156" width="46" height="36" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="615" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Q1</text>
<text x="615" y="186" font-size="12" fill="#6b7280" text-anchor="middle">HS</text>

<!-- Q2 HS Right -->
<rect x="716" y="156" width="46" height="36" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="739" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Q2</text>
<text x="739" y="186" font-size="12" fill="#6b7280" text-anchor="middle">HS</text>

<!-- Q3 LS Left -->
<rect x="592" y="256" width="46" height="36" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="615" y="272" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Q3</text>
<text x="615" y="286" font-size="12" fill="#6b7280" text-anchor="middle">LS</text>

<!-- Q4 LS Right -->
<rect x="716" y="256" width="46" height="36" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="739" y="272" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Q4</text>
<text x="739" y="286" font-size="12" fill="#6b7280" text-anchor="middle">LS</text>

<!-- H-Bridge Internal Wiring -->
<!-- From VM down to Q1 & Q2 -->
<line x1="615" y1="112" x2="615" y2="156" stroke="#c0392b" stroke-width="2"/>
<line x1="739" y1="112" x2="739" y2="156" stroke="#c0392b" stroke-width="2"/>

<!-- Center Leg Connections -->
<line x1="615" y1="192" x2="615" y2="256" stroke="#1a1a1a" stroke-width="2"/>
<line x1="739" y1="192" x2="739" y2="256" stroke="#1a1a1a" stroke-width="2"/>

<!-- Motor OUT lines inside H-Bridge -->
<line x1="615" y1="216" x2="790" y2="216" stroke="#2457d6" stroke-width="2"/>
<line x1="739" y1="236" x2="790" y2="236" stroke="#2457d6" stroke-width="2"/>

<text x="677" y="212" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">OUT1 (+ / -)</text>
<text x="677" y="232" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">OUT2 (- / +)</text>
<text x="677" y="250" font-size="12" fill="#6b7280" text-anchor="middle">Реверс / ШІМ</text>

<!-- Low side to Shunt line -->
<line x1="615" y1="292" x2="615" y2="318" stroke="#1a1a1a" stroke-width="2"/>
<line x1="739" y1="292" x2="739" y2="318" stroke="#1a1a1a" stroke-width="2"/>
<line x1="615" y1="318" x2="739" y2="318" stroke="#1a1a1a" stroke-width="2"/>
<line x1="677" y1="318" x2="677" y2="376" stroke="#1a1a1a" stroke-width="2"/>

<!-- Line from Gate Driver to H-Bridge -->
<line x1="544" y1="420" x2="566" y2="420" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

<!-- Current Shunt Box -->
<rect x="566" y="376" width="224" height="60" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="678" y="393" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Давач струму (Шунт Rsense)</text>

<!-- Rsense Resistor -->
<rect x="630" y="401" width="50" height="22" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="655" y="416" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Rsense</text>

<line x1="655" y1="423" x2="655" y2="432" stroke="#1a1a1a" stroke-width="2"/>
<text x="734" y="416" font-size="12" fill="#6b7280" text-anchor="middle">PGND (0 В)</text>

<!-- Feedback line: I_SENSE to MCU Comparator -->
<line x1="566" y1="456" x2="436" y2="456" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
<text x="506" y="472" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">I_SENSE</text>

<!-- Ground label Power domain -->
<text x="678" y="522" font-size="12" fill="#6b7280" text-anchor="middle">PGND: окрема силова земля мотора</text>

<!-- ==========================================
     ZONE 5: ACTUATOR MECHANICS
     ========================================== -->
<rect x="814" y="68" width="122" height="466" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="875" y="90" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МЕХАНІКА</text>
<text x="875" y="106" font-size="12" fill="#6b7280" text-anchor="middle">Привід і шток</text>

<!-- DC Motor -->
<circle cx="875" cy="226" r="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="875" y="232" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
<text x="875" y="196" font-size="12" fill="#6b7280" text-anchor="middle">DC мотор</text>

<!-- Lines from H-Bridge to Motor -->
<line x1="790" y1="216" x2="849" y2="216" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<line x1="790" y1="236" x2="849" y2="236" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

<!-- Mechanical Shaft label & line -->
<text x="875" y="268" font-size="12" fill="#6b7280" text-anchor="middle">Вал / Редуктор</text>
<line x1="875" y1="274" x2="875" y2="288" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="4,2"/>

<!-- Mechanical Rod / Slider -->
<rect x="851" y="288" width="48" height="96" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="875" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шток /</text>
<text x="875" y="332" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Клапан</text>
<text x="875" y="354" font-size="12" fill="#2457d6" text-anchor="middle">↕ Хід</text>
<text x="875" y="372" font-size="12" fill="#6b7280" text-anchor="middle">(Позиція)</text>

<!-- Limit Switches -->
<rect x="826" y="398" width="98" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="875" y="415" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SW_MAX (100%)</text>

<rect x="826" y="432" width="98" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="875" y="449" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SW_MIN (0%)</text>

<!-- Limit Switch Feedback Line to MCU -->
<line x1="826" y1="492" x2="436" y2="492" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="678" y="484" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Сигнали кінцевиків (зворотний зв'язок SW1, SW2)</text>
<text x="678" y="504" font-size="12" fill="#6b7280" text-anchor="middle">Апаратний захист від виходу за межі ходу</text>

</svg>
