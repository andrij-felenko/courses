<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Архітектурний глухий кут OPC DA: мережевий бар'єр DCOM та зависання клієнта</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Динамічні RPC-порти ріжуться фаєрволом, а синхронні виклики блокують застосунок при втраті зв'язку</text>

  <!-- ЛІВА ЗОНА: Клієнтський вузол Windows -->
  <rect x="24" y="80" width="276" height="352" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="162" y="102" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Клієнтський вузол (SCADA / HMI)</text>
  <text x="162" y="118" font-size="12" text-anchor="middle" fill="#6b7280">ОС: Windows NT / 2000 (DCOM runtime)</text>

  <!-- Блок клієнтського застосунку -->
  <rect x="36" y="128" width="252" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="162" y="146" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Клієнтський застосунок</text>
  
  <rect x="44" y="156" width="236" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="162" y="173" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Синхронний I/O: потік ЗАВИС</text>
  <text x="162" y="189" font-size="12" text-anchor="middle" fill="#c0392b">UI блоковано, привід без контролю</text>

  <!-- Блок DCOM Proxy / Runtime -->
  <rect x="36" y="216" width="252" height="104" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="162" y="234" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">DCOM Proxy / RPC Client Runtime</text>
  <text x="46" y="253" font-size="12" fill="#1a1a1a">• Реєстр Win32: GUID / CLSID сервера</text>
  <text x="46" y="271" font-size="12" fill="#1a1a1a">• Синхронний маршалінг викликів (NDR)</text>
  <text x="46" y="289" font-size="12" fill="#c0392b">• Блокуючий виклик: таймаут 2–10+ хв</text>
  <text x="46" y="307" font-size="12" fill="#6b7280">• Аутентифікація NTLM / Security</text>

  <!-- Блок мережевого підключення клієнта -->
  <rect x="36" y="330" width="252" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="162" y="348" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Мережевий стек TCP/IP</text>
  
  <rect x="44" y="356" width="236" height="58" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="162" y="376" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Сокет 1: вихід до TCP 135</text>
  <text x="162" y="398" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Сокет 2: вихід до TCP 49158</text>

  <!-- СЕРЕДНЯ ЗОНА: Мережа та Firewall -->
  <rect x="314" y="80" width="332" height="352" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="480" y="102" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Корпоративна IP-мережа</text>
  <text x="480" y="118" font-size="12" text-anchor="middle" fill="#6b7280">Міжмережевий екран (Firewall / NAT)</text>

  <!-- Стіна Firewall -->
  <rect x="440" y="128" width="80" height="294" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="148" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">FIREWALL</text>

  <!-- ФАЗА 1: Резолвінг порту 135 (Дозволено) -->
  <rect x="446" y="162" width="68" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="177" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">TCP 135</text>
  <text x="480" y="193" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">ВІДКРИТО</text>

  <!-- Лінія 1: Запит порту до 135 -->
  <line x1="288" y1="170" x2="444" y2="170" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="516" y1="170" x2="658" y2="170" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="370" y="156" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">1. Запит CLSID →</text>
  <text x="590" y="156" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">До порту 135 →</text>

  <!-- Лінія 2: Відповідь від 135 -->
  <line x1="660" y1="194" x2="516" y2="194" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="444" y1="194" x2="298" y2="194" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="590" y="214" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">← Відповідь RPC</text>
  <text x="370" y="214" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">← Порт 49158</text>

  <!-- ФАЗА 2: Спроба виклику на динамічний порт 49158 (Блоковано) -->
  <rect x="446" y="238" width="68" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="254" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">ДИНАМІЧНІ</text>
  <text x="480" y="269" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">1024–65535</text>
  <text x="480" y="283" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">БЛОКОВАНО</text>

  <!-- Лінія 3: Виклик OPC на 49158, що впирається у Firewall -->
  <line x1="288" y1="266" x2="444" y2="266" stroke="#c0392b" stroke-width="2"/>
  <text x="370" y="240" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">2. Виклик OPC DA →</text>
  <text x="370" y="254" font-size="12" text-anchor="middle" fill="#c0392b">на порт TCP 49158</text>

  <!-- Пунктир після фаєрволу: пакет відкинуто -->
  <line x1="516" y1="266" x2="658" y2="266" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="590" y="240" font-size="12" text-anchor="middle" fill="#6b7280">Пакети відкинуто</text>
  <text x="590" y="254" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">DROP: нема зв'язку</text>

  <!-- ФАЗА 3: Зависання через втрату пакетів -->
  <rect x="446" y="336" width="68" height="66" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="354" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Firewall</text>
  <text x="480" y="370" font-size="12" text-anchor="middle" fill="#6b7280">не шле RST</text>
  <text x="480" y="386" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Silent Drop</text>

  <!-- Лінія очікування / зависання -->
  <line x1="444" y1="376" x2="298" y2="376" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="370" y="350" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">3. Жодної відповіді</text>
  <text x="370" y="364" font-size="12" text-anchor="middle" fill="#c0392b">мовчазна втрата ACK</text>
  <text x="370" y="396" font-size="12" text-anchor="middle" fill="#6b7280">Таймаут RPC: 2–10 хв</text>
  <text x="370" y="412" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">UI і логіка паралізовані</text>

  <!-- Стан сервера праворуч: актуатор не отримав команду -->
  <text x="590" y="362" font-size="12" text-anchor="middle" fill="#6b7280">Сервер без виклику</text>
  <text x="590" y="380" font-size="12" text-anchor="middle" fill="#6b7280">Актуатор незмінний</text>
  <text x="590" y="398" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">стан законсервовано</text>

  <!-- ПРАВА ЗОНА: Серверний вузол Windows -->
  <rect x="660" y="80" width="276" height="352" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="798" y="102" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Серверний вузол (OPC DA Server)</text>
  <text x="798" y="118" font-size="12" text-anchor="middle" fill="#6b7280">ОС: Windows NT / 2000 (DCOM runtime)</text>

  <!-- RPC Endpoint Mapper -->
  <rect x="672" y="128" width="252" height="78" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="798" y="146" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">RPC Endpoint Mapper (rpcss.exe)</text>
  
  <rect x="680" y="156" width="236" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="798" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Слухає: порт TCP 135</text>
  <text x="798" y="188" font-size="12" text-anchor="middle" fill="#1a1a1a">Повертає: порт TCP 49158</text>

  <!-- OPC DA Server Process -->
  <rect x="672" y="216" width="252" height="104" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="798" y="234" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Процес OPC DA Сервера</text>
  
  <rect x="680" y="242" width="236" height="44" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="798" y="259" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Динамічний RPC: TCP 49158</text>
  <text x="798" y="275" font-size="12" text-anchor="middle" fill="#c0392b">Випадковий порт 1024–65535</text>

  <text x="798" y="306" font-size="12" text-anchor="middle" fill="#6b7280">IOPCServer, IOPCItemMgt, IOPCSyncIO</text>

  <!-- Hardware I/O -->
  <rect x="672" y="330" width="252" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="798" y="348" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Апаратне сполучення (Fieldbus)</text>
  
  <rect x="680" y="356" width="236" height="58" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="798" y="376" font-size="12" text-anchor="middle" fill="#1a1a1a">Пропрієтарний драйвер вендора ПЛК</text>
  <text x="798" y="398" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Шина: RS-485 / Profibus / CAN</text>

  <!-- НИЖНІ КАРТКИ-ВИСНОВКИ -->
  <!-- Картка 1: Мережевий глухий кут -->
  <rect x="24" y="446" width="444" height="94" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="38" y="466" font-size="13" font-weight="700" fill="#c0392b">1. Мережевий глухий кут: фаєрвол і зависання</text>
  <text x="38" y="484" font-size="12" fill="#1a1a1a">DCOM вимагає відкривати весь пул 1024–65535,</text>
  <text x="38" y="500" font-size="12" fill="#1a1a1a">що неприйнятно для промислової безпеки мереж.</text>
  <text x="38" y="516" font-size="12" fill="#1a1a1a">Синхронний виклик блокує потік: втрата пакета</text>
  <text x="38" y="530" font-size="12" font-weight="700" fill="#c0392b">зависає HMI/SCADA на хвилини без контролю.</text>

  <!-- Картка 2: Windows Lock-in -->
  <rect x="492" y="446" width="444" height="94" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="506" y="466" font-size="13" font-weight="700" fill="#c0392b">2. Платформна пастка: тотальний Windows Lock-in</text>
  <text x="506" y="484" font-size="12" fill="#1a1a1a">OPC подолав хаос драйверів, але створив нову</text>
  <text x="506" y="500" font-size="12" fill="#1a1a1a">залежність від технологій Microsoft Windows.</text>
  <text x="506" y="516" font-size="12" fill="#1a1a1a">DCOM, NTLM та реєстр GUID унеможливили пряме</text>
  <text x="506" y="530" font-size="12" font-weight="700" fill="#c0392b">підключення Linux, RTOS та IoT-контролерів.</text>
</svg>
