<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="33" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Архітектурна асиметрія: вхідна нормалізація факту vs вихідна оркестрація дії</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Вхідний адаптер фіксує минуле за 1 крок, а вихідний адаптер транслює намір у ланцюг апаратних інструкцій і повертає Result</text>

  <!-- ЛІВА ПАНЕЛЬ: Вхідний конвеєр (Ingress) -->
  <rect x="24" y="68" width="444" height="472" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="92" font-size="14" font-weight="700" fill="#1a1a1a">Вхідний конвеєр: нормалізація подій</text>
  <text x="40" y="110" font-size="12" fill="#6b7280">Пасивна фіксація доконаного факту зовнішнього світу</text>
  <rect x="366" y="80" width="86" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="409" y="95" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">ФАКТ (1:1)</text>

  <!-- Блок 1.1: Джерело (Сенсор) -->
  <rect x="40" y="126" width="412" height="68" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="145" font-size="13" font-weight="700" fill="#2457d6">1. Джерело: Сенсор / Польова шина RS-485</text>
  <text x="52" y="163" font-size="12" fill="#1a1a1a">Сирий пакет: 0x03 0x04 0x02 0x08 0x66 0xBA 0x5C</text>
  <text x="52" y="181" font-size="12" fill="#6b7280">Відліки ADC: 0x0866 = 2150 (датчик температури NTC)</text>

  <!-- Стрілка 1.1 -> 1.2 -->
  <line x1="246" y1="196" x2="246" y2="214" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="256" y="209" font-size="12" fill="#2457d6">прийом кадру</text>

  <!-- Блок 1.2: Вхідний адаптер -->
  <rect x="40" y="216" width="412" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="236" font-size="13" font-weight="700" fill="#1a1a1a">2. Вхідний адаптер (Ingress Adapter)</text>
  <text x="52" y="255" font-size="12" fill="#1a1a1a">• Валідація: перевірка контрольної суми CRC16 (успішно)</text>
  <text x="52" y="273" font-size="12" fill="#1a1a1a">• Нормалізація: перерахунок шкали: 2150 / 100 = 21.5 °C</text>
  <text x="52" y="291" font-size="12" fill="#1a1a1a">• Мапінг: створення Value Object Temperature(21.5)</text>
  <text x="52" y="311" font-size="12" fill="#6b7280">Чиста нормалізація даних: stateless, 1:1 перетворення</text>

  <!-- Стрілка 1.2 -> 1.3 -->
  <line x1="246" y1="330" x2="246" y2="348" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="256" y="343" font-size="12" fill="#27ae60">публікація події</text>

  <!-- Блок 1.3: Доменна подія -->
  <rect x="40" y="350" width="412" height="68" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="52" y="370" font-size="13" font-weight="700" fill="#27ae60">3. Приймач: Доменне ядро (Domain Core)</text>
  <text x="52" y="388" font-size="12" fill="#1a1a1a">Подія: TemperatureMeasuredEvent(SensorId("T-01"), 21.5 °C)</text>
  <text x="52" y="405" font-size="12" fill="#6b7280">Фіксація доконаного факту: оновлення теплової карти</text>

  <!-- Блок 1.4: Властивості конвеєра спостереження -->
  <rect x="40" y="430" width="412" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="450" font-size="12" font-weight="700" fill="#1a1a1a">Архітектурні властивості вхідного конвеєра:</text>
  <text x="52" y="469" font-size="12" fill="#1a1a1a">• Односпрямованість: потік даних ззовні всередину ядра</text>
  <text x="52" y="487" font-size="12" fill="#1a1a1a">• Безпека: реєстрація факту не чинить тиску на датчик</text>
  <text x="52" y="504" font-size="12" fill="#1a1a1a">• Відсутність стану: обробка без збереження FSM-контексту</text>
  <text x="52" y="520" font-size="12" fill="#6b7280">• Час: миттєва реакція без очікування ходу механіки</text>


  <!-- ПРАВА ПАНЕЛЬ: Вихідний конвеєр (Egress) -->
  <rect x="492" y="68" width="444" height="472" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="508" y="92" font-size="14" font-weight="700" fill="#1a1a1a">Вихідний конвеєр: оркестрація дій</text>
  <text x="508" y="110" font-size="12" fill="#6b7280">Активна зміна фізичного стану через ланцюг інструкцій</text>
  <rect x="808" y="80" width="112" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="864" y="95" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">ДІЯ (1:N FSM)</text>

  <!-- Блок 2.1: Джерело (Доменне ядро) -->
  <rect x="508" y="126" width="412" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="145" font-size="13" font-weight="700" fill="#2457d6">1. Джерело: Доменне ядро (Domain Core)</text>
  <text x="520" y="163" font-size="12" font-weight="700" fill="#1a1a1a">Команда: SetPosition(ValveId("V-03"), OpeningPercentage(40))</text>
  <text x="520" y="180" font-size="12" fill="#6b7280">Семантичний намір (цикл ядра 2 мс) + CancellationToken</text>

  <!-- Стрілка 2.1 -> 2.2 -->
  <line x1="714" y1="192" x2="714" y2="204" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 2.2: Вихідний адаптер та ACL -->
  <rect x="508" y="206" width="412" height="144" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="520" y="225" font-size="13" font-weight="700" fill="#2457d6">2. Вихідний адаптер та ACL (Компілятор наміру)</text>
  <text x="520" y="243" font-size="12" fill="#1a1a1a">Декомпозиція наміру на послідовність апаратних інструкцій:</text>
  <text x="528" y="260" font-size="12" fill="#1a1a1a">1. Status? → опитування готовності та відсутності блокувань</text>
  <text x="528" y="276" font-size="12" fill="#1a1a1a">2. Brake Release → розтискання стоянкового гальма штока</text>
  <text x="528" y="292" font-size="12" fill="#1a1a1a">3. Scale Mapping → нелінійний перерахунок 40% → 4000 (LUT)</text>
  <text x="528" y="308" font-size="12" fill="#1a1a1a">4. Drive &amp; Stall → пуск руху, захист двигуна від заклинювання</text>
  <text x="528" y="324" font-size="12" fill="#1a1a1a">5. Brake Lock → фіксація штока після досягнення уставки</text>
  <text x="520" y="340" font-size="12" fill="#6b7280">ACL ізолює домен: перехоплює таймаути шини та коди збоїв</text>

  <!-- Стрілка 2.2 -> 2.3 -->
  <line x1="714" y1="352" x2="714" y2="362" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Блок 2.3: Фізичний актуатор -->
  <rect x="508" y="364" width="412" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="384" font-size="13" font-weight="700" fill="#1a1a1a">3. Виконавець: Фізичний актуатор (Польова шина)</text>
  <text x="520" y="402" font-size="12" fill="#6b7280">Моторизований клапан: неперервний час механіки (~120 с)</text>

  <!-- Стрілка 2.3 -> 2.4 -->
  <line x1="714" y1="418" x2="714" y2="428" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 2.4: Доменний Result -->
  <rect x="508" y="430" width="412" height="96" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="520" y="450" font-size="13" font-weight="700" fill="#2457d6">4. Приймач: Доменне ядро (Результат виконання)</text>
  <text x="520" y="469" font-size="12" font-weight="700" fill="#1a1a1a">Повернення: Result&lt;ActuationReport, ActuatorError&gt;</text>
  <text x="520" y="487" font-size="12" fill="#27ae60">• Успіх: ActuationReport(FinalPosition: 40.1%, Duration: 118s)</text>
  <text x="520" y="504" font-size="12" fill="#c0392b">• Збій: DeviceOffline | MechanicalStall | HardwareFault</text>
  <text x="520" y="520" font-size="12" fill="#6b7280">Ізоляція від винятків: вичерпний pattern matching у ядрі</text>
</svg>
