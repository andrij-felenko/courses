<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кінцевий автомат (FSM) секвенсера: координація фаз та аварійний відкат</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Детермінована черговість апаратних дій та ізольований ланцюжок захисного знеструмлення</text>
  <!-- МЕЖА ВИХІДНОГО ПОРТУ: КОМАНДА ТА ЗВІТ -->
  <rect x="25" y="68" width="146" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="98" y="85" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вхід: MoveTo(pos, t_dl)</text>
  <line x1="98" y1="94" x2="98" y2="106" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="216" y="68" width="528" height="26" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="85" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">ПРЯМИЙ ЛАНЦЮЖОК ШТАТНОГО ВИКОНАННЯ (HAPPY PATH)</text>
  <rect x="789" y="68" width="146" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="862" y="85" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Вихід: Ok(Report)</text>
  <line x1="862" y1="106" x2="862" y2="94" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- Card 1.1: 1. POWER_CHECK -->
  <rect x="25" y="106" width="146" height="124" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="98" y="125" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">1. POWER_CHECK</text>
  <text x="98" y="143" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Контроль живлення</text>
  <text x="98" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Телеметрія V_bus</text>
  <text x="98" y="181" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ V_bus ≥ 20 В</text>
  <text x="98" y="200" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">✗ V &lt; 20 В / Обрив</text>
  <text x="98" y="219" font-size="12" fill="#6b7280" text-anchor="middle">Тяга двигуна: OFF</text>
  <line x1="171" y1="177" x2="216" y2="177" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="193" y="171" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">OK</text>
  <!-- Card 1.2: 2. BRAKE_RELEASE -->
  <rect x="216" y="106" width="146" height="124" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="289" y="125" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">2. BRAKE_RELEASE</text>
  <text x="289" y="143" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зняття гальма</text>
  <text x="289" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Струм соленоїда</text>
  <text x="289" y="181" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ BrakeOpen = 1</text>
  <text x="289" y="200" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">✗ Заклинювання</text>
  <text x="289" y="219" font-size="12" fill="#6b7280" text-anchor="middle">Рух заборонено</text>
  <line x1="362" y1="177" x2="407" y2="177" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="384" y="171" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">OK</text>
  <!-- Card 1.3: 3. MOTION_DRIVE -->
  <rect x="407" y="106" width="146" height="124" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="125" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">3. MOTION_DRIVE</text>
  <text x="480" y="143" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Подача руху</text>
  <text x="480" y="162" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ-імпульси кроку</text>
  <text x="480" y="181" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ PosReached = 1</text>
  <text x="480" y="200" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">✗ I &gt; I_max / Заклин</text>
  <text x="480" y="219" font-size="12" fill="#6b7280" text-anchor="middle">Контроль: I ≤ I_max</text>
  <line x1="553" y1="177" x2="598" y2="177" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="575" y="171" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">OK</text>
  <!-- Card 1.4: 4. BRAKE_ENGAGE -->
  <rect x="598" y="106" width="146" height="124" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="671" y="125" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">4. BRAKE_ENGAGE</text>
  <text x="671" y="143" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фіксація гальма</text>
  <text x="671" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Знеструмлення реле</text>
  <text x="671" y="181" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ BrakeLocked = 1</text>
  <text x="671" y="200" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">✗ Провертання</text>
  <text x="671" y="219" font-size="12" fill="#6b7280" text-anchor="middle">Стопор вала: Lock</text>
  <line x1="744" y1="177" x2="789" y2="177" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="766" y="171" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">OK</text>
  <!-- Card 1.5: 5. POS_VERIFY -->
  <rect x="789" y="106" width="146" height="124" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="862" y="125" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">5. POS_VERIFY</text>
  <text x="862" y="143" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Верифікація позиції</text>
  <text x="862" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Опитування енкодера</text>
  <text x="862" y="181" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ |ΔPos| ≤ ε</text>
  <text x="862" y="200" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">✗ |ΔPos| &gt; ε</text>
  <text x="862" y="219" font-size="12" fill="#6b7280" text-anchor="middle">Звірка уставки</text>
  <!-- АВАРІЙНА ШИНА РОЗГАЛУЖЕННЯ (FAST-FAIL TRIGGER) -->
  <rect x="310" y="262" width="340" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="281" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">РОЗГАЛУЖЕННЯ НА ВІДКАТ: FAST-FAIL НА ЗБІЙ</text>
  <line x1="98" y1="230" x2="98" y2="276" stroke="#c0392b" stroke-width="1.5"/>
  <text x="106" y="254" font-size="12" fill="#c0392b">V &lt; 20 В</text>
  <line x1="289" y1="230" x2="289" y2="276" stroke="#c0392b" stroke-width="1.5"/>
  <text x="297" y="254" font-size="12" fill="#c0392b">Заклин гальма</text>
  <line x1="480" y1="230" x2="480" y2="262" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="488" y="248" font-size="12" fill="#c0392b">Заклин / надструм</text>
  <line x1="671" y1="230" x2="671" y2="276" stroke="#c0392b" stroke-width="1.5"/>
  <text x="679" y="254" font-size="12" fill="#c0392b">Збій стопора</text>
  <line x1="862" y1="230" x2="862" y2="276" stroke="#c0392b" stroke-width="1.5"/>
  <text x="870" y="254" font-size="12" fill="#c0392b">Похибка уставки</text>
  <line x1="98" y1="276" x2="310" y2="276" stroke="#c0392b" stroke-width="2"/>
  <line x1="650" y1="276" x2="862" y2="276" stroke="#c0392b" stroke-width="2"/>
  <line x1="98" y1="276" x2="98" y2="330" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="106" y="306" font-size="12" font-weight="700" fill="#c0392b">Знеструмити</text>
  <!-- Card 2.1: E1. CUT_POWER -->
  <rect x="25" y="330" width="146" height="124" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="98" y="349" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">E1. CUT_POWER</text>
  <text x="98" y="367" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зняття тяги</text>
  <text x="98" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">PWM = 0 / H-міст OFF</text>
  <text x="98" y="405" font-size="12" fill="#6b7280" text-anchor="middle">Знеструмлення мотора</text>
  <text x="98" y="424" font-size="12" font-weight="600" fill="#c0392b" text-anchor="middle">Усунення перегріву</text>
  <text x="98" y="443" font-size="12" fill="#6b7280" text-anchor="middle">Тягу знято: OK</text>
  <line x1="171" y1="386" x2="216" y2="386" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <!-- Card 2.2: E2. DEAD_TIME -->
  <rect x="216" y="330" width="146" height="124" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="289" y="349" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">E2. DEAD_TIME</text>
  <text x="289" y="367" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Мертвий час</text>
  <text x="289" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">Пауза t_dead = 50 мс</text>
  <text x="289" y="405" font-size="12" fill="#6b7280" text-anchor="middle">Згасання індукції ЕРС</text>
  <text x="289" y="424" font-size="12" font-weight="600" fill="#c0392b" text-anchor="middle">Захист транзисторів</text>
  <text x="289" y="443" font-size="12" fill="#6b7280" text-anchor="middle">Струм згас: OK</text>
  <line x1="362" y1="386" x2="407" y2="386" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <!-- Card 2.3: E3. FORCE_BRAKE -->
  <rect x="407" y="330" width="146" height="124" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="349" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">E3. FORCE_BRAKE</text>
  <text x="480" y="367" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Аварійне гальмо</text>
  <text x="480" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">Котушка знеструмлена</text>
  <text x="480" y="405" font-size="12" fill="#6b7280" text-anchor="middle">Пружинний затиск</text>
  <text x="480" y="424" font-size="12" font-weight="600" fill="#c0392b" text-anchor="middle">Вал заблоковано</text>
  <text x="480" y="443" font-size="12" fill="#6b7280" text-anchor="middle">Вал закріплено: OK</text>
  <line x1="553" y1="386" x2="598" y2="386" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <!-- Card 2.4: E4. SAFETY_LOCK -->
  <rect x="598" y="330" width="146" height="124" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="671" y="349" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">E4. SAFETY_LOCK</text>
  <text x="671" y="367" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Запобіжник</text>
  <text x="671" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">Interlock = ACTIVE</text>
  <text x="671" y="405" font-size="12" fill="#6b7280" text-anchor="middle">Блокування викликів</text>
  <text x="671" y="424" font-size="12" font-weight="600" fill="#c0392b" text-anchor="middle">Скидання: ManualReset</text>
  <text x="671" y="443" font-size="12" fill="#6b7280" text-anchor="middle">Захист активовано</text>
  <line x1="744" y1="386" x2="789" y2="386" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <!-- Card 2.5: ДОМЕННИЙ ЗВІТ -->
  <rect x="789" y="330" width="146" height="124" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="862" y="349" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">ДОМЕННИЙ ЗВІТ</text>
  <text x="862" y="367" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Err(ActuatorFault)</text>
  <text x="862" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">Код: Stall / LowV</text>
  <text x="862" y="405" font-size="12" fill="#6b7280" text-anchor="middle">Позиція: LastKnownPos</text>
  <text x="862" y="424" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">FailSafe: Secured</text>
  <text x="862" y="443" font-size="12" fill="#6b7280" text-anchor="middle">Ізоляція шини</text>
  <!-- НИЖНЯ ПАНЕЛЬ: АРХІТЕКТУРНИЙ ВИСНОВОК -->
  <rect x="25" y="468" width="910" height="48" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="488" font-size="12" font-weight="700" fill="#1a1a1a">Архітектурна ізоляція порту:</text>
  <text x="232" y="488" font-size="12" fill="#6b7280">Доменне ядро оперує декларативним наміром MoveTo та отримує типізований Result (Ok / Err).</text>
  <text x="40" y="506" font-size="12" fill="#6b7280">Секвенсер адаптера самостійно координує часові кванти реле, ШІМ, контроль заклинювання та аварійний відкат.</text>
</svg>
