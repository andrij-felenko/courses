<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кусково-лінійна апроксимація характеристики клапана (PLA)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Адаптивне згущення кроку в зоні кривини утримує похибку R_PLA без роздування таблиці</text>

  <!-- Панель 1: Вузли та хорди -->
  <rect x="585" y="75" width="345" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="600" y="96" font-size="13" font-weight="700" fill="#2457d6">1. Табличні вузли та хорди (PLA)</text>
  <text x="600" y="116" font-size="12" fill="#1a1a1a">• Вузли (x_k, y_k) розбивають нелінійну криву</text>
  <text x="600" y="134" font-size="12" fill="#1a1a1a">• Інтерполяція: y = y_k + K_k · (x - x_k)</text>
  <text x="600" y="152" font-size="12" fill="#1a1a1a">• Нахил хорди: K_k = (y_{k+1} - y_k) / (x_{k+1} - x_k)</text>
  <text x="600" y="170" font-size="12" fill="#6b7280">• Заміна розрахунку exp(h) афінним мапінгом</text>

  <!-- Панель 2: Похибка R_PLA -->
  <rect x="585" y="194" width="345" height="114" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="600" y="215" font-size="13" font-weight="700" fill="#c0392b">2. Оцінка залишкової похибки R_PLA</text>
  <text x="600" y="235" font-size="12" fill="#1a1a1a">• Залишок Тейлора: R_PLA ≤ (1/8)·max|f''|·(Δx_k)²</text>
  <text x="600" y="254" font-size="12" fill="#1a1a1a">• Похибка прямо пропорційна кривині f''(x)</text>
  <text x="600" y="273" font-size="12" fill="#1a1a1a">• Квадратична залежність від довжини кроку (Δx_k)²</text>
  <text x="600" y="292" font-size="12" fill="#1a1a1a">• Для опуклої кривої хорда лежить над графіком</text>

  <!-- Панель 3: Адаптивне згущення -->
  <rect x="585" y="322" width="345" height="114" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="600" y="343" font-size="13" font-weight="700" fill="#27ae60">3. Адаптивне згущення кроку</text>
  <text x="600" y="364" font-size="12" fill="#1a1a1a">• Полога ділянка: малий f'' → широкий крок Δx₀</text>
  <text x="600" y="383" font-size="12" fill="#1a1a1a">• Зона кривини: стрімкий f'' → густі вузли Δx₃</text>
  <text x="600" y="402" font-size="12" fill="#1a1a1a">• Гарантія точності R_PLA ≤ ε за мінімуму Flash</text>
  <text x="600" y="421" font-size="12" fill="#6b7280">• Пошук інтервалу в адаптері за час O(log M)</text>

  <!-- Сітка графіка -->
  <line x1="85" y1="305.0" x2="545" y2="305.0" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="85" y1="240.0" x2="545" y2="240.0" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="85" y1="175.0" x2="545" y2="175.0" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="85" y1="110.0" x2="545" y2="110.0" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <!-- Підписи осі Y -->
  <text x="77" y="114" font-size="12" fill="#6b7280" text-anchor="end">100 %</text>
  <text x="77" y="179" font-size="12" fill="#6b7280" text-anchor="end">75 %</text>
  <text x="77" y="244" font-size="12" fill="#6b7280" text-anchor="end">50 %</text>
  <text x="77" y="309" font-size="12" fill="#6b7280" text-anchor="end">25 %</text>
  <text x="77" y="374" font-size="12" fill="#6b7280" text-anchor="end">0 %</text>
  <text x="85" y="82" font-size="12" font-weight="700" fill="#1a1a1a">Витрата Q (%)</text>

  <!-- Заливка похибки апроксимації на відрізку [x1, x2] -->
  <path d="M 269.0,332.3 L 407.0,271.0 L 407.0,271.0 L 402.4,274.1 L 397.8,277.2 L 393.2,280.1 L 388.6,283.0 L 384.0,285.7 L 379.4,288.4 L 374.8,291.0 L 370.2,293.5 L 365.6,295.9 L 361.0,298.3 L 356.4,300.5 L 351.8,302.7 L 347.2,304.9 L 342.6,306.9 L 338.0,308.9 L 333.4,310.9 L 328.8,312.7 L 324.2,314.5 L 319.6,316.3 L 315.0,318.0 L 310.4,319.6 L 305.8,321.2 L 301.2,322.8 L 296.6,324.3 L 292.0,325.7 L 287.4,327.1 L 282.8,328.5 L 278.2,329.8 L 273.6,331.1 L 269.0,332.3 Z" fill="#fdecea" stroke="none"/>

  <!-- Осі координат -->
  <line x1="85" y1="370" x2="85" y2="95" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="85" y1="370" x2="555" y2="370" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Проекції вузлів на вісь X -->
  <line x1="269.0" y1="332.3" x2="269.0" y2="370" stroke="#2457d6" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="407.0" y1="271.0" x2="407.0" y2="370" stroke="#2457d6" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="489.8" y1="193.3" x2="489.8" y2="370" stroke="#2457d6" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="545.0" y1="110.0" x2="545.0" y2="370" stroke="#2457d6" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="85.0" y1="370" x2="85.0" y2="375" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="269.0" y1="370" x2="269.0" y2="375" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="407.0" y1="370" x2="407.0" y2="375" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="489.8" y1="370" x2="489.8" y2="375" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="545.0" y1="370" x2="545.0" y2="375" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Підписи вузлів на осі X -->
  <text x="85" y="392" font-size="12" fill="#6b7280" text-anchor="middle">x₀ = 0</text>
  <text x="269" y="392" font-size="12" fill="#6b7280" text-anchor="middle">x₁ = 0.4</text>
  <text x="407" y="392" font-size="12" fill="#6b7280" text-anchor="middle">x₂ = 0.7</text>
  <text x="489.8" y="392" font-size="12" fill="#6b7280" text-anchor="middle">x₃ = 0.88</text>
  <text x="545" y="392" font-size="12" fill="#6b7280" text-anchor="middle">x₄ = 1.0</text>

  <!-- Розміри кроків сітки -->
  <text x="177" y="412" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Δx₀ = 0.40</text>
  <text x="338" y="412" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Δx₁ = 0.30</text>
  <text x="448" y="412" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Δx₂ = 0.18</text>
  <text x="517" y="412" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Δx₃ = 0.12</text>

  <!-- Назва осі X -->
  <text x="315" y="436" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Хід клапана h (доменна величина 0…100 %)</text>

  <!-- Хорди лінійної апроксимації -->
  <path d="M 85.0,359.6 L 269.0,332.3 L 407.0,271.0 L 489.8,193.3 L 545.0,110.0" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Експоненційна калібрувальна крива -->
  <path d="M 85.0,359.6 L 89.6,359.3 L 94.2,358.9 L 98.8,358.5 L 103.4,358.2 L 108.0,357.8 L 112.6,357.4 L 117.2,357.0 L 121.8,356.5 L 126.4,356.1 L 131.0,355.7 L 135.6,355.2 L 140.2,354.7 L 144.8,354.2 L 149.4,353.7 L 154.0,353.1 L 158.6,352.6 L 163.2,352.0 L 167.8,351.4 L 172.4,350.8 L 177.0,350.2 L 181.6,349.6 L 186.2,348.9 L 190.8,348.2 L 195.4,347.5 L 200.0,346.7 L 204.6,346.0 L 209.2,345.2 L 213.8,344.4 L 218.4,343.5 L 223.0,342.7 L 227.6,341.8 L 232.2,340.9 L 236.8,339.9 L 241.4,338.9 L 246.0,337.9 L 250.6,336.9 L 255.2,335.8 L 259.8,334.7 L 264.4,333.5 L 269.0,332.3 L 273.6,331.1 L 278.2,329.8 L 282.8,328.5 L 287.4,327.1 L 292.0,325.7 L 296.6,324.3 L 301.2,322.8 L 305.8,321.2 L 310.4,319.6 L 315.0,318.0 L 319.6,316.3 L 324.2,314.5 L 328.8,312.7 L 333.4,310.9 L 338.0,308.9 L 342.6,306.9 L 347.2,304.9 L 351.8,302.7 L 356.4,300.5 L 361.0,298.3 L 365.6,295.9 L 370.2,293.5 L 374.8,291.0 L 379.4,288.4 L 384.0,285.7 L 388.6,283.0 L 393.2,280.1 L 397.8,277.2 L 402.4,274.1 L 407.0,271.0 L 411.6,267.8 L 416.2,264.4 L 420.8,261.0 L 425.4,257.4 L 430.0,253.7 L 434.6,249.9 L 439.2,246.0 L 443.8,241.9 L 448.4,237.7 L 453.0,233.4 L 457.6,229.0 L 462.2,224.3 L 466.8,219.6 L 471.4,214.7 L 476.0,209.6 L 480.6,204.3 L 485.2,198.9 L 489.8,193.3 L 494.4,187.5 L 499.0,181.6 L 503.6,175.4 L 508.2,169.0 L 512.8,162.5 L 517.4,155.7 L 522.0,148.7 L 526.6,141.4 L 531.2,133.9 L 535.8,126.2 L 540.4,118.2 L 545.0,110.0" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Опорні вузли -->
  <circle cx="85.0" cy="359.6" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="269.0" cy="332.3" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="407.0" cy="271.0" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="489.8" cy="193.3" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="545.0" cy="110.0" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>

  <!-- Позначення координат вузлів -->
  <text x="96" y="340" font-size="12" fill="#1a1a1a">(x₀, y₀)</text>
  <text x="260" y="324" font-size="12" fill="#1a1a1a" text-anchor="end">(x₁, y₁)</text>
  <text x="398" y="258" font-size="12" fill="#1a1a1a" text-anchor="end">(x₂, y₂)</text>
  <text x="480" y="164" font-size="12" fill="#1a1a1a" text-anchor="end">(x₃, y₃)</text>
  <text x="535" y="98" font-size="12" fill="#1a1a1a" text-anchor="end">(x₄, y₄)</text>

  <!-- Легенда графіка -->
  <rect x="98" y="105" width="270" height="114" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="124" font-size="12" font-weight="700" fill="#1a1a1a">Елементи кусково-лінійної моделі:</text>
  <line x1="110" y1="140" x2="130" y2="140" stroke="#2457d6" stroke-width="2.5"/>
  <text x="138" y="144" font-size="12" fill="#1a1a1a">Q(h) = Q₀ · exp(βh) — крива клапана</text>
  <line x1="110" y1="160" x2="130" y2="160" stroke="#27ae60" stroke-width="2"/>
  <text x="138" y="164" font-size="12" fill="#1a1a1a">y = y_k + K_k·(x - x_k) — прямі хорди</text>
  <line x1="110" y1="180" x2="130" y2="180" stroke="#c0392b" stroke-width="2"/>
  <text x="138" y="184" font-size="12" fill="#c0392b">R_PLA — відхилення апроксимації</text>
  <circle cx="120" cy="200" r="3.5" fill="#2457d6"/>
  <text x="138" y="204" font-size="12" fill="#6b7280">(x_k, y_k) — вузли калібрування</text>

  <!-- Виноска похибки R_PLA -->
  <rect x="130" y="235" width="195" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="138" y="252" font-size="12" font-weight="700" fill="#c0392b">R_PLA (відхилення хорди)</text>
  <text x="138" y="270" font-size="12" fill="#c0392b">R_PLA ≤ ⅛ · max|f''| · (Δx₁)²</text>
  <line x1="325" y1="265" x2="336" y2="301" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="338" y1="302" x2="338" y2="309" stroke="#c0392b" stroke-width="2"/>

</svg>
