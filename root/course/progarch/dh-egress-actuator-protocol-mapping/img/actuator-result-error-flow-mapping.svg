<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Життєвий цикл виконання команди та ізоляція збоїв через Result</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Адаптер перехоплює транспортні винятки й повертає вичерпні типи Ok та Err замість аварії ядра</text>

  <!-- 1. Панель Доменного ядра -->
  <rect x="24" y="70" width="216" height="168" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="34" y="80" width="196" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="132" y="96" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">ДОМЕННЕ ЯДРО</text>
  <text x="36" y="120" font-size="12" font-weight="700" fill="#1a1a1a">Формування наміру:</text>
  <text x="36" y="138" font-size="12" fill="#1a1a1a">• Команда SetPosition</text>
  <text x="36" y="156" font-size="12" fill="#1a1a1a">• ValueObject: 40.0%</text>
  <text x="36" y="174" font-size="12" fill="#1a1a1a">• Дедлайн: Deadline = 15 s</text>
  <text x="36" y="192" font-size="12" fill="#1a1a1a">• CancellationToken</text>
  <text x="36" y="222" font-size="12" fill="#6b7280">Захист інваріантів у типах</text>

  <!-- Стрілка 1: Ядро -> Адаптер -->
  <line x1="240" y1="132" x2="312" y2="132" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="280" y="120" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">execute()</text>

  <!-- 2. Панель Вихідного адаптера -->
  <rect x="320" y="70" width="320" height="168" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="330" y="80" width="300" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="96" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">ВИХІДНИЙ АДАПТЕР (Egress ACL)</text>
  <text x="334" y="118" font-size="12" fill="#1a1a1a">• Масштабування: 40% ➔ 0x0190</text>
  <text x="334" y="136" font-size="12" fill="#1a1a1a">• Контроль бюджету: WCET ≤ 15 s</text>

  <!-- Захисний бар'єр всередині адаптера -->
  <rect x="330" y="148" width="300" height="78" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480" y="166" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">ЗАХИСНИЙ БАР'ЄР ПЕРЕХОПЛЕННЯ</text>
  <text x="480" y="184" font-size="12" fill="#c0392b" text-anchor="middle">⛔ Поглинання транспортних винятків:</text>
  <text x="480" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">SocketException, ModbusTimeout</text>
  <text x="480" y="218" font-size="12" fill="#6b7280" text-anchor="middle">Жоден виняток не протікає в ядро</text>

  <!-- Стрілки між Адаптером і Актуатором -->
  <line x1="640" y1="128" x2="712" y2="128" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="680" y="118" font-size="12" fill="#2457d6" text-anchor="middle">Modbus RTU</text>

  <line x1="720" y1="186" x2="648" y2="186" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="680" y="176" font-size="12" fill="#c0392b" text-anchor="middle">Статус/збій</text>

  <!-- 3. Панель Актуатора та шини -->
  <rect x="720" y="70" width="216" height="168" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="730" y="80" width="196" height="24" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="828" y="96" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">АКТУАТОР ТА ШИНА RS-485</text>
  <text x="732" y="118" font-size="12" fill="#1a1a1a">• Кадри Modbus RTU</text>
  <text x="732" y="136" font-size="12" fill="#1a1a1a">• Робота двигуна й редуктора</text>
  <text x="732" y="158" font-size="12" font-weight="700" fill="#1a1a1a">Фізичні наслідки:</text>
  <text x="732" y="176" font-size="12" fill="#27ae60">✓ Позицію досягнуто</text>
  <text x="732" y="194" font-size="12" fill="#c0392b">✗ Обрив кабелю шини</text>
  <text x="732" y="212" font-size="12" fill="#c0392b">✗ Клин / Таймаут / Блок</text>

  <!-- Стрілка трансляції вниз: Адаптер -> Диспетчер Result -->
  <line x1="480" y1="238" x2="480" y2="261" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Диспетчерська плашка Result -->
  <rect x="180" y="265" width="600" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="286" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Трансляція в Result&lt;ActuatorResponse, ActuatorError&gt; та обробка в ядрі</text>

  <!-- Розгалуження на 5 карток -->
  <line x1="330" y1="297" x2="110" y2="324" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="410" y1="297" x2="294" y2="324" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="478" y1="297" x2="478" y2="324" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="546" y1="297" x2="662" y2="324" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="626" y1="297" x2="846" y2="324" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Картка 1: Ok(ActuatorResponse) -->
  <rect x="24" y="328" width="172" height="216" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="32" y="336" width="156" height="24" rx="4" fill="#27ae60"/>
  <text x="110" y="352" font-size="12" font-weight="700" fill="white" text-anchor="middle">Ok(ActuatorResponse)</text>
  <text x="34" y="376" font-size="12" font-weight="700" fill="#1a1a1a">Підтверджений стан:</text>
  <text x="34" y="394" font-size="12" fill="#1a1a1a">• FinalPos: 40.0%</text>
  <text x="34" y="412" font-size="12" fill="#1a1a1a">• Duration: 11.8 s</text>
  <text x="34" y="430" font-size="12" fill="#6b7280">• Шлях завершено</text>
  <line x1="34" y1="444" x2="186" y2="444" stroke="#27ae60" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="34" y="464" font-size="12" font-weight="700" fill="#27ae60">Дія в ядрі (match):</text>
  <text x="34" y="482" font-size="12" fill="#1a1a1a">Оновлення теплової</text>
  <text x="34" y="500" font-size="12" fill="#1a1a1a">моделі приміщення;</text>
  <text x="34" y="518" font-size="12" fill="#6b7280">штатна робота</text>

  <!-- Картка 2: Err(DeviceOffline) -->
  <rect x="208" y="328" width="172" height="216" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="216" y="336" width="156" height="24" rx="4" fill="#c0392b"/>
  <text x="294" y="352" font-size="12" font-weight="700" fill="white" text-anchor="middle">Err(DeviceOffline)</text>
  <text x="218" y="376" font-size="12" font-weight="700" fill="#1a1a1a">Причина збою:</text>
  <text x="218" y="394" font-size="12" fill="#1a1a1a">• Обрив лінії RS-485</text>
  <text x="218" y="412" font-size="12" fill="#1a1a1a">• Мовчання: 3.2 s</text>
  <text x="218" y="430" font-size="12" fill="#6b7280">• 3 спроби вичерпано</text>
  <line x1="218" y1="444" x2="370" y2="444" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="218" y="464" font-size="12" font-weight="700" fill="#c0392b">Дія в ядрі (match):</text>
  <text x="218" y="482" font-size="12" fill="#1a1a1a">Перемикання на</text>
  <text x="218" y="500" font-size="12" fill="#1a1a1a">резервний конвектор;</text>
  <text x="218" y="518" font-size="12" fill="#6b7280">тривога зв'язку</text>

  <!-- Картка 3: Err(MechanicalStall) -->
  <rect x="392" y="328" width="172" height="216" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="400" y="336" width="156" height="24" rx="4" fill="#c0392b"/>
  <text x="478" y="352" font-size="12" font-weight="700" fill="white" text-anchor="middle">Err(MechanicalStall)</text>
  <text x="402" y="376" font-size="12" font-weight="700" fill="#1a1a1a">Причина збою:</text>
  <text x="402" y="394" font-size="12" fill="#1a1a1a">• Клин редуктора</text>
  <text x="402" y="412" font-size="12" fill="#1a1a1a">• Струм: I &gt; 2.8 A</text>
  <text x="402" y="430" font-size="12" fill="#6b7280">• Зупинка на 18.4%</text>
  <line x1="402" y1="444" x2="554" y2="444" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="402" y="464" font-size="12" font-weight="700" fill="#c0392b">Дія в ядрі (match):</text>
  <text x="402" y="482" font-size="12" fill="#1a1a1a">Знеструмлення</text>
  <text x="402" y="500" font-size="12" fill="#1a1a1a">обмоток двигуна;</text>
  <text x="402" y="518" font-size="12" fill="#6b7280">аварійний наряд</text>

  <!-- Картка 4: Err(TimeoutError) -->
  <rect x="576" y="328" width="172" height="216" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="584" y="336" width="156" height="24" rx="4" fill="#c0392b"/>
  <text x="662" y="352" font-size="12" font-weight="700" fill="white" text-anchor="middle">Err(TimeoutError)</text>
  <text x="586" y="376" font-size="12" font-weight="700" fill="#1a1a1a">Причина збою:</text>
  <text x="586" y="394" font-size="12" fill="#1a1a1a">• Дедлайн вичерпано</text>
  <text x="586" y="412" font-size="12" fill="#1a1a1a">• Час t &gt; 15.0 s</text>
  <text x="586" y="430" font-size="12" fill="#6b7280">• Рух не завершено</text>
  <line x1="586" y1="444" x2="738" y2="444" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="586" y="464" font-size="12" font-weight="700" fill="#c0392b">Дія в ядрі (match):</text>
  <text x="586" y="482" font-size="12" fill="#1a1a1a">Маркер скасування;</text>
  <text x="586" y="500" font-size="12" fill="#1a1a1a">failsafe-зупинка</text>
  <text x="586" y="518" font-size="12" fill="#6b7280">приводу на місці</text>

  <!-- Картка 5: Err(CommandRejected) -->
  <rect x="760" y="328" width="172" height="216" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="768" y="336" width="156" height="24" rx="4" fill="#c0392b"/>
  <text x="846" y="352" font-size="12" font-weight="700" fill="white" text-anchor="middle">Err(CommandRejected)</text>
  <text x="770" y="376" font-size="12" font-weight="700" fill="#1a1a1a">Причина збою:</text>
  <text x="770" y="394" font-size="12" fill="#1a1a1a">• Захисний блок</text>
  <text x="770" y="412" font-size="12" fill="#1a1a1a">• Апаратний код 0x05</text>
  <text x="770" y="430" font-size="12" fill="#6b7280">• Привід не готовий</text>
  <line x1="770" y1="444" x2="922" y2="444" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="770" y="464" font-size="12" font-weight="700" fill="#c0392b">Дія в ядрі (match):</text>
  <text x="770" y="482" font-size="12" fill="#1a1a1a">Ізоляція контуру;</text>
  <text x="770" y="500" font-size="12" fill="#1a1a1a">сервісна діагностика;</text>
  <text x="770" y="518" font-size="12" fill="#6b7280">сигнал диспетчеру</text>
</svg>
