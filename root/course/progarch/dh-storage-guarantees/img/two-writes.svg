<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два записи, два налаштування тривкості — під ціну помилки</text>
<rect x="108.0" y="44.0" width="320.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="268.0" y="66.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="268.0" dy="0.0">запис РЕЄСТРУ</tspan><tspan x="268.0" dy="16.9">рідко · ціна помилки — катастрофа</tspan></text>
<rect x="552.0" y="44.0" width="320.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="712.0" y="66.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">потік ТЕЛЕМЕТРІЇ</tspan><tspan x="712.0" dy="16.9">лавина · кожен рядок дешевий</tspan></text>
<rect x="108.0" y="137.0" width="320.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.7"/><text x="268.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="268.0" dy="0.0">BEGIN … COMMIT</tspan><tspan x="268.0" dy="16.2">увесь агрегат атомарно</tspan></text>
<rect x="108.0" y="235.0" width="320.0" height="62.0" rx="6" fill="#fdf3e7" stroke="#e08a3c" stroke-width="1.7"/><text x="268.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="268.0" dy="0.0">synchronous = FULL</tspan><tspan x="268.0" dy="16.2">fsync на КОЖЕН коміт</tspan></text>
<rect x="108.0" y="333.0" width="320.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.7"/><text x="268.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="268.0" dy="0.0">на диску — переживе</tspan><tspan x="268.0" dy="16.2">навіть відмову живлення</tspan></text>
<line x1="268.0" y1="98.0" x2="268.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="268.0" y1="199.0" x2="268.0" y2="233.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="268.0" y1="297.0" x2="268.0" y2="331.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="108.0" y="430.0" width="320.0" height="44.0" rx="6" fill="#f7f9fb" stroke="#d7dbe0" stroke-width="1.5"/><text x="268.0" y="448.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="268.0" dy="0.0">повільніше на запис —</tspan><tspan x="268.0" dy="15.6">але записів обмаль</tspan></text>
<line x1="268.0" y1="397.0" x2="268.0" y2="428.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="552.0" y="137.0" width="320.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.7"/><text x="712.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">коміти ГРУПУЮТЬСЯ</tspan><tspan x="712.0" dy="16.2">багато рядків за раз</tspan></text>
<rect x="552.0" y="235.0" width="320.0" height="62.0" rx="6" fill="#fdf3e7" stroke="#e08a3c" stroke-width="1.7"/><text x="712.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">synchronous = NORMAL</tspan><tspan x="712.0" dy="16.2">fsync не на кожен коміт</tspan></text>
<rect x="552.0" y="333.0" width="320.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="712.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">на диску — на відмові живлення</tspan><tspan x="712.0" dy="16.2">губимо лише ХВІСТ</tspan></text>
<line x1="712.0" y1="98.0" x2="712.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="712.0" y1="199.0" x2="712.0" y2="233.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="712.0" y1="297.0" x2="712.0" y2="331.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="552.0" y="430.0" width="320.0" height="44.0" rx="6" fill="#f7f9fb" stroke="#d7dbe0" stroke-width="1.5"/><text x="712.0" y="448.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="712.0" dy="0.0">швидко — і це</tspan><tspan x="712.0" dy="15.6">свідома угода, не недбалість</tspan></text>
<line x1="712.0" y1="397.0" x2="712.0" y2="428.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="520.0" width="840.0" height="48.0" rx="6" fill="#fbfbe8" stroke="#c9b458" stroke-width="1.8"/><text x="500.0" y="548.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Той самий SQLite, той самий диск — різні важелі під різну ціну помилки.</tspan></text>
</svg>