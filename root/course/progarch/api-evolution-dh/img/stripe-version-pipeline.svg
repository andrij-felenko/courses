<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна правда всередині, ланцюг перекладачів на кордоні</text>
<rect x="60.0" y="175.0" width="170.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="145.0" y="217.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Клієнт</tspan><tspan x="145.0" dy="16.9">пришпилений до</tspan><tspan x="145.0" dy="16.9">2015-10-16</tspan></text>
<rect x="272.0" y="175.0" width="128.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="336.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="336.0" dy="0.0">перетворювач</tspan><tspan x="336.0" dy="15.6">2016-03-07</tspan></text>
<rect x="436.0" y="175.0" width="128.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">перетворювач</tspan><tspan x="500.0" dy="15.6">2017-05-24</tspan></text>
<rect x="600.0" y="175.0" width="128.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="664.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="664.0" dy="0.0">перетворювач</tspan><tspan x="664.0" dy="15.6">2019-03-14</tspan></text>
<rect x="770.0" y="175.0" width="175.0" height="110.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="857.5" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="857.5" dy="0.0">Один канонічний код</tspan><tspan x="857.5" dy="16.9">(сьогодні)</tspan></text>
<line x1="60.0" y1="145.0" x2="948.0" y2="145.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="504.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">① запит: прокотити ВПЕРЕД до канонічної форми</text>
<line x1="945.0" y1="320.0" x2="57.0" y2="320.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="504.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">② відповідь: відкотити НАЗАД до форми, яку чекає 2015-10-16</text>
<text x="504.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Кожне ламке оновлення додає ОДИН перетворювач на межі; сучасний код живе в одній формі.</text>
<text x="504.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Стара версія — не окрема гілка кодової бази, а тонкий шар перекладу.</text>
