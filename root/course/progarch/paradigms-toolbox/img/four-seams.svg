<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 436" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="436" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий механізм, протилежна політика — бо різний сенс даних</text>
<text x="590.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Чотири шви DH — і кожну пару ⟨місткість, політика⟩ диктує СЕНС даних на шві.</text>
<rect x="40.0" y="70.0" width="210.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="145.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Шов</tspan></text>
<rect x="254.0" y="70.0" width="150.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="329.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="329.0" dy="0.0">Місткість</tspan></text>
<rect x="408.0" y="70.0" width="250.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="533.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="533.0" dy="0.0">Політика переповнення</tspan></text>
<rect x="662.0" y="70.0" width="478.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="901.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="901.0" dy="0.0">Чому саме так — сенс даних</tspan></text>
<rect x="40.0" y="118.0" width="210.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="145.0" y="150.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Скринька</tspan><tspan x="145.0" dy="15.6">актора (на пристрій)</tspan></text>
<rect x="254.0" y="118.0" width="150.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="329.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="329.0" dy="0.0">64 → 1</tspan></text>
<rect x="408.0" y="118.0" width="250.0" height="72.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="533.0" y="150.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="533.0" dy="0.0">конфляція:</tspan><tspan x="533.0" dy="15.6">тримай найсвіжіший</tspan></text>
<rect x="662.0" y="118.0" width="478.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="901.0" y="150.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="901.0" dy="0.0">для СТАНУ пристрою важить лише ОСТАННЄ показання;</tspan><tspan x="901.0" dy="15.6">черга застарілих — сміття, не борг</tspan></text>
<rect x="40.0" y="194.0" width="210.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="145.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Черга →</tspan><tspan x="145.0" dy="15.6">пул (аналітика CPU)</tspan></text>
<rect x="254.0" y="194.0" width="150.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="329.0" y="235.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="329.0" dy="0.0">256</tspan></text>
<rect x="408.0" y="194.0" width="250.0" height="72.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="533.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="533.0" dy="0.0">блокувати:</tspan><tspan x="533.0" dy="15.6">тиск до джерела</tspan></text>
<rect x="662.0" y="194.0" width="478.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="901.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="901.0" dy="0.0">КОЖЕН кадр треба порахувати; втратити не можна,</tspan><tspan x="901.0" dy="15.6">а джерело здатне пригальмувати</tspan></text>
<rect x="40.0" y="270.0" width="210.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="145.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Канал</tspan><tspan x="145.0" dy="15.6">пул → правила</tspan></text>
<rect x="254.0" y="270.0" width="150.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="329.0" y="311.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="329.0" dy="0.0">64</tspan></text>
<rect x="408.0" y="270.0" width="250.0" height="72.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="533.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="533.0" dy="0.0">блокувати</tspan><tspan x="533.0" dy="15.6">(малий буфер)</tspan></text>
<rect x="662.0" y="270.0" width="478.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="901.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="901.0" dy="0.0">розв'язати ривки пулу й стадії правил,</tspan><tspan x="901.0" dy="15.6">не загубивши жодного вироку</tspan></text>
<rect x="40.0" y="346.0" width="210.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="145.0" y="378.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Offload циклу</tspan><tspan x="145.0" dy="15.6">(сам факт шва)</tspan></text>
<rect x="254.0" y="346.0" width="150.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="329.0" y="387.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="329.0" dy="0.0">&gt; 0</tspan></text>
<rect x="408.0" y="346.0" width="250.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="533.0" y="378.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="533.0" dy="0.0">винести CPU</tspan><tspan x="533.0" dy="15.6">у пул</tspan></text>
<rect x="662.0" y="346.0" width="478.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="901.0" y="378.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="901.0" dy="0.0">шов мусить БУТИ: місткість 0 = синхронний рахунок</tspan><tspan x="901.0" dy="15.6">у смузі морозить увесь прийом</tspan></text>
</svg>