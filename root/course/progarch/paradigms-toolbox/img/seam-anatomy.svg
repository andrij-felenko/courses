<line x1="360.0" y1="191.0" x2="360.0" y2="209.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="360.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="360.0" dy="0.0">0</tspan><tspan x="360.0" dy="15.6">крихко</tspan></text>
