<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шов — окремий об'єкт: місткість і політика переповнення</text>
<text x="560.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Між двома парадигмами — не порожнеча, а об'єкт із двома ручками.</text>
<rect x="40.0" y="252.0" width="200.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="140.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Парадигма А</tspan><tspan x="140.0" dy="16.9">(продюсер)</tspan><tspan x="140.0" dy="16.9">напр. цикл подій</tspan></text>
<rect x="880.0" y="252.0" width="200.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="980.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Парадигма Б</tspan><tspan x="980.0" dy="16.9">(споживач)</tspan><tspan x="980.0" dy="16.9">напр. пул воркерів</tspan></text>
<rect x="320.0" y="92.0" width="480.0" height="390.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="560.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">ШОВ = ⟨ місткість, політика ⟩</text>
<text x="560.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">МІСТКІСТЬ — скільки шов терпить</text>
