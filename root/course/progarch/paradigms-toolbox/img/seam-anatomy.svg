<rect x="676.0" y="318.0" width="104.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="728.0" y="341.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="728.0" dy="0.0">впасти</tspan><tspan x="728.0" dy="15.6">голосно</tspan></text>
<text x="560.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">конфляція = «викинути найстаріший» аж до місткості 1: у скриньці лише найсвіжіше</text>
<line x1="240.0" y1="304.0" x2="316.0" y2="304.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
