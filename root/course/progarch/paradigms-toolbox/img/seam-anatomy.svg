<text x="760.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="760.0" dy="0.0">∞</tspan><tspan x="760.0" dy="15.6">OOM</tspan></text>
<text x="560.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ПОЛІТИКА — що робити, коли повно</text>
