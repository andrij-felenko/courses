<text x="841.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">бере</text>
<line x1="316.0" y1="264.0" x2="240.0" y2="264.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="278.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">тиск угору</text>
<text x="560.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Дві ручки — місткість і політика — і роблять шов предметом проєктування, окремим від того, що по боках.</text>
