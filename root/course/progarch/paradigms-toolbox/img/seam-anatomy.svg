<rect x="452.0" y="318.0" width="104.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="504.0" y="341.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="504.0" dy="0.0">викинути</tspan><tspan x="504.0" dy="15.6">найстаріший</tspan></text>
