<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 384" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="384" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Читай форму межі, не сповідуй модель</text>
<text x="580.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Став ці питання на КОЖНОМУ шві окремо — форма назве інструмент.</text>
<rect x="40.0" y="78.0" width="262.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="171.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="171.0" dy="0.0">1 · Що тут СПІЛЬНЕ?</tspan><tspan x="171.0" dy="16.9">змінний стан</tspan><tspan x="171.0" dy="16.9">↔ не ділимо нічого</tspan></text>
<rect x="322.0" y="78.0" width="262.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="453.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="453.0" dy="0.0">2 · Де ВУЗЬКЕ місце?</tspan><tspan x="453.0" dy="16.9">очікування В/В</tspan><tspan x="453.0" dy="16.9">↔ робота CPU</tspan></text>
<rect x="604.0" y="78.0" width="262.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="735.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">3 · Ділиться за</tspan><tspan x="735.0" dy="16.9">КЛЮЧЕМ?</tspan><tspan x="735.0" dy="16.9">так → shared-nothing</tspan></text>
<rect x="886.0" y="78.0" width="262.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="1017.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1017.0" dy="0.0">4 · Яка ІЗОЛЯЦІЯ</tspan><tspan x="1017.0" dy="16.9">ЗБОЮ?</tspan><tspan x="1017.0" dy="16.9">ролить сусідів?</tspan></text>
<line x1="171.0" y1="182.0" x2="580.0" y2="228.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="453.0" y1="182.0" x2="580.0" y2="228.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="735.0" y1="182.0" x2="580.0" y2="228.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="1017.0" y1="182.0" x2="580.0" y2="228.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="480.0" y="228.0" width="200.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">ФОРМА МЕЖІ</tspan></text>
<line x1="580.0" y1="272.0" x2="580.0" y2="298.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="215.0" y="300.0" width="730.0" height="52.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">форма визначає інструмент · кілька меж → кілька інструментів, зшитих швами</tspan></text>
<text x="580.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Не «яка модель найкраща», а «яка тут форма» — на кожній межі своя.</text>
</svg>