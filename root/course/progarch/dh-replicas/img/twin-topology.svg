<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один писар, багато читалень</text>
<rect x="60.0" y="152.0" width="190.0" height="56.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="155.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">хаб</tspan><tspan x="155.0" dy="16.9">(доповідає стан)</tspan></text>
<rect x="60.0" y="246.0" width="190.0" height="56.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="155.0" y="270.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">команда</tspan><tspan x="155.0" dy="16.9">користувача</tspan></text>
<text x="292.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">записи</text>
<line x1="250.0" y1="180.0" x2="330.0" y2="208.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="250.0" y1="274.0" x2="330.0" y2="246.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="330.0" y="170.0" width="240.0" height="110.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">твін · ЛІДЕР</tspan><tspan x="450.0" dy="18.2">єдиний писар</tspan><tspan x="450.0" dy="18.2">завжди найсвіжіший</tspan></text>
<rect x="800.0" y="96.0" width="360.0" height="58.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="129.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">фоловер 1 · копія твіна</tspan></text>
<rect x="800.0" y="190.0" width="360.0" height="58.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="223.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">фоловер 2 · копія твіна</tspan></text>
<rect x="800.0" y="284.0" width="360.0" height="58.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="317.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">фоловер 3 · копія твіна</tspan></text>
<text x="980.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кожна копія позаду на лаг Δ</text>
<text x="690.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="690.0" dy="0.0">асинхронна реплікація</tspan><tspan x="690.0" dy="15.6">(фоловер завжди позаду на лаг Δ)</tspan></text>
<line x1="570.0" y1="200.0" x2="800.0" y2="126.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="222.0" x2="800.0" y2="220.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="244.0" x2="800.0" y2="314.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="330.0" y="408.0" width="360.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">десятки тисяч застосунків</tspan><tspan x="510.0" dy="16.9">читають «покажи мій дім»</tspan></text>
<text x="510.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">читання — на фоловери</text>
<line x1="690.0" y1="436.0" x2="800.0" y2="250.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="512.0" width="1100.0" height="62.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="610.0" y="539.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Усі записи сходяться в ОДНОГО лідера; фоловери тримають читабельні копії й доганяють його з лагом Δ.</tspan><tspan x="610.0" dy="16.9">Потік «покажи мій дім» розсипано по фоловерах — звідси масштаб; але кожна копія, яку читає застосунок, — трохи минуле твіна.</tspan></text>
</svg>