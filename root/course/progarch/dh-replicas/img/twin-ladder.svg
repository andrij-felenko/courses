<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1280" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три сходинки твіна: залізо → модель → хмарна копія</text>
<line x1="400.0" y1="250.0" x2="452.0" y2="250.0" stroke="#6b7280" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="830.0" y1="250.0" x2="882.0" y2="250.0" stroke="#6b7280" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="74.0" width="360.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="97.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">ФІЗИЧНИЙ ТВІН</tspan><tspan x="210.0" dy="18.2">Аполлон · 1960–70-ті</tspan></text>
<rect x="54.0" y="164.0" width="140.0" height="72.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="124.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="124.0" dy="0.0">справжній</tspan><tspan x="124.0" dy="15.6">апарат</tspan><tspan x="124.0" dy="15.6">(політ)</tspan></text>
<rect x="226.0" y="164.0" width="140.0" height="72.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="296.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="296.0" dy="0.0">такий самий</tspan><tspan x="296.0" dy="15.6">апарат</tspan><tspan x="296.0" dy="15.6">(на Землі)</tspan></text>
<rect x="30.0" y="272.0" width="360.0" height="176.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Дублікат — справжнє залізо,</tspan><tspan x="210.0" dy="16.9">один-в-один. Точно, але</tspan><tspan x="210.0" dy="16.9">страшенно дорого: другий</tspan><tspan x="210.0" dy="16.9">фізичний корабель. Лише для</tspan><tspan x="210.0" dy="16.9">найкритичніших місій.</tspan></text>
<rect x="460.0" y="74.0" width="360.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="640.0" y="97.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">ЦИФРОВИЙ ТВІН</tspan><tspan x="640.0" dy="18.2">Грівз · NASA · 2002–12</tspan></text>
<rect x="484.0" y="164.0" width="140.0" height="72.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="554.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="554.0" dy="0.0">фізичний</tspan><tspan x="554.0" dy="15.6">обʼєкт</tspan></text>
<rect x="656.0" y="164.0" width="140.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="726.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="726.0" dy="0.0">модель</tspan><tspan x="726.0" dy="15.6">даних</tspan></text>
<text x="640.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">телеметрія →</text>
<line x1="626.0" y1="200.0" x2="654.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="272.0" width="360.0" height="176.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="640.0" y="322.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Замість другого заліза —</tspan><tspan x="640.0" dy="16.9">МОДЕЛЬ. Дані дзеркалять</tspan><tspan x="640.0" dy="16.9">обʼєкт; телеметрія тримає</tspan><tspan x="640.0" dy="16.9">модель живою. Дешевше й</tspan><tspan x="640.0" dy="16.9">масштабується — та сама ідея</tspan><tspan x="640.0" dy="16.9">без другого корпусу.</tspan></text>
<rect x="890.0" y="74.0" width="360.0" height="56.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="1070.0" y="97.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1070.0" dy="0.0">ТІНЬ ПРИСТРОЮ</tspan><tspan x="1070.0" dy="18.2">AWS · Azure · DH · 2015→</tspan></text>
<rect x="914.0" y="158.0" width="312.0" height="46.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="1070.0" y="185.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1070.0" dy="0.0">хмара тримає копію стану</tspan></text>
<line x1="1070.0" y1="204.0" x2="1070.0" y2="226.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="914.0" y="226.0" width="312.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1070.0" y="245.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">застосунок читає копію —</tspan><tspan x="1070.0" dy="15.6">навіть коли пристрій офлайн</tspan></text>
<rect x="890.0" y="292.0" width="360.0" height="156.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="1070.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">Персистентна хмарна копія</tspan><tspan x="1070.0" dy="16.9">стану. «Бажане ⇄ повідомлене».</tspan><tspan x="1070.0" dy="16.9">Читається незалежно від того,</tspan><tspan x="1070.0" dy="16.9">онлайн пристрій чи ні.</tspan><tspan x="1070.0" dy="16.9">Це і є твін DH.</tspan></text>
</svg>