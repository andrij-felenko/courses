<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1260" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Споживач обертає кожне правило провайдера на обов'язок</text>
<text x="350.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">ОБІЦЯНКА ПРОВАЙДЕРА</text>
<text x="910.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">ОБОВ'ЯЗОК ПРИЙМАЧА</text>
<rect x="160.0" y="153.2" width="380.0" height="33.5" rx="6" fill="#e6eefb" stroke="#2457d6" stroke-width="1.8"/><text x="350.0" y="174.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Підписує тіло секретом</tspan></text>
<rect x="720.0" y="144.5" width="380.0" height="51.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="910.0" y="165.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">Перевір підпис</tspan><tspan x="910.0" dy="17.6">на кожному POST</tspan></text>
<line x1="548.0" y1="170.0" x2="712.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="160.0" y="279.5" width="380.0" height="51.1" rx="6" fill="#e6eefb" stroke="#2457d6" stroke-width="1.8"/><text x="350.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Доставляє «щонайменше раз»,</tspan><tspan x="350.0" dy="17.6">повторює при сумніві</tspan></text>
<rect x="720.0" y="279.5" width="380.0" height="51.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="910.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">Стерпи дублі й повтори</tspan><tspan x="910.0" dy="17.6">(дедуп за id)</tspan></text>
<line x1="548.0" y1="305.0" x2="712.0" y2="305.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="160.0" y="423.2" width="380.0" height="33.5" rx="6" fill="#e6eefb" stroke="#2457d6" stroke-width="1.8"/><text x="350.0" y="444.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Кладе унікальний id події</tspan></text>
<rect x="720.0" y="414.5" width="380.0" height="51.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="910.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">Упізнай той самий</tspan><tspan x="910.0" dy="17.6">факт удруге</tspan></text>
<line x1="548.0" y1="440.0" x2="712.0" y2="440.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="120.0" y="533.9" width="1020.0" height="52.2" rx="6" fill="#fff4e0" stroke="#c77800" stroke-width="2.0"/><text x="630.0" y="555.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c77800" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Приймальні двері — ПУБЛІЧНІ: стукає чужий сервер, не залогінений користувач.</tspan><tspan x="630.0" dy="18.2">Тіло вебхука — недовірений ввід, доки підпис не доведе протилежне.</tspan></text>
</svg>