<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Позначка «бачене» і задача в черзі — атомарно, або ніяк</text>
<text x="670.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">ДВА ОКРЕМІ ЗАПИСИ — між ними може впасти процес</text>
<rect x="75.0" y="127.6" width="210.0" height="48.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="180.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">1. inbox ✓</tspan><tspan x="180.0" dy="16.2">позначив «бачене»</tspan></text>
<rect x="350.0" y="127.6" width="210.0" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="455.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">CRASH</tspan><tspan x="455.0" dy="16.2">до запису в чергу</tspan></text>
<rect x="630.0" y="127.6" width="210.0" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="735.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">2. jobs ✗</tspan><tspan x="735.0" dy="16.2">задачу не створено</tspan></text>
