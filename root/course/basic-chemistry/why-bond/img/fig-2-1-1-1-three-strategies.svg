<text x="480" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">мета одна — повна зовнішня поличка (як в інертних)</text>
<text x="480" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#7c9a85">суцільне кільце — нижча, уже повна поличка</text>
