<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="940" height="380" fill="white"/>
<text x="470" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#222">трикутник m–n–M: закрий те, що шукаєш, — решта покаже формулу</text>
<path d="M 470 80 L 320 300 L 620 300 Z" fill="#f3f8fb" stroke="#7fa8c0" stroke-width="2.5"/>
<line x1="355" y1="210" x2="585" y2="210" stroke="#7fa8c0" stroke-width="2"/>
<line x1="470" y1="210" x2="470" y2="300" stroke="#7fa8c0" stroke-width="2"/>
<text x="470" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#a83c30">m</text>
<text x="400" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#2f6f9e">n</text>
<text x="545" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#2f7d4f">M</text>
<text x="470" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">маса (г)   =   молі × молярна маса</text>
<rect x="690" y="90" width="220" height="210" rx="10" fill="#fbfdfe" stroke="#cdd8e0"/>
<text x="710" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#777">закрий m</text>
<text x="710" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#a83c30">m = n · M</text>
<text x="710" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#777">закрий n</text>
<text x="710" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#2f6f9e">n = m / M</text>
<text x="710" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#777">закрий M</text>
<text x="710" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#2f7d4f">M = m / n</text>
</svg>
