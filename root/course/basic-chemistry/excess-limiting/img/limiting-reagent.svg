<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360">
<rect width="940" height="360" fill="white"/>
<text x="470" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#222">реакція йде по тому, чого менше: решта лишається в надлишку</text>
<text x="470" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#666">рецепт: 2 яйця + 1 склянка борошна → 1 партія</text>
<text x="230" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">є 6 яєць</text>
<ellipse cx="120" cy="135" rx="14" ry="18" fill="#f3e3b0" stroke="#caa84a"/>
<ellipse cx="162" cy="135" rx="14" ry="18" fill="#f3e3b0" stroke="#caa84a"/>
<ellipse cx="204" cy="135" rx="14" ry="18" fill="#f3e3b0" stroke="#caa84a"/>
<ellipse cx="246" cy="135" rx="14" ry="18" fill="#f3e3b0" stroke="#caa84a"/>
<ellipse cx="288" cy="135" rx="14" ry="18" fill="#f3e3b0" stroke="#caa84a"/>
<ellipse cx="330" cy="135" rx="14" ry="18" fill="#f3e3b0" stroke="#caa84a"/>
<text x="700" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">є 2 склянки борошна</text>
<rect x="610" y="116" width="50" height="40" rx="8" fill="#efe6d2" stroke="#b9a86a" stroke-width="1.4"/>
<rect x="680" y="116" width="50" height="40" rx="8" fill="#efe6d2" stroke="#b9a86a" stroke-width="1.4"/>
<rect x="120" y="185" width="700" height="130" rx="8" fill="#f7fafc" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="470" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#666">на скільки партій вистачить кожного?</text>
<text x="300" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222">яйця: 6 ÷ 2 = 3 партії</text>
<text x="640" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#a83c30">борошно: 2 ÷ 1 = 2 партії</text>
<text x="470" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#2f7d4f">менше — борошно: вийде 2 партії, а 2 яйця лишаться зайвими (надлишок)</text>
</svg>
