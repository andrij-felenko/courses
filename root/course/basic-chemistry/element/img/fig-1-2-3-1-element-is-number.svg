<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="940" height="350" fill="white"/>
<text x="330" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#222">сорт атома задає одне число — скільки протонів у ядрі</text>
<rect x="40" y="60" width="170" height="150" rx="10" fill="#f7fafc" stroke="#b9c6cf"/>
<text x="125.0" y="201" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#445">Гідроген · H</text>
<circle cx="125" cy="120" r="26" fill="#e05545" stroke="#a83c30" stroke-width="1.5"/>
<text x="125" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="white">1</text>
<text x="125" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">протонів у ядрі</text>
<rect x="240" y="60" width="170" height="150" rx="10" fill="#f7fafc" stroke="#b9c6cf"/>
<text x="325.0" y="201" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#445">Оксиген · O</text>
<circle cx="325" cy="120" r="26" fill="#e05545" stroke="#a83c30" stroke-width="1.5"/>
<text x="325" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="white">8</text>
<text x="325" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">протонів у ядрі</text>
<rect x="440" y="60" width="170" height="150" rx="10" fill="#f7fafc" stroke="#b9c6cf"/>
<text x="525.0" y="201" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#445">Ферум · Fe</text>
<circle cx="525" cy="120" r="26" fill="#e05545" stroke="#a83c30" stroke-width="1.5"/>
<text x="525" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="white">26</text>
<text x="525" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">протонів у ядрі</text>
<text x="770" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#222">а нейтрони сорт не міняють</text>
<rect x="660" y="60" width="220" height="150" rx="10" fill="#f7fafc" stroke="#b9c6cf"/>
<text x="770.0" y="201" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#445">обидва — Гідроген (ізотопи)</text>
<circle cx="715" cy="120" r="16" fill="#e05545" stroke="#a83c30" stroke-width="1.5"/>
<text x="715" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="white">1</text>
<circle cx="805" cy="112" r="16" fill="#e05545" stroke="#a83c30" stroke-width="1.5"/>
<text x="805" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="white">1</text>
<circle cx="825" cy="132" r="16" fill="#9a9a9a" stroke="#777" stroke-width="1.5"/>
<text x="715" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#666">1 протон</text>
<text x="810" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#666">1 протон + нейтрон</text>
<line x1="330" y1="280" x2="610" y2="280" stroke="#a83c30" stroke-width="2" marker-end="url(#arr)"/>
<text x="470" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#a83c30">змінити число протонів хімія не вміє</text>
<text x="470" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#555">тому в реакціях елементи не перетворюються одне на одного</text>
</svg>
