<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="960" height="430" fill="white"/>
<text x="480" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">каталізатор знижує бар'єр — і сам виходить цілим</text>
<line x1="90" y1="350" x2="90" y2="70" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="70" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#444">енергія</text>
<line x1="90" y1="350" x2="720" y2="350" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="700" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#444">хід реакції →</text>
<line x1="110" y1="250" x2="180" y2="250" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="150" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#555">початок</text>
<line x1="560" y1="300" x2="700" y2="300" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="640" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#555">продукти</text>
<path d="M 150 250 C 280 250, 300 110, 400 110 C 500 110, 520 300, 660 300" fill="none" stroke="#d9533c" stroke-width="3"/>
<text x="400" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#d9533c">без каталізатора</text>
<text x="400" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#d9533c">високий бар'єр</text>
<path d="M 150 250 C 260 250, 300 200, 400 200 C 500 200, 540 300, 660 300" fill="none" stroke="#2f9e54" stroke-width="3"/>
<text x="400" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2f9e54">з каталізатором: бар'єр нижчий —</text>
<text x="400" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2f9e54">через горб перескакує набагато більше зустрічей</text>
<text x="150" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#888">однакові</text>
<line x1="660" y1="190" x2="660" y2="300" stroke="#ccc" stroke-width="1"/>
<rect x="760" y="120" width="160" height="210" rx="12" fill="#f9fbfd" stroke="#cdd8e0"/>
<text x="840" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#334">каталізатор</text>
<circle cx="840" cy="185" r="22" fill="#e0b54a" stroke="#a8884a" stroke-width="1.6"/>
<text x="840" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="white">К</text>
<text x="840" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#777">до реакції</text>
<line x1="840" y1="238" x2="840" y2="262" stroke="#666" stroke-width="1.8" marker-end="url(#arr)"/>
<circle cx="840" cy="292" r="22" fill="#e0b54a" stroke="#a8884a" stroke-width="1.6"/>
<text x="840" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="white">К</text>
<text x="840" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2f9e54">після — той самий!</text>
</svg>
