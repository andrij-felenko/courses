<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="960" height="380" fill="white"/>
<text x="480" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">чому палаючу олію НЕ можна гасити водою</text>
<text x="255" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#444">вода важча за олію — тоне на дно</text>
<path d="M 90 250 L 420 250 L 405 300 L 105 300 Z" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="2"/>
<rect x="120" y="200" width="280" height="52" fill="#e0b54a" opacity="0.85"/>
<text x="255" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#7a5a10">палаюча олія</text>
<ellipse cx="255" cy="150" rx="13" ry="17" fill="#7fbfe0" stroke="#4a90c0"/>
<line x1="255" y1="172" x2="255" y2="205" stroke="#4a90c0" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="255" cy="240" r="10" fill="#cfe8f5" stroke="#7fbfe0"/>
<text x="255" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#c23b2a">крапля тоне, миттєво скипає в пару —</text>
<text x="255" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#c23b2a">пара× 1700 обсягу викидає палаючу олію вгору</text>
<text x="710" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#444">виходить вогняний стовп, а не гасіння</text>
<path d="M 590 250 L 830 250 L 818 300 L 602 300 Z" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="2"/>
<path d="M 650 240 q -10 -85 0 -170 q 10 85 0 170" fill="#e8852a" stroke="#c23b2a" stroke-width="1.5"/>
<path d="M 690 240 q -10 -60 0 -120 q 10 60 0 120" fill="#e8852a" stroke="#c23b2a" stroke-width="1.5"/>
<path d="M 720 240 q -10 -45 0 -90 q 10 45 0 90" fill="#e8852a" stroke="#c23b2a" stroke-width="1.5"/>
<path d="M 755 240 q -10 -65 0 -130 q 10 65 0 130" fill="#e8852a" stroke="#c23b2a" stroke-width="1.5"/>
<path d="M 790 240 q -10 -87 0 -175 q 10 87 0 175" fill="#e8852a" stroke="#c23b2a" stroke-width="1.5"/>
<text x="710" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2f9e54">✓ правильно: накрити кришкою (прибрати кисень)</text>
<text x="710" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2f9e54">або згасити вогонь спеціальним засобом</text>
</svg>
