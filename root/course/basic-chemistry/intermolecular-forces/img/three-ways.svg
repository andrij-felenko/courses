<rect x="590.0" y="542.0" width="350.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="569.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Навіть у симетричної частинки</tspan><tspan x="765.0" dy="18.2">електрони на мить збиваються набік.</tspan><tspan x="765.0" dy="18.2">Сусід одразу підлаштовується —</tspan><tspan x="765.0" dy="18.2">і вони притягуються.</tspan></text>
