<rect x="590.0" y="112.0" width="350.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="139.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Один бік молекули злегка мінусовий,</tspan><tspan x="765.0" dy="18.2">другий злегка плюсовий. Сусіди</tspan><tspan x="765.0" dy="18.2">повертаються протилежними боками</tspan><tspan x="765.0" dy="18.2">й злипаються.</tspan></text>
