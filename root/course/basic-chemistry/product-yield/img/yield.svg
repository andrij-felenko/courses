<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320">
<rect width="940" height="320" fill="white"/>
<text x="470" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#222">вихід: скільки вийшло насправді проти того, що обіцяла теорія</text>
<rect x="220" y="100" width="120" height="150" rx="8" fill="#cfe0ef" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="280" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#3b6f88">теорія</text>
<text x="280" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#3b6f88">72 г</text>
<text x="280" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#666">скільки мало б</text>
<rect x="420" y="118.75" width="120" height="131.25" rx="8" fill="#bfe3c8" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="480" y="106.75" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#2f7d4f">практика</text>
<text x="480" y="146.75" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#2f7d4f">63 г</text>
<text x="480" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#666">скільки вийшло</text>
<line x1="200" y1="250" x2="560" y2="250" stroke="#bbb" stroke-width="1.5"/>
<rect x="620" y="100" width="260" height="150" rx="8" fill="#f7fafc" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="750" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#1f6f9e">η = m(практ)/m(теор)·100%</text>
<text x="750" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222">η = 63 / 72 · 100%</text>
<text x="750" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#2f7d4f">= 87,5 %</text>
</svg>
