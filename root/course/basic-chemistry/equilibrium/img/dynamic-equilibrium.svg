<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="960" height="380" fill="white"/>
<text x="480" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">рівновага — це не «зупинилось», а «туди = назад»</text>
<rect x="110" y="90" width="220" height="180" rx="12" fill="#eef4fb" stroke="#9fb4c0"/>
<text x="220" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1f6f9e">реагенти</text>
<circle cx="150" cy="150" r="9" fill="#5a9bd4" stroke="#555" stroke-width="1.2"/>
<circle cx="200" cy="140" r="9" fill="#5a9bd4" stroke="#555" stroke-width="1.2"/>
<circle cx="260" cy="155" r="9" fill="#5a9bd4" stroke="#555" stroke-width="1.2"/>
<circle cx="175" cy="195" r="9" fill="#5a9bd4" stroke="#555" stroke-width="1.2"/>
<circle cx="240" cy="200" r="9" fill="#5a9bd4" stroke="#555" stroke-width="1.2"/>
<circle cx="290" cy="175" r="9" fill="#5a9bd4" stroke="#555" stroke-width="1.2"/>
<circle cx="210" cy="235" r="9" fill="#5a9bd4" stroke="#555" stroke-width="1.2"/>
<rect x="630" y="90" width="220" height="180" rx="12" fill="#e4f4ea" stroke="#9cc3a6"/>
<text x="740" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#2f9e54">продукти</text>
<circle cx="670" cy="150" r="9" fill="#7cb87a" stroke="#555" stroke-width="1.2"/>
<circle cx="720" cy="140" r="9" fill="#7cb87a" stroke="#555" stroke-width="1.2"/>
<circle cx="780" cy="155" r="9" fill="#7cb87a" stroke="#555" stroke-width="1.2"/>
<circle cx="695" cy="195" r="9" fill="#7cb87a" stroke="#555" stroke-width="1.2"/>
<circle cx="760" cy="200" r="9" fill="#7cb87a" stroke="#555" stroke-width="1.2"/>
<circle cx="810" cy="175" r="9" fill="#7cb87a" stroke="#555" stroke-width="1.2"/>
<circle cx="730" cy="235" r="9" fill="#7cb87a" stroke="#555" stroke-width="1.2"/>
<line x1="340" y1="150" x2="620" y2="150" stroke="#b3541e" stroke-width="3" marker-end="url(#arr)"/>
<text x="480" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#b3541e">туди</text>
<line x1="620" y1="210" x2="340" y2="210" stroke="#7a5fb0" stroke-width="3" marker-end="url(#arr)"/>
<text x="480" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#7a5fb0">назад</text>
<text x="480" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#888">однакова швидкість</text>
<text x="480" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#444">рівні більше не міняються — але обидва процеси тривають,</text>
<text x="480" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#444">просто рівно гасять один одного (динамічна рівновага)</text>
<text x="480" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#777">знак ⇄ замість → саме про це</text>
</svg>
