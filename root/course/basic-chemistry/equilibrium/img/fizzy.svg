<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="960" height="400" fill="white"/>
<text x="480" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">газована вода: CO₂ у воді ⇄ CO₂ над водою</text>
<rect x="120" y="104" width="150" height="256" rx="14" fill="#dff0f7" stroke="#8fb6c9" stroke-width="2"/>
<rect x="180" y="70" width="30" height="40" fill="#dff0f7" stroke="#8fb6c9" stroke-width="2"/>
<rect x="176" y="62" width="38" height="14" rx="3" fill="#c9a36a" stroke="#9a7a44"/>
<text x="195" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f6f9e">закрита</text>
<circle cx="155" cy="250" r="5" fill="#bfe0ef" stroke="#8fb6c9" stroke-width="1"/>
<circle cx="185" cy="290" r="5" fill="#bfe0ef" stroke="#8fb6c9" stroke-width="1"/>
<circle cx="225" cy="260" r="5" fill="#bfe0ef" stroke="#8fb6c9" stroke-width="1"/>
<circle cx="170" cy="320" r="5" fill="#bfe0ef" stroke="#8fb6c9" stroke-width="1"/>
<circle cx="210" cy="310" r="5" fill="#bfe0ef" stroke="#8fb6c9" stroke-width="1"/>
<circle cx="240" cy="300" r="5" fill="#bfe0ef" stroke="#8fb6c9" stroke-width="1"/>
<line x1="195" y1="200" x2="195" y2="165" stroke="#7a5fb0" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="180" y1="165" x2="180" y2="200" stroke="#b3541e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="195" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#2f9e54">⇄ зрівноважено: лишається газованою</text>
<rect x="405" y="104" width="150" height="256" rx="14" fill="#dff0f7" stroke="#8fb6c9" stroke-width="2"/>
<rect x="465" y="70" width="30" height="40" fill="#dff0f7" stroke="#8fb6c9" stroke-width="2"/>
<text x="480" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#b3541e">відкрита</text>
<circle cx="440" cy="300" r="4" fill="#bfe0ef" stroke="#8fb6c9" stroke-width="1"/>
<circle cx="470" cy="320" r="4" fill="#bfe0ef" stroke="#8fb6c9" stroke-width="1"/>
<circle cx="505" cy="305" r="4" fill="#bfe0ef" stroke="#8fb6c9" stroke-width="1"/>
<line x1="465" y1="90" x2="465" y2="60" stroke="#b3541e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="480" y1="85" x2="480" y2="45" stroke="#b3541e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="495" y1="86" x2="495" y2="58" stroke="#b3541e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="480" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#b3541e">газ тікає — рівновага зсунулась,</text>
<text x="480" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#b3541e">вода видихається</text>
<rect x="690" y="104" width="150" height="256" rx="14" fill="#dff0f7" stroke="#8fb6c9" stroke-width="2"/>
<rect x="750" y="70" width="30" height="40" fill="#dff0f7" stroke="#8fb6c9" stroke-width="2"/>
<text x="765" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#c23b2a">тепла й відкрита</text>
<line x1="735" y1="96" x2="735" y2="52" stroke="#c23b2a" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="755" y1="90" x2="755" y2="38" stroke="#c23b2a" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="775" y1="96" x2="775" y2="50" stroke="#c23b2a" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="795" y1="94" x2="795" y2="44" stroke="#c23b2a" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="765" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#c23b2a">тепло жене ⇄ убік газу —</text>
<text x="765" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#c23b2a">вивітрюється ще швидше</text>
</svg>
