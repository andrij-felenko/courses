<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="940.0" height="490.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">БЛОКОВИЙ РІВЕНЬ: ВІД СТОРІНОК RAM ДО АПАРАТНОГО ЗАПИТУ DMA</text>
<rect x="40.0" y="65.0" width="275.0" height="420.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="177.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1. СТОРІНКИ ТА STRUCT BIO</text>
<rect x="55.0" y="110.0" width="245.0" height="75.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="177.5" y="130.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">Брудні сторінки (Page Cache)</tspan><tspan x="177.5" dy="13.7">Folio 0: 4 КіБ (LBA 1000..1007)</tspan><tspan x="177.5" dy="13.7">Folio 1: 4 КіБ (LBA 1008..1015)</tspan><tspan x="177.5" dy="13.7">Folio 2: 4 КіБ (LBA 1016..1023)</tspan></text>
<line x1="177.0" y1="185.0" x2="177.0" y2="215.0" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="215.0" width="245.0" height="110.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="177.5" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">struct bio (Вектор вводу-виводу)</tspan><tspan x="177.5" dy="13.0">• bi_bdev = /dev/nvme0n1p1</tspan><tspan x="177.5" dy="13.0">• bi_iter.bi_sector = 1000</tspan><tspan x="177.5" dy="13.0">• bi_vcnt = 3 (вектори)</tspan><tspan x="177.5" dy="13.0">• bio_vec[0]: page0, 4K, off=0</tspan><tspan x="177.5" dy="13.0">• bio_vec[1]: page1, 4K, off=0</tspan><tspan x="177.5" dy="13.0">• bio_vec[2]: page2, 4K, off=0</tspan></text>
<line x1="177.0" y1="325.0" x2="177.0" y2="355.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="355.0" width="245.0" height="110.0" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="177.5" y="386.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">Вхід у blk-mq</tspan><tspan x="177.5" dy="13.7">submit_bio(bio)</tspan><tspan x="177.5" dy="13.7">Потоковий plug-список</tspan><tspan x="177.5" dy="13.7">(task_struct-&gt;plug)</tspan><tspan x="177.5" dy="13.7">Акумуляція суміжних bio</tspan></text>
<rect x="345.0" y="65.0" width="290.0" height="420.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="490.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">2. BLK-MQ ТА ПЛАНУВАЛЬНИК</text>
<rect x="360.0" y="110.0" width="260.0" height="80.0" rx="6" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/><text x="490.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Програмні черги (Staging)</tspan><tspan x="490.0" dy="13.7">struct blk_mq_ctx (per-CPU)</tspan><tspan x="490.0" dy="13.7">• CPU 0 Queue | CPU 1 Queue</tspan><tspan x="490.0" dy="13.7">• CPU 2 Queue | CPU 3 Queue</tspan><tspan x="490.0" dy="13.7">(Нуль блокувань між ядрами)</tspan></text>
<line x1="490.0" y1="190.0" x2="490.0" y2="220.0" stroke="#ec4899" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="220.0" width="260.0" height="115.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="490.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Планувальник вводу-виводу</tspan><tspan x="490.0" dy="13.0">(I/O Scheduler / Elevator)</tspan><tspan x="490.0" dy="13.0">• none (NVMe bypass)</tspan><tspan x="490.0" dy="13.0">• mq-deadline (дедлайни r/w)</tspan><tspan x="490.0" dy="13.0">• BFQ (бюджетний fair-share)</tspan><tspan x="490.0" dy="13.0">Операція: Back / Front Merge</tspan><tspan x="490.0" dy="13.0">(зшивання суміжних bio в один)</tspan></text>
<line x1="490.0" y1="335.0" x2="490.0" y2="365.0" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="365.0" width="260.0" height="100.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="490.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Апаратні черги ядра</tspan><tspan x="490.0" dy="13.7">struct blk_mq_hw_ctx (hctx)</tspan><tspan x="490.0" dy="13.7">Черга диспетчеризації</tspan><tspan x="490.0" dy="13.7">(Dispatch Queue)</tspan><tspan x="490.0" dy="13.7">Готові запити struct request</tspan></text>
<rect x="665.0" y="65.0" width="275.0" height="420.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="802.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">3. STRUCT REQUEST ТА DMA</text>
<rect x="680.0" y="110.0" width="245.0" height="110.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="802.5" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="802.5" dy="0.0">struct request (Агрегований)</tspan><tspan x="802.5" dy="13.7">• __sector = 1000</tspan><tspan x="802.5" dy="13.7">• __data_len = 128 КіБ (32 bio)</tspan><tspan x="802.5" dy="13.7">• nr_phys_segments = 32</tspan><tspan x="802.5" dy="13.7">• bio = head_bio ──&gt; next_bio</tspan><tspan x="802.5" dy="13.7">Повністю готовий для DMA</tspan></text>
<line x1="802.0" y1="220.0" x2="802.0" y2="250.0" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="680.0" y="250.0" width="245.0" height="100.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="802.5" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="802.5" dy="0.0">Драйвер NVMe / AHCI</tspan><tspan x="802.5" dy="13.7">Створення SQE команди:</tspan><tspan x="802.5" dy="13.7">SLBA = 1000, Length = 128 KB</tspan><tspan x="802.5" dy="13.7">PRP / SGL таблиця фізичних</tspan><tspan x="802.5" dy="13.7">адрес оперативної пам'яті</tspan></text>
<line x1="802.0" y1="350.0" x2="802.0" y2="380.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="680.0" y="380.0" width="245.0" height="85.0" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/><text x="802.5" y="405.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="802.5" dy="0.0">Шина PCIe / Контролер</tspan><tspan x="802.5" dy="13.7">MMIO Doorbell Ring ──&gt;</tspan><tspan x="802.5" dy="13.7">PCIe Bus Master DMA ──&gt;</tspan><tspan x="802.5" dy="13.7">Контролер забирає 128 КіБ</tspan></text>
<line x1="315.0" y1="270.0" x2="345.0" y2="270.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="635.0" y1="270.0" x2="665.0" y2="270.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
