<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="920.0" height="480.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">АТОМАРНА ПІДМІНА (RENAME) ПРОТИ ПРЯМОГО ПЕРЕЗАПИСУ (TRUNCATE)</text>
<rect x="50.0" y="75.0" width="420.0" height="405.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
<text x="260.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">НЕБЕЗПЕЧНО: open(O_WRONLY | O_TRUNC)</text>
<rect x="70.0" y="120.0" width="380.0" height="60.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="260.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">1. Файл config.json (Inode #501)</tspan><tspan x="260.0" dy="14.3">Обнуляється розмір (length = 0)</tspan><tspan x="260.0" dy="14.3">Дані старого файлу стерто з блоків</tspan></text>
<line x1="260.0" y1="180.0" x2="260.0" y2="210.0" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="210.0" width="380.0" height="70.0" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="260.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9f1239" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">2. Процес починає повільний запис...</tspan><tspan x="260.0" dy="13.7">Паралельний читач читає ПОВРЕЖДЕНІ / НАПІВПУСТІ ДАНІ!</tspan><tspan x="260.0" dy="13.7">Збій живлення / SIGKILL ──&gt; файл знищено назавжди!</tspan></text>
<line x1="260.0" y1="280.0" x2="260.0" y2="310.0" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="310.0" width="380.0" height="60.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="260.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">3. Виконуваний бінарник (/usr/bin/app)</tspan><tspan x="260.0" dy="13.7">Ядро повертає помилку ETXTBSY або</tspan><tspan x="260.0" dy="13.7">падіння через сторінковий збій mmap!</tspan></text>
<line x1="260.0" y1="370.0" x2="260.0" y2="400.0" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="400.0" width="380.0" height="65.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="260.0" y="422.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Підсумок: стан гонитви (race condition),</tspan><tspan x="260.0" dy="14.3">ризик повної втрати конфігурації,</tspan><tspan x="260.0" dy="14.3">неможливість гарячого оновлення.</tspan></text>
<rect x="510.0" y="75.0" width="420.0" height="405.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="720.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">ПАТЕРН НАДІЙНОСТІ: Safe Save (rename)</text>
<rect x="530.0" y="120.0" width="380.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="720.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">1. Запис у тимчасовий файл поруч:</tspan><tspan x="720.0" dy="14.3">config.json.tmp.1042 (новий Inode #599)</tspan><tspan x="720.0" dy="14.3">fsync(fd) ──&gt; гарантія скидання на диск</tspan></text>
<line x1="720.0" y1="180.0" x2="720.0" y2="210.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="530.0" y="210.0" width="380.0" height="70.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="720.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">2. rename(&quot;config.json.tmp.1042&quot;, &quot;config.json&quot;)</tspan><tspan x="720.0" dy="13.7">Атомарна зміна покажчика в каталозі!</tspan><tspan x="720.0" dy="13.7">Читачі бачать АБО стару версію, АБО нову</tspan></text>
<line x1="720.0" y1="280.0" x2="720.0" y2="310.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="530.0" y="310.0" width="380.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="720.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">3. Старий Inode #501 відв'язується (unlink):</tspan><tspan x="720.0" dy="13.7">Працюючий процес читає стару версію до кінця;</tspan><tspan x="720.0" dy="13.7">Новий процес відкриває вже новий Inode #599</tspan></text>
<line x1="720.0" y1="370.0" x2="720.0" y2="400.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="530.0" y="400.0" width="380.0" height="65.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="720.0" y="422.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Підсумок: нульовий час простою,</tspan><tspan x="720.0" dy="14.3">неможливість прочитати напів-записаний файл,</tspan><tspan x="720.0" dy="14.3">надійне оновлення працюючих служб.</tspan></text>
</svg>