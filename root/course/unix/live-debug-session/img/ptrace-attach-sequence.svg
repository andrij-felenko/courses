<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="260.0" height="520.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="150.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">GDB (Tracer / Ring 3)</text>
<rect x="300.0" y="20.0" width="280.0" height="520.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ЯДРО LINUX (Ring 0)</text>
<rect x="600.0" y="20.0" width="260.0" height="520.0" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="730.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЦІЛЬОВИЙ ПРОЦЕС (Tracee / Ring 3)</text>
<rect x="35.0" y="75.0" width="230.0" height="60.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Команда оператора:</tspan><tspan x="150.0" dy="14.3">gdb -p 18492</tspan><tspan x="150.0" dy="14.3">Виклик ptrace(PTRACE_ATTACH)</tspan></text>
<line x1="265.0" y1="105.0" x2="315.0" y2="105.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="315.0" y="75.0" width="250.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="440.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">2. Перевірка Yama LSM:</tspan><tspan x="440.0" dy="13.0">/proc/sys/kernel/yama/ptrace_scope</tspan><tspan x="440.0" dy="13.0">Перевірка UID та CAP_SYS_PTRACE</tspan></text>
<line x1="440.0" y1="140.0" x2="440.0" y2="165.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="315.0" y="165.0" width="250.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="440.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">3. Надсилання сигналу SIGSTOP</tspan><tspan x="440.0" dy="13.0">task_struct-&gt;__state = TASK_TRACED</tspan><tspan x="440.0" dy="13.0">Зупинка на межі переривання</tspan></text>
<line x1="565.0" y1="195.0" x2="615.0" y2="195.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="615.0" y="165.0" width="230.0" height="65.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="730.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">4. Процес заморожено</tspan><tspan x="730.0" dy="14.3">Виконання інструкцій зупинено</tspan><tspan x="730.0" dy="14.3">Регістри збережено в pt_regs</tspan></text>
<line x1="730.0" y1="230.0" x2="730.0" y2="260.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="615.0" y="260.0" width="230.0" height="60.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="730.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">5. Ядро сповіщає трейсера</tspan><tspan x="730.0" dy="14.3">Потік переходить у стан 't'</tspan><tspan x="730.0" dy="14.3">Готовність до інспекції</tspan></text>
<line x1="615.0" y1="290.0" x2="565.0" y2="290.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="315.0" y="260.0" width="250.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="440.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">6. Розблокування очікування</tspan><tspan x="440.0" dy="13.0">waitpid(pid, &amp;status, WUNTRACED)</tspan><tspan x="440.0" dy="13.0">Отримано статус WIFSTOPPED</tspan></text>
<line x1="315.0" y1="290.0" x2="265.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="35.0" y="260.0" width="230.0" height="60.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">7. GDB отримує контроль</tspan><tspan x="150.0" dy="14.3">Інспекція /proc/18492/task/</tspan><tspan x="150.0" dy="14.3">Аттач до всіх підпотоків TID</tspan></text>
<line x1="150.0" y1="320.0" x2="150.0" y2="350.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="35.0" y="350.0" width="230.0" height="75.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="369.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">8. Інтерактивна діагностика</tspan><tspan x="150.0" dy="14.3">thread apply all bt full</tspan><tspan x="150.0" dy="14.3">frame N, info locals, watch</tspan><tspan x="150.0" dy="14.3">set variable = new_val</tspan></text>
<line x1="150.0" y1="425.0" x2="150.0" y2="455.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="35.0" y="455.0" width="230.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="150.0" y="477.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">9. Безпечне завершення:</tspan><tspan x="150.0" dy="14.3">Команда 'detach'</tspan><tspan x="150.0" dy="14.3">Відновлення коду та регістрів</tspan></text>
<line x1="265.0" y1="485.0" x2="315.0" y2="485.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="315.0" y="455.0" width="250.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="440.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">10. ptrace(PTRACE_DETACH)</tspan><tspan x="440.0" dy="13.0">Очищення прапорців трасування</tspan><tspan x="440.0" dy="13.0">task_struct-&gt;__state = TASK_RUNNING</tspan></text>
<line x1="565.0" y1="485.0" x2="615.0" y2="485.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="615.0" y="455.0" width="230.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="730.0" y="477.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">11. Процес живий</tspan><tspan x="730.0" dy="14.3">Продовження обробки запитів</tspan><tspan x="730.0" dy="14.3">Нульовий оверхед після виходу</tspan></text>
</svg>