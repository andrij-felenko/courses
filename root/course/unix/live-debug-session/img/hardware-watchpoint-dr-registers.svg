<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="430.0" height="480.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="235.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">АПАРАТНІ РЕГІСТРИ ЗНЕВАДЖЕННЯ (x86-64 DR0–DR7)</text>
<rect x="35.0" y="65.0" width="400.0" height="36.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="235.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">DR0: 0x7fff48901000  (Лінійна 64-бітна адреса змінної A)</tspan></text>
<rect x="35.0" y="107.0" width="400.0" height="36.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="235.0" y="128.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">DR1: 0x7fff48901008  (Лінійна 64-бітна адреса змінної B)</tspan></text>
<rect x="35.0" y="149.0" width="400.0" height="36.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="235.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">DR2: 0x000000000000  (Не використовується / вільний)</tspan></text>
<rect x="35.0" y="191.0" width="400.0" height="36.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="235.0" y="212.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">DR3: 0x000000000000  (Не використовується / вільний)</tspan></text>
<rect x="35.0" y="238.0" width="400.0" height="68.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="235.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">DR6 — Debug Status Register (Стан спрацювання)</tspan><tspan x="235.0" dy="13.0">Біти B0..B3: вказують, яка з адрес DR0-DR3 викликала пастку</tspan><tspan x="235.0" dy="13.0">Біт BS: прапорець покрокового виконання (single-step)</tspan></text>
<rect x="35.0" y="316.0" width="400.0" height="168.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="235.0" y="364.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">DR7 — Debug Control Register (Керування умовами)</tspan><tspan x="235.0" dy="13.0">• L0..L3 / G0..G3: локальний / глобальний дозвіл точок 0..3</tspan><tspan x="235.0" dy="13.0">• R/W0..R/W3: тип умови доступу до пам'яті:</tspan><tspan x="235.0" dy="13.0">    00 = виконання інструкції, 01 = запис даних,</tspan><tspan x="235.0" dy="13.0">    11 = читання або запис (rwatch / awatch)</tspan><tspan x="235.0" dy="13.0">• LEN0..LEN3: розмір комірки спостереження:</tspan><tspan x="235.0" dy="13.0">    00 = 1 байт, 01 = 2 байти, 10 = 8 байтів, 11 = 4 байти</tspan></text>
<rect x="470.0" y="20.0" width="390.0" height="480.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="665.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">МЕХАНІЗМ СПОСТЕРЕЖЕННЯ ЗА ПАМ'ЯТТЮ</text>
<rect x="485.0" y="65.0" width="360.0" height="190.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="665.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Апаратний Watchpoint (Hardware Watchpoint)</tspan><tspan x="665.0" dy="13.0">1. GDB записує адресу в DR0 і маску в DR7</tspan><tspan x="665.0" dy="13.0">2. Програма виконується на повній швидкості CPU</tspan><tspan x="665.0" dy="13.0">3. При спробі запису шина CPU фіксує збіг адреси</tspan><tspan x="665.0" dy="13.0">4. Процесор генерує вектор 1 (#DB Debug Exception)</tspan><tspan x="665.0" dy="13.0">5. Пам'ять залишається чистою (без опкодів 0xCC)</tspan><tspan x="665.0" dy="13.0">6. Максимум 4 активні адреси на ядро CPU</tspan></text>
<line x1="500.0" y1="275.0" x2="830.0" y2="275.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="485.0" y="290.0" width="360.0" height="194.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="665.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Програмний Watchpoint (Software Watchpoint)</tspan><tspan x="665.0" dy="11.7">1. Використовується, якщо змінних &gt; 4 або розмір великий</tspan><tspan x="665.0" dy="11.7">2. GDB вмикає покроковий режим (PTRACE_SINGLESTEP)</tspan><tspan x="665.0" dy="11.7">3. CPU зупиняється ПІСЛЯ КОЖНОЇ асемблерної інструкції</tspan><tspan x="665.0" dy="11.7">4. GDB перемикає контекст і читає пам'ять через ptrace</tspan><tspan x="665.0" dy="11.7">5. Швидкість програми падає у 10 000+ разів</tspan><tspan x="665.0" dy="11.7">6. Заборонено використовувати на живому продакшені</tspan></text>
</svg>