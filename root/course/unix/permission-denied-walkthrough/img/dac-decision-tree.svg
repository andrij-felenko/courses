<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм перевірки прав доступу ядра (DAC)</text>
<rect x="260.0" y="20.0" width="480.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="500.0" y="39.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Запит процесу на доступ до Inode</tspan><tspan x="500.0" dy="16.9">(Виклик generic_permission / inode_permission)</tspan></text>
<line x1="500.0" y1="66.0" x2="500.0" y2="100.0" stroke="#333333" stroke-width="1.8"/>
<rect x="300.0" y="100.0" width="400.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="500.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">1. Чи fsuid процесу == inode-&gt;i_uid?</tspan><tspan x="500.0" dy="15.6">(Перевірка класу власника файлу)</tspan></text>
<line x1="300.0" y1="126.0" x2="170.0" y2="126.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="170.0" y1="126.0" x2="170.0" y2="180.0" stroke="#27ae60" stroke-width="1.6"/>
<rect x="50.0" y="180.0" width="240.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="170.0" y="192.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Клас ВЛАСНИК (Owner)</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">Аналізуються ТІЛЬКИ біти:</tspan><tspan x="170.0" dy="14.3">S_IRUSR, S_IWUSR, S_IXUSR</tspan></text>
<line x1="500.0" y1="152.0" x2="500.0" y2="190.0" stroke="#333333" stroke-width="1.6"/>
<rect x="300.0" y="190.0" width="400.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="500.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">2. Чи fsgid або supplementary GID == inode-&gt;i_gid?</tspan><tspan x="500.0" dy="15.6">(Перевірка класу групи файлу)</tspan></text>
<line x1="700.0" y1="216.0" x2="830.0" y2="216.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="830.0" y1="216.0" x2="830.0" y2="270.0" stroke="#27ae60" stroke-width="1.6"/>
<rect x="710.0" y="270.0" width="240.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="830.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Клас ГРУПА (Group)</tspan><tspan x="830.0" dy="14.3"></tspan><tspan x="830.0" dy="14.3">Аналізуються ТІЛЬКИ біти:</tspan><tspan x="830.0" dy="14.3">S_IRGRP, S_IWGRP, S_IXGRP</tspan></text>
<line x1="500.0" y1="242.0" x2="500.0" y2="280.0" stroke="#333333" stroke-width="1.6"/>
<rect x="350.0" y="280.0" width="300.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="500.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">3. Клас РЕШТА (Others)</tspan><tspan x="500.0" dy="14.3"></tspan><tspan x="500.0" dy="14.3">Аналізуються ТІЛЬКИ біти:</tspan><tspan x="500.0" dy="14.3">S_IROTH, S_IWOTH, S_IXOTH</tspan></text>
<line x1="170.0" y1="240.0" x2="170.0" y2="370.0" stroke="#333333" stroke-width="1.4"/>
<line x1="170.0" y1="370.0" x2="320.0" y2="370.0" stroke="#333333" stroke-width="1.4"/>
<line x1="830.0" y1="330.0" x2="830.0" y2="370.0" stroke="#333333" stroke-width="1.4"/>
<line x1="830.0" y1="370.0" x2="680.0" y2="370.0" stroke="#333333" stroke-width="1.4"/>
<line x1="500.0" y1="330.0" x2="500.0" y2="370.0" stroke="#333333" stroke-width="1.4"/>
<rect x="320.0" y="370.0" width="360.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Чи містить обрана трійка</tspan><tspan x="500.0" dy="15.6">всі запитувані права (r/w/x)?</tspan></text>
<line x1="320.0" y1="395.0" x2="120.0" y2="395.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="120.0" y1="395.0" x2="120.0" y2="460.0" stroke="#27ae60" stroke-width="1.8"/>
<rect x="40.0" y="460.0" width="180.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="130.0" y="470.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">ДОСТУП ДОЗВОЛЕНО</tspan><tspan x="130.0" dy="15.6"></tspan><tspan x="130.0" dy="15.6">(Успішне повернення 0,</tspan><tspan x="130.0" dy="15.6">виклик VFS триває)</tspan></text>
<line x1="500.0" y1="420.0" x2="500.0" y2="460.0" stroke="#c0392b" stroke-width="1.8"/>
<rect x="320.0" y="460.0" width="360.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="500.0" y="483.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Перевірка Capabilities процесу:</tspan><tspan x="500.0" dy="15.6">CAP_DAC_OVERRIDE / CAP_DAC_READ_SEARCH</tspan></text>
<line x1="500.0" y1="514.0" x2="500.0" y2="550.0" stroke="#333333" stroke-width="1.4"/>
<rect x="240.0" y="550.0" width="520.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="500.0" y="574.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Для запиту x: чи є хоч один біт x у будь-якому класі?</tspan><tspan x="500.0" dy="14.3">Для читання/запису: CAP_DAC_OVERRIDE дозволяє безумовно</tspan></text>
<line x1="240.0" y1="578.0" x2="120.0" y2="578.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="120.0" y1="578.0" x2="120.0" y2="520.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="760.0" y1="578.0" x2="860.0" y2="578.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="860.0" y1="578.0" x2="860.0" y2="460.0" stroke="#c0392b" stroke-width="1.8"/>
<rect x="770.0" y="460.0" width="180.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="860.0" y="463.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">ВІДМОВА: EACCES</tspan><tspan x="860.0" dy="15.6"></tspan><tspan x="860.0" dy="15.6">(Permission denied,</tspan><tspan x="860.0" dy="15.6">errno 13)</tspan></text>
<rect x="40.0" y="624.0" width="920.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="500.0" y="642.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">ПРАВИЛО ВЗАЄМНОГО ВИКЛЮЧЕННЯ: класи перевіряються строго по черзі. Якщо процес є власником файлу,</tspan><tspan x="500.0" dy="14.3">його права визначаються ТІЛЬКИ трійкою власника — дозволи групи та others повністю ігноруються.</tspan></text>
</svg>