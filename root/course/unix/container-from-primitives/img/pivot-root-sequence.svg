<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність надійної зміни кореневої файлової системи (pivot_root)</text>
<rect x="40.0" y="75.0" width="320.0" height="125.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Крок 1: Розрив розповсюдження монтувань</tspan></text>
<rect x="380.0" y="75.0" width="840.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="800.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">mount(NULL, &quot;/&quot;, NULL, MS_REC | MS_PRIVATE, NULL)</tspan><tspan x="800.0" dy="16.2"></tspan><tspan x="800.0" dy="16.2">За замовчуванням монтування на системі мають прапорець MS_SHARED. Будь-яка зміна точок усередині простору</tspan><tspan x="800.0" dy="16.2">передавалася б у дерево хоста. Прапорець MS_PRIVATE ізолює піддерево простору від хостової VFS.</tspan></text>
<rect x="40.0" y="218.0" width="320.0" height="125.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Крок 2: Перетворення new_root на точку монтування</tspan></text>
<rect x="380.0" y="218.0" width="840.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="800.0" y="260.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">mount(new_root, new_root, NULL, MS_BIND | MS_REC, NULL)</tspan><tspan x="800.0" dy="16.2"></tspan><tspan x="800.0" dy="16.2">Системний виклик pivot_root вимагає, щоб новий корінь був окремою точкою монтування VFS, а не просто текою.</tspan><tspan x="800.0" dy="16.2">Зворотне монтування прив'язки (bind mount) створює необхідний вузол struct vfsmount у ядрі.</tspan></text>
<rect x="40.0" y="361.0" width="320.0" height="125.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Крок 3: Атомарний обмін старого та нового кореня</tspan></text>
<rect x="380.0" y="361.0" width="840.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="800.0" y="395.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">mkdir(new_root + &quot;/.old_root&quot;)</tspan><tspan x="800.0" dy="16.2">pivot_root(new_root, new_root + &quot;/.old_root&quot;)</tspan><tspan x="800.0" dy="16.2"></tspan><tspan x="800.0" dy="16.2">Ядро переставляє новий корінь на позицію /, а старе хостове дерево файлів розміщує у вказаній підтеці .old_root.</tspan><tspan x="800.0" dy="16.2">На відміну від chroot, старий корінь не зникає з пам'яті, а стає дочірнім піддеревом нового кореня.</tspan></text>
<rect x="40.0" y="504.0" width="320.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Крок 4: Відмонтування старого кореня та зачистка</tspan></text>
<rect x="380.0" y="504.0" width="840.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="800.0" y="530.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">chdir(&quot;/&quot;)</tspan><tspan x="800.0" dy="16.2">umount2(&quot;/.old_root&quot;, MNT_DETACH)</tspan><tspan x="800.0" dy="16.2">rmdir(&quot;/.old_root&quot;)</tspan><tspan x="800.0" dy="16.2"></tspan><tspan x="800.0" dy="16.2">Процес переходить у новий корінь і відмонтовує .old_root з прапорцем MNT_DETACH (ліниве відмонтування).</tspan><tspan x="800.0" dy="16.2">Після цього процес повністю позбавлений доступу до хостової файлової системи: виходу назад не існує.</tspan></text>
</svg>