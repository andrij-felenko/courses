<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трикутник системних ресурсів: CPU, Ядро та Очікування</text>
<rect x="270.0" y="20.0" width="500.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="520.0" y="45.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Трикутник локалізації навантаження: CPU, Ядро та Очікування</tspan></text>
<rect x="40.0" y="90.0" width="290.0" height="240.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="185.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">1. ПРОЦЕСОР: User Space (%usr)</tspan><tspan x="185.0" dy="13.0"></tspan><tspan x="185.0" dy="13.0">Симптоми:</tspan><tspan x="185.0" dy="13.0">• 100% завантаження ядра процесора</tspan><tspan x="185.0" dy="13.0">• Стан процесу R (Running)</tspan><tspan x="185.0" dy="13.0">• Мінімальні добровільні перемикання</tspan><tspan x="185.0" dy="13.0"></tspan><tspan x="185.0" dy="13.0">Типові першопричини:</tspan><tspan x="185.0" dy="13.0">• Неефективні алгоритми O(N²)</tspan><tspan x="185.0" dy="13.0">• Нескінченні або щільні обчислювальні цикли</tspan><tspan x="185.0" dy="13.0">• Парсинг JSON / серіалізація даних</tspan><tspan x="185.0" dy="13.0">• Промахи кешів L1/L2/L3 (низький IPC)</tspan><tspan x="185.0" dy="13.0"></tspan><tspan x="185.0" dy="13.0">Ключові інструменти:</tspan><tspan x="185.0" dy="13.0">perf top -p &lt;PID&gt;, perf record -g</tspan></text>
<rect x="710.0" y="90.0" width="290.0" height="240.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="855.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">2. ЯДРО: System Space (%sys)</tspan><tspan x="855.0" dy="14.3"></tspan><tspan x="855.0" dy="14.3">Симптоми:</tspan><tspan x="855.0" dy="14.3">• Високий %sys (&gt; 30–50% CPU)</tspan><tspan x="855.0" dy="14.3">• Шторм перемикань контексту</tspan><tspan x="855.0" dy="14.3">• Зростання системних викликів</tspan><tspan x="855.0" dy="14.3"></tspan><tspan x="855.0" dy="14.3">Типові першопричини:</tspan><tspan x="855.0" dy="14.3">• Небуферизований I/O (write по 1 байту)</tspan><tspan x="855.0" dy="14.3">• Конфлікти синхронізації (futex lock)</tspan><tspan x="855.0" dy="14.3">• Шторм сторінкових збоїв (minflt)</tspan><tspan x="855.0" dy="14.3">• Часті алокації та ремапінг (mmap/brk)</tspan><tspan x="855.0" dy="14.3"></tspan><tspan x="855.0" dy="14.3">Ключові інструменти:</tspan><tspan x="855.0" dy="14.3">strace -c -p &lt;PID&gt;, pidstat -w -p &lt;PID&gt;</tspan></text>
<rect x="375.0" y="300.0" width="290.0" height="240.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="520.0" y="332.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">3. ОЧІКУВАННЯ: I/O та блокування</tspan><tspan x="520.0" dy="13.0"></tspan><tspan x="520.0" dy="13.0">Симптоми:</tspan><tspan x="520.0" dy="13.0">• %CPU низький або високий %wa (iowait)</tspan><tspan x="520.0" dy="13.0">• Стан процесу D (Uninterruptible Sleep)</tspan><tspan x="520.0" dy="13.0">• Або стан S (Interruptible Sleep)</tspan><tspan x="520.0" dy="13.0"></tspan><tspan x="520.0" dy="13.0">Типові першопричини:</tspan><tspan x="520.0" dy="13.0">• Синхронні дискові операції (fsync / O_SYNC)</tspan><tspan x="520.0" dy="13.0">• Перевантаження черги диска (await &gt;&gt; 5 мс)</tspan><tspan x="520.0" dy="13.0">• Блокуючі читання із порожніх сокетів</tspan><tspan x="520.0" dy="13.0">• Major page faults (підкачка з диска)</tspan><tspan x="520.0" dy="13.0"></tspan><tspan x="520.0" dy="13.0">Ключові інструменти:</tspan><tspan x="520.0" dy="13.0">vmstat 1, iostat -xz 1, pidstat -d</tspan></text>
<line x1="330.0" y1="210.0" x2="710.0" y2="210.0" stroke="#333333" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="240.0" y1="330.0" x2="375.0" y2="380.0" stroke="#333333" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="800.0" y1="330.0" x2="665.0" y2="380.0" stroke="#333333" stroke-width="1.6" stroke-dasharray="4 4"/>
<rect x="394.7" y="166.2" width="250.6" height="47.6" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="186.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Головне діагностичне запитання:</tspan><tspan x="520.0" dy="15.6">ДЕ ЗГОРАЄ ЧАС ВІДГУКУ?</tspan></text>
</svg>