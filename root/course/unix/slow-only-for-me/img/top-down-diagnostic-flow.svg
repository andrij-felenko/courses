<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія експрес-діагностики: від системи до інструкцій</text>
<rect x="280.0" y="20.0" width="500.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="530.0" y="44.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Методологія Top-Down: звуження пошуку від системи до коду</tspan></text>
<rect x="60.0" y="85.0" width="940.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">РІВЕНЬ 1: Загальний стан операційної системи (System-Wide Overview)</tspan><tspan x="530.0" dy="14.3">Команди: vmstat 1  |  iostat -xz 1  |  cat /proc/loadavg</tspan><tspan x="530.0" dy="14.3">Що перевіряємо: співвідношення us/sy/wa/id, довжину черги готових задач (r), кількість заблокованих (b), насичення дисків (%util, await).</tspan></text>
<line x1="530.0" y1="170.0" x2="530.0" y2="195.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="195.0" width="940.0" height="85.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">РІВЕНЬ 2: Локалізація навантаження процесу (Process-Level Breakdown)</tspan><tspan x="530.0" dy="14.3">Команди: pidstat -u -d -w -r 1 -p &lt;PID&gt;</tspan><tspan x="530.0" dy="14.3">Що перевіряємо: %usr vs %system, дисковий I/O (kB_rd/s, kB_wr/s), сторінкові збої (minflt, majflt), перемикання контексту (cswch/s, nvcswch/s).</tspan></text>
<line x1="530.0" y1="280.0" x2="530.0" y2="305.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="305.0" width="940.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="337.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">РІВЕНЬ 3: Інспекція системних викликів (Syscall Boundary Inspection)</tspan><tspan x="530.0" dy="14.3">Команди: strace -c -p &lt;PID&gt;  |  strace -T -e trace=write,futex,read -p &lt;PID&gt;</tspan><tspan x="530.0" dy="14.3">Що перевіряємо: сумарний час у системних викликах, шторми 1-байтних операцій, зависання на futex_wait, epoll_wait, nanosleep чи fsync.</tspan></text>
<line x1="530.0" y1="390.0" x2="530.0" y2="415.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="415.0" width="940.0" height="95.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="452.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">РІВЕНЬ 4: Профілювання гарячих функцій коду (CPU Sampling &amp; Hotspots)</tspan><tspan x="530.0" dy="14.3">Команди: perf top -p &lt;PID&gt;  |  perf record -F 99 -g -p &lt;PID&gt; -- sleep 10  |  perf report</tspan><tspan x="530.0" dy="14.3">Що перевіряємо: точні адреси та імена функцій у коді застосунку або бібліотеках, які споживають більшість процесорних тактів.</tspan></text>
</svg>