<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння небуферизованого шторму системних викликів та буферизованого виведення</text>
<rect x="260.0" y="20.0" width="520.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="520.0" y="44.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Шторм системних викликів проти буферизованого виведення</tspan></text>
<rect x="40.0" y="80.0" width="460.0" height="420.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="270.0" y="165.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">НЕБУФЕРИЗОВАНИЙ I/O: 1 МБ по 1 байту</tspan><tspan x="270.0" dy="14.3">(1 000 000 системних викликів write)</tspan><tspan x="270.0" dy="14.3"></tspan><tspan x="270.0" dy="14.3">Простір користувача (Ring 3):</tspan><tspan x="270.0" dy="14.3">write(fd, &amp;byte, 1)  × 1 000 000 разів</tspan><tspan x="270.0" dy="14.3"></tspan><tspan x="270.0" dy="14.3">Ціна кожного виклику:</tspan><tspan x="270.0" dy="14.3">• Інструкція `syscall` (перемикання CPU в Ring 0)</tspan><tspan x="270.0" dy="14.3">• Збереження регістрів у стек ядра (pt_regs)</tspan><tspan x="270.0" dy="14.3">• Перемикання таблиць сторінок MMU (KPTI)</tspan><tspan x="270.0" dy="14.3">• Прохід через VFS, перевірка прав і дескриптора</tspan><tspan x="270.0" dy="14.3">• Блокування inode / файлового блоку</tspan><tspan x="270.0" dy="14.3">• Повернення в Ring 3 (`sysret`)</tspan><tspan x="270.0" dy="14.3"></tspan><tspan x="270.0" dy="14.3">НАСЛІДОК ДЛЯ СИСТЕМИ:</tspan><tspan x="270.0" dy="14.3">• %sys підскакує до 85–95%</tspan><tspan x="270.0" dy="14.3">• Процесор витрачає такти на службові переходи</tspan><tspan x="270.0" dy="14.3">• Час виконання операції: 450–700 мс</tspan><tspan x="270.0" dy="14.3">• Продуктивність падає у 50–100 разів!</tspan></text>
<rect x="540.0" y="80.0" width="460.0" height="420.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="770.0" y="172.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">БУФЕРИЗОВАНИЙ I/O: 1 МБ блоками по 64 КіБ</tspan><tspan x="770.0" dy="14.3">(лише 16 системних викликів write)</tspan><tspan x="770.0" dy="14.3"></tspan><tspan x="770.0" dy="14.3">Простір користувача (Ring 3):</tspan><tspan x="770.0" dy="14.3">Буфер у пам'яті накопичує дані швидко і дешево.</tspan><tspan x="770.0" dy="14.3">write(fd, buf, 65536)  × 16 разів</tspan><tspan x="770.0" dy="14.3"></tspan><tspan x="770.0" dy="14.3">Ефективність виконання:</tspan><tspan x="770.0" dy="14.3">• Лише 16 переходів між Ring 3 та Ring 0</tspan><tspan x="770.0" dy="14.3">• Нульові накладні витрати на перемикання контексту</tspan><tspan x="770.0" dy="14.3">• Ядро копіює дані суцільним вектором у Page Cache</tspan><tspan x="770.0" dy="14.3">• Конвеєр процесора працює без зупинок</tspan><tspan x="770.0" dy="14.3"></tspan><tspan x="770.0" dy="14.3">НАСЛІДОК ДЛЯ СИСТЕМИ:</tspan><tspan x="770.0" dy="14.3">• %sys становить менше 1%</tspan><tspan x="770.0" dy="14.3">• Процесор вільний для корисної роботи</tspan><tspan x="770.0" dy="14.3">• Час виконання операції: 2–4 мс</tspan><tspan x="770.0" dy="14.3">• Максимальна пропускна здатність шини пам'яті!</tspan></text>
</svg>