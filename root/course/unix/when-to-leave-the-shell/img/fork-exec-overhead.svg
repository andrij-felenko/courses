<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="460.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="260.0" y="44.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Bash: виконання утиліти в циклі (наприклад, cut або bc)</tspan></text>
<rect x="45.0" y="80.0" width="430.0" height="55.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/><text x="260.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">1. Батьківський процес Shell (bash pid=1001)</tspan><tspan x="260.0" dy="14.3">Ітерація циклу for: підготовка команди $var=$(cut -d: -f1)</tspan></text>
<line x1="260.0" y1="135.0" x2="260.0" y2="160.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="160.0" width="430.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="260.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">2. Системний виклик fork(2) / clone(2)</tspan><tspan x="260.0" dy="14.3">• Копіювання таблиць сторінок пам'яті (Page Tables, CoW)</tspan><tspan x="260.0" dy="14.3">• Створення нового дескриптора процесу (task_struct) у ядрі</tspan></text>
<line x1="260.0" y1="225.0" x2="260.0" y2="250.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="250.0" width="430.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="260.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">3. Системний виклик execve(2)</tspan><tspan x="260.0" dy="14.3">• Очищення адресного простору дочірнього процесу</tspan><tspan x="260.0" dy="14.3">• Зчитування ELF-заголовка та виклик динамічного лінкера ld.so</tspan><tspan x="260.0" dy="14.3">• Відображення бібліотек (libc.so) та виконання секцій .init</tspan></text>
<line x1="260.0" y1="330.0" x2="260.0" y2="355.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="355.0" width="430.0" height="65.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/><text x="260.0" y="377.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">4. Виконання роботи та завершення exit(0)</tspan><tspan x="260.0" dy="14.3">• Робота: виділення 1 рядка за 2 мікросекунди</tspan><tspan x="260.0" dy="14.3">• Знищення простору пам'яті, генерація сигналу SIGCHLD</tspan></text>
<line x1="260.0" y1="420.0" x2="260.0" y2="445.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="445.0" width="430.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="260.0" y="469.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">5. Батьківський процес: waitpid(2) + читання каналу</tspan><tspan x="260.0" dy="14.3">⚠️ Ціна на 10 000 ітерацій: ~15-30 секунд CPU-часу ядра</tspan></text>
<rect x="550.0" y="20.0" width="460.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="780.0" y="44.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Нативна мова: виконання всередині єдиного процесу</tspan></text>
<rect x="565.0" y="80.0" width="430.0" height="70.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/><text x="780.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">1. Єдиний процес застосунку (pid=2001)</tspan><tspan x="780.0" dy="14.3">Вся пам'ять, структури даних та runtime завантажені один раз</tspan><tspan x="780.0" dy="14.3">при запуску програми</tspan></text>
<line x1="780.0" y1="150.0" x2="780.0" y2="190.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="565.0" y="190.0" width="430.0" height="110.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="780.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">2. Ітерація нативного циклу (10 000 проходів)</tspan><tspan x="780.0" dy="14.3">• Розділення рядка в пам'яті (string_view / slice / split)</tspan><tspan x="780.0" dy="14.3">• Нуль системних викликів ядра (нуль context switch)</tspan><tspan x="780.0" dy="14.3">• Нуль дублювань таблиць сторінок</tspan><tspan x="780.0" dy="14.3">• Дані лишаються в кеші процесора L1 / L2</tspan></text>
<line x1="780.0" y1="300.0" x2="780.0" y2="340.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="565.0" y="340.0" width="430.0" height="70.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/><text x="780.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">3. Завершення обчислень</tspan><tspan x="780.0" dy="14.3">Результати накопичено в типізованому векторі/структурі</tspan><tspan x="780.0" dy="14.3">без втрати типів і без серіалізації в текст</tspan></text>
<line x1="780.0" y1="410.0" x2="780.0" y2="445.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="565.0" y="445.0" width="430.0" height="55.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="780.0" y="469.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Підсумок продуктивності:</tspan><tspan x="780.0" dy="11.7">⚡ Ціна на 10 000 ітерацій: менше 1-5 мілісекунд (у 1000+ разів швидше)</tspan></text>
</svg>