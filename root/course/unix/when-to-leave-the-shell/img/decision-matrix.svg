<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="280.0" y="15.0" width="500.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="530.0" y="38.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Дерево інженерних рішень: Shell чи мова загального призначення?</tspan></text>
<rect x="30.0" y="70.0" width="480.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="270.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">1. Характер коду та обсяг:</tspan><tspan x="270.0" dy="14.3">Чи скрипт перевищує 150 рядків або містить складні розгалуження?</tspan></text>
<rect x="550.0" y="70.0" width="480.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="790.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Так → Перехід на Python / Go</tspan><tspan x="790.0" dy="14.3">Ні (10-50 рядків лінійних команд) → Залишаємось у Shell</tspan></text>
<rect x="30.0" y="150.0" width="480.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="270.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">2. Дані: чи є вкладений JSON/YAML, бінарні байти,</tspan><tspan x="270.0" dy="14.3">масиви об'єктів або хеш-таблиці зі структурами?</tspan></text>
<rect x="550.0" y="150.0" width="480.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="790.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Так → Python (json, pydantic) або Go (struct, unmarshal)</tspan><tspan x="790.0" dy="14.3">Ні (суто текстові рядки та шляхи файлів) → Shell прийнятний</tspan></text>
<rect x="30.0" y="230.0" width="480.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="270.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">3. Математика: чи потрібні дробові числа (float),</tspan><tspan x="270.0" dy="14.3">статистичні розрахунки чи цикли на 10 000+ операцій?</tspan></text>
<rect x="550.0" y="230.0" width="480.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="790.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Так → Мова програмування (нативна арифметика CPU)</tspan><tspan x="790.0" dy="14.3">Ні (лише цілочисельні лічильники в межах $((-))) → Shell</tspan></text>
<rect x="30.0" y="310.0" width="480.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="270.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">4. Паралелізм і надійність: чи потрібні пули воркерів,</tspan><tspan x="270.0" dy="14.3">синхронізація м'ютексами, структуровані юніт-тести?</tspan></text>
<rect x="550.0" y="310.0" width="480.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="790.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Так → Go (goroutines), Python (asyncio/threads), Rust</tspan><tspan x="790.0" dy="14.3">Ні (простий конвеєр cmd1 | cmd2) → Shell ідеальний</tspan></text>
<rect x="30.0" y="390.0" width="480.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="270.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">5. Дистрибуція утиліти:</tspan><tspan x="270.0" dy="14.3">Потрібен автономний статичний бінарник без залежностей?</tspan></text>
<rect x="550.0" y="390.0" width="480.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="790.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Так → Go або Rust (єдиний виконуваний файл без runtime)</tspan><tspan x="790.0" dy="14.3">Ні (серверне середовище з наявним Python) → Python-скрипт</tspan></text>
<rect x="30.0" y="470.0" width="1000.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="499.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Золоте правило системної інженерії:</tspan><tspan x="530.0" dy="14.3">Shell призначений для ОРКЕСТРАЦІЇ готових утиліт у лінійні конвеєри.</tspan><tspan x="530.0" dy="14.3">Щойно у сценарії з'являється власна складна бізнес-логіка, парсинг або маніпуляція станом — це програма мовою загального призначення.</tspan></text>
</svg>