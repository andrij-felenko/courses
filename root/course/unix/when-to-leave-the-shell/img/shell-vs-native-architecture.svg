<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="450.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="265.0" y="44.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Модель оболонки: ізольовані процеси та байтовий потік</tspan></text>
<rect x="55.0" y="75.0" width="420.0" height="80.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="265.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Процес 1: grep (pid=301)</tspan><tspan x="265.0" dy="14.3">• Власний адресний простір, таблиці сторінок</tspan><tspan x="265.0" dy="14.3">• Текстовий вихід stdout через pipe(2)</tspan><tspan x="265.0" dy="14.3">⚠️ Немає доступу до внутрішнього стану інших процесів</tspan></text>
<line x1="265.0" y1="155.0" x2="265.0" y2="185.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="265.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Канал ядра: нетипізовані байти без метаданих</text>
<rect x="55.0" y="185.0" width="420.0" height="80.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="265.0" y="207.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Процес 2: awk / jq (pid=302)</tspan><tspan x="265.0" dy="14.3">• Власний парсер тексту з нуля</tspan><tspan x="265.0" dy="14.3">• Втрата типів: перетворення чисел у текст і знову в числа</tspan><tspan x="265.0" dy="14.3">• Буферизація stdio (4 КБ / 64 КБ)</tspan></text>
<line x1="265.0" y1="265.0" x2="265.0" y2="295.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="265.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Канал ядра: наступний текстовий потік</text>
<rect x="55.0" y="295.0" width="420.0" height="80.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="265.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Процес 3: sort / uniq (pid=303)</tspan><tspan x="265.0" dy="14.3">• Повне вичитування всього потоку до EOF перед сортуванням</tspan><tspan x="265.0" dy="14.3">• Блокування конвеєра при великих обсягах</tspan></text>
<rect x="55.0" y="395.0" width="420.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="265.0" y="424.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Характеристики конвеєра оболонки:</tspan><tspan x="265.0" dy="14.3">✓ Простота компонування готових бінарників</tspan><tspan x="265.0" dy="14.3">✗ Складність обробки помилок у середині ланцюга</tspan><tspan x="265.0" dy="14.3">✗ Нульова типізація та накладні витрати серіалізації</tspan></text>
<rect x="550.0" y="20.0" width="450.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="775.0" y="44.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Модель мови: єдиний адресний простір і типізована пам'ять</tspan></text>
<rect x="565.0" y="75.0" width="420.0" height="300.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/><text x="775.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Єдиний адресний простір програми (pid=4001)</tspan><tspan x="775.0" dy="13.0"></tspan><tspan x="775.0" dy="13.0">┌─────────────────────────────────────────────────────────┐</tspan><tspan x="775.0" dy="13.0">│ Стек викликів та потоки (Threads / Goroutines)           │</tspan><tspan x="775.0" dy="13.0">│ • Пул воркерів без створення процесів ядра              │</tspan><tspan x="775.0" dy="13.0">│ • Локальні змінні з суворою типізацією                  │</tspan><tspan x="775.0" dy="13.0">├─────────────────────────────────────────────────────────┤</tspan><tspan x="775.0" dy="13.0">│ Купа (Heap / Managed Memory)                            │</tspan><tspan x="775.0" dy="13.0">│ • Типізовані структури: struct Metrics { float cpu; }   │</tspan><tspan x="775.0" dy="13.0">│ • Хеш-таблиці, бінарні буфери, дерева об'єктів          │</tspan><tspan x="775.0" dy="13.0">│ • Пряме передавання вказівників без копіювання байтів   │</tspan><tspan x="775.0" dy="13.0">├─────────────────────────────────────────────────────────┤</tspan><tspan x="775.0" dy="13.0">│ Вбудовані механізми контролю                            │</tspan><tspan x="775.0" dy="13.0">│ • Обробка винятків (try/catch, Result&lt;T, E&gt;)           │</tspan><tspan x="775.0" dy="13.0">│ • М'ютекси, атоміки, канали синхронізації               │</tspan><tspan x="775.0" dy="13.0">└─────────────────────────────────────────────────────────┘</tspan></text>
<rect x="565.0" y="395.0" width="420.0" height="95.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="775.0" y="424.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Характеристики монолітної програми:</tspan><tspan x="775.0" dy="14.3">✓ Миттєвий доступ до пам'яті без IPC і серіалізації</tspan><tspan x="775.0" dy="14.3">✓ Сувора типізація даних на етапі компіляції/виконання</tspan><tspan x="775.0" dy="14.3">✓ Повний детермінізм при обробці виняткових ситуацій</tspan></text>
</svg>